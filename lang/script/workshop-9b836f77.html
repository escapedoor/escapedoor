  .nm{padding:8px 14px 6px;background:#fff6b8;color:#24304a;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;letter-spacing:.14em;border-radius:2px;box-shadow:0 3px 0 #b8a85a;cursor:grab;touch-action:none}

  .doc.label .cart{display:flex;gap:18px;align-items:center;margin:6px 0 10px}

<script>
(function () {
  var $ = ER.$, busy = true, tl, nextFile, rb = null;

  (function () {
    var art = SC.stoneArt({ S: 64, x: 0, y: 0 }), b = art.box, sc = 200 / b[2];
    $('#pinrub').innerHTML = '<g transform="translate(' + (590 - b[0] * sc).toFixed(1) + ' ' + (154 - b[1] * sc).toFixed(1) + ') scale(' + sc.toFixed(3) + ')">' + art.svg + '</g>';
  })();
  $('#delgado').innerHTML = SC.who('delgado', { smile: -2 });
  $('#szabo').innerHTML = SC.who('szabo', { smile: 2, extra: '<rect x="18" y="-170" width="44" height="58" fill="#e9eef2" stroke="#9aa8b6" stroke-width="2" transform="rotate(-10 40 -140)"/>' });

  ER.init({
    theme: 'lang', story: 'script', storyTitle: 'Nobody Here Can Read This', id: 'workshop', no: 'III', title: 'The Workshop',
    go: 'Go in',
    intro: [
      'In the Korean Room you put every shape from the letter on the magnet board. The shapes came apart into families, one for each place in the mouth, with an extra stroke for a stronger sound, and the vowels were built from heaven, earth and a person, as King Sejong built his, though drawn the girls&rsquo; own way. Sixteen letters, not hundreds of syllables: a featural script, like Hangul, with shapes of its own.',
      'Somebody made it. Kezia says Miss Lindahl and her best friend did, when they were eleven. And the letter was lying on the bench of the museum&rsquo;s conservator, Agata Marchetti, who went home early today.',
      'Mr Moreau unlocks a plain door marked STAFF ONLY. It is five o&rsquo;clock.'
    ],
    exit: {"next":"print","w":{"3b6ce306":"2666be59"}}, tags: {},
    hints: hints, onBegin: begin
  });
  tl = SC.tell('w-told'); nextFile = ER.flag('w-file') || null;

  function isBusy() { return busy; }
  function ready() { return tl.has('szabo') && tl.has('book') && tl.has('note') && tl.has('poster'); }
  function paint() {
    $('#szabo').classList.toggle('ready', !tl.has('szabo'));
    $('#clip').classList.toggle('ready', !!(tl.has('szabo') && !tl.has('book')));
    $('#pin').classList.toggle('ready', !!(tl.has('szabo') && !tl.has('note')) || !!(ready() && !tl.has('named')));
    $('#poster').classList.toggle('ready', !!(tl.has('note') && !tl.has('poster')));
    ER.pips((tl.has('szabo') ? 1 : 0) + (tl.has('book') ? 1 : 0) + (tl.has('note') ? 1 : 0) + (tl.has('poster') ? 1 : 0) + (tl.has('named') ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The print-room light is on, and the staff stairs go up past it. The button at the bottom of the screen takes you there.']];
    if (rb && rb.isOpen()) return ['names', [
      'The stone has two names on it. Count the blocks in each: one block for each syllable. Then look at the first block of each name: what does the ring at the start of a block mean?',
      'The first name has two blocks and starts with a vowel sound. Only one name from the book does that. The second has three blocks, and all three have the same vowel mark, so its name has the same vowel three times. Two names fit that.',
      'Try ALANA, and look at the shapes under the letters: the L in ALANA and the L in ELIN would be two different shapes. A script made by one person keeps one shape for one letter. So it is not Alana.'
    ]];
    if (!tl.has('szabo')) return ['szabo', ['Dr Szabo knows the conservator. Talk to him, on the right.']];
    if (!tl.has('book')) return ['book', ['Who was in the building today, and when did they leave? The sign-out book is on the clipboard by the door, on the left.']];
    if (!tl.has('note')) return ['note', ['Agata&rsquo;s pinboard, above the bench: there is a rubbing of the stone on it, and a note.']];
    if (!tl.has('poster')) return ['poster', ['The poster on the wall beside the pinboard says how scripts are cracked. Read it.']];
    return ['rub', ['Now read the names on the stone. Click the rubbing on the pinboard.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Agata Marchetti&rsquo;s workshop. ELIN and AGATA, inside a heart.'); return; }
    if (tl.has('in')) { busy = false; ER.say('The conservator&rsquo;s workshop.'); return; }
    tl.set('in');
    ER.narrate([
      'The strip lights blink twice and come on, white and humming. After the dim galleries the workshop is as bright as a hospital.',
      'A long bench, tools on a pegboard, brushes in jars, a big lamp on an arm. In the middle of the bench is a grey cushion with a dent in it, where a heavy stone sat until ten past four.',
      'Above the bench is a cork pinboard, crowded with papers. By the door hangs a clipboard on a string.',
      'Mr Moreau goes back to his rounds. &ldquo;Second floor, then the roof,&rdquo; he says, and the door swings shut behind him.'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#szabo').addEventListener('click', function () {
    if (busy) return;
    if (tl.has('named')) { ER.say('Dr Szabo is sitting on a stool with his chin in his hands, thinking about tomorrow&rsquo;s photographer.'); return; }
    ER.talk({
      who: 'Dr Ferenc Szabo', role: 'Curator · Agata&rsquo;s boss', face: SC.face('szabo'),
      lines: [
        { a: '&ldquo;Agata Marchetti. Our conservator since March. She cleans things, mends things, tells me off for touching things. The best I have ever had.&rdquo;' },
        { q: 'Why did she go home early?', a: '&ldquo;This morning she came to the office to look at the day&rsquo;s bookings. She saw the name of your school, and the teacher&rsquo;s name, and she went quite white. Then she said she had a dentist&rsquo;s appointment, and could she go at three.&rdquo;' },
        { q: 'Did she know Miss Lindahl?', a: '&ldquo;She did not say. She is not a person who says.&rdquo; He frowns. &ldquo;She was a child here in Elmsworth, though. And the stone came from Quarry Lane, and she unpacked it herself on Monday, and she did not say anything about that either.&rdquo;' },
        { note: 'He looks at the dent in the cushion.', a: '&ldquo;Everybody who works here signs in and out in the book by the door. Even me, when I remember.&rdquo;' }
      ],
      clue: { id: 'szabo3', title: 'Dr Szabo: Agata went quite white', kind: 'What he said' },
      done: function (seen) {
        if (!seen) return;
        ER.addWord('conservator', 'a person whose job is to clean, mend and look after old objects in a museum');
        if (tl.set('szabo')) { paint(); ER.say('Agata saw the teacher&rsquo;s name and went home. Look at the sign-out book by the door.'); }
      }
    });
  });
  $('#delgado').addEventListener('click', function () {
    if (busy) return;
    if (!tl.has('book') || !tl.has('note')) {
      ER.talk({ who: 'Mr Gil Delgado', role: 'PE teacher · looking at the tools', face: SC.face('delgado'),
        lines: [{ note: 'He is reading the labels on the jars, one after another, without taking any of them in.', a: '&ldquo;Acetone. Deionised water. Microcrystalline wax.&rdquo; He puts the jar down. &ldquo;See who was here today. The book by the door.&rdquo;' }] });
      return;
    }
    ER.talk({
      who: 'Mr Gil Delgado', role: 'PE teacher · not happy', face: SC.face('delgado', 'cross'),
      lines: [
        { a: '&ldquo;So. This Agata saw Elin&rsquo;s name this morning and ran off home with a story about a dentist. She grew up in the same town. She has keys to every door in the place. And she and Elin cut their names into a stone when they were kids, by the look of it.&rdquo;' },
        { q: 'You think she has something to do with it?', a: '&ldquo;I think people don&rsquo;t run away from a friend. They run away from somebody they&rsquo;ve fallen out with. I&rsquo;m not saying she locked our teacher in a cupboard. I&rsquo;m saying I&rsquo;d like to know when she left and when Elin went missing, to the minute.&rdquo;' },
        { note: 'He rubs his face.', a: '&ldquo;Sorry. Read the names on that stone. Then we&rsquo;ll know who we&rsquo;re talking about.&rdquo;' }
      ],
      clue: { id: 'delgado3', title: 'Mr Delgado: people run away from somebody they&rsquo;ve fallen out with', kind: 'What he said' },
      done: function (seen) { if (seen) { tl.set('delgado'); ER.addWord('fall out', 'to stop being friends after an argument'); } }
    });
  });
  SC.thing('#pegs', null, 'Scalpels, brushes, tweezers, a magnifying glass, a soft hammer. Everything has a painted outline, so you can see at once what is missing. Nothing is.', isBusy);
  SC.thing('#win', null, 'Rain on the glass, and two orange lights in the car park: the coach.', isBusy);
  SC.thing('#kettle', null, 'A kettle, quite cold, and a green mug with an A on it, still half full. Somebody made tea this afternoon and left without drinking it.', isBusy);
  SC.thing('#cushion', null, 'A grey cushion with a deep round dent in it. The label beside it: ACC. 2026.114, garden stone, Quarry Lane. The stone is in the Hall of Signs now, on Dr Szabo&rsquo;s trolley.', isBusy);

  /* ---------- the book, the pinboard, the poster ---------- */
  var BOOK = '<h4>Staff in and out &middot; Friday</h4><table><tr><th>Name</th><th>In</th><th>Out</th><th>Note</th></tr>' +
    '<tr><td>Barry Moreau</td><td>8.00</td><td>&mdash;</td><td>on duty till ten</td></tr>' +
    '<tr><td>Ferenc Szabo</td><td>8.45</td><td>&mdash;</td><td></td></tr>' +
    '<tr><td>Agata Marchetti</td><td>8.50</td><td>14.50</td><td>dentist (really)</td></tr>' +
    '<tr><td>Alana Ivanova, shop</td><td>9.30</td><td>16.35</td><td>till counted, money in the safe</td></tr></table>' +
    '<h4 style="margin-top:12px">Visitors</h4><table><tr><td>Kingsmead School, Year 8: Miss E. Lindahl, Mr G. Delgado and 28 pupils</td><td>in 10.30</td></tr></table>';
  $('#clip').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BOOK, cls: 'ledger', clue: { id: 'book', title: 'The staff sign-out book', kind: 'In the workshop' }, done: function () {
      if (tl.set('book')) { paint(); ER.say('Agata Marchetti signed out at ten to three. Who else was here? Now Agata&rsquo;s pinboard.'); }
    } });
  });
  var NOTE = '<h4>On Agata&rsquo;s pinboard, under the rubbing</h4><p>Garden stone from 14 Quarry Lane. That was OUR house!!</p><p>Came in on Monday. NOT ancient. I know exactly who carved it, and when.</p><p>Must tell Ferenc before he rings the papers.</p><p>&mdash; A.</p>';
  function rubbingDoc() {
    var art = SC.stoneArt({ S: 56, x: 0, y: 0 }), b = art.box, m = 30;
    return '<h4>A rubbing of the stone, pinned up by Agata</h4><div class="rb-paper"><svg viewBox="' + (b[0] - m) + ' ' + (b[1] - m) + ' ' + (b[2] + 2 * m) + ' ' + (b[3] + 2 * m) + '" color="#e8e8e2">' + art.svg + '</svg></div>' +
      '<p class="small">A rubbing: paper laid on the carving and rubbed with black wax. The stone stays dark, and the cuts come out white.</p>';
  }
  $('#pin').addEventListener('click', function () {
    if (busy) return;
    if (!tl.has('note')) {
      ER.read({ html: rubbingDoc() + '<div class="doc note" style="margin-top:12px;transform:none;width:auto;box-shadow:none">' + NOTE + '</div><p class="small">Beside them, a faded photograph: two girls of about eleven in a garden, one dark, one fair, one holding a hammer and the other a nail, both grinning.</p>', cls: 'label',
        clue: { id: 'note', title: 'Agata&rsquo;s note and the rubbing', kind: 'In the workshop' }, done: function () {
          SC.terms(['rubbing']);
          if (tl.set('note')) { paint(); ER.say('I know exactly who carved it, and when. Two girls, a hammer and a nail. Read the poster beside the pinboard.'); }
        } });
      return;
    }
    if (tl.has('named')) { ER.say('The rubbing, with two names under it now, in your writing: ELIN and AGATA.'); return; }
    if (!ready()) { ER.say(!tl.has('book') ? 'To read the names, you need names to try. The sign-out book is by the door.' : 'Read the poster beside the pinboard first: it says how names are read.'); return; }
    if (!rb) rb = makeRubbing();
    rb.open();
  });
  var POSTER = '<h4>On the wall of the workshop</h4><h3>Names are the way in</h3>' +
    '<p>A name sounds much the same in any language. So if you can find a name you already know in a script you cannot read, you get the sounds of its signs for nothing.</p>' +
    '<p>In Egyptian writing, a royal name is drawn inside an oval ring called a <b>cartouche</b>. In 1822 Jean-Fran&ccedil;ois Champollion compared two of them, the names Ptolemy and Cleopatra. They share several sounds, p, t, o and l, and the same sounds had the same signs in both rings. Those were his first letters, and the rest followed.</p>' +
    '<p>In 1952 Michael Ventris tested his reading of Linear B, a script from ancient Crete, on the names of Cretan towns: <i>ko-no-so</i>, Knossos; <i>a-mi-ni-so</i>, Amnisos; <i>tu-ri-so</i>, Tulissos. They came out right.</p>' +
    '<p>A rule of thumb for a script made by one person: one letter, one shape. If a reading makes one sign stand for two letters, or draws one letter two ways, the reading is wrong.</p>';
  $('#poster').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: POSTER, cls: 'label', clue: { id: 'poster', title: 'Poster: names are the way in', kind: 'In the workshop' }, done: function () {
      SC.terms(['decipher', 'cartouche', 'inscription']);
      if (tl.set('poster')) { paint(); ER.say(ready() ? 'One letter, one shape. Now try names on the rubbing.' : 'Names are the way in. You still need names to try.'); }
    } });
  });

  /* ---------- the names on the rubbing ---------- */
  var SYL = { ELIN: ['E', 'LIN'], AGATA: ['A', 'GA', 'TA'], ALANA: ['A', 'LA', 'NA'], FERENC: ['FE', 'RENC'], BARRY: ['BAR', 'RY'], GIL: ['GIL'] };
  var TILES = ['FERENC', 'ALANA', 'ELIN', 'BARRY', 'AGATA', 'GIL'];
  var VOW = /[AEIOUY]/;
  function blocksOf(slot) { return slot === 'a' ? SC.STONE.a : SC.STONE.b; }
  /* what a name in a slot would make each shape mean; problems if it cannot fit */
  function fit(name, slot) {
    var bl = blocksOf(slot), sy = SYL[name], out = { pairs: [], prob: null };
    if (sy.length !== bl.length) { out.prob = name + ' has ' + sy.length + (sy.length === 1 ? ' syllable' : ' syllables') + ', but this name on the stone has ' + bl.length + ' blocks. One block, one syllable.'; return out; }
    bl.forEach(function (spec, i) {
      var parts = SC.partsOf(spec), letters = sy[i].split(''), row = [];
      if (parts[0] === 'ring') {
        if (!VOW.test(letters[0]) && !out.prob) out.prob = 'The first block of this name begins with the ring, which is silent at the start of a block, the way ' + SC.hg('ㅇ') + ' is. So the name begins with a vowel sound, and ' + name + ' does not.';
        row.push(['ring', '·']); parts = parts.slice(1);
      }
      if (parts.length !== letters.length && !out.prob) out.prob = 'The block for ' + sy[i] + ' would need ' + letters.length + ' letters, but it has ' + parts.length + ' in it.';
      parts.forEach(function (p, j) { row.push([p, letters[j] || '?']); });
      out.pairs.push(row);
    });
    return out;
  }
  function makeRubbing() {
    var box = ER.el('div', 'pz rb'), put = ER.flag('w-names') || {}, done = !!tl.has('named');
    var art = SC.stoneArt({ S: 56, x: 0, y: 0 }), b = art.box, m = 20;
    box.innerHTML = '<div class="rb-in"><h5 style="color:#1f5a56">Agata&rsquo;s rubbing. Put a name under each group of signs.</h5><div class="rb-paper"><svg viewBox="' + (b[0] - m) + ' ' + (b[1] - m) + ' ' + (b[2] + 2 * m) + ' ' + (b[3] + 2 * m) + '" color="#e8e8e2">' + art.svg + '</svg></div>' +
      '<div class="rb-row"><div><div class="nslot" data-s="a" data-l="the first name: two blocks"></div><div class="read" data-r="a"></div></div><div><div class="nslot" data-s="b" data-l="the second name: three blocks"></div><div class="read" data-r="b"></div></div></div></div>' +
      '<div class="names"></div><div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="rb-go">Write the names under the rubbing</button></div>';
    var home = box.querySelector('.names'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    TILES.forEach(function (t) {
      var n = ER.el('div', 'nm dnd-item', t); n.setAttribute('data-n', t);
      var s = put.a === t ? 'a' : put.b === t ? 'b' : null;
      (s ? box.querySelector('.nslot[data-s="' + s + '"]') : home).appendChild(n);
    });
    function current() {
      var o = {};
      ['a', 'b'].forEach(function (s) { var n = box.querySelector('.nslot[data-s="' + s + '"] .nm'); o[s] = n ? n.getAttribute('data-n') : null; });
      return o;
    }
    function readout() {
      var c = current(), fits = {}, shape = {}, letter = {}, clash = {};
      ['a', 'b'].forEach(function (s) { if (c[s]) fits[s] = fit(c[s], s); });
      ['a', 'b'].forEach(function (s) {
        if (!fits[s] || fits[s].prob) return;
        fits[s].pairs.forEach(function (row) { row.forEach(function (pr) {
          if (pr[0] === 'ring') return;
          if (shape[pr[0]] && shape[pr[0]] !== pr[1]) { clash[pr[0]] = 1; }
          if (letter[pr[1]] && letter[pr[1]] !== pr[0]) { clash[pr[0]] = 1; clash[letter[pr[1]]] = 1; }
          shape[pr[0]] = shape[pr[0]] || pr[1]; letter[pr[1]] = letter[pr[1]] || pr[0];
        }); });
      });
      ['a', 'b'].forEach(function (s) {
        var r = box.querySelector('.read[data-r="' + s + '"]');
        if (!fits[s]) { r.innerHTML = ''; return; }
        r.innerHTML = fits[s].pairs.map(function (row) {
          return '<span class="blk">' + row.map(function (pr) { return '<span class="pr' + (clash[pr[0]] ? ' bad' : '') + '"><svg viewBox="0 0 100 100">' + SC.part(pr[0], 0, 0, 100, 100, 0.1) + '</svg><b>' + pr[1] + '</b></span>'; }).join('') + '</span>';
        }).join('');
      });
      return { c: c, fits: fits, clash: clash, shape: shape };
    }
    ER.dnd(box, { item: '.nm', slot: '.nslot', home: home, lock: function () { return done; }, change: function () { var c = current(); ER.flag('w-names', c); readout(); msg(''); } });
    readout();
    box.querySelector('#rb-go').addEventListener('click', function () {
      if (done) return;
      var R = readout(), c = R.c;
      if (!c.a || !c.b) { ER.sfx.no(); msg('Two names are cut into the stone. Put a name under each.'); return; }
      var pr = (R.fits.a.prob || R.fits.b.prob);
      if (pr) { ER.sfx.no(); ER.shake(box.querySelector('.rb-row')); msg(pr); return; }
      var cl = Object.keys(R.clash);
      if (cl.length) {
        ER.sfx.no(); ER.shake(box.querySelector('.rb-row'));
        msg('Look at the red letters. With ' + c.a + ' and ' + c.b + ', the same letter is drawn with two different shapes, or one shape stands for two letters. In a script made by one person, one letter has one shape.');
        return;
      }
      var f = ER.exit([c.a + '|' + c.b], { wait: true, quiet: true });
      if (!f) { ER.sfx.no(); msg('&ldquo;It fits,&rdquo; says Mr Delgado slowly, &ldquo;but does it make sense? Who carved this stone, in whose garden?&rdquo;'); return; }
      done = true; nextFile = f; ER.flag('w-file', f); tl.set('named'); SC.solved(); paint();
      var key = {}; Object.keys(R.shape).forEach(function (k) { key[k] = R.shape[k]; }); key.ring = '-';
      ER.flag('key0', key);
      SC.mine('names', 'The names on the stone', '<p>First name, two blocks, starts with the silent ring: E-LIN.</p><p>Second name, three blocks, the same vowel three times: A-GA-TA. (Not ALANA: her L would have the arch shape, but ELIN&rsquo;s L has the loop.)</p><p>So now I know: the ring is silent, the earth curve is E, the little standing person is I, the person with a dot on the right is A, the loop-ended line is L, the plain turned-up line is N, the one with two strokes is T, the arch is G.</p><p>The + between the names, the heart round them and the two strokes underneath: not letters?</p>');
      msg('ELIN, and AGATA. The shapes agree everywhere: one letter, one shape.');
      setTimeout(ending, 2400);
    });
    msg(done ? 'ELIN and AGATA.' : 'Drag a name under a group of signs, or click it and then the space. The letters it would give appear underneath.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  function ending() {
    ER.closeAll(); busy = true;
    ER.narrate([
      'ELIN and AGATA, cut into a garden stone, with a heart round both of them.',
      'Dr Szabo sits down on a stool. &ldquo;Two girls of eleven,&rdquo; he says, &ldquo;with a nail. And I have a photographer coming at ten.&rdquo; He looks at the letter in its sleeve. &ldquo;So this is not a find. It is post.&rdquo;',
      '&ldquo;Elin wrote it,&rdquo; says Mr Delgado, &ldquo;in their old script, and left it on Agata&rsquo;s bench, against their stone. For Agata. Who had gone home.&rdquo; He is not looking happy. &ldquo;Or Agata wrote it for her. Either way, it says where one of them is.&rdquo;',
      'The radio crackles. Mr Moreau, out of breath: &ldquo;Print room light&rsquo;s on, up the staff stairs from where you are. The printer switched it off at four. I saw him do it.&rdquo;',
      'Somebody went up the staff stairs after four.'
    ], function () { busy = false; $('#go').classList.add('on'); });
  }
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
})();
</script>
</body>
</html>
