  .fm-page .foot{margin:8px 0 0;font-family:'Gentium Book Plus',serif;font-size:14.5px;color:#4a4e58}
  .fm-page .foot b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;color:#7a7e88}
  .tray{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.3);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:5px}
  .tray h5{margin:0 0 2px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fbeedc}
  .slip{display:block;width:100%;padding:7px 10px 5px;background:#eef3fa;color:#1c2433;font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.2;cursor:grab;box-shadow:0 2px 5px rgba(0,0,0,.3);border-left:4px solid #2f5d7c;touch-action:none;text-align:left}
  .slip.held{outline:3px solid #f2c94c}
  .slip.fly{position:fixed;z-index:80;pointer-events:none}
  .cell .slip{box-shadow:none}
</style>

(function () {

  ER.init({

    go: 'Put the kettle on',
    intro: [
      'On the light table, four films left one region shining: the South-West of England. Her r, her long a in &ldquo;bath&rdquo;, her dropped h and her &ldquo;Where&rsquo;s it to?&rdquo; all fit there. &ldquo;Wee&rdquo; is her Glaswegian dad&rsquo;s, and &ldquo;fall&rdquo; is her boy&rsquo;s cartoons: words travel, accents mostly stay put.',
      'It is a quarter past two. The common room has a sofa that eats people, a kettle that sounds like a jet engine, and a radio on the shelf, still tuned to Nightjar.'
    ],
    exit: {"next":"maps","w":{"c39b7308":"3ee56369"}}, tags: {"1n":["6313a19e"],"1s":["3aa97bfc"],"1r":["bb7753e4"],"2n":["5afb5a05"],"2s":["29bdf7be"],"2r":["26273b10"],"3n":["e4ee0624"],"3s":["b26678bd"],"3r":["1bfc3ca0"],"4n":["18d9a88a"],"4s":["af8d4e94"],"4r":["3a245c3a"],"5n":["ad96f298"],"5s":["208107d4"],"5r":["e4022b24"],"rw":["8840d74d","a0e71232","52c8df0f","ac2a541b","a4994a44","10c25dab","81c30269","1df22e71","46abbe72","76e54912","7d5b85e7","3f2c3b54","3145ffa1","11d5692a","d7b9d9db","c61a6750","ca31ddcd","4ab8d322","43856268","ef1e9623","a5eeb2ea","67f2a3fa","64f16857","16f32f17","e9f58e05","787cf58b","736fbd95","645962ac","48685c56","4fb3fccc"]},
    hints: hints, onBegin: begin
  });

  told = ER.flag('d-told') || {}; nextFile = ER.flag('d-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.poster && told.list; }

  }
  function hints() {

    if (form && form.isOpen()) return ['form', [
      'First find the row: what does each word mean? Then the person: Nan is 82, Shona is 31, and Robbie is 9 and watches American cartoons.',
      'Robbie&rsquo;s words are the American ones on Nia&rsquo;s list. Shona&rsquo;s are today&rsquo;s ordinary British words. Nan&rsquo;s are the older words, and her dialect words: the poster says what an old West Country &ldquo;lake&rdquo; is.',
      'Good things: proper job (Nan), brilliant (Shona), awesome (Robbie). The stream: the lake, the brook, the creek. The bin: the dustbin, the bin, the trash can. Films: the pictures, the cinema, the movies. Mother: Mother, Mum, Mom.'

    if (!told.nia) return ['nia', ['Nia is on the sofa with her phone. Talk to her.']];
    if (!told.poster) return ['poster', ['The poster on the wall: &ldquo;How language changes&rdquo;. Read it.']];

    if (told.in) { busy = false; ER.say('The common room: sofa, kettle, radio, printer.'); return; }
    tell('in');
    ER.narrate([
      'Petra fills the kettle and talks to Tamsin Rowe on the phone at the same time, which nobody should try with a kettle like that one.',

  $('#nia').addEventListener('click', function () {

    ER.talk({
      who: 'Nia Prothero', role: 'Research student · teenagers&rsquo; speech', face: AC.face('nia'),
      lines: [
        { a: '&ldquo;Tonight&rsquo;s programme had a form on the website: &lsquo;Your family&rsquo;s words&rsquo;. Five questions, three people: you, someone older, someone younger. Shona filled it in at two minutes to midnight, on her break. That&rsquo;s how Yolande picked her.&rdquo;' },
        { q: 'So what&rsquo;s the problem?', a: '&ldquo;The website broke the table. All fifteen words came through in one long list, in alphabetical order, with the questions underneath and nothing joining them up.&rdquo; She sighs. &ldquo;Somebody built that website on a Friday.&rdquo;' },
        { q: 'Why does it matter, tonight?', a: '&ldquo;Because it&rsquo;s Shona&rsquo;s own words, written down, and her nan&rsquo;s, and her boy&rsquo;s. If she said something on the phone we don&rsquo;t understand, the answer might be in her family.&rdquo;' },
        { a: '&ldquo;Read the poster first. Then my list on the fridge. Then the printer: I&rsquo;ve sent the form to it, cut up into slips, so we can put it back together.&rdquo;' }

      clue: { id: 'nia4', title: 'Nia: the form came through in a mess', kind: 'What she said' },
      done: function (seen) { if (seen && tell('nia')) { paint(); ER.say('The poster, then the list on the fridge.'); } }
    });
  });
  $('#petra').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Map library,&rdquo; says Petra, with the phone still at her ear. &ldquo;Tamsin, give me two minutes.&rdquo;'); return; }
    ER.talk({
      who: 'Dr Petra Quilliam', role: 'Your aunt · on the phone to Control', face: AC.face('petra', 'worried'),
      lines: [
        { note: 'She has her hand over the phone.', a: '&ldquo;Tamsin has crews out all over the moors. Two cars in rivers already tonight, both found, both fine. Shona isn&rsquo;t either of them.&rdquo;' },
        { q: 'Any news of the mast?', a: '&ldquo;Soon, they say. &lsquo;Soon&rsquo; has been the word since one o&rsquo;clock.&rdquo;' },
        { a: '&ldquo;Do the form with Nia. Words are her side of things. I listen to sounds; she listens to people.&rdquo;' }
      ]
    });
  });

  var POSTER = '<h4>Department of Linguistics &middot; poster</h4><h3>How language changes</h3><div class="two"><div>' +
    '<p>Language never stands still.</p><p><b>Words change their meaning.</b> In the 1300s, &ldquo;nice&rdquo; meant foolish. &ldquo;Silly&rdquo; once meant happy, even holy.</p>' +
    '<p><b>New words arrive.</b> &ldquo;Selfie&rdquo; was Oxford Dictionaries&rsquo; Word of the Year in 2013.</p>' +
    '<p><b>Old words hang on</b>, in the mouths of older people and in dialects. &ldquo;Wireless&rdquo; was the usual British word for a radio until the 1950s. And in old West Country speech, a &ldquo;lake&rdquo; is often not a big pool at all but a small stream. That word comes from Old English <i>lacu</i>, a stream; the big lake came later, from the Latin <i>lacus</i>.</p>' +
    '<p>So one family can hold three <b>generations</b> of words for the same thing: a grandmother&rsquo;s, a mother&rsquo;s and a child&rsquo;s. Today many of the newest words come from screens, and a lot of them are American.</p></div>' +
    '<div class="dia"><svg viewBox="0 0 280 300"><g font-family="Kalam,cursive" font-size="17"><circle cx="140" cy="44" r="22" fill="#f0d4c0"/><path d="M140 66v34M80 120h120M80 120v30M200 120v30M140 100v20" stroke="#5a4a3a" stroke-width="3"/>' +
    '<circle cx="80" cy="172" r="20" fill="#f2cfb4"/><circle cx="200" cy="172" r="20" fill="#e9c09a"/><path d="M200 192v30" stroke="#5a4a3a" stroke-width="3"/><circle cx="200" cy="244" r="16" fill="#f2cfb4"/>' +
    '<rect x="172" y="18" width="98" height="30" rx="12" fill="#fff" stroke="#1c2433" stroke-width="2"/><text x="182" y="39" fill="#1c2433">&ldquo;a snap&rdquo;</text><text x="110" y="18" font-size="13" fill="#7a6a5a">Gran</text>' +
    '<rect x="4" y="194" width="98" height="30" rx="12" fill="#fff" stroke="#1c2433" stroke-width="2"/><text x="14" y="215" fill="#1c2433">&ldquo;a photo&rdquo;</text><text x="56" y="152" font-size="13" fill="#7a6a5a">Mum</text>' +
    '<rect x="150" y="266" width="88" height="30" rx="12" fill="#fff" stroke="#1c2433" stroke-width="2"/><text x="164" y="287" fill="#1c2433">&ldquo;a pic&rdquo;</text><text x="222" y="250" font-size="13" fill="#7a6a5a">kid</text></g>' +
    '<text x="6" y="80" font-family="Old Standard TT,serif" font-weight="700" font-size="14" fill="#c0392b">one picture,</text><text x="6" y="98" font-family="Old Standard TT,serif" font-weight="700" font-size="14" fill="#c0392b">three words</text></svg></div></div>' +
    '<p class="fact"><b>A real fact.</b> &ldquo;Fall&rdquo; was an ordinary word for autumn in England in the 1600s (&ldquo;the fall of the leaf&rdquo;). Settlers took it to America, where it stayed. In Britain, &ldquo;autumn&rdquo; won.</p>';
  $('#poster').addEventListener('click', function () {

    ER.read({ html: POSTER, cls: 'card', clue: { id: 'poster', title: 'Poster: how language changes', kind: 'Poster' }, done: function () {

  });
  var LIST = '<h4>Stuck on the fridge &middot; Nia&rsquo;s handout for Year 9 visitors</h4><h3>British or American?</h3>' +
    '<table><tr><th>British</th><th>American</th></tr><tr><td>pavement</td><td>sidewalk</td></tr><tr><td>lorry</td><td>truck</td></tr><tr><td>autumn</td><td>fall</td></tr><tr><td>rubbish, bin</td><td>trash, trash can</td></tr><tr><td>queue</td><td>line</td></tr>' +
    '<tr><td>the cinema</td><td>the movies</td></tr><tr><td>Mum</td><td>Mom</td></tr><tr><td>a stream, a brook</td><td>a creek (in Britain, a creek is a narrow inlet of the sea)</td></tr><tr><td>brilliant!</td><td>awesome!</td></tr><tr><td>colour, centre, favourite</td><td>color, center, favorite</td></tr></table>' +
    '<p>Most British children now know both columns, from films and the internet, and many use some of the right-hand words without noticing. Spelling changed in America partly because of Noah Webster, whose <i>American Dictionary of the English Language</i> (1828) chose spellings like <i>color</i> and <i>center</i>.</p><p class="pg">N. Prothero &middot; &ldquo;Do you say awesome?&rdquo;</p>';
  $('#fridge').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LIST, cls: 'card', clue: { id: 'list', title: 'Nia&rsquo;s list: British or American?', kind: 'List' }, done: function () {
      AC.terms(['British English', 'American English', 'spelling']);
      if (tell('list')) { paint(); if (!told.poster) ER.say('Now the poster on the wall.'); else if (ready()) ER.say('Now the printer.'); }
    } });
  });
  var TEXTS = '<h4>Nightjar &middot; texts read on air, 02.05 to 02.15</h4>' +
    '<p>&ldquo;Graham in Ohio says she&rsquo;s from Tennessee, because she said &lsquo;fall&rsquo;. Graham, she also said &lsquo;bath&rsquo; like a duchess.&rdquo;</p>' +
    '<p>&ldquo;Sandra in Taunton: my nan says &lsquo;dimpsy&rsquo; too! Thank you, Sandra.&rdquo;</p>' +
    '<p>&ldquo;Ross in Glasgow says &lsquo;wee&rsquo;, therefore Glasgow. Ross, I admire your confidence.&rdquo;</p>' +
    '<p>&ldquo;Pete, a retired postman, says if she said &lsquo;the lake&rsquo; she must have been near a reservoir: there aren&rsquo;t many real lakes down there.&rdquo;</p>' +
    '<p>&ldquo;And Jodie, aged fifteen, says it&rsquo;s obvious, she&rsquo;s from Bristol, because that&rsquo;s where her auntie lives. Jodie, go to bed.&rdquo;</p>';
  $('#radio').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TEXTS, cls: 'statement', clue: { id: 'texts', title: 'Texts read on Nightjar', kind: 'On the radio' }, done: function () { tell('radio'); } });
  });
  AC.thing('#window', null, 'Rain, still. The forecast on the radio says it will stop at about four. That is no use to anybody now.', isBusy);
  AC.thing('#kettle', 'kettle', 'The kettle roars like a jet engine and then clicks off. Nobody drinks the tea.', isBusy);
  AC.thing('#sofa', null, 'The sofa that eats people. There is a yellow cushion on it with &ldquo;ALL ACCENTS WELCOME&rdquo; stitched on it, crookedly.', isBusy);

  /* ---------- the form ---------- */
  var ROWS = ['When something&rsquo;s really good, you say&hellip;', 'The little stream at the bottom of our lane', 'Where the rubbish goes', 'Where you go to see a film', 'What you call your mother'];
  var SLIPS = [['aw', 'awesome'], ['br', 'brilliant'], ['mm', 'Mom'], ['mo', 'Mother'], ['mu', 'Mum'], ['pj', 'proper job'], ['bn', 'the bin'], ['bk', 'the brook'], ['ci', 'the cinema'], ['ck', 'the creek'], ['db', 'the dustbin'], ['lk', 'the lake'], ['mv', 'the movies'], ['pi', 'the pictures'], ['tc', 'the trash can']];
  var CN = { n: 'Nan', s: 'Shona', r: 'Robbie' };
  $('#printer').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The form, put back together, with a cold mug of tea on one corner.'); return; }
    if (!told.nia) { ER.say('The printer has been printing something for ten minutes. Talk to Nia first.'); return; }
    if (!ready()) { ER.say('&ldquo;Poster and list first,&rdquo; says Nia. &ldquo;Trust me.&rdquo;'); return; }
    if (!form) form = makeForm();
    form.open();
  });
  function makeForm() {
    var box = ER.el('div', 'pz fm'), placed = ER.flag('d-pl') || {}, done = false;
    box.innerHTML = '<div class="fm-in"><div class="fm-page"><h3>NIGHTJAR &middot; YOUR FAMILY&rsquo;S WORDS</h3><p class="sub">Sent 23.58 by: Shona &middot; Someone older: Nan (82) &middot; Someone younger: Robbie (9)</p><div class="grid">' +
      '<div></div><div class="hd">NAN, 82</div><div class="hd">ME, 31</div><div class="hd">ROBBIE, 9</div>' +
      ROWS.map(function (q, i) { return '<div class="q">' + q + '</div>' + ['n', 's', 'r'].map(function (c) { return '<div class="cell" data-c="' + (i + 1) + c + '"></div>'; }).join(''); }).join('') +
      '</div><p class="foot"><b>ANYTHING ELSE?</b> &nbsp;Nan says &ldquo;Where&rsquo;s it to?&rdquo; about everything. I&rsquo;ve caught it off her. So has Robbie, and he does her voice.</p></div>' +
      '<div class="tray"><h5>The list, as it came</h5></div></div><div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="f-go">Read it to Nia</button></div>';
    var tray = box.querySelector('.tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    SLIPS.forEach(function (s) { var d = ER.el('div', 'dnd-item slip', s[1]); d.setAttribute('data-k', s[0]); tray.appendChild(d); });
    Object.keys(placed).forEach(function (c) { var d = box.querySelector('.slip[data-k="' + placed[c] + '"]'), cell = box.querySelector('.cell[data-c="' + c + '"]'); if (d && cell) cell.appendChild(d); });
    function read() { var o = {}; ER.$$('.cell', box).forEach(function (c) { var d = c.querySelector('.slip'); if (d) o[c.getAttribute('data-c')] = d.getAttribute('data-k'); }); return o; }
    ER.dnd(box, { item: '.slip', slot: '.cell', home: tray, lock: function () { return done; }, change: function () {
      ER.$$('.cell', box).forEach(function (c) { c.classList.remove('bad'); }); placed = read(); ER.flag('d-pl', placed);
    } });
    box.querySelector('#f-go').addEventListener('click', function () {
      if (done) return;
      var o = read(), n = Object.keys(o).length, order = [], i, c, bad = null;
      if (n < 15) { ER.sfx.no(); msg(n ? 'Fifteen spaces, and ' + n + ' of them filled. Every slip has a place.' : 'Drag each slip into the right space (or click a slip, then a space).'); return; }
      for (i = 1; i <= 5; i++) ['n', 's', 'r'].forEach(function (k) { order.push(i + k); });
      for (i = 0; i < order.length; i++) { c = order[i]; if (!ER.check(c, o[c])) { bad = c; break; } }
      if (bad) {
        ER.sfx.no(); var cell = box.querySelector('.cell[data-c="' + bad + '"]'); cell.classList.add('bad'); ER.shake(cell);
        var w = cell.textContent;
        if (ER.check('rw', bad + ':' + o[bad])) msg('Nia taps &ldquo;' + w + '&rdquo;. &ldquo;Right row. Wrong person. Would ' + CN[bad.charAt(1)] + ' say that? Think how old they are, and where their words come from.&rdquo;');
        else msg('Nia taps &ldquo;' + w + '&rdquo;. &ldquo;That&rsquo;s not an answer to this question at all. What does &lsquo;' + w + '&rsquo; mean?&rdquo;');
        return;
      }
      done = true;
      nextFile = ER.exit([order.map(function (k) { return o[k]; }).join('.')], { wait: true });
      if (!nextFile) { msg('The way on will not open. Something is wrong with this page: tell your teacher.'); return; }
      ER.flag('d-file', nextFile); paint();
      AC.mine('family', 'Shona&rsquo;s family words', '<p>Good! &mdash; Nan: proper job &middot; Shona: brilliant &middot; Robbie: awesome</p><p>The little stream at the bottom of our lane &mdash; Nan: <b>the lake</b> &middot; Shona: the brook &middot; Robbie: the creek</p><p>Rubbish &mdash; the dustbin &middot; the bin &middot; the trash can</p><p>Films &mdash; the pictures &middot; the cinema &middot; the movies</p><p>Mother &mdash; Mother &middot; Mum &middot; Mom</p><p>Shona has &ldquo;caught&rdquo; Nan&rsquo;s words. Robbie&rsquo;s are American, from screens.</p>');
      msg('<b>The form is whole again.</b> Older words and dialect words for Nan, today&rsquo;s British words for Shona, American words from the screen for Robbie. Three words for one stream at the bottom of one lane.');
      setTimeout(function () {
        ER.closeAll(); busy = true; AC.sfx.beep();
        ER.narrate([
          'Petra&rsquo;s phone beeps. She listens, says &ldquo;Yes. Yes. Thank you,&rdquo; and puts it on speaker.',
          'Tamsin Rowe: &ldquo;The network&rsquo;s come back. Her phone last used mast 14, on Cuckoo Down. That mast covers a circle about seven kilometres across, mostly open moor. Moor roads, farm lanes, a reservoir, three villages.&rdquo;',
          '&ldquo;My nearest crew is twenty minutes from the middle of it. Where do I send them?&rdquo;',
          '&ldquo;The geography department&rsquo;s map library is across the landing,&rdquo; says Petra. &ldquo;They have every map of Britain ever printed. Give us five minutes.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 3000);
    });
    msg(Object.keys(placed).length ? 'Your slips are where you left them.' : 'Drag each slip into a space (or click a slip, then a space). Each space takes one slip.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
})();
</script>
</body>
</html>
