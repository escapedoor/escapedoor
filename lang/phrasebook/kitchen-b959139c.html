  /* asking Hova */
  .ak{width:min(1040px,96vw);background:#fbf1e0;color:#2a1a12;border-top:14px solid #5a2a3a;box-shadow:0 26px 70px rgba(0,0,0,.6);padding:16px 22px 14px}

  .ak-face svg{width:100%;height:100%}
  .ak-say{min-height:96px;background:#fff;border:2px solid #d9c4a0;border-radius:14px;padding:12px 18px;font-family:'Gentium Book Plus',serif;font-size:17px;line-height:1.45;position:relative}
  .ak-say:before{content:'';position:absolute;left:-14px;top:40px;border:7px solid transparent;border-right-color:#d9c4a0;border-width:7px 14px 7px 0}
  .ak-say .iv{font-size:22px}
  .ak-say i.st{display:block;color:#7a6a5a}
  .ak-line{margin:14px 0 8px;min-height:62px;background:#f2e2c4;border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null, ak = null, iv = PB.iv;

  $('#hova').innerHTML = PB.who('hova', { extra: '<path d="M39 -112l40 -40" stroke="#6a4a2a" stroke-width="6" stroke-linecap="round"/>' });
  $('#nakashima').innerHTML = PB.who('nakashima', { smile: 6 });
  $('#cat').innerHTML = PB.cat();

  ER.init({
    theme: 'lang', story: 'phrasebook', storyTitle: 'The Verb Comes Last', id: 'kitchen', no: 'III', title: 'The Kitchen',
    go: 'Knock on the blue door',
    intro: [
      'Mela&rsquo;s board said everything, if you counted. After a number Isuvo drops the plural: ' + iv('tivo vasi bura') + ', two big loaves. With no number, <span class="iv">-li</span> means &ldquo;some&rdquo;: ' + iv('piko pesali') + ', a string of small fish. <span class="iv">-su</span> is &rsquo;s: ' + iv('Melasu mela') + ', Mela&rsquo;s honey. And ' + iv('pea') + ', which looks so English, means egg.',
      'The basket was going to the ' + iv('kesado') + ', a long low house with a blue door at the top of the lane. Philippa was going there for lunch.'
    ],
    exit: {"next":"school","w":{"d72cc1c6":"2b212614","85e5ebbf":"2e99a36a"}}, tags: {"was":["3107a342","4feab2c6"],"plain":["52be4565","a6c4c43c"],"now":["0b2f4bb8","ca2f2c06"],"ko":["a00755c1","00295787"],"ta":["f34c8b66","7317c528"]},
    hints: hints, onBegin: begin
  });

  told = ER.flag('c-told') || {}; nextFile = ER.flag('c-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#scene').classList.toggle('given', !!told.hova);
    $('#pbook').classList.toggle('ready', !!(told.hova && (!told.p5 || !told.p6)));
    $('#hova').classList.toggle('ready', !!(!told.hova || (told.p5 && told.p6 && !nextFile)));
    ER.pips((told.hova ? 1 : 0) + (told.p5 ? 1 : 0) + (told.p6 ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['Hova said Lukahemi went to the lukado. The button at the bottom of the screen takes you there.']];
    if (ak && ak.isOpen()) return ['ask', [
      'You want to know where Lukahemi went. Find the sentence on page 6 that is most like that, and change what needs changing.',
      'There is no word for &ldquo;where to&rdquo; on page 6. But <em>noko</em> is <em>no</em> + <em>-ko</em>: &ldquo;at what&rdquo;, so &ldquo;where&rdquo;. What would &ldquo;to what&rdquo; be? You learnt <em>-vi</em> on the quay.',
      'She went, and you must be polite: look at how page 6 says &ldquo;drank&rdquo; and &ldquo;went&rdquo; politely. The polite ending comes last of all. Lukahemi is the one who went, so she has no <em>-ta</em>.'
    ]];
    if (!told.hova) return ['hova', ['Give the basket to the old woman at the stove: click her.']];
    if (!told.p5) return ['p5', ['Philippa has a page about being polite. Open the phrasebook: the blue button at the bottom left.']];
    if (!told.p6) return ['p6', ['Open the phrasebook again: page 6 is all questions.']];
    return ['ask', ['Now ask Hova where Lukahemi went. Click Hova.', 'If you want help with the polite form first, talk to Mrs Nakashima at the table.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; PB.wordlist(3, true); $('#go').classList.add('on'); ER.say('Lukahemi went to the lukado, and gave the papers to Sanu.'); return; }
    if (told.in) { busy = false; ER.say('Hova&rsquo;s kitchen. Warm, dark, and spotless.'); return; }
    tell('in');
    ER.narrate([
      'The blue door opens before you knock. Behind it is a kitchen: very warm, very dark, very clean, with an iron stove the size of a small car.',
      'Copper pans hang along the wall. A kettle hums. Through the window you can see the whole village going down to the sea, and, far off on the headland, the lighthouse.',
      'At the stove stands the smallest, oldest woman you have ever seen.',
      'The black cat from the market is already under the table. Nobody saw it come in.'
    ], function () { busy = false; });
  }

  /* ---------- Hova ---------- */
  $('#hova').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Hova stirs her pot. She has told you what you asked. She does not look as if she will tell you any more.'); return; }
    if (!told.hova) {
      ER.talk({
        who: 'The old woman at the stove', role: 'The guest house, with the blue door', face: PB.face('hova'),
        lines: [
          { note: 'She is very small and very old, with white hair in a bun and a black shawl, and she is stirring a pot that smells of fish and onions. She looks at you over her glasses.', a: '&ldquo;' + iv('Kesa') + '.&rdquo;' },
          { note: 'She sees the basket. She lifts the cloth, and her whole face changes.', a: '&ldquo;' + iv('Lukahemisu!') + '&rdquo;' },
          { note: 'She takes out the honey and holds it against her heart. She taps her chest: &ldquo;' + iv('Hova') + '.&rdquo; Then she points at the table, at a chair, at the teapot.', a: '&ldquo;' + iv('Lapita volane?') + '&rdquo;' },
          { note: 'She pours you a cup without waiting for an answer, and goes back to her pot. Mrs Nakashima has already sat down, and is very happy.' },
          { note: 'Hova has the look of somebody who would answer a question, if it were asked properly.' }
        ],
        clue: { id: 'hova', title: 'Hova, in her kitchen', kind: 'In the guest house' },
        done: function (seen) { if (seen && tell('hova')) { paint(); ER.say('Ask her properly. Philippa&rsquo;s phrasebook has a page on that.'); } }
      });
      return;
    }
    if (!told.p5 || !told.p6) { ER.say('Hova looks at you over her glasses, and waits. Philippa said to read her pages on being polite first.'); return; }
    if (!ak) ak = makeAsk();
    ak.open();
  });
  $('#nakashima').addEventListener('click', function () {
    if (busy) return;
    if (!told.p5) { ER.say('&ldquo;This tea,&rdquo; says Mrs Nakashima, &ldquo;is the best thing that has happened to me this week.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Nakashima', role: 'Passenger · drinking tea', face: PB.face('nakashima', 'smile'),
      lines: [
        { a: '&ldquo;In Japanese I speak one way to my son and another way to my son&rsquo;s teacher. The verb is the same. The ending is different.&rdquo;' },
        { q: 'Is it rude to use the plain one?', a: '&ldquo;To a friend, it is warm. To an old lady you have just met, in her own kitchen &hellip;&rdquo; She makes a face. &ldquo;And she gave you tea.&rdquo;' },
        { q: 'Where does the polite ending go?', a: '&ldquo;Look at the little book. When something happened in the past AND you are being polite, which piece comes last?&rdquo;' }
      ],
      clue: { id: 'naka2', title: 'Mrs Nakashima: the same verb, a different ending', kind: 'What she said' },
      done: function (seen) { if (seen) tell('naka'); }
    });
  });
  $('#cat').addEventListener('click', function () { if (busy) return; PB.sfx.mew(); ER.say('Pesahiba is under the table, waiting for somebody to drop a fish. It has been waiting all its life.'); });
  PB.thing('#window', null, 'The village, the sea, and down the hill a white building with children&rsquo;s drawings in its windows and a sign over the door. Far away on the headland, the lighthouse.', isBusy);
  PB.thing('#stove', 'stove', 'The stove ticks and roars. Something in the pot is going to be very good in about an hour.', isBusy);
  PB.thing('#pans', null, 'Copper pans, polished until they glow like the fire.', isBusy);
  PB.thing('#dresser', 'dresser', 'A dresser full of blue and white plates. One of them has a crack mended with glue, very neatly.', isBusy);

  /* ---------- the phrasebook ---------- */
  var P5 = '<h4>A Pocket Phrasebook of Isuvo &middot; page 5</h4><h3>Please</h3>' +
    '<p>English is polite with extra words: <i>please</i>, <i>could you</i>, <i>I wonder if</i>. The verb itself does not change.</p>' +
    '<p>Many languages build politeness into the verb. Japanese has a plain form and a <b>polite form</b> of almost every verb, and so does Korean: the same verb, with a different ending, depending on who you are talking to. Other languages change the word for <i>you</i> instead: French has a friendly <i>you</i> and a polite one.</p>' +
    '<p>Isuvo puts politeness in an ending on the verb. Children use the plain form with each other. To anybody older, to a stranger, and above all to Hova, use the polite one.</p>' +
    '<p class="rule">Hova is eighty-one. She has never in her life answered a plain question from a guest, and she will not start with you. <span class="hand">P.W.</span></p><p class="pg">5</p>';
  var P6I = /*isuvo*/['Hemi tamuta vola.', 'Hemi tamuta volane.', 'Tamuta tolene.', 'Kesa lapita volakane.', 'Nota semikane?', 'Noko dabine?', 'Neka moravi nurukane.', 'Nasone.', 'Monasone.'];
  var P6E = ['The woman drinks water. <i>(plain)</i>', 'The woman drinks water. <i>(polite)</i>', 'Please give me water.', 'The guest drank the tea.', 'What did you eat?', 'Where are you staying?',
    'The child went to the market.', 'I know.', 'I don&rsquo;t know.'];
  var P6 = '<h4>A Pocket Phrasebook of Isuvo &middot; page 6</h4><h3>Asking</h3><table>' + P6I.map(function (r, i) { return '<tr><td><span class="n">' + (i + 1) + '</span>' + iv(r) + '</td><td>' + P6E[i] + '</td></tr>'; }).join('') + '</table>' +
    '<p>A question is said like a statement, with a question in your voice. Everything on this page is polite except the first line.</p><p class="pg">6</p>';
  $('#pbook').addEventListener('click', function () {
    if (busy) return;
    if (!told.hova) { ER.say('First, the basket. The old woman at the stove is looking at it.'); return; }
    if (!told.p5) {
      ER.read({ html: P5, cls: 'pb', clue: { id: 'p5', title: 'Phrasebook, page 5: please', kind: 'Phrasebook' }, done: function () {
        PB.terms(['polite form']);
        if (tell('p5')) { paint(); ER.say('The polite ending. Page 6 is next: click the phrasebook again.'); }
      } });
      return;
    }
    ER.read({ html: P6, cls: 'pb', clue: { id: 'p6', title: 'Phrasebook, page 6: asking', kind: 'Phrasebook' }, done: function () {
      if (tell('p6')) { paint(); ER.say('No &ldquo;where to&rdquo; on the page. But there are pieces to make one from.'); }
    } });
  });

  /* ---------- asking Hova: words built from pieces ---------- */
  var ROOTS = ['Lukahemi', 'Hova', 'kesa', 'tamu', 'lapi', 'no', 'nuru', 'dabi', 'vola', 'semi', 'tole', 'naso'];
  var ENDS = ['-ta', '-ko', '-vi', '-li', '-ka', '-ne'];
  var VERBS = { nuru: 1, dabi: 1, vola: 1, semi: 1, tole: 1, naso: 1 };
  function makeAsk() {
    var box = ER.el('div', 'pz ak'), words = [[]], waiting = false;
    box.innerHTML = '<div class="ak-top"><div class="ak-face">' + PB.face('hova') + '</div><div class="ak-say"></div></div>' +
      '<div class="ak-line"></div>' +
      '<div class="ak-keys"><div><h5>Words</h5><div class="k kr">' + ROOTS.map(function (r) { return '<button type="button" data-r="' + r + '">' + r + '</button>'; }).join('') + '</div></div>' +
      '<div><h5>Pieces to add to a word</h5><div class="k ke">' + ['mo-'].concat(ENDS).map(function (e) { return '<button type="button" class="end" data-e="' + e + '">' + e + '</button>'; }).join('') + '</div>' +
      '<h5 style="margin-top:10px">&nbsp;</h5><div class="k ctl"><button type="button" id="k-sp">next word &rarr;</button><button type="button" id="k-bk">&larr; take back</button><button type="button" id="k-cl">start again</button></div></div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="k-ask">Ask Hova</button></div>';
    var line = box.querySelector('.ak-line'), say = box.querySelector('.ak-say'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function hova(isv, stage) { say.innerHTML = (isv ? '<!--nogloss--><span class="iv">' + isv + '</span><!--/nogloss-->' : '') + (stage ? '<i class="st">' + ER.gloss(stage) + '</i>' : ''); }
    function str(w) { return w.map(function (p) { return p.replace(/-/g, ''); }).join(''); }
    function render() {
      var h = '', any = false;
      words.forEach(function (w, i) {
        if (!w.length && i < words.length - 1) return;
        if (w.length) any = true;
        h += '<span class="ak-word' + (i === words.length - 1 ? ' cur' : '') + '">' + (w.length ? w.map(function (p) { return /^-|-$/.test(p) ? '<u>' + p.replace(/-/g, '') + '</u>' : p; }).join('') : '&nbsp;') + '</span>';
      });
      line.innerHTML = '<!--nogloss-->' + (any ? h + '<span class="ak-q">?</span>' : '<span class="ak-ph">Build your question here, a piece at a time.</span>') + '<!--/nogloss-->';
    }
    function cur() { return words[words.length - 1]; }
    ER.$$('.kr button', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (waiting) return;
        var w = cur(), r = b.getAttribute('data-r');
        if (w.length && !(w.length === 1 && w[0] === 'mo-')) { if (words.length >= 5) { msg('That is a long question. Five words is plenty.'); return; } words.push([]); w = cur(); }
        w.push(r); PB.sfx.tile(); render();
      });
    });
    ER.$$('.ke button', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (waiting) return;
        var w = cur(), e = b.getAttribute('data-e');
        if (e === 'mo-') {
          if (w.length) { if (words.length >= 5) return; words.push([]); w = cur(); }
          w.push(e); PB.sfx.tile(); render(); return;
        }
        if (!w.length || (w.length === 1 && w[0] === 'mo-')) { ER.sfx.no(); msg('An ending has to go on the end of a word. Choose a word first.'); return; }
        if (w.length >= 4) { ER.sfx.no(); msg('That word has enough pieces on it.'); return; }
        w.push(e); PB.sfx.tile(); render();
      });
    });
    box.querySelector('#k-sp').addEventListener('click', function () { if (waiting) return; if (cur().length && words.length < 5) { words.push([]); render(); } });
    box.querySelector('#k-bk').addEventListener('click', function () {
      if (waiting) return;
      var w = cur();
      if (w.length) w.pop(); else if (words.length > 1) { words.pop(); words[words.length - 1].pop(); }
      if (!cur().length && words.length > 1) words.pop();
      render();
    });
    box.querySelector('#k-cl').addEventListener('click', function () { if (waiting) return; words = [[]]; render(); });
    box.querySelector('#k-ask').addEventListener('click', function () {
      if (waiting) return;
      var ws = words.filter(function (w) { return w.length; });
      if (!ws.length) { ER.sfx.no(); msg('Build a question first, from the words and pieces below.'); return; }
      var q = ws.map(function (w) { return str(w).toLowerCase(); }).join(' '), last = ws[ws.length - 1], lastRoot = last.filter(function (p) { return !/-/.test(p); })[0] || '';
      var f = ER.exit([q], { wait: true });
      if (f) {
        waiting = true; nextFile = f; ER.flag('c-file', f); paint();
        hova('Lukahemi lukadovi nurukane.', 'Hova puts down her spoon, looks at you properly for the first time, and nods.');
        msg('A proper question, and an answer: <span class="iv">lukado-vi nuru-ka-ne</span>. She went to the ' + iv('lukado') + '.');
        PB.mine('ask', 'Asking Hova, worked out', '<p>' + iv('Lukahemi novi nurukane?') + '</p><p>no = what; no-ko = at what = where; so no-vi = to what = where to.</p><p>nuru-ka-ne: go + past + polite. The polite piece comes LAST.</p><p>Lukahemi did the going: no -ta.</p><p>Hova: ' + iv('Lukahemi lukadovi nurukane.') + ' She went to the lukado.</p>');
        setTimeout(function () {
          ER.closeAll(); busy = true;
          ER.narrate([
            '&ldquo;' + iv('Lukahemi lukadovi nurukane') + ',&rdquo; says Hova. She points out of the window, down the hill, at the white building with children&rsquo;s drawings in every window. A school, surely.',
            'Then she does something else. She mimes tearing pages out of a book, and giving them to somebody about this high.',
            '&ldquo;' + iv('Lukalita Sanuvi tolekane') + '.&rdquo; You can nearly read it. <span class="iv">-li</span>: more than one. <span class="iv">-ta</span>: the thing that was given. <span class="iv">-ka-ne</span>: in the past, politely. She gave the papers to somebody called Sanu: the girl on the quay.',
            'Then Hova goes back to her pot. She has answered exactly the question you asked, and not one word more.',
            '&ldquo;A very correct lady,&rdquo; says Mrs Nakashima, finishing her tea. &ldquo;Ask a better question, get a better answer. Shall we go to the school?&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); PB.wordlist(3); });
        }, 2600);
        return;
      }
      ER.sfx.no();
      if (ER.check('was', q)) { hova('Kesadoko dabikane.', 'Hova points firmly at her own kitchen floor. She was HERE. Then she goes back to her pot. You asked where Lukahemi was, not where she went next.'); msg('A true answer to the question you asked. Was it the question you meant?'); }
      else if (ER.check('plain', q)) { hova('', 'Hova turns back to her stove as if nobody had spoken. Mrs Nakashima winces. &ldquo;I think,&rdquo; she whispers, &ldquo;that was the way you talk to your little brother.&rdquo;'); msg('A plain question to Hova. Page 5 warned you.'); }
      else if (ER.check('now', q)) { hova('Monasone.', 'Hova spreads her hands. She cannot know what Lukahemi is doing at this moment. She could tell you what she DID.'); msg('Is your question about now, or about this morning?'); }
      else if (ER.check('ko', q)) { hova('Noko?', 'Hova points at the floor: at where? Then she mimes walking off, out of the door, and points into the distance. Going is not AT a place. It is TO one.'); msg('<span class="iv">-ko</span> is &ldquo;at&rdquo;. Is that the right piece for going?'); }
      else if (ER.check('ta', q)) { hova('', 'Hova looks round the kitchen, as if for somebody who has carried Lukahemi off. Mrs Nakashima laughs into her tea. &ldquo;You made her the one it was done to.&rdquo;'); msg('<span class="iv">-ta</span> marks the one the action is done to. Did somebody go Lukahemi?'); }
      else if (!VERBS[lastRoot]) { hova('', 'Hova waits, with her spoon in the air, for the verb. In Isuvo the verb comes last. She is still waiting.'); msg('Where does the verb go in Isuvo?'); }
      else if (!/ne$/.test(str(last))) { hova('', 'Hova does not even turn round. A plain question, from a guest.'); msg('Hova answers polite questions only.'); }
      else { hova('', 'Hova listens politely, and shakes her head slowly. She does not understand the question.'); msg('Polite, but not a question Hova can follow. Build it like the sentences on page 6.'); }
    });
    render();
    hova('', 'Hova waits, with her spoon in her hand.');
    msg('Click words and pieces to build a question for Hova. &ldquo;Next word&rdquo; starts a new word.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
})();
</script>
</body>
</html>
