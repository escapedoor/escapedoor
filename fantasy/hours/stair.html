<style>

  @keyframes gl{50%{opacity:.8}}
  #flame{transform-origin:770px 512px;animation:fl 1.9s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:scale(1,1)}35%{transform:scale(.88,1.14)}65%{transform:scale(1.1,.92)}}
  #daw{animation:bob 5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  #lineD{stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1.1s ease-in}
  #scene.line #lineD{stroke-dashoffset:0}
  #lineEnd{opacity:0;transition:opacity .2s 1.05s}
  #scene.line #lineEnd{opacity:1}
  #doorOpen{opacity:0;transition:opacity 1s}
  #scene.open #doorOpen{opacity:1}
  #scene.open #doorShut{opacity:0}
  #doorShut{transition:opacity 1s}
  #scene.nohand #lilHand{display:none}
  #scene.gone #daw{display:none}

  /* the caller's horn */
  .hn{width:min(820px,96vw);padding:22px 26px 20px;background:#2a2242 linear-gradient(160deg,#3a2f5c,#1c1730);border:7px solid #15112a;border-radius:6px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 2px rgba(242,194,107,.25)}
  .hn h4{margin:0;font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700;font-size:23px;color:#ffe2a0}
  .hn h5{margin:4px 0 14px;font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.22em;color:#d8c398;border-bottom:2px solid rgba(255,226,160,.3);padding-bottom:10px}
  .hn-rows{display:grid;grid-template-columns:1fr 70px 1fr;gap:14px;align-items:center}
  .hn-col{display:grid;gap:7px}
  .hn-col button{height:42px;border-radius:21px;border:2px solid #8a6a26;background:linear-gradient(#e2c56f,#b08a35);color:#2a1c06;font-family:'Cinzel',serif;font-weight:700;font-size:15.5px;letter-spacing:.12em;text-transform:uppercase;
    box-shadow:inset 0 2px 0 rgba(255,245,200,.6),0 3px 6px rgba(0,0,0,.4)}
  .hn-col button:hover{border-color:#fff3c8}
  .hn-col button.on{background:linear-gradient(#fff3c8,#ffd66e);border-color:#fff;box-shadow:0 0 0 3px rgba(255,214,110,.4)}
  .hn-me{text-align:center;font-family:'Almendra',serif;font-weight:700;font-style:italic;font-size:30px;color:#ffe2a0}
  .hn-say{margin:16px 0 12px;padding:12px 16px;border-radius:4px;background:rgba(0,0,0,.34);font-family:'Almendra',serif;font-style:italic;font-weight:700;font-size:27px;color:#fff3d6;text-align:center;min-height:58px}
  .hn-foot{display:flex;align-items:center;gap:16px}
  .hn-foot .btn{--accent:#ffe2a0;white-space:nowrap}
  .hn .pmsg{flex:1;min-height:104px}
</style>

<script>
(function () {
  var $ = ER.$, sc = $('#scene'), busy = false, nextFile = null;

  /* stars, stone courses, cobbles, and what is left of the ring of hours */
  (function () {
    var s = '', i, x, y, row = 0, seed = 11, a, h;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (i = 0; i < 130; i++) s += '<circle class="tw" cx="' + (-400 + rnd() * 2400).toFixed(0) + '" cy="' + (-400 + rnd() * 900).toFixed(0) + '" r="' + (0.7 + rnd() * 1.5).toFixed(1) + '" opacity="' + (0.4 + rnd() * 0.6).toFixed(2) + '"/>';
    $('#stars').innerHTML = s; s = '';
    for (y = -600; y < 800; y += 44, row++) {
      s += '<path d="M820 ' + y + 'H1260"/>';
      for (x = 860 + (row % 2) * 55; x < 1260; x += 110) s += '<path d="M' + x + ' ' + y + 'v44"/>';
    }
    $('#courses').innerHTML = s; s = '';
    for (i = 0; i < 7; i++) { y = 822 + i * i * 4 + i * 14; s += '<path d="M-1000 ' + y + 'H2600"/>'; }
    for (i = -14; i <= 30; i++) s += '<path d="M' + (800 + (i - 8) * 70) + ' 800L' + (800 + (i - 8) * 190) + ' 1500"/>';
    $('#cobbles').innerHTML = s; s = '';
    /* XII and VI are riveted. Nine have slipped on their hooks. One is not there. */
    var R = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', ''], TILT = [0, 24, -30, 40, -18, 34, 0, -42, 26, -22, 38, 0];
    for (h = 0; h < 12; h++) {
      if (!R[h]) continue;
      a = h * 30 * Math.PI / 180; x = 1040 + 98 * Math.sin(a); y = 130 - 98 * Math.cos(a) + (TILT[h] ? 5 : 0);
      s += '<text transform="translate(' + x.toFixed(0) + ' ' + (y + 7).toFixed(0) + ') rotate(' + TILT[h] + ')">' + R[h] + '</text>';
    }
    $('#hoursG').innerHTML = s;
  })();

  ER.init({
    theme: 'fantasy', story: 'hours', storyTitle: 'The Eleventh Hour', id: 'stair', no: 'I', title: 'The Foot of the Stair',
    go: 'Cross the square',
    intro: [
      'Gilderby is a small town with one clock. The clock is called Old Punctual, it lives at the top of the Hour Tower, and for three hundred years nothing in Gilderby has happened until it struck.',
      'Mistress Quillon has been Clock-Warden for forty-one years. Tonight, on the stroke of twelve, she hands over the key. The new Warden is thirteen, which is the usual age, and came in on the evening coach. The new Warden is you.',
      'You cross the square at what ought to be a few minutes to eleven. The tower door is shut. The Mayor is sitting beside it with a speech in his hand. And something is wrong with the dial.'
    ],
    exit: {"next":"weights","w":{"8a30fdef":"a2c9647d"}}, tags: {},
    sound: ['candle', { root: 50, bpm: 60, drop: ['mel'], beds: [['night', 0.5], ['wind', 0.3]] }],      /* a town square at night, under a clock that has stopped: the harp, no small bright notes */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('s-file') || null;

  var RULE = '<h4>THE RULE OF THE HOUR TOWER</h4><p>Whatever this clock is told to do, it does: to the letter.</p>';
  var CARD = '<h4>TO WHOEVER COMES AFTER ME</h4>' +
    '<p>The clock hears in three places: through the horn at the door, through its own levers, and under its bell.</p>' +
    '<p>What it hears as an <b>order</b>, it carries out to the letter, and not as people mean it. Tell it to hold its tongue, and it will take hold of the tongue of the bell, and strike nothing for a week.</p>' +
    '<p>What is only <b>said</b>, and not ordered, it lets pass. &ldquo;Time is short,&rdquo; said under the bell, does nothing at all. &ldquo;Cut it short&rdquo; cost us a yard of bell-rope.</p>' +
    '<p>Everywhere else in the tower, and to everybody else in the world, words mean what people mean by them.</p>' +
    '<p>Mind the difference, and mind your tongue.</p><p class="sig">W. Quillon, Warden</p>';

  function ready() { return ER.flag('s-rule') && ER.flag('s-mayor'); }
  function hints() {
    if (nextFile) return ['go', ['The door is open. The button is at the bottom of the screen.']];
    if (ready()) return ['horn', [
      'What do you need? The Mayor told you how the door is opened from above. Look at the little brass wheel over the door, and at the tag beside it.',
      'The clock does what it is told, to the letter. So do not ask for what people mean by the words: ask for what the words say. One of these orders, taken word for word, puts the end of that line into your hand.',
      'People say it when they want a short letter from a friend. Taken to the letter, it asks for a line to be let fall. Which of the five verbs lets a thing fall, and does nothing else to it?'
    ]];
    return ['start', [
      'Read what is cut in the stone over the door, and the card that hangs beside the door on a nail.',
      'Then talk to the Mayor. He has been shouting into the horn all evening, and what happened each time tells you how this clock listens. The jackdaw on the lantern is worth a word as well.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    sc.classList.toggle('line', !!nextFile); sc.classList.toggle('open', !!nextFile); sc.classList.toggle('gone', !!nextFile);
    sc.classList.toggle('nohand', !!ER.flag('s-hand'));
    $('#horn').setAttribute('class', 'hot' + (ready() && !nextFile ? ' nudge' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips((ER.flag('s-rule') ? 1 : 0) + (ER.flag('s-mayor') ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The tower door is open, and there is a light on the stair. Byword has gone up ahead of you.'); return; }
    if (ER.flag('s-mayor')) { ER.say('The foot of the Hour Tower. It is a quarter to eleven, as it has been for some time.'); return; }
    busy = true;
    ER.narrate([
      'The Hour Tower, by moonlight. High above you the great dial says a quarter to eleven. It said so when your coach came over the hill, an hour ago.',
      'And it is not only the hands. Most of the hours hang crooked on the dial, like pictures in a house where nobody dusts; and up where the XI should be, there is nothing at all.'
    ], function () { busy = false; });
  }

  /* ---------- the foot of the tower ---------- */
  $('#rule').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: RULE, cls: 'rule', clue: { id: 'rule', title: 'The Rule of the Hour Tower', kind: 'Cut in stone over the door' },
      done: function () { HRS.learn(['to the letter']); ER.flag('s-stone', 1); if (!ER.flag('s-rule')) ER.say('Twelve words, cut deep. Somebody has hung a card on a nail beside the door, in violet ink, as if twelve words were not quite enough.'); } });
  });
  $('#card').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    ER.read({ html: CARD, cls: 'card', clue: { id: 'card', title: 'To whoever comes after me', kind: 'The Warden’s card' },
      done: function () { ER.flag('s-rule', 1); HRS.learn(['to the letter', 'order', 'mind your tongue']); paint(); } });
  });
  $('#mayor').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;I am not built for stairs,&rdquo; says the Mayor. &ldquo;I shall wait here. If anybody wants me, there is a speaking-tube.&rdquo; He turns back to page one.'); return; }
    ER.talk({
      who: CAST.sable.who, role: CAST.sable.role, face: FACE('sable'),
      lines: [
        { note: 'A large man in a red robe and a gold chain, with a watch in one hand and a great many pages in the other. He stands up when he sees you, which takes a moment.',
          a: '&ldquo;The new Warden! At the eleventh hour, as they say. Though as to the eleventh hour itself&rdquo; (he looks up at the dial) &ldquo;we seem to be one short.&rdquo;' },
        { q: 'What has happened?',
          a: '<p>I wish somebody would tell me. I came at ten, to be in good time for the ceremony. At a quarter to eleven the clock stopped, and it has been a quarter to eleven ever since. My watch says so too. Every watch in Gilderby says so: they would not dare to say anything else.</p><p>I have read my speech through nine times since then. It is a twenty-minute speech. By my reckoning that makes three hours. By the clock it makes no time at all.</p>' },
        { q: 'Where is Mistress Quillon?',
          a: 'Up there, with the door shut. She comes down once in a blue moon as it is, and tonight she will not even come to the window. The latch is on the inside: she lifts it with a line from above, when she likes the look of a caller. Tonight she likes the look of nobody.' },
        { q: 'Have you tried the horn?',
          a: '<p>I have tried everything! I said &ldquo;Open up!&rdquo; and a little door opened sixty feet up, in the dial. I said &ldquo;Look here!&rdquo; and that lantern swung round and looked at me.</p><p>I said, very politely, &ldquo;Mistress Quillon, time is getting on,&rdquo; and nothing whatever happened. Then I lost my temper and said &ldquo;Give me strength!&rdquo; I should be obliged if you would not look at the arms of this bench.</p>' },
        { q: 'And the bird?',
          a: 'Byword? The Warden&rsquo;s jackdaw. He has not a word of his own: he says what he has heard said, and in forty-one years he has heard a great many proverbs. I asked him what had become of the eleventh hour. &ldquo;Time flies,&rdquo; he said. Well, there you have it. It has flown. I have had the constable looking in every tree in Gilderby.' }
      ],
      clue: { id: 'mayor', title: 'The Mayor, at the tower door', kind: 'What he said' }, last: 'Leave him to his speech',
      done: function (seen) {
        if (!seen) return;
        ER.flag('s-mayor', 1); paint(); HRS.learn(['the eleventh hour', 'once in a blue moon', 'proverb', 'jackdaw']);
        ER.say(ready() ? 'The brass horn is on the wall, to the right of the door.' : 'The Mayor goes back to his speech. There is a stone with writing on it over the door, and a card on a nail beside it.');
      }
    });
  });
  $('#daw').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (ER.flag('s-daw')) { ER.wordAt(e.clientX, e.clientY, 'jackdaw'); ER.say('Byword puts his head on one side. &ldquo;' + HRS.said('will') + '&rdquo; he says again, in the old woman&rsquo;s voice, and looks at the horn.'); return; }
    ER.talk({
      who: CAST.byword.who, role: CAST.byword.role, face: FACE('byword'),
      lines: [
        { note: 'A jackdaw on the lantern bracket: black, with a grey hood, and one pale eye turned on you. He looks like a small clerk who has seen a great many callers and thought little of most of them.',
          q: 'What has happened to the clock?', a: '&ldquo;' + HRS.said('fly') + '&rdquo;' },
        { note: 'He says it in an old woman&rsquo;s voice, dry and exact. It is not an answer. It is something he has heard said.',
          q: 'Will the Warden let me in?', a: '&ldquo;' + HRS.said('deaf') + '&rdquo;' },
        { q: 'Then how do I get in?', a: '&ldquo;' + HRS.said('will') + '&rdquo;' },
        { note: 'He looks at the brass horn by the door. Then he looks at you. It is the look of a bird that has said all it is going to say, and thinks it was plenty.' }
      ],
      last: 'Leave him',
      done: function (seen) {
        if (!seen) return;
        ER.flag('s-daw', 1); HRS.byword('fly', true); HRS.byword('deaf', true); HRS.byword('will'); HRS.learn(['proverb', 'jackdaw']);
        ER.say('Three questions, three proverbs. He has not told you anything. But he has not said nothing, either.');
      }
    });
  });
  $('#horn').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (nextFile) { ER.say('The horn has gone quiet. The clock got an order that it could carry out, and seems to be thinking about that.'); return; }
    if (!ready()) { ER.wordAt(e.clientX, e.clientY, 'horn'); ER.say('A brass horn in the wall. CALLERS: SPEAK TO THE CLOCK. Before you say anything at all to this clock, it might be wise to read what hangs by its door, and to hear what the Mayor has tried.', 8000); return; }
    openHorn();
  });
  HRS.thing('#dial', 'dial', 'A quarter to eleven. XII and VI are where they belong. Nine others hang crooked, and the eleventh hour is not there at all.', isBusy);
  HRS.thing('#lil', null, function () { return ER.flag('s-hand') ? 'The callers&rsquo; clock, over the door. It had one hand. You have it.' : 'A small clock over the door, for callers. It has one hand, and that says a quarter to eleven as well.'; }, isBusy);
  HRS.thing('#pulley', null, function () { return nextFile ? 'The door line, hanging where the clock dropped it.' : 'A little brass wheel in the wall above the door, far out of reach, and a tag: DOOR LINE. The line itself is rolled up inside.'; }, isBusy);
  HRS.thing('#door', null, function () { return nextFile ? 'The door of the Hour Tower, open. A hundred and thirty-two steps, the Mayor says. He has counted them once, and does not mean to do it again.' : 'Oak, iron, and no keyhole. The latch is on the inside.'; }, isBusy);
  HRS.thing('#lantern', 'lantern', 'The door lantern. It has turned itself to face the Mayor, and will not turn back.', isBusy);
  HRS.thing('#moon', null, 'A white moon, three days from full. Not a blue one.', isBusy);
  HRS.thing('#roofs', null, 'The roofs of Gilderby. There is a light in every window: nobody in the town can go to bed until it is eleven.', isBusy);
  HRS.thing('#bench', null, 'An iron bench. Both of its arms have been bent outwards, like the handles of a jug, by somebody who was given strength and did not know what to do with it.', isBusy);

  /* ---------- the horn ---------- */
  var VERBS = [['give', 'Give'], ['lend', 'Lend'], ['spare', 'Spare'], ['show', 'Show'], ['drop', 'Drop']];
  var OBJS = [['hand', 'a hand'], ['minute', 'a minute'], ['door', 'the door'], ['ropes', 'the ropes'], ['line', 'a line']];
  var SAY = {
    'give-hand': 'The callers&rsquo; clock over the door has one hand. It unscrews itself and lands in your palm. People who say that want help. The clock has given you a hand.',
    'lend-hand': 'The hand of the callers&rsquo; clock comes down on a thread, rests in your palm for a moment, and goes up again. People who say that want help. The clock has lent you a hand, and a loan is a loan.',
    'spare-hand': 'The clock thinks about it. It has not a hand to spare: the great dial needs both of its own.',
    'show-hand': 'Sixty feet up, the great minute hand gives a small stiff wave. You have been shown a hand.',
    'drop-hand': 'Something long and black shifts on the great dial, far above your heads. &ldquo;Not that!&rdquo; cries the Mayor, and you both step back. The clock seems to think better of it.',
    'give-minute': 'Something small and bright falls out of the horn into your hand: a minute. It is still warm. People who say that mean &ldquo;wait for me&rdquo;. Before you can think what to do with it, it is over.',
    'lend-minute': 'The clock lends you a minute. You stand there for it. Then the clock takes it back, and you are exactly where you were.',
    'spare-minute': 'The clock has every minute in Gilderby, and nothing to do with any of them. One drops out of the horn. It is over before it lands.',
    'show-minute': 'The great minute hand twitches, to show you where a minute would be if there were one. It is still a quarter to eleven.',
    'drop-minute': 'A minute drops out of the horn, bounces once, and is gone down a crack between the stones.',
    'give-door': 'The clock would give you the door if it could, hinges and all. You can hear the hinges trying. Mistress Quillon&rsquo;s bolts are better than that.',
    'lend-door': 'What would you do with the loan of a door? The clock does not ask. It only fails to get it off its hinges.',
    'spare-door': 'The tower has one door, and cannot spare it.',
    'show-door': 'The lantern swings round on its bracket and shines full on the door. There it is: every nail of it. People who say that mean &ldquo;make me leave&rdquo;. The clock has shown you the door, and the door is still shut.',
    'drop-door': 'The door shakes in its frame, as if something would very much like to drop it. The bolts hold.',
    'give-ropes': 'Far up in the dark, three bell-ropes swing towards you, and stop. They are tied to the bells, and the clock cannot give away what is tied.',
    'lend-ropes': 'The bell-ropes swing, and stop. They are tied to the bells, and a thing that is tied cannot be lent.',
    'spare-ropes': 'Three bells, three ropes. None to spare.',
    'show-ropes': 'High in the tower a shutter opens, and for a moment the moon shows you three bell-ropes hanging in the dark, a long way out of reach. People who say that want to be taught a job. The clock has shown you the ropes.',
    'drop-ropes': 'The bell-ropes dance about, sixty feet up. They are made fast to the bells with forty-one years of the Warden&rsquo;s knots, and they stay where they are.',
    'give-line': 'Something falls out of the dark and lands in a coil at your feet: the door line, the whole of it. The clock has given it to you. It is yours now, and it is not fastened to anything. Byword looks at it, takes one end in his beak, and flies it back up to its wheel. He does not look pleased.',
    'lend-line': 'The end of the door line comes down to the height of your hand. You take hold. The clock counts three and takes it back: a loan is a loan.',
    'spare-line': 'The clock has one door line, and cannot spare it.',
    'show-line': 'The lantern swings up and shines on the little brass wheel above the door, and on the end of a line beside it. You have been shown a line. It is exactly as far away as it was.'
  };
  function openHorn() {
    var box = ER.el('div', 'hn'), v = null, o = null, done = false, s;
    s = '<h4>The callers&rsquo; horn</h4><h5>SPEAK TO THE CLOCK &middot; IT DOES WHAT IT IS TOLD</h5><div class="hn-rows"><div class="hn-col" id="hn-v">';
    VERBS.forEach(function (x) { s += '<button type="button" data-k="' + x[0] + '">' + x[1] + '</button>'; });
    s += '</div><div class="hn-me">me</div><div class="hn-col" id="hn-o">';
    OBJS.forEach(function (x) { s += '<button type="button" data-k="' + x[0] + '">' + x[1] + '</button>'; });
    s += '</div></div><div class="hn-say"></div><div class="hn-foot"><button type="button" class="btn" id="hn-go">Say it into the horn</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg'), sayEl = box.querySelector('.hn-say');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function draw() {
      ER.$$('#hn-v button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-k') === v); });
      ER.$$('#hn-o button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-k') === o); });
      var vw = '&hellip;', ow = '&hellip;';
      VERBS.forEach(function (x) { if (x[0] === v) vw = x[1]; }); OBJS.forEach(function (x) { if (x[0] === o) ow = x[1]; });
      sayEl.innerHTML = ER.gloss('&ldquo;' + vw + ' me ' + ow + '.&rdquo;');      /* dotted: what people mean by it can be looked up. What the clock does with it is another matter */
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.hn-col button') : null; if (!b || done) return;
      if (b.parentNode.id === 'hn-v') v = b.getAttribute('data-k'); else o = b.getAttribute('data-k');
      ER.sfx.click(); draw();
    });
    box.querySelector('#hn-go').addEventListener('click', function () {
      if (done) return;
      if (!v || !o) { msg('An order wants a verb and a thing. Choose one from each side.'); return; }
      var key = v + '-' + o, file = ER.exitOk([key]);
      if (file) {
        done = true; nextFile = file; ER.flag('s-file', file); HRS.done('stair'); busy = true; HRS.sfx.rattle();
        msg('The horn hums. Somewhere over your head, something begins to rattle.');
        setTimeout(function () { ER.closeAll(); HRS.solved(); opened(); }, 1900);
        return;
      }
      HRS.slip(); HRS.sfx.hm();
      if (key === 'give-hand') { ER.flag('s-hand', 1); sc.classList.add('nohand'); }
      msg(SAY[key] + (HRS.slips() === 1 ? ' <i>On the lantern bracket, Byword makes a small dry noise, like somebody counting.</i>' : ''));
    });
    draw();
    msg('The horn is cold, and smells of brass polish. The clock is listening. It has been listening to the Mayor all evening.');
    ER.open('ov-lock', box);
  }
  function opened() {
    sc.classList.add('line');
    ER.narrate([
      'Out of the wall above the door comes the end of a line. It runs down the oak, rattling, and stops in front of your nose. People who say those words want a letter. The clock has dropped you a line.',
      'You pull. Inside, a latch lifts.'
    ], function () {
      sc.classList.add('open'); HRS.sfx.door();
      ER.narrate([
        '&ldquo;Remarkable,&rdquo; says the Mayor. &ldquo;I asked it for strength. You asked it for string.&rdquo; He writes something in the margin of his speech.',
        'Byword drops off the lantern, goes in over your head, and is gone up the stair. You can hear him all the way up, saying something to himself about a will and a way.'
      ], function () {
        HRS.mine('n-stair', 'How the clock listens', '<p>It does what it is TOLD: an order, word for word.</p><p>&ldquo;Drop me a line&rdquo; = write to me. The clock dropped a line.</p><p>What is only SAID (&ldquo;time is getting on&rdquo;) does nothing.</p><p>Byword only SAYS things. So far.</p>');
        busy = false; sc.classList.add('gone'); paint();
      });
    });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
