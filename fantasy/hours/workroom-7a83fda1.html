  .wb-b{padding:14px 18px 14px;background:#4a2f1a linear-gradient(170deg,#6a4526,#3a2210);border:7px solid #1c1109;border-radius:6px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,201,120,.2)}
  .wb-pic{display:block;width:100%;height:150px;background:#2a190d;border:1px solid rgba(255,201,120,.3);margin-bottom:10px}
  .wb-h{margin:8px 0 4px;font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.2em;color:#e6c79a}

    box-shadow:inset 0 2px 0 rgba(255,245,200,.55)}
  .wb-row button:hover{border-color:#fff3c8}
  .wb-jars button{border-radius:8px 8px 3px 3px;background:linear-gradient(#f4ecd4,#d9cfb0);border-color:#6f8f6a;color:#3b2a5c;font-style:italic}
  .wb-jars button.on{background:linear-gradient(#fff,#ffe9a8);border-color:#fff;box-shadow:0 0 0 3px rgba(255,214,110,.45)}
  .wb-ask{margin:6px 0 0;padding:9px 12px;border-radius:4px;background:rgba(0,0,0,.4);display:none}
  .wb-ask.on{display:block}
  .wb-ask p{margin:0 0 7px;font-family:'IM Fell English',Georgia,serif;font-size:17px;line-height:1.3;color:#fbf0dd}
  .wb-ask .btn{--accent:#ffe2a0;font-size:12.500px;padding:6px 12px;margin-right:8px}
  .wb .pmsg{min-height:96px;margin-top:8px;font-size:17px;line-height:1.3}
  #pb-swirl{opacity:0}
  #pb-swirl.go{animation:sw .8s ease-out}
  @keyframes sw{0%{opacity:.9;transform:rotate(0deg)}100%{opacity:0;transform:rotate(200deg)}}
  #pb-swirl.go.acw{animation-name:swa}
  @keyframes swa{0%{opacity:.9;transform:rotate(0deg)}100%{opacity:0;transform:rotate(-200deg)}}
  #pb-swirl{transform-origin:150px 74px}
  #pb-flame{transform-origin:150px 128px;animation:cf 1.4s ease-in-out infinite}
  @media (max-width:900px){.wb{grid-template-columns:1fr}}
</style>

  ER.init({

    '<p><b>2.</b><span>Then put in a pinch of salt.</span></p>' +
    '<p><b>3.</b><span>Pour in spare time until the pan is half full.</span></p>' +

    '<p class="pen">I have never needed this. And the Words are an order: better lost. W.Q.</p>';

  function hints() {
    if (nextFile) return ['go', ['The pan is ready, and it must go up while it is hot. The ladder is on the right; the button is at the bottom of the screen.']];
    if (ER.flag('k-read')) return ['cook', [
      'A receipt is a list of orders with small words in them: first, then, while, until, before, once. Every one of those words is about WHEN. Find the step where you have to be quick, and the two where you have to wait.',
      'Measures matter: a pinch is not a spoonful, half full is two quarters, twice is not three times. And this room is not one of the three places where the clock hears. So when the receipt says &ldquo;kill time&rdquo;, who is it talking to, and what do people mean by it?',
      'Light the lamp, and wait for the pan. A pinch of salt. Spare time, up to the half. Two stirs clockwise, and then three drops of grease at once, before the pan settles. Then simply wait until the pin falls; stir once the other way; and take the pan off. And let nobody help you: the wall says why.'

    return ['start', [
      'The receipt book is open on the left of the bench. Read all of it before you touch anything: one of its steps will not wait for you.',

  }
  function isBusy() { return busy; }

  }

  /* ---------- the room ---------- */

  });
  $('#bench').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The pan is the colour of an old penny, and smells of rain on a hot road. It is ready.'); return; }

  $('#dawW').addEventListener('click', function (e) {

    ER.say(nextFile ? 'Byword is looking up the ladder. He has gone very quiet, for a bird with a hundred sayings.' : 'Byword is on the top shelf, with one eye on the spoon. &ldquo;' + HRS.said('hands') + '&rdquo; he says, hopefully.');
  });
  HRS.thing('#jars', 'jar', 'SPARE TIME, LOST TIME, BORROWED TIME, HALF A MO, TWO SHAKES, FORTY WINKS. And one on the bottom shelf that says only STRING. Mistress Quillon labels everything.', isBusy);
  HRS.thing('#sampler', 'sampler', 'A sampler in a frame: TOO MANY COOKS SPOIL THE BROTH, in red wool, worked by T. Orrin, Warden, 1861. So that is whose cross old voice Byword keeps.', isBusy);
  HRS.thing('#tubeW', 'speaking-tube', function () { return nextFile ? '&ldquo;What are the Words?&rdquo; says the tube. Nobody answers it.' : '&ldquo;Is there anything that I can do?&rdquo; says the Mayor&rsquo;s voice in the speaking-tube. &ldquo;I am a great believer in helping.&rdquo;'; }, isBusy);

  /* ---------- the bench ---------- */

    c = fresh();
    s = '<div class="doc receipt">' + ER.gloss(RECEIPT) + '</div><div class="wb-b">' + PIC +
      '<div class="wb-h">THE LAMP AND THE PAN</div><div class="wb-row"><button type="button" data-a="lamp">Light the lamp</button><button type="button" data-a="off">Take the pan off the lamp</button></div>' +
      '<div class="wb-h">A JAR FROM THE SHELF &hellip;</div><div class="wb-row wb-jars">' + JARS.map(function (j) { return '<button type="button" data-j="' + j[0] + '">' + j[1] + '</button>'; }).join('') + '</div>' +
      '<div class="wb-h">&hellip; AND HOW MUCH OF IT</div><div class="wb-row">' + MEAS.map(function (m) { return '<button type="button" data-m="' + m[0] + '">' + m[1] + '</button>'; }).join('') + '</div>' +
      '<div class="wb-h">THE SPOON, THE STOOL, THE LITTLE LEVER</div><div class="wb-row"><button type="button" data-a="cw">Stir clockwise</button><button type="button" data-a="acw">Stir anticlockwise</button><button type="button" data-a="wait">Sit and wait</button><button type="button" data-a="lever">Pull KILL TIME</button></div>' +
      '<div class="wb-ask"><p></p><button type="button" class="btn" data-y="1"></button><button type="button" class="btn" data-y="0"></button></div><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg'), askEl = box.querySelector('.wb-ask');
    function q(id) { return box.querySelector(id); }
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function clearT() { timers.forEach(clearTimeout); timers = []; }
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function draw() {
      q('#pb-liq').setAttribute('y', 92 - c.level * 10); q('#pb-liq').setAttribute('height', c.level * 10);
      q('#pb-liq').setAttribute('fill', c.drops >= 3 ? '#b9824a' : '#9ad0c8');
      q('#pb-flame').style.display = c.lit ? '' : 'none';
      q('#pb-candle').setAttribute('y', 44 + c.burnt * 16); q('#pb-candle').setAttribute('height', 80 - c.burnt * 16);
      q('#pb-cfl').setAttribute('transform', 'translate(0 ' + c.burnt * 16 + ')');
      q('#pb-pin').setAttribute('transform', c.burnt >= 3 ? 'translate(-26 36) rotate(20 386 90)' : '');
      q('#pb-note').textContent = !c.lit ? 'The lamp is out. The pan is cold.' : c.warming ? 'The pan is warming …' : c.n >= 6 ? 'The pin has dropped.' : 'The pan is warm.';
      ER.$$('.wb-jars button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-j') === jar); });
    }
    function swirl(dir) { var e = q('#pb-swirl'); e.setAttribute('class', ''); void e.getBoundingClientRect(); e.setAttribute('class', 'go' + (dir === 'acw' ? ' acw' : '')); }
    function ask(text, yes, no, onYes, onNo) {
      pending = text ? { y: onYes, n: onNo } : null; askEl.classList.toggle('on', !!text); if (!text) return;
      askEl.querySelector('p').innerHTML = ER.gloss(text); askEl.children[1].textContent = yes; askEl.children[2].textContent = no;
    }
    function spoil(text) {
      clearT(); HRS.slip(); HRS.sfx.hiss(); c = fresh(); asked = {}; ask(null); draw();
      msg(text + ' <i>You put out the lamp, scrape out the pan, set up a new candle, and begin again from the first word.</i>');
    }
    function ok(tag, key) { if (!ER.check(tag, key)) return false; c.log.push(key); return true; }
    function offerDaw() {
      HRS.sfx.caw();
      ask('Byword has come down off the shelf, and he has the spoon in his beak. &ldquo;' + HRS.said('hands') + '&rdquo; he says, round the handle of it.', 'Let him stir', 'Take the spoon back',
        function () { spoil('Byword stirs. He stirs rather well. But the receipt is for one cook and one spoon: the pan goes grey, and smells of wet feathers. &ldquo;' + HRS.said('cooks') + '&rdquo; says Byword, in the cross old voice. It seems to be the first time that he has understood it.'); },
        function () { msg('You take the spoon back. Byword goes up to his shelf again, and looks at the sampler on the wall for some time.'); });
    }
    function offerMayor() {
      ask('&ldquo;I could come up and watch the candle for you,&rdquo; says the Mayor&rsquo;s voice in the speaking-tube. &ldquo;Or give it a stir. I am a great believer in helping.&rdquo;', 'Yes, please', 'No, thank you',
        function () { spoil('The Mayor comes up. It takes him some time. He gives the pan a stir &ldquo;to keep it going&rdquo;; and the receipt is for one cook and one spoon. &ldquo;' + HRS.said('cooks') + '&rdquo; says Byword. The Mayor says that at the winding it was the other way about. It was.'); },
        function () { msg('&ldquo;No, thank you, Mr Sable. Not this time.&rdquo; The tube sighs. You go on waiting.'); });
    }
    function settle() { later(function () { if (!done && c.n <= 4 && c.drops < 3) spoil(SETTLED); }, 10000); }
    function finish() {
      var file = ER.exitOk([c.log.join('>')]);
      if (!file) { msg('The pan goes cold in your hands. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; clearT(); nextFile = file; ER.flag('k-file', file); HRS.done('workroom'); busy = true; c.lit = false; draw();
      msg('You lift the pan off the lamp, and wrap a cloth round the handle. It is hot, and heavy, and it hums.');
      setTimeout(function () { ER.closeAll(); HRS.solved(); made(); }, 2400);
    }
    function step(a) {
      var stir = a.k === 'cw' || a.k === 'acw';
      switch (c.n) {
      case 0:
        if (a.k !== 'lamp') { HRS.slip(); msg('The lamp is not lit, and the pan is as cold as a key. <i>&ldquo;First&rdquo; is the first word of the receipt.</i>'); return; }
        ok('a1', 'lamp'); c.lit = true; c.warming = true; HRS.sfx.flint(); draw(); msg('The lamp lights with a small blue pop. The pan begins to warm.');
        later(function () { c.warming = false; c.n = 1; draw(); msg('The pan is warm. You can smell the iron.'); }, 4200);
        return;
      case 1:
        if (a.k === 'lamp') { msg('The lamp is lit already.'); return; }
        if (a.k !== 'add') { spoil('&ldquo;Then put in a pinch of salt.&rdquo; That comes second, and you have done something else second.'); return; }
        if (ok('a2', a.j + ':' + a.m)) { c.n = 2; draw(); msg('A pinch of salt: as much as you can hold between one finger and a thumb. It hisses on the iron.'); return; }
        spoil(a.j !== 'salt' ? 'That was not salt; and salt is what the receipt asks for second.' : a.m === 'spoon' ? 'A spoonful is not a pinch. A pinch is what you can hold between one finger and a thumb.' : 'Salt does not come in drops, and nobody pours a pinch.');
        return;
      case 2:
        if (a.k === 'add' && a.m === 'pour') {
          if (a.j === 'notime') { msg('The jar says NO TIME, and that is exactly what is in it. Nothing comes out.'); return; }
          if (a.j !== 'spare') { spoil(a.j === 'lost' ? 'That was lost time. Nothing was ever made with lost time.' : a.j === 'borrowed' ? 'That was borrowed time, and sooner or later it has to be given back. The pan goes thin and grey.' : 'That is not a thing that pours.'); return; }
          c.level++; HRS.sfx.pour(); draw();
          if (c.level > 2) { spoil('It is over the half-way mark. &ldquo;Until the pan is half full&rdquo; has an end, and you have gone past it.'); return; }
          if (c.level < 2) { msg('Spare time is thin and clear, and smells of a Sunday afternoon. The pan is a quarter full.'); return; }
          msg('The pan is half full, to the mark.');
          if (!asked.daw) { asked.daw = 1; offerDaw(); }
          return;
        }
        if (c.level === 2 && ok('a3', 'spare:2')) { c.n = 3; step(a); return; }
        spoil(a.k === 'add' ? 'Spare time, the receipt says; and time is poured, not pinched.' : 'The pan is not half full. &ldquo;Until&rdquo; means: go on, and stop exactly there.');
        return;
      case 3:
        if (stir) {
          c.stirs.push(a.k); HRS.sfx.stir(); swirl(a.k);
          if (c.stirs.length > 2) { spoil('Twice, the receipt says. That was three times.'); return; }
          if (c.stirs.length === 2) { settle(); msg('Round, and round again. The pan is turning by itself now, and slowing.'); } else msg('Once round.');
          return;
        }
        if (ok('a4', (c.stirs[0] === c.stirs[1] ? c.stirs[0] : 'mixed') + ':' + c.stirs.length)) { c.n = 4; step(a); return; }
        spoil(c.stirs.length !== 2 ? 'Twice, the receipt says; and it says so before anything else goes in.' : 'Clockwise, the receipt says: the way the hands of a clock go round, seen from the square. It has curdled.');
        return;
      case 4:
        if (a.k === 'add' && a.j === 'grease' && a.m === 'drop') {
          c.drops++; ER.sfx.drip(); draw();
          if (c.drops > 3) { spoil('Three drops. That was four.'); return; }
          if (c.drops === 3) { clearT(); HRS.byword('early'); msg('Three drops, and the pan has not stopped turning. It goes the colour of an old penny. &ldquo;' + HRS.said('early') + '&rdquo; says Byword.'); }
          else msg(c.drops === 1 ? 'One.' : 'Two.');
          return;
        }
        if (a.k === 'add') { spoil(a.j === 'grease' ? 'Elbow grease is thick. It comes in drops, and the receipt wants three of them.' : 'The receipt asks for elbow grease now, and for nothing else.'); return; }
        if (ok('a5', 'grease:' + c.drops)) { c.n = 5; step(a); return; }
        spoil(c.drops ? 'Three drops, the receipt says. Count them as they fall.' : '&ldquo;Before it settles,&rdquo; the receipt says; and the grease has not gone in.');
        return;
      case 5:
        if (a.k === 'wait') {
          c.burnt++; draw();
          if (c.burnt === 1) { msg('You sit on the stool and watch the candle. Nothing happens, rather slowly.'); if (!asked.mayor) { asked.mayor = 1; offerMayor(); } return; }
          if (c.burnt === 2) { HRS.byword('pot'); msg('You count the jars. There are fifteen. You count them again. &ldquo;' + HRS.said('pot') + '&rdquo; says Byword.'); return; }
          ok('a6', 'wait'); HRS.sfx.pin(); c.n = 6; draw();
          msg('The flame reaches the pin, and the pin falls into the dish: <i>ting</i>. People who talk of killing time mean exactly what you have just done: nothing much, until it was time.');
          return;
        }
        if (a.k === 'lever') { HRS.sfx.lever(); spoil(LEVER); return; }
        spoil(stir ? '&ldquo;Once the pin has dropped, and not before.&rdquo; The pin is still in the candle.' : a.k === 'off' ? 'Taken off now, it is only warm salt water. The candle has not reached its pin.' : 'Nothing more goes in. Step 5 asks for one thing only, and it is the easiest thing in the world.');
        return;
      case 6:
        if (stir) {
          c.last.push(a.k); HRS.sfx.stir(); swirl(a.k);
          if (c.last.length > 1) { spoil('Once more, the receipt says. Not twice more.'); return; }
          msg('Once round.'); return;
        }
        if (ok('a7', (c.last[0] || 'none') + ':' + c.last.length)) { c.n = 7; step(a); return; }
        spoil(c.last.length ? 'The other way, the receipt says: the other way from the first stirring.' : '&ldquo;Stir once more&rdquo; comes before the pan is taken off, and before anything else.');
        return;
      default:
        if (a.k !== 'off' || !ok('a8', 'off')) { spoil('Nothing more goes in, and nothing more is done to it. The last order is the one about the lamp.'); return; }
        finish();
      }
    }
    function act(a) {
      if (done) return;
      if (pending) { msg('Somebody has just offered to help you, and is waiting for an answer.'); return; }
      if (c.warming) {
        if (a.k === 'wait') { msg('You sit on the stool and do nothing at all. The pan ticks as it warms.'); return; }
        spoil(WHILE); return;
      }
      if (a.k === 'lever' && c.n !== 5 && !(c.n === 4 && c.drops === 3)) { HRS.sfx.lever(); msg('You pull the little lever. Somewhere below, something goes clunk. Nothing in the tower was moving in any case.'); return; }
      if (a.k === 'wait' && c.n < 3) { msg('You sit on the stool for a while. Nothing in the receipt has asked you to.'); return; }
      step(a);
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b || done) return;
      if (b.hasAttribute('data-y')) { var p = pending; if (!p) return; ask(null); (b.getAttribute('data-y') === '1' ? p.y : p.n)(); return; }
      if (b.hasAttribute('data-j')) { jar = jar === b.getAttribute('data-j') ? null : b.getAttribute('data-j'); ER.sfx.glass(); draw(); return; }
      if (b.hasAttribute('data-m')) { if (!jar) { msg('Take a jar down from the shelf first: then say how much of it.'); return; } act({ k: 'add', j: jar, m: b.getAttribute('data-m') }); return; }
      if (b.hasAttribute('data-a')) act({ k: b.getAttribute('data-a') });
    });
    draw();
    msg('The lamp is out, the pan is clean, and the candle is new. The spoon is in your hand.');
    ER.open('ov-lock', box, function () { clearT(); if (!done && !nextFile && c.n) ER.say('You cannot leave a pan on a lamp. You put it out and tip it away; the bench will be as it was when you come back.'); });
  }
  function made() {
    sc.classList.add('made');
    ER.narrate([
      'The receipt was written for a cook, in the one room where the clock cannot hear. So you read it as people mean it: you killed time by waiting, and you let nobody help.',
      '&ldquo;Is it done?&rdquo; says the speaking-tube. &ldquo;Then what are the Words?&rdquo; &ldquo;They are an order,&rdquo; you say, &ldquo;and somebody has cut them off the page.&rdquo;',
      '&ldquo;Then who in the world knows them?&rdquo; says the Mayor. On the top shelf, Byword puts his head under his wing.'
    ], function () {
      HRS.learn(['kill time', 'elbow grease', 'a pinch']);
      HRS.mine('n-work', 'The receipt, and the other proverb', '<p>The receipt was for a COOK, not for the clock: &ldquo;kill time&rdquo; = wait.</p><p>Here the wall said TOO MANY COOKS. One cook, one spoon.</p><p>The Words are an ORDER, to be said under the bell. They were cut off the page.</p><p>Byword says what he has heard said.</p>');
      busy = false; paint();
    });
  }

  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
