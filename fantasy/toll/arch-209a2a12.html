<style>

  .tk-name{font-size:24px}
  .shim{stroke-dasharray:34 110;animation:shim 7s linear infinite}
  .shim:nth-child(2n){animation-duration:9.5s;stroke-dasharray:22 84}
  .shim:nth-child(3n){animation-duration:5.5s}
  @keyframes shim{to{stroke-dashoffset:-144}}
  #refl{animation:refl 3.2s steps(4) infinite}
  @keyframes refl{50%{opacity:.6}}
  #lanGlow{animation:lg 3.8s steps(4) infinite}
  @keyframes lg{50%{opacity:.8}}
  .drip{animation:drip 4.2s linear infinite;opacity:0}
  .drip:nth-child(2){animation-delay:-1.6s;animation-duration:5.3s}.drip:nth-child(3){animation-delay:-3.1s;animation-duration:6.1s}
  @keyframes drip{0%{transform:translateY(0);opacity:0}6%{opacity:.9}62%{transform:translateY(590px);opacity:.9}64%,100%{transform:translateY(590px);opacity:0}}
  .stone .num{fill:#2d3531}
  .stone.next .slab{animation:nudge 1.7s ease-in-out infinite}
  .stone.done .num{fill:#f0e2a0}
  .stone.done .face{fill:url(#slabLit)}
  .stone.done .cut{stroke:#5d6a5e}

  /* a riddle on its stone */
  .rs{display:grid;grid-template-columns:minmax(0,640px) 380px;gap:26px;width:min(1050px,96vw);align-items:start}
  .rs-stone{position:relative;padding:20px 44px 22px;background:#6b716a linear-gradient(160deg,#8d948c,#525852);color:#f3f4ea;border-radius:170px 170px 8px 8px / 76px 76px 8px 8px;
    box-shadow:0 26px 70px rgba(0,0,0,.75),inset 0 0 0 3px rgba(255,255,255,.08);text-shadow:0 -1px 0 rgba(0,0,0,.55)}
  .rs-stone.grind{animation:grind .9s}
  @keyframes grind{0%{transform:rotate(0)}20%{transform:rotate(-1.4deg) translateX(-5px)}45%{transform:rotate(1.2deg) translateX(5px)}70%{transform:rotate(-.6deg) translateX(-2px)}100%{transform:rotate(0)}}
  .rs-stone h4{margin:0 0 6px;text-align:center;font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700;font-size:34px;line-height:1;color:#d7dccf}
  .rs-text{margin:0;font-family:'Almendra',serif;font-size:25px;line-height:1.36;text-align:center}
  .rs-text .wk-w{padding:0 1px}
  .rs-text .w{border-bottom-color:rgba(243,244,234,.55)}
  .rs-text .rs-piv{display:inline-block;padding:0 6px;background:#eef3c8;color:#2b3028;text-shadow:none;border-radius:3px}
  .rs-how{margin:14px 0 0;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:#e3ebcf;line-height:1.5}
  .rs-ans{display:none;margin-top:12px;padding-top:14px;border-top:1px solid rgba(240,240,230,.35)}
  .rs-stone.turned .rs-ans{display:block}
  .rs-bowl{display:flex;justify-content:center;align-items:center;flex-wrap:wrap}
  .rs-coin{width:40px;height:40px;margin:0 3px;border-radius:50%;border:2px dashed rgba(240,240,230,.5);background:transparent}
  .rs-coin.on{border:0;background:radial-gradient(circle at 34% 30%,#f2b780,#9a4f1c 70%);box-shadow:0 3px 5px rgba(0,0,0,.5),inset 0 0 0 3px rgba(90,40,10,.45)}
  .rs-coin:hover{outline:2px solid #eef3c8;outline-offset:1px}
  .rs-count{margin:8px 0 0;text-align:center;font-family:'Almendra',serif;font-weight:700;font-size:20px}
  .rs-foot{display:flex;justify-content:center;margin-top:10px}
  .rs-foot .btn{--accent:#f3f4ea}
  .rs .wk{--wk-size:34px;--wk-font:'Cinzel',serif;--wk-ink:#f3f4ea;--wk-line:rgba(240,240,230,.6);font-weight:700}
  .rs .wk-typed{margin:0 auto;max-width:420px}
  .rs .wk-board{margin-top:10px}
  .rs-side .pmsg{margin-top:14px;min-height:150px}
  @media (max-width:900px){.rs{grid-template-columns:1fr}}
</style>

  (function () {
    var s = '', i, x, y, t, u, px, py, dx, dy, n, seed = 7;

    }
    $('#stars').innerHTML = s; s = '';
    for (i = 0; i < 90; i++) {
      x = -200 + rnd() * 2000; y = 722 + rnd() * 190;
      s += '<ellipse cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" rx="' + (5 + rnd() * 12).toFixed(0) + '" ry="' + (2.5 + rnd() * 4).toFixed(1) + '" fill="' + (rnd() < 0.5 ? '#283334' : '#34423f') + '"/>';
    }
    $('#pebbles').innerHTML = s; s = '';
    for (i = 0; i < 11; i++) {                                   /* the stones of the arch: one half, and the same again in the mirror */

      py = u * u * u * 560 + 3 * u * u * t * 250 + 3 * u * t * t * 96 + t * t * t * 96;

  })();

  ER.init({
    theme: 'fantasy', story: 'toll', storyTitle: 'The Keeper Gives No Change', id: 'arch', no: 'II', title: 'Under the Arch',
    go: 'Follow him down',
    intro: [
      'One penny for you, because you were on foot and long past seven. Nothing for Mabel, because the Table asks a penny for each leg that <i>walks</i> upon the bridge, and hers were not walking. Three for the cart, because the Table says &ldquo;each wheel&rdquo;, and a spare wheel is a wheel. Nothing for nine cheeses, because the Keeper takes one in every <i>ten</i>. Four pennies: and no change from your sixpence.',
      'So your toll is paid, the lamp is lit, and the gate is shut until day begins.',
      'The Keeper takes a lantern and goes down a stair in the bank that you had not noticed, to the dark place under the first arch, where the river talks to itself. The Riddles, it seems, are kept in the cellar.'
    ],
    exit: {"next":"counting","w":{"0e8eeb3d":"34eca58c"}}, tags: {"r3":["5ed9ad8d","350ecc9d","be58584d","b7b502cc","e3337197","edf7d0ce","881b4465","f2a79b25","f9a6decc","424d3405","e24fd8db","40c59ba3","3a7916fe","cd8247c8"],"r3@":["0143aedf","6cee918a","a7b6a36e","5ad723b5"],"r3?":["5b77f0cb","f4f35448","63184b24","5682c599"],"r3#":["06ca0c9b"],"p1":["66fb0d0c"],"a1":["206c404b"],"p2":["84353f1b"],"a2":["3e8b73da"],"p3":["7ae658d5"]},

    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('a-file') || null;
  var st = ER.flag('a-st') || { n: 0, piv: false, pw: '', pn: -1, got: [] };

  var TABLE = '<h4>The Table of Tolls</h4><h5>STICKLE BRIDGE &middot; SPANDREL, KEEPER</h5>' +
    '<p><b>I.</b><span>Every traveller who crosses on foot shall pay one penny.</span></p>' +
    '<p><b>II.</b><span>For every beast or bird: one penny for each leg that walks upon the bridge.</span></p>' +
    '<p><b>III.</b><span>For every cart: one penny for each wheel, unless the cart is empty.</span></p>' +
    '<p><b>IV.</b><span>Of goods carried for sale the Keeper shall have one in every ten, and shall choose it himself.</span></p>' +
    '<p><b>V.</b><span>A child shall pay nothing until the age of seven.</span></p>' +
    '<p><b>VI.</b><span>No toll is taken by lamplight.</span></p>' +
    '<p><b>VII.</b><span>The Keeper gives no change.</span></p>';

  var RID = [
    { no: 'I', name: 'the geese', piv: 'p1', ans: 'a1', kind: 'coins',
      text: 'Five geese came down the road to my gate. All but two of them opened their wings and flew away over the water. The others walked across my bridge. How many pennies did I take for geese that day?',
      wrongW: { five: '&ldquo;Five is how many came. The riddle does not turn there.&rdquo;',
        two: '&ldquo;You are one word away. Which little word tells you what to do with the two?&rdquo;',
        all: '&ldquo;You are one word away, on the other side of it.&rdquo;',
        flew: '&ldquo;They flew: that much is plain. <i>Who</i> flew is the question.&rdquo;', wings: '&ldquo;They flew: that much is plain. <i>Who</i> flew is the question.&rdquo;',
        others: '&ldquo;And who are &lsquo;the others&rsquo;? An earlier word decides that.&rdquo;', walked: '&ldquo;Some of them walked, yes. How many? An earlier word decides that.&rdquo;',
        pennies: '&ldquo;That is the question. The trap is higher up the stone.&rdquo;',
        '*': '&ldquo;Not that one. Read it as slowly as you would read a bill.&rdquo;' },
      onPiv: function (w) { return '&ldquo;' + w + '.&rdquo; The stone turns on its foot with a noise like a millstone. &ldquo;A small word, and it has cost travellers more pennies than any other at my gate.&rdquo; The Keeper pushes a little heap of worn pennies across the gravel. &ldquo;Counters. I want them back.&rdquo;'; },
      wrongA: function (n) {
        return n === 6 ? '&ldquo;Six pennies is three geese walking. Read it again: how many did <i>not</i> fly?&rdquo;'
          : n === 10 ? '&ldquo;Ten pennies is five geese walking. Then who flew?&rdquo;'
          : n === 2 ? '&ldquo;A penny a goose? Look at line II of the Table. A goose pays by the leg.&rdquo;'
          : n === 0 ? '&ldquo;Nothing? Somebody walked. I remember them. They were in no hurry.&rdquo;'
          : '&ldquo;No. Count the walkers first. Then count their legs.&rdquo;';
      },
      right: function (a) { return '&ldquo;' + a + '.&rdquo; The Keeper nods, and takes his pennies back one at a time. &ldquo;&lsquo;All but two&rsquo; means all except two. So two of them did not fly; and a goose pays by the leg.&rdquo;'; } },
    { no: 'II', name: 'the tumbler', piv: 'p2', ans: 'a2', kind: 'coins',
      text: 'A tumbler came from the fair with his pockets empty. He read line I of my Table three times. Then he stood on his hands, and so he went from one bank to the other, with his boots in the air. How many pennies did I take from him?',
      wrongW: { empty: '&ldquo;His pockets were empty: that is why he read so carefully. It is not why he owed what he owed.&rdquo;', pockets: '&ldquo;His pockets were empty: that is why he read so carefully. It is not why he owed what he owed.&rdquo;',
        boots: '&ldquo;Close. You are at the wrong end of him.&rdquo;', air: '&ldquo;Close. You are at the wrong end of him.&rdquo;',
        stood: '&ldquo;He stood, certainly. What on?&rdquo;',
        line: '&ldquo;Yes: read line I, as he did. But the word that the riddle turns on is in the riddle.&rdquo;', table: '&ldquo;Yes: read line I, as he did. But the word that the riddle turns on is in the riddle.&rdquo;', read: '&ldquo;Yes: read line I, as he did. But the word that the riddle turns on is in the riddle.&rdquo;',
        bank: '&ldquo;From one bank to the other: he crossed, there is no doubt of that. <i>How</i> he crossed is another matter.&rdquo;',
        tumbler: '&ldquo;A tumbler is a traveller like any other. Until he does what this one did.&rdquo;',
        '*': '&ldquo;Not that one. What did he do that no other traveller has done, before or since?&rdquo;' },
      onPiv: function (w) { return '&ldquo;' + w + '.&rdquo; The stone turns. &ldquo;He had read line I more carefully than I had written it. I watched him do it. It took him a long time, and it rained.&rdquo;'; },
      wrongA: function (n) {
        return n === 1 ? '&ldquo;One penny? Line I: every traveller who crosses <i>on foot</i>. Did he?&rdquo;'
          : n === 2 ? '&ldquo;Two hands are not two legs, and a tumbler is not a beast, whatever I thought of this one.&rdquo;'
          : '&ldquo;No. Take line I one word at a time, and ask which of them fits him.&rdquo;';
      },
      right: function (a) { return '&ldquo;' + a + '.&rdquo; The Keeper breathes out slowly through his nose. &ldquo;I wrote &lsquo;on foot&rsquo;. I have been sorry for those two words for two hundred years, and I cannot change them.&rdquo;'; } },
    { no: 'III', name: 'the Keeper&rsquo;s own', piv: 'p3', key: 'r3', kind: 'word',
      text: 'It weighs nothing, and it has never been taken as a toll. I gave it in the Year of the Long Frost, and I have kept it ever since. It can be broken, but no smith can mend it. What is it?',
      wrongW: { gave: '&ldquo;Half of it. A thing that is given is usually gone. Which word says that this one is not?&rdquo;',
        broken: '&ldquo;That is the third leg of the stool. First find the word that quarrels with &lsquo;gave&rsquo;.&rdquo;', mend: '&ldquo;That is the third leg of the stool. First find the word that quarrels with &lsquo;gave&rsquo;.&rdquo;', smith: '&ldquo;That is the third leg of the stool. First find the word that quarrels with &lsquo;gave&rsquo;.&rdquo;',
        weighs: '&ldquo;Many things weigh nothing. Very few of them can be given.&rdquo;', nothing: '&ldquo;Many things weigh nothing. Very few of them can be given.&rdquo;',
        toll: '&ldquo;It is not a toll: the stone says so. Look at what I <i>did</i> with it.&rdquo;', taken: '&ldquo;It is not a toll: the stone says so. Look at what I <i>did</i> with it.&rdquo;',
        ever: '&ldquo;One word to the left.&rdquo;', since: '&ldquo;Two words to the left.&rdquo;',
        '*': '&ldquo;Not that one. Two words on this stone seem to quarrel. One of them is used in a way that pennies never are.&rdquo;' },
      onPiv: function (w) { return '&ldquo;' + w + '.&rdquo; The stone turns. &ldquo;Given, and kept: both at once. Most things cannot manage it. Now tell me what it is.&rdquo;'; },
      wrongT: { bridge: '&ldquo;The bridge weighs more than the hill it stands on. I built it; I should know.&rdquo;',
        charter: '&ldquo;The Charter weighs four pounds with its seal. But you are in the right room of the house.&rdquo;',
        secret: '&ldquo;A secret is kept by <i>not</i> giving it.&rdquo;', name: '&ldquo;My name was given <i>to</i> me. This I gave.&rdquo;',
        toll: '&ldquo;The first line of the stone says that it is not.&rdquo;', time: '&ldquo;Time cannot be kept, by trolls or by anybody. I have tried.&rdquo;',
        heart: '&ldquo;&hellip;No.&rdquo; The Keeper looks at the river for a moment. &ldquo;No. Not that.&rdquo;', love: '&ldquo;&hellip;No.&rdquo; The Keeper looks at the river for a moment. &ldquo;No. Not that.&rdquo;',
        '*': '&ldquo;No. It was given, and it is kept, and it can be broken. What do people give, and then keep?&rdquo;' },
      right: function (a) { return '&ldquo;My ' + a.toLowerCase() + ',&rdquo; says the Keeper. &ldquo;I gave it to both banks in the Year of the Long Frost, and I have kept it ever since. &lsquo;Keep&rsquo; is two words that look like one. You keep a penny by holding on to it. You keep this by doing what you said you would do.&rdquo;'; } }
  ];

  function hints() {
    if (nextFile) return ['go', ['You have asked to read the Charter, and the Keeper is already on the stairs. The button is at the bottom of the screen.']];
    if (!ER.flag('a-talk')) return ['start', ['Talk to the Keeper first. He is sitting on the fourth stone, and he has waited a long time to explain the rules.']];
    return [['r1', [
      'Stone I. Read it slowly, the way you would read a bill. One small word decides how many geese flew.',
      'Look at the second sentence. Does it really say that two geese flew? Read its first three words again, one at a time.',
      '&ldquo;All but two&rdquo; means all except two: so two geese did not fly. They walked. Now look at line II of the Table, beside the stone: how does a goose pay?'
    ]], ['r2', [
      'Stone II. The answer is in line I of the Table, and the word is in the riddle. How, exactly, did he cross?',
      'Line I says: every traveller who crosses on foot. Read the last two words as a troll would read them.',
      'He did not cross on his feet. Put your finger on the word that says what he did cross on. Then ask what line I has to say about a traveller who is not on foot. An empty bowl is an answer too.'
    ]], ['r3', [
      'Stone III. Two of its words seem to quarrel: how can you give a thing away and still have it?',
      'English uses one of those words in two ways. You keep a coin in your pocket. What else can you keep, after you have given it to somebody?',
      'At the gate the Keeper told you that a troll&rsquo;s ___ is not like a man&rsquo;s, and does not break. You give it, you keep it, and you can break it. Type it.'
    ]]][st.n];
  }
  function isBusy() { return busy; }
  function save() { ER.flag('a-st', st); }
  function paint() {
    var i, s = '';
    for (i = 0; i < 3; i++) $('#st' + (i + 1)).setAttribute('class', 'hot stone' + (i < st.n ? ' done' : '') + (i === st.n && ER.flag('a-talk') && !nextFile ? ' next' : ''));
    for (i = 0; i < Math.min(5, TOLL.pebbles()); i++) s += '<circle cx="' + (988 + i * 6) + '" cy="' + (709 - (i % 2) * 3) + '" r="4"/>';
    $('#jarP').innerHTML = s;
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(st.n, 3);
  }
  function begin() {
    paint();
    if (!nextFile && st.n === 3) { finish(); return; }          /* the page was left between the last answer and the Keeper's verdict */
    if (nextFile) { ER.say('Under the arch. Three stones have turned, and the Keeper is waiting on the stairs.'); return; }
    if (ER.flag('a-talk')) { ER.say('Under the arch. The stones are waiting, and so is the Keeper.'); return; }
    busy = true;
    ER.narrate([
      'Under the bridge. The arch goes over your head like the roof of a church, and the river goes by at your feet without looking at you.',
      'Three stones stand on the bank, with writing cut into each of them. The Keeper sits down on a fourth, and puts a clay jar beside him.'
    ], function () { busy = false; });
  }

  /* ---------- things under the arch ---------- */
  $('#keeper').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;The counting-house is up the stairs and through the small door,&rdquo; says the Keeper. &ldquo;Wipe your feet. Nobody has been in there but me since the bridge was built.&rdquo;', 8000); return; }
    if (ER.flag('a-talk')) { ER.say('&ldquo;First the word that it turns on,&rdquo; says the Keeper. &ldquo;Then the answer. And in order: they are numbered.&rdquo;'); return; }
    ER.talk({
      who: 'Spandrel', role: CAST.spandrel.role, face: FACE('spandrel', '#1d3a44'),
      lines: [
        { note: 'The Keeper puts his lantern down on the gravel and folds his hands.',
          a: '&ldquo;Three riddles. I did not make them up. They happened. Everything on these stones came to my gate, and I wrote it down as it was.&rdquo;' },
        { q: 'What do I have to do?',
          a: 'Each riddle turns on one word. Read past that word, and you will answer wrongly, as everybody does. So: first put your finger on the word. When you have the right one, the stone will turn. Then give me your answer.' },
        { q: 'What do I answer with?',
          a: 'With pennies in my bowl, for the first two: you tell me what was owed. The Table of Tolls is the same under the bridge as it is on top of it. The third riddle is another kind. I am allowed one of those.' },
        { q: 'What is the jar for?',
          a: 'Mistakes. One pebble for each. It is not in the Charter. It is a hobby.' },
        { q: 'And if I answer all three?',
          a: 'Clause 8. The Keeper shall grant the traveller one thing, unless the Charter forbids it. If I were you, I should think very carefully about the last five words.' }
      ],
      clue: { id: 'keeper2', title: 'Spandrel, under the arch', kind: 'What he said' }, last: 'Go to the stones',
      done: function (seen) { if (!seen) return; ER.flag('a-talk', 1); paint(); TOLL.learn(['riddle', 'pebble']); ER.say('Three stones, numbered I, II and III. Begin with the first.'); }
    });
  });
  $('#jar').addEventListener('click', function (e) { if (busy) return; ER.wordAt(e.clientX, e.clientY, 'jar'); ER.say(TOLL.jar()); });
  TOLL.thing('#moon', null, 'The moon, and a second moon in the water, which the river keeps trying to carry away.', isBusy);
  TOLL.thing('#water', null, 'Stickle Water, going by in the dark. It was here before the bridge, and in all that time it has never paid a penny.', isBusy);
  TOLL.thing('#lantern', 'lantern', 'The Keeper&rsquo;s lantern. Down here it is the only warm thing there is, unless you count the Keeper, and nobody has ever been sure about that.', isBusy);
  [0, 1, 2].forEach(function (i) {
    $('#st' + (i + 1)).addEventListener('click', function () {
      if (busy) return;
      if (!ER.flag('a-talk')) { ER.say('Three stones with writing cut into them. The Keeper clears his throat. He would like to explain the rules first. He has waited a long time to explain the rules.', 7000); return; }
      if (i > st.n) { ER.say('&ldquo;In order,&rdquo; says the Keeper. &ldquo;They are numbered.&rdquo;'); return; }
      if (i < st.n) { var c = ER.state().clues.filter(function (x) { return x.id === 'rid' + i; })[0]; if (c) ER.read({ html: c.h, cls: 'stone' }); return; }
      openRiddle(i);
    });
  });

  /* ---------- a riddle: first the word it turns on, then the answer ---------- */
  function openRiddle(i) {
    var R = RID[i], box = ER.el('div', 'rs'), done = false, count = 0, pk = null, s;
    s = '<div class="rs-stone"><h4>' + R.no + '</h4><p class="rs-text">' + ER.gloss(R.text) + '</p><p class="rs-how"></p><div class="rs-ans">' +
      (R.kind === 'coins' ? '<div class="rs-bowl"></div><p class="rs-count"></p><div class="rs-foot"><button type="button" class="btn" id="rs-go">Give the Keeper your answer</button></div>' : '<div class="rs-line"></div>') +
      '</div></div><div class="rs-side"><div class="doc board mini">' + ER.gloss(TABLE) + '</div><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var stone = box.querySelector('.rs-stone'), how = box.querySelector('.rs-how'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }
    function solved(a, show) {
      done = true;
      st.got.push(st.pw.toLowerCase(), a); st.n++; st.piv = false; save();
      ER.addClue('rid' + i, 'Riddle ' + R.no + ': ' + R.name, '<h4>' + R.no + '</h4><p>' + R.text + '</p><p class="ans">It turned on the word &ldquo;' + st.pw.toLowerCase() + '&rdquo;. Your answer: ' + show + '.</p>', 'stone', 'Riddle stone', true);
      ER.sfx.ok(); msg(R.right(show.charAt(0).toUpperCase() + show.slice(1)));
      setTimeout(function () { ER.closeAll(); paint(); if (st.n === 3) finish(); else ER.say('Stone ' + R.no + ' has turned. ' + (st.n === 1 ? 'Two' : 'One') + ' to go.'); }, 3600);
    }
    function answers(first) {
      stone.classList.add('turned');
      if (first) { stone.classList.add('grind'); TOLL.sfx.stone(); }
      if (R.kind === 'coins') {
        how.textContent = 'Put what was owed into the bowl. An empty bowl is an answer too.';
        var bowl = box.querySelector('.rs-bowl'), cnt = box.querySelector('.rs-count'), k;
        for (k = 1; k <= 10; k++) bowl.appendChild(ER.el('button', 'rs-coin')).setAttribute('data-n', k);
        ER.$$('.rs-coin', bowl).forEach(function (b) { b.type = 'button'; });
        var drawCoins = function () {
          ER.$$('.rs-coin', bowl).forEach(function (b, n) { b.classList.toggle('on', n < count); });
          cnt.textContent = count ? count + (count === 1 ? ' penny in the bowl' : ' pennies in the bowl') : 'The bowl is empty';
          bowl.setAttribute('data-v', count);
        };
        bowl.addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('.rs-coin') : null; if (!b || done) return;
          var n = +b.getAttribute('data-n'); count = count === n ? n - 1 : n; TOLL.sfx.coin(); drawCoins();
        });
        box.querySelector('#rs-go').addEventListener('click', function () {
          if (done) return;
          if (ER.check(R.ans, count)) { solved(String(count), count ? NUM[count].toLowerCase() + (count === 1 ? ' penny' : ' pennies') : 'nothing'); return; }
          TOLL.miss(); TOLL.sfx.hm(); paint(); msg(R.wrongA(count));
        });
        drawCoins();
      } else {
        how.textContent = 'Type what it is, and press Enter.';
        WK.line(box.querySelector('.rs-line'), { max: 18, spaces: true, board: true, enter: 'Answer', placeholder: 'type your answer', sound: false,
          onEnter: function (text) {
            if (done) return;
            var t = WK.norm(text), bare = text.toLowerCase().replace(/^(my|a|an|the|your|his)\s+/, '');
            if (WK.is(R.key, text)) { solved('', bare); return; }
            TOLL.miss(); TOLL.sfx.hm(); paint(); msg(R.wrongT[t] || R.wrongT['*']);
            return false;
          } });
      }
    }
    ER.$$('.rs-text .w', box).forEach(function (w) { w.classList.add('wk-skip'); });      /* a dotted word is there to be looked up: clicking it is not a guess */
    pk = WK.pick(box.querySelector('.rs-text'), { key: R.piv, sound: false,
      onRight: function (w, node, n) {
        st.piv = true; st.pw = node.textContent; st.pn = n; save();
        node.classList.add('rs-piv'); pk.destroy(); ER.sfx.clunk();
        answers(true); msg(R.onPiv(cap(node.textContent)));
      },
      onWrong: function (w) { if (done) return; TOLL.miss(); TOLL.sfx.hm(); paint(); msg(R.wrongW[w] || R.wrongW['*']); } });
    if (st.piv && pk.words[st.pn]) { pk.words[st.pn].classList.add('rs-piv'); pk.destroy(); answers(false); msg('The stone has turned already. The Keeper is waiting for your answer.'); }
    else { how.textContent = 'Put your finger on the word that it turns on.'; msg('The Keeper leans forward, with one pebble ready between his finger and thumb.'); }
    open = i;
    ER.open('ov-lock', box, function () { open = -1; });
  }

  /* ---------- three answered: and one thing granted ---------- */
  function finish() {
    var file = ER.exitOk([st.got.filter(function (x) { return x !== ''; }).join('-')]), n = TOLL.pebbles();
    if (!file) { ER.say('The Keeper looks at his stones for a long time. Something is wrong with this lock: tell your teacher.'); return; }
    nextFile = file; ER.flag('a-file', file); TOLL.done('arch'); TOLL.solved(); busy = true; paint();
    ER.narrate([
      'The Keeper tips his jar out on the gravel and counts. ' + (n ? '&ldquo;' + (NUM[n] || n) + (n === 1 ? ' pebble' : ' pebbles') + ',&rdquo; he says, and puts ' + (n === 1 ? 'it' : 'them') + ' back. ' : '&ldquo;Empty,&rdquo; he says, and looks into it twice to make sure. ') + '&ldquo;And three riddles answered. Clause 8: I shall grant you one thing. Name it.&rdquo;',
      '&ldquo;Open the gate,&rdquo; you say. &ldquo;Forbidden,&rdquo; says the Keeper, and for the first time he looks almost sorry. &ldquo;Clause 3: by night the gate shall stay shut. One thing, <i>unless the Charter forbids it</i>. I did tell you about the last five words.&rdquo;',
      '&ldquo;Then how am I to know what the Charter forbids?&rdquo; &ldquo;Most people, at this point, ask to read it.&rdquo; The Keeper thinks about that. &ldquo;I say most people. Nobody ever has.&rdquo;',
      '&ldquo;Then that is my one thing,&rdquo; you say. &ldquo;I want to read the Charter.&rdquo;',
      'The Keeper is on his feet before you have finished saying it. For somebody the size of a haystack, he moves very fast when he is pleased.'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
