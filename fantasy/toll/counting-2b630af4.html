  .cl-side .pmsg{min-height:132px;margin-bottom:10px}
  .cl-foot .btn{--accent:#ffe9a8}
  @media (max-width:900px){.cl{grid-template-columns:1fr}.cl-cols{-webkit-column-count:1;column-count:1}}

    sound: ['candle', { root: 48, bpm: 58, drop: ['mel'] }],        /* the room with the most to read: slow, and no tune over it */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null;
  var stp = ER.flag('c-st') || { step: 1, ev: '', won: [] };

  var CL = [
    'Spandrel shall be Keeper of the bridge, and shall keep it in good repair, for as long as the water runs.',
    'Night begins when the Keeper lights the lamp over the gate at sunset. Day begins when the Keeper hears a cock crow.',
    'By night the gate shall stay shut, except as Clause 7 allows. When day begins, the Keeper shall open it.',
    'By day the Keeper may ask a toll, as the Table says, of every traveller who would cross; and every traveller must pay what the Keeper asks before he crosses.',
    'The lamp shall burn until the sun is up. If it goes out before then, the Keeper must light it again at once.',
    'While the lamp burns, the Keeper shall neither ask nor take a toll: for no honest counting was ever done by lamplight.',
    'The Keeper may open the gate by night for a doctor on the way to the sick.',
    'By night a traveller may ask for the Riddles. If he answers all three, the Keeper shall grant him one thing, unless this Charter forbids it.',
    'A traveller who cannot cross may wait in the toll-house, unless he is a goat.',
    'The Keeper may sleep only if the lamp is out.',
    'The first traveller across the bridge each day shall wish the Keeper good morning, and the Keeper shall wish him the same.',
    'Not one word of this Charter shall be changed. The Keeper gives no change.'
  ];
  var HEAD = '<h4>The Charter of Stickle Bridge</h4><h5>made in the Year of the Long Frost between SPANDREL, a Troll, who built the bridge, and the People of Both Banks, who wished to cross it</h5>';
  var CHARTER = HEAD + CL.map(function (t, n) { return '<p><b>' + (n + 1) + '</b><span>' + t + '</span></p>'; }).join('');
  var DAYBOOK = '<h4>Stickle Bridge: the day-book</h4>' +
    '<p>Today.</p>' +
    '<p>Noon. 1 miller, on foot: 1 penny.</p>' +
    '<p>Three o&rsquo;clock. 1 carter, on foot: 1 penny. 1 horse, four legs walking: 4 pennies. 1 cart, four wheels, not empty: 4 pennies. 20 cabbages for sale: 2 cabbages (the two biggest).</p>' +
    '<p>Sunset. 1 traveller, on foot, aged thirteen: 1 penny. 1 goose, riding: nothing. 1 cart, three wheels: 3 pennies. 9 cheeses for sale: nothing. A pity.</p>' +
    '<p class="sum">Taken from the last: one sixpence. Change given: none.</p>' +
    '<p>Lamp lit. Box locked. Gate shut.</p>' +
    '<p>The Riddles asked for (!). Three answered. The Charter asked for (!!).</p>';
  var EVENTS = [
    ['sun', 'The sun comes up', '<circle cx="13" cy="13" r="5"/><path d="M13 2v4M13 20v4M2 13h4M20 13h4M5 5l3 3M18 18l3 3M21 5l-3 3M8 18l-3 3"/>'],
    ['lamp', 'The lamp goes out', '<path d="M9 9h8l2 12H7z"/><path d="M11 9V5h4v4M13 13v5"/>'],
    ['sleep', 'The Keeper falls asleep', '<path d="M17 16A8 8 0 1 1 10 4a6 6 0 0 0 7 12z"/><path d="M17 4h6l-6 6h6"/>'],
    ['cock', 'A cock crows', '<path d="M7 23v-8q0-8 6-8q5 0 5 5l5 2-5 2q0 7-5 7z"/><path d="M10 7q0-4 3-3q1-3 4 0"/><circle cx="14" cy="11" r=".8"/>'],
    ['doctor', 'A doctor comes by', '<rect x="4" y="9" width="18" height="13" rx="2"/><path d="M10 9V5h6v4M13 12v7M9.500 15.500h7"/>'],
    ['pay', 'You pay a second time', '<circle cx="9" cy="15" r="6"/><circle cx="17" cy="11" r="6"/>'],
    ['riddles', 'You answer three more riddles', '<path d="M9 9q0-5 4-5t4 4q0 3-4 5v3"/><circle cx="13" cy="21.500" r=".9"/>']
  ];
  var TITLES = ['What must happen tonight?', 'What stops the toll?', 'What keeps the lamp alight?'];
  var ASK = [
    'The gate is shut until day. &ldquo;Choose one thing that might happen tonight,&rdquo; says the Keeper, &ldquo;and press my seal beside the clause that would then make me open the gate. I shall tell you what the Charter says to it.&rdquo;',
    '&ldquo;Very well. If a cock crowed in my hearing, now, at ten o&rsquo;clock at night, it would be day, and I should have to open my gate. And then I should stand in it with my hand out. Clause 4: by day the Keeper may ask a toll of every traveller. There are four people in my toll-house without a penny between them. They would stay exactly where they are.&rdquo; <b>Press the seal beside the clause that stops him.</b>',
    '&ldquo;Then it is simple,&rdquo; says the Keeper, and he smiles for the first time: it is like a crack opening in a wall. &ldquo;The cock crows. It is day. And I put out the lamp. Then nothing ties my hands, and I ask for my pennies.&rdquo; <b>Press the seal beside the clause that stops him.</b>'
  ];
  var SAY1 = {
    sun: '&ldquo;The sun will come up, in about eight hours, and I shall be glad to see it. But show me where my Charter says that the <i>sun</i> opens my gate. Read Clause 2 to the letter.&rdquo;',
    lamp: '&ldquo;If the lamp goes out? Clause 5: I must light it again at once, and I carry a tinderbox in every pocket. In any case, a dark lamp does not end the night. Look at how Clause 2 ends it.&rdquo;',
    sleep: '&ldquo;If I fall asleep? Clause 10: the Keeper may sleep <i>only if</i> the lamp is out. The lamp is not out, so I may not. I have not slept at night for three hundred years. One gets used to it.&rdquo;',
    doctor: '&ldquo;A doctor? Clause 7 says that I <i>may</i> open the gate for a doctor. It does not say that I <i>shall</i>. &lsquo;May&rsquo; leaves it to me. And I should leave it shut, because you are not a doctor: you are a cheesemonger with a goose.&rdquo;',
    pay: '&ldquo;Pay again? You have paid. And now that the lamp is lit, I could not take another penny from you if I wanted to: Clause 6. Nobody ever bought a way through this gate by night.&rdquo;',
    riddles: '&ldquo;Three more riddles? Clause 8 gives the winner one thing, <i>unless</i> the Charter forbids it. An open gate by night is forbidden: Clause 3. You could answer riddles until breakfast.&rdquo;'
  };
  var SAY2 = {
    4: '&ldquo;Clause 4 is <i>my</i> clause: it is the one that gives me my toll. You will not stop me with that.&rdquo;',
    5: '&ldquo;Clause 5 keeps the lamp burning. Good. And what does a burning lamp do to a toll? That is another clause.&rdquo;',
    12: '&ldquo;&lsquo;No change&rsquo; means that I give none back. It does not mean that I take nothing.&rdquo;',
    '*': '&ldquo;That clause says nothing about tolls. Find me the one that ties my hands.&rdquo;'
  };
  var SAY3 = {
    2: '&ldquo;Clause 2 begins the day. It does not keep a lamp alight.&rdquo;',
    6: '&ldquo;Clause 6 says what I may not do <i>while</i> the lamp burns. I am going to put the lamp out. Which clause says that I cannot?&rdquo;',
    10: '&ldquo;Clause 10 is about my sleep, not my lamp.&rdquo;',
    '*': '&ldquo;That clause does not keep a lamp alight.&rdquo;'
  };

  function hints() {
    if (nextFile) return ['go', ['You know what you need now, and you know where you saw one. The button is at the bottom of the screen.']];
    return [['s1', [
      'Read all twelve clauses before you touch anything. You want the gate open. Only one clause in the whole Charter makes the Keeper open it: find that clause first, and then ask what has to happen before it begins to work.',
      'One clause says that the Keeper SHALL open the gate, and when. Another clause says exactly when that moment comes: and it is not the sun that brings it. Watch the difference between &ldquo;may&rdquo; and &ldquo;shall&rdquo;, too: &ldquo;may&rdquo; leaves the choice to the Keeper.',
      'Day begins when the Keeper hears something: Clause 2 says what. Choose that from the tray. Then press the seal beside the other clause: the one that says what he shall do when day begins.'
    ]], ['s2', [
      'He says that he will ask everybody for a toll. One clause says when he may ask, and another says when he shall not. Can both of them be true at the same moment?',
      'Clause 4 says &ldquo;may&rdquo;: by day he is allowed to ask. Find the clause that says &ldquo;shall neither ask nor take&rdquo;. When is that?',
      'The clause that you want begins with the words &ldquo;While the lamp burns&rdquo;. The same rule was on the board at the gate, as line VI of the Table.'
    ]], ['s3', [
      'He wants to put out the lamp. Is he free to do that? One clause says how long the lamp must burn.',
      'Find the clause with the word &ldquo;until&rdquo; in it. Until what, exactly? Set it beside the way that Clause 2 begins the day.',
      'The lamp shall burn until the SUN is up. A cock at midnight begins the day, but it does not bring up the sun. Press the seal beside the clause that keeps the lamp burning.'
    ]]][stp.step - 1];
  }
  function isBusy() { return busy; }
  function paint() {
    var i, s = '';
    for (i = 0; i < Math.min(5, TOLL.pebbles()); i++) s += '<circle cx="' + (1193 + i * 4.500) + '" cy="' + (506 - (i % 2) * 2.500) + '" r="3"/>';
    $('#jarP').innerHTML = s;
    $('#charter').setAttribute('class', 'hot' + (nextFile ? '' : ' next'));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(nextFile ? 3 : stp.step - 1, 3);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The counting-house. The Keeper is sitting on his strongbox, reading Clause 5 for the ninth time.'); return; }
    if (ER.flag('c-seen')) { ER.say('The counting-house. The Charter is on the far wall, under its little roof.'); return; }
    busy = true; ER.flag('c-seen', 1);
    ER.narrate([
      'Shelves of buttons. A hill of left boots. Four hens asleep in a row, and a strongbox with a lock the size of a loaf.',
      'And on the far wall, under a little roof of its own, a sheet of old skin as long as a door, with twelve clauses written on it and a red seal as big as a plate: the Charter of Stickle Bridge.'
    ], function () { busy = false; });
  }

  /* ---------- things in the counting-house ---------- */
  $('#keeper').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Until the sun is up,&rdquo; says the Keeper, to nobody. &ldquo;I wrote that. I was proud of it.&rdquo;'); return; }
    ER.talk({
      who: 'Spandrel', role: CAST.spandrel.role, face: FACE('spandrel', '#4a3516'),
      lines: [
        { note: 'The Keeper has put on a second pair of spectacles over the first.',
          a: '&ldquo;Read for as long as you like. You have, by my watch, about eight hours before the sun is up. After that you will not need a hole in my Charter. You will need a faster cart.&rdquo;' },
        { q: 'What am I looking for?',
          a: 'You tell me. You want my gate open tonight. I say that the Charter keeps it shut. If you can show me a clause that opens it, I shall open it. I keep every word on that skin, including the ones that I do not like.' },
        { q: 'How do I show you?',
          a: 'There is a tray of tokens under the Charter: things that might happen tonight. Choose one. Then press my seal beside the clause that would make me open the gate if it did happen. I shall tell you what the Charter says to that. Each mistake is a pebble.' },
        { q: 'Did you write it yourself?',
          a: 'Half of it. The People of Both Banks wrote the other half. They wrote Clause 9, after the trouble with the goats. I wrote Clause 5. It is the best clause of the twelve: &ldquo;The lamp shall burn until the sun is up.&rdquo; Not one word wasted.' }
      ],
      clue: { id: 'keeper3', title: 'Spandrel, in the counting-house', kind: 'What he said' }, last: 'Go to the Charter',
      done: function (seen) { if (!seen) return; ER.flag('c-talk', 1); TOLL.learn(['Charter', 'clause']); ER.say('The Charter is on the far wall, between the two candles.'); }
    });
  });
  $('#daybook').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: DAYBOOK, cls: 'daybook', clue: { id: 'daybook', title: 'The Keeper’s day-book', kind: 'On his desk' } });
  });
  $('#jar').addEventListener('click', function (e) { if (busy) return; ER.wordAt(e.clientX, e.clientY, 'jar'); ER.say(TOLL.jar()); });
  TOLL.thing('#hens', null, 'Four hens asleep in a row: old tolls, one in every ten. &ldquo;They are all called Henrietta,&rdquo; says the Keeper. &ldquo;It saves time.&rdquo;', isBusy);
  TOLL.thing('#buttons', null, 'Jars and jars of buttons. People who have no penny always have a button. The Keeper has sewn the best ones on his waistcoat.', isBusy);
  TOLL.thing('#scales', 'scales', 'A pair of brass scales, for cheeses, geese and arguments.', isBusy);
  TOLL.thing('#boots', null, 'A hill of boots, and every one of them is a left boot. &ldquo;A man with no penny offered me a boot once, in the year of the comet,&rdquo; says the Keeper. &ldquo;I ought not to have said yes. Word got round.&rdquo;', isBusy);
  TOLL.thing('#box', 'strongbox', 'The strongbox, shut and locked. &ldquo;I lock it when I light the lamp,&rdquo; says the Keeper. &ldquo;No honest counting was ever done by lamplight. At night I read.&rdquo;', isBusy);
  TOLL.thing('#window', null, 'A round window, and the river going by under it in the dark. A long way off, a few lights are still awake in Overwater.', isBusy);
  TOLL.thing('#lampD', null, 'The Keeper&rsquo;s reading lamp. By its light he reads the Charter every night, from the first word to the last. He says that it has never once changed.', isBusy);
  $('#charter').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.read({ html: CHARTER, cls: 'charter' }); return; }
    openCharter();
  });

  /* ---------- the Charter: a thing that might happen, and the Keeper's seal ---------- */
  function openCharter() {
    var box = ER.el('div', 'cl'), done = false, seal = 0, ev = stp.ev || '', s;
    ER.addClue('charter', 'The Charter of Stickle Bridge', CHARTER, 'charter', 'On the wall of the counting-house');
    TOLL.learn(['Charter', 'clause', 'shall', 'may', 'must', 'unless', 'until', 'only if']);
    s = '<div class="cl-skin">' + HEAD + '<div class="cl-cols">';
    CL.forEach(function (t, n) { s += '<div class="cl-c" data-n="' + (n + 1) + '"><span class="cl-spot"></span><b>' + (n + 1) + '</b><span class="cl-t">' + ER.gloss(t) + '</span></div>'; });
    s += '</div></div><div class="cl-side"><h6></h6><p class="cl-ask"></p><div class="cl-list"></div><p class="pmsg"></p><div class="cl-foot"><button type="button" class="btn" id="cl-go">Put it to the Keeper</button></div></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg'), list = box.querySelector('.cl-list'), rows = ER.$$('.cl-c', box);
    var WON = ['this opens the gate', 'this stops the toll'];
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function render() {
      var S = stp.step, h = '';
      box.querySelector('h6').textContent = TITLES[S - 1];
      box.querySelector('.cl-ask').innerHTML = ER.gloss(ASK[S - 1]);
      if (S === 1) {
        h = '<div class="cl-tokens">' + EVENTS.map(function (e) { return '<button type="button" class="cl-tok' + (e[0] === ev ? ' on' : '') + '" data-e="' + e[0] + '"><svg viewBox="0 0 26 26">' + e[2] + '</svg><span>' + e[1] + '</span></button>'; }).join('') + '</div>';
      } else {
        h = '<p class="cl-ok"><b>Agreed</b>If a cock crows where the Keeper can hear it, day begins, and he shall open the gate (Clauses 2 and ' + stp.won[0] + ').</p>';
        if (S === 3) h += '<p class="cl-ok"><b>Agreed</b>While the lamp burns, he shall neither ask nor take a toll (Clause ' + stp.won[1] + ').</p>';
      }
      list.innerHTML = h;
      rows.forEach(function (r) {
        var n = +r.getAttribute('data-n'), w = stp.won.indexOf(n);
        r.classList.toggle('won', w >= 0); r.classList.toggle('sealed', n === seal && w < 0);
        if (w >= 0) r.querySelector('.cl-t').setAttribute('data-won', WON[w]);
      });
    }
    box.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.cl-tok') : null, r = e.target.closest ? e.target.closest('.cl-c') : null, n;
      if (done) return;
      if (e.target.closest && e.target.closest('.w')) return;                  /* a dotted word is being looked up, not sealed */
      if (t) { ev = t.getAttribute('data-e'); ER.sfx.click(); render(); return; }
      if (!r) return;
      n = +r.getAttribute('data-n');
      if (stp.won.indexOf(n) >= 0) { msg('That clause has the Keeper&rsquo;s seal on it already. He agreed to it, and he does not go back.'); return; }
      seal = seal === n ? 0 : n; TOLL.sfx.seal(); render();
    });
    function miss(t) { TOLL.miss(); TOLL.sfx.hm(); paint(); msg(t); }
    function won(t) { stp.won.push(seal); stp.step++; seal = 0; ER.flag('c-st', stp); ER.sfx.ok(); render(); msg(t); paint(); }
    box.querySelector('#cl-go').addEventListener('click', function () {
      if (done) return;
      var S = stp.step, file;
      if (S === 1) {
        if (!ev || !seal) { msg('&ldquo;A thing that might happen, <i>and</i> a clause,&rdquo; says the Keeper. &ldquo;I need both.&rdquo;'); return; }
        if (SAY1[ev]) { miss(SAY1[ev]); return; }
        if (!ER.check('ev', ev)) { miss(SAY2['*']); return; }
        if (!ER.check('c1', seal)) {
          miss(seal === 2 ? '&ldquo;A cock.&rdquo; The Keeper stops. &ldquo;&hellip;Clause 2 says what a cock&rsquo;s crow <i>begins</i>. It opens nothing. Which clause says what I must <i>do</i> when day begins?&rdquo;'
            : '&ldquo;A cock?&rdquo; The Keeper stops, and looks at you over both pairs of spectacles. &ldquo;&hellip;That clause would not open my gate. Find me the one that says what I must <i>do</i> when day begins.&rdquo;');
          return;
        }
        stp.ev = ev;
        won('The Keeper reads the clause aloud, twice. &ldquo;When day begins, the Keeper <i>shall</i> open it. Shall. Not may.&rdquo; He looks at Clause 2. &ldquo;And day begins when the Keeper hears a cock crow. It does not say &lsquo;at sunrise&rsquo;. It does not say &lsquo;in the morning&rsquo;.&rdquo;');
        return;
      }
      if (!seal) { msg('&ldquo;Press the seal beside a clause,&rdquo; says the Keeper. &ldquo;I cannot argue with a finger in the air.&rdquo;'); return; }
      if (S === 2) {
        if (!ER.check('c2', seal)) { miss(seal === stp.won[0] || seal === 2 ? '&ldquo;That clause has done its work: it has opened the gate. Now find the one that closes my hand.&rdquo;' : (SAY2[seal] || SAY2['*'])); return; }
        won('The Keeper reads it, and then reads Clause 4 again. &ldquo;By day I <i>may</i> ask. While the lamp burns I <i>shall not</i>. If I ask for nothing, I keep both clauses. If I ask for one penny, I break one of them.&rdquo; He is quiet for some time. &ldquo;&lsquo;May&rsquo; has never yet won an argument with &lsquo;shall not&rsquo;.&rdquo;');
        return;
      }
      if (!ER.check('c3', seal)) { miss(SAY3[seal] || SAY3['*']); return; }
      file = ER.exitOk([stp.ev + '>' + stp.won[0] + '>' + stp.won[1] + '>' + seal]);
      if (!file) { msg('The Keeper looks at his Charter for a long time. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('c-file', file); TOLL.done('counting'); busy = true;
      TOLL.mine('holes', 'The hole in the Charter', '<p>Day begins when the Keeper hears a cock crow (Clause 2). Not at sunrise!</p><p>When day begins, he SHALL open the gate (Clause ' + stp.won[0] + ').</p>' +
        '<p>While the lamp burns, he SHALL NOT ask or take a toll (Clause ' + stp.won[1] + '). MAY loses to SHALL NOT.</p><p>And the lamp SHALL burn until the SUN is up (Clause ' + seal + ').</p><p>A cock at midnight = an open gate, and nothing to pay.</p>', true);
      stp.won.push(seal); stp.step = 4; rows.forEach(function (r) { if (+r.getAttribute('data-n') === seal) r.classList.add('won'); r.classList.remove('sealed'); });
      TOLL.sfx.seal(); msg('The Keeper opens his mouth. He shuts it again. Then he leans very close to the skin, so that his nose almost touches it.');
      setTimeout(function () { ER.closeAll(); TOLL.solved(); paint(); found(); }, 2800);
    });
    render();
    msg(stp.step === 1 ? 'Twelve clauses, and seven things that might happen tonight. The Keeper holds out a brass seal the size of a doorknob.' : 'The Keeper is waiting, with his arms folded.');
    ER.open('ov-lock', box);
  }

  /* ---------- a hole the size of a whole night ---------- */
  function found() {
    ER.narrate([
      'The Keeper reads Clause 5. Then he takes off one pair of spectacles, and reads it again. &ldquo;The lamp shall burn until the <i>sun</i> is up. Not &lsquo;until day begins&rsquo;. Until the sun is up.&rdquo;',
      '&ldquo;Day begins with a cock. The lamp burns until the sun. I wrote those two clauses on the same afternoon. For three hundred years the cock and the sun have come up together, and I have never once seen the gap between them.&rdquo;',
      '&ldquo;If a cock crowed tonight where I could hear it, I should have to open my gate, and leave my lamp burning, and stand there until sunrise asking nobody for anything.&rdquo; He sits down on the strongbox, which creaks.',
      '&ldquo;It is a hole,&rdquo; he says. &ldquo;It is a hole the size of a whole night. But it is a hole with nothing in it. There has been no cock at Stickle Bridge since the year of the fox.&rdquo;',
      'You think of the toll-house: of a knight by the fire, and the small fat hawk on his wrist, which wore a hood, and did not look very much like a hawk.'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
