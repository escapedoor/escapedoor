<head>

<style>
  body{--bg:#1d1a2b;--accent:#f0b35c;--font-display:'Uncial Antiqua',serif;--font-ui:'Cinzel',serif;--font-body:'IM Fell English',Georgia,serif;
    --tc-bg:rgba(22,18,34,.96);--tc-ink:#efe6d6;--cap-bg:rgba(20,16,32,.94);--cap-ink:#f3ecdf;--panel:#221d31;--face-bg:#3a3a4a;--q-ink:#c9b9e6;--fade:#0b0914;--hud-bg:rgba(20,16,32,.78)}
  #sun{transition:transform 4.5s ease-in}
  #scene.night #sun{transform:translateY(120px)}
  #dark{opacity:0;transition:opacity 4.5s}
  #scene.night #dark{opacity:.5}
  #glow{opacity:0;transition:opacity 1.2s}
  #scene.lit #glow{opacity:1;animation:gl 3.4s steps(4) infinite}
  @keyframes gl{50%{opacity:.82}}
  #lampGlass{transition:fill .6s}
  #scene.lit #lampGlass{fill:#ffd98a}
  #scene.lit #flame{opacity:1}
  #flame{opacity:0;transform-origin:900px 318px;animation:fl 1.9s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:scale(1,1)}35%{transform:scale(.88,1.14)}65%{transform:scale(1.1,.92)}}
  #rainG{display:none}
  #scene.wet #rainG{display:block}
  .puff{animation:puff 9s linear infinite}
  .puff:nth-child(2){animation-delay:-3s}.puff:nth-child(3){animation-delay:-6s}
  @keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.26}100%{transform:translate(60px,-120px) scale(1.5);opacity:0}}
  .puff{transform-origin:505px 40px}
  #mabel{animation:bob 4.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .shim{stroke-dasharray:40 120;animation:shim 6s linear infinite}
  .shim:nth-child(2n){animation-duration:8s;stroke-dasharray:26 90}
  @keyframes shim{to{stroke-dashoffset:-160}}
  #win{animation:win 5s steps(3) infinite}
  @keyframes win{50%{opacity:.86}}

  /* the Keeper's reckoning frame */
  .rf{display:grid;grid-template-columns:minmax(0,560px) 400px;gap:26px;width:min(1000px,96vw);align-items:start}
  .rf-frame{padding:20px 24px 18px;background:#5a3c22 linear-gradient(160deg,#6f4b2b,#40290f);border:8px solid #2a1a0c;border-radius:6px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,220,150,.15)}
  .rf-frame h4{margin:0;font-family:'Uncial Antiqua',serif;font-weight:normal;font-size:25px;line-height:1.1;color:#ffe9a8}
  .rf-frame h5{margin:4px 0 14px;font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.2em;color:#e3c98a;border-bottom:2px solid rgba(255,233,168,.3);padding-bottom:10px}
  .rf-rod{display:grid;grid-template-columns:138px minmax(0,1fr) 92px;align-items:center;gap:12px;margin-bottom:8px;padding:7px 8px;border-radius:4px}
  .rf-rod.bad{background:rgba(190,50,30,.34)}
  .rf-rod label{font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#ffe9a8;line-height:1.15}
  .rf-rod label small{display:block;font-family:'IM Fell English',serif;font-style:italic;font-weight:400;font-size:14.5px;letter-spacing:0;text-transform:none;color:#e3cfa6}
  .rf-beads{position:relative;display:flex;height:46px;align-items:center;padding:0 4px}
  .rf-beads:before{content:'';position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-3px;border-radius:3px;background:linear-gradient(#d8b150,#8a6a26)}
  .rf-bead{position:relative;flex:0 0 auto;width:33px;height:33px;margin-right:3px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#9a9fa6,#3d4148 70%);box-shadow:0 3px 5px rgba(0,0,0,.5)}
  .rf-bead.on{background:radial-gradient(circle at 34% 30%,#ffd98a,#b0661c 70%)}
  .rf-bead.gap{margin-left:auto}
  .rf-bead:hover{outline:2px solid #ffe9a8;outline-offset:1px}
  .rf-rod output{font-family:'Almendra',serif;font-weight:700;font-size:18px;color:#ffe9a8;text-align:right;white-space:nowrap}
  .rf-foot{display:flex;align-items:center;gap:14px;margin-top:12px}
  .rf-foot .btn{--accent:#ffe9a8;white-space:nowrap}
  .rf-foot span{font-family:'IM Fell English',serif;font-style:italic;font-size:15px;color:#e3cfa6;line-height:1.25}
  .rf-cart{display:block;width:100%;height:236px;margin:10px 0 0;background:#4f475c;border:1px solid rgba(255,233,168,.25)}
  .rf-left .pmsg{margin-top:14px;min-height:110px}
  @media (max-width:900px){.rf{grid-template-columns:1fr}}
</style>
</head>
