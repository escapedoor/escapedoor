  var TALK = {

        a: '&ldquo;Nine years, dear, since you&rsquo;re wondering. My toll was one penny. I had a silver shilling, which is twelve pennies, and he gives no change. I told him that I would not pay a troll eleven pence for nothing. So I sat down to wait for somebody with change. It&rsquo;s the principle of the thing.&rdquo;' },

        a: '&ldquo;Sir Osric Maundrel, knight errant. I do not, as a rule, speak to cheesemongers. But a fortnight in this place has widened my mind.&rdquo;' },
      { q: 'Why can&rsquo;t you cross?',

      { q: 'That&rsquo;s a fine hawk.',

  function hints() {

      'Talk to all four people before you offer anybody anything. Each of them tells you what they have, and what they will take for it. Listen for the small words: unless, until, only.',

      'Work backwards from the bird. Sir Osric will take one thing only for him (ask him again when he has eaten something). Who has that thing? What will that person take for it? Go on until you come to something that you have got.',

  function begin() {
    paint();

  TOLL.thing('#mabel', 'goose', 'Mabel has found the warmest place in the room, and she is asleep in it with her head under her wing. Nobody has asked her to pay for anything.', isBusy);
  TOLL.thing('#window', null, 'Rain on the window, and beyond it the Keeper&rsquo;s lamp, burning over the gate. It will burn until the sun is up. It says so.', isBusy);
  TOLL.thing('#helmet', 'helmet', function () { return st.done['osric<feather'] ? 'Sir Osric&rsquo;s helmet, with a tall red feather in it. It looks like a kettle that has been to a wedding.' : 'Sir Osric&rsquo;s helmet. There is a small hole in the top, where a feather used to stand.'; }, isBusy);

  });

  /* ---------- the bird in the hand ---------- */
  function finish() {
    var file = ER.exitOk([Object.keys(st.done).sort().join('+')]);
    if (!file) { ER.say('Something is wrong with this lock: tell your teacher.'); return; }
    nextFile = file; ER.flag('h-file', file); TOLL.done('house'); TOLL.solved(); busy = true; held = null; paint();
    ER.narrate([
      'He weighs about as much as a small loaf, and he is fast asleep. Bryony is at your elbow before you have turned round. &ldquo;That&rsquo;s Bugle,&rdquo; she says. &ldquo;What do you want him for?&rdquo;',
      '&ldquo;Clause 2,&rdquo; you say. And you tell them all of it: the cock, the gate, and the lamp that must burn until the sun is up. Nobody says anything for a moment. The fire cracks.',
      '&ldquo;Nine years,&rdquo; says Mistress Tamsel slowly, &ldquo;I have sat under that Charter, and I never once asked to read it.&rdquo; She puts down her knitting. &ldquo;Well, don&rsquo;t stand there, dear. Take the bird out to that lamp.&rdquo;'

  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
