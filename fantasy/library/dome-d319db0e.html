  .hud,.btn,.ov-x,.tc-theme{font-weight:700}

  .ptitle{font-family:'Cinzel',serif;font-weight:700;font-size:9.500px;letter-spacing:1.200px;fill:#3a2a08;text-anchor:middle}
  .tw{animation:tw 3.1s steps(3) infinite}.tw.t2{animation-duration:4.3s;animation-delay:-1.4s}.tw.t3{animation-duration:5.2s;animation-delay:-2.6s}
  @keyframes tw{50%{opacity:.35}}
  .lamp .lg{animation:lg 2.8s steps(4) infinite;transition:opacity .5s}
  .lamp:nth-child(2n) .lg{animation-delay:-1.1s}.lamp:nth-child(3n) .lg{animation-delay:-2s}
  @keyframes lg{50%{opacity:.7}}
  .lamp .st{transition:fill .5s}
  .lamp.out .lg{opacity:0;animation:none}
  .lamp.out .st{fill:#333c78}
  .lamp.out .core{opacity:0}
  .lamp .smoke{opacity:0}
  .lamp.out .smoke{animation:smoke 1.6s ease-out 1}
  @keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
  .gear{animation:spin 14s linear infinite}
  .gear.g2{animation-duration:9s;animation-direction:reverse}.gear.g3{animation-duration:20s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .leaf{transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
  #chain,#rope{transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
  #chain.on,#rope.on{transition:none}
  #sunGlow{transition:opacity .6s}
  #dawnSky,#dayLight,#vigR{transition:opacity 4.5s}
  #plateGlow{animation:pg 2.8s ease-in-out infinite}
  @keyframes pg{0%,100%{opacity:0}50%{opacity:.4}}
  #octavo{animation:bob 4.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-3px)}}
</style>

<script>
(function () {
  var $ = ER.$, svg = $('#scene'), busy = false, talked = false, read = false, done = false, tickT = 0, saidSnuff = false;
  var LX = [500, 650, 800, 950, 1100], LY = [366, 314, 300, 314, 366];
  var STOP = { wd: 10, wu: 30, top: 90, eu: 150, ed: 170 }, phi = 10;
  var st = { lit: [1, 1, 1, 1, 1], order: '', open: false, sun: 'wd', t: { lamps: 0, shutters: 0, sun: 0 }, n: 0 };

  /* ---------- what the room is built from ---------- */
  (function () {
    var r = LIB.rng(41), s = ['', '', ''], i, x, y, k, a, out = '';
    for (i = 0; i < 150; i++) {
      x = 110 + r() * 1380; y = 50 + r() * 400;
      if (Math.pow((x - 800) / 690, 2) + Math.pow((470 - y) / 420, 2) > 1) continue;
      s[i % 3] += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + (0.7 + r() * 1.3).toFixed(1) + '"/>';
    }
    $('#tiny').innerHTML = '<g class="tw" fill="#dfe6ff">' + s[0] + '</g><g class="tw t2" fill="#fff3c9">' + s[1] + '</g><g class="tw t3" fill="#cfd8ff">' + s[2] + '</g>';
    for (i = 0; i < 12; i++) { a = i * 30; out += '<path transform="rotate(' + a + ')" d="M-6 -36L0 -50L6 -36Z"/>'; }
    $('#rays').innerHTML = out; out = '';
    LX.forEach(function (lx, n) {
      out += '<g class="lamp hot" data-i="' + n + '" transform="translate(' + lx + ' ' + LY[n] + ')">' +
        '<path d="M0 -74V-22" stroke="#b98f36" stroke-width="2.500" stroke-dasharray="5 3"/><circle cx="0" cy="-76" r="4" fill="#b98f36"/>' +
        '<circle class="lg" r="74" fill="url(#starG)"/>' +
        '<path class="smoke" d="M0 -22q-8-10 0-20t0-20" stroke="#cfd8ff" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<path class="st" d="M0-24L6-8.300L22.800-7.400L9.700 3.100L14.200 19.400L0 10.200L-14.200 19.400L-9.700 3.100L-22.800-7.400L-6-8.300Z" fill="#fff3b8" stroke="#b98f36" stroke-width="2" stroke-linejoin="round"/>' +
        '<circle class="core" r="5" fill="#fff"/><circle r="40" fill="transparent"/></g>';
    });
    $('#lamps').innerHTML = out; out = '';
    for (x = -980; x < 2600; x += 180) out += '<rect x="' + (x + 14) + '" y="520" width="152" height="188"/><rect x="' + (x + 26) + '" y="532" width="128" height="164" opacity=".45"/>';
    $('#panels').innerHTML = out; out = '';
    for (x = -980; x < 2600; x += 180) out += '<path transform="translate(' + (x + 90) + ' 614)" d="M0-13L3.200-3.200L13 0L3.200 3.200L0 13L-3.200 3.200L-13 0L-3.200-3.200Z"/>';
    $('#pstars').innerHTML = out; out = '';
    [770, 814, 866].forEach(function (yy) { out += '<path d="M-1000 ' + yy + 'H2600"/>'; });
    for (k = -12; k <= 12; k++) out += '<path d="M' + (800 + k * 110) + ' 734L' + (800 + k * 242) + ' 1066"/>';
    $('#planks').innerHTML = out;
    ER.$$('.slats').forEach(function (g) {
      var x0 = +g.getAttribute('data-x'), t = '';
      for (y = 536; y < 708; y += 14) t += '<path d="M' + (x0 + 8) + ' ' + y + 'h70" stroke="#3a2412" stroke-width="3"/><path d="M' + (x0 + 8) + ' ' + (y + 3) + 'h70" stroke="#9a6a40" stroke-width="1" opacity=".6"/>';
      g.innerHTML = t + '<rect x="' + (x0 + 1.5) + '" y="525.5" width="83" height="185" fill="none" stroke="#3a2412" stroke-width="3"/>';
    });
  })();

  ER.init({
    theme: 'fantasy', story: 'library', storyTitle: 'The Library That Locks at Dusk', id: 'dome', no: 'III', title: 'The Dome',
    go: 'Step inside',
    intro: [
      'A snail, a feather and a crown: the lowest step, the shelf above the globe, the jar next to the mirror. The three rings sank into the wood, and the door opened without a sound.',
      'Behind it is the biggest room in the library, and most of it is ceiling.',
      'A blue dome, five star-lamps, and a brass sun that went down two hours ago behind some painted hills. Under it all a machine ticks quietly, like something counting.'
    ],
    exit: {"next":"dawn","w":{"e8068b99":"2a859513"}}, tags: {"lamps":["28113e99"],"sun":["e3914ea6"],"order":["64c64892"]},
    hints: hints,
    onBegin: begin
  });

  var ORDER = '<h4>The Evening Order</h4>' +
    '<p>Every day at dusk, the Dome does four things by itself.</p>' +
    '<p>First the bell rings, and every door locks.</p>' +
    '<p>Next the brass sun goes down in the west.</p>' +
    '<p>Then the shutters close.</p>' +
    '<p>Last, the five star-lamps are lit, one at a time, from left to right.</p>' +
    '<p>At dawn the Dome does the opposite of all this, and it begins at the end.</p>' +
    '<p class="sig">E. W.</p>';

  function hints() {
    if (done) return null;
    if (!read) return ['plate', [
      'There is a brass plate on the front of the machine. Click on it and read every line.',
      'Then talk to Octavo, who is sitting on the machine. He knows what the bell rope is for.'
    ]];
    return ['dawn', [
      'The plate tells you how the Dome makes an evening. You want a morning. Read the last sentence on the plate again.',
      '&ldquo;It begins at the end.&rdquo; So start with the last line of the Evening Order and go up to the first. For each line, do the opposite. The opposite of &ldquo;lit&rdquo; is &ldquo;put out&rdquo;. What is the opposite of &ldquo;close&rdquo;? Of &ldquo;down&rdquo;? Of &ldquo;west&rdquo;? Of &ldquo;from left to right&rdquo;?',
      'Click the star-lamps to put them out, in the opposite direction. Drag the chain down for the shutters. Drag the brass sun along its rail to the place that is the opposite of &ldquo;down in the west&rdquo;. Do these three jobs in that order, and pull the bell rope only when they are all done.'
    ]];
  }
  function pips() { ER.pips((read ? 1 : 0) + (talked ? 1 : 0) + (done ? 1 : 0), 3); }
  function begin() {
    pips();
    tickT = setInterval(function () { if (!done) ER.sfx.tick(0.16); }, 1000);
    ER.narrate([
      'It is night in here too. Five star-lamps are burning, the shutters are closed, and the brass sun is down behind the hills in the west.',
      'Octavo lands on top of the machine and looks at everything twice.'
    ]);
  }

  /* ---------- things to look at ---------- */
  function thing(sel, word, line) {
    $(sel).addEventListener('click', function (e) {
      if (busy) return;
      if (word) ER.wordAt(e.clientX, e.clientY, word);
      if (line) ER.say(line);
    });
  }
  thing('#hillE', null, 'A word is cut into the brass under the painted hills on this side: EAST.');
  thing('#hillW', null, 'A word is cut into the brass under the painted hills on this side: WEST.');
  thing('#snuffer', 'snuffer', 'A long brass snuffer, for putting out lamps that are too high to reach.');
  thing('#engine', 'cog','Wheels inside wheels, all turning. It has done its job every day for three hundred years, and nobody has ever told it anything.');
  function win(e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'shutters');
    ER.say(st.open ? 'Outside the glass it is black night, with the real moon in it. The Dome does not look.' : 'Wooden shutters, closed. A brass chain hangs on the wall beside the left-hand window.');
  }
  $('#winL').addEventListener('click', win); $('#winR').addEventListener('click', win);
  $('#plate').addEventListener('click', function () {
    if (busy) return;
    $('#plateGlow').style.display = 'none';
    ER.read({ html: ORDER, cls: 'brass', clue: { id: 'order', title: 'The Evening Order', kind: 'Brass plate' }, done: function () { read = true; pips(); } });
  });
  $('#octavo').addEventListener('click', function () {
    if (busy) return;
    var c = CAST.octavo;
    LIB.snd.flutter();
    ER.talk({
      who: c.who, role: c.role, face: FACE('octavo', '#1d2350'),
      lines: [
        'So this is the Dome. I thought it would be smaller.',
        'That brass plate is the Evening Order. The Dome did all of it at dusk, by itself, as it does every day. I heard the bell from my desk.',
        { q: 'And in the morning?', a: 'In the morning it does something else, and the doors open. I have never seen it. I am always asleep by dawn. It is the main thing about moths.' },
        { q: 'Can I work it by hand?', a: 'Every part of it moves. The lamps, the chain for the shutters, the sun on its rail. The Founder did not trust clockwork. She did not trust anything much.' },
        'When you think it is morning, pull the bell rope. The bell tells the doors. If the Dome does not agree with you, it puts everything back as it was, and waits.',
        'Outside it is night. In here it is whatever the Dome says it is.'
      ],
      clue: { id: 'octavo3', title: 'Octavo, in the Dome' },
      done: function (seen) { if (seen) { talked = true; pips(); } }
    });
  });

  /* ---------- the star-lamps ---------- */
  function stamp(k) { st.t[k] = ++st.n; }
  ER.$$('.lamp').forEach(function (g) {
    var i = +g.getAttribute('data-i');
    g.addEventListener('click', function (e) {
      if (busy) return;
      if (!st.lit[i]) { ER.say('That one is out already. You have nothing to light it with.'); return; }
      st.lit[i] = 0; st.order += (i + 1); g.classList.add('out'); LIB.snd.snuff();
      if (st.order.length === 5) { stamp('lamps'); ER.say('All five star-lamps are out.'); }
      else if (!saidSnuff) { saidSnuff = true; ER.wordAt(e.clientX, e.clientY, 'snuffer'); ER.say('You reach up with the long brass snuffer, and the star-lamp goes out.'); }
    });
  });

  /* ---------- the shutters ---------- */
  function shutters(open) {
    st.open = open;
    ER.$$('.leaf').forEach(function (l) { l.style.transform = open ? 'scaleX(.1)' : ''; });
    LIB.snd.wood();
  }
  var chain = $('#chain'), cy0 = 0, cd = 0;
  ER.drag(chain, {
    start: function (e) { if (busy) return false; cy0 = ER.pt(svg, e).y; cd = 0; },
    move: function (e) { cd = Math.max(0, Math.min(70, ER.pt(svg, e).y - cy0)); chain.style.transform = 'translateY(' + cd + 'px)'; },
    end: function (e, moved) {
      var far = cd > 38; chain.style.transform = '';
      if (far) {
        ER.sfx.chain(); shutters(!st.open); stamp('shutters');
        ER.say(st.open ? 'The shutters fold back. Outside the glass it is black night. The Dome does not look.' : 'The shutters close again.');
      } else if (!moved) { ER.wordAt(e.clientX, e.clientY, 'chain'); ER.say('A brass chain for the shutters. It wants pulling down.'); }
    }
  });

  /* ---------- the sun on its rail ---------- */
  var sun = $('#sun'), lastSq = 0;
  function sunAt(a) {
    phi = a;
    var r = a * Math.PI / 180;
    sun.setAttribute('transform', 'translate(' + (800 + 520 * Math.cos(r)).toFixed(1) + ' ' + (470 - 300 * Math.sin(r)).toFixed(1) + ')');
    $('#sunGlow').setAttribute('opacity', (0.3 + 0.6 * Math.max(0, Math.sin(r) - 0.17)).toFixed(2));
  }
  function sunTo(a, ms, then) {
    var from = phi, t0 = Date.now();
    (function step() {
      var k = Math.min(1, (Date.now() - t0) / ms);
      sunAt(from + (a - from) * (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2));
      if (k < 1) requestAnimationFrame(step); else if (then) then();
    })();
  }
  var SUNLINE = {
    wd: 'The sun is down again behind the hills in the west.',
    wu: 'The sun is up, but only just, and in the west. It looks like the end of an afternoon.',
    top: 'The sun is right at the top of the Dome. It looks like the middle of the day.',
    eu: 'The sun is up over the hills in the east.',
    ed: 'The sun is down behind the hills in the east. It looks like the middle of the night.'
  };
  ER.drag(sun, {
    start: function () { if (busy) return false; },
    move: function (e, moved) {
      if (!moved) return;
      var p = ER.pt(svg, e), a = Math.atan2((470 - p.y) / 300, (p.x - 800) / 520) * 180 / Math.PI;
      if (a < -90) a = 170; else if (a < 10) a = 10; else if (a > 170) a = 170;
      if (Math.abs(a - phi) > 0.2 && Date.now() - lastSq > 420) { lastSq = Date.now(); LIB.snd.squeak(); }
      sunAt(a);
    },
    end: function (e, moved) {
      if (!moved) { ER.say('A brass sun as big as a cart wheel, on a curved rail. It moves if you drag it.'); return; }
      var best = 'wd', k;
      for (k in STOP) if (Math.abs(STOP[k] - phi) < Math.abs(STOP[best] - phi)) best = k;
      sunTo(STOP[best], 260);
      ER.sfx.click();
      if (best !== st.sun) { st.sun = best; stamp('sun'); }
      ER.say(SUNLINE[best]);
    }
  });

  /* ---------- the bell rope ---------- */
  var rope = $('#rope'), ry0 = 0, rd = 0;
  ER.drag(rope, {
    start: function (e) { if (busy) return false; ry0 = ER.pt(svg, e).y; rd = 0; },
    move: function (e) { rd = Math.max(0, Math.min(70, ER.pt(svg, e).y - ry0)); rope.style.transform = 'translateY(' + rd + 'px)'; },
    end: function (e, moved) {
      var far = rd > 38; rope.style.transform = '';
      if (far) judge();
      else if (!moved) { ER.wordAt(e.clientX, e.clientY, 'bell rope'); ER.say('The bell rope. Pull it down when you think it is morning.'); }
    }
  });
  function judge() {
    var seq = ['lamps', 'shutters', 'sun'].filter(function (k) { return st.t[k]; }).sort(function (a, b) { return st.t[a] - st.t[b]; }).join('>');
    var cand = st.order + '/' + seq + '/' + (st.open ? 'open' : 'shut') + '/' + st.sun, line;
    ER.sfx.chain();
    if (ER.exit([cand], { quiet: true, delay: 10500 })) { morning(); return; }
    LIB.snd.bigBell(0.8);
    if (!st.n && !st.order) {
      ER.say('The bell rings once. Every door in the library is locked already, so nothing happens. &ldquo;That is how an evening begins,&rdquo; says Octavo. &ldquo;You want to know how a morning ends.&rdquo;', 7000);
      return;
    }
    line = st.order.length < 5 ? '&ldquo;It cannot be morning with star-lamps still burning,&rdquo; says Octavo.'
      : !st.open ? '&ldquo;The shutters are still closed,&rdquo; says Octavo. &ldquo;What is the opposite of closed?&rdquo;'
      : !ER.check('sun', st.sun) ? '&ldquo;In the evening the sun goes down in the west,&rdquo; says Octavo. &ldquo;Take the opposite of each word. Where does that put it?&rdquo;'
      : !ER.check('lamps', st.order) ? '&ldquo;The lamps came on from left to right,&rdquo; says Octavo. &ldquo;The Dome would never put them out the same way.&rdquo;'
      : '&ldquo;All the right things, in the wrong order,&rdquo; says Octavo. &ldquo;It begins at the end. Read the plate from the bottom line up.&rdquo;';
    busy = true;
    ER.say('The bell rings once. Nothing unlocks. ' + line + ' Slowly, the Dome puts everything back.', 9000);
    setTimeout(reset, 1500);
  }
  function reset() {
    sunTo(STOP.wd, 1300);
    if (st.open) shutters(false);
    var lit = st.lit.slice();
    st = { lit: [1, 1, 1, 1, 1], order: '', open: false, sun: 'wd', t: { lamps: 0, shutters: 0, sun: 0 }, n: 0 };
    ER.$$('.lamp').forEach(function (g, i) {
      if (lit[i]) return;
      setTimeout(function () { g.classList.remove('out'); LIB.snd.relight(); }, 700 + i * 260);
    });
    setTimeout(function () { busy = false; }, 2300);
  }
  function morning() {
    done = true; busy = true; pips(); clearInterval(tickT);
    LIB.snd.bigBell(1);
    ER.say('The bell rings once. For a moment the Dome does nothing at all.', 2800);
    setTimeout(function () {
      $('#dawnSky').style.opacity = 0.94; $('#dayLight').style.opacity = 1; $('#vigR').style.opacity = 0.45;
      $('#sunGlow').setAttribute('opacity', 1); LIB.snd.rise();
    }, 2300);
    setTimeout(function () {
      ER.say('Then the painted sky goes from blue to gold. Far below you, a lock goes <em>clunk</em>. Then another. Then all of them.', 7000);
      [900, 1500, 1950, 2300, 2580, 2800, 2980].forEach(function (t, i) { setTimeout(function () { ER.sfx.tock(0.9 - i * 0.1); }, t); });
      setTimeout(ER.sfx.ok, 3600);
    }, 3600);
  }
})();
