<title>The Landing · The Library That Locks at Dusk</title>

<style>
  body{--bg:#0d1118;--accent:#b9d2ff;--font-display:'Almendra',serif;--font-ui:'Cinzel',serif;--font-body:'IM Fell English',Georgia,serif;
    --tc-bg:rgba(9,13,20,.93);--tc-ink:#dfe6f2;--cap-bg:rgba(10,14,22,.94);--cap-ink:#e9eef6;--panel:#161c27;--face-bg:#2a3350;--q-ink:#a9bfe6;--fade:#05070b;
    --hud-bg:rgba(9,13,20,.72)}
  .hud,.btn,.ov-x{font-weight:600}
  .tc-room{font-weight:700;font-style:italic;letter-spacing:.01em;color:#dbe6ff}
  .tc-text,.cap{font-size:clamp(19px,1.6vw,24px)}
  .rune{animation:rune 3.4s steps(3) infinite}.rune:nth-child(2n){animation-delay:-1.2s}.rune:nth-child(3n){animation-delay:-2.3s}
  @keyframes rune{50%{opacity:.28}}
  #lanFlame{transform-origin:650px 128px;animation:fl 2s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.12)}60%{transform:scale(1.08,.93)}}
  #lanGlow{animation:gl 3.6s steps(4) infinite}
  @keyframes gl{50%{opacity:.78}}
  #cloud{animation:cloud 46s linear infinite}
  @keyframes cloud{from{transform:translateX(-110px)}to{transform:translateX(120px)}}
  .mote{animation:mote 14s linear infinite}
  @keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translate(40px,120px);opacity:0}}
  #octavo{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  #sheet{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  #sheet.on{transition:none}
  #sheet.off{transition:transform .9s cubic-bezier(.5,0,.8,.4),opacity .5s .5s;opacity:0;pointer-events:none}
  #page{transition:transform .25s}
  #page.on{transition:none}
  #pageGlow{animation:pg 2.6s ease-in-out infinite}
  @keyframes pg{0%,100%{opacity:0}50%{opacity:.35}}
  .bk{transition:transform .35s}
  .disc{transition:opacity .5s}
  #doorOpen{transition:opacity 1.2s}
  .lbl{font-family:'Cinzel',serif;font-weight:700;font-size:9px;letter-spacing:1px;fill:#3a2a08;text-anchor:middle}

  /* a page written backwards */
  .bw{width:min(600px,92vw)}
  .bw .doc{width:100%}
  .bw .back{transform:scaleX(-1);-webkit-user-select:none;user-select:none}
  .bw-cap{margin:16px 0 0;text-align:center;font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:20px;color:#cfdcf5}
  /* the same page, in the mirror */
  .mir{position:relative;padding:34px 30px 30px;border-radius:230px 230px 10px 10px / 150px 150px 10px 10px;
    background:linear-gradient(120deg,#17110e,#3a2a20 30%,#120c0a 60%,#2a1e17);box-shadow:0 26px 70px rgba(0,0,0,.75),inset 0 0 0 3px #7d6a3a,inset 0 0 0 6px #17110e}
  .mir-glass{position:relative;padding:86px 44px 44px;border-radius:200px 200px 4px 4px / 120px 120px 4px 4px;overflow:hidden;
    background:linear-gradient(160deg,#5c6f8c,#27344a 42%,#18212f 70%,#33435c)}
  .mir-glass:after{content:'';position:absolute;left:-10%;top:0;width:46%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.14) 48%,rgba(255,255,255,0) 60%)}
  .mir .doc{width:min(540px,84vw);max-height:none;transform:rotate(-1.2deg);font-size:21px;line-height:1.36;padding:28px 36px 22px}
  .mir .doc p{margin-bottom:9px}
  .mir-cap{margin:14px 0 0;text-align:center;font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:18px;color:#b9c6dc}

  /* the Founder's door */
  .wh{display:grid;grid-template-columns:520px 330px;gap:26px;padding:22px 26px 20px;color:#e6edf8;
    background:#171d28 linear-gradient(160deg,#232c3b,#11161f);border:1px solid #44536b;box-shadow:0 26px 70px rgba(0,0,0,.75),inset 0 0 0 4px #0c1018}
  .wh svg.wheel{display:block;width:520px;height:520px;touch-action:none}
  .ring{cursor:grab}.ring.on{cursor:grabbing}
  .wh-say{margin:2px 0 14px;font-family:'IM Fell English',Georgia,serif;font-size:19.5px;line-height:1.36;color:#dfe6f2}
  .wh h5{margin:0 0 8px;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#b9d2ff}
  .wh-found{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;min-height:150px;align-content:start}
  .fs{display:flex;align-items:center;gap:9px;font-family:'IM Fell English',Georgia,serif;font-size:15.5px;line-height:1.14;color:#cfd8e8}
  .fs svg{flex:0 0 auto}
  .fs b{display:block;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#f0d98f}
  .wh-none{grid-column:1/3;font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:18px;color:#9fb0c9}
  .wh-help{margin:14px 0 0;font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#8ea0bd}
  .wh-msg{min-height:76px;margin:12px 0 10px;font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:18.5px;line-height:1.3;color:#ffd9a0}
  .wh-side{display:flex;flex-direction:column}
  .wh-side .btn{align-self:flex-start;margin-top:auto}
</style>
</head>

<script>
(function () {
  var $ = ER.$, svg = $('#scene'), busy = false, talked = false, mirror = false, readOnce = false, solved = false, found = {}, owlT = 0;
  /* six hiding places, and what is in each */
  var PLACES = {

        row2('B', 718, [['#2a4a7a', 34, 120], [G, 38, 126], [R, 36, 116], [G, 40, 130], ['#5a3a22', 36, 112], ['#6f7482', 32, 122], ['#4a2b4e', 38, 118]]);

  ER.init({

      'Poems at the left end, stones at the right. The fattest book was the lightest, and the smallest was the heaviest. When the last one stood on the shelf, the gate swung open by itself.',

  var PAGE = '<p>To whoever needs my Dome at night.</p>' +

    '<p>The third is in the jar next to the mirror.</p>' +

  function rightFound() { return Object.keys(found).filter(function (k) { return ER.check('any', PLACES[k].sign); }).length; }
  function hints() {
    if (solved) return null;

      'The page beside the door is written backwards. What do people use to turn writing the right way round?',
      'Something tall is standing under the dust sheet on the right. Drag the sheet down to pull it off.',
      'Now drag the page from the wall onto the mirror, and read it there. It will be kept in your Notebook.'

    if (rightFound() < 3) return ['signs', [
      'The page gives you three places. Read each one slowly. The small words matter most: under, behind, between, above, in, next to.',
      'There are two jars, two shelves with a red book between green ones, and four steps. Only one of each is in the right place. Which step is the lowest? Which shelf is above the globe? Which jar is next to the mirror?',

      'Click on the door. The page says which ring takes which sign: the biggest ring takes the first, the middle ring the second, the smallest ring the third.',
      'Drag a ring round, or click on it, until the sign you want is at the top, under the arrow. Do this for all three rings, then push the door.',

    ]];
  }
  function pips() { ER.pips((talked ? 1 : 0) + (readOnce ? 1 : 0) + (solved ? 1 : 0), 3); }

  function thing(sel, word, line) {

  thing('#globe', 'globe', 'A globe. Marrowby is not on it.');
  thing('#hourglass', 'hourglass', 'All the sand is at the bottom. Nobody has turned it over for a long time.');

  $('#mirror').addEventListener('click', function (e) {

  });
  $('#octavo').addEventListener('click', function () {
    if (busy) return;
    var c = CAST.octavo;
    LIB.snd.flutter();
    ER.talk({
      who: c.who, role: c.role, face: FACE('octavo', '#2a3350'),
      lines: [
        'This is the Founder&rsquo;s landing. That is her door, and her Dome is behind it. I have never been inside. I cannot turn the rings.',

        { q: 'What is in the Dome?', a: 'The sky. Her sky. The doors of this library never look out of the window. They watch the Dome. When the brass sun goes down up there, they lock. When it comes up again, they open.' },
        'It has never once been wrong. But then, nobody has ever asked it to be.'
      ],
      clue: { id: 'octavo2', title: 'Octavo, on the landing' },

  });

  /* ---------- hiding places ---------- */

  }
  $('#st1').addEventListener('click', function (e) { if (!busy) reveal('st1', e, 'You feel under the lowest step. Your fingers find a small brass disc, with a snail on it.'); });

  /* ---------- the door: three rings ---------- */
  $('#door').addEventListener('click', function () { if (!busy) openWheel(); });
  function annulus(R, r) {

  function topOf(n) { return RINGS[n].signs[pos[n]]; }

          '<path transform="rotate(' + (i * 45 + 22.5) + ')" d="M0 ' + (-R.r1 + 7) + 'V' + (-R.r0 - 7) + '" stroke="#7d5f1d" stroke-width="1.600"/>';

      '<g pointer-events="none"><path d="M-27 -252L-17 -52M27 -252L17 -52" stroke="#fff6d8" stroke-width="2" opacity=".5"/>' +
      '<path d="M-20 -270H20L0 -238Z" fill="url(#whB)" stroke="#33240a" stroke-width="2.500" stroke-linejoin="round"/></g></svg>' +
      '<div class="wh-side"><p class="wh-say">Three brass rings, one inside another, with eight signs on each. Above them a brass arrow points down.</p>' +

    box.innerHTML = s;
    ER.glossIn(box, '.wh-say');
    var wheel = box.querySelector('svg.wheel'), msg = box.querySelector('.wh-msg'), fl = box.querySelector('.wh-found'), keys = Object.keys(found);
    fl.innerHTML = keys.length ? '' : '<div class="wh-none">None yet. The page beside the door says where to look.</div>';
    keys.forEach(function (k) {
      var p = PLACES[k], d = ER.el('div', 'fs', LIB.disc(p.sign, 46) + '<span><b></b><i></i></span>');
      d.querySelector('b').textContent = p.sign; d.querySelector('i').textContent = p.where; d.querySelector('i').style.fontStyle = 'normal';
      fl.appendChild(d);
    });
    function idx(a) { return ((Math.round(-a / 45) % 8) + 8) % 8; }
    function set(g, n, a) { rot[n] = a; g.setAttribute('transform', 'rotate(' + a.toFixed(2) + ')'); }
    function settle(g, n, to) {
      var from = rot[n], t0 = Date.now();
      pos[n] = idx(to); g.setAttribute('data-top', topOf(n));
      (function step() {
        var k = Math.min(1, (Date.now() - t0) / 140);
        set(g, n, from + (to - from) * k);
        if (k < 1) requestAnimationFrame(step);
      })();
    }
    ER.$$('.ring', box).forEach(function (g) {
      var n = +g.getAttribute('data-n'), prev = 0, last = 0;
      function ang(e) { var p = ER.pt(wheel, e); return Math.atan2(p.x, -p.y) * 180 / Math.PI; }
      ER.drag(g, {
        start: function (e) { if (solved) return false; prev = ang(e); last = idx(rot[n]); msg.textContent = ''; },
        move: function (e, moved) {
          if (!moved) return;
          var a = ang(e), d = a - prev; prev = a;
          if (d > 180) d -= 360; if (d < -180) d += 360;
          set(g, n, rot[n] + d);
          if (idx(rot[n]) !== last) { last = idx(rot[n]); LIB.snd.ratchet(); }
        },
        end: function (e, moved) {
          if (moved) settle(g, n, Math.round(rot[n] / 45) * 45);
          else { settle(g, n, Math.round(rot[n] / 45) * 45 + (ang(e) >= 0 ? 45 : -45)); LIB.snd.ratchet(); }
        }
      });
    });
    box.querySelector('.btn').addEventListener('click', function () {
      if (solved) return;
      var tops = [topOf(0), topOf(1), topOf(2)], from = tops.map(function (t) {
        var k = Object.keys(found).filter(function (q) { return PLACES[q].sign === t; })[0];
        return k || null;
      }), bad;
      if (ER.exit([tops.join('-')], { delay: 6000 })) {
        solved = true; busy = true; pips(); clearInterval(owlT);
        msg.style.color = '#b9e6b0'; msg.textContent = 'The three rings sink into the wood. Inside the door, one after another, three bolts slide back.';
        ER.sfx.clunk(); setTimeout(ER.sfx.clunk, 420); setTimeout(ER.sfx.clunk, 840);
        setTimeout(function () {
          ER.closeAll();
          $('#doorOpen').style.opacity = 1; $('#wheelMini').setAttribute('opacity', 0); ER.sfx.creak();
          ER.say('The door opens inwards without a sound. Beyond it everything is dark blue, with small lights hanging in it.', 4200);
        }, 1900);
        return;
      }
      ER.sfx.no(); ER.shake(wheel);
      if (from.indexOf(null) >= 0) { msg.innerHTML = '&ldquo;Where did you find that one?&rdquo; says Octavo. &ldquo;Find the signs first. Then turn the rings.&rdquo;'; return; }
      bad = from.filter(function (k) { return !ER.check('any', PLACES[k].sign); })[0];
      msg.innerHTML = bad ? 'The door does not move. &ldquo;One of those signs was ' + PLACES[bad].where + ',&rdquo; says Octavo. &ldquo;Is that what the page says?&rdquo;'
        : 'The door does not move. &ldquo;Three good signs, on the wrong rings,&rdquo; says Octavo. &ldquo;The biggest ring takes the first sign.&rdquo;';
    });
    ER.open('ov-lock', box);
  }
})();
</script>
