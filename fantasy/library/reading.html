<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Reading Room · The Library That Locks at Dusk</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-fantasy.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="kit.css">
<style>
  body{--bg:#170b10;--accent:#f0b65a;--font-display:'Uncial Antiqua',serif;--font-ui:'Almendra',serif;--font-body:'EB Garamond',Georgia,serif;
    --tc-bg:rgba(24,10,15,.92);--tc-ink:#f3e2c2;--cap-bg:rgba(26,12,16,.94);--panel:#27151b;--face-bg:#2d2440;--q-ink:#e3b98a;--fade:#0c0508;
    --hud-bg:rgba(22,9,13,.72)}
  .hud,.btn,.ov-x{font-weight:700}
  .tc-room{letter-spacing:.01em;color:#f6dca6}
  .plq{font-family:'Uncial Antiqua',serif;font-size:21px;letter-spacing:3px;fill:#e9c876;text-anchor:middle}
  .flame{animation:fl 1.9s ease-in-out infinite}
  .flame.f2{animation-duration:2.3s;animation-delay:-.7s}.flame.f3{animation-duration:1.6s;animation-delay:-1.1s}.flame.f4{animation-duration:2.1s;animation-delay:-.3s}
  @keyframes fl{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.12)}60%{transform:scale(1.08,.93)}}
  .glow{animation:gl 3.4s steps(4) infinite}.glow.g2{animation-delay:-1.3s}.glow.g3{animation-delay:-2.2s}
  @keyframes gl{50%{opacity:.72}}
  .mote{animation:mote 16s linear infinite}
  @keyframes mote{0%{transform:translate(0,0);opacity:0}12%{opacity:.7}88%{opacity:.5}100%{transform:translate(-70px,-150px);opacity:0}}
  #noticeGlow{animation:ng 2.8s ease-in-out infinite}
  @keyframes ng{0%,100%{opacity:0}50%{opacity:.4}}
  #octavo{animation:bob 4.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-3px)}}
  #gate{transform-origin:1396px 480px;transition:transform 1.7s cubic-bezier(.5,0,.3,1)}
  #night,#stars,#shaft{transition:opacity 2.4s}
  #town circle{transition:opacity 1.2s}
  #lampGlow{animation:gl 4.1s steps(4) infinite}

  /* the returns shelf: a scale, a trolley, a shelf, a rule */
  .rs{display:grid;grid-template-columns:400px 650px;gap:24px;padding:20px 24px 16px;color:#f3e6cf;
    background:#2a171c linear-gradient(165deg,#3b2228,#1e1014);border:1px solid #6b4a3a;box-shadow:0 26px 70px rgba(0,0,0,.72),inset 0 0 0 4px #1a0c10}
  .rs-plate{position:relative;padding:20px 26px 14px;border:3px solid #6f531a;border-radius:4px;color:#2e2008;
    background:linear-gradient(135deg,#8a6a26,#e6c873 26%,#b08a35 52%,#f0d98f 76%,#8a6a26);font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:19.5px;
    line-height:1.24;text-shadow:0 1px 0 rgba(255,240,190,.65)}
  .rs-plate h4{margin:0 0 11px;padding-bottom:9px;border-bottom:2px solid rgba(74,54,12,.5);font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700;
    font-size:16px;letter-spacing:.03em;text-align:center}
  .rs-plate p{margin:0 0 8px}
  .rs-plate:before,.rs-plate:after{content:'';position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f7e7ae,#6f531a)}
  .rs-plate:before{left:8px}.rs-plate:after{right:8px}
  .rs-plate .w:hover,.rs-ledger .w:hover{color:#7b1f14}
  .rs-ledger{margin-top:18px;padding:14px 18px 10px;background:#f1e7c9;color:#2a2118;border-left:12px solid #5a2a22;font-family:'IM Fell English',Georgia,serif;
    font-size:16px;line-height:1.2;box-shadow:0 6px 16px rgba(0,0,0,.45)}
  .rs-ledger h4{margin:0 0 6px;font-family:'Uncial Antiqua',serif;font-weight:normal;font-size:17px;color:#5a2a22}
  .rs-ledger table{width:100%;border-collapse:collapse}
  .rs-ledger th{font-family:'Almendra',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:#7a5a3a;padding:0 8px 2px 0;border-bottom:2px solid #7a5a3a}
  .rs-ledger td{padding:5px 8px 5px 0;border-bottom:1px solid #c5b48a;vertical-align:top;font-family:'EB Garamond',Georgia,serif;font-size:17px;
    font-variant-numeric:lining-nums;-webkit-font-feature-settings:'lnum';font-feature-settings:'lnum'}
  .rs-ledger tr:last-child td{border-bottom:0}
  .rs-ledger td:first-child{font-family:'IM Fell English',Georgia,serif;font-size:16px;font-style:italic;width:35%}
  .rs-ledger td:nth-child(2){width:15%}
  .rs-ledger tr.oct td{font-family:'Caveat',cursive;font-style:normal;font-size:17.5px;line-height:1.02;color:#3d3566}
  .rs-scale{position:relative;width:650px;height:240px}
  .rs-scale svg{position:absolute;left:0;top:0;width:650px;height:240px;display:block;overflow:visible}
  #rsBeam{transform-origin:325px 74px}
  #rsBeam,#rsPanL,#rsPanR{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
  .pan{position:absolute;top:112px;width:176px;height:70px;display:flex;align-items:flex-end;justify-content:center;transition:top .55s cubic-bezier(.3,1.5,.5,1);cursor:pointer}
  .pan[data-p=L]{left:22px}.pan[data-p=R]{left:452px}
  .rs-read{height:28px;text-align:center;font-family:'EB Garamond',Georgia,serif;font-size:18.5px;line-height:28px;font-style:italic;color:#f0d9a8;white-space:nowrap}
  .rs-read b{font-style:normal;font-weight:600;color:#fff1cf}
  .rs-trolley{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:14px;height:134px;margin:6px 40px 0;padding:0 16px;border-bottom:12px solid #7a5230;
    box-shadow:0 4px 0 #4a2f1c}
  .rs-trolley:before,.rs-trolley:after{content:'';position:absolute;bottom:-32px;width:20px;height:20px;border-radius:50%;background:#17120f;box-shadow:inset 0 0 0 5px #17120f,inset 0 0 0 8px #8a7a5a}
  .rs-trolley:before{left:18px}.rs-trolley:after{right:18px}
  .rs-lab{position:absolute;font-family:'Almendra',serif;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#b89a78;opacity:.8;pointer-events:none}
  .rs-trolley .rs-lab{left:-6px;top:4px}
  .rs-shelf{position:relative;display:flex;justify-content:center;gap:8px;height:140px;margin:28px 20px 0;align-items:flex-end;
    border-bottom:12px solid #c9a044;box-shadow:0 4px 0 #7d5f1d;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.22))}
  .place{width:80px;height:132px;display:flex;align-items:flex-end;justify-content:center;border:1.5px dashed rgba(240,217,143,.34);border-bottom:0;border-radius:3px 3px 0 0;cursor:pointer}
  .rs-shelf .rs-lab{left:-6px;top:4px}
  .rs-foot{display:flex;align-items:center;gap:14px;margin-top:12px;min-height:44px}
  .rs-msg{flex:1;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:18.5px;line-height:1.25;color:#ffd9a0}
  .bk{position:relative;width:var(--w);height:var(--h);flex:0 0 auto;background:var(--c);color:var(--ink);border-radius:2px 2px 1px 1px;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 3px 0 0 rgba(255,255,255,.14),inset -4px 0 0 rgba(0,0,0,.24),0 2px 5px rgba(0,0,0,.5);
    font-family:'Almendra',serif;font-weight:700;font-size:var(--f,13px);line-height:1.06;text-align:center;overflow:hidden}
  .bk i{position:absolute;left:0;right:0;height:3px;background:rgba(240,217,143,.72);pointer-events:none}
  .bk i:first-of-type{top:8px}.bk i:last-of-type{bottom:8px}
  .bk span{-webkit-writing-mode:vertical-rl;writing-mode:vertical-rl;pointer-events:none;white-space:nowrap}
  .bk[data-id=t]{background-image:radial-gradient(circle at 20% 24%,rgba(255,255,255,.22) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.28) 0 2px,transparent 3px),
    radial-gradient(circle at 40% 82%,rgba(255,255,255,.16) 0 1.5px,transparent 2.5px);border-radius:1px}
  .bk[data-id=t] i{display:none}
  .pan .bk{width:var(--h);height:var(--w)}
  .pan .bk i{left:auto;right:auto;top:0;bottom:0;width:3px;height:auto}
  .pan .bk i:first-of-type{left:8px;top:0}.pan .bk i:last-of-type{right:8px;bottom:0}
  .pan .bk span{-webkit-writing-mode:horizontal-tb;writing-mode:horizontal-tb}
  .bk.fly{box-shadow:0 14px 26px rgba(0,0,0,.6)}
</style>
</head>

  $('#trolley').addEventListener('click', function (e) { tryOpen(e, 'trolley', 'The returns trolley. Five books came back today. The thin yellow one is your aunt&rsquo;s.'); });
  $('#scale').addEventListener('click', function (e) { tryOpen(e, 'scale', 'A brass scale. A moth is sitting on top of it. The moth is wearing glasses.'); });
  $('#wallshelf').addEventListener('click', function (e) { tryOpen(e, 'brass', 'A short shelf with room for five books, and a brass plate under it. The writing on the plate is very small.'); });

  /* ---------- the returns shelf ---------- */
  function openShelf() {
    var box = ER.el('div', 'rs'), s;
    s = '<div class="rs-left"><div class="rs-plate">' + ER.gloss(RULE) + '</div><div class="rs-ledger">' + ER.gloss(LEDGER) + '</div></div>' +
      '<div class="rs-right"><div class="rs-scale"><svg viewBox="0 0 650 240"><defs>' +
      '<linearGradient id="rsB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e3a0"/><stop offset=".5" stop-color="#c9a044"/><stop offset="1" stop-color="#7d5f1d"/></linearGradient></defs>' +
      '<path d="M262 226h126l-16-16h-94z" fill="url(#rsB)"/><rect x="250" y="224" width="150" height="9" rx="3" fill="#7d5f1d"/>' +
      '<rect x="319" y="74" width="12" height="140" fill="url(#rsB)"/>' +
      '<g id="rsPanL"><path d="M110 76L34 184M110 76L186 184" stroke="#b8923a" stroke-width="2.500"/><path d="M22 182H198Q110 216 22 182Z" fill="url(#rsB)"/><path d="M22 182H198" stroke="#f7e3a0" stroke-width="3.500" stroke-linecap="round"/></g>' +
      '<g id="rsPanR"><path d="M540 76L464 184M540 76L616 184" stroke="#b8923a" stroke-width="2.500"/><path d="M452 182H628Q540 216 452 182Z" fill="url(#rsB)"/><path d="M452 182H628" stroke="#f7e3a0" stroke-width="3.500" stroke-linecap="round"/></g>' +
      '<g id="rsBeam"><rect x="102" y="69.500" width="446" height="9" rx="4.500" fill="url(#rsB)"/><circle cx="110" cy="74" r="7" fill="#7d5f1d"/><circle cx="540" cy="74" r="7" fill="#7d5f1d"/></g>' +
      '<circle cx="325" cy="74" r="12" fill="#7d5f1d"/><circle cx="325" cy="74" r="6" fill="#f7e3a0"/><ellipse cx="325" cy="60" rx="20" ry="4.500" fill="url(#rsB)"/>' +
      '<use href="#ch-octavo" x="299" y="-9" width="52" height="68"/></svg>' +
      '<div class="pan" data-p="L"></div><div class="pan" data-p="R"></div></div><div class="rs-read"></div>' +
      '<div class="rs-trolley"><span class="rs-lab">trolley</span></div>' +
      '<div class="rs-shelf"><span class="rs-lab">shelf</span><div class="place"></div><div class="place"></div><div class="place"></div><div class="place"></div><div class="place"></div></div>' +
      '<div class="rs-foot"><div class="rs-msg"></div><button type="button" class="btn">Try the gate</button></div></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.rs-trolley'), pans = ER.$$('.pan', box), places = ER.$$('.place', box), read = box.querySelector('.rs-read'), msg = box.querySelector('.rs-msg');
    START.forEach(function (id) {
      var b = BOOKS[id], n = ER.el('div', 'bk dnd-item', (id === 't' ? '' : '<i></i>') + '<span>' + b.t + '</span>' + (id === 't' ? '' : '<i></i>')), at = where[id];
      n.setAttribute('data-id', id);
      n.style.setProperty('--w', b.w + 'px'); n.style.setProperty('--h', b.h + 'px'); n.style.setProperty('--c', b.c); n.style.setProperty('--ink', b.ink); n.style.setProperty('--f', b.f + 'px');
      (at === 'L' ? pans[0] : at === 'R' ? pans[1] : at === 'home' ? tray : places[+at]).appendChild(n);
    });
    function idIn(n) { var b = n.querySelector('.bk'); return b ? b.getAttribute('data-id') : ''; }
    function weigh(quiet) {
      var l = idIn(pans[0]), r = idIn(pans[1]), d = 0;
      if (l && r) d = ER.check('hv', l + '>' + r) ? 1 : -1; else if (l) d = 1; else if (r) d = -1;
      box.querySelector('#rsBeam').style.transform = 'rotate(' + (-6.5 * d) + 'deg)';
      box.querySelector('#rsPanL').style.transform = 'translateY(' + (24 * d) + 'px)';
      box.querySelector('#rsPanR').style.transform = 'translateY(' + (-24 * d) + 'px)';
      pans[0].style.top = (112 + 24 * d) + 'px'; pans[1].style.top = (112 - 24 * d) + 'px';
      if (l && r) {
        read.innerHTML = d > 0 ? '<b>' + BOOKS[l].n + '</b> goes down. It is heavier than <b>' + BOOKS[r].n + '</b>.'
          : '<b>' + BOOKS[l].n + '</b> goes up. It is lighter than <b>' + BOOKS[r].n + '</b>.';
        if (!quiet) setTimeout(LIB.snd.thud, 240);
      } else if (l || r) read.textContent = 'One book, and nothing on the other side. That tells you very little.';
      else read.textContent = 'Put one book on each side of the scale.';
    }
    function remember() {
      ER.$$('.bk', box).forEach(function (b) {
        var p = b.parentNode, id = b.getAttribute('data-id');
        where[id] = p === pans[0] ? 'L' : p === pans[1] ? 'R' : p === tray ? 'home' : String(places.indexOf(p));
      });
    }
    ER.dnd(box, { item: '.bk', slot: '.pan, .place', home: tray, lock: function () { return solved; },
      change: function () { remember(); weigh(); msg.textContent = ''; LIB.snd.book(); } });
    weigh(true);

    box.querySelector('.btn').addEventListener('click', function () {
      if (solved) return;
      var ids = places.map(idIn);
      if (ids.indexOf('') >= 0) {
        msg.textContent = 'The gate does not move. There are still books off the shelf.';
        ER.sfx.chain(); ER.shake(box.querySelector('.rs-shelf')); return;
      }
      if (ER.exit([ids.join('-')], { delay: 6200 })) {
        solved = true; busy = true; pips(); clearInterval(windT);
        msg.style.color = '#b9e6b0'; msg.textContent = 'Somewhere inside the wall, something heavy drops.';
        LIB.snd.thud(1.4);
        setTimeout(function () {
          ER.closeAll();
          shelve(ids);
          $('#gate').style.transform = 'scaleX(.07)'; ER.sfx.creak();
          ER.say('The iron gate swings open by itself. &ldquo;After you,&rdquo; says Octavo. &ldquo;I have always wanted to see up there.&rdquo;', 4400);
        }, 1700);
        return;
      }
      ER.sfx.chain(); ER.shake(box.querySelector('.rs-shelf'));
      msg.innerHTML = ER.gloss(!ER.check('s1', ids[0]) ? 'The gate rattles and stays shut. &ldquo;Line one,&rdquo; says Octavo. &ldquo;The lightest. Did you weigh them, or did you only look at them?&rdquo;'
        : !ER.check('s5', ids[4]) ? 'The gate rattles and stays shut. &ldquo;Line two,&rdquo; says Octavo. &ldquo;The heaviest goes at the right end. It is not always the biggest.&rdquo;'
        : !ER.check('s3', ids[2]) ? 'The gate rattles and stays shut. &ldquo;Line three,&rdquo; says Octavo. &ldquo;The tallest. That one you may do by eye.&rdquo;'
        : 'The gate rattles and stays shut. &ldquo;The last two,&rdquo; says Octavo. &ldquo;Which is older? The years are in the returns book. A small number is a long time ago.&rdquo;');
    });
    ER.addClue('rule', 'The Founder’s rule for returns', RULE, 'brass', 'Brass plate', true);
    ER.addClue('ledger', 'The returns book', LEDGER, 'ledger', 'Library book', true);
    ER.open('ov-lock', box);
  }
})();
</script>
</body>
</html>
