<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dawn, at Eight in the Evening · The Library That Locks at Dusk</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-fantasy.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="kit.css">
<style>
  body{--bg:#060a1f;--accent:#ffd27a;--font-display:'Uncial Antiqua',serif;--font-ui:'Almendra',serif;--font-body:'EB Garamond',Georgia,serif;
    --tc-bg:rgba(6,10,31,.93);--tc-ink:#f1e9d2;--cap-bg:rgba(7,11,30,.93);--panel:#12173a;--fade:#03051a;--hud-bg:rgba(6,10,31,.7)}
  .hud,.btn,.ov-x{font-weight:700}
  .tc-room{font-size:clamp(32px,4.8vw,62px);color:#ffe2a0}
  .openT{font-family:'Uncial Antiqua',serif;font-size:25px;letter-spacing:3px;fill:#f6e7bd;text-anchor:middle}
  .tw{animation:tw 3.3s steps(3) infinite}.tw.t2{animation-duration:4.6s;animation-delay:-1.4s}.tw.t3{animation-duration:5.4s;animation-delay:-2.7s}
  @keyframes tw{50%{opacity:.3}}
  .rune{animation:rune 3.4s steps(3) infinite}.rune:nth-child(2n){animation-delay:-1.2s}.rune:nth-child(3n){animation-delay:-2.3s}
  @keyframes rune{50%{opacity:.3}}
  .halo{animation:halo 4s steps(4) infinite}.halo.h2{animation-delay:-1.6s}.halo.h3{animation-delay:-2.7s}
  @keyframes halo{50%{opacity:.75}}
  .walker{animation:walk 70s linear forwards}
  .walker.w2{animation-duration:84s}.walker.w3{animation-duration:96s}.walker.w4{animation-duration:110s}
  @keyframes walk{to{transform:translate(64px,-34px)}}
  .lant{animation:lant 2.2s ease-in-out infinite alternate}
  @keyframes lant{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  #sign{transform-origin:1004px 512px;animation:sway 3.6s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
  .orbit{transform-origin:800px 370px;animation:orbit 5s linear infinite}
  .orbit.o2{animation-duration:3.6s;animation-direction:reverse}.orbit.o3{animation-duration:7s}
  @keyframes orbit{to{transform:rotate(360deg)}}
  .smoke{animation:smoke 7s linear infinite}.smoke.s2{animation-delay:-3.4s}
  @keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.5}100%{transform:translate(26px,-70px) scale(1.5);opacity:0}}
  .fly{animation:fly 6s ease-in-out infinite alternate}.fly.f2{animation-duration:8s;animation-delay:-3s}.fly.f3{animation-duration:5s;animation-delay:-1s}
  @keyframes fly{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(26px,-18px);opacity:.3}}

  /* the date slip */
  .slip{position:fixed;right:3vw;top:64px;z-index:34;width:min(430px,92vw);padding:22px 28px 20px;color:#2b2218;display:none;transform:rotate(1deg);
    background:#f3e9cc repeating-linear-gradient(transparent 0 37px,rgba(120,96,60,.3) 37px 38px);box-shadow:0 20px 60px rgba(0,0,0,.6);border-top:10px solid #5a2a22}
  .slip.on{display:block}
  .slip h3{margin:0 0 2px;font-family:'Uncial Antiqua',serif;font-weight:normal;font-size:21px;color:#5a2a22}
  .slip .sub{font-family:'Almendra',serif;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7a5a3a;margin-bottom:10px}
  .stamp{display:inline-block;border:4px solid #a5301f;color:#a5301f;font-family:'Cinzel',serif;font-weight:900;font-size:28px;letter-spacing:.16em;padding:3px 14px 1px;
    transform:rotate(-6deg);margin:2px 0 12px 4px;opacity:.86;border-radius:4px}
  .stamp small{display:block;font-size:11px;letter-spacing:.24em;text-align:center;margin-top:-3px;padding-bottom:3px}
  .slip p{margin:0;font-family:'EB Garamond',Georgia,serif;font-size:20px;line-height:38px;font-variant-numeric:lining-nums;-webkit-font-feature-settings:'lnum';font-feature-settings:'lnum'}
  .slip .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .slip .btn{--accent:#3a2412;font-size:12.5px;padding:8px 13px;background:#f3e9cc}.slip .btn:hover{color:#f3e9cc}
  .slip small.again{display:block;margin-top:12px;font-family:'Almendra',serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
  .slip small.again button{text-decoration:underline;letter-spacing:.12em;text-transform:uppercase}

  /* the note for the day librarian */
  .rp{width:min(780px,94vw);max-height:88vh;overflow:auto;background:#f3e9cc;color:#2b2218;padding:22px 38px 18px;box-shadow:0 26px 70px rgba(0,0,0,.6);border-top:10px solid #5a2a22;
    -webkit-user-select:text;user-select:text}
  .rp h4{margin:0 0 2px;font-family:'Almendra',serif;font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#7a5a3a}
  .rp h3{margin:0 0 8px;font-family:'Uncial Antiqua',serif;font-weight:normal;font-size:25px;color:#5a2a22}
  .rp .lead{margin:0 0 4px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:18.5px;line-height:1.3;border-bottom:2px solid #5a2a22;padding-bottom:9px}
  .rp label{display:block;font-family:'EB Garamond',Georgia,serif;font-size:19.5px;font-weight:600;margin:9px 0 5px}
  .rp textarea,.rp input[type=text]{width:100%;font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.45;color:#27304f;background:#fffdf4;border:1px solid #b9a67c;
    padding:8px 12px;border-radius:2px;resize:vertical;-webkit-user-select:text;user-select:text}
  .rp textarea{min-height:62px;height:62px}
  .rp .sig{display:flex;align-items:center;gap:14px;margin-top:9px}
  .rp .sig label{margin:0;flex:0 0 auto}
  .rp .yn{display:flex;gap:22px;font-family:'EB Garamond',Georgia,serif;font-size:19px;margin:2px 0 8px}
  .rp .yn label{display:inline-flex;align-items:center;gap:8px;margin:0;font:inherit;font-weight:normal;cursor:pointer}
  .rp .count{font-family:'Almendra',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;text-align:right;margin-top:4px}
  .rp .foot{display:flex;gap:10px;align-items:center;margin-top:4px}
  .rp .foot span{flex:1;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:17px;opacity:.7}
  .rp .btn{--accent:#3a2412}.rp .btn:hover{color:#f3e9cc}
  @media print{
    body{overflow:visible;background:#fff}
    body>*:not(.ov){display:none!important}
    .ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
    .ov-bar,.rp .foot{display:none!important}
    .rp{box-shadow:none;max-height:none;width:auto;overflow:visible;border-top:0}
    .rp textarea,.rp input[type=text]{border:0;border-bottom:1px solid #999;background:#fff}
  }
</style>

<div class="slip" id="slip">
  <h3>Marrowby Free Library</h3>
  <div class="sub">open from dawn &middot; whenever that is</div>
  <div class="stamp">RETURNED<small>eleven years late</small></div>
  <p id="cl-time"></p><p id="cl-words"></p><p id="cl-hints"></p><p id="cl-fine">Your aunt owes the library 572 pennies.</p>
  <div class="row"><button type="button" class="btn" id="b-note">Leave a note</button><button type="button" class="btn" id="b-book">Open the notebook</button><button type="button" class="btn" id="b-lobby">Back to the shelf</button></div>
  <small class="again">The Library That Locks at Dusk &middot; <button type="button" id="b-reset">read it again from the start</button></small>
</div>

<script src="words.js"></script>
<script src="cast.js"></script>
<script src="../../assets/engine.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  var $ = ER.$, cricketT = 0;
  (function () {
    var r = LIB.rng(97), s = ['', '', ''], i, x, y;
    for (i = 0; i < 170; i++) {
      x = -200 + r() * 2000; y = r() * 560;
      s[i % 3] += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + (0.6 + r() * 1.5).toFixed(1) + '"/>';
    }
    $('#stars').innerHTML = '<g class="tw" fill="#dfe6ff">' + s[0] + '</g><g class="tw t2" fill="#fff3c9">' + s[1] + '</g><g class="tw t3" fill="#cfd8ff">' + s[2] + '</g>';
  })();

  ER.init({
    theme: 'fantasy', story: 'library', storyTitle: 'The Library That Locks at Dusk', id: 'dawn', no: 'IV', title: 'Dawn, at Eight in the Evening',
    go: 'Go out by the front door',
    intro: [
      'Lamps out, from right to left. Shutters open. The sun up in the east, and the bell last of all. It was the Evening Order backwards, and the Dome believed every word of it.',
      'Every lock in the library opened at once. You went down the stairs a good deal faster than you came up.'
    ],
    exit: {"last":true,"rooms":4,"stars":2}, tags: {},
    hints: hints,
    onBegin: begin
  });

  /* nothing is locked out here; the hints are for the note */
  function hints() {
    if (!$('#slip').classList.contains('on')) return null;
    return ['note', [
      'Click &ldquo;Leave a note&rdquo;. The note is for somebody who was not here, so tell her things in the order they happened, and use the past: I sat down, I read, the doors locked.',
      'Begin each part with a word that shows the order: First&hellip; Then&hellip; After that&hellip; In the end&hellip; You did three jobs tonight: one with books, one with a door, and one with the Dome.',
      'You can begin like this: &ldquo;First I fell asleep in the good chair, and the library locked itself. Then I&hellip;&rdquo; In question 2, use &ldquo;harder than&rdquo; or &ldquo;the hardest&rdquo;. In question 3, give a reason with &ldquo;because&rdquo;.'
    ]];
  }

  function begin() {
    var st = ER.state();
    if (!ER.flag('tEnd')) ER.flag('tEnd', Date.now());
    cricketT = setInterval(function () { if (!ER.isOpen() && Math.random() < 0.7) LIB.snd.cricket(); }, 1300);
    setTimeout(LIB.snd.owl, 2600);
    ER.narrate([
      'Eight o&rsquo;clock at night. Inside the Dome it is a fine morning, so the front door stands wide open, and every lamp in the library has lit itself.',
      'From Marrowby it looks as if the hill is on fire. People come up the path in their nightshirts to see.',
      'The baker borrows a book about bread. The cook from the inn asks if the soup book is back yet. They all whisper, although nobody has told them to.',
      'Octavo stamps <em>How to Be Early</em> with both front feet. RETURNED. &ldquo;Eleven years late,&rdquo; he says. &ldquo;The fine is one penny a week. I will write to your aunt.&rdquo;',
      'At real dawn, nothing happens at all. The Dome did its morning hours ago.'
    ], function () {
      var mins = Math.max(1, Math.round((ER.flag('tEnd') - (st.t0 || ER.flag('tEnd'))) / 60000)), hn = ER.hintsUsed();
      $('#cl-time').textContent = 'You were out in ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
      $('#cl-words').textContent = 'In your notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' new words.';
      $('#cl-hints').textContent = hn ? 'You asked for ' + hn + (hn === 1 ? ' hint.' : ' hints.') : 'You did not ask for a single hint.';
      $('#slip').classList.add('on'); ER.sfx.ok();
    });
  }
  $('#octavo').addEventListener('click', function (e) {
    LIB.snd.flutter();
    ER.say('&ldquo;Come back tomorrow,&rdquo; says Octavo. &ldquo;In the evening. I am told the chair is very good.&rdquo;');
  });
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { clearInterval(cricketT); ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* a note for the day librarian: the one thing nobody can do for you */
  $('#b-note').addEventListener('click', function () {
    var saved = ER.flag('note') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>Marrowby Free Library</h4><h3>A note for Miss Lark, the day librarian</h3>' +
      '<p class="lead">Miss Lark comes in at eight in the morning. She will find the front door open, every lamp burning, and a moth asleep on her desk. Tell her what happened.</p>' +
      '<label for="r1">1. What happened tonight? Write it in order: First&hellip; Then&hellip; After that&hellip; In the end&hellip;</label><textarea id="r1"></textarea>' +
      '<label for="r2">2. Which was the hardest: the scale, the rings or the Dome? Why?</label><textarea id="r2"></textarea>' +
      '<label>3. Should the library stay open at night?</label><div class="yn"><label><input type="radio" name="yn" value="yes"> Yes</label><label><input type="radio" name="yn" value="no"> No</label></div>' +
      '<textarea id="r3" placeholder="Because&hellip;"></textarea>' +
      '<div class="sig"><label for="r4">Signed</label><input type="text" id="r4" maxlength="60"></div>' +
      '<div class="count"></div><div class="foot"><span>Saved in this browser as you type.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.lead, .rp > label');
    ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { box.querySelector('#' + k).value = saved[k] || ''; });
    if (saved.yn) { var r = box.querySelector('input[value=' + saved.yn + ']'); if (r) r.checked = true; }
    function keep() {
      var o = {}, n = 0, c = box.querySelector('input[name=yn]:checked');
      ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { o[k] = box.querySelector('#' + k).value; });
      o.yn = c ? c.value : '';
      ['r1', 'r2', 'r3'].forEach(function (k) { n += (o[k].match(/[A-Za-z’']+/g) || []).length; });
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('note', o);
    }
    box.addEventListener('input', keep); box.addEventListener('change', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-lock ov-report', box); keep();
  });
})();
</script>
