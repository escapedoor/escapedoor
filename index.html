<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KEYHOLE</title>
<link rel="stylesheet" href="assets/fonts-base.css">
<link rel="stylesheet" href="assets/fonts-lobby.css">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#070b1f;overflow:hidden;font-family:'Outfit',Arial,sans-serif;color:#e9e4d8;-webkit-user-select:none;user-select:none}
  svg{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
  .door{cursor:pointer;transition:filter .25s}
  .door:hover{filter:brightness(1.18)}
  .door.shut:hover{filter:brightness(1.06)}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .neon{font-family:'Tilt Neon',sans-serif;font-size:104px;letter-spacing:10px;text-anchor:middle;fill:#ffd6ea;stroke:#ff4fa3;stroke-width:2.5}
  .neonB{font-family:'Tilt Neon',sans-serif;font-size:104px;letter-spacing:10px;text-anchor:middle;fill:none;stroke:#ff2f93;stroke-width:9;opacity:.75}
  #neonOn{animation:nf 7s steps(1,end) infinite}
  @keyframes nf{0%,91%,94%,97%,100%{opacity:1}92%,95.5%{opacity:.35}}
  .sub{font-family:'Outfit',sans-serif;font-weight:300;font-size:24px;letter-spacing:7px;text-anchor:middle;fill:#c9d6e8}
  .t-my{font-family:'IM Fell English SC',serif;text-anchor:middle}
  .t-sf{font-family:'Orbitron',sans-serif;font-weight:700;text-anchor:middle}
  .t-sf2{font-family:'Share Tech Mono',monospace;text-anchor:middle}
  .t-fa{font-family:'Uncial Antiqua',serif;text-anchor:middle}
  .t-gh{font-family:'Rock Salt',cursive;text-anchor:middle}
  .t-gh2{font-family:'Special Elite',monospace;text-anchor:middle}
  .t-ad{font-family:'Limelight',serif;text-anchor:middle}
  .t-ci{font-family:'Stardos Stencil',serif;font-weight:700;text-anchor:middle}
  .xw{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .door.shut .xw-let{opacity:0}
  .rune{animation:rune 3.2s steps(3) infinite}.rune:nth-child(2n){animation-delay:-1.1s}.rune:nth-child(3n){animation-delay:-2.2s}
  @keyframes rune{50%{opacity:.35}}
  #bulb{animation:bulb 5s steps(1,end) infinite}
  @keyframes bulb{0%,40%,44%,70%,72%,100%{opacity:.95}42%,71%{opacity:.25}}
  #underdoor{animation:ud 5s steps(1,end) infinite}
  @keyframes ud{0%,40%,44%,70%,72%,100%{opacity:.9}42%,71%{opacity:.4}}
  .led{animation:led 2.4s steps(3) infinite}
  @keyframes led{50%{opacity:.55}}
  .blink{animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  .pass{animation:pass 3.2s linear infinite}.pass.p2{animation-duration:4.6s;animation-delay:-2s}.pass.p3{animation-duration:2.4s;animation-delay:-1s}
  @keyframes pass{from{transform:translateX(140px)}to{transform:translateX(-140px)}}
  .t-fo{font-family:'Barlow Condensed','Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .t-hi{font-family:'Cormorant SC','IM Fell English SC',serif;font-weight:700;text-anchor:middle}
  .t-co{font-family:'Cinzel',serif;font-weight:700;text-anchor:middle}
  .t-ne{font-family:'UnifrakturCook','IM Fell English SC',serif;font-weight:700;text-anchor:middle}
  .t-wi{font-family:'Staatliches','Oswald',sans-serif;text-anchor:middle}
  .t-ec{font-family:'Barlow Condensed','Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .t-li{font-family:'EB Garamond',Georgia,serif;font-style:italic;text-anchor:middle}
  .t-ha{font-family:'Caveat',cursive;text-anchor:middle}
  .tick{animation:tick 11s linear infinite}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-560px)}}
  .node{animation:node 2.6s steps(2) infinite}.node.n2{animation-delay:-.9s}.node.n3{animation-delay:-1.7s}
  @keyframes node{50%{opacity:.3}}
  .ff{animation:ff 3.6s ease-in-out infinite}.ff.f2{animation-delay:-1.2s;animation-duration:4.4s}.ff.f3{animation-delay:-2.3s;animation-duration:3s}
  @keyframes ff{50%{opacity:.15;transform:translateY(-7px)}}
  /* the building: one camera that shows the whole of it, or comes close to one floor */
  #cam{transition:transform .95s cubic-bezier(.65,0,.25,1)}
  #cam.now{transition:none}
  .bay,.fsign{cursor:default}
  body.ov .bay,body.ov .fsign{cursor:zoom-in}
  body.ov .door .dsub{opacity:0}
  /* what a door shows only when it is open, or only when it is shut */
  .door.shut .lit{opacity:.1;animation:none}
  .door:not(.shut) .tape{display:none}
  .hb{animation:back 48s linear infinite}.hb2{animation:back 4s linear infinite}
  .door.shut .hb,.door.shut .hb2{animation:none}
  @keyframes back{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
  .fall{animation:fall 3.4s linear infinite}.fall.f2{animation-duration:4.4s;animation-delay:-1.2s}.fall.f3{animation-duration:2.8s;animation-delay:-2s}.fall.f4{animation-duration:5s;animation-delay:-3.1s}
  @keyframes fall{from{transform:translateY(-8px)}to{transform:translateY(78px)}}
  .sos{animation:sos 7.4s steps(1,end) infinite}
  @keyframes sos{0%,5.4%,10.8%,21.6%,32.4%,43.2%,59.5%,64.9%,70.3%{opacity:1}2.7%,8.1%,13.5%,29.7%,40.5%,51.4%,62.2%,67.6%,73%,100%{opacity:.08}}
  /* the lift: one button for each floor, and one for the whole building */
  #lift{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:4;width:206px;padding:10px 12px 8px;border-radius:10px;
    background:linear-gradient(160deg,#c99f45,#f5df98 42%,#b98c35);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 0 0 2px rgba(80,55,10,.45);
    font-family:'Oswald',sans-serif;color:#2b1d08}
  .lift-ind{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;padding:7px 10px 6px;border-radius:5px;background:#120d08;box-shadow:inset 0 0 0 1px #3a2a10;
    color:#ffb347;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .lift-ind b{font-size:22px;font-weight:normal;color:#ffd27a;text-shadow:0 0 8px rgba(255,179,71,.7)}
  #lift button{display:flex;align-items:center;gap:10px;width:100%;margin:4px 0;padding:2px 0;border:0;background:none;cursor:pointer;color:#2b1d08;
    font:500 13px 'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:left}
  #lift button i{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-style:normal;font-weight:600;font-size:15px;
    background:radial-gradient(circle at 35% 30%,#fff7d6,#d8c08a 60%,#9a7a3a);box-shadow:inset 0 0 0 2px #7d5f1d,0 2px 3px rgba(0,0,0,.35)}
  #lift button:hover i{filter:brightness(1.08)}
  #lift button.on i{background:radial-gradient(circle at 35% 30%,#fff3c4,#ffb347 55%,#c76a12);box-shadow:inset 0 0 0 2px #7d3f0d,0 0 14px #ffb347}
  #lift button.on span{font-weight:700}
  #lift hr{border:0;border-top:1px solid rgba(80,55,10,.4);margin:6px 0}
  .cap{position:fixed;left:50%;bottom:5vh;transform:translate(-50%,10px);width:min(760px,92vw);padding:14px 24px 15px;background:rgba(6,10,13,.92);
    border-top:2px solid #ff4fa3;font-size:clamp(17px,1.45vw,21px);line-height:1.45;text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:5}
  .cap.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:760px){
    #lift{top:auto;bottom:10px;left:50%;right:auto;transform:translateX(-50%);width:auto;display:flex;gap:8px;padding:8px 10px}
    .lift-ind,#lift hr,#lift button span{display:none}
    #lift button{width:auto;margin:0}
    .cap{bottom:72px}
  }
  .pick{position:fixed;top:0;right:0;bottom:0;left:0;display:none;place-items:center;background:rgba(4,7,9,.72);z-index:5}
  .pick.on{display:grid}
  .pick div{background:#f3ecd9;color:#27231d;padding:28px 34px 26px;width:min(430px,92vw);text-align:center;box-shadow:0 26px 70px rgba(0,0,0,.6)}
  .pick h2{margin:0 0 4px;font-family:'IM Fell English SC',serif;font-weight:normal;font-size:30px}
  .pick p{margin:0 0 18px;font-family:'EB Garamond',Georgia,serif;font-size:19px}
  .pick button{display:block;width:100%;margin-top:8px;padding:11px 14px;border:1px solid #27231d;background:transparent;font-family:'Oswald',sans-serif;font-size:14px;
    letter-spacing:.16em;text-transform:uppercase;color:#27231d;cursor:pointer}
  .pick button:hover{background:#27231d;color:#f3ecd9}
  .pick button.q{border-color:transparent;opacity:.6;font-size:12px}
  .fade{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;opacity:1;pointer-events:none;transition:opacity .9s;z-index:9}
  .fade.off{opacity:0}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}#cam{transition:none}}
</style>

<script>
(function () {
  var THEMES = {"mystery":{"name":"Mystery","stories":[{"id":"gloria","title":"Where Is Gloria?","stars":2,"minutes":"15-25","hold":false,"level":"A2+","blurb":"The heaviest pumpkin at the village show has gone. She weighs forty-one kilos, and nobody saw a thing.","rooms":4,"first":"tent.html","firstId":"tent","last":"prize"},{"id":"understudy","title":"The Understudy","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"A very small theatre, a first night. The necklace was real when the curtain went up. At the interval it is glass, and you are only here on work experience.","rooms":5,"first":"corner.html","firstId":"corner","last":"stage"},{"id":"maze","title":"Past the Lion","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"The open day at Summerhays: a treasure hunt in the hedge maze, five rhymes that mean exactly what they say, and a silver cup waiting in the middle. By three o'clock nobody has found the way in, and the cup has found a way out.","rooms":5,"first":"gate.html","firstId":"gate","last":"four"},{"id":"forty","title":"Forty Minutes of Dark","stars":4,"minutes":"50-70","hold":false,"level":"B1","blurb":"A harbour museum on its last night, a storm, and a ship's clock that has never been allowed to stop.","rooms":7,"first":"street.html","firstId":"street","last":"morning"}]},"forensic":{"name":"Forensics","stories":[{"id":"fair","title":"A Smell of Vinegar","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Thursday night in a school hall, twelve hours before the science fair is judged. The best project in the room lies in pieces in a cloud of white powder, the air smells of vinegar, and the head teacher has already written her letter about the boy with the volcano. All she wants from the laboratory is a signature.","rooms":5,"first":"hall.html","firstId":"hall","last":"judging"},{"id":"cake","title":"Warm in the Middle","stars":3,"minutes":"40-50","hold":false,"level":"B1+ to B2","blurb":"Friday night in a cake shop, fourteen hours before the wedding of the year. The cake has gone green down one side, somebody has walked through a sack of flour, and a small sponge on the rack is still warm in the middle. The new assistant locked up. The baker would like to be wrong about her, and cannot see how.","rooms":5,"first":"shop.html","firstId":"shop","last":"yard"},{"id":"forgery","title":"Lot Forty-One","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Viewing day at Cardew & Lisle, auctioneers since 1822. Lot 41 is a famous lost painting, found at last over a farmhouse piano, with a letter that proves it. At half past ten a dealer shone a small lamp on the letter, and it glowed. The young cataloguer who found it has been asked to go home. Everything in this building has a date. Not all of them are true.","rooms":6,"first":"saleroom.html","firstId":"saleroom","last":"sale"}]},"court":{"name":"The Verdict","stories":[{"id":"glass","title":"A Quarter Past Four","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"A wet Tuesday at Hatherwick County Court. A retired signalman wants £900 for a wrecked greenhouse, and he has brought the football that did it, with a boy’s name on it. The solicitor who was going to speak for the boy is stuck on a train. You were only supposed to carry the file.","rooms":5,"first":"hall.html","firstId":"hall","last":"judgment"},{"id":"gambit","title":"Move Sixteen","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Sunday afternoon at Brindlow Town Hall, round four of the junior chess congress. A girl of twelve has just beaten the top seed with a move that nobody expected, and half an hour later her win has been taken off the wall chart: a steward saw her in the corridor with a telephone. She may appeal, and she may bring one friend to speak for her. You are only the runner. You carry the result slips.","rooms":5,"first":"chamber.html","firstId":"chamber","last":"boardone"},{"id":"violin","title":"So That You Are Sure","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Wyncaster Crown Court, the second day of a trial. A street musician is accused of stealing a violin worth more than the building it was kept in, and yesterday an honest old lady told the jury that she was as sure of his face as of her own name. Two of the jurors nodded. You are the trainee solicitor on his side: you carry the papers. This morning you have to find out how sure anybody can be.","rooms":6,"first":"cells.html","firstId":"cells","last":"verdict"}]},"news":{"name":"Deadline","stories":[{"id":"rumour","title":"Says Who?","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Friday, twenty past three, at Petherwick School. Since eight this morning one picture has been going from phone to phone: SCHOOL TO CLOSE IN JULY. It's official, apparently. At four o'clock the school's news site sends its bulletin to every family, the top story is already written, and nobody on the desk can say where it came from. You are the trainee. Trainees fetch, carry and doubt.","rooms":5,"first":"newsroom.html","firstId":"newsroom","last":"four"},{"id":"flood","title":"Two Aunts","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"A Tuesday night in February, ten to nine, and the River Wend is coming up through Wendford. Wend Valley Radio is at the top of the highest street in the town, and everything the valley knows, thinks or has been told by a cousin is landing on its news desk at once. At half past nine Danny Sato reads the news, and people will do what he says. You are the trainee. You were meant to go home at five. And nothing goes on air in this building, the news editor says, without two aunts.","rooms":5,"first":"board.html","firstId":"board","last":"light"},{"id":"photo","title":"One Sun","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Saturday night, twenty to twelve, at the picture desk of the Stopford Press Agency. The last pictures for the Sunday front pages go at midnight, and a freelance has just sent the picture of the weekend: a balloon shaped like a teapot coming down on a park full of people running for their lives. It is perfect. The night editor says it is a fake. You have twenty minutes to find out which of them is wrong, and what the picture really shows.","rooms":6,"first":"desk.html","firstId":"desk","last":"step"}]},"cipher":{"name":"Cipher","stories":[{"id":"wrong","title":"Wrong Number","stars":1,"minutes":"15-20","hold":false,"level":"B1","blurb":"Twenty to midnight on a wet Friday. A phone box rings as you walk past. Nobody speaks, but words come up on its little screen, and parts of them are missing.","rooms":3,"first":"phonebox.html","firstId":"phonebox","last":"midnight"},{"id":"lexicon","title":"The Final Word","stars":2,"minutes":"20-30","hold":false,"level":"B1+","blurb":"Half an hour before a live television word quiz goes on air, the computer that runs the game locks everybody into separate rooms. Everybody except the one who fetches the water: you.","rooms":4,"first":"corridor.html","firstId":"corridor","last":"onair"},{"id":"exam","title":"Answer All Questions","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Nine o’clock at night, the evening before the English exam. You have come back to school for your revision cards. The exam cupboard is standing open, the papers are gone, and somebody has just locked you in.","rooms":5,"first":"staffroom.html","firstId":"staffroom","last":"hall"},{"id":"seven","title":"Seven Down","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Eleven at night in a newspaper building. The presses roll at two, the crossword setter has not missed a day in thirty-two years, and tonight no puzzle came. Only a grid with every square empty, and a line in blue pencil: finish it and you can find me.","rooms":6,"first":"desk.html","firstId":"desk","last":"edition"},{"id":"zero","title":"Station Zero","stars":5,"minutes":"75-90","hold":false,"level":"B2+ to C1","blurb":"A listening post on the coast, shut for thirty years. At midnight, in a storm, its dead transmitter begins to send, and a voice on the telephone tells you exactly what to do about it. The voice is very helpful. Read everything twice.","rooms":7,"first":"hut.html","firstId":"hut","last":"relieved"}]},"scifi":{"name":"Sci-Fi","stories":[{"id":"air","title":"Seven Hours of Air","stars":3,"minutes":"25-40","hold":false,"level":"A2+ to B1","blurb":"A small station above an ice moon, an air alarm at ten past two in the morning, and nobody on board but you and a very polite computer.","rooms":5,"first":"cabin.html","firstId":"cabin","last":"docking"},{"id":"benthos","title":"Word for Word","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"A laboratory on the sea bed, a storm on top of it, and a robot submarine that does exactly what it is told. Since five o'clock it has answered every order with the same two pings: CANNOT. At ten past two in the morning, the watch is yours.","rooms":5,"first":"watch.html","firstId":"watch","last":"dock"},{"id":"sleepers","title":"Only What Was Asked","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"A slow ship between the stars, eighty-two years from home. You were meant to sleep for forty more years. Instead you wake in the cold beside a shivering engineer, with under six hours to go and a computer that will answer anything you ask, and not one word more.","rooms":6,"first":"hall.html","firstId":"hall","last":"medbay"}]},"fantasy":{"name":"Fantasy","stories":[{"id":"library","title":"The Library That Locks at Dusk","stars":2,"minutes":"15-25","hold":false,"level":"A2+","blurb":"You sat down to read one page. Now it is dusk, every door has locked itself, and the night librarian is a moth.","rooms":4,"first":"reading.html","firstId":"reading","last":"dawn"},{"id":"toll","title":"The Keeper Gives No Change","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"A troll keeps Stickle Bridge, and every word of his Charter. You have nine cheeses, one goose and a fair to reach by sunrise. He will not eat you. He will read to you. It is worse.","rooms":5,"first":"gate.html","firstId":"gate","last":"crow"},{"id":"hours","title":"The Eleventh Hour","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"In Gilderby the town clock does whatever it is told: to the letter. It has stopped at a quarter to eleven, one of its hours is missing, and the only one who will talk is a jackdaw who speaks in proverbs.","rooms":5,"first":"stair.html","firstId":"stair","last":"loft"}]},"ghost":{"name":"Ghost Story","stories":[{"id":"room13","title":"Room 13 Is Not on the Plan","stars":2,"minutes":"15-25","hold":false,"level":"A2+","blurb":"Every night at ten past nine, a bell rings for Room 13. The Swan Hotel has no Room 13. It says so on the plan.","rooms":4,"first":"lobby.html","firstId":"lobby","last":"morning"},{"id":"ferry","title":"When the Tide Serves","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"The last ferry of the night leaves Lantern Quay at 21.40, in fog. The purser's list has eight names on it. Her counter says nine. She has counted three times.","rooms":5,"first":"quay.html","firstId":"quay","last":"pier"},{"id":"orchard","title":"Your Place Is Laid","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Nobody has lived at Sweetings Farm since the winter before last. Every evening at dusk the kitchen table is laid for one. Every morning Mrs Bellamy clears it away, and she has stopped telling her husband.","rooms":5,"first":"kitchen.html","firstId":"kitchen","last":"supper"}]},"lit":{"name":"Literature","stories":[{"id":"sweets","title":"Miss Plunkett's Last Recipe","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Plunkett's Sweet Works is sold at nine tomorrow morning. Tonight three buyers and a valuer with no imagination are being shown round, and you have come to do the floors because your mum has flu. Under the counter, where only somebody with a mop would look, there is an envelope addressed to you.","rooms":5,"first":"shop.html","firstId":"shop","last":"roof"},{"id":"alice","title":"The Torn Pages of Wonderland","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Somebody has torn pages out of an old copy of Alice's Adventures in Wonderland, and the story has stopped dead in Chapter One. You lean too close to the torn edge, and fall in. Now Alice must get from the rabbit-hole to the trial, the pages must go back where they belong, and the White Rabbit thinks you are his housemaid.","rooms":5,"first":"hall.html","firstId":"hall","last":"court"},{"id":"carol","title":"The Boy in Sunday Clothes","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Every Christmas, somewhere, somebody reads A Christmas Carol, and you play your part in it: a boy in Sunday clothes, with seven lines in the very last stave. This year the book slid off a sleeping reader's knee, its five staves were picked up in the wrong order, and Scrooge is about to wake on Christmas morning without having met a single Spirit.","rooms":6,"first":"counting.html","firstId":"counting","last":"street"}]},"adventure":{"name":"Adventure","stories":[{"id":"orvo","title":"The Night Train to Orvo","stars":1,"minutes":"10-15","hold":false,"level":"A2","blurb":"A snowy station at midnight. A guard with a watch. A train that is never late. Tonight you are the assistant.","rooms":3,"first":"halm.html","firstId":"halm","last":"arrival"},{"id":"mail","title":"Seven Sacks for Tolver","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"Tolver gets its letters over the mountains by air: in an old brown mail ship that makes fifty kilometres an hour. This morning a new silver one that makes eighty is on the same field. Seven sacks each. The first ship there keeps the mail, and you are the Post Office's newest clerk.","rooms":5,"first":"shed.html","firstId":"shed","last":"tolver"},{"id":"bazaar","title":"The Third Arch After the Fountain","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"In Ombra the streets have no names. You find your way by what you pass: straight on until you can smell leather; the third arch after the fountain; if you reach the fish, you have gone too far. Somewhere in there is your caravan's compass, which left your arm at the Salt Gate this morning. The noon bell will not wait, and somebody quicker than you is already looking.","rooms":5,"first":"gate.html","firstId":"gate","last":"yard"}]},"history":{"name":"Time Slip","stories":[{"id":"carpathia","title":"Come at Once","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"The North Atlantic, 15 April 1912, twenty past midnight. A small liner is three days out of New York, and her passengers are asleep. You are her bridge messenger, and you are teaching yourself the code that the wireless man uses. Then the biggest ship in the world asks for help.","rooms":5,"first":"shack.html","firstId":"shack","last":"daybreak"},{"id":"apollo","title":"Lots and Lots of People","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Houston, Monday 13 April 1970, nine at night. Three men are on their way to the Moon. You are the newest person in the building, and your job is paper. Then a voice on the speaker says that they have had a problem.","rooms":5,"first":"backroom.html","firstId":"backroom","last":"splash"},{"id":"everest","title":"Snow Conditions Bad","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Nepal, the evening of 30 May 1953. A man from The Times has come down off the ice with the biggest news of the year, and London must have it first, in secret, before the Queen is crowned on Tuesday. Between the mountain and London there are forty kilometres of path, one small radio, an embassy at night and a newspaper with a deadline. The message will pass through many hands. Each time it changes hands, so do you.","rooms":6,"first":"base.html","firstId":"base","last":"mall"},{"id":"pump","title":"By the Nearest Road","stars":5,"minutes":"75-90","hold":false,"level":"B2+","blurb":"London, the first week of September 1854. In the streets round Golden Square people are dying faster than the registrars can write them down, and every sensible person knows the cause: the foul air. One quiet doctor thinks otherwise, and he has borrowed you from the General Register Office to carry his list. You have four days, a map, and a handful of cases that do not fit.","rooms":7,"first":"register.html","firstId":"register","last":"handle"}]},"wild":{"name":"Lost Signal","stories":[{"id":"ridge","title":"The Cold Door","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"A Saturday in October, cloud on Skallan Edge, and the leader of your party has just sat down very hard on a wet rock. The hut is five hundred metres straight below you, and that way is shut. Mrs MacAskill knows another way off by heart. But her glasses have gone over the edge, there are three hours of daylight left, and you are the one holding the map.","rooms":5,"first":"cairn.html","firstId":"cairn","last":"hut"},{"id":"tide","title":"The Box at Pole Seven","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"A Thursday in June. The sea has gone away and left three kilometres of sand between the island of Tarrow and the mainland, with seals to count, a line of poles to walk by, and a tide card that says the road is dry until the afternoon. Mr Nyberg has crossed for thirty years and likes forty minutes in hand. But a card is only a promise, there is a white wall out at sea, and you are the one carrying the bag.","rooms":5,"first":"shed.html","firstId":"shed","last":"box"},{"id":"dune","title":"Four and a Half Times","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"April 1988, a very long way from anywhere. The truck has stopped for good in a dark hollow between two red dunes, the radio can hear but cannot speak, and the man who knows the sky has just twisted his ankle. Somewhere out there is a salt pan, a plane that will look for you on Saturday, and the south pole of the sky, which has no star in it. You will have to find the empty place.","rooms":6,"first":"truck.html","firstId":"truck","last":"wings"}]},"econ":{"name":"Economics","stories":[{"id":"stall","title":"Squeezed","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Fennel Street School's Summer Market, on the hottest day of the year. The Business Club's lemonade stall has sold more cups than anybody, and its cash box is thirty pounds short. The captain knows exactly who took it: the girl next door, who runs the rival stall with the same recipe. At half past two she is going to the organiser. You are the newest member of the club, and you have just arrived.","rooms":5,"first":"playground.html","firstId":"playground","last":"table"},{"id":"bank","title":"Still Open at Four","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Brockholt has one bank, and on Friday afternoon the whole town's phones say it has run out of money. The queue on Market Square is growing, the cash van is late, and the doors close at four. You are on work experience. It is your last day, and you were promised the vault.","rooms":6,"first":"hall.html","firstId":"hall","last":"steps"},{"id":"tulip","title":"Trading in Wind","stars":5,"minutes":"75-90","hold":false,"level":"B2+ to C1","blurb":"For seven Saturdays the price of a Fen Tiger tulip has doubled at Gotobed's Saleroom in Dykesend: five pounds, ten, twenty, and last week three hundred and twenty. Nobody has seen a bulb. They are still in the ground, and what changes hands is paper. Today, at three o'clock, forty more promises go under the hammer. You are the Saturday porter, and the auctioneer wants to know what a Fen Tiger is really worth before she sells it.","rooms":7,"first":"saleroom.html","firstId":"saleroom","last":"lotone"}]},"lang":{"name":"Languages","stories":[{"id":"phrasebook","title":"The Verb Comes Last","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"A ferry with a broken pump puts in at an island that is on no timetable, where nobody speaks a word of English. One passenger went ashore at eleven and has not come back. She left you her phrasebook of the island's language, with its last pages torn out. The tide turns at six.","rooms":5,"first":"quay.html","firstId":"quay","last":"lighthouse"},{"id":"script","title":"Nobody Here Can Read This","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Half past four on a Friday. The Elmsworth Museum of Writing has just locked its doors, a school trip is one teacher short, and in the Hall of Signs the curator is holding the find of his career: a letter in a script that nobody in the building can read. The coach leaves at six.","rooms":6,"first":"hall.html","firstId":"hall","last":"attic"},{"id":"accent","title":"Where's It To?","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Ten to one in the morning, on the night of the floods. A woman rings a national phone-in from her car to talk about her nan's old words, and the line goes dead in the middle of a sentence. Nobody knows her surname, her address or the road she was on. All anybody has is her voice, and your aunt, who studies voices for a living.","rooms":6,"first":"booth.html","firstId":"booth","last":"dawn"}]},"ai":{"name":"A.I.","stories":[{"id":"helper","title":"Sounds About Right","stars":3,"minutes":"35-45","hold":false,"level":"B1+ to B2","blurb":"Revision Night at Sallowfield School, the evening before the Year 8 science test. Leo spent the afternoon asking Magpie, the school's homework chatbot, about space, and at six o'clock he gave the whole year a copy of its answers. Number 7 is very sure of itself. By quarter past eight the head must decide whether to switch Magpie off. You are the one who wants to know how it got its answers.","rooms":5,"first":"computers.html","firstId":"computers","last":"friday"},{"id":"feed","title":"Everybody Thinks So","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Gorsey and Crickmore face each other across the River Lisk, and every October since 1887 they have had one friendly fight, on Bridge Day. This year they have been fighting for six weeks, on a video app called Burble, and it has stopped being friendly. At eight o'clock tonight a committee decides whether tomorrow's Bridge Day is cancelled. Everybody knows who started it. Everybody is sure what everybody else thinks. You live on one bank and play football on the other.","rooms":6,"first":"club.html","firstId":"club","last":"hall"},{"id":"voice","title":"In Her Own Words","stars":4,"minutes":"50-65","hold":false,"level":"B2","blurb":"Friday night at Radio Greyhithe, a small station on a market square. At 21.12 an email arrives with forty seconds of the mayor, on the phone, saying that the money for the Low Street flood wall will go to a marina instead. She sounds exactly like herself. The sender says every paper gets it at midnight. The news is at eleven, and you are the work-experience student who asks how anybody knows it is her.","rooms":6,"first":"studio.html","firstId":"studio","last":"onair"},{"id":"imitation","title":"Five Minutes of Questioning","stars":5,"minutes":"75-90","hold":false,"level":"B2+ to C1","blurb":"Every October the Haverleigh Museum of Computing, in the town's old telephone exchange, holds an imitation game: five judges type to hidden players and decide which of them are people. This year a program has been judged human six times out of ten, the board says PASSED, and the local paper is writing IT THINKS. A seventeen-year-old who sat in booth 2 all afternoon has been judged a machine more often than the machine. You carried the judges' slips. The prizes are given at six.","rooms":7,"first":"judges.html","firstId":"judges","last":"hall"}]},"duo":{"name":"Together","stories":[{"id":"dive-a","title":"Open This Together","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"You go down into the flooded basement with a torch and a line, and you say what you see. The River Rill has come into Rillmouth Museum, the water is still rising, and on a top shelf somewhere in the dark is a box that has been waiting since 1926. One of you can see the water; the other has the plans. Neither of you can do it alone.","rooms":5,"first":"steps.html","firstId":"steps","last":"landing","team":"dive","role":"A","roleName":"The Diver","players":2},{"id":"dive-b","title":"Open This Together","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"You stay at the top of the stairs with the radio, the plans, the catalogue and the pump, and you tell the diver where to go. The River Rill has come into Rillmouth Museum, the water is still rising, and on a top shelf somewhere in the dark is a box that has been waiting since 1926. One of you can see the water; the other has the plans. Neither of you can do it alone.","rooms":5,"first":"lodge.html","firstId":"lodge","last":"topside","team":"dive","role":"B","roleName":"The Operator","players":2}]}}, cap = document.getElementById('cap'), capT = 0;
  var SHUT = {
    mystery: 'The files are not on the desk yet. Try again another day.',
    scifi: 'ACCESS DENIED. This airlock is still being built.',
    fantasy: 'The door hums and stays shut. Its story has not been written yet.',
    ghost: 'On the other side, something tries the handle too. Then it stops. Not yet.',
    adventure: 'The night train has not come in. Try again another day.',
    cipher: 'The letters on the lock will not turn yet. Try again another day.',
    forensic: 'The lab is sealed. The evidence has not come in yet.',
    history: 'The archive is closed today. The box you want has not been brought up yet.',
    court: 'The court is not sitting yet. Come back when the list is up.',
    news: 'Nobody is at the news desk yet. The first story has not come in.',
    wild: 'The hut is snowed in. Try again another day.',
    econ: 'The vault is closed. The market opens another day.',
    lang: 'The door says something you cannot read yet. Come back soon.',
    lit: 'This book has not been written yet. Come back for the first chapter.',
    ai: 'The machine is still learning. It says: "Try again another day."',
    duo: 'This door needs two keys, and nobody has cut them yet. Bring a friend another day.'
  };
  var FLOORS = [['1', 'Case Files'], ['2', 'Other Worlds'], ['3', 'The Real World'], ['R', 'The Roof']];
  var FY = [0, -640, -1280, -1920];
  function say(t) { cap.textContent = t; cap.classList.add('on'); clearTimeout(capT); capT = setTimeout(function () { cap.classList.remove('on'); }, 3800); }
  function txt(id, t) { var n = document.getElementById(id); if (n) n.textContent = t; return n; }
  Shelf.init();
  if (window.Account) Account.ui.welcome();          /* who is playing? (asked once; the page is read again for a new player) */

  var body = document.body, svg = document.getElementById('hall'), cam = document.getElementById('cam'), lift = document.getElementById('lift'), view = 'all';
  var titles = [], counts = {};
  Array.prototype.forEach.call(document.querySelectorAll('.door'), function (d) {
    var t = d.getAttribute('data-t'), info = THEMES[t], list = info ? info.stories : [];
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');   /* an inner group, so a locked door can rattle */
    while (d.firstChild) g.appendChild(d.firstChild);
    d.appendChild(g);
    titles.push(g.querySelector('text'));
    if (list.length) {
      var going = 0, solved = 0;
      list.forEach(function (s) { var st = Shelf.status(t, s).state; if (st === 'going') going++; if (st === 'solved') solved++; });
      d.classList.remove('shut');
      var told = {}; list.forEach(function (s) { told[s.team || s.id] = 1; });      /* a story for two counts once, not once for each player */
      var count = Object.keys(told).length;
      counts[t] = count === 1 ? '1 story inside' : count + ' stories inside';
      txt('sub-' + t, counts[t]);
      if (t === 'mystery') txt('tag1', going ? 'GO ON' : solved === list.length ? 'SOLVED' : 'COME IN');
      if (t === 'scifi') { var led = txt('led-scifi', 'OPEN'); led.setAttribute('fill', '#5dff9a'); led.classList.remove('blink'); }
      if (t === 'adventure') txt('dep-adventure', 'NOW BOARDING');
      if (t === 'cipher') 'OPEN'.split('').forEach(function (c, i) { txt('drum' + i, c); });
      if (t === 'forensic') { var fl = document.getElementById('led-forensic'); fl.setAttribute('fill', '#5dff9a'); fl.classList.remove('blink'); }
      if (t === 'history') {                                  /* the year on the door will not keep still */
        var YEARS = ['1666', '1822', '1854', '1912', '1953', '1970'], yi = 0;
        var flip = function () { YEARS[yi++ % YEARS.length].split('').forEach(function (c, i) { txt('yr' + i, c); }); };
        flip(); setInterval(flip, 2600);
      }
      if (t === 'ai') txt('say-ai', '> hello. come in');
    }
    d.addEventListener('mouseenter', function () { if (view === 'all') say(g.querySelector('text').textContent + (counts[t] ? ' · ' + counts[t] : ' · not open yet')); });
    d.addEventListener('click', function () {
      if (list.length) { Shelf.go(t + '/index.html'); return; }
      say(SHUT[t]);
      g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake');
    });
  });

  /* The camera. From far off, the whole building is in view and its names are written larger; close up, one floor
     fills the screen. The SVG is drawn in screen pixels, so the camera is one CSS transform that can slide. */
  function rect(v) {
    if (v === 'all') return { x: -370, y: -1920, w: 2540, h: 2820 };
    var top = v === 3 ? 40 : 170;
    return { x: -10, y: top + FY[v], w: 1820, h: 870 - top };
  }
  function bigNames(on) {
    titles.forEach(function (t) {
      t.style.fontSize = ''; t.removeAttribute('dy');
      if (!on) return;
      var fs = +t.getAttribute('font-size'), w = t.getBBox().width || 1;
      t.style.fontSize = (fs * Math.min(62 / fs, 292 / w)) + 'px';
      t.setAttribute('dy', 18);                     /* the larger name sits a little lower, clear of the ceiling */
    });
  }
  function place(slide) {
    var W = innerWidth, H = innerHeight, r = rect(view), narrow = W <= 760;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    /* room is kept for the lift, the name plate at the top, and (from far off) the caption under the building */
    var R = narrow ? 0 : lift.offsetWidth + 24, B = narrow ? lift.offsetHeight + 18 : 0, T = view === 'all' ? 46 : 56;
    if (view === 'all') B += narrow ? 64 : 100;
    var aw = W - R, ah = H - T - B, s = Math.min(aw / r.w, ah / r.h);
    var tx = (aw - r.w * s) / 2 - r.x * s, ty = T + (ah - r.h * s) / 2 - r.y * s;
    cam.classList.toggle('now', !slide);
    cam.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';
    if (!slide) { void cam.getBoundingClientRect(); cam.classList.remove('now'); }
  }
  function show(v, slide) {
    view = v;
    body.classList.toggle('ov', v === 'all');
    for (var i = 0; i < 4; i++) body.classList.toggle('f' + i, v === i);
    Array.prototype.forEach.call(lift.querySelectorAll('button'), function (b) { var f = b.getAttribute('data-f'); b.classList.toggle('on', String(v) === f); });
    document.getElementById('liftNo').textContent = v === 'all' ? '▦' : FLOORS[v][0];
    document.getElementById('liftName').textContent = v === 'all' ? 'The whole building' : FLOORS[v][1];
    bigNames(v === 'all');
    place(slide !== false);
    try { localStorage.setItem('keyhole.floor', String(v)); } catch (e) {}
  }
  var saved = null; try { saved = localStorage.getItem('keyhole.floor'); } catch (e) {}
  var first = saved !== null && /^[0-3]$/.test(saved) ? +saved : 'all';
  show(first, false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { bigNames(view === 'all'); });
  addEventListener('resize', function () { place(false); });
  lift.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var f = b.getAttribute('data-f'); show(f === 'all' ? 'all' : +f);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.bay,.fsign'), function (n) {
    n.addEventListener('click', function () { if (view === 'all') show(+n.getAttribute('data-f')); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowUp') show(view === 'all' ? 0 : Math.min(3, view + 1));
    else if (e.key === 'ArrowDown') { if (view !== 'all') show(Math.max(0, view - 1)); }
    else if (e.key === 'Escape') show('all');
  });
  setTimeout(function () { say(view === 'all' ? 'Choose a door, or press a floor to come closer.' : 'Choose a door.'); }, 1400);
})();
</script>
