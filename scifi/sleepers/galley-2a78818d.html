<style>
  body{--bg:#15110d;--accent:#ffc777;--font-display:'Orbitron',sans-serif;--font-ui:'Share Tech Mono',monospace;--font-body:'Outfit',sans-serif;

  @keyframes steam{0%{opacity:0;transform:translateY(10px)}30%{opacity:.5}100%{opacity:0;transform:translateY(-60px)}}

  @keyframes hatchG{50%{opacity:.7}}
  #rail.next #railBar{animation:snudge 1.7s ease-in-out infinite}

  /* the order rail */
  .gr{display:grid;grid-template-columns:minmax(0,520px) 470px;gap:16px;width:min(1010px,96vw);align-items:start}
  .gr-rail{position:relative;padding:10px 12px 10px 30px;background:#2a2f33 linear-gradient(90deg,#3a4045,#23282c);border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
  .gr-rail:before{content:'';position:absolute;left:14px;top:8px;bottom:8px;width:6px;border-radius:3px;background:linear-gradient(90deg,#c9ced2,#7c858c)}
  .gr-row{position:relative;display:flex;align-items:center;min-height:33px;margin:0 0 4px}
  .gr-row:before{content:'';position:absolute;left:-14px;top:50%;width:12px;height:2px;background:#9aa3aa}
  .gr-t{flex:1;padding:4px 9px 3px;background:#fbfbf7;color:#2a2f34;font-family:'Share Tech Mono',monospace;font-size:12.5px;line-height:1.25;border-top:2px dotted #c9cdd2;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .gr-t b{font-weight:normal;color:#000;margin-right:6px}
  .gr-c{flex:1;min-height:36px;padding:2px;border:2px dashed rgba(255,210,140,.45);border-radius:4px;background:rgba(0,0,0,.25)}
  .gr-c:before{content:attr(data-n);float:left;margin:7px 6px 0 4px;font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,210,140,.7)}
  .gr-c.full{border-style:solid;border-color:#ffc777}.gr-c.full:before{display:none}
  .gr-c.bad{border-color:#e0603a;background:rgba(224,96,58,.18)}
  .gr-tray{display:flex;flex-direction:column;gap:6px;min-height:60px;padding:8px;border-radius:6px;background:#3a2c1e;border:1px solid #6b5236}
  .gr-tray:empty:before{content:'The biscuit tin: empty';font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.08em;color:#b7a58a}
  .pgt{display:block;padding:5px 10px 4px;background:#fbf6e6 repeating-linear-gradient(transparent 0 15px,rgba(70,100,160,.18) 15px 16px);color:#2a2a3a;font-family:'Caveat',cursive;font-weight:700;font-size:18px;line-height:1.1;
    border-left:3px solid rgba(190,70,60,.45);box-shadow:0 2px 0 rgba(0,0,0,.35);-webkit-user-select:none;user-select:none;cursor:grab}
  .pgt.messy{font-family:'Homemade Apple',cursive;font-weight:400;font-size:12.5px;line-height:1.5}
  .pgt.held{outline:3px solid #ffd27a}
  .pgt small{float:right;font-family:'Share Tech Mono',monospace;font-size:10px;color:#8a7a5a}
  .gr-read{height:196px;overflow:auto;margin:8px 0 0;padding:8px 14px 8px 16px;background:#fbf6e6 repeating-linear-gradient(transparent 0 23px,rgba(70,100,160,.2) 23px 24px);color:#2a2a3a;font-family:'Caveat',cursive;font-weight:700;font-size:19px;line-height:24px;border-left:2px solid rgba(190,70,60,.45)}
  .gr-read.messy{font-family:'Homemade Apple',cursive;font-weight:400;font-size:13.5px;line-height:24px}
  .gr-read i{display:block;font-style:normal;font-family:'Share Tech Mono',monospace;font-size:11px;color:#8a7a5a}
  .gr-side .pmsg{min-height:72px;margin:10px 0 8px;font-size:16.5px}
  .gr-side .btn{float:right}
  @media (max-width:1000px){.gr{grid-template-columns:1fr}}
</style>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null;

  (function () {
    var s = '', i, a, seed = 5;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (i = -6; i < 22; i++) s += '<path d="M' + (i * 110) + ' 84V640"/>';
    $('#panels').innerHTML = s; s = '';
    for (i = 0; i < 40; i++) s += '<circle cx="' + Math.round(1076 + rnd() * 148) + '" cy="' + Math.round(156 + rnd() * 148) + '" r="' + (0.6 + rnd() * 1.6).toFixed(1) + '" opacity="' + (0.3 + rnd() * 0.7).toFixed(2) + '"/>';
    $('#pstars').innerHTML = s; s = '';
    for (i = 0; i < 12; i++) { a = i * Math.PI / 6; s += '<circle cx="' + (1150 + Math.cos(a) * 86).toFixed(1) + '" cy="' + (230 + Math.sin(a) * 86).toFixed(1) + '" r="4"/>'; }
    $('#pbolts').innerHTML = s; s = '';
    for (i = 0; i < 12; i++) s += '<path d="M1390 ' + (40 + i * 56) + 'H1490"/>';
    $('#rungs').innerHTML = s; s = '';
    for (i = 0; i < 7; i++) s += '<rect x="' + (120 + i * 76) + '" y="292" width="40" height="' + (46 + (i % 3) * 8) + '" fill="#fbfbf7" opacity="' + (i % 2 ? 0.9 : 0.75) + '"/><rect x="' + (128 + i * 76) + '" y="286" width="24" height="10" rx="2" fill="#7c858c"/>';
    $('#tickets').innerHTML = s; s = '';
    for (i = 0; i < 30; i++) s += '<circle class="mote" cx="' + Math.round(900 + rnd() * 420) + '" cy="' + Math.round(470 + rnd() * 220) + '" r="' + (0.8 + rnd() * 1.4).toFixed(1) + '" opacity="' + (0.2 + rnd() * 0.4).toFixed(2) + '" style="animation-duration:' + (14 + rnd() * 20).toFixed(1) + 's;animation-delay:-' + (rnd() * 20).toFixed(1) + 's"/>';
    $('#motes').innerHTML = s;
  })();

  ER.init({
    theme: 'scifi', story: 'sleepers', storyTitle: 'Only What Was Asked', id: 'galley', no: 'II', title: 'The Galley',
    go: 'Climb up to the galley',
    intro: [
      'TALLY answers exactly what it is asked. &ldquo;Is anybody awake?&rdquo; got a yes; &ldquo;How many people are awake?&rdquo; got a number. &ldquo;What is the ship doing?&rdquo; got Rule 14, &ldquo;When will the engine start?&rdquo; got 10:12, and &ldquo;Who can end Rule 14?&rdquo; got the only answer that mattered: the officer of the watch, or anybody who shows TALLY that the bow shield is in place.',
      'The galley of Ring C was built for the end of the voyage, when two hundred hungry people will sit down in it at once. Until then it has one kettle that works, eighty-two years of dust, and the watchkeeper&rsquo;s things at the end of one table.',
      'It is ten past five. The engine starts at 10:12.'
    ],
    exit: {"next":"watchroom","w":{"9c517b4e":"45ed68b3"}}, tags: {"c1":["0c62bcdd"],"c2":["f311de65"],"c3":["1b0e2cfa"],"c4":["c0e7e660"],"c5":["6083af38"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('g-file') || null;
  var S = ER.flag('g-st') || { clips: {} };
  function keep() { ER.flag('g-st', S); }

  var LOG = [
    ['02:50', 'GARDEN DOOR OPENED. M. LINDGREN IN.'],
    ['04:12', 'STRIKE, BOW. BOW SENSORS 1 TO 4 SILENT. BOW SHIELD LOST BY RULE 14. RULE 14 BEGUN.'],
    ['04:13', 'RULE 14, STEP 1: BOW DOOR SEALED.'],
    ['04:19', 'GARDEN DOOR OPENED. M. LINDGREN OUT.'],
    ['04:20', 'RULE 14, STEP 2: TURNOVER BEGUN.'],
    ['04:26', 'BOW DOOR: OPEN REFUSED (M. LINDGREN).'],
    ['04:31', 'QUESTION AT BOW DOOR (M. LINDGREN). ANSWERED.'],
    ['05:41', 'FALL, GALLEY LADDER (M. LINDGREN). WRIST.'],
    ['06:30', 'RULE 14, STEP 3: ARRIVAL TEAM CHOSEN (M. LINDGREN).'],
    ['06:31', 'POD C-06 WARMING.'],
    ['07:10', 'RULE 6: M. LINDGREN INTO MEDICAL POD M1.'],
    ['07:31', 'POD C-07 WARMING.'],
    ['10:20', 'TURNOVER DONE.']
  ];
  var LOGDOC = '<h4>SHIP&rsquo;S LOG · TALLY · YEAR 82 · DAY 196</h4><h5>Kept by TALLY. Records doors, pods, strikes, rules and questions.</h5>' +
    LOG.map(function (l) { return '<p><b>' + l[0] + '</b>' + l[1] + '</p>'; }).join('');
  var PAGES = {
    a: { m: 0, t: 'Night 1,456 of my watch. In the garden, as usual: it is the only place on this ship that smells of anything. I have kept this ship for nearly four years, and in all that time nothing has happened. The strawberries have done well. Hall C is at four degrees. I am going to lie down in the hammock for ten minutes.' },
    b: { m: 0, t: 'I had been sleeping for more than an hour when the alarm went. I ran. By the time I got to the bow door, it had already sealed itself, and the lights were flashing red. I asked TALLY whether it could see the shield. It said no. So the shield must have gone. The ship has started to turn over: I can see the stars sliding past the galley window.' },
    c: { m: 1, t: 'I have done something stupid to my wrist on the galley ladder. It is not broken, I think. I am writing with the wrong hand, so forgive the mess. TALLY wants me to choose two of the arrival team, and I have not chosen yet. I have been sitting here for twenty minutes with the list.' },
    d: { m: 1, t: 'I have chosen, and TALLY has been warming the first pod since half past six. Ren Tanaka, because if anybody can stop that engine, it is the engineer who looks after it. And the young one in C-07. On the day we boarded, you asked me what we would do if TALLY was wrong. Nobody else asked. I did not have an answer. I still do not. Perhaps you will.' },
    e: { m: 1, t: 'This is the last page. TALLY says that I must go into a medical pod until a doctor can look at me, and TALLY does not take no for an answer. It does not take answers at all: only questions. By the time you read this, I will have been asleep for nearly a day. The engine will start at twelve minutes past ten. Do not let it start unless you are sure. M.L.' }
  };
  var TIN = ['d', 'a', 'e', 'b', 'c'];                 /* the order they came out of the tin */
  function first(k) { return PAGES[k].t.split(/[.:]/)[0] + '&hellip;'; }
  var DIARYDOC = '<h4>Loose pages from M. Lindgren&rsquo;s diary · no times, no numbers · in the order they came out of the tin</h4>' +
    TIN.map(function (k) { return '<div class="pg"><i>' + (PAGES[k].m ? 'In pencil, in a shaky left hand' : 'In pencil, neatly') + '</i><p' + (PAGES[k].m ? ' class="messy"' : '') + '>' + PAGES[k].t + '</p></div>'; }).join('');
  var CARD = '<h4>Watchkeeper&rsquo;s Handbook · 7 · Reading a log for time</h4><h5>A page with no clock on it still tells you when it was written. Read the verbs.</h5>' +
    '<svg viewBox="0 0 640 96"><path d="M20 52H612" stroke="#20242b" stroke-width="3"/><path d="M612 52l-14 -8v16z" fill="#20242b"/>' +
    '<g font-family="Share Tech Mono,monospace" font-size="13" fill="#20242b" text-anchor="middle"><circle cx="90" cy="52" r="7" fill="#a8402c"/><text x="90" y="30">it HAD sealed</text><text x="90" y="80" fill="#7a6a58">before that</text>' +
    '<circle cx="250" cy="52" r="7" fill="#a8402c"/><text x="250" y="30">it sealed</text><text x="250" y="80" fill="#7a6a58">then</text>' +
    '<rect x="402" y="40" width="16" height="24" fill="#20242b"/><text x="410" y="30">it HAS sealed</text><text x="410" y="80" fill="#7a6a58">NOW (the writer)</text>' +
    '<circle cx="560" cy="52" r="7" fill="none" stroke="#a8402c" stroke-width="3"/><text x="560" y="30">it WILL HAVE started</text><text x="560" y="80" fill="#7a6a58">by a later time</text></g></svg>' +
    '<p class="r"><b>1</b><span><b>Past simple</b> (<i>the door sealed</i>): a finished thing, at a time in the past.</span></p>' +
    '<p class="r"><b>2</b><span><b>Past perfect</b> (<i>it had sealed</i>): one step further back, done before another past thing. Whoever writes it is looking back.</span></p>' +
    '<p class="r"><b>3</b><span><b>Past continuous</b> and <b>had been &hellip;ing</b> (<i>the lights were flashing; I had been sleeping for an hour</i>): something going on when something else happened.</span></p>' +
    '<p class="r"><b>4</b><span><b>Present perfect</b> (<i>it has sealed; nothing has happened</i>): written while the result is still there. &ldquo;Nothing has happened&rdquo; is true only until something does.</span></p>' +
    '<p class="r"><b>5</b><span><b>Will have</b> (<i>by ten it will have started</i>): stand at a time in the future, and look back from it.</span></p>' +
    '<p class="ft">by = at that time or before · until = up to that time, and then no more · since = from then until now · for = how long · already = sooner than you might think · still = not over · yet = so far (in questions, and with not)</p>';
  /* the rail: TALLY's times, and the five empty clips between them */
  var RAIL = [['t', '02:50', 'GARDEN DOOR · M. LINDGREN IN'], ['c', 'c1'], ['t', '04:12', 'STRIKE, BOW · RULE 14 BEGUN'], ['t', '04:19', 'GARDEN DOOR · M. LINDGREN OUT'],
    ['t', '04:31', 'QUESTION AT BOW DOOR · ANSWERED'], ['c', 'c2'], ['t', '05:41', 'FALL, GALLEY LADDER · WRIST'], ['c', 'c3'], ['t', '06:30', 'ARRIVAL TEAM CHOSEN'], ['c', 'c4'], ['c', 'c5'], ['t', '07:10', 'M. LINDGREN INTO MEDICAL POD M1']];
  var CLIPS = ['c1', 'c2', 'c3', 'c4', 'c5'];

  function hints() {
    if (nextFile) return ['go', ['Lindgren will have written the night up in the crew log as well, and the crew log is kept in the watch room. The way there is the button at the bottom of the screen.']];
    if (!(ER.flag('g-log') && ER.flag('g-tin') && ER.flag('g-card'))) return ['look', [
      'Three things in this end of the galley tell you about last night: TALLY&rsquo;s printout on the wall, the red biscuit tin beside the lamp, and the card pinned up by the hotplate. Read all three.',
      'The tin is full of loose pages from Lindgren&rsquo;s diary. They have no times on them, and they came out of the tin in the wrong order.'
    ]];
    return ['rail', [
      'The rail over the hotplate has TALLY&rsquo;s times on it already. Hang each page of the diary on the empty clip between the two times when she must have written it.',
      'Read the verbs (card 7). &ldquo;Nothing has happened&rdquo; is present perfect: true only until something does. &ldquo;I had been sleeping &hellip; when the alarm went&rdquo; looks back at the alarm, so it was written after it. And look at the handwriting: it changes at 05:41.',
      'The page that says nothing has happened goes before the strike. The page about the alarm and TALLY&rsquo;s answer goes after 04:31. The page about her wrist goes after 05:41, and it says she has not chosen yet. The last two pages go after 06:30, and one of them says that it is the last.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#rail').setAttribute('class', 'hot' + (!nextFile && ER.flag('g-log') && ER.flag('g-tin') && ER.flag('g-card') ? ' next' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The galley. Five pages of a diary hang on the order rail, between TALLY&rsquo;s times.'); return; }
    if (ER.flag('g-seen')) { ER.say('The galley: dust sheets, a kettle, a ladder, and Lindgren&rsquo;s end of the table.'); return; }
    busy = true; ER.flag('g-seen', 1);
    ER.narrate([
      'The galley is long and low and smells of old metal. The chairs are upside down on the tables, under dust sheets, the way somebody left them eighty-two years ago. At the far end a ladder goes up through a hatch, and a green light comes down it from the garden deck.',
      'At the near end of one table, the dust has been wiped off. There is a lamp, a mug with an inch of cold tea in it, and a red biscuit tin. Tanaka has already found the kettle. &ldquo;It works,&rdquo; he says, as if that were the first good news of the century. It may be.'
    ], function () { busy = false; });
  }

  /* ---------- the galley ---------- */
  $('#printer').addEventListener('click', function () { if (!busy) ER.read({ html: LOGDOC, cls: 'tlog', clue: { id: 'shiplog', title: 'The ship’s log, day 196', kind: 'TALLY’s printout' }, done: function () { ER.flag('g-log', 1); SLP.learn(['ship\'s log', 'sensor', 'seal']); paint(); } }); });
  $('#tin').addEventListener('click', function () { if (!busy) ER.read({ html: DIARYDOC, cls: 'diary', clue: { id: 'diary', title: 'Lindgren’s diary: five loose pages', kind: 'In the biscuit tin' }, done: function () { ER.flag('g-tin', 1); SLP.learn(['diary', 'wrist', 'hammock']); paint(); } }); });
  $('#hcard').addEventListener('click', function () { if (!busy) ER.read({ html: CARD, cls: 'manual', clue: { id: 'tenses', title: 'Reading a log for time', kind: 'Watchkeeper’s Handbook' }, done: function () { ER.flag('g-card', 1); paint(); } }); });
  $('#rail').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The order rail: TALLY&rsquo;s times, and five pages of a diary between them, in the order they were written.'); return; }
    if (!(ER.flag('g-log') && ER.flag('g-tin') && ER.flag('g-card'))) { ER.say('The order rail, where the cooks will one day clip their orders. TALLY&rsquo;s printer has put its times on it. Read the printout, the tin and the card first.'); return; }
    openRail();
  });
  $('#tanakaG').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;She chose us,&rdquo; says Tanaka. &ldquo;Me because of the engine. You because of a question.&rdquo; He looks at you over his mug. &ldquo;Do you remember asking it?&rdquo; You do not. For you it was yesterday, and you do not.'
      : ER.flag('g-tin') ? '&ldquo;No times on her pages,&rdquo; says Tanaka. &ldquo;TALLY has the times and none of the words. She has the words and none of the times. Between them, we might have one night.&rdquo;'
      : '&ldquo;Tea,&rdquo; says Tanaka, &ldquo;is eighty-two years old, and so is the milk. I am drinking hot water. Read whatever she left.&rdquo;');
  });
  SLP.thing('#kettle', 'kettle', function () { SLP.sfx.kettle(); return 'The kettle: the only thing in this galley that has been used in the last eighty-two years. It has been used a great deal.'; }, isBusy);
  SLP.thing('#ladder', 'ladder', 'The galley ladder goes up through a hatch to the garden deck. On the third rung from the top there is a scuff, and below it a long smear in the dust, where somebody came down a great deal faster than she meant to.', isBusy);
  SLP.thing('#port', 'porthole', 'Stars, quite still. Page by page, the diary says that yesterday they were sliding past this window, while the ship turned over.', isBusy);
  SLP.thing('#mug', null, 'Lindgren&rsquo;s mug, with an inch of cold tea in it. Round it on the table is a clean ring where the mug has stood all day, and dust everywhere else.', isBusy);
  SLP.thing('#far', 'dust sheet', 'Chairs upside down on the tables, under dust sheets. Somebody put them up like that eighty-two years ago, the way you do at the end of the day, and nobody has had a day since.', isBusy);

  /* ---------- the order rail ---------- */
  function openRail() {
    var box = ER.el('div', 'gr'), s = '', done = false;
    s = '<div class="gr-rail">';
    RAIL.forEach(function (r) { s += r[0] === 't' ? '<div class="gr-row"><div class="gr-t"><b>' + r[1] + '</b>' + r[2] + '</div></div>' : '<div class="gr-row"><div class="gr-c" data-c="' + r[1] + '" data-n="clip"></div></div>'; });
    s += '</div><div class="gr-side"><div class="gr-tray"></div><div class="gr-read"><i>Click a page to read it here. Then put it on a clip.</i></div><p class="pmsg"></p><button type="button" class="btn" id="g-show">Show Tanaka</button></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.gr-tray'), reader = box.querySelector('.gr-read'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function token(k) { var n = ER.el('div', 'pgt dnd-item' + (PAGES[k].m ? ' messy' : ''), first(k)); n.setAttribute('data-p', k); return n; }
    TIN.forEach(function (k) { var c = null, x; for (x in S.clips) if (S.clips[x] === k) c = x; (c ? box.querySelector('.gr-c[data-c="' + c + '"]') : tray).appendChild(token(k)); });
    function read(k) {
      reader.className = 'gr-read' + (PAGES[k].m ? ' messy' : '');
      reader.innerHTML = '<i>' + (PAGES[k].m ? 'In pencil, in a shaky left hand' : 'In pencil, neatly') + '</i>' + ER.gloss(PAGES[k].t); reader.scrollTop = 0;
    }
    box.addEventListener('pointerdown', function (e) { var t = e.target.closest ? e.target.closest('.pgt') : null; if (t) read(t.getAttribute('data-p')); });
    function clips() { var o = {}; ER.$$('.gr-c', box).forEach(function (c) { var t = c.querySelector('.pgt'); o[c.getAttribute('data-c')] = t ? t.getAttribute('data-p') : ''; c.classList.toggle('full', !!t); c.classList.remove('bad'); }); return o; }
    ER.dnd(box, { item: '.pgt', slot: '.gr-c', home: tray, change: function () { S.clips = clips(); SLP.sfx.clip(); keep(); }, lock: function () { return done; } });
    clips();
    var N = { c1: 1, c2: 2, c3: 3, c4: 4, c5: 5 };
    function why(p, c) {
      var n = N[c];
      if (p === 'a') return '&ldquo;&lsquo;In all that time nothing has happened.&rsquo; Present perfect: true up to the moment she wrote it,&rdquo; says Tanaka. &ldquo;Could she write that after something had hit the bow?&rdquo;';
      if (p === 'b') return n === 1 ? '&ldquo;&lsquo;I had been sleeping for more than an hour <i>when the alarm went</i>.&rsquo; She&rsquo;s looking back at the alarm. Can that page hang before the strike?&rdquo;'
        : '&ldquo;Look at the handwriting on that page,&rdquo; says Tanaka, &ldquo;and then at 05:41. Which hand was she writing with?&rdquo;';
      if (p === 'c') return n < 3 ? '&ldquo;&lsquo;I have done something stupid to my wrist on the galley ladder.&rsquo; When did TALLY see her fall?&rdquo;'
        : '&ldquo;&lsquo;I have not chosen yet.&rsquo; TALLY&rsquo;s rail says when she chose. Before this page, or after it?&rdquo;';
      if (p === 'd') return n < 4 ? '&ldquo;&lsquo;I have chosen, and TALLY has been warming the first pod since half past six.&rsquo; So when was that written?&rdquo;'
        : '&ldquo;Two pages after 06:30,&rdquo; says Tanaka. &ldquo;One of them says it&rsquo;s the last. Which did she write last?&rdquo;';
      if (p === 'e') return n < 4 ? '&ldquo;&lsquo;TALLY says that I must go into a medical pod.&rsquo; It took her there at 07:10, and the page says it&rsquo;s the last one.&rdquo;'
        : '&ldquo;Two pages after 06:30,&rdquo; says Tanaka. &ldquo;One of them says it&rsquo;s the last. Which did she write last?&rdquo;';
      return '';
    }
    box.querySelector('#g-show').addEventListener('click', function () {
      if (done) return;
      var C = clips(), i, bad = null;
      for (i = 0; i < CLIPS.length; i++) if (!C[CLIPS[i]]) { msg('&ldquo;Five pages, five clips,&rdquo; says Tanaka. &ldquo;She wrote every one of them last night.&rdquo;'); ER.shake(box.querySelector('.gr-rail')); return; }
      for (i = 0; i < CLIPS.length; i++) if (!ER.check(CLIPS[i], C[CLIPS[i]])) { bad = CLIPS[i]; break; }
      if (bad) { SLP.bump('slips'); SLP.sfx.hm(); box.querySelector('.gr-c[data-c="' + bad + '"]').classList.add('bad'); msg(why(C[bad], bad)); return; }
      var file = ER.exitOk([CLIPS.map(function (c) { return C[c]; }).join('|')]);
      if (!file) return;
      done = true; nextFile = file; ER.flag('g-file', file); SLP.done('galley'); busy = true;
      SLP.mine('night', 'Last night (day 196)', '<p>02:50 into the garden. Nothing has happened. Hammock.</p><p>04:12 strike: she is ASLEEP (had been sleeping for an hour).</p><p>04:26 bow door sealed already. 04:31 asks TALLY: can you see the shield? NO. So: must have gone.</p>' +
        '<p>05:41 wrist. 06:30 chooses Tanaka + me (C-07): I asked her once what if TALLY was wrong.</p><p>07:10 into pod M1. &ldquo;Do not let it start unless you are sure.&rdquo;</p>', true);
      msg('Tanaka reads the rail from top to bottom with his finger, the way you would read a timetable.');
      setTimeout(function () { ER.closeAll(); SLP.solved(); paint(); after(); }, 2400);
    });
    msg(Object.keys(S.clips).some(function (c) { return S.clips[c]; }) ? 'The rail is as you left it.' : 'TALLY&rsquo;s times are on the rail already. Hang each page of the diary on the clip where it belongs: between the two times when she wrote it.');
    ER.open('ov-lock', box);
  }
  function after() {
    ER.narrate([
      '&ldquo;So,&rdquo; says Tanaka. &ldquo;She went up to the garden before three, and lay down for ten minutes. She was still asleep at twelve minutes past four, when something hit the bow. Nobody saw it. TALLY&rsquo;s sensors went silent, the bow door sealed itself, and she asked TALLY one question at a locked door.&rdquo;',
      '&ldquo;&lsquo;Can you see the shield?&rsquo; &lsquo;No.&rsquo; &lsquo;So the shield must have gone.&rsquo;&rdquo; He puts his finger on the word <i>must</i>. &ldquo;That isn&rsquo;t something she saw. That&rsquo;s something she worked out.&rdquo;',
      'Then he reads the page in the shaky left hand, out loud: <i>you asked me what we would do if TALLY was wrong</i>. He looks at you. You were sixteen, and it was the day you boarded. For you, that was yesterday.',
      '&ldquo;She&rsquo;ll have written it all up properly in the crew log,&rdquo; he says. &ldquo;Officers always do. That&rsquo;s kept in the watch room. Let&rsquo;s see what she told the ship.&rdquo;'
    ], function () { busy = false; paint(); SLP.learn(['log', 'crew log']); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
