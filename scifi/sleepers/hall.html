<style>
  body{--bg:#07101a;--accent:#9fd8ff;--font-display:'Orbitron',sans-serif;--font-ui:'Share Tech Mono',monospace;--font-body:'Outfit',sans-serif;

  .strip{animation:strip 6.2s steps(2) infinite}
  .strip:nth-child(3n){animation-duration:9.1s}
  @keyframes strip{93%{opacity:1}96%{opacity:.55}}
  .mist{animation:mist 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .mist:nth-child(2){animation-delay:-2.4s}.mist:nth-child(3){animation-delay:-4.6s}
  @keyframes mist{0%{opacity:0;transform:translateY(20px) scale(.8)}40%{opacity:.5}100%{opacity:0;transform:translateY(-70px) scale(1.4)}}
  .flake{animation:flake 19s linear infinite}
  @keyframes flake{from{transform:translate(0,-60px)}to{transform:translate(30px,560px)}}
  #tally.next #tScr,#c08.next #c08lid{animation:snudge 1.7s ease-in-out infinite}
  .tglow{animation:tglow 4s steps(3) infinite}
  @keyframes tglow{50%{opacity:.75}}
  #lockerDoor{transition:transform 1.2s ease-in-out;transform-box:fill-box;transform-origin:0 50%}
  #scene.open #lockerDoor{transform:scaleX(.18)}

  /* the console and the frost */
  .hq{display:grid;grid-template-columns:minmax(0,560px) 450px;gap:16px;width:min(1040px,96vw);align-items:start}
  .fn{padding:12px 14px 12px;border-radius:14px;background:#c9dbe6 linear-gradient(165deg,rgba(255,255,255,.75),rgba(150,190,215,.55));box-shadow:inset 0 0 26px rgba(255,255,255,.7),0 20px 50px rgba(0,0,0,.55)}
  .fn h6{margin:0 0 6px;font-family:'Share Tech Mono',monospace;font-weight:normal;font-size:12px;letter-spacing:.16em;color:#3c5a6c}
  .fn-row{margin:0 0 8px}
  .fn-row>b{display:block;font-family:'Caveat',cursive;font-weight:700;font-size:25px;line-height:1;color:#2a5470;text-shadow:0 0 3px #fff,0 0 1px #fff}
  .fn-slot{min-height:44px;margin-top:3px;padding:3px;border:2px dashed rgba(40,80,110,.45);border-radius:5px;background:rgba(255,255,255,.25)}
  .fn-slot.full{border-style:solid;border-color:#2a5f86}
  .fn-slot.bad{border-color:#c0502e;background:rgba(255,190,160,.3)}
  .sl-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;max-height:178px;overflow:auto;margin:10px 0 0;padding:8px;border-radius:6px;background:#1a2836;border:1px solid #3a5266}
  .sl-tray:empty:before{content:'TALLY’s printer: nothing printed yet';font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.08em;color:#6f8ea4}
  .slip{display:block;max-width:100%;padding:5px 9px 5px;background:#fbfbf6;color:#1b232b;border-radius:2px;font-family:'Share Tech Mono',monospace;font-size:12.5px;line-height:1.3;
    box-shadow:0 2px 0 rgba(0,0,0,.4);-webkit-user-select:none;user-select:none;cursor:grab;border-top:2px dotted #c4c9ce}
  .slip small{display:block;font-size:10.5px;color:#6b7076;letter-spacing:.04em}
  .slip.held{outline:3px solid #ffd27a}
  .fn-slot .slip{max-width:none}
  .hq-side .pmsg{min-height:72px;margin:10px 0 8px;font-size:16.5px}
  .hq-side .btn{float:right}
  @media (max-width:1000px){.hq{grid-template-columns:1fr}}
</style>

      'The <i>Amaranth</i> left the Sun eighty-two years ago with 1,206 people on board. One watchkeeper at a time stays awake, four years at a stretch, to look after her. Everybody else is asleep in a pod, and the arrival team is not meant to wake until Year 122, when the ship turns over to brake for the star the colonists call Celandine.',
      'You signed the arrival list on the day you boarded. You were the youngest name on it. The arrival team wakes first, forty years from now, to bring the ship in.',

  var CARD = '<h4>How to ask TALLY</h4>' +
    '<p><b>1</b><span>TALLY answers the question you ask. It adds nothing, and it never tells you what you did not ask.</span></p>' +
    '<p><b>2</b><span>A question that begins with <u>IS</u>, <u>ARE</u>, <u>WILL</u>, <u>CAN</u> or <u>DID</u> gets a YES or a NO, and that is all it gets.</span></p>' +
    '<p><b>3</b><span>For a fact, begin with <u>WHAT</u>, <u>WHEN</u>, <u>WHERE</u>, <u>WHO</u>, <u>WHY</u> or <u>HOW MANY</u>.</span></p>' +
    '<p><b>4</b><span>&ldquo;Is there &hellip;?&rdquo; asks whether a thing exists. &ldquo;How many &hellip;?&rdquo; asks for a number.</span></p>' +
    '<p><b>5</b><span>If a question takes something for granted that is not true, TALLY says so, and answers nothing else.</span></p>' +
    '<p><b>6</b><span>TALLY never guesses. If it does not know, it says so.</span></p>' +
    '<small>If an answer surprises you, do not argue with it. Ask another question. M. Lindgren, officer of the watch</small>';
  var FROST = '<h4>Written in the frost on pod C-08</h4><h5>with one finger, by Ren Tanaka</h5>' +
    '<p class="r"><b>1</b><span>WHAT is going on?</span></p><p class="r"><b>2</b><span>HOW LONG have we got?</span></p><p class="r"><b>3</b><span>WHO can call it off?</span></p>' +
    '<p class="ft">Underneath, smaller: sorry about the frost.</p>';
  var RULE14 = '<h4>Rule 14 · If the bow shield is lost</h4><h5>Arrival team&rsquo;s book · page 14 · read this before you touch anything</h5>' +
    '<p>At our speed even a speck of dust hits like a small bomb. The bow shield takes those hits for the whole voyage. A ship that has lost it cannot go on at full speed. So, if the bow shield is lost:</p>' +

    '<p class="r"><b>2</b><span>TALLY turns the ship over, so that the stern goes first.</span></p>' +
    '<p class="r"><b>3</b><span>The officer of the watch chooses two of the arrival team, and TALLY wakes them.</span></p>' +
    '<p class="r"><b>4</b><span>Thirty hours after the shield was lost, the engine starts, and brakes the ship to a stop. The ship waits there to be mended.</span></p>' +
    '<p>Rule 14 ends if the officer of the watch ends it, or if <b>anybody shows TALLY that the bow shield is in place</b>.</p>' +
    '<p class="ft">TALLY cannot be told. It can only be asked.</p>';

  /* ---------- what TALLY says ---------- */

    'when will the engine start?': { id: 'when', t: 'At 10:12 this morning: in five hours and forty-one minutes.' },
    'will the engine start?': { id: 'yes2', t: 'Yes.' },
    'why will the engine start?': { id: 'whyeng', t: 'Because Rule 14 says that it will.' },
    'what is the engine doing?': { id: 'engdoing', t: 'Nothing yet. It is waiting.' },

    'can you end rule 14?': { id: 'no3', t: 'No.' },

    'how many people are awake?': { id: 'two', t: 'Two.' },

    'who is awake?': { id: 'who', t: 'Ren Tanaka, and you.' },
    'who is in charge?': { id: 'charge', t: 'Officer Margit Lindgren, the officer of the watch.', add: ['Officer Lindgren', 'Where'] },

    'why did officer lindgren wake us?': { id: 'falsewake', t: 'Your question takes something for granted that is not true. Officer Lindgren did not wake you.' },
    'why did you wake us?': { id: 'whywake', t: 'Rule 14: the officer of the watch chooses two of the arrival team, and I wake them. Officer Lindgren chose Ren Tanaka first, and then you.', add: ['Officer Lindgren'] },
    'who are you?': { id: 'tally', t: 'TALLY, the ship&rsquo;s computer.' },
    'are you awake?': { id: 'yes6', t: 'Yes.' }
  };
  var LINE = { l1: 'WHAT is going on?', l2: 'HOW LONG have we got?', l3: 'WHO can call it off?' };
  function reply(q) {
    var r = A[q];
    if (r) return r;
    if (/officer lindgren/.test(q) && !has('Officer Lindgren')) return SLP.fallback(q);
    return SLP.fallback(q);
  }
  function has(w) { return S.keys.indexOf(w) >= 0; }

  function hints() {
    if (nextFile) return ['go', ['The arrival team&rsquo;s locker on the right-hand wall is open now. Read Rule 14 if you have not, and then go up to the galley, where Officer Lindgren fell.']];
    if (!ER.flag('h-talk')) return ['talk', [
      'You are not the only one awake. The man in the foil blanket, on the edge of the open pod on the left, has been awake for an hour. Click on him.',
      'Then look at the computer on the pillar in the middle of the hall, and at the white card taped under its screen.'
    ]];
    if (!ER.flag('h-card')) return ['card', ['Before you ask TALLY anything, read the white card under its screen. Tanaka did not read it, and he has had a very unhelpful hour.']];
    return ['ask', [
      'Tanaka wrote three questions in the frost on pod C-08. Ask TALLY a question for each one. Each answer comes out of TALLY&rsquo;s printer as a slip: put the slip on the line that it answers.',
      'A question that begins with IS, WILL or CAN gets only YES or NO (card, line 2). &ldquo;What is going on?&rdquo; needs a question with WHAT in it; &ldquo;How long have we got?&rdquo; needs WHEN; &ldquo;Who can call it off?&rdquo; needs WHO. New words appear on the keys when TALLY uses them.',
      'Ask &ldquo;What is the ship doing?&rdquo; first, and &ldquo;When will the engine start?&rdquo;. When the words RULE 14 and END appear on the keys, ask who can end it. &ldquo;Who can stop the engine?&rdquo; gets a true answer that is no use to anybody.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#tally').setAttribute('class', 'hot' + (!nextFile && ER.flag('h-talk') && ER.flag('h-card') ? ' next' : ''));
    sc.setAttribute('class', nextFile ? 'open' : '');
    $('#book').setAttribute('opacity', nextFile && !ER.flag('h-rule') ? 1 : 0);
    $('#go').classList.toggle('on', !!nextFile && !!ER.flag('h-rule') && !busy);
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say(ER.flag('h-rule') ? 'Hall C. TALLY&rsquo;s three slips are still stuck to the frost on C-08.' : 'The arrival team&rsquo;s locker is open. The red book is on its shelf.'); return; }
    if (ER.flag('h-seen')) { ER.say('Hall C: two long rows of pods, a pillar with a screen, and a man in a foil blanket.'); return; }
    busy = true; ER.flag('h-seen', 1); SLP.sfx.hiss(2);
    ER.narrate([
      'The lid of your pod is up. The air in Hall C is so cold that it hurts your teeth. Somewhere a fan is running, and somewhere much further away, a long way down the ship, something is humming.',
      'Two long rows of pods go away from you into the blue light. In every one of them somebody is asleep. In the pod next to yours, which is open too, nobody is: its owner is sitting on the edge of it in a foil blanket, holding a flask in both hands.',
      '&ldquo;Don&rsquo;t stand up,&rdquo; he says. &ldquo;Your legs think it&rsquo;s eighty-two years ago.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- the hall ---------- */
  $('#tanakaG').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Five hours and forty-one minutes,&rdquo; says Tanaka. &ldquo;I have done longer jobs. I have never done one with less idea what it was.&rdquo;'); return; }
    if (ER.flag('h-talk')) { ER.say('&ldquo;Card first,&rdquo; says Tanaka. &ldquo;Then my three questions. They&rsquo;re on the old gentleman&rsquo;s lid: C-08.&rdquo;'); return; }
    ER.talk({
      who: CAST.tanaka.who, role: CAST.tanaka.role, face: FACE('tanaka'),
      lines: [
        { note: 'A man of about thirty-five, with his hair standing straight up and a foil blanket round his shoulders. He is shaking, and he is trying to look as if he is not.',
          a: '&ldquo;Ren Tanaka. Engineer, arrival team. I&rsquo;ve been awake for an hour, and for the first half of it I couldn&rsquo;t hold a cup. Drink something hot before you try to think. There&rsquo;s a second flask by your pod.&rdquo;' },
        { q: 'What has happened?',
          a: '&ldquo;I don&rsquo;t know. The first thing I saw was the date: Year 82. We&rsquo;re meant to wake in Year 122. So I asked TALLY what had happened, and TALLY said: &lsquo;A great many things.&rsquo; It wasn&rsquo;t joking. TALLY doesn&rsquo;t joke.&rdquo;' },
        { q: 'Who is TALLY?',
          a: '&ldquo;The ship&rsquo;s computer. It knows everything on board, and it will tell you all of it, one fact at a time, if you ask exactly the right question. It won&rsquo;t tell you one word more. It wasn&rsquo;t built to chat. It was built to be right.&rdquo;' },
        { q: 'So what do we do?',
          a: '&ldquo;We ask it properly. I&rsquo;ve written the three things I want to know in the frost on the old gentleman&rsquo;s lid there, C-08. He won&rsquo;t mind. But read the card on TALLY&rsquo;s pillar first. I didn&rsquo;t, and I&rsquo;ve had a very unhelpful hour.&rdquo;' }
      ],
      clue: { id: 'tanaka1', title: 'Ren Tanaka, at half past four', kind: 'What he said' }, last: 'Look round the hall',
      done: function (seen) { if (!seen) return; ER.flag('h-talk', 1); SLP.learn(['pod', 'sleeper', 'arrival team', 'foil blanket']); paint(); ER.say('TALLY is the pillar with the screen. The card is taped under the screen. Tanaka&rsquo;s questions are on the lid of C-08.'); }
    });
  });
  $('#hcard').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.read({ html: CARD, cls: 'card', clue: { id: 'askcard', title: 'How to ask TALLY', kind: 'On TALLY’s pillar' }, done: function () { ER.flag('h-card', 1); SLP.learn(['take for granted']); paint(); } });
  });
  $('#tally').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('TALLY&rsquo;s screen: RULE 14 · STEP 4 OF 4 · ENGINE AT 10:12. Underneath, the cursor, waiting.'); return; }
    if (!ER.flag('h-talk')) { ER.say('A screen on a pillar, with a cursor on it, waiting. The man in the foil blanket is watching you. Perhaps talk to him first.'); return; }
    if (!ER.flag('h-card')) { ER.say('TALLY. There is a white card taped under the screen. Tanaka says: read it first.'); return; }
    openAsk();
  });
  $('#c08').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: FROST, cls: 'manual', clue: { id: 'frost', title: 'Three questions in the frost', kind: 'On pod C-08' }, done: function () {
      ER.say('Inside C-08 an old man is asleep with his hands folded on his chest. He is going to be very surprised in forty years.'); } });
  });
  $('#locker').addEventListener('click', function () {
    if (busy) return;
    if (!nextFile) { ER.say('A locker: ARRIVAL TEAM · READ FIRST. It is locked. A small screen on the door says: ASK TALLY.'); return; }
    readRule();
  });
  SLP.thing('#sign', 'sleeper', 'HALL C · RING C. Two hundred and fourteen pods. In two hundred and twelve of them somebody is asleep, at four degrees, dreaming of nothing at all.', isBusy);
  SLP.thing('#c07', 'pod', function () { return 'Your pod, C-07. A small screen inside the lid still says: WARMING DONE · 04:31. The frost on the glass is melting into the shape of a country nobody has drawn yet.'; }, isBusy);
  SLP.thing('#rowL, #rowR', 'cold sleep', 'Pods, and pods, and pods. In every one of them somebody is in cold sleep: their heart beats twice a minute, and they will not be one day older in the morning.', isBusy);

  /* ---------- the console and the frost ---------- */
  function openAsk() {
    var box = ER.el('div', 'hq'), side, ask, tray, done = false;
    box.innerHTML = '<div class="hq-main"></div><div class="hq-side"><div class="fn"><h6>POD C-08 · THE FROST ON THE LID</h6>' +
      ['l1', 'l2', 'l3'].map(function (l) { return '<div class="fn-row"><b>' + LINE[l] + '</b><div class="fn-slot" data-l="' + l + '"></div></div>'; }).join('') +
      '<div class="sl-tray"></div></div><p class="pmsg"></p><button type="button" class="btn" id="h-show">Show Tanaka</button></div>';
    side = box.querySelector('.hq-side'); tray = box.querySelector('.sl-tray');
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function slip(id) {
      var r = null, k; for (k in A) if (A[k].id === id) { r = A[k]; r.q = k; break; }
      if (!r) return null;
      var n = ER.el('div', 'slip dnd-item', '<small></small>' + r.t); n.setAttribute('data-id', id);
      n.querySelector('small').textContent = r.q.toUpperCase();
      return n;
    }
    var words = ['What', 'When', 'Who', 'Why', 'How many', 'Is', 'Will', 'Can', 'Did', 'is', 'are', 'will', 'can', 'did', 'the ship', 'the engine', 'people', 'anybody', 'there', 'you', 'us', 'doing', 'anything', 'start', 'do', 'awake', 'in charge', 'stop', 'wake', '?'];
    S.keys.forEach(function (w) { if (words.indexOf(w) < 0) words.splice(words.length - 1, 0, w); });
    ask = SLP.ask(box.querySelector('.hq-main'), {
      words: words, title: 'Ship’s computer · answers questions', note: 'Click words to make a question. Then ASK.',
      reply: reply,
      onReply: function (r) {
        if (r.add) r.add.forEach(function (w) { if (!has(w)) { S.keys.push(w); ask.add(w); } });
        if (!r.id || r.bad) { keep(); return; }
        if (S.slips.indexOf(r.id) < 0) {
          S.slips.push(r.id); var n = slip(r.id); if (n) tray.appendChild(n); SLP.sfx.print();
        }
        keep();
      }
    });
    S.slips.forEach(function (id) { var n = slip(id); if (!n) return; var l = null, k; for (k in S.lines) if (S.lines[k] === id) l = k; (l ? box.querySelector('.fn-slot[data-l="' + l + '"]') : tray).appendChild(n); });
    function lines() { var o = {}; ER.$$('.fn-slot', box).forEach(function (s) { var t = s.querySelector('.slip'); o[s.getAttribute('data-l')] = t ? t.getAttribute('data-id') : ''; s.classList.toggle('full', !!t); s.classList.remove('bad'); }); return o; }
    ER.dnd(side, { item: '.slip', slot: '.fn-slot', home: tray, change: function () { S.lines = lines(); keep(); }, lock: function () { return done; } });
    lines();
    var YES = /^(yes|no)\d$|^lcan$/;
    var WHY = {
      l1: { why14: '&ldquo;That&rsquo;s <i>why</i>. I asked <i>what</i>.&rdquo;', what14: '&ldquo;That tells me where to read about it. I asked what the ship is doing.&rdquo;', engdoing: '&ldquo;That&rsquo;s the engine, and it&rsquo;s doing nothing. I asked about the whole ship.&rdquo;', engdo: '&ldquo;That&rsquo;s what the engine will do, later. What is the ship doing now?&rdquo;' },
      l2: { engdo: '&ldquo;That&rsquo;s <i>what</i> it will do. I asked how long until it does it.&rdquo;', whyeng: '&ldquo;That&rsquo;s why. I asked how long.&rdquo;', engdoing: '&ldquo;Waiting. For how long?&rdquo;' },
      l3: { charge: '&ldquo;In charge, and asleep in a pod. Can she call anything off from there?&rdquo;', lasleep: '&ldquo;So it isn&rsquo;t her, not this morning. Then who?&rdquo;', where: '&ldquo;So she can&rsquo;t. Then who can?&rdquo;',
        lcan: '&ldquo;Yes, she can. She&rsquo;s asleep. &lsquo;Can she?&rsquo; was a true answer to the wrong question.&rdquo;',
        nobody: '&ldquo;Nobody can stop it, because it hasn&rsquo;t started. True, and no use. What <i>has</i> started? Ask who can end <i>that</i>.&rdquo;',
        who: '&ldquo;That&rsquo;s who is awake. I asked who can call it off.&rdquo;', two: '&ldquo;Two of us. I asked who can call it off.&rdquo;' }
    };
    box.querySelector('#h-show').addEventListener('click', function () {
      if (done) return;
      var L = lines(), k, bad = null;
      if (!L.l1 && !L.l2 && !L.l3) { msg('&ldquo;Put TALLY&rsquo;s slips on my questions,&rdquo; says Tanaka. &ldquo;One on each line. Ask it something first.&rdquo;'); return; }
      if (!L.l1 || !L.l2 || !L.l3) { msg('&ldquo;Three questions,&rdquo; says Tanaka. &ldquo;Three slips. I can wait. The engine can&rsquo;t.&rdquo;'); ER.shake(box.querySelector('.fn')); return; }
      for (k in LINE) if (!ER.check(k, L[k])) { bad = k; break; }
      if (bad) {
        SLP.bump('slips'); SLP.sfx.hm();
        box.querySelector('.fn-slot[data-l="' + bad + '"]').classList.add('bad');
        var id = L[bad], t = (WHY[bad] || {})[id];
        if (!t && YES.test(id)) t = '&ldquo;&lsquo;' + (A[Object.keys(A).filter(function (q) { return A[q].id === id; })[0]] || {}).t + '&rsquo; Thank you, TALLY.&rdquo; Tanaka sighs. &ldquo;Ask it a yes-or-no question, and that is all you get. Look at the first word of my line.&rdquo;';
        if (!t && id === 'falsewake') t = '&ldquo;A question with a mistake in it gets the mistake, and nothing else. Useful to know. Not what I asked.&rdquo;';
        if (!t) t = '&ldquo;That&rsquo;s true, and it isn&rsquo;t an answer to line ' + bad.charAt(1) + '. Read my line again: the first word tells you what kind of answer I want.&rdquo;';
        msg(t); return;
      }
      var file = ER.exitOk([L.l1 + '|' + L.l2 + '|' + L.l3]);
      if (!file) { msg('&ldquo;Hm,&rdquo; says Tanaka. &ldquo;Read them to me again.&rdquo;'); return; }
      done = true; nextFile = file; ER.flag('h-file', file); SLP.done('hall'); busy = true;
      SLP.mine('first', 'What TALLY says', '<p>The ship is following RULE 14.</p><p>The engine starts at 10:12 (5 h 41 min from 04:31).</p><p>Rule 14 ends if Lindgren ends it (asleep, pod M1) or if ANYBODY SHOWS TALLY THE BOW SHIELD IS IN PLACE.</p><p>Lindgren chose us. Why?</p>', true);
      msg('Tanaka reads the three slips twice, and then once more, with his lips moving.');
      setTimeout(function () { ER.closeAll(); SLP.solved(); paint(); after(); }, 2400);
    });
    msg(S.slips.length ? 'The slips are as you left them.' : 'TALLY on the left: click words to make a question, then ASK. Its answers come out as slips: put each slip on the line of Tanaka&rsquo;s that it answers.');
    ER.open('ov-lock', box);
  }

  function after() {
    ER.narrate([
      '&ldquo;Rule 14,&rdquo; says Tanaka. &ldquo;Five hours and forty-one minutes. And the officer of the watch is asleep in a medical pod.&rdquo; He reads the third slip once more. &ldquo;&lsquo;Or anybody who shows me that the bow shield is in place.&rsquo; Somebody wrote that sentence very carefully.&rdquo;',
      '&ldquo;There&rsquo;ll be a book about it,&rdquo; he says, and the door of the arrival team&rsquo;s locker clicks open by itself. &ldquo;There&rsquo;s always a book.&rdquo;'
    ], function () { busy = false; paint(); SLP.sfx.slide(); setTimeout(readRule, 500); });
  }
  function readRule() {
    ER.read({ html: RULE14, cls: 'manual', clue: { id: 'rule14', title: 'Rule 14', kind: 'Arrival team’s book' }, done: function () {
      var first = !ER.flag('h-rule'); ER.flag('h-rule', 1); SLP.learn(['bow shield', 'turnover', 'brake', 'officer of the watch']); paint();
      if (first) {
        busy = true;
        ER.narrate([
          '&ldquo;If the shield is gone, the rule is right,&rdquo; says Tanaka. &ldquo;A ship can&rsquo;t cross forty years of dust with no shield. If it isn&rsquo;t gone, then at twelve minutes past ten we stop out here, wherever <i>here</i> is, for nothing. There&rsquo;s fuel on this ship for one stop.&rdquo;',
          '&ldquo;Nobody can get to the bow: it&rsquo;s sealed. So first I want to know what happened last night. TALLY says Lindgren fell on the galley ladder. If she wrote anything down, it&rsquo;ll be by the kettle. Watchkeepers live by the kettle.&rdquo;'
        ], function () { busy = false; paint(); });
      }
    } });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
