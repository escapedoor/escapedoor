<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cabin 4 · Seven Hours of Air</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-scifi.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="kit.css">
<style>
  body{--bg:#0d0507;--accent:#ff7a52;--font-display:'Orbitron',sans-serif;--font-ui:'Share Tech Mono',monospace;--font-body:'Outfit',sans-serif;
    --tc-bg:rgba(13,4,5,.94);--cap-bg:rgba(18,7,8,.94);--panel:#190c0d;--face-bg:#0b161f;--q-ink:#ffb49f;--fade:#080203;--hud-bg:rgba(22,7,7,.72)}
  .tc-room{font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .num4{font-family:'Orbitron',sans-serif;font-weight:900;font-size:230px;fill:#30353c;text-anchor:middle}
  .plate{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:4px;fill:#cfd6dc;text-anchor:middle}
  .lockT{font-family:'Share Tech Mono',monospace;font-size:15px;letter-spacing:2px;text-anchor:middle;fill:#ff5a4a}
  .pen{font-family:'Caveat',cursive;font-weight:700;font-size:34px;fill:#1d2a4a}
  .ruleT{font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.5px;fill:#20242b}
  #strobe{animation:strobe 1.3s steps(1,end) infinite}
  @keyframes strobe{0%{opacity:.05}50%{opacity:.16}}
  #strip{animation:strip 1.3s steps(1,end) infinite}
  @keyframes strip{0%{opacity:.55}50%{opacity:1}}
  #lockT{animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{0%{opacity:1}50%{opacity:.25}}
  #europa{transform-origin:310px 480px;animation:spin 300s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rib{transform-box:fill-box;transform-origin:50% 0;animation:rib 1.1s ease-in-out infinite alternate}
  .rib.r2{animation-duration:.8s;animation-delay:-.4s}.rib.r3{animation-duration:1.4s;animation-delay:-.7s}
  @keyframes rib{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}
  #heatBars{animation:heat 2.4s steps(3) infinite}
  @keyframes heat{50%{opacity:.75}}
  #keelRing{animation:kr 2.2s ease-in-out infinite}
  @keyframes kr{50%{opacity:.25}}
  #card.show{animation:cardGlow 2.4s ease-in-out infinite}
  @keyframes cardGlow{50%{filter:brightness(1.25)}}
  #leaf{transition:transform 1.9s cubic-bezier(.6,0,.3,1)}

  /* the door, close up */
  .dm{display:grid;grid-template-columns:minmax(0,640px) 340px;gap:22px;align-items:start;width:min(1010px,96vw)}
  .dm svg{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 26px 70px rgba(0,0,0,.7);touch-action:none}
  .dm-msg{min-height:54px;margin-top:12px;padding:10px 16px;background:rgba(10,4,4,.85);border-left:3px solid #ff7a52;color:#ffe9e2;
    font-family:'Outfit',sans-serif;font-size:19px;line-height:1.35}
  .dm-help{margin-top:8px;font-family:'Share Tech Mono',monospace;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#ffb49f;opacity:.7}
  .dm-card{background:#f1c40f linear-gradient(168deg,rgba(255,255,255,.3),rgba(120,80,0,.16));color:#16130a;border:3px solid #16130a;border-radius:12px;
    padding:0 20px 14px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:17.5px;line-height:1.26;box-shadow:0 20px 50px rgba(0,0,0,.6);
    -webkit-user-select:text;user-select:text}
  .dm-card h4{margin:0 -20px 12px;padding:11px 20px 9px;background:#16130a repeating-linear-gradient(-45deg,#16130a 0 14px,#2b2612 14px 28px);color:#f1c40f;
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;border-radius:8px 8px 0 0}
  .dm-card p{margin:0 0 8px}
  .dm-card .pen{font-family:'Caveat',cursive;font-weight:700;font-size:23px;color:#1d2a4a;transform:rotate(-1.5deg);margin:10px 0 0}
  .dm-card .w:hover{color:#8c2f24}
  .eng{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:4px;fill:#aab3bb;text-anchor:middle}
  .eng2{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;fill:#7b858e;text-anchor:middle}
  #ndl{transform-origin:150px 150px;transition:transform .3s}
  #wh{transform-origin:150px 366px}
  #ph,#lv{transition:transform .13s}
  #ph.on,#lv.on{transition:none}
  #lamp.flash{animation:lampf .5s steps(1,end) infinite;fill:#ffb02e}
  #lamp.steady{fill:#3dff8a}
  @keyframes lampf{0%{fill:#ffb02e}50%{fill:#4a2c08}}
  @media (max-width:900px){.dm{grid-template-columns:1fr}}
</style>
</head>

    function letGo() {

      msg('You let go too soon. The seal fills up again, and the needle drops to nothing.');
      touch(false);
    }
    ER.open('ov-lock', box, function () { clearInterval(tickT); clearTimeout(holdT); clearTimeout(leakT); });
  }
})();
</script>
