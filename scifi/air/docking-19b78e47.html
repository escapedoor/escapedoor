<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Docking · Seven Hours of Air</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">

<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="kit.css">
<style>
  body{--bg:#02030a;--accent:#7dffb2;--font-display:'Orbitron',sans-serif;--font-ui:'Outfit',sans-serif;--font-body:'Outfit',sans-serif;
    --tc-bg:rgba(2,3,10,.93);--cap-bg:rgba(3,5,14,.92);--fade:#000;--hud-bg:rgba(3,5,14,.7)}
  .tc-room{font-weight:500;letter-spacing:.34em;text-transform:uppercase;font-size:clamp(34px,5.2vw,70px)}
  .hbtn,.chip,.ov-x,.btn,.toast{font-weight:500;letter-spacing:.14em}
  .hullT{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:6px;fill:#4a5663}
  .tw{animation:tw 3.4s steps(1,end) infinite}.tw.t2{animation-delay:-1.1s}.tw.t3{animation-delay:-2.3s}
  @keyframes tw{0%{opacity:1}50%{opacity:.25}}
  #approach{animation:approach 17s cubic-bezier(.2,.6,.3,1) forwards}
  @keyframes approach{from{transform:translate(-470px,330px)}to{transform:translate(0,0)}}
  .jet{animation:jet .5s steps(1,end) 26 forwards}
  @keyframes jet{0%{opacity:.9}50%{opacity:0}100%{opacity:0}}
  .nav{animation:nav 1.3s steps(1,end) infinite}.nav.n2{animation-delay:-.65s}
  @keyframes nav{0%{opacity:1}30%{opacity:.1}}
  #gardenGlow{animation:gg 4s ease-in-out infinite}
  @keyframes gg{50%{opacity:.7}}

  .done{position:fixed;right:3vw;top:66px;z-index:34;width:min(440px,92vw);padding:24px 28px 20px;display:none;
    background:rgba(5,12,20,.9);border:1px solid #2b6a80;border-top:4px solid #7dffb2;color:#e3f1f5;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .done.on{display:block}
  .okstamp{display:inline-block;padding:5px 16px 4px;border:3px solid #7dffb2;color:#7dffb2;font-family:'Orbitron',sans-serif;font-weight:800;font-size:28px;letter-spacing:.2em;
    transform:rotate(-3deg);margin-bottom:14px}
  .done p{margin:0 0 8px;font-family:'Outfit',sans-serif;font-size:19px;line-height:1.4}
  .done .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .done .btn{font-size:13px;padding:8px 14px}
  .done small{display:block;margin-top:14px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.06em;opacity:.6;line-height:1.5}
  .done small button{text-decoration:underline;font:inherit;letter-spacing:inherit}

  .rp{width:min(760px,94vw);max-height:84vh;overflow:auto;background:#eef4f6;color:#0f2630;padding:30px 38px 28px;box-shadow:0 26px 70px rgba(0,0,0,.6);border-top:8px solid #0f2630;
    -webkit-user-select:text;user-select:text}
  .rp h4{margin:0 0 4px;font-family:'Orbitron',sans-serif;font-weight:800;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:#0b6f8a}
  .rp h3{margin:0 0 18px;font-family:'Share Tech Mono',monospace;font-weight:normal;font-size:23px;border-bottom:2px solid #0f2630;padding-bottom:10px}
  .rp label{display:block;font-family:'Outfit',sans-serif;font-size:18.5px;font-weight:600;margin:11px 0 5px}
  .rp textarea,.rp input[type=text]{width:100%;font-family:'Share Tech Mono',monospace;font-size:17px;line-height:1.5;color:#0f2630;background:#fff;border:1px solid #9fb7c1;
    padding:9px 12px;border-radius:2px;resize:vertical;-webkit-user-select:text;user-select:text}
  .rp textarea{min-height:72px}
  .rp{padding-top:24px;padding-bottom:20px}
  .rp h3{margin-bottom:10px;padding-bottom:8px}
  .rp .yn{display:flex;gap:22px;font-family:'Share Tech Mono',monospace;font-size:18px;margin:4px 0 8px}
  .rp .yn label{display:inline-flex;align-items:center;gap:8px;margin:0;font:inherit;font-weight:normal;cursor:pointer}
  .rp .count{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;text-align:right}
  .rp .foot{display:flex;gap:10px;align-items:center;margin-top:16px}
  .rp .foot span{flex:1;font-family:'Outfit',sans-serif;font-size:16px;opacity:.7}
  .rp .btn{--accent:#0f2630}.rp .btn:hover{color:#eef4f6}
  .rp .w:hover{color:#0b6f8a}
  @media print{
    body{overflow:visible;background:#fff}
    body>*:not(.ov){display:none!important}
    .ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
    .ov-bar,.rp .foot{display:none!important}
    .rp{box-shadow:none;max-height:none;width:auto;overflow:visible;background:#fff}
    .rp textarea,.rp input[type=text]{border:0;border-bottom:1px solid #999}
  }
</style>
</head>

<script src="kit.js"></script>
<script>
(function () {
  var $ = ER.$;
  (function () {
    var s = '', i, x, y;
    for (i = 0; i < 170; i++) {
      x = -300 + (i * 7919) % 2200; y = -100 + (i * 5903) % 1000;
      s += '<circle cx="' + x + '" cy="' + y + '" r="' + (0.6 + (i % 5) * 0.32).toFixed(2) + '" opacity="' + (0.35 + (i % 4) * 0.2).toFixed(2) + '"' + (i % 9 === 0 ? ' class="tw' + (i % 2 ? ' t2' : i % 3 ? ' t3' : '') + '"' : '') + '/>';
    }
    $('#stars').innerHTML = s;
  })();

  ER.init({
    theme: 'scifi', story: 'air', storyTitle: 'Seven Hours of Air', id: 'docking', no: 'V', title: 'Docking',
    go: 'Half past one',
    intro: [
      'You switched off the socket in cabin 4, which was your own heater, and gave each tank the light Dr Adeyemi asked for. Breaker C stayed up.',
      'The algae went back to work. By four in the morning the oxygen had stopped falling. By six it was climbing.',
      'You went back to cabin 4, which was cold, and slept in your jacket.'
    ],
    exit: {"last":true,"rooms":5,"stars":3}, tags: {},
    onBegin: begin
  });
  AIR.clock();

  function begin() {
    var st = ER.state();
    if (!ER.flag('tEnd')) ER.flag('tEnd', Date.now());
    if (!ER.flag('fixed')) AIR.fixed();
    AIR.amb.vent(0.03, 200);
    setTimeout(AIR.sfx.thud, 15500);
    ER.narrate([
      'Half past one in the afternoon. The lander comes up from the ice and docks with a bump you can feel in your teeth.',
      'Commander Hale reads the night&rsquo;s log standing up. She reads one line twice. Then she looks at you, and at your jacket.',
      '&ldquo;Cold, were you?&rdquo; she says.',
      'Dr Adeyemi goes straight to the garden in her boots. Through the hatch you can hear her saying good morning to each tank by name.',
      'Josef Antal has already found a screwdriver. By supper, cabin 4 has a circuit of its own. He labels it in capital letters.'
    ], function () {
      var mins = AIR.minutes(), hn = ER.hintsUsed();
      $('#d-time').textContent = 'You had seven hours of air. You needed ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
      $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' new words.';
      $('#d-hints').textContent = hn ? 'You asked for ' + hn + (hn === 1 ? ' hint.' : ' hints.') : 'You did not ask for a single hint.';
      $('#done').classList.add('on'); ER.sfx.ok();
    });
  }
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* the incident report: the one part nobody can open for you */
  $('#b-report').addEventListener('click', function () {
    var saved = ER.flag('report') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>Keeling Station</h4><h3>Incident report &middot; air alarm, 02:10</h3>' +
      '<label for="r1">1. What happened on the station between 22:41 and 02:10? Write it in order, and give the times.</label><textarea id="r1"></textarea>' +
      '<label for="r2">2. There was never a hole in the hull. How did you know? Use the word &ldquo;if&rdquo;.</label><textarea id="r2"></textarea>' +
      '<label>3. Rule 14 says: no private heaters in the cabins. Should the rule stay?</label><div class="yn"><label><input type="radio" name="yn" value="yes"> Yes</label><label><input type="radio" name="yn" value="no"> No</label></div>' +
      '<textarea id="r3" placeholder="Because&hellip;"></textarea>' +
      '<label for="r4">Signed</label><input type="text" id="r4" maxlength="60">' +
      '<div class="count"></div><div class="foot"><span>Saved in this browser as you type.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > label');
    ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { box.querySelector('#' + k).value = saved[k] || ''; });
    if (saved.yn) { var r = box.querySelector('input[value=' + saved.yn + ']'); if (r) r.checked = true; }
    function keep() {
      var o = {}, n = 0, c = box.querySelector('input[name=yn]:checked');
      ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { o[k] = box.querySelector('#' + k).value; });
      o.yn = c ? c.value : '';
      ['r1', 'r2', 'r3'].forEach(function (k) { n += (o[k].match(/[A-Za-z’']+/g) || []).length; });
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('report', o);
    }
    box.addEventListener('input', keep); box.addEventListener('change', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
