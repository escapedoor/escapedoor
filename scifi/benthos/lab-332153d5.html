<style>

  #faulk{animation:fk 9s steps(1) infinite}
  @keyframes fk{0%,80%{transform:translateX(0)}84%{transform:translateX(7px)}92%{transform:translateX(0)}}
  .tube{animation:tube 4.7s steps(2) infinite}
  @keyframes tube{50%{opacity:.9}}
  #armS.next{animation:bnudge 1.8s ease-in-out infinite}
  /* Dr Halvorsen's pad: thick pen on yellow paper */
  .doc.pad{width:min(680px,94vw);padding:22px 30px 20px;background:#ffe98a repeating-linear-gradient(transparent 0 29px,rgba(60,90,160,.2) 29px 30px);color:#1b2233;font-family:'Caveat',cursive;font-weight:700;
    font-size:23.5px;line-height:30px;border-top:22px solid #a8402c;transform:rotate(-.6deg)}
  .doc.pad h4{margin:0;font-size:30px;font-weight:700;line-height:30px;text-decoration:underline}
  .doc.pad h5{margin:0 0 30px;font-size:21px;font-weight:700;line-height:30px;color:#3a4f8a}
  .doc.pad p{display:grid;grid-template-columns:30px minmax(0,1fr);margin:0 0 30px}
  .doc.pad p:last-child{margin-bottom:0}
  .doc.pad.mini{width:100%;max-height:none;padding:8px 14px 8px;font-size:19.5px;line-height:23px;border-top-width:10px;background:#ffe98a;box-shadow:none;transform:none}
  .doc.pad.mini p{margin:0;grid-template-columns:24px minmax(0,1fr)}

  /* the Arm's desk */
  .ad{display:grid;grid-template-columns:minmax(0,600px) 440px;gap:16px;width:min(1080px,96vw);align-items:start}
  .ad-bench{background:#0a1c22;border:1px solid #2a5a66;border-radius:8px;padding:6px;margin-bottom:8px}
  .ad-bench svg{display:block;width:100%;height:auto}
  .ad-side h6{margin:0 0 6px;font-family:'Saira Stencil One',sans-serif;font-weight:normal;font-size:19px;letter-spacing:.06em;color:#ff9a5a}
  .ad-side h6 span{float:right;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.1em;color:#9fc3cf;margin-top:4px}
  .ad-side .ob{margin-top:8px}
  .ad .ob-tray{gap:5px;padding:7px}
  .ad .ob-tile{padding:5px 11px 4px}
  .ad .pmsg{min-height:74px;margin-top:8px;font-size:16.5px}
  .ad-rules{grid-column:1/3;-webkit-column-count:3;column-count:3;-webkit-column-gap:18px;column-gap:18px;padding:7px 14px 3px;background:#f5f0e2;color:#20242b;border-left:10px solid #f2c230;border-radius:3px;
    font-family:'Outfit',sans-serif;font-weight:300;font-size:13.5px;line-height:1.28}
  .ad-rules p{margin:0 0 5px;-webkit-column-break-inside:avoid;break-inside:avoid}
  .ad-rules b{font-family:'Saira Stencil One',sans-serif;font-weight:normal;color:#a8402c;margin-right:6px}
  .ad-rules u{text-decoration:none;font-family:'Share Tech Mono',monospace;font-size:.95em;background:#16130a;color:#f2c230;padding:0 4px;border-radius:2px}
  .bT{font-family:'Share Tech Mono',monospace;font-size:11px;fill:#9fc3cf;text-anchor:middle}
  .mv{transition:transform .55s ease-in-out}
  @media (max-width:1000px){.ad{grid-template-columns:1fr}.ad-rules{grid-column:1;-webkit-column-count:1;column-count:1}}
</style>

      s += '<g id="t' + (i + 1) + '" class="hot"><rect x="' + (x + 40) + '" y="300" width="110" height="12" rx="6" fill="#f4fffe" class="tube"/><rect x="' + x + '" y="360" width="190" height="200" fill="url(#tankG)"/>' +
        '<rect x="' + x + '" y="520" width="190" height="40" fill="#6d5a40" opacity=".7"/>';

        var px = x + d, h = 96 + k * 12;
        return '<g class="sway"><path d="M' + px + ' 540v' + (-h) + '" stroke="#ffd0b0" stroke-width="5" fill="none"/><path d="M' + px + ' ' + (540 - h) + 'q-26 14-22 54q12-26 22-28zM' + px + ' ' + (540 - h) + 'q26 14 22 54q-12-26-22-28zM' + px + ' ' + (560 - h) + 'q-18 18-14 44q8-20 14-22zM' + px + ' ' + (560 - h) + 'q18 18 14 44q-8-20-14-22z"/></g>';
      }).join('') + '</g><rect x="' + (x + 118) + '" y="372" width="60" height="26" rx="3" fill="#0c1218"/><text x="' + (x + 148) + '" y="391" text-anchor="middle" class="mono" font-size="16" fill="#ffb84a">9°C</text>';
      if (i === 2) s += '<g id="faulk"><ellipse cx="' + (x + 96) + '" cy="512" rx="20" ry="11" fill="#d9532c"/><path d="M' + (x + 110) + ' 506l44-22l10 6l-8 8M' + (x + 110) + ' 516l46 6l8-8l-10-6" stroke="#d9532c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="' + (x + 108) + '" cy="504" r="3" fill="#16130a"/><circle cx="' + (x + 112) + '" cy="512" r="3" fill="#16130a"/><path d="M' + (x + 84) + ' 520l-10 12M' + (x + 94) + ' 522l-6 12M' + (x + 76) + ' 512l-14 6" stroke="#b8401c" stroke-width="3" stroke-linecap="round"/></g>' +
        '<rect x="' + (x + 30) + '" y="572" width="130" height="14" fill="#f4f6f1"/><text x="' + (x + 95) + '" y="583" text-anchor="middle" class="mono" font-size="11" fill="#18222a">MR FAULKNER</text>';
      if (i === 3) s += '<path d="M' + (x + 150) + ' 300V352q0 10 10 10h6v160" stroke="#e9eef0" stroke-width="7" fill="none" stroke-linecap="round"/><g class="bub" fill="#f4fffe">' + [0, 1, 2, 3].map(function (k) {
        return '<circle cx="' + (x + 160 + (k % 2) * 8) + '" cy="520" r="' + (3 + k % 3) + '" style="animation-delay:-' + (k * 0.85) + 's"/>'; }).join('') + '</g><rect x="' + (x + 12) + '" y="372" width="60" height="26" rx="3" fill="#0c1218"/><text x="' + (x + 42) + '" y="391" text-anchor="middle" class="mono" font-size="16" fill="#7dffb0">6°C</text>';
      s += '<rect x="' + x + '" y="360" width="190" height="200" fill="none" stroke="#e9eef0" stroke-width="4" opacity=".8"/><path d="M' + (x + 12) + ' 372v170" stroke="#fff" stroke-width="5" opacity=".25"/>' +
        '<text x="' + (x + 95) + '" y="350" text-anchor="middle" class="st" font-size="22" fill="#3f555c">' + (i + 1) + '</text></g>';
    }
    $('#tanks').innerHTML = s;
  })();

  ER.init({
    theme: 'scifi', story: 'benthos', storyTitle: 'Word for Word', id: 'lab', no: 'II', title: 'The Wet Lab',
    go: 'Go in',
    intro: [
      'Limpet is 420 metres away, because its echo took 0.56 seconds to go there <i>and back</i>. It is 260 metres down, because its gauge reads 27: one atmosphere for the air, and twenty-six for the water. Dr Halvorsen&rsquo;s gauge said 27 as well, in a line of the log that also said &ldquo;at Marker 7&rdquo;: and Marker 7 stands at 232 metres. The number was right. The place was wrong. They are together, over the Lip.',
      'Nobody knows why Limpet says CANNOT. And Kovacs will not let you send it one word until you have practised.',
      'Dr Halvorsen&rsquo;s laboratory is one deck down: cold, bright, and full of things that were on the sea bed last week. Over the bench hangs the Arm. Kovacs built it out of Limpet&rsquo;s spare parts, and it reads an order exactly as Limpet does.'
    ],
    exit: {"next":"pumps","w":{"caf88ad1":"c1ec5b41","d115c820":"ab153d73"}}, tags: {"t1":["9bffa853"],"t2":["4f9c5596"],"t3":["439ab707","1325ba9f"]},
    sound: ['orbit', { root: 52, bpm: 50, drop: ['mel'], lead: 'keys', beds: [['drips', 0.5], ['hum', 0.3]] }],      /* a cold bright room with water running in it */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('l-file') || null;
  var prog = ER.flag('l-st') || { n: 0, seq: [] };

  var ROUND = [
    'The brittle star is muddy. Lift it out of its tray, rinse it under the tap and put it back. Rinse the STAR. The tray is full of clean sea water, and I want that left alone.',
    'It is too warm at this end of the bench tonight. Move the three sea pens AND the brittle star into the cold tank. All four of them. Mr Faulkner stays where he is: he bites.',
    'Lids on for the night: but NOT on the cold tank, which is tank 4. Its air pipe goes in over the side, and a lid would squash it flat. And lamps off over every tank except Mr Faulkner&rsquo;s, which is tank 3. He sulks in the dark.'
  ];
  var ROUNDDOC = '<h4>The evening round</h4><h5>If I am not back by nine, somebody do this. The Arm will do the lifting. Mind what you say to it. I.H.</h5>' +
    ROUND.map(function (t, i) { return '<p><b>' + (i + 1) + '</b><span>' + t + '</span></p>'; }).join('');
  var ARMLOG = '<h4>THE ARM · ORDER LOG · TUESDAY</h4>' +
    '<p class="o">14:02 ORDER (I.H.): TAKE THE LID OFF THE JAR AND PUT IT IN THE SINK.</p><p>IT = THE JAR (THE LAST THING NAMED).</p><p>DONE. THE JAR IS IN THE SINK. THE LID IS IN MY CLAW.</p>' +
    '<p class="o">14:03 ORDER (I.H.): NO! THE LID!</p><p class="x">ORDER NOT CLEAR.</p>' +
    '<p class="o">14:04 ORDER (I.H.): PUT THE LID IN THE SINK AND TAKE IT OUT.</p><p>THE LID IS IN THE SINK. IT = THE SINK (THE LAST THING NAMED).</p><p class="x">CANNOT. THE SINK IS FIXED TO THE WALL.</p>' +
    '<p class="pen">14:06 I shall do it myself. It did exactly what I said, three times running. I have never been so annoyed by anything so obedient. I.H.</p>';
  var NOTES = '<h4>I. Halvorsen: field notes</h4>' +
    '<p>Mon. Marker 7 again. The best sea pens are right on the Lip, where the current brings them their dinner. Naturally. Everything interesting lives on the edge of something.</p>' +
    '<p>The Lip itself is all soft mud. It slides if you look at it. Told V. that I want a rail out there. V. says that a rail costs money. So does a biologist.</p>' +
    '<p>Tue. Taking the Lemon out at half past three. Taking the big yellow pad, as always: no screen has ever helped me to think. Taking one of the diver handsets too, in case the telephone sulks. A handset reaches thirty metres. That is thirty metres more than nothing.</p>';
  var RULES = [
    ['1', 'It does orders one at a time, in the order you give them. It never looks ahead.'],
    ['2', 'It does what the words say. It does not guess what you meant.'],
    ['3', '<u>IT</u> and <u>THAT ONE</u> mean the last thing you named. Not the most important thing. The last.'],
    ['4', '<u>THEM</u> means the last things you named together: a plural, or things joined with AND.'],
    ['6', '<u>EVERY</u> and <u>EACH</u>: all of them, one after another. <u>ALL BUT ONE</u>: it works along the row and stops when one is left, so the one it leaves is the last. <u>BOTH</u> needs exactly two things.'],
    ['8', 'One ping: DONE. Two pings: CANNOT, and it stops there. Three pings: ORDER NOT CLEAR.']
  ];
  var MANUAL = '<h4>Limpet (ROV-2): how it reads an order</h4><h5>V. Kovacs · rev. 9 · the copy that hangs beside the Arm</h5>' +
    '<p><b>1</b><span>It does orders one at a time, in the order you give them. It never looks ahead to see what you are going to say next.</span></p>' +
    '<p><b>2</b><span>It does what the words say. It does not guess what you meant. <span class="pen">It really doesn&rsquo;t. T.D.</span></span></p>' +
    '<p><b>3</b><span><u>IT</u> and <u>THAT ONE</u> mean the last thing you named. Not the most important thing. The last.</span></p>' +
    '<p><b>4</b><span><u>THEM</u> means the last things you named together: a plural (&ldquo;the tanks&rdquo;), or things joined with AND.</span></p>' +
    '<p><b>5</b><span><u>UNTIL</u>: it goes on doing the thing, and stops at the moment the rest comes true. <u>WHILE</u>: it does the thing only for as long as the rest is true; if the rest is not true now, it does nothing. <u>AS SOON AS</u>: it waits, and acts at the moment the rest comes true. If that never happens, it waits for ever.</span></p>' +
    '<p><b>6</b><span><u>EVERY</u> and <u>EACH</u>: all of them, one after another. <u>ALL BUT ONE</u>: it works along the row and stops when one is left, so the one it leaves is the last. <u>BOTH</u> needs exactly two things.</span></p>' +
    '<p><b>7</b><span><u>IF</u>: it looks once, and acts if the thing is true at that moment. <u>UNLESS</u> is the other way round: it acts if the thing is not true.</span></p>' +
    '<p><b>8</b><span>One ping: DONE. Two pings: CANNOT, and it stops there and waits for new orders. Three pings: ORDER NOT CLEAR.</span></p>' +
    '<p><b>9</b><span><u>HOLD</u>. If a person tells it to hold a thing &ldquo;until I tell you&rdquo;, then only that person can tell it to let go. Nobody else&rsquo;s order can end it: not mine, not the Chief&rsquo;s. I built that in after the business with the anchor. <span class="pen">Ask him about the anchor. T.D.</span></span></p>';

  /* What each strip says, and what it does. A strip is a list of steps: ['name', thing] only names a thing; any other
     step is something the Arm does to a thing, and 'it' / 'them' are worked out when the Arm gets there. */
  var TASKS = [
    { slots: 3, tiles: [
      { id: 'd', t: 'Put it back.', ops: [['back', 'it']] },

    }
    task();
    msg(prog.n ? 'The Arm is waiting for the next job on the card.' : 'Strips of orders in the tray; slots above them. The Arm will do them from the top down, and the screen on the left will show what it made of every word.');
    BEN.learn(['order', 'obedient']);
    ER.addClue('manual', 'Limpet: how it reads an order', MANUAL, 'manual', 'Kovacs’s binder', true);      /* the rules are needed from here on: they go into the notebook even if the binder was never opened */
    ER.open('ov-lock', box, function () { if (stop) stop(); });
  }
  function finishLab() {
    var file = ER.exitOk([prog.seq.join('|')]);
    if (!file) { ER.say('Something is wrong with this lock: tell your teacher.'); return; }
    nextFile = file; ER.flag('l-file', file); BEN.done('lab'); busy = true;
    BEN.mine('reader', 'How the Arm reads', '<p>IT = the LAST thing I named. (&ldquo;Lift the star out of the tray&rdquo;: last = the tray!)</p><p>THEM = things named TOGETHER, with AND.</p>' +
      '<p>ALL BUT ONE leaves the last. If I mean another one, I must say which.</p><p>It does the words. Not what I meant.</p>', true);
    ER.closeAll(); BEN.solved(); paint(); after();
  }
  function after() {
    ER.narrate([
      'The Arm folds itself away under its rail. It has done three jobs in a row without putting anything in the sink, which Dr Halvorsen would call a record.',
      'On the wall the speaker clicks. &ldquo;Kovacs. I watched that on the camera. All right. You can talk to it.&rdquo; A pause. &ldquo;But talking will not be enough. I have been thinking about that line. If the winch could not wind Limpet in at 19:40, then whatever it is caught on is heavy.&rdquo;',
      '&ldquo;The Lemon,&rdquo; says the Chief&rsquo;s voice, behind his.',
      '&ldquo;The Lemon. So we need the winch, and the winch needs the big pump, and at ten past eleven last night I told the big pump one thing and it did another. Come down to the pump room. Bring your reading with you.&rdquo;'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
