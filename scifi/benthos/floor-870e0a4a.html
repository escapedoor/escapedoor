  .csnow circle{animation:csnow 16s steps(5) infinite}
  @keyframes csnow{to{transform:translate(-50px,200px)}}
  #glowPen{animation:gp 3.8s steps(4) infinite}
  @keyframes gp{50%{opacity:.35}}
  #lemonG{transition:transform 1.3s ease-in-out}
  #lemonG.lift{transform:translateY(-26px)}
  #lemonG.cork{transform:translateY(-190px)}
  #lemonG.slid{transform:translate(46px,32px)}
  #cloud{opacity:0;transition:opacity .8s}
  #cloud.on{opacity:.75}
  #bubbles{display:none}#bubbles.on{display:inline}
  #bubbles circle{animation:bb 1.1s linear infinite}
  @keyframes bb{from{transform:translateY(0);opacity:.9}to{transform:translateY(-120px);opacity:0}}
  #world{transition:transform 9s linear}
  #scene.tow #world{transform:translate(2300px,506px)}
  #scene.tow #cloud{opacity:0}
  #scene.tow #lemonG{transform:translateY(-26px)}
  #labL{opacity:0;transition:opacity 3s 6s;pointer-events:none}
  #mound{transition:opacity 2.5s}
  #scene.tow #mound{opacity:0}
  #scene.tow #labL{opacity:1}
  #scene.quick *{transition-duration:.01s!important;transition-delay:0s!important}
  #desk.next #deskLamp{animation:bnudge 1.6s ease-in-out infinite}
  .hT{font-family:'Share Tech Mono',monospace;font-size:19px;fill:#bff5dc}
  .gN{font-family:'Caveat',cursive;font-weight:700;font-size:19px;fill:#1b2233;text-anchor:middle}

  .od .rl{height:118px}
  .od-pg{min-height:30px;margin-top:6px}
  .od .pmsg{min-height:92px;font-size:16px;margin-top:2px}
  .od-side h6{margin:0 0 8px;font-family:'Saira Stencil One',sans-serif;font-weight:normal;font-size:19px;letter-spacing:.06em;color:#9ff0c8}
  .od-side h6 span{float:right;font-family:'Share Tech Mono',monospace;font-size:12.5px;letter-spacing:.08em;color:#8fb4a8;margin-top:5px}
  .od .ob-tile{font-size:14.5px;padding:5px 10px 4px}
  .od .ob-slot{min-height:38px}
  .od-rules{grid-column:1/3;-webkit-column-count:2;column-count:2;-webkit-column-gap:18px;column-gap:18px;padding:7px 14px 3px;background:#f5f0e2;color:#20242b;border-left:10px solid #f2c230;border-radius:3px;
    font-family:'Outfit',sans-serif;font-weight:300;font-size:13.5px;line-height:1.28}
  .od-rules p{margin:0 0 4px;-webkit-column-break-inside:avoid;break-inside:avoid}

  .od-rules u{text-decoration:none;font-family:'Share Tech Mono',monospace;font-size:.95em;background:#16130a;color:#f2c230;padding:0 4px;border-radius:2px}
  @media (max-width:1000px){.od{grid-template-columns:1fr}.od-rules{grid-column:1;-webkit-column-count:1;column-count:1}}
</style>

<script>
(function () {
  var $ = ER.$, sc = $('#scene'), busy = false, nextFile = null;

  (function () {
    var s = '', i, k, seed = 23;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (i = 0; i < 46; i++) s += '<circle cx="' + Math.round(140 + rnd() * 1340) + '" cy="' + Math.round(70 + rnd() * 460) + '" r="' + (1 + rnd() * 2.4).toFixed(1) + '" opacity="' + (0.2 + rnd() * 0.5).toFixed(2) + '" style="animation-delay:-' + (rnd() * 16).toFixed(1) + 's"/>';
    $('#csnow').innerHTML = s; s = '';
    for (i = 0; i < 3; i++) for (k = 0; k < 12; k++) s += '<rect x="' + (740 + k * 27) + '" y="' + (806 + i * 24) + '" width="20" height="17" rx="2"/>';
    $('#deskKeys').innerHTML = s;
  })();

  ER.init({
    theme: 'scifi', story: 'benthos', storyTitle: 'Word for Word', id: 'floor', no: 'IV', title: 'The Sea Floor',
    go: 'Sit down at the order desk',
    intro: [
      'The gauge reads sixty because five words are now the right ones. The sea valve opens <i>until</i> the tank is full. The pump starts <i>after</i> the valve is shut. The Board stops <i>the pump</i> (&ldquo;it&rdquo; would have been the valve) <i>as soon as</i> the gauge reads 60. And the winch valve opens <i>if</i> the gauge reads 60. Last night one of those words was &ldquo;while&rdquo;.',
      'The winch can pull now. But the line stops dead at 420 metres, and nobody knows what is on the end of it besides Limpet.',
      'It is a quarter past four. The order desk is one grey screen and a small box that turns words into sound. Radio does not carry through sea water: every word you send will go out through the sea as sound, and Limpet will do every word of it.'
    ],
    exit: {"next":"dock","w":{"1ac4547e":"695e6ca0"}}, tags: {"order":["3a48162f"]},
    sound: ['orbit', { root: 40, bpm: 42, mood: 'tense', drop: ['mel', 'ost'], lead: 'keys', beds: [['static', 0.5]] }],      /* pings are sent and answered here: no tune, no pulse, only the long notes and the hiss of the link */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('f-file') || null;
  var W = { lamp: !!ER.flag('f-lamp'), pic: ER.flag('f-pic') ? 'lit' : 'none', hook: 'tail', tight: false, lemon: '', note: 0 };
  var GLASS = [['DON’T', 'RESET IT'], ['WHERE IS', 'THE HOOK?'], ['DO THAT AGAIN', '& I WALK HOME'], ['I SAID', 'UNTIL I LIFT'], ['ABOUT', 'TIME']];

  var NOTES = '<h4>PRESSED AGAINST THE WINDOW OF THE LEMON, ONE PAGE AFTER ANOTHER</h4>' +
    '<p>DO NOT RESET IT. I slid. I told it: HOLD ON TO MY RING AND DON&rsquo;T LET GO UNTIL I TELL YOU. It has not let go. I.H.</p>' +
    '<p>Telephone dead. Handset dead. I cannot tell it anything now. YOU can. Do not tow me by its claw: put the HOOK from its line on my RING.</p>' +
    '<p>I am sunk to the window in mud, and my tanks are full of water. No air left to blow them: I used it trying to climb. Limpet has air. Get the line TIGHT first, or I slide again. Then blow air into my tanks UNTIL I LIFT, and stop. Too much and I go up like a cork. (I have finished the crossword. Hurry.)</p>';
  var RULES = [
    ['1', 'It does orders one at a time, in the order you give them. It never looks ahead.'],
    ['3', '<u>IT</u> means the last thing you named. Not the most important thing. The last.'],
    ['5', '<u>UNTIL</u>: it goes on, and stops at the moment the rest comes true. <u>WHILE</u>: only for as long as the rest is true; if it is not true now, it does nothing.'],
    ['8', 'By sound it can only ping. One: DONE. Two: CANNOT, and it stops there. Three: ORDER NOT CLEAR.']
  ];
  var T0 = [
    { id: 'p', t: 'Send one picture.' }, { id: 'h', t: 'Come home.' }, { id: 'l', t: 'Switch on your lamp.' }
  ];
  var T1 = [
    { id: 'g', t: 'Blow air into the tanks while the Lemon lifts.' },
    { id: 'a', t: 'Unclip the hook from your tail.' },
    { id: 'd', t: 'Wait until the line is tight.' },
    { id: 'h', t: 'Blow air into the tanks until they are empty.' },
    { id: 'c', t: 'Clip it to the ring.' },
    { id: 'i', t: 'Let go and come home.' },
    { id: 'b', t: 'From your tail, unclip the hook.' },
    { id: 'f', t: 'Blow air into the tanks until the Lemon lifts.' },
    { id: 'e', t: 'Wait while the line is tight.' }
  ];

  function phase() { return nextFile ? 3 : !ER.flag('f-pic') ? 0 : !ER.flag('f-notes') ? 1 : 2; }
  function hints() {
    return [['pic', [
      'Limpet will send a picture if you order one. Kovacs ordered one at six o&rsquo;clock, and it came out black. Why would a picture be black, 260 metres down?',
      'Rule 1: it does orders in the order you give them, and it never looks ahead. There are two things for it to do, and one of them has to come first.',
      'A camera in the dark takes a picture of the dark. Light first, and then the picture: put the two strips into the slots in that order.'
    ]], ['notes', [
      'There is somebody in the window of the Lemon, and she is holding something against the glass. Click on the window.'
    ]], ['tow', [
      'Dr Halvorsen has told you three things that must happen, and in which order: the hook on her ring, the line tight, and then air until she lifts. There are four slots, because the hook takes two orders.',
      'Watch &ldquo;it&rdquo; again: in &ldquo;Clip it to the ring&rdquo;, &ldquo;it&rdquo; is the last thing named in the order before. And compare the small words: &ldquo;wait until the line is tight&rdquo; waits; &ldquo;wait while the line is tight&rdquo; does not, because the line is not tight yet.',
      'First the strip that names the hook last, and then &ldquo;Clip it to the ring.&rdquo; Next, the strip that really waits for the line. Last, the air: it must stop at the moment when the Lemon lifts. Not when the tanks are empty; and not &ldquo;while&rdquo; she lifts, because she is not lifting yet.'
    ]], ['go', ['They are on their way up the slope. The dock is the button at the bottom of the screen.']]][phase()];
  }
  function isBusy() { return busy; }
  function drawW() {
    var hk = { tail: [300, 668], arm: [384, 252], ring: [896, 262] }[W.hook], g = GLASS[W.note];
    sc.setAttribute('data-pic', W.pic);
    /* said on the parts themselves as well as in the style sheet: the small copy of the picture on the order desk is a
       <use> of this drawing, and not every browser lets a rule that begins at #scene reach into a copy */
    $('#noPic').style.display = W.pic === 'none' ? '' : 'none';
    $('#picDark').style.display = W.pic === 'none' ? 'none' : '';
    $('#picLit').style.display = W.pic === 'lit' ? '' : 'none';
    $('#hookG').setAttribute('transform', 'translate(' + hk[0] + ' ' + hk[1] + ')');
    $('#lineP').setAttribute('d', W.hook === 'ring' ? (W.tight ? 'M896 236L120 150' : 'M896 236Q600 420 120 250') : W.hook === 'arm' ? 'M384 226Q300 420 120 330' : 'M300 642Q220 700 120 660');
    $('#lemonG').setAttribute('class', W.lemon);
    $('#cloud').setAttribute('class', W.lemon ? 'on' : '');
    $('#gn1').textContent = g[0]; $('#gn2').textContent = g[1];
    $('#mugOn').style.display = ER.flag('f-pic') ? '' : 'none';
  }
  function paint() {
    drawW();
    sc.classList.toggle('tow', !!nextFile);
    $('#desk').setAttribute('class', 'hot' + (phase() === 0 || phase() === 2 ? ' next' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(phase(), 3);
  }
  function begin() {
    if (nextFile) { sc.classList.add('quick'); W.pic = 'lit'; W.hook = 'ring'; W.tight = true; W.note = 4; setTimeout(function () { sc.classList.remove('quick'); }, 400); }
    paint();
    if (nextFile) { ER.say('The picture from Limpet: mud going by, the lights of the dock, and a claw that is still shut.'); return; }
    if (ER.flag('f-seen')) { ER.say(phase() ? 'The order desk, and the picture from Limpet.' : 'The order desk. The screen says NO PICTURE.'); return; }
    busy = true; ER.flag('f-seen', 1);
    ER.narrate([
      'The order desk. A grey screen with NO PICTURE on it, a small box with a green lamp, and two people standing behind your chair.',
      '&ldquo;It sends a picture only when it is told to,&rdquo; says Kovacs. &ldquo;By sound, one picture takes the whole link for a minute. I asked it for one at six o&rsquo;clock.&rdquo; &ldquo;And?&rdquo; says the Chief. &ldquo;And it sent one. Black. From top to bottom.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- what is in the picture ---------- */
  $('#screenHit').addEventListener('click', function () {
    if (busy) return;
    if (W.pic === 'lit') return;
    ER.say(W.pic === 'dark' ? 'A picture, received in full, and black from top to bottom. It is a very good picture of what the sea looks like at 260 metres with the lamp off.' : 'NO PICTURE. Limpet sends one only when it is told to. The box on the desk, with the green lamp, is where orders go out.');
  });
  function lit(sel, fn) { ER.$$(sel).forEach(function (n) { n.addEventListener('click', function (e) { if (!busy && W.pic === 'lit') fn(e); }); }); }
  lit('#cwin', function () {
    ER.read({ html: NOTES, cls: 'glass', clue: { id: 'glass', title: 'Dr Halvorsen’s pages', kind: 'Held against the window' }, done: function () {
      BEN.learn(['hook', 'ring', 'cork']);
      if (ER.flag('f-notes')) return;
      ER.flag('f-notes', 1); busy = true; paint();
      ER.narrate([
        'Nobody says anything. The Chief looks at the red switch under its strip of yellow tape, and then at Kovacs. Kovacs looks at the floor.',
        '&ldquo;If I had pressed that at midnight,&rdquo; he says. &ldquo;You did not,&rdquo; says the Chief. &ldquo;Forty times I told it to come home. Forty times it told me CANNOT. It was not refusing me. It was obeying <i>her</i>.&rdquo;',
        '&ldquo;Rule 9,&rdquo; says the Chief. &ldquo;Your rule. Now: she has told us what to do, and she cannot tell Limpet. So we shall. Word for word.&rdquo; She puts the desk in front of you again.'
      ], function () { busy = false; paint(); });
    } });
  });
  lit('#claw', function (e) { ER.wordAt(e.clientX, e.clientY, 'claw'); ER.say('Limpet&rsquo;s own claw, shut on the lifting ring. The yellow numbers in the corner say: CLAW: SHUT FOR 11 h 21 min. That is since five to five yesterday afternoon.'); });
  lit('#lring', function (e) { ER.wordAt(e.clientX, e.clientY, 'ring'); ER.say('The lifting ring. It stands in the middle of the Lemon&rsquo;s hatch, and the hatch is the only way in or out of her.'); });
  lit('#hookG', function (e) { ER.wordAt(e.clientX, e.clientY, 'hook'); ER.say('The hook on the end of the line from the dock winch. It is clipped to a bar on Limpet&rsquo;s own tail: that is how the winch brings Limpet home when its battery is flat. At 19:40 the winch pulled on it, and Limpet did not let go.'); });
  lit('#blowC', function () { ER.say('A red cap on the Lemon&rsquo;s side, with AIR painted over it: the place where air can be blown into her tanks from outside. Limpet carries an air hose for exactly this.'); });
  lit('#cpens', function (e) { ER.wordAt(e.clientX, e.clientY, 'sea pen'); ER.say('Sea pens, growing on the very edge. One of them is glowing green, where the water from Limpet&rsquo;s propellers has touched it.'); });
  lit('#mud', function (e) { ER.wordAt(e.clientX, e.clientY, 'mud'); ER.say('Soft grey mud, at the top of a slope that goes down further than anybody has measured. The Lemon has cut a long scar in it, from somewhere up near Marker 7.'); });
  lit('#hud', function () { ER.say('DEPTH 260 m. 27.0 atmospheres. BATTERY 31%. Limpet has been holding on for more than eleven hours, on one charge.'); });
  $('#reset2').addEventListener('click', function () {
    if (busy) return;
    ER.say(ER.flag('f-pic') ? 'LIMPET: MASTER RESET. Nobody is looking at that switch any more. Kovacs has put his mug on top of it.'
      : 'LIMPET: MASTER RESET. Kovacs&rsquo;s hand is already on the cover. The Chief&rsquo;s hand comes down on top of his. &ldquo;Not until we can see,&rdquo; she says.');
  });
  $('#desk').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The order desk. The last list you sent is still on it: four orders, four pings.'); return; }
    if (phase() === 1) { ER.say('Before you send it another word, look at the picture. There is somebody in that window, and she is holding something up.'); return; }
    openDesk();
  });

  /* ---------- the order desk ---------- */
  function openDesk() {
    var box = ER.el('div', 'od'), first = phase() === 0, running = false, stop = null, bld, s;
    s = '<div><div class="od-cam"><svg viewBox="120 64 1360 652"><use href="#cam"/></svg></div><div id="od-log"></div><div class="od-pg" id="od-pg"></div><p class="pmsg"></p></div>' +
      '<div class="od-side"><h6>Order desk<span>BY SOUND · 420 m</span></h6><div id="od-ob"></div></div>' +
      '<div class="od-rules">' + RULES.map(function (r) { return '<p><b>' + r[0] + '</b>' + r[1] + '</p>'; }).join('') + '</div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg'), log = BEN.readout(box.querySelector('#od-log')), pg = box.querySelector('#od-pg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function ping(n, label) { BEN.pings(pg, n, n > 1, label); log.line(label, n > 1 ? 'x' : 'k'); }
    bld = BEN.builder(box.querySelector('#od-ob'), first ? { tiles: T0, slots: 2, all: false, send: 'Send by sound', note: 'ONE OR TWO ORDERS, TOP ONE FIRST', onSend: run0 }
      : { tiles: T1, slots: 4, send: 'Send by sound', note: '4 ORDERS, TOP ONE FIRST', onSend: run1, onShort: function () { msg('&ldquo;Four orders,&rdquo; says Kovacs. &ldquo;She has asked for a good deal. Fill every slot.&rdquo;'); } });
    function end(fn, ms) { stop = BEN.seq([[ms || 1200, function () { bld.now(0); running = false; bld.busy(false); if (fn) fn(); }]]); }
    /* one order, then the next: but a list stops at the first order that cannot be done (each() returns false) */
    function chain(ids, each, fin) {
      var k = 0;
      function next() {
        var go = each(ids[k], k); k++;
        stop = BEN.seq([[go === false ? 2000 : 2500, go === false || k >= ids.length ? fin : next]]);
      }
      stop = BEN.seq([[500, next]]);
    }

    /* the first list: a lamp, and a picture */
    function run0(ids) {
      if (running) return;
      var halted = false, got = '';
      running = true; bld.busy(true); log.clear(); pg.innerHTML = ''; msg('');
      chain(ids, function (id, k) {
        var t = T0.filter(function (x) { return x.id === id; })[0];
        bld.now(k + 1); log.line('ORDER ' + (k + 1) + ': ' + t.t.toUpperCase(), 'o');
        if (id === 'h') { halted = true; ping(2, 'TWO PINGS: CANNOT'); return false; }
        if (id === 'l') { W.lamp = true; ER.flag('f-lamp', 1); ping(1, 'ONE PING: DONE'); return true; }
        got = W.lamp ? 'lit' : 'dark'; if (got === 'dark' && W.pic !== 'lit') { W.pic = 'dark'; drawW(); }
        ping(1, 'ONE PING: DONE. PICTURE COMING.');
        return true;
      }, function () {
        if (got === 'lit') { ER.flag('f-pic', 1); stop = BEN.seq([[600, function () { ER.closeAll(); reveal(); }]]); return; }
        BEN.bump('slips'); BEN.sfx.hm();
        msg(halted ? '&ldquo;Two pings,&rdquo; says Kovacs. &ldquo;The forty-first time. And when it cannot do an order, it stops there: whatever came after that in your list, it never read.&rdquo;'
          : got === 'dark' ? '&ldquo;That,&rdquo; says Kovacs, &ldquo;is the second perfect picture of the dark that I have had tonight.&rdquo; The Chief says nothing. &ldquo;It took the picture when you told it to,&rdquo; she says at last. &ldquo;What had you told it <i>before</i> that?&rdquo;'
          : 'One ping. Somewhere out there a lamp has come on. You cannot see it, because nobody has asked for a picture.');
        end();
      });
    }

    /* the second list: the hook, the line, the air */
    function back() {
      W.hook = 'tail'; W.tight = false; W.lemon = ''; drawW(); $('#bubbles').setAttribute('class', '');
      log.line('V.K. SENDS: PUT IT ALL BACK. ONE PING.', 'dim');
    }
    function run1(ids) {
      if (running) return;
      var last = null, why = '', seq = ids.join('>');
      running = true; bld.busy(true); log.clear(); pg.innerHTML = ''; msg(''); W.note = 0; drawW();
      chain(ids, function (id, k) {
        var t = T1.filter(function (x) { return x.id === id; })[0];
        bld.now(k + 1); log.line('ORDER ' + (k + 1) + ': ' + t.t.toUpperCase(), 'o');
        if (id === 'a' || id === 'b') {
          if (W.hook !== 'tail') { why = 'nohook'; ping(2, 'TWO PINGS: CANNOT'); return false; }
          W.hook = 'arm'; last = id === 'a' ? 'tail' : 'hook'; drawW(); BEN.sfx.clip(); ping(1, 'ONE PING: DONE');
        } else if (id === 'c') {
          if (!last) { why = 'noit'; ping(3, 'THREE PINGS: ORDER NOT CLEAR'); return false; }
          if (last === 'tail') { why = 'tail'; ping(2, 'TWO PINGS: CANNOT'); return false; }
          W.hook = 'ring'; drawW(); BEN.sfx.clip(); ping(1, 'ONE PING: DONE');
        } else if (id === 'd') {
          if (W.hook !== 'ring') { why = 'wait'; log.line('NO PING. IT IS WAITING.', 'x'); return false; }
          BEN.sfx.winch(1.8); W.tight = true; drawW(); ping(1, 'ONE PING: DONE. THE LINE IS TIGHT.');
        } else if (id === 'e') { ping(1, 'ONE PING: DONE'); W.eNote = 1; }
        else if (id === 'g') { ping(1, 'ONE PING: DONE'); W.gNote = 1; }
        else if (id === 'i') { why = 'hold'; ping(2, 'TWO PINGS: CANNOT'); return false; }
        else if (id === 'f' || id === 'h') {
          BEN.sfx.blow(1.6); $('#bubbles').setAttribute('class', 'on');
          setTimeout(function () { $('#bubbles').setAttribute('class', ''); }, 1700);
          if (id === 'h') { W.lemon = 'cork'; W.note = 3; why = 'cork'; }
          else if (!W.tight) { W.lemon = 'slid'; W.note = W.hook === 'ring' ? 2 : 1; why = W.hook === 'ring' ? 'slid' : 'slid0'; }
          else W.lemon = 'lift';
          setTimeout(drawW, 900); ping(1, 'ONE PING: DONE');
          if (why) return false;
        }
        return true;
      }, function () {
        var file = !why && W.lemon === 'lift' ? ER.exitOk([seq]) : null, e = W.eNote, g = W.gNote;
        W.eNote = W.gNote = 0;
        if (file) { won(file); return; }
        BEN.bump('slips'); BEN.sfx.hm();
        msg({
          nohook: '&ldquo;Two pings,&rdquo; says Kovacs. &ldquo;The hook is not on its tail any more. It did that already.&rdquo;',
          noit: 'Three pings. &ldquo;Not clear,&rdquo; says Kovacs. &ldquo;Clip <i>what</i>? You have not named anything yet.&rdquo;',
          tail: 'Two pings. In the picture the hook is hanging from Limpet&rsquo;s small arm, and going nowhere. &ldquo;Clip <i>what</i> to the ring?&rdquo; says Kovacs. &ldquo;It has only your words. What was the last thing that you named?&rdquo;',
          wait: '&ldquo;It is waiting for the line to come tight,&rdquo; says Kovacs, &ldquo;and I am not winding in one metre until I see that hook on her ring. You know what happened at 19:40.&rdquo; He sends STOP.',
          hold: '&ldquo;Two pings,&rdquo; says Kovacs. &ldquo;Of course two pings. She told it not to let go until <i>she</i> says so. Rule 9. Nobody else can end that: not me, not you.&rdquo;',
          cork: 'The Lemon goes up like a cork, as far as Limpet&rsquo;s claw will let her, and hangs there, swinging. A new page is slapped against the glass: I SAID UNTIL I LIFT. She lets the air out again, and comes down in a cloud of mud.',
          slid: 'The Lemon comes up out of the mud, and at once begins to slide down the slope, with Limpet holding on above her. Then the loose line comes tight with a jerk that you can almost feel through the screen. A new page appears in the window: DO THAT AGAIN &amp; I WALK HOME.' + (e ? ' &ldquo;&lsquo;Wait <i>while</i> the line is tight&rsquo;,&rdquo; says the Chief. &ldquo;It was not tight. So it did not wait.&rdquo;' : ' &ldquo;The line first,&rdquo; says the Chief.'),
          slid0: 'The Lemon comes up out of the mud, and at once begins to slide down the slope. There is nothing on her ring but Limpet. She lets the air out, and sits down again two metres lower. A new page appears in the window: WHERE IS THE HOOK?'
        }[why] || (g ? '&ldquo;Nothing,&rdquo; says Kovacs. &ldquo;&lsquo;While the Lemon lifts.&rsquo; She is not lifting. So it blew no air at all: and it has told you DONE, which is perfectly true.&rdquo;'
          : 'Four pings, and the Lemon is still sitting in the mud. &ldquo;I am not going to pull her through that,&rdquo; says Kovacs. &ldquo;She has to come off the bottom first.&rdquo;'));
        end(back, 4600);
      });
    }
    function won(file) {
      nextFile = file; ER.flag('f-file', file); BEN.done('floor'); busy = true;
      msg('One ping. In the picture the yellow hull stirs, lifts a hand&rsquo;s width out of the mud, and stays there. The air has stopped. The line is as straight as a ruler.');
      BEN.mine('towlist', 'The list that brought them home', '<p>1. From your tail, unclip the hook. (The hook is named LAST.)</p><p>2. Clip it to the ring. (it = the hook)</p><p>3. Wait UNTIL the line is tight.</p><p>4. Blow air into the tanks UNTIL the Lemon lifts.</p><p>&ldquo;Let go and come home&rdquo;: two pings. Only SHE can say that.</p>', true);
      stop = BEN.seq([[3200, function () { ER.closeAll(); BEN.solved(); W.note = 4; paint(); tow(); }]]);
    }
    msg(first ? 'Three strips. Limpet will do whatever you send, in the order you send it, and answer with pings. The picture, when it comes, will come on the small screen here and on the big one behind it.'
      : 'Nine strips, and four slots. On the small screen you can see the hook, the line and the Lemon. Dr Halvorsen&rsquo;s pages are in your notebook.');
    BEN.learn(['ping', 'order']);
    ER.open('ov-lock', box, function () { if (stop) stop(); if (!nextFile && running) { W.hook = 'tail'; W.tight = false; W.lemon = ''; drawW(); } });
  }

  /* ---------- the picture comes down the screen ---------- */
  function reveal() {
    var r = $('#revR'), n = 0, t;
    busy = true; W.pic = 'lit'; r.setAttribute('height', 0); paint();
    t = setInterval(function () {
      n++; r.setAttribute('height', n * 28); BEN.sfx.line();
      if (n >= 24) {
        clearInterval(t); r.setAttribute('height', 652);
        ER.narrate([
          'The picture comes down the screen a line at a time, the way a picture comes when it has been sung through four hundred metres of sea.',
          'Mud. A slope of grey mud, falling away into nothing. A yellow hull, sunk in it up to the window. And at the top of the picture, very large and very close, Limpet&rsquo;s own claw: shut tight on the Lemon&rsquo;s lifting ring.',
          'In the window there is a face in round glasses, and under the face a sheet of yellow paper pressed flat against the glass.',
          '&ldquo;It is holding her,&rdquo; says Kovacs. Nobody has ever heard him speak so quietly. &ldquo;It is not caught on anything. It is holding on.&rdquo;'
        ], function () { busy = false; paint(); ER.say('The picture is on the big screen now. Click on anything in it for a closer look.'); });
      }
    }, 110);
  }
  /* ---------- up the slope ---------- */
  function tow() {
    BEN.sfx.winch(3);
    ER.narrate([
      'The hook is on the ring. Far away in the dock the winch has taken up the line, one slow metre at a time, until it sang. Air hissed into the Lemon&rsquo;s tanks, and stopped at the very moment when the yellow hull stirred in the mud.',
      '&ldquo;She is off the bottom,&rdquo; says the Chief. &ldquo;Viktor. Gently.&rdquo; &ldquo;I have never done anything gently in my life,&rdquo; says Kovacs, and he brings them up the slope like a man carrying a bowl of soup.',
      'The mud slides away under the camera. Marker 7 goes past, with its little yellow flag. Limpet&rsquo;s claw is still shut on the ring. Nobody has told it to do anything else.',
      'In the window Dr Halvorsen holds up one more page. It says: ABOUT TIME.'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
