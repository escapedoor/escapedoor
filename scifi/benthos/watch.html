<style>
  body{--bg:#050b10;--accent:#ffb84a;--font-display:'Saira Stencil One',sans-serif;--font-ui:'Share Tech Mono',monospace;--font-body:'Outfit',sans-serif;
    --tc-bg:rgba(4,9,13,.96);--tc-ink:#e8eef0;--cap-bg:rgba(5,11,16,.94);--cap-ink:#eef3f2;--panel:#0d1a22;--face-bg:#0f2233;--q-ink:#ffd595;--fade:#020507;--hud-bg:rgba(5,12,17,.8)}
  .snow circle{animation:snow 26s linear infinite}
  @keyframes snow{from{transform:translate(0,-40px)}to{transform:translate(-26px,420px)}}
  #fish{animation:fish 47s linear infinite}
  @keyframes fish{0%,62%{transform:translate(0,0)}100%{transform:translate(-560px,34px)}}
  #sweep{transform-origin:1405px 262px;animation:sweep 5s linear infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}
  #lampPool{animation:lp 5.3s steps(3) infinite}
  @keyframes lp{50%{opacity:.86}}
  #tableGlow{animation:tg 3.4s steps(4) infinite}
  @keyframes tg{50%{opacity:.8}}
  #table.next #tableTop{animation:bnudge 1.8s ease-in-out infinite}
  .cur{animation:cur 1.1s steps(1) infinite}
  @keyframes cur{50%{opacity:0}}

  /* the plotting table */
  .pt{display:grid;grid-template-columns:minmax(0,640px) 350px;gap:18px;width:min(1040px,96vw);align-items:start}
  .pt-main{background:#06141b;border:1px solid #1f5f6a;border-radius:10px;box-shadow:0 0 0 6px #0a1c24,0 26px 70px rgba(0,0,0,.7);padding:8px 10px 10px}
  .pt-tabs{display:flex;gap:6px;margin-bottom:8px}
  .pt-tab{padding:6px 14px 5px;border:1px solid #1f5f6a;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:13.5px;letter-spacing:.14em;color:#8fd0c8}
  .pt-tab.on{background:#8fd0c8;color:#06141b}
  .pt-view{display:none}.pt-view.on{display:block}
  .pt-view svg{display:block;width:100%;height:auto;max-height:calc(100vh - 190px)}
  .pt-log{height:min(552px,calc(100vh - 190px));overflow:auto;padding:14px 16px 14px 44px;background:#eef3e6 repeating-linear-gradient(rgba(70,130,90,.13) 0 25px,transparent 25px 50px);
    border-left:16px solid #cfd8c6;color:#1d2620;font-family:'Special Elite','Courier New',monospace;font-size:14.5px;line-height:25px}
  .pt-ln{position:relative;margin:0;padding:0 4px 0 56px;text-indent:-56px;border-radius:3px;cursor:pointer}
  .pt-ln b{font-weight:normal;display:inline-block;width:56px;text-indent:0;color:#27402f}
  .pt-ln:hover{background:rgba(255,184,74,.25)}
  .pt-ln.on{background:#ffd76a}
  .pt-ln.on:before{content:'\2192';position:absolute;left:-28px;top:0;text-indent:0;font-family:'Share Tech Mono',monospace;font-size:20px;color:#a8402c}
  .pt-ln .pen{font-family:'Caveat',cursive;font-weight:700;font-size:1.3em;line-height:1;color:#3a4f8a}
  .pt-ln .pen2{font-family:'Caveat',cursive;font-weight:700;font-size:1.3em;line-height:1;color:#a8402c}
  .pt-side{color:#e2ecee}
  .pt-side h6{margin:0 0 8px;font-family:'Saira Stencil One',sans-serif;font-weight:normal;font-size:20px;letter-spacing:.06em;color:#ffb84a}
  .pt-ins{margin:0 0 8px;padding:8px 12px;border:1px solid #1f5f6a;border-radius:6px;background:#04110c;font-family:'Share Tech Mono',monospace;font-size:14px;line-height:1.4;color:#8df0b4}
  .pt-ins small{display:block;font-size:11.5px;letter-spacing:.12em;color:#5fb98a}
  .pt-ins b{font-weight:normal;font-size:21px;color:#eafff2}
  .pt-ins .btn{float:right;margin-top:2px;padding:7px 14px;font-size:13px;--accent:#7dffb0}
  .wh{display:flex;align-items:center;gap:5px;margin:0 0 7px}
  .wh span{flex:1;font-family:'Share Tech Mono',monospace;font-size:12.5px;letter-spacing:.1em;color:#9fb8be}
  .wh output{min-width:88px;padding:4px 8px;text-align:center;background:#0c1218;border:1px solid #5a6d78;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:20px;color:#ffe9b8}
  .wh button{min-width:32px;height:32px;padding:0 5px;border:1px solid #5a6d78;border-radius:4px;background:#1c2a33;font-family:'Share Tech Mono',monospace;font-size:13px;color:#e2ecee}
  .wh button:hover{border-color:#ffb84a;color:#ffb84a}
  .pt-side .pmsg{min-height:138px;margin:10px 0 10px;font-size:16.5px}
  .cT{font-family:'Share Tech Mono',monospace;fill:#7fc9c2}
  .cS{font-family:'Saira Stencil One',sans-serif;fill:#3f8f8a}
  .pt-dot{cursor:pointer}
  .pt-dot circle{fill:#06141b;stroke:#ffd76a;stroke-width:2.5}
  .pt-dot:hover circle{fill:#ffd76a}
  .pt-dot.on circle{fill:#ff6a3a;stroke:#fff}
  #pt-echo{opacity:0}
  #pt-echo.go{animation:echo 1.5s ease-out}
  @keyframes echo{0%{opacity:.9;transform:scale(.02)}60%{opacity:.5}100%{opacity:0;transform:scale(1)}}
  @media (max-width:900px){.pt{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null;

  /* ribs of the hull, bolts round the window, snow in the water */
  (function () {
    var s = '', i, a, seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (i = -6; i <= 20; i++) s += '<rect x="' + (i * 150 - 20) + '" y="-600" width="26" height="1185" fill="#0a1218" opacity=".55"/><rect x="' + (i * 150 + 6) + '" y="-600" width="5" height="1185" fill="#22343f" opacity=".5"/>';
    $('#ribs').innerHTML = s; s = '';
    for (i = 0; i < 16; i++) { a = i * Math.PI / 8 + 0.2; s += '<circle cx="' + (560 + Math.cos(a) * 188).toFixed(1) + '" cy="' + (330 + Math.sin(a) * 188).toFixed(1) + '" r="6"/>'; }
    $('#bolts').innerHTML = s; s = '';
    for (i = 0; i < 34; i++) s += '<circle cx="' + Math.round(400 + rnd() * 340) + '" cy="' + Math.round(140 + rnd() * 80) + '" r="' + (0.9 + rnd() * 1.7).toFixed(1) + '" opacity="' + (0.25 + rnd() * 0.5).toFixed(2) +
      '" style="animation-duration:' + (17 + rnd() * 20).toFixed(1) + 's;animation-delay:-' + (rnd() * 30).toFixed(1) + 's"/>';
    $('#snow').innerHTML = s;
  })();

  ER.init({
    theme: 'scifi', story: 'benthos', storyTitle: 'Word for Word', id: 'watch', no: 'I', title: 'The Watch',
    go: 'Take the watch',
    intro: [
      'Benthos Laboratory stands on the sea bed, 230 metres down, at the top of a slope that nobody has seen the bottom of. Four people live in it. Tonight one of them is outside.',
      'You are the newest of the four: two weeks into your first tour. At ten past two in the morning the Chief shakes your shoulder. &ldquo;Up. You have slept. Nobody else has.&rdquo;',
      'Above you there is a storm, and no ship. Outside there is a robot called Limpet, which does exactly what it is told. Since five o&rsquo;clock yesterday it has been sent forty orders. It has given forty answers, and they are all the same.'
    ],
    exit: {"next":"lab","w":{"e717bb51":"41e391a6"}}, tags: {"line":["8a7dd242"],"depth":["7c24008a"],"range":["acbb7c04"],"spot":["15a31735"]},
    sound: ['orbit', { root: 45, bpm: 44, drop: ['mel'], lead: 'keys', beds: [['hum', 0.6]] }],      /* a quiet steel room; the sonar is heard here, so nothing in the music may ping */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('w-file') || null;
  var st = ER.flag('w-st') || { sel: '', depth: 230, range: 200, spot: '' };

  var CARD = '<h4>Watch-keeper&rsquo;s card: the sea in four lines</h4>' +
    '<p><b>1</b><span>PRESSURE. At the surface the air presses on you with one atmosphere. Sea water adds one atmosphere more for every ten metres that you go down. (At 100 metres: ten for the water and one for the air. Eleven.)</span></p>' +
    '<p><b>2</b><span>SOUND. Radio does not carry through sea water. We talk to our machines by cable, or by sound. Sound travels 1,500 metres a second in the sea. An echo has made the journey twice: there and back.</span></p>' +
    '<p><b>3</b><span>LIGHT. Below about 200 metres there is not enough sunlight to grow anything. Down here it is nearly dark at noon. It is also cold: 6°C outside, summer and winter.</span></p>' +
    '<p><b>4</b><span>UP AND DOWN. A submarine takes in water to sink, and blows it out with air to rise.</span></p>' +
    '<small>If a number on a screen does not agree with these four lines, either the number is wrong or you are not where you think you are. S. Iyer, Deputy</small>';
  var LOG = [
    ['l1', '15:32', 'Lemon away from the dock (Dr Halvorsen). 230 m. Gauge 24.0.'],
    ['l2', '15:47', 'Lemon over the Ridge. 221 m. Gauge 23.1.'],
    ['l3', '16:10', 'Lemon at Marker 7, on the Lip. 232 m. Gauge 24.2.'],
    ['l4', '16:38', 'Dr H. by telephone: &ldquo;Main battery dead. No motors. I am sitting on the bottom at Marker 7. Gauge reads 27. I am perfectly all right and extremely annoyed. Send Limpet.&rdquo; Telephone dead at 16:39.'],
    ['l5', '16:41', 'Limpet away, with its line behind it. Order 1 (V.K.): &ldquo;Go to Marker 7. Stay with the Lemon.&rdquo; One ping.'],
    ['l6', '16:52', 'Limpet at Marker 7. 232 m. Its pressure: 24.2.'],
    ['l7', '16:55', 'Limpet&rsquo;s pressure: 27.0. It has not changed since. <span class="pen">V.K.: Sensor fault. There is no 27 anywhere on the Shelf.</span>'],
    ['l8', '17:05', 'Order 2: &ldquo;Come home.&rdquo; Two pings. Orders 3 to 41: two pings each.'],
    ['l9', '19:40', 'Tried to wind Limpet in by its own line. The line came tight and the winch stopped. <span class="pen">V.K.: It is caught on something.</span>'],
    ['l10', '23:10', 'Winch pump off. Breaker out. <span class="pen">V.K.: Everything I build is broken tonight.</span>'],
    ['l11', '01:50', 'V.K. asks to send MASTER RESET. Refused. <span class="pen2">N.M.: Not until we know what it is doing.</span>'],
    ['l12', '02:10', 'Watch handed to the new watch-keeper. V.K. sent to lie down.']
  ];
  var LOGDOC = '<h4>Benthos Laboratory: watch log</h4><h5>Tuesday night to Wednesday morning · floor of the laboratory: 230 m</h5>' +
    LOG.map(function (l) { return '<p><b>' + l[1] + '</b>' + l[2] + '</p>'; }).join('');
  var TELEX = '<h4>FROM: R.V. FULMAR · TO: BENTHOS LAB · MONDAY 21:10</h4>' +
    '<p>Wind force nine and rising. I cannot hold the ship over you in this. Running for harbour. Your buoy and your cable should ride it out.</p>' +
    '<p>Back on station Thursday 06:00 if the forecast is right. It is not usually right.</p>' +
    '<p>Do not send anybody up. There is nobody up here to catch them.</p><p>A. Reyes, Master</p>';
  var MANUAL = '<h4>Limpet (ROV-2): how it reads an order</h4><h5>V. Kovacs · rev. 9 · read this before you say one word to it</h5>' +
    '<p><b>1</b><span>It does orders one at a time, in the order you give them. It never looks ahead to see what you are going to say next.</span></p>' +
    '<p><b>2</b><span>It does what the words say. It does not guess what you meant. <span class="pen">It really doesn&rsquo;t. T.D.</span></span></p>' +
    '<p><b>3</b><span><u>IT</u> and <u>THAT ONE</u> mean the last thing you named. Not the most important thing. The last.</span></p>' +
    '<p><b>4</b><span><u>THEM</u> means the last things you named together: a plural (&ldquo;the tanks&rdquo;), or things joined with AND.</span></p>' +
    '<p><b>5</b><span><u>UNTIL</u>: it goes on doing the thing, and stops at the moment the rest comes true. <u>WHILE</u>: it does the thing only for as long as the rest is true; if the rest is not true now, it does nothing. <u>AS SOON AS</u>: it waits, and acts at the moment the rest comes true. If that never happens, it waits for ever.</span></p>' +
    '<p><b>6</b><span><u>EVERY</u> and <u>EACH</u>: all of them, one after another. <u>ALL BUT ONE</u>: it works along the row and stops when one is left, so the one it leaves is the last. <u>BOTH</u> needs exactly two things.</span></p>' +
    '<p><b>7</b><span><u>IF</u>: it looks once, and acts if the thing is true at that moment. <u>UNLESS</u> is the other way round: it acts if the thing is not true.</span></p>' +
    '<p><b>8</b><span>One ping: DONE. Two pings: CANNOT, and it stops there and waits for new orders. Three pings: ORDER NOT CLEAR.</span></p>' +
    '<p><b>9</b><span><u>HOLD</u>. If a person tells it to hold a thing &ldquo;until I tell you&rdquo;, then only that person can tell it to let go. Nobody else&rsquo;s order can end it: not mine, not the Chief&rsquo;s. I built that in after the business with the anchor. <span class="pen">Ask him about the anchor. T.D.</span></span></p>';

  function hints() {
    if (nextFile) return ['go', ['Kovacs wants you to practise on the Arm in Dr Halvorsen&rsquo;s lab before you send Limpet a word. The way down is the button at the bottom of the screen.']];
    if (!ER.flag('w-talk')) return ['look', [
      'Talk to the Chief first: she is standing behind the desk. Then read what is lying on it: the watch log, the white card, the yellow binder and the message from the ship.',
      'The big lit table under the Chief&rsquo;s hands is the plotting table. Everything else in the room is something to read before you touch it.'
    ]];
    return ['plot', [
      'The Chief wants three things: a line in the log, two numbers, and a place on the chart. Begin with the log. Take the watch-keeper&rsquo;s card and check every line that gives a depth and a gauge.',
      'Rule 1 on the card: one atmosphere for the air, and one more for every ten metres of water. So at 232 metres a gauge reads 24.2. One line says &ldquo;at Marker 7&rdquo; and gives a different number. For the echo, press PING and read rule 2: the sound has gone there and back.',
      'A gauge that reads 27 is under 26 atmospheres of water. The whole journey of the echo is 0.56 × 1,500 metres, and Limpet is half of that away. Set the two wheels, open the chart, and look for the places where your ring crosses your depth. Limpet set out for Marker 7.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#table').setAttribute('class', 'hot' + (!nextFile && ER.flag('w-talk') ? ' next' : ''));
    $('#go').classList.toggle('on', !!nextFile && !busy);
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The control room. On the plotting table one pin stands over the Lip, and the Chief has not taken her eyes off it.'); return; }
    if (ER.flag('w-seen')) { ER.say('The control room: one lamp, a wall of quiet screens, and a round window full of black water.'); return; }
    busy = true; ER.flag('w-seen', 1);
    ER.narrate([
      'The control room. One lamp, a wall of quiet screens, and a round window with nothing in it but black water and a little slow snow.',
      '&ldquo;Sit,&rdquo; says the Chief. &ldquo;Halvorsen is out there in the Lemon with a dead battery. Limpet was sent to stay with her, and it has stopped taking orders. Kovacs says that it is broken. I say that a tired man is no judge. Read the log. Read everything. Then tell me where that machine is.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- the Chief, and what is on the desk ---------- */
  $('#mbatha').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Twenty-eight metres below the post,&rdquo; says the Chief, &ldquo;and for nine hours we have been talking to the post. Go and learn to talk to that machine.&rdquo;'); return; }
    ER.talk({
      who: CAST.mbatha.who, role: CAST.mbatha.role, face: FACE('mbatha'),
      lines: [
        { note: 'A tall woman in a navy boiler suit, with a headset on one ear and both hands flat on the desk, as if the desk might try to leave.',
          a: '&ldquo;The short version. At 15:32 yesterday Dr Halvorsen took the Lemon out to Marker 7 to collect sea pens. The Lemon is our little yellow submarine: one seat, one window, two motors. At 16:38 her main battery died. No motors; and one minute later, no telephone. She has air and one small lamp until about half past six this morning.&rdquo;' },
        { q: 'Can&rsquo;t she just come up?',
          a: 'A submarine takes in water to sink and blows it out to rise. So yes: she could blow her tanks and go up like a cork. Into a force-nine gale, at night, with no ship to pick her up. The Fulmar ran for harbour on Monday. Up is the one direction that is worse.' },
        { q: 'And Limpet?',
          a: 'Kovacs sent it after her at 16:41, with its line behind it. It reached Marker 7. Then it stopped. Every order since then has had the same answer: two pings. One ping means DONE. Two mean CANNOT. It cannot tell us why. By sound it has pings and numbers, and nothing else.' },
        { q: 'What do you want me to do?',
          a: 'Find it. The plotting table will give you an echo from Limpet, and Limpet sends us its pressure every few minutes. The rules are on the watch-keeper&rsquo;s card. Kovacs has thrown that pressure out: he says that the number is nonsense. I should like a second opinion, from somebody who is awake. So: show me a line of the log where the place and the gauge cannot both be true. Then tell me how far away Limpet is, and how far down. Then put a pin in the chart.' }
      ],
      clue: { id: 'chief1', title: 'The Chief, at ten past two', kind: 'What she said' }, last: 'Look round the desk',
      done: function (seen) { if (!seen) return; ER.flag('w-talk', 1); BEN.learn(['ping', 'gale', 'Benthos']); paint(); ER.say('The plotting table is in front of her. The log, the card, the binder and the message from the ship are on the desk.'); }
    });
  });
  $('#wlog').addEventListener('click', function () { if (!busy) ER.read({ html: LOGDOC, cls: 'wlog', clue: { id: 'wlog', title: 'The watch log', kind: 'On the desk' }, done: function () { BEN.learn(['gauge', 'the Lip']); } }); });
  $('#card').addEventListener('click', function () { if (!busy) ER.read({ html: CARD, cls: 'lam', clue: { id: 'card', title: 'The watch-keeper’s card', kind: 'On the desk' }, done: function () { BEN.learn(['atmosphere', 'pressure', 'echo']); } }); });
  $('#manual').addEventListener('click', function () { if (!busy) ER.read({ html: MANUAL, cls: 'manual', clue: { id: 'manual', title: 'Limpet: how it reads an order', kind: 'Kovacs’s binder' } }); });
  $('#telex').addEventListener('click', function () { if (!busy) ER.read({ html: TELEX, cls: 'telex', clue: { id: 'fulmar', title: 'Message from the Fulmar', kind: 'From the ship' } }); });
  BEN.thing('#window', 'porthole', 'The window. Sunlight gives up about two hundred metres down, and you are thirty metres below that. The &ldquo;snow&rdquo; is real: small pale bits of dead things, falling from the sea above to feed the animals below.', isBusy);
  BEN.thing('#clock', null, 'Ten past two. On this clock it is always the middle of somebody&rsquo;s night.', isBusy);
  BEN.thing('#plate', 'depth', 'DEPTH 230 m. That is the floor you are standing on. Twenty-three atmospheres of water are trying to come in, and six centimetres of steel are saying no.', isBusy);
  BEN.thing('#phone', null, 'The through-water telephone. It talks to the Lemon by sound, because radio does not carry through sea water. Since 16:39 it has had nobody to talk to: the Lemon&rsquo;s end of it lasted one minute longer than her battery.', isBusy);
  BEN.thing('#screens', 'sonar', 'The sonar, and under it the order desk. SENT 41. DONE 1. CANNOT 40. The one that was done was the first: &ldquo;Go to Marker 7. Stay with the Lemon.&rdquo;', isBusy);
  BEN.thing('#mug', null, 'Kovacs&rsquo;s mug. The tea in it went cold at about the twentieth order.', isBusy);
  BEN.thing('#lamp', null, null, isBusy);
  $('#reset').addEventListener('click', function () {
    if (busy) return;
    ER.say('LIMPET: MASTER RESET. Under the cover there is a red switch that wipes every order out of Limpet&rsquo;s head. Across the cover is a strip of yellow tape, and on the tape, in the Chief&rsquo;s writing: NOT YET.');
  });
  $('#table').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The plot stands as you left it: one pin over the Lip, forty metres beyond Marker 7 and twenty-eight metres below it.'); return; }
    if (!ER.flag('w-talk')) { ER.say('The plotting table. Better hear what the Chief wants before you start moving her pins about.'); return; }
    openTable();
  });

  /* ---------- the plotting table: a line in the log, two numbers, a place on the chart ---------- */
  var S = 0.62, CX = 230, CY = 320, CON = { 240: 365, 250: 378, 260: 391, 270: 404, 280: 417, 290: 430, 300: 443 };      /* how far east of the laboratory each depth line runs (the chart's own data) */
  var MARK = [[1, 20, -250], [2, 190, -190], [3, -250, -90], [4, -210, 160], [5, 30, 240], [6, 220, 210], [7, 354, 138], [8, 352, -150], [9, -120, -300]];
  function chartSvg() {
    var s = '', r, d, x;
    s += '<defs><pattern id="cgrid" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M31 0H0V31" fill="none" stroke="#0d2a33" stroke-width="1"/></pattern>' +
      '<pattern id="chat" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#04121a"/><rect width="2.5" height="9" fill="#0f3540"/></pattern>' +
      '<clipPath id="cclip"><rect width="700" height="640"/></clipPath></defs>';
    s += '<rect width="700" height="640" fill="#06141b"/><rect width="700" height="640" fill="url(#cgrid)"/>';
    s += '<rect x="' + (CX + 443 * S) + '" y="0" width="200" height="640" fill="url(#chat)"/>';
    s += '<text x="16" y="26" class="cS" font-size="17">BENTHOS LABORATORY · SEA BED</text><text x="16" y="44" class="cT" font-size="11">rings: metres from the laboratory · lines: depth in metres</text>';
    for (r = 100; r <= 500; r += 100) s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (r * S) + '" fill="none" stroke="#1f5f6a" stroke-width="1.2" stroke-dasharray="3 5"/>' +
      '<text x="' + (CX + 4) + '" y="' + (CY - r * S - 4) + '" class="cT" font-size="10.5">' + r + ' m</text>';
    s += '<g fill="none" stroke="#3f8f8a" stroke-width="1.3"><path d="M52 150q40-44 96-30q46 12 40 52q-8 40-62 44q-70 4-74-66z"/><path d="M80 152q28-26 62-16q26 8 22 30q-6 22-40 24q-40 2-44-38z"/></g>' +
      '<text x="118" y="172" text-anchor="middle" class="cT" font-size="11">THE RIDGE</text><text x="118" y="186" text-anchor="middle" class="cT" font-size="11">221</text>';
    s += '<text x="150" y="470" class="cS" font-size="15">THE SHELF</text><text x="150" y="486" class="cT" font-size="11">flat mud · about 230</text>';
    for (d in CON) { x = CX + CON[d] * S; s += '<path d="M' + x + ' 40V640" stroke="#3f8f8a" stroke-width="1.3"/>'; }
    for (d in CON) {                                              /* the depth of each line, set out like a staircase so that no two numbers touch */
      x = CX + CON[d] * S; r = 52 + (d - 240) * 1.7;
      s += '<rect x="' + (x - 13) + '" y="' + (r - 10) + '" width="26" height="13" fill="#06141b"/><text x="' + x + '" y="' + r + '" text-anchor="middle" class="cT" font-size="10.5">' + d + '</text>';
    }
    s += '<text x="' + (CX + 365 * S - 8) + '" y="26" text-anchor="end" class="cS" font-size="14">THE LIP</text>';
    s += '<text transform="rotate(90 660 320)" x="660" y="320" text-anchor="middle" class="cS" font-size="15">THE DROP · not surveyed below 300</text>';
    s += '<g transform="translate(40 590)"><path d="M0 22V-18M-7 -8L0 -20L7 -8" stroke="#7fc9c2" stroke-width="2" fill="none"/><text x="0" y="-26" text-anchor="middle" class="cT" font-size="13">N</text></g>';
    MARK.forEach(function (m) {
      var mx = CX + m[1] * S, my = CY + m[2] * S;
      s += '<path d="M' + mx + ' ' + (my + 5) + 'v-12" stroke="#ffd76a" stroke-width="2"/><path d="M' + mx + ' ' + (my - 7) + 'h8v6h-8z" fill="#ffd76a"/><text x="' + (mx - 5) + '" y="' + (my + 2) + '" text-anchor="end" class="cT" font-size="12" style="fill:#ffd76a">' + m[0] + '</text>';
    });
    s += '<rect x="' + (CX - 8) + '" y="' + (CY - 8) + '" width="16" height="16" fill="#ffd76a"/><text x="' + (CX - 14) + '" y="' + (CY + 24) + '" class="cT" font-size="11" style="fill:#ffd76a">LAB</text>';
    s += '<g clip-path="url(#cclip)"><circle id="pt-echo" cx="' + CX + '" cy="' + CY + '" r="330" fill="none" stroke="#7dffb0" stroke-width="3" style="transform-origin:' + CX + 'px ' + CY + 'px"/>' +
      '<path id="pt-con" d="" stroke="#ff9a5a" stroke-width="3" fill="none"/><circle id="pt-ring" cx="' + CX + '" cy="' + CY + '" r="0" fill="none" stroke="#ffd76a" stroke-width="2.5"/></g><g id="pt-x"></g>';
    return s;
  }
  function openTable() {
    var box = ER.el('div', 'pt'), done = false, s;
    s = '<div class="pt-main"><div class="pt-tabs"><button type="button" class="pt-tab on" data-t="log">Watch log</button><button type="button" class="pt-tab" data-t="chart">Chart</button></div>' +
      '<div class="pt-view on" data-v="log"><div class="pt-log">';
    LOG.forEach(function (l) { s += '<p class="pt-ln" data-l="' + l[0] + '"><b>' + l[1] + '</b>' + l[2] + '</p>'; });
    s += '</div></div><div class="pt-view" data-v="chart"><svg viewBox="0 0 700 640">' + chartSvg() + '</svg></div></div>' +
      '<div class="pt-side"><h6>Plotting table</h6>' +
      '<div class="pt-ins"><button type="button" class="btn" id="pt-ping">Ping</button><small>ECHO FROM LIMPET</small><b id="pt-t">&ndash;</b></div>' +
      '<div class="pt-ins"><small>LIMPET · PRESSURE · sent 02:00</small><b>27.0</b> atmospheres</div>' +
      '<div class="wh" data-w="range"><span>LIMPET IS THIS FAR AWAY</span><button type="button" data-d="-100">&minus;100</button><button type="button" data-d="-10">&minus;10</button><output></output><button type="button" data-d="10">+10</button><button type="button" data-d="100">+100</button></div>' +
      '<div class="wh" data-w="depth"><span>AND THIS FAR DOWN</span><button type="button" data-d="-10">&minus;10</button><output></output><button type="button" data-d="10">+10</button></div>' +
      '<p class="pmsg"></p><button type="button" class="btn" id="pt-go">Show the Chief</button></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.pmsg'), svg = box.querySelector('svg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('w-st', st); }
    function tab(t) {
      ER.$$('.pt-tab', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
      ER.$$('.pt-view', box).forEach(function (v) { v.classList.toggle('on', v.getAttribute('data-v') === t); });
    }
    function draw() {
      var x = CON[st.depth], dots = '', y;
      ER.$$('.pt-ln', box).forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-l') === st.sel); });
      box.querySelector('[data-w="range"] output').textContent = st.range + ' m';
      box.querySelector('[data-w="depth"] output').textContent = st.depth + ' m';
      svg.querySelector('#pt-ring').setAttribute('r', st.range * S);
      svg.querySelector('#pt-con').setAttribute('d', x ? 'M' + (CX + x * S) + ' 40V640' : '');
      if (x && st.range > x) {
        y = Math.sqrt(st.range * st.range - x * x);
        [['n', -y], ['s', y]].forEach(function (p) {
          var py = CY + p[1] * S;
          if (py > 66 && py < 630) dots += '<g class="pt-dot' + (st.spot === p[0] ? ' on' : '') + '" data-s="' + p[0] + '"><circle cx="' + (CX + x * S).toFixed(1) + '" cy="' + py.toFixed(1) + '" r="9"/></g>';
        });
      } else st.spot = '';
      svg.querySelector('#pt-x').innerHTML = dots;
      if (!dots) st.spot = '';
    }
    box.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target : null, n; if (!t || done) return;
      if (t.closest('.w')) return;
      if ((n = t.closest('.pt-tab'))) { tab(n.getAttribute('data-t')); ER.sfx.click(); return; }
      if ((n = t.closest('.pt-ln'))) { st.sel = st.sel === n.getAttribute('data-l') ? '' : n.getAttribute('data-l'); ER.sfx.tick(); keep(); draw(); return; }
      if ((n = t.closest('.pt-dot'))) { st.spot = n.getAttribute('data-s'); ER.sfx.click(); keep(); draw(); return; }
      if ((n = t.closest('.wh button'))) {
        var w = n.parentNode.getAttribute('data-w'), d = +n.getAttribute('data-d');
        if (w === 'range') st.range = Math.max(50, Math.min(900, st.range + d)); else st.depth = Math.max(200, Math.min(320, st.depth + d));
        BEN.sfx.wheel(); keep(); draw();
        if (ER.$('.pt-view.on', box).getAttribute('data-v') !== 'chart') tab('chart');
      }
    });
    box.querySelector('#pt-ping').addEventListener('click', function () {
      if (done) return;
      var e = svg.querySelector('#pt-echo');
      tab('chart'); BEN.sfx.ping(0.56);
      e.setAttribute('class', ''); void e.getBoundingClientRect(); e.setAttribute('class', 'go');
      box.querySelector('#pt-t').textContent = '. . .';
      setTimeout(function () { box.querySelector('#pt-t').textContent = 'after 0.56 s'; ER.flag('w-ping', 1); }, 620);
    });
    function miss(t) { BEN.bump('slips'); BEN.sfx.hm(); msg(t); }
    box.querySelector('#pt-go').addEventListener('click', function () {
      if (done) return;
      var L = {
        l1: '&ldquo;230 metres. Twenty-three for the water and one for the air: 24. That line is right.&rdquo;',
        l2: '&ldquo;The Ridge. 221 metres: 22.1 for the water, and one for the air. 23.1. It looks odd, and it is right.&rdquo;',
        l3: '&ldquo;Marker 7 stands at 232 metres. 23.2 and one: 24.2. Right.&rdquo;',
        l6: '&ldquo;Limpet at Marker 7: 232 metres, 24.2. The same as the Lemon&rsquo;s gauge at the same post. Right.&rdquo;',
        l7: '&ldquo;That is the one Kovacs crossed out. But read it again: it gives a number and no place. I want a line that names a place and a number, and the two do not agree.&rdquo;'
      };
      if (!st.sel) { msg('&ldquo;First the log,&rdquo; says the Chief. &ldquo;Kovacs threw out one number because it could not be right. Show me another line: one where the place and the gauge cannot both be true.&rdquo;'); tab('log'); return; }
      if (!ER.check('line', st.sel)) { tab('log'); miss(L[st.sel] || '&ldquo;There is no gauge in that line. I want a place and a gauge that cannot both be true.&rdquo;'); return; }
      if (!ER.check('depth', st.depth)) {
        miss(st.depth === 270 ? '&ldquo;Twenty-seven atmospheres, so 270 metres? You have forgotten the air. One of those 27 was pressing on her before she was under any water at all.&rdquo;'
          : '&ldquo;The log is right: at Marker 7 a gauge cannot read 27. So how deep <i>is</i> a gauge that reads 27? Work it from the card. One atmosphere is the air. Each of the others is ten metres of sea.&rdquo;');
        return;
      }
      if (!ER.check('range', st.range)) {
        miss(st.range === 840 ? '&ldquo;840 metres is the whole journey of the sound: out to Limpet, and back to us. So how far away is Limpet?&rdquo;'
          : !ER.flag('w-ping') ? '&ldquo;You have not asked it yet. Press PING and time the echo.&rdquo;'
          : '&ldquo;Sound goes 1,500 metres in a second. How long did the echo take? And how many times did it cross the water between us and Limpet?&rdquo;');
        return;
      }
      if (!st.spot) { tab('chart'); msg('&ldquo;Good. 260 metres down, and 420 metres from this table. Now put your finger on the chart: where does your ring cross that depth?&rdquo;'); return; }
      var file = ER.exitOk([st.sel + '-' + st.depth + '-' + st.range + '-' + st.spot]);
      if (!file) { tab('chart'); miss('&ldquo;Your ring crosses 260 metres in two places, and that is one of them. But she was at Marker 7 at ten past four, and Limpet was sent to Marker 7. Which crossing is on that side?&rdquo;'); return; }
      done = true; nextFile = file; ER.flag('w-file', file); BEN.done('watch'); busy = true; tab('chart');
      BEN.mine('where', 'Where they are', '<p>Echo after 0.56 s. × 1,500 = 840 m, there AND back. So 420 m away.</p><p>Gauge 27: one for the air, 26 for the water. 260 m down.</p>' +
        '<p>Not at Marker 7 (232 m). Over the Lip: 40 m beyond the post and 28 m below it.</p><p>Two gauges said 27. Both were right.</p>', true);
      msg('The Chief looks at the chart for a long time. &ldquo;Over the Lip,&rdquo; she says. &ldquo;Twenty-eight metres below the post. Both of them.&rdquo;');
      setTimeout(function () { ER.closeAll(); BEN.solved(); paint(); found(); }, 2800);
    });
    draw();
    msg(st.sel || st.spot ? 'The table is as you left it.' : 'The log is on the left: click a line to mark it. The chart is behind it. Limpet&rsquo;s last pressure is on the screen, and the PING button will ask it for an echo.');
    BEN.learn(['atmosphere', 'echo', 'ping']);
    ER.open('ov-lock', box);
  }

  /* ---------- over the Lip ---------- */
  function found() {
    ER.narrate([
      'Two gauges said 27, seventeen minutes apart: Dr Halvorsen&rsquo;s at 16:38, and Limpet&rsquo;s at 16:55. Everybody read &ldquo;Marker 7&rdquo;. Nobody read the number.',
      '&ldquo;She was not at the post,&rdquo; says the Chief. &ldquo;She thought she was. The Lip is soft mud, and it slides. When she called us she was already forty metres beyond it, down the slope, in the dark, and she did not know it.&rdquo;',
      'She presses a button. &ldquo;Viktor. Control room.&rdquo; A long pause, and then a voice full of sleep. &ldquo;If it has moved, I do not want to know.&rdquo; &ldquo;It has not moved. It is not broken either. Its 27 is right. It is sitting at 260 metres, beside the Lemon.&rdquo;',
      '&ldquo;Then it found her,&rdquo; says Kovacs slowly. &ldquo;Good. Good. So why will it not bring her home? Why does it tell me CANNOT, forty times?&rdquo;',
      'Nobody answers. &ldquo;Somebody has to send it a better order than mine,&rdquo; he says at last. &ldquo;But not you. Not yet. You have never said a word to it. Go down to Halvorsen&rsquo;s lab: the Arm in there has the same reader as Limpet. If you can make the Arm rinse a starfish, I shall let you near the hydrophone.&rdquo;'
    ], function () { busy = false; paint(); });
  }
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
