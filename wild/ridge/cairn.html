  .fone{position:absolute;right:16px;bottom:16px;width:318px;display:none;padding:13px 15px 14px;background:#0e1418;color:#e6edf0;border:3px solid #2c363c;border-radius:22px;
    box-shadow:0 18px 44px rgba(0,0,0,.6);font-family:'Overpass',sans-serif;font-size:13.5px;line-height:1.4}
  .fone h5{margin:0 0 8px;display:flex;justify-content:space-between;font-family:'Overpass Mono',monospace;font-weight:400;font-size:11.5px;color:#93a4ad;letter-spacing:.05em}
  .fone .to{margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid #2c363c;font-weight:700;font-size:14px}
  .fone .out{margin:0 0 3px;padding:8px 11px 7px;border-radius:14px 14px 3px 14px;background:#1f6f54;color:#f1fff8}
  .fone .out.two{background:#33423d;color:#aebdb7}
  .fone .st{margin:0 0 8px;min-height:15px;font-family:'Overpass Mono',monospace;font-size:11.5px;color:#93a4ad;text-align:right}
  .fone .st.bad{color:#ff8a6a}
  .fone .st.ok{color:#8fe3bd}

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, told = {};

  /* tufts of wet grass */
  (function () {
    var s = '', i, x, y;
    for (i = 0; i < 46; i++) { x = (i * 367) % 1600; y = 640 + (i * 131) % 250; s += '<path d="M' + x + ' ' + y + 'l-5 -14M' + (x + 5) + ' ' + y + 'l1 -17M' + (x + 10) + ' ' + y + 'l6 -12"/>'; }
    $('#grass').innerHTML = s;
  })();

  ER.init({
    theme: 'wild', story: 'ridge', storyTitle: 'The Cold Door', id: 'cairn', no: 'I', title: 'The Cairn',
    go: 'Stay close',
    intro: [
      'A Saturday late in October, twenty to three in the afternoon. You joined the Saturday Hill Club five weeks ago, and this is your first real mountain: Skallan, 912 metres. An hour ago you stood on the top of it. Then the cloud came down, two hours before the forecast said it would.',
      'There are three of you. Mrs MacAskill has led the club for twenty-two years. Kwame Asante is fifteen, and has been coming for three. You are the one who was told, in the car park this morning, to stay close.',
      'The plan was simple: along the ridge, down a path of rock steps called the Staircase, and a night in the hut at the bottom. Mrs MacAskill went down the first step to see how wet it was. It was very wet.'
    ],
    exit: {"next":"whaleback","w":{"b9d87c8c":"caf4a4de"}}, tags: {"k":["30e1a8ec"],"e":["298a5007"],"n":["cc3cb04c"],"sq":["fc218ea4"],"sw":["d28e3067"],"pin":["6c5e3767"],"barn":["dddaf2e8"]},
    sound: ['trail', { root: 45, bpm: 52, drop: ['mel', 'arp'], beds: [['wind', 0.9]] }],      /* inside a cloud, with a great deal to read: wind, long notes and no tune */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('a-file') || null; told = ER.flag('a-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.mac && told.key && told.log; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#mapcase').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((told.mac ? 1 : 0) + (told.key ? 1 : 0) + (told.log ? 1 : 0) + ((ER.flag('a-stage') || 0) > 1 ? 1 : 0) + (nextFile ? 1 : 0), 5);
  }

  function hints() {
    if (nextFile) return ['go', ['Half a message has gone, and you know where the hut is. Go on to the last fence post.']];
    if (bench && bench.isOpen()) return [['which', [
      'Start from her notebook. What did you pass after the pillar on the summit, and on which side? Now find those same things on the map: the pool, the fence, the cairns.',
      'The fence is the thin black line with small strokes across it. It climbs to the ridge from the bottom of the map, runs along beside the path, and then goes off to the top of the map. Mrs MacAskill wrote down what the fence does at this cairn.',
      'You were walking east, so your left hand was to the north: the top of the map. Four cairns stand on the ridge. At only one of them does the fence leave the ridge and go away to the left.'
    ]], ['six', [
      'Eastings first. Which upright blue line is just to the LEFT of our cairn? Its number is printed in the margin under the map. That is two figures.',
      'Pick up the corner card that is lying on the map, and put its corner, the red 0, on the cairn. The blue line on the left cuts the top edge of the card between two numbers. Take the smaller: that is the third figure.',
      'Now the same going up. The blue line BELOW the cairn gives two figures, and the place where it cuts the side of the card gives the last. Never round up.'
    ]], ['phone', ['There is nothing to do here but watch the message go, or not go. Then put the telephone away.']], ['pin', [
      'Cut 244 252 in two: 244 and 252. The first half is eastings: find line 24 at the foot of the map, and go 4 tenths of a square to the right of it.',
      'The second half is northings: line 25, and 2 tenths above it. Where the two meet there is a small black square beside a stream. Click it, and say &ldquo;There&rdquo;.'
    ]]][bench.stage()];
    if (!told.mac) return ['mac', ['Mrs MacAskill is sitting on the rock in the middle, in a red jacket. Ask her what happens next.']];
    if (!told.key) return ['key', [
      'A map explains itself. Its key is printed on its cover.',
      'The map case is lying open on the flat rock at the front. The right-hand half of it is red: that is the cover of the map. Click it.'
    ]];
    if (!told.log) return ['log', ['Mrs MacAskill wrote down what you passed on the ridge, and when. Her notebook is the small yellow book on the rock beside her.']];
    return ['map', ['Now the map itself: the pale half of the map case, on the flat rock at the front.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('Half a message has gone. The cloud has not.'); return; }
    if (told.in) { busy = false; ER.say('The cairn, in cloud. A quarter to three.'); return; }
    tell('in');
    ER.narrate([
      'Grey, in every direction. You can see a heap of stones, a line of old iron fence posts, and about twenty metres of ridge. After that the world stops.',
      'Mrs MacAskill is sitting on a rock with her right leg straight out in front of her. She is doing up the laces of that boot again, very tight, and saying nothing at all.',
      '&ldquo;It isn&rsquo;t broken,&rdquo; she says at last. &ldquo;It&rsquo;s twisted. I have done it twice before, so I know exactly how much use it is. I can walk. I can&rsquo;t hop down four hundred metres of wet steps.&rdquo;',
      'Then she pats her pockets, and looks at the empty cord round her neck, and down into the cloud where the Staircase goes. &ldquo;And my glasses have gone on ahead of us.&rdquo;',
      '&ldquo;Right,&rdquo; she says. &ldquo;I can see a mountain, when there is one. I can&rsquo;t see a map. You can. Bring the map case over here, and stay close.&rdquo;'

        }
        ER.sfx.no();
        if (ER.check('sw', v)) msg('&ldquo;Stop,&rdquo; says Mrs MacAskill. &ldquo;You have gone up the stairs before you went along the corridor. Eastings first: the numbers along the foot of the map.&rdquo;');
        else if (eo) msg('&ldquo;The first three are right,&rdquo; says Mrs MacAskill. &ldquo;Now the northings. Which line is just below us? And how many whole tenths are we above it?&rdquo;');
        else if (no) msg('&ldquo;The last three are right,&rdquo; says Mrs MacAskill. &ldquo;It is the eastings that are wrong. Which line is just to the left of us? And how many whole tenths past it are we?&rdquo;');
        else if (ER.check('sq', e.slice(0, 2) + n.slice(0, 2))) msg('&ldquo;The right square,&rdquo; says Mrs MacAskill. &ldquo;But the square is a kilometre across, and Dougal would be all night finding us in it. The tenths: count them again. And never round up.&rdquo;');
        else msg('&ldquo;Why?&rdquo; asks Mrs MacAskill. (That is her whole method.) &ldquo;Which blue line is just to the left of our cairn? Read me the number at the foot of it.&rdquo;');
      } else if (stage === 2) {
        setStage(3);
        msg('She zips the telephone inside her jacket. &ldquo;Cold kills a battery. Now the hut. The route card says <b>244 252</b>. Put a pin in it for me.&rdquo;');
      } else if (stage === 3) {
        if (!pin) { msg('Click the map at 244 252: a red pin will go in. Then say &ldquo;There&rdquo;.'); return; }
        code = RIDGE.six(pin.x, pin.y);
        if (!ER.check('pin', code)) {
          ER.sfx.no();
          msg(ER.check('barn', code) ? '&ldquo;What is beside your pin?&rdquo; asks Mrs MacAskill. &ldquo;A track, and a river? Then that is the old barn under the Nose, and nobody sleeps there but sheep. You have read the northings first: 252 along and 244 up. Along the corridor first.&rdquo;' :
            '&ldquo;Is there a building under your pin?&rdquo; asks Mrs MacAskill. &ldquo;Take it slowly. 244: line 24, and four tenths to the right of it. Then 252: line 25, and two tenths up.&rdquo;');
          pin = null; ER.flag('a-pin', null); draw(); return;
        }
        file = ER.exitOk([gr.get() + '-' + code]);
        if (!file) { msg('The map will not fold. Something is wrong with this page: tell your teacher.'); return; }
        wait = true; nextFile = file; ER.flag('a-file', file); stage = 4; ER.flag('a-stage', 4);
        var s0 = ER.state(); s0.done = s0.done || {}; s0.done.cairn = 1; ER.persist(true);
        RIDGE.sfx.pencil(); draw();
        RIDGE.mine('hut', 'Where the hut is', '<p>Skallan Hut is at <b>244 252</b>: line 24 and four tenths, line 25 and two tenths. A black square beside a stream.</p><p>From our cairn it is one kilometre away and five hundred metres down. The Slabs are in between.</p>', true);
        msg('&ldquo;That is it,&rdquo; says Mrs MacAskill. &ldquo;A black square beside the water. One kilometre from here, and five hundred metres straight down. It might as well be in France.&rdquo;');
        setTimeout(function () {
          ER.closeAll(); RIDGE.solved(); paint(); busy = true;
          ER.narrate([
            'You have a pencil ring round the place where you are, and a pin in the place where you want to be. Between the two, the map is nearly black with tiny strokes.',
            '&ldquo;The Slabs,&rdquo; says Mrs MacAskill, without looking. &ldquo;The Staircase is the only way through them, and I have just tried it. So we don&rsquo;t go down. We go along.&rdquo;',
            '&ldquo;Along where?&rdquo; says Kwame. &ldquo;There isn&rsquo;t any along. There&rsquo;s just white.&rdquo;',
            '&ldquo;There is a kilometre of nothing, called the Whaleback,&rdquo; she says, &ldquo;and at the far end of it there is a door. Help me up.&rdquo;'
          ], function () { busy = false; showGo(); });
        }, 3000);
      }
    });
    draw();
    msg(['The whole of Sheet 7. Somewhere on it is a heap of stones with three people beside it. Click the cairn that you think is ours.',
      'The cairn is ringed. Now its grid reference: six figures on the wheels, eastings first.',
      'Mrs MacAskill has the telephone in her hand.', 'The hut is at <b>244 252</b>. Click that place on the map, and a pin will go in.'][stage] || '');
    return {
      open: function () { ER.open('ov-lock', box); if (stage === 2 && !fone.innerHTML) sendText(); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return Math.min(stage, 3); }
    };
  }
})();
</script>
</body>
</html>
