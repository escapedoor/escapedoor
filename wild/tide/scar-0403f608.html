<style>
  body{--bg:#b9cdd4;--accent:#ffb347;--font-display:'Lora',serif;--font-ui:'Overpass',sans-serif;--font-body:'Lora',serif;
    --tc-bg:rgba(28,44,54,.96);--tc-ink:#eef3f2;--cap-bg:rgba(22,36,45,.93);--panel:#22343f;--face-bg:#a9c4cc;--q-ink:#ffd9a0;--fade:#dfe8ea;--hud-bg:rgba(22,36,45,.82)}
  .tc-room{text-transform:none;font-style:italic;font-weight:600;letter-spacing:.01em}
  #wall{animation:creep 90s steps(60,end) forwards}
  @keyframes creep{from{transform:translateY(0)}to{transform:translateY(-26px)}}
  .pool{animation:glint 6s steps(8,end) infinite}
  .pool.b{animation-delay:-3s}
  @keyframes glint{50%{opacity:.55}}
  #pup{animation:nose 3.2s steps(1,end) infinite}
  @keyframes nose{0%{transform:translate(0,0)}30%{transform:translate(2px,-2px)}60%{transform:translate(0,0)}}
  #wheel.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.25)}}
  #shut{opacity:0;transition:opacity 5s steps(12,end);pointer-events:none}
  #scene.fog #shut{opacity:.94}

  /* the moon wheel, and what Mr Nyberg drew in the sand */
  .work{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#bfb690}
  .work svg{display:block;width:100%;height:auto;touch-action:none}
  .work text{pointer-events:none}
  .mwT{font-family:'Overpass',sans-serif;font-weight:700;fill:#1c2630}
  .mwC{font-family:'Caveat',cursive;font-weight:700;fill:#1c2630}
  .sdT{font-family:'Caveat',cursive;font-weight:700;fill:#4a4330}
  .kind{display:inline-flex;flex:0 0 auto;border:1px solid rgba(255,255,255,.45);border-radius:3px;overflow:hidden}
  .kind button{height:38px;padding:0 12px;font-family:'Overpass',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#eef3f2;background:rgba(0,0,0,.42);border-right:1px solid rgba(255,255,255,.3)}
  .kind button:last-child{border-right:0}
  .kind button.on{background:#ffb347;color:#1c2630}
  #b-moon .tool{cursor:grab}
  .shell{cursor:grab}
</style>
</head>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, told = {};

  ER.init({
    theme: 'wild', story: 'tide', storyTitle: 'The Box at Pole Seven', id: 'scar', no: 'II', title: 'Selkie Scar',
    go: 'Look about you',
    intro: [
      'The card said low water at 12.10, at 0.4 metres. The chart said that the ford, the lowest place on your road, dries 1.6. On the board the blue dropped below the red string at seven minutes past ten and climbed back to it at thirteen minutes past two. So, rounded the safe way, the road was dry from 10.10 to 14.10: about two hours each side of low water. And again tonight, from 22.30.',
      'You left the slip at a quarter past ten. At half past, the ford was still a hand deep and running, and you all stood and waited for it. Mr Nyberg looked at a tall striped pole that stands beside the ford, and said nothing. Then he said that forty minutes was about right.',
      'It is now twenty past twelve. You are standing more than a kilometre out on the bottom of the sea, and it is the widest place you have ever been in.'
    ],
    exit: {"next":"ford","w":{"b680290d":"b817d6b5","5a1f3b5b":"e282e47c","70b06d48":"ab41ab78","5c0a7440":"db6f9a6c","cb3828c0":"6b9fa477","85a5ad2a":"c26b1a21","7a42eb6b":"212c6cf5","dae70840":"5578eb94","7b75bdcc":"2b3be6fa"}}, tags: {"m1":["62d5181d","74cd339d","4c667233"],"k1":["3e810122"],"m1_half":["df0aa0ed"],"m1_wax":["27da42af","df1bed0c","85bd55e2","c12316e0","c00ba84e"],"m2":["0cbde1b6","5ff30bee","c6c56611"],"k2":["dae6fa34"],"m2_new":["df76d59f","61fa6187"],"s1":["b58f2d00"],"s2":["9b7a655f"],"swap":["d1d4eb0f"],"lows":["f541ebb5","a6d4cdc0"]},
    sound: ['trail', { root: 50, bpm: 50, drop: ['mel', 'arp'], beds: [['sea', 0.8], ['wind', 0.5]] }],      /* open sands at low water, and a good deal to read: long notes, the sea and the wind */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('b-file') || null; told = ER.flag('b-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.arr && told.back; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#wheel').classList.toggle('ready', !!(ready() && !nextFile));
    $('#scene').classList.toggle('fog', !!nextFile);
    ER.pips((told.arr ? 1 : 0) + (told.back ? 1 : 0) + Math.min(3, ER.flag('b-stage') || 0), 5);
  }

  function hints() {
    if (nextFile) return ['go', ['The fog is here, and Mr Nyberg has the compass out. Follow his boots.']];
    if (bench && bench.isOpen()) return [['then', [
      'Dr Arroyo told you what the moon looked like last Thursday morning. The little window on the wheel shows the moon as you would see it. Turn the moon until the window matches.',
      'Or count it from the card: the card marks a half moon against Tuesday the third. Last Thursday was two days after that, so the moon had moved on two days.',
      'Then the tides. The back of the card says what kind of tides come a day or two after a half moon. Press that word.'
    ]], ['now', [
      'The card marks a new moon against Tuesday the tenth. Today is Thursday the twelfth.',
      'New moon is day 0 of the wheel. Two days later, the moon has moved on two days: a very thin moon, bright on the right. What kind of tides come a day or two after a new moon?'
    ]], ['shells', [
      'Each shell is a high water. The heights are on the front of the card: it is in your notebook. Find the two Thursdays.',
      'Last Thursday had one high water, at 12.30. Today&rsquo;s next high water is this evening, at 18.19. Drag each shell up the staff to its height. One notch of the staff is one metre.',
      'Be careful to take high waters (HW), not low ones. Then compare both shells with the top of the Rigg, which dries 4.4.'
    ]]][bench.stage()];
    if (!told.arr) return ['arr', ['Dr Arroyo is at her telescope, in the straw hat. Ask her about last Thursday, and listen to everything she saw.']];
    if (!told.back) return ['back', [
      'Mr Nyberg turned the card over before he gave it to you. The other side has something printed on it.',
      'The card is lying on the orange bag, at the front on the left. Click the card itself, not the round wheel beside it.'
    ]];
    return ['wheel', ['Mrs Hebden&rsquo;s moon wheel: the round card dial lying on the orange bag, beside the tide card.']];
  }

  function begin() {
    TIDE.mine('road', 'Today’s road', '<p>Thursday 12 June. Low water <b>12.10</b>, 0.4 m. High water 18.19, 5.2 m.</p><p>The lowest place on our road is the ford: it dries 1.6. So the road is dry from <b>10.10</b> to <b>14.10</b>, rounded the safe way. And again tonight from <b>22.30</b>.</p><p>Mr Nyberg wants forty minutes in hand today.</p>', true);
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('White, in every direction. Somewhere in it, two long notes on a horn.'); return; }
    if (told.in) { busy = false; ER.say('Selkie Scar, twenty past twelve. The white wall is a little higher than it was.'); return; }
    tell('in');
    ER.narrate([
      'Selkie Scar is a long hump of shelly sand beside the Gutter. Sixty-three seals are lying on it like wet sacks, and every one of them has turned its head to look at you. Then they go back to doing nothing.',
      'Dr Arroyo has not moved from her telescope for an hour. &ldquo;Fourteen pups,&rdquo; she says. &ldquo;And one that is twenty minutes old. I have waited six weeks for this, and now you want to take me home for my lunch.&rdquo;',
      '&ldquo;Back over the ford by half past one,&rdquo; says Mr Nyberg. He is not looking at the seals. Out beyond the bar, where the sea ought to be, there is a low white wall.',
      '&ldquo;Then we stay here, and sit out the tide on the Rigg,&rdquo; says Dr Arroyo. &ldquo;As we did last Thursday. High water came, we sat, we were dry, we went home. What is different today?&rdquo;',
      'Mr Nyberg takes the tide card out of the orange bag, turns it over, and holds it out to you. &ldquo;Show the Doctor what is different,&rdquo; he says. &ldquo;I have a wall to watch.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#arr').addEventListener('click', function (e) {
    if (busy) return;
    if (e.target.id === 'clicker') { ER.wordAt(e.clientX, e.clientY, 'tally counter'); ER.say('A tally counter: one click for each seal. It says 0063. Dr Arroyo does not trust herself to count past twenty while she is happy.'); return; }
    ER.talk({
      who: 'Dr Arroyo', role: 'Seal scientist · counting', face: window.FACE('arroyo'),
      lines: [
        { note: 'She does not take her eye from the telescope.', a: '&ldquo;Number fifteen has just discovered that it has a nose. It is very surprised. I am not leaving.&rdquo;' },
        { q: 'What happened last Thursday?', a: 'Mrs Hebden brought us out in her boat at high water. That was half past twelve: I wrote it in my book. She put us on the Rigg, the high bank over there with the post on it, and went home for her dinner. The sea came up all round us, and stopped. We had half a metre of dry sand above the highest wave. Four hours later she came back for us.' },
        { q: 'So why not sit on the Rigg today?', a: 'Exactly my question. The same bank. The same sea. If it was dry at high water last Thursday, it will be dry at high water today, and I can stay with my seals until the evening. Mr Nyberg says no. He does not say why. He says the card says why.' },
        { q: 'Did you see the moon last week?', a: 'What a question. Yes. Last Thursday I was up at five, and there was a moon in the south-east, in the daylight: less than half of it, and the bright side was on the left. And last night at midnight I was out counting with a torch, and there was no moon at all. Does a seal scientist need the moon?' },
        { a: 'So show me. I am a scientist: I do not want to be told that a thing is dangerous. I want to be shown what is different.' }
      ],
      clue: { id: 'arr2', title: 'Dr Arroyo, at her telescope', kind: 'What she said' },
      done: function (seen) { if (seen && tell('arr')) { paint(); ER.say('Last Thursday: high water at half past twelve, and half a metre of dry sand. And a moon at five in the morning.'); } }
    });
  });
  $('#nyb').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Mr Nyberg', role: 'Ranger of Tarrow · watching the weather', face: window.FACE('nyberg'),
      lines: [
        { note: 'He is looking north-east through his field glasses, out over the bar.', a: '&ldquo;That white wall is fog. It was not there at eleven. It is in no hurry. Neither was the last one, and the last one took the island in twenty minutes.&rdquo;' },
        { q: 'What is the Rigg?', a: 'The high bank, half a kilometre north of pole 7. The chart says that it dries 4.4. It is the highest sand between Tarrow and Longstrand, and people take it for a safe place. Some weeks it is.' },
        { q: 'Is the Doctor right about it?', a: 'Turn the card over. The front tells you what the sea will do. The back tells you why. Then show her on Mrs Hebden&rsquo;s moon wheel. The Doctor is a person who has to see a thing turn.' },
        { q: 'And if the fog comes in?', a: 'Then we walk back to the poles by compass: one bearing, held all the way, and no hurrying. Fog does not drown anybody. It only makes people late. The tide does the rest.' }
      ],
      clue: { id: 'nyb2', title: 'Mr Nyberg, on Selkie Scar', kind: 'What he said' },
      done: function (seen) { if (seen) tell('nyb'); }
    });
  });

  /* ---------- the other side of the card ---------- */

        var s0 = ER.state(); s0.done = s0.done || {}; s0.done.scar = 1; ER.persist(true);
        TIDE.sfx.shell(); draw();
        TIDE.mine('rigg', 'Why not the Rigg', '<p>Last Thursday was two days after the half moon: <b>neaps</b>. High water was only 3.9 m. The top of the Rigg is 4.4 m: half a metre to spare.</p><p>Today is two days after the new moon: <b>springs</b>. High water tonight is 5.2 m: 0.8 m of sea over the top of the Rigg.</p><p>(And at neaps the ford never dries at all: low water was 1.7 m. Big tides go further out AND come further in.)</p>', true);
        msg('Dr Arroyo looks at the two shells for a long time. One lies half a metre below the top of the Rigg. The other lies well above it.');
        setTimeout(function () {
          ER.closeAll(); TIDE.solved(); busy = true;
          ER.narrate([
            '&ldquo;Eighty centimetres of sea over my chair,&rdquo; says Dr Arroyo. &ldquo;So. The same bank, and not the same sea. I withdraw the Rigg. I do not withdraw my opinion that your sea is badly organised.&rdquo;',
            'She begins to fold the legs of the telescope. Then she stops, and looks up. The white wall has no top any more. It is not out beyond the bar. It is here.'
          ], function () {
            paint(); TIDE.horn({ dur: 0.7, vol: 0.05, pan: 0.6, lp: 380 }); TIDE.horn({ dur: 0.7, vol: 0.05, pan: 0.6, lp: 380, when: 1.3 });
            ER.narrate([
              'The seals go first, then the Scar, then the sky. From somewhere on your right, a long way off, comes a sound like a cow in a cellar: two long notes together, and nothing, and the two notes again. Mrs Hebden has gone up to put the horn on.',
              'Mr Nyberg takes a compass out of his pocket and looks at it once. &ldquo;Ten to one,&rdquo; he says. &ldquo;The poles. I go in front. You two stay close. Closer than that.&rdquo;'
            ], function () { busy = false; showGo(); });
          });
        }, 2800);
      }
    });
    draw();
    msg(['Mrs Hebden&rsquo;s moon wheel. Drag the moon round the Earth (or use the arrows) to where it was <b>last Thursday morning</b>, when Dr Arroyo saw it. Then say what kind of tides go with it.',
      'Now put the moon where it is <b>today</b>, and say what kind of tides go with it.',
      'Two shells, and the Rigg drawn in the sand. Drag each shell up the staff to the height of its high water.'][stage] || '');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return Math.min(stage, 2); }
    };
  }
})();
</script>
