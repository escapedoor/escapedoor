      'Today you are going out on that sand for the first time: to Selkie Scar, where the seals have their pups. There are three of you. Mr Nyberg has been the ranger of Tarrow for thirty years. Dr Arroyo is a seal scientist from Spain, who has been here since May. You are the one who was told, at breakfast, to carry the orange bag and stay close.',

    ER.drag(svg.querySelector('#i-strip'), {
      start: function () { if (stage < 2) return false; },
      move: function (e) { var p = ER.pt(svg, e); setTime(240 + (p.x - 90) * 1320 / 860); },
      end: function (e) { var p = ER.pt(svg, e); setTime(240 + (p.x - 90) * 1320 / 860); TIDE.sfx.notch(); }
    });
    nudge.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
      setTime(tm + (+b.getAttribute('data-d'))); TIDE.sfx.notch();
    });

    go.addEventListener('click', function () {
      var f, t, v, fo, to, file;
      if (nextFile) return;
      if (stage === 0) {
        if (!day) { msg('Put your finger on today&rsquo;s line of the card: click it.'); return; }
        if (!ER.check('day', day)) {
          TIDE.sfx.no();
          msg(ER.check('lastthu', day) ? '&ldquo;That is last Thursday,&rdquo; says Mrs Hebden. &ldquo;Look at its low waters: 1.7 and 1.7. The ford never came out of the sea all that day, which is why the Doctor went by boat. A week changes everything on this card.&rdquo;' :
            '&ldquo;Is that the date I chalked on the board?&rdquo; says Mrs Hebden. &ldquo;I wrote it not five minutes ago, and I said it aloud.&rdquo;');
          day = 0; ER.flag('a-day', 0); draw(); return;
        }
        TIDE.sfx.chalk(); setStage(1);
        msg('&ldquo;Thursday the twelfth,&rdquo; says Mrs Hebden, and hangs four brass tags on the board: high water 06.01, low water 12.10, high water 18.19, low water 00.28. &ldquo;Now the chart. Show me the lowest place on your road.&rdquo;');
      } else if (stage === 1) {
        if (!low) { msg('Click a figure on the chart. The ones with a line under them are heights of sand.'); return; }
        if (!ER.check('low', low)) {
          TIDE.sfx.no();
          msg(ER.check('lowroad', low) ? '&ldquo;That is the lowest place on the whole Pole Road,&rdquo; says Mr Nyberg from the doorway. &ldquo;And we are not going that far. We turn north at pole 11. Between the slip and Selkie Scar: what is the lowest?&rdquo;' :
            low === 'pool' ? '&ldquo;That figure has no line under it,&rdquo; says Mrs Hebden. &ldquo;It is not a height. It is a depth: three tenths of a metre of water, even at the lowest tide. The seals like it. Nobody walks in it.&rdquo;' :
            '&ldquo;Is there nothing lower on your road?&rdquo; says Mrs Hebden. &ldquo;The slip on Tarrow, the ford, then north beside the Gutter to Selkie Scar. The lowest place is the one that goes under first.&rdquo;');
          low = ''; ER.flag('a-low', ''); draw(); return;
        }
        TIDE.sfx.rope(); TIDE.terms(['chart', 'ford']); setStage(2);
        msg('&ldquo;The ford,&rdquo; says Mrs Hebden, and stretches a red string across the board at 1.6. &ldquo;Now slide the pointer through the day. When is the blue below my string?&rdquo;');
      } else if (stage === 2) {
        f = val(wFrom); t = val(wTo); fo = ER.check('from', f); to = ER.check('to', t);
        if (fo && to) {
          TIDE.sfx.chalk(); setStage(3); setTime(1100);
          msg('&ldquo;Ten past ten to ten past two,&rdquo; says Mr Nyberg. &ldquo;Four hours, with low water in the middle. Good. Now the half of the plan that I never need. When does the road dry again tonight?&rdquo;'); return;
        }
        TIDE.sfx.no();
        if (ER.check('hw', f) || ER.check('hw', t)) msg('&ldquo;That is a high water,&rdquo; says Mrs Hebden. &ldquo;Slide the pointer there and look at your road: five metres down. You want the two moments when the blue crosses my string.&rdquo;');
        else if (ER.check('lw', f) || ER.check('lw', t)) msg('&ldquo;Ten past twelve is low water,&rdquo; says Mr Nyberg. &ldquo;That is the middle of the dry time, not an end of it. I asked for the two ends.&rdquo;');
        else if (ER.check('from_out', f)) msg('&ldquo;Put the pointer on that first time and look,&rdquo; says Mr Nyberg. &ldquo;The blue is still above the string. You have rounded towards the sea. An opening is rounded later.&rdquo;');
        else if (ER.check('to_out', t)) msg('&ldquo;Put the pointer on that second time and look,&rdquo; says Mr Nyberg. &ldquo;The blue is over the string again. You have given the sea ten minutes of ours. A shutting is rounded earlier.&rdquo;');
        else if (fo) msg('&ldquo;The opening is right,&rdquo; says Mr Nyberg. &ldquo;Now the other end. In the afternoon the blue climbs back to the string. When? To the minute first: then round it the safe way.&rdquo;');
        else if (to) msg('&ldquo;The shutting is right,&rdquo; says Mr Nyberg. &ldquo;Now the opening. In the morning the blue drops below the string. When? To the minute first: then round it the safe way.&rdquo;');
        else msg('&ldquo;Slide the pointer,&rdquo; says Mrs Hebden. &ldquo;The road opens when the blue drops below my string, and shuts when it climbs back. Read each time to the minute. Then give Mr Nyberg his tens.&rdquo;');
      } else if (stage === 3) {
        v = val(wNight);
        if (!ER.check('night', v)) {
          TIDE.sfx.no();
          msg(ER.check('night_out', v) ? '&ldquo;Put the pointer there,&rdquo; says Mr Nyberg. &ldquo;Still a hand of blue over the string. Round an opening later, by day or by night.&rdquo;' :
            ER.check('night_lw', v) ? '&ldquo;That is tonight&rsquo;s low water,&rdquo; says Mr Nyberg. &ldquo;The road has been dry for two hours by then. I want the moment it opens.&rdquo;' :
            '&ldquo;Slide the pointer on past this evening&rsquo;s high water,&rdquo; says Mrs Hebden. &ldquo;The sea goes down again in the dark, the same as by day. When does it drop below my string?&rdquo;');
          return;
        }
        file = ER.exitOk([day + '-' + low + '-' + val(wFrom) + '-' + val(wTo) + '-' + v]);
        if (!file) { msg('The chalk has broken. Something is wrong with this page: tell your teacher.'); return; }
        nextFile = file; ER.flag('a-file', file); stage = 4; ER.flag('a-stage', 4);
        var s0 = ER.state(); s0.done = s0.done || {}; s0.done.shed = 1; ER.persist(true);
        TIDE.sfx.chalk(); draw();
        ER.addClue('chart', 'The chart of Tarrow Sands', TIDE.chart({}), 'ckey', 'From the wall of the tide shed', true);
        TIDE.mine('road', 'Today’s road', '<p>Thursday 12 June. Low water <b>12.10</b>, 0.4 m. High water 18.19, 5.2 m.</p><p>The lowest place on our road is the ford: it dries 1.6. So the road is dry from <b>10.10</b> to <b>14.10</b>, rounded the safe way. And again tonight from <b>22.30</b>.</p><p>Mr Nyberg wants forty minutes in hand today.</p>', true);
        msg('&ldquo;Half past ten tonight,&rdquo; says Mr Nyberg. &ldquo;Which we shall not need.&rdquo; He takes the chalk from Mrs Hebden, and she lets him.');
        setTimeout(function () {
          ER.closeAll(); TIDE.solved(); paint(); busy = true;
          ER.narrate([
            'Mr Nyberg chalks it on the door of the shed, for anybody who comes looking: OUT 10.15. SELKIE SCAR. BACK OVER THE FORD BY 13.30. &ldquo;Forty minutes in hand,&rdquo; he says.',
            'Mrs Hebden puts the radio with the red tape into the orange bag, and the orange bag on to your back. &ldquo;If the fog comes in, I&rsquo;ll go up and put the horn on,&rdquo; she says. &ldquo;Two blasts together. You&rsquo;ll know it&rsquo;s me.&rdquo;',
            '&ldquo;There is no fog on the card,&rdquo; says Dr Arroyo.',
            '&ldquo;There never is,&rdquo; says Mrs Hebden.'
          ], function () { busy = false; showGo(); });
        }, 2600);
      }
    });
    draw();
    msg(['The tide card, off its nail. Two weeks of tides, and one of the lines is today. Click it.',
      'The chart of Tarrow Sands. Find the lowest place on the road from the slip to Selkie Scar, and click its figure.',
      'The board is set for today, and the red string is at the ford. Slide the pointer: when is the road dry? Set the two times, rounded the safe way.',
      'Now tonight. Slide the pointer on into the evening: when does the road dry again?'][stage] || '');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return Math.min(stage, 3); }
    };
  }
})();
</script>
</body>
</html>
