  .plB{font-family:'Overpass',sans-serif;font-weight:700;font-size:14px;fill:#fff;letter-spacing:.12em}
  .cards{display:flex;flex-wrap:wrap;gap:7px;flex:1}
  .cards button{padding:7px 11px;border:1.5px solid rgba(255,255,255,.5);border-radius:3px;background:rgba(0,0,0,.35);color:#fbf3e0;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px}
  .cards button:hover{border-color:#ffb27a;color:#ffb27a}
  .cards button.on{background:#c4501c;border-color:#c4501c;color:#fff}
  .bx .pmsg{color:#fbf3e0}

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, bench = null;

  ER.init({
    theme: 'wild', story: 'dune', storyTitle: 'Four and a Half Times', id: 'creek', no: 'III', title: 'The Creek Bed',
    go: 'Walk on',
    intro: [
      'The true Southern Cross was the small bright one with the Pointers beside it, not the big faint False Cross. When it stood upright, at about eleven o&rsquo;clock, you carried its long bar on four and a half times, to an empty place in the sky. Straight below that was south, and you marked it with a row of stones. The empty place stood 25 degrees above the horizon: so you are 25 degrees south of the equator.',
      'Friday, twenty to nine in the morning. At first light you left a note on the truck, and a big arrow of stones on the ground beside it, and set off along a dry creek bed towards a low red cliff in the west: a breakaway, where there will be shade all day, and flat ground for Mr Strachan&rsquo;s noon.',
      'It is already hot. The radio said thirty-four degrees.'
    ],
    exit: {"next":"overhang","w":{"fa5f8921":"00c2dfe5","b3560527":"b4ff278e","3f8e18ba":"98001cb9"}}, tags: {"what":["854915fb"],"stroke":["ed1830ed"],"tired":["ebfb431c"],"care":["0ab6aa30"],"drink":["9768d44c"],"less":["c0c797af","a03e6763"],"leave":["89b44c07","de96f431","42b33f9c"],"late":["7f3b4f6b","4cf595a8","e6ba57ff","c5158434","6c918c88","abbdabdb"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function stage() { return ER.flag('c-stage') || 0; }
  function paint() {
    $('#str').classList.toggle('ready', !!(told.book && told.hay && stage() < 2 && !nextFile));
    $('#map').classList.toggle('ready', !!(stage() >= 2 && !nextFile));
    ER.pips((told.book ? 1 : 0) + (told.hay ? 1 : 0) + Math.min(3, stage()) + (nextFile ? 1 : 0), 6);
  }
  function showGo() { $('#go').classList.add('on'); }

  function hints() {
    if (nextFile) return ['go', ['Mr Strachan has drunk his water and the plan is made. Walk on to the breakaway, into the shade.']];
    if (bench && bench.isOpen()) return bench.hint();
    if (!told.book) return ['book', [
      'Something is wrong with Mr Strachan, and the booklet has a page about heat. Read it first.',
      'The booklet is lying open on the green pack, in the middle of the creek bed. Click it.'
    ]];
    if (!told.hay) return ['hay', ['Dr Hayashi is kneeling beside Mr Strachan with a bottle of water. Ask her what has happened.']];
    if (stage() < 2) return ['str', ['Look closely at Mr Strachan, under the gum tree. Click him.']];
    return ['map', ['Now the plan for the rest of the day. Mr Strachan has drawn it on the back of the map, lying in the creek bed. Click the map.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The creek bed, after nine. Mr Strachan is on his feet again, more or less, and complaining, which is a good sign.'); return; }
    if (told.in) { busy = false; ER.say('The creek bed. The shade of the big gum is the only cool thing for a kilometre.'); return; }
    tell('in');
    ER.narrate([
      'The creek has not seen water for months. Its bed is white sand between red banks, with big gum trees along it, white trunks and grey leaves, and a breakaway at the end of it like a wall somebody started and gave up.',
      'Half way along, Mr Strachan sat down in the shade of a gum and did not get up again.',
      '&ldquo;Five minutes,&rdquo; he says. &ldquo;Just a breather.&rdquo; He has said that three times. Dr Hayashi is kneeling beside him with a bottle of water. The flies have found all three of you.'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#hay').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Dr Hayashi', role: 'Kneeling in the shade, with a bottle', face: window.FACE('hayashi'),
      lines: [
        { note: 'She has her hat pulled down and her sleeves buttoned at the wrist, which makes her look as if she is going to an office.', a: '&ldquo;He is not well. He says he is. He has said it in three ways, and none of them was convincing.&rdquo;' },
        { q: 'What happened?', a: 'We walked for two hours on a bad ankle, and he gave his water to us. Every time I offered him the bottle, he said, &ldquo;You first, you&rsquo;re not used to it.&rdquo; He thinks it is good manners. I think it is arithmetic.' },
        { q: 'How much water do we have?', a: 'Fifteen litres, for three people, until the aeroplane comes on Saturday morning. I have counted it twice. It will not count itself into more.' },
        { q: 'Shouldn&rsquo;t we save it?', a: 'That is what he says. Drink a little, save the rest. It sounds very wise. The booklet does not agree with him, and the booklet was written by people who have found the ones who saved it.' }
      ],
      clue: { id: 'hay3', title: 'Dr Hayashi, in the creek bed', kind: 'What she said' },
      done: function (seen) { if (seen && tell('hay')) { paint(); ER.say('Mr Strachan says something about fuss, without opening his eyes.'); } }
    });
  });

  /* ---------- the booklet ---------- */
  var BOOK = '<h4><small>Outback Travel &middot; a booklet for drivers</small>Water and heat</h4><div class="two"><div>' +
    '<p><b>How much?</b> On a hot day (about 35 &deg;C) a person sitting still in the shade needs four or five litres of water a day. Walking in the sun, you need a litre an hour, often more. Walking in the cool of the evening or the night needs less than half of that.</p>' +
    '<p class="rule">Ration sweat, not water.</p>' +
    '<p>The water that keeps you alive is the water inside you, not the water in the bottle. Drink when you are thirsty, and do not save it for later. Save sweat instead:</p>' +
    '<ul><li>Move in the cool hours: early morning, evening, the first part of the night. Rest through the heat of the day.</li>' +
    '<li>Keep in the shade, a little off the hot ground.</li>' +
    '<li>Keep covered: a hat, long sleeves. Clothes shade your skin and keep the sweat where it cools you.</li>' +
    '</ul>' +
    '<p><b>Watch each other.</b> The first signs of <b>heat exhaustion</b>: a headache, dizziness, feeling sick, cramps, weakness, pale damp skin. Stop at once: shade, water, a wet cloth. Someone hot and confused may have <b>heat stroke</b>: cool them now. It is an emergency.</p></div>' +
    '<div><svg viewBox="0 0 280 300"><rect width="280" height="300" fill="#fffaf0"/><path d="M20 230A120 120 0 0 1 260 230" fill="none" stroke="#d9661f" stroke-width="2.500" stroke-dasharray="6 5"/>' +
    '<circle cx="140" cy="110" r="16" fill="#f0b030"/><path d="M60 170A90 90 0 0 1 220 170" fill="none" stroke="#c4501c" stroke-width="10" opacity=".35"/>' +
    '<path d="M10 230H270" stroke="#6b5a3a" stroke-width="2"/>' +
    '<g font-family="Oswald,sans-serif" font-size="15" fill="#1f1d18" text-anchor="middle"><text x="40" y="256">MOVE</text><text x="140" y="256">REST IN THE SHADE</text><text x="240" y="256">MOVE</text></g>' +
    '<g font-family="Overpass,sans-serif" font-size="11" fill="#5a4a2a" text-anchor="middle"><text x="40" y="274">early morning</text><text x="140" y="274">the heat of the day</text><text x="240" y="274">evening, night</text></g>' +
    '<g transform="translate(140 196)"><path d="M-8 -26q8 -10 16 0l2 24h-20z" fill="#5e4026"/><path d="M-22 -26h44" stroke="#5e4026" stroke-width="4"/><path d="M-10 -2h20v28h-20z" fill="#a8956a"/></g></svg></div></div>' +
    '<p class="pg">page 9</p>';
  $('#book').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BOOK, cls: 'book', clue: { id: 'book3', title: 'Water and heat', kind: 'The booklet in the glovebox' }, done: function () {
      DUNE.terms(['ration', 'sweat', 'heat exhaustion', 'heat stroke']);
      if (tell('book')) { paint(); ER.say('Pale, damp skin. You look at Mr Strachan, and then you look again.'); }
    } });
  });

  /* ---------- things ---------- */
  DUNE.thing('#gum', 'gum tree', 'A river red gum: a tree that grows along creeks that are dry nearly all the time, and drinks from water deep under the sand. Its shade is thin, and moves round the trunk as the sun moves. It is the best shade for a kilometre.', isBusy);
  DUNE.thing('#breakaway', 'breakaway', 'The breakaway: a low cliff of red rock where the flat country has broken off and fallen away. About a kilometre on. There is a dark place at its foot that could be an overhang.', isBusy);
  DUNE.thing('#tracks', null, 'Tracks in the sand: four feet and a long tail dragged between them. A goanna, a big lizard, came down the creek before you this morning. It had more sense than to stay out in the sun.', isBusy);
  DUNE.thing('#bottles', null, function () { return 'The water: a jerrycan with about twelve litres in it, and two bottles. Fifteen litres altogether.' + (stage() >= 2 ? ' Mr Strachan&rsquo;s bottle is half empty now, which is the best news of the morning.' : ''); }, isBusy);
  DUNE.thing('#kite', null, 'A brown bird of prey, circling very high, without moving its wings. It is riding the hot air going up. Mr Strachan would say that it is the only one of you navigating properly.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#str').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Don&rsquo;t look at me like that,&rdquo; says Mr Strachan. &ldquo;I have drunk it. I have drunk it all, and I feel a great deal better, and I am not going to say so twice.&rdquo;'); return; }
    if (!told.book) { ER.say('&ldquo;Five minutes,&rdquo; says Mr Strachan, with his eyes shut. You should find out what the booklet says about heat before you argue with him.'); return; }
    if (!told.hay) { ER.say('Dr Hayashi looks up at you, and then at Mr Strachan, as if she wants to tell you something.'); return; }
    if (!bench) bench = makeBench();
    bench.open();
  });
  $('#map').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The plan, on the back of the map: rest in the shade through the heat, and walk at ' + DUNE.clock(ER.flag('c-leave') || 1020) + '.'); return; }
    if (stage() < 2) { ER.say('The map. &ldquo;Plans later,&rdquo; says Dr Hayashi. &ldquo;Look at him first.&rdquo;'); return; }
    if (!bench) bench = makeBench();
    bench.open(2);
  });

  /* ---------- the signs, what to do, and the plan for the day ---------- */
  function makeBench() {
    var stg = Math.min(stage(), 2), box = ER.el('div', 'bx'), found = ER.flag('c-found') || {}, care = {}, leave = ER.flag('c-leave') || 13 * 60, drink = ER.flag('c-drink') || '',
      SIGNS = { head: 'He keeps rubbing his forehead. &ldquo;A bit of a head, that&rsquo;s all.&rdquo;', skin: 'Under the sunburn his face has gone grey and pale, and his skin is cold and damp with sweat, in this heat.',
        leg: 'His good leg jerks, and he grabs the calf and says a word you will not repeat: cramp.', eyes: '&ldquo;The trees are going round a bit,&rdquo; he says. &ldquo;They&rsquo;ll stop in a minute.&rdquo; He is dizzy.',
        bottle: 'His water bottle. It is full. He has not had a drink since the truck: he has been giving his water to you two all morning.', hat: 'His hat, on his head, where it should be. That at least is right.' },
      s, i, svg2, svg3;
    var SIGN_N = ['head', 'skin', 'leg', 'eyes', 'bottle'];
    s = '<div class="pane" id="d-close"><svg class="cl" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="#cdb88e"/><path d="M0 330Q300 300 600 330T1000 320V470H0Z" fill="#d9b984"/>' +
      '<path d="M120 470Q100 200 170 40L240 0H330L300 120Q280 300 320 470Z" fill="#e3dbc8"/><g fill="#b9ae96" opacity=".6"><ellipse cx="220" cy="200" rx="14" ry="34"/><ellipse cx="250" cy="330" rx="10" ry="26"/></g>' +
      '<g transform="translate(420 30)"><path d="M-60 440Q-70 280 0 250L80 236H170L250 250Q320 280 310 440Z" fill="#a8956a"/><path d="M60 238l60 70l60 -70z" fill="#c23b26"/>' +
      '<path d="M100 238v200" stroke="#8a7a52" stroke-width="2"/><path d="M258 270q60 60 40 150" stroke="#a08c60" stroke-width="40" fill="none" stroke-linecap="round"/>' +
      '<rect x="98" y="190" width="44" height="54" fill="#c9a888"/><ellipse cx="120" cy="140" rx="70" ry="80" fill="#d8bba0"/><path d="M60 150q60 30 120 0" stroke="#c9a888" stroke-width="2" fill="none"/>' +
      '<path d="M78 178q22 -12 42 -3q20 -9 42 3q-4 16 -18 12q-12 -3 -24 -6q-12 3 -24 6q-14 4 -18 -12z" fill="#efeee8"/><path d="M104 198q16 -3 32 0" stroke="#8a4a3c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M90 128q10 -6 22 0M128 128q10 -6 22 0" stroke="#2a1a10" stroke-width="3.500" stroke-linecap="round"/><path d="M84 112q14 -8 28 -2M128 110q14 -6 28 2" stroke="#efeee8" stroke-width="7" stroke-linecap="round"/>' +
      '<path d="M70 96q12 6 22 2M146 98q12 4 22 -2" stroke="#a87250" stroke-width="2" fill="none"/>' +
      '<g fill="#8ab0cc"><circle cx="72" cy="120" r="5"/><circle cx="168" cy="110" r="4"/><circle cx="96" cy="170" r="3.500"/><circle cx="150" cy="176" r="3"/><circle cx="120" cy="90" r="3"/></g>' +
      '<path d="M10 90q110 -40 220 0l-6 14q-104 -32 -208 0z" fill="#5e4026"/><path d="M52 92q4 -66 68 -66q64 0 68 66z" fill="#6f4c2c"/>' +
      '<path d="M-20 300q-60 30 -40 110" stroke="#a08c60" stroke-width="40" fill="none" stroke-linecap="round"/><circle cx="-60" cy="420" r="18" fill="#c9a888"/></g>' +
      '<path d="M520 470L700 360l200 30" stroke="#625840" stroke-width="56" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="920" cy="392" rx="34" ry="28" fill="#efeee8"/>' +
      '<g transform="translate(330 330)"><rect width="46" height="92" rx="10" fill="#7a8a9a"/><rect x="10" y="-16" width="26" height="18" fill="#c8321e"/><path d="M6 20h34" stroke="#9aaabb" stroke-width="3"/></g>' +
      '<g id="d-rings"></g>' +
      '<ellipse class="spot" data-s="head" cx="540" cy="122" rx="62" ry="24"/><ellipse class="spot" data-s="eyes" cx="540" cy="160" rx="56" ry="16"/><ellipse class="spot" data-s="skin" cx="488" cy="196" rx="22" ry="26"/>' +
      '<ellipse class="spot" data-s="skin" cx="592" cy="196" rx="22" ry="26"/><ellipse class="spot" data-s="leg" cx="740" cy="380" rx="120" ry="50"/><ellipse class="spot" data-s="bottle" cx="353" cy="380" rx="38" ry="64"/><ellipse class="spot" data-s="hat" cx="540" cy="70" rx="110" ry="30"/>' +
      '<text class="clT" x="20" y="452">Click what you see. Signs found: <tspan id="d-n">0</tspan></text></svg></div>';
    s += '<div class="pane" id="d-plan"><svg class="pl" viewBox="0 0 1000 400"></svg></div>';
    box.innerHTML = '<div class="frame">' + s + '</div><div class="bx-foot"><p class="pmsg"></p><span class="cards" id="d-cards"></span><button type="button" class="btn" id="d-go"></button></div>';
    var msgEl = box.querySelector('.pmsg'), go = box.querySelector('#d-go'), cards = box.querySelector('#d-cards');
    svg2 = box.querySelector('svg.cl'); svg3 = box.querySelector('svg.pl');
    function msg(x) { msgEl.innerHTML = ER.gloss(x); }
    function nFound() { return SIGN_N.filter(function (k) { return found[k]; }).length; }
    function drawRings() {
      var o = '';
      ER.$$('.spot', svg2).forEach(function (sp) { var k = sp.getAttribute('data-s'); if (found[k] && !o.match('data-k="' + k + '"')) o += '<ellipse class="found" data-k="' + k + '" cx="' + sp.getAttribute('cx') + '" cy="' + sp.getAttribute('cy') + '" rx="' + sp.getAttribute('rx') + '" ry="' + sp.getAttribute('ry') + '"/>'; });
      svg2.querySelector('#d-rings').innerHTML = o; svg2.querySelector('#d-n').textContent = nFound();
      svg2.setAttribute('data-found', nFound());
    }
    svg2.addEventListener('click', function (e) {
      var sp = e.target.closest ? e.target.closest('.spot') : null, k;
      if (!sp || stg !== 0) return;
      k = sp.getAttribute('data-s');
      if (SIGN_N.indexOf(k) >= 0 && !found[k]) { found[k] = 1; ER.flag('c-found', found); DUNE.sfx.pencil(); }
      draw(); msg(SIGNS[k]);
    });

    /* the plan: Friday 09.00 to Saturday 07.30, forty pixels an hour */
    var T0 = 9 * 60, T1 = 31 * 60 + 30, WALK = 240, NOON = [10 * 60, 13 * 60 + 30], X0 = 50;
    function PX(m) { return X0 + (m - T0) * 900 / (T1 - T0); }
    function hot(m) { return m >= 9 * 60 && m < 17 * 60; }
    function rate(m, walking) { return walking ? (hot(m) ? 1.0 : 0.4) : (hot(m) ? 0.2 : 0.1); }
    function water(l, dr) {          /* litres left at each half hour, for three people */
      var w = 15, out = [[T0, w]], m, k = dr === 'need' ? 1 : dr === 'half' ? 0.5 : dr === 'cup' ? 0.25 / 0.4 : 1, empty = null;
      for (m = T0; m < T1; m += 30) {
        var walking = m >= l && m < l + WALK, use = rate(m, walking) * 3 * 0.5, drunk = dr === 'cup' ? Math.min(use, 0.25 * 3 * 0.5) : use * (dr === 'half' ? 0.5 : 1);
        w -= drunk; if (w <= 0 && empty == null) empty = m + 30; out.push([m + 30, Math.max(0, w)]);
      }
      return { pts: out, left: w, empty: empty };
    }
    function drawPlan() {
      var o = '<rect width="1000" height="400" fill="#efe6cf"/>', m, h, w = water(leave, drink || 'need'), y0 = 330, sc = 14;
      o += '<text class="plC" x="40" y="40">Friday into Saturday &middot; 15 litres &middot; three of us</text>';
      o += '<rect x="' + PX(9 * 60) + '" y="70" width="' + (PX(17 * 60) - PX(9 * 60)) + '" height="' + (y0 - 70) + '" fill="#e08a5a" opacity=".22"/>' +
        '<rect x="' + PX(17 * 60 + 30) + '" y="70" width="' + (PX(30 * 60) - PX(17 * 60 + 30)) + '" height="' + (y0 - 70) + '" fill="#3a3e5a" opacity=".14"/>' +
        '<text class="plS" x="' + ((PX(9 * 60) + PX(17 * 60)) / 2) + '" y="86" text-anchor="middle">THE HEAT OF THE DAY</text><text class="plS" x="' + ((PX(17 * 60 + 30) + PX(30 * 60)) / 2) + '" y="86" text-anchor="middle">NIGHT</text>' +
        '<rect x="' + PX(NOON[0]) + '" y="96" width="' + (PX(NOON[1]) - PX(NOON[0])) + '" height="26" rx="3" fill="#8a7a52"/><text class="plB" x="' + ((PX(NOON[0]) + PX(NOON[1])) / 2) + '" y="114" text-anchor="middle">NOON SIGHT</text>';
      for (h = 0; h <= 15; h += 3) o += '<path d="M' + X0 + ' ' + (y0 - h * sc) + 'H950" stroke="#c9bc98" stroke-width="1"/><text class="plS" x="' + (X0 - 6) + '" y="' + (y0 - h * sc + 4) + '" text-anchor="end">' + h + '</text>';
      o += '<text class="plS" x="' + (X0 - 6) + '" y="' + (y0 - 15 * sc - 14) + '" text-anchor="end">litres</text>';
      o += '<path d="M' + w.pts.map(function (p) { return PX(p[0]).toFixed(1) + ' ' + (y0 - p[1] * sc).toFixed(1); }).join('L') + '" stroke="#2d5a73" stroke-width="3" fill="none"/>';
      if (w.empty) o += '<g transform="translate(' + PX(w.empty).toFixed(1) + ' ' + y0 + ')"><path d="M-8 -8l16 16M8 -8l-16 16" stroke="#c8321e" stroke-width="3.500"/><text class="plC" y="-16" text-anchor="middle" style="fill:#c8321e">empty</text></g>';
      o += '<path d="M' + X0 + ' ' + y0 + 'H950" stroke="#3a2e1a" stroke-width="2"/>';
      for (m = T0; m <= T1; m += 60) { o += '<path d="M' + PX(m).toFixed(1) + ' ' + y0 + 'v' + ((m / 60) % 3 ? 6 : 12) + '" stroke="#3a2e1a" stroke-width="1.500"/>'; if ((m / 60) % 3 === 0) o += '<text class="plT" x="' + PX(m).toFixed(1) + '" y="' + (y0 + 28) + '" text-anchor="middle">' + DUNE.clock(m) + '</text>'; }
      o += '<g id="d-walk" class="tool"><rect x="' + PX(leave).toFixed(1) + '" y="132" width="' + (PX(leave + WALK) - PX(leave)).toFixed(1) + '" height="34" rx="4" fill="#c4501c"/><text class="plB" x="' + ((PX(leave) + PX(leave + WALK)) / 2).toFixed(1) + '" y="155" text-anchor="middle">WALK &middot; 4 HOURS</text></g>' +
        '<text class="plT" x="' + PX(leave).toFixed(1) + '" y="182" text-anchor="middle">' + DUNE.clock(leave) + '</text>';
      o += '<text class="plC" x="960" y="40" text-anchor="end">left at 07.30: ' + Math.max(0, w.left).toFixed(1) + ' l</text>';
      svg3.innerHTML = o; svg3.setAttribute('data-leave', leave); svg3.setAttribute('data-left', w.left.toFixed(2));
    }
    var dx0 = 0, l0 = 0;
    ER.drag(svg3, {
      start: function (e) { if (stg !== 2 || !(e.target.closest && e.target.closest('#d-walk'))) return false; dx0 = ER.pt(svg3, e).x; l0 = leave; },
      move: function (e) { var v = l0 + (ER.pt(svg3, e).x - dx0) * (T1 - T0) / 900; leave = Math.round(DUNE.clamp(v, T0, T1 - WALK) / 30) * 30; drawPlan(); },
      end: function () { ER.flag('c-leave', leave); DUNE.sfx.notch(); }
    });
    var CARE = [['shade', 'Into the shade'], ['drink', 'Drink his water now'], ['cloth', 'A wet cloth on his neck'], ['save', 'Save his water for later'], ['walk', 'Walk on: it&rsquo;s only a kilometre'], ['hat', 'Take his hat off']],
      DRINK = [['need', 'Drink as much as we need'], ['half', 'Half of that'], ['cup', 'A cup an hour each']];
    function draw() {
      box.querySelector('#d-close').classList.toggle('on', stg < 2);
      box.querySelector('#d-plan').classList.toggle('on', stg === 2);
      var c = '';
      if (stg === 0 && nFound() >= 4) c = '<button type="button" data-v="tired">Just tired</button><button type="button" data-v="exh">Heat exhaustion</button><button type="button" data-v="stroke">Heat stroke</button>';
      if (stg === 1) c = CARE.map(function (x) { return '<button type="button" data-v="' + x[0] + '"' + (care[x[0]] ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('');
      if (stg === 2) c = DRINK.map(function (x) { return '<button type="button" data-v="' + x[0] + '"' + (drink === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('');
      cards.innerHTML = c;
      go.style.display = stg === 0 ? 'none' : '';
      go.textContent = stg === 1 ? 'Do it' : 'That is the plan';
      msgEl.style.display = stg === 2 ? '' : '';
      if (stg === 2) drawPlan();
      drawRings();
    }
    cards.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null, v; if (!b) return;
      v = b.getAttribute('data-v'); DUNE.sfx.click();
      if (stg === 0) {
        if (ER.check('what', v)) {
          stg = 1; ER.flag('c-stage', 1); paint(); draw();
          msg('&ldquo;Heat exhaustion,&rdquo; says Dr Hayashi quietly. &ldquo;The first signs, as the page says. So: what do we do, now, before it becomes something worse?&rdquo; Choose everything that should be done, and only that.');
          return;
        }
        DUNE.sfx.no();
        msg(ER.check('stroke', v) ? 'Heat stroke is when somebody is hot, red and confused. He is pale, damp and grumpy, but he knows exactly who you are and is being rude about it. Not that, yet: and we mean to keep it that way.' :
          'Tired people do not go grey and damp, and get cramp, and see trees going round. The booklet has a name for these signs.');
        return;
      }
      if (stg === 1) { care[v] = !care[v]; draw(); return; }
      if (stg === 2) { drink = v; ER.flag('c-drink', v); draw(); }
    });
    go.addEventListener('click', function () {
      var c, w;
      if (stg === 1) {
        c = Object.keys(care).filter(function (k) { return care[k]; }).sort().join('+');
        if (!c) { msg('Choose what to do: click the cards. You can choose more than one.'); return; }
        if (ER.check('care', c)) {
          stg = 2; ER.flag('c-stage', 2); ER.flag('c-care', c); paint(); draw(); DUNE.sfx.water();
          msg('He drinks the whole bottle, slowly, with a wet scarf round his neck and his back against the cool side of the trunk. After twenty minutes the trees stop going round. &ldquo;Now the plan,&rdquo; says Dr Hayashi, and spreads the map, blank side up. Drag the WALK bar to the time you will set off for the pan, and choose how you will drink.');
          return;
        }
        DUNE.sfx.no();
        msg(care.save ? '&ldquo;Ration sweat, not water,&rdquo; says Dr Hayashi, tapping the booklet. &ldquo;Water in a bottle has never cooled anybody down. It is the water inside him that counts.&rdquo;' :
          care.walk ? '&ldquo;In this heat? Now?&rdquo; says Dr Hayashi. &ldquo;The page says stop at once. A kilometre in the sun is a long way for a man who sees trees going round.&rdquo;' :
          care.hat ? '&ldquo;Keep covered,&rdquo; says Dr Hayashi. &ldquo;His hat is the only shade he carries. It stays on.&rdquo;' :
          'Not everything yet. The booklet says what to do at once, and it is three things.');
        return;
      }
      if (stg === 2) {
        if (!drink) { msg('Choose how you will drink, too: click one of the cards.'); return; }
        c = 'exh|' + (ER.flag('c-care') || '') + '|' + drink + '|' + DUNE.two(Math.floor(leave / 60) % 24) + DUNE.two(leave % 60);
        if (ER.exitOk([c])) {
          nextFile = ER.exit([c], { wait: true }); ER.flag('c-file', nextFile); stg = 3; ER.flag('c-stage', 3); draw(); go.style.display = 'none';
          w = water(leave, drink);
          DUNE.mine('day', 'The plan for the day', '<p>Mr Strachan had the first signs of <b>heat exhaustion</b>: a headache, dizziness, cramp, pale damp skin, and a full bottle. Shade, water, a wet cloth.</p>' +
            '<p>Ration sweat, not water: <b>drink what we need</b>. Rest in the shade of the breakaway through the heat of the day, with the noon sight in the middle of it. Walk to the pan in the cool, at <b>' + DUNE.clock(leave) + '</b>, four hours.</p><p>That leaves about ' + w.left.toFixed(1) + ' litres at 07.30 on Saturday.</p>', true);
          msg('&ldquo;Rest through the heat, walk in the cool, and drink like sensible people,&rdquo; says Dr Hayashi. &ldquo;Duncan, the booklet has decided. You may sulk in the shade.&rdquo;');
          setTimeout(function () {
            ER.closeAll(); paint(); busy = true;
            ER.narrate([
              'Mr Strachan reads the plan upside down, and then the right way up. &ldquo;I was going to say exactly that,&rdquo; he says.',
              'By half past nine the three of you are under the breakaway, in a deep shadow where the rock leans out over the sand like the brim of a hat. It is ten degrees cooler there. Mr Strachan lies down with his foot on a stone, and asks for the metre stick.'
            ], function () { busy = false; showGo(); });
          }, 2800);
          return;
        }
        DUNE.sfx.no();
        w = water(leave, drink);
        var overNoon = leave < NOON[1] && leave + WALK > NOON[0], before = leave + WALK <= NOON[0] || leave < NOON[0], inHeat = leave < 17 * 60 && leave + WALK > 9 * 60;
        msg(ER.check('less', drink) ? 'Look at the line: the water lasts. Look at Mr Strachan: that is what drinking less does to a person in this heat. Ration sweat, not water. Drink what you need, and save sweat instead.' :
          overNoon ? 'You cannot be walking at noon: the noon sight is how we find out where the pan is. The walk has to come after it.' :
          before ? '&ldquo;Walk where?&rdquo; says Dr Hayashi. &ldquo;We will not know which way the pan is until noon.&rdquo;' :
          w.empty ? 'Look where the line ends: the water runs out before the plane comes. Walking in the heat of the day costs a litre an hour each.' :
          inHeat ? 'The water lasts, but part of the walk is in the heat of the day, with a man who had heat exhaustion this morning. Move in the cool hours.' :
          ER.check('late', DUNE.two(Math.floor(leave / 60) % 24) + DUNE.two(leave % 60)) ? 'So late? Four hours from then is the middle of the night, and the plane comes at half past seven: you need to arrive, and sleep, and be ready at dawn. The first part of the night is the time to walk.' :
          'Something does not fit the booklet. Rest in the heat, move in the cool, drink what you need.');
      }
    });
    draw();
    msg(stg === 0 ? 'Mr Strachan, close to. Watch him, as the booklet says. Click what you see.' : stg === 1 ? 'Heat exhaustion: the first signs. Choose everything that should be done, and only that.' : 'The plan for the rest of the day, on the back of the map. Drag the WALK bar to when you set off for the pan, and choose how you will drink.');
    return {
      open: function (n) { if (n === 2 && stg < 2) n = stg; ER.open('ov-lock', box); draw(); },
      isOpen: function () { return !!box.parentNode; },
      hint: function () {
        return [['signs', [
          'Click different parts of Mr Strachan: his face, his skin, his legs, his eyes, his water bottle. What does each one tell you?',
          'The booklet lists the first signs of heat illness: a headache, dizziness, feeling sick, cramps, weakness, pale damp skin.',
          'He has a headache, he is dizzy, he has cramp, and his skin is pale and damp. Which name does the booklet give to that?'
        ]], ['care', [
          'The booklet says what to do at once when somebody shows the first signs. It is three things.',
          'Shade, water, a wet cloth. And remember the rule in the box: ration sweat, not water.'
        ]], ['plan', [
          'Drag the WALK bar along the strip to choose when you set off for the pan. Then choose how you will drink. Watch the blue line: it is the water.',
          'The booklet: move in the cool hours, rest through the heat of the day, and drink what you need. The heat of the day is shaded red. And the noon sight must come first.',
          'Set off when the heat is over, between five and six in the evening, and drink as much as you need: the water lasts until the plane comes.'
        ]]][Math.min(stg, 2)];
      }
    };
  }
})();
</script>
