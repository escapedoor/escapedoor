<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, bench = null;
  var COLOR = { k08: '#ffb27a', k01: '#fff0c8', k50: '#ff9a6a', k25: '#f4f6ff', k02: '#e8eeff' };

  /* ---------- the sky behind the scene, at ten past nine ---------- */
  function band(P, w, l0, l1) {
    var up = DUNE.galactic(w, l0, l1, 2), dn = DUNE.galactic(-w, l0, l1, 2).reverse(), L = DUNE.lst(21 * 60 + 10), pts = [];
    up.concat(dn).forEach(function (q) { var a = DUNE.altaz(q[0], q[1], L), p = P(a[0], a[1]); if (p) pts.push(p[0].toFixed(0) + ' ' + p[1].toFixed(0)); });
    return pts.length > 2 ? '<path d="M' + pts.join('L') + 'Z"/>' : '';
  }
  (function () {
    var P = DUNE.view(180, 30, 520, 800, 350), L = DUNE.lst(21 * 60 + 10), s = '', r = DUNE.rnd(19), i, a, p, x, y;
    $('#mw').innerHTML = '<g fill="#c8d0f0" opacity=".08">' + band(P, 9, 200, 360) + '</g><g fill="#dde4ff" opacity=".1">' + band(P, 4, 200, 360) + '</g>';
    for (i = 0; i < 260; i++) { x = -700 + r() * 3000; y = -380 + r() * 1020; s += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + (0.5 + r() * 0.8).toFixed(1) + '" fill="#e6e8f6" opacity="' + (0.25 + r() * 0.45).toFixed(2) + '"/>'; }
    DUNE.SOUTH.forEach(function (q, k) {
      a = DUNE.altaz(q[1], q[2], L); if (a[0] < 1) return; p = P(a[0], a[1]); if (!p || p[1] > 700) return;
      s += (q[3] < 1.2 ? '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (14 - q[3] * 4).toFixed(1) + '" fill="' + (COLOR[q[0]] || '#f3f4fc') + '" opacity=".14"/>' : '') + '<circle class="tw' + (k % 3 === 1 ? ' b' : k % 3 === 2 ? ' c' : '') + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (DUNE.starR(q[3]) * 1.35).toFixed(1) + '" fill="' + (COLOR[q[0]] || '#f3f4fc') + '"/>';
    });
    ['lmc', 'smc'].forEach(function (k) { var c = DUNE.PATCH[k]; a = DUNE.altaz(c[0], c[1], L); p = P(a[0], a[1]); if (p) s += '<ellipse cx="' + p[0].toFixed(0) + '" cy="' + p[1].toFixed(0) + '" rx="' + (c[2] * 5) + '" ry="' + (c[3] * 4.5) + '" fill="#cfd6f2" opacity=".08" filter="url(#soft)"/>'; });
    $('#st').innerHTML = s;
  })();

  ER.init({
    theme: 'wild', story: 'dune', storyTitle: 'Four and a Half Times', id: 'crest', no: 'II', title: 'The Dune Crest',
    go: 'Climb to the top',
    intro: [
      'The light in the north-west was Venus. It did not flash, and in ten minutes it sank towards the dune together with the stars beside it, keeping its place among them: a planet, not an aircraft. The flare is still in its tube. Tolliver Downs came in on 4.4 megahertz, because by night a short-wave station goes low. At the long pip it was seven o&rsquo;clock: Mr Strachan&rsquo;s watch said 11.00, because it keeps UTC; Dr Hayashi&rsquo;s said 20.00, because it keeps Tokyo time; and yours said 18.56, four minutes slow.',
      'The plane will fly the north shore of Sixpenny Pan on Saturday at half past seven in the morning. To be there, you have to know where &ldquo;here&rdquo; is.',
      'It is ten past nine. The dune behind the truck is steep and soft, and Mr Strachan climbs it on his bottom, backwards, with the spade, refusing all help in a voice that carries a long way in the desert.'
    ],
    exit: {"next":"creek","w":{"58fc21d8":"6c042217"}}, tags: {"cross":["94d35dad"],"false":["742fd427"],"bar":["f23c30b5"],"bar_up":["f79e04d4"],"bar_short":["2c5ded69","933cedf8"],"mult":["1d5d0cb1"],"short":["85ef578b","f8226959","64ca016f","4d811648","cef0aaed"],"long":["b0540051","288bf5aa","290d8be6"],"south":["bbdd97dd","1579795b","de30e956","b28c585e","f55e4570","d8e772b6","5874ba76","dc382370","ac220e06","2845bec5","4a08055c","8600b674"],"lat":["29ea0882"],"lat_tilt":["d70ea75c","4c5953f3"],"lat_comp":["5f326676","741dfcc7","634f61f8","468d3fee"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('b-file') || null; told = ER.flag('b-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#sky').classList.toggle('ready', !!(told.str && told.page && !nextFile));
    ER.pips((told.str ? 1 : 0) + (told.hay ? 1 : 0) + (told.page ? 1 : 0) + Math.min(5, ER.flag('b-stage') || 0) + (nextFile ? 1 : 0), 9);
  }
  function showGo() { $('#go').classList.add('on'); }

  function hints() {
    if (nextFile) return ['go', ['South is marked with stones, and you know your latitude. Go down to the truck and sleep.']];
    if (bench && bench.isOpen()) return bench.hint();
    if (!told.str) return ['str', ['Mr Strachan is sitting on the crest with the spade across his knees. Ask him what the sky can tell you.']];
    if (!told.page) return ['page', [
      'Everything you need is on a page of Mr Strachan&rsquo;s notebook.',
      'The notebook is lying open on the sand in the red light of the torch, in front of you. Click it.'
    ]];
    if (!told.hay) return ['hay', ['Dr Hayashi is lying on her back on the crest, counting meteors. She has seen something you should know about.']];
    return ['sky', ['Now the sky itself. Click anywhere in the stars.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The crest, near eleven. A short row of stones points south along the sand.'); return; }
    if (told.in) { busy = false; ER.say('The crest of the dune, under more stars than you knew there were.'); return; }
    tell('in');
    ER.narrate([
      'From the top of the dune you can see the whole sky at once, from edge to edge, and it is full. The Milky Way goes over from one side of the world to the other like smoke from a very long fire.',
      'Below you, in the hollow, the lamp by the truck is the only light on Earth.',
      'Mr Strachan sits down on the crest facing the way he says is south, more or less, with his bad leg out in front of him. &ldquo;More or less,&rdquo; he says, &ldquo;is not good enough. Not out here.&rdquo; He puts his notebook down on the sand and lays the torch beside it. The torch has red paper over the glass.'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#str').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Mr Strachan', role: 'On the crest, with a spade for a crutch', face: window.FACE('strachan'),
      lines: [
        { note: 'He sits with his bad leg straight out and the spade across his knees, like a king with a very poor sceptre.', a: '&ldquo;Look at that. Thirty years I navigated by those stars, and they still take my breath away.&rdquo;' },
        { q: 'How can the stars tell us where we are?', a: 'Two numbers make a position: how far south, and how far east. Tonight the sky gives us the first. The Cross shows where south is, and how high the pole of the sky stands. That height is our latitude. Tomorrow at noon the sun gives us the second.' },
        { q: 'Can&rsquo;t you just show me?', a: 'I could. But my glasses are in the truck, and you will remember it better if your own hand finds it. Everything you need is on the page under the red torch. I&rsquo;ll check your sums. That is what great-uncles are for.' },
        { q: 'Why is the torch red?', a: 'White light ruins your night eyes for half an hour. Red light hardly touches them. A navigator who shines a white torch in the cockpit is not asked to fly again.' },
        { q: 'Is there a south pole star?', a: 'There is not. In the north they have the Pole Star sitting nearly on the spot, and very smug about it. Down here the pole of the sky is an empty place. You have to find it from stars that are somewhere else. That is half the fun, and all of the difficulty.' }
      ],
      clue: { id: 'str2', title: 'Mr Strachan, on the crest', kind: 'What he said' },
      done: function (seen) { if (seen && tell('str')) { paint(); ER.say('He nods at the notebook in the red light.'); } }
    });
  });
  $('#hay').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Dr Hayashi', role: 'Lying on her back, counting meteors', face: window.FACE('hayashi'),
      lines: [
        { note: 'She is lying flat on the sand with her hat on her stomach.', a: '&ldquo;Seven meteors so far. In Tokyo I am lucky to see seven stars.&rdquo;' },
        { q: 'Which is the Southern Cross?', a: 'I can see two crosses. One on the left, small and bright. One on the right, bigger, a little fainter. I would choose the big one, because it looks more like a cross. Duncan says that is exactly what the big one wants.' },
        { q: 'What are the two pale clouds?', a: 'The Clouds of Magellan. Two small galaxies, near neighbours of ours. Near, here, means more than a hundred and fifty thousand light years. So please do not walk towards them.' },
        { q: 'Are you worried?', a: 'About us, a little. About my stone, not at all. It has waited four and a half thousand million years. It can wait until Saturday.' }
      ],
      clue: { id: 'hay2', title: 'Dr Hayashi, on the crest', kind: 'What she said' },
      done: function (seen) { if (seen && tell('hay')) { paint(); ER.say('Two crosses, then. And only one of them is telling the truth.'); } }
    });
  });

  /* ---------- the page ---------- */
  var PAGE = '<h4>South by the Cross</h4><div class="two"><div>' +
    '<p>There is no star at the south pole of the sky. You find the <b>empty place</b>.</p>' +
    '<ol><li>Find the <b>Southern Cross</b>: four bright stars, small and close together, with a faint fifth one off to the side. The <b>False Cross</b> is bigger and fainter, and has no Pointers.</li>' +
    '<li>The <b>Pointers</b>: two very bright stars beside the true Cross. They point at it.</li>' +
    '<li>Take the long bar of the Cross, from the top star to the foot. Carry it on beyond the foot, <b>four and a half times</b> its own length. That is the pole of the sky. Nothing marks it.</li>' +
    '<li>Drop straight down from there to the horizon. That is <b>south</b>.</li>' +
    '<li>The pole stands as high above the horizon as you are south of the equator: its height is your <b>latitude</b>. Measure it with a protractor and a plumb line (or roughly: a fist at arm&rsquo;s length is about 10&deg;).</li></ol>' +
    '<p>Best when the Cross stands upright: the long bar then points straight down. The rule is good to two or three degrees. The whole sky turns round the empty place, about 15&deg; an hour. &nbsp;H.S.</p></div>' +
    '<div><svg viewBox="0 0 290 370"><rect width="290" height="370" fill="#f7f5ec" opacity=".2"/>' +
    '<g fill="#1d2a4a"><circle cx="150" cy="30" r="5"/><circle cx="150" cy="96" r="6.500"/><circle cx="122" cy="60" r="4"/><circle cx="176" cy="66" r="5"/><circle cx="162" cy="78" r="2.400"/><circle cx="70" cy="120" r="7"/><circle cx="96" cy="100" r="5.500"/></g>' +
    '<path d="M150 30V96" stroke="#1d2a4a" stroke-width="1.600"/><path d="M122 60L176 66" stroke="#1d2a4a" stroke-width="1.200"/><path d="M150 96V300" stroke="#c8321e" stroke-width="1.600" stroke-dasharray="5 4"/>' +
    '<g stroke="#c8321e" stroke-width="1.400"><path d="M144 162h12M144 228h12M144 294h12"/></g>' +
    '<path d="M72 118L94 102L118 86" stroke="#1d2a4a" stroke-width="1" stroke-dasharray="3 3"/>' +
    '<circle cx="150" cy="300" r="7" fill="none" stroke="#c8321e" stroke-width="2"/><path d="M150 307V352" stroke="#1d2a4a" stroke-width="1.200" stroke-dasharray="2 3"/><path d="M10 352H280" stroke="#1d2a4a" stroke-width="2"/>' +
    '<path d="M60 352A90 90 0 0 1 64 316" stroke="#1d2a4a" stroke-width="1.200" fill="none"/>' +
    '<g font-family="Handlee,cursive" font-size="15" fill="#1d2a4a"><text x="184" y="34">top</text><text x="164" y="104">foot</text><text x="14" y="148">the Pointers</text><text x="164" y="200">x 4&frac12;</text><text x="166" y="304">the pole: nothing there!</text>' +
    '<text x="156" y="346">S</text><text x="20" y="342">latitude</text></g></svg></div></div>';
  $('#nbk').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PAGE, cls: 'nav', clue: { id: 'page2', title: 'South by the Cross', kind: 'Mr Strachan&rsquo;s notebook' }, done: function () {
      DUNE.terms(['Southern Cross', 'Pointers', 'False Cross', 'south celestial pole', 'latitude', 'horizon']);
      if (tell('page')) { paint(); ER.say('In the red light the page looks as if it were written in blood. It is only biro.'); }
    } });
  });
  $('#prot').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'protractor');
    ER.say('Mr Strachan&rsquo;s square protractor, the one navigators used, with a piece of string and a nut tied to one corner: a plumb line. Together they make a quadrant, for measuring how high something is.');
    DUNE.terms(['plumb line', 'quadrant']);
  });
  DUNE.thing('#farcar', null, 'Down in the hollow, the truck is a pale shape beside the lamp. From up here you can see how well it is hidden: an aircraft would have to fly right over the top of it.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#sky').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The Cross is lying over on its side now, as the sky turns. The empty place has not moved.'); return; }
    if (!told.str) { ER.say('&ldquo;Ask me first,&rdquo; says Mr Strachan, &ldquo;or you will be up here all night looking at the pretty ones.&rdquo;'); return; }
    if (!told.page) { ER.say('&ldquo;The page,&rdquo; says Mr Strachan, &ldquo;under the red torch. Read it before you look.&rdquo;'); return; }
    if (!bench) bench = makeBench();
    bench.open();
  });

  /* ---------- the sky, the Cross and the empty place ---------- */
  function makeBench() {
    var T0 = 21 * 60 + 10, SPAN = 140, HZ = 450, P = DUNE.view(180, 36, 321, 500, 216.5), stage = ER.flag('b-stage') || 0, t = ER.flag('b-t') || T0,
      sel = [], bar = ER.flag('b-bar') || '', mult = 1, stone = null, sight = 10, box = ER.el('div', 'bx'), s, svg, i, wl, faint = [], r = DUNE.rnd(3),
      BY = {}; DUNE.SOUTH.forEach(function (q) { BY[q[0]] = q; });
    if (stage > 3) stage = 3;      /* after a reload the ring and the stone are placed again */
    if (stage >= 1 && !bar) stage = 1;
    for (i = 0; i < 160; i++) faint.push([r() * 360, -90 + Math.acos(1 - r() * 0.9) * 180 / Math.PI * 0.95, 4.3 + r() * 1.3]);
    function TX(m) { return 70 + (m - T0) * 860 / SPAN; }
    s = '<svg class="cs" viewBox="0 0 1000 530"><defs><filter id="cbl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="1000" height="470" fill="#070a16"/><g id="c-mw" filter="url(#cbl)"></g><g id="c-st"></g><g id="c-lines"></g>' +
      '<path d="M0 456Q160 440 330 448T640 444T1000 450V470H0Z" fill="#140f16"/><path d="M0 ' + HZ + 'H1000" stroke="#3a2e36" stroke-width="1.500"/><g id="c-ticks"></g>' +
      '<g id="c-stone"></g><g id="c-quad"></g><rect id="c-hz" x="0" y="' + (HZ - 26) + '" width="1000" height="44" fill="#fff" opacity="0"/>' +
      '<rect y="470" width="1000" height="60" fill="#0d1020"/><path d="M70 494H930" stroke="#8a7a52" stroke-width="5"/>';
    for (i = 0; i <= SPAN; i += 10) s += '<path d="M' + TX(T0 + i).toFixed(1) + ' 494v' + (i % 30 ? 7 : 12) + '" stroke="#9aa2c0" stroke-width="1.500"/>' + (i % 30 ? '' : '<text class="csT" x="' + TX(T0 + i).toFixed(1) + '" y="522" text-anchor="middle">' + DUNE.clock(T0 + i) + '</text>');
    s += '<g id="c-ptr"><path d="M0 490L-10 470H10Z" fill="#f3e3b0" stroke="#7a6230"/></g><rect id="c-strip" class="tool" x="50" y="472" width="900" height="58" fill="#fff" opacity="0"/>' +

        if (q[3] < 3.5) o += '<circle class="hit" data-id="' + q[0] + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="13"/>';

            '<g id="c-sight" class="tool"><path d="M' + (sp[0] - 14).toFixed(1) + ' ' + sp[1].toFixed(1) + 'h28M' + sp[0].toFixed(1) + ' ' + (sp[1] - 14).toFixed(1) + 'v28" stroke="#f3e3b0" stroke-width="2"/><circle cx="' + sp[0].toFixed(1) + '" cy="' + sp[1].toFixed(1) + '" r="20" fill="#fff" opacity="0"/></g>';

      svg.querySelector('#c-quad').innerHTML = stage >= 5 ? quad(sight) : '';

      svg.querySelector('#c-time').textContent = DUNE.clock(t);
      svg.setAttribute('data-t', t); svg.setAttribute('data-stage', stage); svg.setAttribute('data-mult', mult);
      if (bar) { var bb = barParts(), A2 = pos(bb[0]), B2 = pos(bb[1]); if (A2 && B2) svg.setAttribute('data-tilt', (Math.atan2(B2[0] - A2[0], B2[1] - A2[1]) * 180 / Math.PI).toFixed(1)); }

    }
    /* the quadrant: the protractor tilted to the sight, the plumb line hanging straight down across its scale */

          'Mr Strachan looks along your arm. &ldquo;Four stars, but not a cross that anybody named. Find the small bright one with two very bright stars beside it.&rdquo;');

          'South is straight below the empty place you found. Click the horizon there.',
          'Click the line of the dunes just under the ring.'

          'Drag the cross-shaped sight up the dotted line until it sits on the empty place. The protractor tilts with it, and the plumb line hangs straight down across the scale.',

})();
