  .wt h6{margin:0 0 4px;font-family:'Overpass',sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#f0c88a}
  .wt svg{display:block;width:150px;height:150px;margin:0 auto 6px}
  .wt .picks{display:flex;justify-content:center;gap:4px;margin:4px 0 0}
  .wt .picks button{height:30px;padding:0 8px;font-size:11.5px;letter-spacing:.04em}
  .wt small{display:block;font-family:'Overpass',sans-serif;font-weight:700;font-size:10px;letter-spacing:.2em;color:#a99fc8;margin-top:6px;text-transform:uppercase}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, sky = null, rx = null;

  (function () {        /* the first stars of the evening, and the spinifex */
    var r = DUNE.rnd(41), s = '', i, x, y;
    for (i = 0; i < 70; i++) { x = -400 + r() * 2400; y = -300 + r() * r() * 620; s += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + (0.6 + r() * 1.1).toFixed(1) + '" opacity="' + (0.35 + r() * 0.5).toFixed(2) + '"' + (i % 7 ? '' : ' class="tw c"') + '/>'; }
    $('#stars').innerHTML = s; s = '';
    for (i = 0; i < 30; i++) { x = -600 + r() * 2800; y = 700 + r() * 160; s += '<path d="M' + x.toFixed(0) + ' ' + y.toFixed(0) + 'q-14 -' + (14 + r() * 16).toFixed(0) + ' -24 -4M' + x.toFixed(0) + ' ' + y.toFixed(0) + 'q4 -' + (20 + r() * 16).toFixed(0) + ' 2 -26M' + x.toFixed(0) + ' ' + y.toFixed(0) + 'q16 -' + (14 + r() * 14).toFixed(0) + ' 26 -6" stroke="#2e3320" stroke-width="4" fill="none"/>'; }
    $('#grass').innerHTML = s; s = '';
    [[1368, 556], [1496, 528], [1400, 478], [1432, 506], [1460, 470], [1380, 510]].forEach(function (c) {      /* a desert oak: drooping grey needles */
      for (i = 0; i < 16; i++) { x = c[0] - 30 + r() * 60; y = c[1] - 14 + r() * 20; s += '<path d="M' + x.toFixed(0) + ' ' + y.toFixed(0) + 'q' + (r() * 8 - 4).toFixed(0) + ' ' + (18 + r() * 22).toFixed(0) + ' ' + (r() * 10 - 5).toFixed(0) + ' ' + (36 + r() * 30).toFixed(0) + '"/>'; }
    });
    $('#oak').innerHTML = s;
  })();

  ER.init({
    theme: 'wild', story: 'dune', storyTitle: 'Four and a Half Times', id: 'truck', no: 'I', title: 'The Truck',
    go: 'Climb down from the cab',
    intro: [
      'Thursday 14 April 1988, twenty to seven in the evening. You are a very long way from anywhere: in the desert in the west of Australia, a day&rsquo;s drive from the nearest house, which belongs to a cattle station called Tolliver Downs.',
      'There are three of you. Mr Strachan was a navigator in the air force for thirty years, and has spent the twenty since looking for stones that fell from the sky. Dr Hayashi has come from a museum in Tokyo to look for one of them: on the night of 2 April a fireball crossed this desert, and she has worked out where it came down. You are here because Mr Strachan is your great-uncle, and somebody had to carry the water. You were told to stay close.',
      'At sunset the truck&rsquo;s lights went dim. Twenty minutes later the engine stopped, and so did everything else that runs on electricity, the truck&rsquo;s radio among it. It is 1988: there are no mobile telephones out here, and nothing in anybody&rsquo;s pocket that can say where you are.'
    ],
    exit: {"next":"crest","w":{"cfaaabee":"fbcb467c"}}, tags: {"light":["3a24cd6f"],"fnight":["1089c2d5"],"fday":["3ce28fe7"],"ws":["f142a6be"],"wh":["ebdf0c7e"],"wy":["b4d81fce"],"wy_fast":["b685d7ed"],"wh_wst":["6d30d9ba","36c7da90","0d9fcec8","6282ddc1","239aa53a"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('a-file') || null; told = ER.flag('a-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a-told', told); return true; }
  function isBusy() { return busy; }
  function lightDone() { return ER.flag('a-light') === 'keep'; }
  function paint() {
    $('#venus').classList.toggle('ready', !!(told.str && told.hay && told.lights && !lightDone()));
    $('#radio').classList.toggle('ready', !!(lightDone() && told.book && told.card && !nextFile));
    $('#venus').style.display = nextFile ? 'none' : '';
    ER.pips((told.str ? 1 : 0) + (told.hay ? 1 : 0) + (told.lights ? 1 : 0) + (lightDone() ? 1 : 0) + (told.book ? 1 : 0) + (ER.flag('a-tuned') ? 1 : 0) + (nextFile ? 1 : 0), 7);
  }
  function showGo() { $('#go').classList.add('on'); }

  function hints() {
    if (nextFile) return ['go', ['Mr Strachan wants to find the Cross. Climb the dune behind the truck.']];
    if (sky && sky.isOpen()) return ['light', [
      'Watch the light for a while: drag along the watch strip under the sky (or use the arrows), and see what it does, and what the stars round it do.',
      'Mr Strachan&rsquo;s page on lights at night is in your notebook. An aircraft flashes, and moves across the stars.',
      'The light does not flash, and it sinks towards the dunes together with the reddish star and the little cluster beside it. Something that keeps its place among the stars is not an aircraft.'
    ]];
    if (rx && rx.isOpen()) return rx.hint();
    if (!told.str) return ['str', ['Mr Strachan is sitting on the tailgate of the truck with his foot up. Ask him what happened, and what he wants to do.']];
    if (!told.hay) return ['hay', ['Dr Hayashi is standing by the bonnet with the flare in her hand. Ask her what she has seen.']];
    if (!told.lights) return ['lights', [
      'Before anybody decides about the light, read what Mr Strachan wrote about lights at night.',
      'His notebook is open on his knee. Click the notebook in his hand.'
    ]];
    if (!lightDone()) return ['venus', ['The light is low in the north-west, to the right above the dune. Click it, and watch it.']];
    if (!told.book) return ['book', [
      'It is nearly seven: time for the radio. But first, find out what a radio that only listens is good for.',
      'The survival booklet is in the glovebox of the truck: the open door of the cab, with something orange inside. Click it.'
    ]];
    return ['radio', ['The little receiver is standing on the wing of the truck, by the bonnet, with its aerial up. Click it.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The hollow between the dunes, after the sched. The light in the north-west has gone down behind the dune, as a planet should.'); return; }
    if (told.in) { busy = false; ER.say('The truck, a little before seven. The lamp is the only light that is not a star.'); return; }
    tell('in');
    ER.narrate([
      'The truck has stopped in a hollow between two long red dunes. The battery is flat: the part that charges it gave up an hour ago, and Mr Strachan drove on until there was nothing left. The headlights went brown, and then out.',
      'Mr Strachan climbed on to the roof to look for the track in the last of the light. He did not see the track. Coming down, he found a stone with his left foot. He is now sitting on the tailgate with his boot off and his ankle strapped, saying things about stones that a meteorite hunter should not say.',
      'Dr Hayashi is holding the only flare, and looking at the sky in the north-west.',
      '&ldquo;Duncan,&rdquo; she says. &ldquo;There is a light.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#nbk').addEventListener('click', function () {
    if (busy) return;
    if (!told.str) { ER.say('Mr Strachan&rsquo;s notebook, open on his knee. &ldquo;Ask before you read a navigator&rsquo;s notebook,&rdquo; he says. &ldquo;It&rsquo;s only polite. Then read it.&rdquo;'); return; }
    readLights();
  });
  $('#str').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Mr Strachan', role: 'Navigator, retired · meteorite hunter · your great-uncle', face: window.FACE('strachan'),
      lines: [
        { note: 'His ankle is the size of a grapefruit and propped on a jerrycan. His notebook is open on his knee.', a: '&ldquo;Twisted, not broken. I&rsquo;ve done it before. Scotland, 1952: a much better class of stone.&rdquo;' },
        { q: 'Where are we?', a: 'That is the question, isn&rsquo;t it. We crossed Glass Creek at four, and I took a fork that I thought was the Old Well Track. It was dead straight and nicely used. I should have known: nothing out here is dead straight but a seismic line. An oil company cut them through the scrub years ago, hundreds of them. We drove that one for two hours.' },
        { q: 'Which way did we go?', a: 'West, more or less, by the compass on the dashboard. Which tells me nothing, because a compass in a steel truck points at the engine as much as at the pole. Tonight I don&rsquo;t know where we are to within forty miles. By noon tomorrow I mean to know.' },

    wt += '</div>';
    box.innerHTML = '<div class="frame"><div id="b-rx"></div><div class="spk" id="b-spk"></div>' + wt + '</div>' +
      '<div class="bx-foot"><p class="pmsg"></p><span class="nudge" id="b-nudge"><button type="button" data-d="-1">&lsaquo;</button><button type="button" data-d="1">&rsaquo;</button></span><button type="button" class="btn" id="b-go"></button></div>';
    var msgEl = box.querySelector('.pmsg'), go = box.querySelector('#b-go'), nudge = box.querySelector('#b-nudge');
    spk = box.querySelector('#b-spk');
    function msg(x) { msgEl.innerHTML = ER.gloss(x); }
    function signal(f) {
      var d = Math.abs(f - 4.4);
      if (stage >= 1) return d < 0.05 ? 1 : 0;
      return d < 0.05 ? 1 : d < 0.25 ? 0.55 - d * 2 : Math.abs(f - 5.9) < 0.15 ? 0.3 : Math.abs(f - 9.6) < 0.15 ? 0.35 : 0.06;
    }
    function hear(f) {
      var d = Math.abs(f - 4.4);
      if (d < 0.05) return '<p><span class="who">A WOMAN&rsquo;S VOICE, CLEAR:</span> &hellip;Tolliver Base, Tolliver Base&hellip; standing by for the seven o&rsquo;clock sched&hellip;</p>';
      if (d < 0.25) return '<p class="hs">shhhhhh &hellip; ase, Tol&hellip; shhhh &hellip; by for the s&hellip; shhhh</p>';
      if (Math.abs(f - 8.0) < 0.15) return '<p class="hs">shhhhhhhhhhhhhhh</p><p class="hs">(nothing on 8.0 at all: only the hiss of the whole sky)</p>';
      if (Math.abs(f - 5.9) < 0.15) return '<p class="hs">shhhh &hellip; very faint music, violins, from somewhere a very long way away &hellip; shhhh</p>';
      if (Math.abs(f - 9.6) < 0.15) return '<p class="hs">shhhh &hellip; a man reading the news in a language you don&rsquo;t know &hellip; shhhh</p>';
      return '<p class="hs">shhhhhhhhhhhhhhhhhhhhh</p>';
    }
    rec = DUNE.receiver({ f: ER.flag('a-f') || 6.0, signal: signal, change: function (f) { ER.flag('a-f', f); if (stage === 0) { spk.innerHTML = hear(f); DUNE.hiss(signal(f) > 0.9 ? 0.25 : 1); } } });
    box.querySelector('#b-rx').appendChild(rec.node);
    nudge.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button') : null; if (!b || stage) return; rec.set(rec.get() + (+b.getAttribute('data-d')) / 10); });
    ER.$$('#b-watches > div', box).forEach(function (d) {
      var k = d.getAttribute('data-w'); w[k] = { z: '', e: '' };
      ER.$$('.picks', d).forEach(function (g) {
        g.addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('button') : null; if (!b || stage !== 2) return;
          w[k][g.getAttribute('data-g')] = b.getAttribute('data-v');
          ER.$$('button', g).forEach(function (o) { o.classList.toggle('on', o === b); }); DUNE.sfx.click();
        });
      });
    });
    function draw() {
      box.querySelector('#b-watches').classList.toggle('on', stage === 2);
      box.querySelector('#b-spk').style.display = stage === 2 ? 'none' : '';
      box.querySelector('#b-rx').style.display = stage === 2 ? 'none' : '';
      nudge.style.display = stage === 0 ? '' : 'none';
      go.textContent = ['Listen', 'Go on', 'That is what they keep'][stage];
      rec.lock(stage > 0);
    }
    function speak() {
      var s = '', i;
      for (i = 0; i <= line; i++) s += '<p>' + LINES[i] + '</p>';
      spk.innerHTML = s; spk.scrollTop = spk.scrollHeight;
    }
    go.addEventListener('click', function () {
      var f = rec.get().toFixed(1), c;
      if (stage === 0) {
        if (ER.check('fnight', f)) {
          stage = 1; line = 0; ER.flag('a-tuned', 1); DUNE.hiss(0.18); draw(); speak(); paint();
          msg('Seven o&rsquo;clock. Mrs Tolliver&rsquo;s voice comes out of the little speaker as if she were sitting on the bonnet. Dr Hayashi writes down every word.');
          return;
        }
        DUNE.sfx.no();
        msg(ER.check('fday', f) ? 'The other frequency on the card, and the dial is exactly on it: but there is nothing there but hiss. &ldquo;What did the booklet say?&rdquo; says Mr Strachan. &ldquo;Which one would a station use at night?&rdquo;' :
          'There is nobody there worth listening to. The Downs use one of the two frequencies on the card. Put the needle exactly on the right one for the time of day.');
        return;
      }
      if (stage === 1) {
        if (line < LINES.length - 1) {
          line++; speak();
          if (line === 4) { for (var i = 0; i < 5; i++) DUNE.sfx.pip(false, i); DUNE.sfx.pip(true, 5); msg('Five short pips, and a long one. At the start of the long one, everybody looks at their watch, and nobody breathes.'); }
          else if (line === 5) msg('&ldquo;Saturday, half past seven, the north shore of Sixpenny Pan,&rdquo; says Dr Hayashi, writing. &ldquo;If we are there, he will find us. If we are not, he will find a very nice salt pan.&rdquo;');
          else msg('');
          return;
        }
        stage = 2; ER.flag('a-heard', 1); DUNE.hiss(0); draw();
        ER.addClue('sched1', 'Tolliver Base, Thursday, 19.00', '<h4>Tolliver Base &middot; Thursday 19.00 &middot; 4.4 MHz</h4>' + LINES.map(function (l) { return '<p>' + l + '</p>'; }).join(''), 'radio', 'What the radio said');
        DUNE.terms(['search', 'weather']);
        msg('At the start of the long pip, it was exactly seven o&rsquo;clock here. This is what the three watches said at that moment. For each one, say what time it keeps, and how wrong it is.');
        return;
      }
      if (stage === 2) {
        if (!w.s.z || !w.s.e || !w.h.z || !w.h.e || !w.y.z || !w.y.e) { msg('Choose two things for every watch: what time it keeps, and how right it is.'); return; }
        var a = w.s.z + '.' + w.s.e, b = w.h.z + '.' + w.h.e, y = w.y.z + '.' + w.y.e;
        c = 'keep|4.4|' + a + '|' + b + '|' + y;
        if (ER.exitOk([c])) {
          DUNE.sfx.pencil();
          DUNE.mine('watches', 'The three watches', '<p>At the long pip it was <b>19.00</b> Western Standard Time (UTC + 8).</p><p>Mr Strachan&rsquo;s said 11.00: it keeps <b>UTC</b>, and is right. Dr Hayashi&rsquo;s said 20.00: <b>Tokyo time</b> (UTC + 9), right. Mine said 18.56: Western Standard Time, <b>four minutes slow</b>.</p>', true);
          DUNE.mine('plan', 'The plan', '<p>Col flies the mail plane on <b>Saturday at first light</b>: the Old Well Track to Sixpenny Well, then the <b>north shore of Sixpenny Pan</b>, at about <b>07.30</b>.</p><p>We have to be there, where he can see us. First we have to know where &ldquo;here&rdquo; is.</p>', true);
          nextFile = ER.exit([c], { wait: true }); ER.flag('a-file', nextFile);
          msg('&ldquo;Greenwich, Tokyo, and you,&rdquo; says Mr Strachan. &ldquo;Three watches, and now we know exactly what each of them is worth. Yours is worth four minutes less than it thinks.&rdquo;');
          setTimeout(function () {
            ER.closeAll(); paint(); busy = true;
            ER.narrate([
              'Supper is a tin of beans heated on the lamp, which takes a long time, and tastes better than any beans have ever tasted. The light in the north-west has gone down behind the dune, as a planet should.',
              'Now the sky is full. You have never seen so many stars: not a sky with stars in it, but stars with a little sky between them.',
              '&ldquo;Second thing,&rdquo; says Mr Strachan, and gets up on one leg and a spade. &ldquo;Where are we. Up the dune, all of us. Bring the torch with the red paper over it, and my protractor. We want the Cross.&rdquo;'
            ], function () { busy = false; showGo(); });
          }, 2800);
          return;
        }
        DUNE.sfx.no();
        if (!ER.check('ws', a)) msg(w.s.z === 'utc' ? 'Mr Strachan&rsquo;s watch says 11.00 at 19.00. Is that right for the clock you chose, to the minute?' :
          'Mr Strachan&rsquo;s watch said 11.00 when it was 19.00 here. Which clock is eight hours behind Western Standard Time? The booklet says.');
        else if (!ER.check('wh', b)) msg(ER.check('wh_wst', b) ? '&ldquo;I told you what my watch keeps,&rdquo; says Dr Hayashi. &ldquo;Not this country&rsquo;s time. And none of these is an hour wrong: say what it keeps, and how wrong it is at that.&rdquo;' :
          'Dr Hayashi&rsquo;s watch said 20.00 at 19.00 here. Tokyo is nine hours ahead of UTC. Is her watch right for Tokyo?');
        else if (!ER.check('wy', y)) msg(ER.check('wy_fast', y) ? 'Yours said 18.56 when it was 19.00. Has it got there yet, or is it ahead? A watch that has not got there yet is slow.' :
          'Your watch said 18.56 when it was exactly 19.00 here. Which time does it keep, and by how much is it out?');
        else msg('Something does not agree. Check each watch against 19.00 here.');
      }
    });
    draw();
    if (stage === 0) { spk.innerHTML = hear(rec.get()); msg('A minute to seven. The card says the Downs use 4.4 or 8.0. Turn the knob, or drag along the dial, and put the needle exactly on the frequency they use at night. Then listen.'); }
    else msg('This is what the three watches said at the long pip. For each one, say what time it keeps, and how wrong it is.');
    return {
      open: function () { ER.open('ov-lock', box, function () { DUNE.hiss(0); }); if (stage === 0) DUNE.hiss(signal(rec.get()) > 0.9 ? 0.25 : 1); else if (stage === 1) DUNE.hiss(0.18); },
      isOpen: function () { return !!box.parentNode; },
      hint: function () {
        if (stage === 0) return ['tune', [
          'The card in the lid gives the Downs two frequencies. Which one do they use at night?',
          'The booklet: short-wave stations use a high frequency by day and a low one at night. Turn the knob, or drag along the dial, to the lower of the two, exactly. Then Listen.'
        ]];
        if (stage === 1) return ['listen', ['Press Go on to hear the rest of the sched, and watch for the time signal.']];
        return ['watch', [
          'At the long pip it was exactly seven o&rsquo;clock here, Western Standard Time. Compare each watch with 19.00.',
          'The booklet: Western Standard Time is eight hours ahead of UTC. Dr Hayashi told you how far ahead of UTC Tokyo is. So at 19.00 here, what time is it in UTC, and in Tokyo?',
          'At 19.00 here it is 11.00 UTC and 20.00 in Tokyo. And a watch that says 18.56 when it is 19.00 has not got there yet.'
        ]];
      }
    };
  }
})();
</script>
</body>
</html>
