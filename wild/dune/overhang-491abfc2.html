<script>
(function () {

    intro: [
      'In the creek bed Mr Strachan had the first signs of heat exhaustion: a headache, dizziness, cramp, and pale, damp skin, with a full bottle in his pocket. Shade, water and a wet cloth put him right. Then you made the plan: ration sweat, not water. Drink what you need, rest through the heat of the day, and walk to the pan in the cool of the evening, at ' + DUNE.clock(leave) + '.',
      'Friday, a quarter past ten. The breakaway leans out over the sand like the brim of a hat, and under it there is shade all day. Out in the sun Mr Strachan has stood a metre stick upright, with its shadow lying on flat sand.',
      'At 02.14 by his watch he marked the tip of the shadow with a peg, and Dr Hayashi tied a loop of string round the stick and drew a ring through the peg. Since then the shadow has been getting shorter. You are going to watch it get longer again.'
    ],
    exit: {"next":"pan","w":{"cd175406":"2a36370e"}}, tags: {"mark":["f90c56e6"],"shadow":["3e37f636"],"shadow_n":["12e2e7d8"],"noon":["b3cfb823"],"noon_wst":["835a0b70"],"noon_you":["ee05a4bc"],"noon_tokyo":["7b696d4a"],"noon_end":["7e0857a7","84ae1ac6"],"lon":["3c122bc9"],"lon_you":["d32ea0c1"],"lon_tokyo":["31d7e0e0"],"lon_back":["3609fc6a"],"lon_mul":["8a5ddb26"],"fix":["3116a427"],"fix_lat":["b68e695f","d6285d35","2a1335cd","7afc0feb","ea11d94a","2a1335cd","1eacae02"],"way":["5c878cdd"]},

  function showGo() { $('#go').classList.add('on'); }

  function hints() {

  function begin() {

    tell('in');
    ER.narrate([
      'It is ten degrees cooler in the shade, and still hot. Out beyond the edge of the rock the plain is white with light, and the air over it shivers.',

      '&ldquo;The sun crosses the sky once a day,&rdquo; he says, &ldquo;at fifteen degrees an hour. It does it in Greenwich and it does it here. All we have to do is catch it at the top.&rdquo;'

  }

  /* ---------- people ---------- */
  $('#str').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Mr Strachan', role: 'In the shade, with his foot up', face: window.FACE('strachan'),
      lines: [
        { note: 'He holds up his watch: black, with twenty-four hours round the dial.', a: '&ldquo;Greenwich time. A navigator&rsquo;s watch never changes country. It means I always know what time it is somewhere that matters.&rdquo;' },
        { q: 'What is the stick for?', a: 'For noon. Not twelve o&rsquo;clock: noon, the moment the sun is highest here. Noon comes to Greenwich at twelve o&rsquo;clock by my watch. It comes to us earlier, because the Earth turns towards the east and we are a long way east. How much earlier tells us how far east.' },
        { q: 'Why not just watch for the shortest shadow?', a: 'Try it. Near noon the shadow hardly changes for half an hour: you&rsquo;ll be guessing to ten minutes, and ten minutes is two and a half degrees. Equal shadows are better. The shadow at a quarter past ten and the shadow that matches it in the afternoon are the same distance from noon, one on each side.' },
        { q: 'How exact will it be?', a: 'A stick and a good watch give you longitude to a quarter of a degree, on a good day: twenty-five kilometres. Last night&rsquo;s latitude is good to half a degree. So we do not aim at a well. We aim at something big: a salt pan forty miles long, which you could not miss if you tried.' }
      ],
      clue: { id: 'str4', title: 'Mr Strachan, in the shade', kind: 'What he said' },
      done: function (seen) { if (seen && tell('str')) { paint(); ER.say('&ldquo;The page is on the stone,&rdquo; he says. &ldquo;It explains it better than I do. I wrote it when I was younger.&rdquo;'); } }
    });
  });
  $('#hay').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Dr Hayashi', role: 'In the shade, writing', face: window.FACE('hayashi'),
      lines: [
        { note: 'She has written the times of every shadow since ten o&rsquo;clock in her notebook, by her own watch.', a: '&ldquo;I have been measuring too. With a Tokyo watch. Duncan says this is like measuring a room in Japanese feet.&rdquo;' },
        { q: 'Can we use your watch?', a: 'Yes, if you remember what it keeps. It is Tokyo time: one hour ahead of here, nine ahead of Greenwich. Forget the hour, and you will put us in the sea. Duncan&rsquo;s watch is simpler: it already keeps Greenwich.' },
        { q: 'And mine?', a: 'Yours keeps the time here, and it is four minutes slow. Four minutes is a whole degree of longitude. You may wear it. Do not navigate by it.' },

  /* ---------- papers ---------- */
  var PAGE = '<h4>Noon and longitude</h4><div class="two"><div>' +
    '<p>South of the Tropics the midday sun is due <b>north</b>, so the noon shadow points <b>south</b>. (The British rule, &ldquo;shadows point north at noon&rdquo;, is upside down here.)</p>' +
    '<p><b>Local noon</b>: the moment the sun is highest, shadow shortest. Near noon the shadow hardly changes, so don&rsquo;t try to see the shortest one. Do this:</p>' +
    '<ol><li>A straight stick, upright. In the morning, mark the tip of its shadow, note the time, and draw a ring round the stick through the mark.</li>' +
    '<li>In the afternoon the shadow grows again. Note the time when its tip touches the ring.</li>' +
    '<li>Noon is exactly <b>half way</b> between the two times.</li></ol>' +
    '<p>The Earth turns 360&deg; in 24 hours: <b>15&deg; an hour, 1&deg; every 4 minutes</b>. Noon comes to Greenwich (0&deg;) at 12.00 UTC, and an hour earlier for every 15&deg; east. So:</p>' +
    '<p>longitude east = (12.00 &minus; noon by a UTC watch) &times; 15&deg; an hour.</p>' +
    '<p>In mid-April the sun keeps almost perfect time. (In other months it can be a quarter of an hour early or late: look it up.) &nbsp;H.S.</p></div>' +
    '<div><svg viewBox="0 0 290 360"><g font-family="Handlee,cursive" font-size="15" fill="#1d2a4a">' +
    '<circle cx="145" cy="60" r="5" fill="#1d2a4a"/><circle cx="145" cy="60" r="96" fill="none" stroke="#1d2a4a" stroke-width="1.400" stroke-dasharray="4 4"/>' +
    '<path d="M145 60L80 131" stroke="#7a2a1a" stroke-width="2"/><path d="M145 60L210 131" stroke="#7a2a1a" stroke-width="2"/><path d="M145 60V156" stroke="#c8321e" stroke-width="2.400"/>' +
    '<circle cx="80" cy="131" r="4" fill="#7a2a1a"/><circle cx="210" cy="131" r="4" fill="#7a2a1a"/><text x="20" y="150">morning</text><text x="196" y="150">afternoon</text><text x="122" y="180">noon: S</text>' +
    '<text x="156" y="40">stick</text><path d="M60 230h170" stroke="#1d2a4a" stroke-width="1.400"/>' +
    '<text x="22" y="226">0&deg;</text><text x="236" y="226">E</text><circle cx="60" cy="230" r="3" fill="#1d2a4a"/>' +
    '<text x="26" y="262">Greenwich: noon at 12.00</text><text x="26" y="290">15&deg; east: noon at 11.00</text><text x="26" y="318">30&deg; east: noon at 10.00</text><text x="26" y="346">1&deg; = 4 minutes</text></g></svg></div></div>';

  /* ---------- the stick, the noon line, the sums and the map ---------- */
  function makeBench() {
    var RAD = Math.PI / 180, DEC = 9.88, NOON = 3 * 60 + 44, PX = 300, SX = 500, SY = 80, T0 = 2 * 60, T1 = 5 * 60 + 30, MARK1 = 2 * 60 + 14,
      stage = ER.flag('d-stage') || 0, t = ER.flag('d-t') || 3 * 60 + 10, mark2 = ER.flag('d-mark2') || null, way = '', pin = ER.flag('d-pin') || null, end = '',

    /* where the sun is, a few hours either side of noon (its height and its bearing from north) */

    var RING = tip(MARK1)[2];
    function hhmm(m) { return DUNE.two(Math.floor(m / 60) % 24) + DUNE.two(m % 60); }
    s = '<div class="pane" id="e-sand"><svg class="sd" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="#f0d8a8"/><g id="e-grain"></g>' +
      '<circle cx="' + SX + '" cy="' + SY + '" r="' + (RING * PX).toFixed(1) + '" fill="none" stroke="#7a5a3a" stroke-width="2" stroke-dasharray="8 6"/>' +
      '<g id="e-pegs"></g><path id="e-sh" stroke="#8a5a3a" stroke-width="12" stroke-linecap="round" opacity=".55"/><circle cx="' + SX + '" cy="' + SY + '" r="9" fill="#f4f0e6" stroke="#c8321e" stroke-width="4"/>' +
      '<g id="e-noon"></g><g class="sdT"><text x="' + (SX + 12) + '" y="' + (SY - 12) + '">THE STICK (1 m)</text></g>' +
      '<g transform="translate(20 20)"><rect width="250" height="150" rx="6" fill="#2a1a24"/><text class="sdT" x="14" y="24" style="fill:#e8c8a8">MR STRACHAN&rsquo;S WATCH (UTC)</text><text class="sdC" id="e-utc" x="125" y="66" text-anchor="middle"></text>' +
      '<text class="sdT" x="14" y="98" style="fill:#c8a8b8">DR HAYASHI&rsquo;S (TOKYO)</text><text class="sdS" id="e-tok" x="236" y="98" text-anchor="end" style="fill:#e8d8c0"></text>' +
