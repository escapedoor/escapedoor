  .cb-strip i{position:absolute;left:0;top:0;bottom:0;background:#f6d32b;border-radius:17px;transition:width .3s}
  .cb-strip span{position:absolute;left:0;right:0;top:0;line-height:34px;text-align:center;font-family:'Architects Daughter',cursive;font-size:17px;color:#fff;text-shadow:0 1px 2px #000}

  .ev{position:relative;background:#fffef8;color:#22252a;font-family:'Courier Prime',monospace;font-size:12px;line-height:1.25;padding:7px 9px 6px;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;min-height:78px;border:3px solid transparent}
  .ev b{display:block;font-size:12px;letter-spacing:.03em}
  .ev .amt{float:right;font-weight:700;font-size:15px}
  .ev .hand{display:block;font-family:'Architects Daughter',cursive;font-size:13px;color:#1f5a8a;line-height:1.2;margin-top:2px}
  .ev.in{border-color:#f6d32b;background:#fff7c2;transform:translateY(-3px);box-shadow:0 0 0 3px #3a2a18,0 8px 16px rgba(0,0,0,.4)}
  .ev.in:after{content:'explains';position:absolute;right:6px;bottom:4px;font-family:'Bungee',sans-serif;font-size:10px;color:#c2185b}
  .ev.bad{border-color:#e2453a}
  .ev.slip{background:#eaf4ff}
  .ev.gone{display:none}
  .ev .dl{flex-direction:row;gap:4px;float:right}
  .ev .dl b{font-family:'Courier Prime',monospace;font-size:15px;min-width:3.2em;letter-spacing:0}
  .ev .dl button{width:22px;height:22px;line-height:22px;border:1px solid #9aa3ad;border-radius:50%;font-size:9px}
  .cb .pmsg{color:#f4ead2}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null;

  (function () {
    function shelf(x0, x1, ys, boxes) {
      var s = '<path d="M' + x0 + ' 100V620M' + x1 + ' 100V620" stroke="#3a2a18" stroke-width="10"/>';
      ys.forEach(function (y) { s += '<rect x="' + x0 + '" y="' + y + '" width="' + (x1 - x0) + '" height="12" fill="#6b4c30"/>'; });
      boxes.forEach(function (b) { s += '<rect x="' + b[0] + '" y="' + (b[1] - b[3]) + '" width="' + b[2] + '" height="' + b[3] + '" fill="' + b[4] + '" stroke="#3a2a18" stroke-width="2"/>' + (b[5] ? '<text x="' + (b[0] + b[2] / 2) + '" y="' + (b[1] - b[3] / 2 + 5) + '" class="cH" font-size="13" text-anchor="middle" fill="#2a2418">' + b[5] + '</text>' : ''); });
      return s;
    }
    $('#shelvesL').innerHTML = shelf(290, 520, [240, 380, 520], [[300, 240, 120, 70, '#c9a26a', 'BIRD BOXES'], [430, 240, 80, 50, '#b98d58'], [300, 380, 200, 60, '#d9c49a', 'SPINNERS 2017'], [310, 520, 90, 80, '#8aa0b0', 'CALCS'], [410, 520, 100, 50, '#c9a26a']]);
    $('#shelvesR').innerHTML = shelf(1100, 1560, [340, 470], [[1110, 340, 70, 60, '#b98d58'], [1300, 340, 160, 70, '#d9c49a', 'TEA TOWELS 2014'], [1470, 340, 80, 40, '#8aa0b0'], [1120, 470, 150, 80, '#c9a26a', 'CALENDARS'], [1290, 470, 110, 50, '#b98d58'], [1410, 470, 140, 90, '#d9c49a', 'BUNTING']]);
    $('#rory').innerHTML = STALL.who('rory', { smile: 6, extra: '<path d="M39 -112l10 -40" stroke="#fff" stroke-width="3"/><rect x="40" y="-176" width="18" height="28" rx="7" fill="#7a3ac2"/>' });
  })();

  ER.init({
    theme: 'econ', story: 'stall', storyTitle: 'Squeezed', id: 'cupboard', no: 'IV', title: 'The Cupboard',
    go: 'Turn on the light',
    intro: [
      'In the car park the numbers chose the trade. Waiting for Lucia&rsquo;s ice would have left the club £23 by three o&rsquo;clock, Rosa&rsquo;s swap £28, the craft club £6. So LEMON AID took Rosa&rsquo;s ice for four lemons, and the swap cost it £23: the best thing it said no to.',
      'At two o&rsquo;clock the hatch opened again, at forty pence. At ten past two you are in the Business Club cupboard, a store room off Mrs Okonjo&rsquo;s classroom, with the cash box, its key, and Kit&rsquo;s little brother, who has been sent to watch you.',
      'Kit goes to Mr Petrie at half past two.'
    ],
    exit: {"next":"table","w":{"60bd2c7a":"a6f4cdae"}}, tags: {"in":["8fb53355","ac297e6e","61031fe8","e08a0b78"],"tv":["31fdaaee"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('d-file') || null; told = ER.flag('d-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.sum && told.card; }
  function paint() {
    $('#box').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((told.sum ? 1 : 0) + (told.card ? 1 : 0) + (told.tray ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['Kit has torn up her complaint. Go with her to the organiser&rsquo;s table: the button at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['lock', [
      'Kit&rsquo;s sum says what SHOULD be in the box. Click the things on the desk that explain the gap: money that went OUT of the box, or money Kit counted that never came IN. Read the bottom line of each receipt: how was it paid? And lift the coin tray.',
      'Only money that went through the box can explain a gap in the box. Paid by the club&rsquo;s card, or out of Mrs Okonjo&rsquo;s purse: the box never saw it. The float is in Kit&rsquo;s sum and in the count, both. A swap changes the coins, not the total.',
      'Kit&rsquo;s sum counted every cup on the tally at the price on the board. The tally shows &ldquo;T4&rdquo; in six rows: 24 tasters at 20p each, and nobody paid for them. Put that value on the tasters card.'
    ]];
    if (!told.sum) return ['sum', ['Kit has written her sum on the little blackboard on the wall. Read it.', 'The blackboard is above the desk, to the right of the faded poster.']];
    if (!told.card) return ['card', ['Open the cash box: the grey box on the desk. Tomasz keeps something useful in its lid.']];
    return ['box', ['Click the cash box again, and work out where the £30.80 went.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('A strip of paper says £30.80, and so does the blackboard.'); return; }
    if (told.in) { busy = false; ER.say('The Business Club cupboard. A bare bulb, and a cash box.'); return; }
    tell('in');
    ER.narrate([
      'A bare bulb, a small desk, and shelves of things nobody bought. It is the only room in the school that is not hot, because the sun has never found it.',
      'On the desk: the grey cash box, and Mrs Cheung&rsquo;s envelope of receipts. On the wall: a little blackboard with Kit&rsquo;s sum on it, underlined three times.',
      'Rory sits down on a box of bird boxes and unwraps a lolly. &ldquo;I&rsquo;m watching you,&rdquo; he says.'
    ], function () { busy = false; });
  }

  $('#rory').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;I knew it was the tray,&rdquo; says Rory, who did not.'); return; }
    ER.talk({
      who: 'Rory Ashworth', role: 'Year 7 · sent to make sure you touch nothing', face: STALL.face('rory', 'smile'),
      lines: [
        { note: 'He has a new lolly. Nobody knows where he gets them.', a: '&ldquo;Kit says I have to watch you. I&rsquo;m watching you.&rdquo;' },
        { q: 'The bit of paper you saw Rosa with: in or out?', a: 'In. I&rsquo;m nearly sure now. Kit lifted the lid and counted the money, but she never lifts the tray. She says the tray is for the float, and the float is boring.' },
        { q: 'What is the float?', a: 'Ten pounds in coins. Mrs Okonjo put it in the box this morning, so we could give people change. Kit put it in her sum. Kit puts everything in her sum.' },
        { q: 'What is this place?', a: 'The Business Club cupboard. Everything the club ever made and didn&rsquo;t sell. The bird boxes were 2019. Nobody talks about the spinners.' },
        { q: 'Is Kit a bad captain?', a: 'Kit is a very good seller. She just doesn&rsquo;t like sums. Tomasz likes sums. Rosa liked both, and that was the trouble.' }
      ],
      clue: { id: 'rory2', title: 'Rory: in, not out', kind: 'What he said' },
      done: function (seen) { if (seen) tell('rory'); }
    });
  });
  var SUM = '<h4>KIT&rsquo;S SUM</h4><p>Every cup on the tally &times; the price on the board at the time: &pound;74.80</p><p>+ the float: &pound;10.00</p><p>SHOULD BE: &pound;84.80</p><p>COUNTED (twice!): &pound;54.00</p><p>MISSING: &pound;30.80 !!!</p><p class="sm">R.F. was at the box at 12.40. I KNOW it.</p>';
  $('#sum').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SUM, cls: 'chalk', clue: { id: 'sum', title: 'Kit’s sum', kind: 'On the wall' }, done: function () {
      if (tell('sum')) { paint(); ER.say('Should be, counted, missing. Underlined three times, as if that made it truer.'); }
    } });
  });
  var DIA = '<svg viewBox="0 0 270 230"><g font-family="Architects Daughter,cursive" font-size="14" fill="#2a2418">' +
    '<rect x="80" y="80" width="110" height="70" rx="8" fill="#8a96a0" stroke="#5a6470" stroke-width="3"/><text x="135" y="120" text-anchor="middle" fill="#fff" font-weight="700">the box</text>' +
    '<path d="M20 40q40 0 64 44" fill="none" stroke="#3a8a4a" stroke-width="3"/><path d="M78 76l8 10 2 -12" fill="none" stroke="#3a8a4a" stroke-width="3"/><text x="4" y="30" fill="#3a8a4a">the float in</text>' +
    '<path d="M250 40q-40 0 -64 44" fill="none" stroke="#3a8a4a" stroke-width="3"/><path d="M192 76l-8 10 -2 -12" fill="none" stroke="#3a8a4a" stroke-width="3"/><text x="176" y="30" fill="#3a8a4a">takings in</text>' +
    '<path d="M135 152v40" stroke="#c2185b" stroke-width="3"/><path d="M127 184l8 10 8 -10" fill="none" stroke="#c2185b" stroke-width="3"/><text x="150" y="190" fill="#c2185b">paid out</text>' +
    '<text x="135" y="222" text-anchor="middle" font-weight="700">should be = in &minus; out</text></g></svg>';
  var CARD = '<h4>How to balance a cash box</h4><div class="two"><div>' +
    '<p>What <b>should</b> be in the box = the <b>float</b> (the coins you start with, for change) + every penny <b>taken</b> &minus; every penny <b>paid out</b> of the box.</p>' +
    '<p>Then count what <b>is</b> there. If the two are different, look for:</p>' +
    '<p>&middot; money that was counted as taken but never went in (a cup that nobody paid for);<br>&middot; money paid out of the box (find the <b>receipt</b>: it says how it was paid);<br>&middot; a sum done wrong.</p>' +
    '<p>A <b>swap</b> is not a loss. A &pound;5 note for five &pound;1 coins changes the coins, not the total.</p>' +
    '<p class="rule">CASH IS NOT PROFIT. Cash is what is in the box. Profit is revenue minus ALL the costs, including the ones paid by card last week.</p></div><div>' + DIA + '</div></div>' +
    '<p style="text-align:right;font-family:Architects Daughter,cursive">T.K., treasurer</p>';
  $('#box').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Fifty-four pounds, a five-pound note among them, and every penny accounted for.'); return; }
    if (!told.card) {
      STALL.sfx.coins();
      ER.read({ html: CARD, cls: 'card', clue: { id: 'balance', title: 'Tomasz’s card: how to balance a cash box', kind: 'In the lid of the box' }, done: function () {
        STALL.terms(['float', 'receipt']);
        if (tell('card')) { paint(); ER.say(told.sum ? 'In, out, and what is there. Now the box itself.' : 'Taped inside the lid. Kit&rsquo;s sum is on the blackboard.'); }
      } });
      return;
    }
    if (!told.sum) { ER.say('First, what does Kit think should be in it? Her sum is on the blackboard.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  STALL.thing('#env', null, 'Mrs Cheung&rsquo;s envelope, with all nine receipts in it. Kit brought it back from the kitchen without opening it.', isBusy);
  STALL.thing('#poster', null, 'SUPPLY AND DEMAND: a poster so old and faded that its two lines look as if they have given up.', isBusy);
  STALL.thing('#fan', null, 'A desk fan. It last went round in 2016.', isBusy);
  STALL.thing('#trophy', 'trophy', 'SCHOOLS TRADE CHALLENGE &middot; AREA FINAL 2009 &middot; RUNNERS-UP. The only cup the club has ever won, and it is for coming second.', isBusy);
  STALL.thing('#shelvesL', null, 'BIRD BOXES (2019, unsold). SPINNERS 2017: somebody has written NEVER AGAIN on the box.', isBusy);
  STALL.thing('#shelvesR', null, 'TEA TOWELS 2014. CALENDARS, for a year that is over. And the club&rsquo;s spare bunting, which is the only thing here that ever gets used.', isBusy);
  STALL.thing('#door', null, 'Through the crack under the door: feet going past, and Kit&rsquo;s voice far away, shouting FORTY PENCE!', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the desk ---------- */
  function makeLock() {
    var EV = [
      { id: 'c1', h: 'SUMMER MARKET', t: 'pitch hire', a: 500, p: 'paid: club card, Mon', why: 'card', day: 'Monday' },
      { id: 'c2', h: '1st FENNEL ST SCOUTS', t: 'gazebo hire', a: 400, p: 'paid: club card, Mon', why: 'card', day: 'Monday' },
      { id: 'c3', h: 'SCHOOL CANTEEN', t: '60 lemons @ 15p', a: 900, p: 'paid: club card, Thu', why: 'card', day: 'Thursday' },
      { id: 'c4', h: 'HOLLIS STORES 11.50', t: '80 lemons @ 20p', a: 1600, p: 'paid: CASH', hand: 'from the box. R.A.' },
      { id: 'c5', h: 'CASH &amp; CARRY', t: 'sugar 8 kg', a: 800, p: 'paid: club card, Wed', why: 'card', day: 'Wednesday' },
      { id: 'c6', h: 'CASH &amp; CARRY', t: 'paper cups 400', a: 2000, p: 'paid: club card, Wed', why: 'card', day: 'Wednesday' },
      { id: 'c7', h: 'SANDOVAL&rsquo;S 10.05', t: 'ice 2 bags @ &pound;1', a: 200, p: 'paid: CASH', hand: 'Mrs O, from her own purse', why: 'purse' },
      { id: 'c8', h: 'SANDOVAL&rsquo;S 11.50', t: 'ice 2 bags @ &pound;2.50', a: 500, p: 'paid: CASH', hand: 'box. T.K.' },
      { id: 'c9', h: 'SANDOVAL&rsquo;S 12.30', t: 'ice 2 bags @ &pound;2.50', a: 500, p: 'paid: CASH', hand: 'box. T.K.' },
      { id: 'fl', h: 'THE FLOAT', t: 'coins put in the box at 10.00, for change', a: 1000, p: '', why: 'float' },
      { id: 'ft', h: 'FREE TASTERS', t: 'the T on Tomasz&rsquo;s tally. Kit&rsquo;s sum counts them at the price on the board.', a: null, p: '' },
      { id: 'rs', h: 'A NOTE, UNDER THE TRAY', t: '', a: 500, p: '', hand: '12.40. Swapped: my &pound;5 note in, five &pound;1 coins out, for change. Sorry, nobody here but Rory! R.F.', why: 'swap', slip: 1 }
    ];
    var saved = ER.flag('d-vals') || {}, on = saved.on || {}, tray = !!told.tray, wait = false, tv;
    var box = ER.el('div', 'pz cb');
    box.innerHTML = '<div class="cb-in"><div class="cb-top"><div class="cb-box"><svg viewBox="0 0 280 150" id="cbpic"></svg><button type="button" class="btn" id="tray">Lift the coin tray</button></div>' +
      '<div><div class="cb-sum"><p><span>Kit: should be</span><span>&pound;84.80</span></p><p><span>counted</span><span>&pound;54.00</span></p><p class="miss"><span>the gap</span><span>&pound;30.80</span></p></div>' +
      '<div class="cb-strip"><i></i><span></span></div></div></div><div class="cb-cards">' +
      EV.map(function (e) {
        return '<div class="ev' + (e.slip ? ' slip' : '') + '" data-id="' + e.id + '"><span class="amt">' + (e.a == null ? '<i class="dlc"></i>' : '&pound;' + (e.a / 100).toFixed(2)) + '</span><b>' + e.h + '</b>' + e.t + (e.p ? '<br>' + e.p : '') + (e.hand ? '<span class="hand">' + e.hand + '</span>' : '') + '</div>';
      }).join('') + '</div></div><div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="d-go">Show Kit</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function lk() { return wait || !!nextFile; }
    function val(e) { return e.a == null ? tv.get() : e.a; }
    function total() { var t = 0; EV.forEach(function (e) { if (on[e.id]) t += val(e); }); return t; }
    function keep() { ER.flag('d-vals', { on: on, tv: tv.get() }); }
    function paintAll() {
      var t = total();
      ER.$$('.ev', box).forEach(function (n) { var id = n.getAttribute('data-id'); n.classList.toggle('in', !!on[id]); n.classList.toggle('gone', id === 'rs' && !tray); });
      box.querySelector('.cb-strip i').style.width = Math.min(100, t / 3080 * 100) + '%';
      box.querySelector('.cb-strip span').textContent = 'explained so far: £' + (t / 100).toFixed(2) + ' of £30.80';
      box.querySelector('#tray').style.display = tray ? 'none' : '';
      box.querySelector('#cbpic').innerHTML = '<rect x="10" y="20" width="260" height="120" rx="8" fill="#6f7a84"/><rect x="22" y="32" width="236" height="96" rx="4" fill="#4a545e"/>' +
        (tray ? '<rect x="40" y="44" width="200" height="74" fill="#eaf4ff" transform="rotate(-3 140 80)"/><path d="M56 62h140M56 76h160M56 90h120" stroke="#1f5a8a" stroke-width="3" transform="rotate(-3 140 80)"/><rect x="150" y="4" width="120" height="40" rx="4" fill="#8a96a0" transform="rotate(12 210 24)"/>' :
          '<g>' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<rect x="' + (30 + i * 38) + '" y="40" width="34" height="80" rx="4" fill="#5a646e"/><circle cx="' + (47 + i * 38) + '" cy="' + (100 - (i % 3) * 12) + '" r="13" fill="' + ['#c9a24a', '#c9a24a', '#c9c9c9', '#c9c9c9', '#c98a4a', '#c9c9c9'][i] + '"/>'; }).join('') +
          '<rect x="40" y="56" width="90" height="44" rx="3" fill="#8a7ab8" transform="rotate(-8 85 78)"/><text x="85" y="84" font-family="Bungee" font-size="16" text-anchor="middle" fill="#fff" transform="rotate(-8 85 78)">£5</text></g>');
    }
    tv = STALL.dial(box.querySelector('.ev[data-id=ft] .dlc'), { min: 0, max: 1500, step: 20, val: saved.tv || 0, fmt: STALL.money, lock: lk, change: function () { keep(); paintAll(); } });
    box.querySelector('.ev[data-id=ft] .dlc').addEventListener('click', function (e) { e.stopPropagation(); });
    ER.$$('.ev', box).forEach(function (n) {
      n.addEventListener('click', function () { if (lk()) return; var id = n.getAttribute('data-id'); on[id] = !on[id]; STALL.sfx.slip(); keep(); paintAll(); });
    });
    box.querySelector('#tray').addEventListener('click', function () {
      if (lk()) return; tray = true; tell('tray'); paint(); STALL.sfx.coins();
      msg('Under the coin tray, folded small: a note in blue pen, signed R.F.');
      ER.addClue('slip', 'Rosa’s note, under the tray', '<h4>A note, under the tray</h4><p class="hand">12.40. Swapped: my &pound;5 note in, five &pound;1 coins out, for change. Sorry, nobody here but Rory! R.F.</p>', 'slip', 'In the cash box');
      paintAll();
    });
    paintAll();
    function flash(id) { var n = box.querySelector('.ev[data-id="' + id + '"]'); n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 1100); }
    box.querySelector('#d-go').addEventListener('click', function () {
      var i, e, t = total(), ids = [], file;
      if (lk()) return;
      if (!tray) { ER.sfx.no(); msg('&ldquo;What about the bit of paper?&rdquo; says Rory. &ldquo;Kit never lifts the tray.&rdquo;'); return; }
      for (i = 0; i < EV.length; i++) {
        e = EV[i];
        if (on[e.id] && !ER.check('in', e.id)) {
          ER.sfx.no(); flash(e.id);
          if (e.why === 'card') msg('Rory squints at the receipt. &ldquo;Paid by the club&rsquo;s card, on ' + e.day + '. That money never went into the box, so it never came out of it.&rdquo;');
          else if (e.why === 'purse') msg('&ldquo;Mrs Okonjo paid for that from her own purse,&rdquo; says Rory. &ldquo;The box never saw it. We owe her two pounds, but that&rsquo;s a different problem.&rdquo;');
          else if (e.why === 'float') msg('&ldquo;The float is in Kit&rsquo;s sum,&rdquo; says Rory, &ldquo;and it&rsquo;s still in the box. It can&rsquo;t be missing from both.&rdquo;');
          else msg('Count it. A five-pound note in, five pound coins out. What did the box lose?');
          return;
        }
      }
      if (on.ft && !ER.check('tv', tv.get())) { ER.sfx.no(); flash('ft'); msg('&ldquo;How many tasters does Tomasz&rsquo;s tally show?&rdquo; says Rory. &ldquo;Kit&rsquo;s sum counted each one at the price on the board. What&rsquo;s that in money?&rdquo;'); return; }
      EV.forEach(function (q) { if (on[q.id]) ids.push(q.id); });
      if (t !== 3080 || ids.length < 4) {
        ER.sfx.no();
        msg(t < 3080 ? 'The strip explains &pound;' + (t / 100).toFixed(2) + ' of the &pound;30.80. Something else went out of the box, or was counted in and never came.' : 'The strip says &pound;' + (t / 100).toFixed(2) + ': more than the gap.');
        return;
      }
      file = ER.exit([ids.sort().join('-') + '-' + tv.get()], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('d-file', file);
      STALL.terms(['incentive']);
      STALL.mine('box', 'The cash box', '<p>Kit&rsquo;s sum: &pound;84.80. Counted: &pound;54.00. The gap: &pound;30.80.</p><p>Lemons from Hollis&rsquo;s &pound;16, ice at 11.50 &pound;5 and at 12.30 &pound;5: all paid from the box.</p><p>24 free tasters, counted at 20p: &pound;4.80 that never came in.</p><p>Rosa&rsquo;s swap: &pound;5 in, &pound;5 out. Nothing lost.</p><p>Club-card costs and Mrs O&rsquo;s ice never touched the box. Nobody stole anything.</p>', true);
      msg('The strip says &pound;30.80, and so does the blackboard. Rory stops eating his lolly.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Every penny of the gap has a receipt or a tally mark beside it. Then the door opens. It is Kit, with her complaint already written out on a page torn from the handbook.',
          'She reads your strip. She reads Rosa&rsquo;s note. Then she reads the strip again.',
          '&ldquo;Sixteen pounds of lemons from Hollis&rsquo;s. Ten pounds of ice. Four pounds eighty of tasters that nobody paid for. And Rosa&rsquo;s fiver is just a fiver.&rdquo; She sits down on the spinners. &ldquo;Nobody took anything. I spent it, and I gave it away.&rdquo;',
          '&ldquo;To win a Cup,&rdquo; says Rory helpfully. &ldquo;For selling the most things. Mrs Okonjo says a prize is an incentive. It makes people do things. Even silly things.&rdquo;',
          'Kit looks at him for a long moment. Then she folds the complaint very small and puts it in her apron. &ldquo;Come on. It&rsquo;s nearly three. We&rsquo;re going to see Mr Petrie anyway. I want to tell him about his Cup.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2800);
    });
    msg(tray ? 'Click the things on the desk that explain the gap. Click again to put one back.' : 'Click the things on the desk that explain the gap (click again to put one back). And there is a coin tray in the box.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
