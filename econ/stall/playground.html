  @keyframes haze{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(14px);opacity:.15}}
  #castle .wob{animation:wob 1.1s ease-in-out infinite;transform-origin:185px 560px}
  @keyframes wob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.975)}}
  #flagbits path{animation:flap 1.8s ease-in-out infinite}
  @keyframes flap{50%{transform:translateY(2px)}}
  #board.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.25)}}
  #hotx{display:none}
  #scene.done #hotx{display:block}

  /* the back of the price board: the schedule */
  .dm{width:min(1040px,95vw)}
  .dm-in{display:grid;grid-template-columns:1fr 430px;gap:0;background:#2b3a32 radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.09),transparent 60%);
    border:16px solid #8a5a2e;border-radius:6px;box-shadow:0 26px 70px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.35);color:#f4f1e6}
  .dm-l{padding:18px 26px 16px}
  .dm h5{margin:0;font-family:'Cabin Sketch',cursive;font-weight:700;font-size:34px;line-height:1;color:#f6d32b}
  .dm h6{margin:4px 0 12px;font-family:'Architects Daughter',cursive;font-weight:400;font-size:17px;color:#cfe3d4}
  .dm table{border-collapse:collapse;width:100%}
  .dm th{font-family:'Cabin Sketch',cursive;font-weight:400;font-size:20px;text-align:left;padding:0 0 6px;border-bottom:2px solid rgba(244,241,230,.6);color:#cfe3d4}
  .dm td{padding:4px 0;border-bottom:1px dashed rgba(244,241,230,.28);font-family:'Cabin Sketch',cursive;font-size:30px}
  .dm td.p{width:42%;color:#f6d32b}
  .dm .dl b{font-family:'Cabin Sketch',cursive;font-size:34px;min-width:2em;line-height:1}
  .dm .dl{flex-direction:row;gap:8px}
  .dm .dl button{width:34px;height:34px;line-height:34px;border:2px solid rgba(244,241,230,.5);border-radius:50%;font-size:13px;color:#f4f1e6}
  .dm td small{font-family:'Architects Daughter',cursive;font-size:15px;color:#cfe3d4;margin-left:10px}
  .dm-r{border-left:2px dashed rgba(244,241,230,.3);padding:10px 12px}
  .dm-r svg{width:100%;height:auto}
  .dm .kit{margin:10px 0 0;font-family:'Architects Daughter',cursive;font-size:16px;color:#f8c8d8}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null;

  /* the drawing: sun rays, windows, scallops, bunting, jugs, the queue, the people */
  (function () {
    var s = '', i, x;
    for (i = 0; i < 12; i++) s += '<path d="M180 96L' + (180 + Math.cos(i * Math.PI / 6) * 140).toFixed(0) + ' ' + (96 + Math.sin(i * Math.PI / 6) * 140).toFixed(0) + '" stroke="#fff6b0" stroke-width="10" stroke-linecap="round"/>';
    $('#rays').innerHTML = s; s = '';
    for (x = -600; x < 2200; x += 150) {
      if (x > 600 && x < 1000) continue;
      s += '<rect x="' + x + '" y="230" width="90" height="110" fill="#e8dcc4"/><rect x="' + (x + 6) + '" y="236" width="78" height="98" fill="#9cc8e6"/><path d="M' + (x + 45) + ' 236v98M' + (x + 6) + ' 285h78" stroke="#e8dcc4" stroke-width="5"/>';
    }
    $('#wins').innerHTML = s;
    function scal(x0, x1, y, col) { var p = 'M' + x0 + ' ' + y, n = Math.round((x1 - x0) / 40), w = (x1 - x0) / n; for (i = 0; i < n; i++) p += 'q' + (w / 2) + ' 30 ' + w + ' 0'; return p + 'z'; }
    $('#scal1').setAttribute('d', scal(360, 880, 256)); $('#scal2').setAttribute('d', scal(1060, 1520, 264));
    $('#bunt').innerHTML = STALL.bunting(-200, 40, 700, 70, 30, 16, ['#e2453a', '#f6d32b', '#2f8ac9', '#3a8a4a', '#fff']) + STALL.bunting(700, 70, 1800, 30, 34, 18, ['#f6d32b', '#c2185b', '#1f8a86', '#fff', '#e2453a']);
    $('#jugs').innerHTML = '<g opacity=".95"><path d="M580 476v-44q0 -8 8 -8h30q8 0 8 8v44z" fill="#fff6a8" stroke="#c9a26a" stroke-width="2"/><path d="M626 434q16 2 14 18t-14 16" fill="none" stroke="#c9a26a" stroke-width="3"/>' +
      '<path d="M760 476v-44q0 -8 8 -8h30q8 0 8 8v44z" fill="#fffde6" stroke="#c9a26a" stroke-width="2" opacity=".7"/></g>' + STALL.lemon(690, 466, 11, 10) + STALL.lemon(712, 468, 11, -20) + STALL.lemon(702, 452, 10, 30);
    $('#lafront').innerHTML = '<circle cx="800" cy="590" r="50" fill="#f6d32b" stroke="#fff" stroke-width="6"/>' + STALL.slice(800, 590, 37) +
      '<text x="525" y="580" class="cH" font-size="30" text-anchor="middle" fill="#fff">fresh lemonade</text><text x="525" y="620" class="cH" font-size="20" text-anchor="middle" fill="#f6d32b">for the minibus fund!</text>';
    s = '';
    [[1170, 870, '#2a1f18', '#e2453a'], [1238, 880, '#c4672a', '#2f8ac9'], [1306, 866, '#111', '#f6d32b'], [1376, 878, '#6b4a2a', '#3a8a4a'], [1446, 870, '#2a1f18', '#c2185b'], [1516, 882, '#e2c88a', '#2f8ac9'], [1588, 872, '#111', '#e2453a'], [1660, 880, '#6b4a2a', '#f6d32b']].forEach(function (q, k) {
      s += '<g transform="translate(' + q[0] + ' ' + q[1] + ') scale(' + (0.78 + (k % 2) * 0.05) + ')">' + STALL.person({ hair: q[2], face: false, top: q[3], legs: k % 3 ? 'shorts' : 'trousers', shadow: 0.15 }) + '</g>';
    });
    $('#queue').innerHTML = s;
    $('#rosa').innerHTML = STALL.who('rosa', { smile: 2, extra: '<path d="M40 -112l26 -30" stroke="#c99a72" stroke-width="12" stroke-linecap="round"/><rect x="56" y="-170" width="24" height="34" rx="3" fill="#fff6a8" stroke="#c9a26a" stroke-width="2"/>' });
    $('#rory').innerHTML = STALL.who('rory', { smile: 6, extra: '<path d="M39 -112l10 -40" stroke="#fff" stroke-width="3"/><rect x="40" y="-176" width="18" height="28" rx="7" fill="#e2453a"/>' });
    $('#kit').innerHTML = STALL.who('kit', { smile: -3, extra: '<rect x="-64" y="-150" width="58" height="40" rx="4" fill="#5a6470"/><rect x="-64" y="-150" width="58" height="10" fill="#7a8490"/><rect x="-40" y="-132" width="10" height="6" fill="#2a2c33"/><circle cx="6" cy="-268" r="2.5" fill="#fff"/>' });
  })();

  ER.init({
    theme: 'econ', story: 'stall', storyTitle: 'Squeezed', id: 'playground', no: 'I', title: 'The Playground',
    go: 'Walk over to the stall',
    intro: [
      'Friday, quarter past one, on the hottest day of the year. Fennel Street School&rsquo;s Summer Market fills the playground: cakes, a tombola, a bouncy castle too hot to touch, and two lemonade stalls side by side.',
      'You joined the Business Club last week. You have spent the whole morning at the swimming gala, and you have come straight here with wet hair, to help on the club&rsquo;s stall, LEMON AID. Every penny of its profit goes to the school&rsquo;s new minibus.',
      'The hatch of LEMON AID is shut. The captain is standing in front of it with the cash box under her arm, and she does not look like somebody who wants help.'
    ],
    exit: {"next":"kitchen","w":{"45693a43":"8cc4c130"}}, tags: {"r80":["fe9b727f"],"r60":["b00e73fa"],"r40":["bb5e0077"],"r20":["abb5d329"],"m40":["040107dd","347516ff"],"d40":["e76e388e","f8031090"],"d60":["5b97b8f7"],"d80":["d0e6dc81"],"d20":["8666bf38"],"h20":["58371198","e5e29f43"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('a-file') || null; told = ER.flag('a-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.kit && told.book && told.tally && told.board; }
  function paint() {
    $('#board').classList.toggle('ready', !!(ready() && !nextFile));
    $('#scene').classList.toggle('done', !!nextFile);
    ER.pips((told.kit ? 1 : 0) + (told.book ? 1 : 0) + (told.tally && told.board ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }

  function hints() {
    if (nextFile) return ['go', ['The schedule is on the board. Kit has sent you to the kitchen behind the canteen: the button at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['lock', [
      'Put Kit&rsquo;s price board and Tomasz&rsquo;s tally side by side (both are in your notebook). For each ten minutes on the tally, what did the board say at that time?',
      'Every row of the tally is ten minutes. If a price stayed up for twenty minutes, it has two rows: the schedule wants ONE lot of ten minutes. And if the rows for one price say 8, 7, 9 and 8, a fair figure for ten minutes is the one in the middle of them.',
      'Read Tomasz&rsquo;s note at 11.40. From then on the sun was out, and the morning was over: the rows after 11.40 belong to a different line. Use only the rows before 11.40, and the 40p rows to use are four.'
    ]];
    if (!told.kit) return ['kit', ['Kit is the girl with the cash box, in front of the yellow stall. Talk to her.', 'Kit Ashworth, in the green apron. She will tell you what has gone wrong.']];
    if (!told.book) return ['book', ['Kit says Mrs Okonjo left the club a handbook. It is the blue ring binder on the counter of LEMON AID.', 'Click the blue binder on the counter, to the left of the jugs. Page 4 is the one for now.']];
    if (!told.tally || !told.board) return ['data', [
      'To build a demand schedule you need two things: what the price was, and how many cups were sold. Each of them is written down somewhere on this stall.',
      (told.tally ? '' : 'Tomasz&rsquo;s tally sheet is on a clipboard, hanging on the left pole of the stall. ') + (told.board ? '' : 'Kit&rsquo;s price board stands on the tarmac in front of the stall: read it.')
    ]];
    return ['board', ['Everything is in your notebook now. Click the price board again: Mrs Okonjo wanted the schedule on the back of it.', 'The A-frame board on the tarmac, to the right of LEMON AID.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The schedule is on the back of the board, and Kit is holding the kitchen key.'); return; }
    if (told.in) { busy = false; ER.say('The playground, quarter past one. 31° by the door.'); return; }
    tell('in');
    ER.narrate([
      'The playground is shimmering. Somebody has put the thermometer by the school door in the shade, and it still says 31°.',
      'LEMON AID is yellow and green, with a lemon painted on the front. Its hatch is shut. A board hangs from it: BACK SOON.',
      'Next door is THE SQUEEZE, all blue and white. Its queue goes past the tombola, round the bins and off towards the car park.',
      'Kit Ashworth, captain of the Business Club, is standing in front of LEMON AID with the cash box under her arm. Her little brother Rory is beside a crate, eating a lolly.',
      '&ldquo;You&rsquo;re late,&rdquo; says Kit. &ldquo;And something terrible has happened.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#kit').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Kitchen,&rdquo; says Kit. &ldquo;Mrs Cheung. Receipts. And don&rsquo;t touch her squeezer without asking.&rdquo;'); return; }
    ER.talk({
      who: 'Kit Ashworth', role: 'Year 10 · captain, Lemon Aid', face: STALL.face('kit', 'cross'),
      lines: [
        { note: 'She has chalk on her nose, the cash box under one arm, and the look of somebody who has been right all day.', a: '&ldquo;Two hundred and seventy cups. TWO HUNDRED AND SEVENTY. Nobody in this market has sold more. At three o&rsquo;clock Mr Petrie gives the Market Cup to the stall that sells the most, and it is going to be us.&rdquo;' },
        { q: 'So why is the hatch shut?', a: 'The ice ran out just before one. We tried warm lemonade for ten minutes. In this? Not one cup. Tomasz has gone to the ice van in the car park, and there&rsquo;s a queue there too, because there&rsquo;s a queue for everything today.' },
        { q: 'What&rsquo;s terrible, then?', a: 'This.</p><p>She bangs the cash box. &ldquo;I&rsquo;ve counted it twice. Fifty-four pounds. There should be eighty-four pounds eighty. Somebody has taken thirty pounds eighty out of this box, and I know exactly who.&rdquo;' },
        { q: 'Who?', a: 'Rosa Ferreira. Next door. Rory saw her with her hand in our cash box at twenty to one. She was in the Business Club. She wrote our recipe. Then she walked out and set up next door with the SAME recipe. At half past two I&rsquo;m going to Mr Petrie. Her stall gets shut, and she&rsquo;s out of the Cup.' },
        { q: 'Where is Mrs Okonjo?', a: 'On first aid in the car park. Two Year 7s have fainted. She left me the handbook and one job: try different prices in the morning, count everything, and by lunch put the demand schedule on the back of the price board. I haven&rsquo;t had time. I&rsquo;ve been SELLING.' },
        { note: 'She pushes the price board towards you with her foot.', a: '&ldquo;You&rsquo;re the new one. Do the schedule, if you want something to do. Then you&rsquo;ll see what we should have taken, and you can come with me to Mr Petrie.&rdquo;' }
      ],
      clue: { id: 'kit', title: 'Kit Ashworth: two hundred and seventy cups', kind: 'What she said' },
      done: function (seen) { if (seen && tell('kit')) { paint(); ER.say('The handbook is the blue binder on the counter. The price board is on the tarmac. The tally is on the pole.'); } }
    });
  });
  $('#rory').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Rory Ashworth', role: 'Year 7 · Kit’s brother, unpaid', face: STALL.face('rory', 'smile'),
      lines: [
        { note: 'He is eating an ice lolly very slowly, to make it last.', a: '&ldquo;I saw her. Rosa. At twenty to one. Kit had gone to the kitchen for a jug, and Tomasz had gone for ice, and I was minding the queue.&rdquo;' },
        { q: 'What did she do?', a: 'She opened our cash box and did something with the coins. Then she put a bit of paper in it. Or took a bit of paper out. I couldn&rsquo;t see properly. My lolly was in the way.' },
        { q: 'Did anybody else take money out of the box?', a: 'Me. Kit gave me sixteen pounds out of it at ten to twelve, to buy eighty lemons at Hollis&rsquo;s, the shop on the corner. Mrs Cheung&rsquo;s lemons were nearly gone. I brought the receipt back. Kit gave it to Mrs Cheung. Kit gives all the receipts to Mrs Cheung.' },
        { q: 'Who is usually right, Kit or Rosa?', a: 'Kit is always right. That&rsquo;s what she says.</p><p>He looks round to check that his sister is not listening. &ldquo;Rosa is right more often. Don&rsquo;t tell Kit.&rdquo;' }
      ],
      clue: { id: 'rory', title: 'Rory Ashworth: what he saw at 12.40', kind: 'What he said' },
      done: function (seen) { if (seen) tell('rory'); }
    });
  });
  STALL.thing('#rosa', null, '&ldquo;Not now,&rdquo; says Rosa, pouring with one hand and taking coins with the other. &ldquo;My queue goes round the bins. Come and find me when I&rsquo;ve run out, which at forty pence will be soon.&rdquo;', isBusy);

  /* ---------- papers ---------- */
  var DIA = '<svg viewBox="0 0 280 250"><g font-family="Architects Daughter,cursive" font-size="13" fill="#1f2a33">' +
    '<path d="M40 14V214H270" fill="none" stroke="#1f2a33" stroke-width="2.4"/><path d="M34 22l6 -10 6 10M262 208l10 6 -10 6" fill="none" stroke="#1f2a33" stroke-width="2.4"/>' +
    '<text x="10" y="18" font-weight="700">price</text><text x="226" y="236" font-weight="700">cups</text>' +
    '<path d="M60 40L190 196" stroke="#2b5c9e" stroke-width="4" stroke-linecap="round"/><text x="104" y="40" fill="#2b5c9e">demand</text>' +
    '<circle cx="96" cy="83" r="6" fill="#c2185b"/><circle cx="146" cy="143" r="6" fill="#c2185b"/><path d="M106 98l26 30" stroke="#c2185b" stroke-width="2.5"/><path d="M126 128l8 2 -2 -8" fill="none" stroke="#c2185b" stroke-width="2.5"/>' +
    '<text x="146" y="114" fill="#c2185b">new price:</text><text x="146" y="128" fill="#c2185b">move ALONG</text>' +
    '<path d="M150 40L262 174" stroke="#f2b705" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/><text x="200" y="66" fill="#b08200">a hot day:</text><text x="196" y="80" fill="#b08200">the whole line</text><text x="210" y="94" fill="#b08200">moves</text>' +
    '<path d="M120 60h40" stroke="#b08200" stroke-width="2.5"/><path d="M152 54l9 6 -9 6" fill="none" stroke="#b08200" stroke-width="2.5"/></g></svg>';
  var BOOK = '<h4>Business Club Handbook</h4><h3><i>4</i>Demand: how many, at what price?</h3><div class="two"><div>' +
    '<p><b>Demand</b> is how many people will buy at each price. Write it as a table (a <b>demand schedule</b>) and draw it as a line (a <b>demand curve</b>).</p>' +
    '<p>The rule: the higher the price, the fewer people buy. Change your own price and you move <b>along</b> the line.</p>' +
    '<p>Some things move the <b>whole line</b>: the weather, a new stall next door, a rumour that your lemonade is wonderful (or awful). Then people buy more, or fewer, at <i>every</i> price. That is a <b>shift</b>.</p>' +
    '<p>To find your schedule, try a few prices and count. Count for the same length of time at every price, or the numbers mean nothing. And never put points from two different days on one line.</p>' +
    '<p><b>Supply</b> is the other half: how many cups sellers will make at each price. Where the two lines cross is the <b>market price</b>: everything made is sold, and nobody is left waiting.</p>' +
    '<p class="rule">The price moves you along the line. Everything else moves the line.</p></div><div class="dia">' + DIA + '</div></div>' +
    '<p class="pg"><span class="hand">Mrs O says: count, don&rsquo;t guess.</span> &middot; page 4</p>';
  $('#book').addEventListener('click', function (e) {
    if (busy) return;
    if (!told.kit) { ER.wordAt(e.clientX, e.clientY, 'handbook'); ER.say('A blue ring binder: BUSINESS CLUB HANDBOOK. Kit has her hand on it. &ldquo;Hear what&rsquo;s happened first,&rdquo; she says.'); return; }
    ER.read({ html: BOOK, cls: 'hb', clue: { id: 'demand', title: 'Handbook, page 4: Demand', kind: 'The handbook' }, done: function () {
      STALL.terms(['demand', 'demand schedule', 'demand curve', 'shift', 'supply']);
      if (tell('book')) { paint(); ER.say('A price and a count. Kit chalks the prices; Tomasz counts the cups.'); }
    } });
  });
  var TALLY = '<h4>Lemon Aid &middot; cups every ten minutes</h4><table>' +
    [['10.00', '5', 'first customer: Mr Petrie'], ['10.10', '5', ''], ['10.20', '8', ''], ['10.30', '7', 'a wasp'], ['10.40', '9', ''], ['10.50', '2', ''], ['11.00', '2', 'Kit: &ldquo;the dear one was a mistake&rdquo;'],
     ['11.10', '11', ''], ['11.20', '11', ''], ['11.30', '8', ''], ['11.40', '20', 'SUN OUT. 29&deg;. Kit: &ldquo;it&rsquo;s the 40p!&rdquo;', 1], ['11.50', '20', 'I fetch ice: &pound;5, from the cash box', 1],
     ['12.00', '23 + T4', 'KIT: 20p + FREE TASTERS (T = a taster: free, not sold)', 1], ['12.10', '23 + T4', '', 1], ['12.20', '23 + T4', '', 1], ['12.30', '23 + T4', 'I fetch ice again: &pound;5, from the cash box', 1],
     ['12.40', '23 + T4', 'Kit to the kitchen for a jug. Rory minds the stall.', 1], ['12.50', '23 + T4', 'ice nearly gone', 1], ['1.00', '0', 'Ice gone. Warm lemonade: nobody wants it.', 1], ['1.10', '&mdash;', 'Hatch shut. Kit counts the box.', 1]]
      .map(function (r) { return '<tr' + (r[3] ? ' class="hot"' : '') + '><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="m">' + r[2] + '</td></tr>'; }).join('') +
    '</table><p class="foot">Every row is ten minutes. The price is on Kit&rsquo;s board, not here: I count, she chalks. Plan T, for later: 40p, no tasters. &mdash; T.K.</p>';
  $('#tally').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TALLY, cls: 'tally', clue: { id: 'tally', title: 'Tomasz’s tally sheet', kind: 'On the pole' }, done: function () {
      if (tell('tally')) { paint(); ER.say(told.board ? 'Cups on the tally, prices on the board. Now put them together.' : 'Cups, every ten minutes. But not one price on it: Kit keeps the prices on her board.'); }
    } });
  });
  var PRICES = '<h4>LEMON AID</h4>' +
    '<p><s>60p</s> <span class="sm">from 10.00</span></p><p><s>40p</s> <span class="sm">from 10.20</span></p><p><s>80p</s> <span class="sm">from 10.50 (Mrs O: &ldquo;try a dear one&rdquo;)</span></p>' +
    '<p><s>20p</s> <span class="sm">from 11.10</span></p><p><s>40p</s> <span class="sm">from 11.30</span></p><p>20p + FREE TASTER! <span class="sm">from 12.00</span></p>' +
    '<p class="sm">CUPS TODAY: 270. MOST IN THE MARKET.</p><p class="sm">(on the back: nothing yet)</p>';
  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Four prices, four counts, and a straight chalk line through them. Two crosses sit far out to the right, by themselves.'); return; }
    if (!told.board) {
      ER.read({ html: PRICES, cls: 'chalk', clue: { id: 'prices', title: 'Kit’s price board', kind: 'On the tarmac' }, done: function () {
        if (tell('board')) { paint(); ER.say(told.tally ? 'Prices on the board, cups on the tally. Now put them together.' : 'Every price Kit tried today, rubbed out and written again. The cups are counted somewhere else.'); }
      } });
      return;
    }
    if (!told.kit) { ER.say('Kit puts her foot on the board. &ldquo;Ask first.&rdquo;'); return; }
    if (!told.book) { ER.say('The back of the board is empty. Mrs Okonjo&rsquo;s handbook would tell you what a demand schedule is: the blue binder on the counter.'); return; }
    if (!told.tally) { ER.say('You have the prices. But how many cups did they sell at each one? Tomasz counted: his tally is on the left pole.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  var RULES = '<h4>Summer Market Rules</h4><h5>Fennel Street School &middot; Mr D. Petrie, Deputy Head</h5>' +
    '<p><b>1</b>Every stall pays &pound;5 for its pitch. All profits go to the minibus fund.</p>' +
    '<p><b>2</b>Stalls set their own prices.</p>' +
    '<p><b>3</b>Keep your pitch tidy. The bins are by the gate.</p>' +
    '<p><b>4</b>THE MARKET CUP will be given at 3 p.m. to the stall that sells the most. One cup, one cake or one go on the tombola counts as one.</p>' +
    '<p class="new"><b>5</b>(added at 12 noon) FAIR PRICE RULE. Because of the heat, no drink may be sold for more than 40p, so that everybody can afford a drink.</p>' +
    '<p class="sig">D.P.</p>';
  $('#rules').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: RULES, cls: 'rules', clue: { id: 'rules', title: 'The Summer Market rules', kind: 'On the pole' }, done: function () {
      if (tell('rules')) ER.say('Rule 2 says stalls set their own prices. Rule 5 was stuck on at twelve, and says they don&rsquo;t.');
    } });
  });
  STALL.thing('#therm', null, 'The thermometer by the school door: 31°, in the shade. The forecast this morning said 22, and cloudy.', isBusy);
  STALL.thing('#castle', 'bouncy castle', 'The bouncy castle is so hot that the Year 7s take turns to bounce for ten seconds and then lie down in the shade of the tombola.', isBusy);
  STALL.thing('#queue', null, 'Rosa&rsquo;s queue goes past the tombola, round the bins and out towards the car park. Nobody in it looks as if they are having a good time.', isBusy);
  STALL.thing('#rboard', null, 'THE SQUEEZE: 40p. Under the 40 you can still see an 80, rubbed out with a wet thumb at twelve o&rsquo;clock.', isBusy);
  STALL.thing('#hatch', 'hatch', 'BACK SOON, in Kit&rsquo;s writing. Under it, in smaller letters and somebody else&rsquo;s: (with ice, we hope. T.K.)', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the back of the price board: the demand schedule ---------- */
  function makeLock() {
    var P = [80, 60, 40, 20], vals = ER.flag('a-vals') || { 80: 0, 60: 0, 40: 0, 20: 0 }, dials = {}, wait = false;
    var box = ER.el('div', 'pz dm');
    box.innerHTML = '<div class="dm-in"><div class="dm-l"><h5>Demand schedule</h5><h6>a cool morning &middot; cups sold in ten minutes</h6><table><tr><th>price</th><th>cups in ten minutes</th></tr>' +
      P.map(function (p) { return '<tr><td class="p">' + p + 'p</td><td><span class="dlx" data-p="' + p + '"></span></td></tr>'; }).join('') +
      '</table><p class="kit">Mrs O: &ldquo;Then draw it. A good schedule makes a good line.&rdquo;</p></div>' +
      '<div class="dm-r"><svg viewBox="0 0 420 400"><g id="gr"></g><g id="pts"></g><g id="hotx2"></g></svg></div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="d-go">Show Kit</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    /* the graph: cups 0 to 30 across, price 0 to 100p up */
    function gx(c) { return 50 + c * 12; } function gy(p) { return 350 - p * 3; }
    (function () {
      var s = '<g font-family="Cabin Sketch,cursive" fill="#f4f1e6"><path d="M50 30V350H410" fill="none" stroke="#f4f1e6" stroke-width="3"/>', i;
      for (i = 20; i <= 100; i += 20) s += '<path d="M44 ' + gy(i) + 'h12" stroke="#f4f1e6" stroke-width="2"/><text x="38" y="' + (gy(i) + 6) + '" font-size="17" text-anchor="end">' + (i === 100 ? '£1' : i + 'p') + '</text><path d="M56 ' + gy(i) + 'H410" stroke="#f4f1e6" stroke-width="1" opacity=".12"/>';
      for (i = 5; i <= 30; i += 5) s += '<path d="M' + gx(i) + ' 344v12" stroke="#f4f1e6" stroke-width="2"/><text x="' + gx(i) + '" y="376" font-size="17" text-anchor="middle">' + i + '</text>';
      s += '<text x="408" y="396" font-size="18" text-anchor="end" fill="#cfe3d4">cups</text><text x="14" y="22" font-size="18" fill="#cfe3d4">price</text></g>';
      box.querySelector('#gr').innerHTML = s;
    })();
    function draw() {
      var s = '', pts = P.map(function (p) { return [gx(vals[p]), gy(p)]; });
      s += '<path d="M' + pts.map(function (q) { return q[0] + ' ' + q[1]; }).join('L') + '" fill="none" stroke="#f6d32b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>';
      pts.forEach(function (q) { s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="7" fill="#f4f1e6"/>'; });
      box.querySelector('#pts').innerHTML = s;
    }
    ER.$$('.dlx', box).forEach(function (n) {
      var p = +n.getAttribute('data-p');
      dials[p] = STALL.dial(n, { min: 0, max: 30, val: vals[p], lock: function () { return wait || !!nextFile; }, change: function (v) { vals[p] = v; ER.flag('a-vals', vals); draw(); } });
    });
    draw();
    function hot() {
      box.querySelector('#hotx2').innerHTML = '<g stroke="#f8a8c8" stroke-width="4" stroke-linecap="round"><path d="M' + (gx(20) - 8) + ' ' + (gy(40) - 8) + 'l16 16m0 -16l-16 16M' + (gx(23) - 8) + ' ' + (gy(20) - 8) + 'l16 16m0 -16l-16 16"/></g>' +
        '<path d="M' + gx(14) + ' ' + gy(80) + 'L' + gx(23) + ' ' + gy(20) + '" stroke="#f8a8c8" stroke-width="3" stroke-dasharray="8 7" fill="none"/>' +
        '<text x="' + (gx(20) + 2) + '" y="' + (gy(80) - 4) + '" font-family="Architects Daughter,cursive" font-size="16" fill="#f8a8c8">after 11.40</text>';
    }
    box.querySelector('#d-go').addEventListener('click', function () {
      var right = 0, first = null, i, p, v, file, why;
      if (wait || nextFile) return;
      for (i = 0; i < P.length; i++) { p = P[i]; if (ER.check('r' + p, vals[p])) right++; else if (first === null) first = p; }
      if (right === 4) {
        file = ER.exit([P.map(function (q) { return vals[q]; }).join('-')], { wait: true });
        if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
        wait = true; nextFile = file; ER.flag('a-file', file); hot(); STALL.sfx.chalk();
        msg('Kit looks at the line for a long time. &ldquo;The dearer the cup,&rdquo; she says, &ldquo;the fewer people bought it. All right. Now put on the hot ones.&rdquo;');
        STALL.mine('lines', 'Two lines on the board', '<p>A cool morning, cups in ten minutes:</p><p>80p: 2 &middot; 60p: 5 &middot; 40p: 8 &middot; 20p: 11</p><p>After 11.40 (the sun came out):</p><p>40p: 20 &middot; 20p: 23 (+4 free tasters)</p><p>Twelve more cups at every price. The price moves you along a line. The sun moved the whole line.</p>', true);
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            'Four points in a neat row, sloping down: the dearer the cup, the fewer people bought it. Then you chalk on the two hot rows: 40p, twenty cups. And after twelve, 20p, twenty-three.',
            'They are nowhere near the line. They sit together, far out to the right, as if somebody had picked the whole line up and moved it.',
            '&ldquo;Twelve more,&rdquo; says Rory, who has been counting on his lolly stick. &ldquo;At forty pence and at twenty pence. Twelve more cups every ten minutes, both times.&rdquo;',
            '&ldquo;The sun,&rdquo; says Kit slowly. &ldquo;It wasn&rsquo;t my twenty pence that sold all those cups. It was the sun. At forty pence we&rsquo;d still have sold twenty.&rdquo; She looks down at the cash box. &ldquo;Then where&rsquo;s the money?&rdquo;',
            '&ldquo;Mrs Cheung&rsquo;s got the receipts,&rdquo; says Rory. &ldquo;Kit gives them to her because she loses them.&rdquo; &mdash; &ldquo;I do NOT lose them.&rdquo; Kit throws you the key of the jug trolley. &ldquo;Kitchen. Behind the canteen. Find out what a cup costs, if you&rsquo;re so clever.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 3200);
        return;
      }
      ER.sfx.no(); ER.shake(box.querySelector('.dm-in'));
      v = vals[first];
      if (first === 40 && ER.check('m40', v)) why = 'Kit points at the 40p row. &ldquo;Did you put in the rows after twenty to twelve? Read what Tomasz wrote at 11.40. Is that still the same morning?&rdquo;';
      else if (first === 40 && ER.check('d40', v)) why = '&ldquo;That&rsquo;s a lot of cups for ten minutes,&rdquo; says Kit. &ldquo;Is that ONE row of the tally, or several added together?&rdquo;';
      else if (first === 60 && ER.check('d60', v)) why = '&ldquo;Sixty pence was up for twenty minutes,&rdquo; says Rory. &ldquo;The board wants ten.&rdquo;';
      else if (first === 80 && ER.check('d80', v)) why = '&ldquo;Eighty pence was up for twenty minutes,&rdquo; says Rory. &ldquo;Two rows. The board wants one.&rdquo;';
      else if (first === 20 && ER.check('d20', v)) why = '&ldquo;Twenty pence was up from ten past eleven to half past,&rdquo; says Rory. &ldquo;That&rsquo;s twenty minutes, not ten.&rdquo;';
      else if (first === 20 && ER.check('h20', v)) why = 'Kit frowns. &ldquo;That&rsquo;s twenty pence after twelve. Was the morning still cool after twelve?&rdquo;';
      else if (!v) why = 'Kit taps an empty row with the chalk. &ldquo;Every price we tried this morning goes on here.&rdquo;';
      else why = '&ldquo;Not all of it matches the tally,&rdquo; says Kit. &ldquo;For every price, find the rows when the board said that price, and only those, before the sun came out.&rdquo;';
      msg((right ? (right === 1 ? 'One row is right. ' : ['', '', 'Two', 'Three'][right] + ' rows are right. ') : 'Not one row is right yet. ') + why);
    });
    msg('Mrs Okonjo&rsquo;s job: how many cups did people buy in ten minutes at each price, on a cool morning? Click the arrows (or turn the mouse wheel) to chalk a number.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
</html>
