<style>
  body{--bg:#cfe3ee;--accent:#3a6fa8;--font-display:'Bungee',sans-serif;--font-ui:'Outfit',sans-serif;--font-body:'Lora',serif;
    --tc-bg:rgba(236,246,251,.97);--tc-ink:#16324a;--cap-bg:rgba(246,251,254,.96);--cap-ink:#16324a;--panel:#f7fbfd;--panel-ink:#16324a;--face-bg:#3a6fa8;--q-ink:#c2185b;

  .tc-theme{color:#c2185b}
  .hbtn b{color:#fff}
  #steam path{animation:steam 3.2s ease-in-out infinite;opacity:0}
  #steam path:nth-child(2){animation-delay:-1.1s}#steam path:nth-child(3){animation-delay:-2.2s}
  @keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.55}100%{opacity:0;transform:translateY(-60px)}}
  #tube{animation:tube 7s steps(1,end) infinite}
  @keyframes tube{0%{opacity:.6}4%{opacity:.3}6%{opacity:.6}61%{opacity:.45}62%{opacity:.6}}
  #fan{animation:spin 1.4s linear infinite;transform-origin:1100px 110px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #spike.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.3)}}

  /* the spike, unpicked */
  .sp{width:min(1080px,96vw)}
  .sp-in{display:grid;grid-template-columns:1fr 360px;gap:14px;background:#d9e4ea linear-gradient(#e6eef2,#c9d6de);border:10px solid #9fb0bc;border-radius:8px;padding:14px;box-shadow:0 26px 70px rgba(0,0,0,.55)}
  .sp-rc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .rc{position:relative;background:#fffef8;color:#22252a;font-family:'Courier Prime',monospace;font-size:12.5px;line-height:1.28;padding:8px 10px 6px;box-shadow:0 3px 8px rgba(0,0,0,.25);border-bottom:4px dotted #d9d6cc}
  .rc:nth-child(odd){transform:rotate(-.6deg)}.rc:nth-child(even){transform:rotate(.5deg)}
  .rc b{display:block;font-size:12.5px;letter-spacing:.04em}
  .rc .amt{display:block;font-weight:700;font-size:15px;margin-top:2px}
  .rc .hand{font-family:'Architects Daughter',cursive;font-size:13px;color:#1f5a8a;line-height:1.2}
  .rc .st{display:flex;gap:6px;margin-top:5px}
  .rc .st button{flex:1;padding:3px 0 2px;border:2px solid #9aa3ad;border-radius:3px;font-family:'Bungee',sans-serif;font-size:10.5px;color:#7a838d}
  .rc .st button:hover{border-color:#16324a;color:#16324a}
  .rc.F .st .f{background:#c2185b;border-color:#c2185b;color:#fff}
  .rc.V .st .v{background:#3a6fa8;border-color:#3a6fa8;color:#fff}
  .rc.bad{outline:4px solid #e2453a}
  .sp-r{display:flex;flex-direction:column;gap:10px}
  .pad{background:#fff;color:#16324a;padding:10px 14px;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
  .pad h5{margin:0 0 4px;font-family:'Bungee',sans-serif;font-weight:400;font-size:15px;color:#3a6fa8}
  .pad p{margin:0 0 6px;font-family:'Lora',serif;font-size:14.5px;line-height:1.35}
  .pad .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pad .row span{font-family:'Architects Daughter',cursive;font-size:15px}
  .pad .dl{flex-direction:row;gap:6px}
  .pad .dl b{font-family:'Courier Prime',monospace;font-weight:700;font-size:24px;min-width:3.4em;color:#16324a}
  .pad .dl button{width:30px;height:30px;line-height:30px;border:2px solid #9fb0bc;border-radius:50%;font-size:11px;color:#16324a}
  .pad.kit{border-left:8px solid #f6d32b}.pad.tom{border-left:8px solid #3a8a4a}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null;

  (function () {
    var s = '', i;
    for (i = 0; i < 7; i++) s += '<g transform="translate(' + (1322 + i * 34) + ' ' + (i % 2 ? 712 : 572) + ')"><path d="M0 0v-46q0 -6 6 -6h22q6 0 6 6v46z" fill="#eef8ff" fill-opacity=".7" stroke="#8fb0c8" stroke-width="2"/><path d="M34 -40q10 2 9 12t-9 10" fill="none" stroke="#8fb0c8" stroke-width="2"/></g>';
    $('#jugs').innerHTML = s;
    $('#lemons').innerHTML = STALL.lemon(880, 504, 12, 20) + STALL.slice(920, 508, 10) + '<path d="M940 512q10 -6 20 0" stroke="#f2c21b" stroke-width="3" fill="none"/>';
    $('#cheung').innerHTML = STALL.who('cheung', { smile: 1, extra: '<path d="M39 -112l26 -24" stroke="#e8c8a8" stroke-width="12" stroke-linecap="round"/><rect x="54" y="-158" width="44" height="12" rx="3" fill="#c9a26a" transform="rotate(-30 76 -152)"/>' });
  })();

  ER.init({
    theme: 'econ', story: 'stall', storyTitle: 'Squeezed', id: 'kitchen', no: 'II', title: 'Behind the Canteen',
    go: 'Push open the kitchen door',
    intro: [
      'The schedule went on the back of the board in chalk: on a cool morning, 2 cups in ten minutes at 80p, 5 at 60p, 8 at 40p and 11 at 20p. A neat line. Then the sun came out at twenty to twelve and the whole line jumped: twelve more cups at every price. It was the heat that sold Kit&rsquo;s cups, not her twenty pence.',
      'The kitchen behind the canteen is the only cool place in the school, and Mrs Cheung, who runs it, would like to keep it that way.',
      'Somewhere in here are the receipts for everything LEMON AID has bought today.'
    ],
    exit: {"next":"carpark","w":{"81bc4515":"90eef048"}}, tags: {"fx":["533236b5"],"fr":["61c40c05","475f5074"],"cup":["1d4fd515"],"pk":["9649e5cf"],"pt":["1f2037d8"],"cupm":["75ddd058"],"cupj":["26cf4ed4"],"cupx":["27a1b7b7"],"pk0":["dbfb7eb4"],"pt8":["3dcccabd"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('b-file') || null; told = ER.flag('b-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.cheung && told.card && told.recipe; }
  function paint() {
    $('#spike').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((told.cheung ? 1 : 0) + (told.card ? 1 : 0) + (told.recipe ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['Kit needs ice. Go out to the car park: the button at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['lock', [
      'Stamp each receipt first. Ask of every one: if the stall sold twice as many cups, would this cost twice as much? Then it is VARIABLE. If it would cost the same, it is FIXED.',
      'For one cup now: cost ONE JUG at today&rsquo;s prices (the recipe card says what goes into a jug; the receipts say what each thing costs: use the newest lemons and the newest ice), then share it between the 10 cups. Do not forget the paper cups.',
      'For the two plans you need how many cups people buy in ten minutes on a hot day, at 20p and at 40p: your note &ldquo;Two lines on the board&rdquo; has them. Profit = the money that comes in, minus what every cup that goes out costs. A taster goes out too.'
    ]];
    if (!told.cheung) return ['cheung', ['The cook is at the sink. Talk to Mrs Cheung.', 'Mrs Cheung, in the blue apron, in the middle of the kitchen.']];
    if (!told.card) return ['card', ['Mrs Cheung told you to read her card first. It is by the big fridge, on the left.', 'The white card with HOW I COST A DISH on it, just to the right of the fridge.']];
    if (!told.recipe) return ['recipe', ['To cost a cup of lemonade you need to know what goes into it. Rosa&rsquo;s recipe is pinned on the wall.', 'The small card with a blue strip at the top, to the right of the serving hatch.']];
    return ['spike', ['Now the receipts. They are on the steel spike on the counter.', 'The spike stands between the squeezer and the pot of soup. Click it.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Forty pence, says the board now. And no ice.'); return; }
    if (told.in) { busy = false; ER.say('The kitchen behind the canteen. Cool, and very clean.'); return; }
    tell('in');
    ER.narrate([
      'Steel, steam and white tiles. A fridge the size of a wardrobe hums to itself in the corner, and a fan turns slowly in the hood.',
      'Mrs Cheung, the cook, is standing in the middle of her kitchen with a baking tray. Behind her, on the counter, is a steel spike with a fat wad of paper pushed down on to it.',
      'On the wall: a laminated card by the fridge, and a recipe card in purple pen, with a blue strip along the top.'
    ], function () { busy = false; });
  }

  $('#cheung').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Ice,&rdquo; says Mrs Cheung, without turning round. &ldquo;Car park. And take those jugs with you.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Cheung', role: 'Cook · twenty-two years in this kitchen', face: STALL.face('cheung'),
      lines: [
        { note: 'She is scrubbing a baking tray as if it had said something rude.', a: '&ldquo;Kit Ashworth wants to open again at twenty pence. With free tasters. For the Cup, she says. She sent Rory to ask if I had any more lemons. I have not.&rdquo;' },
        { q: 'Is twenty pence a bad price?', a: 'For twenty-two years I have known what every dinner in this school costs me, to the penny. Kit knows what she sold. She does not know what it cost. That is how a person works very hard all day and goes home poorer.' },
        { q: 'What did the lemonade cost?', a: 'Everything the club bought is on my spike. Kit leaves her receipts with me, because I am the only person in this building who does not lose things. The recipe is on the wall. Rosa Ferreira wrote it, in Year 9. Best lemonade this school has ever had.' },
        { q: 'Why did Rosa leave the club?', a: 'Ask her. I will tell you what I saw: two clever girls who both wanted to be in charge of the price, and one recipe.' },
        { note: 'She points the scrubbing brush at the card by the fridge.', a: '&ldquo;Read my card first. Then sort my spike and tell me what one cup costs NOW. And then tell me which is better for ten minutes of the last hour: Kit&rsquo;s twenty pence and tasters, or Tomasz&rsquo;s forty pence. In money, not in cups.&rdquo;' }
      ],
      clue: { id: 'cheung', title: 'Mrs Cheung: in money, not in cups', kind: 'What she said' },
      done: function (seen) { if (seen && tell('cheung')) { paint(); ER.say('The card is by the fridge. The recipe is by the hatch. The receipts are on the spike.'); } }
    });
  });

  var DIA = '<svg viewBox="0 0 290 270"><g font-family="Architects Daughter,cursive" font-size="13" fill="#16324a">' +
    '<text x="8" y="16" font-weight="700" fill="#3a6fa8">Shepherd&rsquo;s pie: one tray, 20 portions</text>' +
    '<text x="12" y="38">mince</text><text x="190" y="38">&pound;6.00</text><text x="12" y="56">potatoes</text><text x="190" y="56">&pound;2.00</text><text x="12" y="74">onions, carrots</text><text x="190" y="74">&pound;1.00</text><text x="12" y="92">gravy</text><text x="190" y="92">&pound;1.00</text>' +
    '<path d="M10 100H270" stroke="#16324a" stroke-width="1.5"/><text x="12" y="118" font-weight="700">one tray</text><text x="190" y="118" font-weight="700">&pound;10.00</text><text x="12" y="138" fill="#c2185b" font-weight="700">&pound;10.00 &divide; 20 = 50p a portion</text>' +
    '<path d="M40 160V256H280" fill="none" stroke="#16324a" stroke-width="2"/><text x="6" y="172">&pound;</text><text x="222" y="268">portions</text>' +
    '<path d="M40 222H276" stroke="#c2185b" stroke-width="3"/><text x="200" y="216" fill="#c2185b">fixed</text>' +
    '<path d="M40 222L276 168" stroke="#3a6fa8" stroke-width="3"/><text x="150" y="176" fill="#3a6fa8">total cost</text>' +
    '<path d="M240 177V220" stroke="#3a6fa8" stroke-width="1.5" stroke-dasharray="4 3"/><text x="246" y="202" fill="#3a6fa8" font-size="11.5">variable</text></g></svg>';
  var CARD = '<h4>How I cost a dish<small>Mrs Cheung, every day since 2004</small></h4><div class="two"><div>' +
    '<p>There are two kinds of cost.</p>' +
    '<p><b>FIXED COSTS</b> stay the same however many you sell: the hire of a hall, a table or a tent for the day.</p>' +
    '<p><b>VARIABLE COSTS</b> go up with every portion: the food, the napkin, the box it goes in.</p>' +
    '<p>To cost one portion, add up everything in one batch and divide by the portions in the batch. Use <b>today&rsquo;s prices</b>: what the last batch cost is not what the next one will.</p>' +
    '<p><b>REVENUE</b> is the money that comes in: price &times; how many you sell. <b>PROFIT = REVENUE &minus; COST.</b> If the cost is bigger, your profit is a <b>loss</b>.</p>' +
    '<p>Fixed costs are paid whatever you choose. So to choose between two plans for the next hour, look at what changes: the revenue, and the variable costs.</p>' +
    '<p class="rule">Free food is not free. Somebody pays for every portion. If it is not the customer, it is you.</p></div>' + DIA + '</div>';
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'costing', clue: { id: 'costing', title: 'Mrs Cheung’s card: how I cost a dish', kind: 'By the fridge' }, done: function () {
      STALL.terms(['cost', 'fixed cost', 'variable cost', 'revenue', 'profit', 'loss']);
      if (tell('card')) { paint(); ER.say('A batch, today&rsquo;s prices, divide by the portions. And free food is not free.'); }
    } });
  });
  var RECIPE = '<h4>THE LEMONADE</h4><p>(R.F., Year 9)</p><p>For ONE jug. Makes 10 cups.</p><p>&middot; 4 lemons</p><p>&middot; 200 g sugar</p><p>&middot; 1 litre cold water (tap)</p><p>&middot; ice: one bag cools 5 jugs</p><p>&middot; and 10 paper cups, obviously</p>' +
    '<p>Squeeze, stir till the sugar&rsquo;s gone, ice last. Don&rsquo;t skimp on the lemons.</p><span class="cs">Tap water: free. My squeezer: free, if you wash it. &mdash; Mrs C.</span>';
  $('#recipe').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: RECIPE, cls: 'recipe', clue: { id: 'recipe', title: 'Rosa’s recipe: one jug', kind: 'On the wall' }, done: function () {
      if (tell('recipe')) { paint(); ER.say('Four lemons, 200 grams of sugar, a fifth of a bag of ice and ten paper cups make ten cups of lemonade.'); }
    } });
  });
  STALL.thing('#fridge', null, 'The fridge is full of Monday&rsquo;s dinners. There is no ice in it: the canteen&rsquo;s ice machine broke in May.', isBusy);
  STALL.thing('#hatch', 'serving hatch', 'The serving hatch is shut. CANTEEN CLOSED for the Summer Market. From the other side comes the noise of three hundred people being hot.', isBusy);
  STALL.thing('#pot', null, 'Soup, in this heat. &ldquo;For Monday,&rdquo; says Mrs Cheung. &ldquo;The weather will change. It always does.&rdquo;', isBusy);
  STALL.thing('#squeezer', 'squeezer', 'Mrs Cheung&rsquo;s lemon squeezer, washed and shining. &ldquo;Free,&rdquo; she says, &ldquo;because I am kind. Not because it is worth nothing.&rdquo;', isBusy);
  STALL.thing('#crate', 'crate', 'CANTEEN &middot; LEMONS: empty. Mrs Cheung sold the club sixty lemons on Thursday, and that was all she could spare.', isBusy);
  STALL.thing('#trolley', 'trolley', 'Seven clean jugs on the jug trolley, washed by Mrs Cheung, who would like to know why they are still in her kitchen.', isBusy);
  $('#spike').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Nine receipts, stamped and back on the spike. Two red stamps, seven blue.'); return; }
    if (!told.cheung) { ER.say('A spike full of receipts. &ldquo;Ask before you touch my spike,&rdquo; says Mrs Cheung.'); return; }
    if (!told.card) { ER.say('&ldquo;My card first,&rdquo; says Mrs Cheung. &ldquo;By the fridge. Otherwise you will just add them all up, like Kit.&rdquo;'); return; }
    if (!told.recipe) { ER.say('To cost a cup you need to know what goes into one. The recipe is on the wall by the hatch.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the spike ---------- */
  function makeLock() {
    var R = [
      { id: 'r1', h: 'FENNEL STREET SUMMER MARKET', t: 'pitch hire: one table, all day', a: 500, paid: 'paid: club card, Mon', n: 'the pitch' },
      { id: 'r2', h: '1st FENNEL STREET SCOUTS', t: 'gazebo hire, Friday', a: 400, paid: 'paid: club card, Mon', n: 'the gazebo' },
      { id: 'r3', h: 'SCHOOL CANTEEN', t: 'lemons 60 @ 15p', a: 900, paid: 'paid: club card, Thu', n: 'the canteen lemons' },
      { id: 'r4', h: 'HOLLIS STORES', t: 'lemons 80 @ 20p', a: 1600, paid: 'paid: CASH 11.50', hand: 'from the box. R.A.', n: 'the lemons from Hollis&rsquo;s' },
      { id: 'r5', h: 'CASH &amp; CARRY', t: 'sugar 8 &times; 1 kg @ &pound;1.00', a: 800, paid: 'paid: club card, Wed', n: 'the sugar' },
      { id: 'r6', h: 'CASH &amp; CARRY', t: 'paper cups 4 &times; 100 @ &pound;5.00', a: 2000, paid: 'paid: club card, Wed', n: 'the paper cups' },
      { id: 'r7', h: 'SANDOVAL&rsquo;S ICES 10.05', t: 'ice 2 bags @ &pound;1.00', a: 200, paid: 'paid: CASH', hand: 'Mrs O paid, from her own purse. We owe her &pound;2!', n: 'the ice' },
      { id: 'r8', h: 'SANDOVAL&rsquo;S ICES 11.50', t: 'ice 2 bags @ &pound;2.50', a: 500, paid: 'paid: CASH', hand: 'box. T.K.', n: 'the ice' },
      { id: 'r9', h: 'SANDOVAL&rsquo;S ICES 12.30', t: 'ice 2 bags @ &pound;2.50', a: 500, paid: 'paid: CASH', hand: 'box. T.K.', n: 'the ice' }
    ];
    var st = ER.flag('b-st') || {}, saved = ER.flag('b-vals') || {}, wait = false, d = {};
    var box = ER.el('div', 'pz sp');
    box.innerHTML = '<div class="sp-in"><div class="sp-rc">' + R.map(function (r) {
      return '<div class="rc" data-id="' + r.id + '"><b>' + r.h + '</b>' + r.t + '<span class="amt">&pound;' + (r.a / 100).toFixed(2) + '</span>' + r.paid + (r.hand ? '<br><span class="hand">' + r.hand + '</span>' : '') +
        '<div class="st"><button type="button" class="f">fixed</button><button type="button" class="v">variable</button></div></div>';
    }).join('') + '</div><div class="sp-r">' +
      '<div class="pad"><h5>One cup, now</h5><p>At today&rsquo;s prices, everything in it.</p><div class="row"><span>cost of one cup</span><i class="dlc" data-k="cup"></i></div></div>' +
      '<div class="pad kit"><h5>Kit&rsquo;s plan</h5><p>20p a cup, and 4 free tasters every ten minutes.</p><div class="row"><span>profit in ten minutes</span><i class="dlc" data-k="pk"></i></div></div>' +
      '<div class="pad tom"><h5>Tomasz&rsquo;s plan</h5><p>40p a cup, no tasters.</p><div class="row"><span>profit in ten minutes</span><i class="dlc" data-k="pt"></i></div></div>' +
      '</div></div><div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="k-go">Show Mrs Cheung</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintRc() { ER.$$('.rc', box).forEach(function (n) { var v = st[n.getAttribute('data-id')]; n.classList.toggle('F', v === 'F'); n.classList.toggle('V', v === 'V'); }); }
    ER.$$('.rc', box).forEach(function (n) {
      var id = n.getAttribute('data-id');
      n.querySelector('.f').addEventListener('click', function () { if (wait || nextFile) return; st[id] = st[id] === 'F' ? '' : 'F'; ER.flag('b-st', st); STALL.sfx.thud(); paintRc(); });
      n.querySelector('.v').addEventListener('click', function () { if (wait || nextFile) return; st[id] = st[id] === 'V' ? '' : 'V'; ER.flag('b-st', st); STALL.sfx.thud(); paintRc(); });
    });
    paintRc();
    function keep() { ER.flag('b-vals', { cup: d.cup.get(), pk: d.pk.get(), pt: d.pt.get() }); }
    d.cup = STALL.dial(box.querySelector('[data-k=cup]'), { min: 0, max: 250, step: 1, val: saved.cup || 0, fmt: STALL.money, change: keep, lock: function () { return wait || !!nextFile; } });
    d.pk = STALL.dial(box.querySelector('[data-k=pk]'), { min: -600, max: 900, step: 20, val: saved.pk || 0, fmt: function (v) { return v === 0 ? '0p' : STALL.money(v); }, change: keep, lock: function () { return wait || !!nextFile; } });
    d.pt = STALL.dial(box.querySelector('[data-k=pt]'), { min: -600, max: 900, step: 20, val: saved.pt || 0, fmt: function (v) { return v === 0 ? '0p' : STALL.money(v); }, change: keep, lock: function () { return wait || !!nextFile; } });
    function flash(n) { n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 1100); }
    box.querySelector('#k-go').addEventListener('click', function () {
      var i, r, n = 0, fx = [], cup = d.cup.get(), pk = d.pk.get(), pt = d.pt.get(), file;
      if (wait || nextFile) return;
      R.forEach(function (q) { if (st[q.id]) n++; if (st[q.id] === 'F') fx.push(q.id); });
      if (n < R.length) { ER.sfx.no(); msg('&ldquo;Nine receipts,&rdquo; says Mrs Cheung, &ldquo;and ' + (n ? 'only ' + n : 'not one') + ' of them stamped. Every cost is one kind or the other.&rdquo;'); return; }
      for (i = 0; i < R.length; i++) {
        r = R[i];
        if ((st[r.id] === 'F') !== ER.check('fr', r.id)) {
          ER.sfx.no(); flash(box.querySelector('.rc[data-id="' + r.id + '"]'));
          msg(st[r.id] === 'F' ? '&ldquo;' + r.n.charAt(0).toUpperCase() + r.n.slice(1) + ', fixed?&rdquo; says Mrs Cheung. &ldquo;Sell twice as many cups and you need twice as much. That cost goes up with every cup.&rdquo;' :
            '&ldquo;' + r.n.charAt(0).toUpperCase() + r.n.slice(1) + ', variable?&rdquo; says Mrs Cheung. &ldquo;Does it cost more if you sell one more cup? It was paid once, for the day, whatever you sell.&rdquo;');
          return;
        }
      }
      if (!ER.check('cup', cup)) {
        ER.sfx.no(); ER.shake(box.querySelector('.pad'));
        if (ER.check('cupm', cup)) msg('&ldquo;Those are this morning&rsquo;s prices,&rdquo; says Mrs Cheung, &ldquo;or you have left something out. My lemons are gone: where do the next ones come from? What does ice cost now? And did you count the paper cups?&rdquo;');
        else if (ER.check('cupj', cup)) msg('&ldquo;That is a whole jug,&rdquo; says Mrs Cheung. &ldquo;How many cups does a jug make?&rdquo;');
        else if (ER.check('cupx', cup)) msg('&ldquo;Which ice did you use?&rdquo; says Mrs Cheung. &ldquo;Lucia&rsquo;s van is not charging what it charged at ten o&rsquo;clock.&rdquo;');
        else msg('&ldquo;Not what my card would say,&rdquo; says Mrs Cheung. &ldquo;One jug, at today&rsquo;s prices, every single thing in it. Then share it out between the cups.&rdquo;');
        return;
      }
      if (!ER.check('pk', pk)) {
        ER.sfx.no(); ER.shake(box.querySelector('.pad.kit'));
        if (ER.check('pk0', pk)) msg('&ldquo;And the four tasters?&rdquo; says Mrs Cheung. &ldquo;They cost exactly as much as the cups she sells.&rdquo;');
        else msg('&ldquo;Kit&rsquo;s plan,&rdquo; says Mrs Cheung. &ldquo;How many cups do people buy in ten minutes at twenty pence, on a day like this? And how many more does she give away? Money in, minus what every cup that goes out costs.&rdquo;');
        return;
      }
      if (!ER.check('pt', pt)) {
        ER.sfx.no(); ER.shake(box.querySelector('.pad.tom'));
        if (ER.check('pt8', pt)) msg('&ldquo;That is the money that comes in,&rdquo; says Mrs Cheung. &ldquo;What goes out?&rdquo;');
        else msg('&ldquo;Tomasz&rsquo;s plan: forty pence, no tasters,&rdquo; says Mrs Cheung. &ldquo;How many cups in ten minutes at forty pence, on a day like this?&rdquo;');
        return;
      }
      file = ER.exit([fx.sort().join('') + '-' + cup + '-' + (pk < 0 ? 'm' + (-pk) : pk) + '-' + pt], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('b-file', file);
      STALL.mine('cup', 'One cup, now', '<p>One jug at today&rsquo;s prices: lemons 4 &times; 20p = 80p, sugar 20p, ice &pound;2.50 &divide; 5 = 50p, cups 10 &times; 5p = 50p.</p><p>&pound;2.00 a jug: 20p a cup. (This morning it was 15p.)</p><p>Fixed: the pitch &pound;5 and the gazebo &pound;4.</p><p>Ten minutes at 20p + 4 tasters: 23 &times; 20p &minus; 27 &times; 20p = &minus;80p.</p><p>Ten minutes at 40p: 20 &times; 40p &minus; 20 &times; 20p = &pound;4.00.</p>', true);
      msg('Mrs Cheung reads your figures upside down, which is how cooks read everything. &ldquo;Yes,&rdquo; she says. &ldquo;In money, not in cups.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Twenty pence and tasters,&rdquo; says Mrs Cheung. &ldquo;Twenty-seven cups out every ten minutes, and eighty pence gone. Forty pence: twenty cups out, and four pounds in. Fewer cups. More money.&rdquo;',
          'Kit is in the doorway. Nobody heard her come in. She has the price board under her arm, and she is looking at the receipts as if they had bitten her.',
          '&ldquo;Selling more,&rdquo; she says slowly, &ldquo;isn&rsquo;t the same as earning more.&rdquo; She rubs out 20p + FREE TASTER with her sleeve, and chalks 40p.',
          '&ldquo;Fine. Forty. Tomasz&rsquo;s plan. It&rsquo;s the most the rule allows anyway.&rdquo; She looks at the empty jugs. &ldquo;But it doesn&rsquo;t matter what the price is. We&rsquo;ve got thirty-two lemons and no ice, and Tomasz has been in the queue at the van for a quarter of an hour.&rdquo;',
          '&ldquo;Then go and help him,&rdquo; says Mrs Cheung, and turns back to her tray. &ldquo;And take those jugs. They make my kitchen look untidy.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2800);
    });
    msg('Stamp every receipt FIXED or VARIABLE. Then set the three figures with the arrows (or the mouse wheel), and show Mrs Cheung.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
