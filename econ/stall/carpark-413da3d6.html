  ER.init({
    theme: 'econ', story: 'stall', storyTitle: 'Squeezed', id: 'carpark', no: 'III', title: 'The Car Park',
    go: 'Cross the car park',
    intro: [
      'Mrs Cheung&rsquo;s spike gave up its secrets: two fixed costs (the pitch, £5, and the gazebo, £4) and seven variable ones. At today&rsquo;s prices a jug costs £2.00, so a cup costs 20p. Kit&rsquo;s plan, 20p and four free tasters, loses 80p every ten minutes. Tomasz&rsquo;s, 40p, makes £4.00. Fewer cups, more money.',

      'Give each plan a value in pounds: the money the club will have taken by three o&rsquo;clock, minus anything new it has to pay for. For each plan ask two things: how many minutes will the stall be open, and how many jugs can it make? Whichever gives fewer cups is the number that counts.',

  var PAGE = '<h4>Business Club Handbook</h4><h3><i>9</i>What you give up</h3><div class="two"><div>' +
    '<p>Every choice has a cost, even when no money changes hands.</p>' +
    '<p>The <b>opportunity cost</b> of a choice is the best thing you give up to make it. Not everything you could have done: you could only ever have done one of them. Just the best one you said no to.</p>' +
    '<p><b>Example.</b> Saturday morning. Babysitting pays &pound;15. Washing cars pays &pound;12. Revision pays nothing today. Choose babysitting, and its opportunity cost is the car wash: &pound;12. Choose the car wash, and its opportunity cost is &pound;15. Ouch.</p>' +

      lines: [
        { note: 'He is standing very still, the way people do when they have been in a queue for twenty minutes.', a: '&ldquo;I joined this queue at twenty-five past one. Since then I have moved three places in twelve minutes, and there are ten people in front of me. You can do the sum. I have done it three times, hoping it would come out differently.&rdquo;' },
        { q: 'What will the ice cost?', a: 'Two bags at two pounds fifty. Five pounds from the cash box. Lucia serves everybody the same way: one person, then the next. She is very fair and very slow.' },
        { q: 'What is left at the stall?', a: 'I counted before I came. Thirty-two lemons, not squeezed yet. Plenty of sugar, plenty of cups. No ice, and nobody buys warm lemonade at 31 degrees. We tried.' },
        { q: 'And the last hour?', a: 'The market shuts at three. The price is forty pence, the most the Fair Price rule allows, and at forty pence on a day like this people buy twenty cups every ten minutes. Kit and I can pour as fast as people can pay. The lemons and the ice are the problem, not our hands.' },
        { q: 'Is there anything else we could do?', a: 'Mr Petrie came past. The Year 7 craft club are in the full sun, and our pitch is in the shade. They will pay us six pounds to have it for the last hour. We would shut, sell nothing, and take our lemons home.</p><p>He holds up the handbook. &ldquo;Page nine is about exactly this. Read it. Then tell me what to do, because I would like to stop standing here.&rdquo;' }
      ],
      clue: { id: 'tomasz', title: 'Tomasz Kowalczyk: ten people in front', kind: 'What he said' },
      done: function (seen) { if (seen && tell('tomasz')) { paint(); setTimeout(readPage, 400); } }
    });
  });
  $('#rosa').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Tell Kit,&rdquo; says Rosa, &ldquo;that the note is under the tray. She never lifts the tray.&rdquo;'); return; }
    ER.talk({
      who: 'Rosa Ferreira', role: 'Year 11 · The Squeeze', face: STALL.face('rosa'),
      lines: [
        { note: 'She is sitting on a blue cool box in the shade of a car, fanning herself with a paper plate.', a: '&ldquo;Sold out at half past one. Not because nobody wanted my lemonade. Because everybody did.&rdquo;' },
        { q: 'What happened?', a: 'Before twelve I was at eighty pence. My cousin and I squeeze every cup fresh, and fourteen cups every ten minutes is as fast as we go. At eighty pence I sold all fourteen, and my queue stayed the same length. Then Mr Petrie came round with his Fair Price rule. Forty pence.' },
        { q: 'Wasn&rsquo;t that good for your customers?', a: 'At forty pence I still sold fourteen every ten minutes, because I can&rsquo;t squeeze any faster. But my queue grew by six people every ten minutes. By one o&rsquo;clock people were waiting forty minutes for a forty-pence lemonade. Then my lemons ran out, and the end of the queue had waited for nothing.' },
        { q: 'Were you at Kit&rsquo;s cash box?', a: 'At twenty to one. A man gave me a five-pound note for one lemonade, and I had no coins left for his change. Nobody was at Kit&rsquo;s stall except Rory and his lolly. So I swapped: my five-pound note for five of her pound coins. I left her a note in the box, under the tray. Kit thinks I stole from her. Kit thinks a lot of things.' },
        { q: 'Why did you leave the club?', a: 'Kit and I wanted different prices. That was all. I wrote that recipe, and I don&rsquo;t mind her using it. Lemonade isn&rsquo;t a secret.' },
        { note: 'She knocks on the lid of the cool box.', a: '&ldquo;So here is an offer, and it&rsquo;s a real one. Two bags of ice in here. I bought them at ten o&rsquo;clock for a pound each, because ice is always cheapest before anybody wants it. I&rsquo;ve no lemons to use them with. You&rsquo;ve got lemons and no ice. Give me four lemons and both bags are yours, now. I&rsquo;ll make one last jug for the people who queued longest. Take it or leave it. But take it before it melts.&rdquo;' }
      ],
      clue: { id: 'rosa', title: 'Rosa Ferreira: two bags for four lemons', kind: 'What she said' },
      done: function (seen) { if (seen && tell('rosa')) { paint(); ER.say(told.page ? 'Three ways to spend the last hour. Tell Tomasz which.' : 'Tomasz has the handbook open at page 9.'); } }
    });
  });
  STALL.thing('#lucia', null, '&ldquo;Two pounds fifty a bag,&rdquo; says the woman in the van, handing out ice as fast as she can, which is not very fast. &ldquo;It was a pound at ten. When everybody wants ice at once, ice costs more: I&rsquo;ve only got one freezer. And the Fair Price rule is for drinks. Ice isn&rsquo;t a drink.&rdquo;', isBusy);
  STALL.thing('#vboard', null, 'SANDOVAL&rsquo;S ICES. ICE: £2.50 A BAG. Above it, crossed out: £1.00. A note in the corner says: SINCE 11.45.', isBusy);
  STALL.thing('#van', 'ice van', 'An ice van with frost painted on its sides. The real frost is inside, and there is not as much of it as there was.', isBusy);
  STALL.thing('#okonjo', null, '&ldquo;Not now, dear,&rdquo; says Mrs Okonjo, holding a wet flannel on a Year 7&rsquo;s head. &ldquo;I have two Year 7s who think they are melting. Handbook, page nine. And drink some water: that goes for all of you.&rdquo;', isBusy);
  STALL.thing('#cars', null, 'Teachers&rsquo; cars, with silver sunshades in their windscreens. One of them has a sticker that says MY OTHER CAR IS A MINIBUS. It is not, yet.', isBusy);
  STALL.thing('#coolbox', 'cool box', 'A blue cool box. When Rosa lifts the lid, cold air comes out of it like good news.', isBusy);
  STALL.thing('#queue', null, 'Ten people between Tomasz and the van. Lucia serves one, the queue moves up one place, and everybody sighs.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the back page of the handbook: what do we give up? ---------- */
  function makeLock() {
    var OPS = [
      { k: 'a', t: 'Wait for Lucia&rsquo;s ice', p: 'Tomasz stays in the queue and buys two bags (&pound;5 from the box). The stall opens when he gets back.' },
      { k: 'b', t: 'Rosa&rsquo;s swap', p: 'Four of our lemons for Rosa&rsquo;s two bags of ice, now. The stall opens at two o&rsquo;clock.' },
      { k: 'c', t: 'The craft club', p: 'They pay us &pound;6 for our pitch for the last hour. We shut, and sell nothing.' }
    ];
    var saved = ER.flag('c-vals') || {}, pick = saved.pick || '', d = {}, wait = false;
    var box = ER.el('div', 'pz gu');
    box.innerHTML = '<div class="gu-in"><h5>What do we give up?</h5><h6>the back page of the handbook &middot; T.K.&rsquo;s pencil marks all over it</h6><div class="gu-ops">' + OPS.map(function (o) {
      return '<div class="op" data-k="' + o.k + '"><h4><i>' + o.k.toUpperCase() + '</i>' + o.t + '</h4><p>' + o.p + '</p><span class="lbl">money in our hands at three o&rsquo;clock, after paying for anything new</span><div class="row"><span class="lbl">&pound;</span><i class="dlc" data-k="' + o.k + '"></i></div>' +
        '<button type="button" class="ch">we choose this one</button></div>';
    }).join('') + '</div><div class="gu-oc"><span>So the plan we choose <b>costs us</b> (its opportunity cost):</span><i class="dlc" data-k="oc"></i></div>' +
      '<p class="facts">It is 1.45. The market shuts at 3.00. 40p a cup. 32 lemons. One jug: 4 lemons, 10 cups. Ice: one bag cools 5 jugs.</p></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="c-go">Tell Tomasz</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('c-vals', { a: d.a.get(), b: d.b.get(), c: d.c.get(), oc: d.oc.get(), pick: pick }); }
    function lk() { return wait || !!nextFile; }
    ['a', 'b', 'c', 'oc'].forEach(function (k) {
      d[k] = STALL.dial(box.querySelector('.dlc[data-k="' + k + '"]'), { min: 0, max: 40, val: saved[k] || 0, fmt: function (v) { return '£' + v; }, change: keep, lock: lk });
    });
    function paintPick() { ER.$$('.op', box).forEach(function (n) { n.classList.toggle('pick', n.getAttribute('data-k') === pick); }); }
    ER.$$('.op', box).forEach(function (n) {
      function choose() { if (lk()) return; pick = pick === n.getAttribute('data-k') ? '' : n.getAttribute('data-k'); STALL.sfx.chalk(); paintPick(); keep(); }
      n.querySelector('.ch').addEventListener('click', choose);
      n.querySelector('h4').addEventListener('click', choose);
    });
    paintPick();
    function flash(k) { var n = box.querySelector('.op[data-k="' + k + '"]'); n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 1100); ER.sfx.no(); }
    box.querySelector('#c-go').addEventListener('click', function () {
      var a = d.a.get(), b = d.b.get(), c = d.c.get(), oc = d.oc.get(), file;
      if (lk()) return;
      if (!ER.check('va', a)) {
        flash('a');
        if (ER.check('va27', a)) msg('&ldquo;Three places in twelve minutes,&rdquo; says Tomasz. &ldquo;How many minutes is that for each person? And there are ten of them in front of me.&rdquo;');
        else if (ER.check('va28', a)) msg('&ldquo;And the ice isn&rsquo;t free,&rdquo; says Tomasz. &ldquo;Five pounds of it comes out of the box.&rdquo;');
        else if (ER.check('va32', a)) msg('&ldquo;Could we really sell that many?&rdquo; says Tomasz. &ldquo;We only open when I get back. And the ice costs five pounds.&rdquo;');
        else msg('&ldquo;Waiting for the ice,&rdquo; says Tomasz. &ldquo;When do I get back? How many cups will people buy at 40p between then and three? Have we got lemons for that many? Then take off what the ice costs.&rdquo;');
        return;
      }
      if (!ER.check('vb', b)) {
        flash('b');
        if (ER.check('vb32', b)) msg('&ldquo;Rosa wants four of our lemons,&rdquo; says Tomasz. &ldquo;How many jugs does that leave us?&rdquo;');
        else msg('&ldquo;Rosa&rsquo;s swap,&rdquo; says Tomasz. &ldquo;We open at two, so there&rsquo;s a whole hour. What runs out first: the hour, or the lemons?&rdquo;');
        return;
      }
      if (!ER.check('vc', c)) { flash('c'); msg('&ldquo;The craft club,&rdquo; says Tomasz. &ldquo;That one&rsquo;s easy. Read what they offered.&rdquo;'); return; }
      if (!pick) { ER.sfx.no(); msg('&ldquo;Three values,&rdquo; says Tomasz. &ldquo;Now choose one. Click &lsquo;we choose this one&rsquo; under it.&rdquo;'); return; }
      if (!ER.check('pick', pick)) { flash(pick); msg('&ldquo;You&rsquo;ve given every plan a value,&rdquo; says Tomasz. &ldquo;So why would we choose that one?&rdquo;'); return; }
      if (!ER.check('oc', oc)) {
        ER.sfx.no(); ER.shake(box.querySelector('.gu-oc'));
        if (ER.check('oc29', oc)) msg('&ldquo;We could never have done both of the others,&rdquo; says Tomasz. &ldquo;We&rsquo;d only ever have done one of them instead. Which one?&rdquo;');
        else if (ER.check('oc5', oc)) msg('&ldquo;Five pounds is what the ice would cost if we waited,&rdquo; says Tomasz. &ldquo;What do we give up by choosing the swap?&rdquo;');
        else if (ER.check('oc6', oc)) msg('&ldquo;Six pounds? Is the craft club really the best thing we&rsquo;re saying no to?&rdquo;');
        else msg('&ldquo;Page nine,&rdquo; says Tomasz. &ldquo;The opportunity cost is the best of the rest.&rdquo;');
        return;
      }
      file = ER.exit([[a, b, c, pick, oc].join('-')], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      STALL.terms(['trade']);
      STALL.mine('choice', 'What do we give up?', '<p>A, wait: back at 2.25. 35 minutes at 20 cups every ten minutes = 70 cups (we have lemons for 80). 70 &times; 40p = &pound;28, minus &pound;5 of ice = &pound;23.</p><p>B, Rosa&rsquo;s swap: 28 lemons = 7 jugs = 70 cups (the hour would sell 120). 70 &times; 40p = &pound;28.</p><p>C, the craft club: &pound;6.</p><p>We choose B. Its opportunity cost: &pound;23, the best of the rest.</p>', true);
      msg('Tomasz reads your page twice, which for Tomasz is fast. &ldquo;Twenty-eight,&rdquo; he says. &ldquo;Then it&rsquo;s the swap.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true; STALL.sfx.ice();
        ER.narrate([
          '&ldquo;Waiting for Lucia: twenty-three pounds. Rosa&rsquo;s swap: twenty-eight. The craft club: six.&rdquo; Tomasz closes the handbook. &ldquo;We take the swap, and it costs us twenty-three pounds: the best thing we&rsquo;re saying no to. Not four lemons. What we could have done instead.&rdquo;',
          'He steps out of the queue. The girl behind him steps forward at once, and looks at him as if he were a hero.',
          'Rosa counts four lemons into her apron and hands over two bags of ice, still hard, wrapped in a towel. &ldquo;Pleasure doing business,&rdquo; she says. &ldquo;We&rsquo;re both better off. That&rsquo;s the whole point of a trade.&rdquo;',
          'At two o&rsquo;clock LEMON AID opens its hatch at forty pence, with Kit and Tomasz pouring. Kit has not said thank you to Rosa. She has not said anything else, either, which for Kit is nearly the same thing.',
          'Then she hands you a small key. &ldquo;The Business Club cupboard. The cash box is in there. I&rsquo;m going to Mr Petrie at half past two, ice or no ice. If you can find thirty pounds eighty in that box before then, you can come too.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2800);
    });
    msg('Put a value in pounds on each plan, choose one, and say what it costs you. The arrows set the figures (so does the mouse wheel).');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
