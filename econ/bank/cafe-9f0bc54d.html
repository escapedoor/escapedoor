<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, rail = null, tab = null;

  (function () {
    var s = '', i;
    for (i = 0; i < 18; i++) s += '<g transform="translate(' + (108 + i * 21) + ' 448) scale(.5)">' + BANK.small(0, 0, ['#5a6a8a', '#8a4a3a', '#3a5a4a', '#a08a5a', '#6a4a7a'][i % 5], ['#3a2a20', '#c9c4bc', '#1a1412'][i % 3], -1) + '</g>';
    $('#sq').innerHTML = s;
    $('#wanda').innerHTML = BANK.who('wanda', { smile: -2, extra: '<path d="M39 -112l20 -30" stroke="#e9b897" stroke-width="12" stroke-linecap="round"/><rect x="50" y="-160" width="34" height="20" fill="#fff" transform="rotate(-20 67 -150)"/>' });
    $('#rook').innerHTML = BANK.who('rook', { smile: -3 });
    $('#ursula').innerHTML = BANK.who('ursula', { smile: -5 });
    $('#yuki').innerHTML = BANK.who('yuki', { badge: null, smile: 3, extra: '<rect x="28" y="-170" width="34" height="46" rx="2" fill="#2a6a9a"/><rect x="32" y="-166" width="26" height="6" fill="#fff"/>' });
  })();

  ER.init({
    theme: 'econ', story: 'bank', storyTitle: 'Still Open at Four', id: 'cafe', no: 'III', title: 'The Toast Rack',
    go: 'Into the Toast Rack', sound: ['ledger', { root: 47, bpm: 92, beds: [['crowd', 0.45]] }],
    intro: [
      'Mr Yeoman&rsquo;s balance came out level: £6.5 million owned, £6 million owed to customers, and £500,000 of capital as the cushion. Even if the Courier&rsquo;s three problem loans never paid a penny, the cushion took the £60,000, and every saver was still owed every penny. Solvent. But only £150,000 of it was in notes.',
      'Now there are twenty people in the queue, and everybody says the rumour started in the café across the square.',
      'Yuki has taken off her name badge. She says this makes her a member of the public.'
    ],
    exit: {"next":"backoffice","w":{"bc3ed0f3":"26682dd9"}}, tags: {"s1":["07c1e70b"],"s2":["9fb821e9"],"s3":["ad38b2da"],"s4":["f53260e0"],"s5":["a21b6e9b"],"s6":["7e39d454"],"chg":["881c0119"],"door":["ec03bdc0"],"loud":["1eca6fa1"],"rude":["6276ba34"],"true":["0b134f6f","57abbd6f"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.wanda && told.ursula && told.book; }
  function paint() {
    var p1 = !!ER.flag('c-ord');
    $('#rail').classList.toggle('ready', !!(ready() && !p1));
    $('#tablet').classList.toggle('ready', !!(p1 && !nextFile));
    ER.pips((told.wanda ? 1 : 0) + (told.ursula ? 1 : 0) + (told.book ? 1 : 0) + (p1 ? 1 : 0) + (nextFile ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['Simeon Rook has gone to close his account. Back to the bank: the button at the bottom of the screen.']];
    if (tab && tab.isOpen()) return [tab.matched() ? 'door' : 'tablet', tab.matched() ? [
      'Look at the people outside the frame. Which way are they facing? What are the people at the front holding?',
      'The queue does not lead to the bank&rsquo;s door at all. Read the board on the pavement by the other door.'
    ] : [
      'The small picture at the top is what Marnie posted. Somewhere in the big picture is exactly that view. Drag the white frame over the big picture until what is inside it matches.',
      'Look for the letters of the bank&rsquo;s name and the two windows. The frame clicks into place when it is right.'
    ]];
    if (rail && rail.isOpen() && rail.marking()) return ['mark', [
      'Read the cards one after another, as if you were passing on a message. Where did the meaning first change from what really happened?',
      'Was it true that there was not four thousand pounds at the counter? Yes. Was it true that the bank had no money? No. Find the first card that says something like the second.'
    ]];
    if (rail && rail.isOpen()) return ['rail', [
      'Every card has a time somewhere. Wanda&rsquo;s tickets give the café times. Mrs Bright&rsquo;s phone gives the times of the posts. And Mr Ellwood told you when he was at window 1.',
      'Mr Ellwood was at window 1 at ten to twelve. He came into the café at 12.05. Mrs Bright posted at 12.21, the reply came at 12.48, the photograph at 1.32.',
      'Mr Rook&rsquo;s ticket says 12.34. So where does his card go?'
    ]];
    if (!told.wanda) return ['wanda', ['Wanda Threlfall runs the café. Everybody tells Wanda things.', 'Wanda is behind the counter on the right, under the order rail.']];
    if (!told.ursula) return ['ursula', ['The woman in the purple cardigan is staring at her phone. Yuki says she is Mrs Bright.', 'Mrs Bright is at the middle table.']];
    if (!told.book) return ['book', ['Yuki brought her evening-class book. It has a page on exactly this.', 'Click Yuki, in the front of the room, on the right.']];
    if (!told.rook) return ['rail', ['Now put the rumour in order on Wanda&rsquo;s rail, above the counter. You may want to hear Mr Rook first: he is at the table by the window.', 'The steel rail with the order tickets on it, above the counter.']];
    return ['rail', ['Put the rumour in order on Wanda&rsquo;s rail: the steel rail with the tickets, above the counter.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Mr Rook has gone. His soup bowl is so clean it could go back on the shelf.'); return; }
    if (told.in) { busy = false; ER.say('The Toast Rack. Warm, steamy and very interested in you.'); return; }
    tell('in');
    ER.narrate([
      'The Toast Rack: steamed-up windows, red check tablecloths, a tea urn the size of a dustbin and a smell of toasted cheese. It is the warmest room in Brockholt, and the noisiest.',
      'Wanda Threlfall is behind the counter. Above her head, the order tickets hang on a steel rail. At the table by the window, Simeon Rook is eating soup and reading the Courier. At the middle table, a white-haired woman in a purple cardigan is looking at her phone as if it had bitten her.',
      '&ldquo;That&rsquo;s Mrs Bright,&rdquo; Yuki whispers. &ldquo;She taught me English. She taught everybody English.&rdquo;'
    ], function () { busy = false; });
  }

  $('#wanda').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Free tasters,&rdquo; says Wanda. &ldquo;I could have told you. I could have told everybody. Nobody asked me.&rdquo;'); return; }
    ER.talk({
      who: 'Wanda Threlfall', role: 'The Toast Rack · twenty years on Market Square', face: BANK.face('wanda'),
      lines: [
        { note: 'She is wiping a table that is already clean.', a: '&ldquo;Monty came in just after twelve, before the soup was on. Steaming. <i>They haven&rsquo;t got four thousand pounds in there!</i> he says. <i>Two days, they said!</i> The whole café heard. Monty doesn&rsquo;t whisper. He thinks whispering is for burglars.&rdquo;' },
        { q: 'Who else was here?', a: 'Ursula Bright, at table two, doing her crossword. She went very quiet, and then she went very busy on her phone. Simeon Rook came in later for his soup, and said what he always says about that bank, only louder.' },
        { q: 'Who took the photograph?', a: 'My Marnie. Half past one, from this window, on the café tablet. She thought she was helping. I have told her she was not helping. The tablet is on the counter: the whole picture is still on it.' },
        { q: 'Is it your fault?', a: 'I serve tea. People talk. Twenty years I&rsquo;ve stood here, and I have never once had a rumour come back and ask for its money. All my tickets are on the rail, if you want them. I write everything down.' }
      ],
      clue: { id: 'wanda', title: 'Wanda: before the soup was on', kind: 'What she said' },
      done: function (seen) { if (seen && tell('wanda')) { paint(); ER.say('Her tickets are on the rail above the counter. The tablet is on the counter.'); } }
    });
  });
  $('#ursula').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Mrs Bright is typing her correction with one finger. &ldquo;With the times,&rdquo; she says. &ldquo;Exactly what happened, with the times.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Ursula Bright', role: 'Retired · taught English for thirty-four years', face: BANK.face('ursula'),
      lines: [
        { note: 'She has turned her phone face down on the tablecloth, as if it might bite again.', a: '&ldquo;I wrote it. I&rsquo;m so sorry. I thought I was warning people. Monty said the bank hadn&rsquo;t got the money, and my sister&rsquo;s savings are in there.&rdquo;' },

            'Wanda looks out across the square. The queue outside the bank is not for bread. It is longer than it was ten minutes ago, and it is real now. &ldquo;It doesn&rsquo;t matter how it started, does it?&rdquo; she says. &ldquo;Not once people believe it.&rdquo;',
            'Simeon Rook folds his Courier, puts on his coat and leaves a tip exactly the size of the bill. &ldquo;I&rsquo;m going over to take my money out,&rdquo; he says to nobody in particular. &ldquo;All fifty years of it.&rdquo;',
            '&ldquo;Fifty years?&rdquo; says Yuki, when the door has shut behind him. &ldquo;An account that old won&rsquo;t be on the computer. It&rsquo;ll be in a ledger in the back office. Come on. We&rsquo;d better get there first.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 3000);
      };
    }
    box.querySelector('#bd').addEventListener('click', door('bd'));
    box.querySelector('#bk').addEventListener('click', door('bk'));
    msg(matched ? 'That is Marnie&rsquo;s picture. Where does the queue lead? Click the door at the front of it.' : 'Drag the white frame over the big picture until it shows exactly what Marnie posted.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; }, matched: function () { return matched; } };
  }
})();
</script>
