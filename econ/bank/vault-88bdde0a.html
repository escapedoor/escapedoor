      'It is twenty-five past three. The van that should have come at eleven is coming at ten to four, and Mrs Delacour has to tell it what to bring.',

    ],
    exit: {"next":"steps","w":{"725f1c7a":"8871f3d2"}}, tags: {"q":["3ec22b00"],"c":["60edb351"],"b":["473dc036"],"src":["a43368ab"],"q64":["94487c5f"],"c128":["fbdf0020"],"b10":["0b53963c"]},

  });
  var MANUAL = '<h4>Staff Manual &middot; Section 4</h4><h3>When too many come at once</h3>' +
    '<p>Three things stop a bank run.</p>' +
    '<p><b>TIME.</b> A run feeds on the fear of being last. When people see every customer paid, calmly and in full, the fear has nothing to eat. Pay everyone. Never close early. Never pay slowly on purpose.</p>' +
    '<p><b>A LENDER OF LAST RESORT.</b> A central bank (ours is the Bank of England) will lend to a sound bank that is short of cash, and take its good loans as security. A bank uses its own reserves first; borrowing comes after. The idea is old. In 1873 the writer Walter Bagehot argued that in a panic a central bank should lend freely, at a high rate, against good security.</p>' +
    '<p><b>DEPOSIT INSURANCE.</b> In the UK, the Financial Services Compensation Scheme (FSCS) protects each person&rsquo;s deposits in each bank up to £120,000. If a bank failed, the FSCS would pay them back. Most people have far less than that in the bank, so most people have no reason to queue at all.</p>' +

    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the van order ---------- */
  function makeLock() {
    var saved = ER.flag('e-vals') || {}, wait = false, d = {}, src = saved.src || '';
    var box = ER.el('div', 'pz vo');
    box.innerHTML = '<div class="vo-in"><h4>VAN ORDER</h4><p class="sub">Brockholt &amp; District Bank &middot; Friday &middot; ring the cash centre by 3.30</p>' +
      '<div class="ln"><span><i>1</i>People in the queue who are waiting for the bank</span><b id="q"></b></div>' +
      '<div class="ln"><span><i>2</i>Cash they will take, about</span><b id="c"></b></div>' +
      '<div class="ln"><span><i>3</i>Boxes to order (£10,000 a box)</span><b id="b"></b></div>' +
      '<div class="ln" style="border:0"><span><i>4</i>Take the money from:</span></div>' +
      '<div class="src"><button type="button" data-s="own"><b>OUR RESERVES</b>our own account at the Bank of England</button><button type="button" data-s="loan"><b>A LOAN</b>borrow from the Bank of England against our loans</button></div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="e-go">Ring the order through</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function lk() { return wait || !!nextFile; }
    function keep() { ER.flag('e-vals', { q: d.q.get(), c: d.c.get(), b: d.b.get(), src: src }); }
    d.q = BANK.drum(box.querySelector('#q'), { digits: 2, val: saved.q, change: keep, lock: lk });
    d.c = BANK.drum(box.querySelector('#c'), { digits: 3, before: '£', after: ',000', val: saved.c, change: keep, lock: lk });
    d.b = BANK.drum(box.querySelector('#b'), { digits: 2, val: saved.b, change: keep, lock: lk });
    function paintSrc() { ER.$$('.src button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-s') === src); }); }
    ER.$$('.src button', box).forEach(function (b) { b.addEventListener('click', function () { if (lk()) return; src = b.getAttribute('data-s'); BANK.sfx.stamp(); paintSrc(); keep(); }); });
    paintSrc();
    function flash(n) { n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 1200); }
    box.querySelector('#e-go').addEventListener('click', function () {
      if (wait || nextFile) return;
      var q = d.q.get(), c = d.c.get(), b = d.b.get();
      if (!ER.check('q', q)) { ER.sfx.no(); flash(box.querySelector('#q')); msg(ER.check('q64', q) ? '&ldquo;Sixty-four from our door to the end,&rdquo; says Yuki slowly. &ldquo;Is everybody on that pavement waiting for us? Ravi said something about three o&rsquo;clock. Look at the camera again.&rdquo;' : '&ldquo;How many are waiting for OUR door?&rdquo; says Mrs Delacour. &ldquo;Yuki&rsquo;s count, and the camera.&rdquo;'); return; }
      if (!ER.check('c', c)) { ER.sfx.no(); flash(box.querySelector('#c')); msg(ER.check('c128', c) ? '&ldquo;That is for sixty-four people,&rdquo; says Mrs Delacour. &ldquo;We are paying fifty.&rdquo;' : '&ldquo;Forty-eight customers took ninety-six thousand pounds,&rdquo; says Mrs Delacour. &ldquo;How much each, on average? Then for the people waiting.&rdquo;'); return; }
      if (!ER.check('b', b)) {
        ER.sfx.no(); flash(box.querySelector('#b'));
        if (ER.check('b10', b)) msg('&ldquo;Ten boxes is a hundred thousand pounds,&rdquo; says Mrs Delacour. &ldquo;What is already on my shelves?&rdquo;');
        else if (b < 5) msg('&ldquo;' + (b ? b + ' boxes and' : 'Nothing, and') + ' the shelves make ' + BANK.pounds(54000 + b * 10000) + ',&rdquo; says Mrs Delacour. &ldquo;Somebody in that queue goes home without their own money. Not today.&rdquo;');
        else msg('&ldquo;That is more than the queue needs,&rdquo; says Mrs Delacour. &ldquo;Money in a vault earns nothing. I said: to the box.&rdquo;');
        return;
      }
      if (!ER.check('src', src)) { ER.sfx.no(); flash(box.querySelector('.src')); msg(src ? '&ldquo;Borrow?&rdquo; says Mrs Delacour. &ldquo;You weighed us. How much have we got of our own in our account at the Bank of England? A bank uses its own reserves first.&rdquo;' : '&ldquo;And where does the money come from?&rdquo; says Mrs Delacour. &ldquo;Choose.&rdquo;'); return; }
      var file = ER.exit([q + '-' + c + '-' + b + '-' + src], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('e-file', file);
      BANK.mine('van', 'The van order', '<p>Queue: 64 from our door to the end, but the last 14 are waiting for Pathak&rsquo;s three o&rsquo;clock bake. 50 for the bank.</p><p>£96,000 &divide; 48 = £2,000 each. 50 &times; £2,000 = £100,000.</p><p>On the shelves: 27 bundles &times; £2,000 = £54,000 (= £150,000 &minus; £96,000). Short £46,000: 5 boxes of £10,000.</p><p>From our own reserves at the Bank of England (£450,000 there). Borrowing is for when that runs out.</p>', true);
      msg('Mrs Delacour reads the pad, checks it against her watch, and picks up the telephone. <b>Fifty people, about £100,000, five boxes, from our own account.</b>');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true; ER.mood('calm');
        ER.narrate([
          '&ldquo;Brockholt and District,&rdquo; says Mrs Delacour into the telephone. &ldquo;Five boxes, please, from our own account. Yes, today. Yes, I know what the town is saying.&rdquo; She puts the phone down. &ldquo;Ten to four.&rdquo;',
          'At ten to four the van stops at the front door, not round the back where it always stops: Mrs Delacour asked for that. Two men in helmets carry five grey boxes through the middle of the queue and across the banking hall, slowly. Everybody watches them go by.',
          '&ldquo;Is that wise?&rdquo; says Yuki. &ldquo;Showing them?&rdquo; &mdash; &ldquo;It is the only wise thing,&rdquo; says Mrs Delacour. &ldquo;Nobody runs from a bank that is busy paying.&rdquo;',
          '&ldquo;And if it isn&rsquo;t over on Monday?&rdquo; you ask. &mdash; &ldquo;Then I ring the Bank of England, and they lend to us against our loans, because we are sound. That is what they are for. And every saver in that queue is protected up to a hundred and twenty thousand pounds, which is a great deal more than any of them has.&rdquo;',
          'She straightens her jacket. &ldquo;But it will be over. Come upstairs. It is nearly four o&rsquo;clock, and I have a speech to make.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2800);
    });
    msg('Set the three figures with the little wheels and choose where the money comes from. Then ring the order through.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
