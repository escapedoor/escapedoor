<script>
(function () {
  var $ = ER.$, busy = true, box = null, inLock = false;

  ER.init({
    theme: 'history', story: 'pump', storyTitle: 'By the Nearest Road', id: 'hampstead', no: 'V', title: 'West End, Hampstead',
    go: 'Open the gate', back: '../index.html', backLabel: 'Archive',
    intro: [
      'The slate settled it. The streets round the workhouse drank from the Broad Street pump, breathed foul air, and lost very many: that fits both theories, so it proves nothing. The workhouse breathed the same foul air but had its own well: one in five of 535 would have been 107 deaths, and there were five. The brewery&rsquo;s men drank beer and the brewery&rsquo;s own well water: one in five of seventy would have been fourteen, and there were none.',
      'Thursday 7 September, half past one. West End, Hampstead: a village on the hill north of London, where the doctors send people for the fresh air. You can see the whole city from here, sitting in its own smoke.'
    ],
    exit: {"next":"board","w":{"fb70b281":"330903b3"}}, tags: {"tl":["f002343d","f8647235","4c3f9539","c6460bf2","5a2607b3","0c329ee3"],"st":["f633000d"],"who":["a4f8dd2c"]},
    hints: hints, onBegin: begin
  });

  function file() { return ER.flag('h-file'); }
  function isBusy() { return busy; }
  function ready() { return ER.flag('h-applin') && ER.flag('h-cart') && ER.flag('h-stan'); }
  function paint() {
    $('#applin').classList.toggle('ready', !file() && !ER.flag('h-applin'));
    $('#book').classList.toggle('ready', !file() && !!ready());
    ER.pips(file() ? 1 : 0, 1);
    if (file()) PU.door($('#go'), file(), 'h-file');
  }
  function hints() {
    if (file()) return ['go', ['The carter is going back down the hill. Use the button at the bottom of the screen.']];
    if (inLock) return ['book', [
      'Mrs Applin and the cart book give most of the days. Put each card in its column. Two cards belong nowhere: leave them in the tray.',
      'When was she taken ill? Mrs Applin cannot say. The Hampstead line in your notebook says diarrhoea two hours, cholera sixteen hours, and Mrs Applin says she died at about two o&rsquo;clock on Saturday afternoon. Count back eighteen hours from two o&rsquo;clock on Saturday.',
      'Then strike out the one sentence in Mr Stannard&rsquo;s paragraph that he did not know but guessed, and choose the person who could know that it was wrong. Mr Peebles&rsquo;s card, rule 5: believe the writer who was nearest to the thing itself.'
    ]];
    if (!ready()) return ['talk', [
      'Talk to Mrs Applin at the door. Florrie, by the cart, has the carter&rsquo;s book. Mr Stannard has written something for the Board.',
      'When you have all three, your pocket book on the garden bench opens.'
    ]];
    return ['bench', ['Your pocket book is on the garden bench. The newspaper beside it is worth reading too.']];
  }

  function begin() {
    paint();
    PU.need('h41', 'The Hampstead line', '<h4>The Hampstead line</h4>' + PU.H41, 'mine', 'Your notes');
    PU.need('card', 'Mr Peebles’s card', PU.CARD, 'card', 'On your desk');
    if (ER.flag('h-in')) { busy = false; ER.say(file() ? 'The carter is turning the horse.' : 'West End, Hampstead. Green, quiet, and very high.'); return; }
    ER.narrate([
      'It is an hour and more on the cart, out past Regent&rsquo;s Park and on up the long hill, until the houses give way to gardens and the gardens to fields. The air is fresh, and Florrie says it tastes of nothing at all.',
      'The house is white and quiet, with the blinds half down. There is black crape tied on the knocker. That means a death in the house, and everybody who passes lowers their voice.',
      'And at the gate, to your surprise, stands Mr Stannard, breathing very deeply. He came up on the omnibus, he says, to see the case for himself, in the interests of science and fresh air.'
    ], function () { busy = false; ER.flag('h-in', 1); paint(); });
  }

  $('#applin').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Mrs Grace Applin', role: 'Housekeeper to the late Mrs Eley', face: PU.FACE('applin'), lines: [
      'A woman in black opens the door. &ldquo;Grace Applin. I keep house for Mrs Eley.&rdquo; She stops. &ldquo;I kept house for her. Come into the shade, the pair of you.&rdquo;',
      '&ldquo;The mistress hadn&rsquo;t been down to Broad Street for months. Not since the winter. Her knees wouldn&rsquo;t have the stairs at the works, and she&rsquo;d no call to go.&rdquo;',
      '&ldquo;But she would have the Broad Street water. Said ours up here was flat. So the cart brought a big stone bottle of it every day, fresh from the pump.&rdquo;',
      { q: 'When did she drink from Thursday&rsquo;s bottle?', a: '&ldquo;Thursday evening, with her supper, and again on the Friday. On the Friday she wasn&rsquo;t herself, but she never complained, she wouldn&rsquo;t, so I couldn&rsquo;t tell you when it began. She went at about two o&rsquo;clock on the Saturday afternoon.&rdquo;' },
      '&ldquo;Her niece was staying with us that week. She drank it too. She went home to Islington, to a high, healthy part of it, as healthy as here. And we heard she&rsquo;d been taken as well.&rdquo;',
      '&ldquo;I had a glass of it myself, and I was poorly a day, no worse. And there&rsquo;s been no cholera up here this summer. Not a case. Ask anybody.&rdquo;'
    ], clue: { id: 'applin', title: 'Mrs Applin, at the door', kind: 'Statement' }, done: function (seen) { if (seen) { ER.flag('h-applin', 1); PU.learn('housekeeper'); paint(); } } });
  });
  $('#florrie').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Florrie Dawlish', role: 'By the cart', face: PU.FACE('florrie'), lines: [
      '&ldquo;Here&rsquo;s the carter&rsquo;s book. I copied out the bit that matters, upside down, while he was looking at the horse.&rdquo;',
      '&ldquo;The bottle&rsquo;s filled at the pump at seven, before the works opens, and up it goes on the cart. Every day the same. Except Friday: no cart Friday.&rdquo;'
    ], clue: { id: 'florrie5', title: 'Florrie: the cart', kind: 'Statement' }, done: function (seen) {
      if (!seen) return;
      ER.read({ html: PU.CART, cls: 'notes', clue: { id: 'cart', title: 'Eley’s cart book', kind: 'Copied by Florrie' }, done: function () { ER.flag('h-cart', 1); paint(); } });
    } });
  });
  var STAN = ['The lady died of cholera on Saturday 2 September.', 'There has been no other cholera at West End this summer.', 'She took the disease on a visit to the family&rsquo;s works in Broad Street, where the air is foul.', 'Her niece, who was staying with her, has also died of cholera, at Islington.'];
  $('#stannard').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Mr Horace Stannard', role: 'Inspector of Nuisances, at the gate', face: PU.FACE('stannard'), lines: [
      '&ldquo;Breathe that, my young friend! Hampstead air. The doctors send their patients up here for it.&rdquo;',
      '&ldquo;The lady caught her cholera in Soho, of course, on a visit. The Lantern says so, and it stands to reason: where else could she catch it? I have written a paragraph for the Board tonight. You may copy it, if you like.&rdquo;'
    ], clue: { id: 'stannard3', title: 'Mr Stannard at West End', kind: 'Statement' }, done: function (seen) {
      if (!seen) return;
      ER.read({ html: '<h4>For the Board: the case at West End</h4><p>By H. Stannard, Inspector of Nuisances.</p>' + STAN.map(function (s, i) { return '<p>(' + 'abcd'.charAt(i) + ') ' + s + '</p>'; }).join('') + '<p><i>I shall draw the conclusion for the Board myself.</i></p>',
        cls: 'smell', clue: { id: 'stanpara', title: 'Mr Stannard’s paragraph', kind: 'For the Board' }, done: function () { ER.flag('h-stan', 1); paint(); } });
    } });
  });
  $('#paper').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PU.LANTERN, cls: 'news', clue: { id: 'lantern', title: 'The Weekly Lantern', kind: 'Newspaper' }, done: function () { PU.learn('heath'); } });
  });
  PU.thing('#bottle', 'stone bottle', 'An empty stone bottle by the scullery step. Nobody has had the heart to send it back down the hill.', isBusy);
  PU.thing('#view', null, 'London, under a brown blanket of its own smoke. Up here people think the air down there is poison.', isBusy);
  PU.thing('#cart', null, 'Eley&rsquo;s cart, which comes up this hill every day with cases for the railway and, until last week, one stone bottle.', isBusy);
  $('#book').addEventListener('click', function () {
    if (busy || file()) return;
    if (!ready()) { ER.say('Your pocket book. First hear Mrs Applin, get the cart book from Florrie, and read Mr Stannard&rsquo;s paragraph.'); return; }
    openLock();
  });

  /* ---------- the pocket book: the days, the paragraph, and who could know ---------- */
  var SLOTS = [['months', 'Months before'], ['thuam', 'Thu 31 Aug, morning'], ['thupm', 'Thu 31 Aug, evening'], ['fri', 'Fri 1 Sept, during the day'], ['frie', 'Fri 1 Sept, evening'], ['sat', 'Sat 2 Sept, afternoon']];
  var CARDS = [['c4', 'She drinks from the bottle again'], ['d1', 'She visits the works in Broad Street'], ['c6', 'She dies'], ['c2', 'The bottle is filled at the pump and goes up on the cart'], ['c1', 'Her last visit to Broad Street'], ['c5', 'She is taken ill'], ['d2', 'She breathes the foul air of Soho'], ['c3', 'She drinks from the bottle for the first time']];
  var WHO = [['applin', 'Mrs Applin'], ['lantern', 'The Weekly Lantern'], ['register', 'The register line'], ['cart', 'The cart book']];
  function build() {
    var b = ER.el('div', 'tl'), lock = false, msgEl, struck = '', who = '';
    var h = '<div class="tl-book"><h6>Mrs Eley: the days</h6><div class="tl-strip">' + SLOTS.map(function (s) { return '<div class="tl-col"><b>' + s[1] + '</b><div class="slot" data-s="' + s[0] + '"></div></div>'; }).join('') + '</div>';
    h += '<div class="tl-tray">' + CARDS.map(function (c) { return '<div class="card2 dnd-item" data-c="' + c[0] + '">' + c[1] + '</div>'; }).join('') + '</div>';
    h += '<div class="tl-para">Mr Stannard&rsquo;s paragraph. Strike out the sentence he guessed:</div>' + STAN.map(function (s, i) { return '<span class="sent" data-s="' + 'abcd'.charAt(i) + '"><i>' + 'abcd'.charAt(i) + '</i>' + s + '</span>'; }).join('');
    h += '<div class="tl-para">Who could know it was wrong?</div><div class="who">' + WHO.map(function (w) { return '<button type="button" data-w="' + w[0] + '">' + w[1] + '</button>'; }).join('') + '</div></div>';
    h += '<div class="tl-side"><h3 class="lk-title">Your book</h3><div class="lk-face">' + PU.FACE('florrie') + '</div><h6 class="lk-h">Florrie</h6><p class="pmsg"></p><button type="button" class="btn" id="tl-go">Write it down</button></div>';
    b.innerHTML = h; msgEl = b.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    var tray = b.querySelector('.tl-tray');
    ER.dnd(b, { item: '.card2', slot: '.slot', home: tray, lock: function () { return lock; }, change: function () { PU.sfx.pen(); clear(); } });
    function clear() { ER.$$('.slot', b).forEach(function (s) { s.classList.remove('no', 'ok'); }); }
    ER.$$('.sent', b).forEach(function (s) { s.addEventListener('click', function () { if (lock) return; struck = s.getAttribute('data-s'); ER.$$('.sent', b).forEach(function (x) { x.classList.toggle('struck', x === s); }); PU.sfx.pen(); }); });
    ER.$$('.who button', b).forEach(function (w) { w.addEventListener('click', function () { if (lock) return; who = w.getAttribute('data-w'); ER.$$('.who button', b).forEach(function (x) { x.classList.toggle('on', x === w); }); ER.sfx.click(); }); });
    b.querySelector('#tl-go').addEventListener('click', function () {
      if (lock) return;
      clear();
      var got = SLOTS.map(function (s) { var c = b.querySelector('.slot[data-s="' + s[0] + '"] .card2'); return c ? c.getAttribute('data-c') : ''; });
      if (got.indexOf('') >= 0) { msg('&ldquo;Every column wants a card. Two cards are left over: they don&rsquo;t belong anywhere.&rdquo;'); return; }
      if (!struck || !who) { msg('&ldquo;And Mr Stannard&rsquo;s paragraph: strike out one sentence, and say who could know it was wrong.&rdquo;'); return; }
      var bad = null;
      SLOTS.forEach(function (s, i) { var ok = ER.check('tl', s[0] + ':' + got[i]); b.querySelector('.slot[data-s="' + s[0] + '"]').classList.add(ok ? 'ok' : 'no'); if (!ok && !bad) bad = [s, got[i]]; });
      if (bad) {
        PU.slip(); ER.sfx.no();
        var s = bad[0];
        msg('&ldquo;' + s[1] + ': ' + (
          bad[1] === 'd1' || bad[1] === 'd2' ? 'Mrs Applin says she hadn&rsquo;t been down to Broad Street for months. That card belongs nowhere.' :
          s[0] === 'fri' || s[0] === 'frie' ? 'Mrs Applin couldn&rsquo;t say when it began. The register line says how long it lasted: two hours and sixteen hours. Count back from two o&rsquo;clock on Saturday.' :
          'read Mrs Applin and the cart book again. Which day, and what time of day?') + '&rdquo;');
        return;
      }
      if (!ER.check('st', struck)) { PU.slip(); ER.sfx.no(); msg('&ldquo;Sentence ' + struck + ' is true: ' + ({ a: 'the register line says so.', b: 'Mrs Applin says so, and she lives here.', d: 'Mrs Applin told us.' }[struck] || 'somebody who knows says so.') + ' Which sentence did he never know, but only guess?&rdquo;'); return; }
      if (!ER.check('who', who)) {
        PU.slip(); ER.sfx.no();
        msg('&ldquo;' + ({ lantern: 'The Lantern wasn&rsquo;t there. It printed what it heard, and what its readers like to believe.', register: 'The register says when she died, and of what. It doesn&rsquo;t say where she caught it.', cart: 'The cart book says the bottle went up. It doesn&rsquo;t say whether she ever went down.' }[who] || 'Not that one.') + ' Who was nearest to the thing itself?&rdquo;');
        return;
      }
      var nxt = ER.exit([got.join('-') + '|' + struck + '|' + who], { wait: true });
      if (!nxt) { msg('&ldquo;Something&rsquo;s not right. Tell your teacher.&rdquo;'); return; }
      lock = true; b.querySelector('#tl-go').disabled = true;
      msg('&ldquo;So she never went near Broad Street. Broad Street came to her, in a bottle. Thursday&rsquo;s bottle, filled at seven.&rdquo; Florrie is quiet for a moment. &ldquo;Mr Stannard&rsquo;s fresh air never had a chance.&rdquo;');
      setTimeout(function () { ER.closeAll(); finish(nxt); }, 4200);
    });
    b.first = function () { msg('&ldquo;Put her days in order, from what we were told. Then Mr Stannard&rsquo;s paragraph. Mr Peebles&rsquo;s card is in your notebook, if you want it.&rdquo;'); };
    return b;
  }
  function openLock() { var f = !box; if (!box) box = build(); inLock = true; ER.open('ov-lock', box, function () { inLock = false; }); if (f) box.first(); }

  function finish(nxt) {
    busy = true; inLock = false;
    ER.narrate([
      'You read your page to Mr Stannard, in the garden, with the whole of London smoking quietly below you. He listens to the end without saying anything at all, which Florrie says afterwards is a first.',
      '&ldquo;A bottle,&rdquo; he says at last. &ldquo;On a cart. Up this hill.&rdquo; He looks at the empty stone bottle by the scullery step for a long time. Then he takes out his paragraph, reads it again, and puts it back in his pocket without a word.',
      'The Board of Guardians of St James&rsquo;s parish meets at seven this evening. Dr Snow has asked to speak to it. The carter says he can have you back in Broad Street by six, if the horse agrees.'
    ], function () {
      PU.mine('days', 'Mrs Eley: the days', '<p>Months before: her last visit to Broad Street. Thursday morning: the bottle filled at the pump at seven, up on the cart. Thursday evening: she drinks from it. Friday: she drinks again. Friday evening: taken ill (two o&rsquo;clock Saturday, less 2 + 16 = 18 hours, is <b>eight o&rsquo;clock on Friday evening</b>). Saturday afternoon: she dies.</p><p>Her niece drank it too, and died at Islington. No other cholera at West End.</p><p>Mr Stannard guessed that she caught it on a visit. Mrs Applin, who was in the house every day, knew she had not been near Broad Street for months.</p>');
      PU.door($('#go'), nxt, 'h-file'); busy = false; paint();
    });
  }
})();
</script>
