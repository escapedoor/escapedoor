  #smoke ellipse{animation:sm 14s steps(14,end) infinite}
  #smoke ellipse:nth-child(2){animation-delay:-5s}
  #smoke ellipse:nth-child(3){animation-delay:-9s}
  @keyframes sm{from{transform:translate(0,0);opacity:.5}to{transform:translate(-60px,-120px);opacity:0}}
  #tail{animation:tl 3s steps(2,end) infinite;transform-origin:1452px 300px}
  @keyframes tl{50%{transform:rotate(14deg)}}
  #map.ready,#snow.ready{animation:nudge 1.6s ease-in-out infinite}

  /* the map on the barrow */
  .mp{display:grid;grid-template-columns:minmax(0,820px) 290px;gap:16px;width:min(1130px,97vw);align-items:start}

  .mp-map svg{display:block;width:100%;height:auto}
  .mp-map .hs{fill:#e2d6b4;stroke:#8a7a58;stroke-width:1;cursor:pointer}
  .mp-map .hs:hover,.mp-map .hs.hov{fill:#ffe08a}
  .mp-map .hs.put{fill:#f4c96a}
  .mp-map .tg{fill:#e2d6b4;stroke:#8a7a58;stroke-dasharray:4 3;cursor:pointer}
  .mp-map .tg:hover{fill:#ffe08a}
  .mp-map .cand{cursor:pointer}
  .mp-map .cand:hover circle{stroke:#b3261c}
  .mp-side{display:grid;gap:7px;align-content:start}
  .tkt{position:relative;padding:4px 8px 4px 28px;background:#f6efda;color:#1f2438;font-family:'EB Garamond',serif;font-size:14px;line-height:1.22;border:1px solid #b9a877;box-shadow:0 3px 6px rgba(0,0,0,.4);text-align:left}
  .tkt i{position:absolute;left:7px;top:5px;font-family:'Oswald',sans-serif;font-style:normal;font-weight:600;font-size:14px;color:#7a1d14}
  .tkt .on{display:block;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;color:#6b5a33;text-transform:uppercase}
  .tkt.placed{background:#e9e0c6;opacity:.86}
  .mp-foot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;margin-top:8px}
  .mp-foot .lk-face{width:64px}
  .mp-side .btn{width:100%;margin-top:6px}
  .mp-count{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;color:#f6d48e}
  @media (max-width:980px){.mp{grid-template-columns:1fr}}
</style>

      HS.forEach(function (h) { var dx = h[1] - cc[1], dy = h[2] - cc[2]; if (dx * dx + dy * dy <= R * R) n += count[h[0]]; });
      ring.querySelector('#ringN').textContent = n + (n === 1 ? ' bar' : ' bars');
      var nm = { pump: 'the pump', grP: 'the grating beside the pump', grW: 'the grating at Marshall Street', grE: 'the grating at Berwick Street', grPo: 'the grating by the workhouse gate', wh: 'the workhouse', bur: 'the burial ground (rumoured)' }[c];
      b.querySelector('#mp-count').textContent = nm + ': ' + n + (n === 1 ? ' bar' : ' bars') + ' inside the ring';
      ER.sfx.tick(0.7);
    }
    b.querySelector('#mp-pin').addEventListener('click', function () {
      if (lock || !stageB) return;
      if (!pick) { msg('&ldquo;Click one of the marks first, and look at what the ring counts.&rdquo;'); return; }
      if (!ER.check('mid', pick)) { PU.slip(); ER.sfx.no(); msg('&ldquo;There? The ring holds some bars, but not many. Somewhere else the crowd is thicker.&rdquo;'); return; }
      var cand = TK.map(function (k) { return k[0] + '@' + place[k[0]]; }).join('-') + '|' + pick;
      var nxt = ER.exit([cand], { wait: true });
      if (!nxt) { msg('&ldquo;Something is not right with the map. Tell your teacher.&rdquo;'); return; }
      lock = true; PU.sfx.pin();
      msg(pick === 'pump' ? '&ldquo;The pump.&rdquo; He nods slowly. &ldquo;Mr Stannard will say the grating beside it, and on this map the two are a few feet apart. On this map alone, neither of us can prove the other wrong.&rdquo;' :
        '&ldquo;The grating, two yards from the pump. Mr Stannard would agree with you, and so do I, about <i>where</i>. The question is <i>what</i>: the air from that grating, or the water from that pump? On this map they are the same place.&rdquo;');
      setTimeout(function () { ER.closeAll(); finish(nxt); }, 3600);
    });
    b.first = function () { draw(); if (ER.flag('s-plot')) plotted(); else msg('&ldquo;Nine tickets from my door-to-door notes. Put each one on its house: drag it there, or click the ticket and then the house. Then I shall look.&rdquo;'); };
    return b;
  }
  function openLock() { var f = !box; if (!box) box = build(); inLock = true; ER.open('ov-lock', box, function () { inLock = false; }); if (f) box.first(); }

  function finish(nxt) {
    busy = true; inLock = false;
    ER.narrate([
      'Mr Stannard comes over to look at the finished map. He stands with his hands behind his back and nods, as if it were his own work. &ldquo;There,&rdquo; he says. &ldquo;The gratings. I said so on Monday.&rdquo;',
      '&ldquo;The pump,&rdquo; says Dr Snow mildly. &ldquo;Or the gratings. The map cannot tell us which, Mr Stannard. It can only tell us where. There are other questions to ask.&rdquo;',
      'He folds the map carefully into his coat. &ldquo;Come to Sackville Street this evening, Tapping. There are some bars on it that I cannot explain yet, and I do not like bars that I cannot explain.&rdquo;'
    ], function () {
      PU.mine('plotted', 'The map, Wednesday morning', '<p>Every death marked at the house where it began: not at the hospital, not at the workhouse.</p><p>The bars crowd round <b>the pump at the corner of Cambridge Street</b>, and round the sewer grating a few feet from it. On the map alone, the pump and the grating are the same place.</p><p>Mr Stannard says the air. Dr Snow says: the map shows where, not what.</p>');
      PU.door($('#go'), nxt, 's-file'); busy = false; paint();
    });
  }
})();
</script>
