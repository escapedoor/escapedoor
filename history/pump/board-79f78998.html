  .ar .slot.ok{border-color:#9ad88a;background:rgba(120,200,100,.12)}

  .ar-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;margin-top:10px;padding:8px;border-top:2px solid rgba(242,230,196,.3)}
  .ar-tray .paper{flex:0 1 calc(50% - 6px)}
  .ob-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:center;margin-bottom:7px}
  .ob-q{padding:7px 10px;background:rgba(0,0,0,.25);border-left:3px solid #c9a23a;color:#f2e6c4;font-family:'Libre Caslon Text',serif;font-size:14.5px;line-height:1.35}

  @media (max-width:980px){.ar{grid-template-columns:1fr}.ar-row,.ob-row{grid-template-columns:1fr}}

<script>
(function () {

    intro: [
      'Mrs Eley&rsquo;s days went into your book in order: her last visit to Broad Street months before; the bottle filled at the pump on Thursday morning; a drink on Thursday evening and another on Friday; taken ill on Friday evening (two o&rsquo;clock on Saturday, less two hours and sixteen hours, is eight on Friday evening); dead on Saturday afternoon. Mr Stannard had guessed that she caught it on a visit to Soho. Mrs Applin, who was in the house every day, knew that she had not been near it for months.',
      'Thursday 7 September, seven in the evening. The board room of the Guardians of the Poor of St James&rsquo;s parish. Rain on the windows, gas burning, and a long table of gentlemen who would very much like to go home to their dinners.'

    if (file()) return ['go', ['The Board has decided. Use the button at the bottom of the screen.']];

      'Each objection is answered by something you found in an earlier room. Everything is in your notebook.',
      'Crowding and foul air: find crowded people in foul air who did not die. Peter Street: think about the road to the Rupert Street pump. The lady at Hampstead: who was in the house? Fewer every day: why are there fewer people left to fall ill?'

  function begin() {
    paint();
    PU.need('empty', 'Dr Snow: the empty streets', '<h4>Dr Snow: the empty streets</h4><p>&ldquo;In less than a week, more than three people in every four have left these streets: all those who could.&rdquo;</p>', 'statement', 'Statement');
    PU.need('whnote', 'From the Master’s Office', PU.WHNOTE, 'office', 'Note');
    PU.need('smell', 'Mr Stannard’s map of nuisances', PU.SMELL, 'smell', 'From Mr Stannard');

    ER.narrate([
      'The Guardians sit along a table covered in green baize, under a portrait of a former chairman who looks as if he too would like his dinner. The clerk to the Board has the minute book open. Mr Stannard sits at the side, as the parish&rsquo;s officer, with his map on his knee.',

      'Dr Snow sits very straight, with his satchel in front of him. &ldquo;I am no speaker,&rdquo; he says to you, quietly. &ldquo;Put my papers in the order I should say them. The Board&rsquo;s rules are on the table. They are particular about their rules.&rdquo;'
    ], function () { busy = false; ER.flag('v-in', 1); paint(); PU.learn('Board of Guardians'); });
  }

  $('#orders').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PU.ORDERS, cls: 'orders', clue: { id: 'orders', title: 'Standing Orders', kind: 'On the table' }, done: function () { ER.flag('v-orders', 1); PU.learn('committee', 'objection'); paint(); } });

    if (busy) return;
    ER.talk({ who: 'Dr John Snow', role: 'Waiting to speak', face: PU.FACE('snow'), lines: [
      '&ldquo;They will give me ten minutes. They are good men, and tired, and they believe in the bad air because everybody they respect believes in it. I should probably believe in it myself, if I had not spent a week in Broad Street.&rdquo;',
      { q: 'What will you ask them for?', a: '&ldquo;Something small. Something they can do tonight without being certain I am right. A committee will do a small thing on a doubt. It will not do a large thing on a doubt.&rdquo;' },

  $('#stannard').addEventListener('click', function () {
    if (busy) return;
    ER.say(ER.flag('v-order') ? 'Mr Stannard is studying the ceiling with great attention.' : 'Mr Stannard nods to you, quite kindly. &ldquo;Your doctor is an honest man,&rdquo; he says. &ldquo;Honest men are often wrong.&rdquo;');

  $('#clerk').addEventListener('click', function () { if (!busy) ER.say('The clerk to the Board writes everything down, in a hand even Mr Peebles would admire.'); });
  PU.thing('#florrie', null, 'Florrie, in the doorway, mouths something at you. It might be &ldquo;good luck&rdquo;. It might be &ldquo;hurry up&rdquo;.', isBusy);
  PU.thing('#guardians', 'guardian', 'The Guardians of the Poor: tradesmen and gentlemen of the parish, elected to run the workhouse and look after the poor. Tonight, the pump.', isBusy);

  function buildA() {

    b.innerHTML = '<div class="ar-table">' + SLOT.map(function (s) { return '<div class="ar-row"><b>' + s[1] + '<small>' + s[2] + '</small></b><div class="slot" data-s="' + s[0] + '"></div></div>'; }).join('') +
      '<div class="ar-tray">' + PAP.map(function (p) { return '<div class="paper dnd-item" data-p="' + p[0] + '">' + p[1] + '</div>'; }).join('') + '</div></div>' +
      '<div class="ar-side"><h3 class="lk-title">The satchel</h3><div class="lk-face">' + PU.FACE('snow') + '</div><h6 class="lk-h">Dr Snow</h6><p class="pmsg"></p><button type="button" class="btn" id="ar-go">Hand him the papers</button></div>';
    msgEl = b.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    var tray = b.querySelector('.ar-tray');
    ER.dnd(b, { item: '.paper', slot: '.slot', home: tray, lock: function () { return lock; }, change: function () { ER.$$('.slot', b).forEach(function (s) { s.classList.remove('no', 'ok'); }); } });
    b.querySelector('#ar-go').addEventListener('click', function () {
      if (lock) return;
      var got = SLOT.map(function (s) { var p = b.querySelector('.slot[data-s="' + s[0] + '"] .paper'); return p ? p.getAttribute('data-p') : ''; });
      if (got.indexOf('') >= 0) { msg('&ldquo;Five places, five papers. Four papers stay in the satchel.&rdquo;'); return; }
      var bad = null;
      SLOT.forEach(function (s, i) { var ok = ER.check('ar', s[0] + ':' + got[i]); b.querySelector('.slot[data-s="' + s[0] + '"]').classList.add(ok ? 'ok' : 'no'); if (!ok && !bad) bad = [s, got[i]]; });
      if (bad) {
        PU.slip(); ER.sfx.no();
        var p = bad[1], s = bad[0];
        msg('&ldquo;' + s[1] + ' place: ' + (
          p === 'all' ? 'close every pump? They will ask what it costs, and who will carry water to the whole parish. Ask for something small.' :
          p === 'lime' ? 'wash the gratings? That is Mr Stannard&rsquo;s remedy, for Mr Stannard&rsquo;s theory.' :
          p === 'clear' ? 'nearly clear water is a weakness, not a fact on my side. Mr Stannard will say it for me, I expect.' :
          p === 'book' ? 'Order seven: I shall not read from a book. And they have not read it.' :
          s[0] === 's1' ? 'the first thing is what I ask them to <i>do</i>.' :
          s[0] === 's2' ? 'the plainest fact: something any one of them could see for himself.' :
          s[0] === 's3' ? 'the facts that need more explaining, after the plain one.' :
          s[0] === 's4' ? 'what they will say against me, and my answer, before they say it.' :
          'what will it cost the parish? That is the last thing they hear, and the first thing they ask.') + '&rdquo;');
        return;
      }
      lock = true; b.querySelector('#ar-go').disabled = true; ER.flag('v-order', 1); ER.flag('v-ord', got.join('-')); ER.sfx.paper();
      msg('&ldquo;Thank you.&rdquo; He takes the papers, squares their edges, and stands up.');
      setTimeout(function () { ER.closeAll(); speech(); }, 2000);
    });
    b.first = function () { msg('&ldquo;Their Standing Order No. 7. Five places on the table, and nine papers. Put five of them in the order I should say them.&rdquo;'); };
    return b;
  }
  function openA() { var f = !boxA; if (!boxA) boxA = buildA(); inA = true; ER.open('ov-lock', boxA, function () { inA = false; }); if (f) boxA.first(); }

  function speech() {
    busy = true; inA = false; paint(); PU.solved(true);
    ER.narrate([
      'Dr Snow speaks for nine minutes by the clock. He is not a good speaker: his voice is quiet, and two of the Guardians have to lean forward to hear. But he says it in the order of their own rules, and they cannot complain about the order.',
      'He asks for one thing: the handle. He shows them the map. He shows them the line drawn by counting steps. He tells them what they will say, the bad air, and answers it with the workhouse and the brewery, before anybody can open his mouth. And he tells them that a handle costs nothing.',
      'Then he sits down, and the Guardians begin to object.'
    ], function () { busy = false; paint(); openB(); });
  }

  /* ---------- lock 2: an answer for every objection ---------- */
  var OBJ = [['o1', 'A Guardian with a gold watch-chain', 'The deaths are round the pump because the poorest, most crowded houses are round the pump. Crowding and foul air, Dr Snow. Nothing more.'],
    ['o2', 'A Guardian in spectacles', 'There were deaths in Peter Street, close by the Rupert Street pump. Your pump cannot reach so far.'],
    ['o3', 'Mr Stannard', 'Your lady at Hampstead caught it on a visit to Broad Street. The Weekly Lantern says so.'],
    ['o4', 'The Chairman', 'The deaths are fewer every day. In a week it will be over by itself. Why should the parish touch anything?']];
  var EXH = [['e1', 'Mr Peebles&rsquo;s totals: 89 deaths in the week, 79 of them on Friday and Saturday.'], ['e5', 'The workhouse: 535 inmates under one roof, in the foul air, with a well of its own. 5 deaths.'],
    ['e7', 'The bottle on Dr Snow&rsquo;s desk: the water looked nearly clear.'], ['e2', 'Dr Snow at the doors: more than three people in every four have left those streets.'],
    ['e6', 'Mrs Applin: no visit to Broad Street for months; the bottle came up the hill every day.'], ['e3', 'Mr Stannard&rsquo;s map of nuisances.'],
    ['e4', 'The line by the nearest road: the blind court in Peter Street, and the long way round to Rupert Street.']];
  function buildB() {
    var b = ER.el('div', 'ar'), lock = false, msgEl;
    b.innerHTML = '<div class="ar-table">' + OBJ.map(function (o) { return '<div class="ob-row"><div class="ob-q"><i>' + o[1] + '</i>&ldquo;' + o[2] + '&rdquo;</div><div class="slot" data-o="' + o[0] + '"></div></div>'; }).join('') +
      '<div class="ar-tray">' + EXH.map(function (e) { return '<div class="paper dnd-item" data-e="' + e[0] + '">' + e[1] + '</div>'; }).join('') + '</div></div>' +
      '<div class="ar-side"><h3 class="lk-title">The objections</h3><div class="lk-face">' + PU.FACE('chair') + '</div><h6 class="lk-h">The Chairman</h6><p class="pmsg"></p><button type="button" class="btn" id="ob-go">Pass the answers to Dr Snow</button></div>';
    msgEl = b.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    var tray = b.querySelector('.ar-tray');
    ER.dnd(b, { item: '.paper', slot: '.slot', home: tray, lock: function () { return lock; }, change: function () { ER.$$('.slot', b).forEach(function (s) { s.classList.remove('no', 'ok'); }); } });
    b.querySelector('#ob-go').addEventListener('click', function () {
      if (lock) return;
      var got = OBJ.map(function (o) { var p = b.querySelector('.slot[data-o="' + o[0] + '"] .paper'); return p ? p.getAttribute('data-e') : ''; });
      if (got.indexOf('') >= 0) { msg('&ldquo;Every objection wants its answer, young person. The Board is waiting.&rdquo;'); return; }
      var bad = null;
      OBJ.forEach(function (o, i) { var ok = ER.check('ob', o[0] + ':' + got[i]); b.querySelector('.slot[data-o="' + o[0] + '"]').classList.add(ok ? 'ok' : 'no'); if (!ok && !bad) bad = [o, got[i]]; });
      if (bad) {
        PU.slip(); ER.sfx.no();
        var o = bad[0], e = bad[1];
        msg(e === 'e3' ? 'Mr Stannard looks pleased. &ldquo;My map, sir? Thank you. It supports me.&rdquo;' :
          e === 'e7' ? '&ldquo;Nearly clear?&rdquo; says the Chairman. &ldquo;Then I suppose it is nearly harmless.&rdquo; Two Guardians laugh.' :
          e === 'e1' ? '&ldquo;Those are last week&rsquo;s figures,&rdquo; says the Chairman. &ldquo;They do not answer the question.&rdquo;' :
          { o1: '&ldquo;That does not answer me, sir,&rdquo; says the Guardian with the watch-chain. &ldquo;Show me crowded people in foul air who did not die.&rdquo;',
            o2: '&ldquo;I asked about Peter Street, doctor,&rdquo; says the Guardian in spectacles. &ldquo;How far is it to Rupert Street, for a man with a pail?&rdquo;',
            o3: '&ldquo;The Lantern is a respectable paper,&rdquo; says Mr Stannard. &ldquo;Who says otherwise, and how would they know?&rdquo;',
            o4: '&ldquo;Fewer every day, doctor,&rdquo; says the Chairman. &ldquo;Why fewer, if your pump is still pumping?&rdquo;' }[o[0]]);
        return;
      }
      var nxt = ER.exit([(ER.flag('v-ord') || 'req-map-line-wh-cost') + '|' + got.join('-')], { wait: true });
      if (!nxt) { msg('&ldquo;Something is not right here. Tell your teacher.&rdquo;'); return; }
      lock = true; b.querySelector('#ob-go').disabled = true; PU.sfx.gavel();
      msg('The Chairman rings his bell. &ldquo;Thank you, Dr Snow. The Board will consider the matter. Would you be so kind as to wait outside?&rdquo;');
      setTimeout(function () { ER.closeAll(); finish(nxt); }, 3200);
    });
    b.first = function () { msg('&ldquo;Four objections, Dr Snow. You may answer each of them once.&rdquo; Dr Snow slides the notebook towards you: he wants the right paper for each.'); };
    return b;
  }
  function openB() { var f = !boxB; if (!boxB) boxB = buildB(); inB = true; ER.open('ov-lock', boxB, function () { inB = false; }); if (f) boxB.first(); }

  function finish(nxt) {
    busy = true; inB = false;
    ER.narrate([
      'You wait in the passage with Dr Snow and Florrie for twenty-five minutes. Dr Snow does not walk up and down. He sits on a bench and reads a medical journal, and turns a page now and then.',
      'Then the clerk calls you back in. The Chairman does not smile. &ldquo;Dr Snow, the Board is not persuaded that you are right. But the Board is persuaded that a handle is cheap. The handle of the Broad Street pump will be taken off tomorrow morning.&rdquo;',
      'Outside, on the wet steps, Dr Snow stops. &ldquo;Tapping. Remember this. If the deaths fall now, people will say the handle did it. But they were falling already, and three people in four have gone. A fall that comes after the handle will not prove the handle, by itself.&rdquo;',
      '&ldquo;So we&rsquo;ll never know?&rdquo; says Florrie. &ldquo;We shall know more,&rdquo; says Dr Snow. &ldquo;But not from that.&rdquo;'
    ], function () {
      PU.mine('board', 'The Board, Thursday evening', '<p>In the order of Standing Order No. 7: the request (take off the handle); the plainest fact (the map); the facts that need explaining (the line by the nearest road); what will be said against us (bad air) and the answer (the workhouse and the brewery); the cost (a minute).</p><p>The objections: crowding, answered by the workhouse; Peter Street, by the long way round to Rupert Street; Hampstead, by Mrs Applin; &ldquo;fewer every day&rdquo;, by the empty streets.</p><p>The handle comes off tomorrow. Dr Snow: a fall after the handle will not prove the handle, by itself.</p>');
      PU.learn('cause', 'correlation');
      PU.door($('#go'), nxt, 'v-file'); busy = false; paint();
    });
  }
})();
</script>
