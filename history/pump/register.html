  @keyframes nudge{50%{transform:translateY(-5px)}}

  /* the lock: slips of the returns, Dr Snow's sheet and the spike */
  .rg{display:grid;grid-template-columns:minmax(0,640px) minmax(0,470px);gap:18px;width:min(1130px,97vw);align-items:start}
  .rg-tray{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start;min-height:420px;padding:10px;background:#4a3424 linear-gradient(160deg,#5a4030,#3a2818);border:6px solid #2a1c10;box-shadow:inset 0 0 18px rgba(0,0,0,.6)}
  .rg-tray:before{content:'THE RETURNS · WEEK ENDING 2ND SEPT.';grid-column:1/-1;font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.22em;color:#e9d8b4}
  .pc.sl{position:relative;padding:5px 8px 5px 10px;background:#f1ebd8;color:#1d2230;border-left:4px solid #7a1d14;font-family:'EB Garamond',serif;font-size:14.2px;line-height:1.22;box-shadow:0 3px 6px rgba(0,0,0,.4);text-align:left}

  .pc.sl .sd{margin-left:8px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;color:#4a4f40;text-transform:uppercase}
  .pc.sl .ad{display:block}
  .pc.sl .c{display:block;font-style:italic}
  .pc.sl .r{display:block;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;color:#5a4f3a}
  .rg-side{display:grid;gap:10px}
  .bin{position:relative;min-height:190px;padding:30px 10px 10px;border-radius:2px}
  .bin h6{position:absolute;left:12px;top:7px;margin:0;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
  .bin.snow{background:#faf6ea repeating-linear-gradient(transparent 0 25px,rgba(90,120,170,.2) 25px 26px);color:#1d2230;border-left:3px double #b3261c;box-shadow:0 10px 24px rgba(0,0,0,.5)}
  .bin.spike{background:#2a1e14;color:#e9d8b4;border:1px dashed #8a6a4a}
  .bin.spike:after{content:'';position:absolute;right:16px;top:8px;width:3px;height:26px;background:#c9c3ae;box-shadow:0 26px 0 -1px #5a4a3a}
  .bin .bin-in{display:flex;flex-direction:column;gap:4px;min-height:140px}
  .bin .pc.sl{font-size:13px;padding:3px 8px;border-left-width:3px}
  .bin .pc.sl .c,.bin .pc.sl .r{display:none}
  .bin .pc.sl .ad{display:inline;margin-left:6px}
  .bin .pc.sl .sd{font-size:10px}
  .bin .pc.sl b{margin-right:6px}
  .rg-foot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
  .rg-foot .lk-face{width:96px}
  .rg-foot .btn{margin-top:8px}
  @media (max-width:980px){.rg{grid-template-columns:1fr}}

<script>
(function () {
  var $ = ER.$, busy = true, box = null, inLock = false;

  ER.init({
    theme: 'history', story: 'pump', storyTitle: 'By the Nearest Road', id: 'register', no: 'I', title: 'The Copying Room',
    go: 'Take off your coat', back: '../index.html', backLabel: 'Archive',
    intro: [
      'London, Tuesday 5 September 1854. Somerset House, on the river: the General Register Office, where every birth, marriage and death in England and Wales is sent to be copied, counted and kept.',
      'You are thirteen, the junior copying clerk. For four days the death returns from the streets round Golden Square, in Soho, have come in by the armful, and the grown men in the copying room have stopped making jokes.',
      'This morning a doctor is waiting at Mr Peebles&rsquo;s desk.'
    ],
    exit: {"next":"street","w":{"f5f9b392":"f5d3622c"}}, tags: {"in":["5592f09b","12b327ca","464ab1e1","5cedd66b","cc02a7e4","d4323d84"],"why":["38b7e994","a0c3366b","b2216db4","2244e8bf","7a6cac2f","3e05fa76","4bde63ca","a464aab6"]},
    hints: hints, onBegin: begin
  });

  function file() { return ER.flag('r-file'); }
  function isBusy() { return busy; }
  function paint() {
    var ready = ER.flag('r-note') && ER.flag('r-line');
    $('#note').classList.toggle('ready', !file() && !ER.flag('r-note'));
    $('#line').classList.toggle('ready', !file() && !!ER.flag('r-note') && !ER.flag('r-line'));
    $('#tray').classList.toggle('ready', !file() && !!ready);
    ER.pips(file() ? 1 : 0, 1);
    if (file()) PU.door($('#go'), file(), 'r-file');
  }
  function hints() {
    if (file()) return ['go', ['Dr Snow is waiting. Use the button at the bottom of the screen.']];
    if (inLock) return ['sort', [
      'Dr Snow asked for three things at once: one cause, one week of registering, and three sub-districts. A slip goes on his list only if all three are right.',
      'For each slip, check the cause word for word, the sub-district next to the number, and the last line: the day it was registered, not the day of the death. The almanac on the wall shows which days are in the week ending Saturday 2 September.',
      'A death in a hospital is registered in the hospital&rsquo;s sub-district. A death registered on Monday 4 September belongs to the next week, and nothing registered before Sunday 27 August belongs to this one. Old age, scarlet fever and exhaustion after diarrhoea are not cholera. Six slips go to Dr Snow.'
    ]];
    if (!ER.flag('r-note') || !ER.flag('r-line')) return ['read', [
      'Dr Snow&rsquo;s note is on Mr Peebles&rsquo;s desk, on the right. The card about the register is pinned to the pillar.',
      'Read both. Then the tray of returns on your desk will open.'
    ]];
    return ['tray', ['The tray of returns is on your desk, in front of you. The almanac and Mr Peebles&rsquo;s card are worth a look too.']];
  }

  function begin() {
    paint();
    if (ER.flag('r-in')) { busy = false; ER.say(file() ? 'Dr Snow has his list. He is putting on his hat.' : 'The copying room. The clock, the river, and a doctor waiting.'); return; }
    ER.narrate([
      'Somerset House is so big that the General Register Office has only a corner of it, and the corner is so big that Mr Peebles keeps a map of it in his drawer.',
      'Since Friday nobody in the copying room has said the word cholera out loud. They write it instead, again and again, in their best hand.',
      'The doctor is standing at the window. He is a short, quiet man of about forty in a black coat, and he looks at the river as if he expected it to explain itself.',
      '&ldquo;Dr Snow has the Registrar General&rsquo;s permission to have a list,&rdquo; says Mr Peebles. &ldquo;His note says exactly what. Copy him exactly that, Tapping: not a line more, not a line less. A clerk who copies what nobody asked for is a clerk who has run out of work.&rdquo;'
    ], function () { busy = false; ER.flag('r-in', 1); paint(); PU.learn('register', 'registrar'); });
  }

  /* ---------- people and things ---------- */
  $('#peebles').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Mr Augustus Peebles', role: 'Senior clerk of the copying room', face: PU.FACE('peebles'), lines: [
      '&ldquo;The returns came in this morning, sub-district by sub-district. Each slip is one line of a registrar&rsquo;s book, copied out. They are in the tray on your desk.&rdquo;',
      '&ldquo;Read the card on the pillar before you touch them. Every new clerk thinks he can read a register. Every new clerk is wrong for a fortnight.&rdquo;',
      { q: 'Why does Dr Snow want them?', a: '&ldquo;He has a theory. Doctors generally do. Ours is not to ask why, Tapping. Ours is to copy correctly.&rdquo;' },
      { note: 'He lowers his voice.' },
      '&ldquo;Though I will say this. He is the man who gave the Queen chloroform last year, when the little prince was born, and she was very well pleased with it. So he is not a fool. And keep my card by you, the one on your desk. You will want it more than you think.&rdquo;'
    ], clue: { id: 'peebles', title: 'Mr Peebles on the returns', kind: 'Statement' } });
  });
  $('#snow').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Dr John Snow', role: 'Physician, of Sackville Street', face: PU.FACE('snow'), lines: [
      '&ldquo;I have been in Broad Street since Sunday,&rdquo; he says. &ldquo;I should like to know where every one of them lived. The registrars know. So I have come to the registrars.&rdquo;',
      { q: 'Is it the bad air, sir? Everybody says so.', a: '&ldquo;Everybody does. Everybody may be wrong, but thinking so is not knowing so. A list is a beginning.&rdquo;' },
      '&ldquo;Cholera only, if you please. If a line says anything else, leave it out, however much you suspect it. I would rather have a short list I can trust than a long one I must check.&rdquo;'
    ], clue: { id: 'snow1', title: 'Dr Snow, at the window', kind: 'Statement' }, done: function () { PU.learn('cholera'); } });
  });
  $('#note').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PU.REQUEST, cls: 'notes', clue: { id: 'request', title: 'Dr Snow’s note', kind: 'Letter' }, done: function () {
      ER.flag('r-note', 1); PU.learn('sub-district'); paint();
      if (!ER.flag('r-line')) ER.say('Three things at once: one cause, one week, three sub-districts. The card on the pillar says how to read a line.');
    } });
  });
  $('#line').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PU.LINE, cls: 'reg', clue: { id: 'line', title: 'How to read a line of the register', kind: 'On the pillar' }, done: function () {
      ER.flag('r-line', 1); PU.learn('informant', 'certify'); paint();
      if (ER.flag('r-note') && !file()) ER.say('Now the tray of returns, on your desk.');
    } });
  });
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PU.CARD, cls: 'card', clue: { id: 'card', title: 'Mr Peebles’s card', kind: 'On your desk' } });
  });
  $('#almanac').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: almanac(), cls: 'office', clue: { id: 'almanac', title: 'The almanac for 1854', kind: 'On the wall' } });
  });
  function almanac() {
    function month(name, first, days) {
      var h = '<table style="border-collapse:collapse;margin:0 0 10px;font-family:\'IBM Plex Mono\',monospace;font-size:14px"><tr><th colspan="7" style="text-align:left;font-family:\'Libre Caslon Text\',serif;font-size:15px;padding:2px 0 4px">' + name + ' 1854</th></tr><tr>';
      ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function (d) { h += '<th style="padding:2px 9px;font-size:12px;color:#7a6a4e">' + d + '</th>'; });
      h += '</tr><tr>';
      var c = 0, i;
      for (i = 0; i < first; i++) { h += '<td></td>'; c++; }
      for (i = 1; i <= days; i++) { h += '<td style="padding:2px 9px;text-align:right">' + i + '</td>'; c++; if (c % 7 === 0 && i < days) h += '</tr><tr>'; }
      return h + '</tr></table>';
    }
    return '<h4>Almanac</h4><h5>For the year of our Lord 1854</h5><div class="two"><div>' + month('August', 2, 31) + '</div><div>' + month('September', 5, 30) + '</div></div>';
  }
  PU.thing('#window', null, 'The river, brown and busy, and the dome of St Paul&rsquo;s in the haze downstream. Mr Peebles says the view is the only thing in the building that is never filed.', isBusy);
  PU.thing('#shelves', 'register', 'Registers: one book for every sub-district for every quarter of every year since 1837. Somebody has copied all of them.', isBusy);
  PU.thing('#clerks', null, 'Two clerks at the far desks, copying births. They have not looked up since you came in.', isBusy);
  PU.thing('#clock', null, 'A quarter past ten. Mr Peebles likes the copying room quiet enough to hear the clock.', isBusy);
  PU.thing('#stove', null, 'A stove, unlit. It is September, and Mr Peebles does not believe in coal before November.', isBusy);
  $('#tray').addEventListener('click', function () {
    if (busy || file()) return;
    if (!ER.flag('r-note') || !ER.flag('r-line')) { ER.say('&ldquo;Not yet,&rdquo; says Mr Peebles, without looking up. &ldquo;The doctor&rsquo;s note first, and then the card on the pillar.&rdquo;'); return; }
    openLock();
  });

  /* ---------- the lock: which lines go to Dr Snow ---------- */
  var SL = [
    ['219', 'All Souls, Marylebone', 'Middlesex Hospital, 1 Sept. · M · 30 · Cabinet-maker, brought in from Noel Street', 'Cholera, 15 hours. Certified.', 'Registered 2 Sept.'],
    ['214', 'Golden Square', '38 Broad Street, 2 Sept. · M · 38 · Tailor', 'Cholera, 10 hours. Certified.', 'Registered 2 Sept.'],
    ['223', 'Golden Square', '3 Marshall Street, 26 Aug. · M · 28 · Carman', 'Cholera, 2 days. Certified.', 'Registered 26 Aug.'],
    ['216', 'St Ann, Soho', '9 Dean Street, 1 Sept. · M · 45 · French polisher', 'Asiatic cholera, 18 hours. Certified.', 'Registered 2 Sept.'],
    ['220', 'Berwick Street', '5 Hopkins Street, 30 Aug. · F · 71 · Widow', 'Old age. Not certified.', 'Registered 31 Aug.'],
    ['h41', 'Hampstead', 'West End, 2 Sept. · F · 59 · The widow of a percussion-cap maker', 'Diarrhœa two hours, cholera epidemica sixteen hours.', 'Registered 4 Sept.'],
    ['221', 'Golden Square', '8 Cambridge Street, 31 Aug. · M · 4 · Son of a tailor', 'Cholera, 20 hours. Certified.', 'Registered 1 Sept.'],
    ['218', 'Golden Square', '20 Broad Street, 2 Sept. · M · 52 · Shoemaker', 'Cholera, 8 hours. Certified.', 'Registered 4 Sept.'],
    ['225', 'St Ann, Soho', '17 Greek Street, 1 Sept. · M · 3 · Son of a waiter', 'Scarlatina, 6 days. Certified.', 'Registered 2 Sept.'],
    ['215', 'Berwick Street', '12 Peter Street, 1 Sept. · F · 6 · Daughter of a labourer', 'Cholera, 14 hours. Certified.', 'Registered 2 Sept.'],
    ['222', 'St James&rsquo;s Square', '30 Jermyn Street, 1 Sept. · M · 60 · Gentleman', 'Cholera, 22 hours. Certified.', 'Registered 2 Sept.'],
    ['217', 'Golden Square', '40 Broad Street, 2 Sept. · F · 5 months · Daughter of a police constable', 'Exhaustion, after an attack of diarrhœa four days previous to death.', 'Registered 2 Sept.'],
    ['226', 'Golden Square', '14 Silver Street, 1 Sept. · F · 41 · Laundress', 'Cholera, 9 hours. Certified.', 'Registered 2 Sept.'],
    ['224', 'Berwick Street', '18 Poland Street, 2 Sept. · F · 33 · Wife of a tailor', 'Cholera, 16 hours. Certified.', 'Registered 2 Sept.']
  ];
  function num(id) { return id === 'h41' ? 'Hampstead No. 41' : 'No. ' + id; }
  function build() {
    var b = ER.el('div', 'rg'), tray = ER.el('div', 'rg-tray'), side = ER.el('div', 'rg-side'), lock = false, msgEl;
    SL.forEach(function (s) {
      var c = ER.el('div', 'pc sl', '<b>' + num(s[0]) + '</b><span class="sd">' + s[1] + '</span><span class="ad">' + s[2] + '</span><span class="c">' + s[3] + '</span><span class="r">' + s[4] + '</span>');
      c.setAttribute('data-id', s[0]); tray.appendChild(c);
    });
    side.innerHTML = '<div class="bin snow" data-b="snow"><h6>For Dr Snow</h6><div class="bin-in"></div></div>' +
      '<div class="bin spike" data-b="spike"><h6>Not asked for</h6><div class="bin-in"></div></div>' +
      '<div class="rg-foot"><div class="lk-face">' + PU.FACE('peebles') + '</div><div><h6 class="lk-h">Mr Peebles</h6><p class="pmsg"></p><button type="button" class="btn" id="rg-go">Give Dr Snow the list</button></div></div>';
    b.appendChild(tray); b.appendChild(side);
    msgEl = side.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    PU.bins(b, { item: '.pc', bin: '.bin', home: tray, lock: function () { return lock; }, change: function () { PU.sfx.pen(); } });
    function ids(which) { return ER.$$('.bin[data-b="' + which + '"] .pc', b).map(function (n) { return n.getAttribute('data-id'); }); }
    b.querySelector('#rg-go').addEventListener('click', function () {
      if (lock) return;
      ER.$$('.pc', b).forEach(function (n) { n.classList.remove('no', 'ok'); });
      var left = ER.$$('.pc', tray).length;
      if (left) { msg('&ldquo;Every slip goes somewhere, Tapping: to the doctor, or on the spike. ' + left + (left === 1 ? ' slip is' : ' slips are') + ' still in the tray.&rdquo;'); return; }
      var mine = ids('snow');
      if (!mine.length) { msg('&ldquo;An empty sheet? The doctor walked here from Piccadilly.&rdquo;'); return; }
      var cand = mine.slice().sort(function (x, y) { return (parseInt(x, 10) || 9999) - (parseInt(y, 10) || 9999); }).join('-');
      var nxt = ER.exit([cand], { wait: true });
      if (nxt) { lock = true; b.querySelector('#rg-go').disabled = true; ER.$$('.bin[data-b="snow"] .pc', b).forEach(function (n) { n.classList.add('ok'); }); solved(nxt); return; }
      PU.slip(); ER.sfx.no();
      var bad = [], first = null;
      mine.forEach(function (id) {
        if (ER.check('in', id)) return;
        var w = PU.why('why', [id + '>cause', id + '>reg', id + '>place']);
        bad.push(id); if (!first) first = [id, w ? w.split('>')[1] : 'x'];
      });
      ids('spike').forEach(function (id) { if (ER.check('in', id)) { bad.push(id); if (!first) first = [id, 'in']; } });
      bad.forEach(function (id) { var n = b.querySelector('.pc[data-id="' + id + '"]'); if (n) n.classList.add('no'); });
      var head = bad.length === 1 ? 'One slip is in the wrong place.' : bad.length + ' slips are in the wrong place.';
      var k = first[1], n = num(first[0]);
      msg('&ldquo;' + head + ' Take ' + n + '. ' + (
        k === 'cause' ? 'Read the cause again, word for word. Does it say what the doctor asked for?' :
        k === 'reg' ? 'Look at the last line: when was it registered? The doctor asked for one week of registering, Sunday to Saturday.' :
        k === 'place' ? 'Where did it happen, and so in which sub-district was it registered? Look at the sub-district next to the number, and at the doctor&rsquo;s note.' :
        k === 'in' ? 'It is on the spike, and it should not be. Read it against the doctor&rsquo;s note again: the cause, the week, the place.' :
        'Read it against the doctor&rsquo;s note again: the cause, the week, the place.') + '&rdquo;');
    });
    b.first = function () { msg('&ldquo;Fourteen slips. Each one goes to the doctor or on the spike. Read every column: the card on the pillar says what they mean.&rdquo;'); };
    return b;
  }
  function openLock() { var f = !box; if (!box) box = build(); inLock = true; ER.open('ov-lock', box, function () { inLock = false; }); if (f) box.first(); }

  function solved(nxt) {
    busy = true;
    setTimeout(function () {
      ER.closeAll(); inLock = false;
      ER.narrate([
        'Dr Snow reads the six lines twice, and then the totals that Mr Peebles has copied for him from the rest of the returns. Eighty-nine deaths from cholera registered in the week in the three sub-districts. Only six in the first four days. Four on Thursday the 31st. Seventy-nine on Friday and Saturday.',
        '&ldquo;Then it began on Thursday night,&rdquo; he says quietly. &ldquo;All at once. A thing that begins all at once has one cause, in one place.&rdquo;',
        '&ldquo;The doctor has asked to borrow a clerk who can read a registrar&rsquo;s hand,&rdquo; says Mr Peebles. &ldquo;The list belongs to this Office, so it goes with him, and so do you. Bring it back clean.&rdquo;',
        'While you get your coat you put the Hampstead slip back in its bundle. Then, for no reason you could explain, you copy it into your own book first.'
      ], function () {
        PU.mine('list', 'Dr Snow’s list', PU.LIST);
        PU.mine('h41', 'The Hampstead line', PU.H41);
        PU.learn('outbreak');
        PU.door($('#go'), nxt, 'r-file'); busy = false; paint();
      });
    }, 1600);
  }
})();
</script>
