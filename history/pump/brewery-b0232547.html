    intro: [
      'The pins went where the two walks were equal: 50 yards up Marshall Street, 100 yards along Peter Street (the blind court has a wall across it, so Rupert Street is a long way round), and 160 yards down Great Pulteney Street. Beyond that line, every death had a reason: two families liked the Broad Street water better, a child went to school by the pump, a man worked in Broad Street, and one death came before the outbreak began.',

      '&ldquo;Caleb Mudge, foreman. Mr Huggins is out, but he said to tell the doctor&rsquo;s clerk whatever&rsquo;s asked. So ask.&rdquo;',

      { q: 'Do the men drink from the pump in the street?', a: '&ldquo;Them? Water?&rdquo; He laughs. &ldquo;Every man has his allowance of beer, and Mr Huggins says he doesn&rsquo;t believe they drink water at all. And if they did, they&rsquo;d not go out for it. We&rsquo;ve a deep well of our own in the yard, besides the New River water in the pipes.&rdquo;' },

    } });

  $('#stannard').addEventListener('click', function () {
    if (busy) return;
    ER.talk({ who: 'Mr Horace Stannard', role: 'Inspector of Nuisances', face: PU.FACE('stannard'), lines: [
      '&ldquo;Ah, the doctor&rsquo;s clerk. You&rsquo;ll find nothing here to trouble my map. The brewers escaped because of the malt. The steam from the coppers drives off the foul air. Everybody knows brewers are a healthy lot.&rdquo;',
      { q: 'And the workhouse? It has no coppers.', a: '&ldquo;The workhouse is a large, clean building with high walls. The foul air of the street cannot get in. It stands to reason.&rdquo;' },
      '&ldquo;Every exception has its explanation, if a man knows where to look. That is the beauty of the thing.&rdquo;'
    ], clue: { id: 'stannard2', title: 'Mr Stannard: malt and high walls', kind: 'Statement' } });
  });
  PU.thing('#well', 'well', 'The brewery&rsquo;s own well, deep in the gravel, with its own pump. The water in it never sees Broad Street.', isBusy);
  PU.thing('#jugs', 'allowance', 'The men&rsquo;s allowance: a jug of beer and a row of mugs. Nobody has touched the water bucket in years. There is a spider in it.', isBusy);
  PU.thing('#barrels', 'cask', 'Casks waiting to go out to the public houses of the West End.', isBusy);
  PU.thing('#cat', null, 'The brewery cat. Her job is mice, and she does it from a great height.', isBusy);
  $('#board').addEventListener('click', function () {
    if (busy || file()) return;
    if (!ready()) { ER.say('The slate. First hear Mr Mudge and Mr Pook, and read Dr Snow&rsquo;s note: Florrie has it.'); return; }
    openLock();
  });

  /* ---------- the slate ---------- */
  var COLS = [['s', 'The streets round the workhouse', 'people who stayed'], ['w', 'The workhouse', '535 inmates'], ['b', 'The brewery', 'above 70 men']];
  var TOK = [['pump', 'the Broad Street pump'], ['own', 'a well of its own'], ['beer', 'beer, and a deep well of its own'], ['butt', 'rain-water butts']];
  function build() {
    var b = ER.el('div', 'pb'), lock = false, msgEl, val = { air: {}, fit: {} }, nums = {};
    var g = '<div class="pb-g"><div></div>' + COLS.map(function (c) { return '<div class="hd">' + c[1] + '<small>' + c[2] + '</small></div>'; }).join('');
    g += '<div class="rl">1. They drink water from</div>' + COLS.map(function (c) { return '<div class="cell" data-r="src" data-c="' + c[0] + '"><div class="slot" data-c="' + c[0] + '"></div></div>'; }).join('');
    g += '<div class="rl">2. The air there, by Mr Stannard&rsquo;s own map</div>' + COLS.map(function (c) { return '<div class="cell" data-r="air" data-c="' + c[0] + '"><button type="button" class="tg2" data-v="foul">foul</button><button type="button" class="tg2" data-v="fair">fair</button></div>'; }).join('');
    g += '<div class="rl">3. Deaths expected, if it suffered like the streets round it</div><div class="fixed">about 1 in 5</div><div class="cell" data-r="exp" data-c="w"></div><div class="cell" data-r="exp" data-c="b"></div>';
    g += '<div class="rl">4. Deaths recorded</div><div class="fixed">very many</div><div class="cell" data-r="rec" data-c="w"></div><div class="cell" data-r="rec" data-c="b"></div>';
    g += '<div class="rl">5. Does it fit the theory?</div>' + COLS.map(function (c) { return '<div class="cell" data-r="fit" data-c="' + c[0] + '"><div class="fit2"><span>bad air</span><button type="button" class="tg2" data-k="air" data-v="y">yes</button><button type="button" class="tg2" data-k="air" data-v="n">no</button></div><div class="fit2"><span>water</span><button type="button" class="tg2" data-k="water" data-v="y">yes</button><button type="button" class="tg2" data-k="water" data-v="n">no</button></div></div>'; }).join('');
    g += '</div><div class="pb-tray">' + TOK.map(function (t) { return '<span class="tok dnd-item" data-t="' + t[0] + '">' + t[1] + '</span>'; }).join('') + '</div>';
    b.innerHTML = '<div class="pb-slate">' + g + '</div><div class="pb-side"><h3 class="lk-title">The slate</h3><div class="lk-face">' + PU.FACE('florrie') + '</div><h6 class="lk-h">Florrie</h6><p class="pmsg"></p><button type="button" class="btn" id="pb-go">Chalk it up</button></div>';
    msgEl = b.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    var tray = b.querySelector('.pb-tray');
    ER.dnd(b, { item: '.tok', slot: '.slot', home: tray, lock: function () { return lock; }, change: function () { PU.sfx.chalk(); clear(); } });
    ER.$$('.cell[data-r="exp"],.cell[data-r="rec"]', b).forEach(function (c) {
      var k = c.getAttribute('data-r') + c.getAttribute('data-c');
      var st = PU.num({ val: 0, min: 0, max: 600, steps: [10, 1], onChange: clear });
      c.appendChild(st.el); nums[k] = st;
    });
    ER.$$('.cell[data-r="air"] .tg2', b).forEach(function (t) {
      t.addEventListener('click', function () { if (lock) return; var c = t.parentNode; val.air[c.getAttribute('data-c')] = t.getAttribute('data-v'); ER.$$('.tg2', c).forEach(function (x) { x.classList.toggle('on', x === t); }); PU.sfx.chalk(); clear(); });
    });
    ER.$$('.cell[data-r="fit"] .tg2', b).forEach(function (t) {
      t.addEventListener('click', function () {
        if (lock) return;
        var c = t.closest('.cell'), col = c.getAttribute('data-c'), k = t.getAttribute('data-k');
        val.fit[col] = val.fit[col] || {}; val.fit[col][k] = t.getAttribute('data-v');
        ER.$$('.tg2[data-k="' + k + '"]', c).forEach(function (x) { x.classList.toggle('on', x === t); }); PU.sfx.chalk(); clear();
      });
    });
    function clear() { ER.$$('.cell', b).forEach(function (c) { c.classList.remove('no', 'ok'); }); }
    function tok(col) { var s = b.querySelector('.slot[data-c="' + col + '"] .tok'); return s ? s.getAttribute('data-t') : ''; }
    function mark(r, col, ok) { var c = b.querySelector('.cell[data-r="' + r + '"][data-c="' + col + '"]'); if (c) c.classList.add(ok ? 'ok' : 'no'); return ok; }
    b.querySelector('#pb-go').addEventListener('click', function () {
      if (lock) return;
      clear();
      var src = COLS.map(function (c) { return tok(c[0]); }), air = COLS.map(function (c) { return val.air[c[0]] || ''; });
      var fit = COLS.map(function (c) { var f = val.fit[c[0]] || {}; return (f.air || '') + (f.water || ''); });
      if (src.indexOf('') >= 0 || air.indexOf('') >= 0 || fit.some(function (f) { return f.length < 2; })) { msg('&ldquo;Fill every square first. Lines 1, 2 and 5 for all three places.&rdquo;'); return; }
      var bad = null;
      COLS.forEach(function (c, i) { if (!mark('src', c[0], ER.check('src', c[0] + ':' + src[i])) && !bad) bad = 'src'; });
      COLS.forEach(function (c, i) { if (!mark('air', c[0], ER.check('air', c[0] + ':' + air[i])) && !bad) bad = 'air'; });
      ['w', 'b'].forEach(function (c) { if (!mark('exp', c, ER.check('exp', c + ':' + nums['exp' + c].get())) && !bad) bad = 'exp'; });
      ['w', 'b'].forEach(function (c) { if (!mark('rec', c, ER.check('rec', c + ':' + nums['rec' + c].get())) && !bad) bad = 'rec'; });
      COLS.forEach(function (c, i) { if (!mark('fit', c[0], ER.check('fit', c[0] + ':' + fit[i])) && !bad) bad = 'fit'; });
      if (bad) {
        PU.slip(); ER.sfx.no();
        msg({ src: '&ldquo;Line 1. Where do the people in each place get the water they drink? Mr Mudge and Mr Pook both told you.&rdquo;',
          air: '&ldquo;Line 2. Look at Mr Stannard&rsquo;s own map, not at what he says about it. Where are his worst gratings? Where is his shading?&rdquo;',
          exp: '&ldquo;Line 3. If one person in five had died, as in the streets round about, how many is that out of 535? And out of seventy?&rdquo;',
          rec: '&ldquo;Line 4. How many died, really? It&rsquo;s in the Master&rsquo;s note, and Mr Mudge told you about the brewers.&rdquo;',
          fit: '&ldquo;Line 5. A theory fits a place if it expected what happened there. What did each theory expect in each place, and what happened?&rdquo;' }[bad]);
        return;
      }
      var cand = src.join('-') + '|' + air.join('-') + '|' + nums.expw.get() + '-' + nums.expb.get() + '|' + nums.recw.get() + '-' + nums.recb.get() + '|' + fit.join('-');
      var nxt = ER.exit([cand], { wait: true });
      if (!nxt) { msg('&ldquo;Something&rsquo;s not right. Tell your teacher.&rdquo;'); return; }
      lock = true; b.querySelector('#pb-go').disabled = true; PU.sfx.chalk();
      msg('&ldquo;So the streets fit both of them, and prove nothing. But the workhouse should have lost a hundred and seven, and lost five. The brewery should have lost fourteen, and lost none. Same foul air. Different water.&rdquo; She looks at the slate. &ldquo;That&rsquo;s the air done for, then.&rdquo;');
      setTimeout(function () { ER.closeAll(); finish(nxt); }, 4400);
    });
    b.first = function () { msg('&ldquo;Three places, all in Mr Stannard&rsquo;s foul air, or so he says. Put down what each one drinks, what the air&rsquo;s like, what should have happened and what did. Then see which theory each one fits.&rdquo;'); };
    return b;
  }
  function openLock() { var f = !box; if (!box) box = build(); inLock = true; ER.open('ov-lock', box, function () { inLock = false; }); if (f) box.first(); }

  function finish(nxt) {
    busy = true; inLock = false;
    ER.narrate([
      'Mr Stannard has come to read the slate over your shoulder. He reads it twice.',
      '&ldquo;Then what&rsquo;s the workhouse&rsquo;s malt, Mr Stannard?&rdquo; says Florrie, politely.',
      'Mr Stannard looks at his own map for some time. &ldquo;The walls,&rdquo; he says at last, &ldquo;are very high.&rdquo; But he says it more quietly than before, and he folds the map away.',
      'At twelve the carter whistles at the gate. Florrie jumps down from her barrel. &ldquo;West End,&rdquo; she says. &ldquo;And then we&rsquo;ll see what Mr Stannard&rsquo;s fresh air has to say for itself.&rdquo;'
    ], function () {
      PU.mine('escaped', 'Where the air and the water disagree', '<p>The streets: Broad Street water, foul air, very many deaths. Fits both theories, so it proves nothing.</p><p>The workhouse: its own well, foul air. Expected <b>107</b> (535 ÷ 5), recorded <b>5</b>.</p><p>The brewery: beer and its own deep well, foul air. Expected <b>14</b> (70 ÷ 5), recorded <b>0</b>.</p><p>Same foul air, different water: bad air does not fit, water does.</p>');
      PU.door($('#go'), nxt, 'b-file'); busy = false; paint();
    });
  }
})();
</script>
</body>
</html>
