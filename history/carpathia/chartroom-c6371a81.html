<style>
  body{--bg:#070c10;--accent:#9fd6b0;--font-display:'Libre Caslon Text',serif;--font-ui:'Oswald',sans-serif;--font-body:'Libre Caslon Text',serif;
    --tc-bg:rgba(6,10,13,.96);--tc-ink:#e6eee9;--cap-bg:rgba(7,12,15,.94);--panel:#101a1c;--face-bg:#111a24;--q-ink:#a9d9b8;--fade:#030607;--hud-bg:rgba(7,12,15,.8)}

  .tw{animation:tw 3.4s steps(1,end) infinite}
  .tw.t2{animation-duration:4.7s;animation-delay:-1.3s}
  .tw.t3{animation-duration:2.6s;animation-delay:-.8s}
  @keyframes tw{50%{opacity:.35}}
  #stars{animation:drift 90s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
  body.turn #stars{animation:swing 7s ease-out 1}
  @keyframes swing{from{transform:translateX(620px)}to{transform:translateX(0)}}
  #cone2{animation:lamp 8s steps(1,end) infinite}
  @keyframes lamp{0%{opacity:1}70%{opacity:.88}72%{opacity:1}}
  #chart.ready #sheet{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-6px)}}
  #chalked{display:none}
  body.done #chalked{display:block}

  /* the chart, and the slate beside it */
  .ch{display:grid;grid-template-columns:minmax(0,700px) 292px;gap:18px;width:min(1010px,97vw);align-items:start}
  .ch-svg{display:block;width:100%;height:auto;background:#efe7cf;box-shadow:0 18px 44px rgba(0,0,0,.6);touch-action:none;-webkit-user-select:none;user-select:none}
  .ch-svg text{font-family:'Libre Caslon Text',serif;fill:#3b3324}
  .ch-svg .sc{font-size:10.5px}
  .ch-svg .snd{font-size:9.5px;font-style:italic;fill:#8a7f66}
  .ch-svg .ttl{font-size:15px;font-style:italic;letter-spacing:.2em;fill:#6b5f48}
  .ch-svg .rn{font-size:8.5px;text-anchor:middle;fill:#5a4b33}
  .ch-svg .rl{font-size:14px;font-weight:700;text-anchor:middle;fill:#5a4b33}
  .ch-svg .tag{font-family:'Architects Daughter',cursive;font-size:13px;fill:#1d2a4a}
  .ch-pin{cursor:grab}
  .ch-pin.on{cursor:grabbing}
  .ch-pin.fix{cursor:default}
  #ch-rule,#ch-div{cursor:grab}
  #ch-rule.on,#ch-div.on{cursor:grabbing}
  #ch-ring{cursor:crosshair}
  .ch-slate{padding:13px 16px 12px;background:#22282b linear-gradient(140deg,rgba(255,255,255,.07),rgba(0,0,0,.2));color:#e9e6dc;font-family:'Caveat',cursive;font-size:24px;line-height:1.16;border:10px solid #6b4a2a;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.55)}
  .ch-slate p{margin:0 0 5px}
  .ch-slate b{font-weight:700;color:#ffd97a}
  .ch-slate .s1{font-size:20px;color:#b9b6ac}
  .ch-slate .row{display:none;align-items:center;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.3)}
  .ch-slate .row.on{display:flex}
  .ch-slate .row .lbl{flex:0 0 100%;font-size:21px;color:#b9b6ac}
  .ch-slate button{min-width:30px;height:30px;padding:0 6px;border:1px solid rgba(255,255,255,.45);border-radius:3px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.04em;color:#e9e6dc}
  .ch-slate button:hover{border-color:#ffd97a;color:#ffd97a}
  .ch-slate button.big{min-width:38px;font-family:'Caveat',cursive;font-weight:700;font-size:26px;line-height:1;color:#ffd97a}
  .ch-slate .v{display:inline-block;min-width:38px;text-align:center;font-weight:700;font-size:30px;line-height:1;color:#ffd97a}
  .ch-slate .dg{margin-left:-7px;font-weight:700;font-size:26px;line-height:1;color:#ffd97a}
  .ch-slate .row.ok button{display:none}
  .ch-slate .row.ok .v{min-width:0}
  .ch-slate .row.ok .dg{margin-left:-4px;margin-right:4px}
  .ch-slate .row.ok .v,.ch-slate .row.ok .lt,.ch-slate .row.ok .dg{color:#bfe8b4}
  .ch-slate .lt{font-weight:700;font-size:28px;color:#ffd97a;display:none}
  .ch-slate .row.ok .lt{display:inline}
  .ch-side .btn{display:block;width:100%;margin:12px 0 10px}
  .ch-side .pmsg{font-size:15.8px;line-height:1.38}
  @media (max-width:900px){.ch{grid-template-columns:1fr}}
</style>

    });

    /* ----- the brass rule ----- */
    function geom() {
      var dx, dy, len;
      A = [pins.a.x, pins.a.y]; B = [pins.b.x, pins.b.y]; dx = B[0] - A[0]; dy = B[1] - A[1]; len = Math.sqrt(dx * dx + dy * dy) || 1;
      U = [dx / len, dy / len]; N = [-U[1], U[0]];
      if ((RC[0] - A[0]) * N[0] + (RC[1] - A[1]) * N[1] < 0) N = [-N[0], -N[1]];           /* N points from the pencil line towards the rose */
      return len;
    }
    function pt(m, along, off) { return (m[0] + U[0] * along + N[0] * off).toFixed(1) + ' ' + (m[1] + U[1] * along + N[1] * off).toFixed(1); }
    function drawRule() {
      var m = [(A[0] + B[0]) / 2 + ruleOff[0], (A[1] + B[1]) / 2 + ruleOff[1]], L = 250, g = q('#ch-rule'), s, t, c1, c2;
      s = '<path d="M' + pt(m, -L, 0) + 'L' + pt(m, L, 0) + 'L' + pt(m, L, -13) + 'L' + pt(m, -L, -13) + 'z" fill="#d9b860" fill-opacity=".9" stroke="#6f531a" stroke-width="1.2"/>' +
        '<path d="M' + pt(m, -L, -27) + 'L' + pt(m, L, -27) + 'L' + pt(m, L, -40) + 'L' + pt(m, -L, -40) + 'z" fill="#d9b860" fill-opacity=".9" stroke="#6f531a" stroke-width="1.2"/>' +
        '<path d="M' + pt(m, -150, -8) + 'L' + pt(m, -110, -32) + 'M' + pt(m, 110, -8) + 'L' + pt(m, 150, -32) + '" stroke="#8a6a26" stroke-width="6" stroke-linecap="round"/>' +
        '<path d="M' + pt(m, -L - 20, -60) + 'L' + pt(m, L + 20, -60) + 'L' + pt(m, L + 20, 14) + 'L' + pt(m, -L - 20, 14) + 'z" fill="transparent"/>';
      g.innerHTML = s; g.style.display = '';
      t = q('#ch-cut');
      if (ruleOn) {
        c1 = [RC[0] + U[0] * RR, RC[1] + U[1] * RR]; c2 = [RC[0] - U[0] * RR, RC[1] - U[1] * RR];
        t.innerHTML = '<circle cx="' + c1[0].toFixed(1) + '" cy="' + c1[1].toFixed(1) + '" r="7" fill="none" stroke="#b3261c" stroke-width="2"/><circle cx="' + c2[0].toFixed(1) + '" cy="' + c2[1].toFixed(1) + '" r="7" fill="none" stroke="#b3261c" stroke-width="2"/>';
      } else t.innerHTML = '';
      q('#ch-ring').style.display = ruleOn ? '' : 'none';
      box.setAttribute('data-rule', ruleOn ? '1' : '0');
    }
    (function () {
      var g = q('#ch-rule'), from, base;
      ER.drag(g, {
        start: function (e) { if (lockStage !== 1) return false; from = ER.pt(svg, e); base = ruleOff.slice(); },
        move: function (e) {
          var p = ER.pt(svg, e), m, d;
          ruleOff = [base[0] + p.x - from.x, base[1] + p.y - from.y];
          m = [(A[0] + B[0]) / 2 + ruleOff[0], (A[1] + B[1]) / 2 + ruleOff[1]];
          d = (RC[0] - m[0]) * N[0] + (RC[1] - m[1]) * N[1];                 /* how far the lower edge still is from the middle of the rose */
          ruleOn = Math.abs(d) < 8;
          if (ruleOn) ruleOff = [ruleOff[0] + N[0] * d, ruleOff[1] + N[1] * d];
          drawRule();
        },
        end: function () { if (ruleOn) { CP.sfx.brass(); msg('The edge of the rule lies through the middle of the rose, and cuts the ring in two places. Click the ring where the edge crosses it, and then set the two letters.'); } else CP.sfx.rule(); }
      });
    })();
    q('#ch-ring').addEventListener('click', function (e) {
      var p = ER.pt(svg, e), th, n;
      if (lockStage !== 1 || !ruleOn) return;
      th = Math.atan2(p.x - RC[0], -(p.y - RC[1])) * 180 / Math.PI;         /* the bearing of the click: 0 is north, 90 east */
      n = Math.abs(th) <= 90 ? Math.abs(th) : 180 - Math.abs(th);
      crs.n = Math.round(n); CP.sfx.pencil(); drawCrs();
    });
    function drawCrs() {
      q('.b-ns').textContent = crs.ns || '?'; q('.b-ew').textContent = crs.ew || '?'; q('.v-n').textContent = crs.n == null ? '__' : crs.n;
      q('.l-ns').textContent = crs.ns; q('.l-ew').textContent = crs.ew;
      box.setAttribute('data-crs', (crs.ns + '-' + (crs.n == null ? '' : crs.n) + '-' + crs.ew).toLowerCase());
    }
    q('.b-ns').addEventListener('click', function () { crs.ns = crs.ns === 'N' ? 'S' : 'N'; CP.sfx.chalk(); drawCrs(); });
    q('.b-ew').addEventListener('click', function () { crs.ew = crs.ew === 'W' ? 'E' : 'W'; CP.sfx.chalk(); drawCrs(); });
    function bump(d) { if (!ruleOn) { msg('&ldquo;The rule first,&rdquo; says Sinclair. &ldquo;A course that is read anywhere but through the middle of the rose is a guess.&rdquo;'); return; } crs.n = Math.max(0, Math.min(90, (crs.n == null ? 0 : crs.n) + d)); drawCrs(); }
    q('.b-mi').addEventListener('click', function () { bump(-1); });
    q('.b-pl').addEventListener('click', function () { bump(1); });

    /* ----- the dividers ----- */
    function span() { return Math.sqrt((B[0] - A[0]) * (B[0] - A[0]) + (B[1] - A[1]) * (B[1] - A[1])); }
    function drawDiv() {
      var g = q('#ch-div'), sp = span(), p1, p2, h, c = dv.c, y0;
      if (dv.mode === 'lat') { y0 = lat2y(2460); p1 = [dv.x, y0]; p2 = [dv.x, y0 - sp]; h = [dv.x + (dv.x > 300 ? -110 : 110), y0 - sp / 2]; }
      else if (dv.mode === 'lon') { p1 = [lon2x(2940), dv.y]; p2 = [p1[0] - sp, dv.y]; h = [p1[0] - sp / 2, dv.y + (dv.y > 300 ? -110 : 110)]; }
      else { p1 = [c[0] - U[0] * sp / 2, c[1] - U[1] * sp / 2]; p2 = [c[0] + U[0] * sp / 2, c[1] + U[1] * sp / 2]; h = [c[0] - N[0] * 110, c[1] - N[1] * 110]; }
      g.innerHTML = '<path d="M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'L' + h[0].toFixed(1) + ' ' + h[1].toFixed(1) + 'L' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + '" stroke="transparent" stroke-width="30" fill="none"/>' +
        '<path d="M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'L' + h[0].toFixed(1) + ' ' + h[1].toFixed(1) + 'L' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + '" stroke="#b08a35" stroke-width="5" fill="none" stroke-linejoin="round"/>' +
        '<path d="M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'L' + h[0].toFixed(1) + ' ' + h[1].toFixed(1) + 'L' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + '" stroke="#f3e2a4" stroke-width="1.2" fill="none"/>' +
        '<circle cx="' + h[0].toFixed(1) + '" cy="' + h[1].toFixed(1) + '" r="8" fill="#d9b860" stroke="#6f531a" stroke-width="2"/><circle cx="' + p1[0].toFixed(1) + '" cy="' + p1[1].toFixed(1) + '" r="2.6" fill="#22231e"/><circle cx="' + p2[0].toFixed(1) + '" cy="' + p2[1].toFixed(1) + '" r="2.6" fill="#22231e"/>';
      g.style.display = '';
      box.setAttribute('data-div', dv.mode);
    }
    (function () {
      var g = q('#ch-div');
      ER.drag(g, {
        start: function () { return lockStage === 2; },
        move: function (e) { var p = ER.pt(svg, e); dv.mode = 'free'; dv.c = [p.x, p.y]; drawDiv(); },
        end: function (e) {
          var p = ER.pt(svg, e);
          if (p.x > X1 - 80) { dv.mode = 'lat'; dv.x = X1; } else if (p.x < X0 + 80) { dv.mode = 'lat'; dv.x = X0; }
          else if (p.y > Y1 - 70) { dv.mode = 'lon'; dv.y = Y1; } else if (p.y < Y0 + 70) { dv.mode = 'lon'; dv.y = Y0; }
          else { dv.mode = 'free'; dv.c = [p.x, p.y]; }
          drawDiv(); if (dv.mode !== 'free') CP.sfx.pin();
        }
      });
    })();
    function drawDist() { q('.v-d').textContent = dist || '__'; box.setAttribute('data-dist', dist); }
    [['.b-m10', -10], ['.b-m1', -1], ['.b-p1', 1], ['.b-p10', 10]].forEach(function (b) { q(b[0]).addEventListener('click', function () { dist = Math.max(0, Math.min(150, dist + b[1])); CP.sfx.chalk(); drawDist(); }); });

    /* ----- what Sinclair says ----- */
    function near(n) { return ['n', 's'].some(function (a) { return ['e', 'w'].some(function (b) { return ER.check('crs', a + '-' + n + '-' + b); }); }); }
    function crsWords() { return (crs.ns === 'S' ? 'South ' : 'North ') + CP.num(crs.n) + (crs.ew === 'E' ? ' east' : ' west'); }
    function trapLat(g) { return [Math.floor(+g) * 60 + Math.floor((+g % 1) * 60), Math.floor(+g) * 60 + Math.ceil((+g % 1) * 60)]; }
    function judgePins() {
      var v = { a: [dm(latOf(pins.a)), dm(lonOf(pins.a))], b: [dm(latOf(pins.b)), dm(lonOf(pins.b))] }, ok = {}, t = '';
      ['a', 'b'].forEach(function (k) { ok[k] = [ER.check(k + '-lat', v[k][0]), ER.check(k + '-lon', v[k][1])]; });
      if (ok.a[0] && ok.a[1] && ok.b[0] && ok.b[1]) return true;
      CP.slip(); ER.sfx.no();
      if (ER.check('b-lat', v.a[0]) && ER.check('b-lon', v.a[1])) t = 'You have us where she is. The brass pin is this ship, and the red one is the Titanic.';
      else ['a', 'b'].some(function (k) {
        var who = k === 'a' ? 'our own' : 'her', p = pins[k], g = GIVEN[k], la = latOf(p), lo = lonOf(p), deg = Math.floor(+g[1]) * 60, mn = Math.round((+g[1] % 1) * 100);
        if (ok[k][0] && ok[k][1]) return false;
        if (!ok[k][0] && trapLat(g[0]).indexOf(la) >= 0) t = 'You have put ' + who + ' latitude at ' + g[0].replace('.', ' and ') + ' hundredths. There are sixty minutes in a degree, not a hundred. That dot is no decimal point: read my first card again.';
        else if (!ok[k][1] && trapLat(g[1]).indexOf(lo) >= 0) t = 'You have read ' + who + ' longitude as a decimal. ' + g[1] + ' W is ' + Math.floor(+g[1]) + ' degrees and ' + mn + ' minutes, and there are sixty minutes in a degree.';
        else if (!ok[k][1] && lo === deg - mn) t = 'West is to the left on this chart, and the numbers grow as you go left. You have counted ' + who + ' ' + mn + ' minutes to the right of the ' + Math.floor(+g[1]) + ' line.';
        else if (ok[k][0]) t = (k === 'a' ? 'Our' : 'Her') + ' latitude I believe. ' + (k === 'a' ? 'Our' : 'Her') + ' longitude I do not. Count the small marks along the bottom of the chart: each one is a minute, and every tenth one is long.';
        else if (ok[k][1]) t = (k === 'a' ? 'Our' : 'Her') + ' longitude I believe. ' + (k === 'a' ? 'Our' : 'Her') + ' latitude I do not. Count the small marks up the side of the chart: each one is a minute.';
        else t = 'Neither number is right for ' + (k === 'a' ? 'this ship' : 'the Titanic') + '. One at a time: first up the side for the latitude, and then along the bottom for the longitude.';
        return true;
      });
      msg('Sinclair bends over the chart, and then straightens up. &ldquo;' + t + '&rdquo;');
      return false;
    }
    function toStage(n, quiet) {
      lockStage = n; ER.flag('c-st', n); geom();
      ['a', 'b'].forEach(function (k) { pinEl(k).classList.toggle('fix', n > 0); });
      q('#ch-line').setAttribute('d', n > 0 ? 'M' + A[0] + ' ' + A[1] + 'L' + B[0] + ' ' + B[1] : '');
      q('.r-crs').classList.toggle('on', n >= 1); q('.r-crs').classList.toggle('ok', n >= 2);
      q('.r-dst').classList.toggle('on', n >= 2);
      q('#ch-rule').style.display = 'none'; q('#ch-div').style.display = 'none'; q('#ch-cut').innerHTML = ''; q('#ch-ring').style.display = 'none';
      if (n === 1) { ruleOff = [0, 0]; ruleOn = false; drawRule(); goB.textContent = 'That is the course'; }
      if (n === 2) { dv.mode = 'free'; dv.c = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2]; drawDiv(); goB.textContent = 'That is the distance'; }
      goB.disabled = false; drawCrs(); drawDist(); paint();
      if (quiet) return;
      if (n === 1) msg('&ldquo;That is where we are, and that is where she is. ' + CP.cap(CP.num(Math.abs(latOf(pins.b) - latOf(pins.a)))) + ' minutes of latitude between you, so ' + CP.num(Math.abs(latOf(pins.b) - latOf(pins.a))) + ' miles to the north of us, and a good many more to the west.&rdquo; He lays his brass rule along the two pins, and you draw the line. &ldquo;Now walk the rule to the rose. It will not turn.&rdquo;<br><br>Drag the rule.');
      if (n === 2) msg('&ldquo;' + crsWords() + '.&rdquo; Sinclair looks at you over his spectacles. &ldquo;True. So the captain made it. Now: how far?&rdquo; He opens the dividers from one pin to the other.<br><br>Drag the dividers to a scale. Then set the miles on the slate.');
    }
    goB.addEventListener('click', function () {
      var c, t, file, n;
      if (lockStage === 0) {
        if (!pins.a.on || !pins.b.on) return;
        if (judgePins()) { ER.sfx.ok(); ER.flag('c-pa', [pins.a.x, pins.a.y]); ER.flag('c-pb', [pins.b.x, pins.b.y]); toStage(1); }
        return;
      }
      if (lockStage === 1) {
        if (!ruleOn) { msg('&ldquo;The rule is not through the middle of the rose yet,&rdquo; says Sinclair. &ldquo;A course that is read anywhere else is a guess.&rdquo;'); return; }
        if (!crs.ns || !crs.ew || crs.n == null) { msg('&ldquo;A course is two letters and a number,&rdquo; says Sinclair. &ldquo;I have not got all three.&rdquo;'); return; }
        c = (crs.ns + '-' + crs.n + '-' + crs.ew).toLowerCase();
        if (ER.check('crs', c)) { ER.sfx.ok(); ER.flag('c-crs', c); toStage(2); return; }
        CP.slip(); ER.sfx.no(); n = crs.n;
        if (near(n) && crs.ns === 'S' && crs.ew === 'E') t = 'South ' + n + ' east is the way from her to us. Turn it round. We are going to her.';
        else if (near(n)) t = 'The number I believe. The letters I do not. Look at your two pins: is she north of us, or south? East of us, or west?';
        else if ([1, 2, 3, 4].some(function (d) { return near(n - d) || near(n + d); })) t = 'Near. But one degree wrong is a mile wrong in every sixty. Look again at where the edge cuts the ring: the small marks are two degrees apart.';
        else t = 'That is not where the edge of my rule cuts the ring. Click the ring at the crossing, and read the number that is printed nearest to it.';
        msg('Sinclair shakes his head. &ldquo;' + t + '&rdquo;'); return;
      }
      if (dv.mode === 'free') { msg('&ldquo;Dividers in the middle of the sea measure nothing,&rdquo; says Sinclair. &ldquo;Carry them to a scale.&rdquo;'); return; }
      if (!dist) { msg('&ldquo;How many miles? Set it on the slate.&rdquo;'); return; }
      if (dv.mode === 'lon') { CP.slip(); ER.sfx.no(); msg('&ldquo;' + dist + '? Then you have measured along the ' + (dv.y > 300 ? 'bottom' : 'top') + ' of the chart. Up here a minute of longitude is only three quarters of a mile. My second card says which scale to use.&rdquo;'); return; }
      if (!ER.check('dist', String(dist))) { CP.slip(); ER.sfx.no(); msg('&ldquo;' + dist + '? Count again. The lower point is on 41 degrees. Each small mark is one minute, and every tenth mark is long.&rdquo;'); return; }
      c = [dm(latOf(pins.a)) + '-' + dm(lonOf(pins.a)), dm(latOf(pins.b)) + '-' + dm(lonOf(pins.b)), ER.flag('c-crs'), dist].join('|');
      file = ER.exitOk([c]);
      if (!file) { msg('Sinclair looks at the chart, and nothing happens. Something is wrong: tell your teacher.'); return; }
      nextFile = file; ER.flag('c-file', file); ER.flag('c-dist', dist); lockStage = 3; ER.flag('c-st', 3);
      var st = ER.state(); st.done = st.done || {}; st.done.chartroom = 1; ER.persist(true);
      ER.sfx.ok(); goB.disabled = true; q('.r-dst').classList.add('ok'); CP.sfx.chalk();
      msg('&ldquo;' + CP.cap(CP.num(dist)) + ' miles.&rdquo; Sinclair chalks it on the slate under the course, in figures as tall as your hand. &ldquo;The captain&rsquo;s own figures. He had them before he had finished dressing. You took rather longer, and you had me to lean on.&rdquo;');
      setTimeout(function () { ER.closeAll(); after(); }, 3000);
    });

    /* a page that was reloaded half way goes on from where it was */
    (function () {
      var pa = ER.flag('c-pa'), pb = ER.flag('c-pb'), c = (ER.flag('c-crs') || '').split('-');
      if (lockStage >= 1 && pa && pb) { pins.a = { x: pa[0], y: pa[1], on: true }; pins.b = { x: pb[0], y: pb[1], on: true }; } else lockStage = 0;
      if (lockStage >= 2 && c.length === 3) { crs = { ns: c[0].toUpperCase(), n: +c[1], ew: c[2].toUpperCase() }; } else if (lockStage >= 2) lockStage = 1;
      drawPins();
      if (lockStage >= 1) toStage(Math.min(lockStage, 2), true);
    })();
    box.first = function () {
      if (lockStage === 0) msg('Sinclair&rsquo;s old chart. &ldquo;Two pins, in the dish. The brass one is us. The red one is her. Put each of them where it belongs, and then call me.&rdquo;<br><br>Drag a pin on to the chart. While you hold it, two red lines run from it to the scales. (The arrow keys move the last pin by one minute.)');
      else if (lockStage === 1) msg('&ldquo;Walk the rule to the rose,&rdquo; says Sinclair. &ldquo;It will not turn.&rdquo; Drag the rule.');
      else msg('&ldquo;Now: how far?&rdquo; Drag the dividers to a scale. Then set the miles on the slate.');
    };
    return box;
  }
  function openChart() {
    if (!chBox) chBox = buildChart();
    chBox.first(); inLock = true;
    ER.open('ov-lock', chBox, function () { inLock = false; });
  }

  function after() {
    var d = ER.flag('c-dist') || 0;
    busy = true; inLock = false; paint();
    CP.mine('plot', 'On Sinclair’s chart', '<p>Us: <b>' + GIVEN.a[0] + ' N, ' + GIVEN.a[1] + ' W</b>.</p><p>Her: <b>' + GIVEN.b[0] + ' N, ' + GIVEN.b[1] + ' W</b>. (No decimal points: degrees and minutes.)</p><p>Course: <b>' + crsText() + '</b>, true. The other end of the rule was only the way back.</p><p>Distance: <b>' + d + ' miles</b>, read at the SIDE of the chart, where a minute is a mile.</p>', true);
    ER.narrate([
      'Sinclair blows the chalk off his fingers. &ldquo;' + CP.cap(CP.num(d)) + ' miles. On my chart it is the length of my hand. For this ship it is four hours.&rdquo;',
      'The chief engineer has been up to the bridge already, and gone down again at a run. The captain has told him to call out another watch of stokers, and to make all possible speed.',
      'Now the captain is in his cabin, next door, with the purser, the chief steward and the English doctor, and the orders are coming out of that door faster than Sinclair can write.',
      'He writes them down all the same, on a page of the night order book. Then he tears the page out and gives it to you. &ldquo;Read that as you go. You are going to be asked about it all night.&rdquo;'
    ], function () {
      ER.read({ html: CP.ORDERS, cls: 'orders', clue: { id: 'orders', title: 'The captain’s orders', kind: 'Page from the night order book' }, done: function () {
        ER.narrate([
          '&ldquo;The bridge has told the Titanic: four hours,&rdquo; says Sinclair. &ldquo;Go below to the engine room and find Mr Rudd. Ask him what the engines say to that.&rdquo;',
          '&ldquo;And bring me the answer in hours and minutes, Buzzer. Not in engineer.&rdquo;'
        ], function () { busy = false; paint(); });
      } });
    });
  }
})();
</script>
</body>
</html>
