<head>

<title>The Wireless Shack · Come at Once</title>

<link rel="stylesheet" href="../../assets/fonts-history.css">

<style>
  body{--bg:#140d08;--accent:#e9b54a;--font-display:'Abril Fatface',serif;--font-ui:'Oswald',sans-serif;--font-body:'Libre Caslon Text',serif;
    --tc-bg:rgba(14,9,6,.96);--tc-ink:#f1e7d2;--cap-bg:rgba(16,10,6,.94);--panel:#21160e;--face-bg:#111a24;--q-ink:#e9c477;--fade:#070403;--hud-bg:rgba(16,10,6,.8)}
  .lb{font-family:'Oswald',sans-serif;font-weight:500;text-anchor:middle;letter-spacing:.14em}
  .tw{animation:tw 3.4s steps(1,end) infinite}
  .tw.t2{animation-duration:4.7s;animation-delay:-1.3s}
  .tw.t3{animation-duration:2.6s;animation-delay:-.8s}
  @keyframes tw{50%{opacity:.35}}
  #cone{animation:lamp 7s steps(1,end) infinite}
  @keyframes lamp{0%{opacity:1}61%{opacity:.86}63%{opacity:1}88%{opacity:.92}90%{opacity:1}}
  #spark,#flash{display:none}
  body.tx #spark{display:block;animation:spk .11s steps(1,end) infinite}
  body.tx #flash{display:block;animation:spk .11s steps(1,end) infinite}
  @keyframes spk{50%{opacity:.2}}
  #sinclair{display:none}
  body.sin #sinclair{display:block}
  #phones{display:none}
  body.gone #cottam{display:none}
  body.gone #phones{display:block}
  body.gone.call #phones{animation:nudge 1.5s ease-in-out infinite}
  body.back #cottam{display:block}
  body.back #phones{display:none}
  #buzz.ready #bboard{animation:nudge 1.5s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-6px)}}

  /* the buzzer test: the key, and Sinclair in the doorway */
  .tx{display:grid;grid-template-columns:minmax(0,540px) 300px;gap:24px;width:min(880px,96vw);align-items:start}
  .tx-face{width:150px;border:1px solid rgba(255,255,255,.2);margin-bottom:10px}
  .tx-face svg{display:block;width:100%;height:auto}
  .tx .pmsg{font-size:16.5px}
  /* reading: your pad of marks, the card to read them by, and what you can tell the bridge */
  .rd{display:grid;grid-template-columns:minmax(0,610px) 322px;gap:20px;width:min(960px,97vw);align-items:start}
  .rd-pad{position:relative;padding:12px 16px 10px 44px;background:#f4f0df linear-gradient(177deg,rgba(255,255,255,.5),rgba(120,100,60,.12));color:#2f3a55;box-shadow:0 18px 40px rgba(0,0,0,.55);border-left:10px solid #3a2a1c}
  .rd-pad h6{margin:0 0 4px;font-family:'Caveat',cursive;font-weight:700;font-size:23px;line-height:1;color:#2f3a55}
  .rd-line{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:9px 13px;padding:7px 0 8px;border-top:1px solid rgba(90,120,170,.3);min-height:50px}
  .rd-line:before{content:attr(data-n);position:absolute;left:-30px;top:5px;font-family:'Caveat',cursive;font-weight:700;font-size:24px;color:#8c2f24}
  .rd-line .mk{height:16px}
  .rd-line .mk.long{padding:3px 6px;margin:-3px -6px;border-radius:8px;background:rgba(140,47,36,.09)}
  .rd-line .wd{display:inline-flex;align-items:center;gap:13px;flex:0 0 auto;margin-right:27px}
  .rd-line .fast{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;margin-right:27px}
  .rd-line .fast svg{width:104px;height:20px;display:block}
  .rd-line .fast em{font-family:'Caveat',cursive;font-size:19px;font-style:normal;color:#6b7491;white-space:nowrap}
  .rd-pad.live .mk i,.rd-pad.live .fast{opacity:0;animation:ink 70ms linear forwards}
  @keyframes ink{to{opacity:1}}
  .rd-again{position:absolute;right:10px;top:8px;font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#6b6552;border-bottom:1px solid #6b6552}
  .rd-again:hover{color:#8c2f24;border-color:#8c2f24}
  .rd-form{margin-top:12px;padding:11px 16px 12px;background:#fbf6d9;color:#22231e;border-top:8px solid #b3261c;box-shadow:0 14px 30px rgba(0,0,0,.5)}
  .rd-form h6{margin:0 0 6px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#6b6552}
  .rd-row{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-family:'Courier Prime',monospace;font-weight:700;font-size:14.5px;letter-spacing:.03em}
  .rd-row>span:first-child{flex:0 0 226px}
  .rd-row em{font-family:'Courier Prime',monospace;font-style:normal;font-weight:700;font-size:17px;padding:0 3px}
  .rd-f{display:inline-flex;gap:3px;padding:2px;border-radius:3px}
  .rd-f.ok{background:#cfe6c4}
  .rd-f.no{background:#f1c9c0}
  .rd-c{width:27px;height:34px;border-bottom:2px solid #22231e;background:rgba(255,255,255,.55);font-family:'Caveat',cursive;font-weight:700;font-size:29px;line-height:32px;text-align:center;color:#1d2a52;text-transform:uppercase}
  .rd-c.on{background:#ffe98a;outline:2px solid #b3261c}
  .rd-f.ok .rd-c{border-bottom-color:#3d6b34;cursor:default}
  .rd-form .btn{--accent:#22231e;margin-top:4px;font-size:13px;padding:8px 16px}
  .rd-form .btn:hover:not([disabled]){color:#fbf6d9}
  .rd-side .abc{background:#f8f3e2;border:1px solid #b9a877;box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 0 3px #f8f3e2,inset 0 0 0 4px #8c2f24;padding:9px 11px}
  .rd-side .abc-k{cursor:pointer;border-radius:3px;padding:0 3px;width:100%;gap:6px}
  .rd-side .abc-k .mk i.D{width:12px}
  .rd-side .abc-k .mk i.d{width:5px}
  .rd-side .abc-k:hover{background:#ffe98a}
  .rd-side .pmsg{margin-top:12px;font-size:15.5px;line-height:1.38}
  @media (max-width:900px){.tx,.rd{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {

    intro: [
      'The Archive keeps one box for each day that mattered. This one is small, and its corners are bound in brass. The label says: THE NORTH ATLANTIC. 15 APRIL 1912. You lift the lid. On top of the papers lies a piece of board with a small brass key screwed to it.',
      'Then it is twenty past midnight on Monday 15 April 1912, and you are fifteen years old. You are the bridge messenger of the Carpathia, a Cunard liner three days out of New York and bound for the Mediterranean, with seven hundred and forty passengers asleep below. When the officer of the watch wants something fetched, he wants you.',
      'Just now nobody wants anything. So you are where you always are when nobody wants anything: in the doorway of the wireless shack, right aft. It is one small room with one operator in it, Mr Cottam. He has taken his coat off to go to bed. He has not taken off the telephones.'
    ],
    exit: {"next":"chartroom","w":{"b642dfaf":"dcdb5168"}}, tags: {"tx1":["9fd19f81"],"tx2":["47f9e77d"],"who":["3f26680f"],"whom":["e94cb799"],"call":["096424cf"],"lat":["5f1724f1"],"lon":["37ef87c5"]},

  function hints() {

      'You do not have to read every mark. Find the small word DE in each line: on the card, DE means &ldquo;from&rdquo;. Then you know which three letters are the ship that is sending, and which are the ship that she wants.',
      'A figure is always five marks. If the crackle has taken one of them, look at the same figure in the other line: she sent her position twice.',

    ]];

      'Find your own ship in the book of stations, on the wall to the right of the clock: three letters. Then find each of the three on the card.',
      'A short touch of the key is a dot. For a dash, hold the key down until the first glass tube has filled past its white mark. Then let go, and wait until the second tube is full: that finishes the letter.',
      'Your ship is the last one in the book. Her first letter is two dashes and nothing else. Wait after it before you begin the next letter.'
    ]];

      'The code card has a line of short signs that operators use to save time. One of them says that a message has come in safely.',

      'Two papers are pinned to the wall, one on each side of the lamp. The larger one, on the left, is the Morse code. Read it: Sinclair will know if you guess.',

    ]];

  function begin() {

    if (ER.flag('s-in')) { busy = false; ER.say(nextFile ? 'The wireless shack. Mr Cottam is at his key again.' : stage >= 2 ? 'The wireless shack. Mr Cottam&rsquo;s chair is empty.' : 'The wireless shack. Sinclair is still in the doorway.'); return; }
    CP.learn('wireless', 'operator');
    ER.narrate([
      'A wooden room, warm, and not much bigger than a cupboard. On the bench there are brass and wire, and two small wheels that never stop turning. Everything that this ship hears from the rest of the world comes in through those wheels, as clicks in a pair of telephones.',
      'Mr Cottam is twenty-one. He is the only wireless operator on board, so when he sleeps, the ship is deaf. He goes to his bunk at about midnight. But this afternoon he asked another ship a question, and he is giving her two more minutes to answer it.',
      'Feet on the deck outside, and a lantern. Quartermaster Sinclair is on his way forward from the stern. He has been at sea for forty years, and for most of them there was no such thing as wireless.',
      '&ldquo;Still here, Buzzer?&rdquo; He calls you that because of the thing on the locker: a key, a buzzer and a dry battery, screwed to a piece of board. It cost you two months&rsquo; pay in Liverpool. It sends nothing to anybody. It only buzzes.',
      '&ldquo;I learnt that code with a lamp, before you were born,&rdquo; he says. &ldquo;Dots and dashes are dots and dashes. Read the man&rsquo;s card, there on the wall. Then send me the name of your own ship, and I shall tell you whether you are a messenger or a Marconi man.&rdquo;'
    ], function () { busy = false; ER.flag('s-in', 1); setStage(1); });
  }

  /* ---------- things in the room ---------- */
  $('#card').addEventListener('click', function () {

  });

  });
  CP.thing('#det', 'magnetic detector', 'The receiver. A band of iron wire runs round two wheels for ever, driven by clockwork, and Mr Cottam winds it like a clock. When a signal comes in, the telephones click.', isBusy);
  CP.thing('#tuner', null, 'A box with two black dials. Mr Cottam turns them a hair at a time, to pick one station out of the others.', isBusy);
  CP.thing('#keyM', null, 'The sending key. When Mr Cottam presses it, a blue spark jumps in the box at the end of the bench, and every ship with a wireless for two hundred miles round can hear it. You have never touched that key. You are not going to.', isBusy);
  CP.thing('#coil', null, 'The spark lives in here. Through the little round window it is blue-white, and it cracks like a whip.', isBusy);
  CP.thing('#pad', null, function () { return nextFile ? 'Mr Cottam&rsquo;s pad. He is writing on it again, without looking down.' : stage >= 2 ? 'Mr Cottam&rsquo;s pad. The top sheet is gone: he wrote it very fast.' : 'Mr Cottam&rsquo;s pad and his pencil. He has been taking down messages that are meant for another ship. He will pass them on to her in the morning.'; }, isBusy);

  CP.thing('#clock', null, function () { return nextFile ? 'Eight minutes to one, by the shack clock.' : stage >= 2 ? 'Twenty-four minutes to one, by the shack clock.' : 'Twenty past twelve, by the shack clock. That is ship&rsquo;s time. The clocks in New York are nearly two hours behind it.'; }, isBusy);
  CP.thing('#coat', null, 'His coat, on its hook. That is as far as he has got with going to bed.', isBusy);
  CP.thing('#bunk', null, 'His bunk is in the same room as his instruments. The blanket is turned back. It has been turned back for half an hour.', isBusy);
  CP.thing('#port', 'porthole', 'A round window, and stars. It is the clearest night that you have ever seen, and it is cold enough to hurt your teeth.', isBusy);
  CP.thing('#door', null, 'The deck outside, the rail, and a black, flat sea. There is no moon.', isBusy);

  /* ---------- the buzzer test ---------- */
  function spell(t) { return t.toUpperCase().split('').join(', '); }
  function buildTx() {

        }

        if (t.indexOf('?') >= 0) msg(said + ' One of those signs is on no card. Count the dots and the dashes again, and do not stop in the middle of a letter.&rdquo;');
        else if (t.length < 3) msg(said + ' Three letters, I said. If two of them ran together, you did not wait long enough between them.&rdquo;');
        else if (t.length > 3) msg(said + ' Three letters, and no more. If one letter came out as two, you waited too long in the middle of it.&rdquo;');

      else if (t === 'om') msg(said + ' Old man. I am old, and I am a man, and that is no answer.&rdquo;');
      else if (t.indexOf('?') >= 0) msg(said + ' Half of that is no letter at all.&rdquo;');

      ], function () { CP.mood('tense'); busy = false; setStage(2); });
    }

    function val(id) { return cells.filter(function (c) { return c.getAttribute('data-f') === id; }).map(function (c) { return c.textContent || ' '; }).join('').toLowerCase(); }
    function full() { return cells.every(function (c) { return !!c.textContent; }); }
    function put(ch) {
      var c = cells[cur];
      if (!c || !open(c) || inRd !== true) return;
      if ((kind(c) === 'n') !== /[0-9]/.test(ch)) { ER.shake(c); msg(kind(c) === 'n' ? 'A position is made of figures. That box wants a figure.' : 'That box wants a letter.'); return; }
      c.textContent = ch.toUpperCase(); CP.sfx.pencil(); box.querySelectorAll('.rd-f.no').forEach(function (f) { f.classList.remove('no'); });
      goB.disabled = !full(); box.setAttribute('data-full', full() ? '1' : '0'); step(1);
    }
    function rub() { var c = cells[cur]; if (c && open(c) && c.textContent) { c.textContent = ''; } else { step(-1); c = cells[cur]; if (c && open(c)) c.textContent = ''; } goB.disabled = true; }
    cells.forEach(function (c, i) { c.addEventListener('click', function () { if (open(c)) focus(i); }); });
    ER.$$('.abc-k', box).forEach(function (b) { b.addEventListener('click', function () { put(b.getAttribute('data-k')); }); });
    document.addEventListener('keydown', function (e) {
      var k = '';
      if (!inRd || !document.body.contains(box) || ER.$('.ov-top.on') || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key && e.key.length === 1 && /[a-z0-9]/i.test(e.key)) k = e.key.toLowerCase();
      else if (/^Key[A-Z]$/.test(e.code || '')) k = e.code.charAt(3).toLowerCase();      /* Korean input is on: read the key itself */
      else if (/^(Digit|Numpad)[0-9]$/.test(e.code || '')) k = e.code.slice(-1);
      if (k) { e.preventDefault(); put(k); return; }
      if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); rub(); }
      else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'Enter' && !goB.disabled) judge();
    });
    function play() { if (stopHear) stopHear(); padEl.classList.remove('live'); void padEl.offsetWidth; padEl.classList.add('live'); stopHear = CP.hear(plan, 640); }
    box.querySelector('.rd-again').addEventListener('click', play);
    function mark(id, ok) {
      var f = box.querySelector('.rd-f[data-f="' + id + '"]');
      f.classList.toggle('ok', ok); f.classList.toggle('no', !ok);
      if (ok) done[id] = 1;
    }
    function judge() {
      var v = {}, bad = [], first = '', pre = '', call, cOk, U = function (x) { return x.toUpperCase(); };
      if (!full()) return;
      FIELDS.forEach(function (f) { v[f[0]] = val(f[0]); });
      if (!ER.flag('s-sin')) { ER.flag('s-sin', 1); paint(); pre = 'A lantern in the doorway: Sinclair, out of breath, which you have never seen before. &ldquo;The captain has turned her right round. All hands are called. What have you got there?&rdquo; He reads your paper by the lantern.<br><br>'; }
      if (ER.check('who', v.who)) mark('who', true);
      else { mark('who', false); bad.push('who'); first = ER.check('whom', v.who) ? '&ldquo;' + U(v.who) + ' is the ship that she is calling, not the ship that calls. Look at the card: DE means &lsquo;from&rsquo;. The one who is sending signs after it.&rdquo;' : '&ldquo;' + U(v.who) + '? That is in no book of stations. Read the three signs after DE again, one sign at a time.&rdquo;'; }
      if (ER.check('whom', v.whom)) mark('whom', true);
      else { mark('whom', false); bad.push('whom'); first = first || (ER.check('who', v.whom) ? '&ldquo;You have the same ship twice. She is not calling herself. Whom does she name before the DE, on the last line?&rdquo;' : '&ldquo;' + U(v.whom) + '? I know no such ship. The one that she wants comes first on the last line, and she names it twice over.&rdquo;'); }
      call = [v.c1, v.c2].sort().join('+'); cOk = ER.check('call', call);
      mark('c1', cOk); mark('c2', cOk);
      if (!cOk) { bad.push('call'); first = first || (v.c1 === v.c2 ? '&ldquo;The same call twice? She makes two different ones. The second is the long sign at the very end, with no gaps in it. The foot of the card says what that is.&rdquo;' : '&ldquo;She makes two calls. One is the three letters that begin your first line. The other is the long sign at the very end: it has no gaps, so it is not three letters at all. The foot of the card says what it is.&rdquo;'); }
      ['lat', 'lon'].forEach(function (id) {
        if (ER.check(id, v[id])) { mark(id, true); return; }
        mark(id, false); bad.push(id);
        first = first || '&ldquo;' + (id === 'lat' ? 'Latitude ' : 'Longitude ') + v[id].slice(0, 2) + '.' + v[id].slice(2) + '. That is not what Mr Cottam told the bridge. One of your figures is a guess. A figure is always five marks: where the crackle took a mark out of one line, the other line has it.&rdquo;';
      });
      box.setAttribute('data-bad', bad.join(' '));
      if (bad.length) {
        CP.slip(); ER.sfx.no(); goB.disabled = true;
        cells.forEach(function (c) { if (open(c)) c.textContent = ''; });
        msg(pre + first + (bad.length > 1 ? ' He hands the paper back. That is not the only thing wrong with it.' : ' He hands the paper back.') + ' What is right stays as it is.');
        focus(cells.findIndex ? cells.findIndex(open) : 0);
        return;
      }
      var file = ER.exitOk([(ER.flag('s-t1') || '') + '-' + (ER.flag('s-t2') || '') + '|' + [v.who, v.whom, call, v.lat, v.lon].join('-')]);
      if (!file) { msg('Sinclair reads it, and nothing happens. Something is wrong: tell your teacher.'); return; }
      nextFile = file; ER.flag('s-file', file); ER.flag('s-read', v);
      var st = ER.state(); st.done = st.done || {}; st.done.shack = 1; ER.persist(true);
      ER.sfx.ok(); goB.disabled = true; inRd = 'done';
      msg(pre + 'Sinclair reads it twice. &ldquo;' + U(v.who) + ',&rdquo; he says slowly. &ldquo;I heard the words on the bridge. I had not seen them in dots.&rdquo;');
      setTimeout(function () { ER.closeAll(); after(); }, 2600);
    }
    goB.addEventListener('click', judge);
    box.play = play;
    box.first = function () { msg('You hold one telephone to your ear and write down what you hear, as marks. It is one ship, calling again and again. Some of it is too fast for you, and the crackle has taken some marks away.<br><br>Read your marks with the code card. Then write down what the bridge will want to know: click a box, and type or click a letter on the card.'); focus(0); };
    return box;
  }
  function openRd() {
    var fresh = !rdBox;
    if (!rdBox) rdBox = buildRd();
    inRd = true;
    ER.open('ov-lock', rdBox, function () { if (inRd === true) inRd = false; if (stopHear) { stopHear(); stopHear = null; } });
    if (fresh) { rdBox.first(); rdBox.play(); }
  }
  function fmt(p) { return p ? p.slice(0, 2) + '.' + p.slice(2) : ''; }
  function after() {
    var v = ER.flag('s-read') || {}, U = function (x) { return (x || '').toUpperCase(); };
    busy = true; inRd = false; paint();
    CP.mine('heard', 'What she sent', '<p>Calling: <b>' + U(v.who) + '</b>, the Titanic.</p><p>She wants: <b>' + U(v.whom) + '</b>, the Olympic, her sister.</p><p>Her calls: <b>' + U(v.c1) + '</b> and <b>' + U(v.c2) + '</b>.</p><p>Her position: <b>' + fmt(v.lat) + ' N, ' + fmt(v.lon) + ' W</b>.</p><p>The one who signs after DE is the one who is sending.</p>', true);
    ER.narrate([
      '&ldquo;So it is the Titanic,&rdquo; says Sinclair. &ldquo;The biggest ship in the world, on her first voyage. And she is calling her own sister, with a call that I had never heard of until tonight.&rdquo; He gives you back your paper. &ldquo;The same position that Mr Cottam took to the bridge. Good. I like a thing to arrive by two roads.&rdquo;',
      '&ldquo;The captain was told at twenty-five minutes to one. He ordered the ship turned round before he asked one question. Then he asked Mr Cottam if he was absolutely sure that it was the Titanic. He asked him twice.&rdquo;',
      'Mr Cottam comes back along the deck at a run, with a small slip of paper in his hand: the captain has written this ship&rsquo;s own position on it. He drops into his chair and puts the telephones on.'
    ], function () {
      ER.flag('s-back', 1); paint(); spark(1300);
      ER.read({
        html: '<h4>The sheet that he tore off his pad</h4><p>' + CP.said('Come at once. We have struck a berg. It&rsquo;s a C.Q.D. O.M. Position ' + fmt(v.lat) + ' N. ' + fmt(v.lon) + ' W.') + '</p><p class="hw">The Titanic to the Carpathia. This is what Mr Cottam took to the bridge. (O.M. is &ldquo;old man&rdquo;.)</p>',
        cls: 'padp', clue: { id: 'come', title: 'The Titanic to the Carpathia', kind: 'Sheet off the pad' },
        done: function () {
          ER.narrate([
            'The blue spark cracks: this ship&rsquo;s position, going out. The answer to it is one word. ' + CP.said('Received.'),
            'Mr Cottam does not look round. He will not sleep tonight. Until this is over, that key is the only voice the Carpathia has.',
            '&ldquo;Bring your paper,&rdquo; says Sinclair. &ldquo;Chart room. If you are going to carry that position round my ship all night, you are going to know where it is.&rdquo;'
          ], function () { busy = false; paint(); });
        }
      });
    });
  }
})();
</script>
