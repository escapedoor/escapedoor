<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Below · Come at Once</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-history.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="carpathia.css">
<style>
  body{--bg:#0c0906;--accent:#ff9a4a;--font-display:'Stardos Stencil',serif;--font-ui:'Oswald',sans-serif;--font-body:'Libre Caslon Text',serif;
    --tc-bg:rgba(12,8,5,.96);--tc-ink:#f3e6d6;--cap-bg:rgba(14,9,6,.94);--panel:#1c1511;--face-bg:#1a1716;--q-ink:#ffb97a;--fade:#050302;--hud-bg:rgba(14,9,6,.82)}
  .tc-room{letter-spacing:.08em;text-transform:uppercase}
  .lb{font-family:'Stardos Stencil',serif;font-weight:700;text-anchor:middle;letter-spacing:.08em}
  .sm{font-family:'Oswald',sans-serif;font-weight:500;text-anchor:middle;letter-spacing:.1em}
  #fire{animation:fire 1.7s steps(1,end) infinite}
  @keyframes fire{0%{opacity:1}23%{opacity:.82}41%{opacity:.95}66%{opacity:.76}84%{opacity:.9}}
  #needle{transform-origin:1130px 420px;transition:transform 2.4s ease-out;transform:rotate(-18deg)}
  body.steam #needle{transform:rotate(26deg)}
  #valves.ready #vplate,#desk.ready #dslate{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-6px)}}

  /* the valve chest */
  .vv{display:grid;grid-template-columns:minmax(0,690px) 290px;gap:22px;width:min(1004px,97vw);align-items:start}
  .vv-chest{position:relative;padding:54px 14px 16px;background:#2a2622 linear-gradient(#3a3531,#1f1c19);border:1px solid #0d0b09;box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 0 0 4px #191613}
  .vv-chest:before{content:'';position:absolute;left:0;right:0;top:22px;height:22px;background:linear-gradient(#f1e6c8,#b9ab86 55%,#7d7258);box-shadow:0 3px 6px rgba(0,0,0,.6)}
  .vv-chest h6{position:absolute;left:50%;top:-1px;transform:translateX(-50%);margin:0;padding:3px 16px 2px;background:linear-gradient(135deg,#8a6a26,#e6c873 40%,#b08a35);color:#2a1c08;font-family:'Stardos Stencil',serif;font-weight:700;font-size:15px;letter-spacing:.18em;white-space:nowrap;z-index:1}
  .vv-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .vv-v{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 0 8px;color:#e9e2cf}
  .vv-v:before{content:'';position:absolute;left:50%;top:-10px;width:16px;height:44px;margin-left:-8px;background:linear-gradient(90deg,#7d7258,#f1e6c8 45%,#7d7258)}
  .vv-w{position:relative;width:86px;height:86px;margin-top:22px;transition:transform .6s}
  .vv-v.shut .vv-w{transform:rotate(200deg)}
  .vv-w svg{display:block;width:100%;height:100%}
  .vv-t{margin:8px 0 6px;padding:2px 8px 1px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;border-radius:2px;background:#d9b860;color:#2a1c08}
  .vv-v.shut .vv-t{background:#b3261c;color:#fff}
  .vv-n{min-height:54px;width:100%;padding:5px 3px 4px;background:linear-gradient(135deg,#8a6a26,#e6c873 40%,#b08a35);color:#2a1c08;font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;line-height:1.15;letter-spacing:.06em;text-align:center;text-transform:uppercase;border-radius:2px}
  .vv-n small{display:block;margin-top:3px;font-family:'Libre Caslon Text',serif;font-weight:400;font-size:11.5px;letter-spacing:0;text-transform:none;font-style:italic}
  .vv-side .tx-face{width:132px;border:1px solid rgba(255,255,255,.2);margin-bottom:10px}
  .vv-side .tx-face svg{display:block;width:100%;height:auto}
  .vv-side .btn{display:block;width:100%;margin:12px 0 0}
  /* the slate: fifty-eight miles of chalk, and an hour's run to lay along it */
  .rn{display:grid;grid-template-columns:minmax(0,740px) 250px;gap:20px;width:min(1014px,97vw);align-items:start}
  .rn-slate{padding:10px 12px 12px;background:#22282b linear-gradient(140deg,rgba(255,255,255,.07),rgba(0,0,0,.2));border:10px solid #6b4a2a;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.55);color:#e9e6dc}
  .rn-slate svg{display:block;width:100%;height:auto}
  .rn-slate text{font-family:'Caveat',cursive;fill:#e9e6dc}
  .rn-tally{margin:2px 4px 0;font-family:'Caveat',cursive;font-size:25px;line-height:1.1;color:#e9e6dc}
  .rn-tally b{color:#ffd97a}
  .rn-rack{margin-top:12px;padding:10px 12px 12px;background:#3a2a1c linear-gradient(#4a3524,#2c1f14);box-shadow:0 14px 30px rgba(0,0,0,.5)}
  .rn-rack h6{margin:0 0 7px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#d9c9a8}
  .rn-sp{display:flex;gap:8px;margin-bottom:10px}
  .rn-sp button{flex:1;padding:6px 4px 4px;background:linear-gradient(135deg,#8a6a26,#e6c873 40%,#b08a35);color:#2a1c08;font-family:'Stardos Stencil',serif;font-weight:700;font-size:20px;line-height:1;border-radius:2px;opacity:.55}
  .rn-sp button small{display:block;font-family:'Oswald',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:.2em}
  .rn-sp button.on{opacity:1;box-shadow:0 0 0 3px #ff9a4a}
  .rn-pc{display:flex;align-items:flex-end;gap:14px;min-height:56px}
  .rn-pc button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;color:#f1e6d2;font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
  .rn-pc button i{display:block;height:24px;border-radius:2px;background:linear-gradient(#e2bb80,#b98a4e);box-shadow:0 3px 5px rgba(0,0,0,.5),inset 0 0 0 1px #7b5a30}
  .rn-pc button:hover i{background:linear-gradient(#ffd9a0,#d9a45e)}
  .rn-pc .q i{background:linear-gradient(#e9d3a8,#c9a878)}
  .rn-pc .f i{background:linear-gradient(#f4ead0,#d9c9a0)}
  .rn-pc .sp{flex:1}
  .rn-pc .undo{align-self:center;padding:7px 10px;border:1px solid rgba(255,255,255,.35);border-radius:3px;font-size:11.5px}
  .rn-pc .undo:hover{border-color:#ff9a4a;color:#ff9a4a}
  .rn-qs{margin:0 0 10px;padding:10px 12px 8px;background:#22282b;border:6px solid #6b4a2a;border-radius:3px;font-family:'Caveat',cursive;font-size:21px;line-height:1.12;color:#9aa19a}
  .rn-qs p{margin:0 0 7px}
  .rn-qs p.now{color:#fff}
  .rn-qs p.ok{color:#bfe8b4}
  .rn-qs p b{color:#ffd97a;font-weight:700}
  .rn-clock{display:none;width:170px;margin:0 auto 6px;touch-action:none;cursor:grab}
  .rn.q3 .rn-clock{display:block}
  .rn-clock svg{display:block;width:100%;height:auto}
  .rn-side .btn{display:block;width:100%;margin:10px 0 10px}
  .rn-side .pmsg{font-size:15.6px;line-height:1.37}
  @media (max-width:900px){.vv,.rn{grid-template-columns:1fr}}
</style>
</head>
<body>

<defs>

</g>

<!-- the steam gauge, the clock -->

<!-- Mr Rudd's desk: his slate, his notice -->

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, vvBox = null, rnBox = null, inV = false, inR = false, qNo = 0;

      'A position that is sent by wireless has no decimal point in it: 41.46 N is 41 degrees and 46 minutes, and there are sixty minutes in a degree. Out here longitude grows to the left. So the Titanic went on Sinclair&rsquo;s chart up and to the left of you. The brass rule, walked to the compass rose, cut the ring in two places: the end that pointed to her read N 52&deg; W, and the other end was only the way back. And the dividers were read at the side of the chart, where a minute is a mile: 58 of them. Along the bottom they would have said 78.',

      'The engine room is four decks deep and as hot as a kitchen. The chief engineer has called out the watch that was asleep, and the men have come: some of them have not stopped to dress. As each one goes past you, he asks the same two things. How far? And then: how long?'
    ],
    exit: {"next":"saloon","w":{"9b49ddb4":"5a4b3858"}}, tags: {"v1":["d214239e"],"v2":["55fc468e"],"v3":["c6ff20c8"],"v4":["4c769710"],"v5":["d1e21e18"],"v6":["6ea87b6b"],"q1":["4dab8cfc"],"q2":["268c534d"],"eta":["82e3c713"]},
    sound: ['archive', { root: 45, bpm: 66, mood: 'tense', drop: ['mel', 'arp'], beds: [['hum', 1.1]] }],

  });
  nextFile = ER.flag('e-file') || null; qNo = ER.flag('e-q') || 0;

  var CARD = '<h4>Knots</h4>' +
    '<p>A <b>KNOT</b> is a speed: one nautical mile in one hour. (Never say &ldquo;knots an hour&rdquo;.) A ship that is doing 12 knots goes 12 sea miles every hour.</p>' +
    '<p class="f">distance = speed × time &nbsp;&nbsp;&nbsp; time = distance ÷ speed</p>' +
    '<p>Do not divide in your head down here. Lay it out. At 12 knots an hour&rsquo;s run is 12 miles. A quarter of an hour&rsquo;s run is 3 miles. Five minutes&rsquo; run is 1 mile.</p>' +
    '<svg viewBox="0 0 560 74"><path d="M20 52h480" stroke="#22231e" stroke-width="2"/><g stroke="#22231e" stroke-width="1.5"><path d="M20 46v12M140 46v12M260 46v12M380 46v12M500 46v12"/></g>' +
    '<g fill="#c79a5e" stroke="#7b5a30" stroke-width="1"><rect x="20" y="18" width="143" height="22"/><rect x="164" y="18" width="143" height="22"/><rect x="308" y="18" width="143" height="22"/></g><rect x="452" y="18" width="35" height="22" fill="#e2c898" stroke="#7b5a30"/><rect x="488" y="18" width="11.500" height="22" fill="#f4ead0" stroke="#7b5a30"/>' +
    '<g font-family="\'Courier Prime\',monospace" font-size="13" font-weight="700" fill="#22231e"><text x="91" y="34" text-anchor="middle">1 hour</text><text x="235" y="34" text-anchor="middle">1 hour</text><text x="379" y="34" text-anchor="middle">1 hour</text><text x="469" y="13" text-anchor="middle">&frac14;</text><text x="496" y="13" text-anchor="middle">5</text>' +

    '<p>So 40 miles at 12 knots is three hours (36 miles) and 4 miles more: a quarter of an hour, and five minutes. <b>3 hours 20 minutes.</b></p>' +
    '<p>And mind this: 3.33 hours is NOT 3 hours 33 minutes. A third of an hour is twenty minutes.</p><p class="by">For the next boy who asks. R.</p>';

  function hints() {

  function begin() {

      'Steel ladders, hot handrails, and a noise that you can feel in your teeth. Two engines as big as houses are turning the ship&rsquo;s two propellers, and tonight they are turning them faster than anybody down here has ever seen.',

      '&ldquo;The second half is no use to me,&rdquo; says Mr Rudd. &ldquo;An engine does not know where it is going. The first half I can use. But a steamship is only a kettle that goes somewhere, and before anything else this kettle wants more steam.&rdquo;',

    ], function () { busy = false; ER.flag('e-in', 1); paint(); });

  /* ---------- things in the room ---------- */

  $('#card3').addEventListener('click', function () {

        { note: 'He talks without looking at you. He is looking at four gauges and listening to two engines, and you come a long way after those.' },
        { q: 'How fast can she go?', a: '&ldquo;Fourteen knots is what the company paid for, and fourteen is what she gives, on a good day, with one watch in the stokehold. Tonight there are two watches in the stokehold, and every one of us down here means to have seventeen out of her. I have never seen fifteen.&rdquo;' },
        { q: 'What is a watch?', a: '&ldquo;Four hours on, eight hours off. The men who came off at midnight had been in their bunks for half an hour when the Chief sent for them. Go and count how many of them said no.&rdquo; He holds up a hand, with the fingers closed.' },
        { q: 'Why do they all ask how long?', a: '&ldquo;Because a man can do anything at all if he knows when it stops. What he cannot do is shovel until somebody remembers to tell him. So I want a time from you, messenger, and I want a true one.&rdquo;' },
        { q: 'Why is a ship a kettle?', a: '&ldquo;Coal makes fire. Fire makes steam in the boilers. Steam pushes the engines round, and warms the cabins, and boils the soup, and turns the dynamos for the electric light. It is all one kettle. What one thing takes, another cannot have.&rdquo;' }

  /* ---------- the valve chest ---------- */
  var VALVES = [['Cabin heating', 'radiators, all classes'], ['Hot water', 'baths and basins'], ['Dynamos', 'the electric light'], ['Steering engine', 'turns the rudder'], ['Galley', 'coppers and urns'], ['Forward winches', 'on deck, at the bow']];
  var WHEEL = '<svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="35" fill="none" stroke="#b3261c" stroke-width="10"/><g stroke="#b3261c" stroke-width="7"><path d="M43 8v70M8 43h70M18 18l50 50M68 18L18 68"/></g><circle cx="43" cy="43" r="11" fill="#d9b860"/><circle cx="43" cy="43" r="4" fill="#6f531a"/><circle cx="43" cy="13" r="4" fill="#f1e6c8"/></svg>';
  var WHY = [
    'Seven hundred passengers are asleep under their blankets. They can do without their radiators for one night. The engines cannot do without the steam.',
    'Nobody takes a bath at one o&rsquo;clock in the morning. Shut it.',

  function buildV() {
    var box = ER.el('div', 'vv'), s = '<div class="vv-chest"><h6>AUXILIARY STEAM</h6><div class="vv-row">', msgEl, goB, lock = false;

      setTimeout(function () { ER.closeAll(); busy = true; ER.narrate([

        '&ldquo;Now your fifty-eight miles,&rdquo; says Mr Rudd. &ldquo;There is a slate on my desk, and a notice over it for people who cannot do sums in knots. Read the notice first.&rdquo;'
      ], function () { busy = false; paint(); }); }, 3200);
    });

    return box;

  /* ---------- the slate: fifty-eight miles, and an hour's run to lay along them ---------- */
  var MILES = 58, PXM = 12, X0 = 20, SPEEDS = [14, 14.5, 16.5, 17, 17.5];

  function oclock(t) { var a = String(t || '12:00').split(':'), m = +a[1]; return m ? CP.num(+a[0]) + ' ' + (m < 10 ? 'oh ' : '') + CP.num(m) : CP.num(+a[0]) + ' o&rsquo;clock'; }
  function buildR() {

      '<div class="rn-side"><div class="rn-qs"><p data-q="0">1. Bridge has told her: <b>four hours</b>. What speed is that?</p><p data-q="1">2. We mean to have <b>17</b> out of her. How long then?</p><p data-q="2">3. She turned at <b>12.35</b>. So when is she there?</p></div>' +

      '<path id="rn-hh" d="M100 100V56" stroke="#22231e" stroke-width="8" stroke-linecap="round"/><path id="rn-mh" d="M100 100V30" stroke="#b3261c" stroke-width="5" stroke-linecap="round"/><circle id="rn-tip" cx="100" cy="30" r="9" fill="#b3261c"/><circle cx="100" cy="100" r="7" fill="#22231e"/></svg></div>' +
      '<button type="button" class="btn rn-go">Show Mr Rudd</button><p class="pmsg"></p></div>';
    box.innerHTML = s; msgEl = box.querySelector('.pmsg'); goB = box.querySelector('.rn-go');
    function q(x) { return box.querySelector(x); }
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    (function () {
      var t = '', n = '', i;
      for (i = 0; i <= MILES; i++) t += '<path d="M' + (X0 + i * PXM) + ' 84v' + (i % 10 === 0 || i === MILES ? 14 : i % 5 === 0 ? 10 : 6) + '"/>';
      for (i = 10; i <= 50; i += 10) n += '<text x="' + (X0 + i * PXM) + '" y="118" font-size="19" text-anchor="middle">' + i + '</text>';
      q('#rn-ticks').innerHTML = t; q('#rn-nums').innerHTML = n; t = '';
      for (i = 0; i < 60; i++) t += '<path d="M100 ' + (i % 5 ? 22 : 18) + 'V28" stroke-width="' + (i % 5 ? 1 : 2.5) + '" transform="rotate(' + i * 6 + ' 100 100)"/>';
      q('#rn-cm').innerHTML = t;
    })();
    function run() { return laid.reduce(function (a, m) { return a + speed * m / 60; }, 0); }
    function tmin() { return laid.reduce(function (a, m) { return a + m; }, 0); }
    function hm(m) { return Math.floor(m / 60) + ':' + ('0' + m % 60).slice(-2); }
    function words(m) { var h = Math.floor(m / 60), r = m % 60; return (h ? h + (h === 1 ? ' hour' : ' hours') : '') + (h && r ? ' ' : '') + (r ? r + ' minutes' : '') || 'nothing'; }
    function full() { return MILES - run() <= 0.35; }
    function draw() {
      var x = X0, g = '', w;
      laid.forEach(function (m) {
        w = speed * m / 60 * PXM;
        g += '<rect x="' + x.toFixed(1) + '" y="44" width="' + Math.max(1, w - 1.5).toFixed(1) + '" height="28" rx="2" fill="' + (m === 60 ? '#c79a5e' : m === 15 ? '#e2c898' : '#f4ead0') + '" stroke="#7b5a30" stroke-width="1"/>' +
          (m === 60 ? '<text x="' + (x + w / 2).toFixed(1) + '" y="65" font-size="21" text-anchor="middle" style="fill:#3a2412">1 hour</text>' : m === 15 ? '<text x="' + (x + w / 2).toFixed(1) + '" y="65" font-size="19" text-anchor="middle" style="fill:#3a2412">&frac14;</text>' : '');
        x += w;
      });
      g += '<path d="M' + x.toFixed(1) + ' 38l-9-22h18z" fill="#ffd97a"/><path d="M' + x.toFixed(1) + ' 38v46" stroke="#ffd97a" stroke-width="1.5" stroke-dasharray="3 3"/>';
      q('#rn-laid').innerHTML = g;
      q('.rn-tally').innerHTML = 'At <b>' + sp(speed) + ' knots</b>: laid along the line so far, <b>' + words(tmin()) + '</b>.' + (full() ? ' She is there.' : '');
      ER.$$('.rn-sp button', box).forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-v') === speed); });
      q('.rn-pc .h i').style.width = (speed * PXM) + 'px'; q('.rn-pc .q i').style.width = (speed * PXM / 4) + 'px'; q('.rn-pc .f i').style.width = (speed * PXM / 12) + 'px';
      box.setAttribute('data-run', speed + '|' + hm(tmin())); box.setAttribute('data-full', full() ? '1' : '0');
    }
    ER.$$('.rn-sp button', box).forEach(function (b) { b.addEventListener('click', function () { if (qNo > 1) return; speed = +b.getAttribute('data-v'); laid = []; CP.sfx.brass(); draw(); }); });
    ER.$$('.rn-pc button[data-p]', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var m = +b.getAttribute('data-p');
        if (qNo > 1) return;
        if (run() + speed * m / 60 > MILES + 0.35) { ER.sfx.no(); msg('It will not go. There is less than that left to run' + (m > 5 ? ': try a shorter piece.' : '.')); return; }
        laid.push(m); CP.sfx.wood(); draw();
        /* an answer to an earlier try must not go on saying "not there yet" over a full line */
        if (full() && /not there yet|will not go/.test(msgEl.textContent)) msg('The line is full. Show Mr Rudd.');
      });
    });
    ER.$$('.rn-pc .undo', box).forEach(function (b) { b.addEventListener('click', function () { if (qNo > 1) return; if (b.getAttribute('data-u') === 'all') laid = []; else laid.pop(); CP.sfx.chalk(); draw(); }); });
    /* the clock: drag the long hand; the short one follows */
    function clockT() { return (Math.floor(mins / 60) || 12) + ':' + ('0' + mins % 60).slice(-2); }
    function drawClock() {
      var a = (mins % 60) * 6, r = a * Math.PI / 180;
      q('#rn-mh').setAttribute('transform', 'rotate(' + a + ' 100 100)'); q('#rn-hh').setAttribute('transform', 'rotate(' + (mins / 2) + ' 100 100)');
      q('#rn-tip').setAttribute('cx', (100 + 70 * Math.sin(r)).toFixed(1)); q('#rn-tip').setAttribute('cy', (100 - 70 * Math.cos(r)).toFixed(1));
      box.setAttribute('data-clock', clockT());
    }
    (function () {
      var c = q('.rn-clock'), svg = c.querySelector('svg');
      function at(e) {
        var p = ER.pt(svg, e), deg = Math.atan2(p.x - 100, -(p.y - 100)) * 180 / Math.PI, m, d;
        m = (Math.round((deg + 360) % 360 / 30) * 5) % 60; d = m - mins % 60;
        if (d > 30) d -= 60; else if (d < -30) d += 60;
        if (d) { mins = (mins + d + 720) % 720; CP.sfx.key(); drawClock(); }
      }
      ER.drag(c, { start: function (e) { if (qNo !== 2) return false; at(e); }, move: at });
    })();
    function paintQ() {
      ER.$$('.rn-qs p', box).forEach(function (p, i) { p.classList.toggle('ok', i < qNo); p.classList.toggle('now', i === qNo); });
      box.classList.toggle('q3', qNo >= 2);
      goB.textContent = qNo >= 2 ? 'That is the time' : 'Show Mr Rudd';
    }
    goB.addEventListener('click', function () {
      var t = hm(tmin()), c, file;
      if (qNo === 0) {
        if (!full()) { msg('&ldquo;She is not there yet,&rdquo; says Mr Rudd. &ldquo;The line is not full.&rdquo;'); return; }
        if (ER.check('q1', speed + '|' + t)) {
          qNo = 1; ER.flag('e-q', 1); ER.flag('e-s1', speed); ER.flag('e-t1', t); ER.sfx.ok(); msg('&ldquo;' + CP.cap(CP.num(Math.floor(speed))) + (speed % 1 ? ' and a half' : '') + ' knots. That is this ship on her best day, with one watch in the stokehold and every passenger warm in bed. So when the captain said four hours, he had not counted on us at all.&rdquo; He nearly smiles. &ldquo;Now seventeen.&rdquo;');
          laid = []; draw(); paintQ(); paint();
          return;
        }
        CP.slip(); ER.sfx.no();
        msg('&ldquo;That comes to ' + words(tmin()) + '. The bridge said four hours, and nothing over. Which speed goes into fifty-eight miles four times exactly?&rdquo;'); return;
      }
      if (qNo === 1) {
        if (speed !== 17) { CP.slip(); ER.sfx.no(); msg('&ldquo;Seventeen, I said. Take the seventeen-knot stick from the rack.&rdquo;'); return; }
        if (!full()) { msg('&ldquo;She is not there yet. Three whole hours go into the line, and a fourth will not. Use the short pieces for what is left.&rdquo;'); return; }
        if (ER.check('q2', speed + '|' + t)) {
          qNo = 2; ER.flag('e-q', 2); ER.flag('e-t2', t); ER.sfx.ok(); paintQ(); drawClock(); paint();
          msg('&ldquo;' + CP.cap(CP.span(tmin())) + '.&rdquo; Mr Rudd turns the engine-room clock on its hook until it faces you. &ldquo;She turned at twenty-five to one. So when is she there? Show me on the clock.&rdquo;<br><br>Drag the long hand.');
          return;
        }
        CP.slip(); ER.sfx.no(); msg('&ldquo;That is not what I make it. Clear the line and lay it again.&rdquo;'); return;
      }
      c = clockT();
      if (ER.check('eta', c)) {
        file = ER.exitOk([ER.flag('e-v') + '|' + ER.flag('e-s1') + '|' + ER.flag('e-t2') + '|' + c]);
        if (!file) { msg('Mr Rudd looks at the clock, and nothing happens. Something is wrong: tell your teacher.'); return; }
        nextFile = file; ER.flag('e-file', file); ER.flag('e-eta', c); qNo = 3; ER.flag('e-q', 3);
        var st = ER.state(); st.done = st.done || {}; st.done.engines = 1; ER.persist(true);
        ER.sfx.ok(); goB.disabled = true; paintQ();
        msg('&ldquo;' + CP.cap(oclock(c)) + '. ' + CP.cap(CP.span(toMin(ER.flag('e-t1')) - toMin(ER.flag('e-t2')))) + ' better than the bridge promised her.&rdquo; Mr Rudd wipes the slate with his sleeve, which makes both of them worse. &ldquo;Come with me. This is not news for a desk.&rdquo;');
        setTimeout(function () { ER.closeAll(); after(); }, 3000);
        return;
      }
      CP.slip(); ER.sfx.no();
      if (c === ER.flag('e-t2')) msg('&ldquo;That is how long. I asked you when. Add it to twenty-five minutes to one.&rdquo;');
      else if (mins === 35) msg('&ldquo;That is when she turned. Drag the long hand round.&rdquo;');
      else if (mins === (35 + toMin(ER.flag('e-t1'))) % 720) msg('&ldquo;That is the bridge&rsquo;s four hours again. With seventeen knots under her?&rdquo;');
      else msg('&ldquo;Twelve thirty-five, and ' + CP.span(toMin(ER.flag('e-t2'))) + ' more. Add the minutes first. If they come to sixty, that is one more hour.&rdquo;');
    });
    if (qNo >= 1) { speed = 17; }
    draw(); drawClock(); paintQ();
    box.first = function () {
      if (qNo === 0) msg('Mr Rudd&rsquo;s slate. &ldquo;That chalk line is your fifty-eight miles: us at this end, and her at that. I cannot show a fireman a sum. I can show him a line.&rdquo;<br><br>&ldquo;Take a speed from the rack, and lay one hour&rsquo;s run along the line, and then another, until she is there. The short pieces are a quarter of an hour, and five minutes.&rdquo;');
      else if (qNo === 1) msg('&ldquo;Now seventeen,&rdquo; says Mr Rudd. &ldquo;Lay it along the line.&rdquo;');
      else msg('&ldquo;She turned at twenty-five to one. So when is she there?&rdquo; Drag the long hand of the clock.');
    };
    return box;
  }
  function openR() {
    if (!rnBox) rnBox = buildR();
    rnBox.first(); inR = true;
    ER.open('ov-lock', rnBox, function () { inR = false; });
  }
  function after() {
    var when = oclock(ER.flag('e-eta')), t1 = toMin(ER.flag('e-t1')), t2 = toMin(ER.flag('e-t2'));
    busy = true; inR = false; paint();
    CP.mine('run', 'On Mr Rudd’s slate', '<p>58 miles.</p><p>At ' + sp(ER.flag('e-s1')) + ' knots: <b>' + CP.span(t1) + '</b>. That was what the bridge told her.</p><p>At 17 knots: <b>' + CP.span(t2) + '</b>.</p><p>She turned at 12.35, so: <b>' + when + '</b>.</p><p>time = distance ÷ speed</p>', true);
    ER.narrate([
      'He takes you as far as the door of the stokehold, and no further. Inside, everything is orange and black. There are twice as many men at the furnaces as there is room for, and some of them are wearing what they went to bed in.',
      'Mr Rudd puts his hands round his mouth. &ldquo;' + when.toUpperCase() + '!&rdquo; he shouts. &ldquo;GIVE HER SEVENTEEN, AND WE ARE THERE BY ' + when.toUpperCase() + '! NOT A MINUTE AFTER!&rdquo;',
      'Nobody answers him. But every shovel in the place is suddenly moving a little faster.',
      '&ldquo;A man will shovel like that until ' + when + ', if he knows that it is ' + when + ',&rdquo; says Mr Rudd. &ldquo;Now go up. The stewards want that time more than I do: they have a whole ship to make ready.&rdquo;',
      '&ldquo;Find the stewardess in the first-class saloon. Her name is Mrs Latham. I should knock.&rdquo;'
    ], function () { busy = false; paint(); });
  }
})();
</script>
</body>
</html>
