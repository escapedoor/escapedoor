      'Six valves took their steam from the same boilers as the engines. Four of them the captain&rsquo;s own list needed: the dynamos for his electric lights, the forward winches, the galley for the soup, and the steering engine, without which there is no ship. So the two that you shut were the cabin heating and the hot water. Then came the line on Mr Rudd&rsquo;s slate. Four hours&rsquo; run filled fifty-eight miles exactly at 14&frac12; knots, which was all that the bridge had promised. At 17 knots it took three hours, a quarter and two five-minutes: 3 hours 25 minutes. And 12.35 with 3.25 added to it is four o&rsquo;clock.',
