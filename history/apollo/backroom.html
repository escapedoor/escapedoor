<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="../../assets/fonts-history.css">

<style>
  body{--bg:#0d1412;--accent:#f2b23a;--font-display:'Abril Fatface',serif;--font-ui:'Oswald',sans-serif;--font-body:'Libre Caslon Text',serif;
    --tc-bg:rgba(9,13,12,.96);--tc-ink:#ece6d4;--cap-bg:rgba(9,14,13,.94);--panel:#141d1b;--face-bg:#1d2a27;--q-ink:#e9c477;--fade:#050807;--hud-bg:rgba(9,14,13,.8);
    --lamp:#7be08a;--lamp2:#e9f3e6;--crt:#8dfca4}
  body.bang{--lamp:#ffb23a;--lamp2:#ff5a3c}
  .lb{font-family:'Oswald',sans-serif;font-weight:500;text-anchor:middle;letter-spacing:.18em}
  .dg{font-family:'IBM Plex Mono',monospace;font-weight:600;text-anchor:middle}
  .hw{font-family:'Architects Daughter',cursive;text-anchor:middle}
  .lmp{fill:var(--lamp)}
  .lmp2{fill:var(--lamp2)}
  .bl{animation:bl 2.3s steps(1,end) infinite}
  .bl.b2{animation-duration:3.1s;animation-delay:-1.2s}
  .bl.b3{animation-duration:1.7s;animation-delay:-.6s}
  body.bang .bl{animation-duration:.9s}
  @keyframes bl{50%{opacity:.25}}
  .crtl{stroke:var(--crt);animation:crt 5s steps(1,end) infinite}
  @keyframes crt{0%{opacity:1}46%{opacity:.7}48%{opacity:1}80%{opacity:.82}82%{opacity:1}}
  .pen{animation:pen 1.3s ease-in-out infinite alternate}
  .pen.p2{animation-duration:.9s}
  @keyframes pen{from{transform:translateX(-5px)}to{transform:translateX(6px)}}
  body.bang .pen.p2{animation:pen2 .35s ease-in-out infinite alternate}
  @keyframes pen2{from{transform:translateX(-26px)}to{transform:translateX(-18px)}}
  #snow{display:none;animation:snow .5s steps(4,end) infinite}
  body.tvoff #snow{display:block}
  body.tvoff #tvpic{display:none}
  @keyframes snow{0%{transform:translate(0,0)}25%{transform:translate(-7px,5px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-3px,-6px)}}
  #spill{display:none}
  body.bang #spill{display:block}
  #cupOnTable{display:block}
  #pages{display:none}
  body.pages #pages{display:block;animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-6px)}}
  #log.ready #logpaper{animation:nudge 1.6s ease-in-out infinite}

  /* the log: the typed page, Mr Voss's five tabs, and then the stamp */
  .lg{display:grid;grid-template-columns:minmax(0,650px) 330px;gap:22px;width:min(1010px,96vw);align-items:start}
  .lg-page{position:relative;padding:12px 16px 12px 14px;background:#f6f3e8 linear-gradient(176deg,rgba(255,255,255,.5),rgba(120,110,70,.1));color:#22231e;font-family:'Courier Prime',monospace;font-size:14px;line-height:1.26;
    box-shadow:0 22px 50px rgba(0,0,0,.6)}
  .lg-page h5{margin:0 0 2px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.1em;border-bottom:2px solid #22231e;padding-bottom:5px}
  .lg-page h6{margin:4px 0 5px 46px;font-family:'Architects Daughter',cursive;font-weight:normal;font-size:14.5px;color:#55585c}
  .lg-stain{position:absolute;right:26px;top:6px;width:118px;height:112px;border-radius:50%;border:9px solid rgba(120,74,30,.26);box-shadow:inset 0 0 14px rgba(120,74,30,.18);pointer-events:none;transform:rotate(-8deg) scaleY(.92)}
  .tl{position:relative;display:grid;grid-template-columns:100px 40px 1fr;padding:2px 6px 2px 46px;border-radius:3px}
  .tl b{font-weight:700}
  .tl .t{color:#4a4a40;white-space:nowrap}
  .tl.open{cursor:pointer}
  .tl.open:hover{background:rgba(242,178,58,.22)}
  .lg-cut{height:9px;margin:2px 6px 2px 46px;border-top:1px dashed #a39c84}
  .tab{position:relative;display:flex;gap:9px;align-items:center;margin:0 0 9px;padding:7px 22px 6px 9px;background:#ffe98a;color:#22231e;font-family:'Architects Daughter',cursive;font-size:15.5px;line-height:1.15;
    box-shadow:0 3px 6px rgba(0,0,0,.45);clip-path:polygon(0 0,100% 0,calc(100% - 13px) 50%,100% 100%,0 100%)}
  .tab i{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:#22231e;color:#ffe98a;font-style:normal;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;line-height:24px;text-align:center}
  .tab.held{outline:3px solid #f2b23a;outline-offset:2px}
  .tab.ok{background:#bfe3b4;cursor:default}
  .tl .tab{position:absolute;left:1px;top:1px;margin:0;padding:2px 13px 2px 3px;gap:0}
  .tl .tab.fly{position:fixed}
  .tl .tab span{display:none}
  .tl .tab i{flex-basis:20px;width:20px;height:20px;line-height:20px;font-size:12.5px}
  .lg-tray{min-height:150px;padding:10px 10px 2px;border:1px dashed rgba(255,255,255,.3);border-radius:4px}
  .lg-side h6{margin:0 0 8px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:#c9c3ae}
  .lg-side .btn{display:block;width:100%;margin:10px 0 12px}
  .lg-side .pmsg{font-size:16.5px}
  .lg-ink{position:absolute;right:20px;top:42px;display:none}
  .lg.stamped .lg-ink{display:block}
  @media (max-width:900px){.lg{grid-template-columns:1fr}}
</style>
</head>

        if (part !== 'stamp') return;
        if (ER.check('st', key)) {
          file = ER.exitOk([[done[1], done[2], done[3], done[4], done[5]].join('-') + '|' + key]);
          if (!file) { msg('The stamp comes down, and nothing happens. Something is wrong: tell your teacher.'); return; }
          part = 'done'; AP.sfx.stamp(); box.classList.add('stamped'); box.querySelector('.lg-ink').textContent = AP.ink(day, hh, mm);
          nextFile = file; ER.flag('b-file', file); ER.flag('b-ink', AP.ink(day, hh, mm)); ER.flag('b-rows', done);
          var st = ER.state(); st.done = st.done || {}; st.done.backroom = 1; ER.flag('b-out', 1);
          msg('The stamp comes down in red ink. Voss looks at it, and then at the clock, and nods once.');
          setTimeout(function () { ER.closeAll(); after(); }, 2300);
          return;
        }
        AP.slip(); ER.sfx.no(); ER.shake(box.querySelector('.stp'));
        if (hh > 23) t = 'There is no such hour, not even in this building.';
        else if (hh === 7 && mm === 55) t = 'That is <b>their</b> clock, with the days left off. I asked for ours: the other one on the wall.';
        else if (day < 2) t = 'Lift-off was on Saturday. Look at the first pair of figures in the mission time: how many whole days have gone by since then?';
        else if (day > 2) t = 'Too many days. The first pair of figures is the days since lift-off, and lift-off was on Saturday.';
        else t = 'The right day. Now the hours and the minutes: start from 13:13, and add what their clock says. Do the minutes first, and carry.';
        msg('Voss puts his hand over the page before the stamp can come down. &ldquo;' + t + '&rdquo;');
      }
    });
    msg('The typed page, with your coffee on it. Drag each of the five tabs to the line where that thing happened, or click a tab and then a line. Nothing is judged until all five are on the page.');
    return box;
  }
  function openLog() {
    if (!lgBox) lgBox = build();
    inLock = true;
    ER.open('ov-lock', lgBox, function () { inLock = false; });
  }
  /* a line's time on the wall clock, worked out from its mission time (lift-off was at 13:13) */
  function wall(id) {
    var r = ROWS.filter(function (x) { return x && x[3] === id; })[0], a, s;
    if (!r) return '';
    a = r[0].split(' ').map(Number); s = (a[1] + 13) * 3600 + (a[2] + 13) * 60 + a[3];
    return two(Math.floor(s / 3600) % 24) + ':' + two(Math.floor(s / 60) % 60);
  }
  function after() {
    var rows = ER.flag('b-rows') || {}, note = '<p>Stamped: <b>' + (ER.flag('b-ink') || '') + '</b></p>', n;
    busy = true; setClock(5); paint();
    for (n = 1; n <= 5; n++) if (rows[n]) note += '<p><b>' + wall(rows[n]) + '</b> ' + TABS[n] + '</p>';
    AP.mine('log1', 'The log, Monday night', note + '<p>Their clock + 13:13 from Saturday = ours.</p>', true);
    ER.narrate([
      'Voss reads the log from the top, with his finger. He stops at the last tab.',
      '&ldquo;Fourteen minutes,&rdquo; he says. &ldquo;From the first word to the window. For fourteen minutes a man could still hope that it was only the gauges. Nobody ever saw a bad gauge out of a window.&rdquo;',
      'Some time tonight, in the worst of it, the flight director, Gene Kranz, said one thing to every console at once. You heard it on the loop, and you wrote it on the back of your hand.',
      AP.said('Kranz', 'Let&rsquo;s solve the problem but let&rsquo;s not make it any worse by guessing.'),
      '&ldquo;Time first, then what. Never why,&rdquo; says Voss. &ldquo;I told you that. Now the flight director has told you too.&rdquo;'
    ], function () {
      AP.learn('flight director'); AP.sfx.squawk();
      AP.mine('loop', 'Written on the back of your hand', '<p>Gene Kranz, flight director, on the loop, Monday night:</p><p><span class="said">&ldquo;Let&rsquo;s solve the problem but let&rsquo;s not make it any worse by guessing.&rdquo;</span></p>', true);
      ER.narrate([
        'At nineteen minutes to ten the speaker clicks. It is Lousma again, and he is not talking to this room. All the same, everybody in it looks up.',
        AP.said('Houston', 'Okay, 13. We&rsquo;ve got lots and lots of people working on this &hellip;'),
        'You look round. Nobody has gone home. All the way down the hall, every door is open and every light is on. You are one of the lots and lots.',
        '&ldquo;Take that log down the hall to the big wall chart,&rdquo; says Voss. &ldquo;Mrs Halloran is there. Odyssey is running out of things, and I want to know which.&rdquo;'
      ], function () { busy = false; paint(); });
    });
  }
})();
</script>
