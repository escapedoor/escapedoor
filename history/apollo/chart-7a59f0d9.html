    l1: [738, 132, 'OXYGEN', 738, 113], l2: [802, 132, 'WATER', 802, 113], l3: [770, 222, 'BATTERIES', 770, 251], l4: [858, 175, 'ENGINE', 884, 252]
  };
  var NAMES = ['?', 'AQUARIUS', 'ODYSSEY', 'THE SERVICE MODULE'], NKEY = ['', 'aquarius', 'odyssey', 'service'];

  function hints() {
    if (nextFile) return ['go', ['Nothing more can be done at this wall tonight. Use the button at the bottom of the screen.']];
    if (inLock && part === 'line') return ['line', [
      'Look at your own wool. Where do the four strands for tonight go? Where do the four for the last hour go?',
      'A ship that is switched off uses nothing. Which ship has something small of her own that must be kept for the end?'
    ]];
    if (inLock) return ['wool', [
      'Each card is something that the three men need. Each brass pin is something that one of the three parts carries. Ask two things of every pin: is it still working, and may it be used tonight?',
      'The cards on the left are for the days of the journey home. The cards on the right are for the last hour, down through the air. Which of the three parts will still be there in that last hour? The chart says which ones never come home.',
      'Nothing in the service module can be trusted now: read the new page of the air-to-ground. What Odyssey carries of her own is small, and the chart says what it is meant for. So tonight&rsquo;s needs must come from somewhere else.'
    ]];
    if (seen.chart && seen.page) return ['open', ['The cards, the pins and the red wool are on the table in front of the chart.']];
    return ['look', [
      'Mrs Halloran told you to read the chart before you touch anything. It is the big blue drawing on the wall.',
      'Two papers matter here: the wall chart, and the new page of the air-to-ground, which is lying on the right-hand end of the table. Mrs Halloran will answer questions too, if they are asked properly.'
    ]];
  }
  function isBusy() { return busy; }
  function see(k) { if (!seen[k]) { seen[k] = 1; ER.flag('c-seen', seen); } paint(); }
  function paint() {
    $('#tbl').classList.toggle('ready', !!(seen.chart && seen.page) && !nextFile);
    ER.pips((seen.chart ? 1 : 0) + (seen.page ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) {
      document.body.classList.add('done'); $('#go').classList.add('on');
      ['#bd1', '#bd2', '#bd3'].forEach(function (s, i) { var m = chalked(); if (m[i]) $(s).textContent = NAMES[m[i]]; });
    }
  }
  /* what the player chalked on the blackboard (kept with the saved game, not in this page) */
  function chalked() { return (ER.flag('c-ans') || {}).m || []; }

  function begin() {
    paint(); AP.mood('tense');
    if (ER.flag('c-in')) { busy = false; ER.say('The wall chart. Mrs Halloran has not moved.'); return; }
    ER.flag('c-in', 1);
    ER.narrate([
      'A long wall, a drawing as big as a car, and a woman with a slide rule in her hand and a pencil behind her ear. Mrs Halloran does sums for a living, and she has been doing them without a stop since nine o&rsquo;clock.',
      '&ldquo;So Mr Voss has sent me the co-op,&rdquo; she says, to the wall. &ldquo;Very well. Put the page you brought on the table. And read the chart before you touch anything.&rdquo;',
      '&ldquo;In this building a number without a unit is a rumour, and a plan without a reason is a wish. I have no time tonight for rumours or for wishes.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- things in the room ---------- */
  $('#chartW').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: WALL, cls: 'wall', clue: { id: 'wall', title: 'The wall chart: what each part carries', kind: 'Wall chart' }, done: function () { AP.learn('service module', 'fuel cell', 'heat shield'); see('chart'); } });
  });
  $('#page2').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.read({ html: AP.page(2, 'The pencil is mine. M.H.', ROWS2), cls: 'tscript', clue: { id: 'page2', title: 'Air-to-ground, page 2', kind: 'Typed transcript' }, done: function () { see('page'); } });
  });
  $('#hall').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Mrs Marian Halloran', role: 'mathematician · at the wall chart, Monday night', face: window.FACE('halloran'),
      lines: [
        { note: 'She does not turn round.', a: '&ldquo;If you have come to ask what is going on, co-op, ask it properly. One question at a time.&rdquo;' },
        { q: 'What is wrong with Odyssey?', a: 'With Odyssey herself? Nothing that anybody knows of. She is not hurt. She is starving. Everything she lives on comes from the service module behind her, and the service module is where the bang was.' },
        { q: 'What did the bang do?', a: 'Nobody knows, and I do not guess. I can tell you what the gauges say. One oxygen tank is empty. The other is going down while we watch it. Two of the three fuel cells have stopped, and the third is living on the tank that is going down.' },
        { q: 'What is a fuel cell?', a: 'It is on the chart. Everything is on the chart. I drew half of it myself.' },
        { q: 'And when the oxygen has all gone?', a: 'Then Odyssey has only what she carries herself, and that is very little. So: eight cards on the table. Eight things that those three men cannot do without. Show me, with the wool, where each one is going to come from.' }
      ],
      clue: { id: 'hall1', title: 'Mrs Halloran, at the wall chart', kind: 'What she said' }, last: 'Thank her'
    });
  });
  AP.thing('#clock', null, 'Half past ten. In mission time that is 57 hours and 17 minutes. You are getting quicker at the sum.', isBusy);
  AP.thing('#cooler', 'water cooler', 'A water cooler. Every few seconds a bubble goes up through it. It is the only thing in the building that is not in a hurry.', isBusy);
  AP.thing('#phone', null, 'A telephone on the wall. It has rung four times since you came, and every time it was somebody asking Mrs Halloran for a number.', isBusy);
  AP.thing('#lights', null, 'One of the lights flickers. Nobody is going to change it this week.', isBusy);
  AP.thing('#board', 'blackboard', function () {
    var m = chalked();
    return nextFile && m.length === 3 ? 'Three lines in chalk. LIVE IN ' + NAMES[m[0]] + '. SWITCH OFF ' + NAMES[m[1]] + '. COME HOME IN ' + NAMES[m[2]] + '.' : 'A blackboard on wheels. Somebody has begun three lines in chalk, and finished none of them.';
  }, isBusy);
  $('#tbl').addEventListener('click', function (e) {
    if (busy) return;
    if (nextFile) { ER.say('Eight strands of red wool, all pinned and knotted. The blackboard says the rest.'); return; }
    if (!seen.chart) { ER.wordAt(e.clientX, e.clientY, 'wool'); ER.say('&ldquo;The chart first,&rdquo; says Mrs Halloran, without looking. &ldquo;Then the wool.&rdquo;'); return; }
    if (!seen.page) { ER.say('&ldquo;And have you read the page you brought me?&rdquo; says Mrs Halloran. &ldquo;I have. It is on the end of the table.&rdquo;'); return; }
    openWool();
  });
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; AP.solved(true);
    setTimeout(function () { ER.leave(nextFile); }, 1100);
  });

  /* ---------- the wool ---------- */
  function build() {
    var box = ER.el('div', 'wl'), s, svg, msgEl, goBtn, link = {}, okN = {}, sel = 0, tmp = null, pick = [0, 0, 0], k, i, x, n;
    s = '<svg viewBox="0 0 1040 512"><defs><pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M0 0H26M0 0V26" stroke="#fff" stroke-opacity=".07" stroke-width="1.2" fill="none"/></pattern></defs>' +
      '<rect width="1040" height="342" fill="#1d3f6e"/><rect width="1040" height="342" fill="url(#grid2)"/><rect y="342" width="1040" height="170" fill="#b08a5a"/><rect y="342" width="1040" height="6" fill="#8c6a42"/>' +
      '<text x="520" y="30" class="sl" style="font-size:14px;letter-spacing:.3em">APOLLO 13 &#183; WHAT EACH PART CARRIES</text>' +
      '<g stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round" opacity=".8">' + STK + '</g>' +
      '<text x="265" y="328" class="nm">SERVICE MODULE</text><text x="470" y="328" class="nm">ODYSSEY</text><text x="745" y="328" class="nm">AQUARIUS</text>' +
      '<text x="960" y="150" class="sl" style="fill:#ffd97a">A BRASS PIN:</text><text x="960" y="168" class="sl">something that</text><text x="960" y="186" class="sl">part carries</text>';
    for (k in SOCK) s += '<g class="sock" data-s="' + k + '"><circle class="hit" cx="' + SOCK[k][0] + '" cy="' + SOCK[k][1] + '" r="24"/><circle class="pin" cx="' + SOCK[k][0] + '" cy="' + SOCK[k][1] + '" r="7.5" fill="#e7c873" stroke="#6f531a" stroke-width="2"/>' +
      '<text class="sl" x="' + SOCK[k][3] + '" y="' + SOCK[k][4] + '">' + SOCK[k][2] + '</text></g>';
    s += '<text x="262" y="374" class="gh">FROM TONIGHT: THE LONG WAY HOME</text><text x="778" y="374" class="gh">THE LAST HOUR: DOWN THROUGH THE AIR</text><g class="yarns"></g>';
    for (n = 1; n <= 8; n++) {
      x = (n <= 4 ? 14 : 530) + ((n - 1) % 4) * 126;
      s += '<g class="need" data-n="' + n + '" data-x="' + (x + 59) + '"><rect class="cd" x="' + x + '" y="390" width="118" height="110" rx="3" fill="' + (n <= 4 ? '#fbf8ee' : '#dfeaf5') + '" stroke="#6b6552" stroke-width="1.5"/>' +
        '<circle cx="' + (x + 59) + '" cy="402" r="6" fill="#e7c873" stroke="#6f531a" stroke-width="2"/>';
      NEED[n].forEach(function (t, j) { s += '<text class="ct" x="' + (x + 59) + '" y="' + (462 - (NEED[n].length - 1) * 10 + j * 20) + '">' + t + '</text>'; });
      s += '</g>';
    }
    s += '</svg><div class="wl-foot"><p class="wl-line">LIVE IN <button type="button" class="wl-b" data-i="0">?</button>. SWITCH <button type="button" class="wl-b" data-i="1">?</button> OFF. COME HOME IN <button type="button" class="wl-b" data-i="2">?</button>.</p><p class="pmsg"></p>' +
      '<button type="button" class="btn wl-go" disabled>Ask Mrs Halloran</button></div>';
    box.innerHTML = s;
    svg = box.querySelector('svg'); msgEl = box.querySelector('.pmsg'); goBtn = box.querySelector('.wl-go');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function path(n, to) {
      var c = box.querySelector('.need[data-n="' + n + '"]'), x1 = +c.getAttribute('data-x'), y1 = 402, x2 = to[0], y2 = to[1];
      return 'M' + x1 + ' ' + y1 + 'Q' + ((x1 + x2) / 2 + (x2 - x1) * 0.08).toFixed(1) + ' ' + ((y1 + y2) / 2 + 34).toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
    }
    function draw() {
      var out = '', n, c = 0;
      for (n = 1; n <= 8; n++) if (link[n]) { out += '<path class="yarn' + (okN[n] ? ' ok' : '') + '" d="' + path(n, SOCK[link[n]]) + '"/>'; c++; }
      if (tmp) out += '<path class="yarn tmp" d="' + path(tmp[0], tmp[1]) + '"/>';
      box.querySelector('.yarns').innerHTML = out;
      ER.$$('.need', box).forEach(function (g) { var n = +g.getAttribute('data-n'); g.classList.toggle('sel', n === sel); g.classList.toggle('ok', !!okN[n]); });
      goBtn.disabled = part === 'wool' ? c < 8 : pick.indexOf(0) >= 0;
      box.setAttribute('data-links', c); box.setAttribute('data-ok', Object.keys(okN).length);
    }
    function near(p) {
      var best = null, bd = 34, k, d;
      for (k in SOCK) { d = Math.sqrt(Math.pow(SOCK[k][0] - p.x, 2) + Math.pow(SOCK[k][1] - p.y, 2)); if (d < bd) { bd = d; best = k; } }
      return best;
    }
    function attach(n, k) { link[n] = k; sel = 0; AP.sfx.pin(); draw(); }
    ER.$$('.need', box).forEach(function (g) {
      var n = +g.getAttribute('data-n');
      ER.drag(g, {
        start: function () { if (part !== 'wool' || okN[n]) return false; },
        move: function (ev, moved) { if (!moved) return; var p = ER.pt(svg, ev); tmp = [n, [p.x, p.y]]; sel = 0; draw(); },
        end: function (ev, moved) {
          var p, k;
          tmp = null;
          if (!moved) { sel = sel === n ? 0 : n; ER.sfx.click(); draw(); return; }
          p = ER.pt(svg, ev); k = near(p);
          if (k) attach(n, k); else draw();
        }
      });
    });
    ER.$$('.sock', box).forEach(function (g) {
      g.addEventListener('click', function () { if (part === 'wool' && sel && !okN[sel]) attach(sel, g.getAttribute('data-s')); });
    });
    function why(n, k) {
      var late = n > 4, mod = k.charAt(0);
      if (mod === 's') {
        if (late) return 'The service module never comes home. It is let go before the air. Read its corner of the chart.';
        if (k === 's1') return 'One tank reads zero and the other is going down. Read the page you brought me.';
        if (k === 's2') return 'The hydrogen is all there, every pound of it. A fuel cell needs two things, and it is losing the other one.';
        if (k === 's3') return 'Two fuel cells have stopped. The third is living on a tank that is leaking. How long do you give it?';
        return 'An engine full of fuel, and bolted to the end where the bang was. Nobody can go out there and look at it. Would you light it?';
      }
      if (mod === 'c' && !late) return k === 'c1' || k === 'c2' ? 'That is the end of the flight you are spending. Read what the chart says those are meant for. And why do you suppose Houston said &ldquo;isolate&rdquo;?' : 'That is no use to anybody tonight. Read the label under the pin.';
      if (mod === 'l' && late) return 'In the last hour Aquarius is not there. Read her corner of the chart: what has she not got? So what must happen to her before the air?';
      return 'The right ship, and the wrong pin. Read the label under it.';
    }
    ER.$$('.wl-b', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.getAttribute('data-i'); if (part !== 'line') return;
        pick[i] = pick[i] % 3 + 1; b.textContent = NAMES[pick[i]]; AP.sfx.chalk(); draw();
      });
    });
    goBtn.addEventListener('click', function () {
      var wrong = [], first = '', n, file, t;
      if (part === 'wool') {
        for (n = 1; n <= 8; n++) {
          if (okN[n]) continue;
          if (ER.check('y' + n, link[n])) okN[n] = 1;
          else { wrong.push(n); if (!first) first = why(n, link[n]); delete link[n]; }
        }
        if (wrong.length) {
          AP.slip(); ER.sfx.no(); draw();
          msg('Mrs Halloran pulls out ' + (wrong.length === 1 ? 'one pin' : wrong.length + ' pins') + '. &ldquo;' + first + '&rdquo; The strands that are right, she knots.');
          return;
        }
        part = 'line'; ER.sfx.ok(); box.classList.add('say'); goBtn.textContent = 'Chalk it up'; draw();
        msg('Eight strands, eight knots. &ldquo;Now say it,&rdquo; says Mrs Halloran. &ldquo;Three short lines, for the blackboard. People will make their plans from that board.&rdquo; Click each gap until it holds the right name.');
        return;
      }
      if (part !== 'line') return;
      if (ER.check('m1', NKEY[pick[0]]) && ER.check('m2', NKEY[pick[1]]) && ER.check('m3', NKEY[pick[2]])) {
        file = ER.exitOk([[1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return link[n]; }).join('-') + '|' + pick.map(function (v) { return NKEY[v]; }).join('-')]);
        if (!file) { msg('The chalk breaks, and nothing happens. Something is wrong: tell your teacher.'); return; }
        part = 'done'; nextFile = file; ER.flag('c-file', file);
        ER.flag('c-ans', { y: [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return link[n]; }), m: pick.slice() });
        var st = ER.state(); st.done = st.done || {}; st.done.chart = 1; ER.flag('c-out', 1);
        ER.sfx.ok(); msg('Mrs Halloran reads it aloud, once, and nods. &ldquo;Chalk it up.&rdquo;');
        setTimeout(function () { ER.closeAll(); after(); }, 2200);
        return;
      }
      AP.slip(); ER.sfx.no();
      if (!ER.check('m1', NKEY[pick[0]])) t = pick[0] === 2 ? 'Live in Odyssey, on three small batteries? Look at where your own wool goes for tonight&rsquo;s electricity.' : 'Nobody can live in the service module. There is no room in it for a man.';
      else if (!ER.check('m2', NKEY[pick[1]])) t = pick[1] === 1 ? 'Switch off the one ship that is keeping them alive?' : 'The service module has switched itself off. Which ship still has something of her own that is worth saving?';
      else t = pick[2] === 1 ? 'Home in Aquarius? Read her corner of the chart once more. What has she not got?' : 'The service module never comes home.';
      msg('&ldquo;' + t + '&rdquo;');
    });
    draw();
    msg('Eight cards and a ball of red wool. Drag each card&rsquo;s pin up to the brass pin that it must be fed from, or click the card and then the brass pin. Nothing is judged until all eight strands are up.');
    return box;
  }
  function openWool() {
    if (!wlBox) wlBox = build();
    inLock = true;
    ER.open('ov-lock', wlBox, function () { inLock = false; });
  }
  function after() {
    var ans = ER.flag('c-ans') || { y: [], m: [] }, SHIP = { s: 'the service module', c: 'Odyssey', l: 'Aquarius' }, note;
    busy = true; paint(); AP.sfx.chalk(); AP.learn('lifeboat');
    note = '<p><b>LIVE IN ' + NAMES[ans.m[0]] + '. SWITCH ' + NAMES[ans.m[1]] + ' OFF. COME HOME IN ' + NAMES[ans.m[2]] + '.</b></p><p>From tonight:<br>';
    ans.y.forEach(function (k, i) {
      if (i === 4) note += '</p><p>In the last hour:<br>';
      note += NEED[i + 1].join(' ').toLowerCase() + ' &larr; ' + SHIP[k.charAt(0)] + ', ' + SOCK[k][2].toLowerCase() + '<br>';
    });
    AP.mine('plan', 'The blackboard, Monday night', note + '</p><p>A fuel cell needs oxygen. No oxygen: no electricity, and no new water.</p>', true);
    ER.narrate([
      'You write the three lines on the blackboard. The chalk squeaks. Nobody in the hall takes any notice, because on the wall behind you the speaker has begun to talk.',
      AP.said('Swigert', 'Okay, Jack. It looks like O2 tank 1 pressure is just a hair over 200.'),
      AP.said('Houston', 'It&rsquo;s slowly going to zero, and we&rsquo;re starting to think about the LM lifeboat.'),
      AP.said('Swigert', 'Yes. That&rsquo;s what we&rsquo;re thinking about, too.'),
      '&ldquo;Lifeboat,&rdquo; says Mrs Halloran. &ldquo;So that is the word.&rdquo; She looks at the wool, and then, for the first time, at you.',
      'Twelve minutes later, at eleven minutes to eleven, the speaker says the rest.',
      AP.said('Houston', '&hellip; We figure we&rsquo;ve got about 15 minutes&rsquo; worth of power left in the command module, so we want you to start getting over in the LM and getting some power on that.')
    ], function () {
      AP.mine('life', 'Heard on the speaker, Monday night', '<p>22:37, Houston to the crew:</p><p><span class="said">&ldquo;It&rsquo;s slowly going to zero, and we&rsquo;re starting to think about the LM lifeboat.&rdquo;</span></p><p>22:49:</p>' +
        '<p><span class="said">&ldquo;&hellip; We figure we&rsquo;ve got about 15 minutes&rsquo; worth of power left in the command module, so we want you to start getting over in the LM and getting some power on that.&rdquo;</span></p>', true);
      ER.narrate([
        'Fifteen minutes. Somewhere down the hall a man starts to run, which is a thing that nobody in this building does.',
        'By seven minutes to midnight, Odyssey is dark. There was no check list for switching a command module off in the middle of a flight: one was made up tonight. There is none for switching her on again. Somebody will have to write that too.',
        '&ldquo;A lifeboat built for two men, for two days,&rdquo; says Mrs Halloran. &ldquo;Now she must keep three men for four. That is not a question for wool, co-op. That is a question for sums. Come and find me tomorrow night.&rdquo;'
      ], function () { busy = false; paint(); });
    });
  }
})();
</script>
