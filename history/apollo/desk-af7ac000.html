<style>
  body{--bg:#15110c;--accent:#9fd18b;--font-display:'Abril Fatface',serif;--font-ui:'Oswald',sans-serif;--font-body:'Libre Caslon Text',serif;
    --tc-bg:rgba(20,16,11,.97);--tc-ink:#f1e9d6;--cap-bg:rgba(20,16,11,.94);--panel:#2a2219;--face-bg:#33291f;--q-ink:#c9e3b8;--fade:#0a0806;--hud-bg:rgba(20,16,11,.82)}
  .lb{font-family:'Oswald',sans-serif;font-weight:500;text-anchor:middle;letter-spacing:.16em}
  .hw{font-family:'Architects Daughter',cursive;text-anchor:middle}
  #mast{animation:mast 2.4s steps(1,end) infinite}
  @keyframes mast{50%{opacity:.15}}
  #car{animation:car 17s linear infinite}
  @keyframes car{0%{transform:translateX(-80px)}40%{transform:translateX(520px)}100%{transform:translateX(520px)}}
  #glow{animation:glow 6s steps(1,end) infinite}
  @keyframes glow{0%{opacity:1}71%{opacity:.93}73%{opacity:1}}
  #calc.ready #tapeS{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-6px)}}
  #sq{display:none}
  body.done #sq{display:block}

  /* the adding machine and the sheet */
  .cs{display:grid;grid-template-columns:340px minmax(0,640px);gap:24px;width:min(1010px,96vw);align-items:start}
  .am{padding:14px 16px 16px;border-radius:14px 14px 8px 8px;background:#b9b29c linear-gradient(#cfc8b2,#9a937e);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.4)}
  .am-tape{height:86px;margin:0 26px 10px;padding:6px 12px 4px;overflow:hidden;background:#fdfcf6;display:flex;flex-direction:column;justify-content:flex-end;font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.36;color:#22231e;
    box-shadow:inset 0 -10px 12px -8px rgba(0,0,0,.35);border-radius:3px 3px 0 0;text-align:right}
  .am-tape div{white-space:nowrap}
  .am-tape div:last-child{color:#8c2f24;font-weight:600}
  .am-reg{margin:0 0 12px;padding:7px 12px 5px;border-radius:5px;background:#16181a;color:#f1ead6;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:25px;line-height:1.1;text-align:right;min-height:42px;box-shadow:inset 0 3px 8px #000}
  .am-reg small{float:left;font-size:17px;font-weight:400;color:#9fd18b;line-height:1.6}
  .am-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .am-k{height:40px;border-radius:6px;background:#2f3336 linear-gradient(#4a4f53,#25282a);color:#f1ead6;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;box-shadow:0 3px 0 #111,0 4px 6px rgba(0,0,0,.4)}
  .am-k:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
  .am-k.op{background:#6b4a2a linear-gradient(#8c6a45,#5a3f22)}
  .am-k.eq{grid-column:span 4;background:#8c2f24 linear-gradient(#b3261c,#7a2018);font-family:'Oswald',sans-serif;font-weight:500;font-size:15px;letter-spacing:.3em}
  .am-brand{margin:10px 0 0;text-align:center;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.4em;color:#55503f}
  .cs-tray{min-height:74px;margin-top:14px;padding:8px 8px 2px;border:1px dashed rgba(255,255,255,.3);border-radius:4px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
  .cs-tray:before{content:'slips torn off the tape';flex:0 0 100%;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b9b39c}
  .sl{padding:4px 10px 3px;background:#fdfcf6;color:#22231e;font-family:'IBM Plex Mono',monospace;box-shadow:0 3px 6px rgba(0,0,0,.45);
    clip-path:polygon(0 0,100% 0,100% 88%,92% 100%,82% 88%,70% 100%,58% 88%,46% 100%,34% 88%,22% 100%,10% 88%,0 100%)}
  .sl b{display:block;font-weight:600;font-size:17px;line-height:1.15}
  .sl small{display:block;font-size:11px;line-height:1.2;color:#6b6552;padding-bottom:4px}
  .sl.held{outline:3px solid #9fd18b;outline-offset:2px}
  .sheet{position:relative;padding:16px 22px 14px;background:#f6f3e8 linear-gradient(176deg,rgba(255,255,255,.5),rgba(120,110,70,.1));color:#22231e;font-family:'Courier Prime',monospace;font-size:15px;line-height:1.36;box-shadow:0 22px 50px rgba(0,0,0,.6)}
  .sheet h5{margin:0 0 8px;display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;letter-spacing:.08em;border-bottom:2px solid #22231e;padding-bottom:6px}
  .ln{position:relative;display:grid;grid-template-columns:26px 1fr 96px;gap:0 6px;align-items:center;padding:6px 0 6px;border-bottom:1px dotted #a39c84}
  .ln i{font-style:normal;font-weight:700}
  .ln small{display:block;font-size:13px;color:#55584f}
  .cs-slot{display:inline-block;min-width:86px;min-height:27px;margin:0 3px;vertical-align:middle;border-bottom:2px solid #22231e;background:rgba(159,209,139,.2);text-align:center}
  .cs-slot.open:hover{background:rgba(159,209,139,.45)}
  .cs-slot .sl{display:inline-block;padding:1px 8px 0;box-shadow:none;clip-path:none;background:transparent}
  .cs-slot .sl small{display:none}
  .cs-slot.ok{background:transparent;border-bottom-color:transparent;font-family:'Architects Daughter',cursive;font-size:20px;color:#1d2a52;line-height:1.2}
  .yn{display:none;gap:4px;justify-content:flex-end}
  .cs.stB .yn{display:flex}
  .yn button{width:44px;height:26px;border:1.5px solid #22231e;border-radius:3px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.1em;color:#22231e}
  .yn button.on{background:#22231e;color:#f6f3e8}
  .yn.ok button{border-color:transparent;background:transparent;color:#a39c84}
  .yn.ok button.on{color:#2f6a4a;font-size:15px}
  .yn.ok.bad button.on{color:#b3261c}
  .yh{display:none;position:absolute;right:22px;top:43px;width:150px;font-family:'Oswald',sans-serif;font-weight:500;font-size:10px;letter-spacing:.1em;line-height:1.2;text-align:right;color:#55584f;white-space:nowrap}
  .cs.stB .yh{display:block}
  .ln.sh{display:none;grid-template-columns:26px 1fr}
  .cs.stC .ln.sh{display:grid}
  .ln.sh .red{font-family:'Architects Daughter',cursive;font-size:19px;color:#b3261c}
  .sheet .btn{display:block;width:100%;margin-top:10px;--accent:#22231e}
  .sheet .btn:hover:not([disabled]){color:#f6f3e8}
  .cs .pmsg{margin-top:12px;font-size:16.5px;min-height:96px}
  @media (max-width:900px){.cs{grid-template-columns:1fr}}
</style>
</head>

        part = 'done'; slotOf(5).classList.remove('open'); slotOf(5).classList.add('ok'); slotOf(5).textContent = cand(5, v);
        nextFile = file; ER.flag('d-file', file); ER.flag('d-ans', { a: got, yn: yn.slice(1), s: cand(5, v) });
        var st = ER.state(); st.done = st.done || {}; st.done.desk = 1; ER.flag('d-out', 1);
        ER.sfx.ok(); goBtn.style.display = 'none'; msg('&ldquo;' + cand(5, v) + ' hours short,&rdquo; says Mrs Halloran. She underlines it twice.');
        setTimeout(function () { ER.closeAll(); after(); }, 2400);
        return;
      }
      AP.slip(); ER.sfx.no(); tray.appendChild(sl); ready();
      msg(sl.getAttribute('data-op') === '+' ? '&ldquo;You have added. I asked how much <b>less</b> forty-four is than sixty-one.&rdquo;' : '&ldquo;No. The hours they need, less the hours that those canisters have left in them.&rdquo;');
    });
    reg(); drawTape();
    msg('The machine has keys for the four sums and a red key marked TOTAL. Work a sum (your own keyboard will do it too), press TOTAL, and a slip comes off the tape. Drag the slip to the gap where it belongs. Nothing is judged until the four gaps are full.');
    return box;
  }
  function openSheet() {
    if (!csBox) csBox = build();
    inLock = true;
    ER.open('ov-lock', csBox, function () { inLock = false; });
  }
  function after() {
    var ans = ER.flag('d-ans') || { a: {}, yn: [], s: '' }, oxy = String(Math.floor(+ans.a[3] / 10) * 10);
    function V(i) { return ans.yn[i] === 'yes' ? 'Enough.' : 'Not enough.'; }
    busy = true; paint(); AP.learn('carbon dioxide');
    AP.mine('sheet', 'Aquarius: what is left', '<p>Tuesday night, 61 hours to go.</p><p><b>Electricity:</b> they can afford ' + ans.a[1] + ' amps. The plan is 14. ' + V(0) + '</p><p><b>Water:</b> they can afford ' + ans.a[2] + ' lb an hour. The plan is up to 3.2. ' + V(1) + '</p>' +
      '<p><b>Oxygen:</b> ' + oxy + ' hours. ' + V(2) + '</p><p><b>Lithium hydroxide, Aquarius&rsquo;s own canisters:</b> 44 hours. ' + V(3) + ' <b>' + ans.s + ' hours short.</b></p><p><b>Lithium hydroxide, Odyssey&rsquo;s canisters:</b> ' + ans.a[4] + ' hours. ' + V(4) + ' But they are square.</p>', true);
    ER.narrate([
      '&ldquo;Everybody in this building is afraid that those men will run out of air to breathe,&rdquo; says Mrs Halloran. &ldquo;They will not. There is oxygen for ' + oxy + ' hours. What they will run out of is a way to get rid of what they breathe <em>out</em>.&rdquo;',
      '&ldquo;Carbon dioxide. A canister of lithium hydroxide takes it out of the air, until the canister is full. Aquarius has 44 hours of canisters. Odyssey has ' + ans.a[4] + ' hours of them, sitting in the dark and doing nothing.&rdquo;',
      'She takes your pencil and draws a square. Beside it she draws a circle. &ldquo;Odyssey&rsquo;s canisters are square. The holes for them in Aquarius are round.&rdquo;',
      'At one minute to eleven the speaker on the filing cabinet clicks. It is tonight&rsquo;s CAPCOM, Vance Brand, with the list.'
    ], function () {
      AP.sfx.squawk();
      ER.narrate([
        AP.said('Houston', 'In the LM, you have 1498 - that is 1 4 9 8 amp-hours remaining. That means over 61 hours you&rsquo;d - That would average out to 24.5 amps.'),
        AP.said('Houston', 'In the LM, you have 215, that is 2 1 5, pounds of water, usable. That would average out over 61 hours to 3.5 pounds per hour available.'),
        AP.said('Houston', 'Using the CSM cans, you will have 16 cans at 12 hours per can to give you 19 2, or 192 hours, of LiOH. And, in the LM, using its cans, you have 44 hours remaining.'),
        'Four desks, four pieces of paper, one answer. Mrs Halloran does not smile. She puts a small tick beside your first line, and from her that is a good deal more than a smile.',
        '&ldquo;The Crew Systems people have had those square canisters since this morning,&rdquo; she says. &ldquo;They are building something out of what is on board. When it works, it has to be put into words. Then somebody who has never seen it has to try the words. Building 7, co-op. Before it gets light.&rdquo;'
      ], function () {
        AP.mine('readup', 'Heard on the speaker, Tuesday night', '<p>22:59, Houston to the crew:</p><p><span class="said">&ldquo;In the LM, you have 1498 - that is 1 4 9 8 amp-hours remaining. That means over 61 hours you&rsquo;d - That would average out to 24.5 amps.&rdquo;</span></p>' +
          '<p><span class="said">&ldquo;Using the CSM cans, you will have 16 cans at 12 hours per can to give you 19 2, or 192 hours, of LiOH. And, in the LM, using its cans, you have 44 hours remaining.&rdquo;</span></p><p>(CSM = Odyssey and her service module. LiOH = lithium hydroxide.)</p>', true);
        busy = false; paint();
      });
    });
  }
