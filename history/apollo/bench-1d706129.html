  var PAGE = '<h4>What a canister does</h4>' +

      if (ER.check('bad', sel)) tear(sel); else bad('&ldquo;That one we need,&rdquo; says Pereira, and he takes it out of the bin. &ldquo;Read it again. What would go wrong without it?&rdquo;');

    function finish() {
      var file = ER.exitOk([done.join('-')]);
      if (!file) { msg('The hose goes in, and nothing happens. Something is wrong: tell your teacher.'); return; }
      fin = true; ['x', 'z'].forEach(function (c) { if (!gone[c]) { gone[c] = 1; } });
      nextFile = file; ER.flag('e-file', file); ER.flag('e-ans', { o: done.slice(), w: said });
      var st = ER.state(); st.done = st.done || {}; st.done.bench = 1; ER.flag('e-out', 1);
      draw(); ER.sfx.ok();
      msg('The hose goes in through the corner of the bag, and a last piece of tape goes round the join. Seven cards. It looks like something a child has made, and Pereira is looking at it as if it were beautiful.');
      setTimeout(function () { ER.closeAll(); after(); }, 3000);
    }
    draw();
    msg('Nine cards, in no order at all. Click a card to pick it up. Then either do what it says, or throw it out. Three mistakes on one canister, and Mr Pereira starts you again with a bare one.');
    return box;
  }
  function openBench() {
    if (!bnBox) bnBox = build();
    inLock = true;
    ER.open('ov-lock', bnBox, function () { inLock = false; });
  }
  function after() {
    var ans = ER.flag('e-ans') || { o: [], w: {} }, note = '';
    busy = true; paint(); AP.learn('procedure');
    ans.o.forEach(function (c, i) { note += '<p>' + (i + 1) + '. ' + CARDS[c].replace(/<u[^>]*><\/u>/, '<b>' + mended(c, ans.w) + '</b>') + '</p>'; });
    AP.mine('words', 'The good words', note + '<p>Two cards were torn in half: they are not here.</p>', true);
    ER.narrate([
      'Pereira switches on the fan, and holds a strip of thin paper under the bottom of the canister. The paper lifts, and sticks to the screen.',
      '&ldquo;In at the bottom,&rdquo; he says. &ldquo;Through the grains. Out at the top, and away down the hose. One way in, one way out.&rdquo;',
      '&ldquo;And three places where a tired man would have had to guess. ' + [1, 2, 3].map(function (n) { return ans.w[n] || ''; }).join('. ') + '. Now he will not have to.&rdquo; He picks up the telephone.',
      'At twenty-two minutes past seven the speaker on the wall clicks. This morning&rsquo;s CAPCOM is Joe Kerwin, who is an astronaut and a doctor as well. He begins with a list of things to find.'
    ], function () {
      AP.sfx.squawk();
      ER.narrate([
        AP.said('Houston', '&hellip; two command module lithium hydroxide canisters, a roll of the gray tape, the two LCGs, because we&rsquo;re going to use the bags from the LCGs, and one - one LM cue card &hellip;'),
        'And then, before the first step:',
        AP.said('Houston', 'Okay, Jack. Did anybody ever tell you that you got a 60-day extension on your income tax. Over.'),
        '&ldquo;The fifteenth of April,&rdquo; says Pereira. &ldquo;Tax day. Jack Swigert joined this crew two days before lift-off, and he never sent his form in.&rdquo; It is the first time since Monday that you have heard anybody laugh.',
        'Then Kerwin reads, one step at a time, and three men who cannot see this bench build the thing with their hands. It takes them three quarters of an hour.',
        AP.said('Swigert', 'Okay. Our do-it-yourself lithium hydroxide canister change is complete.')
      ], function () {
        ER.narrate([
          'They build a second one. At twenty to eleven a warning light comes on in Aquarius: too much carbon dioxide. By a quarter past eleven the air in the cabin is going through two square canisters. Half an hour later Fred Haise asks how they are doing.',
          AP.said('Houston', 'We are reading 0.2 on our CO2 sets here, and we&rsquo;re all delighted. It seems to be working fine.'),
          AP.said('Haise', 'Boy, that is great.'),
          'One more thing. When Kerwin came to the hole in the bottom, he had to say: ' + AP.said('', '&hellip; and I forgot to tell you to get something to stick in that hole.') + ' So Jack Swigert cut a piece off a towel.',
          '&ldquo;Even good words lose something on the way up,&rdquo; says Pereira. &ldquo;That is why you want good men at the other end.&rdquo; He peels a last piece of tape off his sleeve. &ldquo;Go and sleep, co-op. They have two days still to go.&rdquo;'
        ], function () {
          AP.mine('heard3', 'Heard on the speaker, Wednesday morning', '<p>08:23, Jack Swigert:</p><p><span class="said">&ldquo;Okay. Our do-it-yourself lithium hydroxide canister change is complete.&rdquo;</span></p><p>11:46, Houston, on the carbon dioxide in the cabin:</p>' +
            '<p><span class="said">&ldquo;We are reading 0.2 on our CO2 sets here, and we&rsquo;re all delighted. It seems to be working fine.&rdquo;</span></p>', true);
          busy = false; paint();
        });
      });
    });
  }
})();
</script>
