<style>
  body{--bg:#1a1610;--accent:#ffd27a;--font-display:'Abril Fatface',serif;--font-ui:'Oswald',sans-serif;--font-body:'Libre Caslon Text',serif;

  .lb{font-family:'Oswald',sans-serif;font-weight:500;text-anchor:middle;letter-spacing:.14em}

  @keyframes pp{50%{transform:translateY(-3px)}}
  .lampc{animation:lc 5s steps(1,end) infinite}
  @keyframes lc{60%{opacity:.85}62%{opacity:1}}
  #board.ready,#tape.ready{animation:nudge 1.6s ease-in-out infinite}

  /* the relay board */
  .rb{display:grid;grid-template-columns:minmax(0,720px) 220px;gap:18px;width:min(970px,97vw);align-items:start}
  .rb-main{padding:14px 18px 12px;background:#efe6cc;color:#22201b;border:10px solid #5a4a36;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .rb-main h6{margin:0 0 10px;font-family:'Abril Fatface',serif;font-weight:normal;font-size:21px;color:#7a1d14;text-align:center;letter-spacing:.04em}
  .rb-map{display:block;width:100%;height:auto;margin-bottom:8px}
  .rb-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:10px;padding:6px 0;border-top:1px dotted #8a7a5a;font-family:'Libre Caslon Text',serif;font-size:16px;line-height:1.3}
  .rb-row small{display:block;font-family:'Courier Prime',monospace;font-size:13px;color:#6b6552}
  .rb-foot{display:flex;justify-content:flex-end;margin-top:8px}
  .rb-foot .btn{--accent:#22201b}.rb-foot .btn:hover:not([disabled]){color:#efe6cc}
  /* the decode slip */
  .dc{display:grid;grid-template-columns:minmax(0,740px) 210px;gap:18px;width:min(990px,97vw);align-items:start}
  .dc-papers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
  .dc-p{padding:10px 12px;text-align:left;cursor:pointer;border:3px solid transparent;font-size:13.5px;line-height:1.35;box-shadow:0 8px 18px rgba(0,0,0,.45)}
  .dc-p:hover{border-color:#ffd27a}
  .dc-p.on{border-color:#7a1d14}
  .dc-p.no{opacity:.45}
  .dc-p h5{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .dc-p.m{background:#f3e3b8;color:#2a2212;font-family:'Courier Prime',monospace;font-weight:700}
  .dc-p.w{background:#f2efe2;color:#1a1a1a;font-family:'IBM Plex Mono',monospace;text-transform:uppercase}
  .dc-slip{padding:12px 16px;background:#fbf8ee;color:#22201b;border-top:6px solid #7a1d14;box-shadow:0 12px 26px rgba(0,0,0,.5)}
  .dc-slip.off{opacity:.35;pointer-events:none}
  .dc-slip h6{margin:0 0 6px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6b6552}
  .dc-f{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;align-items:start;padding:5px 0;border-top:1px dotted #b9ad8c}
  .dc-f > span{font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#7a1d14;padding-top:5px}
  .dc-ch{display:flex;flex-wrap:wrap;gap:5px}
  .dc-ch button{padding:4px 9px;border:1px solid #8a7a5a;background:#f3ecd8;font-family:'Libre Caslon Text',serif;font-size:14px;color:#22201b;cursor:pointer;border-radius:2px}
  .dc-ch button.on{background:#22201b;color:#fbf8ee}
  .dc-ch button.ok{background:#2d6a34;color:#fff;border-color:#2d6a34}
  .dc-ch button.no{background:#9a2a1c;color:#fff;border-color:#9a2a1c}
  .dc-foot{display:flex;justify-content:flex-end;margin-top:8px}
  .dc-foot .btn{--accent:#22201b}.dc-foot .btn:hover:not([disabled]){color:#fbf8ee}
  @media (max-width:900px){.rb,.dc,.dc-papers{grid-template-columns:1fr}}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, stage = 0, nextFile = null, rbBox = null, dcBox = null, inRb = false, inDc = false;

  ER.init({
    theme: 'history', story: 'everest', storyTitle: 'Snow Conditions Bad', id: 'times', no: 'V', title: 'Printing House Square',
    go: 'Untie the third bundle', back: '../index.html', backLabel: 'Archive',
    intro: [
      'On Mr Dunmore&rsquo;s board each paper was pinned at the day its news set out from the mountain. The packet was written on a Sunday and came on foot, and a runner takes eight days, so it left Base Camp on Sunday 24 May. Mr Baptiste&rsquo;s &ldquo;runner from Base Camp&rdquo; came in the same morning from the same place, so his news set out on the same day. Both left before the first attempt on the summit, on 26 May: neither could know how the climb ended. Mr Morris&rsquo;s message was written at Base Camp on 30 May, after he came down. It could.',
      'You untie the third bundle. It smells of printer&rsquo;s ink. Inside is a newspaper, folded open at an inside page, because in 1953 the front page of The Times is all advertisements.',
      'Then it is Monday 1 June 1953, twenty past seven in the evening in London, and you are fifteen, and you are a copy boy at The Times, in Printing House Square. When anybody shouts &ldquo;Copy!&rdquo;, that means you.'
    ],
    exit: {"next":"mall","w":{"75317daa":"09b5c301"}}, tags: {"k1":["686b7ee3"],"k2":["593d0f2a"],"k3":["342bf66a"],"src":["4ea282c2"],"d1":["fe85e6e0"],"d2":["dbf0eff6"],"d3":["e5aec7a9"],"d4":["3a94af06"]},
    hints: hints, onBegin: begin
  });
  stage = ER.flag('x-st') || 0; nextFile = ER.flag('x-file') || null;

  function isBusy() { return busy; }
  function setStage(n) { stage = n; ER.flag('x-st', n); paint(); }
  function clock(m) {
    $('#hh').setAttribute('transform', 'rotate(' + (((m / 60) % 12) * 30) + ' 1010 200)');
    $('#mh').setAttribute('transform', 'rotate(' + ((m % 60) * 6) + ' 1010 200)');
  }
  function paint() {
    document.body.classList.toggle('quiet', stage !== 1);
    $('#board').classList.toggle('ready', stage === 0 && !nextFile);
    $('#tape').classList.toggle('ready', stage === 1);
    clock(nextFile ? 1320 : stage >= 1 ? 1240 : 1160);
    ER.pips(nextFile ? 2 : stage, 2);
    if (nextFile) $('#go').classList.add('on');
  }
  function hints() {
    if (nextFile) return ['go', ['The paper is going to press. Use the button at the bottom of the screen.']];
    if (inDc || stage === 1) return ['decode', [
      'Two papers came in together. Only one is from Mr Morris, in the code. The other is an agency report in plain English. A phrase is only code in a message from your own man.',
      'Then decode Mr Morris&rsquo;s message with the code card in your notebook: the news, the first climber, the day, the second climber.',
      'The day: YESTERDAY is counted from the day the message was written, not the day it arrived. The top of the message says where and when it was written.'
    ]];
    if (inRb || stage === 0) return ['board', [
      'Kathmandu clocks are 5 hours 30 minutes ahead of Greenwich. Take that away from 23.10. Is London on Greenwich time in June? (The wireless notice from Namche, in your notebook.)',
      'How long does a telegram take from Kathmandu? Yesterday&rsquo;s is on the spike. Change its Kathmandu stamp into London time the same way, and compare it with its London stamp.',
      'The latest it can arrive: the board on the left says when the last news goes in, and how long the night desk needs from the moment a message arrives.'
    ]];
    return null;
  }

  function begin() {
    paint();
    EV.need('code', 'The code card', EV.CODE, 'code', 'From the tin');
    EV.need('wireless', 'The wireless post notice', EV.WIRELESS, 'notice2', 'On the wall');
    if (ER.flag('x-in')) { busy = false; ER.say(nextFile ? 'The newsroom. The presses are running under your feet.' : stage === 1 ? 'The newsroom. Two papers have just come in.' : 'The newsroom. Mr Thwaite is staring at the board.'); return; }
    EV.learn('deadline', 'copy boy');
    ER.narrate([
      'The newsroom of The Times: a long brown room full of green lamps, typewriters and pipe smoke. Tomorrow the Queen is crowned, and the whole paper is about it: the route, the Abbey, the robes, the weather (wet).',
      'Only one man in the room is not thinking about the Coronation. Mr Thwaite, the night editor, has been waiting for a message from the Himalaya for three days. He has the London copy of the code card in his waistcoat pocket, and he has read it so often that the corners have gone soft.',
      'At twenty past seven Mr Okoro, who takes telephone messages at night and studies law in the daytime, puts his hand over the mouthpiece. &ldquo;The cable company, Mr Thwaite. A message for us from Kathmandu is on its way. Handed in at Kathmandu at twenty-three ten.&rdquo;',
      'Mr Thwaite goes white. &ldquo;Ten past eleven! The last news goes in at eleven! It has missed the paper by ten minutes!&rdquo;',
      'Mr Okoro does not go white. &ldquo;Sir,&rdquo; he says politely, &ldquo;which eleven?&rdquo; Mr Thwaite stares at him. Then he points at you. &ldquo;Copy! The board. Work it out. In London time, if you please.&rdquo;'
    ], function () { busy = false; ER.flag('x-in', 1); paint(); });
  }

  var YEST = '<h4>Yesterday&rsquo;s telegram from Kathmandu</h4><div class="hd">STAMPS: HANDED IN KATHMANDU 31 MAY 1015 &middot; RECEIVED LONDON 31 MAY 0745</div><p class="body">EMBASSY KATHMANDU TO TIMES LONDON YOUR LETTERS RECEIVED STOP NOTHING FURTHER</p><p class="hw">On the spike. Kathmandu stamps are Kathmandu time; London stamps are London time.</p>';
  $('#slate').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: EV.TIMETABLE, cls: 'slate', clue: { id: 'timetable', title: 'The Coronation number', kind: 'The night desk’s board' }, done: function () { EV.learn('plates', 'proof'); } });
  });
  $('#spike').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: YEST, cls: 'tgram', clue: { id: 'yest', title: 'Yesterday’s telegram', kind: 'On the spike' }, done: function () { ER.flag('x-y', 1); } });
  });
  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (stage > 0 || nextFile) { ER.say('The board. Three clocks, all set, and twenty minutes to spare.'); return; }
    openRb();
  });
  $('#tape').addEventListener('click', function () {
    if (busy) return;
    if (stage !== 1) { ER.say(stage === 0 ? 'The agency teleprinter. It types news from all over the world, all night, whether anybody reads it or not.' : 'The agency teleprinter, chattering about the weather on the Coronation route.'); return; }
    openDc();
  });
  EV.thing('#window', null, 'The dome of St Paul&rsquo;s against the night, and the Coronation lights along the river. It has been raining on and off all day.', isBusy);
  EV.thing('#thwaite', null, function () { return nextFile ? 'Mr Thwaite is reading his own story for the third time. He is smiling, which nobody has seen before.' : stage === 1 ? '&ldquo;Failed,&rdquo; says Mr Thwaite, to nobody. &ldquo;The card says failed.&rdquo;' : '&ldquo;London time!&rdquo; says Mr Thwaite. &ldquo;The board!&rdquo;'; }, isBusy);
  EV.thing('#okoro', 'copytaker', function () { return stage === 1 ? '&ldquo;Read both,&rdquo; says Mr Okoro quietly. &ldquo;Then ask who wrote each one. That is what my law books say about evidence.&rdquo;' : 'Mr Okoro, at the telephones. &ldquo;Kathmandu stamps are Kathmandu time,&rdquo; he says. &ldquo;Everybody forgets.&rdquo;'; }, isBusy);

  /* ---------- the relay board ---------- */
  var MAP = '<svg class="rb-map" viewBox="0 0 680 120"><rect width="680" height="120" fill="#e6dcbc"/><path d="M40 90Q300 -20 640 40" stroke="#7a1d14" stroke-width="3" fill="none" stroke-dasharray="9 6"/>' +
    '<g fill="#7a1d14"><circle cx="40" cy="90" r="7"/><circle cx="250" cy="44" r="5"/><circle cx="640" cy="40" r="7"/></g><g font-family="\'Oswald\',sans-serif" font-size="14" fill="#22201b" letter-spacing="1"><text x="50" y="110">KATHMANDU (G.M.T. + 5 h 30)</text><text x="222" y="34">DELHI</text><text x="520" y="70">LONDON (summer time)</text></g></svg>';
  function buildRb() {
    var b = ER.el('div', 'rb'), msgEl, lock = false;
    b.innerHTML = '<div class="rb-main"><h6>Kathmandu to London</h6>' + MAP +
      '<div class="rb-row" id="r1"><div>Our message was handed in at Kathmandu at 23.10, Kathmandu time. In London that was:<small>KATHMANDU STAMP 1 JUN 2310</small></div></div>' +
      '<div class="rb-row" id="r2"><div>So it should reach us, if it travels like yesterday&rsquo;s, at:<small>YESTERDAY&rsquo;S IS ON THE SPIKE</small></div></div>' +
      '<div class="rb-row" id="r3"><div>The latest it can reach us and still be in the paper:<small>THE NIGHT DESK&rsquo;S BOARD</small></div></div>' +
      '<div class="rb-foot"><button type="button" class="btn" id="rb-go">Tell Mr Thwaite</button></div></div>' +
      '<div class="lk-side"><div class="lk-face">' + EV.FACE('thwaite') + '</div><h6 class="lk-h">Mr Thwaite</h6><p class="pmsg"></p></div>';
    msgEl = b.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    var s1 = EV.setter({ val: 1160, min: 0, max: 1425, step: 10 }), s2 = EV.setter({ val: 1160, min: 0, max: 1425, step: 10 }), s3 = EV.setter({ val: 1160, min: 0, max: 1425, step: 10 });
    b.querySelector('#r1').appendChild(s1.el); b.querySelector('#r2').appendChild(s2.el); b.querySelector('#r3').appendChild(s3.el);
    b.querySelector('#rb-go').addEventListener('click', function () {
      if (lock) return;
      var a = s1.get(), c = s2.get(), d = s3.get(), o1 = ER.check('k1', String(a)), o2 = ER.check('k2', String(c)), o3 = ER.check('k3', String(d));
      s1.mark(o1 ? 'ok' : 'no'); s2.mark(o2 ? 'ok' : 'no'); s3.mark(o3 ? 'ok' : 'no');
      if (!o1) { EV.slip(); ER.sfx.no(); msg(a === 1390 ? '&ldquo;That is Kathmandu&rsquo;s own clock. I asked for London.&rdquo;' : a === 1060 ? 'Mr Okoro coughs. &ldquo;That is Greenwich time, I think. Is London on Greenwich time in June?&rdquo;' : '&ldquo;Kathmandu is five and a half hours ahead of Greenwich. Greenwich first, then London.&rdquo;'); return; }
      if (!o2) { EV.slip(); ER.sfx.no(); msg('&ldquo;How long did yesterday&rsquo;s take? Change its Kathmandu stamp into London time, the same way you did ours. Then see how long it was on the wire.&rdquo;'); return; }
      if (!o3) { EV.slip(); ER.sfx.no(); msg(d >= 1380 ? '&ldquo;If it comes at eleven, it is too late. The board on the left: from the moment it arrives, how long does the desk need?&rdquo;' : '&ldquo;Last news at eleven. Decode, write, set and read the proofs: add them up, and take them away from eleven.&rdquo;'); return; }
      lock = true; ER.flag('x-rb', [a, c, d].join('-')); ER.sfx.ok();
      msg('Mr Thwaite sits down very suddenly. &ldquo;Twenty minutes,&rdquo; he says. &ldquo;Twenty minutes to spare.&rdquo; He takes off his eyeshade and wipes his face with it. &ldquo;Thank you, Okoro. And you, Copy.&rdquo;');
      setTimeout(function () { ER.closeAll(); arrive(); }, 2600);
    });
    b.first = function () { msg('&ldquo;Three clocks, all in London time. When did it leave Kathmandu, when will it get here, and when is too late? Quickly, if you please.&rdquo;'); };
    return b;
  }
  function openRb() { var f = !rbBox; if (!rbBox) rbBox = buildRb(); inRb = true; ER.open('ov-lock', rbBox, function () { inRb = false; }); if (f) rbBox.first(); }

  function arrive() {
    busy = true; inRb = false;
    var r = String(ER.flag('x-rb') || '').split('-');
    EV.mine('relay', 'Kathmandu to London', '<p>Handed in at Kathmandu 23.10 = <b>' + EV.clock(+r[0]) + '</b> in London (Kathmandu is 5 h 30 ahead of Greenwich, and London in summer is 1 h ahead of Greenwich).</p><p>Expected here: <b>' + EV.clock(+r[1]) + '</b>. Latest: <b>' + EV.clock(+r[2]) + '</b>.</p>', true);
    ER.narrate([
      'For an hour nobody does any work at all, except Mr Okoro, who does the work of three people because nobody else is.',
      'At twenty to nine his telephone rings. He listens, and types, very carefully, every word. At the same moment, at the other end of the room, the agency teleprinter begins to chatter: a flash from Kathmandu.',
      'Mr Thwaite reads the teleprinter first, because it is nearer. Then he takes the code card out of his waistcoat pocket, and reads it, and sits down again. &ldquo;WEATHER IMPROVING,&rdquo; he says. &ldquo;The card says that means an attempt has failed.&rdquo;',
      '&ldquo;Copy,&rdquo; he says, in a small voice. &ldquo;Both papers. Tell me what we have got.&rdquo;'
    ], function () { setStage(1); busy = false; });
  }

  /* ---------- the decode slip ---------- */
  var F = [['d1', 'The news', [['sum', 'Summit reached'], ['fail', 'An attempt has failed'], ['end', 'No more attempts'], ['none', 'Nothing yet']]],
    ['d2', 'First climber', [['bou', 'Bourdillon'], ['eva', 'Evans'], ['hil', 'Hillary'], ['hun', 'Hunt'], ['low', 'Lowe'], ['ten', 'Tenzing']]],
    ['d3', 'Day of the climb', [['28', 'Thu 28 May'], ['29', 'Fri 29 May'], ['30', 'Sat 30 May'], ['31', 'Sun 31 May'], ['32', 'Mon 1 June']]],
    ['d4', 'Second climber', [['bou', 'Bourdillon'], ['eva', 'Evans'], ['hil', 'Hillary'], ['hun', 'Hunt'], ['low', 'Lowe'], ['ten', 'Tenzing']]]];
  function buildDc() {
    var b = ER.el('div', 'dc'), src = '', pick = {}, msgEl, lock = false;
    b.innerHTML = '<div><div class="dc-papers">' +
      '<button type="button" class="dc-p m" data-s="m"><h5>Telephoned to Mr Okoro, 20.40</h5>FROM KATHMANDU 1 JUN 2310 &middot; FROM MORRIS BASE CAMP 30 MAY &middot; SNOW CONDITIONS BAD STOP ADVANCED BASE ABANDONED YESTERDAY STOP AWAITING IMPROVEMENT</button>' +
      '<button type="button" class="dc-p w" data-s="w"><h5>Agency teleprinter, 20.40</h5>WORLDWIRE &middot; KATHMANDU JUNE 1: EVEREST EXPEDITION. WEATHER IMPROVING AT BASE CAMP, SAY RUNNERS. NEW ATTEMPT ON SUMMIT EXPECTED SHORTLY. EARLIER REPORTS OF SUCCESS NOT CONFIRMED.</button></div>' +
      '<div class="dc-slip off"><h6>Decoded for the night editor</h6>' +
      F.map(function (f) { return '<div class="dc-f" data-f="' + f[0] + '"><span>' + f[1] + '</span><div class="dc-ch">' + f[2].map(function (o) { return '<button type="button" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div></div>'; }).join('') +
      '<div class="dc-foot"><button type="button" class="btn" id="dc-go">Give it to Mr Thwaite</button></div></div></div>' +
      '<div class="lk-side"><div class="lk-face">' + EV.FACE('okoro') + '</div><h6 class="lk-h">Mr Okoro</h6><p class="pmsg"></p></div>';
    msgEl = b.querySelector('.pmsg');
    var slip = b.querySelector('.dc-slip');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    ER.$$('.dc-p', b).forEach(function (p) {
      p.addEventListener('click', function () {
        if (lock || src) return;
        var s = p.getAttribute('data-s');
        if (!ER.check('src', s)) {
          EV.slip(); ER.sfx.no(); p.classList.add('no');
          msg('&ldquo;That is Worldwire, in plain English,&rdquo; says Mr Okoro. &ldquo;In a Worldwire report, words mean what they say. The card only works on a message from our own man. Who wrote each one?&rdquo;');
          return;
        }
        src = s; ER.flag('x-src', s); p.classList.add('on'); slip.classList.remove('off'); EV.sfx.pencil(); ER.sfx.ok();
        msg('&ldquo;Our own man, in our own code,&rdquo; says Mr Okoro. &ldquo;The weather in the other one is just weather. Now: what does ours say?&rdquo;');
      });
    });
    ER.$$('.dc-f', b).forEach(function (f) {
      var k = f.getAttribute('data-f');
      ER.$$('button', f).forEach(function (bt) {
        bt.addEventListener('click', function () {
          if (lock) return;
          pick[k] = bt.getAttribute('data-v');
          ER.$$('button', f).forEach(function (o) { o.classList.remove('on', 'ok', 'no'); }); bt.classList.add('on'); EV.sfx.tick();
        });
      });
    });
    b.querySelector('#dc-go').addEventListener('click', function () {
      if (lock || !src) return;
      if (F.some(function (f) { return !pick[f[0]]; })) { msg('&ldquo;Every line, please. Mr Thwaite will not print a perhaps.&rdquo;'); return; }
      var bad = '';
      F.forEach(function (f) {
        var k = f[0], ok = ER.check(k, pick[k]), bt = b.querySelector('.dc-f[data-f="' + k + '"] button[data-v="' + pick[k] + '"]');
        bt.classList.remove('on'); bt.classList.add(ok ? 'ok' : 'no');
        if (!ok && !bad) {
          if (k === 'd3') bad = pick[k] === '32' ? '&ldquo;Today? YESTERDAY is counted from the day he wrote it, not the day we got it.&rdquo;' : pick[k] === '31' ? '&ldquo;That is yesterday from today&rsquo;s point of view, or from Namche&rsquo;s. Count from the day he wrote it. The top of the message says when.&rdquo;' : pick[k] === '30' ? '&ldquo;That is the day he wrote it. And the code word is YESTERDAY.&rdquo;' : '&ldquo;The 28th is Worldwire&rsquo;s day, and Worldwire did not see it. Count from the day our man wrote his message.&rdquo;';
          else if (k === 'd1') bad = '&ldquo;Read the first phrase of ours against the card again. Only ours.&rdquo;';
          else bad = (k === 'd2' && pick.d2 === 'ten' && pick.d4 === 'hil') ? '&ldquo;The right two names, I think, but the card puts the climbers in the order of the alphabet. Which phrase comes first in his message?&rdquo;' : '&ldquo;Find each phrase of his on the card, under THE CLIMBERS. Which man is it?&rdquo;';
        }
      });
      if (bad) { EV.slip(); ER.sfx.no(); msg(bad); return; }
      lock = true; ER.flag('x-dc', [pick.d1, pick.d2, pick.d3, pick.d4].join('-')); ER.sfx.ok();
      msg('Mr Okoro reads the slip, and reads it again, and very slowly begins to smile.');
      setTimeout(function () { ER.closeAll(); press(); }, 2400);
    });
    b.first = function () { msg('&ldquo;Two papers, the same minute, the same city,&rdquo; says Mr Okoro. &ldquo;Which one is in our code? Click it. Then decode it with the card.&rdquo;'); };
    return b;
  }
  function openDc() { var f = !dcBox; if (!dcBox) dcBox = buildDc(); inDc = true; ER.open('ov-lock', dcBox, function () { inDc = false; }); if (f) dcBox.first(); }

  function press() {
    busy = true; inDc = false; EV.mood('calm');
    var NAMES = {}, d = String(ER.flag('x-dc') || '').split('-');
    F[1][2].forEach(function (o) { NAMES[o[0]] = o[1]; });
    var DAYN = {}; F[2][2].forEach(function (o) { DAYN[o[0]] = o[1].replace('Thu', 'Thursday').replace('Fri', 'Friday').replace('Sat', 'Saturday').replace('Sun', 'Sunday').replace('Mon', 'Monday'); });
    ER.narrate([
      'You give Mr Thwaite the slip. He reads it once, and puts it down, and puts both his hands flat on the desk, as if the desk might float away.',
      '&ldquo;' + (NAMES[d[1]] || '') + ' and ' + (NAMES[d[3]] || '') + ',&rdquo; he says. &ldquo;On ' + (DAYN[d[2]] || 'the day') + '. On the top.&rdquo; Then, in a voice that the whole room hears: &ldquo;EVEREST!&rdquo;',
      'Nobody in the newsroom of The Times has ever cheered before. They do now. Somebody throws a pencil in the air, and it lands in somebody else&rsquo;s tea.',
      'Mr Thwaite writes the story himself, in forty minutes, without crossing out a word. &ldquo;Copy!&rdquo; You run it down the stairs to the composing room, where the men are waiting at their machines. It is set in type, read, and read again. At eleven o&rsquo;clock, London time, it is in the paper.',
      'At midnight the presses start, two floors down, and the whole building shakes very gently, like a ship.'
    ], function () {
      var file = ER.exitOk([ER.flag('x-rb') + '|' + ER.flag('x-src') + '|' + ER.flag('x-dc')]);
      if (!file) { busy = false; ER.say('Something is wrong: tell your teacher.'); return; }
      nextFile = file; ER.flag('x-file', file); setStage(2);
      var st = ER.state(); st.done = st.done || {}; st.done.times = 1; ER.persist(true);
      busy = false; paint();
    });
  }
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; EV.solved(true);
    setTimeout(function () { ER.leave(nextFile); }, 1000);
  });
})();
</script>
</body>
</html>
