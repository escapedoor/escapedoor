  /* ---------- the print: four lines, and what they say ---------- */
  function makeLines() {
    var O = PH.OBJ, ITEMS = [O.bollard, O.dog, O.boy, O.bin], NAMES = ['the bollard', 'the dog', 'the boy', 'the litter bin'];
    var st = ER.flag('b-st') || { l: {}, v: {} }, wait = false, box = ER.el('div', 'job sh'), s, drag = null;
    s = '<div class="sh-top"><div class="sh-print"><svg viewBox="40 40 560 560"><g id="shart">' + PH.lake({ id: 'sa', time: 'eve' }) + '</g><g id="rings"></g><g id="lines"></g><g id="draft"></g></svg></div>' +
      '<div class="vcard"><h5>What the shadows say<small>chinagraph first, then answers</small></h5>' +
      '<div class="vrow"><h6>Which shadow goes its own way?</h6><div class="seg" data-d="odd"><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button></div></div>' +
      '<div class="vrow"><h6>What made that shadow?</h6><div class="seg" data-d="src"><button type="button" data-v="lamp">THE FLOODLIGHT</button><button type="button" data-v="flash">A CAMERA FLASH</button><button type="button" data-v="sun2">A SECOND SUN</button><button type="button" data-v="lake">THE LAKE</button></div></div>' +
      '<div class="vrow"><h6>Where is the sun?<small>the camera faced north</small></h6><div class="seg" data-d="dir"><button type="button" data-v="e">EAST</button><button type="button" data-v="s">SOUTH</button><button type="button" data-v="w">WEST</button><button type="button" data-v="n">NORTH</button></div></div>' +
      '<div class="vrow"><h6>How high is it?</h6><div class="seg" data-d="hi"><button type="button" data-v="high">HIGH: SHADOWS SHORTER THAN THE THINGS</button><button type="button" data-v="low">LOW: SHADOWS LONGER THAN THE THINGS</button></div></div>' +
      '<div class="vrow"><h6>So the picture was taken</h6><div class="seg" data-d="when"><button type="button" data-v="morn">6.30&ndash;8 AM</button><button type="button" data-v="mid">11 AM&ndash;3 PM</button><button type="button" data-v="eve">5.30&ndash;7.45 PM</button><button type="button" data-v="dark">AFTER DARK</button></div></div>' +
      '</div></div><div class="job-foot"><p class="jmsg"></p><button type="button" class="btn" id="s-go">Ring Lorna</button></div>';
    box.innerHTML = s;
    var svg = box.querySelector('svg'), msgEl = box.querySelector('.jmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('b-st', st); }
    function d2(a, b) { return Math.sqrt((a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1])); }
    /* Hammond's rings round the four shadows */
    (function () {
      var g = '';
      ITEMS.forEach(function (it, i) {
        var base = i === 3 ? [it.top[0], 450] : [it.top[0], it.tip[1] + (i === 0 ? 8 : i === 1 ? 4 : 2)], cx = (base[0] + it.tip[0]) / 2, cy = (base[1] + it.tip[1]) / 2, rx = Math.abs(it.tip[0] - base[0]) / 2 + 22;
        g += '<ellipse cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" rx="' + rx.toFixed(1) + '" ry="15" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 3" opacity=".9" transform="rotate(' + (Math.atan2(it.tip[1] - base[1], it.tip[0] - base[0]) * 180 / Math.PI).toFixed(1) + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')"/>' +
          '<circle cx="' + (cx + (i === 3 ? rx + 12 : -rx - 12)).toFixed(1) + '" cy="' + (cy + 4).toFixed(1) + '" r="11" fill="#c0392b"/><text x="' + (cx + (i === 3 ? rx + 12 : -rx - 12)).toFixed(1) + '" y="' + (cy + 9).toFixed(1) + '" font-family="Libre Franklin,sans-serif" font-weight="900" font-size="14" text-anchor="middle" fill="#fff">' + (i + 1) + '</text>';
      });
      box.querySelector('#rings').innerHTML = g;
    })();
    function draw() {
      var g = '';
      ITEMS.forEach(function (it, i) {
        if (!st.l[i + 1]) return;
        var a = it.tip, b = it.top, dx = b[0] - a[0], dy = b[1] - a[1], k = i === 3 ? 3.0 : 6;
        g += '<path d="M' + (a[0] - dx * 0.25).toFixed(1) + ' ' + (a[1] - dy * 0.25).toFixed(1) + 'L' + (a[0] + dx * k).toFixed(1) + ' ' + (a[1] + dy * k).toFixed(1) + '" stroke="#e8322a" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>';
        g += '<circle cx="' + a[0].toFixed(1) + '" cy="' + a[1].toFixed(1) + '" r="3.5" fill="#e8322a"/>';
      });
      box.querySelector('#lines').innerHTML = g;
      ER.$$('.seg', box).forEach(function (sg) { var d = sg.getAttribute('data-d'); ER.$$('button', sg).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === st.v[d]); }); });
    }
    svg.addEventListener('pointerdown', function (e) {
      if (wait || nextFile || e.button) return;
      e.preventDefault();
      var p = ER.pt(svg, e); drag = { a: [p.x, p.y] };
      try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    });
    svg.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var p = ER.pt(svg, e); drag.b = [p.x, p.y];
      box.querySelector('#draft').innerHTML = '<path d="M' + drag.a[0].toFixed(1) + ' ' + drag.a[1].toFixed(1) + 'L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + '" stroke="#e8322a" stroke-width="2.4" stroke-dasharray="5 3"/>';
    });
    function up(e) {
      if (!drag) return;
      var a = drag.a, b = drag.b, i, hit = -1, near = -1;
      drag = null; box.querySelector('#draft').innerHTML = '';
      try { svg.releasePointerCapture(e.pointerId); } catch (x) {}
      if (!b || d2(a, b) < 12) { msg('Press on the end of a shadow, and drag to the top of the thing that made it.'); return; }
      for (i = 0; i < 4; i++) {
        var it = ITEMS[i];
        if ((d2(a, it.tip) < 24 && d2(b, it.top) < 24) || (d2(b, it.tip) < 24 && d2(a, it.top) < 24)) { hit = i; break; }
        if (d2(a, it.tip) < 24 || d2(b, it.tip) < 24) near = i;
      }
      if (hit < 0) {
        msg(near >= 0 ? 'That starts at the end of shadow ' + (near + 1) + '. Now drag to the very top of ' + NAMES[near] + ', the thing that made it.' :
          'A line goes from the very END of a shadow (the far tip, not the foot) to the TOP of the thing that made it. Start on one of the ringed shadows.');
        return;
      }
      st.l[hit + 1] = 1; keep(); PH.sfx.pen(); draw();
      var n = Object.keys(st.l).length;
      msg('Line ' + (hit + 1) + ', from the end of the shadow to the top of ' + NAMES[hit] + '.' + (n < 4 ? ' ' + ['', 'Three', 'Two', 'One'][n] + ' more.' : ' Four lines. Look at them.'));
    }
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    ER.$$('.seg', box).forEach(function (sg) {
      sg.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('button') : null;
        if (!b || wait || nextFile) return;
        st.v[sg.getAttribute('data-d')] = b.getAttribute('data-v'); keep(); PH.sfx.key(); draw();
      });
    });
    var WRONG = {
      odd: function (v) { return v ? 'Hammond lays his ruler along line ' + v + '. &ldquo;That one runs side by side with two others. Which line goes its own way?&rdquo;' : '&ldquo;Which shadow goes its own way?&rdquo; says Hammond. &ldquo;The lines will tell you.&rdquo;'; },
      src: function (v) { return !v ? '&ldquo;And what made it?&rdquo; says Hammond. &ldquo;Follow line 4 up the print.&rdquo;' : v === 'flash' ? '&ldquo;A flash on the camera throws shadows straight back, away from the camera, behind things. This one lies sideways along the ground. Follow line 4 up the print: what is at the top of it?&rdquo;' :
        v === 'sun2' ? '&ldquo;There is one sun,&rdquo; says Hammond. &ldquo;There has always been one sun. Follow line 4 up the print and see what it runs into.&rdquo;' : '&ldquo;The lake is behind the bin, and a long way off, and water does not throw a sharp shadow like that. Follow line 4 up the print.&rdquo;'; },
      dir: function (v) { return !v ? '&ldquo;Where is the sun?&rdquo; says Hammond. &ldquo;Lines 1, 2 and 3 point back towards it.&rdquo;' : v === 'e' ? '&ldquo;East? The sun&rsquo;s lines climb towards the LEFT of the print. The camera faced north. What is on its left?&rdquo;' :
        v === 's' ? '&ldquo;If the sun were in the south, behind the camera, the shadows would point away from us, north, up the print. These lie across it, to the right.&rdquo;' : '&ldquo;If the sun were in the north, in front of the camera, every shadow would come towards us. These lie across the print, to the right.&rdquo;'; },
      hi: function (v) { return !v ? '&ldquo;High or low?&rdquo; says Hammond. &ldquo;Look at the length of each shadow.&rdquo;' : '&ldquo;Is the boy&rsquo;s shadow shorter than the boy?&rdquo; says Hammond. &ldquo;Lay your pencil along it and see.&rdquo;'; },
      when: function (v) { return !v ? '&ldquo;So when was it taken?&rdquo; says Hammond. &ldquo;Read my card.&rdquo;' : v === 'mid' ? '&ldquo;At midday the sun is in the south and high, and shadows are short and point north. Read my card again.&rdquo;' :
        v === 'morn' ? '&ldquo;In the morning the sun is in the east, and shadows point west, to the LEFT of this print. These point right.&rdquo;' : '&ldquo;After dark there is no sun at all, and these are sun shadows. Three of them, side by side.&rdquo;'; }
    };
    box.querySelector('#s-go').addEventListener('click', function () {
      var n = Object.keys(st.l).length, file, k, ORDER = ['odd', 'src', 'dir', 'hi', 'when'];
      if (wait || nextFile) return;
      if (n < 4) { ER.sfx.no(); msg('&ldquo;' + (n ? ['', 'Three', 'Two', 'One'][n] + (n === 3 ? ' more line' : ' more lines') : 'Four lines') + ',&rdquo; says Hammond. &ldquo;One for each ringed shadow, from the end of the shadow to the top of the thing. Then you will SEE it.&rdquo;'); return; }
      for (k = 0; k < ORDER.length; k++) {
        if (!ER.check(ORDER[k], st.v[ORDER[k]] || '')) { ER.sfx.no(); msg(WRONG[ORDER[k]](st.v[ORDER[k]])); delete st.v[ORDER[k]]; keep(); draw(); return; }
      }
      file = ER.exit([st.v.odd + ':' + st.v.src + '|' + st.v.dir + '|' + st.v.hi + '|' + st.v.when], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('b-file', file);
      PH.mine('sunfound', 'One sun, and a floodlight', '<p>Lines 1, 2 and 3 run side by side, up to the left: one sun, low in the WEST.</p><p>The shadows are about four times as long as the things: a low sun.</p><p>Line 4 runs up to the floodlight. The bin stands in the shadow of the ice-cream kiosk, so the sun cannot make a shadow there, and the lamp can.</p><p>Low in the west, early September: 5.30 to 7.45 in the evening. NOT a fake. (Not proved true, either.)</p>', true);
      msg('&ldquo;One sun,&rdquo; says Hammond, and puts the pencil down. &ldquo;Low in the west. And one floodlight.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Three of the lines run side by side, up to the left, at the same low slope. They all point back to one sun, low in the west, out of the picture on the left.',
          'The fourth climbs the other way, steeply, and runs straight into the floodlight on its post. The litter bin is standing in the long shadow of the ice-cream kiosk, where the sun cannot reach it. The only light there that can throw a shadow is the lamp.',
          '&ldquo;So Lorna&rsquo;s second sun is a floodlight,&rdquo; says Hammond. &ldquo;Switched on early for the concert, I expect. A low sun in the west, in September: between half past five and a quarter to eight in the evening. Which is what Platt said.&rdquo;',
          'He wipes the lines off the print with his thumb. &ldquo;It is not a fake,&rdquo; he says. &ldquo;That does not make it true. Lorna has gone up on the roof, and she will want to argue about the weather.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3000);
    });
    draw();
    msg(Object.keys(st.l).length ? 'The print, with ' + Object.keys(st.l).length + ' of the four lines drawn.' : 'Press on the very end of a ringed shadow and drag to the top of the thing that made it.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
