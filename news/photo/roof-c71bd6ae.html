  .tw{animation:tw 3s ease-in-out infinite}

  /* the record and the four pictures */
  .wx{width:min(1120px,97vw)}
  .wx-rec{background:#fff;padding:8px 10px 6px;box-shadow:0 14px 34px rgba(0,0,0,.5);border-left:8px solid #e6ece9;border-right:8px solid #e6ece9}

  .cells{display:flex;gap:1px;background:#d7e0dd}
  .cell{flex:1 1 0;min-width:0;height:96px;background:#fbfdfc;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px;cursor:pointer;position:relative}
  .cell:hover{background:#eaf4f1}
  .cell b{font-family:'DM Mono',monospace;font-weight:500;font-size:9.5px;color:#16222c;letter-spacing:-.02em}
  .cell i{font-style:normal;font-family:'Outfit',sans-serif;font-weight:600;font-size:12px;color:#16222c}
  .cell svg{width:24px;height:20px;display:block;margin:1px 0}
  .cell u{text-decoration:none;font-family:'DM Mono',monospace;font-size:9px;color:#1f6fa8;min-height:11px}
  .cell .pins{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center}
  .pin{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:12px 12px 12px 2px;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:13px;color:#fff;box-shadow:0 3px 5px rgba(0,0,0,.4);cursor:grab;touch-action:none;transform:rotate(-45deg)}
  .pin span{transform:rotate(45deg)}
  .pin.held{outline:3px solid #ffcf40;outline-offset:2px}
  .pin.fly{position:fixed;z-index:80;pointer-events:none}
  .pin.pA{background:#d8432a}.pin.pB{background:#1f6fa8}.pin.pC{background:#2e8a57}.pin.pD{background:#7a3f8a}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  .pcard{background:#f4f1e8;padding:6px 6px 7px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
  .pcard svg{display:block;width:100%;height:auto;cursor:crosshair}
  .pcard p{margin:5px 2px 0;font-family:'Libre Franklin',sans-serif;font-size:11.5px;line-height:1.25;color:#2a2a1a;min-height:44px}
  .pcard p b{font-weight:900}
  .pcard .slot{display:flex;align-items:center;gap:8px;margin-top:5px;font-family:'DM Mono',monospace;font-size:11px;color:#5a5346}
</style>

  /* ---------- what the weather says ---------- */
  var DIA = '<svg viewBox="0 0 250 330"><g font-family="Kalam,cursive" fill="#1b4f5c" font-size="15">' +
    '<path d="M30 34q20 -26 40 0z" fill="#2b5d8a"/><path d="M50 34v24q0 6 -6 6" stroke="#1b4f5c" stroke-width="2.4" fill="none"/><path d="M36 10l-4 12M52 6l-4 12M68 10l-4 12" stroke="#1f6fa8" stroke-width="2"/><text x="96" y="36">up: raining now</text>' +
    '<path d="M48 82v34" stroke="#2b5d8a" stroke-width="6" stroke-linecap="round"/><ellipse cx="50" cy="122" rx="26" ry="5" fill="#9ccbe8"/><text x="96" y="104">down, ground wet:</text><text x="96" y="122">it rained, then stopped</text>' +
    '<circle cx="40" cy="160" r="10" fill="#f0d3bc"/><g fill="#9ab"><circle cx="58" cy="160" r="4"/><circle cx="68" cy="156" r="5"/><circle cx="78" cy="160" r="4"/></g><text x="96" y="166">breath: cold air</text>' +
    '<path d="M30 220h40" stroke="#1b4f5c" stroke-width="2"/><path d="M48 220v-26" stroke="#1b4f5c" stroke-width="5"/><path d="M28 200h12q4 0 4 -4t-4 -4q-1 -4 -5 -4t-5 4q-4 0 -4 4t2 4z" fill="#9aa4ac" transform="translate(16 -6)"/><text x="96" y="206">no shadow:</text><text x="96" y="224">cloud over the sun</text>' +
    '<path d="M44 290q-20 -30 4 -50q24 20 4 50z" fill="#3f7a3a"/><path d="M48 292v-44" stroke="#2a4a20" stroke-width="2"/><text x="96" y="262">leaves: the season,</text><text x="96" y="280" fill="#c0392b" font-weight="700">never the hour</text>' +
    '<text x="125" y="320" text-anchor="middle" font-size="14">and check the place AND the time</text></g></svg>';
  var CARD = '<h4>Taped inside the weather box &middot; C.H., 1998</h4><h3>What the weather says</h3><div class="two"><div>' +
    '<p>Set the weather in a picture against the <b>weather record</b> for that place and that hour.</p>' +
    '<p><b>UMBRELLAS UP:</b> it is raining now. <b>Umbrellas down and the ground wet:</b> it has rained, and stopped.</p>' +
    '<p><b>WET GROUND AND PUDDLES</b> last after the rain: minutes on a hot windy day, hours on a cool damp one. They tell you that it rained, not when.</p>' +
    '<p><b>BREATH</b> like smoke: the air is cold, usually below about 7&nbsp;&deg;C.</p>' +
    '<p><b>NO SHADOWS AT ALL:</b> the sun is behind cloud, and the sky is <b>overcast</b>. Sharp shadows: it is out, and then the shadows tell you the hour (see the sun card).</p>' +
    '<p><b>LEAVES</b> on the trees tell you the season, never the hour.</p>' +
    '<p>And a record is for one place. A <b>shower</b> can soak the park and miss the airfield three miles away. Check that it rained on both.</p>' +
    '</div><div class="dia">' + DIA + '</div></div><p class="pen">For Lorna, who put a sunny picture of a flood on the front page. C.H.</p>';
  $('#wxbox').addEventListener('click', function () {
    if (busy) return;
    if (!told.lorna) { ER.say('A white wooden box on legs, with slatted sides, like a beehive for thermometers. Lorna is watching you over her flask.'); return; }
    PH.sfx.door();
    ER.read({ html: CARD, cls: 'wx', clue: { id: 'wxcard', title: 'What the weather says', kind: 'Inside the weather box' }, done: function () {
      PH.terms(['overcast', 'shower', 'weather box']);
      if (tell('card')) { paint(); ER.say('Now the record itself: the printout on the bench.'); }
    } });
  });
  function recHtml() {
    function rows(a, b) { var t = '<table><tr><th>Time</th><th>&deg;C</th><th>Sky</th><th>Rain</th></tr>'; for (var i = a; i < b; i++) t += '<tr><td>' + REC[i][0].slice(0, 2) + '.' + REC[i][0].slice(2) + '</td><td>' + REC[i][1] + '</td><td>' + SKY[REC[i][2]] + '</td><td>' + (REC[i][3] ? REC[i][3] + ' mm' : '&ndash;') + '</td></tr>'; return t + '</table>'; }
    return '<h4><span>Cobbleford Airfield &middot; weather record</span><small>SATURDAY 5 SEPTEMBER &middot; EVERY HALF HOUR</small></h4><div class="cols"><div>' + rows(0, 15) + '</div><div>' + rows(15, 29) + '</div></div>' +
      '<p>Sunrise 06.25 &middot; sunset 19.45 &middot; heavy shower 17.15 to 17.45, 6.2 mm in all &middot; rain is what fell in the half hour before the time. The airfield is 3 miles north of Lockyer Park.</p>';
  }
  $('#record').addEventListener('click', function () {
    if (busy) return;
    if (!told.lorna) { ER.say('A printout, held down by Lorna&rsquo;s elbow. She has not offered it to you yet.'); return; }
    ER.read({ html: recHtml(), cls: 'rec', clue: { id: 'record', title: 'The airfield’s record for Saturday', kind: 'A printout' }, done: function () {
      if (tell('rec')) { paint(); ER.say('Breath at seven, sun all day, a shower at half past five, sun again. Now the four pictures on the tablet.'); }
    } });
  });
  PH.thing('#gauge', 'rain gauge', 'Hammond’s old rain gauge, still out on the roof. There is about six millimetres of today’s rain in it. The airfield says 6.2: the shower soaked both.', isBusy);
  PH.thing('#view', null, 'Cobbleford from the roof. Out there is the dark square of Lockyer Park, with the festival field still lit. The airfield says tomorrow will be fine, and the Teapot is meant to fly again at seven.', isBusy);
  PH.thing('#sign', null, 'The back of the agency’s sign: STOPFORD, in red letters a metre high, facing the street. The O has flickered since 1987, and Lorna says it is the most reliable thing in the building.', isBusy);
  PH.thing('#dishes', null, 'Satellite dishes. Pictures used to leave this building on a motorbike. Now they go down the wire, which is not a wire.', isBusy);
  PH.thing('#mast', null, 'An aerial with a red light on top, for aircraft. It blinks once a second, and has done all night, and will do all of tomorrow.', isBusy);
  PH.thing('#pigeons', null, 'Two pigeons, asleep on the parapet. They were here before the satellite dishes, and they mean to be here after them.', isBusy);
  PH.thing('#door', null, 'The door to the stairs. Lou&rsquo;s van is in the yard, four floors down.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#tablet').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Four pictures, four pins. Only one of them is six o&rsquo;clock.'); return; }
    if (!told.lorna) { ER.say('A tablet on the bench, glowing. Lorna has her hand flat on it.'); return; }
    if (!told.card) { ER.say('&ldquo;Read Hammond&rsquo;s card first,&rdquo; says Lorna. &ldquo;Inside the weather box. He will ask me if you did.&rdquo;'); return; }
    if (!told.rec) { ER.say('&ldquo;And the record,&rdquo; says Lorna. &ldquo;You cannot put a picture on a record you have not read.&rdquo; The printout is under her elbow.'); return; }
    if (!lock) lock = makeWall();
    lock.open();
  });

  /* ---------- four pictures, one record ---------- */
  function makeWall() {
    var CARDS = [
      { k: 'A', from: 'Kev, by email, 22.51', says: 'The Teapot just before it came down. 6pm. Do I get money?', vb: '190 70 690 460', art: function () { return PH.lake({ id: 'wa', time: 'dawn' }); } },
      { k: 'B', from: 'Sandra, 23.05', says: 'The Teapot on the ground just after it came down, about six.', vb: '150 140 750 500', art: function () { return PH.field({ id: 'wb', time: 'noon' }); } },
      { k: 'C', from: 'BalloonDad, 23.12', says: 'Six o&rsquo;clock: the Teapot&rsquo;s crew fight to hold it down.', vb: '75 100 900 600', art: function () { return PH.field({ id: 'wc', time: 'shower' }); } },
      { k: 'D', from: 'Gideon Platt, 23.38', says: 'Crowds flee as a runaway balloon plunges into Lockyer Park, Saturday evening.', vb: '40 150 560 373', art: function () { return PH.lake({ id: 'wd', time: 'eve' }); } }
    ];
    var st = ER.flag('c-st') || {}, wait = false, box = ER.el('div', 'job wx'), s;
    s = '<div class="wx-rec"><h6><span>Cobbleford Airfield &middot; Saturday 5 September</span><small>sunrise 06.25 &middot; sunset 19.45 &middot; heavy shower 17.15&ndash;17.45</small></h6><div class="cells">';
    REC.forEach(function (r) {
      s += '<div class="cell" data-t="' + r[0] + '" title="' + r[0].slice(0, 2) + '.' + r[0].slice(2) + ': ' + SKY[r[2]] + '"><b>' + r[0].slice(0, 2) + '.' + r[0].slice(2) + '</b><svg viewBox="0 0 24 20">' + icon(r[2]) + '</svg><i>' + r[1] + '&deg;</i><u>' + (r[3] ? r[3] + 'mm' : '') + '</u><div class="pins"></div></div>';
    });
    s += '</div></div><div class="cards">';
    CARDS.forEach(function (c) {
      s += '<div class="pcard"><svg viewBox="' + c.vb + '"><g id="art' + c.k + '">' + c.art() + '</g></svg><p><b>' + c.k + ' &middot; ' + c.from + '</b><br>&lsquo;' + c.says + '&rsquo;</p>' +
        '<div class="slot"><span class="home" data-k="' + c.k + '"><button type="button" class="pin p' + c.k + '" data-k="' + c.k + '"><span>' + c.k + '</span></button></span><em class="when"></em></div></div>';
    });
    s += '</div><div class="job-foot"><p class="jmsg"></p><button type="button" class="btn" id="w-go">Tell Lorna</button></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.jmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('c-st', st); }
    function nice(t) { return t.slice(0, 2) + '.' + t.slice(2); }
    function draw() {
      CARDS.forEach(function (c) {
        var pin = box.querySelector('.pin[data-k="' + c.k + '"]'), t = st[c.k];
        if (t) box.querySelector('.cell[data-t="' + t + '"] .pins').appendChild(pin);
        else box.querySelector('.home[data-k="' + c.k + '"]').appendChild(pin);
        box.querySelector('.home[data-k="' + c.k + '"]').parentNode.querySelector('.when').textContent = t ? 'on the record at ' + nice(t) : 'not on the record yet';
      });
    }
    ER.$$('.pcard svg', box).forEach(function (sv, i) { var v = CARDS[i].vb.split(' ').map(Number); PH.loupe(sv, 'art' + CARDS[i].k, v[2] / 7, 2.6, [v[0], v[1], v[0] + v[2], v[1] + v[3]]); });
    var kit = PH.place(box, {
      item: '.pin', zone: '.cell, .home', lock: function () { return wait || !!nextFile; },
      drop: function (item, zone) {
        var k = item.getAttribute('data-k'), t = zone.getAttribute('data-t'), o;
        if (!t) { delete st[k]; keep(); draw(); PH.sfx.slip(); msg('Pin ' + k + ' goes back to its picture.'); return; }
        for (o in st) if (st[o] === t && o !== k) delete st[o];
        st[k] = t; keep(); draw(); PH.sfx.pin();
        msg('Picture ' + k + ' at ' + nice(t) + ': ' + SKY[REC.filter(function (r) { return r[0] === t; })[0][2]] + ', ' + REC.filter(function (r) { return r[0] === t; })[0][1] + ' degrees.');
      }
    });
    var WHY = {
      A: function (t) { var h = +t.slice(0, 2); return h >= 8 ? 'Look at the people&rsquo;s mouths through the glass: breath like smoke. Which half hours on the record are cold enough for that?' : t === '0600' ? 'Cold enough, yes. But there are long, sharp shadows: the sun is up. When did it rise?' : 'Look again: breath, and long shadows.'; },
      B: function (t) { return +t.slice(0, 2) >= 17 ? 'Dry grass, T-shirts and sharp shadows. Was it dry and sunny at that time?' : 'Dry and sunny, yes: that fits half the day. Now the shadows. They are short, and they all point away from the camera, towards the spire of St Aldhelm&rsquo;s, which is north. When is the sun due south and shadows shortest?'; },
      C: function (t) { return 'Umbrellas up, and not one shadow. When was it raining, under a sky with no sun in it?'; },
      D: function (t) { var h = +t.slice(0, 2), m = +t.slice(2); return (h < 17 || (h === 17 && m < 45)) ? 'The ground is wet and the umbrellas are down: it has rained, and stopped. When did the shower stop?' : h >= 19 ? 'At seven the sun is so low that the boy&rsquo;s shadow would be ten times as long as he is. In this picture it is about four times. Read the sun card again.' : 'Look again.'; }
    };
    box.querySelector('#w-go').addEventListener('click', function () {
      var left = CARDS.filter(function (c) { return !st[c.k]; }), i, c, file;
      if (wait || nextFile) return;
      kit.hold(null);
      if (left.length) { ER.sfx.no(); msg('&ldquo;' + (left.length === 4 ? 'Not one pin on the record' : left.length === 1 ? 'Picture ' + left[0].k + ' is not on the record' : 'Pictures ' + left.map(function (x) { return x.k; }).join(', ') + ' are not on the record') + ',&rdquo; says Lorna. &ldquo;All four. Then we talk.&rdquo;'); return; }
      for (i = 0; i < CARDS.length; i++) {
        c = CARDS[i];
        if (!ER.check('t' + c.k, st[c.k])) { ER.sfx.no(); msg('&ldquo;Picture ' + c.k + ' at ' + nice(st[c.k]) + '?&rdquo; says Lorna. &ldquo;' + WHY[c.k](st[c.k]) + '&rdquo;'); delete st[c.k]; keep(); draw(); return; }
      }
      file = ER.exit([st.A + '|' + st.B + '|' + st.C + '|' + st.D], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      PH.mine('weather', 'Four pictures on the record', '<p>A (Kev): breath, dry, long shadows WEST. About half past seven in the MORNING: the morning flight. The Teapot going up.</p><p>B (Sandra): dry, sunny, short shadows pointing NORTH. About ONE o&rsquo;clock: the Teapot laid out on the grass.</p><p>C (BalloonDad): umbrellas up, no shadows. HALF PAST FIVE, in the shower. Nothing flying.</p><p>D (Platt): wet ground, umbrellas down, no breath, long shadows EAST. SIX o&rsquo;clock, after the shower. Only D can show the Teapot coming down.</p>', true);
      msg('Lorna looks at the four pins for a long time. &ldquo;So it is the Teapot, at six, in that park, and it is real,&rdquo; she says. &ldquo;I hate this job.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Breath like smoke, and long shadows pointing west: Kev&rsquo;s picture was taken at about half past seven in the morning, on the morning flight. The Teapot in it was going UP.',
          'Short shadows pointing north, towards the spire: Sandra&rsquo;s was taken at about one o&rsquo;clock, when the Teapot was laid out on the grass for people to look at. It had not come down. It had not gone up yet.',
          'Umbrellas up and no shadows at all: BalloonDad&rsquo;s was taken in the shower at half past five, when nothing was flying.',
          'And Platt&rsquo;s: wet ground, umbrellas down, no breath, long shadows pointing east. Six o&rsquo;clock, just after the shower. Of four pictures that said they showed the Teapot coming down, only one could.',
          'Lorna screws the top back on her flask. &ldquo;So who took it? Platt says he did. Platt could not take a picture of a wall.&rdquo; Her phone buzzes. &ldquo;Lou is back. She is in the van in the yard, with every picture from that park on her laptop. Go and ask her.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3000);
    });
    draw();
    msg(Object.keys(st).length ? 'Four pictures, and ' + Object.keys(st).length + ' of them on the record.' : 'Move the mouse over a picture to look closely. Then put its pin on the half hour when it could have been taken.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
</body>
</html>
