<style>

  .ln{animation:ln 1.4s steps(1,end) infinite}
  .ln.l2{animation-delay:-.3s}.ln.l3{animation-delay:-.75s;animation-duration:1.1s}.ln.l4{animation-delay:-.5s}.ln.l5{animation-delay:-1s;animation-duration:1.7s}.ln.l6{animation-delay:-.15s}
  @keyframes ln{0%{fill:#ffcf5a}50%{fill:#5a4a20}}
  #goldfish{animation:swim 9s ease-in-out infinite}
  @keyframes swim{0%{transform:translateX(0)}50%{transform:translateX(34px)}100%{transform:translateX(0)}}
  #drip{animation:drip 2.2s linear infinite}
  @keyframes drip{0%{transform:translateY(0);opacity:1}70%{transform:translateY(150px);opacity:1}71%{opacity:0}100%{transform:translateY(150px);opacity:0}}
  #gaz.ready,#map.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.16)}}
  #wallpins,#printout{display:none}
  #scene.pinned #wallpins,#scene.pinned #printout{display:block}

  /* the map, the tin of flags, the street book */
  .job.mp{width:min(1220px,96vw)}
  .mp-top{display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:14px;align-items:start}
  .mp-top>svg{display:block;width:100%;height:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);touch-action:none}
  .mp .sock{cursor:pointer}
  .mp .sock:hover .ring{stroke:#c23b2c;stroke-width:3.4}
  .mp .mpin{cursor:grab}
  .mp .mpin.sel .hd{stroke:#fff;stroke-width:3.4}
  .mp .mpin.bad .hd{stroke:#ff4b3e;stroke-width:6}
  .mp-side h5{margin:0 0 5px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.2em;color:#f6efe0;display:flex;align-items:baseline;gap:9px}
  .mp-side h5 small{font-family:'Newsreader',serif;font-weight:400;font-style:italic;font-size:14px;letter-spacing:0;color:#d9cdb8}
  .mp-flags{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px 9px;background:#8f98a0;border:1px solid #cfd4d8;border-radius:5px;box-shadow:inset 0 3px 8px rgba(0,0,0,.4)}
  .flag{display:grid;place-items:center;height:38px;border-radius:19px;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:17px;color:#fff;background:#c23b2c;box-shadow:0 3px 4px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.18);touch-action:none;cursor:grab}
  .flag.c2{background:#27457a}.flag.c3{background:#2e8a57}.flag.c4{background:#b2540f}.flag.c5{background:#7a4a9a}.flag.c6{background:#1e8a8a}.flag.c7{background:#4a443c}
  .flag.put{opacity:.42;box-shadow:none}
  .flag.sel{opacity:1;outline:3px solid #fff;outline-offset:2px}
  .flagghost{position:fixed;z-index:80;width:38px;height:38px;margin:-19px 0 0 -19px;pointer-events:none;border-radius:19px;display:grid;place-items:center;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:17px;color:#fff;background:#c23b2c;box-shadow:0 8px 14px rgba(0,0,0,.5)}
  .mp-read{margin:9px 0 9px;min-height:214px}
  .mp-read .sl{font-size:15px}
  .mp-read .sl.t-phone p{font-size:16.5px}
  .mp-read .task{margin:7px 0 0;font-family:'Newsreader',serif;font-size:16px;font-style:italic;color:#ffcf7a}
  .mp-read .where{margin:2px 0 0;font-family:'DM Mono',monospace;font-size:12.5px;letter-spacing:.04em;color:#d9cdb8}
  .mp-read .none{margin:0;padding:26px 20px;border:1px dashed rgba(255,255,255,.3);font-family:'Newsreader',serif;font-style:italic;font-size:16.5px;line-height:1.4;color:#d9cdb8;text-align:center}
  .mp-book{background:#fbf9f1;color:#1d2228;padding:7px 11px 8px;border-left:12px solid #7a2f2f}
  .mp-book .idx{font-family:'Libre Franklin',sans-serif;font-weight:500;font-size:12px;line-height:1.42;-webkit-column-gap:14px;column-gap:14px}
  .mp-book .idx div{white-space:nowrap}
  .mp-book .idx div i{font-family:'DM Mono',monospace;font-weight:500}
  .mp-book .idx h6{font-size:10.5px;margin-top:4px}
  .mp-book .idx small{font-family:'Newsreader',serif;font-style:italic;font-size:12px;line-height:1.22}
</style>

    function nearest(p) {
      var best = null, bd = 24, k2, d;
      for (k2 in SOCK) { d = Math.sqrt(Math.pow(SOCK[k2][0] - p.x, 2) + Math.pow(SOCK[k2][1] - p.y, 2)); if (d < bd) { bd = d; best = k2; } }
      if (!best && p.x > 0 && p.x < 164 && p.y > 396 && p.y < 494) best = 'ask';
      return best;
    }
    function mapPt(e) { var p = ER.pt(svg, e); return { x: p.x - 40, y: p.y - 30 }; }
    /* a flag is clicked and then a ring is clicked; or the flag is dragged, from the tin or from the map */
    box.addEventListener('pointerdown', function (e) {
      var f = e.target.closest ? e.target.closest('[data-pin]') : null, n, sx = e.clientX, sy = e.clientY, moved = false;
      if (!f || e.button || wait || nextFile) return;
      e.preventDefault(); n = +f.getAttribute('data-pin');
      function mv(ev) {
        if (!moved) {
          if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
          moved = true; show(n); ghost = ER.el('div', 'flagghost', String(n)); ghost.style.background = COL[n]; document.body.appendChild(ghost);
        }
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      }
      function up(ev) {
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        if (!moved) { show(n); FL.sfx.slip(); return; }
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost); ghost = null;
        var r = svg.getBoundingClientRect(), k2;
        if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) { k2 = nearest(mapPt(ev)); if (k2) put(n, k2); else msg('A flag goes on one of the rings: each ring is a place that somebody has named tonight.'); }
        else if (at[n]) { delete at[n]; ER.flag('b-at', at); show(n); msg('Flag <b>' + n + '</b> goes back in the tin.'); }
      }
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
    ER.$$('.sock', svg).forEach(function (g) {
      var k2 = g.getAttribute('data-k');
      g.addEventListener('click', function () {
        if (wait || nextFile) return;
        if (!sel) { msg('That ring is ' + name(k2) + '. Choose a flag from the tin first.'); return; }
        put(sel, k2);
      });
      g.addEventListener('pointerenter', function () {
        var t = tip.querySelector('text'), w, x = SOCK[k2][0], y = SOCK[k2][1];
        t.textContent = name(k2).replace(/&rsquo;/g, '’'); tip.style.display = 'block'; w = t.getComputedTextLength() + 14;
        x = FL.clamp(x - w / 2, 2, 718 - w); y = y > 40 ? y - 34 : y + 14;
        tip.querySelector('rect').setAttribute('width', w); tip.setAttribute('transform', 'translate(' + x.toFixed(0) + ' ' + y + ')'); t.setAttribute('x', 7);
      });
      g.addEventListener('pointerleave', function () { tip.style.display = 'none'; });
    });
    /* what Dilys says about a flag in the wrong place: from the message, the map and the book, and from nothing else */
    function why(n, k2) {
      if (n === 1) return k2 === 'clw' ? 'Church Lane, yes. But he said Church Lane AND Ferry Row in one breath: thirty-eight houses. Look in the book. Is there a Ferry Row in Wendford?' :
        k2 === 'frw' ? 'That is Ferry ROAD. The sergeant said Ferry ROW: I wrote it down. Read the name to the end, dear.' :
        k2 === 'nse' ? 'The right village, I think. But he gave us streets, so give Danny streets. Put it on one of the two that he named.' :
        k2 === 'ask' ? 'You could ask him, if he ever picks up his telephone again. But he gave you two streets. Two streets side by side are as good as a village. Look them both up.' :
        'Find both streets in the book first: Church Lane, and Ferry Row. Where are the two of them side by side?';
      if (n === 2) return k2 === 'cln' ? 'She has put her address on it: 14 Church Lane, WENDFORD. That is where Carol is sitting, with her coat on.' : 'Her address is on the slip. There are two Church Lanes in the book, and she tells you which one is hers.';
      if (n === 3) return k2 === 'old' ? 'She says that she went round BY the Old Bridge. So the Old Bridge is the one that was open.' :
        k2 === 'qnb' ? 'With a pushchair, down steps? Has the Queen&rsquo;s Bridge got steps? Look under BRIDGES in the book.' :
        k2 === 'ask' ? 'You could. But she has told you two things about that bridge, and the sergeant has told you a third. The book has all three bridges in it.' : 'That is not a bridge, dear. A bridge with steps, where the south end goes under first: the book has all three in it.';
      if (n === 4) return k2 === 'old' ? 'Forty tonnes, over the Old Bridge? Read what the book says about it: seven and a half tonnes, and not a bag of sugar more.' :
        k2 === 'ftb' ? 'A lorry. On a footbridge. I should like to have seen that.' :
        k2 === 'ask' ? 'He has rung off, and he has told you enough. Which bridge in this valley will carry forty tonnes?' : 'That is not a bridge, dear. Which bridge in this valley will carry forty tonnes? The book says.';
      if (n === 5) return k2 === 'use' ? 'Upper Sedge is on top of a hill: 142 metres, it says on the map. He says the RIVER is in the gardens. A river does not climb hills.' :
        (k2 === 'cln' || k2 === 'frn' || k2 === 'mln') ? 'The right village. But he did not say which street, so do not choose one for him. Put it on the village.' :
        k2 === 'ask' ? 'You could. But the map can tell you this one: one Sedge is on a hill, and the other is in the river meadows.' : '&ldquo;Sedge.&rdquo; There are two of them: Upper and Nether. Which one has a river at the bottom of its gardens?';
      if (n === 6) return k2 === 'sch' ? 'Close. That is the school. He is next door: he gets the playground twice a day, and I get the telephone call.' : 'Mr Lindley always gives his address, in full, twice. Brook Cottages. It is in the book.';
      return (k2 === 'mlw' || k2 === 'mln') ? 'It might be. Or it might be the other one: there is a Mill Lane here and a Mill Lane in Nether Sedge, and both of them are down by the water. He gave no name and no number. What does the page in the book say, when the map cannot tell you?' :
        'Look up Mill Lane in the book. How many are there? And is there anything in the message to tell you which?';
    }
    box.querySelector('#m-go').addEventListener('click', function () {
      var n, left = 0, file, g;
      if (wait || nextFile) return;
      for (n = 1; n <= 7; n++) if (!at[n]) left++;
      if (left) { msg('&ldquo;There ' + (left === 1 ? 'is one flag' : 'are ' + ['', '', 'two', 'three', 'four', 'five', 'six', 'seven'][left] + ' flags') + ' still in the tin,&rdquo; says Dilys. &ldquo;Seven messages, seven flags. Even the one that nobody can place: there is somewhere for that, too.&rdquo;'); return; }
      for (n = 1; n <= 7; n++) {
        if (!ER.check('q' + n, at[n])) {
          ER.sfx.no(); k = at[n]; show(n);
          g = layer.querySelector('.mpin[data-pin="' + n + '"]'); if (g) g.classList.add('bad');
          msg('Dilys takes flag <b>' + n + '</b> out of the map and gives it back to you. &ldquo;' + why(n, k) + '&rdquo;');
          (function (m) { setTimeout(function () { delete at[m]; ER.flag('b-at', at); if (sel === m) show(m); else draw(); }, 900); })(n);
          return;
        }
      }
      file = ER.exit([[1, 2, 3, 4, 5, 6, 7].map(function (m) { return at[m]; }).join('-')], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('b-file', file);
      FL.mine('pins', 'Seven flags on the map', '<p>1 The police are emptying Church Lane and Ferry Row in NETHER SEDGE. Only one village has both.</p><p>2 Carol is in Church Lane, WENDFORD: up the hill, and safe.</p>' +
        '<p>3 The bridge that is shut is the Station Footbridge. It has steps.</p><p>4 The lorry crossed the Queen&rsquo;s Bridge, on the bypass. Open.</p>' +
        '<p>5 &ldquo;Sedge&rdquo; with the river in its gardens is Nether Sedge. A river does not climb a hill.</p><p>6 Mr Lindley: Brook Cottages, next door to the school.</p><p>7 Mill Lane: there are two, both by the water. Not known. Dilys is asking.</p>', true);
      show(0);
      msg('Dilys looks along the wall with a telephone at each ear. &ldquo;Well,&rdquo; she says. &ldquo;Now I know where everybody is. That is more than the sergeant told me.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Seven flags. The police are in Church Lane, Nether Sedge, down by the river. Carol&rsquo;s Church Lane is here in Wendford, sixty-five metres further up the hill. Nobody is coming to her door, because nobody needs to.',
          '&ldquo;So her text goes on the spike,&rdquo; says Dilys, &ldquo;and I shall ring her myself, and tell her to put the kettle on. If Danny had read it out, the whole of Church Lane would be standing in the rain by now. And walking downhill.&rdquo;',
          'The bridge with the steps is the footbridge at the station. The bridge that carried forty tonnes is the Queen&rsquo;s Bridge. And nobody can say which Mill Lane has a van in it, so Dilys rings the police back, and this time she asks.',
          'Under the counter the printer starts up. It prints the same picture three times, from three different people, and then a fourth time.',
          'It is a photograph of the Old Bridge with brown water up to the tops of its arches. Somebody has written across the bottom of it: OLD BRIDGE NOW!!! GONE UNDER. SHARE.',
          'The telephone on the wall rings: the newsroom. &ldquo;Forty-one people have sent us that,&rdquo; says Brannigan. &ldquo;And Yasmin says she is standing on that bridge. Take it up to the record library: the river file is in the cabinet. I want to know what it is a picture of. And when.&rdquo;'
        ], function () { busy = false; showGo(); FL.sfx.printer(); });
      }, 3200);
    });
    show(0);
    k = 0; [1, 2, 3, 4, 5, 6, 7].forEach(function (m) { if (at[m]) k++; });
    msg(k ? 'The map, with ' + k + (k === 1 ? ' flag' : ' flags') + ' on it so far. Click a flag to read its message; then click a ring.' :
      'OUR PATCH. Every ring is a place that somebody has named tonight. Click a flag to read its message; then click the ring where the thing really is.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
