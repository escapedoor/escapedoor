<style>
  body{--bg:#120c08;--accent:#b6e0a8;--font-display:'Oswald',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Newsreader',serif;

  .gobtn{color:#14181d}
  #branch{animation:tap 5.3s ease-in-out infinite;transform-origin:500px 150px}
  @keyframes tap{0%{transform:rotate(0)}8%{transform:rotate(3deg)}12%{transform:rotate(-1deg)}16%{transform:rotate(2deg)}24%{transform:rotate(0)}100%{transform:rotate(0)}}
  .reel{animation:reel 7s linear infinite}
  .reel.r2{animation-duration:4.6s}
  @keyframes reel{100%{transform:rotate(360deg)}}
  #sato{display:none}
  #scene.in #sato{display:block}
  #pcard.ready,#photo.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.3)}}

  /* the picture under the glass, and the test card */
  .job.ph{width:min(1130px,96vw)}
  .ph-top{display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:14px;align-items:start}
  .ph-top svg{display:block;width:100%;height:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);touch-action:none;cursor:crosshair}
  .ph .pmark{cursor:grab}
  .ph .pmark.sel circle{stroke:#fff;stroke-width:3}
  .ph .pmark.bad circle{stroke:#ff4b3e;stroke-width:5}
  .ph-now{margin-top:9px;padding:7px 14px 8px 16px;background-color:#f7fafc;background-image:linear-gradient(#c9dbe8 1px,transparent 1px),linear-gradient(90deg,#c9dbe8 1px,transparent 1px);background-size:20px 20px;color:#1d2a66;font-family:'Caveat',cursive;font-size:19.5px;line-height:1.14;border-top:9px solid #20262d}
  .ph-now h6{margin:0 0 1px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.2em;color:#b2540f}
  .ph-now p{margin:0}
  .tcard{background:#f4efdf;color:#1d2228;padding:9px 12px 10px;border-radius:8px;border:1px solid #cfc7ae}
  .tcard h5{margin:0 0 6px;display:flex;align-items:baseline;gap:9px;font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:.14em;border-bottom:3px solid #e08a1e;padding-bottom:4px}
  .tcard h5 small{font-family:'Newsreader',serif;font-style:italic;font-weight:400;font-size:13.5px;letter-spacing:0;color:#5a5346}
  .trow{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dotted #b9b29c}
  .trow:last-child{border-bottom:0}
  .trow h6{margin:0 0 3px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.1em}
  .trow h6 small{font-family:'Newsreader',serif;font-style:italic;font-weight:400;font-size:13px;letter-spacing:0;color:#5a5346;margin-left:6px}
  .tflag{display:grid;place-items:center;width:34px;height:34px;border-radius:17px;background:#1d2228;color:#fff;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:16px;box-shadow:0 3px 4px rgba(0,0,0,.4);touch-action:none;cursor:grab}
  .tflag.put{opacity:.35;box-shadow:none}
  .tflag.sel{opacity:1;outline:3px solid #e08a1e;outline-offset:2px}
  .tghost{position:fixed;z-index:80;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:17px;display:grid;place-items:center;pointer-events:none;background:#1d2228;color:#fff;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:16px;box-shadow:0 8px 14px rgba(0,0,0,.5)}
  .seg{display:flex;flex-wrap:wrap;gap:4px}
  .seg button{padding:4px 8px 3px;border:1.5px solid #6b6450;border-radius:3px;background:#fffdf5;color:#3a3528;font-family:'Libre Franklin',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
  .seg button:hover{border-color:#1d2228}
  .seg button.on{background:#1d2228;border-color:#1d2228;color:#fff}
  .seg.yn button.on[data-v="y"]{background:#1f6b41;border-color:#1f6b41}
  .seg.yn button.on[data-v="n"]{background:#a32a1d;border-color:#a32a1d}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, lock = null, told = {};
  var SIGN = ['LINDLEY &amp; SON', 'IRONMONGERS &#183; EST. 1921'], WORDS = 'OLD BRIDGE NOW!!! GONE UNDER. SHARE';
  /* what tonight looks like: each line goes on your pad when you have read the thing that says so */
  var NOW = {
    yslip: 'The Old Bridge now (Yasmin, 21.06): dark since five, lamps lit. Trees bare. Corner shop: The Fifth Arch, coffee. A metre of arch above the water.',
    cal: 'Tuesday 9 February. Sunset 17.02.',
    river: 'Gauge at 21.00: 3.36 m, rising. One mark on the board is 20 cm.',
    print: 'Old Bridge: five stone arches. Footbridge: one span. Queen&rsquo;s Bridge: three.'
  };
  var NEED = [['yslip', 'the pink slip on the table'], ['cal', 'the calendar on the wall'], ['print', 'the print of the three bridges'], ['river', 'the bottom drawer of the cabinet']];

  /* records on the shelves, rain, the thumbnail, Danny */
  (function () {
    var r = 3, PAL = ['#7a2f2f', '#27457a', '#2f5a4a', '#b08a35', '#5a4028', '#8a4433', '#48525c', '#c9b78f', '#3a3f45', '#7a4a9a', '#1e6f6f', '#a8733f', '#d9d2bd', '#1d2228'];
    function rnd() { r = (r * 16807) % 2147483647; return r / 2147483647; }
    function shelves(x0, x1) {
      var s = '<rect x="' + x0 + '" y="56" width="' + (x1 - x0) + '" height="600" fill="#1a100a"/>', row, x, w, h, y;
      for (row = 0; row < 6; row++) {
        y = 152 + row * 100;
        for (x = x0 + 12; x < x1 - 20;) {
          if (rnd() < 0.07) { x += 14 + rnd() * 24; continue; }
          if (rnd() < 0.08) { w = 30; h = 44 + rnd() * 20; s += '<rect x="' + x.toFixed(0) + '" y="' + (y - h).toFixed(0) + '" width="' + w + '" height="' + h.toFixed(0) + '" fill="#b9b29c"/><rect x="' + (x + 5).toFixed(0) + '" y="' + (y - h + 8).toFixed(0) + '" width="20" height="12" fill="#f1ede2"/>'; x += w + 3; continue; }
          w = 4 + rnd() * 6; h = 68 + rnd() * 20;
          s += '<rect x="' + x.toFixed(1) + '" y="' + (y - h).toFixed(0) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(0) + '" fill="' + PAL[Math.floor(rnd() * PAL.length)] + '"/>';
          x += w + 1.2;
        }
        s += '<rect x="' + x0 + '" y="' + y + '" width="' + (x1 - x0) + '" height="10" fill="#4a3220"/><rect x="' + x0 + '" y="' + (y + 10) + '" width="' + (x1 - x0) + '" height="4" fill="#0a0604"/>';
      }
      return s + '<rect x="' + x0 + '" y="50" width="12" height="606" fill="#4a3220"/><rect x="' + (x1 - 12) + '" y="50" width="12" height="606" fill="#4a3220"/><rect x="' + x0 + '" y="50" width="' + (x1 - x0) + '" height="10" fill="#4a3220"/>';
    }
    $('#shelfL').innerHTML = shelves(30, 436);
    $('#shelfR').innerHTML = shelves(1176, 1580);
    $('#rain').innerHTML = FL.rain(512, 132, 136, 186, 16, 13);
    $('#thumb').innerHTML = FL.photo({ id: 'tb', sign: ['', ''], words: WORDS });
    $('#sato').innerHTML = FL.who('sato', { lit: '#ffe9a8', extra: '<circle cx="-54" cy="-118" r="26" fill="#111"/><circle cx="-54" cy="-118" r="9" fill="#c23b2c"/><circle cx="54" cy="-118" r="26" fill="#111"/><circle cx="54" cy="-118" r="9" fill="#e9c66a"/><circle cx="-54" cy="-118" r="2" fill="#f1ede2"/><circle cx="54" cy="-118" r="2" fill="#f1ede2"/>' });
  })();

  ER.init({
    theme: 'news', story: 'flood', storyTitle: 'Two Aunts', id: 'records', no: 'III', title: 'The Record Library',
    go: 'Switch on the lamp',
    intro: [
      'A name is not a place until there is a pin in it. Church Lane and Ferry Row lie side by side in only one village, so the police were in Nether Sedge, and Carol in Wendford could put the kettle on. A bridge with steps is a footbridge. Forty tonnes do not cross a bridge with a weight limit. A river does not flood the top of a hill. And one Mill Lane could not be found at all, so you did the right thing with it: you asked.',
      'Now the picture. Forty-one people have sent it in, and the printer downstairs is still going.',
      'The record library is at the back of the building. It keeps thirty years of music and, in the bottom drawer, thirty years of the river.'
    ],
    exit: {"next":"studio","w":{"02be665b":"96642e23"}}, tags: {"f1":["724b80fd"],"f2":["8aafb9ca","dda5238a"],"f3":["3e9c3035"],"f4":["32a504ad"],"f5":["29bc8811"],"f6":["d5032d7d","b8027858"],"v2":["e65983b5"],"v3":["e24576c3"],"v4":["ff517e7b"],"v5":["f17b361f"],"v6":["11ad1cf9"],"which":["c9f5f3c9"],"when":["aea5d5dd"]},
    sound: ['desk', { root: 43, bpm: 80, drop: ['mel', 'ost'], beds: [['rain', 0.45]] }],      /* the quietest room in the building: slow, low, no pulse; rain on one small window */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function missing() { return NEED.filter(function (q) { return !told[q[0]]; }); }
  function paint() {
    var s = '', n = 0;
    $('#scene').classList.toggle('in', !!told.in2 && !nextFile);
    $('#pcard').classList.toggle('ready', !!(told.sato && !told.card));
    $('#photo').classList.toggle('ready', !!(told.card && !missing().length && !nextFile));
    NEED.forEach(function (q) { if (told[q[0]]) { s += '<path d="M950 ' + (590 + n * 9) + 'h' + (40 + (n * 7) % 12) + '" stroke="#1d2a66" stroke-width="2"/>'; n++; } });
    $('#padlines').innerHTML = s;
    ER.pips((told.sato ? 1 : 0) + (told.card ? 1 : 0) + (4 - missing().length) + (nextFile ? 1 : 0), 7);
  }
  function note(k) { if (tell(k)) { paint(); return true; } return false; }

  function hints() {
    var m = missing();
    if (nextFile) return ['go', ['The picture has been tested. Brannigan wants everything in Studio One: the button is at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['test', [

    svg.addEventListener('pointerleave', function () { loupe.style.display = 'none'; });
    svg.addEventListener('click', function (e) {
      var q = phPt(e);
      if (wait || nextFile || !sel || (e.target.closest && e.target.closest('.pmark'))) return;
      if (inPhoto(q)) put(sel, q);
    });
    /* a flag is clicked and then the picture is clicked; or it is dragged, from the card or across the picture */
    box.addEventListener('pointerdown', function (e) {
      var f = e.target.closest ? e.target.closest('[data-f]') : null, n, sx = e.clientX, sy = e.clientY, moved = false;
      if (!f || e.button || wait || nextFile) return;
      e.preventDefault(); n = +f.getAttribute('data-f');
      function mv(ev) {
        if (!moved) {
          if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
          moved = true; sel = n; draw(); ghost = ER.el('div', 'tghost', String(n)); document.body.appendChild(ghost);
        }
        ghost.style.left = (ev.clientX + 22) + 'px'; ghost.style.top = (ev.clientY - 26) + 'px';
      }
      function up(ev) {
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        if (!moved) { sel = n; draw(); FL.sfx.slip(); msg('Flag <b>' + n + '</b>: ' + ROWS[n - 1][1].toLowerCase().replace('?', '') + '. Now click the thing itself, in the picture.'); return; }
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost); ghost = null;
        var r = svg.getBoundingClientRect(), q;
        if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) { q = phPt(ev); if (inPhoto(q)) { put(n, q); return; } }
        if (st.f[n]) { delete st.f[n]; keep(); msg('Flag <b>' + n + '</b> goes back on the card.'); }
        sel = 0; draw();
      }
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
    ER.$$('.seg', box).forEach(function (g) {
      g.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('button') : null, d = g.getAttribute('data-d'), v;
        if (!b || wait || nextFile) return;
        v = b.getAttribute('data-v'); FL.sfx.lamp();
        if (d === 'which') st.which = v; else if (d === 'when') st.when = v; else st.v[d.slice(1)] = v;
        keep(); draw();
      });
    });
    var FLAGWHY = ['', 'Flag 1 is for the thing that tells one bridge from another. Find something you can COUNT.', 'Flag 2 is the light. Is it day or night in the picture? Put the flag on whatever shows you.', 'Flag 3 is the trees. They are across the river.',
      'Flag 4 is the name over the shop. Run the glass along the building on the left.', 'Flag 5 is the gauge: a white board with marks on it. The river file says where it is fixed.', 'Flag 6 is the weather. What are the people on the bridge holding?'];
    var VWHY = { 2: 'Look at the sky in the picture, and at the lamp on the bridge, which is not lit. Then read what Yasmin says about tonight. It has been dark since five.',
      3: 'Those trees are in full leaf. This is February: Yasmin says the trees on the far bank are bare.',
      4: 'Read the name over the shop through the glass. Then read what Yasmin calls the shop on that corner tonight.',
      5: 'Read the board under the glass: a 5, and the water three marks below it. Every mark is 20 centimetres. And what did the agency say at nine o&rsquo;clock?',
      6: 'It is raining in the picture, and it is raining tonight. That FITS. It proves nothing, mind: it has rained on a great many days. But it does fit.' };
    box.querySelector('#t-go').addEventListener('click', function () {
      var n, left = 0, file, g, code;
      if (wait || nextFile) return;
      sel = 0; draw();
      for (n = 1; n <= 6; n++) if (!st.f[n]) left++;
      if (left) { msg('The intercom crackles. &ldquo;' + (left === 6 ? 'Not one flag on the picture yet' : left === 1 ? 'One flag is still on the card' : ['', '', 'Two', 'Three', 'Four', 'Five'][left] + ' flags are still on the card') + ',&rdquo; says Brannigan. &ldquo;Show me WHERE you are looking, before you tell me what you think.&rdquo;'); return; }
      for (n = 1; n <= 6; n++) {
        if (!ER.check('f' + n, FL.photoAt(st.f[n][0], st.f[n][1]))) {
          ER.sfx.no(); g = marks.querySelector('.pmark[data-f="' + n + '"]'); if (g) g.classList.add('bad');
          msg('&ldquo;Flag <b>' + n + '</b> is on ' + WHAT[FL.photoAt(st.f[n][0], st.f[n][1]) || 'far'] + ',&rdquo; says the intercom. &ldquo;' + FLAGWHY[n] + '&rdquo;');
          (function (m) { setTimeout(function () { delete st.f[m]; keep(); draw(); }, 900); })(n);
          return;
        }
      }
      if (!ER.check('which', st.which)) {
        ER.sfx.no();
        msg('&ldquo;' + (!st.which ? 'Which bridge is it? You have a flag on the arches, and no answer on the first line of the card.' : st.which === 'foot' ? 'One span of iron, with steps at each end? Count the arches in the picture again, and look at the print on the wall.' :
          st.which === 'queen' ? 'The Queen&rsquo;s Bridge is concrete, and it has three spans. How many arches can you count in the picture?' : 'I wish it were somebody else&rsquo;s bridge. Count the arches, and then read the print on the wall: only one bridge on this river has that many.') + '&rdquo;');
        st.which = ''; keep(); draw(); return;
      }
      for (n = 2; n <= 6; n++) {
        if (!ER.check('v' + n, st.v[n] || '')) {
          ER.sfx.no();
          msg('&ldquo;' + (!st.v[n] ? 'Line ' + n + ' has a flag and no verdict. Does it fit tonight, or can it not be tonight?' : VWHY[n]) + '&rdquo;');
          delete st.v[n]; keep(); draw(); return;
        }
      }
      if (!ER.check('when', st.when)) {
        ER.sfx.no();
        msg('&ldquo;' + (!st.when ? 'Not tonight, then. So WHEN? The table in the river file has the answer.' : st.when === 'now' ? 'Four things in that picture cannot be tonight. You have just told me so yourself.' :
          'Read the gauge in the picture again, and then run your finger down the table in the river file. How high did the river stand on that date? And look at the trees: what time of year is it?') + '&rdquo;');
        st.when = ''; keep(); draw(); return;
      }
      code = st.which + '|' + [2, 3, 4, 5, 6].map(function (m) { return st.v[m]; }).join('') + '|' + st.when;
      file = ER.exit([code], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      FL.mine('tested', 'The picture, tested', '<p>REAL? Yes. Nothing has been painted in.</p><p>HERE? Yes. Five stone arches: the Old Bridge.</p><p>NOW? No. Daylight, and it has been dark since five. Trees in full leaf, in February. LINDLEY &amp; SON over the shop, which is The Fifth Arch tonight. The gauge at about 4.4 m, and the agency says 3.36.</p>' +
        '<p>(It is raining in the picture. That fits tonight, and proves nothing.)</p><p>WHEN? The river has stood above 4 metres once since 1968: on the evening of 17 June 2011.</p><p>Somebody else wrote NOW on it.</p>', true);
      msg('The intercom is quiet for a moment. &ldquo;Real, ours, and old,&rdquo; says Brannigan. &ldquo;Good. Now I know what to tell Danny to SAY about it.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Is it real? Yes: nobody has painted anything in. Is it here? Yes: five stone arches, and only one bridge on the Wend has five. Is it now? No.',
          'It is daylight in the picture. The trees are in full leaf. The shop on the corner sells nails, and the river is a whole metre higher than the agency says it is tonight. Four things that cannot be tonight, and one that fits: it is raining. That one proves nothing.',
          'The table from the bottom drawer does the rest. Since the gauge was put in, the water at the Old Bridge has stood above four metres once: on the evening of 17 June 2011.',
          'You are half way to the door when you turn and look at it again. Somebody stood on that bank in the rain and took it, and it was true when they took it. It only became a lie tonight, when somebody else wrote NOW across the bottom.',
          'The intercom crackles. &ldquo;Studio One,&rdquo; says Brannigan. &ldquo;Bring everything. We write it now.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3200);
    });
    draw();
    s = 0; [1, 2, 3, 4, 5, 6].forEach(function (m) { if (st.f[m]) s++; });
    msg(s ? 'The picture, with ' + s + (s === 1 ? ' flag' : ' flags') + ' on it so far.' : 'Move the mouse over the picture: the glass shows the small things. Then drag each flag from the card on to the thing it names, and judge it.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
</body>
