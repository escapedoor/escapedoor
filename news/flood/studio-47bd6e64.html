<style>
  body{--bg:#101113;--accent:#ff7a66;--font-display:'Oswald',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Newsreader',serif;
    --tc-bg:rgba(14,15,17,.97);--tc-ink:#f1ede2;--cap-bg:rgba(12,13,15,.95);--panel:#191b1e;--face-bg:#26282c;--q-ink:#ff7a66;--fade:#040405;--hud-bg:rgba(12,13,15,.86)}
  .gobtn{color:#14181d}
  .vu{animation:vu 1.3s ease-in-out infinite;transform-origin:0 0}
  .vu.v2{animation-duration:.9s;animation-delay:-.4s}
  @keyframes vu{0%{transform:rotate(-34deg)}30%{transform:rotate(8deg)}55%{transform:rotate(-12deg)}80%{transform:rotate(18deg)}100%{transform:rotate(-34deg)}}
  #sec{animation:sec 60s steps(60,end) infinite;transform-origin:0 0}
  @keyframes sec{100%{transform:rotate(360deg)}}
  .led{animation:led 1.7s steps(1,end) infinite}
  .led.b2{animation-delay:-.6s;animation-duration:2.3s}.led.b3{animation-delay:-1.1s}
  @keyframes led{0%{opacity:1}60%{opacity:.25}}
  #airoff{display:block}#airon{display:none}
  #scene.live #airoff{display:none}
  #scene.live #airon{display:block}
  #airglow{animation:air 2.6s steps(1,end) infinite}
  @keyframes air{0%{opacity:.6}50%{opacity:.42}}
  #script.ready,#sign.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.3)}}

  /* the cue sheet and the pad of tags */
  .job.sc{width:min(1100px,95vw)}
  .sc-top{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start}
  .sheet{background:#f6efc2 linear-gradient(178deg,rgba(255,255,255,.5),rgba(190,170,90,.16));color:#1f1e1a;padding:10px 20px 10px 14px;box-shadow:0 20px 50px rgba(0,0,0,.6);font-family:'Special Elite','Courier New',monospace;font-size:14.6px;line-height:1.36}
  .sheet h5{margin:0 0 6px;padding-bottom:5px;border-bottom:1px solid #1f1e1a;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-weight:500;font-size:12px;letter-spacing:.14em}
  .para{display:grid;grid-template-columns:30px 1fr;gap:2px;margin:0 0 5px;padding:1px 0;cursor:pointer;border-radius:2px}
  .para:hover{background:rgba(255,255,255,.45)}
  .para>i{font-style:normal;font-family:'DM Mono',monospace;font-size:11.5px;color:#8a7f52;padding-top:2px}
  .para.struck .body{text-decoration:line-through;text-decoration-color:#c23b2c;text-decoration-thickness:2px;color:#8a8372}
  .para.bad{animation:pbad .9s steps(1,end)}
  @keyframes pbad{0%{background:#ffb3a8}25%{background:transparent}50%{background:#ffb3a8}75%{background:transparent}}
  .para.pencil .body{font-family:'Kalam',cursive;font-size:16.4px;line-height:1.2;color:#3a4a66}
  .para.new{background:rgba(255,255,255,.6);outline:2px dashed #c23b2c;outline-offset:1px}
  .slot{display:inline-block;margin:0 5px 0 0;padding:0 7px;border:1.5px dashed #8a7f52;border-radius:2px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.08em;line-height:1.45;color:#8a7f52;vertical-align:1px;white-space:nowrap}
  .slot.has{border:0;background:#1f1e1a;color:#ffe9a8;font-weight:600;box-shadow:1px 2px 0 rgba(0,0,0,.25)}
  .slot.cut{border:0;background:none;color:#c23b2c;font-family:'Caveat',cursive;font-weight:700;font-size:20px;letter-spacing:0;line-height:1}
  .sheet .fixed{margin:0 0 0 32px;color:#57533f}
  .ear{display:inline;padding:0 2px;border-bottom:2px dotted #2456c9;color:#1c3f9a;font:inherit;cursor:pointer;background:rgba(36,86,201,.08)}
  .ear:hover{background:rgba(36,86,201,.2)}
  .ear svg{display:inline-block;width:15px;height:13px;vertical-align:-2px;margin:0 1px}
  .ear.snip{border-bottom:0;background:none;padding:0}
  .ear.snip.on svg{opacity:.35}
  .pad{background:#2a2c30;border:1px solid #4a4e55;padding:9px 10px 10px}
  .pad h5{margin:0 0 6px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.2em;color:#f1ede2;display:flex;align-items:baseline;gap:9px}
  .pad h5 small{font-family:'Newsreader',serif;font-style:italic;font-weight:400;font-size:13.5px;letter-spacing:0;color:#c3c7cc}
  .tags{display:grid;gap:5px}
  .tag{display:block;width:100%;padding:5px 9px 4px;text-align:left;background:#ffe9a8;color:#1f1e1a;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.6px;letter-spacing:.07em;line-height:1.2;box-shadow:1px 2px 0 rgba(0,0,0,.35);touch-action:none;cursor:grab}
  .tag:hover{background:#fff3c9}
  .tag.sel{outline:3px solid #ff7a66;outline-offset:1px}
  .tag.pen{margin-top:9px;background:#fffdf5;color:#a32a1d;border-left:8px solid #c23b2c;font-family:'Kalam',cursive;font-weight:700;font-size:16.5px;letter-spacing:0}
  .tghost{position:fixed;z-index:80;pointer-events:none;padding:5px 9px 4px;background:#ffe9a8;color:#1f1e1a;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.6px;letter-spacing:.07em;box-shadow:0 8px 14px rgba(0,0,0,.5);white-space:nowrap}
  .pad p{margin:9px 0 0;font-family:'Newsreader',serif;font-size:14.5px;line-height:1.35;color:#c3c7cc}
  .pad p b{color:#8fb0ff;font-weight:600}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, lock = null, told = {}, stage = 0, leaving = false;

  /* the marks round the clock, the faders, the two of them */
  (function () {
    var s = '', i, a, COL = ['#ff4b3e', '#2e8a57', '#ffb347', '#2e8a57', '#ffb347', '#ff4b3e'];
    for (i = 0; i < 12; i++) { a = i * 30 * Math.PI / 180; s += '<path d="M' + (Math.sin(a) * 36).toFixed(1) + ' ' + (-Math.cos(a) * 36).toFixed(1) + 'L' + (Math.sin(a) * 41).toFixed(1) + ' ' + (-Math.cos(a) * 41).toFixed(1) + '" stroke="#14181d" stroke-width="' + (i % 3 ? 2 : 4) + '"/>'; }
    $('#ticks').innerHTML = s; s = '';
    s = '<rect x="262" y="664" width="1064" height="236" fill="#000" opacity="0"/>';
    for (i = 0; i < 15; i++) {
      s += '<path d="M' + (290 + i * 72) + ' 720V880" stroke="#0b0c0d" stroke-width="7" stroke-linecap="round"/><rect x="' + (276 + i * 72) + '" y="' + (760 + (i * 37) % 70) + '" width="28" height="18" rx="3" fill="' + (i === 6 || i === 7 ? '#ff4b3e' : '#c9ced3') + '"/><path d="M' + (276 + i * 72) + ' ' + (769 + (i * 37) % 70) + 'h28" stroke="#14181d" stroke-width="2"/>' +
        '<rect class="' + (i % 4 === 1 ? 'led' : i % 5 === 2 ? 'led b2' : i % 7 === 3 ? 'led b3' : '') + '" x="' + (280 + i * 72) + '" y="676" width="20" height="14" rx="2" fill="' + COL[i % 6] + '"/><rect x="' + (280 + i * 72) + '" y="696" width="20" height="10" rx="2" fill="#0b0c0d"/>';
    }
    $('#faders').innerHTML = s;
    $('#brannigan').innerHTML = FL.who('brannigan', { lit: '#ff7a66', extra: '<path d="M20 -291l15 -22" stroke="#e9c93a" stroke-width="3.500" stroke-linecap="round"/>' });
    $('#sato').innerHTML = FL.who('sato', { phones: 0, lit: '#ff7a66', smile: -2, extra: '<path d="M-24 -280Q-25 -309 0 -310Q25 -309 24 -280" fill="none" stroke="#17191c" stroke-width="5"/><rect x="-31" y="-286" width="11" height="22" rx="5" fill="#17191c"/><rect x="20" y="-286" width="11" height="22" rx="5" fill="#17191c"/>' });
  })();

  ER.init({
    theme: 'news', story: 'flood', storyTitle: 'Two Aunts', id: 'studio', no: 'IV', title: 'Studio One',
    go: 'Go in quietly',
    intro: [
      'The picture was real, and it was the Old Bridge, and it was not tonight: daylight, summer leaves, a name over the shop that came down years ago, and the river at about 4.4 metres on the gauge. One thing that cannot be tonight would have been enough. The agency&rsquo;s own table gave the date: 17 June 2011.',
      'While you were upstairs, Dilys got her sergeant back on the telephone, and this time she asked. The Mill Lane with the van in it is in Nether Sedge. The van belongs to a plumber, who is dry. And nobody in Wendford is being asked to leave.',
      'It is twenty past nine. In ten minutes the red light goes on, and Danny Sato reads the news to the whole valley, once.'
    ],
    exit: {"next":"light","w":{"482f7cfa":"fa1d188f"}}, tags: {"r1":["ba61a939"],"r2":["1d1174b8"],"r3":["46e716b9"],"r4":["8e31f1a2"],"r5":["ef24dda7"],"r6":["593a1ea3"],"r7":["65471b7c"],"r8":["c36df7bb"],"r9":["2b5d9f23"],"d1":["9878f134"],"d2":["da0f9487"],"r8b":["c354d9f9"],"n1":["0a20c476"],"num1":["a4180eff"],"num2":["fa6a1f6f"],"pl2":["797255ee"],"pl3":["d1f2aef6"],"cut":["bc283cad"]},
    sound: ['desk', { root: 48, bpm: 110, mood: 'tense', drop: ['mel'], beds: [['hum', 0.5], ['static', 0.35]] }],      /* ten minutes to the red light: the tense pulse, the hum of the desk, the talkback hissing. No tune: the station's ident is heard in this room */
    hints: hints, onBegin: begin
  });

  told = ER.flag('d-told') || {}; stage = ER.flag('d-stage') || 0;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#sign').classList.toggle('ready', !!(told.sato && !told.card));
    $('#script').classList.toggle('ready', !!(told.card && stage < 3));
    $('#wclock').textContent = stage >= 3 ? '21:30' : stage >= 2 ? '21:27' : '21:20';
    ER.pips((told.sato ? 1 : 0) + (told.card ? 1 : 0) + Math.min(stage, 3), 5);
  }

  function hints() {
    if (stage >= 3) return null;
    if (lock && lock.isOpen()) return stage === 0 ? ['who', [
      'Click a tag on the pad, and then click the paragraph that it belongs to (or drag it there). Each paragraph needs the name of whoever really told us. If you have forgotten who said what, the board and the map are in your notebook.',
      'Two of the tags are not names at all. One is for a thing that somebody has told us and nobody has confirmed. The other is for a thing that nobody can know, because it has not happened yet. And when the police want people to DO something, they are not &ldquo;saying&rdquo;: they are &ldquo;asking&rdquo;.',
      'Two of the lines must not go out at all, and both of them are in pencil. One is a guess about tonight. The other was on the spike an hour ago. Those two get the red pen.'
    ]] : stage === 1 ? ['ear', [

      if (p === 'r8') return stage < 2 ? (t === 'x' ? 'People are leaving their homes. They need to know where to go. That stays in.' : DEC || 'Who opens a rest centre? It was in the news at half past eight, with its owner in red pencil.') :
        'Paragraph eight still says Brook Street School. In three minutes, sixty people will hear it and set off for a school with a brook coming over its wall. Red pen.';
      if (p === 'n1') return t === 'x' ? 'That is the one line tonight that cannot be cut.' : t === 'co' ? 'The council opened it. Listen to Yasmin again: who is at the door of the school tonight, sending people up the hill?' : t === 'ps' ? 'Nearly. But this is not something the police are telling us about. It is something they want people to DO.' :
        t === 'rp' ? 'Yasmin saw the brook. She is not the one telling sixty people where to go.' : DEC || 'Who is asking people not to go to Brook Street? Yasmin told you who was standing at the door.';
      if (p === 'r9') return t === 'x' ? 'The one thing that we do not know is the one thing that every listener is asking. Say it.' : t === 'nc' ? 'There is nothing to confirm. Nobody has claimed to know. It has not happened yet. Which tag says that?' : t === 'ea' ? 'Has the agency said how high it will go? Show me the slip. Nobody knows. Say so.' : DEC || 'Nobody has told us that, because nobody knows it. There is a tag for what nobody knows.';
      if (p === 'd1') return 'Who says so? Find me the slip. Nobody on that board has said one word about midnight. It is Danny being kind. I was kind in 2011.';
      return 'A man called Mick says so, and you put him on the spike yourself an hour ago. Thirty centimetres of moving water will float a car.';
    }
    function tagsOk() {
      var list = ['r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'r7', 'r8', 'r9', 'd1', 'd2'], i, p, t;
      for (i = 0; i < list.length; i++) {
        p = list[i]; t = st.t[p] || '';
        if (!ER.check(p === 'r8' && stage >= 2 ? 'r8b' : p, t)) {
          ER.sfx.no(); msg('Brannigan puts her pencil on ' + (p.charAt(0) === 'd' ? 'Danny&rsquo;s line' : 'paragraph <b>' + NO[p] + '</b>') + '. &ldquo;' + why(p, t) + '&rdquo;');
          if (t && !(p === 'r8' && stage >= 2)) { delete st.t[p]; keep(); }
          render(); flash(p); return false;
        }
      }
      return true;
    }
    function earOk(quiet) {
      var bad = '';
      if (!ER.check('num1', st.num1)) bad = st.num1 === 'a' ? 'Danny reads it aloud. &ldquo;It stood at three &hellip; point &hellip; three six &hellip; em?&rdquo; He stops. &ldquo;I can&rsquo;t say &lsquo;m&rsquo;. And three numbers in a row is two too many. Round it for me.&rdquo;' :
        '&ldquo;Three point three six metres.&rdquo; Danny shakes his head. &ldquo;By the time I get to the six, they have lost the three. Round it. Say &lsquo;about&rsquo;.&rdquo;';
      else if (!ER.check('num2', st.num2)) bad = st.num2 === 'a' ? '&ldquo;At twenty-one &hellip; nought nought?&rdquo; says Danny. &ldquo;Nobody&rsquo;s kitchen clock says twenty-one. Say it the way people say it.&rdquo;' :
        '&ldquo;Twenty-one hundred hours,&rdquo; reads Danny. &ldquo;I am not the army, and nor are they. What do people CALL that time?&rdquo;';
      else if (!ER.check('pl2', st.pl2)) bad = 'Danny reads: &ldquo;Police are asking people in Church Lane and Ferry Row &hellip;&rdquo; He looks up. &ldquo;Stop. Half of Wendford has just stood up. I have not said WHERE yet.&rdquo;';
      else if (!ER.check('pl3', st.pl3)) bad = '&ldquo;Police say the footbridge at the station is closed, in Wendford.&rdquo; Danny frowns. &ldquo;Which station, they are thinking, all the way to the last word. Put the place where they hear it first.&rdquo;';
      else if (!ER.check('cut', st.cut)) bad = st.cut === '00' ? 'Danny takes a breath, reads the whole of the dam in one go, and goes pink. &ldquo;Twenty-nine words,&rdquo; he says. &ldquo;I counted them on the way down.&rdquo;' :
        '&ldquo;Better,&rdquo; says Danny. &ldquo;But there is still one sentence in there with two things in it. Where does it turn a corner?&rdquo;';
      if (bad && !quiet) { ER.sfx.no(); msg(bad); }
      return !bad;
    }
    goBtn.addEventListener('click', function () {
      var file, t;
      if (wait) return;
      tool = '';
      if (!tagsOk()) return;
      if (stage === 0) {
        stage = 1; ER.flag('d-stage', 1); FL.solved(true); paint(); render();
        msg('Brannigan reads down the left-hand edge. &ldquo;Every line with its owner, and two lines gone. Now it is true.&rdquo; She turns the stand towards Danny. &ldquo;It is still not something a man can read aloud. The blue marks are yours.&rdquo;');
        return;
      }
      if (!earOk()) return;
      if (stage === 1) {
        wait = true; stage = 2; ER.flag('d-stage', 2); FL.solved(true); paint();
        msg('Danny reads it through under his breath, once, without stopping. &ldquo;I can say that,&rdquo; he says. &ldquo;I can say all of that.&rdquo;');
        setTimeout(function () {
          ER.closeAll(); busy = true; FL.sfx.crackle();
          ER.narrate([
            'Brannigan takes the sheet off the stand. It is twenty-six minutes past nine. Then the talkback box on the desk crackles.',
            '&ldquo;Newsroom. Studio. Anybody. It&rsquo;s Yasmin. I am in Brook Street with Mr Lindley, and he is RIGHT.&rdquo;',
            '&ldquo;I dropped a stick in the brook, and it went the wrong way: up, towards the school. The river is so high that the brook cannot get out. It is filling from the bottom end, like a bath with the plug in.&rdquo;',
            '&ldquo;The water is two bricks from the top of the wall behind the school. I have told the policeman on the door. They are moving everybody up the hill to the Corn Exchange. NOW.&rdquo;',
            'Nobody in the studio says anything. Then Brannigan says, quite calmly: &ldquo;Two aunts. Mr Lindley at eight minutes to nine, who has lived beside that brook for fifty years. Yasmin at twenty-six minutes past, who has just watched a stick go uphill. Neither of them got it from the other.&rdquo;',
            'She is already typing. &ldquo;Paragraph eight is dead. Here is a new one. Three minutes.&rdquo;'
          ], function () { busy = false; wait = false; render(); msg('One paragraph to strike out, and a new one, in the red frame, that needs its owner. Then send it.'); lock.open(); });
        }, 2800);
        return;
      }
      t = st.t.n1 || '';
      if (!ER.check('n1', t)) { ER.sfx.no(); msg('Brannigan taps the new paragraph. &ldquo;' + why('n1', t) + '&rdquo;'); if (t) { delete st.t.n1; keep(); } render(); flash('n1'); return; }
      file = ER.exit([['r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'r7', 'r8', 'r9', 'd1', 'd2'].map(function (p) { return st.t[p]; }).join('-') + '|' + st.t.n1 + '|' + [st.num1, st.num2, st.pl2, st.pl3, st.cut].join('-')], { wait: true, quiet: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; stage = 3; ER.flag('d-stage', 3); ER.flag('d-file', file); paint();
      msg('Brannigan reads it once, writes M.B. in the corner, and slides it across the desk. &ldquo;Go,&rdquo; she says.');
      setTimeout(function () { ER.closeAll(); onAir(false); }, 2600);
    });
    render();
    msg(stage === 0 ? 'Nine typed paragraphs, and two lines of Danny&rsquo;s in pencil. Each one needs its owner at the front, or a red line through it.' : stage === 1 ? 'Every line has its owner. Now make it something that can be heard once: the blue marks.' : 'One paragraph to strike out, and a new one that needs its owner. Then send it.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }

  /* ---------- half past nine ---------- */
  var BULL = '<h4><span>WEND VALLEY RADIO &middot; NEWS &middot; 21.30</span><span>AS READ BY D. SATO</span></h4>' +
    '<p><b>The Environment Agency says</b> the River Wend is still rising. It stood at about three point four metres at Wendford at nine o&rsquo;clock. A flood warning is in force.</p>' +
    '<p>In Nether Sedge, <b>police are asking</b> people in Church Lane and Ferry Row to leave their homes now. Nobody in Wendford is being asked to leave.</p>' +
    '<p>In Wendford, <b>police say</b> the footbridge at the station is closed.</p><p><b>Our own reporter says</b> the Old Bridge in Wendford is open: she crossed it at nine o&rsquo;clock. A photograph going round tonight shows it under water. That photograph is real, but it was taken in June 2011.</p>' +
    '<p><b>Two drivers who were there say</b> Station Road in Wendford is flooded outside the station car park.</p><p><b>We have not been able to confirm that</b> trains have stopped running through Wendford.</p>' +
    '<p><b>The water company says</b> the dam at Wendhead is safe. The reservoir is full and water is running down the spillway. That is what a spillway is for.</p>' +
    '<p><s>Wendford Council says the rest centre is at Brook Street School, in Wendford.</s></p>' +
    '<p><b>Police are asking</b> people not to go to Brook Street School. The rest centre has moved to the Corn Exchange, in the Market Place.</p>' +
    '<p><b>We do not yet know</b> how high the river will rise, or when it will stop.</p><p>Do not walk or drive through flood water.</p>' +
    '<p class="pen">Two lines in pencil: struck out. One was a guess. One was dangerous. M.B.</p>';
  function onAir(again) {
    var file = ER.flag('d-file');
    if (leaving) return;
    leaving = true; busy = true;
    $('#scene').classList.add('live');
    ER.addClue('bulletin', 'The news at half past nine', BULL, 'cue', 'The script, as it went out', again);
    if (again) { setTimeout(function () { ER.leave(file); }, 1600); return; }
    try { if (ER.track) ER.track.stop(1.6); } catch (e) {}      /* a studio goes quiet before the red light: the music stops, and then the station's own four notes are heard (and seen) */
    setTimeout(function () { FL.sfx.ident(); }, 2300);
    ER.narrate([
      'Twenty-nine minutes past nine. The long record ends. Danny pulls one fader down and pushes two red ones up, and over the door the lamp goes red.',
      'Four slow notes go out across the valley: the station&rsquo;s own. The two needles on the desk jump with each one.',
      '&ldquo;Wend Valley Radio. The news at half past nine. I&rsquo;m Danny Sato.&rdquo; His hands are flat on the desk, and his voice does not shake at all.',
      '&ldquo;The Environment Agency says the River Wend is still rising. It stood at about three point four metres at Wendford at nine o&rsquo;clock. A flood warning is in force.&rdquo;',
      '&ldquo;In Nether Sedge, police are asking people in Church Lane and Ferry Row to leave their homes now. Nobody in Wendford is being asked to leave.&rdquo;',
      '&ldquo;In Wendford, police say the footbridge at the station is closed. Our own reporter says the Old Bridge in Wendford is open: she crossed it at nine o&rsquo;clock. A photograph going round tonight shows it under water. That photograph is real, but it was taken in June 2011.&rdquo;',
      '&ldquo;Two drivers who were there say Station Road in Wendford is flooded outside the station car park. We have not been able to confirm that trains have stopped running through Wendford.&rdquo;',
      '&ldquo;The water company says the dam at Wendhead is safe. The reservoir is full and water is running down the spillway. That is what a spillway is for.&rdquo;',
      '&ldquo;Police are asking people not to go to Brook Street School. The rest centre has moved to the Corn Exchange, in the Market Place.&rdquo; He says that one twice. Nobody told him to.',
      '&ldquo;We do not yet know how high the river will rise, or when it will stop. Do not walk or drive through flood water.&rdquo; He takes a breath. &ldquo;We will tell you more as soon as we know more. And not before.&rdquo;',
      'On the other side of the glass Brannigan is holding a mug of cold tea in both hands. She is not drinking it. She is listening to every word.'
    ], function () { ER.leave(file); });
  }
})();
</script>
</body>
</html>
