<style>
  body{--bg:#10161c;--accent:#ffb347;--font-display:'Oswald',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Newsreader',serif;
    --tc-bg:rgba(13,18,24,.97);--tc-ink:#f1ede2;--cap-bg:rgba(11,15,20,.95);--panel:#17202a;--face-bg:#1a232d;--q-ink:#ffb347;--fade:#05080b;--hud-bg:rgba(11,15,20,.84)}
  #airglow{animation:air 3.2s steps(1,end) infinite}
  @keyframes air{0%{opacity:.5}50%{opacity:.36}}
  #tblamp{animation:tb 1.9s steps(1,end) infinite}
  @keyframes tb{0%{opacity:1}55%{opacity:.25}}
  #feed{animation:feed 2.6s steps(3,end) infinite}
  @keyframes feed{0%{transform:translateY(6px)}100%{transform:translateY(0)}}
  #cursor{animation:tb 1.1s steps(1,end) infinite}
  #card.ready,#board.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.28)}}
  #sorted,#t2{display:none}
  #scene.cleared #sorted,#scene.cleared #t2{display:block}
  #scene.cleared #minis,#scene.cleared #t1{display:none}

  /* the board: eleven slips, a rail of clips, five telephones and a spike */
  .job.nd{width:min(1100px,95vw)}
  .nd-top{display:grid;grid-template-columns:440px 1fr;gap:14px}
  .nd h5{margin:0 0 6px;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.2em;color:#f1ede2;display:flex;align-items:baseline;gap:10px}
  .nd h5 small{font-family:'Newsreader',serif;font-weight:400;font-style:italic;font-size:14px;letter-spacing:0;color:#c3ccd4}
  .nd-board{background:#33424f;border:6px solid #1d2630;padding:8px 10px 10px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .nd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;min-height:194px;align-content:start}
  .stub{display:block;width:100%;min-width:0;min-height:44px;padding:4px 6px 4px 9px;text-align:left;background:#fffdf5;color:#1d2228;border-left:7px solid #a8780c;box-shadow:0 2px 5px rgba(0,0,0,.4);
    font-family:'Libre Franklin',sans-serif;line-height:1.2;touch-action:none;cursor:grab}
  .stub b{display:block;font-family:'DM Mono',monospace;font-weight:500;font-size:11px;letter-spacing:.04em;color:#5a6470;white-space:nowrap}
  .stub b i{font-style:normal;display:inline-block;min-width:18px;height:18px;margin-right:5px;border-radius:9px;background:#1d2228;color:#fff;text-align:center;line-height:18px}
  .stub span{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stub.t-phone{border-left-color:#b03a6a;background:#fdeef2}
  .stub.t-agency{border-left-color:#1f5a7a}
  .stub.t-talk{border-left-color:#48525c}
  .stub.held{outline:3px solid #ffb347;outline-offset:1px}
  .stub.fly{position:fixed;z-index:80;pointer-events:none;cursor:grabbing;margin:0}
  .stub.bad{animation:bad .9s steps(1,end)}
  @keyframes bad{0%{outline:4px solid #ff4b3e}25%{outline:4px solid transparent}50%{outline:4px solid #ff4b3e}75%{outline:4px solid transparent}}
  .nd-read{margin-top:10px;min-height:236px}
  .nd-read .sl{font-size:16px}
  .nd-read .where{margin:7px 0 0;font-family:'DM Mono',monospace;font-size:12.5px;letter-spacing:.06em;color:#c3ccd4}
  .nd-read .none{margin:0;padding:30px 24px;border:1px dashed rgba(255,255,255,.3);font-family:'Newsreader',serif;font-style:italic;font-size:17px;line-height:1.4;color:#c3ccd4;text-align:center}
  .nd-right{display:grid;gap:10px;align-content:start}
  .nd-run{background:#1b3529;border:1px solid #2e8a57;padding:8px 10px 10px}
  .nd-pegs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .peg{min-height:112px;padding:17px 5px 5px;background:rgba(0,0,0,.28);border:1px dashed rgba(255,255,255,.3);position:relative;display:grid;gap:5px;align-content:start}
  .peg:before{content:'';position:absolute;left:50%;top:-6px;width:46px;height:17px;margin-left:-23px;background:linear-gradient(#d3d8dc,#8a9198);border-radius:3px 3px 7px 7px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
  .nd-hold{background:#372c14;border:1px solid #d99a1c;padding:8px 10px 10px}
  .line{display:grid;grid-template-columns:182px 1fr;gap:8px;align-items:center;min-height:52px;margin-top:5px;padding:3px 5px;background:rgba(0,0,0,.28);border:1px dashed rgba(255,255,255,.25)}
  .line u{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:'Oswald',sans-serif;font-weight:500;font-size:13.5px;letter-spacing:.1em;line-height:1.15;color:#f1ede2;text-transform:uppercase}
  .line u:before{content:'';flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:#d99a1c;box-shadow:0 0 0 3px rgba(217,154,28,.3)}
  .line .here{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .nd-kill{background:#371815;border:1px solid #c23b2c;padding:8px 10px 10px}
  .nd-spk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;min-height:48px;padding-left:34px;
    background:linear-gradient(#c9ced3,#c9ced3) 14px 0/3px 38px no-repeat,linear-gradient(#5a4028,#5a4028) 2px 38px/27px 9px no-repeat}
  .zone.over{box-shadow:inset 0 0 0 2px #ffb347}
</style>

    { no: 4, type: 'phone', time: '20.38', from: 'A lady in Upper Sedge', note: 'would not give her name', short: 'a lady, Upper Sedge', text: '&ldquo;The dam has cracked from top to bottom. I had it from my hairdresser, and her brother-in-law Gary is high up at the water company.&rdquo;' },
    { no: 5, type: 'phone', time: '20.40', from: 'A young woman with a baby', note: 'rang off', short: 'woman, pushchair', text: '&ldquo;They&rsquo;ve shut the bridge! I had to carry the pushchair back down the steps and go all the way round by the Old Bridge. Why aren&rsquo;t you telling people?&rdquo;' },
    { no: 6, type: 'text', time: '20.41', from: 'A driver for Valley Buses', short: 'a bus driver', text: 'Can&rsquo;t get the 14 down Station Road. Water right across at the car park gates, and I had to back her up to the roundabout. 22 years on this route. Never seen that before.' },

        { note: 'She is reading a strip of paper off the printer, and does not look up.', a: '&ldquo;Forty minutes, near enough. At half past nine Danny reads the news, and nine thousand people do what he tells them. So he had better be right.&rdquo;' },
        { q: 'What is the board?', a: 'Everything that has come in since the last news, at half past eight. Some of it is true. Some of it is true and no use to anybody. And some of it would get somebody drowned. They all arrive looking exactly the same.' },
        { q: 'How do I tell which is which?', a: 'Not by asking &ldquo;Is it true?&rdquo; You cannot tell that from a slip of paper. Ask who says so, and how they know. Was she there? Is it his job to know? Or did somebody&rsquo;s cousin tell somebody&rsquo;s hairdresser?' },
        { q: 'And if only one person says it?', a: 'Then I want two aunts.</p><p>She nods at the frame by the studio door. &ldquo;If your mother says she loves you, check it. I did. I rang two of my aunts, who have not spoken to each other since 1987, and they both said yes. Two people who cannot have got it from each other: that is what I want, for anything that goes on air.&rdquo;' },
        { q: 'And then?', a: 'Then every slip goes to one of three places. RUN: it can go on air. HOLD: it may be true, so we check it first, and you decide who we ring. KILL: on the spike. The card on my desk says which is which. I wrote it in 2011, after a night that I do not talk about.' },
        { q: 'What happened in 2011?', a: 'The river came up, one evening in June, higher than it has ever been before or since. I was the reporter then. I stood on the Old Bridge in my wellingtons and told the whole valley, live, that the water had &ldquo;peaked&rdquo;.</p><p>She drinks some of her tea, which is cold. &ldquo;It had not peaked. It went on rising for two more hours. I have been careful with that word ever since.&rdquo;' },

        { q: 'People say the bridge is under water.', a: 'Then people should come and stand on it.</p><p>The box clicks. &ldquo;Sorry. It has been a long night. Old Bridge, open, twenty forty-eight. I&rsquo;ll call again when I move.&rdquo;' }

  /* ---------- papers ---------- */
  var DIA = '<svg viewBox="0 0 250 310"><g font-family="Kalam,cursive" font-size="14" fill="#1a2a52">' +
    '<path d="M168 44q14 -10 28 0t28 0M168 60q14 -10 28 0t28 0" fill="none" stroke="#2c6fa6" stroke-width="4" stroke-linecap="round"/><text x="196" y="88" text-anchor="middle" font-size="13" fill="#2c6fa6">the water</text>' +

    '<p><b>FIRST-HAND</b> They saw it themselves. <b>SECOND-HAND</b> Somebody told them.</p>' +

  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Four slips for Danny. Five waiting for an answer. Two that nobody will ever hear.'); return; }
    if (!told.moira) { ER.say('Eleven slips of paper, pinned up in the order they came in. They would mean more if somebody told you what to do with them.'); return; }
    if (!told.card) { ER.say('&ldquo;Card first,&rdquo; says Brannigan. &ldquo;Under the lamp. Otherwise you&rsquo;ll run the ones that shout loudest. Everybody does, the first night.&rdquo;'); return; }
    if (!lock) lock = makeBoard();
    lock.open();
  });

  /* ---------- the board: every slip to a clip, a telephone or the spike ---------- */
  function makeBoard() {
    var LINES = [['police', 'Police<br>control room'], ['agency', 'Environment<br>Agency'], ['water', 'Water company<br>duty engineer'], ['council', 'Wendford<br>Council'], ['car', 'The radio car<br>(Yasmin)']];
    var LNAME = { police: 'the police control room', agency: 'the Environment Agency', water: 'the water company', council: 'the council', car: 'Yasmin, in the radio car' };
    var pos = ER.flag('a-pos') || {}, wait = false, box = ER.el('div', 'job nd'), s, shown = 0, kit;
    SLIPS.forEach(function (m) { if (!pos[m.no]) pos[m.no] = 'board'; });
    s = '<div class="nd-top"><div><div class="nd-board zone" data-z="board"><h5>ON THE BOARD <small>in since half past eight</small></h5><div class="nd-grid"></div></div><div class="nd-read"></div></div>' +
      '<div class="nd-right"><div class="nd-run"><h5>RUN <small>on air at 21.30. One clip, one fact</small></h5><div class="nd-pegs">';
    [1, 2, 3, 4].forEach(function (k) { s += '<div class="peg zone" data-z="peg' + k + '"></div>'; });
    s += '</div></div><div class="nd-hold"><h5>HOLD <small>check first. Whose telephone?</small></h5>';
    LINES.forEach(function (l) { s += '<div class="line zone" data-z="' + l[0] + '"><u><span>' + l[1] + '</span></u><div class="here"></div></div>'; });
    s += '</div><div class="nd-kill zone" data-z="spike"><h5>KILL <small>the spike</small></h5><div class="nd-spk"></div></div></div></div>' +
      '<div class="job-foot"><p class="jmsg"></p><button type="button" class="btn" id="b-go">Show Brannigan</button></div>';
    box.innerHTML = s;
    var msgEl = box.querySelector('.jmsg'), read = box.querySelector('.nd-read'), stubs = {};
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    SLIPS.forEach(function (m) {
      var b = ER.el('button', 'stub t-' + m.type, '<b><i>' + m.no + '</i>' + m.label.split(' &#183;')[0].replace('ENVIRONMENT AGENCY', 'AGENCY').replace('TEXT LINE', 'TEXT') + ' ' + m.time + '</b><span>' + m.short + '</span>');
      b.type = 'button'; b.setAttribute('data-s', m.no); stubs[m.no] = b;
    });
    function home(z) {
      if (z === 'board') return box.querySelector('.nd-grid');
      if (z === 'spike') return box.querySelector('.nd-spk');
      var n = box.querySelector('.zone[data-z="' + z + '"]');
      return z.indexOf('peg') === 0 ? n : n.querySelector('.here');
    }
    function where(n) {
      var z = pos[n], o;
      if (z === 'board') return 'Still on the board.';
      if (z === 'spike') return 'On the spike.';
      if (z.indexOf('peg') === 0) { o = SLIPS.filter(function (m) { return pos[m.no] === z && m.no !== n; }).map(function (m) { return m.no; }); return o.length ? 'On a clip to go on air, together with slip ' + o.join(' and ') + '.' : 'On a clip to go on air, by itself.'; }
      return 'Held. To ring: ' + LNAME[z] + '.';
    }
    function show(n) {
      shown = n;
      if (!n) { read.innerHTML = '<p class="none">Click a slip to read it here. Then click the place where it belongs: a clip, a telephone or the spike. Or drag it there.</p>'; return; }
      read.innerHTML = ER.gloss(FL.slip(SLIPS[n - 1])) + '<p class="where"></p>';
      read.querySelector('.where').textContent = where(n);
    }
    function render() {
      var grid = home('board'), last = null;
      SLIPS.forEach(function (m) {      /* a slip is moved only when its place has changed; on the board they stay in the order they came in */
        var h = home(pos[m.no]), b = stubs[m.no];
        if (h === grid) { if (b.parentNode !== grid || b.previousElementSibling !== last) grid.insertBefore(b, last ? last.nextSibling : grid.firstChild); last = b; }
        else if (b.parentNode !== h) h.appendChild(b);
      });
      if (shown) show(shown);
    }
    function flash(b) { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); setTimeout(function () { b.classList.remove('bad'); }, 1000); }
    function code(n) {
      var z = pos[n], o;
      if (z === 'board') return '';
      if (z === 'spike') return 'kill';
      if (z.indexOf('peg') === 0) { o = SLIPS.filter(function (m) { return pos[m.no] === z && m.no !== n; }).map(function (m) { return m.no; }); return o.length ? 'run+' + o.join('+') : 'run'; }
      return 'hold:' + z;
    }
    kit = FL.place(box, {
      item: '.stub', zone: '.zone', lock: function () { return wait || !!nextFile; },
      pick: function (item) { if (item) { show(+item.getAttribute('data-s')); FL.sfx.slip(); } },
      drop: function (item, zone) {
        var z = zone.getAttribute('data-z'), n = +item.getAttribute('data-s');
        if (z.indexOf('peg') === 0 && pos[n] !== z && SLIPS.filter(function (m) { return pos[m.no] === z; }).length >= 2) { msg('A clip holds two slips and no more: two sources for one fact.'); return false; }
        pos[n] = z; ER.flag('a-pos', pos); shown = n; render();
        if (z === 'spike') FL.sfx.spike(); else if (z.indexOf('peg') === 0) FL.sfx.clip(); else if (z === 'board') FL.sfx.slip(); else FL.sfx.key();
        msg('Slip <b>' + n + '</b>: ' + where(n).charAt(0).toLowerCase() + where(n).slice(1));
      }
    });
    /* what Brannigan says about a slip in the wrong place: from what is on the slips, and from her card */
    function why(n, c) {
      var kind = c.split(/[:+]/)[0], arg = c.split(/[:+]/)[1] || '', other = kind === 'run' ? +arg : 0, pair = { 2: 6, 6: 2 }[n];
      if (other && ((n === 1 && other === 4) || (n === 4 && other === 1))) return 'Two slips, yes. Now count the Garys. Her cousin&rsquo;s husband; her hairdresser&rsquo;s brother-in-law. It is one man, and neither of these two has been anywhere near that dam tonight. Two people who heard it from the same third person are ONE source. That is one aunt.';
      if (other && other !== pair) return 'Slips ' + n + ' and ' + other + ' are not saying the same thing. A clip is for two sources of ONE fact: two people who saw the same thing, and who do not depend on each other.';
      if (n === 8) return kind === 'kill' ? 'That is the Environment Agency, telling us how high the river is. If that goes on the spike, we may as well all go home.' : 'That is the Environment Agency, on its own river. Who were you going to ring: somebody to check the people who check the river?';
      if (n === 10) return kind === 'kill' ? 'You have just spiked the only person on that board who is out in the rain for us. She says what she can see, and nothing else. Read it again.' : 'She is our own reporter, and she is standing on the thing. There is nobody better to ring.';
      if (n === 2 || n === 6) return kind === 'run' ? 'One driver. He saw it himself, and I believe him. He is still one source. Look along the board: has anybody ELSE seen that water, somebody who has never met him?' :
        kind === 'kill' ? 'Why? He is sitting in his cab, looking at it. Nothing on this board says that he is wrong.' : 'You could ring somebody. Or you could look along the board first: somebody else has seen the very same water, and has never met him. That is a second source, and it costs nothing.';
      if (n === 1 || n === 4) return kind === 'run' ? 'On air? The DAM? On the word of a man called Gary, who is not even the one who rang? Neither of them has seen that dam tonight. That is not one source. It is a rumour with a first name.' :
        kind === 'kill' ? 'I should love to. But I do not KNOW that it is wrong, and neither do you. If that dam really is going, it is the only story tonight. Hold it. Whose job is it to know?' :
        arg === 'car' ? 'Yasmin is more than three miles from that dam, in the dark, with one pair of eyes. Whose dam is it? Ring them.' :
        arg === 'agency' ? 'The agency measures the river. It does not own the dam. Somebody does, and somebody is paid to stand on it tonight.' : 'They did not build that dam, and they are not standing on it. Whose dam is it? Ring them.';
      if (n === 3) return kind === 'run' ? 'One listener, who read it on a page on the internet, and whose own door nobody has knocked on. Read that out, and a hundred and twenty houses get up and walk out into the rain.' :
        kind === 'kill' ? 'You may well be right that she has got it wrong. You do not KNOW it. And if she is right, there are old people in Beech Court. Hold it, on the line of whoever is doing the knocking.' : 'Who goes from door to door on a night like this, telling people to leave? Ring THEM. They know which doors.';
      if (n === 5) return kind === 'run' ? '&ldquo;The bridge.&rdquo; This town has three of them, and she did not stay on the line to say which. One caller, and half a fact. Somebody shut that bridge. Who?' :
        kind === 'kill' ? 'She carried a pushchair down a flight of steps in the rain. I do not think she made that up. It is not wrong. It is not finished.' :
        arg === 'council' ? 'The council owns the bridges. Tonight somebody else is putting the tape across them. Ring those.' :
        arg === 'car' ? 'Yasmin can see one bridge from where she is standing, and that one is open. She does not know who has shut which. Who does the shutting?' : 'They look after water, not roads. Who shuts a bridge on a night like this?';
      if (n === 7) return kind === 'run' ? 'Read slip 10. Four minutes after this text came in, Yasmin was standing on that bridge with cars going past her. And this man has not seen the bridge: he has seen a photograph of it.' :
        'Check it with whom? Our own reporter is on that bridge, and it is open: slip 10. When something we KNOW says that a slip is wrong, we do not ring round. It goes on the spike.';
      if (n === 9) return kind === 'run' ? 'It is first-hand, and I dare say it is true: HE got through. The next car down that road will be a small one, with two children in the back. Thirty centimetres of moving water will float a car. We do not say this.' :
        'Check what? Whether he really got through? I believe him. The trouble with this one is not whether it is true. It is what people would DO if they heard it.';
      return kind === 'run' ? 'One caller, by himself. And what is Danny to say: &ldquo;A brook is running backwards, says a man&rdquo;? It needs a second pair of eyes.' :
        kind === 'kill' ? 'Why? Because it sounds daft? Because it is Mr Lindley again? Read the last line of the card. Nothing on this board says that he is wrong, and he has lived beside that brook since before I was born.' :
        arg === 'council' ? 'The council will send a man on Thursday. Who could go and look tonight? Or who measures rivers for a living?' : 'They have other things to do tonight, and brooks are not their business. Who could walk round and LOOK at it? Or who measures rivers for a living?';
    }
    box.querySelector('#b-go').addEventListener('click', function () {
      var left = SLIPS.filter(function (m) { return pos[m.no] === 'board'; }).length, i, c, file;
      if (wait || nextFile) return;
      kit.hold(null);
      if (left) { msg('&ldquo;There ' + (left === 1 ? 'is one slip' : 'are ' + ['', '', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven'][left] + ' slips') + ' still on the board,&rdquo; says Brannigan. &ldquo;Every one of them goes somewhere: a clip, a telephone or the spike.&rdquo;'); return; }
      for (i = 1; i <= 11; i++) {
        c = code(i);
        if (!ER.check('p' + i, c)) {
          ER.sfx.no(); msg('Brannigan takes slip <b>' + i + '</b> down and pins it back on the board. &ldquo;' + why(i, c) + '&rdquo;');
          pos[i] = 'board'; ER.flag('a-pos', pos); shown = i; render();
          flash(stubs[i]);
          return;
        }
      }
      file = ER.exit([SLIPS.map(function (m) { return code(m.no); }).join('|')], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file);
      FL.terms(['eyewitness', 'confirm']);
      FL.mine('sorted', 'The board at seven minutes to nine', '<p>RUN: 8, the Environment Agency. River 3.32 m at 20.45, and rising.</p><p>RUN: 10, Yasmin, standing on the Old Bridge at 20.48. It is open.</p>' +
        '<p>RUN: 2 and 6 on one clip. A taxi driver and a bus driver who have never met: water across Station Road at the car park gates. (The trains: only Baz says so.)</p>' +
        '<p>HOLD, water company: 1 and 4, the dam. Two slips, one Gary.</p><p>HOLD, police: 3, Carol and Church Lane. 5, &ldquo;the bridge&rdquo; that is shut.</p>' +
        '<p>HOLD, somebody to go and look: 11, Mr Lindley and the brook that runs backwards.</p><p>KILL: 7, the Old Bridge &ldquo;under water&rdquo;. 9, driving the river road.</p>', true);
      msg('Brannigan reads along the rail, then down the telephones, and then she looks at the spike for some time. &ldquo;That,&rdquo; she says, &ldquo;is a board.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Three clips on the rail: the agency on its own river, Yasmin on her own bridge, and two drivers who have never met and who saw the same water. &ldquo;Two aunts,&rdquo; says Brannigan. Those go to Danny.',
          'Two slips on the spike. One was wrong, and Yasmin was standing on the proof. The other may even be true, and it would send small cars into deep water.',
          'And five on the telephones. Brannigan picks up the first one herself. &ldquo;Water company? Wend Valley Radio. I want your duty engineer, and I want to ask him about a man called Gary.&rdquo;',
          '&ldquo;Two of yours are for the police,&rdquo; she says, with her hand over the telephone. &ldquo;Their answer will come back through the front office, and it will come back short. A policeman leaves out everything he thinks you know already.&rdquo;',
          '&ldquo;Go down and help Dilys. And look at the map before you believe one street name.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3200);
    });
    ER.addClue('slips', 'The eleven slips', SLIPS.map(FL.slip).join(''), 'slips', 'Off the board', true);
    show(0); render();
    s = SLIPS.filter(function (m) { return pos[m.no] !== 'board'; }).length;
    msg(s ? 'The board, with ' + s + (s === 1 ? ' slip' : ' slips') + ' moved so far. Click a slip to read it; then click where it goes.' :
      'Eleven slips, in the order they came in. Click one to read it. Then click the place where it goes: a clip, a telephone or the spike.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
</body>
</html>
