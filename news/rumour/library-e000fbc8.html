<style>
  body{--bg:#2a2016;--accent:#e9c46a;--font-display:'Libre Franklin',sans-serif;--font-ui:'Libre Franklin',sans-serif;--font-body:'Newsreader',serif;
    --tc-bg:rgba(34,26,16,.97);--tc-ink:#f6ecd4;--cap-bg:rgba(30,23,14,.95);--panel:#261d12;--face-bg:#6b4a2a;--q-ink:#e9c46a;--fade:#140e07;--hud-bg:rgba(30,23,14,.82)}
  .tc-room{font-size:clamp(44px,6.6vw,90px)}
  .mote{animation:mote 11s linear infinite;opacity:0}
  .mote.m2{animation-delay:-3.700s}.mote.m3{animation-delay:-7.400s}
  @keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}100%{transform:translate(60px,-150px);opacity:0}}
  #lamp{animation:lamp 2.2s steps(1,end) infinite}
  @keyframes lamp{50%{opacity:.35}}
  #copier.ready,#box.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.2)}}
  #adeleke{display:none}
  #scene.back #adeleke{display:block}
  #scene.back #signcard{display:none}

  /* the sheet from the copier, and the card with six questions */
  .sx{width:min(1050px,95vw);display:grid;grid-template-columns:1.22fr 1fr;gap:18px;-webkit-user-select:none;user-select:none}
  .sheet{position:relative;background:#f4f3ef linear-gradient(170deg,rgba(255,255,255,.7),rgba(180,180,170,.2));padding:0 18px 18px;color:#1f1f21;box-shadow:0 22px 60px rgba(0,0,0,.6)}
  .sheet-in{border:2.5px solid #1f1f21;border-top:0;padding:10px 16px 12px}
  .sheet h1{margin:0;text-align:center;font-family:'Stardos Stencil',serif;font-weight:700;font-size:62px;line-height:1;letter-spacing:.06em}
  .sheet h5{margin:3px 0 7px;padding:4px 0 3px;border-top:3px double #1f1f21;border-bottom:1px solid #1f1f21;text-align:center;font-family:'Special Elite',monospace;font-weight:normal;font-size:10.5px;letter-spacing:.1em}
  .sheet h2{margin:0 0 6px;padding-bottom:6px;border-bottom:1.5px solid #1f1f21;text-align:center;font-family:'Stardos Stencil',serif;font-weight:700;font-size:27px;line-height:1.14;letter-spacing:.02em}
  .sheet .txt{-webkit-column-count:2;column-count:2;-webkit-column-gap:20px;column-gap:20px;-webkit-column-rule:1px solid #8a8a88;column-rule:1px solid #8a8a88;font-family:'Special Elite',monospace;font-size:14.5px;line-height:1.36}
  .sheet .txt p{margin:0 0 7px}
  .ch{cursor:pointer;border-radius:2px;padding:1px 0}
  .ch:hover{background:rgba(233,196,106,.5)}
  .ch.got{background:#f5df9c;box-shadow:0 0 0 1px #c9a23a;cursor:default}
  .ch.bad{background:rgba(216,67,42,.4)}
  .edge{position:absolute;display:none}
  .sheet.hunt .edge{display:block;cursor:pointer}
  .sheet.hunt .edge:hover{background:rgba(233,196,106,.5)}
  .sheet.hunt .ch{cursor:default}.sheet.hunt .ch:hover{background:none}.sheet.hunt .ch.got:hover{background:#f5df9c}
  .edge.t{left:0;right:0;top:0;height:30px}.edge.b{left:0;right:0;bottom:0;height:26px}.edge.l{left:0;top:30px;bottom:26px;width:28px}.edge.r{right:0;top:30px;bottom:26px;width:28px}
  .sixq{background:#123a3a linear-gradient(160deg,rgba(255,255,255,.07),rgba(0,0,0,.2));color:#f4efe2;padding:12px 16px 12px;box-shadow:0 22px 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
  .sixq h6{margin:0 0 6px;font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:19px;letter-spacing:.2em;color:#e9c46a}
  .qw{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;width:100%;margin:0 0 5px;padding:5px 8px 4px;border:1.5px solid rgba(244,239,226,.25);border-radius:4px;text-align:left}
  .qw b{font-family:'Libre Franklin',sans-serif;font-weight:900;font-size:21px;letter-spacing:.04em;color:#e9c46a}
  .qw span{display:block;font-family:'Libre Franklin',sans-serif;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#b9d2cc}
  .qw em{display:block;min-height:19px;font-style:normal;font-family:'Special Elite',monospace;font-size:14px;line-height:1.3;letter-spacing:0;text-transform:none;color:#fff;border-bottom:1px dotted rgba(244,239,226,.5)}
  .qw.cur{border-color:#e9c46a;background:rgba(233,196,106,.16)}
  .qw.ok{border-color:#5fae84;cursor:default}
  .qw.ok em{border-bottom-color:transparent}
  .hole{display:none;margin-top:4px;padding:8px 10px 6px;background:rgba(0,0,0,.28);border-radius:4px;--wk-size:30px;--wk-line:#e9c46a;--wk-ink:#fff;--wk-font:'Special Elite',monospace}
  .hole.on{display:block}
  .hole label{display:block;font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.2em;color:#e9c46a;margin-bottom:2px}
  .hole .wk-typed{min-width:0;width:100%}
  .sx .pmsg{grid-column:1/3;min-height:64px;margin-top:-4px}
  .sx .pmsg b{color:#e9c46a}

  /* Box 7 */
  .bx .pull{cursor:grab}
  .bx .pull.on{cursor:grabbing}
  .bx #zoom,.bx #cutline{display:none}
  .bx.out #zoom,.bx.out #cutline{display:block}
  .bx.out #zoom{animation:zin .7s ease-out}
  @keyframes zin{0%{opacity:0}100%{opacity:1}}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, six = null, box7 = null, told = {};

  /* panelling, the poster's six tags, the shelves of atlases, the weave of the carpet, the clock, the people */
  (function () {
    var s = '', i, j, x, y, w, COL = ['#a3382a', '#27457a', '#2f6a66', '#e9c46a', '#7a4a9a', '#c9761a', '#5a6470', '#1f4a3a', '#8a6a42', '#b3261c'];
    for (i = -6; i < 22; i++) s += '<path d="M' + (i * 150 + 40) + ' 504v136"/>';
    $('#panels').innerHTML = s; s = '';
    ['WHO', 'WHAT', 'WHEN', 'WHERE', 'WHY', 'HOW'].forEach(function (t, k) {
      x = 604 + (k % 3) * 38; y = 312 + Math.floor(k / 3) * 24;
      s += '<rect x="' + x + '" y="' + y + '" width="34" height="17" rx="2" fill="#e9c46a" transform="rotate(' + [-4, 3, -2, 2, -3, 4][k] + ' ' + (x + 17) + ' ' + (y + 8) + ')"/><text x="' + (x + 17) + '" y="' + (y + 12) + '" class="cF" font-size="8" font-weight="900" text-anchor="middle" fill="#123a3a">' + t + '</text>';
    });
    $('#tags').innerHTML = s; s = '';
    s += '<rect x="1176" y="96" width="560" height="552" fill="#4a3320"/><rect x="1190" y="96" width="560" height="26" fill="#5a4028"/><rect x="1196" y="128" width="130" height="24" fill="#f1e8d2"/><text x="1261" y="145" class="cF" font-size="12" font-weight="800" text-anchor="middle" fill="#3a2414" letter-spacing="1.500">MAPS &amp; ATLASES</text>';
    for (j = 0; j < 4; j++) {
      y = 164 + j * 122; x = 1196;
      s += '<rect x="1190" y="' + y + '" width="560" height="110" fill="#2a1c10"/>';
      for (i = 0; i < 30 && x < 1640; i++) {
        w = 14 + ((i * 7 + j * 5) % 5) * 5;
        if (j === 3 && i > 3 && i < 7) { x += w + 2; continue; }      /* the gap that an atlas leaves */
        s += '<rect x="' + x + '" y="' + (y + 10 + ((i + j) % 4) * 6) + '" width="' + w + '" height="' + (100 - ((i + j) % 4) * 6) + '" fill="' + COL[(i * 3 + j * 4) % 10] + '"/>' + (w > 22 ? '<rect x="' + (x + 5) + '" y="' + (y + 40) + '" width="' + (w - 10) + '" height="22" fill="#f1e8d2" opacity=".8"/>' : '');
        x += w + 2;
      }
      s += '<rect x="1190" y="' + (y + 110) + '" width="560" height="12" fill="#6b4a2a"/>';
    }
    $('#shelves').innerHTML = s; s = '';
    for (i = 0; i < 14; i++) s += '<path d="M-400 ' + (670 + i * 20) + 'H2000"/>';

        var e = n.getAttribute('data-e'), file;

        if (!ER.check('edge', e)) { ER.sfx.no(); msg('&ldquo;No,&rdquo; says Priya. &ldquo;Along that side the black line of the frame is there, and it turns its corners. Nothing is missing. Try the other sides.&rdquo;'); return; }
        file = ER.exit(['hole-' + e], { wait: true });
        if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
        wait = true; nextFile = file; ER.flag('c-file', file);
        RUM.mine('hole', 'The hole in the sheet', '<p>WHO: the Education Committee of the County Council.</p><p>WHAT: Petherwick School is to close.</p><p>WHERE: decided at County Hall.</p><p>WHY: only 212 pupils. (Not the roof!)</p><p>HOW: by bus to Aldersea.</p>' +
          '<p>WHEN: &ldquo;in July&rdquo;. WHICH July? No year. No date on the sheet anywhere. The frame runs off the top of the paper: the top of the page is missing.</p>', true);
        msg('The two side lines of the frame run straight off the top of the paper, and there is no line across. &ldquo;It isn&rsquo;t all here,&rdquo; says Nell. &ldquo;The top of the page isn&rsquo;t on the sheet.&rdquo;');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            '&ldquo;Then somebody has cut it off,&rdquo; says Priya.',
            '&ldquo;Nobody has cut anything,&rdquo; says a voice behind you. A woman with an armful of folders is standing at the desk, looking at three people round her photocopier.',
            '&ldquo;Ms Adeleke. I am the librarian, and that is my copy. I made it yesterday for the centenary case, and then the telephone rang. The old page is foolscap: longer than A4. The copier only takes A4. So the top of the page fell off the edge of the glass, and I have only this minute noticed.&rdquo;',
            '&ldquo;The old page,&rdquo; says Priya. &ldquo;So there is one.&rdquo;</p><p>&ldquo;A photocopy is a copy, Miss Varma. It was copied from something.&rdquo; She puts the folders down, and unties the white tape on Box 7. &ldquo;Nothing in this box leaves the library. But you may certainly look.&rdquo;'
          ], function () { busy = false; tell('back'); paint(); });
        }, 3200);
      });
    });
    cur = next(); draw();
    if (stage() === 1) typing();
    msg(stage() === 2 ? 'No year, and no date. Where has it gone? Look at the sheet itself, and click the part of it that is not as it should be.' :
      stage() === 1 ? 'Six questions, six answers. One of the answers is not an answer at all. Which? Type one word, and press Enter.' :
      nGot() ? 'The sheet, and the card: ' + nGot() + ' of the six questions have an answer so far.' :
      'The sheet from the copier: all of it, for the first time today. Click a question on the green card, and then click the words on the sheet that answer it.');
    ER.addClue('sheet', 'The sheet from the copier', sheetHtml(false), 'photocopy', 'In the library', true);
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }

  /* ---------- Box 7: the old page, in its folder ---------- */
  function makeBox() {
    var box = ER.el('div', 'bx'), SC = 0.62, X0 = 150, Y0 = 40, MAX = 216, dy = 0, done = false, off = 0, s;
    s = '<svg viewBox="0 0 1000 600"><defs><linearGradient id="tabG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a42"/><stop offset="1" stop-color="#6b4f2e"/></linearGradient><clipPath id="zc"><rect x="0" y="0" width="420" height="66"/></clipPath></defs>' +
      '<rect width="1000" height="600" fill="url(#tabG)"/><g stroke="#5a3d22" stroke-width="2" opacity=".5"><path d="M0 150h1000M0 300h1000M0 450h1000"/></g>' +
      /* the copy, for comparison */
      '<g transform="translate(660 196)"><rect x="6" y="8" width="260" height="368" fill="#000" opacity=".3"/><svg width="260" height="368" viewBox="0 66 420 594">' + RUM.page({ strip: false, paper: '#f4f3ef' }) + '</svg>' +
      '<text x="130" y="392" class="cM" font-size="12.500" text-anchor="middle" fill="#f6ecd4">THE COPY: A4, 297 mm long</text></g>' +
      /* the old page, which comes out from under the folder */
      '<g id="oldpage" class="pull"><rect x="' + (X0 + 6) + '" y="' + (Y0 + 8) + '" width="260" height="409" fill="#000" opacity=".3"/><svg x="' + X0 + '" y="' + Y0 + '" width="260" height="409" viewBox="0 0 420 660">' + RUM.page({ ink: '#5b3b8f', paper: '#f1e6c8' }) + '</svg>' +
      '<g id="cutline"><path d="M' + (X0 - 26) + ' ' + (Y0 + 41) + 'h312" stroke="#d8432a" stroke-width="2.500" stroke-dasharray="7 5"/><text x="' + (X0 + 292) + '" y="' + (Y0 + 36) + '" class="cK" font-size="15" font-weight="700" fill="#ffd98a">the copier began here</text></g></g>' +
      '<g id="folder"><path d="M110 16h340v236H110z" fill="#c9a56a"/><path d="M110 16h340v236H110z" fill="none" stroke="#8a6a3a" stroke-width="2"/><path d="M110 252h340l-10 10H120z" fill="#a8844a"/><rect x="150" y="50" width="200" height="56" fill="#fdfdf8"/>' +
      '<text x="250" y="74" class="cM" font-size="15" font-weight="500" text-anchor="middle" fill="#16202c">BOX 7 &#183; SCHOOL PAPER</text><text x="250" y="94" class="cK" font-size="15" text-anchor="middle" fill="#1a2a52">Nos. 1 to 9. Handle gently.</text><path d="M280 236l-14 -14h28z" fill="#8a6a3a"/></g>' +
      /* the top of the page, large */
      '<g id="zoom" transform="translate(480 26)"><rect x="-6" y="-6" width="512" height="120" fill="#16202c"/><svg width="500" height="78.600" viewBox="0 0 420 66"><g clip-path="url(#zc)">' + RUM.page({ ink: '#5b3b8f', paper: '#f1e6c8' }) + '</g></svg>' +
      '<text x="250" y="100" class="cM" font-size="12.500" text-anchor="middle" fill="#ffd98a">THE TOP OF THE OLD PAGE: FOOLSCAP, 330 mm long</text></g></svg>' +
      '<div class="bx-foot"><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var svg = box.querySelector('svg'), page = box.querySelector('#oldpage'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function place() { page.setAttribute('transform', 'translate(0 ' + dy.toFixed(1) + ')'); box.setAttribute('data-dy', dy.toFixed(0)); }
    ER.drag(page, {
      start: function (e) { if (done) return false; off = dy - ER.pt(svg, e).y; },
      move: function (e) { dy = RUM.clamp(ER.pt(svg, e).y + off, 0, MAX); place(); },
      end: function () {
        if (dy < MAX - 8) { msg(dy > 60 ? 'Purple ink. SAYS COUNCIL&hellip; SCHOOL TO CLOSE IN JULY&hellip; and a name in big letters. Further: pull it right out.' : 'The old page is still nearly all inside its folder. Take hold of it and pull it down, towards you.'); return; }
        dy = MAX; place(); done = true; box.classList.add('out'); RUM.sfx.fold();
        tell('strip'); RUM.terms(['archive', 'issue', 'front page']);
        RUM.mine('strip', 'The top of the old page', '<p>No. 1. FRIDAY 12 MARCH 1976. PRICE 5p.</p><p>Editor: D. CORRIGAN, 4B.</p><p>The picture is the front page of the first Wick. It is fifty years old.</p><p>No. 4, 28 May 1976: SCHOOL STAYS OPEN. The full Council said no.</p>', true);
        msg('Purple ink, gone soft with age. And along the top, in the strip that the copier never saw: <b>No. 1. FRIDAY 12 MARCH 1976. PRICE 5p.</b>');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            '&ldquo;Nineteen seventy-six,&rdquo; says Priya. &ldquo;It&rsquo;s fifty years old. The school was going to close in July, nineteen seventy-six.&rdquo;',
            '&ldquo;And it did not,&rdquo; says Ms Adeleke. She lifts another purple sheet out of the box. No. 4, 28 May 1976: SCHOOL STAYS OPEN. &ldquo;The full Council said no. I am told that this paper had something to do with it.&rdquo;',
            'Nell is still reading the strip along the top. She reads the end of it twice. &ldquo;Editor: D. Corrigan, 4B,&rdquo; she says. &ldquo;There isn&rsquo;t a 4B.&rdquo;',
            '&ldquo;There was,&rdquo; says Ms Adeleke. &ldquo;The fourth year is what you call Year 10. He would have been fourteen or fifteen.&rdquo;',
            'For a moment nobody says anything. Outside, at the front of the school, a man in a yellow jacket is counting Year 7s on to a bus.',
            '&ldquo;Eleven minutes,&rdquo; says Priya. &ldquo;Ms Adeleke, may we take No. 1 as far as Room E7? I&rsquo;ll sign for it.&rdquo;</p><p>&ldquo;You will all sign for it,&rdquo; says Ms Adeleke. &ldquo;And I am coming with it.&rdquo;'
          ], function () { busy = false; showGo(); });
        }, 4200);
      }
    });
    place();
    msg('Box 7, and in it a brown folder. A sheet of old paper is sticking out of the bottom of the folder, with purple writing on it. Take hold of the sheet and pull it down, towards you.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
