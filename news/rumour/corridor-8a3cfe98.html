    for (i = 0; i < 12; i++) if (st[i] === '-') { cur = i; break; }

    msg(count() ? 'Theo&rsquo;s notebook: ' + count() + ' of the twelve lines have a stamp.' : 'Theo&rsquo;s notebook: twelve things that twelve people said between the bell and the stairs. Read a line, and bring a stamp down on it. The arrows turn the pages.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
