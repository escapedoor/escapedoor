      'Friday, twenty past three. The last bell went five minutes ago, and this is your first afternoon on <i>The Wick</i>, the news site of Petherwick School. Its office is Room E7a. E7a used to be a stationery cupboard, and it has not got any bigger.',

      if (!a.area) return 'C says &ldquo;It&rsquo;s official&rdquo;. ' + Pp + ' does not say that anywhere. A word that has been added stays on in later copies. So where did C get it?';
      if (b.area < a.area) return 'Look how much of the page each one shows. ' + Pp + ' shows less of it than ' + C + ' does. A copy can lose a piece of the picture. It can never grow one back.';
      if (b.red && !a.red) return Pp + ' has red letters across it. ' + C + ' has not. Nobody rubs a mark out of a picture: what is added stays. So ' + C + ' was not made from ' + Pp + '.';
      if (b.ring && !a.ring) return Pp + ' has a blue ring drawn on it. ' + C + ' has not. Nobody rubs a mark out of a picture: what is added stays. So ' + C + ' was not made from ' + Pp + '.';
      if (a.m && b.m && b.m > a.m) return Pp + ' was sent at ' + b.t + ', and ' + C + ' at ' + a.t + '. A copy cannot be older than the thing it was copied from.';
      if (a.ring && !b.ring) return C + ' has a piece of a blue ring on it, cut through by the edge of the picture. A mark that is cut by the edge was there before the cut. ' + Pp + ' has no blue on it anywhere.';
      if (c === 'a' && p === 'e') return 'By the picture alone, it could be. Now look along the very bottom edge of A&rsquo;s picture. Reuben&rsquo;s snip was a little too tall, and it caught the top of something underneath.';
      return 'Could ' + C + ' really have been made from ' + Pp + '? Put them side by side again: the edges, the marks, the times.';
    }
    box.querySelector('#n-go').addEventListener('click', function () {
      var i, c, n = 0, file;
      if (wait || nextFile) return;
      ORDER.forEach(function (k) { if (links[k]) n++; });
      if (n < 6) { msg('&ldquo;Six copies,&rdquo; says Priya, &ldquo;and ' + (n ? 'only ' + ['', 'one', 'two', 'three', 'four', 'five'][n] + ' of them ' + (n === 1 ? 'has' : 'have') + ' a thread' : 'not one thread') + '. Every copy came from somewhere: from another copy on this wall, or from one that we have not got.&rdquo;'); return; }
      for (i = 0; i < 6; i++) {
        c = ORDER[i];
        if (!ER.check('l' + c, links[c])) {
          ER.sfx.no(); show(c); flash(box.querySelector('.card[data-c="' + c + '"]'));      /* not ER.shake: a transform from the style sheet would throw a drawing's group back to the corner */
          msg('Priya puts a finger on the thread from <b>' + c.toUpperCase() + '</b>, and takes it off the wall. &ldquo;' + why(c, links[c]) + '&rdquo;');
          delete links[c]; ER.flag('a-links', links); show(c); return;
        }
      }
      file = ER.exit([ORDER.map(function (k) { return links[k]; }).join('-')], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file);
      RUM.mine('trail', 'The trail of copies', '<p>B, Jago, Fri 08.05: from a copy we have not got.</p><p>E, Mina, 08.31: from B. The system says so.</p><p>F, Tobi: from E. Half of Mina&rsquo;s blue ring.</p>' +
        '<p>A, Reuben, 12.40: from F. His snip caught Tobi&rsquo;s words. He added IT&rsquo;S OFFICIAL.</p><p>C, a parent, 14.32: from A. The word &ldquo;official&rdquo;.</p>' +
        '<p>D, Saffron, 13.05: from a copy we have not got. Hers shows more of the page than any other.</p><p>Six copies. One source. Not met yet.</p>', true);
      msg('Priya follows every thread with one finger, from the newest copy back to the oldest. &ldquo;Yes,&rdquo; she says. &ldquo;That is how it travelled. Now look where it stops.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Six copies, six threads. Four of them tie one copy to another. The other two go to the empty card at the top of the wall.',
          '&ldquo;Two people who have never spoken to each other,&rdquo; says Priya. &ldquo;Jago in Year 9, at five past eight. Saffron in Year 11, five hours later, with more of the page than he had. Neither made it. Each of them was sent it by somebody else.&rdquo;',
          'Theo is counting his printouts. &ldquo;So it isn&rsquo;t six sources.&rdquo;</p><p>&ldquo;It&rsquo;s one,&rdquo; says Priya. &ldquo;And we haven&rsquo;t met it yet.&rdquo;',
          '&ldquo;Saffron says her brother is in Year 8. Jago has a sister in Year 8 as well: she is in the choir, and she never stops. And the bell has gone, so Jago will be at his locker.&rdquo;',
          'She takes a card on a red ribbon off its hook and hangs it round your neck. THE WICK: TRAINEE. &ldquo;Year 9 corridor. Theo, bring your notebook. Try to write down what people say, and not what you wish they had said.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3000);
    });
    show('a'); sel = null; draw();
    box.querySelector('#detail').innerHTML = '';
    box.querySelector('#dnote').textContent = 'Click a printout to look at it here.';
    k = 0; ORDER.forEach(function (c) { if (links[c]) k++; });
    msg(k ? 'The wall, with ' + k + (k === 1 ? ' thread' : ' threads') + ' on it so far. Pull a thread from the red pin of a copy to the copy it was made from.' :
      'Six printouts, in the order that Theo found them, which is no order at all. Click one to look at it properly. Then pull a thread from its red pin to the copy it was made from.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
</body>
</html>
