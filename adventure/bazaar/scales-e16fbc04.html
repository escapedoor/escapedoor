  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('s-told', told); return true; }
  function isBusy() { return busy; }
  var ASK = [null,
    '&ldquo;First. The red shop says VECKS OLD SHOP, EST. 1688. Every word of that is true, and it is not my shop. What in this lane tells you how long HE has been in it?&rdquo;',
    '&ldquo;Second. What tells you where the family went?&rdquo;',
    '&ldquo;Third. Rule 7: a maker buys back her own work. What tells you that something came back to this door today?&rdquo;'];
  function paint() {
    var on = stage >= 1 && stage <= 3 && !nextFile;
    $('#ask').classList.toggle('on', on); document.body.classList.toggle('asking', on);
    if (on) $('#ask span').innerHTML = ER.gloss(ASK[stage]);
    $('#go').classList.toggle('on', !!(nextFile && told.rules));
    ER.pips(Math.min(4, (stage > 0 ? 1 : 0) + Math.max(0, stage - 1)) + (nextFile && told.rules ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The compass is on her shelf, and she will swap it for a lark that is singing. The bird-woman sits by the fountain.']];
    if (stage === 1) return ['q1', ['She is asking about the red shop, and about TIME: how long its shopkeeper has been there. Read everything of his that has writing on it: the board, the gold ring, the card in the window, the price list.', 'A date on a board says when a SHOP began. Something else at the red shop says when its shopkeeper began. Look in his window.']];
    if (stage === 2) return ['q2', ['Now it is something of hers. One thing at the small dark shop says where the family used to be, and that they are the same family.', 'A name only says who. You want the thing that says WHERE FROM. Read what is in her window.']];
    if (stage === 3) return ['q3', ['Rule 7 says that a maker must buy back her own work. Somewhere beside her door, she keeps a count of what she has bought back.', 'What hangs beside her door, has a rule written at the top of it, and was written on this morning?']];
    return ['look', [
      'Two doors say Veck. Before you knock at either, read everything in the lane that has writing on it: boards, cards in windows, a price list, a slate. Click on them.',
      'A maker must buy back HER OWN work. So the door you want belongs to the family who made the compass: not to whoever is in their old shop now. Which shop says that it has changed hands? Which says where it moved from?',
      'VECKS OLD SHOP means the shop that used to be Veck&rsquo;s: and a card in its window says UNDER NEW MANAGEMENT. The small dark shop in the middle says that it moved from the first door in the lane. So which of the two is the family?'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; if (!told.rules) inside(); else ER.say('The lane of the scale-makers. Number 41 is on Mistress Veck&rsquo;s shelf, and it is staying there until a lark sings.'); return; }
    if (told.intro) { busy = false; ER.say(stage ? 'Mistress Veck is waiting behind her door, with one eye at the gap.' : 'Five shop-fronts, and two of them say Veck.'); return; }
    ER.narrate([
      'The light comes down through the mats in long yellow stripes, and brass scales turn slowly in it. Five shop-fronts stand side by side. After the street outside, it is as quiet as a room.',
      'The first one is red, and its board says VECKS OLD SHOP in gold. A yellow umbrella is leaning by its door.',
      'The third one is small and dark, and its board says VECK&rsquo;S, in letters that have worn down to the wood.',
      'The compass went to Veck. You have time to knock at one wrong door, perhaps. You would rather not knock at four.'
    ], function () { busy = false; tell('intro'); });
  }

  /* ---------- what every board, card and slate in the lane says ---------- */
  var LOOK = {
    'b-board': 'Fresh gold letters on fresh red paint: <em>VECKS OLD SHOP</em>. Where the paint is still thin, older letters show through it like a shadow: VECK &amp; DAUGHTER.',
    'b-date': '<em>EST. 1688</em>, in a gold ring. The paint is so new that a fly has stuck in the 6.',
    'b-notice': 'A card in the window of the red shop: <em>UNDER NEW MANAGEMENT since the Feast of Lamps. B. Brill, proprietor.</em>',
    'b-prices': 'A price list on a stand: <em>Compasses of the genuine VECK PATTERN, 9 moons. Scales from 2 moons. Engraving free while you wait: any name, any number.</em>',
    'b-table': 'A table outside the red shop, with eighteen compasses on it: all exactly alike, and all very shiny.',
    'umb': 'A yellow umbrella, leaning by the door of the red shop. It has not rained in Ombra since the spring. Whoever owns it is not from here, and left in a hurry.',
    'p-board': '<em>THE HONEST POUND. Weights and measures. Est. 1731. The oldest shop in this lane.</em> It is the only board in the lane with a full stop after every line.',
    'p-notice': 'A card on the door: <em>We sell weights. We buy nothing, from anybody, ever. Do not ask.</em>',
    'v-board': 'A small dark board, with its letters worn down to the wood: <em>VECK&rsquo;S</em>.',
    'v-cross': 'Under the name: <em>Scales made and mended.</em> And under that another line, painted out long ago with one stroke of the brush. You can still read it: <em>Compasses made and mended.</em>',
    'v-moved': 'A card in the window of the small dark shop, in small neat writing: <em>Moved here from the first door in the lane at the Feast of Lamps. Same family. Same scales. Est. 1688.</em>',
    'v-slate': 'A slate on a nail by the door. <em>GUILD RULE 7. BOUGHT BACK:</em> and under it the seven days of the week. Six of them have nothing beside them. Beside today there is one stroke of chalk, and the chalk dust is still on the step.',
    'v-hook': 'An iron hook over the door, with nothing hanging on it. On the step below it lies a small ring of seed husks.',
    'c-sign': 'A round sign with a compass painted on it: <em>THE COMPASS</em>. Under the sign there are small tables, and a great many teapots.',
    'c-notice': 'A card, written by somebody who has been asked too often: <em>TEA. We do not sell compasses. We have never sold compasses. The last owner liked the picture.</em>',
    't-sign': '<em>THE RIGHT TIME. Clocks. Est. 1650.</em> And The Honest Pound, est. 1731, says that it is the oldest shop in the lane. They cannot both be right.',
    't-notice': '<em>Every clock here is right twice a day.</em> There are twelve clocks in the window. No two of them agree.'
  };
  var SIGNS = '<h4>The lane of the scale-makers: five shop-fronts</h4>' +
    '<p><b>1. VECKS OLD SHOP</b> (red and gold) Est. 1688. Compasses, scales, curiosities. Card in the window: UNDER NEW MANAGEMENT since the Feast of Lamps. B. Brill, proprietor. Price list: compasses of the genuine VECK PATTERN, 9 moons; engraving free while you wait, any name, any number.</p>' +
    '<p><b>2. THE HONEST POUND</b> Weights and measures. Est. 1731. The oldest shop in this lane. Card: We buy nothing, from anybody, ever.</p>' +
    '<p><b>3. VECK&rsquo;S</b> (small and dark) Scales made and mended. Painted out: Compasses made and mended. Card: Moved here from the first door in the lane at the Feast of Lamps. Same family. Same scales. Est. 1688. Slate: GUILD RULE 7, BOUGHT BACK: today, one.</p>' +
    '<p><b>4. THE COMPASS</b> Tea. We do not sell compasses.</p><p><b>5. THE RIGHT TIME</b> Clocks. Est. 1650. Every clock here is right twice a day.</p>';
  var WR = [null, {
    'b-board': '&ldquo;His board says that it is Veck&rsquo;s old shop: the shop that used to be ours. So it is. It took him a week to think of. But a board does not say how long the man under it has been there. Something else of his does.&rdquo;',
    'b-date': '&ldquo;1688 is the year my family opened that door. He has painted somebody else&rsquo;s birthday on his own cake. But what tells you so?&rdquo;',
    'b-prices': '&ldquo;&lsquo;Of the genuine Veck pattern.&rsquo; A compass made LIKE one of ours. That tells you what he sells. I asked how long he has been selling it.&rdquo;',
    'v-moved': '&ldquo;That is mine, and it answers my next question. This one is about HIM.&rdquo;',
    '*': '&ldquo;No. Look at the red shop again: at everything of his that has writing on it.&rdquo;'
  }, {
    'v-board': '&ldquo;My name, with its apostrophe: VECK&rsquo;S, the shop that belongs to Veck. Good: you have noticed that his has none. But a name is only a name. What says that we are the same family who were in the red shop?&rdquo;',
    'v-cross': '&ldquo;My father painted that line out in the year my grandfather died. Nobody in this family has made a compass since. It says what we stopped doing. I asked where we went.&rdquo;',
    'b-notice': '&ldquo;That was the first answer: it says that he came. Now, where did WE go?&rdquo;',
    '*': '&ldquo;No. This time it is something of mine.&rdquo;'
  }, {
    'v-hook': '&ldquo;The hook tells you that something is missing from this door. I asked what came TO it. I shall get to the hook.&rdquo;',
    'b-table': '&ldquo;Those are Mr Brill&rsquo;s. He sells them. He will never have to buy one back, because he has never made one.&rdquo;',
    'p-notice': '&ldquo;The Honest Pound buys nothing, and says so. I asked who DID buy.&rdquo;',
    '*': '&ldquo;No. It hangs beside my door, and it was written on this morning.&rdquo;'
  }];
  var RIGHT = [null,
    '&ldquo;Under new management since the Feast of Lamps. A shop can be a hundred and fifty years old, and its shopkeeper three weeks. Good.&rdquo;',
    '&ldquo;Moved from the first door in the lane. Same family. I wrote that card myself, and you are the first stranger who has ever read it.&rdquo;',
    '&ldquo;One stroke of chalk beside today. Rule 7 says that I must write it up. It does not say that I must like it.&rdquo; The door opens.'];

  $('#scene').addEventListener('click', function (e) {
    var h = e.target.closest ? e.target.closest('[data-h]') : null, d = e.target.closest ? e.target.closest('[data-door]') : null, id, file;
    if (busy) return;
    if (h) {
      id = h.getAttribute('data-h');
      if (stage >= 1 && stage <= 3 && !nextFile) {
        if (!ER.check('q' + stage, id)) { ER.sfx.no(); ER.say(LOOK[id] + '<br>' + (WR[stage][id] || WR[stage]['*'])); return; }
        picked[stage - 1] = id; ER.flag('s-picked', picked); BZ.sfx.chalk();
        if (stage < 3) { ER.say(RIGHT[stage]); stage++; ER.flag('s-stage', stage); paint(); return; }
        file = ER.exit([picked.join('|')], { wait: true });
        if (!file) { ER.say('The door stays shut. Something is wrong with this page: tell your teacher.'); return; }
        nextFile = file; ER.flag('s-file', file); stage = 4; ER.flag('s-stage', 4); paint(); busy = true;
        ER.narrate([RIGHT[3]], function () { inside(); });
        return;
      }
      ER.say(LOOK[id]);
      if (id === 'b-prices') ER.addClue('brill-list', 'Mr Brill’s price list', '<h4>On a stand outside the red shop</h4><p>Compasses of the genuine VECK PATTERN, 9 moons.</p><p>Scales from 2 moons.</p><p>Engraving free while you wait: any name, any number.</p>', 'mine', 'Copied down', true);
      if (id === 'v-slate' || id === 'v-moved' || id === 'b-notice') BZ.words(['under new management', 'proprietor', 'slate']);
      return;
    }
    if (d) knock(d.getAttribute('data-door'));
  });
  function knock(w) {
    if (nextFile) { ER.say(w === 'v' ? 'Mistress Veck has gone back to her bench. You know what she wants.' : 'You have no more time for wrong doors.'); return; }
    if (stage >= 1) { ER.say(w === 'v' ? ASK[stage] : 'Mistress Veck is watching you from her door. She asked you to point at something, not to go visiting.'); return; }
    BZ.sfx.knock();
    if (!ER.check('door', w)) {
      if (w === 'b') { brill(); return; }
      ER.say({
        p: '&ldquo;We buy nothing,&rdquo; says a voice behind the door, before you have asked anything. &ldquo;It is on the card.&rdquo;',
        c: 'A man looks up from a teapot. &ldquo;Tea?&rdquo; You ask about a compass. He points, tiredly, at the card in his window.',
        t: 'Twelve clocks, twelve different times. &ldquo;Come back at the right time,&rdquo; says the clockmaker. &ldquo;Which is?&rdquo; &ldquo;Any of them.&rdquo;'
      }[w]);
      return;
    }
    ER.talk({
      who: 'Somebody behind the door', role: 'The small dark shop', face: window.FACE('veck'),
      lines: [
        { note: 'The door opens as wide as a hand. Behind it there is one grey eye, and a pair of spectacles pushed up into grey hair.', a: '&ldquo;You are the third this morning to tell me that a compass is theirs. One was a tall woman who could not wait. One was a man who sells pickles, and was only guessing. Why should you be different?&rdquo;' },
        { q: 'The name on the lid is Veck. Hob, at the gate, said that it would come home.', a: 'There are two doors in this lane with my name over them, and most strangers knock at the wrong one, because it is bigger and it is red. Perhaps you were lucky. I do not open my door to luck.' },
        { q: 'I was not lucky. I read the lane.', a: 'Then show me. Three questions, and you may point: I can see all five shop-fronts from here.' }
      ],
      clue: { id: 'veck0', title: 'Mistress Veck, through her door', kind: 'What she said' }, last: 'Step back into the lane',
      done: function (seen) {
        if (!seen) return;
        stage = 1; ER.flag('s-stage', 1); paint();
        ER.addClue('signs', 'What the lane says', SIGNS, 'signs', 'Five shop-fronts');      /* so that a board can be read again without pointing at it */
      }
    });
  }
  function brill() {
    ER.talk({
      who: 'Mr Brill', role: 'Proprietor · Vecks Old Shop', face: window.FACE('brill'),
      lines: [
        { note: 'A red waistcoat, a moustache with points on it, and both hands held out as if you were a cake.', a: '&ldquo;Welcome, welcome, to Vecks Old Shop! Established 1688!&rdquo;' },
        { q: 'Are you Mr Veck?', a: 'I am Mr Brill. The shop is Veck&rsquo;s old shop. I have never said that it is Veck&rsquo;s shop. I say that it is Veck&rsquo;s OLD shop, which it is: they were in it for a hundred and fifty years, and I have been in it since the Feast of Lamps. Read the board, young friend. Every word of it is true.' },
        { q: 'Did somebody sell you a compass this morning?', a: 'Sell ME one? I do not buy. I sell. I can sell you a compass of the genuine Veck pattern, nine moons, with any name or number on the lid while you wait.</p><p class="note">He looks at the door-post.</p><p>A tall lady asked me the very same question an hour ago, and went out so fast that she left her umbrella. If you see her, tell her that it is quite safe.' }
      ],
      clue: { id: 'brill', title: 'Mr Brill, of Vecks Old Shop', kind: 'What he said' },
      done: function (seen) { if (seen && tell('brill')) ER.say('Not here, then. And the tall woman has already asked. She is an hour ahead of you.'); }
    });
  }

  /* ---------- inside the small dark shop ---------- */
  var RULES = '<h4>The Guild of Scale-makers · Ombra</h4>' +
    '<p><b>RULE 7.</b> A maker shall buy back her own work from whoever brings it to her door, at the Guild price, and shall ask no questions.</p>' +
    '<p><b>RULE 8.</b> A piece that is bought back shall lie a day and a night on the maker&rsquo;s shelf before it is sold to anybody.</p>' +
    '<p><b>RULE 9.</b> When it leaves the shelf, it shall be handed only to the name that is written against it in the Guild&rsquo;s book, and to nobody else.</p>';
  function inside() {
    busy = true;
    ER.addClue('signs', 'What the lane says', SIGNS, 'signs', 'Five shop-fronts', true);
    ER.talk({
      who: 'Mistress Veck', role: 'Scale-maker · the small dark shop', face: window.FACE('veck'),
      lines: [
        { note: 'The shop is small, dark and exactly tidy. On the shelf behind her, between two brass balances, lies a flat wooden box that you last saw on a money-changer&rsquo;s counter.', a: '&ldquo;Number 41. My grandfather made it for the Salt Road, and it is the best thing that ever had our name on it. A gate child brought it to my door at ten past seven: Jory, who runs for the money-changer. I paid her the Guild price, four moons. Rule 7. I did not ask where she had it from. Rule 7 again.&rdquo;' },
        { q: 'It belongs to the Solheim caravan. I will pay you the four moons.', a: 'You have twenty-two coppers: I can hear a purse through a wall. And if you had forty moons it would be the same. Rule 8: a piece that is bought back lies a day and a night on the maker&rsquo;s shelf before it is sold. To anybody. The Guild likes a thief to have time to be sorry.' },
        { q: 'The caravan leaves at noon.', a: 'Then it is lucky that Rule 8 says SOLD. I have read it a great many times, and it says nothing whatever about swapping.</p><p class="note">She looks up at the iron hook over her door.' },
        { q: 'What would you swap it for?', a: 'My father kept a Pale lark on that hook. It sang every morning for forty years, until the day we moved, and I have not heard one true note in this lane since. The bird-woman by the fountain has larks. Bring me one that is singing when it comes through my door, and you may carry Number 41 out of it. Only if it is singing, mind. A lark that is not singing is a sparrow that cost more.' },
        { q: 'Has anybody else asked you that?', a: 'The tall one. She offered me twelve moons. I told her Rule 8. She asked what I would take instead. I said: a Pale lark. And she was gone. I had not got as far as the word &ldquo;singing&rdquo;. She left her umbrella at Mr Brill&rsquo;s, too. That woman will get everywhere first, and have to go back.' }
      ],
      clue: { id: 'veck', title: 'Mistress Veck, in her shop', kind: 'What she said' }, last: 'Look at the card by the door',
      done: function () {
        BZ.words(['lark', 'swap']);
        ER.read({ html: RULES, cls: 'rule', clue: { id: 'rules', title: 'Rules 7, 8 and 9', kind: 'A card of the Guild' }, done: function () {
          tell('rules'); paint();
          ER.narrate([
            'Rule 7 brought the compass here. Rule 8 keeps it here. You read Rule 9 as well, because it is on the same card, and because this morning has taught you to read to the bottom of things.',
            'Twenty-two coppers, and you need a bird that sings. You know the way to the fountain: it is the way you came.'
          ], function () { busy = false; });
        } });
      }
    });
  }

  BZ.thing('#cat', null, 'A black cat, asleep in the one place in the lane where nobody can get past without stepping over her.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile && told.rules) ER.leave(nextFile); });
})();
</script>
</body>
</html>
