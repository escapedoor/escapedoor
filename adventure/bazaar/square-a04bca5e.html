  .pick:hover{background:#f0e2b4}

(function () {

  /* the houses on the north side, sacks of spice, lemons, cages, the people */
  (function () {
    var s = '', i, x;
    for (i = 0; i < 9; i++) {
      x = 250 + i * 122;
      s += '<rect x="' + x + '" y="' + (250 + (i * 37) % 60) + '" width="124" height="320" fill="' + ['#d8b986', '#e2c89a', '#cba873'][i % 3] + '"/>' +
        '<path d="M' + (x + 26) + ' 560v-70q0 -34 36 -34t36 34v70z" fill="#6b5234"/><rect x="' + (x + 30) + '" y="350" width="24" height="36" fill="#5a7a6a"/><rect x="' + (x + 72) + '" y="350" width="24" height="36" fill="#5a7a6a"/>';
    }
    $('#houses').innerHTML = s; s = '';
    ['#c8402c', '#e2b521', '#8a5a2a'].forEach(function (c, j) { x = 60 + j * 58; s += '<path d="M' + x + ' 560q-6 -44 4 -52h36q10 8 4 52z" fill="#cdb78c" stroke="#8f7a52" stroke-width="2"/><path d="M' + (x + 4) + ' 510l18 -24 18 24z" fill="' + c + '"/>'; });
    $('#sacks').innerHTML = s + '<g transform="translate(1372 470) scale(1.300)">' + BZ.item('cloth') + '</g>'; s = '';
    for (i = 0; i < 26; i++) s += '<circle cx="' + (432 + (i % 9) * 30 + (Math.floor(i / 9) % 2) * 15) + '" cy="' + (682 - Math.floor(i / 9) * 20) + '" r="14" fill="' + (i % 4 ? '#f2d21e' : '#e6c010') + '" stroke="#b99a10" stroke-width="1.500"/>';
    $('#lemons').innerHTML = s; s = '';
    [[1010, 444, 0.9, '#e2b521'], [1070, 590, 0.8, '#c8402c'], [1130, 590, 0.85, '#3f7a5a']].forEach(function (g) {
      s += '<g transform="translate(' + g[0] + ' ' + g[1] + ') scale(' + g[2] + ')">' + BZ.item('cages') + '<g class="hop"><ellipse cx="30" cy="58" rx="8" ry="6" fill="' + g[3] + '"/><circle cx="24" cy="52" r="4" fill="' + g[3] + '"/></g></g>';
    });
    $('#cages').innerHTML = s;
    $('#crowd').innerHTML = BZ.crowd('sq', 9, 280, 1320, 570, 620, 0.7, 0.95);
    $('#pzeb').innerHTML = BZ.person(190, 870, 1.15, { coat: '#eadfc4', skin: '#b98558', hair: '#2a2420', top: 'bald', apron: '#f6f3ea' });
    $('#pdabb').innerHTML = BZ.person(560, 770, 1.05, { coat: '#e9dfc4', skin: '#c99a6e', hair: '#5a4426', top: 'straw', apron: '#e2b521' });
    $('#pneva').innerHTML = BZ.person(1100, 876, 1.1, { coat: '#3f7a5a', skin: '#8a5a36', hair: '#1c1410', top: 'plait', sit: 1 });
    $('#ptansy').innerHTML = BZ.person(1420, 878, 1.12, { coat: '#22407a', skin: '#6b4423', hair: '#2f5fa8', top: 'scarf', hand: '#2f5fa8', apron: '#b8322a' });
    $('#pmungo').innerHTML = BZ.person(690, 868, 1, { coat: '#4a4a56', skin: '#e2bc94', hair: '#8f8f8f', top: 'cap', sit: 1 });
  })();

  ER.init({
    theme: 'adventure', story: 'bazaar', storyTitle: 'The Third Arch After the Fountain', id: 'square', no: 'III', title: 'Nobody Sells',
    go: 'Count your coppers',
    intro: [
      'Two doors said Veck, and you knocked at the small dark one. The red shop gave itself away: a card in its window said UNDER NEW MANAGEMENT, and VECKS OLD SHOP only means the shop that used to be Veck&rsquo;s. The small shop&rsquo;s card said where the family had moved from, and a slate beside its door showed one stroke of chalk: one piece bought back today.',
      'The compass is on Mistress Veck&rsquo;s shelf. She may not sell it before tomorrow: Rule 8. She may swap it today, for a Pale lark that is singing when it comes through her door.',
      'The bird-woman sits by the fountain. It is twenty to ten. You have twenty-two coppers in your purse, and you are about to find out that in this square almost nobody takes money.'
    ],
    exit: {"next":"roof","w":{"da043495":"92414810"}}, tags: {"deal":["46a7f281","dda87384","bf9045d6","35408bde","91e9a21e","751a7d49","23530bbe","46a6b1d5"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('q-file') || null; told = ER.flag('q-told') || {}; inv = ER.flag('q-inv') || JSON.parse(JSON.stringify(FRESH));
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('q-told', told); return true; }
  function isBusy() { return busy; }
  var WHO = ['neva', 'dabb', 'tansy', 'zeb', 'mungo'];
  function heard() { return WHO.filter(function (k) { return told[k]; }).length; }
  var NAME = { basket: 'a basket of lemons, sewn shut', blue: 'a length of Tansy&rsquo;s blue', yellow: 'a length of yellow cloth', mirror: 'Zeb&rsquo;s spare mirror', cracked: 'a cracked mirror', lark: 'a Pale lark, under a blue cloth' };
  function paint() {
    var s = '<p>' + inv.c + (inv.c === 1 ? ' copper' : ' coppers') + '</p>', k;
    if (inv.lemon) s += '<p>' + inv.lemon + (inv.lemon === 1 ? ' lemon' : ' lemons') + '</p>';
    for (k in NAME) if (inv[k] && !(k === 'blue' && inv.lark)) s += '<p>' + NAME[k] + '</p>';
    $('#hlist').innerHTML = s;
    $('#again').style.display = nextFile ? 'none' : '';
    $('#clothblue').style.display = inv.out.blue ? 'none' : ''; $('#clothyellow').style.display = inv.out.yellow ? 'none' : '';
    $('#crackedm').style.display = inv.out.cracked ? 'none' : '';
    document.body.classList.toggle('sung', !!nextFile);
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((heard() === 5 ? 1 : 0) + (inv.blue ? 1 : 0) + (inv.mirror ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['She is singing. Take her to Mistress Veck before she changes her mind.']];
    if (heard() < 5) return ['talk', [
      'Five people work in this square: a barber, a lemon-seller, a bird-woman, a dyer and a tinker. Hear all five before you offer anybody anything.',
      'Listen for three things from each of them: what they have, what they will take for it, and what they will NOT take. Their words are kept in your notebook.'
    ]];
    return ['deal', [
      'Work backwards. Mistress Veck wants the lark. What does Neva want for the lark, and what must be over the cage when it leaves her? Who has each of those two things, and what does each of THEM want?',
      'Two people want lemons, and only Dabb has any. A basket is a moon and a half, and a moon is twelve coppers: Nim&rsquo;s board said so. One lemon by itself is two coppers. Now count what is in your purse.',
      'Zeb and Neva would both like the blue cloth, and there is only one. Nothing else will do for Neva. Zeb will take two lemons instead. And a cracked mirror, however cheap, is a mirror that Neva will not take.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The fountain square. Under her blue cloth, the lark is still telling everybody about the weather.'); return; }
    if (told.intro) { busy = false; ER.say('The fountain square, a little before ten. In your purse: ' + inv.c + ' coppers.'); return; }
    ER.narrate([
      'You come back out of the arch, with the Clock Tower on your right this time, and walk until you reach the fountain. It is a much better fountain when you are not counting arches.',
      'Five people have set up shop round it. A barber with a mirror on a pole. A man with a cart of lemons. A woman on a stool among forty birdcages. A dyer, whose hands are blue to the elbow. And a tinker, sitting on a rug of things that have nearly been mended.',
      'One of the bird-woman&rsquo;s hooks is empty. Somebody has been here before you.'
    ], function () { busy = false; tell('intro'); });
  }

  /* ---------- five people, and what each of them will and will not do ---------- */
  var TALK = {
    neva: { who: 'Neva', role: 'Bird-woman · by the fountain', title: 'Neva, the bird-woman', lines: [
      { note: 'She is sitting among forty cages, with a finch on her shoulder. One hook on her stand is empty.', a: '&ldquo;Neva. I had two larks when the sun came up. Now I have one, and you are looking at her like somebody who knows of a hook with nothing on it.&rdquo;' },
      { q: 'How much is the lark?', a: 'I do not sell birds. A bird that can be bought has no opinion of you. I swap. For the lark I want a mirror: my finches fight over the one I have. A good one. I would not part with her for less, and I will not take a mirror that is cracked: a finch that sees two of itself wants feeding twice.' },
      { q: 'And then I can take her?', a: 'On one condition. She leaves this stall under a blue cloth, or she does not leave it. A Pale lark sings only if she thinks that she is under the sky. Put blue over her cage, and she will sing all day. Put any other colour over it, or nothing at all, and she will sit and sulk until tomorrow: and I will not have a sulking bird carried round Ombra in a cage with my name on it.' },
      { q: 'Who took the other lark?', a: 'A tall woman, an hour ago. She gave me a little brass mirror, the kind that travellers flash at each other across the salt, and a very good mirror it is. I said: now, about the cloth. I said it to her back. The lark went off down the drapers&rsquo; street with nothing over her at all. She will not sing a note today.' }] },
    dabb: { who: 'Dabb', role: 'Lemons · by the fountain', title: 'Dabb, the lemon-seller', lines: [
      { note: 'A cart of lemons, a straw hat, and a man who is whistling.', a: '&ldquo;Dabb. Lemons. I sell them: for money. They tell me that it is a strange way to do business, in this square.&rdquo;' },
      { q: 'How much are they?', a: 'A basket is a moon and a half: a full dozen, and I sew the lid shut with a rush. One lemon by itself is two coppers. I say moons because it sounds less. I take coppers, because I have nothing to weigh silver with, and a clipped moon looks like any other.' },
      { q: 'Would you swap them for something?', a: 'For what? I know what I look like, so I do not need a mirror. I have a hat. No: coppers.' }] },
    tansy: { who: 'Tansy', role: 'Dyer · by the fountain', title: 'Tansy, the dyer', lines: [
      { note: 'Three lengths of cloth hang on her line: blue, red and yellow. Her hands are blue to the elbow.', a: '&ldquo;Tansy. The blue is mine: nobody else in Ombra gets it so dark. I would not part with a length of it for less than three moons, and nobody who looks like you has three moons.&rdquo;' },
      { q: 'Is there anything else that you would take?', a: 'Lemons. It is lemon juice that makes a colour stay, and I have none left. I will give you a length of blue in exchange for a basket of Dabb&rsquo;s: as long as it is a full basket, a dozen, with his rush still through the lid. I count.' },
      { q: 'What about the yellow?', a: 'The yellow went wrong. Take it, if you like, for nothing. I should be glad not to look at it.' }] },
    zeb: { who: 'Zeb', role: 'Barber · by the fountain', title: 'Zeb, the barber', lines: [
      { note: 'A chair, a jug, and a pole with a mirror on it. He has no hair at all, and a beard like a hedge.', a: '&ldquo;Zeb. Shaves, and news. The mirror on the pole is not to be had: it is how the square knows that I am open. The spare one in my drawer is another matter.&rdquo;' },
      { q: 'What do you want for the spare mirror?', a: 'Not coppers. Everybody pays a barber in coppers: I have a jar of them. I will swap it for two lemons. A shave without lemon water is only scraping, and I used my last lemon on the baker.' },
      { q: 'Only lemons?', a: 'Unless you have a length of Tansy&rsquo;s blue about you. I would take that sooner than lemons: for a year I have wanted a blue cloth to put round my customers&rsquo; necks, and she will not sell me one. One or the other, though. I am not greedy.' }] },
    mungo: { who: 'Mungo', role: 'Tinker · by the fountain', title: 'Mungo, the tinker', lines: [
      { note: 'He sits on a red rug, among things that have nearly been mended.', a: '&ldquo;Mungo. I sell. Dabb and I are the only two in this square who take money, and my prices are lower than his.&rdquo;' },
      { q: 'Have you a mirror?', a: 'I have a very fine mirror: four coppers. It is hardly cracked at all.' }] }
  };
  var GOODS = { dabb: ['basket', 'lemon'], tansy: ['blue', 'yellow'], zeb: ['mirror'], mungo: ['cracked'], neva: ['lark'] },
    ASKN = { basket: 'a basket of lemons', lemon: 'one lemon', blue: 'a length of blue', yellow: 'the yellow length', mirror: 'the spare mirror', cracked: 'the cracked mirror', lark: 'the lark' },
    HAS = { dabb: 'He has lemons: by the basket, or one at a time.', tansy: 'She has one length of blue on her line, and one of yellow.', zeb: 'He has a spare mirror in his drawer.', mungo: 'He has a mirror with a crack across it.', neva: 'She has one Pale lark left.' },
    GIVEN = { basket: 'a basket of lemons', blue: 'the blue cloth', yellow: 'the yellow cloth', mirror: 'Zeb&rsquo;s spare mirror', cracked: 'the cracked mirror' };
  WHO.forEach(function (k) {
    $('#' + k).addEventListener('click', function () {
      var t = TALK[k];
      if (busy) return;
      if (nextFile) { ER.say(k === 'neva' ? '&ldquo;Keep the cloth on her,&rdquo; says Neva, &ldquo;all the way to wherever that empty hook is.&rdquo;' : 'You have what you came for, and the Clock Tower has not stopped.'); return; }
      if (told[k]) { deal(k); return; }
      ER.talk({ who: t.who, role: t.role, face: window.FACE(k), lines: t.lines, clue: { id: k, title: t.title, kind: 'What ' + (k === 'neva' || k === 'tansy' ? 'she' : 'he') + ' will take' }, last: 'Close',
        done: function (seen) {
          if (!seen) return;
          tell(k); paint(); BZ.words(k === 'neva' ? ['part with', 'on one condition', 'sulk'] : k === 'tansy' ? ['in exchange for', 'as long as', 'dye'] : k === 'zeb' ? ['unless', 'shave'] : k === 'dabb' ? ['dozen', 'rush'] : ['tinker']);
          ER.say(heard() < 5 ? 'Click on ' + t.who + ' again when you have something to offer.' : 'That is all five. Click on any of them to make an offer.');
        } });
    });
  });

  /* ---------- a bargain ---------- */
  function refuse(t, g, n, a) {
    if (t === 'dabb') {
      if (g !== 'c') return '&ldquo;What would I do with that?&rdquo; says Dabb. &ldquo;I sell. I am the only one in this square who does, except Mungo, and they think that we are both strange.&rdquo;';
      if (a === 'basket') return n < 18 ? 'Dabb counts them into his hat. &ldquo;' + n + '. That is not a moon and a half. What did the changer&rsquo;s board say a moon was?&rdquo; He counts them back to you.' :
        'Dabb counts them into his hat, and stops. &ldquo;' + n + ' is too many. A moon and a half, I said. I will not take a copper that I am not owed: it is bad for trade.&rdquo; He counts them back to you.';
      return '&ldquo;One lemon, two coppers,&rdquo; says Dabb. &ldquo;Not ' + n + '.&rdquo;';
    }
    if (t === 'tansy') {
      if (a === 'yellow') return '&ldquo;For the yellow? Keep that,&rdquo; says Tansy. &ldquo;I will not take anything for the yellow. Offer me nothing, and it is yours.&rdquo;';
      if (g === 'c') return '&ldquo;Three moons is the price of my blue,&rdquo; says Tansy, &ldquo;and there are not three moons in that purse: I can hear it from here. I told you what I would take in exchange.&rdquo;';
      if (g === 'lemon') return '&ldquo;A basket, I said. A full dozen, sewn shut by Dabb, so that I know nobody has been at them. Not ' + (n === 1 ? 'one lemon' : 'two lemons') + ' out of somebody&rsquo;s pocket.&rdquo;';
      if (g === 'nothing') return '&ldquo;The blue, for nothing?&rdquo; says Tansy. &ldquo;The YELLOW is for nothing.&rdquo;';
      return '&ldquo;I am a dyer,&rdquo; says Tansy. &ldquo;I have no use for that. Lemons: a full basket.&rdquo;';
    }
    if (t === 'zeb') {
      if (g === 'c') return '&ldquo;I have a jar of coppers,&rdquo; says Zeb. &ldquo;Everybody pays a barber in coppers. I cannot shave a man with coppers.&rdquo;';
      if (g === 'lemon') return '&ldquo;One lemon is half a jug of lemon water,&rdquo; says Zeb. &ldquo;Two, I said.&rdquo;';
      if (g === 'basket') return '&ldquo;A whole basket? I am a barber, not a lemonade stall. Two lemons. And I think that Tansy wants that basket more than I do.&rdquo;';
      if (g === 'yellow') return '&ldquo;Yellow? Round a customer&rsquo;s neck?&rdquo; says Zeb. &ldquo;He would look like a cheese.&rdquo;';
      if (g === 'cracked') return '&ldquo;I have a mirror,&rdquo; says Zeb. &ldquo;I do not need half of another one.&rdquo;';
      return '&ldquo;Nothing is what I have already,&rdquo; says Zeb.';
    }
    if (t === 'mungo') return g === 'c' ? '&ldquo;Four coppers,&rdquo; says Mungo. &ldquo;Not ' + n + '. It was five before it cracked.&rdquo;' : '&ldquo;I only sell,&rdquo; says Mungo. &ldquo;Swapping is how a man ends up with a rug like this one.&rdquo;';
    if (g === 'c') return '&ldquo;I do not sell birds,&rdquo; says Neva. &ldquo;A bird that can be bought has no opinion of you.&rdquo;';
    if (g === 'cracked') return 'Neva holds it up, and two of her look back out of it. &ldquo;Not cracked, I said. A finch that sees two of itself wants feeding twice.&rdquo;';
    if (g === 'mirror') return '&ldquo;That is a good mirror,&rdquo; says Neva. &ldquo;And the blue? She leaves this stall under a blue cloth, or she does not leave it. I would have told the tall woman the same, if she had stood still.&rdquo;';
    if (g === 'blue') return '&ldquo;That is her sky,&rdquo; says Neva. &ldquo;Keep it: it goes over the cage. What I want for her is a mirror.&rdquo;';
    if (g === 'yellow') return '&ldquo;Blue, I said. Under yellow she would think that the world was on fire.&rdquo;';
    if (g === 'nothing') return '&ldquo;For nothing?&rdquo; says Neva. &ldquo;Then nothing is what I shall give you.&rdquo;';
    return '&ldquo;Larks do not eat lemons,&rdquo; says Neva. &ldquo;Nothing eats lemons, except barbers.&rdquo;';
  }
  var DONE = {
    'dabb>basket': 'Eighteen coppers: a moon and a half. Dabb fills a basket with twelve lemons and sews the lid shut with a rush. &ldquo;So that she knows nobody has been at them.&rdquo;',
    'dabb>lemon': 'Two coppers. Dabb throws you a lemon, and you very nearly catch it.',
    'tansy>blue': 'Tansy cuts the rush, counts twelve lemons aloud, and unpins the blue from her line. It is the colour of the sky at the very top, where it is darkest.',
    'tansy>yellow': '&ldquo;Take it,&rdquo; says Tansy. &ldquo;It is the colour of a mistake.&rdquo; You are now the owner of a length of yellow cloth.',
    'zeb>mirror:lemon': 'Zeb smells both lemons, one after the other, and opens the drawer under his chair. The spare mirror is as big as a plate, and has not a mark on it.',
    'zeb>mirror:blue': '&ldquo;Tansy&rsquo;s blue!&rdquo; says Zeb, and puts it round his own neck at once. The spare mirror is yours. So is the feeling that you have just given away something you needed.',
    'mungo>cracked': 'Four coppers. Mungo wraps the mirror in a page of last week&rsquo;s news. The crack runs from corner to corner. &ldquo;You hardly see it,&rdquo; he says, &ldquo;if you stand to one side.&rdquo;'
  };
  function deal(t) {
    var box = ER.el('div', 'bx deal'), give = null, ask = GOODS[t].length === 1 ? GOODS[t][0] : null, cnt = null, msgEl;
    function msg(x) { msgEl.innerHTML = ER.gloss(x); }
    function build() {
      var s = '<h5>' + TALK[t].who + '</h5><p class="has">' + HAS[t] + '</p><h6>You offer</h6><div class="opts" id="o-give">', k;
      s += '<button type="button" class="pick" data-g="nothing">nothing</button><button type="button" class="pick" data-g="c">coppers:</button><span id="o-cnt"></span>';
      if (inv.lemon >= 1) s += '<button type="button" class="pick" data-g="lemon1">one lemon</button>';
      if (inv.lemon >= 2) s += '<button type="button" class="pick" data-g="lemon2">two lemons</button>';
      for (k in GIVEN) if (inv[k]) s += '<button type="button" class="pick" data-g="' + k + '">' + GIVEN[k] + '</button>';
      s += '</div><h6>You ask for</h6><div class="opts" id="o-ask">';
      GOODS[t].forEach(function (g) { if (g === 'basket' || g === 'lemon' || !inv.out[g]) s += '<button type="button" class="pick" data-a="' + g + '">' + ASKN[g] + '</button>'; });
      s += '</div><div class="bx-foot"><p class="pmsg"></p><button type="button" class="btn" id="o-go">Offer it</button></div>';
      box.innerHTML = s; msgEl = box.querySelector('.pmsg');
      cnt = BZ.count(box.querySelector('#o-cnt'), { max: inv.c, start: 0, unit: 'of ' + inv.c, change: function () { give = 'c'; mark(); } });
      if (ask && !box.querySelector('[data-a="' + ask + '"]')) ask = null;
      mark();
    }
    function mark() {
      ER.$$('.pick', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-g') ? b.getAttribute('data-g') === give : b.getAttribute('data-a') === ask); });
    }
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.pick') : null;
      if (b) { if (b.getAttribute('data-g')) give = b.getAttribute('data-g'); else ask = b.getAttribute('data-a'); mark(); return; }
      if (e.target.id === 'o-go') offer();
    });
    function offer() {
      var g, n = 0, cand, file;
      if (!box.querySelector('#o-ask .pick')) { msg(TALK[t].who + ' has nothing more that you want.'); return; }
      if (!give || !ask) { msg('Choose what you offer, and what you ask for. Then offer it.'); return; }
      g = give; if (g === 'c') n = cnt.get(); if (g === 'lemon1' || g === 'lemon2') { n = +g.slice(5); g = 'lemon'; }
      if (g === 'c' && !n) { msg('You hold out an empty hand. ' + TALK[t].who + ' looks at it politely. (Set the number of coppers with the arrows.)'); return; }
      cand = t + ':' + (g === 'c' || g === 'lemon' ? g + n : g) + (t === 'neva' && g === 'mirror' && inv.blue ? '+blue' : '') + '>' + ask;
      if (!ER.check('deal', cand)) { ER.sfx.no(); msg(refuse(t, g, n, ask)); return; }
      if (g === 'c') inv.c -= n; else if (g === 'lemon') inv.lemon -= n; else if (g !== 'nothing') inv[g] = 0;
      if (ask === 'lemon') inv.lemon++; else { inv[ask] = 1; if (ask !== 'basket') inv.out[ask] = 1; }
      ER.flag('q-inv', inv); (g === 'c' ? BZ.sfx.coin : BZ.sfx.swap)();
      if (ask === 'lark') {
        file = ER.exit(['lark' + (inv.blue ? '+blue' : '')], { wait: true });
        if (!file) { msg('The lark looks at you and says nothing. Something is wrong with this page: tell your teacher.'); return; }
        nextFile = file; ER.flag('q-file', file); paint();
        msg('Neva takes the mirror, and four finches come at once to look at themselves in it. She lifts the last cage off its hook.');
        setTimeout(function () {
          ER.closeAll(); busy = true; BZ.sfx.lark();
          ER.narrate([
            'You drop Tansy&rsquo;s blue over the cage. For as long as it takes to count ten, nothing happens.',
            'Then, under the cloth, the lark decides that it is a fine morning with a clear sky, and says so, at great length.',
            'You have an empty purse, one bird, and the first thing that anybody in Ombra has been glad to give you. The Clock Tower says ten.',
            'You carry her back the way you came: out of the square with the tower at your left shoulder, past one arch, and one that is not an arch, and one more, and in at the next. She sings the whole way.'
          ], function () { busy = false; });
        }, 2600);
        return;
      }
      cand = DONE[t + '>' + ask + (t === 'zeb' ? ':' + g : '')] || 'Done.';
      give = null; paint(); build(); msg(cand);
    }
    build();
    msg(t === 'dabb' ? 'Dabb takes coppers. Choose what you want, set the number of coppers with the arrows, and offer it.' : 'What will you offer ' + TALK[t].who + ', and for what?');
    ER.open('ov-lock', box);
  }
  $('#again').addEventListener('click', function () {
    if (busy || nextFile) return;
    inv = JSON.parse(JSON.stringify(FRESH)); ER.flag('q-inv', inv); ER.closeAll(); paint(); BZ.sfx.swap();
    ER.say('By the custom of the square, any swap can be undone before the noon bell. Everything goes back to where it was at twenty to ten, and nobody is surprised. In your purse: 22 coppers.');
  });

  BZ.thing('#fount', 'fountain', 'The fountain: a stone bowl as wide as a cart. Four streets of people have been meeting each other &ldquo;at the fountain&rdquo; for longer than anybody can remember.', isBusy);
  BZ.thing('#tower', null, function () { return nextFile ? 'The Clock Tower, far away to the north, over the roofs. Ten o&rsquo;clock.' : 'The Clock Tower, far away to the north, over the roofs. Twenty to ten. Noon is when the bell rings in the Yard.'; }, isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
})();
</script>
</body>
</html>
