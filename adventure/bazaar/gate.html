  body{--bg:#3a2414;--accent:#f0b85a;--font-display:'Limelight',serif;--font-ui:'Josefin Sans',sans-serif;--font-body:'EB Garamond',serif;

  #goat{animation:chew 1.3s steps(2,end) infinite}
  @keyframes chew{50%{transform:translateY(2px)}}
  .dust{animation:dust 7s linear infinite}
  @keyframes dust{from{transform:translateX(0)}to{transform:translateX(60px)}}
  #emptysq{animation:blinkq 2.4s steps(1,end) infinite}
  @keyframes blinkq{50%{opacity:.35}}
  #go.walk{border-style:dashed}

  /* the walk */
  .bx.walk{width:min(1060px,96vw)}
  .wgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:12px;align-items:start}
  .way{background:#f6f0da;color:#1d2a55;font-family:'Caveat',cursive;font-size:19.5px;line-height:1.1;padding:12px 16px 10px;border-top:12px solid #a8432a;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .way h5{margin:0 0 6px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#a8432a}
  .way ol{margin:0;padding-left:22px}
  .way li{margin:0 0 6px}
  .way p{margin:4px 0 0;font-size:17.5px;opacity:.8}
  .vw-op{cursor:default}
  .vw-op.go{cursor:pointer}
  .vw-op.go:hover{filter:brightness(1.12)}
  .seen{margin:7px 0 0;padding:8px 14px 6px;background:rgba(246,240,218,.94);color:#2a2116;font-family:'EB Garamond',Georgia,serif;font-size:16.5px;line-height:1.26;border-left:5px solid #a8432a}
  .seen p{margin:0 0 3px}
  .seen b{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#a8432a;margin-right:5px}
  .seen .tw{font-style:italic;opacity:.85}
  .mv{display:flex;gap:6px;flex:0 0 auto}
  .mv .btn{padding:9px 12px 5px;font-size:12.5px;letter-spacing:.1em}
  .bx.walk .bx-foot{min-height:52px;align-items:flex-start}
  .bx.walk .pmsg{font-size:17px}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, walk = null, told = {};

  /* the roofs of the city, the awnings and pots of the coppersmiths, the stones of the wall, the crowd */
  (function () {
    var s = '', i, x, h, f, y0, y1, r = 0;
    function rnd() { r = (r * 9301 + 49297) % 233280; return r / 233280; }
    for (x = -1000; x < 2600; x += 58) { h = 20 + rnd() * 66; s += '<rect x="' + x + '" y="' + (512 - h).toFixed(0) + '" width="' + (40 + rnd() * 30).toFixed(0) + '" height="' + (h + 40).toFixed(0) + '" fill="' + (rnd() < 0.5 ? '#dfc291' : '#d2b27e') + '"/>'; }
    $('#far').innerHTML = s; s = '';
    for (i = 0; i < 5; i++) {
      f = i / 5; x = 470 + 290 * f; y0 = 250 + 190 * f + 70 * (1 - f); y1 = y0 + 46 * (1 - f) + 12;
      s += '<path d="M' + x.toFixed(0) + ' ' + y0.toFixed(0) + 'l' + (62 * (1 - f) + 12).toFixed(0) + ' ' + (30 * (1 - f) + 6).toFixed(0) + 'l' + (40 * (1 - f) + 10).toFixed(0) + ' ' + (36 * (1 - f) + 6).toFixed(0) + 'l-' + (40 * (1 - f) + 10).toFixed(0) + ' -4z" fill="' + (i % 2 ? '#c96a2b' : '#dd8a44') + '"/>';
      s += '<circle cx="' + (x + 40 * (1 - f) + 8).toFixed(0) + '" cy="' + (y1 + 60 * (1 - f) + 10).toFixed(0) + '" r="' + (20 * (1 - f) + 4).toFixed(0) + '" fill="#c96a2b" stroke="#7d3b14" stroke-width="2"/>';
      x = 1600 - 650 * f; y0 = 180 + 260 * f + 80 * (1 - f);
      s += '<path d="M' + x.toFixed(0) + ' ' + y0.toFixed(0) + 'l-' + (110 * (1 - f) + 14).toFixed(0) + ' ' + (44 * (1 - f) + 6).toFixed(0) + 'l-' + (60 * (1 - f) + 10).toFixed(0) + ' ' + (50 * (1 - f) + 6).toFixed(0) + 'l' + (60 * (1 - f) + 10).toFixed(0) + ' -6z" fill="' + (i % 2 ? '#dd8a44' : '#c96a2b') + '"/>';
      s += '<ellipse cx="' + (x - 90 * (1 - f) - 10).toFixed(0) + '" cy="' + (y0 + 170 * (1 - f) + 30).toFixed(0) + '" rx="' + (30 * (1 - f) + 5).toFixed(0) + '" ry="' + (22 * (1 - f) + 4).toFixed(0) + '" fill="#d9813a" stroke="#7d3b14" stroke-width="2"/>';
    }
    $('#awn').innerHTML = s; s = '';
    for (i = 0; i < 26; i++) { x = -60 + (i * 97) % 480; h = 170 + (i * 61) % 620; if (x > 50 && x < 370 && h > 200) continue; s += '<path d="M' + x + ' ' + h + 'h' + (50 + (i * 13) % 40) + 'M' + (x + 20) + ' ' + h + 'v30"/>'; }
    $('#stones').innerHTML = s; s = '';
    for (x = -1000; x < 470; x += 70) s += '<rect x="' + x + '" y="116" width="38" height="36"/>';
    $('#crenel').innerHTML = s;
    $('#incoming').innerHTML = BZ.crowd('in', 5, 130, 290, 700, 810, 0.75, 1.15);
    $('#crowd').innerHTML = BZ.crowd('gate', 9, 500, 1080, 610, 730, 0.8, 1.35) + BZ.crowd('gate2', 3, 940, 1060, 760, 860, 1.5, 1.8);
    s = '';
    [1230, 1262, 1294, 1338, 1372].forEach(function (cx, j) { for (i = 0; i < 3 + (j * 2) % 4; i++) s += '<ellipse cx="' + cx + '" cy="' + (696 - i * 5) + '" rx="13" ry="4.500" fill="' + (j === 4 ? '#e9ecef' : '#c96a2b') + '" stroke="' + (j === 4 ? '#8d949c' : '#7d3b14') + '" stroke-width="1.500"/>'; });
    $('#coins').innerHTML = s;
  })();

  ER.init({
    theme: 'adventure', story: 'bazaar', storyTitle: 'The Third Arch After the Fountain', id: 'gate', no: 'I', title: 'The Salt Gate',
    go: 'Go back for it',
    intro: [
      'Ombra, the market city on the edge of the Pale, at seven o&rsquo;clock on a market morning. You are the newest apprentice of the Solheim caravan. For six days you have carried the caravan&rsquo;s compass from the coast, in a flat wooden box under your arm, and you were told not to put it down.',
      'The Pale is three days of white salt with nothing on it: no tree, no hill, no road. No caravan may go out on it without a compass. Today&rsquo;s noon bell belongs to Master Solheim: if her compass is on the Yardmaster&rsquo;s table when the bell rings, the gate opens for her. If it is not, the gate opens for the next name on the list: the Blue Caravan, whose pathfinder is Odile Laurent.',
      'At the Salt Gate you changed your silver at a money-changer&rsquo;s table. You read his board. You counted your coppers twice. Then you picked up your bag and walked on, and it was a hundred steps before you noticed that there was nothing under your arm.'
    ],
    exit: {"next":"scales","w":{"8d1b476f":"8af17f86"}}, tags: {},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('g-file') || null; told = ER.flag('g-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('g-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    var b = $('#go');
    b.classList.toggle('on', !!(told.hob || nextFile)); b.classList.toggle('walk', !nextFile);
    b.textContent = nextFile ? 'Into the lane' : 'Walk into the city';
    $('#emptysq').style.display = nextFile ? 'none' : '';
    ER.pips((told.hob ? 1 : 0) + (told.moved ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }
  function hints() {
    if (nextFile) return ['go', ['You are through the third arch, and everything in this lane weighs or points. Go in.']];
    if (!told.hob) return ['hob', ['The man with the handcart has watched this gate for thirty years. He knows where a lifted thing goes. Ask him.']];
    return ['walk', [
      'Hob&rsquo;s way has six parts. Do one part at a time, and do not begin the next until the first has happened: &ldquo;when&rdquo;, &ldquo;as far as&rdquo; and &ldquo;so that&rdquo; tell you how you will know.',
      'Left and right change when you turn. You come to the fountain facing the Clock Tower. Turn until the words under the picture say that the tower is at your left shoulder: that is the way to walk.',
      'After the fountain, look at the opening on your left each time you walk on. An arch that you could walk through counts as one. An arch full of bricks counts as nothing. The arch you want is the last one before the fish.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The lane of the scale-makers. Somewhere behind you, Hob Trundle is still at his gate.'); return; }
    if (told.intro) { busy = false; ER.say('The Salt Gate, a little after seven. The place on the counter where you put the box down is still empty.'); return; }
    ER.addClue('purse', 'Your purse', '<h4>Your purse</h4><p>Two silver moons, changed at the table by the Salt Gate. The board says 1 moon = 12 coppers, and the changer keeps one copper in every moon for his trouble.</p><p>24 less 2: <b>22 coppers</b>.</p>', 'mine', 'Your own note', true);
    ER.narrate([
      'The Salt Gate at opening time. Half of Ombra is coming in, the other half is going out, and every one of them is carrying something. You are the only person here with nothing under your arm.',
      'You run back to the money-changer&rsquo;s table. The table is there. The money-changer is there. The place on the counter where you put the box down is there too, and it is empty.',
      '&ldquo;Lifted,&rdquo; says a man with a handcart, kindly. &ldquo;It happens at this gate about once a minute. Was it brass? Had it a maker&rsquo;s name on it?&rdquo; You tell him: a compass, and the name on the lid is VECK, OMBRA.',
      '&ldquo;Then it has not gone far, and I can tell you where. You are the second stranger to ask me that this morning. The first one did not wait for the end.&rdquo; He looks you up and down. &ldquo;You look like somebody who waits for the end.&rdquo;'
    ], function () { busy = false; tell('intro'); });
  }

  /* ---------- people ---------- */
  var WAY = '<ol><li>Go in at the gate and keep straight on, through the coppersmiths. There are turnings. Leave them alone.</li>' +
    '<li>When you can see the leather-workers in front of you, stop: do not go in among them. Turn there, towards the Clock Tower. (Ombra has two towers. The other one has a stork&rsquo;s nest on it, and tells you nothing.)</li>' +
    '<li>Go on between the baskets as far as the fountain.</li>' +
    '<li>Stand at the fountain so that the Clock Tower is at your left shoulder. Then walk straight on.</li>' +
    '<li>Count the arches on your left, and take the third: not counting the one that is bricked up.</li>' +
    '<li>If you reach the fish, you have gone too far.</li></ol>' +
    '<p>Lost count? Come back to the gate. I am always at the gate.</p>';
  $('#hob').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Hob Trundle is a long way behind you, at his gate, where he always is.'); return; }
    ER.talk({
      who: 'Hob Trundle', role: 'Porter · the Salt Gate', face: window.FACE('hob'),
      lines: [
        { note: 'He has a straw hat, a moustache, and a handcart with his name painted on the side.', a: '&ldquo;Hob Trundle. I carry things from this gate to wherever they are going, and in thirty years I have never lost one. I only mention it.&rdquo;' },
        { q: 'Where does a stolen compass go?', a: 'Brass with a maker&rsquo;s name on it goes home. The scale-makers of Ombra have a Guild, and the Guild has a rule: a maker must buy back her own work from anybody who brings it to her door, at a fixed price, and ask no questions. So nobody in this city keeps lifted brass for as long as an hour. They walk it to the maker&rsquo;s door and come away with silver. Yours says VECK. It has gone to Veck.' },
        { q: 'Where is Veck? What street?', a: 'Street? The streets of Ombra have no names. There are four hundred of them, and nobody could remember four hundred names. We go by what we pass. I shall tell you the way once, slowly, and you will write it on your arm, because that is what the inside of an arm is for. One thing more: mind that you knock at the family&rsquo;s door. It is the family that the rule is about, not the shop.' },
        '<div class="note">You write it down as he says it.</div>' + WAY,
        { q: 'Who was the other stranger?', a: 'Tall. A travelling coat, a blue sash, and a yellow umbrella, which nobody needs here: it has not rained in Ombra since the spring. She asked what you asked. I had just said &ldquo;take the third&rdquo; when she said &ldquo;Third arch, thank you,&rdquo; and was gone. She did not hear about the bricks. She did not hear about the fish. People who will not wait for the end of a sentence see a great deal of Ombra.</p><p class="note">A blue sash. The drivers of the Blue Caravan wear blue sashes.' }
      ],
      clue: { id: 'hob', title: 'Hob Trundle, at the Salt Gate', kind: 'What he said' },
      done: function (seen) {
        if (!seen) return;
        ER.addClue('way', 'The way, as Hob told it', '<h4>The way, as Hob Trundle told it</h4>' + WAY, 'cuff', 'On the inside of your arm', true);
        BZ.words(['lift', 'guild', 'buy back', 'turning', 'arch']);
        if (tell('hob')) { paint(); ER.say('Six lines of blue ink, from your wrist to your elbow. The street of the coppersmiths begins just behind him.'); }
      }
    });
  });
  $('#nim').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Nim', role: 'Changer of money · the Salt Gate', face: window.FACE('nim'),
      lines: [
        { note: 'He does not look up. He is building coppers into towers of twelve.', a: '&ldquo;Moons into coppers, coppers into moons. I gave you twenty-two for two, and you counted them twice. They have not changed since.&rdquo;' },
        { q: 'Did you see who took my box?', a: 'I saw nobody take anything.</p><p class="note">He says it slowly, like a man putting down exactly the right coin.' },
        { q: 'It was on your counter!', a: 'It was. Then I counted, as I always do. Then it was not. Read the board, stranger. Everything I have to say is on the board.' }
      ],
      clue: { id: 'nim', title: 'Nim, the money-changer', kind: 'What he said' },
      done: function (seen) { if (seen && tell('nim')) ER.say('His board stands on three legs at the end of the table.'); }
    });
  });

  /* ---------- papers ---------- */
  var BOARD = '<h4>NIM · changer of money</h4><p class="rate">1 MOON = 12 COPPERS</p><p>Silver into copper. Copper into silver.</p><p>For my trouble: one copper in every moon.</p><p>No clipped moons. No buttons.</p>' +
    '<p class="small">Anything left on this counter while I count a hundred belongs to the counter. N.</p>';
  $('#board').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BOARD, cls: 'board', clue: { id: 'board', title: 'Nim’s board', kind: 'Chalk on a slate' }, done: function () {
      BZ.words(['moon', 'copper', 'clipped']);
      if (tell('board')) ER.say('You read it this morning, too. Twelve coppers to the moon: that was the part you were looking for.');
    } });
  });
  var LIST = '<h4><small>THE YARD OF OMBRA</small>The Noon Bell</h4>' +
    '<ol><li>One caravan goes out on the Pale each day, at the noon bell. The wells on the salt can water one caravan, and no more.</li>' +
    '<li>No caravan goes out without a compass. It is shown to the Yardmaster, and it is on the Yardmaster&rsquo;s table when the bell rings.</li>' +
    '<li>If the first name on the list has no compass on the table at the bell, the gate opens for the second.</li></ol>' +
    '<p>Today&rsquo;s list:</p><p class="hand">1. Solheim. Compass: Veck, No. 41. NOT YET SHOWN.<br>2. The Blue Caravan. Pathfinder O. Laurent. Compass shown.</p>' +
    '<p class="foot">A copy of this list hangs at every gate. Holt, Yardmaster</p>';
  $('#notice').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LIST, cls: 'yardlist', clue: { id: 'list', title: 'The noon bell', kind: 'A notice of the Yard' }, done: function () {
      BZ.words(['caravan', 'compass', 'pathfinder']);
      if (tell('list')) ER.say('NOT YET SHOWN. Somebody at the Yard wrote that this morning, in good blue ink, about you.');
    } });
  });

  /* ---------- things at the gate ---------- */
  BZ.thing('#gatearch', 'arch', 'The Salt Gate: an arch as high as a house. Outside it the road is white, and it goes on being white for three days.', isBusy);
  BZ.thing('#goat', null, 'A goat is eating the corner of the Yard&rsquo;s notice. It has got as far as the word LIST.', isBusy);
  BZ.thing('#cart', 'handcart', 'A handcart with three trunks on it, tied down with enough rope to moor a ship. HOB TRUNDLE, PORTER is painted on the side.', isBusy);
  BZ.thing('#counter', 'counter', function () { return nextFile ? 'The money-changer&rsquo;s counter. You are not going to put anything on it again.' : 'The place on the counter where you put the box down. There is a clean square in the dust, exactly the size of a compass box.'; }, isBusy);
  $('#street').addEventListener('click', function () { if (!busy) startWalk(); });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); else if (!busy) startWalk(); });
  function startWalk() {
    if (nextFile) { ER.say('You have walked it once. Once is enough.'); return; }
    if (!told.hob) { ER.say('A street full of hammering goes straight on into the city, and splits, and splits again. You do not know which way to go. The man with the handcart does.'); return; }
    if (!walk) walk = makeWalk();
    walk.open();
  }

  /* ---------- the walk: Hob's way on one side, and what is in front of you on the other ---------- */
  function makeWalk() {
    var st = ER.flag('g-pos') || { id: '0,3', h: 1, t: null }, wait = false, box = ER.el('div', 'bx walk'), svg, msgEl;
    box.innerHTML = '<div class="wgrid"><div class="way"><h5>On the inside of your arm</h5>' + WAY + '</div>' +
      '<div><div class="frame"><svg viewBox="0 0 720 430"></svg></div><div class="seen"></div></div></div>' +
      '<div class="bx-foot"><p class="pmsg"></p><span class="mv"><button type="button" class="btn" data-m="L">&#8630; Turn left</button><button type="button" class="btn" data-m="A">&#8593; Walk on</button><button type="button" class="btn" data-m="R">Turn right &#8631;</button><button type="button" class="btn" data-m="B">Turn round</button></span></div>';
    svg = box.querySelector('svg'); msgEl = box.querySelector('.pmsg');
    ER.glossIn(box, '.way li, .way p');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function draw() {
      var L = BZ.lines(st.id, st.h, st.t);
      svg.innerHTML = BZ.view(st.id, st.h);
      svg.setAttribute('data-at', st.id + '/' + st.h);
      box.querySelector('.seen').innerHTML = ER.gloss('<p>' + L.here + '</p><p><b>On your left</b>' + L.left + '.</p><p><b>Ahead</b>' + L.ahead + '.</p><p><b>On your right</b>' + L.right + '.</p><p class="tw">' + L.towers + '</p>');
      ER.flag('g-pos', st);
    }
    var WRONG = {
      'arch:3,0': 'Through the arch the lane is roofed, and full of tailors sewing in their doorways. Nobody here weighs anything. One of them looks at you over his needle. &ldquo;The scale-makers? Not this arch. You have lost count, and there is only one cure for that: go back to the last place where you were sure.&rdquo; The last place where you were sure is the gate.',
      'arch:5,0': 'Through the arch the lane is roofed, and hung with brass lamps: hundreds of them, all lit, at eight in the morning. No scales. &ldquo;You are the second stranger today,&rdquo; says an old lamp-maker. &ldquo;The first was tall, and in a hurry. She counted the arch that is bricked up as well. In Ombra we do not count what is not there.&rdquo; You go back to the gate, and begin again.'
    };
    function through(to) {
      var file = ER.exit(['arch:' + to], { wait: true });
      if (!file) {
        ER.sfx.no(); st = { id: '0,3', h: 1, t: null }; draw();
        msg(WRONG['arch:' + to] || 'That was not the arch. You go back to the gate, and begin again.');
        return;
      }
      wait = true; nextFile = file; ER.flag('g-file', file);
      msg('Through the arch the lane is roofed, and the light comes down in stripes. Something on your left is weighing something. So is something on your right.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'The lane is roofed with reed mats, and the sun comes down through them in stripes. On both sides, brass pans hang on brass chains and turn slowly: scales, hundreds of them, weighing nothing at all.',
          'You have crossed half a city without knowing the name of one street, because not one of them has a name.',
          'A little way down the lane there is a red shop-front, with a name on it in gold letters as high as your hand. The name is VECK.'
        ], function () { busy = false; });
      }, 2600);
    }
    function move(m) {
      var d, w;
      if (wait) return;
      if (m !== 'A') { st.h = (st.h + (m === 'L' ? 3 : m === 'R' ? 1 : 2)) % 4; draw(); msg(m === 'B' ? 'You turn right round.' : 'You turn to your ' + (m === 'L' ? 'left' : 'right') + '.'); return; }
      d = st.h; w = BZ.way(st.id, d);
      if (!w) { ER.sfx.no(); msg('There is no way on here. Ahead of you: ' + BZ.lines(st.id, st.h, st.t).ahead + '.'); return; }
      BZ.sfx.step();
      if (w.arch) { through(w.to); return; }
      st.id = w.to; st.t = w.trade; if (tell('moved')) paint();
      draw();
      msg(BZ.mid(st.id) === 'fish' ? 'You have reached the fish. Hob had a line about that.' : BZ.mid(st.id) === 'fountain' ? 'You have come as far as the fountain.' : 'You walk on.');
    }
    box.querySelector('.mv').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button') : null; if (b) move(b.getAttribute('data-m')); });
    svg.addEventListener('click', function (e) {
      var o = e.target.closest ? e.target.closest('.vw-op') : null, k;
      if (!o || wait) return;
      k = o.getAttribute('data-d');
      if (!o.classList.contains('go')) { msg('No way through there: ' + BZ.lines(st.id, st.h, st.t)[k === 'L' ? 'left' : k === 'R' ? 'right' : 'ahead'] + '.'); return; }
      if (k !== 'A') st.h = (st.h + (k === 'L' ? 3 : 1)) % 4;
      move('A');
    });
    draw();
    msg(st.id === '0,3' ? 'You are standing just inside the Salt Gate, with your back to it. Turn with the buttons, and walk with &ldquo;Walk on&rdquo;: or click an opening in the picture to go that way.' : 'You are where you stopped. Hob&rsquo;s way is on your arm.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
</body>
</html>
