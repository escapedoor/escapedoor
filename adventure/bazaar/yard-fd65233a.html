    }, YES = {
      'a-pattern': '&ldquo;PATTERN,&rdquo; you say. &ldquo;Of the genuine Veck pattern. That does not mean made by Veck. It means made like a Veck.&rdquo;',
      'a-shop': '&ldquo;VECKS OLD SHOP,&rdquo; you say. &ldquo;With no apostrophe. It does not say that the shop is Veck&rsquo;s. It says that it used to be.&rdquo;'
    };
    box.querySelector('svg').addEventListener('click', function (e) {
      var g = e.target.closest ? e.target.closest('.lw') : null, id;
      if (!g || ER.flag('y-lock')) return;
      id = g.getAttribute('data-l');
      if (!ER.check('lid', id)) { ER.sfx.no(); msg(NO[id] || 'The Yardmaster waits.'); return; }
      ER.flag('y-lock', 1); ER.sfx.ok(); paint(); msg(YES[id]);
      setTimeout(function () { ER.closeAll(); ending(); }, 3600);
    });
    msg('Two lids, side by side on the table. &ldquo;One was made by Veck,&rdquo; says the Yardmaster. &ldquo;One only says so. Show me the words that give it away.&rdquo; Click on them.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }

  /* ---------- noon ---------- */
  function ending() {
    busy = true; paint();
    ER.narrate([
      'The Yardmaster pushes the shiny compass a hand&rsquo;s width to the left with the end of his pencil. &ldquo;Veck&rsquo;s. Number 41. On my table at two minutes to noon.&rdquo; He writes SHOWN in his book, in good blue ink. &ldquo;Solheim goes at the bell.&rdquo;',
      'The tall woman picks up the other compass, and reads its lid for some time. &ldquo;Eleven years I have been coming to Ombra,&rdquo; says Odile Laurent, &ldquo;and I have just paid nine moons for an apostrophe that is not there.&rdquo;',
      '&ldquo;You bought me a compass, Odile,&rdquo; says Master Solheim. &ldquo;Your caravan was next on the list.&rdquo; &ldquo;I mean to beat you to the wells, Astrid. Not to the gate. And next year it will be MY apprentice who puts something down.&rdquo;',
      'Puts something down. &ldquo;It was stolen,&rdquo; you say. &ldquo;Nobody stole it,&rdquo; says the girl on the salt sack. &ldquo;You put it on Nim&rsquo;s counter and walked off. He counted a hundred. Then it was the counter&rsquo;s, and he gave it to me to run to Veck. It is on his board. Bottom line. Nobody ever reads the bottom line.&rdquo;',
      '&ldquo;I was behind you at the money-changer&rsquo;s, and I saw it go,&rdquo; says Odile Laurent. &ldquo;I went after the child, and lost her in the first street. I ought to have gone after you, and told you: but I never do go after the slow thing. I was at every door in Ombra before you this morning, and I came away from each of them with half a sentence.&rdquo; She holds up the cage. The lark has not made a sound since nine o&rsquo;clock.',
      'So you tell her the other half. She looks at you for a moment. Then she unwinds the blue sash of the Blue Caravan from her waist, and drops it over the cage.'
    ], function () {
      document.body.classList.add('sung'); BZ.sfx.lark();
      ER.narrate([
        'The lark thinks about it for as long as it takes to count ten. Then she sings.',
        'Far away to the north, the Clock Tower begins to strike. The Yardmaster pulls the rope. The bell swings over his head, the two doors open, and there are the three days of white.'
      ], function () {
        document.body.classList.add('noon'); ER.sfx.bell();
        ER.narrate([
          'Master Solheim opens the box. The needle swings, and settles, and points. &ldquo;North,&rdquo; she says. &ldquo;Second-hand, and paid for in lemons. You are not going to put anything down again, are you?&rdquo; &ldquo;No, Master.&rdquo; &ldquo;Then pick up that rope.&rdquo;',
          'You pick it up. You do not put it down until the wells.'
        ], function () { busy = false; ER.flag('y-done', 1); finish(false); });
      });
    });
  }
  function finish(quick) {
    var st = ER.state(), mins = BZ.mins(), hn = ER.hintsUsed();
    $('#d-time').textContent = 'The Salt Gate to the noon bell: ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
    $('#d-hints').textContent = hn ? 'Hints asked for: ' + hn + '.' : 'Hints asked for: none at all.';
    $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' papers and ' + Object.keys(st.words).length + ' words.';
    $('#done').classList.add('on'); paint();
    if (quick) ER.say('The Yard, a little after noon. The gate is open, and the lark has not stopped.');
    else { BZ.sfx.stamp(); try { if (ER.track && ER.music()) ER.track.play(['village', { root: 55, bpm: 104, lead: 'harp', beds: [['crowd', 0.4], ['wind', 0.2]] }]); } catch (e) {} }      /* the story is over: the tune comes back */
  }
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });
  $('#b-task').addEventListener('click', function () {
    var saved = ER.flag('task') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>For Hob Trundle, porter, the Salt Gate</h4><h3>Tell him the way</h3>' +
      '<p>Hob Trundle has never been outside Ombra. One day he will come to see you, with his handcart, and he will not know what to do with the name of a street.</p>' +
      '<p><b>A</b> Write him the way from your own front door to your school (or to any place that you like), in 60 to 90 words, as Ombra does it: no street names and no numbers. Only what he will pass, and what he will see, hear or smell at the place where he must turn. Use at least four of these: until, as far as, past, opposite, between, the second ... on your left, not counting, if you reach ..., you have gone too far.<br><b>B</b> Or write the way back from Mistress Veck&rsquo;s door to the Salt Gate. It is Hob&rsquo;s way backwards, but every left has changed.</p>' +
      '<textarea id="r1"></textarea><div class="count"></div><label for="r2">Written by</label><input type="text" id="r2" maxlength="60">' +
      '<div class="foot"><span>Nobody marks this. It is saved in this browser as you write.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > p');
    box.querySelector('#r1').value = saved.r1 || ''; box.querySelector('#r2').value = saved.r2 || '';
    function keep() {
      var o = { r1: box.querySelector('#r1').value, r2: box.querySelector('#r2').value }, n = (o.r1.match(/[A-Za-z’']+/g) || []).length;
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('task', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
