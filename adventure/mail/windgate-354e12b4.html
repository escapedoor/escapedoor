  @keyframes glow{50%{filter:brightness(1.18)}}

  body.over .glassA{fill:#b99a6a}

  /* the hatch station, close to: what she calls, what is under you, and what your hands are on */
  .bx.hs{width:min(1060px,96vw)}
  .hs .two{display:grid;grid-template-columns:1fr 372px;gap:0 12px;align-items:stretch}
  .hs .sl{background:#262b2c linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.2));color:#eef0ea;font-family:'Caveat',cursive;font-size:18.5px;line-height:1.02;padding:11px 15px 6px;border:9px solid #7a5a36;border-radius:4px}
  .hs .sl h5{margin:0 0 5px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#d9c9a0}
  .hs .sl p{margin:0 0 6px}
  .hs .sl b{color:#ffd98a;font-weight:700}
  .hs .sl .w:hover{color:#ffd98a}
  .hs .bx-foot{min-height:60px;margin-top:8px}
  .hs .bx-foot .btn.quiet{border-color:rgba(255,255,255,.4);color:#e9e4d8}
  .callT{font-family:'Limelight',serif;font-size:31px;fill:#2a1c06;text-anchor:middle}
  .callS{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;fill:#5a4212;text-anchor:middle}
  .lab{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;fill:#f1e6c8;text-anchor:middle}
  .did{font-family:'Caveat',cursive;font-size:21px;fill:#eef0ea}
  .num{font-family:'Stardos Stencil',serif;font-weight:700;font-size:24px;fill:#5a4a26;text-anchor:middle}
  .ct{cursor:pointer}
  .ct:hover{filter:brightness(1.2)}
  .ct.used{opacity:.25}
  .ct .tk2{display:none}
  .ct.dry .tk2{display:block}
  .rag{animation:rag 5s linear infinite}
  .rag.b{animation-duration:6.6s;animation-delay:-2.4s}
  .rag.c{animation-duration:4.2s;animation-delay:-3.3s}
  @keyframes rag{from{transform:translateX(760px)}to{transform:translateX(-520px)}}
  .slide{animation:slide .9s ease-out}
  @keyframes slide{from{transform:translateX(600px)}to{transform:translateX(0)}}
  .falling{animation:fall2 .5s linear infinite}
  @keyframes fall2{from{transform:translateY(0)}to{transform:translateY(-120px)}}
  .dropbag{animation:dropbag 1.5s ease-in forwards}
  @keyframes dropbag{from{transform:translate(0,0) scale(1)}to{transform:translate(-36px,96px) scale(.22)}}
  .puff{animation:puff 1.1s ease-out forwards}
  @keyframes puff{from{transform:scale(.3);opacity:.95}to{transform:scale(2.6);opacity:0}}
  .shout{animation:shout 1.5s ease-out forwards}
  @keyframes shout{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, told = {};

  /* the planks of the keel, and four bags of sand: One is nearest the bow */
  (function () {
    var s = '', i;
    for (i = -6; i < 20; i++) s += '<path d="M-1000 ' + (i * 64 + 28) + 'H2600M' + (((i * 397) % 1500 + 1500) % 1500 + 40) + ' ' + (i * 64 + 28) + 'v64"/>';
    $('#deck').innerHTML = s; s = '';
    [1060, 900, 740, 580].forEach(function (x, j) {
      s += '<rect x="' + (x - 9) + '" y="176" width="18" height="40" rx="7" fill="#9a6a34" stroke="#5a3a1a" stroke-width="2.500"/><circle cx="' + x + '" cy="132" r="48" fill="#c9b98a" stroke="#8a7a50" stroke-width="4"/>' +
        '<circle cx="' + x + '" cy="132" r="9" fill="#8a7a50"/><text x="' + x + '" y="116" class="stn" font-size="30" fill="#5a4a26">' + (j + 1) + '</text>';
    });
    $('#bags4').innerHTML = s;
  })();

  ER.init({
    theme: 'adventure', story: 'mail', storyTitle: 'Seven Sacks for Tolver', id: 'windgate', no: 'IV', title: 'The Windgate',
    go: 'Take your slate',
    intro: [
      'One hundred and seventy kilos went down the hatch, and nothing that the ship needed. The grapnel: it is only for landing where there is no ground crew, and you land at Tolver or nowhere. The spare propeller: it cannot be fitted in the air. The shed lines: Tolver has no shed. The Captain&rsquo;s own trunk, because she had written that it should go first. One parachute, since three souls are aboard and not four. And one tank of petrol: two for the hour and twenty-five minutes still to fly, one that is never touched, and the fourth to spare.',
      'Then six bags of sand, and the Dunnock went up through the cloud like a cork through milk.',
      'It is five past eight. She is flying at 2,500 metres in bright sun, over a white floor that goes all the way to the edge of the world. Ahead, two mountains stand up out of it, with a gap between them. You are lying on your stomach on the plank beside the hatch, because the Captain has just whistled down the tube.'
    ],
    exit: {"next":"tolver","w":{"de1b37a6":"8fb9bbe6","3076a8ae":"e9afcf41"}}, tags: {"d1":["241499f8"],"d2":["12ad78e3"],"d3":["b6da098c"],"d4":["1d93f893"],"d5":["225cdf79","d1e215c0"],"d6":["e270f26e"],"d7":["baf607d3"],"d8":["e566192d"],"r8":["aa5c6cea"]},
    sound: ['archive', { root: 43, bpm: 72, mood: 'tense', drop: ['mel'], beds: [['wind', 1.1], ['hum', 0.35]] }],      /* the crossing: the clock is running, and a whistle in a tube is listened for, so no reed tune */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('d-file') || null; told = ER.flag('d-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#tube4').classList.toggle('ready', !told.tube && !!told.in);
    $('#hatch4').classList.toggle('ready', !!(told.tube && !nextFile));
    document.body.classList.toggle('over', !!nextFile);
    ER.pips((told.tube ? 1 : 0) + (ER.flag('d-drill') ? 2 : 0) + (nextFile ? 1 : 0), 4);
  }

  function hints() {
    if (nextFile) return ['go', ['You are over. The valley beyond is in the sun, and Tolver is at the far end of it.']];
    if (bench && bench.isOpen()) return [['drill', [
      'Her orders are not in the order of the journey. Before she calls, put them in order yourself: what happens at the tarn, at the cross, at the roof, over the snowfield, at the Lip, and after it?',
      'Watch the small words. &ldquo;As soon as&rdquo; and &ldquo;not before&rdquo; say what comes first. &ldquo;If&rdquo; says that a thing may not happen at all. And at some calls there is nothing to do but say AYE.',
      'At the roof there are three things, and one sentence of the orders gives their order: the bag, the shout, the hatch. After the Lip, listen to WHICH height she calls. She named two, and gave a different order for each. The red cord waits for one word.'
    ]], ['ready', ['The dry run is done. When you are ready for the real thing, say so.']], ['real', [
      'This is the same road, but nobody is calling it dry. Do at each call exactly what you did before.',
      'After the Lip, listen: she may not call what she called in the dry run. Your slate says what to do if she calls two thousand two hundred.'
    ]]][bench.mode()];
    if (!told.tube) return ['tube', ['The speaking tube is whistling: the brass funnel, top left. Pull out the plug and answer it.']];
    return ['hatch', ['You have your orders. Put your hands on the things round the hatch: the Captain is going to call.']];
  }

  function begin() {
    MAIL.mine('gone', 'What went down the hatch', '<p>Grapnel (30 kg), spare propeller (45 kg), one of the petrol tanks (45 kg), one of the parachutes (10 kg), shed lines (20 kg), the Captain&rsquo;s trunk (20 kg): 170 kilos, and nothing that the ship needs before Tolver.</p><p>Then six bags of sand, 120 kilos. Four bags are left, One to Four from the bow.</p><p>The Brandreth Line&rsquo;s sand is dyed red. Ours is yellow.</p>', true);
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The Windgate is behind you. Through the glass there is a long brown valley, in the sun.'); return; }
    if (told.in) { busy = false; paint(); ER.say(told.tube ? 'The hatch station, five past eight. The Windgate is four minutes away.' : 'The tube is whistling.'); return; }
    ER.narrate([
      'The hatch is shut. Through the glass in it there is nothing to see but cloud going by underneath, very fast and all one way: east. The wind is behind you, as the plan said. Sixty kilometres an hour of it.',
      'Round the hatch are the things that you are in charge of. Four bags of sand on four hooks, each with a wooden toggle: One, Two, Three, Four. The grey bag for the Hospice, with its red streamer rolled up tight. A red cord that goes up into the dark, to the gas valves. A lever for the hatch.',
      'And the speaking tube: a brass pipe with a whistle plugged into the end of it. When the Captain blows into her end, it whistles at yours.',
      'It whistles.'
    ], function () { busy = false; tell('in'); MAIL.sfx.tube(); paint(); });
  }

  /* ---------- the Captain, by speaking tube ---------- */
  var ORD = [
    'The <b>sand</b> first. You have four bags on the hooks, numbered from the bow. One and Two go together at the Lip, where the ground stops. Beyond the Lip the air pours down like water over a weir, and I want her light before it takes hold of us. Not a second before the Lip: we are low enough over the house as it is.',
    'Before any of that, <b>the mail.</b> The Hospice bag goes when the red roof is right under you. You will see a stone cross first. The cross is not the roof.',
    'Open <b>the hatch</b> when I call the tarn, and no sooner: it is cold enough up there already. Shut it again as soon as the bag is away. But not before you have seen its streamer open, and shouted STREAMER down this tube.',
    'After the Lip she will fall, and I shall read you <b>the needle.</b> At two thousand three hundred, let Three go. If I call two thousand two hundred, let Four go as well. If I call RISING before that, keep Four: we shall want it at Tolver.',
    'The <b>red cord</b> you leave alone until I call RISING. Then pull it, and count five. By then she will be too light, and a ship that is too light goes up like a cork.',
    'When I call a place and you have nothing to do there, do nothing, and say <b>AYE.</b>'
  ];
  var LINES = ['&ldquo;Hatch station? Good. Take your slate, Clerk. An order heard is half an order: an order written down is a whole one. I shall say this once, in the order it comes into my head. That is not the order you will do it in.&rdquo;'].concat(ORD,
    ['&ldquo;Now. We shall do it dry first: your hands on the things, and nothing leaves the ship. I call, you do, you say AYE. If you are wrong, we begin again at the tarn. We have about four minutes. Ready?&rdquo;']);
  $('#tube4').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The tube is quiet. The plug is back in its end, on its little chain.'); return; }
    ER.talk({
      who: 'Captain Montalvo', role: 'By speaking tube · from the wheel', face: window.FACE('tube'), lines: LINES,
      clue: { id: 'orders', title: 'The Captain’s orders', kind: 'Chalked on your slate', cls: 'slate' },
      done: function (seen) { if (seen && tell('tube')) { MAIL.words(['speaking tube', 'toggle', 'valve', 'streamer']); paint(); ER.say('Every word of it is on your slate. Now the hatch: your hands on the things round it, and she will call.'); } }
    });
  });
  $('#slate4').addEventListener('click', function () {
    if (busy) return;
    if (!told.tube) { ER.say('A slate, and a piece of chalk on a string. Nothing is written on it yet. The tube is still whistling.'); return; }
    ER.read({ html: '<h4>The Captain&rsquo;s orders</h4>' + LINES.map(function (l) { return '<p>' + l + '</p>'; }).join(''), cls: 'slate' });
  });

  /* ---------- the things round the hatch ---------- */
  MAIL.thing('#bags4', 'toggle', 'Four bags of sand, hanging outside the ship on four hooks. Each hook has a wooden toggle: pull it, and the bag is gone. One is the nearest to the bow.', isBusy);
  MAIL.thing('#mbag4', 'streamer', 'The grey bag for Windgate Hospice: six kilos of letters, and a red streamer rolled up on top.', isBusy);
  MAIL.thing('#cord4', 'valve', 'A red cord that goes up into the dark, to the valves on top of the gas cells. Pull it, and gas goes out. It is red so that nobody pulls it by mistake.', isBusy);
  MAIL.thing('#lever4', 'lever', 'The lever that opens the hatch, and shuts it again.', isBusy);
  MAIL.thing('#cat4', null, function () { return nextFile ? 'Ballast is looking down through the glass at the valley, as if there might be a mouse in it.' : 'Ballast is looking down through the glass at the cloud, as if there might be a mouse in it.'; }, isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#hatch4').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Through the glass: a long brown valley in the sun, and a thread of smoke at the far end of it.'); return; }
    if (!told.tube) { ER.say('The hatch is shut, and it is not to be opened yet. The tube is whistling: pull out the plug, and answer it.'); return; }
    if (!bench) bench = makeBench();
    bench.open();
  });

  /* ---------- the hatch station: a dry run of her orders, and then the Windgate itself ---------- */
  function makeBench() {
    var CALLS = [
      { c: 'Tarn!', v: 'tarn', t: 'A hole opens in the cloud. Far below lies a small round lake, frozen grey. There is nothing on the ice.' },
      { c: 'Cross!', v: 'cross', t: 'A stone cross on a knoll, with its long morning shadow lying to the west.' },
      { c: 'Roof!', v: 'roof', t: 'The red roof of the Hospice. Smoke from its chimney lies flat along the snow, pointing east.' },
      { c: 'Snowfield!', v: 'snow', t: 'The snowfield, east of the house. It is red: a great fan of red sand, and through the middle of it a path trampled round and round.' },
      { c: 'The Lip!', v: 'lip', t: 'The edge. The snow simply stops, and the cloud pours over it and down, like milk over the edge of a table.' },
      { c: 'Two thousand four hundred!', v: 'fall', alt: '2,400', t: 'The floor goes away from under your stomach. The whole ship is falling, quite quietly.' },
