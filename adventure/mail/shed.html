    intro: [
      'Lowmere, in the flat west of Corvale, at twenty to six on a Thursday morning in October. You have worked at the Post Office for three weeks. Last night the Postmaster gave you a grey canvas bag, a way bill and a ticket for an airship, and told you not to lose any of them.',
      'Beyond the Harrow Range lies Tolver, a mining town that the snow shuts off from October to May. All winter its letters go over the mountains by air: for thirty-one years, in the mail ship Dunnock. This morning there is a second ship on the field, new and silver and fast. The Post Office is holding a Trial, and the ship that wins it will carry the Tolver mail for the next five years.',

    ]]][bench.stage()];
    if (!told.cap) return ['cap', ['The woman at the blackboard is waiting for you. Ask her what a third hand does.']];
    if (!ready()) return ['read', [
      'The Captain named three things to read before you touch her board: the wind sheet, her notes, and the rules of the Trial.',
      'The wind sheet is the pale paper pinned to the corner of the blackboard. Her notes are the small black book on the crate. The rules are nailed to the post on the left, under the lantern.'
    ]];
    return ['board', ['Now the blackboard itself. The Captain has drawn the whole road on it.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The plan is on the board. Outside, it is nearly light.'); return; }
    if (told.in) { busy = false; ER.say('The shed at Lowmere. A quarter to six, and the Captain is still chalking.'); return; }
    tell('in');
    ER.narrate([
      'The shed is the biggest room you have ever stood in. Most of it is full of airship: sixty metres of patched brown canvas, with DUNNOCK painted on her side in letters that have faded to the colour of tea.',
      'Under her, a woman in a long leather coat is chalking on a blackboard. She does not turn round. &ldquo;You are the Post Office. You are early: good. Driscoll, my rigger, fell off the shed steps on Tuesday and broke his leg in two places. So today you are the Post Office and you are Driscoll.&rdquo;',
      'On a trolley stand your seven sacks, with a cat asleep on the top one. You check the way bill. Sacks 1 to 7, Tolver. One grey bag, Windgate Hospice. And one registered letter in sack 7, addressed in a small square hand: <em>Captain I. Montalvo, care of the Postmaster, Tolver. To be given to her when the Trial is over.</em>',
      'Somebody has posted the Captain a letter to the town she is about to fly to. It would be quicker to hand it to her now. That is not how the Post Office works.',
      '&ldquo;Twenty minutes,&rdquo; says the Captain. &ldquo;The weather office has sent its wind sheet. My notes are on the crate. The rules of the Trial are nailed to that post. Read all three, Clerk. Then come and tell me how high we fly.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#capt').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Sacks aboard, Clerk,&rdquo; says the Captain. &ldquo;The wind will not wait for us, and neither will Mr Varley.&rdquo;'); return; }
    ER.talk({
      who: 'Captain Montalvo', role: 'Master of the mail ship Dunnock', face: window.FACE('mont'),
      lines: [
        { note: 'She has chalk on both hands and a pencil behind each ear.', a: '&ldquo;Montalvo. I have flown the Windgate road since before you were born, and I still read the wind sheet every morning as if I had never seen one. So will you.&rdquo;' },
        { q: 'What is the Trial?', a: 'Two ships, seven sacks each, one morning. The first to put all seven on the Postmaster&rsquo;s table at Tolver, with her log, carries the mail for five years. The other one goes away and carries something else. Coal, I expect.' },
        { q: 'Can the Dunnock win?', a: 'She makes fifty kilometres an hour in still air. That silver thing outside makes eighty. But the air between here and Tolver is never still, Clerk, and it is not the same air at every height. At one height the wind is behind you. At another it is in your face. A slow ship at the right height will beat a fast ship at the wrong one.' },
        { q: 'What do you want me to do?', a: 'The road has three legs: the plain, the mountains, and the valley down to Tolver. Choose me a height for each. The wind sheet says what the air is doing. My notes say what I will and will not do in it. Set the three heights on this board, and I shall ask you why.' },
        { q: 'And after that?', a: 'After that you tell me how many minutes each leg will take us, and I shall tell Tolver when to put the kettle on.' }
      ],
      clue: { id: 'cap1', title: 'Captain Montalvo, in the shed', kind: 'What she said' },
      done: function (seen) { if (seen && tell('cap')) { paint(); ER.say('The wind sheet is pinned to the corner of the blackboard. Her notes are the small black book on the crate. The rules are nailed to the post on the left, under the lantern.'); } }
    });
  });
  $('#varley').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The doorway is empty. There is an apple core in the bucket, exactly in the middle.'); return; }
    ER.talk({
      who: 'Captain Varley', role: 'Master of the Goshawk · the Brandreth Line', face: window.FACE('varley'),
      lines: [
        { note: 'He is leaning in the doorway in a silver-grey jacket, eating an apple. He looks about thirty-five, and very wide awake.', a: '&ldquo;Rafe Varley. The Goshawk is mine. Well, she is Mr Brandreth&rsquo;s, but I am allowed to drive. You are the new Driscoll? Don&rsquo;t let her frighten you. She frightened me for nine years, and look at me now.&rdquo;' },
        { q: 'Nine years?', a: 'I was her mate. Everything I know about that road I learned standing behind her at that wheel. Then the Brandreth Line built a ship that makes eighty in still air, and wanted somebody to fly it. I am not proud. Well. I am a bit.' },
        { q: 'How high will you fly?', a: 'Three thousand metres, the whole way. Have you seen the wind sheet? Eighty-five kilometres an hour at three thousand, from the west, on both sides of the range. Add that to my eighty. I shall be in Tolver before her kettle boils.' },
        { q: 'The Captain has rules about that.', a: 'She has a little black book with seven rules in it, and I know them all by heart. I have even kept most of them.</p><p class="note">He throws the apple core over his shoulder. It lands in a bucket six metres away.</p><p>Number six is for slow ships.' }
      ],
      clue: { id: 'var1', title: 'Captain Varley, in the doorway', kind: 'What he said' },
      done: function (seen) { if (seen) tell('var'); }
    });
  });

  /* ---------- papers ---------- */
  $('#metsheet').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    ER.read({ html: MAIL.met(), cls: 'met', clue: { id: 'met', title: 'The wind sheet', kind: 'Lowmere Weather Office, 05.00' }, done: function () {
      MAIL.words(['range', 'telegraph']);
      if (tell('met')) { paint(); ER.say('The same country, the same morning, and six different winds, one on top of another.'); }
    } });
  });
  var NOTES = '<h4>The Windgate road, going east</h4>' +
    '<p class="legs">Leg 1. Lowmere to Carrow, 70 km: the plain. Highest ground 600 m.</p>' +
    '<p class="legs">Leg 2. Carrow to the Lip, over the Windgate, 55 km: the range. Highest ground on our line: the Windgate itself, 2,100 m.</p>' +
    '<p class="legs">Leg 3. The Lip to Tolver, 40 km: the valley. Highest ground 1,100 m, just under the Lip. Tolver field is at 800 m.</p>' +
    '<ol class="gapp"><li>Our road runs east, all the way. So a west wind is behind us, and an east wind is in our face.</li>' +
    '<li>The Dunnock makes 50 km/h through still air. A wind behind her: add it. A wind in her face: take it away. The answer is her speed over the ground, and the ground is where Tolver is.</li>' +
    '<li>Keep 300 m of air between her keel and the highest ground on the leg. More is welcome. Less is not flying: it is luck.</li>' +
    '<li>I find my way by what I can see. Never fly a leg IN cloud. Never fly a leg ABOVE cloud either, unless the ground leaves no other way.</li>' +
    '<li>If the rules allow two heights, take the one that gets us there sooner.</li>' +
    '<li>Never cross the Windgate in a wind of more than 70. Beyond the pass the air pours down the far side like water over a weir, and the stronger the wind, the deeper it falls.</li>' +
    '<li>After the Windgate: down to 2,000 m or lower, at once. Tolver lies deep in its valley. A ship that arrives high must let out gas to get down, and gas is what holds her up.</li></ol>';
  $('#notesbook').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: NOTES, cls: 'notes', clue: { id: 'notes', title: 'The Captain’s notes', kind: 'A small black book' }, done: function () {
      MAIL.words(['keel', 'weir', 'pass', 'leg']);
      if (tell('notes')) { paint(); ER.say('Seven rules, in thirty-one years. She cannot have needed many.'); }
    } });
  });
  var TRIAL = '<h4><small>THE POST OFFICE OF CORVALE</small>The Tolver Mail: a Trial</h4>' +
    '<p>To decide which airship shall carry the mail between Lowmere and Tolver for the next five years.</p>' +
    '<ol><li>Each ship carries seven sacks.</li><li>The ships leave Lowmere together, at six o&rsquo;clock.</li>' +
    '<li>A ship that lands anywhere between Lowmere and Tolver, for any reason whatever, is out of the Trial.</li>' +
    '<li>The first ship to hand all seven sacks, and her log, to the Postmaster of Tolver wins. The Postmaster&rsquo;s clock is the only clock.</li></ol>' +
    '<p class="foot">The Dunnock also carries the bag for Windgate Hospice, as she always has. It is to be dropped by a Post Office hand. &mdash; F. Mirza, Postmaster, Tolver</p>';
  $('#trialpost').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TRIAL, cls: 'trial', clue: { id: 'trial', title: 'The rules of the Trial', kind: 'Nailed to a post' }, done: function () {
      MAIL.words(['log', 'sack']);
      if (tell('trial')) { paint(); ER.say('Four rules. Whoever wrote them did not like long sentences, or excuses.'); }
    } });
  });
  var BILL = '<h4>WAY BILL</h4><p>Lowmere to Tolver &middot; Thursday &middot; by air</p>' +
    '<p>By airship DUNNOCK: sacks 1 to 7. Also one grey bag for Windgate Hospice (to be dropped; red streamer).</p><p>By airship GOSHAWK: sacks 8 to 14.</p><p>Each sack 25 kg. The bag 6 kg.</p>' +
    '<p class="reg">REGISTERED, in sack 7: No. 311<br><span class="hand">Captain I. Montalvo, care of the Postmaster, Tolver. To be given to her when the Trial is over.</span></p>';
  $('#sacks').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BILL, cls: 'bill', clue: { id: 'bill', title: 'The way bill', kind: 'Lowmere Post Office' }, done: function () {
      if (tell('bill')) ER.say('Fourteen sacks, two ships, and one letter that is going a long way round.');
    } });
  });

  /* ---------- things in the shed ---------- */
  MAIL.thing('#ship', 'airship', 'The Dunnock: sixty metres of patched brown canvas, held up by gas. Her name has been painted again and again in thirty-one years, and every time it has faded to the same colour.', isBusy);
  MAIL.thing('#gond', 'gondola', 'The gondola: the long wooden car that hangs under an airship, where her crew stand. There is a light on inside, and a pair of oily boots is going up the ladder.', isBusy);
  MAIL.thing('#gosh', 'mast', function () { return nextFile ? 'The mast stands empty on the field. The Goshawk is a silver pencil, high up, going east.' : 'The Goshawk, out on the field, tied by the nose to her mast: silver, with a red stripe, and not one patch on her.'; }, isBusy);
  MAIL.thing('#hbag', 'streamer', 'The grey bag for Windgate Hospice. A long red streamer is rolled up on top of it. When the bag falls the streamer opens, so that somebody below can see where it comes down.', isBusy);
  MAIL.thing('#cat', null, 'The cat opens one eye, decides that you are only the Post Office, and closes it again.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#board').addEventListener('click', function () {
    var left = [];
    if (busy) return;
    if (nextFile) { ER.say('Three heights, three times, and one box in the corner with the hour in it.'); return; }
    if (!told.cap) { ER.say('A blackboard, with a chalk drawing of some very large hills. The woman with the chalk has not finished with it, or with you.'); return; }
    if (!told.met) left.push('the wind sheet, on the corner of this board');
    if (!told.notes) left.push('my notes, on the crate');
    if (!told.trial) left.push('the rules of the Trial, on the post under the lantern');
    if (left.length) { ER.say('&ldquo;Not yet, Clerk,&rdquo; says the Captain. &ldquo;You have still to read ' + left.join(', and ') + '.&rdquo;'); return; }
    if (!bench) bench = makeBench();
    bench.open();
  });

  /* ---------- the blackboard: a height for each leg, and then the clock ---------- */
  function makeBench() {
    var HS = [500, 1000, 1500, 2000, 2500, 3000], LEGS = [{ km: 70, mid: 35, east: 0 }, { km: 55, mid: 97.5, east: 0 }, { km: 40, mid: 150, east: 1 }],
      GROUND = [[0, 200], [30, 200], [44, 340], [52, 600], [60, 420], [70, 300], [86, 700], [100, 1300], [112, 1800], [118, 2100], [125, 2100], [127, 1100], [140, 980], [165, 800]],
      h = ER.flag('a-h') || [0, 0, 0], stage = ER.flag('a-stage') || 0, wait = false, box = ER.el('div', 'bx board'), s, ships = [], wl = [];
    function X(km) { return 90 + km * 5.2; }
    function Y(m) { return 500 - m * 0.1375; }
    function M(m) { return MAIL.metres(m) + ' metres'; }
    s = '<svg viewBox="0 0 1000 540"><rect class="bd-bg" width="1000" height="540"/>';
    HS.forEach(function (m) { s += '<path class="bd-line" d="M90 ' + Y(m) + 'H950"/><text class="bd-num" x="80" y="' + (Y(m) + 6) + '">' + MAIL.metres(m) + '</text>'; });
    s += '<text class="bd-num" x="80" y="' + (Y(0) + 6) + '">0 m</text><path class="bd-ground" d="M90 520' + GROUND.map(function (g) { return 'L' + X(g[0]).toFixed(1) + ' ' + Y(g[1]).toFixed(1); }).join('') + 'L948 520Z"/>' +
      '<path class="bd-leg" d="M' + X(70) + ' 44V500M' + X(125) + ' 44V' + Y(2100) + '"/>' +
      '<text class="bd-legT" x="' + X(35) + '" y="34">LEG 1 &#183; 70 KM &#183; THE PLAIN</text><text class="bd-legT" x="' + X(97.5) + '" y="34">LEG 2 &#183; 55 KM &#183; THE RANGE</text><text class="bd-legT" x="' + X(146) + '" y="34">LEG 3 &#183; 40 KM &#183; THE VALLEY</text>' +
      '<text class="bd-spot" x="' + X(9) + '" y="' + (Y(200) + 26) + '">Lowmere</text><text class="bd-spot" x="' + X(52) + '" y="' + (Y(600) - 9) + '">600</text><text class="bd-spot" x="' + X(70) + '" y="' + (Y(300) + 30) + '">Carrow</text>' +
      '<text class="bd-spot" x="' + X(113) + '" y="' + (Y(2100) - 12) + '">the Windgate 2,100</text><text class="bd-spot" x="' + X(128) + '" y="' + Y(1560) + '" style="text-anchor:start">the Lip</text><text class="bd-spot" x="' + X(134) + '" y="' + (Y(1100) - 8) + '">1,100</text><text class="bd-spot" x="' + X(153.5) + '" y="' + (Y(800) + 36) + '" style="text-anchor:start">Tolver 800</text>';
    LEGS.forEach(function (L, i) {
      s += '<path class="bd-rail" d="M' + X(L.mid) + ' ' + Y(3000) + 'V' + Y(500) + '"/>';
      s += '<g class="bd-ship" data-l="' + i + '"><ellipse rx="46" ry="22" fill="#fff" opacity="0"/><path d="M-32 0l-10 -9v18zM-32 0q32 -17 64 0q-32 17 -64 0zM-9 9h18v6h-18z"/><text y="-17"></text></g>';
      HS.forEach(function (m) { s += '<circle class="bd-rung" data-l="' + i + '" data-h="' + m + '" cx="' + X(L.mid) + '" cy="' + Y(m) + '" r="8"/>'; });      /* the rings lie on top, so that a ship never hides one */
    });
    box.innerHTML = '<div class="frame">' + s + '</svg></div><div class="bx-foot"><p class="pmsg"></p><span id="a-slot" style="display:inline-flex;gap:6px"></span><button type="button" class="btn" id="a-go"></button></div>';
    var svg = box.querySelector('svg'), msgEl = box.querySelector('.pmsg'), go = box.querySelector('#a-go'), slot = box.querySelector('#a-slot');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function groundAt(km) { for (var j = 1; j < GROUND.length; j++) if (km <= GROUND[j][0]) return GROUND[j - 1][1] + (GROUND[j][1] - GROUND[j - 1][1]) * (km - GROUND[j - 1][0]) / (GROUND[j][0] - GROUND[j - 1][0]); return 0; }
    function place(i, y) { ships[i].setAttribute('transform', 'translate(' + X(LEGS[i].mid) + ' ' + y.toFixed(1) + ')'); }
    function draw() {
      ships.forEach(function (g, i) {
        place(i, h[i] ? Y(h[i]) : Y(groundAt(LEGS[i].mid)) - 12);
        g.querySelector('text').textContent = h[i] ? MAIL.metres(h[i]) + ' m' : 'on the ground';
      });
      ER.$$('.bd-rung', svg).forEach(function (r) { r.setAttribute('class', 'bd-rung' + (h[+r.getAttribute('data-l')] === +r.getAttribute('data-h') ? ' at' : '')); });
      slot.style.display = stage === 1 ? 'inline-flex' : 'none';
      go.textContent = stage ? 'Those are the minutes' : 'These three heights';
    }
    function set(i, m) { if (wait || stage) return; h[i] = m; ER.flag('a-h', h); MAIL.sfx.chalk(); draw(); msg('Leg ' + (i + 1) + ': ' + M(m) + '. Chalk rubs out: change it as often as you like, and then tell her.'); }
    ER.$$('.bd-ship', svg).forEach(function (g, i) {
      ships[i] = g;
      ER.drag(g, {
        start: function () { if (wait || stage) return false; },
        move: function (e) { place(i, MAIL.clamp(ER.pt(svg, e).y, Y(3000), Y(500))); },
        end: function (e, moved) {
          if (!moved) { draw(); return; }
          var y = ER.pt(svg, e).y, best = HS[0];
          HS.forEach(function (m) { if (Math.abs(Y(m) - y) < Math.abs(Y(best) - y)) best = m; });
          set(i, best);
        }
      });
    });
    svg.addEventListener('click', function (e) {
      var r = e.target.closest ? e.target.closest('.bd-rung') : null;
      if (r) set(+r.getAttribute('data-l'), +r.getAttribute('data-h'));
    });
    LEGS.forEach(function (L, i) { wl[i] = MAIL.wheels(slot, { label: 'Leg ' + (i + 1), n: 2, unit: 'min', start: (ER.flag('a-m') || [])[i], change: function () { ER.flag('a-m', wl.map(function (w) { return w.at(); })); } }); });

    var C = '&rdquo; says the Captain. &ldquo;', WHY = [{
      500: '&ldquo;Five hundred?' + C + 'The hills before Carrow are six hundred metres high, Clerk. Read me rule three.&rdquo;',
      1000: '&ldquo;A thousand clears the hills, and it is under the cloud: I allow it,' + C + 'Now read me the wind at a thousand, west of the range. Where does that wind come FROM? And which way are we going?&rdquo;',
      2000: '&ldquo;Two thousand, west of the range,' + C + 'What does the wind sheet say is at two thousand, besides wind? Rule four.&rdquo;',
      2500: '&ldquo;Sixty behind us: very nice,' + C + 'And what lies under us at two thousand five hundred, all the way across the plain? I fly by what I can see. Rule four: does the ground leave us no other way?&rdquo;',
      3000: '&ldquo;You have been talking to Mr Varley,' + C + 'Seventy kilometres above the cloud, when the plain lets us fly under it? Rule four.&rdquo;'
    }, {
      500: '&ldquo;The Windgate is 2,100 metres high,' + C + 'At that height we do not go over the range, Clerk. We go into it.&rdquo;',
      2000: '&ldquo;Two thousand. The pass is two thousand one hundred,' + C + 'I should like to be over it, not a hundred metres inside it. And rule three wants three hundred more.&rdquo;',
      3000: '&ldquo;Three thousand clears the pass, and it is above the cloud, which cannot be helped up there,' + C + 'But how strong is the wind at three thousand? Read me rule six.&rdquo;'
    }, {
      500: '&ldquo;Tolver field is at 800 metres,' + C + 'At 500 we should be flying three hundred metres under the town. Even I cannot do that.&rdquo;',
      1000: '&ldquo;The valley floor under the Lip is 1,100 metres,' + C + 'A thousand is a height for moles, not for ships. Rule three.&rdquo;',
      1500: '&ldquo;Fifteen hundred clears the valley, and rule seven likes it,' + C + 'But read me the wind EAST of the range at fifteen hundred. Is that behind us, or in our face?&rdquo;',
      2500: '&ldquo;Sixty behind us down the valley: I know,' + C + 'Now read rule seven, and tell me what a ship pays for arriving high.&rdquo;',
      3000: '&ldquo;Rule seven, Clerk,' + C + 'After the Windgate we go DOWN.&rdquo;'
    }];
    WHY[1][1000] = WHY[1][1500] = WHY[1][500];

    go.addEventListener('click', function () {
      var i, v, w, mins, total, eta, file;
      if (wait || nextFile) return;
      if (!stage) {
        if (!(h[0] && h[1] && h[2])) { msg('Three legs, three heights. Lift each chalk ship to the height it should fly at: drag it, or click a ring on its ladder.'); return; }
        for (i = 0; i < 3; i++) if (!ER.check('h' + (i + 1), h[i])) { ER.sfx.no(); msg('<b>Leg ' + (i + 1) + '.</b> ' + (WHY[i][h[i]] || '&ldquo;Why?&rdquo; asks the Captain.')); return; }
        stage = 1; ER.flag('a-stage', 1); MAIL.sfx.chalk(); draw(); paint();
        msg('&ldquo;' + M(h[0]) + ' across the plain: under the cloud, with the wind behind us. ' + M(h[1]) + ' over the Windgate: high enough, and not too wild. ' + M(h[2]) + ' down the valley, for the sake of the gas. Good,' + C + 'Now the clock. How many minutes for each leg?&rdquo;');
        return;
      }
      mins = wl.map(function (x) { return x.get(); });
      for (i = 0; i < 3; i++) if (!ER.check('m' + (i + 1), mins[i])) {
        ER.sfx.no(); w = MAIL.wind(h[i], LEGS[i].east);
        msg('<b>Leg ' + (i + 1) + '.</b> ' + (+mins[i] === Math.round(LEGS[i].km / 50 * 60) ? '&ldquo;That is her time in still air,' + C + 'The air is not still this morning: that is the whole point of a wind sheet. Rule two.&rdquo;' :
          '&ldquo;' + LEGS[i].km + ' kilometres,' + C + 'At ' + M(h[i]) + ' the sheet gives a ' + (w.from === 'W' ? 'west' : 'east') + ' wind of ' + w.kmh + '. Is that behind us? Then how fast is she going over the ground? And how long do ' + LEGS[i].km + ' kilometres take at that speed?&rdquo;'));
        return;
      }
      file = ER.exit([h.join('-') + '-' + mins.join('-')], { wait: true });
      if (!file) { msg('The chalk has broken. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file); wl.forEach(function (x) { x.lock(true); });
      total = (+mins[0]) + (+mins[1]) + (+mins[2]); eta = ('0' + (6 + Math.floor(total / 60))).slice(-2) + '.' + ('0' + total % 60).slice(-2); ER.flag('a-eta', eta);
      MAIL.mine('plan', 'The flight plan', LEGS.map(function (L, j) {
        var q = MAIL.wind(h[j], L.east);
        return '<p>Leg ' + (j + 1) + ', ' + L.km + ' km: ' + MAIL.metres(h[j]) + ' m. Wind ' + q.from + ' ' + q.kmh + ', behind us: ' + (50 + q.kmh) + ' km/h over the ground. ' + mins[j] + ' minutes.</p>';
      }).join('') + '<p>Cast off 06.00. Tolver at <b>' + eta + '</b>.</p>', true);
      msg('&ldquo;' + mins[0] + ' minutes, ' + mins[1] + ' and ' + mins[2] + '. Six o&rsquo;clock and ' + total + ' minutes: Tolver at ' + eta + ',' + C + 'Mr Varley says half past seven. We shall see what the Windgate says.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'The Captain writes the hour in the corner of the board and draws a box round it.',
          'Outside, an engine starts with a noise like tearing cloth, and then another. The Goshawk is off her mast already: long, silver, with a red stripe from nose to tail, climbing as if somebody were pulling her up on a string.',
          '&ldquo;Three thousand metres,&rdquo; says the Captain, watching her go. &ldquo;Eighty-five behind him. He was always bad at rule six.&rdquo; She does not sound angry. She sounds like a teacher who has marked the same sum wrong for nine years.',
          '&ldquo;Sacks aboard, Clerk. And the cat. Her name is Ballast, and she is the only weight on this ship that nobody is allowed to drop.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 3400);
    });
    draw();
    msg(stage ? 'The three heights are chalked up. Now the minutes for each leg: the arrows turn the figures.' :
      'The Captain has drawn the ground, from Lowmere to Tolver, and nothing else. The air is your business. Lift each chalk ship to the height it should fly at.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return stage; }
    };
  }
})();
</script>
</body>
</html>
