<style>
  body{--bg:#8fc0e6;--accent:#f0c35a;--font-display:'Limelight',serif;--font-ui:'Josefin Sans',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(30,58,50,.96);--tc-ink:#f6f0dc;--cap-bg:rgba(24,46,40,.93);--panel:#21382f;--face-bg:#a9c7df;--q-ink:#f3d99a;--fade:#dfeaf2;--hud-bg:rgba(24,46,40,.82);--ov-bg:rgba(10,20,18,.88)}
  .stn{font-family:'Stardos Stencil',serif;font-weight:700;text-anchor:middle}
  .hullT{font-family:'Limelight',serif;font-size:54px;letter-spacing:8px;fill:#c8a878;opacity:.6}
  .wisp{animation:wisp 6s linear infinite;opacity:0}
  .wisp.b{animation-delay:-2s}.wisp.c{animation-delay:-4s}
  @keyframes wisp{0%{transform:translate(0,0) scale(.8);opacity:0}15%{opacity:.9}100%{transform:translate(14px,150px) scale(1.5);opacity:0}}
  #sockflap{transform-origin:960px 478px;animation:sock 1.7s ease-in-out infinite alternate}
  @keyframes sock{from{transform:rotate(-7deg)}to{transform:rotate(8deg)}}
  #minhand{animation:tick 60s steps(60,end) infinite;transform-origin:700px 632px}
  @keyframes tick{to{transform:rotate(360deg)}}
  #smoke5{animation:smoke 7s ease-in-out infinite alternate;transform-origin:250px 430px}
  @keyframes smoke{to{transform:skewX(-10deg)}}
  #glog5.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.35)}}
  #catpile{display:none}
  body.ended #catpile{display:block}
  body.ended #catsh{display:none}

  /* the Goshawk's log on the green cloth, and what you can show against it */
  .bx.tb{width:min(1060px,96vw)}
  .tb .two{display:grid;grid-template-columns:1fr 410px;gap:0 14px;align-items:start}
  .tb .lg{background:#fbfbf6;color:#1b2136;border:1px solid #9aa0ac;box-shadow:0 20px 50px rgba(0,0,0,.5);padding:0 0 10px}
  .tb .lg h4{margin:0 0 3px;padding:10px 20px 6px;background:#b3271f;color:#fff;font-family:'Limelight',serif;font-weight:normal;font-size:20px;letter-spacing:.06em}
  .tb .lg h4 small{display:block;font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#ffd9d0;margin-top:1px}
  .tb .ent{display:grid;grid-template-columns:96px 1fr;gap:0 8px;margin:0 16px;padding:5px 6px 0;border-bottom:1px solid #b9c4dc;cursor:pointer;border-left:4px solid transparent}
  .tb .ent:hover{background:#f1efe2}
  .tb .ent b{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:13px;color:#b3271f;padding-top:6px}
  .tb .ent span{font-family:'Homemade Apple',cursive;font-size:14.5px;line-height:1.5;color:#1b2136}
  .tb .ent.sel{background:#fbe9c0;border-left-color:#b3271f}
  .tb .ent.off{cursor:default}
  .tb .ent.off:hover{background:none}
  .tb .ent.sel.off:hover{background:#fbe9c0}
  .tb .side{min-height:380px}
  .tb .side p{margin:0;font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.38;color:#f1ecdf}
  .tb .side h5{margin:2px 0 8px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:#f0c35a}
  .tb .pp{display:block;width:100%;text-align:left;margin:0 0 7px;padding:10px 14px 8px;background:#f1ead8;color:#27231d;border-left:6px solid #7a1f1f;font-family:'EB Garamond',serif;font-size:18px;line-height:1.15;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .tb .pp small{display:block;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7a1f1f}
  .tb .pp:hover{background:#fbf3dd}
  .tb .pp.sel{outline:3px solid #f0c35a;outline-offset:1px;background:#fbe9c0}
  .tb .vg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tb .vv{position:relative;padding:0;border:3px solid #22160b;background:#22160b;display:block}
  .tb .vv svg{display:block;width:100%;height:auto}
  .tb .vv i{position:absolute;left:0;bottom:0;padding:5px 9px 2px;background:rgba(20,28,40,.82);color:#f1ecdf;font-style:normal;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .tb .vv:hover{border-color:#f0c35a}
  .tb .vv.sel{border-color:#f0c35a;box-shadow:0 0 0 3px #f0c35a}
  .tb .bx-foot{min-height:66px}

  /* the card at the end */
  .done{position:fixed;right:2.2vw;top:62px;z-index:34;width:min(430px,94vw);padding:18px 26px 16px;display:none;background:#f6f0da;color:#231d14;border-top:10px solid #7a1f1f;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .done.on{display:block}
  .pstamp{display:inline-grid;place-items:center;width:168px;height:168px;border:5px double #7a1f1f;border-radius:50%;color:#7a1f1f;font-family:'Stardos Stencil',serif;font-weight:700;text-align:center;line-height:1.05;transform:rotate(-9deg);margin:0 0 10px -6px}
  .pstamp b{display:block;font-size:21px;letter-spacing:.06em;margin:3px 0 1px}
  .pstamp span{display:block;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.2em}
  .done p{margin:0 0 4px;font-family:'Special Elite','Courier New',monospace;font-size:15px;line-height:1.4}
  .done .row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .done .btn{--accent:#7a1f1f;font-size:13.5px;padding:10px 13px 6px}
  .done .btn:hover:not([disabled]){color:#f6f0da}
  .done small{display:block;margin-top:10px;font-family:'Special Elite','Courier New',monospace;font-size:12.5px;opacity:.8;line-height:1.5}
  .done small button{text-decoration:underline;font:inherit}
  .rp{width:min(760px,94vw);max-height:84vh;overflow:auto;background:#fbfbf6;color:#1b2136;padding:22px 34px 18px;box-shadow:0 26px 70px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;border-top:14px solid #5a3f26}
  .rp h4{margin:0 0 3px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#5a3f26}
  .rp h3{margin:0 0 8px;font-family:'Limelight',serif;font-weight:normal;font-size:27px;line-height:1.1}
  .rp p,.rp label{display:block;font-family:'EB Garamond',serif;font-size:18px;line-height:1.4;margin:0 0 7px;color:#27231d}
  .rp textarea,.rp input[type=text]{width:100%;font-family:'Caveat',cursive;font-size:25px;line-height:30px;color:#1d2a55;background:#fbf7e6 repeating-linear-gradient(transparent 0 29px,rgba(60,70,110,.3) 29px 30px);border:1px solid #9a927a;padding:0 12px;border-radius:0;resize:vertical;-webkit-user-select:text;user-select:text}
  .rp textarea{min-height:184px}
  .rp input[type=text]{height:32px}
  .rp .count{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;text-align:right;margin-top:3px}
  .rp .foot{display:flex;gap:10px;align-items:center;margin-top:10px}
  .rp .foot span{flex:1;font-family:'Special Elite',monospace;font-size:12.500px;opacity:.75}
  .rp .btn{--accent:#5a3f26}.rp .btn:hover:not([disabled]){color:#fbfbf6}
  @media print{
    body{overflow:visible;background:#fff}
    body>*:not(.ov){display:none!important}
    .ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
    .ov-bar,.rp .foot{display:none!important}
    .rp{box-shadow:none;max-height:none;width:auto;overflow:visible}
  }
</style>

      'Mrs Mirza is waiting. Which of your papers says that the line cannot be true?', 'What was the wind doing at the Windgate itself? Show her.', 'For fifty minutes the Goshawk was somewhere. Where?'][stage] || '');
    return {
      open: function () { ER.open('ov-lock', box); if (tell('log')) ER.addClue('glog', 'The log of the Goshawk', LOGHEAD + LOG.map(function (r) { return '<div class="ent"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'; }).join(''), 'glog', 'Handed in at 07.55'); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return Math.min(stage, 3); }
    };
  }

  /* ---------- what Captain Varley says, what Mrs Mirza rules, and one letter ---------- */
  var LETTER = '<p>Lowmere, Wednesday night.</p><p>Skipper,</p><p>By the time you read this, one of us has won. I am writing it now, so that you will know I meant it either way.</p>' +
    '<p>If the Goshawk has the mail: I have told Mr Brandreth that I will not fly the Windgate in winter without your notes and, if you can bear it, you. He has agreed to both. And to the cat.</p>' +
    '<p>If the Dunnock has it: Driscoll will be in plaster till Christmas, and you will want a mate who knows the road. I know the road. I learned every metre of it standing behind you.</p>' +
    '<p>I still cannot keep rule six. I mean to try it tomorrow at eighty-five, and I expect to be sorry.</p><p>Rafe</p>';
  function after() {
    busy = true; paint();
    ER.talk({
      who: 'Captain Varley', role: 'Master of the Goshawk', face: window.FACE('varley'),
      lines: [
        { note: 'He looks at the line for a long time, and then at the range, where the cloud is still pouring over.', a: '&ldquo;I wrote it down as it happened. Then I thought of forty people who work for the Line. Then I took my knife to the page, and wrote that. I could not even get the wind right. I am a poor liar, Mrs Mirza. It is a thing I never had to learn on the Dunnock.&rdquo;' },
        { q: 'What happened at the Windgate?', a: 'Rule six happened. I went over at three thousand metres with eighty-five behind me, and beyond the Lip the air fell out from under her. Seven hundred metres, in about a minute. I let go every bag of sand I had, all at once. The lashings on the mail broke, and sack eleven went out of the hatch with the sand.' },
        { q: 'So you came down.', a: 'A sack of other people&rsquo;s letters was lying on that mountain with my ship&rsquo;s number on it. I brought her down over the snowfield east of the house, and we tied her to the Hospice wall. Then my two men, the keeper and I walked round in that sand for fifty minutes. It was under the cornice, with one corner torn. I counted the letters twice.' },
        { q: 'How did you get away again, with no sand?', a: 'The Hospice now owns a grapnel, a spare propeller, two parachutes and my second-best coat. The keeper says that he will find a use for all of them.</p><p class="note">He turns his hat round in his hands.</p><p>I knew what rule three says. I knew it when I turned her round.' }
      ],
      clue: { id: 'var2', title: 'Captain Varley, at the table', kind: 'What he said' }, last: 'Close',
      done: function () {
        ER.narrate([
          'Nobody on the field says anything. A long way off, the cloud goes on pouring over the Windgate.',
          'Mrs Mirza dips her pen. &ldquo;Rule three. A ship that lands anywhere between Lowmere and Tolver, for any reason whatever, is out of the Trial. I wrote that rule myself. I wrote FOR ANY REASON WHATEVER because I knew that one day somebody would have a good one.&rdquo;',
          'Captain Montalvo has not said a word since she came down the ladder. Now she says five. &ldquo;I should have landed too.&rdquo;',
          '&ldquo;I know you would, Ines,&rdquo; says Mrs Mirza. &ldquo;So let us be exact. Captain Varley: did the Goshawk&rsquo;s keel touch the snow?&rdquo; &ldquo;No. We held her a metre off it, on two ropes, the whole time.&rdquo; &ldquo;Then she did not land. A ship that is a metre off the ground is in the air. I shall write a new rule about that in the spring.&rdquo;',
          '&ldquo;Rule four, however, I shall use as it stands. All seven sacks, AND HER LOG. A log is a true account, or it is a story. At five minutes to eight I was handed seven sacks and a story.&rdquo; She turns the red book round and holds out her pen. &ldquo;Write that line again, Captain. As it happened.&rdquo;',
          'He writes. It takes him some time. She blots it, reads it, and looks at her clock. &ldquo;Seven sacks and a log from the Dunnock at fourteen minutes to nine. Seven sacks and a log from the Goshawk at twelve minutes past. The Dunnock has the mail.&rdquo;',
          '&ldquo;One thing more.&rdquo; She opens sack seven herself, and takes out a letter. &ldquo;Registered, number 311. To be given to Captain Montalvo when the Trial is over. It is over.&rdquo; The address is in a small square hand: the same hand as the red book.'
        ], function () {
          ER.read({ html: LETTER, cls: 'letter2', clue: { id: 'letter', title: 'Registered letter No. 311', kind: 'In sack seven' }, done: function () {
            ER.narrate([
              'The Captain reads it twice, folds it, and puts it in the pocket of the leather coat. &ldquo;And were you sorry?&rdquo; &ldquo;Very,&rdquo; says Captain Varley. &ldquo;For about a minute, and seven hundred metres.&rdquo;',
              '&ldquo;The pay is poor,&rdquo; says the Captain. &ldquo;The ship is slow. And you will copy out rule six for me a hundred times, beginning with the number seventy.&rdquo; &ldquo;Yes, Skipper.&rdquo;',
              'Then she turns to you. &ldquo;As for you, Clerk. Lowmere sent me somebody to drop a bag. You found me three heights, a valley, a hundred and seventy kilos and a west wind. Driscoll may have his job back when his leg has mended. Until then, the hatch is yours.&rdquo;',
              'Mr Nkemelu comes across the grass with the cat on his shoulder. Ballast looks at the two piles of sacks, chooses the Dunnock&rsquo;s, and goes to sleep on the top one.'
            ], function () { busy = false; ER.flag('e-done', 1); finish(false); });
          } });
        });
      }
    });
  }
  function finish(quick) {
    var st = ER.state(), mins = MAIL.mins(), hn = ER.hintsUsed();
    $('#d-time').textContent = 'Lowmere to Tolver: ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
    $('#d-hints').textContent = hn ? 'Hints asked for: ' + hn + '.' : 'Hints asked for: none at all.';
    $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' papers and ' + Object.keys(st.words).length + ' words.';
    $('#done').classList.add('on'); paint();
    if (quick) ER.say('Tolver field, and fourteen sacks on the right side of the mountains.');
    else { MAIL.sfx.stamp(); try { if (ER.track && ER.music()) ER.track.play(['archive', { root: 55, bpm: 76, beds: [['birds', 0.5], ['crowd', 0.35]] }]); } catch (e) {} }      /* the reading is over: the tune comes back */
  }
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });
  $('#b-task').addEventListener('click', function () {
    var saved = ER.flag('task') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>Mail ship Dunnock &middot; her log</h4><h3>One line is missing</h3>' +
      '<p>The Captain pushes the brown book across the green cloth, with a pen. &ldquo;The Windgate is yours to write, Clerk. You were the one at the hatch.&rdquo;</p>' +
      '<p><b>A</b> Write that line of the Dunnock&rsquo;s log, in 50 to 80 words: the time, the height and the wind; what you did at the hatch, and in what order; what you saw on the snow. A log says what was done and seen, not what the writer thinks. Use: first, then, as soon as, after.<br><b>B</b> Or write the line that Captain Varley had to write again in the Goshawk&rsquo;s log, as it happened.</p>' +
      '<textarea id="r1"></textarea><div class="count"></div><label for="r2">Written up by</label><input type="text" id="r2" maxlength="60">' +
      '<div class="foot"><span>Nobody marks this. It is saved in this browser as you write.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > p');
    box.querySelector('#r1').value = saved.r1 || ''; box.querySelector('#r2').value = saved.r2 || '';
    function keep() {
      var o = { r1: box.querySelector('#r1').value, r2: box.querySelector('#r2').value }, n = (o.r1.match(/[A-Za-z’']+/g) || []).length;
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('task', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
