<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Adventure · KEYHOLE</title>
<link rel="stylesheet" href="../assets/fonts-base.css">
<link rel="stylesheet" href="../assets/fonts-adventure.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{--night:#0a1026;color:#efe3c6;font-family:'EB Garamond',Georgia,serif;-webkit-user-select:none;user-select:none;background:var(--night);
    background-image:radial-gradient(ellipse 1000px 460px at 50% -150px,rgba(240,201,90,.26),rgba(240,201,90,.05) 55%,transparent 76%),
      linear-gradient(#141d42,#0a1026 62%)}
  .back{position:fixed;left:14px;top:12px;z-index:3;height:36px;display:inline-flex;align-items:center;padding:3px 14px 0;border:1px solid rgba(255,255,255,.24);
    background:rgba(8,10,24,.66);color:#efe9dc;border-radius:3px;font-family:'Josefin Sans',sans-serif;font-size:14px;letter-spacing:.13em;text-transform:uppercase;text-decoration:none}
  .back:hover{border-color:#f0c96a;color:#f0c96a}
  header{text-align:center;padding:50px 20px 0}
  h1{margin:0;font-family:'Limelight',serif;font-weight:normal;font-size:clamp(46px,6.6vw,82px);letter-spacing:.1em;color:#f0c96a;line-height:1;padding-left:.1em;
    text-shadow:0 3px 0 #5a1722}
  .dep{display:inline-flex;align-items:center;gap:16px;margin:13px 0 0;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:16px;letter-spacing:.42em;
    text-transform:uppercase;color:#f3e3bd;padding-left:.42em}
  .dep:before,.dep:after{content:'';width:70px;height:1px;background:#c79b3b}
  header p{margin:8px 0 0;font-size:20px;font-style:italic;color:#d6c9a9}

  /* a long carriage window, and what goes past it */
  .pano{max-width:1124px;margin:26px auto 0;border:3px solid #d9ae48;border-radius:40px;overflow:hidden;background:#0c1432;
    box-shadow:0 0 0 11px #5a1722,0 0 0 13px #c79b3b,0 22px 44px rgba(0,0,0,.55)}
  .pano svg{display:block;width:100%;height:auto}
  .run{animation:run 44s linear infinite;animation-delay:-13s}
  @keyframes run{from{transform:translateX(-340px)}to{transform:translateX(1240px)}}
  .pf{transform-box:fill-box;transform-origin:center;animation:pf 2.6s ease-out infinite;opacity:0}
  .pf.b{animation-delay:-1.3s}
  @keyframes pf{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.8}100%{transform:translate(-26px,-22px) scale(2);opacity:0}}
  .st{animation:st 3.2s steps(2) infinite}.st:nth-child(3n){animation-delay:-1.4s}
  @keyframes st{50%{opacity:.15}}

  main{max-width:1180px;margin:0 auto;padding:44px 24px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:30px 30px}
  .tk{position:relative;display:block;width:100%;padding:0;border:0;text-align:left;cursor:pointer;font:inherit;color:#2a1a1e;
    background:transparent;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));transition:transform .18s}
  .in{position:relative;display:grid;grid-template-columns:136px 1fr;min-height:216px}
  .tk:nth-child(2n+1){transform:rotate(-.5deg)}.tk:nth-child(2n){transform:rotate(.4deg)}
  .tk:hover{transform:translateY(-6px) rotate(0)}
  .stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 8px 16px;color:#f0c96a;
    background:#6f1f2c linear-gradient(160deg,#8f2c3b,#561621);border-radius:8px 0 0 8px;border-right:2px dashed rgba(240,201,106,.7)}
  .stub:before,.stub:after{content:'';position:absolute;right:-11px;width:20px;height:20px;border-radius:50%;background:var(--night);z-index:1}
  .stub:before{top:-10px}.stub:after{bottom:-10px}
  .stub b{font-family:'Limelight',serif;font-weight:normal;font-size:14px;letter-spacing:.18em;padding-left:.18em}
  .stars{font-size:20px;letter-spacing:1px;line-height:1;white-space:nowrap}
  .stub span{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#f8ecd0;white-space:nowrap}
  .stub span.stars{color:#f0c96a;font-size:20px;letter-spacing:1px}
  .stars i{font-style:normal;opacity:.38}
  .body{position:relative;display:block;padding:27px 28px 18px 32px;background:#f3ead2 linear-gradient(170deg,rgba(255,255,255,.5),rgba(150,110,50,.14));border-radius:0 8px 8px 0}
  .body:after{content:'';position:absolute;left:14px;right:14px;top:12px;bottom:12px;border:1px solid rgba(90,23,34,.28);border-radius:3px;pointer-events:none}
  .no{display:block;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8a2433}
  .tk h2{margin:8px 0 8px;font-family:'Limelight',serif;font-weight:normal;font-size:29px;line-height:1.1;color:#5a1722}
  .tk p{margin:0 0 34px;font-size:19px;line-height:1.38}
  .state{position:absolute;right:28px;bottom:20px;padding:6px 12px 2px;border:2px solid #2f6b4f;color:#2f6b4f;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12.5px;
    letter-spacing:.2em;text-transform:uppercase;border-radius:3px}
  .tk.going .state{border-color:#1f3a8a;color:#1f3a8a;transform:rotate(-4deg)}
  .tk.solved .state{border:3px double #8a2433;color:#8a2433;transform:rotate(-5deg);font-size:14px}
  .tk.solved .in:after{content:'';position:absolute;left:58px;top:20px;width:20px;height:20px;border-radius:50%;background:var(--night);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
  .more{display:grid;place-items:center;min-height:216px;border:2px dashed rgba(240,201,106,.32);border-radius:8px;color:rgba(240,201,106,.66);
    font-size:20px;font-style:italic;text-align:center;padding:20px}
  footer{max-width:1180px;margin:0 auto;padding:6px 24px 50px;font-family:'Josefin Sans',sans-serif;font-size:14px;letter-spacing:.07em;color:#bdb199;text-align:center;line-height:1.9}
  footer b{color:#f0c96a;font-weight:normal;letter-spacing:2px}
  @media (max-width:540px){main{grid-template-columns:1fr}.in{grid-template-columns:104px 1fr}}
</style>
</head>
<body>
<a class="back" href="../index.html">&larr; Corridor</a>
<header>
  <h1>Adventure</h1>
  <div class="dep">Departures</div>
  <p>Pick a journey, mind the step, and read every sign.</p>

    <circle cx="986" cy="42" r="60" fill="url(#pMoon)"/><circle cx="986" cy="42" r="15" fill="#f3f0dc"/><circle cx="993" cy="37" r="13" fill="#0e1738"/>

<main id="trains"></main>
<footer><b>&#9733;</b> a short ride for a first try &nbsp;&middot;&nbsp; <b>&#9733;&#9733;&#9733;</b> a full journey &nbsp;&middot;&nbsp; <b>&#9733;&#9733;&#9733;&#9733;&#9733;</b> a long way, and nobody carries your bags</footer>

<script src="../assets/account.js"></script>
<script src="../assets/shelf.js"></script>
<script>
(function () {
  var STORIES = Shelf.visible([{"id":"orvo","title":"The Night Train to Orvo","stars":1,"minutes":"10-15","hold":false,"level":"A2","blurb":"A snowy station at midnight. A guard with a watch. A train that is never late. Tonight you are the assistant.","rooms":3,"first":"halm.html","firstId":"halm","last":"arrival"},{"id":"mail","title":"Seven Sacks for Tolver","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"Tolver gets its letters over the mountains by air: in an old brown mail ship that makes fifty kilometres an hour. This morning a new silver one that makes eighty is on the same field. Seven sacks each. The first ship there keeps the mail, and you are the Post Office's newest clerk.","rooms":5,"first":"shed.html","firstId":"shed","last":"tolver"},{"id":"bazaar","title":"The Third Arch After the Fountain","stars":3,"minutes":"35-45","hold":false,"level":"B1+–B2","blurb":"In Ombra the streets have no names. You find your way by what you pass: straight on until you can smell leather; the third arch after the fountain; if you reach the fish, you have gone too far. Somewhere in there is your caravan's compass, which left your arm at the Salt Gate this morning. The noon bell will not wait, and somebody quicker than you is already looking.","rooms":5,"first":"gate.html","firstId":"gate","last":"yard"}]), box = document.getElementById('trains');
  var STATE = { 'new': 'Now boarding', going: 'On the way', solved: 'Arrived' };
  Shelf.init();
  STORIES.forEach(function (s, i) {
    var st = Shelf.status('adventure', s), b = document.createElement('button');
    b.type = 'button'; b.className = 'tk ' + st.state; b.setAttribute('data-story', s.id);
    b.innerHTML = '<span class="in"><span class="stub"><b>ADMIT ONE</b><span class="stars"></span><span class="mins"></span><span class="rooms"></span><span class="lvl"></span></span>' +
      '<span class="body"><span class="no"></span><h2></h2><p></p><span class="state"></span></span></span>';
    b.querySelector('.stars').innerHTML = Shelf.stars(s.stars).replace(/☆+/, '<i>$&</i>');      /* the empty stars are dimmed */
    b.querySelector('.stars').title = s.stars + ' out of 5 for difficulty';
    b.querySelector('.mins').textContent = s.minutes + ' min';
    b.querySelector('.rooms').textContent = s.rooms + ' rooms';
    b.querySelector('.lvl').textContent = s.level ? 'level ' + s.level : '';
    b.querySelector('.no').textContent = 'Departure ' + (i + 1);
    b.querySelector('h2').textContent = s.title;
    b.querySelector('p').textContent = s.blurb;
    b.querySelector('.state').textContent = STATE[st.state] || '';
    b.addEventListener('click', function () { Shelf.open('adventure', s); });
    box.appendChild(b);
  });
  if (STORIES.length < 4) {
    var m = document.createElement('div'); m.className = 'more'; m.textContent = 'More journeys are on their way.';
    box.appendChild(m);
  }
})();
</script>
</body>
</html>
