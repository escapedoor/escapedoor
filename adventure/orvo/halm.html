  .tw:nth-child(12n){animation-delay:-1.7s}

  .car{transition:transform .22s ease-out}
  .car.on{transition:none}

  <rect x="806" y="700" width="100" height="42" rx="5" fill="#2f6b4f"/><path d="M806 716h100" stroke="#1c4a35" stroke-width="2"/>
  <rect x="846" y="691" width="22" height="10" rx="4" fill="none" stroke="#1c4a35" stroke-width="3.500"/>
  <ellipse cx="986" cy="822" rx="42" ry="7" fill="#5a1722"/><rect x="944" y="772" width="84" height="50" fill="#8a2a38"/><ellipse cx="986" cy="772" rx="42" ry="9" fill="#a03344"/>
  <path d="M944 792h84" stroke="#d9ae48" stroke-width="3"/>

</g>

<!-- the lantern, the guard, the lever -->
<g id="lantern" class="hot">
  <circle cx="352" cy="826" r="80" fill="url(#lampG)"/>
  <rect x="336" y="806" width="32" height="42" rx="4" fill="#ffe2a0"/>
  <path d="M344 806v42M360 806v42" stroke="#2a2d38" stroke-width="2.500"/><path d="M334 806h36M334 848h36" stroke="#2a2d38" stroke-width="6" stroke-linecap="round"/>
  <path d="M340 803q12-22 24 0" stroke="#2a2d38" stroke-width="3.500" fill="none"/>
</g>
<g id="vane" class="hot">
  <use href="#ch-vane" x="34" y="560" width="270" height="351"/>
  <g class="lid l4" fill="#e6c6aa"><ellipse cx="147.400" cy="720.650" rx="8.200" ry="5.600"/><ellipse cx="190.600" cy="720.650" rx="8.200" ry="5.600"/><path d="M139.500 721.500q8 3.400 16 0M182.700 721.500q8 3.400 16 0" stroke="#6b6e75" stroke-width="2.200" fill="none" stroke-linecap="round"/></g>
  <path d="M176 862q46 30 84-18" stroke="#d9ae48" stroke-width="2.500" fill="none"/>

  <path d="M266 816v-13M266 816l-9 6" stroke="#1b140f" stroke-width="2.500" stroke-linecap="round"/>
  <rect x="261" y="785" width="10" height="9" rx="3" fill="#c79b3b"/>
</g>
<g id="frame">
  <circle id="leverGlow" cx="1467" cy="690" r="150" fill="url(#greenG)" opacity="0" pointer-events="none"/>
  <path d="M1422 810q45-38 90 0z" fill="#2c3657" stroke="#39425c" stroke-width="2"/>

  <rect x="1396" y="822" width="142" height="50" rx="3" fill="#f3efe2"/>
  <circle cx="1404" cy="830" r="2.500" fill="#8a7a4a"/><circle cx="1530" cy="830" r="2.500" fill="#8a7a4a"/><circle cx="1404" cy="864" r="2.500" fill="#8a7a4a"/><circle cx="1530" cy="864" r="2.500" fill="#8a7a4a"/>
  <text x="1467" y="842" class="plateT">STARTING SIGNAL</text><text x="1477" y="863" class="plateT p2">PULL</text>
  <path d="M1426 858.500l13-7v14z" fill="#1f6b45"/><path d="M1439 858.500h8" stroke="#1f6b45" stroke-width="3"/>
</g>

  <rect x="1460" y="630" width="14" height="182" rx="6" fill="#2f9b63"/><rect x="1460" y="630" width="5" height="182" rx="2" fill="#5fd198" opacity=".6"/>
  <rect x="1455" y="600" width="24" height="50" rx="11" fill="url(#rl-brass)"/>

</g>

<rect x="-1000" y="-200" width="3600" height="1300" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>
<div class="snow"></div><div class="snow s2"></div>

<script src="words.js"></script>
<script src="cast.js"></script>
<script src="rail.js"></script>
<script src="../../assets/engine.js"></script>
<script>
(function () {
  var $ = ER.$, svg = $('#scene'), tr = $('#train'), lever = $('#lever'), Y0 = 330, PITCH = 222, X0 = 978;
  /* how the carriages stand when you arrive. Place 0 is the one next to the engine. */
  var ord = ['sleeping', 'guard', 'kitchen', 'mail', 'dining'];
  var cars = {}, busy = false, briefed = false, solved = false, ang = 14, hissT = 0, wind = null;

  function rnd(i) { var x = Math.sin(i * 127.1 + 3.7) * 43758.5453; return x - Math.floor(x); }
  function slotX(i) { return X0 - i * PITCH; }

  /* scenery that is easier to count than to draw */
  (function () {
    var s = '', i, x, h, a;
    $('#railDefs').innerHTML = RAIL.defs;
    for (i = 0; i < 80; i++) {
      s += '<circle' + (i % 5 === 0 ? ' class="tw"' : '') + ' cx="' + (-300 + rnd(i) * 2200).toFixed(0) + '" cy="' + (12 + rnd(i + 100) * 250).toFixed(0) +
        '" r="' + (0.7 + rnd(i + 200) * 1.4).toFixed(1) + '" opacity="' + (0.35 + rnd(i + 300) * 0.6).toFixed(2) + '"/>';
    }
    $('#stars').innerHTML = s; s = '';
    for (x = -1000; x < 2600; x += 22) { h = 28 + rnd(x + 7) * 40; s += '<path d="M' + x + ' 334l13-' + h.toFixed(0) + ' 13 ' + h.toFixed(0) + 'z"/>'; }
    $('#pines').innerHTML = s; s = '';
    for (x = 286; x < 1196; x += 9) { h = 5 + rnd(x) * 17; s += '<path d="M' + x + ' 222h6l-3 ' + h.toFixed(0) + 'z"/>'; }
    $('#icicles').innerHTML = s; s = '';
    [[340, 1], [430, 0], [560, 2], [630, 1], [806, 0], [884, 1]].forEach(function (w) {
      var wx = w[0];
      s += '<rect x="' + (wx - 16) + '" y="232" width="13" height="64" fill="#24503f"/><rect x="' + (wx + 55) + '" y="232" width="13" height="64" fill="#24503f"/>' +
        '<rect x="' + (wx - 3) + '" y="231" width="58" height="66" fill="#cfc9bb"/>' +
        '<rect x="' + wx + '" y="234" width="52" height="60" fill="' + (w[1] ? 'url(#winLit)' : '#131a31') + '"/>' +
        (w[1] === 2 ? '<path d="M' + (wx + 13) + ' 294v-20q0-10 9-12-4-4-4-9 0-10 9-10t9 10q0 5-4 9 9 2 9 12v20z" fill="#8a5420" opacity=".55"/>' : '') +
        '<path d="M' + wx + ' 264h52M' + (wx + 26) + ' 234v60" stroke="#cfc9bb" stroke-width="3"/>' +
        (w[1] ? '<ellipse cx="' + (wx + 26) + '" cy="264" rx="60" ry="56" fill="url(#lampG)" opacity=".34"/>' : '');
    });
    $('#wins').innerHTML = s; s = '';
    for (i = 0; i < 12; i++) {
      a = i * Math.PI / 6;
      s += '<path d="M' + (740 + Math.sin(a) * 21).toFixed(1) + ' ' + (150 - Math.cos(a) * 21).toFixed(1) + 'L' + (740 + Math.sin(a) * 25).toFixed(1) + ' ' + (150 - Math.cos(a) * 25).toFixed(1) + '"/>';
    }
    $('#cticks').innerHTML = s;
    $('#engine').innerHTML = RAIL.engine() + RAIL.steam(265, 4) + '<rect x="0" y="20" width="300" height="210" fill="transparent"/>';
    s = '';
    ord.forEach(function (id) { s += '<g class="car drag" data-id="' + id + '">' + RAIL.car(id) + '<rect x="0" y="0" width="212" height="230" fill="transparent"/></g>'; });
    tr.innerHTML = s;
    ER.$$('.car', tr).forEach(function (g) { cars[g.getAttribute('data-id')] = g; });
  })();

  function layout(skip) {
    ord.forEach(function (id, i) { if (id !== skip) cars[id].style.transform = 'translate(' + slotX(i) + 'px,' + Y0 + 'px)'; });
    tr.setAttribute('data-order', ord.join('>'));
  }
  function setClock(h, m) {
    $('#hh').setAttribute('transform', 'rotate(' + ((h % 12) * 30 + m / 2) + ' 740 150)');
    $('#mh').setAttribute('transform', 'rotate(' + (m * 6) + ' 740 150)');
  }
  function setLever(a, spring) {
    ang = a;
    lever.style.transition = spring ? 'transform .3s cubic-bezier(.3,1.6,.5,1)' : 'none';
    lever.style.transform = 'rotate(' + a + 'deg)';
  }
  layout(); setClock(11, 40); setLever(14);

  ER.init({
    theme: 'adventure', story: 'orvo', storyTitle: 'The Night Train to Orvo', id: 'halm', no: 'I', title: 'Halm Junction',
    go: 'Walk down the platform',
    intro: [
      'Halm Junction, twenty to midnight. It is snowing. You have a ticket for the night train to Orvo, and nothing to do until morning.',
      'The guard of the night train is Mr Vane. He started forty-one years ago. The train left on time that night, and every night after it.',
      'Tonight his assistant ate the fish at the station buffet. Mr Vane looks at you for a long time. &ldquo;You have two hands,&rdquo; he says. &ldquo;Come with me.&rdquo;'
    ],
    exit: {"next":"dining","w":{"6d9c105d":"30684d5e"}}, tags: {"dining":["69002647"],"guard":["840a2f86"],"kitchen":["4ad032d3"],"mail":["a9126b8c"],"sleeping":["42056ce1"]},
    hints: hints,
    onBegin: begin
  });

  var CARD = '<h4>Orvo Line &middot; Train card</h4>' +
    '<p class="sub">Night train &middot; Halm Junction to Orvo &middot; leaves 23.50</p>' +
    '<p>Count from the engine. The first carriage is the one behind the engine.</p>' +
    '<ol><li>The mail van is first.</li>' +
    '<li>The guard&rsquo;s van is last.</li>' +
    '<li>The dining car is third.</li>' +
    '<li>The sleeping car is behind the dining car.</li>' +
    '<li>One carriage is left. One place is left.</li></ol>' +
    '<p>When the train is right, pull the green lever.</p>' +
    '<p class="sign">L. Vane, guard</p>';

  /* one line of the card for each carriage it names, in the order the card gives them */
  var LINES = [
    ['mail', 'Mr Vane does not look up from his watch. &ldquo;Line one,&rdquo; he says. &ldquo;Read it again.&rdquo;'],
    ['guard', '&ldquo;Line two,&rdquo; says Mr Vane. &ldquo;I ride in the guard&rsquo;s van. I like to know where it is.&rdquo;'],
    ['dining', '&ldquo;Line three,&rdquo; says Mr Vane. &ldquo;Count again. Start at the engine.&rdquo;'],
    ['sleeping', '&ldquo;Line four,&rdquo; says Mr Vane. &ldquo;Find the dining car first. Then read the line again.&rdquo;']
  ];
  var ABOUT = {
    dining: 'White tablecloths and little red lamps. Supper is at midnight.',
    guard: 'Mr Vane rides in here, at the very back of the train, with the red lamp.',
    kitchen: 'The cook is making soup in here. Move this one slowly.',
    mail: 'Letters and parcels for the mountains. The mail van has one small window, with bars. The letters cannot get out.',
    sleeping: 'The blinds are down. Somebody inside is snoring already.'
  };

  function hints() {
    if (solved) return null;
    if (!briefed) return ['vane', [
      'Mr Vane is standing at the bottom left, with his watch. Click on him and listen to the end.',
      'Keep clicking Next until he gives you the train card. Then read the card. It tells you where every carriage goes.'
    ]];
    return ['order', [
      'Read the train card again. It is in your Notebook. Every line tells you where one carriage goes.',
      'Count from the engine. The first carriage is the one right behind the engine. &ldquo;Last&rdquo; means the one at the other end, far away from the engine.',
      'Start with the three lines that say first, third and last, and drag those carriages to their places. &ldquo;Behind&rdquo; means one place further away from the engine. After that, only one carriage and one place are left. Then drag the green lever to the left.'
    ]];
  }
  function begin() {
    wind = RAIL.snd.loop({ type: 'bandpass', f: 380, q: 0.5, vol: 0.05 });
    hissT = setInterval(function () { if (!solved) RAIL.snd.hiss(); }, 8200);
    ER.narrate([
      'You are standing on platform 2. Across the track is the night train to Orvo. It has five carriages, and they are all in the wrong place.',
      'Mr Vane stands beside you with his watch in his hand. Ask him what to do.'
    ]);
  }

  /* looking at things */
  function thing(sel, word, line) {
    $(sel).addEventListener('click', function (e) {
      if (busy) return;
      if (word) ER.wordAt(e.clientX, e.clientY, word);
      if (line) ER.say(line);
    });
  }
  thing('#engine', 'engine', 'The engine is ready. It was ready an hour ago, and it wants everybody to know.');
  thing('#signal', 'signal', 'The starting signal. It is red. No train can pass a red signal. Not even this one.');
  thing('#clock', null, 'The station clock. Mr Vane does not look at it. He has his own watch, and his watch is right.');
  thing('#depb', null, 'Night train to Orvo, 23.50. That is ten to twelve.');
  thing('#buffet', 'buffet', 'The station buffet. TODAY: FISH. Mr Vane&rsquo;s assistant is lying down in the waiting room.');
  thing('#tower', 'water tower', null);
  thing('#sbox', 'signal box', null);
  thing('#bags', 'mail bag', 'Mail bags for Orvo. They go in the mail van, at the front of the train.');
  thing('#cat', null, 'The station cat. It is sitting on the mail for Orvo. Nobody asked it to.');
  thing('#trolley', 'trolley', 'Luggage for the morning train. It can wait. The night train cannot.');
  thing('#lantern', 'lantern', null);

  $('#vane').addEventListener('click', function () {
    if (busy) return;
    var c = CAST.vane;
    ER.talk({
      who: c.who, role: c.role, face: FACE('vane'), last: briefed ? 'Close' : 'Take the card',
      lines: [
        'I am the guard. On the Orvo Line the guard looks at his watch. The assistant does everything else. That is rule one.',
        'Tonight you are the assistant. The train leaves at ten to twelve. Look at it! The carriages are in the wrong order.',
        'The right order is on this card. Read every line. Then move each carriage to its place.',
        'When the train is right, pull the green lever. Then the signal turns green and we go. Not before.'
      ],
      clue: { id: 'vane1', title: 'Mr Vane: the job', kind: 'Orders' },
      done: function (seen) {
        if (!seen || briefed) return;
        briefed = true; $('#vane').classList.add('done');
        ER.read({ html: CARD, cls: 'traincard', clue: { id: 'traincard', title: 'Train card', kind: 'Railway paper' },
          done: function () { ER.say('Five carriages. You can drag each one along the track to a new place.', 5200); } });
      }
    });
  });

  /* moving the carriages: pick one up, and the others make room */
  ER.$$('.car', tr).forEach(function (g) {
    var id = g.getAttribute('data-id'), off = 0, x = 0;
    ER.drag(g, {
      start: function (e) {
        if (busy || solved) return false;
        x = slotX(ord.indexOf(id)); off = ER.pt(svg, e).x - x; tr.appendChild(g);
      },
      move: function (e, moved) {
        if (!moved) return;
        x = Math.max(slotX(4) - 50, Math.min(slotX(0) + 50, ER.pt(svg, e).x - off));
        g.style.transform = 'translate(' + x + 'px,' + (Y0 - 13) + 'px)';
        var to = Math.max(0, Math.min(4, Math.round((X0 - x) / PITCH))), from = ord.indexOf(id);
        if (to !== from) { ord.splice(from, 1); ord.splice(to, 0, id); layout(id); ER.sfx.tick(0.8); }
      },
      end: function (e, moved) {
        layout();
        if (!moved) { ER.wordAt(e.clientX, e.clientY, RAIL.word[id]); ER.say(ABOUT[id]); return; }
        RAIL.snd.couple();
      }
    });
  });

  /* the lever */
  ER.drag(lever, {
    start: function () { if (busy || solved) return false; },
    move: function (e, moved) {
      if (!moved) return;
      var p = ER.pt(svg, e);
      setLever(Math.max(-24, Math.min(14, Math.atan2(p.x - 1467, 808 - p.y) * 180 / Math.PI)));
    },
    end: function (e, moved) {
      if (!moved) {
        setLever(14, true); ER.wordAt(e.clientX, e.clientY, 'lever');
        ER.say('A green lever with a brass handle. Take hold of it and pull it over to the left.');
        return;
      }
      if (ang < -8) pull(); else setLever(14, true);
    }
  });
  function back() { setTimeout(function () { setLever(14, true); ER.sfx.no(); }, 380); }
  function pull() {
    var i;
    setLever(-24); ER.sfx.clunk();
    if (!briefed) { back(); ER.say('Mr Vane puts one hand on the lever. &ldquo;Not yet,&rdquo; he says. &ldquo;First you listen. Then you read. Then you pull.&rdquo;'); return; }
    if (ER.exit([ord.join('>')], { quiet: true, delay: 9600 })) { depart(); return; }
    back();
    for (i = 0; i < LINES.length; i++) {
      if (!ER.check(LINES[i][0], String(ord.indexOf(LINES[i][0])))) { ER.say('The lever jumps back. ' + LINES[i][1], 6200); return; }
    }
    ER.say('The lever jumps back. &ldquo;Read the card again,&rdquo; says Mr Vane.');
  }
  function depart() {
    solved = busy = true; clearInterval(hissT);
    document.body.classList.add('go');
    $('#sigLamp').setAttribute('fill', '#5dffa0'); $('#sigGlow').setAttribute('fill', 'url(#greenG)');
    $('#leverGlow').setAttribute('opacity', 0.5);
    setClock(11, 50);
    ER.say('The signal arm drops. Green.', 2800);
    setTimeout(function () { RAIL.snd.whistle(); RAIL.snd.chuff(1.2); }, 1300);
    setTimeout(function () { ER.say('The engine whistles. In the sleeping car, somebody stops snoring.', 3300); RAIL.snd.chuff(1); }, 3000);
    setTimeout(function () { ER.sfx.click(); ER.say('&ldquo;Ten to twelve,&rdquo; says Mr Vane. He shuts his watch with a click. &ldquo;Get in.&rdquo;', 4200); }, 6500);
    setTimeout(function () { if (wind) wind.stop(); }, 9400);
  }
})();
</script>
