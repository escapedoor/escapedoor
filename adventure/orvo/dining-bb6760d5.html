<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Dining Car · The Night Train to Orvo</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-adventure.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="story.css">
<style>
  body{--bg:#1a0b0d;--accent:#f0c96a;--font-display:'Limelight',serif;--font-ui:'Josefin Sans',sans-serif;
    --tc-bg:rgba(28,9,13,.9);--cap-bg:rgba(34,11,15,.94);--panel:#2a1216;--face-bg:#3a2a30;--q-ink:#e6b98a;--fade:#0d0405;
    --hud-bg:rgba(34,11,15,.74)}
  .tc-room{letter-spacing:.03em;font-size:clamp(38px,5.6vw,76px)}
  .tk-name{font-size:28px;letter-spacing:.03em}
  #wfar{animation:scrA 90s linear infinite}
  #wmid{animation:scrB 36s linear infinite}
  #wnear{animation:scrC 7.5s linear infinite}
  #wlite{animation:scrD 17s linear infinite}
  #wflk{animation:scrE 1.25s linear infinite}
  @keyframes scrA{to{transform:translateX(-800px)}}
  @keyframes scrB{to{transform:translateX(-700px)}}
  @keyframes scrC{to{transform:translateX(-600px)}}
  @keyframes scrD{to{transform:translateX(-1300px)}}
  @keyframes scrE{to{transform:translate(-320px,100px)}}
  .tlamp{animation:sway 2.3s ease-in-out infinite alternate}
  .tlamp.l2{animation-delay:-.8s}.tlamp.l3{animation-delay:-1.5s}
  @keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
  .steam{animation:steam 3.2s ease-in-out infinite}
  .steam.s2{animation-delay:-1.6s}
  @keyframes steam{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.5;transform:translateY(-8px)}}
  #catB{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite alternate}
  @keyframes breathe{from{transform:scaleY(1)}to{transform:scaleY(1.09)}}
  #desk.ready{animation:dg 2.8s steps(3) infinite}
  @keyframes dg{50%{filter:brightness(1.3)}}
  #dim{transition:opacity 2.4s}
  .dtk{display:none}.dtk.on{display:inline}
  .postT{font-family:'Limelight',serif;font-size:31px;letter-spacing:5px;fill:#5a1722;text-anchor:middle}
  .postS{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:8.5px;letter-spacing:2.2px;fill:#5a1722;text-anchor:middle}
  .boxT{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:9px;letter-spacing:1.5px;fill:#a04a44;text-anchor:middle}
  .ttT{font-family:'Limelight',serif;font-size:15px;letter-spacing:1px;fill:#5a1722;text-anchor:middle}
  .ttS{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:7px;letter-spacing:2px;fill:#7c2532;text-anchor:middle}
  .ttP{font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:9px;letter-spacing:2.5px;fill:#3a2a08;text-anchor:middle}
  .numT{font-family:'Limelight',serif;font-size:15px;fill:#3a2a08;text-anchor:middle}

  /* Mr Vane's desk: three tickets and a punch */
  .dk{position:relative;width:min(1060px,96vw);padding:18px 26px 16px;border:3px solid #24130a;border-radius:6px;color:#f3e6c8;
    background:#5a371f linear-gradient(176deg,#6f4628,#40250f);box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 2px #8a5a34}
  .dk h5{margin:0 0 2px;font-family:'Limelight',serif;font-weight:normal;font-size:27px;letter-spacing:.05em;color:#f0c96a}
  .dk .say{margin:0 0 14px;font-family:'EB Garamond',Georgia,serif;font-size:19.5px;line-height:1.35;color:#f1e3c2}
  .tks{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .tkt{position:relative;min-height:286px;padding:13px 18px 10px;color:#2a1a1e;border-radius:4px;background:#efd9a7;box-shadow:0 7px 16px rgba(0,0,0,.55)}
  .tkt.t2{background:#ecbfae}.tkt.t3{background:#c2d8b6}
  .tkt:before,.tkt:after{content:'';position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#553218}
  .tkt:before{left:-9px}.tkt:after{right:-9px}
  .tkt.none{display:grid;place-items:center;background:transparent;border:2px dashed rgba(243,230,200,.4);box-shadow:none;color:rgba(243,230,200,.7);
    font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;text-align:center}
  .tkt.none:before,.tkt.none:after{display:none}
  .tkt .line{display:flex;justify-content:space-between;align-items:baseline;font-family:'Limelight',serif;font-size:21px;letter-spacing:.05em;color:#5a1722}
  .tkt .line small{font-family:'Special Elite',monospace;font-size:13px;letter-spacing:0;color:#2a1a1e}
  .tkt .route{margin:5px 0 3px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:12.5px;line-height:1.45;letter-spacing:.12em;text-transform:uppercase}
  .tkt .route .w{border-bottom-width:1px}
  .tkt .who{font-family:'Caveat',cursive;font-weight:700;font-size:28px;line-height:1.05;color:#1d2a4a;border-bottom:1px dashed rgba(42,26,30,.5);padding-bottom:5px}
  .tkt h6{margin:9px 0 5px;font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#5a1722}
  .row{display:flex;gap:5px}
  .row.m{width:66%}
  .bx{position:relative;flex:1;height:38px;display:grid;place-items:center;border:1.5px solid #5a1722;border-radius:3px;cursor:pointer;
    font-family:'Special Elite',monospace;font-size:19px;line-height:1;padding-top:3px;background:rgba(255,255,255,.3)}
  .bx:hover{background:rgba(255,255,255,.62)}
  .bx.hole{color:transparent;cursor:default}
  .bx.hole:after{content:'';position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#2a170c;
    box-shadow:inset 0 3px 5px rgba(0,0,0,.75)}
  .chad{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#f6ead0;pointer-events:none;z-index:2;
    animation:chad .55s ease-in forwards}
  @keyframes chad{to{transform:translate(14px,70px) rotate(200deg);opacity:0}}
  .clean{display:block;margin:9px 0 0 auto;padding:3px 0 0;font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#5a1722;border-bottom:1px solid #5a1722;opacity:.75}
  .clean:hover{opacity:1}
  .tkt.fresh{animation:fresh .5s}
  @keyframes fresh{0%{transform:translateY(-16px) rotate(-2deg);opacity:.2}100%{transform:none;opacity:1}}
  .dk-foot{display:flex;align-items:center;gap:18px;margin-top:14px}
  .dk-msg{flex:1;min-height:54px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19.5px;line-height:1.32;color:#f8e7b8}
  .bell{display:flex;align-items:center;gap:12px;padding:6px 20px 6px 10px;border:1px solid #f0c96a;border-radius:4px;color:#ffe6a0;
    font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;background:rgba(0,0,0,.3)}
  .bell svg{width:66px;height:52px;display:block}
  .bell span{padding-top:3px}
  .bell:hover{background:#f0c96a;color:#2a170c}
  .bell:active svg{transform:translateY(2px)}
  .punch{position:fixed;z-index:57;width:130px;height:90px;margin:-51px 0 0 -20px;pointer-events:none;display:none}
  .punch.on{display:block}
  .punch svg{width:100%;height:100%;display:block;overflow:visible}
  .punch .h1,.punch .h2{transform-origin:48px 51px;transition:transform .07s}
  .punch.bite .h1{transform:rotate(7deg)}.punch.bite .h2{transform:rotate(-7deg)}
  .dk.tool .tkt:not(.none){cursor:none}.dk.tool .bx{cursor:none}
  @media (max-width:900px){.tks{grid-template-columns:1fr}}
</style>
</head>

  /* ---------- the desk: punch the tickets, ring the bell ---------- */
  var PUNCH = '<svg viewBox="0 0 130 90"><path class="h1" d="M44 40L110 9q16-3 14 13L58 58z" fill="#8a2a38" stroke="#4f1420" stroke-width="2"/>' +
    '<path class="h2" d="M44 60L108 84q16 3 14-13L58 44z" fill="#6a1c28" stroke="#4f1420" stroke-width="2"/>' +
    '<path fill-rule="evenodd" d="M-2 36q0-12 13-12h38q11 0 11 11v32q0 11-11 11H11Q-2 78-2 66zM20 37a14 14 0 1 0 .01 0z" fill="#c9cfdb" stroke="#4a5163" stroke-width="2.5"/>' +
    '<path d="M8 30h36" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>' +
    '<circle cx="20" cy="51" r="14" fill="none" stroke="#2a2f3d" stroke-width="3"/>' +
    '<circle cx="48" cy="51" r="6.5" fill="#4a5163"/><circle cx="48" cy="51" r="2.5" fill="#c9cfdb"/></svg>';
  var BELL = '<svg viewBox="0 0 90 70"><defs><linearGradient id="bellG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5df98"/><stop offset=".5" stop-color="#c79b3b"/><stop offset="1" stop-color="#7d5f1d"/></linearGradient></defs>' +
    '<rect x="41" y="6" width="8" height="14" fill="#c79b3b"/><circle cx="45" cy="7" r="6" fill="#e6c268"/><path d="M12 58q0-42 33-42t33 42z" fill="url(#bellG)"/>' +
    '<path d="M24 50q0-24 16-28" stroke="#fff6cf" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/><rect x="5" y="55" width="80" height="9" rx="4" fill="#7d5f1d"/></svg>';

  function cell(v) { return '<span class="bx" data-v="' + v + '">' + v + '</span>'; }
  function ticket(t) {
    return '<div class="line"><b>Orvo Line</b><small>No. ' + t.no + '</small></div>' +
      '<div class="route">Night train &middot; berth ' + t.berth + '<br>Halm Junction to ' + t.to + '</div><div class="who">' + t.who + '</div>' +
      '<h6>Night call &middot; hour</h6><div class="row h" data-r="h">' + HOURS.map(cell).join('') + '</div>' +
      '<h6>Minutes</h6><div class="row m" data-r="m">' + MINS.map(cell).join('') + '</div>' +
      '<button type="button" class="clean">take a clean ticket</button>';
  }
  function openDesk() {
    var box = ER.el('div', 'dk'), tool = ER.el('div', 'punch', PUNCH), s, msg;
    s = '<h5>Mr Vane&rsquo;s desk</h5><p class="say">Make two holes in each ticket: one for the hour and one for the minutes. Then ring the bell.</p><div class="tks">';
    TK.forEach(function (t) {
      s += heard[t.id] ? '<div class="tkt ' + t.cls + '" data-id="' + t.id + '">' + ticket(t) + '</div>'
                       : '<div class="tkt none"><span>' + t.who + ' still has this ticket.</span></div>';
    });
    s += '</div><div class="dk-foot"><div class="dk-msg"></div><button type="button" class="bell">' + BELL + '<span>Ring the bell</span></button></div>';
    box.innerHTML = s; msg = box.querySelector('.dk-msg');
    ER.glossIn(box, '.say, .route');
    function say(t) { msg.innerHTML = ER.gloss(t); }
    function paint(card) {
      var id = card.getAttribute('data-id');
      ER.$$('.bx', card).forEach(function (b) {
        b.classList.toggle('hole', holes[id][b.parentNode.getAttribute('data-r')].indexOf(b.getAttribute('data-v')) >= 0);
      });
    }
    function clean(id) {
      var card = box.querySelector('.tkt[data-id=' + id + ']');
      holes[id] = { h: [], m: [] }; paint(card);
      card.classList.remove('fresh'); void card.offsetWidth; card.classList.add('fresh'); ER.sfx.paper();
    }
    ER.$$('.tkt[data-id]', box).forEach(paint);

    function follow(e) {
      var over = !done && e.target.closest && e.target.closest('.tkt[data-id]') && !e.target.closest('.clean');
      tool.style.left = e.clientX + 'px'; tool.style.top = e.clientY + 'px';
      tool.classList.toggle('on', !!over); box.classList.toggle('tool', !!over);
    }
    box.addEventListener('pointermove', follow);
    box.addEventListener('pointerdown', follow);
    box.addEventListener('pointerleave', function () { tool.classList.remove('on'); box.classList.remove('tool'); });
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.bx') : null, c = e.target.closest ? e.target.closest('.clean') : null, id, ch;
      if (done) return;
      if (c) { clean(c.parentNode.getAttribute('data-id')); say(''); return; }
      if (!b || b.classList.contains('hole')) return;
      id = b.parentNode.parentNode.getAttribute('data-id');
      holes[id][b.parentNode.getAttribute('data-r')].push(b.getAttribute('data-v'));
      b.classList.add('hole'); RAIL.snd.punch(); say('');
      ch = ER.el('i', 'chad'); b.appendChild(ch);
      setTimeout(function () { if (ch.parentNode) ch.parentNode.removeChild(ch); }, 600);
      tool.classList.add('bite'); setTimeout(function () { tool.classList.remove('bite'); }, 150);
    });
    box.querySelector('.bell').addEventListener('click', function () {
      var bad, cand;
      RAIL.snd.ding();
      if (done) return;
      if (left().length) { say('&ldquo;I count three passengers,&rdquo; says Mr Vane. &ldquo;I do not count three tickets.&rdquo;'); return; }
      bad = TK.filter(function (t) { return !holes[t.id].h.length || !holes[t.id].m.length; });
      if (bad.length) { ER.shake(box.querySelector('.tks')); say('&ldquo;Two holes in every ticket,&rdquo; says Mr Vane. &ldquo;One for the hour. One for the minutes.&rdquo;'); return; }
      bad = TK.filter(function (t) { return holes[t.id].h.length > 1 || holes[t.id].m.length > 1; });
      if (bad.length) { say('&ldquo;Too many holes,&rdquo; says Mr Vane. &ldquo;' + bad[0].who + ' cannot wake up twice. Take a clean ticket.&rdquo;'); return; }
      cand = TK.map(function (t) { return holes[t.id].h[0] + '.' + holes[t.id].m[0]; });
      if (ER.exit([cand.join('|')], { quiet: true, delay: 9000 })) {
        done = busy = true; pips(); tool.classList.remove('on'); box.classList.remove('tool'); $('#desk').classList.remove('ready');
        setTimeout(ER.sfx.ok, 500);
        say('Mr Vane holds each ticket up to the lamp. Three tickets, six holes. He puts them in his pocket and says nothing.');
        setTimeout(function () { ER.closeAll(); night(); }, 3400);
        return;
      }
      bad = TK.filter(function (t, i) { return !ER.check(t.id, cand[i]); });
      ER.sfx.no();
      say('Mr Vane holds each ticket up to the lamp. He tears up ' + (bad.length === 3 ? 'all three' : list(bad.map(function (t) { return t.who + '&rsquo;s'; }))) +
        ' and gives you ' + (bad.length > 1 ? 'clean ones' : 'a clean one') + '. &ldquo;That is not the right time. Ask again, and listen to every word.&rdquo;');
      bad.forEach(function (t) { clean(t.id); });
    });
    document.body.appendChild(tool);
    ER.open('ov-lock', box, function () { if (tool.parentNode) tool.parentNode.removeChild(tool); });
  }
  function night() {
    $('#dim').setAttribute('opacity', 0.6);
    ER.say('The lamps go down. The train climbs on through the snow. You have three doors to knock on before morning.', 5200);
    setTimeout(function () { clearInterval(clackT); if (rumble) rumble.stop(); }, 4600);
  }
})();
</script>
</body>
</html>
