  var LUMP = [{ on: true, ox: 6, oy: 3, x: 0, y: 0 }, { on: true, ox: 21, oy: -6, x: 0, y: 0 }];

  /* floorboards, and a great many chalk marks */
  (function () {
    var s = '', x, d = '', r, c, i, bx, by, n = 0;
    for (x = -1400; x <= 3000; x += 150) s += '<path d="M' + (800 + (x - 800) * 0.5).toFixed(0) + ' 652L' + x + ' 1100"/>';
    s += '<path d="M-1000 700H2600M-1000 770H2600M-1000 860H2600" opacity=".6"/>';
    $('#boards').innerHTML = s;
    function block(x0, y0, cols, rows) {
      for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
        n++; bx = x0 + c * 23 + (r % 2) * 3; by = y0 + r * 20 + ((c * 7 + r * 3) % 4);
        for (i = 0; i < 4; i++) d += 'M' + (bx + i * 3.6).toFixed(1) + ' ' + by + 'v' + (11 + (n + i) % 3);
        d += 'M' + (bx - 2.5) + ' ' + (by + 10) + 'l17-7';

    }
    block(578, 122, 9, 15); block(1010, 130, 7, 12);

  })();
  drawTray();

  ER.init({
    theme: 'ghost', story: 'room13', storyTitle: 'Room 13 Is Not on the Plan', id: 'thirteen', no: 'III', title: 'Room 13',
    go: 'Go in',
    intro: [
      'The coldest place in the hotel was the wall at the end of the corridor. Under the wallpaper there was a door, with a brass 1 and a crooked brass 3.',
      'You knocked. The handle turned by itself, slowly, like the hand of somebody who has not opened a door for a very long time.',
      'Inside it is dark, and so cold that the cocoa has stopped steaming.'
    ],
    exit: {"next":"morning","w":{"85071b4b":"986c5e0e"}}, tags: {"place":["af296d8e"],"sugar":["1948d7f2"]},
    hints: hints,
    onBegin: begin
  });

  function hints() {
    if (phase >= 4) return null;
    if (phase === 0) return ['sheet', [
      'Everything in this room is under a dust sheet. Something very tall is standing on the left.',
      'Take hold of the sheet on the left and drag it down to the floor.'
    ]];
    if (phase < 2) return ['wipe', [
      'It is a mirror, and the glass is white with cold. What do you do to a mirror when you cannot see into it?',

    ]];

      'Somebody has written on the mirror. Click on the glass, and read everything she writes: keep clicking Next.'
    ]];

      'Miss Moss told you three things with &ldquo;used to&rdquo;. &ldquo;I used to take sugar&rdquo; means: I took it before, but I do not take it now.',
      'She used to take two sugars. Does she take them now? She used to drink it in bed. Where does she sit now? You may have to pull a dust sheet off first.',

  }
  function pips() { ER.pips((phase >= 1.5 ? 1 : 0) + (phase >= 3 ? 1 : 0) + (phase >= 4 ? 1 : 0), 3); }
  function begin() {
    R13.wind(0.03); pips(); drawTray();

      'Room 13. Dust sheets, a bare floor, and two windows with the moon in one of them.',

  /* ---------- things in the room ---------- */
  function thing(sel, word, line) {

  }
  thing('#pull', 'bell-pull', 'The bell-pull. It is swinging a little, as if somebody has only just let go of it.');
  thing('#bedmark', null, 'A clean square on the wallpaper, and four marks in the carpet. A bed used to stand here.');
  thing('#pic', null, 'A pale square on the wall. A picture used to hang here.');
  thing('#tally', 'tally marks', 'Chalk marks, in fives, all over the wallpaper. Somebody has been counting something for a very long time.');
  thing('#fire', 'mantelpiece', 'A cold fireplace. On the mantelpiece there is a box of chalk. It is nearly empty.');
  thing('#win1', null, 'Two windows, just as the old guide said.');
  thing('#win2', null, 'The moon is in this window. It is the only light in the room.');
  thing('#chair', 'armchair', 'An armchair by the window. Nobody is sitting in it. But the cushion is not quite flat.');
  thing('#table', null, 'A small round table beside the armchair. There is a ring on it, the size of a saucer.');
  thing('#wardrobe', 'wardrobe', 'A wardrobe. It is locked, and you are not going to look for the key.');
  thing('#books', 'exercise books', 'A pile of exercise books, tied up with string. Every sum in them has been marked.');

  /* ---------- dust sheets: drag one down and it falls off ---------- */
  function sheet(sel, line, off) {
    var n = $(sel), y0 = 0, dy = 0, gone = false;
    function drop() {
      if (gone) return;

    }
    ER.drag(n, {
      start: function (e) { if (busy || gone) return false; y0 = ER.pt(svg, e).y; dy = 0; },
      move: function (e) { if (gone) return; dy = Math.max(0, ER.pt(svg, e).y - y0); n.style.transform = 'translateY(' + dy.toFixed(0) + 'px)'; if (dy > 180) drop(); },
      end: function (e, moved) {
        if (gone) return;
        if (dy > 100) { drop(); return; }
        n.style.transform = '';
        if (!moved) ER.say(line);
      }
    });
  }
  sheet('#sheetM', 'A dust sheet, over something very tall and very flat. Drag it down to pull it off.', function () {
    phase = 1;
    ER.say('A tall mirror. The glass is white with cold, and you cannot see into it at all.', 5500);
  });
  sheet('#sheetC', 'A dust sheet. There are two things under it: one tall, and one small and round. Drag it down to pull it off.', function () {
    chairOff = true;
    ER.say('An old armchair, and a small round table beside it. They are standing by the window.', 5000);
  });

  /* ---------- the mirror: rub the cold off the glass ---------- */
  var wd = '', cells = {}, total = 0, clear = 0, lastSq = 0, CELL = 34;
  function inGlass(x, y) {
    if (x < 170 || x > 510 || y < 150 || y > 700) return false;
    if (y >= 240) return true;
    var a = (x - 340) / 170, b = (y - 240) / 90;
    return a * a + b * b <= 1;
  }
  (function () { var x, y; for (x = 170 + CELL / 2; x < 510; x += CELL) for (y = 150 + CELL / 2; y < 700; y += CELL) if (inGlass(x, y)) total++; })();
  function wipe(x, y, first) {
    var gx, gy, k, now = Date.now();
    wd += (first ? ' M' : ' L') + x.toFixed(0) + ' ' + y.toFixed(0) + (first ? 'l.2 0' : '');
    $('#wipeA').setAttribute('d', wd); $('#wipeB').setAttribute('d', wd);
    for (gx = x - CELL; gx <= x + CELL; gx += CELL) for (gy = y - CELL; gy <= y + CELL; gy += CELL) {
      k = Math.floor((gx - 170) / CELL) + ',' + Math.floor((gy - 150) / CELL);
      if (!cells[k] && inGlass(170 + (Math.floor((gx - 170) / CELL) + 0.5) * CELL, 150 + (Math.floor((gy - 150) / CELL) + 0.5) * CELL) && Math.abs(gx - x) + Math.abs(gy - y) <= CELL) { cells[k] = 1; clear++; }
    }
    if (now - lastSq > 85) { lastSq = now; R13.squeak(); }
    if (clear / total > 0.52) seeHer();
  }
  ER.drag($('#glassHit'), {
    start: function (e) { if (busy || phase !== 1) return false; var p = ER.pt(svg, e); wipe(p.x, p.y, true); },
    move: function (e) { if (busy || phase !== 1) return; var p = ER.pt(svg, e); wipe(p.x, p.y, false); },
    end: function (e, moved) { if (!moved && phase === 1 && !busy) ER.say('The glass is white with cold. Rub it: hold the mouse button down and move across the mirror.'); }
  });
  $('#glassHit').addEventListener('click', function () { if (!busy && (phase === 2 || phase === 3)) openTalk(); });

  /* writing appears in the mist, a letter at a time */
  function write(lines, size, done) {
    clearInterval(writeT);
    var t1 = $('#mT1'), t2 = $('#mT2'), all = lines.join('\n'), i = 0;
    t1.textContent = ''; t2.textContent = '';
    t1.setAttribute('font-size', size); t2.setAttribute('font-size', size);
    t1.setAttribute('y', lines.length > 1 ? 258 : 284); t2.setAttribute('y', 258 + size * 1.45);
    writeT = setInterval(function () {
      i++;
      var s = all.slice(0, i).split('\n');
      t1.textContent = s[0]; t2.textContent = s[1] || '';
      if (/[A-Z]/.test(all.charAt(i - 1))) R13.squeak();
      if (i >= all.length) { clearInterval(writeT); if (done) done(); }
    }, 90);
  }
  function seeHer() {
    busy = true; phase = 1.5; pips();
    $('#fog').style.opacity = 0.06; ER.sfx.glass();
    setTimeout(function () {
      ER.narrate([
        'In the mirror there is an armchair by the window. In the armchair there is an old lady in a grey cardigan. She is looking straight at you.',
        'You turn round. The room is empty.',
        'You look back at the mirror. She is still there. And the glass is going white again, because somebody is writing on it with one finger.'
      ], function () {
        wd = ''; $('#wipeA').setAttribute('d', ''); $('#wipeB').setAttribute('d', '');

          write(['YOU ARE LATE.'], 27, function () {

          });
        }, 1300);
      });
    }, 1700);
  }
  function openTalk() {
    var c = CAST.moss;
    ER.talk({
      who: c.who, role: c.role, face: FACE('moss'),
      lines: [
        { note: 'Miss Moss writes on the cold glass with one finger. Her letters are small and very straight.', a: 'You are late. I rang at ten past nine.' },
        'I ring at ten past nine every night. I have rung more than seventeen thousand times. I used to teach arithmetic. I count.',
        'Nobody comes. A man took the number off my door. Then he told the staff that there was no Room 13. So my bell rings, and they look at the plan, and they say: there is no such room.',
        'Twelve, fourteen. That is what the plan says now. Twelve, fourteen! No pupil of mine ever counted like that.',
        { note: 'She looks at the tray for some time.', a: 'Wilfred made this. I can tell. It is exactly the way I used to have it.' },
        'I used to take two sugars. I do not now. Fifty years is a long time to go without sugar. In the end you stop wanting it.',

      }
    });
  }

  /* ---------- the tray ---------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lumpAt(l) { return l.on ? [tray.x + l.ox * tray.s, tray.y + l.oy * tray.s] : [l.x, l.y]; }
  function drawTray() {
    $('#trayG').style.transform = 'translate(' + tray.x.toFixed(1) + 'px,' + tray.y.toFixed(1) + 'px) scale(' + tray.s.toFixed(3) + ')';
    LUMP.forEach(function (l, i) {
      var p = lumpAt(l);
      $('#l' + i).style.transform = 'translate(' + p[0].toFixed(1) + 'px,' + p[1].toFixed(1) + 'px) scale(' + (l.on ? tray.s : 1).toFixed(3) + ')';
    });
  }
  function glide(to, done) {
    var a = { x: tray.x, y: tray.y, s: tray.s }, t0 = Date.now();
    (function step() {
      var k = Math.min(1, (Date.now() - t0) / 420), e = 1 - (1 - k) * (1 - k);
      tray.x = a.x + (to.x - a.x) * e; tray.y = a.y + (to.y - a.y) * e; tray.s = a.s + (to.s - a.s) * e; drawTray();
      if (k < 1) requestAnimationFrame(step); else if (done) done();
    })();
  }
  function goHome(done) { glide(HOME, function () { tray.at = 'home'; if (done) done(); }); }
  function zoneAt(x, y) {
    if (Math.abs(x - 1198) < 104 && y > 430 && y < 650) return 'table';
    if (x > 1380 && y > 290 && y < 480) return 'mantel';
    if (x > 470 && x < 860 && y > 660 && y < 880) return 'bed';
    return null;
  }
  var tox = 0, toy = 0;
  ER.drag($('#trayG'), {
    start: function (e) {
      if (busy || phase >= 4) return false;
      if (phase < 3) { ER.say('Wilf&rsquo;s tray: the blue cup, the cocoa, two sugar lumps on the saucer. It is for Miss Moss. But where is Miss Moss?'); return false; }
      var p = ER.pt(svg, e); tox = p.x - tray.x; toy = p.y - tray.y; tray.at = 'air';
    },
    move: function (e) {
      var p = ER.pt(svg, e);
      tray.x = clamp(p.x - tox, 150, 1580); tray.y = clamp(p.y - toy, 240, 866);
      tray.s = 1 - 0.54 * clamp((760 - tray.y) / 200, 0, 1); drawTray();
    },
    end: function (e, moved) {
      var z = zoneAt(tray.x, tray.y);
      if (!moved) { goHome(); ER.say('Pick the tray up and carry it: drag it to the place where you want to put it down.'); return; }
      if (!z) { goHome(); return; }
      if (z === 'table' && !chairOff) { goHome(); ER.say('Something is standing by the window, but it is under a dust sheet. You cannot put a tray down on a sheet.', 6000); return; }

  });
  LUMP.forEach(function (l, i) {
    var n = $('#l' + i), dx = 0, dy = 0;
    ER.drag(n, {
      start: function (e) {
        if (busy || phase >= 4) return false;
        if (phase < 3) { ER.say('Two sugar lumps on the saucer. That is how Wilf remembers it.'); return false; }
        if (tray.at !== 'home') return false;
        var p = ER.pt(svg, e), c = lumpAt(l); dx = p.x - c[0]; dy = p.y - c[1]; l.on = false; l.x = c[0]; l.y = c[1]; n.parentNode.insertBefore(n, n.parentNode.lastElementChild); drawTray();
      },
      move: function (e) { var p = ER.pt(svg, e); l.x = p.x - dx; l.y = p.y - dy; drawTray(); },
      end: function () {
        if (Math.abs(l.x - (tray.x + 12)) < 62 && Math.abs(l.y - tray.y) < 44) l.on = true;
        else {
          l.x = clamp(l.x, 60, 1540); l.y = clamp(l.y, 712, 884);
          if (!toldLump) { toldLump = true; ER.say('You take a sugar lump off the saucer and put it down on the floorboards. Wilf need never know.'); }
        }
        ER.sfx.click(); drawTray();
      }
    });
  });

  var WRONG = {
    bed: [['MY BED USED', 'TO BE THERE.'], 26,'She writes: &ldquo;My bed used to be there. It is not there now, and I do not sit on the floor.&rdquo; The tray slides back across the floor to your feet.'],
    mantel: [['I CANNOT', 'REACH THAT.'], 28,'She writes: &ldquo;I cannot reach that. I am not as tall as I used to be.&rdquo; The tray comes down again by itself.'],
    sweet2: [['TOO SWEET.'], 31,'She writes: &ldquo;Too sweet. That is how I used to have it.&rdquo; The tray slides back to your feet.'],
    sweet1: [['STILL', 'TOO SWEET.'], 28,'She writes: &ldquo;Still too sweet. I do not take sugar now. Not one lump.&rdquo; The tray slides back to your feet.']
  };
  function judge(z) {
    var n = LUMP.filter(function (l) { return l.on; }).length, file = ER.exitOk([z + '+' + n]);
    setTimeout(function () {
      if (file) { served(file); return; }
      var v = !ER.check('place', z) ? WRONG[z] : WRONG[n > 1 ? 'sweet2' : 'sweet1'];
      ER.sfx.no(); write(v[0], v[1]); ER.say(v[2], 9000);
      setTimeout(function () { goHome(function () { busy = false; }); }, 3200);
    }, 1100);
  }
  function served(file) {
    phase = 4; pips();
    var st = ER.state(); st.done = st.done || {}; st.done.thirteen = 1; ER.flag('thirteen', 1);
    ER.sfx.ok();
    $('#mArms').setAttribute('opacity', 0); $('#mHold').setAttribute('opacity', 1);
    write(['THANK YOU.'], 34);
    setTimeout(function () {
      $('#cocoa').setAttribute('fill', '#dfe7f1');
      ER.narrate([
        'In the mirror, Miss Moss takes the blue cup in both hands. She drinks. She does not hurry.',
        'On the real table, the real cup is empty. You did not see it happen.',
        'She has written two words on the glass, in very large letters. Now she is writing seven more.'
      ], function () {
        $('#mHold').setAttribute('opacity', 0); $('#mArms').setAttribute('opacity', 1); $('#mCup').setAttribute('opacity', 1);
        ER.sfx.glass();
        write(['NOW PUT ME BACK', 'ON THE PLAN.'], 23, function () { setTimeout(function () { ER.leave(file); }, 3000); });
      });
    }, 2400);
  }
})();
