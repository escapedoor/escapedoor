  #flood{transition:opacity 1.2s}

(function () {

  /* ---------- a corridor in perspective: d is metres in front of the end wall, h is height (0 floor, 1 ceiling) ---------- */
  function K(d) { return ZE / (ZE - d); }
  function P(side, d, h) { var k = K(d); return [VX + side * HW * k, VY + HH * k * (1 - 2 * h)]; }
  function W(side, d, h) { var p = P(side, d, h); return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
  function quad(side, d1, d2, h1, h2, fill, extra) {

  }
  function onWall(side, d, h) {                       /* a transform that lays flat lettering on a side wall */
    var k = K(d), kd = ZE / ((ZE - d) * (ZE - d)), p = P(side, d, h);

  function door(side, d1, d2, id) {
