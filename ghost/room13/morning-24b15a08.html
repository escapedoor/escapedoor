(function () {

  ER.init({
    theme: 'ghost', story: 'room13', storyTitle: 'Room 13 Is Not on the Plan', id: 'morning', no: 'IV', title: 'Breakfast',
    go: 'Tell her everything',
    intro: [
      'No sugar, and the little table by the window: the way she has it now. In the mirror Miss Moss drank her cocoa. Then she wrote THANK YOU on the glass, in very large letters.',
      'Under it she wrote one more line: NOW PUT ME BACK ON THE PLAN.',
      'At eight in the morning Aunt Viv comes downstairs. Her headache has gone. On her desk she finds two plans, a brass 3, and you, asleep in Wilf&rsquo;s chair.'
    ],
    exit: {"last":true,"rooms":4,"stars":2}, tags: {},
    hints: hints,
    onBegin: begin
  });

  function hints() {
    if (placed) return null;
    return ['label', [
      'Aunt Viv has given you one small paper label. It is lying on the desk, to the right of the plans. Where does it belong?',

    birdT = setTimeout(birds, 900);
    ER.narrate([
      'Aunt Viv listens to all of it. She does not say &ldquo;nonsense&rdquo; once.',
      'Then she puts the builder&rsquo;s plan beside the new one, and counts the rooms on her fingers.',
      '&ldquo;Sixteen,&rdquo; she says. &ldquo;I paid for fifteen rooms, and all this time there were sixteen.&rdquo; She sounds pleased.',
      'She pushes one small paper label across the desk to you. &ldquo;Go on, then,&rdquo; she says. &ldquo;Put her back.&rdquo;'
    ], function () { busy = false; });
  }

  /* where a point of the desk falls on the 1978 plan */
  function onPlan(x, y) {
    var a = 2 * Math.PI / 180, dx = x - 290, dy = y - 198;
    return [(dx * Math.cos(a) - dy * Math.sin(a)) / 1.1, (dx * Math.sin(a) + dy * Math.cos(a)) / 1.1];
  }
  ER.drag(lab, {
    start: function (e) { if (busy || placed) return false; var p = ER.pt(svg, e); ox = p.x - lx; oy = p.y - ly; },
    move: function (e) { var p = ER.pt(svg, e); lx = p.x - ox; ly = p.y - oy; drawLab(); },
    end: function (e, moved) {
      var q = onPlan(lx, ly);
      if (!moved) { ER.say('A paper label with 13 on it. Drag it onto the new plan, to the place where Room 13 belongs.'); return; }
      if (q[0] > 606 && q[0] < 764 && q[1] > 26 && q[1] < 404) { put(); return; }
      ER.sfx.no();
      if (q[0] > 20 && q[0] <= 606 && q[1] > 36 && q[1] < 394) ER.say('Not there. Every room on that part of the plan has a number already. Look at the builder&rsquo;s plan: where did Room 13 use to be?', 7000);
      else ER.say('Put the label on the new plan, in the place where Room 13 used to be.');
      lx = L0[0]; ly = L0[1]; drawLab();
    }
  });
  function scratch(n) { var i; for (i = 0; i < n; i++) R13.noise({ type: 'highpass', f: 2600 + Math.random() * 1500, dur: 0.09, peak: 0.05, when: i * 0.16 + Math.random() * 0.05 }); }
  function put() {
    placed = true; busy = true; ER.hush(); ER.sfx.click();
    lab.classList.add('gone'); lab.style.display = 'none';
    $('#labIn').setAttribute('opacity', 1); $('#npG').classList.add('inked'); scratch(11);
    setTimeout(function () { scratch(14); }, 2100);
    setTimeout(function () {
      ER.narrate([
        'Aunt Viv takes out her fountain pen and draws the walls back in, and the door, and two windows.',
        'Under the number she writes: Miss W. Moss. Permanent. Cocoa at ten past nine. No sugar.',
        'Wilf finds a new screw for the brass 3. It still hangs crooked. He says it always did.',
        'That night the bell rings at ten past nine. It rings once. Wilf is already on the stairs with the tray.',
        'In the morning the blue cup comes down again. It is empty, and somebody has washed it.'
      ], bill);
    }, 4600);
  }
  function bill() {
    var st = ER.state(), mins = Math.max(1, Math.round((ER.flag('tEnd') - (st.t0 || ER.flag('tEnd'))) / 60000)), hn = ER.hintsUsed(), wn = Object.keys(st.words).length;
    $('#b-time').textContent = mins + (mins === 1 ? ' minute' : ' minutes');
    $('#b-hints').textContent = hn ? String(hn) : 'none';
    $('#b-book').textContent = st.clues.length + ' papers, ' + wn + (wn === 1 ? ' word' : ' words');
    $('#bill').classList.add('on'); ER.sfx.ok(); busy = false;
  }

  function thing(sel, word, line) {
    $(sel).addEventListener('click', function (e) {
      if (word) ER.wordAt(e.clientX, e.clientY, word);
      if (line) ER.say(line);
    });
  }
  thing('#three', null, 'The brass 3 from her door, and the one screw that held it up for nearly fifty years.');
  thing('#driver', 'screwdriver', null);
  thing('#bell', 'desk bell', 'Aunt Viv&rsquo;s desk bell. Nobody has dared to ring it this morning.');
  thing('#specs', 'spectacles', null);
  thing('#paper', 'crossword', 'Wilf&rsquo;s crossword. He has filled in one word since last night.');
  thing('#coffee', null, 'Aunt Viv&rsquo;s coffee. Black, and no sugar. It seems to be a rule in this hotel.');
  thing('#toast', 'marmalade', null);
  thing('#jar', 'marmalade', null);
  thing('#pen', 'fountain pen', null);
  thing('#bpG', null, 'The builder&rsquo;s plan from 1936, with its labels back on. Sixteen rooms.');

  $('#b-nb').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { clearTimeout(birdT); ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* a short piece of writing: the page the 1936 guide never had */
  $('#b-report').addEventListener('click', function () {
    var saved = ER.flag('report') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h3>The Swan Hotel</h3><h4>A Guide for Guests &middot; the new page</h4>' +
      '<label for="r1">1. Finding Room 13. Tell a new guest the way from the lift. <i>Try to use: on your left, opposite, next to, at the end of.</i></label><textarea id="r1"></textarea>' +
      '<label for="r2">2. Miss Moss, then and now. What did she use to do? What does she do now? <i>Write three sentences with &ldquo;used to&rdquo;.</i></label><textarea id="r2"></textarea>' +
      '<label>3. Aunt Viv wants to know: should the hotel let other guests sleep in Room 13?</label><div class="yn"><label><input type="radio" name="yn" value="yes"> Yes</label><label><input type="radio" name="yn" value="no"> No</label></div>' +
      '<textarea id="r3" placeholder="Because&hellip;"></textarea>' +
      '<div class="by"><label for="r4">Written by</label><input type="text" id="r4" maxlength="60"></div>' +
      '<div class="count"></div><div class="foot"><span>Saved in this browser as you type.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, 'label[for=r1], label[for=r2]');
    ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { box.querySelector('#' + k).value = saved[k] || ''; });
    if (saved.yn) { var r = box.querySelector('input[value=' + saved.yn + ']'); if (r) r.checked = true; }
    function keep() {
      var o = {}, n = 0, c = box.querySelector('input[name=yn]:checked');
      ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { o[k] = box.querySelector('#' + k).value; });
      o.yn = c ? c.value : '';
      ['r1', 'r2', 'r3'].forEach(function (k) { n += (o[k].match(/[A-Za-z’']+/g) || []).length; });
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('report', o);
    }
    box.addEventListener('input', keep); box.addEventListener('change', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
