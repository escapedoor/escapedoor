<style>
  body{--bg:#0a1a1d;--accent:#f3b27a;--font-display:'Abril Fatface',serif;--font-ui:'Oswald',sans-serif;

  .pnum{font-family:'Oswald',sans-serif;font-weight:600;font-size:7.5px;fill:#3a2a08;text-anchor:middle}
  .ind{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;fill:#d9b56a;text-anchor:middle}
  .plq{font-family:'Abril Fatface',serif;font-size:19px;letter-spacing:5px;fill:#3a2a08;text-anchor:middle}
  .chalk{font-family:'Caveat',cursive;font-weight:700;font-size:30px;fill:#efe9dc;opacity:.86;text-anchor:middle}
  .tiny{font-family:'Special Elite',monospace;font-size:7px;fill:#3a3226;text-anchor:middle}
  body.rung .flag13{animation:sway 1.7s ease-in-out infinite alternate}
  body.ringing .flag13{animation:wag .17s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
  @keyframes wag{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
  #sbell{transform-origin:478px 178px}
  body.ringing #sbell{animation:shk .08s linear infinite alternate}
  @keyframes shk{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
  #lampGlow{animation:lg 5s steps(4) infinite}
  @keyframes lg{50%{opacity:.86}}
  #note{animation:ng 2.6s ease-in-out infinite}
  #box.ready{animation:ng 2.2s ease-in-out infinite}
  @keyframes ng{50%{filter:brightness(1.3)}}
  #cageLamp{animation:cl 7s steps(1,end) infinite}
  @keyframes cl{0%,61%,64%,100%{opacity:.55}62.5%{opacity:.2}}
  #gate{transform-origin:74px 0;transition:transform 1.3s ease-in-out}
  body.up #gate{transform:scaleX(.16)}
  #liftPtr{transform-origin:195px 136px;transform:rotate(-58deg);transition:transform 2.6s ease-in-out}
  body.up #liftPtr{transform:rotate(58deg)}
  #steamW{animation:stm 3.6s ease-in-out infinite}
  @keyframes stm{0%,100%{opacity:.12;transform:translateY(0)}50%{opacity:.32;transform:translateY(-7px)}}

  /* the box that was not burned: the old guide, the builder's plan, and its fallen labels */
  .pp{display:grid;grid-template-columns:386px minmax(0,744px);gap:22px;align-items:start;justify-content:center;width:min(1180px,96vw)}
  .pp .doc.guide{width:auto;max-height:none;overflow:visible;transform:rotate(-.7deg);font-size:18px;padding:26px 30px 22px}
  .pp-r{padding:14px 14px 12px;background:#5b4226 linear-gradient(160deg,#6d5030,#463019);border:1px solid #2c1d0f;
    box-shadow:0 26px 70px rgba(0,0,0,.65),inset 0 0 0 3px rgba(255,220,160,.08)}
  .pp-say{margin:0 2px 10px;font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.35;color:#f3e7cf}
  .pp-plan{position:relative;box-shadow:0 6px 18px rgba(0,0,0,.5);border:6px solid #e9e2cf}
  .pp-plan svg{display:block;width:100%;height:auto}
  .pslot{position:absolute;width:11.8%;height:9%;border:1.5px dashed rgba(232,241,251,.75);border-radius:2px;background:rgba(232,241,251,.06)}
  .pslot.bad{border-color:#ffb199;background:rgba(255,120,90,.16)}
  .lab{display:inline-block;min-width:72px;padding:7px 8px 3px;background:#f6efd9;color:#27231d;font-family:'Special Elite','Courier New',monospace;
    font-size:21px;line-height:1.1;text-align:center;box-shadow:0 3px 0 #b9ad8c,0 5px 10px rgba(0,0,0,.4)}
  .lab.w{font-size:17px;padding-top:9px;padding-bottom:5px}
  .pp-tray .lab:nth-child(odd){transform:rotate(-2deg)}.pp-tray .lab:nth-child(even){transform:rotate(1.5deg)}
  .pslot .lab{display:grid;place-items:center;min-width:0;width:100%;height:100%;padding:3px 0 0;box-shadow:0 2px 5px rgba(0,0,0,.45);font-size:19px}
  .pslot .lab.w{font-size:14.5px}
  .pp-tray{display:flex;flex-wrap:wrap;gap:11px;align-content:flex-start;min-height:62px;margin-top:12px;padding:12px;border-radius:3px;
    background:rgba(20,12,4,.34);border:1px dashed rgba(255,225,170,.3)}
  .pp-foot{display:flex;align-items:center;gap:14px;margin-top:10px}
  .pp-msg{flex:1;min-height:26px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#ffd9a8}
  .pp .btn{background:rgba(20,12,4,.4)}
  @media (max-width:900px){.pp{grid-template-columns:1fr}}
</style>

<script>
(function () {

  /* panelling, lift gate, clock face, bell board, pigeonholes, studs on the chair */
  (function () {

    '<p>3. The torch is for power cuts. It is not for adventures.</p>' +
    '<p>Aunt Viv</p>';
  var GUIDE = '<h4>The Swan Hotel</h4><h5>A Guide for Guests &middot; 1936</h5>' +
    '<h6>Finding your room: the second floor</h6>' +
    '<p>Come out of the lift. The stairs are on your right, and the corridor is in front of you.</p>' +
    '<p>Room 11 is the first door on your left. Room 12 is next to it.</p>' +
    '<p>The linen cupboard is opposite Room 12.</p>' +
    '<p>The bathroom is between Room 12 and Room 14. There is hot water from seven until nine.</p>' +
    '<p>Room 16 is opposite Room 14.</p>' +
    '<p>Room 15 is between the linen cupboard and Room 16.</p>' +
    '<p>Room <span class="ink"></span> is at the end of the corridor. It has two windows, and it is the quietest room in the hotel.</p>' +
    '<p class="small">Guests are asked not to ring for the porter after ten.</p>';

  function hints() {

      'A bell is ringing for a room that is not there. One person in this lobby is not surprised at all. Click on him.',

      'You come out of the lift and walk along the corridor. &ldquo;On your left&rdquo; is the top side of this plan. &ldquo;Opposite&rdquo; means across the corridor. &ldquo;Next to&rdquo; and &ldquo;between&rdquo; mean on the same side.',

  thing('#lift', 'lift', 'The lift. It is older than Wilf, and it only goes up when he works the lever.');

  thing('#rack', 'pigeonhole', 'A key and a pigeonhole for every room. One pigeonhole has no number. There is a letter in it, for Miss W. Moss. The stamp is from 1977.');
  thing('#notice', null, 'A notice in a frame: GUESTS ARE ASKED NOT TO RING FOR THE PORTER AFTER TEN.');

    ER.talk({

        'That&rsquo;s her. Ten past nine. You could set your watch by it.',
        'Wilf Tully, night porter. I came to the Swan in 1974, as the kitchen boy. I was sixteen.',
        { q: 'Whose bell is it?', a: 'Room 13. Miss Moss. She came for a weekend in 1949 and stayed for twenty-eight years. She used to teach arithmetic. She never checked out. You understand me.' },
        'Every night at ten past nine she used to ring for her cocoa, and I used to carry it up. Two sugars on the saucer, the blue cup, on the table by her bed. Never after ten. She never broke a rule in her life.',
        'Then, one night in 1977, the bell didn&rsquo;t ring. The year after, Mr Cray shut the room up. Guests didn&rsquo;t like the number, he said. He took the 13 off the door and off that board. He had the door papered over and a new plan drawn. Then he told us there had never been a Room 13.',

      ],
