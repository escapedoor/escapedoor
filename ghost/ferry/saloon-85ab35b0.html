  #minis{display:none}

  /* the forward bulkhead: nine brass plates, one empty place, nine printed cards */
  .bk{width:min(1100px,96vw);-webkit-user-select:none;user-select:none}
  .bk-wall{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:12px;background:#e3d7b4 linear-gradient(172deg,rgba(255,255,255,.4),rgba(120,95,40,.2));border:4px solid #6b5326;box-shadow:0 22px 60px rgba(0,0,0,.6)}
  .cell{display:flex;flex-direction:column;gap:6px}
  .plate{position:relative;min-height:82px;display:grid;place-items:center;padding:10px 8px 7px;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:12px;line-height:1.24;letter-spacing:.01em;color:#3a2a08;

  .plate:before{left:4px}.plate:after{right:4px}
  .plate.gone{background:#efe6c8;border:1.5px dashed #b9a97c;box-shadow:none;text-shadow:none;font-family:'Caveat',cursive;font-weight:400;font-size:19px;line-height:1.1;color:#6b6457;transform:none}
  .plate.gone:before,.plate.gone:after{background:#3a3226;width:5px;height:5px}
  .pslot{min-height:68px;border:1.5px dashed rgba(60,50,30,.5);border-radius:6px;background:rgba(60,50,30,.07)}
  .cell.bad .plate{outline:3px solid #d2452f;outline-offset:1px}
  .bk-tray{display:flex;flex-wrap:wrap;gap:7px;min-height:72px;margin-top:8px;padding:7px;background:#5a4028 linear-gradient(#6b4c30,#4a3320);border-radius:3px;box-shadow:inset 0 2px 0 rgba(255,220,160,.2)}
  .nt{display:block;width:calc((100% - 28px) / 5);min-height:58px;padding:5px 9px 4px;background:#fdfdfa;color:#1c2428;border:1px solid #b9c4c2;border-radius:6px;font-family:'Outfit',sans-serif;font-size:12px;line-height:1.22;
    box-shadow:0 3px 7px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.7)}

  .bk .wk-foot{margin-top:8px}
  .bk .pmsg{font-size:17px;line-height:1.32;min-height:46px}

  var NOTES = [
    ['wifi', 'STAY IN TOUCH', 'Free Wi-Fi on board: CURLEW-GUEST. No phone signal in mid-channel.'],

    ['fares', 'FARES 2026', 'Adult single £7.20. Under 16s half price. Dogs and pushchairs travel free.'],

    ['drinks', 'HOT DRINKS £1.80', 'Help yourself. Please pay the honesty box.'],

  ER.init({
    theme: 'ghost', story: 'ferry', storyTitle: 'When the Tide Serves', id: 'saloon', no: 'II', title: 'The Saloon',
    go: 'Go into the saloon',
    intro: [
      'Seven labels found their heads without much trouble. The sleeping man and the small girl took two lines of the list with one name. The cello had a seat and no label. The man with the lantern has never paid, and the man with the binoculars booked at two minutes past two.',
      'Then one label was left, COOMBES, E., and two young women in headscarves each said that it was hers: an adult, a single, to be met. Eight names, nine heads, and nobody you could call a stowaway.',

  });

  nextFile = ER.flag('s-file') || null; told = ER.flag('s-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('s-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#box').classList.toggle('ready', !told.purser);
    $('#wall').classList.toggle('ready', !!(told.purser && !nextFile));
    $('#scene').classList.toggle('done', !!nextFile);
    ER.pips((told.purser ? 1 : 0) + (told.coins ? 1 : 0) + (nextFile ? 1 : 0), 3);
  }

  function hints() {
    if (nextFile) return ['go', ['The card is in your notebook. Go out on to the after deck: the green door on the left.']];
    if (bulk && bulk.isOpen()) return ['bulk', [
      'Read a brass plate, and ask what it is about: a drink, a fare, a message, a bus, a bag? Then find the printed card that is about the same thing tonight, and put it under the plate. The words are often different: rest the mouse on the dotted ones.',
      'There are nine plates, one empty place and nine cards. One plate says nothing that has stopped being true, so nothing goes under it. One card is about something that no plate ever was, so it goes under the empty place.',
      'A perambulator is a pram, and it is on the plate with the prices. An omnibus is a bus. A telegram was a way of sending a message. A porter carried bags. And the plate about fog and the card about an alarm only look alike.'
    ]];
    if (!told.purser) return ['purser', [
      'Ms Pargeter is standing by the tea hatch, looking into the honesty box. Hear what she has found.',
      'Click the purser: the one in the white cap, between the tea hatch and the long bench.'
    ]];
    return ['wall', [
      'The purser wants every printed card back under the brass plate that it has replaced. The plates are on the wall above the bench, to the right of the tea hatch. Click them.',
      'The cards are in a heap on the tea hatch, and the plates are in two rows on the bulkhead. Click the plates.'
    ]];
  }

  function begin() {
    paint();
    stopWhistle = FY.whistle(26000, 120000, 0.4);
    if (nextFile) { busy = false; showGo(); ER.say('Nine plates, nine cards, and four old pennies. The door to the after deck is on the left.'); return; }
    if (told.in) { busy = false; ER.say('The saloon, at ten to ten.'); return; }
    tell('in');
    ER.narrate([
      'The saloon: cream paint, green seats, and brass that somebody has polished every week since 1950. It is warm in here, and it smells of tea and wet coats.',
      'The forward bulkhead is covered with notices. The old ones are brass plates, screwed on. The new ones are printed cards, stuck on with something that does not like the damp: tonight every one of them has slid off, and they are lying in a heap on the tea hatch.',
      'Ms Pargeter is standing at the hatch with the honesty box open in front of her. She is not counting the money. She is looking at it.'
    ], function () { busy = false; });
  }

  /* ---------- the purser, and the honesty box ---------- */
  $('#purser').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;An old word can still be true,&rdquo; says Ms Pargeter. &ldquo;An old price cannot. Out on deck, Trainee, and bring your ears.&rdquo;'); return; }
    ER.talk({
      who: 'Ms Pargeter', role: 'Purser, m.v. Curlew · six weeks', face: window.FACE('pargeter'),
      lines: [
        { note: 'She tips the honesty box towards you, so that you can see in.', a: '&ldquo;Tea is one pound eighty. People put in coins, or they tap a card on the lid. Tonight I have nine pounds in real money. And these.&rdquo;' },
        { q: 'What are they?', a: 'Pennies. Four of them. Not our pennies: look at the size of them. There is a king on every one, and the newest says 1947. Somebody has had a cup of my tea tonight and paid for it with money that stopped being money before I was born.' },
        { q: 'Why four?', a: 'That is what I asked myself. Then I looked up.</p><p>She points at a brass plate on the bulkhead. REFRESHMENTS. TEAS 4d.</p><p>&ldquo;A d was how they wrote pence. Fourpence. Somebody read that plate tonight, and believed it.&rdquo;' },
        { q: 'What does the skipper say?', a: 'I rang up to the wheelhouse. I said: nine heads, eight names, four old pennies. Do you know what he said? &ldquo;Read the saloon, Purser. Old plates and new cards. Know which is which. Then go and listen to them talk.&rdquo; And he put the telephone down.' },
        { a: 'So we will read the saloon. Every old plate that says something which is no longer true is telling lies to my passengers. Each printed card goes back under the plate that it has replaced. If a card has replaced nothing, find it the place where nothing is. If a plate is still true, leave it alone. And read them as you go, Trainee. Both sorts.' }
      ],
      clue: { id: 'pennies', title: 'Ms Pargeter: four old pennies', kind: 'What she said' },
      done: function (seen) { if (seen && tell('purser')) { paint(); ER.say('The brass plates are on the bulkhead, above the bench. The cards are in a heap on the hatch.'); } }
    });
  });
  $('#box').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'honesty box');
    if (!told.purser) { ER.say('The honesty box: a wooden box with a slot in the lid, and nobody to watch it. HOT DRINKS £1.80. Ms Pargeter has not taken her eyes off it.'); return; }
    FY.sfx.coins(); if (tell('coins')) paint();
    ER.say('Four brown pennies among the pound coins, each as big as a biscuit. Two have one king&rsquo;s head on them and two have another&rsquo;s. The dates are 1921, 1936, 1938 and 1947.');
  });

  /* ---------- things in the saloon ---------- */
  FY.thing('#cards', null, 'Nine printed cards, lying where they slid. HOT DRINKS. STAY IN TOUCH. SMILE! They are from the office, and they have the office&rsquo;s way of talking.', isBusy);
  FY.thing('#urn', 'tea urn', 'The tea urn. It has been on the boil since 1950, with short breaks.', isBusy);
  FY.thing('#telbox', 'telegram', 'A small brass box with a flap, under the plate about telegrams. FORMS, it says. There are no forms in it, and nothing else. When the boat rolls, something at the back of it rattles.', isBusy);
  FY.thing('#gapv', 'wireless', 'A paler square of varnish with four screw holes, and a note in pencil: WIRELESS. TO THE MUSEUM, 1996. Something stood here for a long time.', isBusy);
  FY.thing('#door', null, 'The door to the after deck. Through its round window you can see fog, the white stern lamp, and four people who will not come in.', isBusy);
  FY.thing('#clock', null, function () { return nextFile ? 'Five to ten.' : 'Ten to ten. Thirty-five minutes to Marram.'; }, isBusy);
  FY.thing('#wins', null, 'Fog. It is the same in both windows.', isBusy);
  FY.thing('#lockers', 'lifebelt', 'LIFEBELTS, in stencilled letters, on a locker under every seat. The lockers have been full of lifejackets since before the purser was born. Nobody has repainted the word.', isBusy);
  FY.thing('#rob', null, 'Mr Brimble, of Marram, asleep. He has spent the whole of Saturday in town with a seven-year-old, and he has earned it.', isBusy);
  FY.thing('#posy', null, '&ldquo;The lady in the scarf put big brown money in the box,&rdquo; says Posy Brimble. &ldquo;I saw. It went clonk.&rdquo; Which lady? &ldquo;The one who went outside.&rdquo; They are both outside. Posy thinks about this. &ldquo;Then both of her,&rdquo; she says.', isBusy);
  FY.thing('#marek', null, '&ldquo;Nine heads and eight names?&rdquo; says Marek Mazur. &ldquo;I have fourteen parcels, and I can tell you where every one of them has been since Tuesday. You should scan your passengers.&rdquo;', isBusy);
  FY.thing('#parcels', 'parcel', 'Fourteen parcels for Marram, on a sack truck. Each has a label with a black-and-white square on it, and each has been scanned twice.', isBusy);
  FY.thing('#tess', null, 'Tess Anstey keeps one hand on the cello case, as you would keep a hand on a large dog. &ldquo;Boris is booked to play at a wedding on Monday,&rdquo; she says. &ldquo;I am only here to carry him.&rdquo;', isBusy);
  FY.thing('#cello', 'cello', 'Boris, in his case, with a luggage label of his own. He has a seat. He has not got a line on the list.', isBusy);
  FY.thing('#julian', null, 'Julian Yeo is looking at the fog through his binoculars, in case it is different close up. &ldquo;A Pallas&rsquo;s warbler,&rdquo; he says. &ldquo;It weighs less than a pound coin, it has flown here from Siberia, and it is somewhere on Marram. Low water was at a quarter to nine, by the way. Birders always know the tide.&rdquo;', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) { if (stopWhistle) stopWhistle(); ER.leave(nextFile); } });
  $('#wall').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Nine brass plates, and eight printed cards under them. The plate about fog has nothing under it, and needs nothing.'); return; }
    if (!told.purser) { ER.say('Two rows of brass plates, each with four lines of small capitals. Ms Pargeter has something to show you before you read them.'); return; }
    if (!bulk) bulk = makeBulk();
    bulk.open();
  });

  /* ---------- the bulkhead: a card under every plate that has stopped being true ---------- */
  var CRIB = '<h4>THEN AND NOW<small>the saloon bulkhead, m.v. Curlew</small></h4><table>' +
    '<tr><th></th><th>THEN: THE BRASS PLATES</th><th>NOW: THE PRINTED CARDS</th></tr>' +
    '<tr><td>A cup of tea</td><td>4d (fourpence)</td><td>£1.80</td></tr>' +
    '<tr><td>The crossing</td><td>single 2/6, return 4/-; children under 14 half fare</td><td>single £7.20; under 16s half price</td></tr>' +
    '<tr><td>A baby&rsquo;s pram</td><td>a perambulator: 1/-</td><td>a pushchair: free</td></tr>' +
    '<tr><td>Word ashore</td><td>a telegram, handed to the purser</td><td>Wi-Fi; a mobile phone</td></tr>' +
    '<tr><td>From the pier</td><td>the island omnibus meets every boat at the Old Pier</td><td>nothing meets the 21.40; all boats use the New Slip</td></tr>' +
    '<tr><td>Smoking</td><td>gentlemen: not in the saloon, but on the after deck</td><td>nobody, anywhere</td></tr>' +
    '<tr><td>Sundays</td><td>no boat</td><td>boats every day of the week</td></tr>' +
    '<tr><td>Your bags</td><td>a porter: 6d for each</td><td>a trolley; you push</td></tr>' +
    '<tr><td>If she sinks</td><td>lifebelts under the seats</td><td>lifejackets under the seats (a new word for the same thing)</td></tr>' +
    '<tr><td>In fog</td><td>the whistle, every two minutes</td><td class="still">STILL TRUE. No card.</td></tr></table>' +
    '<p class="hand">Old money: 12 pence (12d) made a shilling, and 20 shillings made a pound. 2/6 is two shillings and sixpence: people said &ldquo;two and six&rdquo;, or &ldquo;half a crown&rdquo;. It all stopped in 1971. The wireless (a radio) went to the Museum in 1996; the only new thing with no old plate is the CCTV. &mdash; P.</p>' +
    '<p class="rule">An old WORD can still be true. An old PRICE cannot.</p>';
  function makeBulk() {
    var ORDER = PLATES.map(function (p) { return p[0]; });
    var WHY = {
      tea: 'TEAS 4d. That plate is about what a hot drink costs. Which card says what one costs tonight?',
      fares: 'That plate is the price of the crossing: for a grown-up, a child, a dog and a baby&rsquo;s pram. A perambulator is a pram. Which card has tonight&rsquo;s prices on it?',
      tel: 'A telegram was a few words sent along a telegraph line, and carried to your door by a boy on a bicycle. It was how you sent word ashore. How does anybody send word ashore tonight?',
      bus: 'Omnibus is the long word for a bus. That plate says how you got on from the pier. Which card says how you get on tonight?',
      smoke: 'That plate tells gentlemen where they may smoke. Tonight nobody may, anywhere, and one card says so.',
      belt: 'A lifebelt is what they called it before they called it a lifejacket. The same seat, and the same reason.',
      sun: 'No boats on a Sunday, says the plate. One card says on which days we sail now.',
      port: 'A porter carried your bags, at sixpence each. Nobody carries your bags tonight, and one card owns up to it.',
      fog: 'Read that plate again, and then listen. The whistle has sounded every two minutes since we left the quay. Is there one word on that plate which is not true tonight? Then it wants no card. Leave it bare.',
      gap: 'Nothing is screwed there now: the wireless went to the Museum. So that is the place for the one card which has replaced nothing at all: the one thing on this boat that nobody did when she was new.'
    };
    var under = ER.flag('s-under') || {}, wait = false, box = ER.el('div', 'bk'), s = '<div class="bk-wall">';
    PLATES.forEach(function (p) { s += '<div class="cell" data-p="' + p[0] + '"><div class="plate' + (p[0] === 'gap' ? ' gone' : '') + '"><span>' + ER.gloss(p[1]) + '</span></div><div class="pslot" data-p="' + p[0] + '"></div></div>'; });
    s += '</div><div class="bk-tray"></div><div class="wk-foot"><p class="pmsg"></p><button type="button" class="btn" id="b-go">Show the purser</button></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.bk-tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function slot(k) { return box.querySelector('.pslot[data-p="' + k + '"]'); }
    NOTES.forEach(function (n) {
      var c = ER.el('span', 'nt dnd-item', '<b>' + n[1] + '</b>' + ER.gloss(n[2])), at = null, k;
      c.setAttribute('data-n', n[0]);
      for (k in under) if (under[k] === n[0]) at = k;
      (at && slot(at) ? slot(at) : tray).appendChild(c);
    });
    function read() {
      under = {};
      ORDER.forEach(function (k) { var c = slot(k).querySelector('.nt'); if (c) under[k] = c.getAttribute('data-n'); });
      ER.flag('s-under', under); box.setAttribute('data-under', ORDER.map(function (k) { return under[k] || 'none'; }).join('|'));
    }
    ER.dnd(box, { item: '.nt', slot: '.pslot', home: tray, lock: function () { return wait || !!nextFile; }, change: function () { read(); FY.sfx.stick(); msg(''); } });
    box.querySelector('#b-go').addEventListener('click', function () {
      var left = tray.querySelectorAll('.nt').length, i, k, v, file, why;
      if (wait || nextFile) return;
      read();
      if (left) { msg('&ldquo;' + (left === 9 ? 'Nine cards on my hatch, and not one on my bulkhead' : left === 1 ? 'One card is still lying on my hatch' : left + ' cards are still lying on my hatch') + ',&rdquo; says Ms Pargeter. &ldquo;Every one of them goes somewhere.&rdquo;'); return; }
      for (i = 0; i < ORDER.length; i++) {
        k = ORDER[i]; v = under[k] || 'none';
        if (!ER.check(k, v)) {
          ER.sfx.no(); FY.flash(slot(k).parentNode);
          why = k === 'fog' && v === 'jacket' ? 'The plate says that passengers need not be ALARMED. The card says what to do if the ALARM sounds. One word alike is not one meaning alike. Read the plate again: is anything on it untrue tonight?' : WHY[k];
          if (v === 'none') msg('Ms Pargeter taps the plate above an empty place. &ldquo;Nothing under this one? ' + (k === 'gap' ? '' : 'Then you are telling me that it is still true tonight. ') + why + '&rdquo;');
          else { msg('Ms Pargeter peels one card off again. &ldquo;' + why + '&rdquo;'); tray.appendChild(slot(k).querySelector('.nt')); read(); }
          return;
        }
      }
      file = ER.exit([ORDER.map(function (k) { return under[k] || 'none'; }).join('|')], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('s-file', file);
      msg('Ms Pargeter reads along the bulkhead with one finger, the top row and then the bottom, like somebody checking a till.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true; FY.sfx.horn(0.4);
        ER.narrate([
          '&ldquo;Tea, fares, telegrams, the omnibus, smoking, Sundays, porters,&rdquo; says Ms Pargeter. &ldquo;Seven plates, and not one of them is true tonight. The lifebelts have only changed their name.&rdquo;',
          'Over your heads the whistle sounds: one long blast, as it has every two minutes since the quay. Ms Pargeter looks up at the plate with nothing under it. &ldquo;And that one is still true.&rdquo;',
          '&ldquo;So that is the skipper&rsquo;s lesson. An old word can still be true. An old price cannot. And somebody on this boat has paid fourpence for a cup of tea tonight, and thought nothing of it.&rdquo; She shuts the honesty box.',
          'She writes for a minute on the back of a blank ticket card, and gives it to you. THEN AND NOW. &ldquo;Keep that. You are going to need it out there.&rdquo;',
          '&ldquo;Four of our nine have been out on the after deck since the quay, in fog that you could lean on. Both the Miss Coombeses are among them. Come on, Trainee. And bring your ears.&rdquo;'
        ], function () { busy = false; ER.addClue('then', 'Then and now: the purser’s card', CRIB, 'crib', 'From the saloon'); FY.terms(['shilling', 'half a crown', 'telegram', 'omnibus', 'perambulator', 'lifebelt', 'porter', 'wireless']); showGo(); });
      }, 2800);
    });
    read();
    msg(Object.keys(under).length ? 'The bulkhead, with some of the cards back in their places. Drag a card under a plate, or click the card and then the place.' :
      'Nine brass plates, one empty place, and nine printed cards on the hatch. Put each card under the plate that it has replaced. Drag it, or click the card and then the place.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
</script>
</body>
</html>
