  <h6>Your Place Is Laid</h6>

  <p class="last">Mrs Bellamy came in at eight the next morning, as she had for eleven years. The table was bare. Two mugs had been washed and set to dry beside the sink. This time she told her husband.</p>

(function () {

  function register(name) {
    return '<h4>FAMILY REGISTER</h4><h5>MARRIAGES</h5><p class="ink">Amos Oakes of Sweetings and Hannah Winterbourne of Hill End. 23rd April 1895.</p>' +
      '<h5>BIRTHS</h5><p class="ink">Catherine. 3rd March 1898.</p><p class="ink">' + name + '. 12th May 1905.</p><p class="ink">George. 20th June 1907.</p><p class="ink">Charlotte. 9th November 1910.</p>' +
      '<h5>DEATHS</h5><p class="ink2">Amos Oakes. 11th February 1941.</p><p class="ink3">Hannah Oakes. 2nd December 1951.</p>' +
      '<p class="note">The strip of paper has come away. The line under it is in the same hand and the same ink as the three others.</p>';
  }

  (function () {
    var s = '', i, x, y, r, c;
    for (i = 0; i < 16; i++) s += '<rect x="' + (i * 214 - 900) + '" y="34" width="52" height="78"/>';
    $('#beams').innerHTML = s + '<rect x="-1000" y="100" width="3600" height="12"/>'; s = '';
    for (i = -14; i < 30; i++) { x = i * 112 - 260; s += '<path d="M' + x + ' 640L' + OY.num(800 + (x - 800) * 3.06) + ' 1340"/>'; }
    [686, 748, 836, 960, 1130].forEach(function (v) { s += '<path d="M-1000 ' + v + 'H2600"/>'; });
    $('#flags').innerHTML = s; s = '';
    for (i = 0; i < 6; i++) { x = 404 + i * 23; s += (i === 3 ? '<rect x="' + (x - 10) + '" y="247" width="20" height="18" fill="#6b4c2a"/>' : '') + '<circle cx="' + x + '" cy="262" r="5.500" fill="#120a04"/>'; }
    $('#pegv').innerHTML = s + '<path id="jacket" d="M462 264q-14 34 2 62h24q14 -28 0 -62z" fill="#2f6a52" style="display:none"/>'; s = '';
    for (i = 0; i < 12; i++) {
      c = i % 6; r = Math.floor(i / 6); x = 604 + c * 50; y = 172 + r * 50;
      s += '<circle cx="' + x + '" cy="' + y + '" r="4.500" fill="#d9a83f"/>';
      if (i !== 3) s += '<path d="M' + (x - 13) + ' ' + (y + 30) + 'v-18q13 -12 26 0v18z" fill="#c9b98a" stroke="#5f4a24" stroke-width="1.500"/><path d="M' + (x - 7) + ' ' + (y + 20) + 'h14" stroke="#3a2a12" stroke-width="2.500"/>';
    }
    $('#pegrow').innerHTML = s; s = '';
    [226, 300, 372].forEach(function (v) {

      for (i = 0; i < 4; i++) { x = 992 + i * 56; s += '<circle cx="' + x + '" cy="' + (v - 28) + '" r="27" fill="#b9a67c"/><circle cx="' + x + '" cy="' + (v - 28) + '" r="23" fill="none" stroke="#2c3f5c" stroke-width="4"/><path d="M' + (x - 20) + ' ' + (v - 40) + 'q12 -12 24 -8" stroke="#fff0c0" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>'; }

    $('#fair').innerHTML = OY.who('fair', { hold: true, extra: '<rect x="-24" y="-170" width="48" height="26" rx="3" fill="#c9a23a"/><rect x="-24" y="-170" width="48" height="7" rx="3" fill="#e2c46a"/>' });

  ER.init({
    theme: 'ghost', story: 'orchard', storyTitle: 'Your Place Is Laid', id: 'supper', no: 'V', title: 'Supper',

    intro: [
      'The row nearest the house was not the row nearest the house: George planted the Bramleys in the paddock in 1953. And the orchard gate was not the gate you came in at: that one was cut into the lane in 1947. In May 1931 there was one gate, the wicket by the pump, and one row along the garden side.',
      'So it was the third tree from the wicket: a Worcester Pearmain grafted in 1905, the nearer of the twins, without an apple on it this year. Behind it, at the foot of the bee wall, the middle stone of three came up, and under it lay a mustard tin sealed with candle wax.',

    return ['plate', [
      'Read the end of Hannah&rsquo;s letter once more: it is in your notebook. Where exactly is the paper to be put down?',
      '&ldquo;Put it by your father&rsquo;s plate.&rdquo; Two places are laid. Which of them is the father&rsquo;s? Only one chair in this kitchen has arms.'
    ]];
  }

  function begin() {
    if (!ER.flag('tEnd')) ER.flag('tEnd', Date.now());
    paint();

    ER.narrate([
      'The kitchen is warm. The oil lamp is burning in the middle of the table, and there is a red light behind the bars of the range.',
      '&ldquo;I did not light that,&rdquo; says Mrs Bellamy. Nobody has asked her.',
      'The table is laid. There is the plate on the bench side, with the blue-ringed mug. And there is a second plate, at the head of the table, in front of the chair with arms.',

    ], function () { busy = false; });
  }

  /* ---------- the tin ---------- */
  $('#fair').addEventListener('click', function () {
    if (busy) return;
    if (told.tin) { ER.say('Ms Fairweather is holding the receipt by one corner. &ldquo;Tell me where,&rdquo; she says.'); return; }

    ER.narrate([
      'Ms Fairweather puts the tin down on the corner of the table and runs her thumbnail round the lid. The wax comes away in one long curl.',
      'Inside, folded once, there is a single piece of pale green paper, and nothing else. No money. No note.'
    ], function () {
      busy = false;
      ER.read({ html: RECEIPT, cls: 'rcpt', clue: { id: 'receipt', title: 'The receipt for the Michaelmas rent, 1924', kind: 'From the tin' }, done: function () {
        if (!tell('tin')) return;
        paint(); busy = true;
        ER.narrate([
          '&ldquo;&lsquo;Received of Mr Amos Oakes&rsquo;,&rdquo; reads Ms Fairweather. &ldquo;It isn&rsquo;t even in his name.&rdquo;',
          '&ldquo;It was never meant to be,&rdquo; says Miss Lumley. &ldquo;The errand was to pay the Michaelmas rent and bring his father the receipt. The rent is paid: there it is, in ink. The only thing that was ever left undone is the bringing.&rdquo;',
          'Ms Fairweather looks at the table, with its two places, and at the paper in her hand. &ldquo;Then tell me where,&rdquo; she says. &ldquo;I have not come twelve thousand miles to put it down in the wrong place.&rdquo;'
        ], function () { busy = false; ER.say('Where does the receipt go? Click the place.'); });
      } });
    });
  });

  /* ---------- where it goes ---------- */
  var BEFORE = {
    head: 'A second place, at the head of the table, in front of the chair with arms: a plate, a knife and a fork. The plate is warm, as if it had come out of the oven.',
    own: 'His place, on the bench: the plate, and the mug with no letter on it. Somebody has filled the mug. It is tea, and it is hot.',
    lamp: 'The lamp is burning with a steady yellow flame. Mrs Bellamy filled it herself, years ago, and she has never once lit it.',
    book: 'The Bible is lying open on the dresser, at the family register. Nobody remembers opening it.'
  };
  var WRONG = {
    own: '&ldquo;That is his own place,&rdquo; says Mrs Bellamy. &ldquo;The bench, and the mug with no letter. She says to put it by his father&rsquo;s.&rdquo;',
    lamp: '&ldquo;Under the lamp, where anybody might have put it?&rdquo; says Miss Lumley. &ldquo;She says exactly where. She has been exact about everything else.&rdquo;',
    book: '&ldquo;It is not the Book that has been waiting for it,&rdquo; says Mrs Bellamy.'
  };
  var AFTER = {
    head: 'The receipt, beside the plate at the head of the table. Nobody has touched it. One corner of it has lifted, and laid itself flat again.',
    own: 'Ms Fairweather is sitting in the second hollow of the bench, with both hands round the mug that has no letter on it.',
    lamp: 'The lamp burns steadily. There is enough oil in it to last until morning.',
    book: 'The Bible is open at the register. Four children, and four names.'
  };
  ER.$$('.spot').forEach(function (n) {
    n.addEventListener('click', function () {
      var p = n.getAttribute('data-p');
      if (busy) return;
      if (ER.flag('s-done')) { if (p === 'book') { ER.read({ html: register('Edward'), cls: 'bible' }); return; } ER.say(AFTER[p]); return; }
      if (!told.tin) { ER.say(BEFORE[p]); return; }
      if (!ER.check('plate', p)) { ER.sfx.no(); ER.say(WRONG[p]); return; }
      OY.solved(true); OY.sfx.plate(); ER.flag('s-sat', 1); paint(); busy = true;
      ER.narrate([
        'Ms Fairweather lays the receipt down beside the plate at the head of the table, and squares it with one finger. Then she goes round to the bench and sits down in the second hollow, in front of the mug with no letter on it.',
        '&ldquo;Let him speak first,&rdquo; she says, not very loudly. After that nobody says anything at all. The lamp burns. The range ticks as it warms.',
        'Then, on the dresser, there is a small dry sound, like a page being turned.'
      ], function () {
        OY.sfx.strip(); $('#scene').classList.add('named');
        ER.narrate([
          'Miss Lumley is the nearest. She looks down at the open Bible for some time before she says anything. &ldquo;The strip has come away,&rdquo; she says.',
          'Under it there is a line of writing, in the same black ink as Catherine, George and Charlotte: <i>Edward. 12th May 1905.</i>',
          '&ldquo;Flour-and-water paste,&rdquo; says Mrs Bellamy. &ldquo;It never did hold in a warm room, and this kitchen has not been warm since Miss Dora&rsquo;s hip.&rdquo; She thinks about it. &ldquo;Still. It was Amos who wrote the names in that book. So I suppose that is him speaking first.&rdquo;',
          'Ms Fairweather has both hands round the mug. For a long moment she looks at the chair with arms, at the head of the table.',
          '&ldquo;Well,&rdquo; she says. &ldquo;That&rsquo;s the rent paid.&rdquo;'
        ], function () { busy = false; ER.flag('s-done', 1); ER.addClue('register2', 'The family Bible, with the strip gone', register('Edward'), 'bible', 'From the kitchen', true); finish(false); });
      });
    });
  });

  /* ---------- people and things ---------- */
  function say(sel, word, fn) { $(sel).addEventListener('click', function (e) { if (busy) return; if (word) ER.wordAt(e.clientX, e.clientY, word); ER.say(fn()); }); }
  say('#bellamy', null, function () {
    return ER.flag('s-done') ? '&ldquo;Flour-and-water paste,&rdquo; says Mrs Bellamy again. She does not sound like somebody who believes it.' :
      '&ldquo;I shall say this once,&rdquo; says Mrs Bellamy. &ldquo;I filled that lamp, and I blacked that range, and I never lit the one or the other.&rdquo;';
  });
  say('#lumley', null, function () {
    return ER.flag('s-done') ? '&ldquo;I shall catalogue the receipt as: delivered,&rdquo; says Miss Lumley. &ldquo;The Record Office likes a date. I shall put today&rsquo;s.&rdquo;' :
      '&ldquo;Papers first,&rdquo; says Miss Lumley. She does not finish the sentence.';
  });
  say('#fairsit', null, function () { return '&ldquo;The sale is on Thursday,&rdquo; says Ms Fairweather. &ldquo;I have been asking what forty-two pounds ten would come to now. Miss Lumley says: about a pair of horses.&rdquo; She looks out towards the orchard. &ldquo;And next year it is his tree&rsquo;s turn to bear. I should like to be here for that.&rdquo;'; });
  say('#chair', null, function () {
    return ER.flag('s-done') ? 'The chair with arms. Nobody is sitting in it. All the same, Ms Fairweather has not once turned her back on it.' :
      'The chair at the head of the table: the only one with arms. Its cushion is pressed down a little, as a cushion is when somebody has just sat down.';
  });
  say('#pegs', 'peg', function () { return ER.flag('s-sat') || ER.flag('s-done') ? 'Six pegs. On the smooth one, where there is no name, somebody has hung a green jacket.' : 'FATHER, MOTHER, KATE, a smooth peg, GEORGE, LOTTIE. The old hat is still on FATHER.'; });
  say('#window', null, function () { return 'The window is black, with the lamp in it twice: once on the table, and once out among the trees.'; });
  say('#board', null, function () { return 'The year board. It is the twenty-ninth of September, and the tag on that peg says RENT.'; });
  say('#range', 'range', function () { return 'The range is alight, and the kettle on it is beginning to sing.'; });
  say('#mugs', null, function () { return 'K, an empty hook, G and C. The fourth mug is on the table, and it is full.'; });
  say('#bdoor', null, function () { return 'The back door, shut. Mrs Bellamy locked it this afternoon, and found it open this evening, and has decided to say nothing more about it.'; });

  /* ---------- the end ---------- */
  function finish(quick) {
    var st = ER.state(), mins = OY.minutesPlayed(), hn = ER.hintsUsed();
    paint();
    $('#d-time').textContent = 'From the kitchen at four to the kitchen at dusk: ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
    $('#d-hints').textContent = hn ? 'Hints asked for: ' + hn + '.' : 'Hints asked for: none at all.';
    $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' words.';
    $('#done').classList.add('on');
    if (quick) ER.say('The kitchen at Sweetings, with the lamp lit and the rent paid.');
  }
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });
  $('#b-task').addEventListener('click', function () {
    var saved = ER.flag('task') || {}, box = ER.el('div', 'rp');
    var USE = [/\b(first|second|third|fourth|fifth|sixth|last)\b[^.!?]*\bfrom\b/i, /\bnearest\b/i, /\bthe one (that|which|who|with)\b/i, /\bbehind\b/i, /\bbetween\b/i, /\bunder\b/i, /\bas far as\b/i, /\bno further\b/i];
    box.innerHTML = '<h4>Your Place Is Laid &middot; in your own words</h4><h3>As far as, and no further</h3>' +
      '<p>Hannah hid a tin in 1931, and her letter could still be followed ninety-five years later, because every word of it was exact. Now it is your turn. Hide something: in your room, at your school, in your street. Then write the letter that tells one person how to find it, in 70 to 100 words.</p>' +
      '<p>Use at least five of these, and tell the finder one thing that he or she must <i>not</i> do.</p><p class="use">the third &hellip; from &middot; nearest &middot; the one that &hellip; &middot; behind &middot; between &middot; under &middot; as far as &middot; no further</p>' +
      '<textarea id="r1"></textarea><div class="count" id="c1"></div>' +
      '<label for="r2">And one sentence more: what might change in a hundred years, and spoil your letter?</label><input type="text" id="r2" maxlength="220">' +
      '<label for="r3">Name</label><input type="text" id="r3" maxlength="60">' +
      '<div class="foot"><span>Nobody marks this. It is saved in this browser as you write.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > p');
    box.querySelector('#r1').value = saved.r1 || ''; box.querySelector('#r2').value = saved.r2 || ''; box.querySelector('#r3').value = saved.r3 || '';
    function keep() {
      var o = { r1: box.querySelector('#r1').value, r2: box.querySelector('#r2').value, r3: box.querySelector('#r3').value }, n = (o.r1.match(/[A-Za-z’']+/g) || []).length, k = 0, c1 = box.querySelector('#c1');
      USE.forEach(function (re) { if (re.test(o.r1)) k++; });
      c1.textContent = n + (n === 1 ? ' word' : ' words') + ' · ' + k + ' of the eight used' + (n >= 70 && n <= 100 && k >= 5 ? ' · Hannah would follow it.' : '');
      c1.classList.toggle('ok', n >= 70 && n <= 100 && k >= 5);
      ER.flag('task', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
