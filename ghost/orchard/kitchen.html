<style>
  body{--bg:#191813;--accent:#e2b25c;--font-display:'Abril Fatface',serif;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',serif;

  .tc-room{font-size:clamp(44px,6.4vw,88px)}
  #beam{animation:beam 9s steps(1,end) infinite}
  @keyframes beam{0%{opacity:.13}46%{opacity:.1}52%{opacity:.13}80%{opacity:.11}84%{opacity:.13}}
  #bellamy.ready,#board.ready{animation:rdy 1.7s steps(1,end) infinite}
  @keyframes rdy{50%{filter:brightness(1.25)}}
  #tagsv,#latchup{display:none}
  #scene.done #tagsv,#scene.done #latchup{display:block}
  #scene.done #latchdn{display:none}
  #scene.gone #fair{display:none}

  /* the year board: twelve pegs, eleven tin tags, and Hannah's book open beside it */
  .yb{width:min(1190px,96vw);display:flex;gap:18px;align-items:flex-start;-webkit-user-select:none;user-select:none}
  .yb .doc.kbook{flex:1 1 0;width:auto;max-height:none;font-size:19.5px;line-height:25px;padding:22px 24px 14px 30px;
    background:#f3ecd6 repeating-linear-gradient(transparent 0,transparent 24px,#d6cba8 24px,#d6cba8 25px)}
  .yb .doc.kbook h4{font-size:20px;line-height:25px}
  .yb .doc.kbook h4 small{font-size:17.5px}
  .yb-side{flex:0 0 548px}
  .yb-board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 6px;padding:12px 10px 12px;background:#5a4028 linear-gradient(174deg,#7a5a38,#4a3320);border:3px solid #33230f;border-radius:3px;box-shadow:0 22px 60px rgba(0,0,0,.6)}
  .mo{position:relative;text-align:center}
  .mo i{display:block;font-style:normal;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.14em;color:#e9d9b0;text-shadow:0 1px 0 #2a1c0c}
  .mo u{display:block;width:12px;height:12px;margin:3px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9c08a,#5a4426);box-shadow:0 2px 3px rgba(0,0,0,.5)}
  .pegslot{min-height:52px;margin-top:-3px;padding-top:5px;border:1.5px dashed rgba(233,217,176,.35);border-radius:4px;background:rgba(0,0,0,.14)}
  .mo.bad{outline:3px solid #d2452f;outline-offset:1px}
  .yb-tray{display:flex;flex-wrap:wrap;gap:7px;min-height:106px;margin-top:8px;padding:9px;background:#c9b48a linear-gradient(#d6c39a,#b9a276);border-radius:3px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3);align-content:flex-start}
  .tg{position:relative;display:block;width:82px;padding:15px 2px 6px;text-align:center;font-family:'Stardos Stencil',serif;font-weight:700;font-size:12.5px;letter-spacing:.03em;line-height:1.15;color:#23282a;
    background:linear-gradient(160deg,#dfe3e0,#aeb5b2 60%,#8f9794);border:1px solid #6f7775;border-radius:9px 9px 3px 3px;box-shadow:0 3px 6px rgba(0,0,0,.4)}
  .tg:before{content:'';position:absolute;left:50%;top:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#3a2a1a;box-shadow:inset 0 1px 1px #000}
  .pegslot .tg{width:auto;margin:0 2px;box-shadow:0 2px 3px rgba(0,0,0,.4)}
  .yb .pmsg{font-size:17.5px;line-height:1.34;min-height:72px}
</style>

    '<p>A peg for every month, a tag for every job. One peg is bare, and is meant to be.</p>' +

    '<p>We <b>GRAFT</b> in the month of Lady Day, when the sap has begun to rise. An apple never comes true from a pip: sow a Blenheim and a stranger comes up. So every tree here is a twig of the old kind, bound on to a young root.</p>' +
    '<p>The <b>GRAFT-WOOD</b> is cut a month before it is wanted, while the trees are still asleep.</p>' +
    '<p>The month after the grafting has no tag. The grafts are taking, and are to be let alone.</p>' +
    '<p>Then the <b>BLOSSOM</b>. Nobody leans a ladder on a tree until it has fallen.</p>' +
    '<p>As soon as the blossom is over we <b>MOW</b> the orchard for hay.</p>' +
    '<p>The <b>RENT</b> tag hangs on the month of Michaelmas. (Rent is paid at Lady Day, 25th March, and at Michaelmas, 29th September. Amos made the one tag, and hung it where there is fruit to pay with.)</p>' +
    '<p>The first apples, the <b>EARLIES</b>, are picked the month before Michaelmas; the <b>KEEPERS</b> the month after it, before the hard frosts.</p>' +
    '<p>We <b>THIN</b> the young fruit in the one month between the mowing and the first picking.</p>' +
    '<p><b>CIDER</b> is made when the keepers have been a month in the loft.</p>' +

  ER.init({
    theme: 'ghost', story: 'orchard', storyTitle: 'Your Place Is Laid', id: 'kitchen', no: 'I', title: 'The Kitchen',

  function hints() {
    if (nextFile) return ['go', ['The latch of the back-stairs door has lifted. Go up: the button at the bottom of the screen.']];
    if (yb && yb.isOpen()) return ['year', [
      'Three days in Hannah&rsquo;s book are real dates: Old Twelfth Night, Lady Day and Michaelmas. Hang those three tags first. Every other job is a month before something, or a month after it, or between two things.',
      'Work outwards from the grafting. The graft-wood is cut a month before it is wanted. The month after the grafting is the bare one. &ldquo;Then the blossom&rdquo;: so the blossom comes in the month after the bare one, and the mowing as soon as the blossom is over.',

      'Mrs Bellamy wants the tags hung on the year board again, as Hannah has them in her kitchen book. The book is on the dresser, beside the big black Bible. Read it. Then find the board.',

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('Eleven tags on twelve pegs, and the latch of the back-stairs door is up.'); return; }
    if (told.in) { busy = false; ER.say('The kitchen at Sweetings, a little after four.'); return; }

    ER.narrate([
      'A farmhouse kitchen: a stone floor, a black range, and a table long enough for ten. Nobody has lived here since Miss Dora Oakes died, the winter before last, at ninety-two.',

  }

  /* ---------- the living ---------- */
  $('#bellamy').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Go on up,&rdquo; says Mrs Bellamy. &ldquo;I shall stop down here. I have never been up those stairs, and I am not starting on a Tuesday.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Bellamy', role: 'Brook Farm, next door · she has the key', face: window.FACE('bellamy'),
      lines: [
        { note: 'She nods at the table without looking at it.', a: '&ldquo;There you are. I left it this morning, for you to see. One place, the same as every night. Plate, knife, fork, his mug, and the salt by his right hand.&rdquo;' },
        { q: 'Who lays it?', a: 'Nobody. I clear it at eight every morning and put the things back on the dresser. By the time the lamp would have been lit, it is laid again. I have been coming in for eleven years, ever since Miss Dora&rsquo;s hip, and it has not missed a night. I have stopped telling my husband.' },
        { q: 'What did Miss Dora say about it?', a: 'Miss Dora was George Oakes&rsquo;s girl, and she lived ninety-two years in this house. She said her grandmother Hannah laid that place every night of her life. When the old lady died, in fifty-one, it went on being laid. Miss Dora never laid it herself. She was very clear about that.' },
        { q: 'Laid for whom?', a: '&ldquo;For the one who went on an errand.&rdquo; That was all she would say, and I do not think she knew any more. Nobody in this family ever said his name. Not once, in my hearing.' },
        { q: 'Are there any papers?', a: 'If there are, they are up the back stairs, in the room that was kept shut. And that door has stuck fast since the tags came off the year board. Miss Dora took them down to clean in 2019, and she could not get them back in their order. I am not saying that the one has to do with the other. I am saying that I have noticed.' },
        { a: 'Old Amos made that board: a peg for every month, and a tag for every job in the orchard. His wife wrote the whole year out in her kitchen book, and the book is on the dresser. Hang the tags as she has them, and we shall see about that door. Hannah Oakes liked a thing in its place.' }
      ],
      clue: { id: 'bellamy', title: 'Mrs Bellamy: one place, every night', kind: 'What she said' },
      done: function (seen) { if (seen && tell('bellamy')) { paint(); ER.say('The year board is over the range. Hannah&rsquo;s kitchen book is on the dresser, beside the Bible.'); } }
    });
  });
  $('#lumley').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Papers first, ghosts afterwards,&rdquo; says Miss Lumley. She has one foot on the bottom stair already.' :
      told.bellamy ? '&ldquo;I am from the Record Office,&rdquo; says Miss Lumley. &ldquo;I do not hold with ghosts until they are in writing. But I should like that door open. Hang the tags.&rdquo;' :
      '&ldquo;Mrs Bellamy first,&rdquo; says Miss Lumley. &ldquo;The person with the key always knows more than the person with the catalogue.&rdquo;');
  });
  $('#fair').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'A visitor', role: 'at the back door, with a rucksack', face: window.FACE('fair'),
      lines: [
        { note: 'A woman in a green jacket is standing in the doorway, like somebody who has knocked twice and given it up.', a: '&ldquo;Sorry to walk in. Is this the way to the church? My phone says that I have arrived, and I can see for myself that I haven&rsquo;t.&rdquo;' },
        { note: '&ldquo;Field path, behind the orchard,&rdquo; says Mrs Bellamy. &ldquo;Ten minutes. Are you here for the viewing? The sale is on Thursday.&rdquo;', a: '&ldquo;I&rsquo;m here for the churchyard first. I&rsquo;m looking for somebody. I couldn&rsquo;t tell you that he&rsquo;s there.&rdquo;' },
        { q: 'Have you come far?', a: 'Hawke&rsquo;s Bay. That&rsquo;s in New Zealand. And then two days in a hired car, finding a farm that is on no map I own. At home they would say that I had gone for the rent.' },
        { q: 'Gone for the what?', a: 'Gone for the rent. It&rsquo;s what my family says when somebody is a very long time coming. Don&rsquo;t ask me why. Nobody ever told me.</p><p>She looks at the table, and at the one place laid on it, for a moment longer than a stranger would. Then she thanks Mrs Bellamy, and goes.' }
      ],
      clue: { id: 'visitor', title: 'A visitor at the back door', kind: 'What she said' },
      done: function (seen) { if (seen && tell('fair')) paint(); }
    });
  });

  /* ---------- things in the kitchen ---------- */
  OY.thing('#place', null, 'One place: a plate, a knife and fork, a mug with a blue ring, and the salt at the right hand. The plate is cold, and so is the mug. Nobody has eaten here.', isBusy);
  OY.thing('#chair', null, 'The chair at the head of the table is the only one with arms. Nobody sits in it. Mrs Bellamy dusts it standing up.', isBusy);
  OY.thing('#bench', 'bench', 'A bench runs along the far side of the table, worn into four shallow hollows. The place is laid in front of the second one.', isBusy);
  OY.thing('#pegs', 'peg', 'Six pegs by the door, each with a name burnt into the wood: FATHER, MOTHER, KATE, then a peg that has been planed smooth, then GEORGE and LOTTIE. A man&rsquo;s old hat hangs on FATHER. On the smooth peg there is nothing at all, not even dust.', isBusy);
  OY.thing('#mugs', null, 'Four hooks under the shelf, and three mugs: K, then an empty hook, then G and C. The fourth mug is the one on the table. Where its letter was, the blue has been scraped away.', isBusy);
  OY.thing('#frame', null, 'Somebody has cut the children&rsquo;s heights into the door frame, with a letter beside each mark: K, G, C. Beside one ladder of marks the letter has been cut out with a chisel. Its top mark is a hand higher than any of George&rsquo;s.', isBusy);
  OY.thing('#range', 'range', 'The range: black iron, and as cold as a stone. Nobody has lit it since Miss Dora went.', isBusy);
  OY.thing('#lamp', 'oil lamp', 'An oil lamp, in the middle of the table. The electricity came to Sweetings in 1958, and it was turned off at the meter last year. There is oil in the lamp.', isBusy);

  OY.thing('#bdoor', null, function () { return told.fair || nextFile ? 'The back door, and the yard. The woman in the green jacket has gone by the field path.' : 'The back door, standing open. Somebody is standing in it.'; }, isBusy);
  OY.thing('#sdoor', 'latch', function () { return nextFile ? 'The latch is up. The stairs are narrow, and they smell of apples.' : 'The door to the back stairs: four planks and an iron latch. It does not move. It does not even rattle.'; }, isBusy);

  /* ---------- the year board: eleven tags on twelve pegs ---------- */
  function makeBoard() {
    /* which peg is looked at first: the three with real dates, and then outwards from them */
    var SCAN = [1, 3, 9, 2, 4, 5, 6, 8, 10, 7, 11, 12];
    var WHY = {
      1: 'January has one job, and it is done at night with a jug of cider. She gives you the very day for it.',
      2: 'February is the month before the grafting. What has to be cut a month before it is wanted?',
      3: 'March is the month of Lady Day: the twenty-fifth. She tells you in plain words what we do in the month of Lady Day.',
      4: 'April is the month after the grafting. Read what she says about that month.',
      5: 'May comes after the bare month. &lsquo;Then the blossom&rsquo;, she says, and nobody touches a tree while it is out.',
      6: '&lsquo;As soon as the blossom is over.&rsquo; That is the very next month, and there is grass to cut.',
      7: 'July is the one month between two jobs. Find the two jobs, and you have the third.',
      8: 'August is the month before Michaelmas. What is picked the month before Michaelmas?',
      9: 'September has Michaelmas in it: the twenty-ninth. What is paid at Michaelmas?',
      10: 'October is the month after Michaelmas, with the hard frosts coming. Which apples are picked then?',
      11: 'By November the keepers have been a month in the loft. What is made then?',
      12: 'December is the last peg of the year. What does Amos do last of all, when the leaves are down?'
    };
    /* how each tag is written down in your own note, once the board is right */
    var JOB = { wassail: 'wassail (Old Twelfth Night, the 17th)', wood: 'the graft-wood is cut', graft: 'grafting (and Lady Day, the 25th: rent)', blossom: 'blossom', mow: 'mowing', thin: 'thinning',
      earlies: 'the earlies are picked', rent: 'Michaelmas, the 29th: rent', keepers: 'the keepers are picked', cider: 'cider', prune: 'pruning' };
    var hung = ER.flag('k-hung') || {}, wait = false, box = ER.el('div', 'yb'), s;
    s = '<div class="doc kbook">' + ER.gloss(BOOK) + '</div><div class="yb-side"><div class="yb-board">';
    MONTHS.forEach(function (m, i) { s += '<div class="mo" data-m="' + (i + 1) + '"><i>' + m + '</i><u></u><div class="pegslot" data-m="' + (i + 1) + '"></div></div>'; });
    s += '</div><div class="yb-tray"></div><div class="pfoot"><p class="pmsg"></p><button type="button" class="btn" id="y-go">Show Mrs Bellamy</button></div></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.yb-tray'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function slot(m) { return box.querySelector('.pegslot[data-m="' + m + '"]'); }
    TAGS.forEach(function (t) {
      var n = ER.el('span', 'tg dnd-item', t[1]), at = 0, m;
      n.setAttribute('data-t', t[0]);
      for (m = 1; m <= 12; m++) if (hung[m] === t[0]) at = m;
      (at ? slot(at) : tray).appendChild(n);
    });
    function key() { var a = [], m; for (m = 1; m <= 12; m++) a.push(hung[m] || 'none'); return a.join('|'); }
    function read() {
      var m, t; hung = {};
      for (m = 1; m <= 12; m++) { t = slot(m).querySelector('.tg'); if (t) hung[m] = t.getAttribute('data-t'); }
      ER.flag('k-hung', hung); box.setAttribute('data-hung', key());
    }
    ER.dnd(box, { item: '.tg', slot: '.pegslot', home: tray, lock: function () { return wait || !!nextFile; }, change: function () { read(); OY.sfx.tag(); msg(''); } });
    OY.swapClick(box, '.tg', '.pegslot');
    box.querySelector('#y-go').addEventListener('click', function () {
      var left = tray.querySelectorAll('.tg').length, i, m, v, file;
      if (wait || nextFile) return;
      read();
      if (left) { msg('&ldquo;' + (left === 11 ? 'Eleven tags in the drawer, and not one on the board' : left === 1 ? 'There is one tag still lying in the drawer' : 'There are ' + left + ' tags still lying in the drawer') + ',&rdquo; says Mrs Bellamy. &ldquo;Amos made eleven, and he hung eleven.&rdquo;'); return; }
      for (i = 0; i < SCAN.length; i++) {
        m = SCAN[i]; v = hung[m] || 'none';
        if (!ER.check('m' + m, v)) {
          ER.sfx.no(); OY.flash(slot(m).parentNode);
          if (v === 'none') msg('Mrs Bellamy taps a bare peg. &ldquo;Nothing on ' + FULL[m] + '? One peg is bare, but it is not that one. ' + WHY[m] + '&rdquo;');
          else { msg('Mrs Bellamy lifts one tag off again, and looks at the book over your shoulder. &ldquo;' + WHY[m] + '&rdquo;'); tray.appendChild(slot(m).querySelector('.tg')); read(); }
          return;
        }
      }
      file = ER.exit([key()], { wait: true });
      if (!file) { msg('The door will not open. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('k-file', file);
      msg('Mrs Bellamy reads along the board with her lips moving: the top row, and then the bottom.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true; OY.sfx.latch();
        ER.narrate([
          '&ldquo;January to December, and the one peg bare,&rdquo; says Mrs Bellamy. &ldquo;That is how it hung when I first came into this kitchen.&rdquo;',
          'Behind you there is a small dry click. The latch of the back-stairs door has lifted. Nobody is standing near it.',
          'Mrs Bellamy does not turn round. &ldquo;There,&rdquo; she says. &ldquo;I said that I had noticed.&rdquo;',
          'Miss Lumley writes something in her notebook, looks at it, and crosses it out. &ldquo;I shall put: door opened.&rdquo; She picks up her box.',
          'The stairs are narrow, and they smell of apples.'
        ], function () {
          busy = false;
          OY.mine('year', 'The orchard year at Sweetings', FULL.slice(1).map(function (mn, k) { return '<p><b>' + mn + '</b> ' + (hung[k + 1] ? JOB[hung[k + 1]] : 'nothing: the bare peg') + '</p>'; }).join(''));
          OY.terms(['wassail', 'graft', 'Lady Day', 'Michaelmas', 'keepers', 'earlies', 'blossom', 'prune']); showGo();
        });
      }, 2600);
    });
    read();
    msg(Object.keys(hung).length ? 'The year board, with some of the tags back on their pegs. Drag a tag to a peg, or click the tag and then the place under the peg.' :
      'Twelve pegs, eleven tin tags, and Hannah&rsquo;s book. Hang each tag under its month. Drag it, or click the tag and then the place under the peg.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
})();
