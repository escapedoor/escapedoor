  .lt .doc.han{font-size:20.5px;line-height:1.14;padding:16px 30px 12px}

  .lt .doc.han p{margin:0 0 6px}
  .lt .doc.han .ps{font-size:18.5px}
  .lt-side{flex:0 0 492px}

  .lslot{flex:1;min-height:42px;border:1.5px dashed rgba(233,217,176,.35);border-radius:3px;background:rgba(0,0,0,.18)}
  .lt-item,.lt-fixed{display:block;min-height:40px;padding:9px 14px 6px;background:#e9e2cc linear-gradient(168deg,rgba(255,255,255,.5),rgba(120,100,60,.16));color:#2b3148;font-family:'Architects Daughter',cursive;font-size:16.5px;line-height:1.2;
    border:1px solid #a89f86;box-shadow:0 3px 6px rgba(0,0,0,.4)}
  .lt-item.cur,.lt-fixed.cur{box-shadow:0 0 0 3px #f1d98a,0 3px 6px rgba(0,0,0,.4)}
  .lt-fixed{position:relative;cursor:pointer}
  .lt-fixed:after{content:'';position:absolute;right:12px;top:9px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e7ae,#8a6a26);box-shadow:0 2px 2px rgba(0,0,0,.4)}
  .lt-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:100px;margin-top:8px;padding:8px;background:#aab6b4 linear-gradient(#b9c5c3,#93a09e);border-radius:3px;align-content:flex-start}
  .lt-tray .lt-item{width:calc(50% - 3px)}
  .lt .pmsg{font-size:17.5px;line-height:1.34;min-height:96px}

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, lt = null, told = {};

  /* Seven letters in one hand. The id says what the letter is about, and nothing about when it was written. */
  var L = {
    f: { head: 'Tuesday night', body:
      '<p>Dear Mother,</p><p>I do not know how to begin, so I shall begin with the worst. The rent is gone. I never reached the Talbot. There was a man at the fair with three thimbles and a pea, and I thought to turn one pound into two. I am nineteen years old, and I have lost forty-two pounds ten in an afternoon.</p>' +
      '<p>I cannot come home without it. I do not know yet what Father will say, and I am in no hurry to hear it.</p>' +
      '<p>I send this under cover to Aunt Esther. She is your sister and not his, and may keep a thing from him with a clear conscience.</p><p class="sig">Your sorry son, Ned</p>' },
    d: { head: 'Saturday', body:
      '<p>Dear Mother,</p><p>Aunt&rsquo;s letter found me. She says she has kept the Post Office alone since her late husband&rsquo;s time and never lost a letter yet, so I am to write through her.</p>' +
      '<p>So Father has sold Duke and Bonny to pay it, and I am not to be named in the house until that errand is done. I have earned both.</p>' +
      '<p>As I told you in my last, I will not come home with empty hands. I have been two months at the docks, carrying other men&rsquo;s sacks. I have never yet been further out than the end of the pier.</p>' +
      '<p>You will be making the cider now. Do not give George my boots.</p><p class="sig">Your loving son, Ned</p>' },
    l: { head: 'Lady Day', body:
      '<p>Dear Mother,</p><p>Rent day again, and you will know what I am thinking of.</p>' +
      '<p>Tomorrow I go to sea. A steamer in the New Zealand trade wants a deck hand who can lift, and the mate did not ask what else I could do. They pay better than the docks, and there is nothing to spend it on.</p>' +
      '<p>Father will be grafting this week, with George to hold the string. George is a steady lad. He is the younger of us two, and he never thought to have the farm. He may have to think of it now.</p><p class="sig">Your loving son, Ned</p>' },
    s: { head: 'At sea, a Sunday', body:
      '<p>Dear Mother,</p><p>I had been six months at the docks when this ship took me, and now I have been a year at sea. I shall be one-and-twenty on the twelfth of May. There will be no blossom where I am going, and nobody to say that I have grown.</p>' +
      '<p>I was christened for Grandfather Winterbourne, and he kept the name clean for seventy years. I have made a poor start with it.</p>' +
      '<p>So Kate is to be married in June. Tell her that Harry Bellamy is a brave man. She was seven when I was born, and she has ordered me about ever since.</p><p class="sig">Your loving son, Ned</p>' },
    w: { head: 'Old Twelfth Night', body:
      '<p>Dear Mother,</p><p>You will all be out in the orchard tonight with the cider and the toast. Here it is midsummer, and the apples on the trees are half grown. I cannot get used to it.</p>' +
      '<p>Your last was four months finding me. So Kate has been Mrs Bellamy for a year and a half, and I have only now drunk her health.</p>' +
      '<p>It is more than three years since I went. I have twenty pounds put by. It is not yet the half.</p>' +
      '<p>This may be my last for some time: we are to go on up the coast.</p><p class="sig">Your loving son, Ned</p>' },
    p: { head: 'August, the 20th', body:
      '<p>Dear Mother,</p><p>You will be picking the first apples, and Father will be saying that they are not what they were.</p>' +
      '<p>I am four-and-twenty, and second mate of nothing.</p>' +
      '<p>So Kate has a boy, and Uncle Abel has given up Hill End, and his girl has had the dairy at Sweetings since Lady Day. Ellen will do well. She always had more sense than I had.</p>' +
      '<p>Does Father ever speak of me? You never say, so I know the answer. By the time the keepers are in, I shall have been gone five years.</p><p class="sig">Your loving son, Ned</p>' },
    g: { head: 'The first week of March', body:
      '<p>Dear Mother,</p><p>You will be grafting, and George will hold the knife as if it might bite him.</p>' +
      '<p>I have it. Forty-two pounds ten, the same that I went out with. It was six years last Michaelmas, and I had thought to be home long before.</p>' +
      '<p>But Kate has told me what Father says: that I may sit at his table when I have paid that rent and brought him the receipt. The rent was paid years ago. Then the errand cannot be done, and he knows it.</p>' +
      '<p>I shall not write again. If ever I see a way to do it, I shall come to Aunt&rsquo;s door first, and I shall send no word before me.</p><p class="sig">Your loving son, Ned</p>' }
  };
  var PIN = '<div class="pin">Hannah. This came for you under cover to me, <b>Thursday 2nd October 1924</b>. I have not read it, and I do not need to. Keep it or burn it, but do not let Amos see it. I shall take in any more that come. I am the younger of us two, but I was never the sillier. E.</div>';
  var MOTHER = '<div class="env">For my son, when he comes</div><h4>Sunday. The blossom is out.</h4><p>My dear boy,</p>' +
    '<p>Your father has my promise that I will not say your name, and I do not write it. He never asked me not to feed you. Your place has been laid every night since you went, and it will be seven years this Michaelmas. You will be six-and-twenty on Tuesday.</p>' +
    '<p>He says you may sit at his table when you have paid that rent and brought him the receipt. He says it because he thinks it cannot be done. It can. He was laid up, and I carried the price of Duke and Bonny to the Estate Office myself. The receipt came home in my pocket. He has never asked for it, and it has never been put into his hand.</p>' +
    '<p>So come by the field path, at dusk. Do not come to the door. Go in at the orchard gate and take the row nearest the house. Pass two trees. The third is yours: one of the two that he grafted the spring you were born, and the nearer to the gate. Do not look under it: George mows there. Go round behind it, so that it stands between you and the kitchen window, and walk straight on as far as the bee wall, and no further. At the foot of the wall lie three flat stones. It is under the one between the other two. You will need no spade.</p>' +
    '<p>Bring it in at the back door. Put it by your father&rsquo;s plate, sit down in your own place, and let him speak first.</p><p class="sig">Your loving Mother</p>' +
    '<p class="ps">I leave this with your aunt, since you say you will come to her door first.</p>';
  var ALMAN = '<h4>SEPTEMBER 1924</h4><h5>LEDMINSTER SEED STORES · EVERYTHING FOR THE FARM</h5><table><tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th>SUN</th></tr>' +
    '<tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr><tr><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td></tr><tr><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td></tr>' +
    '<tr><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td></tr><tr><td class="ring">29</td><td>30</td><td></td><td></td><td></td><td></td><td></td></tr></table>' +
    '<p class="ink">29th. Michaelmas. Rent, at the Talbot. N. to go, my back being bad. A. O.</p>';

  (function () {
    var s = '', i, x, r, c, COL = ['#8c3a34', '#3d5a7a', '#d9cdb0', '#6b7a52', '#c9a66a', '#5a4a6a', '#e9e3d2', '#a8584a'];
    for (i = -14; i < 30; i++) { x = i * 104 - 300; s += '<path d="M' + x + ' 640L' + OY.num(800 + (x - 800) * 3.26) + ' 1340"/>'; }
    $('#boards').innerHTML = s; s = '';
    for (i = 0; i < 6; i++) s += '<path d="M110 ' + (258 + i * 12.500) + 'h100"/>';
    for (i = 0; i < 8; i++) s += '<path d="M' + OY.num(110 + i * 14.300) + ' 258v62.500"/>';
    $('#almgrid').innerHTML = s; s = '';
    for (r = 0; r < 3; r++) for (c = 0; c < 5; c++) {
      x = 588 + c * 48 + r * 9;
      if (r === 1 && c === 2) s += '<circle cx="' + x + '" cy="' + (368 + r * 36) + '" r="24" fill="#8c3a2c"/><g fill="#d2452f"><circle cx="' + (x - 8) + '" cy="' + (362 + r * 36) + '" r="3.500"/><circle cx="' + (x + 7) + '" cy="' + (372 + r * 36) + '" r="3.500"/><circle cx="' + (x + 2) + '" cy="' + (356 + r * 36) + '" r="3"/></g>';
      else s += '<circle cx="' + x + '" cy="' + (368 + r * 36) + '" r="24" fill="' + ['#5f7a4a', '#6b8a52', '#557044'][(r + c) % 3] + '"/>';
    }
    $('#wtrees').innerHTML = s; s = '';

  /* ---------- Miss Lumley, and the tin box ---------- */

        { note: 'She unties the tape and lays the letters out on the quilt, without hurrying.', a: '&ldquo;Seven letters in one hand, and not one of them has a year on it. And no envelopes. An envelope has a postmark, and a postmark says where. Somebody in this house did not want that known.&rdquo;' },

        { a: 'The first is easy. Somebody has pinned a note to it, and she pinned it to the first that came. Put the other six in their order behind it. I shall tell you when you are wrong. I shall not tell you where.' }

      l: 'In one letter he &lsquo;has been two months at the docks&rsquo;, and they are making cider at home. In another it is Lady Day, and tomorrow he goes to sea. He went at Michaelmas. Which comes first after Michaelmas: the cider, or Lady Day?',

      side.innerHTML = s; tray = side.querySelector('.lt-tray');
      TRAY.forEach(function (id) {
        var n = ER.el('span', 'lt-item dnd-item', L[id].head), at = slots.indexOf(id);

      ER.dnd(side, { item: '.lt-item', slot: '.lslot', home: tray, lock: function () { return wait || !!ER.flag('b-stage'); }, change: function () { read(); OY.sfx.card(); msg(''); } });
      OY.swapClick(side, '.lt-item', '.lslot');

        '<div class="wheels">' + wheel('day') + wheel('month') + wheel('year') + '</div></div><div class="pfoot"><p class="pmsg"></p><button type="button" class="btn" id="l-go2">Show Miss Lumley</button></div>';
      paintDate();
      msg('&ldquo;Now hers,&rdquo; says Miss Lumley. &ldquo;She has written <i>Sunday</i> at the top, and nothing else. I want a day, a month and a year on my slip. It is all in there.&rdquo;');
    }

      var it = e.target.closest ? e.target.closest('.lt-item,.lt-fixed') : null, b = e.target.closest ? e.target.closest('.whl button') : null, w, d;

      else if (!ER.check('month', String(date[1]))) { w = 'month'; why = '&lsquo;The blossom is out.&rsquo; You hung the blossom on its peg not an hour ago. And she says that his birthday is on Tuesday: he tells her himself, in one of his letters, when his birthday is.'; }
      else if (!ER.check('day', String(date[0]))) { w = 'day'; why = '&lsquo;You will be six-and-twenty on Tuesday.&rsquo; In the letter that he wrote at sea, he gives the day of the month. She is writing on the Sunday before that Tuesday.'; }
      if (w) { ER.sfx.no(); OY.flash(side.querySelector('.whl[data-w=' + w + ']')); msg('Miss Lumley holds her pencil over the slip, and does not write. &ldquo;' + why + '&rdquo;'); return; }
      file = ER.exit([slots.join('-') + '>' + date.join('.')], { wait: true });

      setTimeout(function () {

          '&ldquo;Sunday ' + date[0] + ' ' + MONTHN[date[1]] + ' ' + date[2] + ',&rdquo; says Miss Lumley. &ldquo;Seven years of his letters, and then one of hers, which he never had. She left it with the aunt at the Post Office, for him to call for. He never called.&rdquo;',
          '&ldquo;So that is the errand. He was sent to pay the Michaelmas rent in 1924, at nineteen, and he lost it at a fair. His father would not have him named until the errand was done.&rdquo; She looks at the bed, which is made. &ldquo;And they kept that word, all of them. I have seldom seen a word so well kept.&rdquo;',

        ], function () {
          busy = false;
          ER.addClue('last', 'Hannah’s letter: “For my son, when he comes”', MOTHER + '<p class="ps">Record Office slip: written on Sunday ' + date[0] + ' ' + MONTHN[date[1]] + ' ' + date[2] + '. Never posted.</p>', 'han', 'From the tin box');
