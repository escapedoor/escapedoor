  var CARD5 = '<h4>Five questions before you believe it</h4>' +
    '<p><b>1. Where does it come from?</b> A claim with no source is only a claim, however well it is written.</p>' +
    '<p><b>2. Does the source exist?</b> Find the book in the catalogue, and open it at the page. A citation (a book and a page) is only useful if the book is real.</p>' +
    '<p><b>3. Who wrote it, and how do they know?</b> A reliable source has somebody behind it who knows: a scientist&rsquo;s book, a museum, your teacher&rsquo;s notes. A page with no author and no date, or a friend&rsquo;s homework, is not reliable.</p>' +
    '<p><b>4. When was it written?</b> Knowledge changes. An old book can be out of date.</p>' +
    '<p><b>5. Do two good sources agree?</b> Then you can be fairly sure.</p>' +
    '<p class="hand">P. Ibarra, Librarian. Please return this card.</p>';
  $('#bookmark').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD5, cls: 'mg-card', clue: { id: 'five', title: 'Mrs Ibarra’s five questions', kind: 'On her desk' }, done: function () {
      MG.terms(['claim', 'source', 'citation', 'catalogue', 'reliable']);
      if (tell('bookmark')) { paint(); ER.say('Where from? Does it exist? Who knows? When? Do two agree?'); }
    } });
  });

  var LOG = '<h4>Leo&rsquo;s chat with Magpie &middot; Thursday afternoon (part of it)</h4>' + MG.chat([
    ['me', 'how far is the moon from earth'], ['bot', 'The Moon is about 384,000 km (384 thousand kilometres) from the Earth, on average.'],
    ['me', 'when did galileo see the phases of venus'], ['bot', 'Galileo saw the phases of Venus in 1609, soon after he made his first telescope. This helped to show that Venus goes round the Sun.'],
    ['me', 'which planet is the hottest'], ['bot', 'The hottest planet is Mercury. It is the closest planet to the Sun.'],
    ['me', 'why is mercury the hottest planet'], ['bot', 'Mercury is the hottest planet because it is the closest planet to the Sun. As one astronomer put it, &ldquo;Mercury is the furnace of the Solar System.&rdquo; (Source: The Hot Planets, Dr A. Burrows, 2014, page 42)'],
    ['me', 'how many planets are there'], ['bot', 'There are eight planets in the Solar System. Pluto was called a planet until 2006. It is now a dwarf planet.']]);
  $('#leo').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Three hundred and eighty-four thousand,&rdquo; says Leo, to his laptop. &ldquo;Thousand.&rdquo;'); return; }
    ER.read({ html: LOG, cls: 'mg-log', clue: { id: 'log', title: 'Leo’s chat with Magpie (the log)', kind: 'On Leo’s laptop' }, done: function () {
      if (tell('log')) { paint(); ER.say('&ldquo;That&rsquo;s everything it said,&rdquo; says Leo. &ldquo;Word for word. Mr Ruskin calls it the log.&rdquo;'); }
    } });
  });

  var DOCS = {
    handout: { cls: 'mg-handout', title: 'Dr Fairley’s handout', kind: 'On the reading table', html: '<h4>Year 8 &middot; The Solar System &middot; revision notes</h4><h5>Dr H. Fairley &middot; given out on Monday &middot; READ THESE</h5><table>' +
      '<tr><td class="n">1</td><td>The Sun is a star, about 150 million km from the Earth. Its light takes about 8 minutes to reach us.</td></tr>' +
      '<tr><td class="n">2</td><td>There are eight planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. Since 2006 Pluto has been called a dwarf planet.</td></tr>' +
      '<tr><td class="n">3</td><td>Venus is the hottest planet: about 465 °C at the surface. Its thick atmosphere, mostly carbon dioxide, traps the heat.</td></tr>' +
      '<tr><td class="n">4</td><td>Mercury is the closest planet to the Sun. It has almost no atmosphere, so it cannot keep its heat: up to 430 °C by day, about &minus;180 °C at night.</td></tr>' +
      '<tr><td class="n">5</td><td>The Moon is about 384,000 km from the Earth. It goes round the Earth about once a month.</td></tr>' +
      '<tr><td class="n">6</td><td>We have seasons because the Earth&rsquo;s axis is tilted.</td></tr></table>' },
    book: { cls: 'mg-book', title: 'Library book: The Planets (2019)', kind: 'On the trolley', html: '<h4>The Planets</h4><h5>Dr Anita Rao &middot; Brightwater Press, 2019 &middot; library number 523.4 RAO</h5><div class="two"><div>' +
      '<p>In 1609 Galileo Galilei heard about a Dutch invention, a tube that made far things look near, and built telescopes of his own. In 1610 he saw that Venus has phases, like the Moon: sometimes a thin crescent, sometimes nearly full. That could only happen if Venus goes round the Sun.</p><span class="pg">page 12</span></div><div>' +
      '<p>Venus is the hottest planet in the Solar System. At the surface it is about 465 °C, hot enough to melt lead, by day and by night. Its thick atmosphere, mostly carbon dioxide, traps the Sun&rsquo;s heat like a blanket.</p>' +
      '<p>Mercury is closer to the Sun, but it has almost no atmosphere to hold the heat, so its night side cools to about &minus;180 °C.</p><span class="pg">page 31</span></div></div>' },
    label: { cls: 'mg-label', title: 'Museum label: Galileo’s telescope', kind: 'In the glass case', html: '<h4>A telescope like Galileo&rsquo;s</h4><h5>COPY, MADE 1990 &middot; LENT BY THE COUNTY MUSEUM SCHOOLS SERVICE</h5>' +
      '<p>Galileo Galilei (1564&ndash;1642) built his first telescope in 1609, after hearing of a Dutch one.</p><p>In January 1610 he saw four moons going round Jupiter. Later in 1610 he saw that Venus has phases, like our Moon.</p><p>Both were evidence that not everything in the sky goes round the Earth.</p><p><i>Please do not lean on the glass.</i></p>' },
    website: { cls: 'mg-web', title: 'A website printout', kind: 'On the reading table', html: '<h4>TOP 100 AMAZING SPACE FACTS!!!</h4>' +
      '<p><b>17.</b> Mercury is the HOTTEST planet because it&rsquo;s closest to the Sun!!</p><p><b>18.</b> Galileo invented the telescope in 1609!</p><p><b>19.</b> The Sun is a giant ball of fire!</p>' +
      '<p class="ad">YOU WON&rsquo;T BELIEVE FACT 54!!! CLICK HERE</p><small>No author. No date. At the bottom: &ldquo;Copy and share these facts with your friends!&rdquo; Printed in the library at 17.42.</small>' },
    oldbook: { cls: 'mg-old', title: 'Science Today (1998)', kind: 'On the reading table', html: '<h4>The nine planets</h4><h5>Science Today, Book 2 &middot; printed 1998 &middot; page 112</h5>' +
      '<p>The Sun has nine planets. In order from the Sun they are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune and Pluto.</p><p>Pluto is the smallest planet, and usually the farthest from the Sun.</p><p><i>Stamped inside the cover: SALLOWFIELD SCHOOL &middot; STORE ROOM.</i></p>' },
    catalogue: { cls: 'mg-cat', title: 'The catalogue: no Hot Planets', kind: 'On Mrs Ibarra’s desk', html: '<h4>SALLOWFIELD SCHOOL LIBRARY &middot; CATALOGUE</h4>' +
      '<p class="q">&gt; title: The Hot Planets</p><p class="none">0 results in this library.<br>0 results in the county libraries (31 libraries searched).</p>' +
      '<p class="q">&gt; author: Burrows</p><p class="none">0 results.</p><p>Did you mean: Burrell, J. &mdash; Rivers of Britain (1987)?</p>' +
      '<p class="q">&gt; subject: planets</p><p>4 results. The Planets &middot; Rao, A. &middot; 2019 &middot; 523.4 RAO &middot; on the returns trolley<br>Our Solar System &middot; 2021 &middot; 523.2 &middot; on loan<br>Science Now &middot; 2016 &middot; 500 &middot; class sets, Lab S2<br>Stargazing for Beginners &middot; 2018 &middot; 520 &middot; on the shelf</p>' }
  };
  var SAY = { handout: 'Six numbered lines, and READ THESE at the top in red.', book: 'Pages 12 and 31, with a library number on the spine.', label: 'A museum label: who made it, and when.',
    website: 'No author, no date, and fact 54 that you won&rsquo;t believe.', oldbook: 'SCIENCE TODAY, printed in 1998. Nine planets.', catalogue: 'Nothing called The Hot Planets. Not here, not in thirty-one libraries.' };
  SRC.forEach(function (k) {
    var sel = { handout: '#handout', book: '#book', label: '#case', website: '#website', oldbook: '#oldbook', catalogue: '#catalogue' }[k];
    $(sel).addEventListener('click', function () {
      if (busy) return;
      var d = DOCS[k];
      ER.read({ html: d.html, cls: d.cls, clue: { id: k, title: d.title, kind: d.kind }, done: function () { if (tell(k)) { paint(); ER.say(SAY[k]); } } });
    });
  });
  var ELIZA = '<h4>Book of the week</h4><h5>JOSEPH WEIZENBAUM &middot; COMPUTER POWER AND HUMAN REASON (1976)</h5>' +
    '<p>In 1966 Joseph Weizenbaum, a computer scientist in America, published ELIZA, one of the first chatbots. ELIZA understood nothing. It turned your own words round into questions: type &ldquo;I am worried about my test&rdquo; and it might answer &ldquo;Why are you worried about your test?&rdquo;</p>' +
    '<p>People trusted it anyway. Weizenbaum&rsquo;s own secretary, who had watched him write it, asked him to leave the room so that she could talk to it in private.</p>' +
    '<p>He spent years afterwards warning people not to trust a machine just because it talks like a person.</p>';
  $('#eliza').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: ELIZA, cls: 'mg-label', clue: { id: 'eliza', title: 'Book of the week: ELIZA, 1966', kind: 'On a stand' }, done: function () {
      if (tell('eliza')) ER.say('&ldquo;Why are you worried about your test?&rdquo; A good question, from a program that understood nothing.');
    } });
  });
  MG.thing('#window', null, 'Rain runs down the coloured glass. On a fine day this window throws red and blue squares all over the poetry shelves.', isBusy);
  MG.thing('#ladder', 'ladder', 'The rolling ladder for the top shelves. A sign on it says LIBRARIAN ONLY, and under it, smaller: I MEAN IT.', isBusy);
  MG.thing('#globe', 'globe', 'An old globe. It still has a country on it that stopped existing in 1991. Old things can be out of date too.', isBusy);
  $('#cards').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Five index cards, in pencil, every one with a source and a verdict.'); return; }
    if (!told.ibarra) { ER.say('A pile of blank index cards. Mrs Ibarra is watching you. Ask her first.'); return; }
    if (!told.bookmark) { ER.say('&ldquo;My five questions first,&rdquo; says Mrs Ibarra. &ldquo;On my desk.&rdquo;'); return; }
    if (!told.log) { ER.say('&ldquo;You&rsquo;ll want to see exactly what Magpie said,&rdquo; says Mrs Ibarra. &ldquo;Leo has it.&rdquo;'); return; }
    if (unread().length) { var u = unread().length; ER.say('&ldquo;You haven&rsquo;t read everything yet,&rdquo; says Mrs Ibarra. &ldquo;' + (u === 1 ? 'One more thing' : u + ' more things') + '. You can&rsquo;t check against a source you haven&rsquo;t read.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the index cards: a source and a verdict for each line ---------- */
  function makeLock() {
    var K = [
      { n: 7, t: 'The hottest planet is Mercury, because it is the closest to the Sun.' },
      { n: 7, t: '(Source: The Hot Planets, Dr A. Burrows, 2014, page 42)' },
      { n: 9, t: 'There are eight planets. Pluto is a dwarf planet.' },
      { n: 10, t: 'Galileo saw the phases of Venus in 1609.' },
      { n: 11, t: 'The Moon is about 384 km from the Earth.' }
    ];
    var NAMES = { a: 'handout', b: 'library book', c: 'museum label', d: 'website', e: 'Science Today', f: 'catalogue' };
    var VNAMES = { t: 'TRUE', m: 'MAGPIE&rsquo;S MISTAKE', l: 'LEO&rsquo;S MISTAKE' };
    var saved = ER.flag('c-ck') || {}, s = saved.s || {}, v = saved.v || {}, wait = false;
    var box = ER.el('div', 'pz ck');
    box.innerHTML = '<div class="ck-in">' + K.map(function (k, i) {
      return '<div class="ck-row" data-i="' + (i + 1) + '"><div class="ck-c"><i>card ' + (i + 1) + ' &middot; line ' + k.n + '</i>' + k.t + '</div>' +
        '<div><h6>checked against</h6><div class="ck-s">' + Object.keys(NAMES).map(function (x) { return '<button type="button" data-s="' + x + '">' + NAMES[x] + '</button>'; }).join('') + '</div></div>' +
        '<div><h6>verdict</h6><div class="ck-v">' + Object.keys(VNAMES).map(function (x) { return '<button type="button" class="' + x + '" data-v="' + x + '">' + VNAMES[x] + '</button>'; }).join('') + '</div></div></div>';
    }).join('') + '</div><div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="ck-go">Give Mrs Ibarra the cards</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('c-ck', { s: s, v: v }); }
    function paintK() {
      ER.$$('.ck-row', box).forEach(function (r) {
        var i = r.getAttribute('data-i');
        ER.$$('.ck-s button', r).forEach(function (b) { b.classList.toggle('on', s[i] === b.getAttribute('data-s')); });
        ER.$$('.ck-v button', r).forEach(function (b) { b.classList.toggle('on', v[i] === b.getAttribute('data-v')); });
      });
    }
    ER.$$('.ck-row', box).forEach(function (r) {
      var i = r.getAttribute('data-i');
      ER.$$('.ck-s button', r).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; s[i] = b.getAttribute('data-s'); keep(); MG.sfx.pencil(); paintK(); }); });
      ER.$$('.ck-v button', r).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; v[i] = b.getAttribute('data-v'); keep(); MG.sfx.stamp(); paintK(); }); });
    });
    paintK();
    function bad(i) { var r = box.querySelector('.ck-row[data-i="' + i + '"]'); r.classList.add('bad'); setTimeout(function () { r.classList.remove('bad'); }, 1300); }
    box.querySelector('#ck-go').addEventListener('click', function () {
      var i, missing = 0, file;
      if (wait || nextFile) return;
      for (i = 1; i <= 5; i++) if (!s[i] || !v[i]) missing++;
      if (missing) { ER.sfx.no(); msg('&ldquo;Every card gets a source and a verdict,&rdquo; says Mrs Ibarra. &ldquo;' + (missing === 1 ? 'One card is' : missing + ' cards are') + ' not finished.&rdquo;'); return; }
      for (i = 1; i <= 5; i++) {
        if (ER.check('s' + i, s[i])) continue;
        ER.sfx.no(); bad(i);
        if (s[i] === 'd') msg('Card ' + i + ': Mrs Ibarra holds the website printout at arm&rsquo;s length. &ldquo;Who wrote this? How do they know? There isn&rsquo;t even a date on it. It doesn&rsquo;t count, whatever it says.&rdquo;');
        else if (s[i] === 'e') msg('Card ' + i + ': &ldquo;Science Today,&rdquo; says Mrs Ibarra. &ldquo;Printed in 1998. Look at question 4 on my card. Is it still true?&rdquo;');
        else if (i === 2) msg('Card 2: &ldquo;How do you check that a book exists?&rdquo; says Mrs Ibarra. &ldquo;You look for it. Where would you look?&rdquo;');
        else if (s[i] === 'f') msg('Card ' + i + ': &ldquo;The catalogue tells you whether a book exists,&rdquo; says Mrs Ibarra. &ldquo;It can&rsquo;t tell you what is in one.&rdquo;');
        else msg('Card ' + i + ': &ldquo;Does the ' + NAMES[s[i]] + ' say anything about that?&rdquo; says Mrs Ibarra. &ldquo;Read it again.&rdquo;');
        return;
      }
      for (i = 1; i <= 5; i++) {
        if (ER.check('v' + i, v[i])) continue;
        ER.sfx.no(); bad(i);
        if (i === 5 && v[i] === 't') msg('Card 5: &ldquo;Three hundred and eighty-four kilometres?&rdquo; says Mrs Ibarra. &ldquo;I drive further than that to see my sister.&rdquo;');
        else if (i === 5) msg('Card 5: &ldquo;Before you blame Magpie,&rdquo; says Leo quietly, &ldquo;look at what it actually said. It&rsquo;s in the log.&rdquo;');
        else if (v[i] === 'l') msg('Card ' + i + ': Leo shakes his head. &ldquo;I copied that exactly. Look at the log.&rdquo;');
        else if (i === 2 && v[i] === 't') msg('Card 2: &ldquo;You found the book, did you?&rdquo; says Mrs Ibarra. &ldquo;On which shelf?&rdquo;');
        else if (v[i] === 't') msg('Card ' + i + ': &ldquo;Does your source agree with it?&rdquo; says Mrs Ibarra. &ldquo;Read it again, word by word.&rdquo;');
        else msg('Card ' + i + ': &ldquo;Is that line actually wrong?&rdquo; says Mrs Ibarra. &ldquo;What does your source say?&rdquo;');
        return;
      }
      file = ER.exit([[1, 2, 3, 4, 5].map(function (j) { return v[j]; }).join('-')], { wait: true });
      if (!file) { msg('The pencil breaks. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      MG.mine('checked', 'Leo’s sheet, checked', '<p>Nine of the twelve lines are right.</p><p>Line 7: wrong (Magpie). Venus is the hottest: the handout, line 3, and the library book, page 31.</p><p>Line 7, the source: no such book (the catalogue, 31 libraries). Magpie made it up, and the quotation too.</p><p>Line 10: wrong (Magpie). 1610, not 1609 (the museum label, the library book). 1609 was the first telescope.</p><p>Line 11: wrong (Leo). Magpie said 384,000 km; Leo left out the thousand.</p><p>Not sources: the website (no author, no date), Science Today (1998: out of date).</p>', true);
      msg('Mrs Ibarra reads the cards with her pencil, one by one. She does not rub anything out.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Twelve lines,&rdquo; says Mrs Ibarra. &ldquo;Nine right. Three wrong: two of them Magpie&rsquo;s, and one of them yours, Leo.&rdquo;',
          'Leo looks at line 11 for a long time. &ldquo;Three hundred and eighty-four thousand,&rdquo; he says. &ldquo;I was in a hurry.&rdquo;',
          '&ldquo;There is no book called The Hot Planets,&rdquo; says Mrs Ibarra. &ldquo;There is no Dr Burrows. But I would bet there are hundreds of homework answers on that portal that end with a source in brackets.&rdquo;',
          '&ldquo;Source: my brother,&rdquo; says Leo. &mdash; &ldquo;Exactly,&rdquo; says Mrs Ibarra. &ldquo;Your Magpie learnt that an answer like that ends with a book and a page number. So it wrote one. A very good-looking one. And a quotation to go with it.&rdquo;',
          'Leo is staring at his laptop. &ldquo;The second time, I didn&rsquo;t ask it which planet,&rdquo; he says. &ldquo;I asked it why Mercury was the hottest. I put Mercury in the question.&rdquo;',
          'Mr Ruskin puts his head round the door. &ldquo;The head&rsquo;s in the hall. Quarter past eight. Dr Fairley wants Magpie switched off for good. Bring everything.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2600);
    });
    msg('For each card: click the source that settles it, and stamp a verdict. Then give Mrs Ibarra the cards.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
</html>
