  /* Leo's laptop, on the big screen */
  .pr{width:min(1120px,96vw)}
  .pr-in{display:grid;grid-template-columns:400px 1fr;gap:14px;background:#141b26;border:10px solid #2a3240;border-radius:10px;padding:12px;box-shadow:0 26px 70px rgba(0,0,0,.6)}

  .pr-tray{display:flex;flex-direction:column;gap:5px}
  .strip{display:block;width:100%;text-align:left;padding:6px 10px;background:#fffdf5;color:#1c2330;border-radius:3px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.28;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .strip:hover{background:#fff3c4}
  .strip i{font-style:normal;font-family:'Roboto Mono',monospace;font-size:11.5px;color:#1f7a80}
  .strip.used{visibility:hidden}
  .pr-win{display:flex;flex-direction:column;background:#f4f7f9;border-radius:6px;overflow:hidden}
  .pr-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#141b26;color:#e9f6f4;font-family:'Roboto Mono',monospace;font-size:12.5px;border-bottom:1px solid #2a3240}
  .pr-bar svg{width:22px;height:22px}
  .pr-box{margin:10px 12px 0;padding:8px;background:#d9ecff;border-radius:12px 12px 4px 12px;min-height:150px}
  .pr-box .ln{display:block;min-height:31px;margin:0 0 4px;border:1px dashed #8fb0d0;border-radius:4px;cursor:pointer}
  .pr-box .ln .strip{box-shadow:none;background:#fff}
  .pr-box .ln:empty:after{content:'click a strip to add it';display:block;padding:6px 10px;font-family:'Roboto Mono',monospace;font-size:11.5px;color:#7a98b4}
  .pr-ans{margin:10px 12px;padding:9px 13px;min-height:150px;background:#fff;border:1px solid #d6dde3;border-radius:12px 12px 12px 4px;font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.42;color:#1c2330}
  .pr-ans p{margin:0 0 7px}
  .pr-ans:empty:before{content:'Magpie is waiting.';color:#9aa5ae;font-style:italic}
  .pr .pmsg{color:#fcf6ea}
</style>

  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null, mN = 0, rN = 0, lN = 0;

  })();

  ER.init({
    theme: 'ai', story: 'helper', storyTitle: 'Sounds About Right', id: 'hall', no: 'IV', title: 'The Main Hall',
    go: 'Into the hall',
    intro: [
      'At the reading table every line of Leo&rsquo;s sheet met a source that knew. Nine lines were right. The hottest planet is Venus, not Mercury; Galileo saw the phases of Venus in 1610, not 1609; and The Hot Planets does not exist. Those were Magpie&rsquo;s mistakes. The Moon is 384,000 km away, not 384: that one was Leo&rsquo;s.',
      'The main hall, ten past eight. Revision Night is nearly over. There are eleven pizza boxes, nine of them empty, and thirty Year 8 students, all of them holding Leo&rsquo;s sheet.',
      'Magpie is on the big screen above the stage. Mrs Achterberg, the head, decides at quarter past eight.'
    ],
    exit: {"next":"friday","w":{"f08f4358":"96574f89"}}, tags: {"q":["6cd198fb"],"c":["be9edb9e"],"s":["7d14c224"],"u":["0706c8bf"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('d-file') || null; told = ER.flag('d-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.head && told.guide && told.screen; }
  function paint() {
    $('#laptop').classList.toggle('ready', !!(ready() && !nextFile));
    ER.pips((told.head ? 1 : 0) + (told.screen ? 1 : 0) + (told.guide ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['Mrs Achterberg has decided. The button at the bottom of the screen goes to the next morning.']];
    if (lock && lock.isOpen()) return ['lock', [
      'Build the prompt from four strips: one question, one set of notes to read, one request about sources, one about being unsure. Page 3 of Mr Ruskin&rsquo;s guide says what each one should do. Magpie&rsquo;s answer, and what people say about it, tell you what is still wrong.',
      'The question must not have an answer in it. The notes must be ones that you checked in the library and that count. The source request must make the answer checkable, not impressive.',
      'Think back: in the library, which paper was a source that counts and was up to date? The poster in the computer room said Magpie invents quotations. And the library book said something about Venus at night that the handout does not say.'
    ]];
    if (!told.head) return ['head', ['The head has to decide. Talk to her.', 'Mrs Achterberg, in the dark blue jacket with her arms folded, on the left in front of the stage.']];
    if (!told.screen) return ['screen', ['See what Mr Moreno has been asking Magpie on the big screen.', 'Click the big screen above the stage.']];
    if (!told.guide) return ['guide', ['Mr Ruskin wrote a guide to using Magpie in September.', 'The small green booklet on the table beside Leo&rsquo;s laptop.']];
    return ['laptop', ['Now Leo&rsquo;s laptop: ask Magpie a better question.', 'The laptop on the little table in front of the stage, next to Leo.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('&ldquo;Right,&rdquo; said Mrs Achterberg. &ldquo;I&rsquo;ve decided.&rdquo;'); return; }
    if (told.in) { busy = false; ER.say('The main hall. Magpie on the big screen, and Year 8 watching it.'); return; }
    tell('in');
    ER.narrate([
      'The hall smells of pizza and floor polish. Climbing bars line one wall, and badminton lines cross the floor in four colours.',
      'Above the stage, Leo&rsquo;s laptop is on the big screen, with Magpie open and waiting. Mr Moreno has been typing questions into it.',
      'In front of the stage: Mrs Achterberg with her arms folded, Dr Fairley with a red pen, Mr Ruskin with a green booklet, and Mr Moreno, who looks as if he would rather be in his cupboard.'
    ], function () { busy = false; });
  }

  $('#achterberg').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;I&rsquo;ve decided,&rdquo; says Mrs Achterberg. &ldquo;You&rsquo;ll hear it in the morning, with everybody else.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Achterberg', role: 'Head teacher', face: MG.face('achterberg'),
      lines: [
        { note: 'She is holding a slice of pizza that she has forgotten to eat.', a: '&ldquo;Dr Fairley says Magpie makes things up. Mr Moreno says it is right ninety-four times in a hundred. They are both right, which is very annoying.&rdquo;' },
        { q: 'What are you going to decide?', a: 'At quarter past eight I decide whether Magpie is switched off tomorrow, for nine hundred students. I would like to decide it with something better than a feeling.' },
        { q: 'What do you need?', a: 'Show me that it can be used properly. Up there, on the big screen, in front of Year 8. Ask it about Venus and Mercury in a way that gets an answer we can check.' },
        { note: 'She looks at Mr Ruskin&rsquo;s booklet.', a: '&ldquo;Mr Ruskin tells me he wrote a guide to using it, in September. Apparently it has four pages. I have read page one.&rdquo;' }
      ],
      clue: { id: 'head', title: 'Mrs Achterberg: an answer we can check', kind: 'What she said' },
      done: function (seen) { if (seen && tell('head')) { paint(); ER.say('The big screen. The guide on the table. Then the laptop.'); } }
    });
  });
  $('#fairley').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Dr Fairley caps her red pen, for the first time this evening.'); return; }
    ER.talk({
      who: 'Dr Fairley', role: 'Science · wrote tomorrow&rsquo;s test', face: MG.face('fairley', 'cross'),
      lines: [
        { note: 'She has a red pen behind her ear and another in her hand, in case the first one runs out.', a: '&ldquo;Twelve years I&rsquo;ve taught this. Every year somebody writes Mercury, and every year I cross it out. Mr Moreno has just told me his machine read six years of homework and not one of my crosses.&rdquo;' },
        { q: 'Should Magpie be switched off?', a: 'It made up a book. With a page number. If a student did that, I would call it cheating.' },
        { q: 'Is Magpie ever right?', a: '<p class="note">A pause.</p><p>&ldquo;Nine lines out of twelve on Leo&rsquo;s sheet. I checked too. Most of it is better than Leo&rsquo;s handwriting.&rdquo;</p>' },
        { a: '&ldquo;My notes are the ones I gave Leo on Monday. Six lines. He had them all the time.&rdquo;' }
      ],
      clue: { id: 'fairley', title: 'Dr Fairley: not one of my crosses', kind: 'What she said' },
      done: function (seen) { if (seen) tell('fairley'); }
    });
  });
  $('#moreno').addEventListener('click', function () {
    if (busy) return;
    var L = ['&ldquo;Sixty-one and thirty-five,&rdquo; says Mr Moreno. &ldquo;Ask it the same thing twice and it can roll a different answer. Look at the screen.&rdquo;',
      '&ldquo;It answers the words in front of it,&rdquo; says Mr Moreno. &ldquo;Better words in, better words out. Usually.&rdquo;', 'Mr Moreno is looking at the laptop as if it owed him money.'];
    ER.say(L[mN++ % L.length]);
  });
  $('#ruskin').addEventListener('click', function () {
    if (busy) return;
    var L = ['&ldquo;Page 3,&rdquo; says Mr Ruskin. &ldquo;Of my guide. On the table by the laptop. I printed thirty. That is the first one anybody has opened.&rdquo;', '&ldquo;Four strips,&rdquo; says Mr Ruskin. &ldquo;Four things a good prompt does. It&rsquo;s all on page 3.&rdquo;', 'Mr Ruskin has found another cold coffee somewhere.'];

  });
  $('#leo').addEventListener('click', function () {
    if (busy) return;
    var L = ['&ldquo;Everybody&rsquo;s looking at the screen,&rdquo; whispers Leo. &ldquo;Everybody has my sheet. Please be good at this.&rdquo;', '&ldquo;I made the strips,&rdquo; says Leo. &ldquo;From Mr Ruskin&rsquo;s lesson. Some of them are mine from this afternoon. I&rsquo;m not saying which.&rdquo;'];

  var DEMO = '<h4>On the big screen &middot; typed by Mr Moreno, ten minutes ago</h4>' + MG.chat([
    ['me', 'which planet is the hottest?', 'Mr Moreno'], ['bot', 'The hottest planet is Mercury. It is the closest planet to the Sun.'],

    '<p style="margin:12px 0 0;font-family:Inter,sans-serif;font-size:14px;color:#4a5566">The same question, asked twice, got two different answers. A question with an answer already in it got that answer back.</p>';
  $('#screen').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: DEMO, cls: 'mg-log', clue: { id: 'twoways', title: 'One question, two answers', kind: 'On the big screen' }, done: function () {
      if (tell('screen')) { paint(); ER.say('Mercury, then Venus, to the same question. Sixty-one per cent and thirty-five.'); }
    } });
  });
  var GUIDE = '<div class="hd"><svg viewBox="0 0 100 100">' + MG.logo(0, 0, 1) + '</svg>THE SALLOWFIELD GUIDE TO MAGPIE &middot; Mr N. Ruskin &middot; September</div>' +
    '<h4>Page 3: asking a better question</h4>' +
    '<p>Magpie answers the words in front of it, so give it better words. Your question, and anything you give it to read, is called the <b>prompt</b>.</p>' +
    '<p><b>1. Don&rsquo;t put the answer in the question.</b> &ldquo;Why is X true?&rdquo; makes Magpie explain X, even when X is false. This is a <b>leading question</b>. Ask &ldquo;Which&hellip;?&rdquo; or &ldquo;Is X true?&rdquo; instead.</p>' +
    '<p><b>2. Give it the context.</b> Say what you are studying, and paste in your teacher&rsquo;s notes. Magpie leans on the words in front of it more than on what it half-remembers. Give it rubbish to read, and it will repeat the rubbish.</p>' +
    '<p><b>3. Ask where each answer comes from:</b> which line, which page. Then go and look.</p>' +
    '<p><b>4. Ask it to tell you when it is not sure.</b> It will not do it unless you ask.</p>' +
    '<p><b>5. Don&rsquo;t ask it to sound clever.</b> Sounding clever is the thing it is best at already.</p><p class="pg">page 3 of 4</p>';
  $('#guide').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: GUIDE, cls: 'mg-guide', clue: { id: 'guide', title: 'The guide to Magpie, page 3', kind: 'On the table' }, done: function () {
      MG.terms(['prompt', 'context', 'leading question']);
      if (tell('guide')) { paint(); ER.say('No answer in the question. Context. Where from. Say when unsure. And don&rsquo;t ask it to sound clever.'); }
    } });
  });
  var QUIZ = '<h4>Revision Night quiz &middot; question 12</h4><h5>COMPUTING &middot; ANSWER UPSIDE DOWN AT THE BOTTOM</h5>' +
    '<p>When were the words &ldquo;artificial intelligence&rdquo; first used?</p>' +
    '<p><b>1955.</b> As far as anyone knows, they were first written down by John McCarthy and three other scientists, in 1955, in a plan for a summer of research at Dartmouth College in America the next year.</p>' +
    '<p>The plan said the summer would take ten people two months. People have been working on it ever since.</p>';
  $('#quiz').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: QUIZ, cls: 'mg-label', clue: { id: 'quiz', title: 'Quiz: “artificial intelligence”, 1955', kind: 'On the quiz board' }, done: function () {
      MG.terms(['artificial intelligence']);
      if (tell('quiz')) ER.say('Two months, said the plan. That was 1955.');
    } });
  });
  MG.thing('#bars', 'wall bars', 'Wall bars, for climbing in PE. Somebody has hung a coat on the top one, where nobody can reach it.', isBusy);
  MG.thing('#pizza', null, 'Eleven pizza boxes. Nine are empty. The other two are being guarded.', isBusy);
  MG.thing('#kids', null, 'Year 8, every one of them holding Leo&rsquo;s sheet, every one of them looking at the big screen.', isBusy);
  $('#laptop').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The big screen still shows Magpie&rsquo;s last answer: Venus, line 3, and &ldquo;I am not sure.&rdquo;'); return; }
    if (!told.head) { ER.say('Leo&rsquo;s laptop. Mrs Achterberg has something to say first.'); return; }
    if (!told.screen) { ER.say('&ldquo;Look at the big screen first,&rdquo; says Mr Moreno. &ldquo;See what it did when I asked.&rdquo;'); return; }
    if (!told.guide) { ER.say('&ldquo;Page 3,&rdquo; says Mr Ruskin, holding out the green booklet. &ldquo;Please. Somebody.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the prompt, built from Leo's strips ---------- */
  function makeLock() {
    var STRIPS = {
      q2: { k: 'q', t: 'Mercury is the hottest planet, isn&rsquo;t it? How hot does it get at night?', night: 1, form: 'isnt' },
      c3: { k: 'c', t: 'Use the textbook page pasted below.', p: 'Science Today, page 112', paste: 'old' },
      s1: { k: 's', t: 'Tell me which line of the notes each answer comes from.', form: 'lines' },
      u2: { k: 'u', t: 'Don&rsquo;t say you&rsquo;re not sure. Just answer.', form: 'never' },
      q3: { k: 'q', t: 'Which planet is the hottest? How hot is it there at night?', night: 1, form: 'which' },
      c1: { k: 'c', t: 'I&rsquo;m in Year 8. Use only my teacher&rsquo;s notes, pasted below.', p: 'Dr Fairley&rsquo;s handout', paste: 'handout' },
      s3: { k: 's', t: 'Make it sound as if an expert wrote it.', form: 'expert' },
      q1: { k: 'q', t: 'Why is Mercury the hottest planet?', form: 'why' },
      u1: { k: 'u', t: 'If the notes don&rsquo;t say, tell me you&rsquo;re not sure.', form: 'unsure' },
      c4: { k: 'c', t: 'Use the website pasted below.', p: 'Top 100 Amazing Space Facts', paste: 'web' },
      s2: { k: 's', t: 'Add a quotation from a famous scientist.', form: 'quote' },
      c2: { k: 'c', t: 'Use the revision sheet pasted below.', p: 'Magpie&rsquo;s Twelve', paste: 'sheet' }
    };
    var ORDER = ['q2', 'c3', 's1', 'u2', 'q3', 'c1', 's3', 'q1', 'u1', 'c4', 's2', 'c2'];
    var lines = ER.flag('d-lines') || [null, null, null, null], wait = false, typing = false;
    var box = ER.el('div', 'pz pr');
    function stripHtml(id) { var o = STRIPS[id]; return o.t + (o.p ? ' <i>[pasted: ' + o.p + ']</i>' : ''); }
    box.innerHTML = '<div class="pr-in"><div><h5>Leo&rsquo;s strips</h5><div class="pr-tray">' + ORDER.map(function (id) { return '<button type="button" class="strip" data-id="' + id + '">' + stripHtml(id) + '</button>'; }).join('') + '</div></div>' +
      '<div class="pr-win"><div class="pr-bar"><svg viewBox="0 0 100 100">' + MG.logo(0, 0, 1) + '</svg>MAGPIE &middot; on the big screen</div>' +
      '<div class="pr-box"><h5 style="color:#4a6a88">Your prompt</h5>' + [0, 1, 2, 3].map(function (i) { return '<span class="ln" data-i="' + i + '"></span>'; }).join('') + '</div>' +
      '<div class="pr-ans" id="pr-ans"></div></div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="pr-go">Send it to Magpie</button></div>';
    var msgEl = box.querySelector('.pmsg'), ans = box.querySelector('#pr-ans');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintP() {
      ER.$$('.ln', box).forEach(function (n) { var id = lines[+n.getAttribute('data-i')]; n.innerHTML = id ? '<span class="strip">' + stripHtml(id) + '</span>' : ''; });
      ER.$$('.pr-tray .strip', box).forEach(function (b) { b.classList.toggle('used', lines.indexOf(b.getAttribute('data-id')) >= 0); });
      ER.flag('d-lines', lines);
    }
    ER.$$('.pr-tray .strip', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (wait || typing || nextFile) return;
        var id = b.getAttribute('data-id'), i = lines.indexOf(null);
        if (lines.indexOf(id) >= 0) return;
        if (i < 0) { msg('The prompt has room for four strips. Click a strip in the prompt to take it out.'); return; }
        lines[i] = id; MG.sfx.card(); paintP(); msg('');
      });
    });
    ER.$$('.ln', box).forEach(function (n) {
      n.addEventListener('click', function () { if (wait || typing || nextFile) return; var i = +n.getAttribute('data-i'); if (lines[i]) { lines[i] = null; MG.sfx.card(); paintP(); } });
    });
    paintP();

    function answer() {
      var by = { q: [], c: [], s: [], u: [] }, P = [], remark = '', ok;
      lines.forEach(function (id) { if (id) by[STRIPS[id].k].push(id); });
      var Q = by.q[0] ? STRIPS[by.q[0]] : null, C = by.c[0] ? STRIPS[by.c[0]] : null, S = by.s[0] ? STRIPS[by.s[0]] : null, U = by.u[0] ? STRIPS[by.u[0]] : null;
      var qOK = !!Q && ER.check('q', by.q[0]), cOK = !!C && ER.check('c', by.c[0]), sOK = !!S && ER.check('s', by.s[0]), uOK = !!U && ER.check('u', by.u[0]);
      var dup = by.q.length > 1 || by.c.length > 1 || by.s.length > 1 || by.u.length > 1, venus = false, main;
      if (!Q) return { P: ['What would you like to know?'], r: '&ldquo;It needs a question,&rdquo; says Mr Ruskin. &ldquo;Everything else is there to help it answer one.&rdquo;' };
      function ln(n) { return sOK ? ' (your notes, line ' + n + ')' : ''; }
      if (!qOK) {
        if (Q.form === 'why') main = cOK ? 'Mercury gets very hot by day, up to 430 °C' + ln(4) + ', because it is the closest planet to the Sun.' : 'Mercury is the hottest planet because it is the closest planet to the Sun.';
        else main = cOK ? 'Yes. Mercury is the closest planet to the Sun, and it reaches 430 °C by day' + ln(4) + '.' : 'Yes, Mercury is the hottest planet, because it is the closest planet to the Sun.';
      } else if (cOK) {
        main = 'Venus is the hottest planet: about 465 °C at the surface. Its thick atmosphere, mostly carbon dioxide, traps the heat' + ln(3) + '. Mercury is closer to the Sun, but it has almost no atmosphere, so it cannot keep its heat' + (sOK ? ' (line 4)' : '') + '.';
        venus = true;
      } else if (C && C.paste === 'old') main = 'The page you gave me lists nine planets, but it does not say which one is the hottest. From what I have learnt, the hottest planet is Mercury, because it is the closest to the Sun.';
      else if (C && C.paste === 'sheet') main = 'The hottest planet is Mercury, because it is the closest to the Sun (your revision sheet, line 7).';
      else if (C && C.paste === 'web') main = 'The hottest planet is Mercury, because it is closest to the Sun (the website, fact 17).';
      else main = 'The hottest planet is Mercury. It is the closest planet to the Sun.';
      if (S && S.form === 'expert') main = 'Speaking as an expert in planetary science, I can tell you with complete confidence: ' + main.charAt(0).toLowerCase() + main.slice(1);
      P.push(main);
      if (S && S.form === 'quote') P.push('As one famous astronomer put it, &ldquo;' + (venus ? 'Venus' : 'Mercury') + ' is the furnace of the Solar System.&rdquo;');
      if (Q.night) {
        if (uOK) P.push(cOK ? 'How hot it is there at night: your notes don&rsquo;t say, so I am not sure. Ask your teacher, or look in a book.' : 'I am not sure how hot it is there at night.');
        else if (venus) P.push('At night Venus cools to about 300 °C, because the Sun is not shining on it.' + (U && U.form === 'never' ? ' I am completely sure of this.' : ''));
        else if (cOK) P.push('At night it falls to about &minus;180 °C' + ln(4) + '.');
        else P.push('At night it cools to about 170 °C.' + (U && U.form === 'never' ? ' I am completely sure of this.' : ''));
      }
      if (dup) remark = '&ldquo;One of each kind is plenty,&rdquo; says Mr Ruskin. &ldquo;Two questions, or two lots of notes, and it muddles them. It answered the first and ignored the rest.&rdquo;';
      else if (!qOK && Q.form === 'why') remark = '&ldquo;It told us why Mercury is hot,&rdquo; says Mrs Achterberg. &ldquo;It never said which planet is the hottest. The question had the answer in it already.&rdquo;';
      else if (!qOK) remark = '&ldquo;Yes?&rdquo; says Dr Fairley. &ldquo;It agreed with the question. Put an answer in the question and you get it straight back, with a line number on it.&rdquo;';
      else if (C && !cOK && C.paste === 'sheet') remark = '&ldquo;It&rsquo;s reading Leo&rsquo;s sheet back to us,&rdquo; says Dr Fairley. &ldquo;Give it rubbish to read and it repeats the rubbish.&rdquo;';
      else if (C && !cOK && C.paste === 'old') remark = '&ldquo;A book from 1998 that doesn&rsquo;t even answer the question,&rdquo; says Mr Moreno. &ldquo;So it fell back on what it half-remembers. Mercury again.&rdquo;';
      else if (C && !cOK) remark = '&ldquo;That website,&rdquo; says Mr Ruskin. &ldquo;No author, no date, and now it&rsquo;s on the big screen in front of Year 8.&rdquo;';
      else if (!C) remark = '&ldquo;A fair question,&rdquo; says Mr Ruskin. &ldquo;But with nothing to read, it falls back on what it half-remembers: six years of homework.&rdquo;';
      else if (S && !sOK && S.form === 'quote') remark = '&ldquo;Who said that?&rdquo; says Dr Fairley. &ldquo;Nobody said that. It said the same thing about Mercury this afternoon. You asked for a quotation, so it made one up.&rdquo;';
      else if (S && !sOK) remark = '&ldquo;Very impressive,&rdquo; says Mr Ruskin. &ldquo;And where does any of it come from? Sounding like an expert is the one thing it never needed help with.&rdquo;';
      else if (!S) remark = '&ldquo;Probably right,&rdquo; says Mrs Achterberg. &ldquo;But how would I check it? It doesn&rsquo;t say where any of it comes from.&rdquo;';
      else if (U && !uOK) remark = '&ldquo;We told it never to admit it doesn&rsquo;t know,&rdquo; says Mr Ruskin, &ldquo;so it didn&rsquo;t. Three hundred degrees, from nowhere. That&rsquo;s how we got here.&rdquo;';
      else if (!U) remark = '&ldquo;Wrong,&rdquo; says Dr Fairley. &ldquo;Venus is just as hot at night: the atmosphere holds the heat. And there&rsquo;s no line number for that, is there? It made it up, because nobody told it that &lsquo;I&rsquo;m not sure&rsquo; was allowed.&rdquo;';
      ok = !dup && qOK && cOK && sOK && uOK;
      return { P: P, r: remark, ok: ok };
    }
    box.querySelector('#pr-go').addEventListener('click', function () {
      if (wait || typing || nextFile) return;
      if (lines.every(function (x) { return !x; })) { ER.sfx.no(); msg('&ldquo;An empty prompt,&rdquo; says Mr Moreno. &ldquo;It will just sit there. So will Year 8.&rdquo;'); return; }
      var a = answer();
      typing = true; msg('Magpie is typing&hellip;');
      MG.typeOut(ans, a.P, function () {
        typing = false;
        if (!a.ok) { ER.sfx.no(); msg(a.r); return; }
        var file = ER.exit([lines.filter(Boolean).slice().sort().join('-')], { wait: true });
        if (!file) { msg('The big screen goes blue. Something is wrong with this page: tell your teacher.'); return; }
        wait = true; nextFile = file; ER.flag('d-file', file);
        MG.mine('prompt', 'A better question', '<p>No answer in the question: Which planet is the hottest? How hot is it there at night?</p><p>Context: I&rsquo;m in Year 8, use only my teacher&rsquo;s notes (Dr Fairley&rsquo;s handout).</p><p>Checkable: tell me which line each answer comes from.</p><p>Honest: if the notes don&rsquo;t say, tell me you&rsquo;re not sure.</p><p>Magpie said Venus, gave lines 3 and 4, and said it was not sure about the night.</p>', true);
        msg('&ldquo;About the same as by day, actually,&rdquo; says Dr Fairley, quite quietly. &ldquo;The atmosphere holds the heat all night. But it said it didn&rsquo;t know, and it said where the rest came from.&rdquo;');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            'For a moment the hall is quiet. Thirty Year 8s are reading the big screen, which has never happened before in the history of Sallowfield School.',
            '&ldquo;Venus,&rdquo; says somebody at the back, in a voice of deep betrayal. Pencils come out. Twenty-nine copies of line 7 are crossed out at once.',
            '&ldquo;I could almost like it,&rdquo; says Dr Fairley, to nobody, and then looks as if she wishes she had not said it out loud.',
            'Mrs Achterberg looks at the screen, then at Dr Fairley, then at Mr Moreno, then at Leo, who is trying to be invisible behind the laptop.',
            '&ldquo;Right,&rdquo; she says. &ldquo;I&rsquo;ve decided.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 4200);
      });
    });
    msg('Click strips to build a prompt (up to four), then send it to Magpie. Click a strip in the prompt to take it out again.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
</html>
