  .ds-mb td.c{font-family:'Kalam',cursive;font-size:13px;color:#c0392b}
  .ds-res{margin-top:10px;font-family:'Roboto Mono',monospace;font-size:12.5px;color:#cfe0d8}
  .ds-res .pb{display:grid;grid-template-columns:170px 1fr 90px;gap:8px;align-items:center;margin:3px 0}
  .ds-res .pb i{display:block;height:11px;border-radius:2px}
  .ds .pmsg{color:#e3efe8}

    if (lock && lock.isOpen()) return ['lock', [
      'The data sheet says what a system should learn from: examples labelled right, and nothing out of date. The homework cards have their labels in the markbook, on the right. The textbooks and the worksheet have no marks: Mr Moreno told you why.',
      'Look up every homework number in the markbook. A tick: TEACH. A cross: LEAVE OUT. Be careful: one Venus answer has a cross, because its reason is wrong.',
      'Two cards are not homework and are about planets, not heat. One book was printed in 1998 and one in 2016. Which one still says what astronomers say today? The worksheet was written by the science teacher.'
    ]];
    if (!told.moreno) return ['moreno', ['Mr Moreno trained Magpie. Talk to him.', 'Mr Moreno is at the back, by his desk, with headphones round his neck.']];
    if (!told.data) return ['data', ['What did Magpie learn from? It is written down somewhere in here.', 'The white laminated sheet taped to the short cabinet, just right of the tall black rack.']];
    if (!told.marks) return ['marks', ['Mr Moreno mentioned the markbook.', 'The clipboard hanging on the wall by the door, on the left.']];
    return ['screen', ['Now Mr Moreno&rsquo;s screen: everything Magpie read about the hottest planet.', 'The left-hand monitor on the desk at the back.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('A Magpie trained on your pile would say Venus. This one never saw a single tick.'); return; }
    if (told.in) { busy = false; ER.say('The server cupboard, humming to itself under the stairs.'); return; }
    tell('in');
    ER.narrate([
      'A cupboard under the stairs, full of humming. Green and orange lights wink up and down a tall black cabinet, and blue cables hang from it in loops.',
      'Mr Moreno is at his desk at the back, under the slope of the stairs, with headphones round his neck. Somebody runs down the stairs overhead, and the whole ceiling drums. A little dust floats down.',
      'On the short cabinet beside the rack a laminated sheet is taped up, slightly crooked. On the wall by the door hangs a clipboard.'
    ], function () { busy = false; });
  }

  $('#moreno').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Mrs Ibarra,&rdquo; says Mr Moreno, without looking up. &ldquo;The library. If that book exists, she&rsquo;ll have it. If it doesn&rsquo;t, she&rsquo;ll know why.&rdquo;'); return; }
    ER.talk({
      who: 'Mr Moreno', role: 'Network manager · built Magpie', face: MG.face('moreno'),
      lines: [
        { note: 'He has a laptop under one arm and a cold piece of pizza balanced on top of it.', a: '&ldquo;I heard. Mercury. Look: Magpie got ninety-four per cent on its test. Four hundred and seventy-one out of five hundred. That&rsquo;s better than half of Year 8.&rdquo;' },
        { q: 'What was the test?', a: 'Five hundred questions it had never seen: the questions at the end of every chapter in the textbooks. I kept them out while it was learning, so it couldn&rsquo;t just remember the answers. That&rsquo;s how you test a system properly.' },
        { q: 'Was the hottest planet one of the five hundred?', a: '<p class="note">A long pause.</p><p>&ldquo;&hellip;No. Not that one.&rdquo;</p>' },
        { q: 'What did Magpie learn from?', a: 'Everything we had. Forty-one thousand pages. It&rsquo;s all on the data sheet, on the side of the cabinet. More data, better system. Everybody knows that.' },
        { q: 'Did it learn the marks too?', a: 'The marks? No. Teachers mark in the markbook, and the portal only keeps the answers. Different tables. The textbooks and the worksheets have no marks anyway: they were written by people who knew. Nobody marks a textbook.' },
        { note: 'He turns his screen round.', a: '&ldquo;Want to see what it read? Search the training data for anything, and you get every page it learnt from. Try &lsquo;hottest&rsquo;. And the markbook&rsquo;s on the clipboard by the door, if you&rsquo;re curious.&rdquo;' }
      ],
      clue: { id: 'moreno', title: 'Mr Moreno: different tables', kind: 'What he said' },
      done: function (seen) { if (seen && tell('moreno')) { paint(); ER.say('The data sheet is on the cabinet. The markbook is by the door. Then the screen.'); } }
    });
  });

  var DATA = '<h4>MAGPIE &middot; DATA SHEET<small>M. MORENO &middot; AUGUST &middot; PLEASE DO NOT REMOVE</small></h4>' +
    '<p><b>What it is.</b> Magpie is a language model, trained by me on the school&rsquo;s own text.</p>' +
    '<p><b>Training data.</b> 41,000 pages: our two science textbooks (Science Now, 2016, and Science Today, 1998, from the store room), every worksheet on the school network, and every homework answer on the homework portal from 2019 to 2025.</p>' +
    '<p><b>What it can know.</b> A system knows only what is in its training data. It learns the patterns in its examples. If most of them say one thing, it says that thing too, true or not.</p>' +
    '<p><b>Labels.</b> An example can carry a label, such as a tick or a cross. Trained only on examples labelled right, a system learns right answers. Without labels, it learns common answers.</p>' +
    '<p><b>Dates.</b> Data goes out of date. Science Today says there are nine planets. Since 2006 astronomers have counted eight, and Pluto is a dwarf planet.</p>' +
    '<p><b>Testing.</b> Test set: 500 questions that Magpie did not see while it learnt. Score: 471 (94%).</p>' +
    '<p class="hand">Not bad for the summer holidays! &mdash; M.</p>';
  $('#datasheet').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: DATA, cls: 'mg-data', clue: { id: 'data', title: 'Magpie’s data sheet', kind: 'Taped to the cabinet' }, done: function () {
      MG.terms(['training data', 'example', 'pattern', 'label', 'test set', 'out of date']);
      if (tell('data')) { paint(); ER.say('It knows only what is in its training data. Without labels, it learns common answers.'); }
    } });
  });
  var MARKBOOK = '<h4>Markbook export</h4><h5>Year 8 science &middot; homework &ldquo;The Solar System&rdquo; &middot; 2019 to 2025 &middot; marks only</h5>' + MB.replace('<table>', '<table><tr><td><b>homework</b></td><td><b>mark</b></td><td><b>comment</b></td></tr>');
  $('#markbook').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MARKBOOK, cls: 'mg-marks', clue: { id: 'marks', title: 'The markbook: ticks and crosses', kind: 'On the clipboard' }, done: function () {
      if (tell('marks')) { paint(); ER.say('Ticks and crosses, and Dr Fairley&rsquo;s comments in red. None of it ever went into Magpie.'); }
    } });
  });
  var TURING = '<h4>Alan Turing (1912&ndash;1954)</h4><p class="q">&ldquo;I propose to consider the question, &lsquo;Can machines think?&rsquo;&rdquo;</p>' +
    '<small>The first words of &ldquo;Computing Machinery and Intelligence&rdquo;, in the journal Mind, October 1950</small>' +
    '<p style="margin-top:12px">In this paper Turing described an &ldquo;imitation game&rdquo;. A person asks questions in writing and reads the answers from two players they cannot see, one a human and one a machine. Can they tell which is which? People still argue about what the game would prove.</p>';
  $('#turing').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TURING, cls: 'mg-frame', clue: { id: 'turing', title: 'Alan Turing, 1950', kind: 'On the wall' }, done: function () {
      if (tell('turing')) ER.say('&ldquo;My hero,&rdquo; says Mr Moreno. &ldquo;He asked if machines could think. More than seventy years later, mine can&rsquo;t tell Mercury from Venus.&rdquo;');
    } });
  });
  $('#leo').addEventListener('click', function () {
    if (busy) return;
    var L = ['&ldquo;Six years of homework,&rdquo; says Leo. &ldquo;My brother&rsquo;s will be in there. He did Year 8 science four years ago. Sort of.&rdquo;',
      '&ldquo;H-2290,&rdquo; says Leo. &ldquo;Source: my brother. That&rsquo;s brilliant. That&rsquo;s not mine. Probably.&rdquo;',
      'Leo is reading the cables as if they might spell something.'];
    ER.say(L[leoN++ % L.length]);
  });
  MG.thing('#rack', 'server', 'The school&rsquo;s network lives here: the Wi-Fi, the printers, the registers. Magpie itself runs on a much bigger computer at the county office.', isBusy);
  MG.thing('#box', null, 'A box of old textbooks: SCIENCE TODAY, 1998, from the store room. On the side, in marker: SCANNED. DO NOT BIN.', isBusy);
  MG.thing('#mascot', 'mascot', 'Maggie the Magpie, the school&rsquo;s mascot since 1987, in cardboard. Somebody has given her a lanyard.', isBusy);
  MG.thing('#mugs', null, 'Three mugs, none of them washed. One says I FIXED IT. One says I BROKE IT. The third is full of pens.', isBusy);
  MG.thing('#fan', null, 'A desk fan, pointed at the rack. The rack gets hot. So does Mr Moreno.', isBusy);
  MG.thing('#term', null, 'The other screen. Mr Moreno has been asking printer 2 if it is there. Printer 2 has not answered.', isBusy);
  $('#screen').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Your pile, sorted. TEACH: five cards. LEAVE OUT: nine.'); return; }
    if (!told.moreno) { ER.say('Mr Moreno&rsquo;s screen. He would like to be asked before you touch it.'); return; }
    if (!told.data) { ER.say('&ldquo;Read the data sheet first,&rdquo; says Mr Moreno. &ldquo;On the cabinet. I laminated it. Nobody has read it.&rdquo;'); return; }
    if (!told.marks) { ER.say('&ldquo;You&rsquo;ll want the markbook,&rdquo; says Mr Moreno. &ldquo;Clipboard, by the door.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the search: which examples should Magpie have learnt from? ---------- */
  function makeLock() {
    var st = ER.flag('b-st') || {}, wait = false;
    var box = ER.el('div', 'pz ds');
    box.innerHTML = '<div class="ds-in"><div><div class="ds-hd">SEARCH THE TRAINING DATA <b>hottest OR planets</b> 14 pages found</div><div class="ds-cards">' +
      CARDS.map(function (c) { return '<div class="dc" data-id="' + c.id + '"><small>' + c.src + '</small><p>' + c.t + '</p><div class="st"><button type="button" class="k">TEACH</button><button type="button" class="b">LEAVE OUT</button></div></div>'; }).join('') +
      '</div><div class="ds-res" id="ds-res"></div></div><div class="ds-mb"><h5>Markbook (clipboard)</h5>' + MB + '</div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="ds-go">Show Mr Moreno the pile</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintC() { ER.$$('.dc', box).forEach(function (n) { var v = st[n.getAttribute('data-id')]; n.classList.toggle('K', v === 'K'); n.classList.toggle('B', v === 'B'); }); }
    ER.$$('.dc', box).forEach(function (n) {
      var id = n.getAttribute('data-id');
      n.querySelector('.k').addEventListener('click', function () { if (wait || nextFile) return; st[id] = st[id] === 'K' ? '' : 'K'; ER.flag('b-st', st); MG.sfx.card(); paintC(); });
      n.querySelector('.b').addEventListener('click', function () { if (wait || nextFile) return; st[id] = st[id] === 'B' ? '' : 'B'; ER.flag('b-st', st); MG.sfx.card(); paintC(); });
    });
    paintC();
    function flash(id) { var n = box.querySelector('.dc[data-id="' + id + '"]'); n.classList.add('bad'); setTimeout(function () { n.classList.remove('bad'); }, 1200); }
    box.querySelector('#ds-go').addEventListener('click', function () {
      var n = 0, wk = [], wb = [], keep = [], file;
      if (wait || nextFile) return;
      CARDS.forEach(function (c) {
        if (st[c.id]) n++;
        var should = ER.check('keep', c.id);
        if (st[c.id] === 'K' && !should) wk.push(c);
        if (st[c.id] === 'B' && should) wb.push(c);
        if (st[c.id] === 'K') keep.push(c.id);
      });
      if (n < CARDS.length) { ER.sfx.no(); msg('&ldquo;Every page goes one way or the other,&rdquo; says Mr Moreno. &ldquo;' + (CARDS.length - n) + ' still to sort.&rdquo;'); return; }
      function first(list, kind) { for (var i = 0; i < list.length; i++) if (list[i].kind === kind) return list[i]; return null; }
      var c;
      if ((c = first(wk, 'h'))) { ER.sfx.no(); msg('&ldquo;One of the homework answers in your TEACH pile has a cross in the markbook,&rdquo; says Mr Moreno. &ldquo;Teach it that, and it learns the mistake all over again.&rdquo;'); return; }
      if ((c = first(wb, 'h'))) { ER.sfx.no(); msg('&ldquo;You&rsquo;ve left out a homework answer that a teacher gave a tick,&rdquo; says Mr Moreno. &ldquo;That&rsquo;s exactly the sort of thing it should learn from.&rdquo;'); return; }
      if ((c = first(wk, 't98'))) { ER.sfx.no(); flash(c.id); msg('&ldquo;Science Today. 1998,&rdquo; says Mr Moreno slowly. &ldquo;What does my data sheet say about data that has a date on it?&rdquo;'); return; }
      if (wb.length) { ER.sfx.no(); flash(wb[0].id); msg('&ldquo;Why leave that one out?&rdquo; says Mr Moreno. &ldquo;It has no mark because nobody marks a textbook or a teacher&rsquo;s worksheet. Is it right, and is it up to date?&rdquo;'); return; }
      if (wk.length) { ER.sfx.no(); flash(wk[0].id); msg('&ldquo;Not that one,&rdquo; says Mr Moreno. &ldquo;Read it again.&rdquo;'); return; }
      file = ER.exit([keep.sort().join('-')], { wait: true });
      if (!file) { msg('The screen freezes. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('b-file', file);
      var am = 0, av = 0, km = 0, kv = 0;
      CARDS.forEach(function (x) { if (x.says === 'm') am++; if (x.says === 'v') av++; if (st[x.id] === 'K' && x.says === 'm') km++; if (st[x.id] === 'K' && x.says === 'v') kv++; });
      function bar(lbl, a, b) { var p = Math.round(100 * a / (a + b)); return '<div class="pb"><span>' + lbl + '</span><i style="width:' + p + '%;background:' + (lbl.indexOf('Mercury') >= 0 ? '#ffb02e' : '#39d98a') + '"></i><span>' + a + ' of ' + (a + b) + ' (' + p + '%)</span></div>'; }
      box.querySelector('#ds-res').innerHTML = '<div>Trained on everything:</div>' + bar('says Mercury', am, av) + bar('says Venus', av, am) + '<div style="margin-top:6px">Trained on your pile:</div>' + bar('says Mercury', km, kv) + bar('says Venus', kv, km);
      MG.terms(['label']);
      MG.mine('pile', 'What Magpie should have learnt from', '<p>Search: hottest OR planets, 14 pages. Mercury 7, Venus 5: 58% Mercury.</p><p>Keep only what is labelled right (a tick in the markbook), what was written by people who knew (the worksheet, the 2016 textbook), and nothing out of date (not the 1998 book).</p><p>Trained on that pile: Venus, 4 out of 4.</p><p>Magpie learnt the common answer, because the labels were in a different table.</p>', true);
      msg('&ldquo;Five pages,&rdquo; says Mr Moreno. &ldquo;Out of fourteen. And every one of them says Venus.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Mr Moreno looks at the two bars for a long time.',
          '&ldquo;Seven Mercurys and five Venuses,&rdquo; he says. &ldquo;Fifty-eight per cent. Six years of Year 8s telling it Mercury, and six years of teachers telling them no, in a table it never saw.&rdquo;',
          '&ldquo;I gave it everything we had. I thought more was better.&rdquo; He rubs his eyes. &ldquo;More is better, if it&rsquo;s right. More wrong is just more wrong.&rdquo;',
          '&ldquo;Can you train it again tonight?&rdquo; says Leo. &mdash; &ldquo;On your pile? It takes the big computer at the county office about three days. Not tonight.&rdquo;',
          '&ldquo;And the book?&rdquo; says Leo. &ldquo;The Hot Planets. Page 42.&rdquo; Mr Moreno types BURROWS into the search. Nothing. Not one page in forty-one thousand.',
          '&ldquo;Then where did it come from?&rdquo; &mdash; &ldquo;If there&rsquo;s a book like that anywhere,&rdquo; says Mr Moreno, &ldquo;Mrs Ibarra will know. Mrs Ibarra knows whether anything exists.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 4200);
    });
    msg('Sort every page: TEACH (Magpie should learn from it) or LEAVE OUT. Then show Mr Moreno the pile.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
</html>
