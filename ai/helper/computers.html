  ER.init({
    theme: 'ai', story: 'helper', storyTitle: 'Sounds About Right', id: 'computers', no: 'I', title: 'Computer Room IT2',
    go: 'Into the computer room',
    intro: [
      'Thursday, twenty to seven. It is Revision Night at Sallowfield School: the doors are open until half past eight, there is pizza in the hall, and the Year 8 science test is tomorrow morning at five past nine.',
      'Leo Takeda spent the afternoon asking Magpie, the school&rsquo;s homework chatbot, about space. At six o&rsquo;clock he gave everybody in Year 8 a copy of its answers.',

    exit: {"next":"servers","w":{"2a33dda5":"4e6fec8d"}}, tags: {"p3":["53d418d9"],"p4":["30181f7f"],"p5":["45fee358"],"p6":["c12b1565"],"p7":["b53cd37e"],"p8":["9b8e2bc6"],"p9":["5007cf88"],"p10":["9e38ea0d"]},

  nextFile = ER.flag('a-file') || null; told = ER.flag('a-told') || {};

      'Tiny Magpie starts with &ldquo;Mercury is&rdquo;. Find every place in the twelve sentences where &ldquo;Mercury is&rdquo; comes together, and see which word comes next. Click that word. Then do the same with the last two words you have.',

        { note: 'He looks into his coffee, which is cold, and drinks it anyway.', a: '&ldquo;Dr Fairley wants Magpie switched off before the test tomorrow. For the whole school, not just Year 8. She&rsquo;s gone to find the head, and the head decides at quarter past eight.&rdquo;' },

      ],
      clue: { id: 'ruskin', title: 'Mr Ruskin: what was it built to do?', kind: 'What he said' },
      done: function (seen) { if (seen && tell('ruskin')) { paint(); ER.say('Leo&rsquo;s sheet is on the desk. The poster is by the door. Then the whiteboard.'); } }
    });
  });

  $('#leo').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Thirty copies,&rdquo; says Leo, to nobody in particular. &ldquo;Thirty.&rdquo;'); return; }
    ER.talk({
      who: 'Leo Takeda', role: 'Year 8 · 8F', face: MG.face('leo'),
      lines: [
        { note: 'Leo has his sheet in one hand and a slice of cold pizza in the other.', a: '&ldquo;It&rsquo;s not my fault. Well. It&rsquo;s a bit my fault. I asked Magpie about space all afternoon and wrote down the best bits. Everybody wanted a copy.&rdquo;' },
        { q: 'What did you ask it?', a: 'Loads. Which planet&rsquo;s the hottest, and why. How far away the Moon is. Galileo stuff. It answers anything in about a second. It&rsquo;s read the whole internet, probably.' },
        { note: 'Mr Ruskin, from the whiteboard, without looking round:', a: '&ldquo;It hasn&rsquo;t.&rdquo;' },
        { q: 'How many copies did you make?', a: 'Thirty. One for everybody in 8F and 8R, and one for me. They&rsquo;re all in the hall learning it now.' },
        { q: 'Did you check any of it?', a: 'Check it against what? It even gave a source for number 7. A book, and a page number. You don&rsquo;t make up a page number.' },
        { a: '&ldquo;Mr Ruskin switched on something called &lsquo;show working&rsquo; on my screen. It&rsquo;s got numbers. I don&rsquo;t know what they mean.&rdquo;' }
      ],
      clue: { id: 'leo', title: 'Leo: it gave a page number', kind: 'What he said' },
      done: function (seen) { if (seen && tell('leo')) ER.say('Leo&rsquo;s screen, with Magpie on it, is on the desk beside him.'); }
    });
  });

  var SHEET = '<h4>MAGPIE&rsquo;S TWELVE</h4><h5>Things for tomorrow&rsquo;s test!! All from Magpie, so they&rsquo;re right. &mdash; Leo T., 8F</h5><ol>' +
    '<li>The Sun is a star. It is about 150 million km from the Earth.</li>' +
    '<li>Light from the Sun takes about 8 minutes to reach the Earth.</li>' +
    '<li>The Earth goes round the Sun once a year (365¼ days).</li>' +
    '<li>The Earth spins once a day. That gives us day and night.</li>' +
    '<li>We have seasons because the Earth&rsquo;s axis is tilted.</li>' +
    '<li>The Moon goes round the Earth about once a month.</li>' +
    '<li>The hottest planet is Mercury, because it is the closest to the Sun. &ldquo;Mercury is the furnace of the Solar System.&rdquo; <span class="src">(Source: The Hot Planets, Dr A. Burrows, 2014, page 42)</span></li>' +
    '<li>Jupiter is the biggest planet.</li>' +
    '<li>There are eight planets. Pluto is a dwarf planet.</li>' +
    '<li>Galileo saw the phases of Venus in 1609.</li>' +
    '<li>The Moon is about 384 km from the Earth.</li>' +
    '<li>Saturn&rsquo;s rings are made of ice and rock.</li></ol>' +
    '<p class="foot">Good luck everyone!!! Learn these and you&rsquo;ll be fine. &mdash; Leo</p>';
  $('#sheet').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SHEET, cls: 'mg-sheet', clue: { id: 'sheet', title: 'Leo’s sheet: Magpie’s Twelve', kind: 'Given to all of Year 8' }, done: function () {
      MG.terms(['chatbot']);
      if (tell('sheet')) { paint(); ER.say('Twelve lines, and every one of them sure of itself. Number 7 even has a page number.'); }
    } });
  });

  var DIA = '<svg viewBox="0 0 250 230"><g font-family="Inter,sans-serif" font-size="13" fill="#132233">' +
    '<text x="4" y="16" font-weight="700" fill="#1b4fa0">What comes next?</text><text x="4" y="40" font-family="Roboto Mono,monospace" font-size="14">Fish and ...</text>' +
    '<rect x="4" y="54" width="150" height="16" fill="#2f6fd0"/><text x="162" y="67">chips 81%</text>' +
    '<rect x="4" y="78" width="14" height="16" fill="#9fb3cc"/><text x="24" y="91">rice 7%</text>' +
    '<rect x="4" y="102" width="8" height="16" fill="#9fb3cc"/><text x="18" y="115">peas 4%</text>' +
    '<rect x="4" y="126" width="4" height="16" fill="#9fb3cc"/><text x="14" y="139">other words 8%</text>' +
    '<text x="4" y="172" font-family="Kalam,cursive" font-size="15" fill="#c2185b">The bar is the probability of</text><text x="4" y="190" font-family="Kalam,cursive" font-size="15" fill="#c2185b">each word coming next.</text>' +
    '<text x="4" y="216" font-family="Kalam,cursive" font-size="15" fill="#c2185b">Not whether it is true!</text></g></svg>';
  var POSTER = '<h4>How Magpie writes</h4><div class="two"><div>' +
    '<p>Magpie does not look anything up. It writes <b>one word at a time</b>.</p>' +
    '<p>Each time, it asks: in all the text I learnt from, which word usually comes next after words like these? Then it writes one of the likeliest. A program that does this is called a <b>language model</b>: it <b>predicts</b> the next word.</p>' +
    '<p>It has read a great deal, so its sentences are <b>fluent</b>: they sound right. But likely is not the same as true. If a wrong idea was common in the text it learnt from, the wrong word can be the likeliest one.</p>' +
    '<p>It can also join true pieces together into something false, or write a quotation, a date or a book that never existed. This is called a <b>hallucination</b>.</p>' +
    '<p class="big">Magpie sounds just as sure when it is wrong as when it is right.</p></div>' + DIA + '</div>';
  $('#poster').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: POSTER, cls: 'mg-poster', clue: { id: 'how', title: 'Poster: how Magpie writes', kind: 'On the wall' }, done: function () {
      MG.terms(['language model', 'predict', 'fluent', 'hallucination', 'probability']);
      if (tell('poster')) { paint(); ER.say('One word at a time. Likely is not the same as true.'); }
    } });
  });

  var ALGO = '<h4>Algorithm</h4>' +
    '<p><b>algorithm</b> (noun): a list of steps that solves a problem. You follow the steps exactly, in order.</p>' +
    '<p>A recipe is an algorithm. So is the way you do long division. A computer program is a set of algorithms written so that a machine can follow them.</p>' +
    '<p>The word comes from the name of al-Khwarizmi, a mathematician who worked in Baghdad about 1,200 years ago. When his books were put into Latin, his name was written Algoritmi.</p>' +
    '<p class="big">A computer follows the steps. It does not ask whether they make sense.</p>';
  $('#algo').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: ALGO, cls: 'mg-poster algo', clue: { id: 'algo', title: 'Poster: algorithm', kind: 'On the wall' }, done: function () {
      MG.terms(['algorithm']);
      if (tell('algo')) ER.say('A list of steps, followed exactly. Like toast.');
    } });
  });

  function pb(w, n, pick) { return '<div class="pb' + (pick ? ' pick' : '') + '"><span>' + w + '</span><i style="width:' + n + '%"></i><span>' + n + '%</span></div>'; }
  var WORK = '<div class="bar">' + '<svg viewBox="0 0 100 100">' + MG.logo(0, 0, 1) + '</svg>' + 'MAGPIE &middot; show working (a staff setting, switched on by Mr Ruskin)</div><div class="in">' +
    '<h4>Leo&rsquo;s questions this afternoon</h4><div class="hist">how far is the moon from earth<br>when did galileo see the phases of venus<br>which planet is the hottest<br>why is mercury the hottest planet<br>how many planets are there<br>&hellip; and 25 more</div>' +
    '<h4>How Magpie chose a word</h4>' +
    '<div class="step"><p>Answer to &ldquo;which planet is the hottest&rdquo;, at the word after <b>&ldquo;The hottest planet is&rdquo;</b>:</p>' + pb('Mercury', 61, 1) + pb('Venus', 35) + pb('Mars', 2) + pb('Jupiter', 1) + pb('other', 1) + '</div>' +
    '<div class="step"><p>Answer to &ldquo;when did galileo see the phases of venus&rdquo;, at the word after <b>&ldquo;Galileo saw the phases of Venus in&rdquo;</b>:</p>' + pb('1609', 48, 1) + pb('1610', 44) + pb('1612', 4) + pb('other', 4) + '</div>' +
    '<p class="note">Magpie writes one of the likeliest words: usually the likeliest of all, now and then the next one down. The numbers are not how sure it ought to be. They say how often words like these came next in the text it learnt from.</p></div>';
  $('#pc').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: WORK, cls: 'mg-screen', clue: { id: 'working', title: 'Magpie’s working: 61% Mercury', kind: 'On Leo’s screen' }, done: function () {
      if (tell('pc')) ER.say('Sixty-one per cent Mercury, thirty-five per cent Venus. And then it wrote Mercury as if it had never had a doubt.');
    } });
  });

  MG.thing('#blinds', 'blinds', 'Orange light from the street lamp in the car park comes through the blinds in stripes.', isBusy);
  MG.thing('#plant', null, 'A spider plant, older than any computer in the room, and better looked after.', isBusy);
  MG.thing('#printer', 'printer', 'A small orange light says PAPER JAM. A sticker on the printer says it has said PAPER JAM since March.', isBusy);
  MG.thing('#clock', null, 'Twenty to seven. The head decides at quarter past eight.', isBusy);
  MG.thing('#exit', 'fire exit', null, isBusy);
  MG.thing('#mons .mon', null, 'Asleep. A small blue light on each one breathes slowly in and out.', isBusy);
  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('MERCURY IS THE HOTTEST PLANET IN THE SOLAR SYSTEM. And, for Venus, exactly the same.'); return; }
    if (!told.ruskin) { ER.say('TINY MAGPIE, says the whiteboard. Mr Ruskin is watching you look at it. Ask him first.'); return; }
    if (!told.sheet) { ER.say('&ldquo;Leo&rsquo;s sheet first,&rdquo; says Mr Ruskin. &ldquo;You need to know what we&rsquo;re explaining.&rdquo;'); return; }
    if (!told.poster) { ER.say('&ldquo;My poster,&rdquo; says Mr Ruskin, pointing his cup at it. &ldquo;The blue one. Five minutes of my life in September.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- Tiny Magpie ---------- */
  function toks(s) { return s.replace(/\./g, ' .').split(' ').filter(Boolean); }
  function key(t) { return t === '.' ? 'stop' : t.toLowerCase(); }
  function makeLock() {
    var picked = ER.flag('a-words') || [], wait = false;
    var box = ER.el('div', 'pz tm');
    box.innerHTML = '<div class="tm-in"><div><h4>TINY MAGPIE<small>has read these twelve sentences, and nothing else</small></h4><ol class="tm-s">' +
      SENT.map(function (s) { return '<li>' + toks(s).map(function (t) { return '<span class="tw' + (t === '.' ? ' stop' : '') + '" data-t="' + t + '">' + t + '</span>'; }).join(' ') + '</li>'; }).join('') + '</ol></div>' +
      '<div><div class="tm-rules"><h5>How it writes (its algorithm)</h5><ol>' +
      '<li>Look at the last two words it has written.</li>' +
      '<li>Find every place in the twelve sentences where those two words come together.</li>' +
      '<li>Write the word that comes next most often. (A full stop counts as a word.)</li>' +
      '<li>If two words come next equally often, write the one from the earlier sentence.</li>' +
      '<li>Go back to step 1. Stop after a full stop.</li></ol></div>' +
      '<div class="tm-out"><h5>What Tiny Magpie will write</h5><p class="tm-line"><span class="g">Mercury is</span> <span id="tm-w"></span><span class="caret"></span></p>' +
      '<div class="tm-btns"><button type="button" id="tm-undo">Rub out the last word</button><button type="button" id="tm-clr">Start again</button></div></div>' +
      '<div class="tm-steps" id="tm-steps" style="display:none"></div></div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="tm-go">Run Tiny Magpie</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function show() { box.querySelector('#tm-w').textContent = picked.join(' ').replace(/ \./g, '.'); ER.flag('a-words', picked); }
    ER.$$('.tw', box).forEach(function (n) {
      n.addEventListener('click', function () {
        if (wait || nextFile) return;
        if (picked.length && picked[picked.length - 1] === '.') { msg('Tiny Magpie has already written a full stop, and it stops after a full stop. Rub out a word to change it.'); return; }
        if (picked.length >= 12) { msg('That is a very long sentence for Tiny Magpie. Rub something out.'); return; }
        picked.push(n.getAttribute('data-t')); MG.sfx.keys(1); show(); msg('');
      });
    });
    box.querySelector('#tm-undo').addEventListener('click', function () { if (wait || nextFile) return; picked.pop(); show(); });
    box.querySelector('#tm-clr').addEventListener('click', function () { if (wait || nextFile) return; picked = []; show(); });
    show();
    function q(t) { return '&ldquo;' + (t === '.' ? 'full stop' : t) + '&rdquo;'; }
    box.querySelector('#tm-go').addEventListener('click', function () {
      var all = ['Mercury', 'is'].concat(picked), k, file;
      if (wait || nextFile) return;
      if (!picked.length) { ER.sfx.no(); msg('&ldquo;Give it something to do,&rdquo; says Mr Ruskin. &ldquo;Click the words it will write, one at a time, in the sentences on the left.&rdquo;'); return; }
      for (k = 0; k < picked.length; k++) {
        if (!ER.check('p' + (k + 3), key(picked[k]))) {
          ER.sfx.no(); ER.shake(box.querySelector('.tm-out'));
          var a = all[k], b = all[k + 1];
          if (k === 1 && key(picked[k]) === 'closest') msg('&ldquo;That&rsquo;s sentence 1, word for word,&rdquo; says Mr Ruskin. &ldquo;Tiny Magpie doesn&rsquo;t copy a sentence. After &lsquo;is the&rsquo;, count what comes next in all twelve.&rdquo;');
          else if (k === 3 && key(picked[k]) === 'because') msg('&ldquo;Right as far as &lsquo;hottest planet&rsquo;,&rdquo; says Mr Ruskin. &ldquo;After those two words, two different words come next, once each. Read rule 4 again.&rdquo;');
          else msg('Tiny Magpie agrees with you as far as ' + q(all[k + 1]) + '. Then it writes something else. After ' + q(a) + ' and ' + q(b) + ', find every place those two words come together, and count what comes next.');
          return;
        }
      }
      if (picked[picked.length - 1] !== '.') { ER.sfx.no(); msg('&ldquo;So far, so right,&rdquo; says Mr Ruskin. &ldquo;But it doesn&rsquo;t stop until a full stop is the word that comes next. Keep going.&rdquo;'); return; }
      file = ER.exit([picked.map(key).join('-')], { wait: true });
      if (!file) { msg('The whiteboard freezes. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file);
      replay(all);
      MG.mine('tiny', 'Tiny Magpie', '<p>Started with &ldquo;Mercury is&rdquo;. It wrote: Mercury is the hottest planet in the Solar System.</p><p>Every three words in a row of that are somewhere in the twelve sentences. The whole sentence is in none of them.</p><p>Started with &ldquo;Venus is&rdquo;, it wrote the same sentence.</p><p>It writes the word that came next most often, not the true one.</p>', true);
      msg('&ldquo;Yes,&rdquo; says Mr Ruskin, very quietly. &ldquo;That&rsquo;s what it writes. Now find that sentence in the twelve.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Tiny Magpie writes it in a second: MERCURY IS THE HOTTEST PLANET IN THE SOLAR SYSTEM.',
          'You look for that sentence on the board. It is not there. Sentence 1 starts it, sentence 2 finishes it, and not one of the twelve says it.',
          'Mr Ruskin types VENUS IS. Tiny Magpie writes: VENUS IS THE HOTTEST PLANET IN THE SOLAR SYSTEM. The same words, exactly.',
          '&ldquo;It says it about Mercury and it says it about Venus,&rdquo; says Mr Ruskin. &ldquo;They can&rsquo;t both be true. It doesn&rsquo;t know what&rsquo;s true. It knows which words come after which.&rdquo;',
          '&ldquo;Magpie is the same thing,&rdquo; he says, &ldquo;with forty-one thousand pages instead of twelve sentences, and a much longer memory than two words. So the real question is: what did it read?&rdquo;',
          '&ldquo;Mr Moreno trained it,&rdquo; says Leo. &ldquo;He&rsquo;s in the server cupboard.&rdquo; &mdash; &ldquo;He&rsquo;s always in the server cupboard,&rdquo; says Mr Ruskin.'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 3800);
    });
    /* after the door has opened: every step again, with the counts as bars */
    function replay(all) {
      var sents = SENT.map(function (s) { return toks(s).map(key); }), out = '', i;
      for (i = 0; i + 2 < all.length; i++) {
        var a = key(all[i]), b = key(all[i + 1]), c = {}, order = [], tot = 0;
        sents.forEach(function (w) { for (var j = 0; j + 2 < w.length + 1; j++) if (w[j] === a && w[j + 1] === b && w[j + 2]) { if (!c[w[j + 2]]) { c[w[j + 2]] = 0; order.push(w[j + 2]); } c[w[j + 2]]++; tot++; } });
        out += '<div class="st"><b>' + all[i] + ' ' + all[i + 1] + ' &rarr;</b>' + order.map(function (w) {
          return '<div class="pb' + (w === key(all[i + 2]) ? ' pick' : '') + '"><span>' + (w === 'stop' ? '.' : w) + '</span><i style="width:' + Math.round(100 * c[w] / tot) + '%"></i><span>' + c[w] + ' of ' + tot + '</span></div>';
        }).join('') + '</div>';
      }
      var st = box.querySelector('#tm-steps'); st.innerHTML = out; st.style.display = 'block';
      box.querySelector('.tm-rules').style.display = 'none';
    }
    msg('Click, in the sentences on the left, each word that Tiny Magpie will write after &ldquo;Mercury is&rdquo;. Then run it.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
</body>
</html>
