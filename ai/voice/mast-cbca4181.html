    '<p>Mains electricity in Britain is meant to run at 50 hertz. It never runs at exactly 50. When the whole country switches on more kettles than the power stations expected, the <b>frequency</b> drops a little; when people switch things off, it rises. By law it must stay between 49.5 and 50.5 hertz, and all day long it wanders up and down inside that.</p>' +

    '<p>A made voice can copy the sound of a hum. It cannot copy the wander of a moment it never heard.</p>' +
    '<p class="hand">Honest bit: in real cases you want a clean hum and usually a longer recording than ours. &mdash; I.K.</p></div>' +
    '<svg viewBox="0 0 230 210" xmlns="http://www.w3.org/2000/svg"><g font-family="Roboto Mono,monospace" font-size="10.5"><text x="0" y="12" fill="#16191c">50.02 Hz</text><text x="0" y="112" fill="#16191c">49.98 Hz</text>' +
    '<path d="M0 60q15 -26 30 -6t30 -20t30 22t30 -30t30 14t30 6t40 -10" stroke="#16191c" stroke-width="2.5" fill="none"/><rect x="88" y="20" width="62" height="72" fill="#e2c21e" opacity=".35" stroke="#7a5a00"/>' +
    '<text x="0" y="140" fill="#7a5a00">the recording&rsquo;s hum lies</text><text x="0" y="156" fill="#7a5a00">on the grid&rsquo;s line here,</text><text x="0" y="172" fill="#7a5a00">and nowhere else.</text></g></svg></div>';
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'vg-card', clue: { id: 'card', title: 'The Hum Clock', kind: 'Card on the wall' }, done: function () {
      VX.terms(['frequency', 'grid', 'mains', 'hum']);
      if (tell('card')) { paint(); ER.say('A real hum wanders with the whole country&rsquo;s electricity. A made one cannot copy a moment it never heard.'); }
    } });
  });
  var LOGGER = '<h4>THE LOGGER</h4><p>This machine records everything Radio Greyhithe broadcasts, every second of the day and night.</p><p><b>The law:</b> Ofcom, which looks after radio and television in the United Kingdom, requires a radio station to keep a recording of everything it broadcasts for 42 days, so that complaints can be checked against what really went out.</p><p class="hand">So if you said something rude on air last month, it is still in here. &mdash; I.K.</p>';
  $('#logger').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LOGGER, cls: 'vg-card', clue: { id: 'logger', title: 'The logger: 42 days', kind: 'Sign on the cabinet' }, done: function () {
      VX.terms(['logger', 'broadcast']);
      if (tell('logger')) { paint(); ER.say('Everything that went out on air for the last 42 days, kept by law.'); }
    } });
  });
  VX.thing('#tx', 'transmitter', 'The transmitter: the cabinet that turns the station&rsquo;s sound into a radio signal and sends it up the mast. It says DANGER in three places, and means it.', isBusy);
  VX.thing('#win', 'mast', 'The mast: forty metres of steel. Its red lights are for aircraft, so that nothing flying low at night runs into it.', isBusy);
  VX.thing('#kettle', 'kettle', 'Ivo&rsquo;s kettle. &ldquo;Every kettle in Britain moves the grid a tiny bit,&rdquo; says Ivo. &ldquo;Mine moves it a bit more. I make a lot of tea.&rdquo;', isBusy);
  $('#lena').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Town Hall,&rdquo; says Lena. &ldquo;She&rsquo;s still there. I can see her light from here.&rdquo;' : '&ldquo;I&rsquo;m not touching anything,&rdquo; says Lena from the doorway. &ldquo;The last time I touched something up here, the whole valley heard twenty minutes of silence.&rdquo;');
  });
  $('#sheep').addEventListener('click', function (e) { if (busy) return; e.stopPropagation(); ER.say(['Two small green eyes, outside in the dark. A sheep, watching the hut. Sheep do not care about the mayor.', 'The sheep is still there. It has been there, Ivo says, since 2019.'][sheepN++ % 2]); });
  $('#laptop').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Tuesday, 18.02.14, to the second.'); return; }
    if (!told.ivo) { ER.say('Ivo&rsquo;s laptop. Ask him first: it is his.'); return; }
    if (!told.card) { ER.say('&ldquo;Read the card first,&rdquo; says Ivo. &ldquo;On the wall. It&rsquo;s got a picture.&rdquo;'); return; }
    if (!told.logger) { ER.say('&ldquo;And meet the logger,&rdquo; says Ivo. &ldquo;Grey cabinet. We&rsquo;ll need it.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: line up the hum ---------- */
  function makeLock() {
    var st = ER.flag('d-st') || { piece: '', win: '', off: 0 }, wait = false;
    var GX = 70, GW = 1000, SEC = 120, PXS = GW / SEC, MID = 170, YS = 4.2;
    var box = ER.el('div', 'pz hc');
    function hm(o, add) { var t = o[1] * 3600 + o[2] * 60 + o[3] + add, m = Math.floor(t / 60) % 60, sc = t % 60; return Math.floor(t / 3600) + '.' + (m < 10 ? '0' : '') + m + '.' + (sc < 10 ? '0' : '') + sc; }
    box.innerHTML = '<div class="hc-in"><div class="hc-row"><b>THE HUM CLOCK</b>PIECE OF THE CLIP: <button type="button" data-k="whole">whole clip 0:00&ndash;0:40</button><button type="button" data-k="first">first piece 0:00&ndash;0:11</button><button type="button" data-k="rest">the rest 0:11&ndash;0:40</button></div>' +
      '<div class="hc-row">GRID WINDOW: ' + ['tue', 'wed', 'fri'].map(function (w) { var o = WIN[w]; return '<button type="button" data-w="' + w + '">' + o[0] + ' &middot; ' + hm(o, 0) + '&ndash;' + hm(o, 120) + ' &middot; ' + o[4] + '</button>'; }).join('') + '</div>' +
      '<svg id="hc-svg" viewBox="0 0 1100 340" xmlns="http://www.w3.org/2000/svg"><rect width="1100" height="340" fill="#0a0f15"/><g id="hc-axes"></g><path id="hc-grid" d="" fill="none" stroke="#7fb8ff" stroke-width="2.5"/>' +
      '<g id="hc-strip"><rect id="hc-box" x="0" y="20" width="10" height="300" fill="#ffb84d" opacity=".12" stroke="#ffb84d" stroke-width="1.5"/><path id="hc-line" d="" fill="none" stroke="#ffb84d" stroke-width="3"/></g></svg>' +
      '<div class="hc-row"><button type="button" id="hc-l2">&#9664;&#9664;</button><button type="button" id="hc-l">&#9664; 1 s</button><button type="button" id="hc-r">1 s &#9654;</button><button type="button" id="hc-r2">&#9654;&#9654;</button><span class="sp"></span><span class="hc-read" id="hc-read"></span></div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="hc-go">That&rsquo;s when it was recorded</button></div>';
    var msgEl = box.querySelector('.pmsg'), sv = box.querySelector('#hc-svg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    var ax = '';
    for (var v = -30; v <= 30; v += 10) ax += '<path d="M' + GX + ' ' + (MID - v * YS) + 'H' + (GX + GW) + '" stroke="' + (v ? '#18222e' : '#2a3a4a') + '" stroke-width="1"/><text x="' + (GX - 6) + '" y="' + (MID - v * YS + 4) + '" font-family="Roboto Mono,monospace" font-size="10" text-anchor="end" fill="#6a7a8a">' + (50 + v / 1000).toFixed(3) + '</text>';
    for (var s = 0; s <= SEC; s += 10) ax += '<path d="M' + (GX + s * PXS) + ' 320v6" stroke="#4a5a6a"/>';
    box.querySelector('#hc-axes').innerHTML = ax + '<g id="hc-ticks"></g>';
    function hms(w, off) {
      var o = WIN[w], t = o[1] * 3600 + o[2] * 60 + o[3] + off, h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sc = t % 60;
      return h + ':' + (m < 10 ? '0' : '') + m + ':' + (sc < 10 ? '0' : '') + sc;
    }
    function len() { return piece(st.piece || 'first').length; }
    function maxOff() { return Math.max(0, SEC - Math.ceil(len() / 2)); }
    function draw() {
      ER.$$('.hc-row button[data-k]', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-k') === st.piece); });
      ER.$$('.hc-row button[data-w]', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-w') === st.win); });
      var g = st.win ? REC[st.win] : null, p = [], i;
      if (g) for (i = 0; i < g.length; i++) p.push((GX + i * PXS / 2).toFixed(1) + ' ' + (MID - g[i] * YS).toFixed(1));
      box.querySelector('#hc-grid').setAttribute('d', p.length ? 'M' + p.join('L') : '');
      var tk = '';
      if (st.win) for (var s2 = 0; s2 <= SEC; s2 += 20) tk += '<text x="' + (GX + s2 * PXS) + '" y="338" font-family="Roboto Mono,monospace" font-size="10" text-anchor="middle" fill="#6a7a8a">' + hms(st.win, s2) + '</text>';
      box.querySelector('#hc-ticks').innerHTML = tk;
      var strip = box.querySelector('#hc-strip');
      strip.style.display = st.piece ? '' : 'none';
      if (st.piece) {
        var a = piece(st.piece), q = [];
        st.off = Math.max(0, Math.min(maxOff(), st.off));
        for (i = 0; i < a.length; i++) q.push((i * PXS / 2).toFixed(1) + ' ' + (MID - a[i] * YS).toFixed(1));
        box.querySelector('#hc-line').setAttribute('d', 'M' + q.join('L'));
        box.querySelector('#hc-box').setAttribute('width', ((a.length - 1) * PXS / 2).toFixed(1));
        strip.setAttribute('transform', 'translate(' + (GX + st.off * PXS).toFixed(1) + ' 0)');
      }
      box.querySelector('#hc-read').innerHTML = !st.piece ? 'choose a piece of the clip' : !st.win ? 'choose a grid window' : 'left edge of the strip: <b>' + hms(st.win, st.off) + '</b>';
    }
    function save() { ER.flag('d-st', st); }
    ER.$$('.hc-row button[data-k]', box).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; st.piece = b.getAttribute('data-k'); save(); VX.sfx.fader(); draw(); }); });
    ER.$$('.hc-row button[data-w]', box).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; st.win = b.getAttribute('data-w'); save(); VX.sfx.fader(); draw(); }); });
    function nudge(d) { if (wait || nextFile || !st.piece) return; st.off += d; save(); draw(); VX.sfx.marker(); }
    box.querySelector('#hc-l').addEventListener('click', function () { nudge(-1); });
    box.querySelector('#hc-r').addEventListener('click', function () { nudge(1); });
    box.querySelector('#hc-l2').addEventListener('click', function () { nudge(-10); });
    box.querySelector('#hc-r2').addEventListener('click', function () { nudge(10); });
    var dragFrom = null;
    ER.drag(box.querySelector('#hc-strip'), {
      start: function (e) { if (wait || nextFile) return false; dragFrom = { x: ER.pt(sv, e).x, off: st.off }; },
      move: function (e) { if (!dragFrom) return; st.off = Math.round(dragFrom.off + (ER.pt(sv, e).x - dragFrom.x) / PXS); draw(); },
      end: function () { dragFrom = null; save(); }
    });
    box.querySelector('#hc-go').addEventListener('click', function () {
      var t, file;
      if (wait || nextFile) return;
      if (!st.piece || !st.win) { ER.sfx.no(); msg('&ldquo;Pick a piece and a window first,&rdquo; says Ivo.'); return; }
      if (st.piece === 'rest') { ER.sfx.no(); msg('&ldquo;A line that flat matches nowhere,&rdquo; says Ivo. &ldquo;The grid is never still for half a minute. So those twenty-nine seconds were never recorded near real mains at all. Which piece might have been?&rdquo;'); return; }
      if (st.piece === 'whole') { ER.sfx.no(); msg('&ldquo;The start might fit somewhere,&rdquo; says Ivo, &ldquo;but then the clip&rsquo;s hum goes dead flat, and the grid never does. Measure only the piece with a real room under it.&rdquo;'); return; }
      t = hms(st.win, st.off);
      if (!ER.check('win', st.win)) { ER.sfx.no(); msg('&ldquo;Slide it right along,&rdquo; says Ivo. &ldquo;Nothing in these two minutes wiggles like that. Not ' + (st.win === 'wed' ? 'Wednesday at eight' : 'Friday at ten to nine') + ', then.&rdquo;'); return; }
      if (ER.check('near', t)) { ER.sfx.no(); msg('&ldquo;Close,&rdquo; says Ivo. &ldquo;The big rise is nearly there, but the little dip at the start doesn&rsquo;t sit on the line. A second or two.&rdquo;'); return; }
      file = ER.exit([st.win + '-' + st.piece + '-' + t], { wait: true });
      if (!file) { ER.sfx.no(); msg('&ldquo;Not there,&rdquo; says Ivo. &ldquo;The wiggles don&rsquo;t sit on each other. Keep sliding.&rdquo;'); return; }
      wait = true; nextFile = file; ER.flag('d-file', file);
      VX.terms(['grid', 'frequency', 'logger']);
      VX.mine('hum', 'The hum clock', '<p>The hum of piece 1 lies exactly on the grid&rsquo;s record for Tuesday 13 October at 18.02.14: Ask the Mayor.</p><p>Not Wednesday at eight (the email), not Friday at 20.51.</p><p>The other four sentences have a dead-flat hum that fits no moment at all: never recorded near real mains.</p><p>The logger, Tuesday 18.02.14: &ldquo;Listen. I&rsquo;ll be straight with you, because you&rsquo;ve asked me straight. The flood wall comes first. Low Street will not take its chances while I&rsquo;m mayor.&rdquo;</p>', true);
      msg('&ldquo;There,&rdquo; says Ivo softly. &ldquo;Like tracing paper.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'The two wiggly lines lie on top of each other like tracing paper. &ldquo;Tuesday the thirteenth,&rdquo; says Ivo. &ldquo;Two minutes and fourteen seconds past six.&rdquo;',
          '&ldquo;Ask the Mayor,&rdquo; says Lena from the doorway. &ldquo;She goes on air at six.&rdquo;',
          'Ivo types the time into the logger and presses PLAY. Out of its little speaker comes the mayor, live last Tuesday, answering a caller from Low Street: &ldquo;Listen. I&rsquo;ll be straight with you, because you&rsquo;ve asked me straight. The flood wall comes first. Low Street will not take its chances while I&rsquo;m mayor.&rdquo;',
          'Nobody says anything for a moment. The wind leans on the hut.',
          '&ldquo;Eleven real seconds, from our own programme,&rdquo; says Lena at last. &ldquo;Then four sentences in her voice that she never said, with a hum from no moment at all. Somebody took her own words and made her say the opposite.&rdquo;',
          '&ldquo;Now we put it to her. Page 12 says so, and so do I.&rdquo; She looks down at the town. &ldquo;She&rsquo;s still in her office. I can see her light from here.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2600);
    });
    draw();
    msg('Choose a piece of the clip and a grid window. Slide the strip until its wiggles lie on the grid&rsquo;s line, then say when.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
