  .wt .pmsg{color:#f1e9ee}

    paint();

    if (told.in) { busy = false; ER.say('Studio B. The computer is playing music to the valley, and nobody is listening to it.'); return; }
    tell('in');
    ER.narrate([
      'Studio B is the size of a big wardrobe, and most of it is microphone. The walls are covered in grey foam, to stop any echo. Above the door the ON AIR sign is dark: tonight the music is coming from a computer in the corner.',
      'Lena sits at the desk with her headphones round her neck. On the screen in front of her: chandra_call.wav, forty seconds, a long green squiggle.',
      'On top of the speaker by the door, the station cat is asleep on the warmest thing in the room.'
    ], function () { busy = false; });
  }

  $('#lena').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;The desk next door shows more than my ears do,&rdquo; says Lena. &ldquo;Come on.&rdquo;'); return; }
    ER.talk({
      who: 'Lena Sokolova', role: 'Night editor · reads the news at eleven', face: VX.face('lena'),
      lines: [
        { note: 'She holds up one hand until the clip has finished. Then she takes the headphones off.', a: '&ldquo;That&rsquo;s Frances Chandra. The mayor. Or it&rsquo;s a very good copy of her.&rdquo;' },
        { q: 'What does she say?', a: '<p>' + CLIP + '</p><p>&ldquo;On Monday night the council votes: a flood wall for Low Street, or a marina for the yachts. There isn&rsquo;t money for both.&rdquo;</p>' },
        { q: 'Who sent it?', a: 'Somebody called lowstreetwatch. Says the mayor rang them on Wednesday and they recorded the call. Says every paper gets it at midnight. So if we want it first, it goes in the eleven o&rsquo;clock news.' },
        { q: 'Will it?', a: 'If it&rsquo;s real, it&rsquo;s the biggest story this station has had since the pier fell down. If a computer made it and we play it, it&rsquo;s the last story this station ever has.' },
        { q: 'Can&rsquo;t you tell by listening?', a: 'I&rsquo;ve done nothing but listen. It sounds like her. It starts the way she always starts: &ldquo;Listen. I&rsquo;ll be straight with you.&rdquo; She says that every Tuesday on Ask the Mayor. But a few words sound wrong. I&rsquo;ve written down what I hear. Page 9 of the guide is about this. I wrote page 9. I never thought I&rsquo;d need it.' },
        { note: 'She points at the six boxes on the shelf.', a: '&ldquo;If a machine made it, it learnt her voice from somewhere. That shelf is every recording of her I know about. Find me which one it learnt from, and we&rsquo;ll know what we&rsquo;re dealing with.&rdquo;' }
      ],
      clue: { id: 'lena1', title: 'Lena: the clip and the shelf', kind: 'What she said' },
      done: function (seen) { if (seen && tell('lena')) { paint(); ER.say('Her notepad is on the desk. Page 9 is on the wall. The boxes are on the shelf.'); } }
    });
  });

  var NOTEPAD = '<h4>chandra_call.wav &middot; what I hear &middot; L.S.</h4>' + NOTES.map(function (n, i) { return '<p><span class="n">' + (i + 1) + '.</span>' + n + '</p>'; }).join('') + '<p>&nbsp;</p><p>Sounds like her. That&rsquo;s the problem.</p>';
  $('#notepad').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: NOTEPAD, cls: 'vg-note', clue: { id: 'notes', title: 'Lena&rsquo;s notes: what she hears', kind: 'Her notepad' }, done: function () {
      VX.terms(['stress', 'warble']);
      if (tell('notes')) { paint(); ER.say('Seven things Lena heard. Some are about the words, some about the room.'); }
    } });
  });

  var GUIDE = '<div class="hd">RADIO GREYHITHE &middot; GUIDE FOR PRODUCERS</div><h4>9. Voices made by machines</h4><div class="two"><div>' +
    '<p>A <b>synthetic</b> voice is made by a computer program, a <b>voice model</b>. First the model is <b>trained</b> on recordings of one person. It learns the patterns of that voice: its pitch, its speed, how it says each sound, where it breathes. Then it can say new sentences in that voice: sentences the person never said.</p>' +
    '<p>It needs examples. Some tools make a rough copy from a minute of speech. A good copy needs hours of clear speech.</p>' +
    '<p>What it learnt from leaves <b>traces</b>:</p><ul><li>Words it heard hundreds of times come out perfectly. Words it heard once or twice, or never, can come out oddly: the wrong stress, a flat tone.</li>' +
    '<li>It copies breathing from its recordings, so it breathes too.</li><li>It copies the room: the echo of a hall, the hum of a studio.</li></ul>' +
    '<p>By ear alone you cannot be sure. Ears notice odd things. They cannot prove where the odd things came from.</p></div>' +
    '<div><svg viewBox="0 0 250 330" xmlns="http://www.w3.org/2000/svg"><g font-family="Inter,sans-serif" font-size="12">' +
    '<rect x="10" y="10" width="54" height="40" fill="#b8322a"/><rect x="70" y="10" width="54" height="40" fill="#2f6a5e"/><rect x="130" y="10" width="54" height="40" fill="#c9a020"/><text x="125" y="68" text-anchor="middle" fill="#1e2226">hours of recordings of ONE person</text>' +
    '<path d="M125 76v26" stroke="#1e2226" stroke-width="3"/><path d="M117 96l8 10 8 -10" fill="#1e2226"/>' +
    '<rect x="50" y="112" width="150" height="60" rx="10" fill="#1e2226"/><g fill="#7fe0c0"><circle cx="76" cy="142" r="8"/><circle cx="104" cy="142" r="8"/><circle cx="132" cy="142" r="8"/></g><text x="166" y="147" text-anchor="middle" fill="#fff" font-weight="700">model</text>' +
    '<path d="M125 176v26" stroke="#1e2226" stroke-width="3"/><path d="M117 196l8 10 8 -10" fill="#1e2226"/>' +
    '<path d="M20 214h210v52h-150l-20 18v-18h-40z" fill="#fff" stroke="#1e2226" stroke-width="2"/><text x="125" y="236" text-anchor="middle" fill="#1e2226">a NEW sentence,</text><text x="125" y="254" text-anchor="middle" fill="#1e2226">in that voice</text>' +
    '<text x="10" y="308" fill="#2f6a5e" font-weight="700">heard 200 times &#8594; perfect</text><text x="10" y="326" fill="#b8322a" font-weight="700">heard twice &#8594; odd</text></g></svg></div></div>' +
    '<p class="pg">page 9</p>';
  $('#guide').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: GUIDE, cls: 'vg-guide', clue: { id: 'guide9', title: 'Guide, page 9: voices made by machines', kind: 'Pinned to the wall' }, done: function () {
      VX.terms(['synthetic', 'voice model', 'trained', 'recording', 'trace']);
      if (tell('guide')) { paint(); ER.say('Hours make a good copy. What it heard often comes out perfect; what it hardly heard comes out odd. It copies breaths and rooms.'); }
    } });
  });

  var SHELF = '<h4>THE SHELF &middot; every recording of the mayor we know of</h4><div class="cards">' + SRC.map(function (s, i) {
    return '<div class="card"><b>' + 'ABCDEF'.charAt(i) + ' &middot; ' + s.name + '</b>' + s.where + '<br>' + s.size + '<br><i>her words, counted: ' + s.w + '</i></div>';
  }).join('') + '</div>';
  $('#shelf').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SHELF, cls: 'vg-shelf', clue: { id: 'shelf', title: 'The shelf: six recordings of the mayor', kind: 'Index cards' }, done: function () {
      VX.terms(['archive', 'episode']);
      if (tell('shelf')) { paint(); ER.say('Six sets of recordings. Different rooms, different lengths, different words.'); }
    } });
  });

  var STICKER = '<h4>WARBLE ON THE LINE?</h4><p>Mobile phones drop tiny bits of sound when the signal is weak, or when the phone is cheap: half a second goes underwater. It happens on the phone-in every week. It does NOT mean the caller is a robot.</p><p class="hand">&mdash; Ivo (engineer)</p>' +
    '<p class="fact"><b>Did you know?</b> An ordinary phone call carries only the sounds between about 300 and 3,400 hertz. That is why voices on the phone sound thin.</p>';
  $('#sticker').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: STICKER, cls: 'vg-sticker', clue: { id: 'sticker', title: 'Ivo&rsquo;s sticker: a warble on the line', kind: 'Phone-in desk' }, done: function () {
      VX.terms(['phone-in', 'hertz']);
      if (tell('sticker')) ER.say('&ldquo;Ivo sticks those on everything,&rdquo; says Lena. &ldquo;He&rsquo;s usually right. It&rsquo;s very annoying.&rdquo;');
    } });
  });
  $('#cat').addEventListener('click', function () {
    if (busy) return;
    catN++;
    var L = ['The station cat, Decibel. She came with the building. She has never once been on air, and she would like to keep it that way.', 'Decibel opens one eye at the word &ldquo;mayor&rdquo;, and shuts it again.', 'Decibel is warm and asleep, and the only one in the building who is not worried about eleven o&rsquo;clock.'];
    ER.say(L[(catN - 1) % L.length]);
  });
  VX.thing('#onair', 'on air', 'The ON AIR sign. It lights when a microphone is open. At eleven Lena will open hers and read the news.', isBusy);
  VX.thing('#clock', null, 'The studio clock: 21.40. One hour and twenty minutes to the news.', isBusy);
  VX.thing('#mic', null, 'Lena&rsquo;s microphone, folded back on its arm. It is the only thing in the room that is not allowed to hear the clip.', isBusy);
  VX.thing('#mug', null, 'A mug that says 104.6. The tea in it has gone cold and grown a skin.', isBusy);
  $('#screen').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('A good copy, trained on twenty-six hours of Ask the Mayor. If it is a copy at all.'); return; }
    if (!told.lena) { ER.say('Forty seconds of green squiggle. Ask Lena what it is first.'); return; }
    if (!told.notes) { ER.say('&ldquo;Read what I heard first,&rdquo; says Lena. &ldquo;My notepad. Green top.&rdquo;'); return; }
    if (!told.guide) { ER.say('&ldquo;Page 9,&rdquo; says Lena. &ldquo;On the wall. I wrote it so that nobody would have to guess.&rdquo;'); return; }
    if (!told.shelf) { ER.say('&ldquo;And the shelf,&rdquo; says Lena. &ldquo;Boxes A to F. Everything of her we know about.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: which recordings taught this voice? ---------- */
  function makeLock() {
    var st = ER.flag('a-st') || { src: '', x: {} }, wait = false;
    var box = ER.el('div', 'pz wt');
    box.innerHTML = '<div class="wt-in"><div class="wt-hd"><b>WHAT TAUGHT IT?</b><span>Hang the label on the recordings this voice learnt from. Strike out any note that tells you nothing about that.</span></div>' +
      '<div><div class="wt-src">' + SRC.map(function (s, i) { return '<div class="ws" data-id="' + s.id + '"><span class="tag">TRAINED ON</span><b>' + 'ABCDEF'.charAt(i) + ' &middot; ' + s.name + '</b>' + s.where + '<br>' + s.size + '<br><i>' + s.w + '</i></div>'; }).join('') + '</div>' +
      '<div class="wt-clip" style="margin-top:8px"><small>chandra_call.wav &middot; 0:40 &middot;</small> ' + CLIP + '</div></div>' +
      '<div class="wt-notes">' + NOTES.map(function (n, i) { return '<div class="wn" data-n="' + (i + 1) + '"><u>' + (i + 1) + '.</u><span>' + n + '</span><em>TELLS NOTHING</em></div>'; }).join('') + '</div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="wt-go">Tell Lena</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintL() {
      ER.$$('.ws', box).forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-id') === st.src); });
      ER.$$('.wn', box).forEach(function (n) { n.classList.toggle('x', !!st.x[n.getAttribute('data-n')]); });
    }
    ER.$$('.ws', box).forEach(function (n) {
      n.addEventListener('click', function () { if (wait || nextFile) return; var id = n.getAttribute('data-id'); st.src = st.src === id ? '' : id; ER.flag('a-st', st); VX.sfx.jack(); paintL(); });
    });
    ER.$$('.wn', box).forEach(function (n) {
      n.addEventListener('click', function (e) { if (e.target.closest('.w')) return; if (wait || nextFile) return; var k = n.getAttribute('data-n'); if (st.x[k]) delete st.x[k]; else st.x[k] = 1; ER.flag('a-st', st); VX.sfx.marker(); paintL(); });
    });
    paintL();
    var WHY = {
      council: '&ldquo;Thirty-one &lsquo;marinas&rsquo; at council,&rdquo; says Lena. &ldquo;Trained there, &lsquo;marina&rsquo; would be one of its best words, not its worst. And that chamber echoes like a swimming pool. Read my note 4 again.&rdquo;',
      debate: '&ldquo;Fourteen minutes of her, and three &lsquo;Low Streets&rsquo;,&rdquo; says Lena. &ldquo;That makes a rough copy that trips over Low Street. This one says it in its sleep.&rdquo;',
      prize: '&ldquo;Four minutes in a school hall? A rough copy at best, with a hall&rsquo;s echo. And she never says flood wall once.&rdquo;',
      book: '&ldquo;The library booth is padded and dead silent: no hum at all. My note 7 says there is a hum. And not one &lsquo;flood wall&rsquo; in three hours of history, so it couldn&rsquo;t say it perfectly.&rdquo;',
      voicemail: '&ldquo;Twenty seconds of &lsquo;I can&rsquo;t take your call&rsquo;? Page 9: a good copy needs hours.&rdquo;'
    };
    box.querySelector('#wt-go').addEventListener('click', function () {
      var file, ks, i;
      if (wait || nextFile) return;
      if (!st.src) { ER.sfx.no(); msg('&ldquo;Hang the label on something,&rdquo; says Lena. &ldquo;Which recordings did it learn from?&rdquo;'); return; }
      if (!ER.check('src', st.src)) {
        ER.sfx.no(); var n = box.querySelector('.ws[data-id="' + st.src + '"]'); n.classList.remove('bad'); void n.offsetWidth; n.classList.add('bad');
        msg(WHY[st.src] || '&ldquo;Not that one.&rdquo;'); return;
      }
      ks = Object.keys(st.x).sort();
      for (i = 0; i < ks.length; i++) if (!ER.check('strike', ks[i])) {
        ER.sfx.no();
        msg('&ldquo;Don&rsquo;t throw away note ' + ks[i] + ',&rdquo; says Lena. &ldquo;' + (ks[i] === '6' ? 'Page 9 says a voice model copies breathing too. A breath like hers is a trace of what it learnt from.' : ks[i] === '4' || ks[i] === '7' ? 'The room is exactly the kind of trace page 9 talks about.' : 'A word it says perfectly, or oddly, is exactly the kind of trace page 9 talks about.') + '&rdquo;');
        return;
      }
      if (!ks.length) { ER.sfx.no(); msg('&ldquo;Good box,&rdquo; says Lena. &ldquo;But one of my notes tells us nothing at all about what it learnt from. Which one? Ivo stuck a sticker about it on the phone desk.&rdquo;'); return; }
      file = ER.exit([st.src + '-' + ks.join('')], { wait: true });
      if (!file) { msg('The screen freezes. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file);
      VX.terms(['training data']);
      VX.mine('taught', 'What taught the voice', '<p>If a machine made it, it learnt from Ask the Mayor (box A): 26 hours of her, recorded in Studio B.</p><p>Hours, so a good copy. Low Street 208 times: perfect. Marina twice: odd. Dry, with this room&rsquo;s hum.</p><p>Not the council videos (31 marinas, big echo), not the library booth (no hum, no flood wall), and the rest are too short.</p><p>The warble tells us nothing: cheap phones do that.</p>', true);
      msg('&ldquo;Box A,&rdquo; says Lena. &ldquo;Ours.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Our archive,&rdquo; says Lena quietly. &ldquo;Twenty-six hours of her, recorded in this room, on our website, free to anyone who clicks.&rdquo; She looks at the foam on the walls as if it had let her down.',
          '&ldquo;Hours of clean speech, so a good copy. Low Street two hundred times, so perfect. Marina twice, so odd. This room&rsquo;s hum, because she sat in this chair every Tuesday.&rdquo;',
          '&ldquo;And the warble tells us nothing. Ivo&rsquo;s right. Cheap phones do it every week.&rdquo;',
          '&ldquo;So if it was made, it was made from us. But if is a big word. A tired mayor on a bad line can say a word oddly too.&rdquo; She stands up. &ldquo;Next door. The editing screen shows more than my ears do.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2600);
    });
    msg('Hang the label TRAINED ON on one box, and strike out any note that tells you nothing about what the voice learnt from. Then tell Lena.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
