  });
  var LOG = '<h4>Radio Greyhithe &middot; station log</h4>' +
    '<h5>TUESDAY 13 OCTOBER</h5><table><tr><td class="t">18.00&ndash;18.20</td><td>Ask the Mayor, episode 131. Studio B, live. Mayor F. Chandra. Producer L.S.</td></tr></table>' +
    '<h5>WEDNESDAY 14 OCTOBER</h5><table><tr><td class="t">19.30&ndash;20.30</td><td>Outside broadcast: the Harbour Lights, live from the quay. Engineer I.K.</td></tr><tr><td class="t">19.58&ndash;20.06</td><td>Mayor F. Chandra speaks live, switches the lights on at 20.01. <span class="hand">Her hard hat fell off on air. Twice.</span></td></tr></table>' +
    '<h5>FRIDAY 16 OCTOBER</h5><table><tr><td class="t">20.40&ndash;21.05</td><td>Friday Phone-in. Studio A, live. Guest: Cllr B. Halvard.</td></tr><tr><td class="t">21.00</td><td>Overnight music (computer).</td></tr><tr><td class="t">22.05</td><td>Main transmitter tripped in the wind. On the stand-by. <span class="hand">I.K. going up the hill.</span></td></tr></table>';
  $('#logbook').addEventListener('click', function () {
    if (busy) return;
    if (!told.lena) { ER.say('The station log books. Ask Lena first.'); return; }
    ER.read({ html: LOG, cls: 'vg-log', clue: { id: 'log', title: 'The station log: Tuesday, Wednesday, Friday', kind: 'Log book' }, done: function () {
      VX.terms(['tripped', 'transmitter']);
      if (tell('log')) { paint(); ER.say('Wednesday at eight: the mayor on the quay, live. Friday at ten to nine: Councillor Halvard in Studio A, live.'); }
    } });
  });
  var GUIDE = '<div class="hd">RADIO GREYHITHE &middot; GUIDE FOR PRODUCERS</div><h4>11. Where did it come from?</h4><div class="two"><div>' +
    '<p>Before anything else, ask where a recording came from. This is its <b>provenance</b>.</p>' +
    '<ul><li><b>Who had it first?</b> Follow each forward back. A forward carries the same file, and often the words of the person who sent it before.</li>' +
    '<li><b>When was it made?</b> A file&rsquo;s details show when it was created and what program made it. Details can be wrong or wiped, so they are a clue, not proof.</li>' +
    '<li><b>Does the time fit?</b> Check what the sender says against everything else you know about that moment.</li></ul>' +
    '<p>A <b>second source</b> must be <b>independent</b>: it must not come, by any path, from the first one. Two copies of one file are one source, however many people send them, and however different they look. Ask every sender: where did you get it?</p></div>' +
    '<div><svg viewBox="0 0 250 270" xmlns="http://www.w3.org/2000/svg"><g font-family="Inter,sans-serif" font-size="12">' +
    '<rect x="85" y="6" width="80" height="34" rx="4" fill="#1e2226"/><text x="125" y="28" text-anchor="middle" fill="#fff" font-weight="700">FIRST</text>' +
    '<path d="M125 40v20M40 60h170M40 60v16M125 60v16M210 60v16" stroke="#1e2226" stroke-width="2" fill="none"/>' +
    '<rect x="10" y="78" width="60" height="30" fill="#fff" stroke="#1e2226"/><text x="40" y="98" text-anchor="middle">A</text><rect x="95" y="78" width="60" height="30" fill="#fff" stroke="#1e2226"/><text x="125" y="98" text-anchor="middle">B</text><rect x="180" y="78" width="60" height="30" fill="#fff" stroke="#1e2226"/><text x="210" y="98" text-anchor="middle">C</text>' +
    '<path d="M40 108v22" stroke="#1e2226" stroke-width="2"/><rect x="10" y="130" width="60" height="30" fill="#fff" stroke="#1e2226"/><text x="40" y="150" text-anchor="middle">D</text>' +
    '<text x="10" y="194" fill="#b8322a" font-weight="700">A, B, C and D look like</text><text x="10" y="212" fill="#b8322a" font-weight="700">four sources.</text><text x="10" y="236" fill="#1e2226">They are ONE source,</text><text x="10" y="254" fill="#1e2226">forwarded.</text></g></svg></div></div>' +
    '<p class="pg">page 11</p>';
  $('#binder').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: GUIDE, cls: 'vg-guide', clue: { id: 'guide11', title: 'Guide, page 11: where did it come from?', kind: 'The binder' }, done: function () {
      VX.terms(['provenance', 'independent', 'second source', 'source', 'forward']);
      if (tell('guide')) { paint(); ER.say('Two copies of one file are one source, however many people send them.'); }
    } });
  });
  $('#phone').addEventListener('click', function () {
    if (busy) return;
    if (!told.lena) { ER.say('Lena&rsquo;s phone. Ask her first.'); return; }
    if (!(told.prints && told.details && told.log && told.guide)) { ER.say('&ldquo;Read everything first,&rdquo; says Lena. &ldquo;Then I ring him. I only get to wake a councillor up once.&rdquo;'); return; }
    ER.talk({
      who: 'Cllr Bernard Halvard', role: 'Councillor for Harbour ward · on the phone', face: VX.face('halvard'),
      lines: [
        { note: 'Lena puts him on speaker. He sounds as if he has been asleep in a chair.', a: '&ldquo;Lena. It&rsquo;s gone ten o&rsquo;clock. If this is about the phone-in, I was magnificent.&rdquo;' },
        { q: 'Did you send the council clip to your list?', a: '&ldquo;I did. At about twenty past nine it turned up in the Low Street group, and I sent it on. Her own words! Why wouldn&rsquo;t I?&rdquo;' },
        { q: 'Your slogan is in an email we were sent tonight. Greyhithe deserves better.', a: '&ldquo;It&rsquo;s on four hundred posters. Anybody can type it. That&rsquo;s the point of a slogan.&rdquo; A pause. &ldquo;What email?&rdquo;' },
        { q: 'Where were you at ten to nine?', a: '&ldquo;On your station! Studio A, the Friday phone-in, from twenty to nine until five past. Ask your own log book.&rdquo;' },
        { q: 'Did you check where the clip came from before you sent it?', a: '<p class="note">A long silence.</p><p>&ldquo;To three hundred and forty people. No. No, I didn&rsquo;t.&rdquo; He sounds a good deal less magnificent.</p>' }
      ],
      clue: { id: 'halvard', title: 'Cllr Halvard: I sent it on', kind: 'On the phone' },
      done: function (seen) { if (seen && tell('halvard')) { paint(); ER.say('&ldquo;He forwarded it,&rdquo; says Lena. &ldquo;Forwarding isn&rsquo;t making. Now the brown paper.&rdquo;'); } }
    });
  });
  VX.thing('#label', 'reel', 'REELS, 7½ ips. A label below says: &ldquo;7½ inches per second = 19 cm per second. A 1,800-foot reel at 7½ ips plays for about 48 minutes. At 15 ips, the speed for the best sound, about 24.&rdquo;', isBusy);
  VX.thing('#reel', null, 'A reel-to-reel tape machine, older than Lena. It still works. Nobody has anything to play on it except the 1981 Christmas lights.', isBusy);
  $('#dehum').addEventListener('click', function (e) {
    if (busy) return;
    if (!dhN++) ER.wordAt(e.clientX, e.clientY, 'dehumidifier');
    else ER.say(['It gurgles. Forty-eight per cent, it says, as if that were good news.', '&ldquo;Tape hates damp,&rdquo; says Lena. &ldquo;So do I.&rdquo;'][dhN % 2]);
  });
  $('#paper').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('One account, lowstreetwatch, at the top of everything.'); return; }
    if (!told.lena) { ER.say('A big sheet of brown paper with boxes drawn on it in pencil. Lena drew it. Ask her.'); return; }
    if (!(told.prints && told.details && told.log && told.guide)) { ER.say('&ldquo;Read everything on the table first,&rdquo; says Lena.'); return; }
    if (!told.halvard) { ER.say('&ldquo;I&rsquo;ll ring Halvard first,&rdquo; says Lena. &ldquo;My phone, end of the table.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: the chain on brown paper ---------- */
  function makeLock() {
    var st = ER.flag('c-st') || { s: {}, pin: '' }, wait = false;
    var POS = [[272, 14], [26, 150], [272, 150], [518, 150], [26, 280], [26, 404]];
    var box = ER.el('div', 'pz ch');
    var lines = '<svg viewBox="0 0 744 500" preserveAspectRatio="none"><g stroke="#2a1a08" stroke-width="2.5" fill="none"><path d="M384 100v24M138 124h492M138 124v26M384 124v26M630 124v26M138 236v44M138 366v38"/></g></svg>';
    box.innerHTML = '<div class="ch-in"><div><div class="ch-paper">' + lines +
      '<div class="lbl" style="left:520px;top:30px">who had it first?</div><div class="lbl" style="left:290px;top:244px">earliest on the left &rarr;</div><div class="lbl" style="left:270px;top:330px">&larr; got it from the box above</div>' +
      POS.map(function (q, i) { return '<div class="slot" data-s="' + i + '" style="left:' + q[0] + 'px;top:' + q[1] + 'px"></div>'; }).join('') + '</div>' +
      '<div class="ch-pins">PIN THE TIME THAT DOES NOT FIT: ' + PINS.map(function (p) { return '<button type="button" data-p="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="ch-tray"><h5>PRINT-OUTS &middot; drag, or click one and then a box</h5>' + ORDER.map(function (k) { return '<div class="pc dnd-item k-' + k + '" data-c="' + k + '"><div class="long">' + CARDS[k].l + '</div><div class="short">' + CARDS[k].s + '</div></div>'; }).join('') + '</div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="ch-go">Show Lena the chain</button></div>';
    var msgEl = box.querySelector('.pmsg'), tray = box.querySelector('.ch-tray');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function card(k) { return box.querySelector('.pc[data-c="' + k + '"]'); }
    function slot(i) { return box.querySelector('.slot[data-s="' + i + '"]'); }
    Object.keys(st.s).forEach(function (i) { var c = card(st.s[i]); if (c) slot(i).appendChild(c); });
    function save() {
      st.s = {}; ER.$$('.slot', box).forEach(function (n) { var c = n.querySelector('.pc'); if (c) st.s[n.getAttribute('data-s')] = c.getAttribute('data-c'); });
      ER.flag('c-st', st);
      ER.$$('.slot', box).forEach(function (n) { n.classList.remove('bad'); });
    }
    function paintP() { ER.$$('.ch-pins button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-p') === st.pin); }); }
    ER.dnd(box, { item: '.pc', slot: '.slot', home: tray, change: save, lock: function () { return wait || !!nextFile; } });
    ER.$$('.ch-pins button', box).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; st.pin = st.pin === b.getAttribute('data-p') ? '' : b.getAttribute('data-p'); ER.flag('c-st', st); VX.sfx.pin(); paintP(); }); });
    paintP();
    function bad(i, t) { ER.sfx.no(); slot(i).classList.add('bad'); msg(t); }
    box.querySelector('#ch-go').addEventListener('click', function () {
      var i, k, file, ids = [];
      if (wait || nextFile) return;
      for (i = 0; i < 6; i++) if (!st.s[i]) { ER.sfx.no(); msg('&ldquo;Every print-out has a box,&rdquo; says Lena. &ldquo;' + (6 - Object.keys(st.s).length) + ' still in your hand.&rdquo;'); return; }
      for (i = 0; i < 6; i++) {
        k = st.s[i]; ids.push(k);
        if (ER.check('s' + i, k)) continue;
        if (i === 0) return bad(0, '&ldquo;The top box is whoever had both files before anybody else,&rdquo; says Lena. &ldquo;Who does every message lead back to?&rdquo;');
        if (k === 'prof') return bad(i, '&ldquo;lowstreetwatch didn&rsquo;t get the files from anybody,&rdquo; says Lena. &ldquo;Every path leads back there.&rdquo;');
        if (k === 'text' && i !== 5) return bad(i, '&ldquo;Greta has the council clip, twelve seconds,&rdquo; says Lena. &ldquo;And she says her councillor sent it: look whose words her message still carries.&rdquo;');
        if (k === 'list' && i !== 4) return bad(i, '&ldquo;Halvard&rsquo;s post says where he got it,&rdquo; says Lena. &ldquo;Forwarded from Low Street Residents.&rdquo;');
        if (i >= 1 && i <= 3) return bad(i, '&ldquo;Along the top row,&rdquo; says Lena, &ldquo;earliest on the left. Read the times again. And the council clip went down the left-hand side.&rdquo;');
        return bad(i, '&ldquo;That box: who did it come from, and when?&rdquo; says Lena.');
      }
      if (!st.pin) { ER.sfx.no(); msg('&ldquo;The chain&rsquo;s right,&rdquo; says Lena. &ldquo;Now pin the time that doesn&rsquo;t fit.&rdquo;'); return; }
      if (!ER.check('pin', st.pin)) {
        ER.sfx.no();
        msg(st.pin === 'midnight' ? '&ldquo;That&rsquo;s a threat, not a time we can check,&rdquo; says Lena.' : st.pin === 'fwd' ? '&ldquo;Halvard saw it at twenty past nine and sent it at 21.24. That fits what he told us.&rdquo;' :
          '&ldquo;Clip at 20.47, call at 20.51, account at 20.58, post at 21.05, email at 21.12,&rdquo; says Lena. &ldquo;They fit together like bricks. What does the log book say about one of his claims?&rdquo;');
        return;
      }
      file = ER.exit([ids.join('-') + '-' + st.pin], { wait: true });
      if (!file) { msg('Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      VX.terms(['provenance', 'independent']);
      VX.mine('chain', 'One source in different coats', '<p>lowstreetwatch (account made Fri 20.58) &rarr; the Low Street group, 21.05, the council clip &rarr; Halvard, 21.24 &rarr; Greta, 21.31.</p><p>lowstreetwatch &rarr; us, 21.12, the call &rarr; the Courier, 21.13, the call.</p><p>So the Courier and Greta are not second sources: everything comes from one account.</p><p>&ldquo;Rang me on Wednesday at about eight&rdquo; does not fit: at 19.58&ndash;20.06 the mayor was live on our station at the Harbour Lights.</p><p>Halvard forwarded the clip; he did not make it. At 20.51 he was live in Studio A.</p>', true);
      msg('&ldquo;One account,&rdquo; says Lena. &ldquo;Everything comes from one account.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          '&ldquo;lowstreetwatch,&rdquo; says Lena. &ldquo;Made at 20.58 tonight. It sent the call to us and to the Courier, and the council clip to the Low Street group. Halvard forwarded the clip. Greta got it from Halvard.&rdquo;',
          '&ldquo;So the Courier isn&rsquo;t a second source. Greta isn&rsquo;t a second source. They&rsquo;re one source in different coats.&rdquo; She taps the log book. &ldquo;And at eight on Wednesday the mayor was switching on the harbour lights, live on our station, in front of two hundred people. Not on the phone to lowstreetwatch.&rdquo;',
          '&ldquo;About eight,&rdquo; she says, to be fair. &ldquo;She could have rung somebody at ten past. It doesn&rsquo;t prove anything. But it doesn&rsquo;t fit. And both files were made tonight, the call by a voice maker.&rdquo;',
          'Her phone buzzes. &ldquo;Ivo. He&rsquo;s up at the mast. The wind tripped the transmitter.&rdquo; She reads on, and her eyebrows go up. &ldquo;He says he can tell us when those first eleven seconds were recorded. To the second. From the hum.&rdquo; She picks up her car keys. &ldquo;Coat.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2600);
    });
    msg('Put each print-out in a box: who got it from whom. Then pin the one time that does not fit. Show Lena.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
