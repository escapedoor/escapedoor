  $('#printer').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: DATA, cls: 'fd-data', clue: { id: 'data', title: 'Freya&rsquo;s data, from Burble', kind: 'From the printer' }, done: function () {
      FD.terms(['location data', 'contacts']);
      if (tell('printer')) { paint(); ER.say('Every pause, every place, every name in her phone. And four guesses, in bold.'); }
    } });
  });
  var HELP = '<h4>Burble Help &middot; Your settings</h4><div class="in">' +
    '<div class="sw"><b>Use my location</b><span>ON: Local Buzz shows videos made within 10 miles of where your phone is. OFF: Local Buzz uses the home town on your profile instead, and we stop recording where your phone goes.</span>' +
    '<b>Use my watch history</b><span>ON: we predict from what you and people like you did. OFF: we cannot tell what you like, so we predict from what everybody near your home town did.</span>' +
    '<b>Use my contacts</b><span>ON: videos from people in your contacts get 20 points added to their score. OFF: no extra points.</span>' +
    '<b>Order</b><span>Most engaging: highest score first (see &ldquo;How Local Buzz chooses&rdquo;). Newest first: the most recent video first, whatever its score.</span></div>' +
    '<p class="small">Changes start with your next feed. You can also see everything we hold about you: Settings &gt; Your data &gt; Ask for a copy.</p></div>';
  $('#screen').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: HELP, cls: 'fd-screen', clue: { id: 'help', title: 'Burble Help: your settings', kind: 'On the library computer' }, done: function () {
      FD.terms(['settings']);
      if (tell('screen')) { paint(); ER.say('Four settings. Each one changes what Burble counts.'); }
    } });
  });
  $('#freya').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Tomorrow morning,&rdquo; says Freya. &ldquo;Bridge Day first. If there is a Bridge Day.&rdquo;'); return; }
    if (!told.printer) { ER.say('&ldquo;My data&rsquo;s on the printer,&rdquo; says Freya, not moving. &ldquo;I&rsquo;m scared of it. You read it first.&rdquo;'); return; }
    ER.talk({
      who: 'Freya Gaskin', role: 'Sixteen, Gorsey', face: FD.face('freya', 'cross'),
      lines: [
        { note: 'Freya is reading her own data with one hand over her mouth.', a: '&ldquo;It knows what time I go to sleep. It knows I paused Ken&rsquo;s video for twelve seconds to read the comments. It thinks I&rsquo;m interested in Gorsey versus Crickmore. Strong. In bold.&rdquo;' },
        { q: 'Are you?', a: '&ldquo;I am now! It hasn&rsquo;t shown me anything else for six weeks!&rdquo; She takes a breath. &ldquo;Right. It&rsquo;s my phone. Settings. I want three things.&rdquo;' },
        { a: '&ldquo;One: I don&rsquo;t want it to know where I am at night. Two: stop guessing from what I watched at midnight when I was cross. Three: Ade is in my contacts because he runs the youth club, not because I want his table tennis first. Everything else stays as it is. I want to see whether it&rsquo;s the settings or me.&rdquo;' },
        { a: '&ldquo;Then tell me what Burble will put first in my feed tomorrow morning. If you can, I&rsquo;ll stand up at eight and show the whole committee how.&rdquo;' }
      ],
      clue: { id: 'freya5', title: 'Freya: three wishes', kind: 'What she said' },
      done: function (seen) { if (seen && tell('freya')) { paint(); ER.say('Her phone is on the reading table, open at Settings.'); } }
    });
  });
  FD.thing('#history', null, 'BRIDGE DAY 1887&ndash;1987: A HUNDRED YEARS OF ROPE. It has been borrowed more times this month than in the last ten years.', isBusy);
  FD.thing('#win', null, 'Lisk Hall, across the road at the end of the bridge. Every window is lit, and people are going in from both directions.', isBusy);
  FD.thing('#clock', null, 'The library clock: 7.36. It is never wrong, says Mrs Dimmock, because she will not allow it.', isBusy);
  $('#lamp').addEventListener('click', function () {
    if (busy) return;
    var L = ['A green reading lamp. Under it, somebody has left a book called Getting On With Your Neighbours, open at chapter one.', 'Chapter one is called: Listen.'];
    ER.say(L[lampN++ % L.length]);
  });
  $('#phone').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Location off, watch history off, contacts off. Saved.'); return; }
    if (!told.clare) { ER.say('Freya&rsquo;s phone. Mrs Dimmock is waving the print-out at you: talk to her first.'); return; }
    if (!told.leaflet) { ER.say('&ldquo;Read the leaflet,&rdquo; says Mrs Dimmock. &ldquo;I didn&rsquo;t write it for nothing.&rdquo;'); return; }
    if (!told.printer) { ER.say('Freya&rsquo;s data is on the printer. Read it first.'); return; }
    if (!told.screen) { ER.say('&ldquo;The help page is open on the computer,&rdquo; says Freya. &ldquo;It says what the switches do.&rdquo;'); return; }
    if (!told.freya) { ER.say('It&rsquo;s Freya&rsquo;s phone. Ask her what she wants.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: what it guessed, and what it will show ---------- */
  function makeLock() {
    var st = ER.flag('e-st') || { p: ['', '', '', ''], step: 1, loc: 'on', hist: 'on', con: 'on', ord: 'eng', top: '' }, wait = false;
    var box = ER.el('div', 'pz ph5'), inner = ER.el('div', 'ph5-in'), foot = ER.el('div', 'pz-foot');
    foot.innerHTML = '<p class="pmsg"></p><button type="button" class="btn" id="ph-go"></button>';
    box.appendChild(inner); box.appendChild(foot);
    var msgEl = foot.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function save() { ER.flag('e-st', st); }
    function draw() {
      var s;
      if (st.step === 1) {
        s = '<h5>Things Burble thinks about you. Where did each guess come from?</h5>';
        INF.forEach(function (f, i) {
          s += '<div class="inf"><b><i>' + f[0] + '</i>' + f[1] + '</b><div class="lets">' + ['A', 'B', 'C', 'D', 'E', 'F'].map(function (L) { return '<button type="button" data-i="' + i + '" data-l="' + L.toLowerCase() + '"' + (st.p[i] === L.toLowerCase() ? ' class="on"' : '') + '>' + L + '</button>'; }).join('') + '</div></div>';
        });
        s += '<p class="ph5-note">A Watching &middot; B Location &middot; C Contacts &middot; D Time of day &middot; E Your phone &middot; F Searches (her print-out is in your notebook)</p>';
        inner.innerHTML = s;
        foot.querySelector('#ph-go').textContent = 'Check the guesses';
        ER.$$('.lets button', inner).forEach(function (b) {
          b.addEventListener('click', function () { if (wait || nextFile) return; var i = +b.getAttribute('data-i'); st.p[i] = st.p[i] === b.getAttribute('data-l') ? '' : b.getAttribute('data-l'); save(); FD.sfx.tap(); draw(); });
        });
        return;
      }
      function tg(k, label) { return '<div class="tg"><span>' + label + '</span><button type="button" data-k="' + k + '"' + (st[k] === 'off' ? ' class="off"' : '') + '>' + st[k].toUpperCase() + '</button></div>'; }
      s = '<div class="two5"><div class="set"><h6>SETTINGS &middot; FREYA</h6>' + tg('loc', 'Use my location') + tg('hist', 'Use my watch history') + tg('con', 'Use my contacts') +
        '<div class="ordb"><button type="button" data-o="eng"' + (st.ord === 'eng' ? ' class="on"' : '') + '>Most engaging</button><button type="button" data-o="new"' + (st.ord === 'new' ? ' class="on"' : '') + '>Newest first</button></div>' +
        '<div class="wish"><p>1. Don&rsquo;t know where I am at night.</p><p>2. Stop guessing from what I watched at midnight when I was cross.</p><p>3. Ade&rsquo;s table tennis doesn&rsquo;t jump the queue.</p><p>Everything else stays as it is. F.</p></div></div>' +
        '<div class="cands"><h6>TOMORROW, 9 A.M. &middot; WHICH WILL LOCAL BUZZ PUT FIRST? (click one)</h6>';
      CORDER.forEach(function (k) {
        var c = CANDS[k];
        s += '<button type="button" class="cand' + (st.top === k ? ' on' : '') + '" data-c="' + k + '"><b>' + c[1] + '</b><small>' + c[0] + ' &middot; posted ' + c[2] + (c[5] ? ' &middot; <em>in Freya&rsquo;s contacts</em>' : '') + '</small>' +
          '<span>people like Freya: finished ' + c[3][0] + ' &middot; liked ' + c[3][1] + ' &middot; shared ' + c[3][2] + '</span><span>everybody near Gorsey: finished ' + c[4][0] + ' &middot; liked ' + c[4][1] + ' &middot; shared ' + c[4][2] + '</span></button>';
      });
      s += '</div></div>';
      inner.innerHTML = s;
      foot.querySelector('#ph-go').textContent = 'Save and predict';
      ER.$$('.tg button', inner).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; var k = b.getAttribute('data-k'); st[k] = st[k] === 'on' ? 'off' : 'on'; save(); FD.sfx.switch(); draw(); }); });
      ER.$$('.ordb button', inner).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; st.ord = b.getAttribute('data-o'); save(); FD.sfx.switch(); draw(); }); });
      ER.$$('.cand', inner).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; var k = b.getAttribute('data-c'); st.top = st.top === k ? '' : k; save(); FD.sfx.tap(); draw(); }); });
    }
    foot.querySelector('#ph-go').addEventListener('click', function () {
      if (wait || nextFile) return;
      var i, file;
      if (st.step === 1) {
        if (st.p.indexOf('') >= 0) { ER.sfx.no(); msg('Give every guess a letter, A to F.'); return; }
        for (i = 0; i < 4; i++) if (!ER.check('p' + (i + 1), st.p[i])) {
          ER.sfx.no();
          msg(st.p[i] === 'e' ? '&ldquo;Number ' + (i + 1) + ',&rdquo; says Freya. &ldquo;My battery level doesn&rsquo;t tell it that. Which part does?&rdquo;' :
            st.p[i] === 'f' ? '&ldquo;Number ' + (i + 1) + '? My searches were frost, buns and coursework,&rdquo; says Freya. &ldquo;Look somewhere else.&rdquo;' :
            '&ldquo;Number ' + (i + 1) + ' isn&rsquo;t right,&rdquo; says Freya. &ldquo;Which part of my data would let somebody guess that?&rdquo;');
          return;
        }
        st.step = 2; save(); ER.sfx.ok(); draw();
        msg('&ldquo;Where I sleep, when I sleep, who I know, and what makes me cross,&rdquo; says Freya. &ldquo;Right. Settings.&rdquo;');
        return;
      }
      if (!ER.check('loc', st.loc)) { ER.sfx.no(); msg('&ldquo;Wish one,&rdquo; says Freya. &ldquo;I don&rsquo;t want it to know where I am at night. Which switch records where my phone goes?&rdquo;'); return; }
      if (!ER.check('hist', st.hist)) { ER.sfx.no(); msg('&ldquo;Wish two,&rdquo; says Freya. &ldquo;Stop guessing from what I watched at midnight. Which switch is that?&rdquo;'); return; }
      if (!ER.check('con', st.con)) { ER.sfx.no(); msg('&ldquo;Wish three,&rdquo; says Freya. &ldquo;Ade&rsquo;s videos get extra points because he&rsquo;s in my phone. Stop that.&rdquo;'); return; }
      if (!ER.check('ord', st.ord)) { ER.sfx.no(); msg('&ldquo;Everything else stays as it is,&rdquo; says Freya. &ldquo;I want to see if it&rsquo;s the settings or me. Leave the order alone.&rdquo;'); return; }
      if (!st.top) { ER.sfx.no(); msg('&ldquo;Now the prediction,&rdquo; says Freya. &ldquo;Which one comes first tomorrow? Click it.&rdquo;'); return; }
      if (!ER.check('top', st.top)) {
        ER.sfx.no();
        msg(st.top === 'lisk' ? '&ldquo;That one wins tonight, with my watch history on,&rdquo; says Freya. &ldquo;With it off, Burble can&rsquo;t use the people-like-me numbers. Which numbers does it use?&rdquo;' :
          st.top === 'ade' ? '&ldquo;Ade&rsquo;s table tennis only wins with the 20 extra points,&rdquo; says Freya. &ldquo;And I&rsquo;ve just turned those off.&rdquo;' :
          '&ldquo;Score all five,&rdquo; says Freya. &ldquo;The card from the bakery, with the everybody numbers. It&rsquo;s in your notebook.&rdquo;');
        return;
      }
      file = ER.exit([st.p.join('-') + '-' + st.loc + '-' + st.hist + '-' + st.con + '-' + st.ord + '-' + st.top], { wait: true });
      if (!file) { msg('The phone freezes. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('e-file', file);
      FD.terms(['settings', 'personal data', 'infer']);
      FD.mine('settings', 'Freya&rsquo;s settings', '<p>Lives in Gorsey ← B, location at night. Awake late ← D, time of day. Gorsey v Crickmore ← A, how she watches. Knows Ade ← C, contacts.</p><p>Location off, watch history off, contacts off, order still Most engaging. So Burble uses the everybody numbers, and nobody gets 20 extra points.</p><p>Bridge Day video: 70 + 44 + 40 = 154, the highest. With her history on, LiskLad would have won with 172.</p>', true);
      msg('&ldquo;Bridge Day,&rdquo; says Freya. &ldquo;Saved.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Freya slides the three switches off, one by one, and looks at them for a moment. &ldquo;So tomorrow morning,&rdquo; she says, &ldquo;the first thing I&rsquo;ll see is Lisk Hall saying Bridge Day is on. Tonight it was LiskLad. Same app. Same videos. Different things counted.&rdquo;',
          '&ldquo;Just so I understand,&rdquo; says Mrs Dimmock, who has been reading over her shoulder, &ldquo;nobody in Burble chose to show you fights. It was counting your midnights.&rdquo; &ldquo;And my pauses,&rdquo; says Freya. &ldquo;And Ade.&rdquo;',
          'The library clock says eight minutes to eight. &ldquo;It&rsquo;s six minutes to the hall,&rdquo; says Mrs Dimmock, already finding her keys. &ldquo;Four if you run. Run.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2400);
    });
    draw();
    msg(st.step === 1 ? 'Burble has made four guesses about Freya. Match each one to the part of her data it came from.' : 'Set the switches the way Freya wants, then predict what comes first tomorrow.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; }, step: function () { return st.step; } };
  }
})();
</script>
</body>
</html>
