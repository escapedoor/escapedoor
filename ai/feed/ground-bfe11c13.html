(function () {

  ER.init({
    theme: 'ai', story: 'feed', storyTitle: 'Everybody Thinks So', id: 'ground', no: 'IV', title: 'The Football Ground',
    go: 'Into the clubhouse',
    intro: [
      'On the bridge you finished Freya&rsquo;s chalk chart. Each week was the week before plus half of it: Gorsey 13, 19, 20 fight videos in its top 20, Crickmore 6, 9, 13. By week 4 the two towns no longer had even half their videos in common (only 7). A difference of two videos in week one, going round a loop.',
      'Crickmore Football Club, 7.15 p.m. The floodlights are on, the juniors are training in the drizzle, and the clubhouse smells of tea and wet socks.'
    ],
    exit: {"next":"library","w":{"48ad3632":"d853981c"}}, tags: {"g":["c9f91bc0"],"c":["424df222"],"s":["5010a257"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('d-file') || null; told = ER.flag('d-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.isla && told.jamie && told.phones && told.sheets && told.book; }
  function paint() {
    $('#score').classList.toggle('glow', !!(ready() && !nextFile));
    ER.pips((told.isla ? 1 : 0) + (told.jamie ? 1 : 0) + (told.phones ? 1 : 0) + (told.sheets ? 1 : 0) + (told.book ? 1 : 0) + (nextFile ? 1 : 0), 6);
  }
  function hints() {
    if (nextFile) return ['go', ['The library is next. The button at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['score', [
      'Jamie&rsquo;s book: count people, not videos. Open the two phones from your notebook and look at who made each fight video.',
      'LiskLad made nothing: every one of his says &ldquo;reposted from&rdquo;. Follow it back to the person who made it. A deleted video still has a maker.',
      'Gorsey&rsquo;s makers are in Isla&rsquo;s feed, Crickmore&rsquo;s in Freya&rsquo;s. Then find each of those people on the two sign-up sheets, and read every line to the end.'
    ]];
    if (!told.isla) return ['isla', ['Isla, the coach, is at the end of the bar. Talk to her.', 'She is on the right, in a red tracksuit with a whistle.']];
    if (!told.jamie) return ['jamie', ['Your goalkeeper, Jamie, is sitting on the bench. He has something to say about the joke.', 'He is on the left, in a yellow goalkeeper&rsquo;s shirt.']];
    if (!told.phones) return ['phones', ['The two phones on the bar: Freya&rsquo;s and Isla&rsquo;s feeds, side by side.', 'Two phones lying on the bar, near the middle.']];
    if (!told.book) return ['book', ['Jamie&rsquo;s homework book is on the bench. It explains what a feed is not.', 'The blue book at the end of the bench, near Jamie.']];
    if (!told.sheets) return ['sheets', ['The Bridge Day sign-up sheets are on the noticeboard.', 'The cork board under the scoreboard, with two white sheets on it.']];
    return ['open', ['Now the old scoreboard on the wall. Put up the real score.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The real score is on the board: three, three, and five still coming.'); return; }
    if (told.in) { busy = false; ER.say('Crickmore FC clubhouse. Tea, wet socks, and two phones on the bar.'); return; }
    tell('in');
    ER.narrate([
      'The clubhouse is warm and full of steam from the tea urn. Through the big window the juniors are running round cones in the drizzle, under floodlights that make the grass look painted.',

    ], function () { busy = false; });
  }

  $('#isla').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Three,&rdquo; says Isla, to herself. &ldquo;Thirty-six times a week. Three people.&rdquo;'); return; }
    ER.talk({
      who: 'Isla Brough', role: 'Coach, Crickmore Juniors', face: FD.face('isla', 'cross'),
      lines: [
        { note: 'Isla Brough coaches Crickmore Juniors, which means she coaches you. She wears her whistle everywhere, even at weddings.', a: '&ldquo;There you are. Brought Gorsey with you, have you?&rdquo; She means Freya. Then she sighs. &ldquo;Sorry. That&rsquo;s what six weeks of this does to you. Every time I open my phone it&rsquo;s Gorsey telling us we&rsquo;re cheats.&rdquo;' },
        { q: 'All of Gorsey?', a: '&ldquo;All of it. Thirty-eight thousand people watched the baker&rsquo;s video. Look at my feed: it&rsquo;s nothing else.&rdquo; She puts her phone down on the bar, next to Freya&rsquo;s.' },
        { q: 'Freya&rsquo;s feed says Crickmore laughs at Gorsey.', a: '&ldquo;Everybody in Crickmore thinks we&rsquo;re a joke,&rdquo; says Freya. &ldquo;Nobody here thinks that!&rdquo; says Isla. &ldquo;That&rsquo;s exactly what I&rsquo;d say about Gorsey,&rdquo; says Freya. They both look at the two phones lying side by side.' },
        { a: 'Isla, more quietly: &ldquo;The committee&rsquo;s asked me to speak for Crickmore at eight. I was going to say we can&rsquo;t share a bridge with people who hate us. Tell me if I&rsquo;m wrong. And tell me with numbers, because I won&rsquo;t believe anything else tonight.&rdquo;' }
      ],

    });
  });
  $('#jamie').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;One joke,&rdquo; says Jamie. &ldquo;And I&rsquo;m still on the sheet. I&rsquo;ll be in goal tomorrow if they&rsquo;ll have me.&rdquo;'); return; }
    ER.talk({
      who: 'Jamie Orr', role: 'Goalkeeper, Crickmore Juniors', face: FD.face('jamie', 'cross'),
      lines: [
        { note: 'Jamie is fifteen, your goalkeeper, and the most famous person in the valley. He keeps his gloves on indoors, in case somebody throws something.', a: '&ldquo;Before you start: it was one joke. One. Nine seconds, Tuesday after school. A Gorsey bun was holding the changing-room door open, and I thought it was funny. Gorsey bun. Also a doorstop.&rdquo;' },
        { q: 'What happened then?', a: '&ldquo;By Wednesday morning the baker had made a video about me, in his apron. By Wednesday night there were twenty more. I deleted mine on the Thursday. Didn&rsquo;t matter. LiskLad had already copied it, and it&rsquo;s still going round with my name on it.&rdquo;' },
        { q: 'Have you made any others?', a: '&ldquo;No! I don&rsquo;t even like being filmed. I&rsquo;m a goalkeeper. I stand still and things come at me.&rdquo; He looks at the floor. &ldquo;I&rsquo;m still signed up for tomorrow, if there is a tomorrow. My mum says I should apologise to the whole of Gorsey.&rdquo;' },
        { a: '&ldquo;That&rsquo;s my homework on the bench, by the way. Citizenship. It&rsquo;s about feeds. I haven&rsquo;t done it. I&rsquo;ve been too busy being in one.&rdquo;' }
      ],
      clue: { id: 'jamie', title: 'Jamie: one joke', kind: 'What he said' },
      done: function (seen) { if (seen && tell('jamie')) { paint(); ER.say('One joke, deleted on day three, still going round.'); } }
    });
  });

  function item(n, who, cap, more, calm) {

  }
  var PHONES = '<h4>LOCAL BUZZ &middot; THIS WEEK &middot; TWO PHONES ON THE BAR</h4><div class="cols"><div class="ph"><h5>FREYA&rsquo;S PHONE &middot; GORSEY</h5>' +
    item(1, '@LiskLad', 'Tonight&rsquo;s top Lisk video: BRIDGE DAY? MORE LIKE BRIDGE DELAY', '<span class="rpo">reposted from @cmfc_dad</span> &middot; posted 19:00 today') +

    '</div><div class="ph"><h5>ISLA&rsquo;S PHONE &middot; CRICKMORE</h5>' +

    item(2, '@LiskLad', 'Still waiting, Crickmore', '<span class="rpo">reposted from @kenbakes</span> &middot; 6 times') +

    item(10, '@lisk.hall', 'Jumble sale, Saturday week', '', 1) +
    '</div></div>';
  $('#phones').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: PHONES, cls: 'fd-feeds', clue: { id: 'phones', title: 'Two phones: Freya&rsquo;s feed and Isla&rsquo;s', kind: 'On the bar' }, done: function () {
      FD.terms(['repost']);
      if (tell('phones')) { paint(); ER.say('Only one video is in both feeds: the frost on the Lisk.'); }
    } });
  });
  var SHEETS = '<h4>BRIDGE DAY &middot; SATURDAY 10 OCTOBER &middot; SIGN UP HERE</h4><div class="cols">' +
    '<div class="sh"><h5>GORSEY (from the bakery counter)</h5><table><tr><th>Name</th><th>Doing what</th><th>Signed</th></tr>' +
    '<tr><td>Ken Pocock</td><td>bun stall, as always</td><td>1 Sep</td></tr>' +
    '<tr><td>Ade Bakare</td><td>youth club stall</td><td>1 Sep</td></tr>' +
    '<tr><td>Freya Gaskin</td><td>first aid (I have a certificate)</td><td>2 Sep</td></tr>' +
    '<tr><td><s>Elaine Gooch</s></td><td><s>tug-of-war, anchor</s> <span class="x">Not with that lot. E.G. 27/9</span></td><td>2 Sep</td></tr>' +
    '<tr><td>Harvey Lam</td><td>Gorsey team, left back</td><td>5 Sep</td></tr>' +
    '<tr><td>Kofi A.</td><td>Gorsey team, in goal</td><td>5 Sep</td></tr>' +
    '<tr><td>Ella M. and Gemma S.</td><td>face painting</td><td>8 Sep</td></tr>' +
    '<tr><td>Jade W.</td><td>tug-of-war</td><td>12 Sep</td></tr></table>' +
    '<div class="tot">&hellip; and more on the next pages. Gorsey total: 212 names (last year: 219).</div></div>' +
    '<div class="sh"><h5>CRICKMORE (in the clubhouse)</h5><table><tr><th>Name</th><th>Doing what</th><th>Signed</th></tr>' +
    '<tr><td>Lyn Carver</td><td>committee, all day</td><td>24 Aug</td></tr>' +
    '<tr><td>Gordon Pruett</td><td>loudspeakers, as always</td><td>28 Aug</td></tr>' +
    '<tr><td>Isla Brough</td><td>coach, Crickmore Juniors</td><td>31 Aug</td></tr>' +
    '<tr><td>Jamie Orr</td><td>goalkeeper</td><td>31 Aug</td></tr>' +
    '<tr><td>Crickmore Juniors</td><td>whole squad (that includes you)</td><td>31 Aug</td></tr>' +
    '<tr><td>Howard Tamblyn</td><td>car park</td><td>14 Sep</td></tr>' +
    '<tr><td>Crickmore Bowls Club</td><td>tea tent</td><td>20 Sep</td></tr></table>' +
    '<div class="tot">&hellip; and more on the next pages. Crickmore total: 198 names (last year: 203).</div></div></div>';
  $('#sheets').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SHEETS, cls: 'fd-sheets', clue: { id: 'sheets', title: 'Bridge Day sign-up sheets', kind: 'On the noticeboard' }, done: function () {
      if (tell('sheets')) { paint(); ER.say('Two hundred and twelve names from Gorsey. Two hundred and nineteen last year.'); }
    } });
  });
  var BOOK = '<div class="hd">Citizenship &middot; Unit 6 &middot; You and the news</div><h4>Filter bubbles</h4>' +
    '<p>The writer Eli Pariser made the phrase &ldquo;<b>filter bubble</b>&rdquo; popular in his 2011 book <i>The Filter Bubble</i>. A recommendation system shows each person what people like them watched and shared. So two people can open the same app and see two different worlds, and each world looks complete from the inside. If everything in your feed agrees, it feels as if everybody agrees.</p>' +
    '<p>But a feed is not a fair <b>sample</b> of what people think. It is a ranking of what got watched and shared. One loud person who posts ten times, copied by others, can fill a feed. A thousand quiet people who post nothing do not appear in it at all.</p>' +
    '<p>To find out what is common, <b>count people, not videos</b>. And look at something nobody ranked: a survey that asked everybody, a vote, a list that people signed.</p>' +
    '<p class="aside">Researchers still argue about how strong filter bubbles are. Most agree that you can climb out of one, once you know you are in it.</p>' +
    '<p class="hand">homework: due Monday. if there is a Monday &mdash; J.O.</p>';
  $('#book').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BOOK, cls: 'fd-book', clue: { id: 'book', title: 'Jamie&rsquo;s homework: filter bubbles', kind: 'On the bench' }, done: function () {
      FD.terms(['filter bubble', 'sample']);
      if (tell('book')) { paint(); ER.say('Count people, not videos. And look at something nobody ranked.'); }
    } });
  });
  FD.thing('#cabinet', null, 'Cups from 1952, 1988 and 2019, and an empty space labelled THE BRASS BUN. It went to Gorsey last year, after a bun race that Crickmore still talks about.', isBusy);
  FD.thing('#pitch', null, 'The juniors, running round cones in the drizzle. Your place in the line is empty tonight. Isla has noticed.', isBusy);
  FD.thing('#radiator', null, 'Twelve red socks drying on the radiator. That explains the smell.', isBusy);
  $('#urn').addEventListener('click', function () {
    if (busy) return;
    var L = ['The tea urn, steaming. Somebody has taped a sign to it: DO NOT ARGUE NEAR THE URN.', 'The urn rumbles to itself, the only thing in the clubhouse that is never cross.'];
    ER.say(L[urnN++ % L.length]);
  });
  $('#score').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('GORSEY 3, CRICKMORE 3, and five of the six still coming tomorrow.'); return; }
    if (!told.isla) { ER.say('The old scoreboard, WET PAINT. Isla wants numbers: talk to her first.'); return; }
    if (!told.jamie) { ER.say('Jamie is watching you from the bench. Hear what he has to say first.'); return; }
    if (!told.phones) { ER.say('First look at the two phones on the bar.'); return; }
    if (!told.book) { ER.say('&ldquo;Jamie&rsquo;s homework,&rdquo; says Freya. &ldquo;Read it. He hasn&rsquo;t.&rdquo;'); return; }
    if (!told.sheets) { ER.say('The sign-up sheets on the noticeboard: something nobody ranked.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: the real score ---------- */
  function makeLock() {
    var st = ER.flag('d-st') || { g: 0, c: 0, s: 0 }, wait = false;
    var ROWS = [['g', 'GORSEY', 'Different people in Gorsey who made the fight videos in Isla&rsquo;s feed'],
      ['c', 'CRICKMORE', 'Different people in Crickmore who made the fight videos in Freya&rsquo;s feed'],
      ['s', 'STILL COMING', 'Of all those people, how many are still signed up for Bridge Day tomorrow']];
    var box = ER.el('div', 'pz sb');
    box.innerHTML = '<div class="sb-in"><h5>THE REAL SCORE</h5>' + ROWS.map(function (r) {
      return '<div class="sb-row"><div><b>' + r[1] + '</b><span>' + r[2] + '</span></div><div class="plate" data-p="' + r[0] + '">0</div><div class="ud"><button type="button" data-u="' + r[0] + '">&#9650;</button><button type="button" data-d="' + r[0] + '">&#9660;</button></div></div>';
    }).join('') + '</div><div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="sb-go">Show Isla</button></div>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paintL() { ER.$$('.plate', box).forEach(function (p) { p.textContent = st[p.getAttribute('data-p')]; }); }
    ER.$$('.ud button', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (wait || nextFile) return;
        var k = b.getAttribute('data-u') || b.getAttribute('data-d');
        st[k] = Math.max(0, Math.min(20, st[k] + (b.hasAttribute('data-u') ? 1 : -1)));
        ER.flag('d-st', st); FD.sfx.flip(); paintL();
      });
    });
    box.querySelector('#sb-go').addEventListener('click', function () {
      if (wait || nextFile) return;
      var file;
      if (!st.g && !st.c && !st.s) { ER.sfx.no(); msg('&ldquo;Nil, nil, nil?&rdquo; says Isla. &ldquo;Somebody made those videos.&rdquo;'); return; }
      if (st.g === 4 || st.c === 4) { ER.sfx.no(); msg('&ldquo;Are you counting LiskLad?&rdquo; says Freya. &ldquo;Look at his: every one says reposted from. He didn&rsquo;t make a single one.&rdquo;'); return; }
      if (st.g === 7 || st.c === 6) { ER.sfx.no(); msg('&ldquo;That&rsquo;s videos,&rdquo; says Freya. &ldquo;Jamie&rsquo;s book: count people. Some of them made more than one.&rdquo;'); return; }
      if (st.c === 2) { ER.sfx.no(); msg('&ldquo;You&rsquo;ve left me out,&rdquo; says Jamie miserably. &ldquo;I deleted it on the third, but the copy in Freya&rsquo;s feed still has my name on. I made it.&rdquo;'); return; }
      if (!ER.check('g', String(st.g))) { ER.sfx.no(); msg('&ldquo;GORSEY&rsquo;s wrong,&rdquo; says Isla. &ldquo;My feed. Who in Gorsey actually made the fight videos? Follow LiskLad&rsquo;s copies back to whoever made them.&rdquo;'); return; }
      if (!ER.check('c', String(st.c))) { ER.sfx.no(); msg('&ldquo;CRICKMORE&rsquo;s wrong,&rdquo; says Freya. &ldquo;My feed. Who in Crickmore made the fight videos? Follow LiskLad&rsquo;s copies back.&rdquo;'); return; }
      if (st.s === 6) { ER.sfx.no(); msg('&ldquo;Read the Gorsey sheet again,&rdquo; says Freya, &ldquo;all the way along every line.&rdquo;'); return; }
      if (!ER.check('s', String(st.s))) { ER.sfx.no(); msg('&ldquo;STILL COMING is wrong,&rdquo; says Isla. &ldquo;Take the six names, and find every one of them on the two sheets.&rdquo;'); return; }
      file = ER.exit([st.g + '-' + st.c + '-' + st.s], { wait: true });
      if (!file) { msg('A number plate falls off the board. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('d-file', file);
      FD.terms(['filter bubble', 'sample', 'repost']);
      FD.mine('score', 'The real score', '<p>Fight videos in Isla&rsquo;s feed: made by 3 people in Gorsey (Ken, Elaine Gooch, Harvey). In Freya&rsquo;s: by 3 in Crickmore (Howard Tamblyn, Isla, and Jamie&rsquo;s one joke). LiskLad made none: he only reposts.</p><p>Five of those six are still signed up for tomorrow. Elaine Gooch crossed herself out.</p><p>Sign-ups: Gorsey 212, Crickmore 198. Hardly fewer than last year.</p>', true);
      msg('GORSEY 3. CRICKMORE 3. STILL COMING 5.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Isla stares at the board. &ldquo;Three. Three people in Gorsey. Out of how many?&rdquo; &ldquo;About four thousand,&rdquo; says Freya. &ldquo;And two hundred and twelve of them have signed up to come tomorrow, nearly the same as last year.&rdquo;',
          '&ldquo;And three in Crickmore,&rdquo; says Isla. &ldquo;One of them&rsquo;s me.&rdquo; &ldquo;And one of them&rsquo;s me,&rdquo; says Jamie. &ldquo;And mine was a doorstop.&rdquo;',
          'Isla sits down. &ldquo;My phone has shown me the same three people thirty-six times this week, and I thought they were a whole town.&rdquo; She looks at the board. &ldquo;Five of the six are still coming. We&rsquo;ve all been shouting at each other, and we&rsquo;ve all still got our names down for the tea tent.&rdquo;',
          '&ldquo;And LiskLad?&rdquo; says Isla. &ldquo;Doesn&rsquo;t make anything,&rdquo; says Freya. &ldquo;He copies whatever&rsquo;s at the top. His last one went up at seven o&rsquo;clock tonight.&rdquo; She checks the time: 7.31. &ldquo;I don&rsquo;t know who he is. But I know what Burble knows about me, and it&rsquo;s a lot. It&rsquo;s on the library printer. The library&rsquo;s open till eight.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2400);
    });
    paintL();
    msg('Isla wants numbers. Count people, not videos.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
