<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null, tillN = 0;
  /* Ken's five videos, as Burble's Insights shows them for viewers near Gorsey */
  var VIDS = { fold: ['How to fold a Gorsey bun', '2,140', 52, 31, 2], race: ['Bridge Day 1987: the bun race', '1,860', 75, 18, 4],
    reply: ['To the comedian from Crickmore', '38,412', 71, 9, 14], cinn: ['New! The cinnamon Gorsey', '3,050', 38, 24, 3], deal: ['Two for £1 after four o&rsquo;clock', '990', 22, 5, 1] };
  var HOME = ['fold', 'deal', 'reply', 'cinn', 'race'];

  (function () {
    var s = '', i;
    for (i = 0; i < 14; i++) s += '<circle class="mote" cx="' + (620 + (i * 53) % 640) + '" cy="' + (300 + (i * 37) % 240) + '" r="' + (1.5 + (i % 3) * 0.6) + '" fill="#fff" opacity=".6" style="animation-delay:-' + ((i * 0.7) % 9).toFixed(1) + 's"/>';
    $('#motes').innerHTML = s;
    $('#ken').innerHTML = FD.who('ken');
    $('#freya').innerHTML = FD.who('freya', { smile: 2 });
  })();

  ER.init({
    theme: 'ai', story: 'feed', storyTitle: 'Everybody Thinks So', id: 'bakery', no: 'II', title: 'The Bakery',
    go: 'Knock on the glass',
    intro: [
      'At the youth club the felt-pen chart told you what Ade&rsquo;s phone would show him next. Ella did the same as Ade on all five videos, Gemma and Harvey on four, and all three pointed to video 6: LiskLad&rsquo;s CRICKMORE LAUGHS AT GORSEY (AGAIN). No hacker was needed. A recommendation system predicts from people who behave like you.',
      'Pocock&rsquo;s Bakery, Gorsey High Street, 6.27 p.m. The sign on the door says CLOSED, and Ken Pocock is sweeping flour into a small, angry pile.'
    ],
    exit: {"next":"bridge","w":{"4715bdb8":"3cdace7e"}}, tags: {"s1":["5e3e266f"],"s2":["faeea189"],"s3":["9d5e79ff"],"s4":["7b0c1133"],"s5":["2e69b22c"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('b-file') || null; told = ER.flag('b-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function ready() { return told.ken && told.tablet && told.card && told.leaflet; }
  function paint() {
    $('#window').classList.toggle('glow', !!(ready() && !nextFile));
    ER.pips((told.ken ? 1 : 0) + (told.tablet ? 1 : 0) + (told.card ? 1 : 0) + (told.leaflet ? 1 : 0) + (nextFile ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The bridge is next. The button at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['window', [
      'Burble&rsquo;s card (in your notebook: How Local Buzz chooses) gives every video a score. Highest score goes at the top. Views are not on the card.',
      'Score = finished + 2 × liked + 5 × shared. Do it for each of the five boxes. The folding video, for example: 52 + 62 + 10.',
      'The scores are 159, 131, 124, 101 and 37. The video with the most likes is not the winner, and neither is the one with the most finished.'
    ]];
    if (!told.ken) return ['ken', ['Ken is behind the counter. Talk to him.']];
    if (!told.tablet) return ['tablet', ['Ken said his numbers are on the tablet.', 'The tablet with a purple screen, propped on the counter on the right.']];
    if (!told.card) return ['card', ['Freya has put a page from Burble&rsquo;s own help on the counter.', 'The white page with a purple stripe, lying on the counter between the buns and the tablet.']];
    if (!told.leaflet) return ['leaflet', ['There is a leaflet for parents on the counter. It explains why Burble counts what it counts.', 'The small leaflet with a red edge, on the left end of the counter.']];
    return ['open', ['Now the window display, on the left. Put Ken&rsquo;s videos in the order Burble would show them.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The window is lit: the angry reply at the top, the folding video third.'); return; }
    if (told.in) { busy = false; ER.say('Pocock&rsquo;s Bakery, after hours. Flour in the air, and Ken.'); return; }
    tell('in');
    ER.narrate([
      'Freya knocks on the glass until Ken gives up pretending not to see her. He lets you in with a sigh that smells of cinnamon.',
      'Blue and white tiles, three shelves of what is left of today&rsquo;s bread, and a glass case of Gorsey buns: round, sticky, with a twist on top. They have been made the same way in this shop since 1961.',
      'In the window, the display shelves are empty. Ken always clears them at closing time, and tonight he has not had the heart to.'
    ], function () { busy = false; });
  }

  $('#ken').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Top shelf,&rdquo; says Ken, to nobody. &ldquo;My worst video. On my top shelf.&rdquo;'); return; }
    ER.talk({
      who: 'Ken Pocock', role: 'Baker, Gorsey', face: FD.face('ken', 'cross'),
      lines: [
        { note: 'Ken Pocock is a large man with flour up to his elbows and a moustache that has opinions.', a: '&ldquo;We&rsquo;re shut. Oh, it&rsquo;s you. And Freya. If this is about Bridge Day, it&rsquo;s that boy&rsquo;s fault. The Orr boy, from Crickmore. Nine seconds of my bun holding a door open. Tuesday the first of September. I&rsquo;ve got it written down.&rdquo;' },
        { q: 'What did you do?', a: '&ldquo;What anybody would do. I made a video back. Wednesday morning, six o&rsquo;clock, still in my apron. To the comedian from Crickmore. I said a few things.&rdquo; He sweeps harder. &ldquo;Thirty-eight thousand views. More than both towns put together. So don&rsquo;t tell me people don&rsquo;t agree with me.&rdquo;' },
        { q: 'Which of your videos do people like best?', a: '&ldquo;The folding one. How to fold a Gorsey bun: three turns and a tuck, the way my dad did it. People love that one. Look at the likes.&rdquo;' },
        { a: '&ldquo;Freya says Burble decides who sees what. Then Burble can explain itself. The numbers are on the tablet. I don&rsquo;t understand half of them, and I don&rsquo;t like the other half.&rdquo;' }
      ],
      clue: { id: 'ken', title: 'Ken: the boy, the reply, the likes', kind: 'What he said' },
      done: function (seen) { if (seen && tell('ken')) { paint(); ER.say('&ldquo;Thirty-eight thousand views.&rdquo; Freya writes the number down, and puts a question mark after it.'); } }
    });
  });

  var TABLET = '<h4>Burble for Business &middot; Insights &middot; Pocock&rsquo;s Bakery</h4><div class="in">' +
    '<p class="small">Your five videos. Viewers near Gorsey. <b>Finished</b>: out of every 100 viewers, how many watched to the end. <b>Liked</b>, <b>Shared</b>: out of every 100 viewers.</p>' +
    '<table><tr><th>Video</th><th>Posted</th><th>Views</th><th>Finished</th><th>Liked</th><th>Shared</th></tr>' +
    '<tr><td>How to fold a Gorsey bun</td><td>14 Aug</td><td class="n">2,140</td><td class="n">52</td><td class="n">31</td><td class="n">2</td></tr>' +
    '<tr><td>Bridge Day 1987: the bun race</td><td>25 Aug</td><td class="n">1,860</td><td class="n">75</td><td class="n">18</td><td class="n">4</td></tr>' +
    '<tr><td>To the comedian from Crickmore</td><td>2 Sep</td><td class="n">38,412</td><td class="n">71</td><td class="n">9</td><td class="n">14</td></tr>' +
    '<tr><td>New! The cinnamon Gorsey</td><td>18 Sep</td><td class="n">3,050</td><td class="n">38</td><td class="n">24</td><td class="n">3</td></tr>' +
    '<tr><td>Two for £1 after four o&rsquo;clock</td><td>30 Sep</td><td class="n">990</td><td class="n">22</td><td class="n">5</td><td class="n">1</td></tr></table>' +
    '<p class="small">A view is counted every time a video starts playing, on any phone, anywhere.</p></div>';
  $('#tablet').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TABLET, cls: 'fd-screen', clue: { id: 'tablet', title: 'Ken&rsquo;s tablet: Insights', kind: 'On the counter' }, done: function () {
      if (tell('tablet')) { paint(); ER.say('Gorsey has about four thousand people, and Crickmore about three and a half thousand. A view is not a person.'); }
    } });
  });
  var CARD = '<h4>Burble Help &middot; How Local Buzz chooses what you see</h4><div class="in">' +
    '<p>For every video it could show you, Burble predicts three things, from what people like you did before:</p>' +
    '<div class="sw"><b>Finished</b><span>Out of 100 people like you, how many will watch it to the end?</span><b>Liked</b><span>How many will press the heart?</span><b>Shared</b><span>How many will send it on?</span></div>' +
    '<p>Then it adds them up, but not equally:</p><div class="sum">score = finished + (2 × liked) + (5 × shared)</div>' +
    '<p>A share counts five times, because every share brings the video new viewers, and new viewers watch more videos. The videos with the highest scores go to the top of your Local Buzz. <span class="small">Example: finished 60, liked 10, shared 2 → 60 + 20 + 10 = 90.</span></p>' +
    '<p>Burble does not count views: a view is what happens <i>after</i> a video is ranked. And it does not ask whether you enjoyed a video. A video you hated, but watched to the end and sent to a friend with &ldquo;Can you believe this?&rdquo;, counts exactly like one you loved.</p></div>';
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'fd-screen', clue: { id: 'card', title: 'Burble Help: How Local Buzz chooses', kind: 'Freya&rsquo;s print-out' }, done: function () {
      FD.terms(['score', 'engagement']);
      if (tell('card')) { paint(); ER.say('&ldquo;Burble&rsquo;s own help page,&rdquo; says Freya. &ldquo;Anybody can read it. Nobody does.&rdquo;'); }
    } });
  });
  var LEAFLET = '<div class="hd">A parents&rsquo; guide to video apps</div><h4>Why are these apps free?</h4>' +
    '<p>Most video apps are free to use because they are paid for by <b>advertising</b>. Between the videos the app shows adverts, and companies pay to put them there.</p>' +
    '<p>The longer people stay in the app, and the more often they come back, the more adverts can be shown. So the people who build these apps measure what keeps people watching: minutes watched, videos finished, shares that bring new people in. They build their recommendation systems to <b>maximise</b> those numbers: to make them as big as possible. The usual word for all of this is <b>engagement</b>.</p>' +
    '<p>That is not wicked. It is the job the system was given, and it does the job very well. But a system that is very good at one number can be bad at the things nobody measured: sleep, homework, or getting on with the people next door.</p><p class="pg">Gorsey High School &middot; page 3</p>';
  $('#leaflet').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LEAFLET, cls: 'fd-leaflet', clue: { id: 'leaflet', title: 'A parents&rsquo; guide: why are these apps free?', kind: 'Leaflet' }, done: function () {
      FD.terms(['advertising', 'maximise', 'engagement']);
      if (tell('leaflet')) { paint(); ER.say('Burble maximises what it measures. Nobody asked it to measure what is good for Gorsey.'); }
    } });
  });
  FD.thing('#sign', null, 'POCOCK&rsquo;S, BAKERS SINCE 1961, in gold letters that Ken repaints every spring.', isBusy);
  FD.thing('#frame', null, 'A. Pocock, 1961: Ken&rsquo;s father, folding a bun. Three turns and a tuck.', isBusy);
  FD.thing('#case', null, 'GORSEY BUNS 60p. Round, sticky, with a twist on top. Not, whatever anybody in Crickmore says, a doorstop.', isBusy);
  $('#till').addEventListener('click', function () {
    if (busy) return;
    var L = ['The till says 0.00. Ken has already cashed up.', '&ldquo;Best September I&rsquo;ve ever had,&rdquo; says Ken, without looking. &ldquo;People from all over came to see the bun. Doesn&rsquo;t make it right.&rdquo;'];
    ER.say(L[tillN++ % L.length]);
  });
  $('#freya').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Across the bridge,&rdquo; says Freya. &ldquo;Bring the chalk board.&rdquo;' : '&ldquo;Read everything on the counter,&rdquo; says Freya. &ldquo;Then the window. Ken won&rsquo;t mind. Ken will mind, but he&rsquo;ll let us.&rdquo;');
  });
  $('#window').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Ken&rsquo;s five videos, in Burble&rsquo;s order. He wants to take the top one down, and cannot.'); return; }
    if (!told.ken) { ER.say('The empty window display. Talk to Ken first.'); return; }
    if (!told.tablet) { ER.say('&ldquo;The numbers are on my tablet,&rdquo; says Ken.'); return; }
    if (!told.card) { ER.say('&ldquo;Read Burble&rsquo;s own card first,&rdquo; says Freya, tapping the page on the counter.'); return; }
    if (!told.leaflet) { ER.say('&ldquo;And the leaflet,&rdquo; says Freya. &ldquo;It says why Burble counts what it counts.&rdquo;'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: Burble's window ---------- */
  function makeLock() {
    var st = ER.flag('b-st') || {}, wait = false, i;
    var box = ER.el('div', 'pz bw'), s = '<div class="bw-in"><div class="bw-win"><h5>BURBLE&rsquo;S WINDOW<small>SHELF 1 = TOP OF LOCAL BUZZ</small></h5>';
    for (i = 1; i <= 5; i++) s += '<div class="sh" data-n="' + i + '"></div>';
    s += '</div><div class="bw-home"><h5>Ken&rsquo;s five videos (viewers near Gorsey)</h5></div></div>' +
      '<div class="pz-foot"><p class="pmsg"></p><button type="button" class="btn" id="bw-go">Light the window</button></div>';
    box.innerHTML = s;
    var home = box.querySelector('.bw-home'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function card(k) {
      var v = VIDS[k], n = ER.el('div', 'vb dnd-item');
      n.setAttribute('data-v', k);
      n.innerHTML = '<b>' + v[0] + '</b><span><em>views ' + v[1] + ' &middot;</em> finished ' + v[2] + ' &middot; liked ' + v[3] + ' &middot; shared ' + v[4] + '</span>';
      return n;
    }
    HOME.forEach(function (k) {
      var n = card(k), at = null;
      for (var j = 1; j <= 5; j++) if (st[j] === k) at = j;
      (at ? box.querySelector('.sh[data-n="' + at + '"]') : home).appendChild(n);
    });
    function read() { var o = {}; ER.$$('.sh', box).forEach(function (sh) { var v = sh.querySelector('.vb'); if (v) o[sh.getAttribute('data-n')] = v.getAttribute('data-v'); }); return o; }
    function paintL() { ER.$$('.sh', box).forEach(function (sh) { sh.classList.toggle('empty', !sh.querySelector('.vb')); }); }
    ER.dnd(box, { item: '.vb', slot: '.sh', home: home, lock: function () { return wait || !!nextFile; },
      change: function () { st = read(); ER.flag('b-st', st); FD.sfx.tray(); paintL(); } });
    box.querySelector('#bw-go').addEventListener('click', function () {
      if (wait || nextFile) return;
      var o = read(), seq = [], j, bad = 0, file;
      for (j = 1; j <= 5; j++) seq.push(o[j] || '');
      if (seq.indexOf('') >= 0) { ER.sfx.no(); msg('Five shelves, five videos. Fill every shelf.'); return; }
      var q = seq.join(' ');
      if (q === 'reply cinn fold race deal') { ER.sfx.no(); msg('&ldquo;That&rsquo;s by views,&rdquo; says Freya. &ldquo;But views are what happened <i>after</i> Burble ranked them. The card doesn&rsquo;t use views at all.&rdquo;'); return; }
      if (q === 'fold cinn race reply deal') { ER.sfx.no(); msg('&ldquo;That&rsquo;s the app showing people what they like,&rdquo; says Freya. &ldquo;I say that every day.&rdquo; She looks at the card again. &ldquo;The card doesn&rsquo;t. A like counts two. A share counts five.&rdquo;'); return; }
      if (q === 'race reply fold cinn deal') { ER.sfx.no(); msg('&ldquo;That&rsquo;s only the first column,&rdquo; says Freya. &ldquo;Finished, yes. But the likes and the shares count as well.&rdquo;'); return; }
      if (q === 'reply race cinn fold deal') { ER.sfx.no(); msg('&ldquo;That&rsquo;s by shares alone,&rdquo; says Freya. &ldquo;A share counts five times, but finishing and liking still count. Work out every score.&rdquo;'); return; }
      for (j = 1; j <= 5; j++) if (!ER.check('s' + j, seq[j - 1])) { bad = j; break; }
      if (bad) { ER.sfx.no(); msg('&ldquo;Shelf ' + bad + ' is wrong,&rdquo; says Ken, who has been doing the sums on a paper bag. &ldquo;Give every box its score from the card, then put them in order.&rdquo;'); return; }
      file = ER.exit([seq.join('-')], { wait: true });
      if (!file) { msg('The window light flickers and goes out. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('b-file', file);
      FD.terms(['score', 'maximise']);
      FD.mine('window', 'Burble&rsquo;s window', '<p>Score = finished + 2 × liked + 5 × shared.</p><p>1. To the comedian from Crickmore: 71 + 18 + 70 = 159<br>2. Bridge Day 1987: 75 + 36 + 20 = 131<br>3. How to fold a Gorsey bun: 52 + 62 + 10 = 124<br>4. The cinnamon Gorsey: 38 + 48 + 15 = 101<br>5. Two for £1: 22 + 10 + 5 = 37</p><p>The most liked video came third. Burble counts what people do, not what they like.</p>', true);
      msg('The window lights up. On the top shelf: To the comedian from Crickmore.');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Ken looks at his window for a long time. &ldquo;My reply,&rdquo; he says. &ldquo;On the top shelf. A hundred and fifty-nine. I made that in a temper at six in the morning.&rdquo;',
          '&ldquo;And your folding video has the most likes in the window, and it&rsquo;s third,&rdquo; says Freya. She takes the felt pen from behind her ear and crosses something out in her folder. &ldquo;I&rsquo;ve been telling people for a year that the app shows people what they like. It doesn&rsquo;t. It shows them what they&rsquo;ll finish and share. Liking hardly comes into it.&rdquo;',
          '&ldquo;People didn&rsquo;t share it to agree with me,&rdquo; says Ken. &ldquo;They sent it round to say look what this idiot baker&rsquo;s said.&rdquo; &ldquo;Burble doesn&rsquo;t know why,&rdquo; says Freya. &ldquo;A share&rsquo;s a share. Every one of them made it climb. And where do shares go?&rdquo;',
          'Ken, slowly: &ldquo;Across the bridge.&rdquo; Freya is already at the door. &ldquo;Then that&rsquo;s where I want to draw something. I need a lot of room, and I need your chalk board, Ken.&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2400);
    });
    paintL();
    msg('Put Ken&rsquo;s five videos on the shelves in the order Burble would rank them for people near Gorsey: the top of Local Buzz on shelf 1.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
})();
</script>
