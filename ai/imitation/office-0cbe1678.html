    ], function () { busy = false; });
  }

  var REMATCH = '<h4>REMATCH &middot; JUDGE 1 &middot; UPJOHN &middot; 17:28 &middot; LEFT booth 2 &middot; RIGHT booth 3</h4>' +
    '<p>17:28:04 JUDGE&nbsp; What did you have for lunch?</p><p>17:28:18 LEFT&nbsp;&nbsp; Kimbap that I made at home, and an apple.</p><p>17:28:51 RIGHT&nbsp; pizza lol. wbu?</p>' +

  $('#rematch').addEventListener('click', function () {

  $('#gately').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Rule 7,&rdquo; says Mrs Gately, holding the list. &ldquo;My rule. Very well.&rdquo;'); return; }
    if (ready()) { if (!lock) lock = makeLock(); lock.open(); return; }
    if (!told.rematch) { ER.say('&ldquo;Have you read it?&rdquo; says Mrs Gately, pushing the print-out across the desk. &ldquo;Read it.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Bernadette Gately', role: 'Director, Haverleigh Museum of Computing', face: IM.face('gately', 'cross'),
      lines: [
        { note: 'Mrs Gately has stopped practising her speech.', a: '&ldquo;Well, it&rsquo;s obvious, isn&rsquo;t it? Those college children. Look at the tips sheet that told my judges machines never make spelling mistakes: printed at the college. They wrote it to help their own machine.&rdquo;' },
        { q: 'And the thirty per cent?', a: '&ldquo;That&rsquo;s Turing&rsquo;s, not mine. Thirty per cent and five minutes, he said so in 1950. I only followed Turing. Nobody can blame a museum for following Turing.&rdquo;' },
        { q: 'What do you need?', a: '&ldquo;At six I have to stand up and say what happened, and I will not stand up and blame the wrong people twice in one day.&rdquo; She sighs. &ldquo;Find out who decided what. Every paper in this office is yours. When you have it, bring it to me and I&rsquo;ll read it out. Even if it&rsquo;s me.&rdquo;' }
      ],

      done: function (seen) { if (seen && tell('gately')) { paint(); ER.say('&ldquo;Printed at the college is not the same as written at the college,&rdquo; says Hazel.'); } }
    });
  });
  var RULES = '<h4>The Haverleigh Imitation Game &middot; Rules</h4>' +
    '<div class="r"><b>Rule 1</b><span>The game is played in the Old Exchange on the fourth Saturday of October.</span></div>' +
    '<div class="r"><b>Rule 2</b><span>Each conversation puts one judge, one hidden person and one program together. The judge sees them only as LEFT and RIGHT.</span></div>' +
    '<div class="r"><b>Rule 3</b><span>Hidden people come in by the back door and never meet the judges. They do not give their real names, and they tell the truth.</span></div>' +
    '<div class="r"><b>Rule 4</b><span>Each conversation lasts five minutes (as Turing said).</span></div>' +
    '<div class="r"><b>Rule 5</b><span>The judge marks which side is the person. The last mark counts.</span></div>' +
    '<div class="r"><b>Rule 6</b><span>Anyone may enter a program. The museum enters ELIZA (1966) every year.</span></div>' +
    '<div class="r"><b>Rule 7</b><span>A program scores one point each time a judge picks it as the person. Nothing else is counted.</span></div>' +
    '<div class="r"><b>Rule 8</b><span>The program with the most points wins the Glass Owl. The hidden person judged human most often wins the Blue Rosette.</span></div>' +

    } });
  });
  var TUR6 = '<div class="hd">Mrs Gately&rsquo;s photocopy &middot; Turing, 1950, section 6</div><h4>Turing&rsquo;s prediction</h4>' +
    '<div class="qa">I believe that in about fifty years&rsquo; time it will be possible to programme computers, with a storage capacity of about 10<sup>9</sup>, to make them play the imitation game so well that an average interrogator will not have more than 70 per cent chance of making the right identification after five minutes of questioning.</div>' +
    '<p>Fifty years from 1950 is about 2000. A storage capacity of about 10<sup>9</sup> is about a thousand million binary digits: roughly 125 megabytes. And the very next sentence:</p>' +
    '<div class="qa">The original question, &ldquo;Can machines think?&rdquo; I believe to be too meaningless to deserve discussion.</div>' +
    '<p>So this is a <b>prediction</b>: a guess about what would happen by about 2000. It is not a <b>pass mark</b>, and it is about the interrogator: how often the judge gets it right.</p>' +

  $('#turing6').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TUR6, cls: 'im-frame', clue: { id: 'turing6', title: 'Turing&rsquo;s prediction', kind: 'Mrs Gately&rsquo;s photocopy' }, done: function () {
      IM.terms(['prediction', 'pass mark']);
      if (tell('turing6')) { paint(); ER.say('&ldquo;He guessed,&rdquo; says Hazel. &ldquo;He never said: and then it thinks. He said the question was too meaningless to discuss. Bernadette turned a guess into a rule.&rdquo;'); }
    } });
  });
  var MAIL1 = '<h4>Re: Ideas for this year&rsquo;s game</h4><div class="hdr">From: Hazel Fothergill &middot; To: Bernadette Gately &middot; Fri 14 Aug 2026, 09:12</div>' +
    '<p>Bernadette, four ideas for October. 1. Twenty minutes a conversation, not five: five minutes is a guess Turing made, not a rule. 2. Give the judges my notes (attached) instead of tips. 3. A person reads every conversation before any result goes on the board. 4. Count whether a program answers the judge&rsquo;s questions, not only whether it is called human. H.</p>' +
    '<p class="quote">Reply, 14 Aug, 11:40: Hazel, you&rsquo;re a treasure, but Turing said five minutes, and nobody will sit through twenty. Results straight on the board: the press love it! The tips are in hand. B.</p>';
  $('#mail1').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MAIL1, cls: 'im-mail', clue: { id: 'mail1', title: 'Hazel&rsquo;s four ideas, and the reply', kind: 'Email, 14 August' }, done: function () {
      IM.terms(['human in the loop']);
      if (tell('mail1')) { paint(); ER.say('&ldquo;A person reads every conversation before any result goes up,&rdquo; says Hazel. &ldquo;A human in the loop. I asked in August.&rdquo;'); }
    } });
  });
  var MAIL2 = '<h4>Scoring?</h4><div class="hdr">From: Rohan Sethi (Haverleigh College) &middot; To: Bernadette Gately &middot; Wed 2 Sep 2026, 16:05</div>' +
    '<p>Dear Mrs Gately, how exactly will programs be scored this year? We want to tune ours properly, so we need to know what counts. Thanks, Rohan Sethi and Georgie Pennant</p>' +
    '<p class="quote">Reply, 2 Sep, 16:31: Exactly as Rule 7: one point per HUMAN verdict, that&rsquo;s all that counts! Good luck! B.</p>';
  $('#mail2').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: MAIL2, cls: 'im-mail', clue: { id: 'mail2', title: 'Scoring? (the college team)', kind: 'Email, 2 September' }, done: function () {
      if (tell('mail2')) { paint(); ER.say('16:31 on the second of September. That evening the team wrote &ldquo;How we tune MADDIE&rdquo;, with her words in rule 3.'); }
    } });
  });
  var DRAWER = '<div class="hd">The bottom drawer, marked BITS</div><h4>How to spot a machine</h4>' +
    '<p><i>Home Computing Today</i>, March 1997, page 41, cut out and kept:</p>' +
    '<p>1. Machines are fast. A player who answers instantly is probably a machine. 2. Machines never make spelling mistakes. Watch for perfect grammar. 3. Machines have no feelings. Ask how they feel. 4. Trust your instinct!</p>' +
    '<p class="pencil">Use these for the tips sheet! B.</p>' +
    '<p>Clipped to it, an email: <i>Tue 20 Oct. Dear Print Room, our printer has died. Could you print 10 copies of the attached Tips for judges by Friday? Many thanks, Bernadette Gately.</i> And the reply: <i>Done. Collect from college reception, Wednesday.</i></p>';
  $('#drawer').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: DRAWER, cls: 'im-cut', clue: { id: 'drawer', title: 'The bottom drawer: How to spot a machine', kind: 'Filing cabinet' }, done: function () {
      if (tell('drawer')) { paint(); ER.say('Word for word, the tips sheet. Cut out of a magazine in 1997, printed at the college because the museum printer had died. The college team never saw it.'); }
    } });
  });
  var LETTER = '<h4>County Heritage Fund</h4><div class="hdr">To: The Director, Haverleigh Museum of Computing &middot; 3 August 2026</div><p>Dear Mrs Gately, thank you for your application. The panel will decide in December. It would greatly strengthen your case to show that the museum reaches people beyond Haverleigh: a story about this year&rsquo;s imitation game in the national papers, for example. Yours sincerely, the Grants Officer</p>';
  $('#letter').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LETTER, cls: 'im-mail', clue: { id: 'letter', title: 'A letter about the grant', kind: 'On the pinboard' }, done: function () {
      ER.say('&ldquo;So that&rsquo;s why she wanted a headline,&rdquo; says Hazel. &ldquo;Not wicked. Worried about the roof.&rdquo;');
    } });
  });
  IM.thing('#owl', null, 'The Glass Owl. Twelve years, and nobody has ever taken it home.', isBusy);
  IM.thing('#window', null, 'Rain over Signal Street, and St Ebba&rsquo;s clock lit up at the end of it. Nineteen minutes to six.', isBusy);
  $('#hazel').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Shared,&rdquo; says Hazel. &ldquo;But not equally. That&rsquo;s fair.&rdquo;' : '&ldquo;Every decision was made by somebody, on a day, on a piece of paper,&rdquo; says Hazel. &ldquo;Find the paper.&rdquo;');
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: who decided what ---------- */
  function makeLock() {
    var st = ER.flag('f-st') || { w: [], pin: -1 }, done = false;
    var html = '<div class="lg-box"><h5>Who decided what</h5><p class="sub">For each decision, choose who made it. Then put the red pin on the one where the measuring first went wrong: the one Mrs Gately should change first.</p>' +
      '<div class="lg-head"><span>Decision</span><span>Who decided</span><span>Pin</span></div>' +
      ROWS.map(function (r, i) { return '<div class="lg-row" data-r="' + i + '"><span class="d"><b>' + r[0] + '</b>' + r[1] + '</span><span class="lg-who">' + WHO.map(function (w) { return '<button type="button" data-w="' + w[0] + '">' + w[1] + '</button>'; }).join('') + '</span><button type="button" class="lg-pin">PIN</button></div>'; }).join('') + '</div>';
    return IM.lock('lg', html, function (box, msg) {
      var go = box.querySelector('.pz-go'); go.textContent = 'Give it to Mrs Gately';
      function paintL() {
        ER.$$('.lg-row', box).forEach(function (row, i) {
          ER.$$('.lg-who button', row).forEach(function (b) { b.classList.toggle('on', st.w[i] === b.getAttribute('data-w')); });
          row.querySelector('.lg-pin').classList.toggle('on', st.pin === i);
        });
      }
      ER.$$('.lg-row', box).forEach(function (row, i) {
        ER.$$('.lg-who button', row).forEach(function (b) { b.addEventListener('click', function () { if (done) return; st.w[i] = b.getAttribute('data-w'); ER.flag('f-st', st); IM.sfx.tap(); paintL(); }); });
        row.querySelector('.lg-pin').addEventListener('click', function () { if (done) return; st.pin = st.pin === i ? -1 : i; ER.flag('f-st', st); IM.sfx.pin(); paintL(); });
      });
      go.addEventListener('click', function () {
        if (done) return;
        var i, bad = [];
        for (i = 0; i < 6; i++) if (!st.w[i]) { ER.sfx.no(); msg('Choose who decided every one of the six.'); return; }
        if (st.pin < 0) { ER.sfx.no(); msg('And the red pin: where did the measuring first go wrong?'); return; }
        for (i = 0; i < 6; i++) if (!ER.check('r' + (i + 1), st.w[i])) bad.push(i);
        if (bad.length) {
          ER.sfx.no();
          var b = bad[0], w = st.w[b], m;
          if (w === 'maddie') m = '&ldquo;A program does not choose what it is rewarded for,&rdquo; says Hazel. &ldquo;MADDIE can&rsquo;t be blamed, or praised. Who, or what, kept each switch?&rdquo;';
          else if (w === 'turing') m = '&ldquo;Turing made a prediction in 1950,&rdquo; says Hazel. &ldquo;He never wrote a rule for Haverleigh. Who did?&rdquo;';
          else if (b === 3) m = '&ldquo;Printed at the college,&rdquo; says Hazel. &ldquo;Written where? Look at what was in the bottom drawer.&rdquo;';
          else if (b === 2) m = '&ldquo;Rohan and Georgie wrote the switches,&rdquo; says Hazel, &ldquo;but did they choose which ones stayed on? Look at the log and their rule 4.&rdquo;';
          else m = '&ldquo;' + ROWS[b][0] + ',&rdquo; says Hazel. &ldquo;Find the paper it was written on, and whose name is at the bottom.&rdquo;';
          msg((bad.length === 1 ? 'One line is wrong. ' : bad.length + ' lines are wrong. ') + m);
          return;
        }
        if (!ER.check('root', 'r' + (st.pin + 1))) { ER.sfx.no(); msg('&ldquo;Not that one first,&rdquo; says Mrs Gately. &ldquo;Which came first, and which did the others copy? The team asked me how they would be scored.&rdquo;'); return; }
        var file = ER.exit([st.w.join('-') + '-r' + (st.pin + 1)], { wait: true });
        if (!file) { msg('The pen runs out. Something is wrong with this page: tell your teacher.'); return; }
        done = true; nextFile = file; ER.flag('f-file', file);
        IM.terms(['responsible']);
        IM.mine('ledger', 'Who decided what', '<p>Rule 7 (score only HUMAN verdicts): Mrs Gately, July. PINNED: the measuring went wrong here first.</p><p>Keep a change if more testers tick HUMAN: Rohan and Georgie, 2 Sept, copying Rule 7 from her email.</p><p>The tricks: nobody chose them. The tuning kept whatever scored.</p><p>The tips: Mrs Gately, out of a 1997 magazine. Printed at the college, not written there.</p><p>Rule 9, the &ldquo;pass mark&rdquo; and no human in the loop: Mrs Gately, from Turing&rsquo;s prediction.</p><p>MADDIE over Jiwoo: the judges, who trusted the tips.</p>', true);
        msg('Mrs Gately reads the list once, slowly. Her own name is on it three times.');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            '&ldquo;Rule 7,&rdquo; says Mrs Gately. &ldquo;Nothing else is counted. I wrote that in July, on the back of a gas bill, and I was proud of how simple it was.&rdquo; She looks at the red pin. &ldquo;They asked me how they would be scored, and I told them. And then their program learned exactly what I told them.&rdquo;',
            '&ldquo;The tips are mine. Out of a magazine from 1997. I was going to blame two seventeen-year-olds for my magazine.&rdquo; She takes off her glasses. &ldquo;And Rule 9. Turing guessed, and I made his guess a pass mark, and I put the result on the board before anybody had read a word.&rdquo;',
            '&ldquo;It wasn&rsquo;t only you,&rdquo; says Hazel. &ldquo;The team chose a goal and never read their own last column. The judges trusted a typo over a fire alarm. But the measure came first, and it was yours.&rdquo; &ldquo;Yes,&rdquo; says Mrs Gately. &ldquo;Shared. Not equally.&rdquo;',
            'Downstairs, a microphone squeals. Mrs Gately stands up, picks up the owl, and puts the list in her pocket. &ldquo;Six o&rsquo;clock,&rdquo; she says. &ldquo;Come and stand where I can see you.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 2400);
      });
      paintL();
      msg('Six decisions, six names to choose from. Every paper you have read is in your notebook.');
    });
  }
})();
</script>

</html>
