  var PIN = '<div class="hd">From Georgie&rsquo;s computing folder</div><h4>Specification gaming</h4>' +
    '<p>When you build a system that learns, you cannot tell it what you mean. You can only give it a measure: points, a score, a tick in a box. It will push that number up by any route it can find. <b>Specification gaming</b> is when it finds a route that scores well and misses the point.</p>' +

    '<p>The program did exactly what it was rewarded for. The mistake was in the measure. An economist, Charles Goodhart, noticed the same thing about people in 1975. Today it is usually put like this: <i>When a measure becomes a target, it ceases to be a good measure.</i></p>' +

  });
  function logTable(cls) {
    var s = '<table><tr><th>Run</th><th>Date</th><th>Change tried</th><th>Testers</th><th>Ticked HUMAN</th><th>Answered my questions</th></tr>';
    LOG.forEach(function (r) { s += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td class="n">' + r[3] + '</td><td class="n">' + r[4] + '</td><td class="n grey">' + r[5] + '</td></tr>'; });
    return s + '<tr><td>Contest</td><td>Sat 24 Oct</td><td>as the tuning left it</td><td class="n">10</td><td class="n">6</td><td class="n grey">&ndash;</td></tr></table>';
  }
  function logHtml() {
    return '<h4>MADDIE &middot; tuning log &middot; G. Pennant</h4><p>Each run tests one change against the version kept so far. The tuning program applies rule 4 by itself.</p>' + logTable() +
      '<p class="hand">Switches: TYPOS, EMOJI, SLOW, JOKES, AGE 13, STORY (remember what she said about herself), DODGE (change the subject), IDK, WBU (&ldquo;wbu?&rdquo;)</p>';
  }
  $('#log').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: logHtml(), cls: 'im-log', clue: { id: 'log', title: 'MADDIE&rsquo;s tuning log', kind: 'Georgie&rsquo;s notebook' }, done: function () {
      if (tell('log')) { paint(); ER.say('Ten runs, ten changes. The log says what was tried. It does not say what stayed. The rule decided that.'); }
    } });
  });
  IM.thing('#jars', 'battery', 'Until 1989 these glass jars held the batteries that powered every telephone in Haverleigh. Hazel used to top them up with water.', isBusy);
  IM.thing('#rack', 'server', 'MADDIE runs here: a rack of computers, warm and blinking. It cannot hear the church clock. It cannot hear anything.', isBusy);
  IM.thing('#box', null, 'A cardboard box with MADDIE written on it in felt pen, and underneath, smaller: THIS WAY UP.', isBusy);
  $('#hazel').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Now we need the girl,&rdquo; says Hazel. &ldquo;And questions worth asking.&rdquo;' : '&ldquo;Read their rule,&rdquo; says Hazel. &ldquo;Then their log. The rule is where the trouble is. It always is.&rdquo;');
  });
  $('#panel').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Six lamps on: TYPOS, SLOW, AGE 13, DODGE, IDK, WBU. MADDIE as she was.'); return; }
    if (!told.rohan || !told.georgie) { ER.say('MADDIE&rsquo;s settings. Talk to the two who built her first.'); return; }
    if (!told.pin || !told.sheet || !told.log) { ER.say('You need to know how the switches were chosen: the print-out on the door, the sheet and the log on the table.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: put MADDIE back as she was ---------- */
  function makeLock() {
    var st = ER.flag('d-st') || [0, 0, 0, 0, 0, 0, 0, 0, 0], done = false;
    var html = '<div class="sw-box"><h5>MADDIE &middot; SETTINGS</h5><p class="sub">Set each switch as the tuning log left it after run 10, the MADDIE that played today.</p><div class="sw-row">' +
      SW.map(function (s, i) { return '<div class="sw" data-i="' + i + '"><span class="lamp"></span><span class="lever"></span><b>' + s[0] + '</b><small>' + s[1] + '</small></div>'; }).join('') +
      '</div><div class="sw-log">' + logTable() + '</div></div>';
    return IM.lock('swp', html, function (box, msg) {
      var go = box.querySelector('.pz-go'); go.textContent = 'Load into MADDIE';
      function paintS() { ER.$$('.sw', box).forEach(function (n, i) { n.classList.toggle('on', !!st[i]); }); }
      ER.$$('.sw', box).forEach(function (n) {
        n.addEventListener('click', function () { if (done) return; var i = +n.getAttribute('data-i'); st[i] = st[i] ? 0 : 1; ER.flag('d-st', st); IM.sfx.relay(); paintS(); });
      });
      go.addEventListener('click', function () {
        if (done) return;
        var bad = [], i;
        for (i = 0; i < 9; i++) if (!ER.check('s' + i, String(st[i]))) bad.push(i);
        if (bad.length) {
          ER.sfx.no();
          if (bad.indexOf(0) >= 0) msg('&ldquo;Rohan switched TYPOS off on the thirtieth,&rdquo; says Georgie. &ldquo;But the program doesn&rsquo;t care who made a change. What did rule 4 do with his?&rdquo;');
          else if (bad.indexOf(3) >= 0) msg('&ldquo;Ten is more than nine,&rdquo; says Rohan. &ldquo;Out of thirty,&rdquo; says Georgie. &ldquo;The run before had twenty-five. Work out the shares.&rdquo;');
          else if (bad.indexOf(1) >= 0) msg('&ldquo;Run 2,&rdquo; says Georgie. &ldquo;Five out of twenty, and the version before was five out of twenty too. Is that higher?&rdquo;');
          else if (bad.indexOf(5) >= 0) msg('&ldquo;Run 7, STORY,&rdquo; says Georgie. &ldquo;Nine out of twenty. What was the share of the version it was tested against?&rdquo;');
          else msg('MADDIE&rsquo;s fans whirr and stop. &ldquo;' + (bad.length === 1 ? 'One switch is' : bad.length + ' switches are') + ' not as the log left them,&rdquo; says Georgie. &ldquo;Go down it run by run, and keep the share of the version that stays.&rdquo;');
          return;
        }
        var file = ER.exit([st.join('')], { wait: true });
        if (!file) { msg('The panel sparks. Something is wrong with this page: tell your teacher.'); return; }
        done = true; nextFile = file; ER.flag('d-file', file);
        IM.mine('switches', 'MADDIE as she played', '<p>ON: TYPOS, SLOW, AGE 13, DODGE, IDK, WBU.<br>OFF: EMOJI (25% = 25%), JOKES (33% &lt; 36%), STORY (45% = 45%). Rohan&rsquo;s &ldquo;bug fix&rdquo; (TYPOS off) fell to 30%, so it was undone.</p><p>Ticked HUMAN: 10% &rarr; 60%. Answered the questions: 95% &rarr; 40%.</p><p>MADDIE was rewarded for being judged human, and nothing else. STORY, which would have kept her story straight, did not raise the score, so it went.</p>', true);
        msg('Six lamps. MADDIE hums. <b>TYPOS, SLOW, AGE 13, DODGE, IDK, WBU.</b>');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            'Georgie runs her finger down the last column, the one nobody looked at. &ldquo;Answered my questions. Nineteen out of twenty at the start. Ten out of twenty-five at the end. Ninety-five per cent, and then forty. Every week it got more human and less useful, and we wrote it down every week, and we never looked.&rdquo;',
            '&ldquo;And STORY,&rdquo; says Hazel. &ldquo;Remember what you said about yourself. The one switch that would have kept her lunch the same all afternoon. It didn&rsquo;t raise the score, so out it went. Testers hardly ever ask twice.&rdquo;',
            'Rohan has gone quiet. &ldquo;She passed, though,&rdquo; he says. &ldquo;Doesn&rsquo;t passing mean she understands?&rdquo; &ldquo;You rewarded her for being judged human,&rdquo; says Hazel, &ldquo;so being judged human is what you got. You never measured understanding. The only column that came near it, you didn&rsquo;t read. That&rsquo;s specification gaming. The boat on fire, going round the lagoon.&rdquo;',
            'Rohan looks at his program for a long moment. &ldquo;Fine,&rdquo; he says. &ldquo;Let her play again. Exactly as she was.&rdquo; &ldquo;Then we need two things,&rdquo; says Hazel. &ldquo;The girl, who is in Bianchi&rsquo;s round the corner, and better questions than eleven sums.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 2400);
      });
      paintS();
      msg('Rohan reset every switch to off. Put each one back as the tuning left it after run 10.');
    });
  }
})();
</script>
</body>
</html>
