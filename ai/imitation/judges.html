        { q: 'And the board?', a: '&ldquo;The board is Bernadette&rsquo;s arithmetic, done at twenty past three with a cup of tea in one hand. I don&rsquo;t doubt the arithmetic. I doubt what it&rsquo;s counting.&rdquo;' },
        { q: 'What do you want me to do?', a: '&ldquo;Count it again, the way Turing would have. Not how often each program was called human: how often each judge got it right. That&rsquo;s the only thing his game ever measured. His page is framed on the wall, if you want it from the horse&rsquo;s mouth.&rdquo;' },
        { a: '&ldquo;You&rsquo;ll need Bernadette&rsquo;s round sheet as well as the slips. The judges never knew which booth was on which side of their screen. She did. It&rsquo;s on the clipboard on Judge 5&rsquo;s desk.&rdquo;' }
      ],
      clue: { id: 'hazel1', title: 'Hazel: count it again', kind: 'What she said' },
      done: function (seen) { if (seen && tell('hazel')) { paint(); ER.say('&ldquo;How often each judge got it right,&rdquo; Hazel repeats, and taps the board with a pencil.'); } }
    });
  });
  $('#gately').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Nought out of five is a very small number,&rdquo; says Mrs Gately, &ldquo;and it changes nothing. Sixty per cent is sixty per cent.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Bernadette Gately', role: 'Director, Haverleigh Museum of Computing', face: IM.face('gately', 'smile'),
      lines: [
        { note: 'Mrs Gately has run the museum for nine years, under a roof that leaks, on a grant that is up for renewal in December. She is very happy.', a: '&ldquo;Sixty per cent! Twelve years we&rsquo;ve run this game, and no program has ever got past twenty. Turing said thirty per cent was a pass, you know. It&rsquo;s Rule 9. MADDIE thinks. The Herald is running it on Monday: IT THINKS, in letters this high.&rdquo;' },
        { q: 'What about Jiwoo?', a: '&ldquo;Poor girl. Four out of ten. I did wonder about her when she came in this morning: very precise. Some people just type like that.&rdquo; She frowns. &ldquo;It was a difficult day all round. At the judges&rsquo; briefing this morning I knocked the water jug over the rule books, and just before the first round I had to apologise over the loudspeaker about the heater in booth 2. The whole building heard me.&rdquo;' },
        { q: 'Can we count again?', a: '&ldquo;Count all you like, dear. The slips won&rsquo;t change. But do it before six: the prizes are at six, Lorraine from the Herald is bringing a photographer, and I am not keeping the mayor waiting.&rdquo;' }
      ],
      clue: { id: 'gately1', title: 'Mrs Gately: sixty per cent', kind: 'What she said' },
      done: function (seen) { if (seen && tell('gately')) { paint(); ER.say('&ldquo;Turing said thirty per cent,&rdquo; says Hazel, not quite under her breath. &ldquo;Turing said nothing of the kind.&rdquo;'); } }
    });
  });

  var TURING = '<div class="hd">Mind &middot; October 1950</div><h4>Computing Machinery and Intelligence &middot; A. M. Turing</h4><div class="two"><div>' +
    '<p>Turing begins: <q>I propose to consider the question, &ldquo;Can machines think?&rdquo;</q> Then he puts it aside, because nobody agrees what &ldquo;think&rdquo; means, and replaces it with a game.</p>' +
    '<p>The <b>imitation game</b> has three players. Two of them, A and B, are out of sight in one room. The third, the <b>interrogator</b>, sits in another, knows them only as X and Y, and must decide which is which. The answers are typed, so that a voice gives nothing away: <q>The ideal arrangement is to have a teleprinter communicating between the two rooms.</q> One hidden player tries to help the interrogator; the other tries to make the interrogator get it wrong.</p>' +
    '<p>Then: <q>What will happen when a machine takes the part of A in this game?</q> Will the interrogator decide wrongly as often as before? <q>These questions replace our original, &ldquo;Can machines think?&rdquo;</q></p></div>' +
    '<svg viewBox="0 0 230 250"><rect x="10" y="10" width="210" height="96" fill="none" stroke="#3a2e1e" stroke-width="3"/><text x="115" y="28" font-family="Cinzel" font-size="12" text-anchor="middle" fill="#3a2e1e">ROOM 1: HIDDEN</text>' +
    '<circle cx="62" cy="58" r="12" fill="#8a6a3a"/><path d="M44 96q0 -26 18 -26t18 26z" fill="#8a6a3a"/><text x="62" y="62" font-family="Cinzel" font-size="12" text-anchor="middle" fill="#fff">A</text>' +
    '<circle cx="168" cy="58" r="12" fill="#8a6a3a"/><path d="M150 96q0 -26 18 -26t18 26z" fill="#8a6a3a"/><text x="168" y="62" font-family="Cinzel" font-size="12" text-anchor="middle" fill="#fff">B</text>' +
    '<path d="M62 106v54M168 106v54" stroke="#3a2e1e" stroke-width="2" stroke-dasharray="5 4"/><text x="115" y="140" font-family="Special Elite" font-size="12" text-anchor="middle" fill="#3a2e1e">typed answers</text>' +
    '<rect x="10" y="160" width="210" height="80" fill="none" stroke="#3a2e1e" stroke-width="3"/><text x="115" y="178" font-family="Cinzel" font-size="12" text-anchor="middle" fill="#3a2e1e">ROOM 2</text>' +
    '<circle cx="115" cy="200" r="12" fill="#2f5a4a"/><path d="M97 238q0 -26 18 -26t18 26z" fill="#2f5a4a"/><text x="115" y="204" font-family="Cinzel" font-size="12" text-anchor="middle" fill="#fff">C</text>' +
    '<text x="40" y="222" font-family="Special Elite" font-size="13" text-anchor="middle" fill="#3a2e1e">X?</text><text x="190" y="222" font-family="Special Elite" font-size="13" text-anchor="middle" fill="#3a2e1e">Y?</text></svg></div>' +
    '<p>So the game measures one thing only: how often the interrogator gets it right.</p>';
  $('#turing').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TURING, cls: 'im-frame', clue: { id: 'turing', title: 'Turing, 1950: the imitation game', kind: 'Framed on the wall' }, done: function () {
      IM.terms(['imitation game', 'interrogator', 'hidden player']);
      if (tell('turing')) { paint(); ER.say('&ldquo;How often the interrogator gets it right,&rdquo; says Hazel. &ldquo;Not how clever the machine is. The judge is what&rsquo;s being measured.&rdquo;'); }
    } });
  });

  function roundHtml() {
    var s = '<h4>Round sheet &middot; who sat where</h4><p class="small">For Mrs Gately and the scorer only. The judges see only LEFT and RIGHT.</p>' +
      '<div class="key"><span><b>Booth 1</b> Norman Albery (a person)</span><span><b>Booth 2</b> Jiwoo Han (a person)</span><span><b>Booth 3</b> MADDIE (a program)</span><span><b>Booth 4</b> ELIZA (a program)</span></div>' +
      '<table><tr><th>Judge</th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th></tr>';
    CONV.forEach(function (j, i) { s += '<tr><td>' + (i + 1) + ' &middot; ' + JUDGES[i][0].split(' ').pop() + '</td>' + j.map(function (c) { return '<td>L ' + c[0] + ' &middot; R ' + c[1] + '</td>'; }).join('') + '</tr>'; });
    return s + '</table><p class="small">Every conversation puts one person against one program, for five minutes. The judge marks which side is the person. If a judge changes a mark, the last mark counts.</p>';
  }
  $('#round').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: roundHtml(), cls: 'im-sheet', clue: { id: 'round', title: 'The round sheet: who sat where', kind: 'Mrs Gately&rsquo;s clipboard' }, done: function () {
      if (tell('round')) { paint(); ER.say('L 3 &middot; R 1: on that judge&rsquo;s screen, MADDIE was on the left and Norman on the right.'); }
    } });
  });
  function mark(c) { return c[2] === 'X' ? '<s>RIGHT</s> LEFT' : (c[2] === 'L' ? 'LEFT' : 'RIGHT'); }
  function slipsHtml() {
    var s = '<h4>THE JUDGES&rsquo; SLIPS &middot; WHICH SIDE IS THE PERSON?</h4><div class="cards">';
    CONV.forEach(function (j, i) {
      s += '<div class="card"><h5>Judge ' + (i + 1) + '<small>' + JUDGES[i][0] + ', ' + JUDGES[i][1] + '</small></h5>';
      j.forEach(function (c, k) { s += '<div class="sl"><b>' + ORD[k] + ' &middot; ' + mark(c) + '</b> &middot; ' + c[3] + '<span class="hand">' + c[4] + '</span></div>'; });
      s += '</div>';
    });
    return s + '</div>';
  }
  $('#slips').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: slipsHtml(), cls: 'im-slips', clue: { id: 'slips', title: 'The judges&rsquo; slips', kind: 'From the ballot box' }, done: function () {
      if (tell('slips')) { paint(); ER.say('Twenty slips, twenty reasons. Hazel reads them over your shoulder and says nothing at all, which is worse.'); }
    } });
  });
  var TIPS = '<h4>Tips for judges</h4><p>Read out at the briefing, 10.30 a.m.</p><p>1. Machines are fast. A player who answers instantly is probably a machine.<br>2. Machines never make spelling mistakes. Watch for perfect grammar.<br>3. Machines have no feelings. Ask how they feel.<br>4. Trust your instinct!</p><p class="hand">Printed by: Haverleigh College &middot; Print Room</p>';
  $('#tips').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TIPS, cls: 'im-card', clue: { id: 'tips', title: 'Tips for judges', kind: 'On Judge 1&rsquo;s desk' }, done: function () {
      ER.say('&ldquo;Printed at the college,&rdquo; says Hazel. &ldquo;Same college as MADDIE&rsquo;s team. Interesting.&rdquo;');
    } });
  });
  IM.thing('#books', null, 'Rule books, drying on the radiator. Mrs Gately knocked the water jug over them at the half-past-ten briefing, in front of everybody.', isBusy);
  IM.thing('#switch', 'switchboard', 'Thousands of brass holes. Hazel could once connect a call to any of them with her eyes shut.', isBusy);
  $('#clock').addEventListener('click', function () {
    if (busy) return;
    var L = ['Ten past four. The prizes are at six.', 'The clock was put up in 1931. It has lost about a minute a week ever since, and Hazel has put it right every Monday.'];
    ER.say(L[clockN++ % L.length]);
  });
  ER.$$('#desks > g').forEach(function (g, i) {
    g.addEventListener('click', function () {
      if (busy || i === 2 || i === 4) return;
      var L = ['Judge 1&rsquo;s screen still shows her last conversation. On the right: &ldquo;idk the park? wbu&rdquo;.', 'Judge 2&rsquo;s screen: &ldquo;WHAT DOES THAT SUGGEST TO YOU?&rdquo;, in capitals.', '', 'Judge 4&rsquo;s screen is switched off. Dr Quarrie had a surgery to get back to.', ''];
      ER.say(L[i]);
    });
  });
  $('#board').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Under the board, the recount: 4, 5, 0, 4.'); return; }
    if (!told.hazel) { ER.say('The results board. Hazel wants a word first.'); return; }
    if (!told.gately) { ER.say('&ldquo;Don&rsquo;t touch my board,&rdquo; calls Mrs Gately. &ldquo;Come and talk to me first.&rdquo;'); return; }
    if (!told.turing) { ER.say('&ldquo;Read Turing first,&rdquo; says Hazel. &ldquo;Then you&rsquo;ll know what to count.&rdquo;'); return; }
    if (!told.round) { ER.say('You need the round sheet: which booth sat on which side.'); return; }
    if (!told.slips) { ER.say('And the slips themselves, from the ballot box.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: the recount ---------- */
  function makeLock() {
    var st = ER.flag('a-st') || {}, done = false, tab = 0;
    var html = '<div class="rb-in"><div class="rb-board"><h5>RECOUNT &middot; DID THE JUDGE PICK THE PERSON?</h5><p class="sub">✓ = picked the person &middot; ✗ = picked the program &middot; click a tile to change it</p><div class="rb-grid"><span></span>';
    var i, j;
    for (j = 0; j < 5; j++) html += '<span class="hd">JUDGE ' + (j + 1) + '<br>' + JUDGES[j][0].split(' ').pop().toUpperCase() + '</span>';
    ROWS.forEach(function (r, ri) {
      html += '<span class="rl">Booth ' + r[1] + ' v Booth ' + r[2] + '<small>' + BOOTH[r[1]] + ' v ' + BOOTH[r[2]] + '</small></span>';
      for (j = 0; j < 5; j++) html += '<button type="button" class="t" data-r="' + ri + '" data-c="' + j + '"></button>';
    });
    html += '<span class="tot" id="rb-tot"></span></div></div><div class="rb-desk"><div class="rb-tabs">';
    for (j = 0; j < 5; j++) html += '<button type="button" data-j="' + j + '">Judge ' + (j + 1) + '</button>';
    html += '</div><div class="rb-j" id="rb-j"></div><div class="rb-key">Booth 1 Norman (person) &middot; Booth 2 Jiwoo (person)<br>Booth 3 MADDIE (program) &middot; Booth 4 ELIZA (program)<br>If a judge changes a mark, the last mark counts.</div></div></div>';
    return IM.lock('rb', html, function (box, msg) {
      var go = box.querySelector('.pz-go'); go.textContent = 'Count again';
      function cell(r, c) { return (st[r] || '.....').charAt(c); }
      function setCell(r, c, v) { var s = (st[r] || '.....').split(''); s[c] = v; st[r] = s.join(''); ER.flag('a-st', st); }
      function paintB() {
        ER.$$('.t', box).forEach(function (b) {
          var v = cell(+b.getAttribute('data-r'), +b.getAttribute('data-c'));
          b.className = 't' + (v === '1' ? ' y' : v === '0' ? ' n' : ''); b.textContent = v === '1' ? '✓' : v === '0' ? '✗' : '';
        });
      }
      function showJ(k) {
        tab = k;
        ER.$$('.rb-tabs button', box).forEach(function (b, n) { b.classList.toggle('on', n === k); });
        var s = '<h6>Judge ' + (k + 1) + ' &middot; ' + JUDGES[k][0] + ' <small>' + JUDGES[k][1] + '</small></h6>';
        CONV[k].forEach(function (c, n) {
          s += '<div class="rb-c"><i>' + ORD[n] + '</i><span class="seat">LEFT: booth ' + c[0] + '<br>RIGHT: booth ' + c[1] + '</span><span><b>' + mark(c) + '</b> is the person &middot; ' + c[3] + '<span class="hand">' + c[4] + '</span></span></div>';
        });
        box.querySelector('#rb-j').innerHTML = s;
      }
      ER.$$('.rb-tabs button', box).forEach(function (b) { b.addEventListener('click', function () { IM.sfx.tap(); showJ(+b.getAttribute('data-j')); }); });
      ER.$$('.t', box).forEach(function (b) {
        b.addEventListener('click', function () {
          if (done) return;
          var r = +b.getAttribute('data-r'), c = +b.getAttribute('data-c'), v = cell(r, c);
          setCell(r, c, v === '.' ? '1' : v === '1' ? '0' : '.'); IM.sfx.flap(); paintB();
        });
      });
      go.addEventListener('click', function () {
        if (done) return;
        var rows = [0, 1, 2, 3].map(function (r) { return st[r] || '.....'; }), bad = [], k;
        if (rows.join('').indexOf('.') >= 0) { ER.sfx.no(); msg('Twenty tiles: every judge, every pair of booths. Each judge met each pair once.'); return; }
        if (!ER.check('j3', rows[0].charAt(2))) { ER.sfx.no(); msg('&ldquo;Judge 3, the third conversation,&rdquo; says Hazel. &ldquo;She crossed out RIGHT and wrote LEFT. The round sheet says the last mark counts. Which booth was on her left?&rdquo;'); return; }
        for (k = 0; k < 4; k++) if (!ER.check('r' + 'ABCD'.charAt(k), rows[k])) bad.push(k);
        if (bad.length) {
          ER.sfx.no();
          msg('&ldquo;' + (bad.length === 1 ? 'One row' : bad.length + ' rows') + ' still disagree with the slips,&rdquo; says Hazel. &ldquo;Start with <b>Booth ' + ROWS[bad[0]][1] + ' v Booth ' + ROWS[bad[0]][2] + '</b>. For each judge: which side did they mark, and who was sitting there?&rdquo;');
          return;
        }
        var file = ER.exit([rows.join('-')], { wait: true });
        if (!file) { msg('The board sticks. Something is wrong with this page: tell your teacher.'); return; }
        done = true; nextFile = file; ER.flag('a-file', file);
        box.querySelector('#rb-tot').textContent = 'RIGHT: 4 of 5 · 5 of 5 · 0 of 5 · 4 of 5';
        IM.terms(['right identification']);
        IM.mine('recount', 'The recount', '<p>How often the judges picked the person:</p><p>Norman v MADDIE: 4 of 5<br>Norman v ELIZA: 5 of 5<br>Jiwoo v MADDIE: 0 of 5<br>Jiwoo v ELIZA: 4 of 5</p><p>Guessing would be right about half the time. Nought out of five is not guessing. The judges were all following the same wrong rule.</p>', true);
        msg('The board clatters. Jiwoo against MADDIE: <b>nought out of five</b>.');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            'Hazel looks at the bottom row for a long time. &ldquo;Norman against MADDIE, four out of five right. Fair enough: MADDIE fooled one judge. But Jiwoo against MADDIE: nought. Not one judge in five picked the girl.&rdquo;',
            '&ldquo;Think about what that means. If MADDIE were just as human as Jiwoo, the judges couldn&rsquo;t tell them apart. They&rsquo;d be tossing a coin, and a coin is right about half the time. Two or three out of five.&rdquo;',
            '&ldquo;Nought isn&rsquo;t tossing a coin. Nought is five people all following the same rule, and the rule pointing the wrong way every time.&rdquo; She taps the slips. &ldquo;Typos. Slowness. Says she&rsquo;s thirteen. They told us their rule. They wrote it down.&rdquo;',
            '&ldquo;The conversations were printed in the booth corridor. Let&rsquo;s go and read what the judges should have read.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 2400);
      });
      paintB(); showJ(0);
      msg('For each judge and each pair of booths: did the judge pick the person? The desk on the right has each judge&rsquo;s seats and slip.');
    });
  }
})();
</script>
</body>
</html>
