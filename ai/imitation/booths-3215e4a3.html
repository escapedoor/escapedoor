      'The hidden players came in by the back door this morning and never saw a judge all day. They sat in these booths, behind these curtains, and typed. The two programs had booths too, so that every screen looked the same: booth 3 has a cable instead of a person, and so does booth 4.',
      'Booth 1 still has its person in it. Norman Albery is finishing a bag of mints and does not seem to be in any hurry.',
      'On the trolley by the far wall, the old printer has printed every conversation booth 2 had with booth 3: Jiwoo against MADDIE, five times. It ate one of them. Four are left.'
    ], function () { busy = false; });
  }

  $('#norman').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;You tell that girl from me,&rdquo; says Norman, &ldquo;she&rsquo;s more human than half the people on the 42 bus.&rdquo;'); return; }
    ER.talk({
      who: 'Norman Albery', role: 'Hidden player, booth 1', face: IM.face('norman', 'smile'),
      lines: [
        { note: 'Norman Albery is seventy-one. He drove the 42 bus from Haverleigh to Fenby for thirty years and he types with two fingers.', a: '&ldquo;Nine out of ten! I&rsquo;ve been human for seventy-one years and one of them still voted for the machine. Mrs Rennick, I bet. She thought I was a program pretending to be grumpy. I&rsquo;m not pretending, love. This is just my face.&rdquo;' },
        { q: 'Did you make a lot of typos?', a: '&ldquo;Typos? I made nothing but. Two fingers, and one of them&rsquo;s not much good. The judges loved it. Every mistake I made, they wrote down &lsquo;a person&rsquo;. Funny old rule, when you think about it.&rdquo;' },
        { q: 'Did anything happen during the game?', a: '&ldquo;That fire alarm made me jump out of my skin. Half past two, regular as anything, every Saturday, and it gets me every time. And the church clock at three, through the wall. You can hear St Ebba&rsquo;s from every booth on this side.&rdquo;' },
        { a: '&ldquo;The girl next door was shivering all afternoon. Her heater&rsquo;s broken. Mrs Gately said sorry about it on the loudspeaker just before we started, which was nice of her, but it didn&rsquo;t make it any warmer. She typed like a machine-gun, that girl. Very fast. Very correct.&rdquo;' }
      ],
      clue: { id: 'norman', title: 'Norman: typos, the alarm, the clock', kind: 'What he said' },
      done: function (seen) { if (seen && tell('norman')) { paint(); ER.say('&ldquo;Every mistake I made, they wrote down a person,&rdquo; says Hazel. &ldquo;Hold on to that.&rdquo;'); } }
    });
  });
  var TEX = '<div class="hd">From the same paper, 1950</div><h4>Turing&rsquo;s own example</h4>' +
    '<p>To show how his game might go, Turing wrote out some questions and the answers a machine might give:</p>' +
    '<div class="qa">Q: Please write me a sonnet on the subject of the Forth Bridge.<br>A: Count me out on this one. I never could write poetry.<br>Q: Add 34957 to 70764.<br>A: (Pause about 30 seconds and then give as answer) 105621.</div>' +
    '<p>Later he answers people who say that a machine would give itself away by being too good at sums: <q>The machine (programmed for playing the game) would not attempt to give the right answers to the arithmetic problems. It would deliberately introduce mistakes in a manner calculated to confuse the interrogator.</q></p>' +
    '<p class="pencil">Check his sum. &mdash; H.F.</p>';
  $('#tex').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: TEX, cls: 'im-frame', clue: { id: 'tex', title: 'Turing&rsquo;s own example', kind: 'Framed in the corridor' }, done: function () {
      if (tell('tex')) { paint(); ER.say('34957 + 70764 is 105721. Turing&rsquo;s machine is a hundred out, after half a minute of pretending to think. In 1950.'); }
    } });
  });
  var CARD = '<h4>What a typed answer can prove</h4><p>A program can do anything a keyboard can do. So these prove nothing: a typo; slow typing; a wrong sum; short or shy answers; &ldquo;idk&rdquo;; a question thrown back at you; a sudden change of subject; anything a player says about themselves (age, family, dog, mood). Fast, correct answers prove nothing either: some people are quick.</p>' +
    '<p>Two kinds of answer are worth more. First, <b>the here and now</b>: something happening in this building at this moment that you can check for yourself, such as a bell, an alarm or the weather. Second, <b>a story that holds together</b>. Real people remember what they said a minute ago. One claim proves nothing. Two claims that cannot both be true are worth a great deal.</p>' +
    '<p>Every hidden person has been asked to tell the truth.</p><p class="hand">Notes for judges, H. Fothergill, August. Not used.</p>';
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'im-card', clue: { id: 'card', title: 'What a typed answer can prove', kind: 'Hazel&rsquo;s card' }, done: function () {
      IM.terms(['transcript', 'contradiction', 'the here and now']);
      if (tell('card')) { paint(); ER.say('&ldquo;I wrote that in August,&rdquo; says Hazel. &ldquo;Bernadette preferred her own tips.&rdquo;'); }
    } });
  });
  var ALARM = '<h4>Fire alarm test</h4><p>Every Saturday at about 2.30 p.m. the fire alarm is tested. It rings for about thirty seconds. <b>Do not leave the building.</b></p><p>Today&rsquo;s test, from the panel by the back door:</p><p class="log">SAT 24 OCT &middot; ZONE 2 &middot; BELLS ON&nbsp; 14:31:02<br>SAT 24 OCT &middot; ZONE 2 &middot; BELLS OFF 14:31:31</p><p>Zone 2: booth corridor, Switch Room, Exchange Hall.</p>';
  $('#alarm').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: ALARM, cls: 'im-notice', clue: { id: 'alarm', title: 'Fire alarm test, and today&rsquo;s log', kind: 'On the noticeboard' }, done: function () {
      IM.terms(['time stamp']);
      if (tell('alarm')) { paint(); ER.say('From 14:31:02 to 14:31:31, every booth and the Switch Room heard the same bell.'); }
    } });
  });
  $('#window').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'church clock');
    if (tell('window')) paint();
    setTimeout(function () { ER.say('Through booth 2&rsquo;s window: the tower of St Ebba&rsquo;s. Its clock strikes every hour, and once at every half hour. From inside booth 3 you can see the wall.'); }, 300);
  });
  IM.thing('#heater', 'heater', 'OUT OF ORDER. Sorry! B.G. Booth 2 has been cold since September.', isBusy);
  IM.thing('#b3', null, 'Booth 3: an empty chair, a screen, and a blue cable through the wall to the Battery Room, where MADDIE runs. MADDIE heard nothing all afternoon. It has no ears.', isBusy);
  IM.thing('#b4', null, 'Booth 4: a yellow cable to the Teletype Gallery, where ELIZA lives. Hazel connects her every year.', isBusy);
  $('#hazel').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Every one of them had something better than a typo,&rdquo; says Hazel.' : '&ldquo;Read everything on the board,&rdquo; says Hazel. &ldquo;Then the print-outs. Don&rsquo;t believe the judges. Believe the clock.&rdquo;');
  });
  $('#printer').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The printer has stopped. Four print-outs are pinned on the noticeboard, each with a red circle.'); return; }
    if (!ready()) { ER.say('The print-outs. Look round the corridor first: Norman, the noticeboard, the framed page, booth 2&rsquo;s window.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: four print-outs, one circle each ---------- */
  function makeLock() {
    var st = ER.flag('b-st') || {}, done = false, cur = 0;
    var html = '<div class="po-in"><div class="po-tabs">' + PO.map(function (p, i) { return '<button type="button" data-p="' + i + '">' + p.t + '<small>' + p.r + '</small></button>'; }).join('') + '</div><div class="po-sheet" id="po-sheet"></div></div>';
    return IM.lock('po', html, function (box, msg) {
      var go = box.querySelector('.pz-go'); go.textContent = 'Pin them up';
      function tabs() { ER.$$('.po-tabs button', box).forEach(function (b, i) { b.classList.toggle('on', i === cur); b.classList.toggle('set', !!st[i]); }); }
      function show(i) {
        cur = i; tabs();
        var p = PO[i], s = '<h5>Judge&rsquo;s screen &middot; ' + p.t + ' &middot; ' + p.r + '</h5>';
        p.l.forEach(function (l, n) {
          var k = n + 1;
          s += '<div class="po-l' + (l[0] === 'J' ? ' j' : ' p') + (st[i] === k ? ' on' : '') + '" data-k="' + k + '"><i>' + l[1] + '</i><b>' + (l[0] === 'J' ? 'JUDGE' : l[0] === 'L' ? 'LEFT' : 'RIGHT') + '</b><span>' + l[2] + '</span></div>';
        });
        s += '<div class="po-foot">Round sheet: ' + p.seats + ' (booth 2 is Jiwoo, booth 3 is MADDIE)<br>The judge&rsquo;s slip: <b>' + p.slip + '</b> <span class="hand">' + p.why + '</span></div>';
        var sh = box.querySelector('#po-sheet'); sh.innerHTML = s; sh.scrollTop = 0;
        ER.$$('.po-l.p', sh).forEach(function (d) {
          d.addEventListener('click', function () {
            if (done) return;
            var k = +d.getAttribute('data-k');
            st[cur] = st[cur] === k ? 0 : k; ER.flag('b-st', st); IM.sfx.pin(); show(cur);
          });
        });
      }
      ER.$$('.po-tabs button', box).forEach(function (b) { b.addEventListener('click', function () { IM.sfx.tap(); show(+b.getAttribute('data-p')); }); });
      go.addEventListener('click', function () {
        if (done) return;
        var i, miss = -1, wrong = -1;
        for (i = 0; i < 4; i++) if (!st[i]) { miss = i; break; }
        if (miss >= 0) { ER.sfx.no(); show(miss); msg('Circle one line on every print-out: the line that settles which side is the person. This one has no circle yet.'); return; }
        for (i = 0; i < 4; i++) if (!ER.check('p' + (i + 1), String(st[i]))) { wrong = i; break; }
        if (wrong >= 0) {
          ER.sfx.no(); show(wrong);
          msg('<b>' + PO[wrong].t + '</b>: &ldquo;' + WHY[PO[wrong].l[st[wrong] - 1][3]] + '&rdquo; says Hazel.');
          return;
        }
        var file = ER.exit([[1, 2, 3, 4].map(function (n) { return st[n - 1]; }).join('-')], { wait: true });
        if (!file) { msg('The drawing pin bends. Something is wrong with this page: tell your teacher.'); return; }
        done = true; nextFile = file; ER.flag('b-file', file);
        IM.mine('circles', 'Four red circles', '<p>Judge 3: MADDIE said pizza at 13:40, then &ldquo;just a sandwich&rdquo;. Two claims that cannot both be true.</p><p>Judge 4: MADDIE said 13, then born 3 January 2010. On 24 October 2026 that makes 16.</p><p>Judge 1: Jiwoo wrote about the fire alarm at 14:31:10. The bells rang 14:31:02 to 14:31:31.</p><p>Judge 5: Jiwoo heard St Ebba&rsquo;s strike three. MADDIE heard &ldquo;my music&rdquo;.</p><p>The judges went by typos, slowness and &ldquo;I&rsquo;m 13&rdquo;. Those prove nothing.</p>', true);
        msg('Four print-outs, four red circles. <b>Every one of them was there to be read.</b>');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            'Hazel pins the four print-outs to the noticeboard, side by side. &ldquo;Pizza, then a sandwich. Thirteen, then born in 2010. A fire alarm that MADDIE never heard, and a church clock it never heard either. Every judge had something better than a typo. Every judge went by the typo.&rdquo;',
            '&ldquo;And the girl told them the time, the alarm, her lunch twice over, all true, and they called her a machine for it. Because she typed fast and spelt properly.&rdquo; Hazel is quiet for a moment. &ldquo;Turing saw that coming too. Truthful answers don&rsquo;t help you, if anybody can say the same.&rdquo;',
            'She taps Judge 1&rsquo;s print-out. &ldquo;Look at MADDIE&rsquo;s sum. 105621. That&rsquo;s Turing&rsquo;s own wrong answer, digit for digit, out of a paper from 1950. That program has read Turing. Or read everything, and Turing was in it.&rdquo;',
            '&ldquo;And look how often it says &lsquo;wbu?&rsquo; and &lsquo;do u have pets?&rsquo;. Turn the question round, give it back. I know that trick. I have it in a glass case. Come and meet her.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 2400);
      });
      show(0);
      msg('Circle the line on each print-out that settles which side is the person, the line the judge should have trusted.');
    });
  }
})();
</script>
</body>
</html>
