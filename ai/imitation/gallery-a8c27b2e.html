  var LABEL = '<div class="hd">Joseph Weizenbaum &middot; Massachusetts Institute of Technology &middot; 1966</div><h4>ELIZA</h4>' +

    '<p>People trusted it anyway. Weizenbaum&rsquo;s secretary, who had watched him write it, asked him to leave the room so that she could talk to it in private. This is now called the <b>ELIZA effect</b>: we read understanding into a machine that gives our words back to us.</p>' +
    '<p>Weizenbaum was alarmed. In 1976 he wrote:</p><p class="q">What I had not realized is that extremely short exposures to a relatively simple computer program could induce powerful delusional thinking in quite normal people.</p>';

      '<tr><td>ALWAYS</td><td>1</td><td>CAN YOU THINK OF A SPECIFIC EXAMPLE?</td></tr>' +
      '<tr><td>no keyword at all</td><td>&ndash;</td><td>the next of these, in turn:<br>PLEASE GO ON. &middot; I SEE. &middot; WHAT DOES THAT SUGGEST TO YOU?</td></tr></table>' +
      '<p><b>2. Fill the blank</b> (___) with the words that come after the keyword in the sentence, and <b>swap</b> them: I &rarr; YOU &middot; ME &rarr; YOU &middot; MY &rarr; YOUR &middot; AM &rarr; ARE &middot; YOU &rarr; I or ME &middot; YOUR &rarr; MY.</p>' +
      '<p>Example: <i>I am sad.</i> &rarr; HOW LONG HAVE YOU BEEN SAD?</p>';
  }
  $('#script').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: scriptHtml(), cls: 'im-script', clue: { id: 'script', title: 'ELIZA&rsquo;s rules', kind: 'Propped by the case' }, done: function () {
      IM.terms(['pronoun']);
      if (tell('script')) { paint(); ER.say('&ldquo;The real script was longer,&rdquo; says Hazel, &ldquo;but not much cleverer. That card is the whole trick.&rdquo;'); }
    } });
  });
  IM.thing('#poster', null, 'ELIZA was named after Eliza Doolittle, the flower seller in Bernard Shaw&rsquo;s play Pygmalion (1913), who is taught to speak like a lady. Everybody decides she has changed. Shaw was not so sure.', isBusy);
  IM.thing('#cards', 'punched card', 'Before keyboards, programs went into computers on cards like these, one line per card, with holes punched in them.', isBusy);
  IM.thing('#valve', 'valve', 'A valve from an early computer. It got very hot, and glowed. Early computers had thousands of them.', isBusy);
  $('#hazel').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Sixty years,&rdquo; says Hazel, &ldquo;and the same trick in new trainers. Let&rsquo;s go and meet the trainers.&rdquo;' : '&ldquo;She came last eleven years running,&rdquo; says Hazel, nodding at the case. &ldquo;She doesn&rsquo;t mind. She doesn&rsquo;t mind anything.&rdquo;');
  });
  $('#case').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The roll, with every faint line written in, in your hand, in red.'); return; }
    if (!told.sowden) { ER.say('The teleprinter. Mr Sowden is standing by it, and looks as if he wants to talk.'); return; }
    if (!told.label) { ER.say('&ldquo;Read her label first,&rdquo; says Hazel. &ldquo;It&rsquo;s what the museum is for.&rdquo;'); return; }
    if (!told.script) { ER.say('You will need ELIZA&rsquo;s rules: the card propped against the case.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: the faint lines ---------- */
  function tplOf(id) { for (var i = 0; i < TPL.length; i++) if (TPL[i][0] === id) return TPL[i]; return null; }
  function words(s) { return s.toLowerCase().replace(/[.,?!]/g, '').split(' '); }
  function after(line, kw) {
    var w = words(line), k = kw.split(' '), i, j;
    for (i = 0; i + k.length <= w.length; i++) { for (j = 0; j < k.length && w[i + j] === k[j]; j++) {} if (j === k.length) return w.slice(i + k.length); }
    return null;
  }
  function has(line, kws) { for (var i = 0; i < kws.length; i++) if (after(line, kws[i])) return true; return false; }
  function topRank(line) { var r = 0; TPL.forEach(function (t) { if (t[1] && has(line, t[1]) && t[2] > r) r = t[2]; }); return r; }
  function makeLock() {
    var st = ER.flag('c-st') || {}, done = false, cur = 'A';
    var html = '<div class="tt-in"><div class="tt-roll" id="tt-roll"></div><div class="tt-case"><h5>The type case</h5><p class="now" id="tt-now"></p><div class="tt-tpl">' +
      TPL.map(function (t) { return '<button type="button" data-t="' + t[0] + '"><small>' + t[5] + '</small>' + t[3] + (t[4] ? ' ___' + (t[0] === 'my' ? '?' : '?') : '') + '</button>'; }).join('') +
      '</div><div class="tt-tray" id="tt-tray"></div></div></div>';
    return IM.lock('tt', html, function (box, msg) {
      var go = box.querySelector('.pz-go'); go.textContent = 'Run the roll';
      function g(k) { return st[k] || { t: '', w: null }; }
      function text(k) {
        var o = g(k), t = tplOf(o.t); if (!t) return '';
        if (!t[4]) return t[3];
        return t[3] + ' ' + (o.w || []).join(' ').toUpperCase() + '?';
      }
      function code(k) { var o = g(k), t = tplOf(o.t); if (!t) return ''; return t[4] ? t[0] + ':' + (o.w || []).join(' ') : t[0]; }
      function paintRoll() {
        var s = '';
        ROLL.forEach(function (r) {
          if (r[0] === 'g') s += '<span class="gap' + (r[1] === cur ? ' on' : '') + '" data-g="' + r[1] + '">' + (text(r[1]) || '&nbsp;') + '</span>';
          else s += '<div class="ln ' + r[0] + '">' + (r[0] === 'e' ? '' : r[0] === 'h' ? 'HAZEL&gt; ' : 'JUDGE&gt; ') + r[1] + '</div>';
        });
        var roll = box.querySelector('#tt-roll'), top = roll.scrollTop; roll.innerHTML = s; roll.scrollTop = top;
        ER.$$('.gap', roll).forEach(function (n) { n.addEventListener('click', function () { if (done) return; cur = n.getAttribute('data-g'); IM.sfx.tap(); paintAll(); }); });
      }
      function paintCase() {
        var o = g(cur), t = tplOf(o.t);
        box.querySelector('#tt-now').innerHTML = 'Line ' + cur + ' answers: <b>' + LINE[cur] + '</b>';
        ER.$$('.tt-tpl button', box).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === o.t); });
        var tray = box.querySelector('#tt-tray');
        if (!t || !t[4]) { tray.innerHTML = '<span class="empty">' + (t ? 'This reply has no blank.' : 'Choose the reply ELIZA would use for this line.') + '</span>'; return; }
        if (!o.w) { tray.innerHTML = '<span class="empty">There is no ' + t[5].replace(' ___', '') + ' in this line.</span>'; return; }
        tray.innerHTML = '<span class="w0">___ =</span>' + o.w.map(function (w, i) { return SWAP[o.base[i]] ? '<button type="button" data-i="' + i + '">' + w.toUpperCase() + '</button>' : '<span class="w0">' + w.toUpperCase() + '</span>'; }).join('');
        ER.$$('button', tray).forEach(function (b) {
          b.addEventListener('click', function () {
            if (done) return;
            var i = +b.getAttribute('data-i'), opts = SWAP[o.base[i]], n = opts.indexOf(o.w[i]);
            o.w[i] = opts[(n + 1) % opts.length]; st[cur] = o; ER.flag('c-st', st); IM.sfx.key(); paintAll();
          });
        });
      }
      function paintAll() { paintRoll(); paintCase(); }
      ER.$$('.tt-tpl button', box).forEach(function (b) {
        b.addEventListener('click', function () {
          if (done) return;
          var t = tplOf(b.getAttribute('data-t')), o = { t: t[0], w: null, base: null };
          if (t[4]) { var a = after(LINE[cur], t[1][0]); if (a) { o.w = a.slice(); o.base = a.slice(); } }
          st[cur] = o; ER.flag('c-st', st); IM.sfx.tty(4); paintAll();
        });
      });
      go.addEventListener('click', function () {
        if (done) return;
        var ks = ['A', 'B', 'C', 'D', 'E'], i, k, t, line, bad = null;
        for (i = 0; i < 5; i++) if (!g(ks[i]).t) { cur = ks[i]; paintAll(); ER.sfx.no(); msg('Line ' + ks[i] + ' is still faint. Fill every gap, A to E.'); return; }
        for (i = 0; i < 5; i++) if (!ER.check('g' + ks[i], code(ks[i]))) { bad = ks[i]; break; }
        if (bad) {
          cur = bad; paintAll(); ER.sfx.no(); IM.sfx.tty(3);
          k = g(bad); t = tplOf(k.t); line = LINE[bad];
          var m;
          if (t[1] && !has(line, t[1])) m = 'That reply needs ' + t[5].replace(' ___', '').replace(' (1st time)', '').replace(' (next time)', '') + ', and there is none in that line.';
          else if (t[1] && t[2] < topRank(line)) m = 'That line has a keyword with a higher rank. Look at the numbers on the card.';
          else if (!t[1] && topRank(line)) m = 'That line has a keyword in it. Stock replies are only for lines with none.';
          else if (!t[1]) m = 'Stock replies come in turn. Which ones has ELIZA used already, higher up the roll?';
          else if (t[2] === 50) m = 'Has ELIZA printed that one before, on this roll?';
          else if (t[4]) m = 'Check the swaps. ELIZA changes I, ME, MY and YOU before she prints.';
          else m = 'That is not what ELIZA would print.';
          msg('Line ' + bad + ': ' + m);
          return;
        }
        var file = ER.exit([ks.map(code).join('|')], { wait: true });
        if (!file) { msg('The teleprinter jams. Something is wrong with this page: tell your teacher.'); return; }
        done = true; nextFile = file; ER.flag('c-file', file); IM.sfx.tty(14);
        IM.mine('roll', 'ELIZA&rsquo;s roll, worked out', '<p>A: sister (rank 3) beats my and I am (rank 2): TELL ME MORE ABOUT YOUR FAMILY.</p><p>B: I FEEL + swap ME to YOU: DO YOU OFTEN FEEL NOBODY LISTENS TO YOU ANY MORE?</p><p>C: YOU ARE + swap: WHAT MAKES YOU THINK I AM MUCH KINDER THAN YOU?</p><p>D: no keyword, second stock reply: I SEE.</p><p>E: machine (rank 50), and the first reply was used already: WHY DO YOU MENTION COMPUTERS?</p><p>No understanding anywhere. Just keywords, ranks and swaps.</p>', true);
        msg('Hazel types the line. The teleprinter thinks about it for exactly as long as it takes to hammer out <b>WHY DO YOU MENTION COMPUTERS?</b>');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            'Mr Sowden reads the roll from top to bottom with the faint lines filled in, and laughs, not very happily. &ldquo;Sister: rank three. So that is why she asked about my family. It wasn&rsquo;t interest. It was arithmetic.&rdquo;',
            '&ldquo;Weizenbaum&rsquo;s secretary and me,&rdquo; he says. &ldquo;She knew it was a program and still wanted to be alone with it. I knew one of them was a program and still picked the one that gave my own words back to me.&rdquo;',
            'Hazel takes off her glasses. &ldquo;Now think about MADDIE. &lsquo;wbu?&rsquo; is PLEASE GO ON in trainers. &lsquo;do u have pets?&rsquo; is a stock reply with a puppy on it. Nobody in 2026 copied ELIZA on purpose. So how did a brand-new program end up doing a trick from 1966?&rdquo;',
            '&ldquo;Its builders are in the Battery Room, packing up. Let&rsquo;s ask them how they taught it to be judged human.&rdquo;'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 2600);
      });
      paintAll();
      msg('Choose a faint line on the roll, then the reply ELIZA would print for it. Line E is the one Hazel is about to type.');
    });
  }
})();
</script>
