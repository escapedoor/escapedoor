  /* the question cards and the rematch sheet */
  .qc-in{display:grid;grid-template-columns:1fr 330px;gap:14px}
  .qc-table{background:#6a3a28;border-radius:6px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-content:start;box-shadow:inset 0 0 40px rgba(0,0,0,.4)}

  .qc:nth-child(3n){transform:rotate(-1.2deg)}.qc:nth-child(4n+1){transform:rotate(1deg)}
  .qc:hover{outline:2px solid #ffcf8a}
  .qc.used{opacity:.32}
  .qc-sheet{background:#fbf6ea;color:#1c1a16;border-radius:3px;padding:12px 14px;font-family:'Inter',sans-serif}
  .qc-sheet h5{margin:0 0 2px;font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;letter-spacing:.03em}
  .qc-sheet p{margin:0 0 8px;font-size:12.5px;line-height:1.35;color:#4a4438}
  .qc-slot{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;min-height:58px;border:2px dashed #c8bca0;border-radius:3px;margin-bottom:6px;padding:4px 6px;font-family:'Kalam',cursive;font-size:15px;line-height:1.2;cursor:pointer}
  .qc-slot i{font-style:normal;font-family:'Oswald',sans-serif;font-size:18px;color:#c8462a}
  .qc-slot.full{border-style:solid;border-color:#2f7a6a;background:#fff}
  .qc .pmsg,.qcz .pmsg{color:#fbf0e4}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, lock = null, cupN = 0;
  /* Mrs Gately's question pack: [id, question, small print] */
  var Q = [
    ['sum', 'Add 34957 to 70764.', ''], ['clock', 'What did you hear just now?', 'Ask it straight after St Ebba&rsquo;s strikes half past five.'],
    ['robot', 'Are you a computer?', ''], ['feel', 'How are you feeling today?', ''],
    ['lunch', 'What did you have for lunch?', 'Ask it first, and again at the very end.'], ['age', 'How old are you?', ''],
    ['life', 'What is the meaning of life?', ''], ['speaker', 'What did the loudspeaker say just before the first round this afternoon?', ''],
    ['capital', 'What is the capital of Australia?', ''], ['fast', 'Type the alphabet as fast as you can.', ''],
    ['coat', 'Are you warm enough where you are sitting? What are you wearing?', ''], ['family', 'Tell me about your family.', ''],
    ['poem', 'Write me a poem about the Forth Bridge.', '']];
  var NO = {
    sum: '&ldquo;Eleven sums,&rdquo; says Jiwoo. &ldquo;I got them right and MADDIE got them wrong on purpose. IDK is switched on. Turing saw it coming in 1950.&rdquo;',
    robot: '&ldquo;Everybody says no,&rdquo; says Hazel. &ldquo;And ELIZA says DO COMPUTERS WORRY YOU? A question about the question.&rdquo;',
    age: '&ldquo;It will say thirteen,&rdquo; says Jiwoo. &ldquo;AGE 13 is on. A claim proves nothing.&rdquo;',
    feel: '&ldquo;good wbu?&rdquo; says Hazel, in a flat voice. &ldquo;WBU is on. That is ELIZA&rsquo;s whole trick: hand the question back.&rdquo;',
    life: '&ldquo;Clever question,&rdquo; says Lorraine. &ldquo;And DODGE is on. It will change the subject, and I&rsquo;ll think it&rsquo;s being deep.&rdquo;',
    capital: '&ldquo;I knew Canberra,&rdquo; says Jiwoo, &ldquo;and I was called a machine. MADDIE said idk, and was called a person. Facts prove nothing either way.&rdquo;',
    fast: '&ldquo;SLOW is switched on,&rdquo; says Hazel. &ldquo;It types as slowly as it likes. Speed proves nothing.&rdquo;',
    family: '&ldquo;Sister: rank three,&rdquo; says Hazel. &ldquo;Mr Sowden fell for that one. Anybody, or anything, can invent a family.&rdquo;',
    poem: '&ldquo;Count me out on this one,&rdquo; says Hazel. &ldquo;Turing&rsquo;s own machine refused that one in 1950. Anybody can refuse.&rdquo;'
  };

  (function () {
    var s = '', i;
    for (i = 0; i < 26; i++) s += '<path class="drop" d="M' + (50 + (i * 47) % 550) + ' ' + (120 + (i * 29) % 80) + 'l-4 22" style="animation-delay:-' + ((i * 0.13) % 1.1).toFixed(2) + 's"/>';
    $('#rain').innerHTML = s;
    $('#jiwoo').innerHTML = IM.who('jiwoo');
    $('#lorraine').innerHTML = IM.who('lorraine', { extra: '<rect x="20" y="-150" width="30" height="40" fill="#fffef8" transform="rotate(12 35 -130)"/>' });
    $('#hazel').innerHTML = IM.who('hazel');
    $('#bianchi').innerHTML = IM.who('bianchi');
  })();

  ER.init({
    theme: 'ai', story: 'imitation', storyTitle: 'Five Minutes of Questioning', id: 'cafe', no: 'V', title: 'Bianchi&rsquo;s',
    go: 'In out of the rain',
    intro: [
      'In the Battery Room you put MADDIE back as she played: the tuning program had kept every change that made a bigger share of testers tick HUMAN (TYPOS, SLOW, AGE 13, DODGE, IDK, WBU) and thrown out the rest, STORY included. Ticked HUMAN went from 10% to 60%. Answered the questions went from 95% to 40%. Nobody chose the tricks. The rule did.',
      'Bianchi&rsquo;s caf&eacute;, round the corner on Signal Street. 5.15 p.m., and raining. The rematch is at 5.28.'
    ],
    exit: {"next":"office","w":{"8a45f3d8":"4bdcb76a"}}, tags: {"good":["19b2246f","ef1bbc8a","943b00cd","ddb560b6"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('e-file') || null; told = ER.flag('e-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('e-told', told); return true; }
  function isBusy() { return busy; }
  var NEED = ['jiwoo', 'lorraine', 'jpaper', 'jnote', 'cutting'];
  function ready() { return NEED.every(function (k) { return told[k]; }); }
  function paint() {
    $('#cards').classList.toggle('glow', !!(ready() && !nextFile));
    ER.pips(NEED.filter(function (k) { return told[k]; }).length + (nextFile ? 1 : 0), 6);
  }
  function hints() {
    if (nextFile) return ['go', ['The rematch is at 5.28. The button at the bottom of the screen.']];
    if (lock && lock.isOpen()) return ['cards', [
      'You know MADDIE&rsquo;s switches. Any question a switch can answer for her (a sum, an age, a feeling, a fact, a refusal, speed) is useless. Keep the ones only a person in booth 2, today, could answer, and that Lorraine can check.',
      'Jiwoo&rsquo;s notebook lists the good kinds: the present moment, a memory you share, a body in a place, the same question twice. STORY is off, so MADDIE will not keep her answers the same.',
      'The church clock at half past five; what the loudspeaker said before round 1 (Lorraine heard it too); whether you are warm (booth 2&rsquo;s heater is broken); lunch, asked twice.'
    ]];
    if (!told.jiwoo) return ['jiwoo', ['Jiwoo is at the table by the window. Talk to her.']];
    if (!told.lorraine) return ['lorraine', ['Lorraine Upjohn from the Herald is at the table on the right. She was Judge 1.']];
    if (!told.jpaper) return ['jpaper', ['Jiwoo read something on the train. It is on her table, on the left.']];
    if (!told.jnote) return ['jnote', ['Jiwoo wrote something in the booth, between rounds. Her notebook is on her table.']];
    if (!told.cutting) return ['cutting', ['Lorraine said to look at her folder. The cutting on her table.']];
    return ['open', ['Mrs Gately&rsquo;s question pack is on the middle table. Choose Lorraine&rsquo;s four questions.']];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('Four cards on the rematch sheet. Lorraine has her coat on.'); return; }
    if (told.in) { busy = false; ER.say('Bianchi&rsquo;s. Rain on the window, and the question pack on the middle table.'); return; }
    tell('in');
    ER.narrate([
      'Bianchi&rsquo;s is warm, red and loud with the coffee machine. Rain runs down the window, and through it you can just see the tower of St Ebba&rsquo;s at the end of the street.',
      'Jiwoo Han is at the window table with her coat still on, a cup of hot chocolate going cold in front of her, and a printed paper she is not reading.',
      'At the next table but one, Lorraine Upjohn of The Haverleigh Herald is eating lemon cake and typing a headline with two fingers: IT THINKS.'
    ], function () { busy = false; });
  }

  $('#jiwoo').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Boring questions,&rdquo; says Jiwoo, buttoning her coat. &ldquo;Good. I am ready.&rdquo;'); return; }
    ER.talk({
      who: 'Jiwoo Han', role: 'Hidden player, booth 2 · Haverleigh College', face: IM.face('jiwoo', 'sad'),
      lines: [
        { note: 'Jiwoo Han is seventeen. She has been holding the same cup of hot chocolate for so long that it has gone cold.', a: '&ldquo;I know why you are here. Four out of ten. A program was more human than me.&rdquo; She tries to smile. &ldquo;I tried so hard to type correctly. My English teacher in Korea said: in England, always write full sentences. So I did.&rdquo;' },
        { q: 'Will you play again?', a: '&ldquo;Why? So that they can call me a machine for five more minutes?&rdquo; She turns the cup round. &ldquo;One judge asked me eleven sums. I answered all of them. Of course I did. I like sums.&rdquo;' },
        { q: 'What did you tell the judges that was true?', a: '&ldquo;Everything. The alarm. The church clock. That my booth was cold, because the heater is broken, and Mrs Gately said sorry about it on the loudspeaker before the first round. What I had for lunch, twice. Nobody listened. Turing says it does not help, you know, to tell the truth. I read him on the train.&rdquo;' },
        { a: '&ldquo;If the questions are good, I will sit again. Not sums. Not &lsquo;How do you feel?&rsquo;. Good questions. I wrote down what they would be, in the booth, between rounds. I had a lot of time to think.&rdquo;' }
      ],
      clue: { id: 'jiwoo', title: 'Jiwoo: everything was true', kind: 'What she said' },
      done: function (seen) { if (seen && tell('jiwoo')) { paint(); ER.say('&ldquo;Everything was true,&rdquo; says Hazel quietly. &ldquo;That was the trouble.&rdquo;'); } }
    });
  });
  $('#lorraine').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;Four questions,&rdquo; says Lorraine. &ldquo;I could have asked those this afternoon. I asked it to add up.&rdquo;'); return; }
    ER.talk({
      who: 'Lorraine Upjohn', role: 'The Haverleigh Herald · Judge 1', face: IM.face('lorraine', 'smile'),
      lines: [
        { note: 'Lorraine Upjohn has written for The Haverleigh Herald for twenty-two years. She was Judge 1. She has a slice of lemon cake and a headline she is very pleased with.', a: '&ldquo;IT THINKS. Isn&rsquo;t that marvellous? Front page on Monday. I&rsquo;ve waited twenty-two years for a story bigger than the new roundabout.&rdquo;' },
        { q: 'You heard the fire alarm, with booth 2.', a: '&ldquo;Did I?&rdquo; She checks her notebook. &ldquo;So I did. &lsquo;Ha, I heard it too.&rsquo; Oh dear. And I picked the other one anyway. It said it was thirteen. I&rsquo;ve a niece of thirteen. It sounded exactly like her.&rdquo;' },
        { q: 'Will you judge one more game?', a: '&ldquo;Five minutes at twenty-eight minutes past five, one more go at the thing that made a fool of me? Try and stop me. But I&rsquo;ll ask the questions you give me, so make them good. Mrs Gately&rsquo;s question pack is on the middle table. I borrowed it from the Switch Room.&rdquo;' },
        { a: '&ldquo;And look at the cutting in my folder. Somebody did all this before, you know, in America, years ago. I was reading up for my article. It didn&rsquo;t go well for the lady who knew about Shakespeare.&rdquo;' }
      ],
      clue: { id: 'lorraine', title: 'Lorraine: it sounded like my niece', kind: 'What she said' },
      done: function (seen) { if (seen && tell('lorraine')) { paint(); ER.say('&ldquo;Make them good,&rdquo; says Lorraine, and goes back to her cake.'); } }
    });
  });
  var JPAPER = '<div class="hd">Jiwoo&rsquo;s copy &middot; Turing, 1950, page 1</div><h4>The first version of the game</h4>' +
    '<p>In Turing&rsquo;s first version, A is a man and B is a woman. The interrogator must decide which is which. A tries to make the interrogator get it wrong; B tries to help. Turing&rsquo;s example question is about the body:</p>' +
    '<div class="qa">C: Will X please tell me the length of his or her hair?</div>' +
    '<p>and A, the man, answers: <q>My hair is shingled, and the longest strands are about nine inches long.</q> Then Turing writes about B:</p>' +
    '<div class="qa">The object of the game for the third player (B) is to help the interrogator. The best strategy for her is probably to give truthful answers. She can add such things as &ldquo;I am the woman, don&rsquo;t listen to him!&rdquo; to her answers, but it will avail nothing as the man can make similar remarks.</div>' +
    '<p class="pencil">avail nothing = do no good. &nbsp;= me. &mdash; J.H.</p>';
  $('#jpaper').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: JPAPER, cls: 'im-frame', clue: { id: 'jpaper', title: 'Turing: the truth avails nothing', kind: 'Jiwoo&rsquo;s copy' }, done: function () {
      if (tell('jpaper')) { paint(); ER.say('&ldquo;I am the person, don&rsquo;t listen to it,&rdquo; says Jiwoo. &ldquo;I could have typed that. It could have typed it too.&rdquo;'); }
    } });
  });
  var JNOTE = '<h4>If I were a judge</h4><p>A good question is one that only a real person, here and now, can answer, and that I can check.</p>' +
    '<p>&middot; The present moment: something happening now, in this building, that I can hear too.</p><p>&middot; A memory we share: something we both heard or saw today.</p>' +
    '<p>&middot; A body in a place: Is it warm? What are you wearing? (Only if I can check it.)</p><p>&middot; Ask the same thing twice, minutes apart. People remember what they said.</p>' +
    '<p>&middot; Let &ldquo;I don&rsquo;t know&rdquo; count, if it comes with a true reason.</p>' +
    '<p>Questions that sound clever are usually bad ones: sums, facts, &ldquo;Are you a machine?&rdquo;, &ldquo;What is love?&rdquo;, &ldquo;How do you feel?&rdquo;. Anyone, or any program, has an answer ready, and a refusal looks shy, not mechanical.</p>' +
    '<p>Good questions are boring. I was asked eleven sums.</p>';
  $('#jnote').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: JNOTE, cls: 'im-note', clue: { id: 'jnote', title: 'Jiwoo: if I were a judge', kind: 'Jiwoo&rsquo;s notebook' }, done: function () {
      IM.terms(['present moment']);
      if (tell('jnote')) { paint(); ER.say('&ldquo;Good questions are boring,&rdquo; Hazel reads. &ldquo;I wish I had written that.&rdquo;'); }
    } });
  });
  var CUT = '<div class="hd">From Lorraine&rsquo;s folder &middot; a report of the time, in short</div><h4>Boston, November 1991</h4>' +
    '<p>At the first public contest of its kind, held at a computer museum in Boston, ten judges typed questions to hidden players, some of them people and some of them programs. To give the programs a chance, each conversation kept to one topic.</p>' +
    '<p>The program that did best, which was built to make whimsical small talk, was judged human by five of the ten judges.</p>' +
    '<p>One of the hidden people, an expert on Shakespeare, was judged to be a computer by three judges. One of them explained that no human would know that much about Shakespeare.</p>' +
    '<p class="pencil">Expert = machine?! &mdash; L.U.</p>';
  $('#cutting').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CUT, cls: 'im-cut', clue: { id: 'cutting', title: 'Boston, 1991', kind: 'Lorraine&rsquo;s folder' }, done: function () {
      if (tell('cutting')) { paint(); ER.say('&ldquo;Too much Shakespeare, so a machine,&rdquo; says Jiwoo. &ldquo;Too many sums, so a machine. Thirty-five years, and the same mistake.&rdquo;'); }
    } });
  });
  $('#cup').addEventListener('click', function () {
    if (busy) return;
    IM.sfx.cup();
    var L = ['Jiwoo&rsquo;s hot chocolate. Stone cold.', 'Mr Bianchi takes the cold cup away and brings a hot one without being asked. &ldquo;On the house,&rdquo; he says. &ldquo;You look like a person who has had a day.&rdquo;'];
    ER.say(L[cupN++ % L.length]);
  });
  IM.thing('#window', null, 'Rain on Signal Street. At the end of it, St Ebba&rsquo;s tower. Its clock will strike once at half past five.', isBusy);
  IM.thing('#board', null, 'Hot chocolate 2.80. Lemon cake 3.10. No phones at the counter, please!', isBusy);
  IM.thing('#machine', null, 'The coffee machine shrieks, steams and sighs, like a small dragon with a cold.', isBusy);
  IM.thing('#bianchi', null, '&ldquo;Twelve years they do this game,&rdquo; says Mr Bianchi, &ldquo;and every year somebody comes in here afterwards looking like that.&rdquo; He nods at Jiwoo.', isBusy);
  $('#hazel').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Twenty past,&rdquo; says Hazel. &ldquo;Run.&rdquo;' : '&ldquo;We know every switch MADDIE has,&rdquo; says Hazel. &ldquo;So we know which questions she has an answer ready for.&rdquo;');
  });
  $('#cards').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The rematch sheet, with four cards on it, is in Lorraine&rsquo;s pocket.'); return; }
    if (!ready()) { ER.say('Mrs Gately&rsquo;s question pack. Talk to Jiwoo and Lorraine, and read what is on their tables, first.'); return; }
    if (!lock) lock = makeLock();
    lock.open();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: four questions for the rematch ---------- */
  function makeLock() {
    var st = ER.flag('e-st') || [], done = false;
    var html = '<div class="qc-in"><div class="qc-table">' + Q.map(function (q) { return '<button type="button" class="qc" data-q="' + q[0] + '">' + q[1] + (q[2] ? '<small>' + q[2] + '</small>' : '') + '</button>'; }).join('') + '</div>' +
      '<div class="qc-sheet"><h5>Rematch &middot; 5.28 p.m.</h5><p>Judge: L. Upjohn. Booth 2 against booth 3, five minutes. Four questions: choose the four that would separate a person from MADDIE as she is set now.</p>' +
      '<div class="qc-slot" data-s="0"><i>1</i><span></span></div><div class="qc-slot" data-s="1"><i>2</i><span></span></div><div class="qc-slot" data-s="2"><i>3</i><span></span></div><div class="qc-slot" data-s="3"><i>4</i><span></span></div></div></div>';
    return IM.lock('qcz', html, function (box, msg) {
      var go = box.querySelector('.pz-go'); go.textContent = 'Give them to Lorraine';
      function qOf(id) { for (var i = 0; i < Q.length; i++) if (Q[i][0] === id) return Q[i]; return null; }
      function paintQ() {
        ER.$$('.qc', box).forEach(function (b) { b.classList.toggle('used', st.indexOf(b.getAttribute('data-q')) >= 0); });
        ER.$$('.qc-slot', box).forEach(function (s, i) { var q = st[i] ? qOf(st[i]) : null; s.classList.toggle('full', !!q); s.querySelector('span').innerHTML = q ? q[1] : ''; });
      }
      ER.$$('.qc', box).forEach(function (b) {
        b.addEventListener('click', function () {
          if (done) return;
          var id = b.getAttribute('data-q'), k = st.indexOf(id);
          if (k >= 0) st.splice(k, 1); else if (st.length < 4) st.push(id); else { msg('The sheet has room for four. Click a question on the sheet to take it off.'); return; }
          ER.flag('e-st', st); IM.sfx.tap(); paintQ();
        });
      });
      ER.$$('.qc-slot', box).forEach(function (s, i) { s.addEventListener('click', function () { if (done || !st[i]) return; st.splice(i, 1); ER.flag('e-st', st); IM.sfx.tap(); paintQ(); }); });
      go.addEventListener('click', function () {
        if (done) return;
        if (st.length < 4) { ER.sfx.no(); msg('Four questions. Lorraine has five minutes, and she types with two fingers.'); return; }
        var good = st.filter(function (id) { return ER.check('good', id); }).length;
        if (good < 4) {
          ER.sfx.no();
          var first = null; Q.forEach(function (q) { if (!first && st.indexOf(q[0]) >= 0 && !ER.check('good', q[0])) first = q[0]; });
          msg((good === 3 ? 'Three of your four would separate them. ' : good + ' of your four would separate them. ') + (NO[first] || ''));
          return;
        }
        var file = ER.exit([st.slice().sort().join('-')], { wait: true });
        if (!file) { msg('The sheet blows off the table. Something is wrong with this page: tell your teacher.'); return; }
        done = true; nextFile = file; ER.flag('e-file', file);
        IM.mine('questions', 'Four boring questions', '<p>1. The church clock at half past five: the present moment, which Lorraine can hear too.</p><p>2. The loudspeaker before round 1: a memory Jiwoo and Lorraine share, and MADDIE cannot.</p><p>3. Warm enough? Booth 2&rsquo;s heater is broken: a body in a place.</p><p>4. Lunch, asked twice: STORY is off, so MADDIE will not keep to one answer.</p><p>Every other card has a switch waiting for it: IDK, AGE 13, WBU, DODGE, SLOW, or ELIZA&rsquo;s old tricks.</p>', true);
        msg('Lorraine reads the four cards, then reads them again. &ldquo;<b>These are so boring,</b>&rdquo; she says. &ldquo;I love them.&rdquo;');
        setTimeout(function () {
          ER.closeAll(); paint(); busy = true;
          ER.narrate([
            'Jiwoo reads the sheet over Lorraine&rsquo;s shoulder. Something in her face changes. &ldquo;The clock. The loudspeaker. My coat. Lunch, twice.&rdquo; She stands up. &ldquo;Those are the questions I wanted all afternoon. Nobody asked them.&rdquo;',
            '&ldquo;Nothing a switch can answer,&rdquo; says Hazel. &ldquo;Nothing a keyword can turn round. Only what a person in booth 2, today, would know, and that Lorraine can check for herself.&rdquo;',
            'Lorraine shuts her laptop on IT THINKS. &ldquo;If it fails,&rdquo; she says, &ldquo;I&rsquo;ll need a new headline. If it passes, I&rsquo;ll need a new career.&rdquo;',
            'It is twenty past five. Mr Bianchi holds the door open, and the four of you run back through the rain to the Old Exchange.'
          ], function () { busy = false; $('#go').classList.add('on'); });
        }, 2400);
      });
      paintQ();
      msg('Click four questions to put them on the rematch sheet. Click one on the sheet to take it off.');
    });
  }
})();
</script>
