      if (h[4] === 'l') s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + (ht * 0.55) + '" fill="#8a9aa0" opacity=".7"/><path d="M' + x + ' ' + (y + ht * 0.62) + 'q' + (w * 0.3) + ' ' + (-ht * 0.2) + ' ' + (w * 0.6) + ' 0t' + (w * 0.4) + ' ' + (-ht * 0.05) + 'V' + (y + ht) + 'H' + x + 'z" fill="#4a5a34"/>';

      else s += '<ellipse cx="' + (x + w * 0.4) + '" cy="' + (y + ht * 0.7) + '" rx="' + (w * 0.16) + '" ry="' + (w * 0.12) + '" fill="#a8742a"/><ellipse cx="' + (x + w * 0.62) + '" cy="' + (y + ht * 0.72) + '" rx="' + (w * 0.12) + '" ry="' + (w * 0.1) + '" fill="#7a2a2a"/><path d="M' + x + ' ' + (y + ht * 0.82) + 'h' + w + '" stroke="#1a1410" stroke-width="3"/>';

    [[1160, 760], [1230, 760], [1300, 760], [1370, 760], [1590, 800], [1660, 800], [-60, 800], [10, 800], [80, 800]].forEach(function (c) {

    ['hartnell', 'lisle', 'owen', 'roux', 'femi'].forEach(function (w) { $('#' + w).innerHTML = FG.fig(w); });
  })();

  ER.init({
    theme: 'forensic', story: 'forgery', storyTitle: 'Lot Forty-One', id: 'saleroom', no: 'I', title: 'The Saleroom',
    go: 'Go in',
    intro: [
      'Cardew &amp; Lisle have sold pictures, furniture and other people&rsquo;s grandmothers&rsquo; teapots since 1822. On Thursday evening they sell Lot 41: <i>The Linnet</i>, by Lieven Sterck of Haarlem, a small painting that has been lost for three hundred and eighty years. It turned up in September, over a piano in a farmhouse. A letter found with it says exactly how it got there.',
      'Today is viewing day, when anybody may walk in and look. At half past ten a dealer took a small lamp out of her handbag, shone it on the letter in its glass case, and said something in a loud voice.',
      'At ten to eleven the director rang the laboratory. Dr Novak is in court all week, so Dr Leonie Hartnell has come instead. She does paint, paper and ink, and she does not like to be hurried. You are carrying her case.'
    ],
    exit: {"next":"stores","w":{"cb4d1e3d":"c50a4693"}}, tags: {"q1":["60723424"],"q2":["f9da753f"],"q3":["31e30f89"],"q4":["48c482c6"],"q5":["484d550c"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('a-file') || null; told = ER.flag('a-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('a-told', told); return true; }
  function isBusy() { return busy; }
  function heard() { return told.lisle && told.roux && told.femi; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#scene').classList.toggle('dim', !!(told.label && !nextFile));
    $('#tablething').style.display = told.label ? '' : 'none';
    $('#table').classList.toggle('ready', !!(told.label && !nextFile));
    $('#hcase').classList.toggle('ready', !!(heard() && !told.label));
    $('#sheet').style.display = told.label && !nextFile ? 'none' : '';
    ER.pips((heard() ? 1 : 0) + (told.label ? 1 : 0) + ((ER.flag('a-seen') || []).length >= 5 ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['The real letter is in the strongroom, in the stores under this room. Go down.']];
    if (bench && bench.isOpen()) return [bench.step(), {
      sweep: ['Pick the lamp up by its handle and move it slowly over each of the five things on the table. Watch inside the violet circle: a small note appears under each thing when you have looked long enough.',
        'Something that glows blue-white has brighteners in it. Something that stays dark and dull has none. All five have to be looked at before anybody signs.'],
      flip: ['Paper has two sides. Click the sheet from the glass case to turn it over.',
        'Look at the back under the lamp too. What is printed there?'],
      find: ['Read each sentence and ask: does what we saw show that it is true, show that it is wrong, or leave it open?',
        'The lamp shows whether a thing has brighteners in it. It cannot show when words were written. The tissue&rsquo;s packet and the robe&rsquo;s labels tell you more than the lamp does.',
        'Two sentences are true, two are wrong, and about one of them we cannot say anything yet. Which sheet did we really test?']
    }[bench.step()]];
    if (!heard()) return ['talk', ['Three people want to be heard before anything is touched: Mrs Lisle by the easel, Mrs Roux with her lamp, and the young woman by the door. Click each of them.']];
    if (!told.label) return ['label', ['Dr Hartnell&rsquo;s black case is on the end of the green table. Click it: there is a label inside the lid that says what paper does under the lamp.']];
    return ['table', ['Owen has put five things on the green table, and the blinds are down. Click the table.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The real letter is downstairs, in the strongroom.'); return; }
    if (told.in) { busy = false; ER.say('The saleroom. People are whispering about Lot 41.'); return; }
    tell('in');
    ER.narrate([
      'The saleroom has red walls, a glass roof and a great many paintings in gold frames, hung so close together that the frames touch. Rows of gilt chairs face a wooden rostrum. People stand about in small groups, and none of them is talking about the weather.',
      'Lot 41 stands alone on an easel under its own lamp: a small dark picture of a bird on a perch, in a gold frame with a gold bird on top. Beside it, under glass, is a single sheet of brown handwriting. A red rope has been put round both.',
      'Mrs Constance Lisle, the director, meets you at the rope. &ldquo;Thank you for coming so quickly. Mrs Roux says the letter is a fake. Mr Garrick, our head of pictures, is at the bank and is not answering his telephone. And I have asked Miss Odum to go home.&rdquo;',
      'A young woman in a green coat is standing by the door with her bag on her shoulder, not going home. Dr Hartnell looks at her, and at the glass case, and up at the glass roof. &ldquo;Nobody touches anything yet,&rdquo; she says. &ldquo;First I should like to hear what everybody saw.&rdquo;'
    ], function () { busy = false; paint(); });
  }

    function draw() {
      var s = '<defs><clipPath id="lc"><circle id="lcc" cx="-200" cy="-200" r="86"/></clipPath><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
      s += '<rect width="1000" height="600" fill="#173a27"/><rect width="1000" height="600" fill="#05040c" opacity=".45"/><g stroke="#123020" stroke-width="1" opacity=".6">';
      for (var i = 0; i < 30; i++) s += '<path d="M0 ' + (i * 20) + 'h1000"/>';
      s += '</g><g id="day">' + IT.map(function (it) { return '<g class="it" data-k="' + it.k + '">' + thing(it, false) + '</g>'; }).join('') + '</g>';
      s += '<rect width="1000" height="560" fill="#05030c" opacity=".38" pointer-events="none"/>';
      s += '<g clip-path="url(#lc)" pointer-events="none"><rect width="1000" height="600" fill="#2a1260" opacity=".55"/>' + IT.map(function (it) { return thing(it, true); }).join('') + '</g>';
      s += '<g id="notes"></g>';
      /* the form */
      s += '<rect x="330" y="282" width="660" height="306" rx="6" fill="#f4efe2"/><text x="350" y="306" class="tB" font-size="14" fill="#6e1f2e" letter-spacing="3">THE FINDING &#183; WHAT THE LAMP SHOWS</text>';
      Q.forEach(function (q, n) {
        var y = 330 + n * 52;
        s += '<text x="348" y="' + (y + 9) + '" class="tG" font-size="16" fill="#1e1b18">' + wrap((n + 1) + '. ' + q, 50).map(function (l, j) { return '<tspan x="' + (j ? 362 : 348) + '" dy="' + (j ? 18 : 0) + '">' + l + '</tspan>'; }).join('') + '</text>';
        [['t', 'TRUE'], ['w', 'WRONG'], ['c', 'CAN&#8217;T SAY']].forEach(function (o, j) {
          s += '<g class="opt' + (ans[n] === o[0] ? ' on' : '') + '" data-q="' + n + '" data-v="' + o[0] + '" transform="translate(' + (740 + j * 82) + ' ' + y + ')"><rect width="76" height="28" rx="3"/><text x="38" y="19" fill="#e9e4d8">' + o[1] + '</text></g>';
        });
      });
      /* the lamp */
      s += '<g class="tool" id="lamp"><path d="M-30 -91h60l54 85h-168z" fill="#9a7aff" opacity=".1" pointer-events="none"/><rect x="-40" y="-156" width="80" height="70" fill="#000" opacity="0"/><rect x="-36" y="-118" width="72" height="22" rx="5" fill="#2a2a34"/><rect x="-30" y="-98" width="60" height="7" fill="#9a7aff"/><rect x="-8" y="-150" width="16" height="34" rx="4" fill="#1c1c22"/><rect x="-5" y="-140" width="10" height="6" fill="#f0c419"/></g>';
      svg.innerHTML = s;
      notes();
    }
    function notes() {
      var s = '';
      IT.forEach(function (it) {
        if (!has(it.k)) return;
        var nx = it.x + it.w / 2, ny = it.k === 'robe' ? it.y + 262 : it.y - 10;
        s += '<text x="' + nx + '" y="' + ny + '" class="tH" font-size="17" fill="' + (it.glow ? '#cfe0ff' : '#c9b9c9') + '" text-anchor="middle">' + (it.glow ? 'glows blue-white' : 'stays dull') + '</text>';
      });
      svg.querySelector('#notes').innerHTML = s;
    }
    function under(p) { for (var i = 0; i < IT.length; i++) { var it = IT[i]; if (p.x > it.x && p.x < it.x + it.w && p.y > it.y && p.y < it.y + it.h) return it; } return null; }
    function wire() {
      var lc = svg.querySelector('#lcc');
      lamp = FG.tool(svg, svg.querySelector('#lamp'), { x: 900, y: 250 }, {
        start: function () { return !wait; },
        move: function (p) {
          var c = { x: p.x, y: p.y - 6 }, it = under(c);
          lc.setAttribute('cx', c.x); lc.setAttribute('cy', c.y);
          if (it !== on) {
            clearTimeout(dwell); on = it;
            if (it && !has(it.k)) dwell = setTimeout(function () {
              if (on !== it || has(it.k)) return;
              seen.push(it.k); keep(); notes(); FG.sfx.dot();
              msg(it.glow ? ({ fac: 'The sheet from the case glows blue-white, evenly, all over, like a bathroom tile. The brown writing sits on top of the glow like a shadow.', cat: 'Today&rsquo;s catalogue glows bright blue-white. No surprise: it was printed last month.', robe: 'The christening robe glows like snow under a street lamp. A robe of 1894.' })[it.k] :
                ({ bill: 'The sale bill of 1936 stays dull: a flat, dark brown-violet. No brighteners.', tissue: 'The framers&rsquo; tissue stays dull, as dark as the bill. So does its packet.' })[it.k]);
              if (seen.length === 5) setTimeout(function () { msg(flip ? 'All five have been under the lamp. Now read the finding, and decide each sentence.' : 'All five have been under the lamp. Before anybody signs anything: paper has two sides.'); }, 1800);
            }, 380);
          }
        },
        end: function (p) { clearTimeout(dwell); on = null; }
      }, [40, 70, 980, 600]);
      lc.setAttribute('cx', -200);
      ER.$$('.it', svg).forEach(function (n) {
        n.addEventListener('click', function () {
          var k = n.getAttribute('data-k');
          if (wait) return;
          if (k === 'fac') {
            back = !back; FG.sfx.pencil(); draw(); wire();
            if (back && !flip) { flip = true; keep(); }
            msg(back ? 'The back of the sheet. A blue stamp: <b>C&amp;L PHOTOGRAPHIC &middot; FACSIMILE &middot; JOB No. 2291</b>. The house&rsquo;s own photographer. Femi, at your shoulder, says something under her breath that is not in any catalogue.' : 'The front again: brown handwriting, dated 1793. Look closely, and the brown is made of tiny printed dots.');
            return;
          }
          msg({ cat: 'Today&rsquo;s catalogue, printed last month, open at Lot 41.',
            bill: 'The sale bill from the frame by the door: CARDEW &amp; LISLE, GREAT SALE OF PICTURES, 1936. Yellow at the edges.',
            tissue: 'A sheet of the framers&rsquo; tissue, and its packet: CONSERVATION TISSUE. ACID-FREE. MADE WITHOUT OPTICAL BRIGHTENERS. &ldquo;Bought it last month,&rdquo; says Owen. &ldquo;Framers like it that way.&rdquo;',
            robe: 'Lot 212: a linen christening robe. The year 1894 is embroidered on the hem in white thread. On the sleeve, a pink ticket from the laundry: WASHED AND PRESSED, for the sale.' }[k]);
        });
      });
      ER.$$('.opt', svg).forEach(function (o) {
        o.addEventListener('click', function () {
          if (wait) return;
          var n = +o.getAttribute('data-q');
          ans[n] = o.getAttribute('data-v'); keep(); FG.sfx.pencil();
          ER.$$('.opt[data-q="' + n + '"]', svg).forEach(function (b) { b.setAttribute('class', 'opt' + (b === o ? ' on' : '')); });
        });
      });
    }
    function answer(n) {
      var a = ans[n];
      return [
        a === 't' ? '' : !flip ? '&ldquo;Before you decide about the copy,&rdquo; says Dr Hartnell, &ldquo;turn it over. Paper has two sides. People forget.&rdquo;' : '&ldquo;It glows like today&rsquo;s catalogue, and the back is stamped FACSIMILE by your own photographer,&rdquo; says Dr Hartnell. &ldquo;A facsimile is a copy. How sure do you need to be?&rdquo;',
        a === 'c' ? '' : a === 't' ? '&ldquo;We have tested a copy,&rdquo; says Dr Hartnell. &ldquo;A copy printed last week would glow if the letter had been written by Shakespeare. Where is the letter itself?&rdquo;' : '&ldquo;Wrong?&rdquo; says Dr Hartnell. &ldquo;We haven&rsquo;t seen the letter. We have seen a copy of it. That tells us nothing about the letter, either way.&rdquo;',
        a === 'w' ? '' : 'Owen holds up the packet. &ldquo;Bought it last month. Says on the side: made without optical brighteners.&rdquo; New paper that does not glow. So no glow does not mean old: we know this one is new.',
        a === 'w' ? '' : 'Mrs Lisle turns the hem of the robe. &ldquo;1894, embroidered in. And look: the laundry has pinned its ticket on. Washed and pressed.&rdquo; Washing powder has brighteners in it, says the label in the lamp&rsquo;s case. We know this robe is old.',
        a === 't' ? '' : '&ldquo;Old paper stays dull,&rdquo; says Dr Hartnell. &ldquo;This one stays dull, and it says 1936. A dull sheet proves nothing by itself, but this one at least agrees with its own date. That is all &lsquo;fits&rsquo; means.&rdquo;'][n];
    }
    box.querySelector('#u-go').addEventListener('click', function () {
      var i, bad = -1, cand, file;
      if (wait || nextFile) return;
      if (seen.length < 5) { ER.sfx.no(); msg('&ldquo;Nobody signs for what they haven&rsquo;t seen,&rdquo; says Dr Hartnell. &ldquo;' + (5 - seen.length) + ' of the five things have not been under the lamp yet.&rdquo;'); return; }
      for (i = 0; i < 5; i++) if (!ans[i]) { ER.sfx.no(); msg('Sentence ' + (i + 1) + ' has no answer yet: true, wrong, or can&rsquo;t say.'); return; }
      if (!flip) { ER.sfx.no(); msg('&ldquo;Before anybody decides anything about that copy,&rdquo; says Dr Hartnell, &ldquo;turn it over. Paper has two sides. People forget.&rdquo;'); return; }
      for (i = 0; i < 5; i++) if (!ER.check('q' + (i + 1), ans[i])) { bad = i; break; }
      if (bad >= 0) { ER.sfx.no(); msg('<b>Sentence ' + (bad + 1) + '.</b> ' + answer(bad)); return; }
      cand = ans.join('-'); file = ER.exit([cand], { wait: true });
      if (!file) { ER.sfx.no(); msg('Dr Hartnell reads it twice and does not sign. &ldquo;Again, please. Slowly.&rdquo;'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file); FG.sfx.stamp(); paint();
      msg('Dr Hartnell signs: <b>L. Hartnell</b>. &ldquo;The sheet in the case is a modern copy. About the letter itself, the lamp has told us nothing at all.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          'Owen rolls the blinds up again. The saleroom blinks. Mrs Roux puts her little lamp away. &ldquo;A facsimile,&rdquo; she says. &ldquo;How very disappointing. I was enjoying myself.&rdquo;',
          '&ldquo;I didn&rsquo;t know it was a copy,&rdquo; says Femi. &ldquo;I swear I didn&rsquo;t. I never looked at the case.&rdquo; Mrs Lisle is already turning the pages of a small black book from her pocket.',
          '&ldquo;Here. Tuesday: <i>letter of 1793 to the strongroom, for safety. R.G.</i> So the original has been downstairs all along.&rdquo; She closes the book. &ldquo;Then we shall go downstairs. Miss Odum, you had better come too. You found it.&rdquo;',
          'Lot 41 is lifted off its easel, very gently, by a man in white gloves. It is going down to the strongroom as well, until somebody knows what it is.'
        ], function () { busy = false; showGo(); });
      }, 3200);
    });
    draw(); wire();
    msg(step() === 'sweep' ? 'The blinds are down. On the green cloth: the sheet from the case, today&rsquo;s catalogue, the sale bill of 1936, the framers&rsquo; tissue and the christening robe. Pick up the lamp by its handle and move it slowly over each of them.' :
      step() === 'flip' ? 'All five have been under the lamp. Paper has two sides: click the sheet from the case.' : 'Read the finding, decide each sentence, and sign.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      step: step
    };
  }
})();
</script>
</body>
</html>
