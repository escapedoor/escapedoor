<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, told = {};

  (function () {
    var s = '', i;
    for (i = 0; i < 24; i++) s += '<rect x="' + (52 + (i % 8) * 33) + '" y="' + (128 + Math.floor(i / 8) * 120 - (i * 7) % 18) + '" width="24" height="' + (42 + (i * 7) % 18) + '" rx="3" fill="' + ['#c9a04a', '#7a3a2a', '#2d4f9a', '#e9e2d2', '#4a6a3a', '#b3261c', '#d9d2c0', '#3a3a3a'][i % 8] + '" opacity=".85"/>';
    $('#jarg').innerHTML = s;
    s = ''; for (i = -20; i <= 40; i++) s += '<path d="M' + (800 + i * 64) + ' 640L' + (800 + i * 130) + ' 1300"/>';
    $('#boards').innerHTML = s;
    $('#panel').innerHTML = '<rect x="-4" y="-4" width="198" height="248" fill="#3a2a18"/>' + FG.painting();
    $('#mapic').innerHTML = FG.painting();
    ['garrick', 'hartnell', 'femi'].forEach(function (w) { $('#' + w).innerHTML = FG.fig(w); });
  })();

  ER.init({
    theme: 'forensic', story: 'forgery', storyTitle: 'Lot Forty-One', id: 'studio', no: 'III', title: 'The Studio',
    go: 'Up to the top floor',
    intro: [
      'The bird weighed 51.0 grams, once the balance had been set to zero with the empty boat on it. It pushed the water in the cylinder up from 40.0 to 46.0 ml, so its volume is 6.0 cm³. Density = mass ÷ volume = 51.0 ÷ 6.0 = 8.5 grams in every cubic centimetre. Gold would be 19.3. The bird is brass, with a skin of gold leaf: gilded, not gold.',
      'And it is the same bird that Femi weighed on Mr Tredwell&rsquo;s kitchen scales in September: 51 grams then, 51.0 now. A gold bird of that size would have weighed about 116. Nobody swapped anything. Mr Tredwell&rsquo;s gran was simply wrong, as grans are allowed to be.',
      'The real letter is on old paper. Mr Garrick says that settles it. Dr Hartnell says it settles the paper. The picture has gone up to the studio at the top of the building, where the house&rsquo;s conservator took five tiny samples of its paint a fortnight ago.'
    ],
    exit: {"next":"office","w":{"a1767f72":"4de6ec3c"}}, tags: {"s0":["718dc576"],"s1":["82adeb65"],"s2":["3ae13f31"],"s3":["e931aee4"],"s4":["f0bf6311"],"early":["0780fd8b"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function readAll() { return told.note && told.results && told.hb && told.back; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#scope').classList.toggle('ready', !!(readAll() && !nextFile));
    ER.pips((told.note ? 1 : 0) + (told.results ? 1 : 0) + (told.hb ? 1 : 0) + (told.back ? 1 : 0) + (nextFile ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['Mrs Mertens measured the tree rings on the bottom edge of the panel. Her folder is on Femi&rsquo;s desk in the catalogue office. Go down.']];
    if (bench && bench.isOpen()) return [bench.step(), {
      look: ['Click a slide in the box to put it under the microscope. Drag inside the round view to bring the speck into the middle, and drag the focus wheel up or down until the layers are sharp.',
        'Look at all five samples. The oldest layer is at the bottom. In each one, find the thin amber line: that is the old varnish, put on when the picture was finished.'],
      report: ['For each sample, which pigment on the results sheet was invented last? The handbook gives its date: that is the &lsquo;not before&rsquo; date. Click the arrows to set it.',
        'Under the amber line of varnish: the picture&rsquo;s own paint. On top of it: added later, by somebody else.',
        'Two of the five samples have paint on top of the varnish. The last question asks only about the picture&rsquo;s OWN paint.']
    }[bench.step()]];
    if (!readAll()) return ['read', ['Four things to read before the microscope: the yellow note on Mrs Mertens&rsquo; clipboard, the results clipped under it, the handbook open on the bench, and the back of the panel on the easel (click the panel).']];
    return ['scope', ['The microscope is on the bench under the window. Click it.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('Old paint, a later name, a younger feather. Now the wood.'); return; }
    if (told.in) { busy = false; ER.say('The studio, under the north window.'); return; }
    tell('in');
    ER.narrate([
      'The studio is at the very top of the building, under a big north window that lets in a cool, even light all day. Pictures without frames lean against the walls. Everything smells of turpentine and coffee.',
      'Mrs Mertens, the conservator, comes in on Mondays and Thursdays, and this week not at all. She has left her bench very tidy: a microscope, a box of glass slides, and a sheet of results on a clipboard, with a yellow note stuck on top.',
      'Lot 41 is on the easel, without its frame. Beside it hangs a photograph of it with five tiny red circles: A, B, C, D and E. A sample is a speck of paint smaller than a full stop, set in a little block of clear plastic and polished, so that its layers can be seen from the side.',
      'Mr Garrick has come up with you. He reads the yellow note and goes quiet, for once. Dr Hartnell reads it over his shoulder. &ldquo;Titanium white,&rdquo; she says. &ldquo;Well. That would be interesting.&rdquo;',
      '&ldquo;Titanium white wasn&rsquo;t in paint until the 1920s,&rdquo; says Femi. &ldquo;If it&rsquo;s in the picture, the picture is modern. Isn&rsquo;t it?&rdquo; Nobody answers her.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- papers ---------- */
  var NOTE = '<h4>A yellow note</h4><p>Rollo &mdash; results for Lot 41 came back today (Thurs). TITANIUM WHITE in sample C!</p><p>Before anybody panics, LOOK AT THE LAYERS.</p><p>Away next week, back Thursday 15th. &mdash; Ilse</p>';
  $('#note').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: NOTE, cls: 'sticky', clue: { id: 'note', title: 'Mrs Mertens’ yellow note', kind: 'On the clipboard' }, done: function () {
      if (tell('note')) { paint(); ER.say('&ldquo;Thursday last week,&rdquo; says Dr Hartnell. &ldquo;And addressed to you, Mr Garrick.&rdquo; &ldquo;I was going to mention it,&rdquo; says Mr Garrick. &ldquo;When it was convenient.&rdquo;'); }
    } });
  });
  var RESULTS = '<h4>University paint laboratory &middot; results</h4><h3>Cardew &amp; Lisle, Lot 41: five samples, taken by I. Mertens on 1 October</h3>' +
    '<p>What was found in each sample, in alphabetical order. (For the order of the layers, look at the cross-sections.)</p><table>' +
    '<tr><td>A &middot; the blue jug</td><td>chalk, lead white, natural resin, smalt</td></tr>' +
    '<tr><td>B &middot; the lemon</td><td>chalk, lead-tin yellow, natural resin</td></tr>' +
    '<tr><td>C &middot; the white feather on the floor</td><td>chalk, lead white, natural resin, titanium white, umber</td></tr>' +
    '<tr><td>D &middot; the letters in the bottom left corner</td><td>bone black, chalk, lead white, natural resin, Prussian blue, umber</td></tr>' +
    '<tr><td>E &middot; the bird&rsquo;s red cap</td><td>chalk, natural resin, vermilion</td></tr></table>' +
    '<p class="foot">Natural resin: the varnish. Chalk: the white ground under the paint, and also the filler used to mend holes. Umber: a brown earth.</p>';
  $('#clip').addEventListener('click', function () {
    if (busy) return;
    if (!told.note) { ER.say('The results are clipped under a yellow note. Read the note first: it is on top for a reason.'); return; }
    ER.read({ html: RESULTS, cls: 'results', clue: { id: 'results', title: 'Paint results, Lot 41', kind: 'University paint laboratory' }, done: function () {
      if (tell('results')) { paint(); ER.say('&ldquo;What is in each speck, but not in which order,&rdquo; says Dr Hartnell. &ldquo;The order is what the microscope is for.&rdquo;'); }
    } });
  });
  var DIAG = '<svg viewBox="0 0 250 230"><rect width="250" height="230" fill="#fbf8ef"/><rect x="30" y="20" width="170" height="190" fill="#3a4248" opacity=".18"/>' +
    '<path d="M40 190h150v-40H40z" fill="#efe9da" stroke="#b9ad92"/><path d="M40 150h150v-32q-75 6 -150 0z" fill="#6b4a2a"/><path d="M40 118q75 6 150 0v-8q-75 6 -150 0z" fill="#c9a04a"/><path d="M90 108q30 -4 60 2v-14q-30 -4 -60 0z" fill="#ffffff" stroke="#b9b4aa"/>' +
    '<g font-family="Patrick Hand,cursive" font-size="13" fill="#23201b"><text x="204" y="176">1 ground</text><text x="204" y="140">2 paint</text><text x="204" y="117" fill="#8a6a1c">3 old varnish</text><text x="154" y="90" fill="#b3261c">4 added later</text></g>' +
    '<path d="M18 196V30" stroke="#23201b" stroke-width="1.4"/><path d="M14 36l4 -8 4 8" fill="#23201b"/><text x="10" y="222" font-family="Patrick Hand,cursive" font-size="13" fill="#23201b">older at the bottom</text></svg>';
  var HB = '<h4>A conservator&rsquo;s handbook &middot; chapter 4</h4><h3>When colours were new</h3><div class="two"><div>' +
    '<p>A painter can only use a colour that exists, so every <b>pigment</b> gives a date that its layer cannot be older than.</p><table>' +
    '<tr><td>chalk, umber, bone black, vermilion, lead white, natural resin</td><td>ancient</td></tr>' +
    '<tr><td>lead-tin yellow</td><td>from the 1300s</td></tr><tr><td>smalt (a blue made of powdered glass)</td><td>from the 1500s</td></tr>' +
    '<tr><td>Prussian blue</td><td>first made about 1704</td></tr><tr><td>titanium white</td><td>in painters&rsquo; colours from the 1920s</td></tr></table>' +
    '<p>Careful. A pigment dates <b>its own layer</b>, not the whole picture. For centuries, later hands have mended and &lsquo;improved&rsquo; old pictures.</p></div>' + DIAG + '</div>' +
    '<p>Under the microscope a tiny <b>cross-section</b> shows the layers in order, the oldest at the bottom: the ground, the paint, and the <b>varnish</b>, which turns a yellow-amber colour as it ages. Paint that lies <b>on top of the old varnish</b> was put on after the picture was finished: by a restorer mending damage (that is <b>retouching</b>), or by somebody less honest.</p>' +
    '<p class="rule">One modern layer does not make a modern picture. Ask which layer it is in.</p>';
  $('#hb').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: HB, cls: 'handbook', clue: { id: 'handbook', title: 'When colours were new', kind: 'Conservator’s handbook' }, done: function () {
      FG.terms(['pigment', 'cross-section', 'varnish', 'retouching', 'conservator']);
      if (tell('hb')) { paint(); ER.say('&ldquo;Ask which layer it is in,&rdquo; Femi reads aloud, and then reads it again, more quietly.'); }
    } });
  });
  var BACK = '<h4>The back of the panel</h4><svg viewBox="0 0 700 300"><rect width="700" height="300" fill="#1e1a16"/>' +
    '<path d="M120 20h460v260H120z" fill="#8a6a44"/><path d="M120 20h460l-24 24H144v212l-24 24z" fill="#a07a50"/><path d="M580 20v260H120l24 -24h412V44z" fill="#6b5034"/>' +
    '<g stroke="#6b5034" stroke-width="1.6" opacity=".7" fill="none"><path d="M150 60q200 -8 400 4M150 90q200 6 400 -2M150 130q200 -10 400 6M150 170q200 8 400 -4M150 210q200 -6 400 4M150 240q200 4 400 0"/></g>' +
    '<rect x="420" y="70" width="110" height="60" fill="#e9dcb8" transform="rotate(-4 475 100)"/><path d="M500 70l30 0 0 30z" fill="#8a6a44" transform="rotate(-4 475 100)"/><text x="470" y="108" font-family="Special Elite,monospace" font-size="14" fill="#3a2a1a" text-anchor="middle" transform="rotate(-4 475 100)">...38</text>' +
    '<text x="190" y="84" font-family="Caveat,cursive" font-size="34" fill="#f1ead8" opacity=".55">17</text>' +
    '<text x="200" y="200" font-family="Homemade Apple,cursive" font-size="15" fill="#2a2018" transform="rotate(-2 300 200)">W. Henshaw 1958 &#8212; cleaned;</text><text x="214" y="228" font-family="Homemade Apple,cursive" font-size="15" fill="#2a2018" transform="rotate(-2 300 228)">old loss in floor filled &amp; painted</text>' +

      }, 3400);
    });
    draw(); wire();
    msg(step() === 'look' ? 'On the left, the microscope and its five slides. In the middle, what the microscope sees. On the right, the report. Click a slide to put it on the stage.' : 'All five samples have been seen. Finish the report and sign it.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      step: step
    };
  }
})();
</script>
