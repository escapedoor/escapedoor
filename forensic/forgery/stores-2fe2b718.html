    for (i = 0; i < 5; i++) { x = 640 + i * 66; s += '<rect x="' + x + '" y="' + (196 + (i * 19) % 26) + '" width="56" height="' + (100 - (i * 19) % 26) + '" fill="#d9cfb8" stroke="#8a7a5a" stroke-width="2"/><path d="M' + (x + 6) + ' ' + (206 + (i * 19) % 26) + 'l44 70M' + (x + 50) + ' ' + (206 + (i * 19) % 26) + 'l-44 70" stroke="#b9ad92" stroke-width="1.5"/>'; }

  })();

  ER.init({
    theme: 'forensic', story: 'forgery', storyTitle: 'Lot Forty-One', id: 'stores', no: 'II', title: 'The Stores',
    go: 'Down the back stairs',
    intro: [
      'Under the lamp the sheet from the glass case glowed blue-white, like today&rsquo;s catalogue, and on its back was a stamp: FACSIMILE, from the house&rsquo;s own photographer. A facsimile is a copy. The glow told us about the copy, and nothing at all about the letter.',
      'The lamp broke its own simple rule twice. The framers&rsquo; tissue is new and stays dull, because it is made without brighteners. The christening robe of 1894 glows, because it has just been through the wash. Only the sale bill of 1936 did what you would expect: it stayed dull, which fits its date. A glow can tell you something. No glow tells you less.',
      'The real letter has been in the strongroom since last Tuesday. So, now, has the picture.'
    ],
    exit: {"next":"studio","w":{"15a34afe":"660dccdd"}}, tags: {"d":["a24a706b"],"what":["d8b9ec6e"],"swap":["1da989c8"]},
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('b-file') || null; told = ER.flag('b-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function heard() { return told.garrick && told.tredwell; }
  function readAll() { return told.letter && told.manual && told.receipt; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#bench').classList.toggle('ready', !!(heard() && readAll() && !nextFile));
    ER.pips((heard() ? 1 : 0) + (told.letter ? 1 : 0) + (told.manual && told.receipt ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['The panel has gone up to the studio, where the conservator&rsquo;s results are waiting. Follow it.']];
    if (bench && bench.isOpen()) return [bench.step(), {
      mass: ['The bird is lying on the grey cloth. It goes into the plastic boat on the balance. But look at the display first: the empty boat weighs something too.',
        'Press TARE while only the empty boat is on the pan, so that the display says 0.0. Then drag the bird into the boat.'],
      vol: ['Click the jug to pour water into the measuring cylinder. Then read the level in the round lens beside it: click on the place where the water is.',
        'Read the bottom of the curve, not the edges, where the water climbs up the glass. Then drag the bird into the cylinder, and read the level again.'],
      dens: ['Density = mass ÷ volume. The sheet has both numbers now. Set the counter to your answer, and choose the metal that has that density.',
          'Femi&rsquo;s receipt says what the bird weighed in September. And a GOLD bird of the same volume would weigh volume × 19.3.',
          'Mass ÷ volume: 51.0 ÷ 6.0. If the bird weighed the same then and now, nobody has swapped it.']
    }[bench.step()]];
    if (!heard()) return ['talk', ['Two people have just arrived: Mr Garrick, on the stairs, and Mr Tredwell, at the loading door. Hear them both.']];
    if (!told.letter) return ['letter', ['The real letter is lying on its brown envelope on Owen&rsquo;s bench. Read it: it is what everybody is arguing about, and every word of it will matter later.']];
    if (!readAll()) return ['read', ['Two more papers before the balance: Dr Hartnell&rsquo;s field manual, open at DENSITY on the bench, and Femi&rsquo;s green folder, with her receipt from September in it. Read both.']];
    return ['bench', ['The balance and the measuring cylinder are on the left of Owen&rsquo;s bench. Click them.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The bird is brass, and it is the same bird. The panel has gone up to the studio.'); return; }
    if (told.in) { busy = false; ER.say('The stores. Rain at the loading door.'); return; }
    tell('in');
    ER.narrate([
      'The stores are under the saleroom: a long, cold room of steel racks and wooden crates, with a strip light that cannot make up its mind and a loading door at the far end, open to the rain. Every picture down here has a lot number on a luggage label, and most of them are facing the wall.',
      'Owen opens the strongroom, a steel door as thick as a dictionary, and comes out with a brown envelope in one hand and Lot 41 in the other, carrying the picture as if it were asleep. He lays them both on his bench and lifts the panel out of its frame.',
      'Dr Hartnell slides the letter out of the envelope by its edges and holds her lamp over it, in the shadow of the strongroom door. The sheet stays dull: a flat, warm, old brown. No glow at all.',
      '&ldquo;There!&rdquo; says a voice from the stairs. A tall man with silver hair and a wet umbrella comes down two steps at a time. &ldquo;Old paper. Old paper! I go to the bank for one morning, and I come back to find my department in a panic over a photocopy.&rdquo; This is Mr Rollo Garrick.',
      '&ldquo;Old paper,&rdquo; says Dr Hartnell. &ldquo;That is all the lamp says, Mr Garrick. It doesn&rsquo;t say when the ink went on.&rdquo;',
      'And then, from the loading door, a second voice, louder: &ldquo;Where&rsquo;s my bird?&rdquo; A big man in a wax jacket is standing in the rain with a newspaper over his head.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the two who have just arrived ---------- */
  function done(k) {
    return function (seen) {
      if (!seen || !tell(k)) return;
      paint();
      if (heard()) {
        busy = true;
        ER.narrate([
          'Mr Tredwell has come right in now, dripping. He looks at the empty frame on the bench, and at the little bird on top of it. &ldquo;That&rsquo;s gone brassy. Gran&rsquo;s bird was gold. Somebody has changed it.&rdquo;',
          '&ldquo;Miss Odum had the frame alone on her desk for an afternoon,&rdquo; says Mr Garrick, to the ceiling. &ldquo;I accuse nobody. I merely mention it.&rdquo; Femi goes very still.',
          '&ldquo;Then we shall ask the bird,&rdquo; says Dr Hartnell, and unscrews it from the frame. &ldquo;It can&rsquo;t lie, and it can&rsquo;t go home. Owen, a jug of water, please.&rdquo; She sets a balance and a measuring cylinder on the bench, and opens her manual beside them.'
        ], function () { busy = false; paint(); });
      }
    };
  }
  $('#garrick').addEventListener('click', function () {
    if (busy) return;
    if (told.garrick) { ER.say(nextFile ? '&ldquo;Gilt, then,&rdquo; says Mr Garrick. &ldquo;It changes nothing about the picture.&rdquo;' : '&ldquo;Thirty-one years,&rdquo; says Mr Garrick, &ldquo;and I have never seen a fuss like it.&rdquo;'); return; }
    ER.talk({
      who: 'Rollo Garrick', role: 'Head of Pictures · Cardew & Lisle, 31 years', face: FACE('garrick'),
      lines: [
        { note: 'Silver hair, a yellow tie, and an umbrella that he does not put down. He talks to you as if you were a large audience.', a: '&ldquo;A great picture, found again. It happens once in a career, if you are lucky. I have waited thirty-one years.&rdquo;' },
        { q: 'When did you first see the letter?', a: '&ldquo;On Monday afternoon last week, when Miss Odum ran into my room with it. I had never seen it before in my life. I had to sit down. Ask her.&rdquo;' },
        { q: 'Why was there a copy in the case?', a: '&ldquo;Because people breathe on things, and the sun comes through that glass roof. The original went down to the strongroom on Tuesday, and our photographer made the facsimile for the case. It is what one does.&rdquo; He shrugs. &ldquo;I did not expect anybody to wave a lamp at it.&rdquo;' },
        { q: 'And the picture?', a: '&ldquo;Sterck. Without a doubt. The bird alone would tell you, and the letter tells you the rest. The catalogue says &lsquo;gold bird&rsquo;, by the way, because it is one. Mr Tredwell&rsquo;s grandmother always said so.&rdquo;' }
      ],
      clue: { id: 'garrick', title: 'Rollo Garrick, in the stores', kind: 'What he said' }, done: done('garrick')
    });
  });
  $('#tredwell').addEventListener('click', function () {
    if (busy) return;
    if (told.tredwell) { ER.say(nextFile ? '&ldquo;Brass,&rdquo; says Mr Tredwell, to the bird. &ldquo;Fifty years I wasn&rsquo;t allowed to touch you.&rdquo;' : '&ldquo;I want a new roof on the barn,&rdquo; says Mr Tredwell. &ldquo;That&rsquo;s all I ever wanted.&rdquo;'); return; }
    ER.talk({
      who: 'Jack Tredwell', role: 'The owner of Lot 41 · Coldharbour Farm', face: FACE('tredwell'),
      lines: [
        { note: 'Sixty or so, red in the face from the rain, with the hands of a man who has mended a great many fences. He holds his cap in both of them.', a: '&ldquo;I never wanted a fuss. I wanted a new roof on the barn.&rdquo;' },
        { q: 'Tell me about the bird.', a: '&ldquo;Gran&rsquo;s gold bird. Solid gold, she always said. Her mother told her, and her mother told her. When we were little we weren&rsquo;t allowed to touch it. And now look at it. Gone a funny colour. That&rsquo;s brass, that is, or I&rsquo;m a Dutchman.&rdquo;' },
        { q: 'Do you think it has been changed?', a: '&ldquo;I don&rsquo;t know what I think. The young lady came and took the picture away in September, very nice, very careful, wrote everything down. Weighed the bird on my kitchen scales, I remember that. And now there&rsquo;s all this talk of fakes.&rdquo;' },
        { q: 'And the letter?', a: '&ldquo;Never saw a letter in my life till it was in the papers. If Gran had had a letter about that picture, she&rsquo;d have read it out every Christmas.&rdquo;' }
      ],

          if (p.x > 70 && p.x < 270 && p.y > 150 && p.y < 280) {                 /* into the boat */
            st.pan = 1; st.mass = display(); keep(); FG.sfx.beep(); paintBench();
            msg(st.tare ? 'The bird in the boat. The display settles: <b>' + f1(display()) + ' g</b>. Dr Hartnell writes it on the sheet.' : 'The bird in the boat. The display settles at <b>' + f1(display()) + ' g</b>, and Dr Hartnell writes it down. &ldquo;Is that all bird?&rdquo; she asks. &ldquo;Or is some of it boat?&rdquo;');
            return;
          }
          if (p.x > 430 && p.x < 530 && p.y > 20 && p.y < 200) {                /* into the cylinder */
            if (st.mass === null || !st.pan && st.mass === null) { bird.home(); msg('&ldquo;Weigh it first,&rdquo; says Dr Hartnell, &ldquo;while it is dry. Water on the balance tells you about water.&rdquo;'); return; }
            if (Math.abs(st.mass - BIRD) > 0.05) { bird.set(170, st.pan ? 212 : 500); msg('&ldquo;Not yet,&rdquo; says Dr Hartnell. &ldquo;That mass on the sheet has the boat in it. Take the bird out, set the balance to zero with the empty boat, and weigh it again.&rdquo;'); return; }
            if (!st.poured) { bird.set(170, 212); msg('There is no water in the cylinder yet. Click the jug.'); return; }
            if (st.before === null) { bird.set(170, 212); msg('&ldquo;Read the level before the bird goes in,&rdquo; says Dr Hartnell. &ldquo;Otherwise there is nothing to take it away from.&rdquo; Click the level in the lens.'); return; }
            st.inc = 1; st.pan = 0; keep(); FG.sfx.plop(); paintBench();
            msg('The bird goes down on a cotton thread and settles on the bottom. The water climbs up the glass. Read the level again, in the lens.');
            return;
          }
          if (p.x < 330 && p.y > 400) { st.pan = 0; keep(); paintBench(); msg('The bird is back on its cloth. The balance reads ' + f1(display()) + ' g.'); return; }
          bird.set(170, st.pan ? 212 : 500);
        }
      }, [20, 30, 660, 570]);
      paintBench();
      svg.querySelector('#tare').addEventListener('click', function () {
        if (wait || st.inc) return;
        if (st.pan) { ER.sfx.no(); msg('&ldquo;Not with the bird on it,&rdquo; says Dr Hartnell. &ldquo;Then it would weigh nothing at all, which would be a great surprise to Mr Tredwell. Tare with the empty boat.&rdquo;'); return; }
        st.tare = 1; keep(); FG.sfx.beep(); paintBench();
        msg('TARE. The display drops from 4.2 to <b>0.0 g</b>: the balance has forgotten the boat. Now only what goes into it will count.');
      });
      svg.querySelector('#jug').addEventListener('click', function () {
        if (wait) return;
        if (st.poured) { msg('There is water enough in the cylinder already.'); return; }
        st.poured = 1; keep(); FG.sfx.pour(); paintBench();
        msg('Owen pours water into the cylinder, carefully, to about forty. Now read the level exactly, in the lens: click on it.');
      });
      svg.querySelector('#lens').addEventListener('click', function (e) {
        var p = ER.pt(svg, e), L = level(), c = st.poured ? L : 40, ml = c + (230 - p.y) / 40, r = Math.round(ml * 5) / 5, dx = Math.abs(p.x - 600);
        if (wait) return;
        if (!st.poured) { msg('The cylinder is empty. Click the jug first.'); return; }
        if (st.inc ? st.after !== null : st.before !== null) { msg('That level is on the sheet already.'); return; }
        if (Math.abs(ml - L) < 0.25) {
          r = L;
          if (st.inc) st.after = r; else st.before = r;
          keep(); FG.sfx.pencil(); paintBench();
          msg(st.inc ? '<b>' + f1(r) + ' ml</b> with the bird in. The water rose by ' + f1(st.after - st.before) + ' ml, and that is the bird&rsquo;s volume: ' + f1(st.after - st.before) + ' cm³. Now: density = mass ÷ volume.' : '<b>' + f1(r) + ' ml</b>, read at the bottom of the curve. Now lower the bird in: drag it into the cylinder.');
          return;
        }
        ER.sfx.no();
        if (Math.abs(ml - (L + 0.6)) < 0.3 || (ml > L && dx > 50)) msg('That is ' + f1(r) + ': the edge, where the water climbs up the glass. Read the <b>bottom</b> of the curve, in the middle, with your eye level with it.');
        else msg('That is ' + f1(r) + ' ml on the scale. The water is not there. Find the curved line of the surface.');
      });
      ER.$$('.btnx[data-k]', svg).forEach(function (b) {
        b.addEventListener('click', function () {
          if (wait) return;
          st.d = Math.round(FG.clamp(st.d + parseFloat(b.getAttribute('data-k')), 0, 25) * 10) / 10; keep(); FG.sfx.focus(); paintBench();
        });
      });
      ER.$$('.tile', svg).forEach(function (t) {
        t.addEventListener('click', function () {
          if (wait) return;
          st[t.getAttribute('data-g')] = t.getAttribute('data-v'); keep(); FG.sfx.pencil(); paintBench();
        });
      });
    }
    box.querySelector('#d-go').addEventListener('click', function () {
      var file, dstr = f1(st.d), vol;
      if (wait || nextFile) return;
      if (st.mass === null) { ER.sfx.no(); msg('The sheet is empty. Weigh the bird first.'); return; }
      if (st.before === null || st.after === null) { ER.sfx.no(); msg('&ldquo;A mass is half a density,&rdquo; says Dr Hartnell. &ldquo;We need its volume too: the cylinder, before and after.&rdquo;'); return; }
      if (!st.what || !st.swap) { ER.sfx.no(); msg('Two questions on the sheet still have no answer: what the bird is made of, and whether it has been changed since September.'); return; }
      vol = st.after - st.before;
      if (!ER.check('d', dstr)) {
        ER.sfx.no();
        msg(Math.abs(st.mass - BIRD) > 0.05 ? '&ldquo;Look at the mass,&rdquo; says Dr Hartnell. &ldquo;The balance was not set to zero with the boat on it, so 4.2 grams of that is plastic boat. Take the bird out, press TARE with the empty boat, and weigh it again.&rdquo;' :
          '&ldquo;Density is mass divided by volume,&rdquo; says Dr Hartnell. &ldquo;' + f1(st.mass) + ' divided by ' + f1(vol) + ' is not ' + dstr + '. Try the sum again.&rdquo;');
        return;
      }
      if (!ER.check('what', st.what)) {
        ER.sfx.no();
        msg(st.what === 'gold' ? '&ldquo;Gold is 19.3,&rdquo; says Dr Hartnell. &ldquo;A gold bird this size would weigh ' + f1(vol) + ' × 19.3: about ' + Math.round(vol * 19.3) + ' grams. Ours weighs ' + f1(st.mass) + '.&rdquo; Mr Tredwell takes his cap off, slowly.' :
          st.what === 'copper' ? '&ldquo;Copper is 9.0,&rdquo; says Dr Hartnell. &ldquo;Close. Look at the page again: which metal sits at your number?&rdquo;' : '&ldquo;Look at the table on page 18,&rdquo; says Dr Hartnell. &ldquo;Which metal has the density you found? Gold leaf on top adds almost nothing.&rdquo;');
        return;
      }
      if (!ER.check('swap', st.swap)) {
        ER.sfx.no();
        msg('Femi opens her folder without a word and holds out the receipt. <i>51 g on the owner&rsquo;s kitchen scales</i>, in September. Today, ' + f1(st.mass) + ' g. A gold bird of the same size would have weighed about ' + Math.round(vol * 19.3) + '. If somebody swapped it, they swapped it for itself.');
        return;
      }
      file = ER.exitOk([dstr + '-' + st.what + '-' + st.swap]);
      if (!file) { ER.sfx.no(); msg('Dr Hartnell reads the sheet twice and does not sign it.'); return; }
      wait = true; nextFile = file; ER.flag('b-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.stores = 1; ER.persist(true);
      FG.sfx.stamp(); msg('<b>8.5 grams in every cubic centimetre.</b> Dr Hartnell underlines it twice and signs. Brass, with a skin of gold leaf as thin as a breath.');
      setTimeout(function () {
        ER.closeAll(); FG.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Brass,&rdquo; says Mr Tredwell. He weighs the little bird in his big hand. &ldquo;Gran, you old fibber.&rdquo; But he says it kindly, and he holds it a moment longer than he needs to.',
          '&ldquo;Gilt, then,&rdquo; says Mr Garrick. &ldquo;People have always said gold when they mean gilt. It changes nothing.&rdquo; &ldquo;It changes one thing,&rdquo; says Dr Hartnell. &ldquo;Fifty-one grams in September, fifty-one today. Nobody has swapped anything. Miss Odum, you may stop looking at the floor.&rdquo;',
          'Owen lifts the panel, out of its frame now, and heads for the lift. &ldquo;Studio,&rdquo; he says. &ldquo;Mrs Mertens took her paint samples a fortnight ago, and her results came back on Thursday. Nobody&rsquo;s read them yet but Mr Garrick.&rdquo;',
          'Mr Garrick finds something very interesting to look at on the handle of his umbrella.'
        ], function () { busy = false; showGo(); });
      }, 3000);
    });
    draw(); wire();
    msg(step() === 'mass' ? 'On the left, a balance with an empty plastic boat on its pan. In the middle, a measuring cylinder, a jug, and a lens to read the level through. On the right, Dr Hartnell&rsquo;s sheet. The bird is on the cloth. Weigh it first.' :
      step() === 'vol' ? 'The bird is weighed. Now its volume: the cylinder, before and after.' : 'Mass and volume are on the sheet. Now the density, the metal, and September.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      step: step
    };
  }
})();
</script>
</body>
</html>
