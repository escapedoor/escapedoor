<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, srcBox = null, told = {}, stage = 0;

  /* shelves of bottles, the periodic table, the cupboards, six dishes on the tile */
  (function () {
    var s = '', r, i, x, w, h, c, y, seed = 11, GL = ['#6b3d1a', '#3d6b8a', '#8a8f6a', '#e9e6dc', '#3d8a5a', '#5a3a6b', '#b08a35', '#2a5aa0', '#7d2a1c'];
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (r = 0; r < 4; r++) {
      y = 150 + r * 104;
      s += '<rect x="300" y="' + y + '" width="900" height="12" fill="#4a3620"/><rect x="300" y="' + (y + 12) + '" width="900" height="5" fill="#2a1e10"/>';
      for (x = 312; x < 1180;) {
        w = 22 + Math.floor(rnd() * 22); h = 34 + Math.floor(rnd() * 44); c = GL[Math.floor(rnd() * GL.length)];
        if (r === 3 && x > 1070) break;
        s += '<rect x="' + x + '" y="' + (y - h) + '" width="' + w + '" height="' + h + '" rx="4" fill="' + c + '" opacity=".92"/>' +
          '<rect x="' + (x + w / 2 - 5) + '" y="' + (y - h - 9) + '" width="10" height="10" rx="2" fill="#2a2118"/>' +
          (rnd() < 0.7 ? '<rect x="' + (x + 3) + '" y="' + (y - h * 0.62) + '" width="' + (w - 6) + '" height="' + Math.min(18, h * 0.34) + '" fill="#f3efe0"/>' : '') +
          '<path d="M' + (x + 4) + ' ' + (y - h + 5) + 'v' + (h - 10) + '" stroke="#fff" stroke-width="2" opacity=".2"/>';
        x += w + 5 + Math.floor(rnd() * 7);
      }
    }
    s += '<rect x="288" y="60" width="14" height="420" fill="#3a2a18"/><rect x="1198" y="60" width="14" height="420" fill="#3a2a18"/>';
    $('#shelves').innerHTML = s; s = '';
    for (r = 0; r < 6; r++) for (i = 0; i < 16; i++) {
      if ((r === 0 && i > 0 && i < 15) || (r < 3 && r > 0 && i > 1 && i < 10)) continue;
      c = i < 2 ? '#e9a35a' : i > 11 ? '#9ac27a' : '#8fb4d9';
      s += '<rect x="' + (60 + i * 12.500) + '" y="' + (64 + r * 14) + '" width="11" height="12" fill="' + c + '"/>';
    }
    s += '<rect x="235" y="150" width="20" height="16" fill="#f3efe0" stroke="#b3261c" stroke-width="2"/><text x="245" y="162.500" class="sK" font-size="10" fill="#b3261c">Bf</text>';
    $('#ptc').innerHTML = s; s = '';
    for (i = -3; i < 9; i++) {
      x = i * 250 + 40;
      s += '<rect x="' + x + '" y="690" width="234" height="230" fill="#2c4a3d" stroke="#16261f" stroke-width="4"/><rect x="' + (x + 16) + '" y="706" width="202" height="198" fill="none" stroke="#3a5f4e" stroke-width="3"/><rect x="' + (x + 204) + '" y="780" width="10" height="44" rx="4" fill="#c9a23a"/>';
    }
    $('#cupb').innerHTML = s; s = '';
    for (i = 0; i < 6; i++) {
      x = 596 + i * 62;
      s += '<ellipse cx="' + x + '" cy="630" rx="24" ry="7" fill="#dfe7ea" stroke="#8a9298" stroke-width="2"/><ellipse cx="' + x + '" cy="628" rx="13" ry="3.500" fill="#fff"/>';
    }
    $('#tdish').innerHTML = s;
  })();

  ER.init({
    theme: 'forensic', story: 'fair', storyTitle: 'A Smell of Vinegar', id: 'prep', no: 'II', title: 'The Prep Room',
    go: 'Mrs Shrike unlocks the door',
    intro: [
      'Six prints went into the log. A loop&rsquo;s ridges turn round and go back out on the side they came in, and it has one delta. A whorl goes right round a centre and has two. An arch only rises in the middle, and has none. So bottle number 3 carried a loop, a whorl and a loop in sweat, an arch and a whorl in white powder, and there was one more powdery whorl on the bridge&rsquo;s board.',
      'Otis&rsquo;s ten fingers are loops and whorls. He has no arch. So the powdery arch, P4, cannot be his: a second person held that bottle, with the white powder already on their fingers.',
      '&ldquo;A friend of his,&rdquo; said Mrs Shrike. &ldquo;Perhaps,&rdquo; said Dr Novak. &ldquo;First I should like to know what the powder is.&rdquo;',
      'The prep room is the long cupboard between the two laboratories, where the science teachers keep everything that stains, smells or breaks.'
    ],
    exit: {"next":"office","w":{"c361233a":"11a89ca2"}}, tags: {"da":["f45b8802"],"db":["cd3b99d5"],"dc":["f1f09088"],"dd":["be42e5b7"],"de":["88d55012"],"df":["11a154b7"],"src":["c21e87c6"]},
    sound: ['lab', { root: 52, bpm: 80, drop: ['arp'] }],      /* drops fall and powders fizz in here: no plucked notes that could be taken for either */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('b-file') || null; told = ER.flag('b-told') || {}; stage = ER.flag('b-stage') || 0;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#tile').classList.toggle('ready', !!(told.card && told.list && !nextFile));
    ER.pips((told.card ? 1 : 0) + (told.list ? 1 : 0) + (stage ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['The tray is written up. Go up to the head teacher&rsquo;s office: the note is on her desk.']];
    if (srcBox && srcBox.parentNode) return ['source', [
      'Dishes A and B are the same stuff: mostly starch, with a little bicarbonate of soda in it. Something on the Science Department&rsquo;s list is exactly that.',
      'Read the note in red at the bottom of the list. Which table brought a flour that has a raising agent mixed into it already?'
    ]];
    if (bench && bench.isOpen()) return ['test', [
      'Each dish has two wells under it. Carry the vinegar to one well and let go; carry the iodine to the other. Do that for all six dishes before you write on any of them.',
      'Vinegar asks one question: is there bicarbonate in this? Iodine asks another: is there starch in this? Two of the dishes say no to both. For those two you need the lens, or the spoon and the flame.',
      'A dish may say yes to both questions. Then it is not one powder but two, mixed together, and there is a label for that.'
    ]];
    if (!told.card || !told.list) return ['read', [
      'Two papers hang on the tiles behind the bench: a card on the left with WHITE POWDERS on it, and a clipboard on the right. Read both.',
      'The card tells you how to test a powder. The clipboard tells you which powders were in the hall. You will need both before you touch the six dishes.'
    ]];
    return ['tile', ['Dr Novak has put six dishes on a white tile in the middle of the bench. Click the tile.']];
  }

  function begin() {
    paint();
    FAIR.mine('log', 'The scene log', '<p>P1 loop, P2 whorl, P3 loop: in sweat, on bottle 3. All three patterns are on Otis&rsquo;s card.</p><p>P4 ARCH and P5 whorl: in white powder, side by side on bottle 3. Two fingers of one hand.</p>' +
      '<p>P6 whorl: in white powder, on the bridge&rsquo;s board.</p><p>Otis has no arch on either hand. So P4 is not his.</p>', true);
    if (nextFile) { busy = false; showGo(); ER.say('The tray is written up. The note is waiting upstairs, on the head teacher&rsquo;s desk.'); return; }
    if (told.in) { busy = false; ER.say('The prep room, five past nine. Six dishes on a white tile.'); return; }
    tell('in');
    ER.narrate([
      'A narrow room that smells of gas and old coffee, with shelves up to the ceiling. In the corner a skeleton is wearing a paper crown.',
      'Dr Novak has set out six samples in small dishes on a white tile. &ldquo;Three from the hall, one from the top of Table 8, one from Otis&rsquo;s tub, and one I borrowed from Table 9, so that we can see what plain starch does.&rdquo;',
      '&ldquo;White powder is the easiest thing in the world to be wrong about,&rdquo; she says. &ldquo;They all look alike, and nobody is going to taste them.&rdquo;',
      'Mrs Shrike is standing in the doorway with her keys. &ldquo;Vinegar,&rdquo; she says. &ldquo;Put vinegar on it and it will fizz. I can tell you that from here.&rdquo;'
    ], function () { busy = false; FAIR.terms(['sample']); });
  }

  /* ---------- papers ---------- */
  var CARD = '<h4>WHITE POWDERS</h4><h5>Never taste. Never guess. Ask the powder four questions.</h5><div class="two"><div>' +

    /* the spoon and the flame */
    var loadEl = box.querySelector('#ts .load'), loaded = -1, heated = false, heatT = 0;
    function drawLoad(col) { loadEl.innerHTML = loaded < 0 ? '' : '<path class="melt" d="M-9 2q2 -10 9 -10t9 8q-9 6 -18 2z" fill="' + (col || '#fbfbf6') + '" stroke="#b9bfc2" stroke-width=".800" transform="rotate(-20)"/>'; }
    var spoon = FAIR.tool(svg, box.querySelector('#ts'), { x: 948, y: 420 }, {
      start: function () { clearTimeout(heatT); if (heated) { loaded = -1; heated = false; drawLoad(); } },
      end: function (p) {
        var i = dishAt(p), h;
        if (wait || nextFile || stage) { spoon.home(); return; }
        if (loaded < 0) {
          if (i < 0) { spoon.home(); return; }
          loaded = i; drawLoad(); spoon.set(CX(i) + 30, 110);
          msg('A little of dish <b>' + L(i) + '</b> on the spoon. Now carry it to the flame, and hold it there.');
          return;
        }
        if (Math.abs(p.x - 916) < 44 && p.y > 440 && p.y < 546) {
          spoon.set(916, 490); h = S[loaded].h; heated = true; i = loaded;
          if (h === 'melt') FAIR.sfx.sizzle();
          heatT = setTimeout(function () {
            var e = loadEl.querySelector('.melt');
            if (e) e.setAttribute('fill', h === 'melt' ? '#8a4a12' : h === 'scorch' ? '#b99a6a' : '#fbfbf6');
            seenH[i] = 1; keep();
            msg('Dish <b>' + L(i) + '</b> in the flame: ' + { melt: 'it melts into a clear liquid, turns golden, and then brown. The whole room smells of caramel.', crack: 'it gets hot. A grain or two cracks and jumps. Nothing melts.', dry: 'nothing that you can see. It is still a dry white powder.', scorch: 'it does not melt. It goes brown at the edges, and smells of burnt toast.' }[h]);
          }, 700);
          return;
        }
        loaded = -1; drawLoad(); spoon.home();
      }
    });
    /* writing on the tape */
    function closeMenu() { menu.style.display = 'none'; menu.innerHTML = ''; menuAt = -1; }
    ER.$$('.tape', svg).forEach(function (t) {
      t.addEventListener('click', function (e) {
        var i = +t.getAttribute('data-i'), x = Math.min(Math.max(CX(i) - 105, 10), 590), g = '', n = 0, c;
        e.stopPropagation();
        if (wait || nextFile || stage) return;
        if (menuAt === i) { closeMenu(); return; }
        if (!tested(i, 'v') || !tested(i, 'i')) { closeMenu(); msg('&ldquo;Not yet,&rdquo; says Dr Novak. &ldquo;Dish ' + L(i) + ' has not had both drops. Vinegar in one well, iodine in the other. Then you may write on it.&rdquo;'); return; }
        g = '<rect x="' + x + '" y="226" width="210" height="160" rx="5" fill="#27333a" opacity=".96"/>';
        for (c in NAMES) { g += '<g class="opt" data-v="' + c + '"><rect x="' + (x + 8) + '" y="' + (234 + n * 29) + '" width="194" height="25" rx="3"/><text x="' + (x + 105) + '" y="' + (252 + n * 29) + '" class="tK" font-size="13.500" fill="#1c1d22" text-anchor="middle">' + FULL[c] + '</text></g>'; n++; }
        menu.innerHTML = g; menu.style.display = ''; menuAt = i;
        ER.$$('.opt', menu).forEach(function (o) {
          o.addEventListener('click', function (ev) {
            var v = o.getAttribute('data-v'); ev.stopPropagation(); closeMenu();
            if ((v === 't' || v === 's') && !seenL[i] && !seenH[i]) { msg('&ldquo;Salt or sugar?&rdquo; says Dr Novak. &ldquo;Two drops cannot tell you that. Look at the grains of dish ' + L(i) + ' through the lens, or hold some in the flame. Then write.&rdquo;'); return; }
            lab[i] = v; keep(); FAIR.sfx.scratch(); drawTape(i);
          });
        });
      });
    });
    svg.addEventListener('click', closeMenu);
    function why(i) {
      var c = lab[i], o = S[i], d = 'dish ' + L(i);
      if (c === 'b') return o.o ? 'You have written BICARBONATE on ' + d + '. It fizzed, and that is true. But look at its other well. Plain bicarbonate has no starch in it: the iodine would have stayed brown.' : 'BICARBONATE on ' + d + '? The vinegar did nothing to it at all.';
      if (c === 'c') return o.v ? 'You have written STARCH on ' + d + '. The iodine says that there is starch in it, and that is true. But plain starch does not fizz, and this did. Each test answers one question.' : 'STARCH on ' + d + '? The iodine stayed brown.';
      if (c === 'm') return 'STARCH + BICARBONATE on ' + d + '? Then it must say yes to the vinegar and yes to the iodine. Did it do both?';
      if (o.v || o.o) return FULL[c] + ' on ' + d + '? ' + (c === 't' ? 'Salt' : 'Sugar') + ' says no to the vinegar and no to the iodine. This dish did not.';
      if (!seenL[i] && !seenH[i]) return FULL[c] + ' on ' + d + '. It said no twice, so you are in the right part of the card. But you have not looked at its grains through the lens, or held any in the flame. That is a guess.';
      return c === 't' ? 'SALT on ' + d + '? Salt crystals are cubes, and salt will not melt in a flame like ours. Look at this one again.' : 'SUGAR on ' + d + '? Sugar crystals have slanting ends, and sugar melts and goes brown. Look at this one again.';
    }
    box.querySelector('#p-sign').addEventListener('click', function () {
      var i;
      if (wait || nextFile) return;
      closeMenu();
      if (stage) { openSource(); return; }
      for (i = 0; i < 6; i++) if (lab[i] === '-') { msg('&ldquo;Six dishes, six labels,&rdquo; says Dr Novak. &ldquo;Dish ' + L(i) + ' has nothing written on it.&rdquo;'); return; }
      for (i = 0; i < 6; i++) if (!ER.check('d' + 'abcdef'.charAt(i), lab[i])) {
        ER.sfx.no(); ER.shake(box.querySelector('.tape[data-i="' + i + '"]'));
        msg('Dr Novak peels a label off again. &ldquo;' + why(i) + '&rdquo;');
        lab[i] = '-'; keep(); drawTape(i); return;
      }
      stage = 1; ER.flag('b-stage', 1); paint(); FAIR.sfx.stamp(); wait = true;
      msg('Dr Novak reads along the row of labels and nods. &ldquo;Six out of six. Now look at A and B together. What in that hall was <b>that</b>? You have the Science Department&rsquo;s list.&rdquo;');
      setTimeout(function () { wait = false; openSource(); }, 3400);
    });
    drawAll();
    msg('Six dishes, A to F. Under each one are two wells with a pinch of it in them. On the right: vinegar, iodine, a lens, and a spoon for the flame. Pick things up and carry them.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }

  /* ---------- where did it come from? ---------- */
  var NOPE = {
    bic: 'Bicarbonate of soda has no starch in it. Dish C is the proof: its iodine stayed brown.', vin: 'That is a liquid. Dishes A and B are a powder.', dye: 'That is a liquid, and it is red.',
    non: 'Table 7 brought no powders at all. That is what the list says.', pf: 'Plain flour is starch and nothing else. It would not have fizzed, not even a little.',
    su: 'Sugar said no to both tests. A and B said yes to both.', sa: 'Salt said no to both tests. A and B said yes to both.', cf: 'Cornflour is dish F: starch and nothing else. It did not fizz.',
    sa2: 'Salt said no to both tests. A and B said yes to both.', su2: 'Sugar said no to both tests. A and B said yes to both.'
  };
  function openSource() {
    if (!srcBox) {
      srcBox = ER.el('div', 'src', '<div class="doc matlist">' + listHtml(true) + '</div><p class="pmsg"></p>');
      var m = srcBox.querySelector('.pmsg');
      m.innerHTML = ER.gloss('Dishes A and B are the same: starch with a little bicarbonate in it. Which thing on this list is that? Click it.');
      ER.$$('.it', srcBox).forEach(function (n) {
        n.addEventListener('click', function () {
          var k = n.getAttribute('data-k'), file;
          if (nextFile || n.classList.contains('no')) return;
          if (!ER.check('src', k)) { ER.sfx.no(); n.classList.add('no'); m.innerHTML = ER.gloss('&ldquo;No,&rdquo; says Dr Novak. &ldquo;' + (NOPE[k] || 'Not that.') + '&rdquo;'); return; }
          file = ER.exitOk([(ER.flag('b-lab') || '') + '-' + k]);
          if (!file) { m.textContent = 'The tray will not close. Something is wrong with this page: tell your teacher.'; return; }
          nextFile = file; ER.flag('b-file', file);
          var s0 = ER.state(); s0.done = s0.done || {}; s0.done.prep = 1; ER.persist(true);
          n.style.background = '#f0b429'; FAIR.sfx.stamp();
          m.innerHTML = ER.gloss('Dr Novak says nothing for a moment. Then she writes it on the tray, in capitals, and underlines it twice.');
          setTimeout(function () {
            ER.closeAll(); FAIR.solved(); paint(); busy = true;
            ER.narrate([
              'Dr Novak puts the stopper back in the iodine. &ldquo;Well,&rdquo; she says. &ldquo;It fizzed. The caretaker was quite right about that. So were you, Mrs Shrike.&rdquo;',
              'Mrs Shrike has stopped looking at her watch. She is looking at the clipboard instead, and at one line of it.',
              '&ldquo;There is still the note,&rdquo; she says at last. &ldquo;Somebody wrote that note. It is on my desk.&rdquo;',
              '&ldquo;Then that is where we are going,&rdquo; says Dr Novak.'
            ], function () { busy = false; showGo(); });
          }, 2600);
        });
      });
    }
    ER.open('ov-lock', srcBox);
  }
})();
</script>
