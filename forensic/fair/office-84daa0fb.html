<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, ink = null, told = {};

  /* panelling, rain, the faces in the long photograph, three glasses */
  (function () {
    var s = '', i, x, y;
    for (i = -4; i < 20; i++) s += '<path d="M' + (i * 130 + 20) + ' 438v206"/>';
    $('#panels').innerHTML = s; s = '';
    for (i = 0; i < 44; i++) { x = 1090 + (i * 83) % 360; y = 120 + (i * 47) % 380; s += '<path d="M' + x + ' ' + y + 'l-4 20"/>'; }
    $('#rain').innerHTML = s; s = '';
    for (i = 0; i < 66; i++) s += '<circle cx="' + (640 + (i % 22) * 10) + '" cy="' + (352 + Math.floor(i / 22) * 13) + '" r="3.500"/>';
    $('#heads').innerHTML = s; s = '';
    [820, 890, 960].forEach(function (gx) {
      s += '<rect x="' + (gx - 6) + '" y="566" width="12" height="84" fill="#fbfaf2"/><path d="M' + (gx - 24) + ' 590l4 66h40l4 -66" fill="#dfeffb" fill-opacity=".14" stroke="#dfeffb" stroke-width="2.500"/><path d="M' + (gx - 20) + ' 644h40" stroke="#9fd0ea" stroke-width="6" opacity=".5"/>';
    });
    $('#tum').innerHTML = s;
  })();

  ER.init({
    theme: 'forensic', story: 'fair', storyTitle: 'A Smell of Vinegar', id: 'office', no: 'III', title: 'The Head’s Office',
    go: 'Go in',
    intro: [
      'Vinegar asks one question: is there bicarbonate here? Iodine asks another: is there starch? The powder from the hall floor said yes to both. It fizzed, as the caretaker saw, but only a little, and the iodine turned it blue-black. Otis&rsquo;s bicarbonate froths, and leaves iodine brown. They are not the same powder.',
      'Starch with a little bicarbonate mixed into it is self-raising flour, and one table in the hall had some: Table 8, WHY DO CAKES RISE?, which belongs to the Castell twins. The same flour was on the fingers that left the arch on Otis&rsquo;s bottle. (The salt by the main door came in on somebody&rsquo;s shoes, off the icy steps. It has nothing to do with anything.)',
      '&ldquo;So it was the Castells,&rdquo; said Mrs Shrike on the stairs. &ldquo;I would not have thought it of them.&rdquo; &ldquo;It was their flour,&rdquo; said Dr Novak. &ldquo;That is all that six dishes can tell us. Now, about that note.&rdquo;'
    ],
    exit: {"next":"van","w":{"b32eab24":"f5e25750"}}, tags: {"pen":["f0728e1c"],"rb":["0c959bec"],"rp":["5539a615"],"ry":["b94a2f53"]},
    sound: ['lab', { root: 47, bpm: 66, drop: ['arp'] }],      /* a quiet room with a great deal to read and to measure: slower, and nothing plucked */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('c-file') || null; told = ER.flag('c-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('c-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#glasses').classList.toggle('ready', !!(told.manual && told.note && !nextFile));
    ER.pips((told.note ? 1 : 0) + (told.manual ? 1 : 0) + (ER.flag('c-stage') ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['The tag is signed and tied to the bag. The rest of the work is in the laboratory&rsquo;s van, out in the car park.']];
    if (ink && ink.isOpen()) return ink.stage() ? ['read', [
      'Drag the ruler to a strip, with its zero on the pencil line. Read where the middle of each colour is, and where the water stopped.',
      'Rf = how far the dye went ÷ how far the water went. On the note&rsquo;s strip the water went 5 cm, not 10. Work out the three numbers for the note, and set the three wheels on the tag.',
      'Now work out the same three numbers for pen 1 and for pen 3. Do not trust your eye: the strips are not the same length. Which pen has the note&rsquo;s numbers?'
    ]] : ['setup', [
      'Each pen makes one dot, on the pencil line of the strip with its own number: carry the pen to the strip and let go. Then every glass needs water: hold the mouse button down on a glass to pour.',
      'Stop pouring while the water is still below the dot. It must touch the bottom of the paper, and it must not reach the ink. If the dot goes under, the ink washes out into the glass.'
    ]];
    if (!told.note || !told.manual) return ['look', [
      'Two things on the desk first: the clear bag with the note in it, and Dr Novak&rsquo;s field manual, lying open at the left-hand end.',
      'The manual explains how to ask ink where it came from. Read page 14 before you touch the three glasses.'
    ]];
    return ['glasses', ['Three glasses are standing on the green blotter in the middle of the desk, with a strip of filter paper hanging in each. Click them.']];
  }

  function begin() {
    paint();
    FAIR.mine('dishes', 'Six dishes', '<p>A (floor under the bridge) and B (beside print P4): they fizz a little, and iodine turns them blue-black. Starch + bicarbonate = self-raising flour, from Table 8.</p>' +
      '<p>C, Otis&rsquo;s tub: froths, stays brown. Bicarbonate, and nothing like A.</p><p>D salt (off the icy steps), E sugar, F cornflour.</p><p>The powder in the hall is not Otis&rsquo;s.</p>', true);
    if (nextFile) { busy = false; showGo(); ER.say('The tag is signed. Dr Novak is putting her coat on.'); return; }
    if (told.in) { busy = false; ER.say('The head teacher&rsquo;s office, twenty-five past nine.'); return; }
    tell('in');
    ER.narrate([

      }
      s += '<path d="M700 390h270" stroke="#8a6a3a" stroke-width="2"/><text x="708" y="420" class="tB" font-size="17" fill="#3a2414" letter-spacing="2">THE SAME INK AS PEN</text>';
      for (j = 1; j <= 3; j++) s += '<g class="pn" data-p="' + j + '"><circle cx="' + (700 + j * 68) + '" cy="462" r="24"/><text x="' + (700 + j * 68) + '" y="471" class="tK" font-size="26" fill="#1c1d22" text-anchor="middle">' + j + '</text></g>';
      s += '<text x="708" y="522" class="tH" font-size="16" fill="#5a4630">measured by: _______ &#183; checked: M.N.</text></g>';
      /* the ruler: its own drawing starts from its zero */
      s += '<g id="rul" class="tool"><rect x="0" y="-378" width="44" height="394" rx="3" fill="#e9c98a" stroke="#8a6a3a" stroke-width="1.500"/>';
      for (i = 0; i <= 120; i++) s += '<path d="M0 ' + (-i * 3) + 'h' + (i % 10 === 0 ? 17 : i % 5 === 0 ? 12 : 6) + '" stroke="#3a2414" stroke-width="' + (i % 5 === 0 ? 1.2 : 0.7) + '"/>' + (i % 10 === 0 ? '<text x="30" y="' + (-i * 3 + 4.5) + '" class="tM" font-size="12" fill="#3a2414" text-anchor="middle">' + (i / 10) + '</text>' : '');
      s += '<text x="30" y="-366" class="tM" font-size="8" fill="#3a2414" text-anchor="middle">cm</text></g>';
      svg.innerHTML = s;
      goBtn.textContent = 'Sign the tag'; goBtn.disabled = false;
      var rul = FAIR.tool(svg, svg.querySelector('#rul'), { x: 636, y: 560 }, {
        end: function (p) {
          var x = p.x, k, best = -1;
          for (k = 0; k < 4; k++) if (Math.abs(x - (SX[k] + 32)) < 40) best = k;
          if (best >= 0 && Math.abs(p.y - Y0) < 30) { rul.set(SX[best] + 32, Y0); FAIR.sfx.clip(); }
        }
      }, [20, 380, 660, 590]);
      function draw() {
        for (var j = 0; j < 3; j++) svg.querySelector('#wv' + j).textContent = (wh[j] / 100).toFixed(2);
        ER.$$('.pn', svg).forEach(function (n) { n.classList.toggle('on', +n.getAttribute('data-p') === pen); });
      }
      ER.$$('.wh', svg).forEach(function (n) {
        n.addEventListener('click', function () {
          var j = +n.getAttribute('data-j');
          if (wait || nextFile) return;
          wh[j] = Math.max(0, Math.min(100, wh[j] + (+n.getAttribute('data-d')))); ER.flag('c-w', wh); ER.sfx.tick(); draw();
        });
      });
      ER.$$('.pn', svg).forEach(function (n) {
        n.addEventListener('click', function () { if (wait || nextFile) return; pen = +n.getAttribute('data-p'); ER.flag('c-pen', pen); FAIR.sfx.clip(); draw(); });
      });
      goBtn.onclick = function () {
        var KEY = ['rb', 'rp', 'ry'], j, bad = -1, file;
        if (wait || nextFile) return;
        if (!wh[0] && !wh[1] && !wh[2]) { msg('The three wheels on the tag are still at nought. Measure the note&rsquo;s strip first: how far each colour went, and how far the water went.'); return; }
        for (j = 0; j < 3; j++) if (!ER.check(KEY[j], wh[j])) { bad = j; break; }
        if (bad >= 0) {
          ER.sfx.no(); ER.shake(svg.querySelector('#wv' + bad));
          if (wh[0] === 45 && wh[1] === 30 && wh[2] === 15) msg('&ldquo;You have divided by ten,&rdquo; says Dr Novak. &ldquo;Put the ruler against the note&rsquo;s strip again. How far did the water get on <b>that</b> one?&rdquo;');
          else if (wh[bad] > 100 || (wh[0] <= wh[1] || wh[1] <= wh[2])) msg('&ldquo;Blue went furthest, then purple, then yellow,&rdquo; says Dr Novak. &ldquo;Your numbers should go the same way. Rf is the dye&rsquo;s distance divided by the water&rsquo;s, both measured from the pencil line.&rdquo;');
          else msg('&ldquo;Check the ' + WL[bad].toLowerCase() + ' one,&rdquo; says Dr Novak. &ldquo;The middle of the band, from the pencil line. Then the dotted line where the water stopped, from the pencil line. Divide the first by the second.&rdquo;');
          return;
        }
        if (!pen) { msg('&ldquo;Those are the note&rsquo;s three numbers,&rdquo; says Dr Novak. &ldquo;Now do the same sum for the pens, and tell me which pen has them.&rdquo;'); return; }
        if (!ER.check('pen', pen)) {
          ER.sfx.no(); ER.shake(svg.querySelector('.pn.on'));
          if (pen === 2) msg('&ldquo;Pen 2 never left its pencil line,&rdquo; says Dr Novak. &ldquo;Its ink does not dissolve in water at all, and the note&rsquo;s ink does. Whatever wrote the note, it was not that.&rdquo;');
          else msg('&ldquo;Pen 1,&rdquo; says Mrs Shrike, leaning over the desk. &ldquo;Anybody can see it. The colours are level.&rdquo; &ldquo;Level,&rdquo; says Dr Novak, &ldquo;on a strip twice as long. Work out the Rf values of pen 1 before you sign for it.&rdquo;');
          pen = 0; ER.flag('c-pen', 0); draw(); return;
        }
        file = ER.exitOk([pen + '-' + wh.join('-')]);
        if (!file) { msg('The tag will not tie. Something is wrong with this page: tell your teacher.'); return; }
        wait = true; nextFile = file; ER.flag('c-file', file);
        var s0 = ER.state(); s0.done = s0.done || {}; s0.done.office = 1; ER.persist(true);
        FAIR.sfx.stamp(); msg('Dr Novak checks your three sums with the ruler, and then does the six for pens 1 and 3 herself. She writes M.N. on the tag and ties it to the bag.');
        setTimeout(function () {
          ER.closeAll(); FAIR.solved(); paint(); busy = true;
          ER.narrate([
            'Mrs Shrike looks at the three pens on her desk for some time. Then she looks at their tickets.',
            '&ldquo;That makes no sense at all,&rdquo; she says.',
            '&ldquo;Not yet,&rdquo; says Dr Novak. &ldquo;But ink can only tell us which pen. It cannot tell us whose hand. There is one thing left that can, and the lamp for it is in the van.&rdquo;',
            'She picks up the bag with the bottle in it, and the box of cards. &ldquo;Coat,&rdquo; she says to you. &ldquo;It is raining.&rdquo;'
          ], function () { busy = false; showGo(); });
        }, 2800);
      };
      draw();
      msg('Four strips, dry. The note&rsquo;s is the short one: it was all the paper Dr Novak had left. Drag the ruler to a strip and put its zero on the pencil line.');
    }
    if (stage) reading(); else setup();
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return stage; }
    };
  }
})();
</script>
