<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, lock = null, told = {};

  /* seams, rain, drawers */
  (function () {
    var s = '', i, x, y, D = ['TAPE', 'POWDERS', 'BRUSHES', 'BAGS', 'FORMS'];
    for (i = -4; i < 12; i++) s += '<path d="M' + (i * 220 + 130) + ' 30v610"/>';
    $('#seams').innerHTML = s; s = '';
    for (i = 0; i < 40; i++) { x = 1180 + (i * 67) % 290; y = 110 + (i * 43) % 290; s += '<path d="M' + x + ' ' + y + 'l-4 20"/>'; }
    $('#rain').innerHTML = s; s = '';
    for (i = 0; i < 5; i++) {
      y = 148 + i * 98;
      s += '<rect x="76" y="' + y + '" width="258" height="84" fill="none" stroke="#59646a" stroke-width="3"/><rect x="170" y="' + (y + 16) + '" width="70" height="12" rx="6" fill="#59646a"/>' +
        '<rect x="160" y="' + (y + 42) + '" width="90" height="24" fill="#fdfdf8"/><text x="205" y="' + (y + 59) + '" class="sM" font-size="13" fill="#1c1d22">' + D[i] + '</text>';
    }
    $('#drw').innerHTML = s;
  })();

  ER.init({
    theme: 'forensic', story: 'fair', storyTitle: 'A Smell of Vinegar', id: 'van', no: 'IV', title: 'The Van',
    go: 'Run across the car park',
    intro: [
      'Black ink is a mixture of dyes, and water pulls it apart. Pen 2, Otis&rsquo;s marker, never moved: its ink does not dissolve in water, and the note&rsquo;s ink does. That left two.',
      'The colours of the note stood level with the colours of pen 1, the pen on the string by the hall door, and Mrs Shrike was pleased. But the note&rsquo;s strip was a short one: its water had climbed 5 cm, not 10. An Rf value is the dye&rsquo;s distance divided by the water&rsquo;s. The note gave 0.9, 0.6 and 0.3. Pen 1 gave 0.45, 0.3 and 0.15. Pen 3 gave 0.9, 0.6 and 0.3.',
      'Pen 3 is the fine black pen from the pencil tin on Table 7. The note was written with Annika Lindqvist&rsquo;s own pen.',
      '&ldquo;Then he took it out of her tin,&rdquo; said Mrs Shrike. &ldquo;Then his fingers will be on it,&rdquo; said Dr Novak. &ldquo;We shall look. But first I want the two white prints on that bottle, and everything for those is in the van.&rdquo;'
    ],
    exit: {"next":"judging","w":{"28812bda":"574e8485"}}, tags: {},
    sound: ['lab', { root: 45, bpm: 76, mood: 'tense', drop: ['arp'], beds: [['rain', 0.8]] }],      /* twenty minutes left, and rain on a steel roof */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('d-file') || null; told = ER.flag('d-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#cardbox').classList.toggle('ready', !!(told.chart && !nextFile));
    ER.pips((told.chart ? 1 : 0) + ((ER.flag('d-out') || []).length) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['The comparison is signed. Open the envelope.']];
    if (lock && lock.isOpen()) return lock.comparing() ? ['detail', [
      'Click a red ring on the left-hand print and look hard at what is inside it. Does the ridge simply stop (a ridge ending)? Does one ridge split into two (a bifurcation)? Or is it a short piece standing alone (an island)?',
      'Both prints are the same way up, with a blue cross on the core. Count the ridges from the cross out to the ring, and notice the direction, like the hand of a clock. The print from the bottle is a little twisted and squashed, so trust your count more than your eye. Then choose the kind of detail, and click the same place on the right-hand print.',
      'If the detail is really not there on the card, say so with the last button. Two real differences rule a finger out, and you go back to the box for the next hand. On the right finger, all six are there.'
    ]] : ['hands', [
      'P4 is an arch and P5 is a whorl, and they lay side by side. So you want a card on which an arch and a whorl are neighbours on the same hand. Arches are rare: find those first, and use the lens.',
      'There are four arches in the box, on four different cards. One of them has only loops beside it. Click the whorl that sits next to each of the other three, one at a time.'
    ]];
    if (!told.chart) return ['chart', [
      'Before you open the box, read the chart that is pinned to the wall of the van, over the bench: RIDGE DETAILS.'
    ]];
    return ['box', ['The box of cards is on the bench, to the right of the machine with the two round screens. Click it.']];
  }

  function begin() {
    paint();
    FAIR.mine('inks', 'Four strips', '<p>Rf = the dye&rsquo;s distance ÷ the water&rsquo;s distance.</p><p>The note (water 5 cm): 0.9, 0.6, 0.3.</p><p>Pen 1, the hall door (water 10 cm): 0.45, 0.3, 0.15. Level with the note, and not the same.</p>' +
      '<p>Pen 2, Otis&rsquo;s marker: did not move.</p><p>Pen 3, from the tin on Table 7: 0.9, 0.6, 0.3. This pen wrote the note.</p>', true);
    if (nextFile) { busy = false; showGo(); ER.say('The comparison is signed. Dr Novak is holding out the envelope.'); return; }
    if (told.in) { busy = false; ER.say('The van, twenty to ten. Rain on the roof.'); return; }
    tell('in');
    ER.narrate([
      'The back of the laboratory&rsquo;s van: a steel bench, a hard white light, and rain on the roof like somebody pouring out a bag of rice.',
      'Across the car park one window of the school is still lit. In the only other car a man is sitting quite still.',
      'Dr Novak pours two cups of tea from a flask and puts the box of cards on the bench. &ldquo;Eight people made a card at our stand this afternoon. Otis&rsquo;s is number 6, and we know all about that one. Seven are left. They have numbers and no names. The names are in this envelope, and it stays shut until we have finished.&rdquo;',
      '&ldquo;Why?&rdquo;',
      '&ldquo;Because if I know whose card I am looking at, I shall start to see what I expect to see. Everybody does. Mrs Shrike is not a fool. She only knew the answer before she looked.&rdquo;',
      '&ldquo;Your arch and your whorl, P4 and P5, lay side by side on that bottle in the same flour. Two neighbouring fingers of one hand. So first find me the hands. Then I shall show you how to be sure of a finger.&rdquo;'
    ], function () { busy = false; });
  }

        var p = ER.pt(svg, e), pt = { x: R.core[0] + (p.x - WX[1] - WS / 2) / SC, y: R.core[1] + (p.y - WY) / SC - 38 }, k = sel, here, there;
        if (wait || nextFile) return;
        if (st[k]) { msg('Number ' + (k + 1) + ' is done. Click another ring on the left.'); return; }
        if (!kind) { msg('First say what number ' + (k + 1) + ' is: a ridge ending, a bifurcation or an island. The three buttons are on the right.'); return; }
        if (kind !== P[k].t) {
          ER.sfx.no(); bad++;
          msg('&ldquo;Is number ' + (k + 1) + ' a ' + KIND[kind] + '?&rdquo; says Dr Novak. &ldquo;Look again. ' + { e: 'A ridge ending is a ridge that simply stops, with its neighbours closing in round it.', f: 'In a bifurcation one ridge splits into two, and all three arms are joined.', i: 'An island is short, and it touches nothing at either end.' }[kind] + '&rdquo;');
          kind = ''; draw(); return;
        }
        there = near(want(k), kind, 5.5); here = near(pt, kind, TOL);
        if (there && here === there) {
          st[k] = 'ok'; FAIR.sfx.clip();
          if (!done(k)) msg('Number ' + (k + 1) + ' <b>agrees</b>: the same kind of detail, in the same place.' + (agreed() === 1 ? ' One proves nothing: one can agree by chance. Go on.' : ' That is ' + agreed() + ' of the six.'));
          return;
        }
        ER.sfx.no(); bad++;
        msg(here ? 'There is a ' + KIND[kind] + ' where you clicked, but it is not in the same place as number ' + (k + 1) + '. Count the ridges out from the blue cross, on both prints.' :
          'There is no ' + KIND[kind] + ' where you clicked. Count the ridges out from the blue cross to number ' + (k + 1) + ', and go the same way on the card. If it is truly not there, say so.' +
          (bad > 5 ? ' &ldquo;You are prodding,&rdquo; says Dr Novak. &ldquo;Stop, and count.&rdquo;' : ''));
      });
      draw();
      msg('Left: P5, from the bottle. Right: card ' + card + ', ' + fname(f) + ', the same size and the same way up. Click a ring, say what it is, then show Dr Novak the same detail on the card.');
    }
    function back() {
      if (wait) return;
      comp = null; gCmp.style.display = 'none'; gCmp.innerHTML = ''; gBox.style.display = ''; svg.setAttribute('viewBox', '0 0 1000 600'); backBtn.style.display = 'none'; signBtn.style.display = 'none';
      drawBox();
      msg(out.length ? out.length + (out.length === 1 ? ' finger is' : ' fingers are') + ' ruled out. Which other hand in the box has an arch beside a whorl?' : 'Seven cards. Find a hand with an arch beside a whorl, and click the whorl.');
    }
    backBtn.addEventListener('click', back);
    signBtn.addEventListener('click', function () {
      var file;
      if (wait || nextFile || !comp || signBtn.disabled) return;
      file = ER.exitOk([comp.card + '-' + comp.f]);
      if (!file) { msg('The form will not sign. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('d-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.van = 1; ER.persist(true);
      FAIR.sfx.stamp(); msg('Your name, and under it: M. Novak. She blows on the ink.');
      setTimeout(function () {
        ER.closeAll(); FAIR.solved(); paint(); busy = true;
        try { ER.mood('calm'); } catch (e) {}
        ER.narrate([
          '&ldquo;A number,&rdquo; says Dr Novak. &ldquo;That is all we have, and all we wanted. We did not go looking for a person. We let the finger tell us.&rdquo;',
          'She takes the brown envelope off the bench and looks at the seal. Then she holds it out to you.',
          '&ldquo;You found it. You open it.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 2600);
    });
    drawBox();
    msg('Seven cards, seventy fingers. On the left, the two white prints from the bottle. The lens is yours. Find a hand with an arch beside a whorl, and click the whorl.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      comparing: function () { return !!comp; }
    };
  }
})();
</script>
