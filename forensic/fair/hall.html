      file = ER.exitOk([st.join('') + '-' + tag]);
      if (!file) { msg('The log will not close. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.hall = 1; ER.persist(true);
      FAIR.sfx.stamp(); msg('Dr Novak reads the six lines twice, and writes her initials at the bottom. &ldquo;Good,&rdquo; she says. &ldquo;Now we know what kind of question to ask.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); FAIR.solved(); paint(); busy = true;
        ER.narrate([
          'Mrs Shrike has come back from the telephone. She looks at the six white cards, and at the red tag, for longer than she meant to.',
          '&ldquo;A friend of his, then,&rdquo; she says at last. &ldquo;A helper.&rdquo;',
          '&ldquo;Perhaps,&rdquo; says Dr Novak. &ldquo;That is a second way of reading it. Before I choose, I should like to know what this white powder is.&rdquo;',
          '&ldquo;It fizzed,&rdquo; says Mrs Shrike. &ldquo;We know what it is.&rdquo; But she takes a bunch of keys out of her pocket. &ldquo;The prep room has everything you will need. This way.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 2600);
    });
    FAIR.lens(svg, { x: 596, y: 152, r: 60, zoom: 2.5, href: '#hworld', lim: [40, 40, 960, 560] });
    draw();
    msg(nLift() ? 'The log is waiting: ' + nLift() + ' of the six prints are on cards.' : 'Bottle number 3, on a clean sheet, and a piece of the board that the bridge stood on. Two white prints on the bottle and one on the board are plain to see. The others are still hiding.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: nLift
    };
  }
})();
</script>
