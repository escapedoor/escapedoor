        s += '<g class="cand" data-v="' + c[0] + '"><rect x="' + x + '" y="14" width="152" height="372" rx="8" fill="#16181b"/>' + CAKE.clog({ x: x + 78, y: 38, s: 12.4, ink: '#f4f1e8', bg: '#16181b', marks: c[4] }) + '<rect class="fr" x="' + x + '" y="14" width="152" height="372" rx="8"/>' +
          '<circle cx="' + (x + 24) + '" cy="412" r="15" fill="#17324d"/><text x="' + (x + 24) + '" y="418" class="tB" font-size="19" fill="#fff" text-anchor="middle">' + c[1] + '</text><text x="' + (x + 46) + '" y="408" class="tB" font-size="13.500" fill="#3a2f28" letter-spacing=".800">' + c[2] + '</text><text x="' + (x + 46) + '" y="424" class="tH" font-size="14.500" fill="#3a2f28">' + c[3] + '</text><text x="' + (x + 76) + '" y="448" class="tM" font-size="12" fill="#56616c" text-anchor="middle">size 6 · left shoe</text></g>';
      });
      /* the report */
      s += '<rect x="816" y="14" width="172" height="576" fill="#fbf5e6"/><rect x="816" y="14" width="172" height="8" fill="#17324d"/><text x="828" y="46" class="tB" font-size="15" fill="#17324d" letter-spacing="2.500">FINDING 4</text><text x="828" y="64" class="tB" font-size="15" fill="#17324d" letter-spacing="2.500">THE PRINT</text>' +
        '<text x="828" y="96" class="tS" font-size="13" fill="#1b2430">The sole is</text><g class="stp" data-d="-1"><rect x="828" y="104" width="30" height="30" rx="3"/><path d="M848 111l-10 8 10 8z" fill="#17324d"/></g>' +
        '<rect x="862" y="104" width="52" height="30" fill="#fff" stroke="#8a8676" stroke-width="1.200"/><text id="lenv" x="888" y="126" class="tM" font-size="20" fill="#1b2430" text-anchor="middle"></text><g class="stp" data-d="1"><rect x="918" y="104" width="30" height="30" rx="3"/><path d="M928 111l10 8 -10 8z" fill="#17324d"/></g><text x="956" y="126" class="tS" font-size="13" fill="#1b2430">cm</text>' +
        '<text x="828" y="164" class="tS" font-size="13" fill="#1b2430">long, so the walker</text><text x="828" y="181" class="tS" font-size="13" fill="#1b2430">was about</text>' +
        pickG('ht', '145', 828, 190, 72, '1.45 m') + pickG('ht', '160', 906, 190, 72, '1.60 m') + pickG('ht', '175', 828, 222, 72, '1.75 m') + pickG('ht', '190', 906, 222, 72, '1.90 m') +
        '<text x="828" y="282" class="tS" font-size="13" fill="#1b2430">Not from the factory:</text><g id="ticks"></g>' +
        '<text x="828" y="372" class="tS" font-size="13" fill="#1b2430">The print was made by</text><text x="828" y="389" class="tS" font-size="13" fill="#1b2430">the shoe of test print</text><rect x="872" y="402" width="60" height="60" rx="4" fill="#fff" stroke="#8a8676" stroke-width="1.200"/><text id="solev" x="902" y="447" class="tB" font-size="44" fill="#17324d" text-anchor="middle"></text>' +
        '<path d="M828 540h148" stroke="#1b2430" stroke-width="1" stroke-dasharray="2 3"/><text x="828" y="556" class="tM" font-size="10.500" fill="#56616c">signed</text>';
      /* the scale */
      s += '<g class="tool" id="rul"><rect x="-4" y="-424" width="44" height="432" fill="#fdfdfb" stroke="#56616c" stroke-width="1.500"/>';
      for (i = 0; i <= 28; i++) s += '<path d="M-4 ' + (-i * LS) + 'h' + (i % 2 ? 9 : 15) + '" stroke="#1b2430" stroke-width="' + (i % 2 ? 1.2 : 2) + '"/>' + (i % 2 ? '' : '<text x="16" y="' + (-i * LS + 5) + '" class="tM" font-size="13" fill="#1b2430">' + i + '</text>');
      s += '</g>';
      svg.innerHTML = s;
      var rul = CAKE.tool(svg, svg.querySelector('#rul'), { x: 262, y: 584 }, {
        start: function () { return !wait && !nextFile; },
        end: function (p) {
          if (Math.abs(p.y - (LY + 26 * LS)) < 12) {
            rul.set(234, LY + 26 * LS); ruled = true; ER.flag('c-rul', 1); CAKE.sfx.snip();
            svg.querySelector('#toeline').style.display = ''; svg.querySelector('#heelline').style.display = '';
            msg('The 0 of the scale is level with the back of the heel. Follow the dotted line across from the tip of the toe, read the number, and set the length with the two arrows.');
          } else { ruled = false; ER.flag('c-rul', 0); svg.querySelector('#toeline').style.display = 'none'; svg.querySelector('#heelline').style.display = 'none'; msg('Slide the scale along the edge of the print until its 0 is level with the very back of the heel.'); }
        }
      }, [232, 430, 290, 590]);
      if (ruled) { rul.set(234, LY + 26 * LS); svg.querySelector('#toeline').style.display = ''; svg.querySelector('#heelline').style.display = ''; }
      ER.$$('.stp', svg).forEach(function (b) { b.addEventListener('click', function () { if (wait || nextFile) return; len = CAKE.clamp(len + (+b.getAttribute('data-d')), 15, 35); keep(); ER.sfx.click(); vals(); }); });
      ER.$$('.pick', svg).forEach(function (p) { p.addEventListener('click', function () { if (wait || nextFile) return; var v = p.getAttribute('data-v'); ht = ht === v ? '' : v; keep(); ER.sfx.click(); picks(); }); });
      ER.$$('.cand', svg).forEach(function (c) {
        c.addEventListener('click', function () {
          if (wait || nextFile) return;
          sole = c.getAttribute('data-v'); keep(); ER.sfx.click(); vals();
        });
      });
      svg.querySelector('#lift').addEventListener('click', function (e) {
        var p = ER.pt(svg, e), cx = (p.x - LX) / LS, cy = (p.y - LY) / LS, hit = -1;
        if (wait || nextFile) return;
        [[-4.7, 19.5, -0.5, 26.2], [-3.1, 6.3, 2.3, 10.5], [-0.2, 2.3, 2.1, 4.5]].forEach(function (b, k) { if (cx > b[0] && cx < b[2] && cy > b[1] && cy < b[3]) hit = k; });
        if (hit >= 0) { if (!found[hit]) { found[hit] = 1; keep(); CAKE.sfx.dot(); } vals(); msg(FEAT[hit][2]); return; }
        if (cy < -0.3 || cy > 26.3 || Math.abs(cx) > 5.6) { msg('That is the black gel round the print. Click on the print itself.'); return; }
        ER.sfx.no();
        msg(Math.abs(cx + 0.3) < 2.8 && Math.abs(cy - 16.7) < 1.4 ? 'BAKER&rsquo;S FRIEND, and a 6: the maker&rsquo;s name and the size. The factory pressed that into every clog it ever made.' :
          cy > 19 ? 'The bars across the heel. Every Baker&rsquo;s Friend has them: that is pattern, and the factory put it there. Is every bar whole, though, all the way to both edges?' :
          cy < 14.6 ? 'Diamonds. Every Baker&rsquo;s Friend has diamonds under the front of the foot: that is pattern, and the factory put it there. Look for a place where the pattern is spoilt.' :
          'The plain part under the arch of the foot. Nothing touches the ground there, so nothing prints.');
      });
      vals(); picks(); goBtn.textContent = 'Sign the print';
    }
    function vals() {
      var t = '', r = '', k, n = 0;
      svg.querySelector('#lenv').textContent = len; svg.querySelector('#solev').textContent = sole.toUpperCase();
      ER.$$('.cand', svg).forEach(function (c) { c.setAttribute('class', 'cand' + (c.getAttribute('data-v') === sole ? ' on' : '')); });
      for (k = 0; k < 3; k++) if (found[k]) {
        n++;
        r += '<circle cx="' + (LX + FEAT[k][0] * LS) + '" cy="' + (LY + FEAT[k][1] * LS) + '" r="' + (k ? 19 : 34) + '" fill="none" stroke="#f0b429" stroke-width="2.500"/><circle cx="' + (LX + FEAT[k][0] * LS + (k ? 26 : -30)) + '" cy="' + (LY + FEAT[k][1] * LS - (k ? 18 : 34)) + '" r="10" fill="#f0b429"/><text x="' + (LX + FEAT[k][0] * LS + (k ? 26 : -30)) + '" y="' + (LY + FEAT[k][1] * LS - (k ? 13 : 29)) + '" class="tB" font-size="14" fill="#1c1d22" text-anchor="middle">' + n + '</text>';
        t += '<text x="828" y="' + (284 + n * 21) + '" class="tH" font-size="16.500" fill="#1b2430">' + n + '. ' + ['heel worn smooth', 'a cut like a V', 'a diamond missing'][k] + '</text>';
      }
      svg.querySelector('#rings').innerHTML = r; svg.querySelector('#ticks').innerHTML = t;
    }
    function signSole() {
      var file;
      if (!ruled) { msg('&ldquo;Measure it first,&rdquo; says Dr Novak. &ldquo;The scale is lying beside the print. Its 0 goes level with the back of the heel.&rdquo;'); return; }
      if (!ER.check('len', len)) { ER.sfx.no(); msg('&ldquo;' + len + ' centimetres?&rdquo; says Dr Novak. &ldquo;Look again. The 0 is at the back of the heel. Follow the dotted line across from the tip of the toe.&rdquo;'); return; }
      if (!ht) { msg('&ldquo;And how tall was the person in the shoe?&rdquo; says Dr Novak. &ldquo;Roughly. Page 12.&rdquo;'); return; }
      if (!ER.check('ht', ht)) {
        ER.sfx.no();
        msg(ht === '175' ? '&ldquo;Twenty-six divided by 0.15 is about 173, yes,&rdquo; says Dr Novak. &ldquo;But twenty-six centimetres is the shoe. Page 12: the foot inside it is about two centimetres shorter. Measure the walker by the foot.&rdquo;' :
          '&ldquo;A foot is about 15% of a person&rsquo;s height,&rdquo; says Dr Novak. &ldquo;So take two centimetres off the sole to get the foot, and divide the foot by 0.15.&rdquo;');
        return;
      }
      if (found.indexOf(0) >= 0) { msg('&ldquo;About one metre sixty,&rdquo; says Dr Novak. &ldquo;Which is Miss Abara&rsquo;s height, near enough. And her size, and her make of shoe. So now it matters. Find me three things in that print that the factory did not put there: you have ' + (found[0] + found[1] + found[2]) + '.&rdquo;'); return; }
      if (!sole) { msg('&ldquo;Three marks,&rdquo; says Dr Novak. &ldquo;Now: which of the three test prints has the same three, in the same three places? Click it.&rdquo;'); return; }
      if (!ER.check('sole', sole)) {
        ER.sfx.no();
        msg(sole === 'a' ? '&ldquo;Miss Abara&rsquo;s has the pattern and it has the size,&rdquo; says Dr Novak. &ldquo;It has none of your three marks. And it has a little stone stuck in its tread, which the print in the flour does not show. Same make, same size. Not the same shoe.&rdquo;' :
          '&ldquo;Worn, yes,&rdquo; says Dr Novak. &ldquo;But B is worn at the toe, and the print is worn at the heel. And the cut in B runs straight across the heel. The cut in the print is a V, under the ball of the foot.&rdquo;');
        sole = ''; keep(); vals(); return;
      }
      file = ER.exitOk([ord.join('') + '-' + out + '-' + len + '-' + ht + '-' + sole]);
      if (!file) { msg('The form will not take the ink. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('c-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.store = 1; ER.persist(true);
      CAKE.sfx.stamp(); msg('Three marks, in the same three places. Dr Novak signs under your name, and puts the lid on her pen.');
      setTimeout(function () {
        ER.closeAll(); CAKE.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Not Miss Abara&rsquo;s,&rdquo; says Dr Novak. &ldquo;The same make, the same size, and she is the right height, near enough. If we had stopped at the pattern, we should have stopped at her. But a shoe is worn by one person&rsquo;s walk, and cut by one person&rsquo;s accidents. The print was made by the clogs on the stair.&rdquo;',
          'Mr Whitlow sits down on a flour bin. &ldquo;They are Dad&rsquo;s,&rdquo; he says. &ldquo;They were always Dad&rsquo;s. But he is eighty-six. He gave me his key at Easter. I watched him do it.&rdquo;',
          '&ldquo;A man who fitted a lock himself has usually kept a second key,&rdquo; says Dr Novak.',
          '&ldquo;But why would he? He would cut off his own hand before he spoilt a cake. He was in that bakehouse every working day for sixty-five years.&rdquo;',
          '&ldquo;I do not think he came down to spoil anything,&rdquo; says Dr Novak. &ldquo;Look at the floor once more. One fainter line of prints goes in at that little door under the stairs, and comes out again. What is in there?&rdquo;',
          '&ldquo;The office,&rdquo; says Mr Whitlow. &ldquo;The order book. Boxes. String.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 2800);
    }
    goBtn.addEventListener('click', function () { if (wait || nextFile) return; if (st) signSole(); else signFloor(); });
    if (st) { drawSole(); msg('On the left: the clearest print from the flour, marker 1, lifted on black gel. On the right: three test prints, A, B and C. Measure the print. Then find three things in it that the factory did not put there, and choose.'); }
    else { drawFloor(); msg('The passage from above, with Dr Novak&rsquo;s five yellow markers. There are three kinds of mark: a clog, a boot, and a cat. Underneath, two close-ups of the places where marks cross. Fill in the finding.'); }
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return st; }
    };
  }
})();
</script>
