<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, bench = null, told = {};

  (function () {
    var s = '', i;
    for (i = -22; i <= 22; i++) s += '<path d="M' + (800 + i * 70) + ' 600L' + (800 + i * 250) + ' 1300"/>';
    [628, 664, 712, 776, 860, 980].forEach(function (y) { s += '<path d="M-800 ' + y + 'H2400"/>'; });
    $('#grid').innerHTML = s;
    $('#whitlow').innerHTML = CAKE.fig('whitlow'); $('#novak').innerHTML = CAKE.fig('novak'); $('#chika').innerHTML = CAKE.fig('chika');
  })();

  ER.init({
    theme: 'forensic', story: 'cake', storyTitle: 'Warm in the Middle', id: 'bake', no: 'II', title: 'The Bakehouse',
    go: 'Through the bead curtain',
    intro: [
      'Seven tubes went into the rack. Universal indicator gave each of them a colour and a number: lemon juice 2, vinegar 3 and cream of tartar 4, all acids; tap water 7, neutral; bicarbonate of soda 8, soap 10 and soda crystals 11, all alkalis. The two white tubs were the right way round.',
      'Then the icing did the rest, because red cabbage is an indicator too, with colours of its own. Bicarbonate turned a square of Thursday&rsquo;s icing blue. Soda crystals, which are washing soda, turned it green: the green of the stain. And the flake from the cake was green on top and lilac underneath, so whatever did it came from outside, after the cake was iced.',
      'Washing soda in water, splashed on from low down, tonight. Mr Whitlow has stopped saying that Chika mixed the icing wrong. He now says that she knocked a bucket.',
      'The bakehouse is through the bead curtain behind the counter. It is half past ten.'
    ],
    exit: {"next":"store","w":{"4a3afdd5":"476838fb"}}, tags: {},
    sound: ['lab', { root: 46, bpm: 66, drop: ['mel'], beds: [['hum', 0.5]] }],      /* a cold room under a strip light, and a graph to read: slow, low, no tune */
    hints: hints, onBegin: begin
  });

  nextFile = ER.flag('b-file') || null; told = ER.flag('b-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b-told', told); return true; }
  function isBusy() { return busy; }
  function showGo() { $('#go').classList.add('on'); }
  function paint() {
    $('#rack').classList.toggle('ready', !!(told.manual && told.bcard && !nextFile));
    ER.pips((told.manual ? 1 : 0) + (told.bcard ? 1 : 0) + Math.min(2, (ER.flag('b-st') || 0) > 1 ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['The graph is signed: nine o&rsquo;clock. Somebody walked through the flour in the passage. Go and look.']];
    if (bench && bench.isOpen()) return [['probe', [
      'Take the probe by its square head and push the point into the sponge. Watch the number on it change as it goes in.',
      'The outside of a cake cools first, so near the edge the probe reads low. The old card says where to measure: in the MIDDLE. Half way along, and half way down.'
    ]], ['plot', [
      'Each label is a time and a temperature. Go along the bottom of the graph to the time, then straight up to the temperature, and click there. The small box at the top of the paper says where your pointer is.',
      'The first label says 10.00 pm and 38 °C. The second says 10.30 pm and 28 °C. Two dots.'
    ]], ['card', [
      'The tracing paper has a scale of its own along the top: minutes out of the oven. Put each line of the old card on it: so many minutes along, so many degrees up.',
      '&ldquo;Out of the oven&rdquo; is 0 minutes. &ldquo;After 1 hour 20&rdquo; is 80 minutes, and &ldquo;after 2 hours&rdquo; is 120.',
      'Five crosses: 0 and 98, 20 and 68, 40 and 50, 80 and 31, 120 and 23. Use the tracing paper&rsquo;s own scale, not the clock times under it.'
    ]], ['slide', [
      'The curve is the right shape, but it is lying in the wrong place. Take hold of the tracing paper and slide it sideways, until the curve runs through both of your dots.',
      'When both dots turn green, look at the 0 on the tracing paper. The clock time under that 0 is the time the sponge left the oven. Click that time on the bottom line of the graph, and sign.',
      'Not seven o&rsquo;clock: that is where the straight line pointed. A hot cake cools fast at first, so the curve climbs back to 98° in much less time than the line does.'
    ]]][bench.stage()];
    if (!told.manual || !told.bcard) return ['read', [
      'Two papers before you touch the sponge. Dr Novak&rsquo;s field manual is lying open on the steel table, and three brown cards are pinned to the wall above the rack.',
      'The manual says how a hot thing cools. The front card says how this size of cake cools, in numbers. You will need both of them.'
    ]];
    return ['rack', ['The sponge is on a wire rack on the steel table, with Dr Novak&rsquo;s yellow label beside it. Click it.']];
  }

  function begin() {
    paint();
    CAKE.mine('finding', 'Finding 1', '<p>The two white tubs are the right way round: cream of tartar 4 (acid), bicarbonate of soda 8 (alkali).</p><p>Bicarbonate turns the red-cabbage icing BLUE. Soda crystals (washing soda, pH 11) turn it GREEN.</p>' +
      '<p>The stain is green. The flake is lilac underneath.</p><p>So: washing soda in water, splashed on from outside, tonight. Not mixed in on Thursday.</p>', true);
    if (nextFile) { busy = false; showGo(); ER.say('The graph is signed. Out of the oven at nine.'); return; }
    if (told.in) { busy = false; ER.say('The bakehouse, half past ten. The strip light hums.'); return; }
    tell('in');
    ER.narrate([
      'White tiles, a steel table, two black ovens, and a strip light that hums. It is colder in here than in the shop. The thermometer on the wall says 18 °C.',

      svg.addEventListener('pointermove', show);
      svg.querySelector('#gclick').addEventListener('click', function (e) {
        var a = at(e), k, hit = -1, mm, tt;
        if (wait || nextFile) return;
        if (st === 0) { msg('Nothing to put on the graph yet but Dr Novak&rsquo;s reading. Take the second one first: push the probe into the sponge.'); return; }
        if (st === 1) {
          READ.forEach(function (r, i) { if (Math.abs(a.m - r[0]) < 4 && Math.abs(a.t - r[1]) < 2.4) hit = i; });
          if (hit < 0) { ER.sfx.no(); msg('That is ' + clockOf(Math.round(a.m / 5) * 5) + ' pm and ' + Math.round(a.t) + ' °C. Neither label says that. Along the bottom to the time, then straight up to the temperature.'); return; }
          if (got[hit]) { msg('That reading is on the paper already.'); return; }
          got[hit] = 1; CAKE.sfx.dot(); dots();
          if (got[0] && got[1]) theLine(); else { keep(); msg(READ[hit][2] + ', ' + READ[hit][1] + ' °C: on the paper. Now the other label.'); }
          return;
        }
        if (st === 2) {
          mm = (a.x - ox) / PXM;
          CARD.forEach(function (c, i) { if (Math.abs(mm - c[0]) < 4.5 && Math.abs(a.t - c[1]) < 2.6) hit = i; });
          if (hit < 0) {
            ER.sfx.no(); misses++; tt = Math.round(mm / 5) * 5;
            msg(tt < 0 || tt > 160 ? 'That is off the tracing paper. Its scale runs along the top, from 0 to 160 minutes.' : 'On the tracing paper that is ' + tt + ' minutes and ' + Math.round(a.t) + ' °C. The card has no such line.' + (misses > 3 ? ' Use the red-brown scale along the top of the tracing paper, not the clock times underneath it.' : ''));
            return;
          }
          if (cgot[hit]) { msg('That line of the card has its cross already.'); return; }
          cgot[hit] = 1; CAKE.sfx.pencil(); cpts(); svg.querySelector('#ck' + hit).textContent = '✓';
          if (cgot.every(function (v) { return v; })) theCurve(); else { keep(); msg('A cross for &ldquo;' + CARD[hit][2] + ', ' + CARD[hit][1] + '°&rdquo;. ' + cgot.filter(function (v) { return !v; }).length + ' more.'); }
          return;
        }
        msg('Take hold of the tracing paper and slide it. When the curve fits, click the time on the bottom line of the graph.');
      });
      svg.querySelector('#axis').addEventListener('click', function (e) {
        var a = at(e), m5 = Math.round(a.m / 5) * 5;
        if (wait || nextFile) return;
        if (st < 3) { msg(st < 2 ? 'The bottom line is the clock. You will mark a time on it at the end. First the readings.' : 'Not yet. First put the old card on the tracing paper: five crosses.'); return; }
        ans = clockOf(X_clamp(m5)); keep(); flag(); CAKE.sfx.dot();
        msg('A red flag on the bottom line at <b>' + ans + ' pm</b>. If that is your answer, sign the graph.');
      });
      /* the tracing paper slides sideways, five minutes at a time */
      var grabX = 0, startOx = 0;
      ER.drag(tr, {
        start: function (e) { if (st < 3 || wait || nextFile) return false; grabX = ER.pt(svg, e).x; startOx = ox; },
        move: function (e) {
          var nx = startOx + ER.pt(svg, e).x - grabX, was = ox;
          ox = X0 + Math.round(CAKE.clamp((nx - X0) / PXM, 0, 230) / 5) * 5 * PXM;
          if (ox !== was) { place(); dots(); CAKE.sfx.slide(); }
        },
        end: function () {
          var S = (ox - X0) / PXM, d = curve(READ[0][0] - S) - READ[0][1];
          keep();
          if (fitted()) { CAKE.sfx.dot(); msg('<b>Both dots are on the curve.</b> Now look at the 0 of the tracing paper, and at the clock time straight below it. Click that time on the bottom line of the graph.'); }
          else msg(READ[0][0] - S < 0 ? 'Now the curve starts after ten o&rsquo;clock, when the sponge was already on the rack with a thermometer in it. Slide it back, to the left.' : d > 0 ? 'The curve runs above your dots. It says the sponge was hotter at ten than it really was: it has started too late. Slide it to the left.' : 'The curve runs below your dots. It has started too early. Slide it to the right.');
        }
      });
      /* the probe */
      pv = svg.querySelector('#pv');
      function reading(p) {
        var dx = (p.x - 170) / 104, dy = (p.y - 290) / 44, d = Math.sqrt(dx * dx + dy * dy);
        if (p.x < 66 || p.x > 274 || p.y < 232 || p.y > 330 || (p.y < 250 && Math.abs(p.x - 170) > 60 + (p.y - 232) * 2.5)) return { t: ROOM, d: 9 };
        return { t: d <= 0.3 ? 28 : 28 - Math.min(1, (d - 0.3) / 0.7) * 6, d: d };
      }
      prb = CAKE.tool(svg, svg.querySelector('#prb'), { x: 308, y: 262 }, {
        start: function () { return !wait && !nextFile; },
        move: function (p) { pv.textContent = reading(p).t.toFixed(1); },
        end: function (p) {
          var r = reading(p);
          if (r.d > 8) { pv.textContent = ROOM.toFixed(1); msg('That is the air of the bakehouse: 18 °C. The point of the probe has to go into the sponge.'); return; }
          if (r.d > 0.3) { msg('The probe says <b>' + r.t.toFixed(1) + ' °C</b>. But that is not the middle of the cake. The outside cools first, and the old card was measured in the middle: half way along, half way down.'); return; }
          prb.set(170, 290); pv.textContent = '28.0'; CAKE.sfx.dot();
          if (st === 0) {
            st = 1; keep(); svg.querySelector('#lab2').style.display = '';
            msg('In the middle of the sponge: <b>28.0 °C</b>, at half past ten. Dr Novak hands you a second label to write. &ldquo;Ten degrees in half an hour,&rdquo; says Mr Whitlow. &ldquo;I can do that sum.&rdquo; &ldquo;On the paper first,&rdquo; says Dr Novak. Put both readings on the graph: along to the time, up to the temperature.');
          } else msg('In the middle of the sponge: 28.0 °C. You have that already.');
        }
      }, [30, 150, 334, 334]);
      if (st > 0) { prb.set(170, 290); pv.textContent = '28.0'; }
    }
    function X_clamp(m) { return CAKE.clamp(m, 0, 270); }
    function theLine() {
      st = 2; keep(); wait = true;
      svg.querySelector('#line').style.display = '';
      try { ER.mood('tense'); } catch (e) {}
      msg('Mr Whitlow lays the edge of a cake board through your two dots and runs a floury finger back along it. &ldquo;Ten degrees in half an hour. A sponge comes out at ninety-eight, so that is sixty degrees more: three hours before ten o&rsquo;clock. <b>Seven.</b> And she was here until half past.&rdquo; Nobody looks at Chika.');
      setTimeout(function () {
        wait = false; var tr = svg.querySelector('#trace'); tr.style.display = '';
        msg('Dr Novak lays a sheet of tracing paper over the graph. &ldquo;That is a straight line, Mr Whitlow. Your father measured this cake. Let us see whether he found a straight line.&rdquo; Put the five lines of the old card on the tracing paper. It has its own scale along the top: minutes out of the oven.');
      }, 5200);
    }
    function theCurve() {
      st = 3; keep();
      var tr = svg.querySelector('#trace'); tr.removeAttribute('pointer-events'); tr.setAttribute('class', 'free');
      msg('Five crosses, and no ruler will go through them. Dr Novak joins them with a pencil: steep at first, then flatter and flatter. &ldquo;A six-inch sponge cools along this curve whenever it starts,&rdquo; she says. &ldquo;So slide it. Find the one place where it runs through both of our dots.&rdquo;');
    }
    box.querySelector('#g-go').addEventListener('click', function () {
      var file, lineAt = clockOf(Math.round(READ[0][0] - (98 - READ[0][1]) / ((READ[0][1] - READ[1][1]) / (READ[1][0] - READ[0][0]))));
      if (wait || nextFile) return;
      if (st < 3 || !ans) { msg(st === 0 ? 'There is nothing on the graph to sign. Start with the probe.' : st === 1 ? 'Two readings go on the graph before anybody signs it.' : st === 2 ? 'Mr Whitlow has his straight line. Dr Novak has not signed it. Put the old card on the tracing paper first.' : 'Mark the time on the bottom line of the graph first: click on the clock time at which the sponge left the oven.'); return; }
      file = ER.exitOk([ans]);
      if (!file) {
        ER.sfx.no();
        msg(ans === lineAt ? '&ldquo;Seven o&rsquo;clock is where the straight line points,&rdquo; says Dr Novak. &ldquo;But a hot cake cools fast at first and slowly afterwards. Look at the curve: how long does it really take to come down from 98?&rdquo;' :
          !fitted() ? '&ldquo;The tracing paper is your clock,&rdquo; says Dr Novak, &ldquo;and it is not set yet. Slide it until both dots lie on the curve. Then read the time under its 0.&rdquo;' :
          '&ldquo;Both dots are on the curve: good,&rdquo; says Dr Novak. &ldquo;Now follow the 0 of the tracing paper straight down to the clock. That is not where your flag is.&rdquo;');
        return;
      }
      wait = true; nextFile = file; ER.flag('b-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.bake = 1; ER.persist(true);
      CAKE.sfx.stamp(); msg('<b>Nine o&rsquo;clock.</b> Dr Novak writes it on the graph, draws a ring round it, and signs under your name.');
      setTimeout(function () {
        ER.closeAll(); CAKE.solved(); paint(); busy = true;
        try { ER.mood('calm'); } catch (e) {}
        ER.narrate([
          '&ldquo;Nine,&rdquo; says Mr Whitlow. &ldquo;Not seven.&rdquo; He looks at his cake board as if it had let him down.',
          '&ldquo;Your line was honest about the last half hour,&rdquo; says Dr Novak, &ldquo;and wrong about every minute before it. Miss Abara. Where were you at nine o&rsquo;clock?&rdquo;',
          '&ldquo;At the college. Wiring wisteria, with nineteen other people and a register.&rdquo; Chika opens the white box at last. Inside, on tissue paper, lies a spray of sugar flowers, pale lilac, as fine as the real thing.',
          'Mr Whitlow looks at them for longer than he means to. &ldquo;Then who,&rdquo; he says, &ldquo;was baking a sponge in my bakehouse at nine o&rsquo;clock at night?&rdquo;',
          '&ldquo;Somebody who walked through your flour,&rdquo; says Dr Novak, and picks up her case.'
        ], function () { busy = false; showGo(); });
      }, 2800);
    });
    draw(); wire();
    msg(st === 0 ? 'On the left: the sponge in its tin, cut away so that you can see inside, and a probe thermometer. On the right: graph paper, with the clock along the bottom. Take the probe by its head and push the point into the sponge.' :
      st === 1 ? 'Two labels, two readings. Put both of them on the graph: along to the time, up to the temperature.' :
      st === 2 ? 'Put the five lines of the old card on the tracing paper. It has its own scale along the top: minutes out of the oven.' :
      'Slide the tracing paper until the curve runs through both dots. Then click the time under its 0 on the bottom line of the graph.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return st; }
    };
  }
})();
</script>
</body>
</html>
