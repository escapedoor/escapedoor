<style>
  body{--bg:#0f1611;--accent:#e9c46a;--font-display:'Special Elite',monospace;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(14,20,15,.96);--tc-ink:#f1ead8;--cap-bg:rgba(15,21,16,.94);--panel:#172019;--face-bg:#2a3a2c;--q-ink:#e9d49a;--fade:#070b08;--hud-bg:rgba(15,21,16,.8)}
  .tc-room{letter-spacing:.06em;font-size:clamp(34px,5vw,64px)}
  .tk-name{letter-spacing:.02em}
  .sB{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-anchor:middle}
  .sE{font-family:'Special Elite',monospace;text-anchor:middle}
  .sC{font-family:'Caveat',cursive;text-anchor:middle}
  .sK{font-family:'Permanent Marker',cursive;text-anchor:middle}
  #lglow{animation:lg 8s steps(1,end) infinite}
  @keyframes lg{0%{opacity:1}57%{opacity:.9}59%{opacity:1}}
  #board.ready,#pad.ready{animation:rd 1.600s steps(1,end) infinite}
  @keyframes rd{50%{filter:brightness(1.3)}}

  /* the board of cards */
  .cb{width:min(1010px,95vw);padding:14px 20px 12px;background:#b58d57;background-image:radial-gradient(rgba(90,60,20,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,240,200,.18) 1px,transparent 1.6px);background-size:9px 9px,13px 13px;
    border:12px solid #5a2f1a;box-shadow:0 26px 70px rgba(0,0,0,.7);-webkit-user-select:none;user-select:none}
  .cb-note{display:table;max-width:92%;margin:0 auto 12px;padding:9px 18px 7px;background:#ffe98a;color:#3a1d12;font-family:'Permanent Marker',cursive;font-size:17px;line-height:1.3;transform:rotate(-.8deg);box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .cb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px}
  .tcd{position:relative;display:block;text-align:left;background:#fffdf6;color:#2b2540;padding:24px 16px 10px;min-height:172px;box-shadow:0 5px 12px rgba(0,0,0,.35);cursor:pointer}
  .tcd:nth-child(odd){transform:rotate(-.7deg)}.tcd:nth-child(even){transform:rotate(.6deg)}
  .tcd:before{content:'';position:absolute;left:50%;top:7px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0f0f2,#6b6f76)}
  .tcd small{display:block;margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#8a7f66}
  .tcd span{display:block}
  .tcd.h1{font-family:'Caveat',cursive;font-size:21.5px;line-height:1.12}
  .tcd.h2{font-family:'Patrick Hand',cursive;font-size:17.5px;line-height:1.22}
  .tcd.h3{font-family:'Homemade Apple',cursive;font-size:13.500px;line-height:1.7}
  .tcd i{display:block;margin-top:4px;font-style:normal;text-align:right}
  .tcd:hover{box-shadow:0 5px 12px rgba(0,0,0,.35),0 0 0 3px #e9c46a}
  .tcd.on:after{content:'';position:absolute;right:10px;top:-8px;width:26px;height:40px;background:#c0392b;-webkit-clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);box-shadow:0 2px 4px rgba(0,0,0,.4)}
  .tcd.off{opacity:.55;cursor:default}
  .cb .bn-foot{margin-top:12px}
  .cb .bmsg{color:#1e140a;min-height:50px}
  .cb .bmsg b{color:#8a1f14}
  .cb .btn{--accent:#1e140a;background:rgba(255,255,255,.3)}
  .cb .btn:hover:not([disabled]){color:#f6efdc}

  /* the pad of labels, and a torch */
  .pdw{width:min(1050px,95vw)}
  .pd{position:relative;width:100em;height:56em;font-size:min(10.5px,.95vw);overflow:hidden;border-radius:.5em;background:#14261f linear-gradient(160deg,#1c3329,#0e1a15);box-shadow:0 26px 70px rgba(0,0,0,.7);-webkit-user-select:none;user-select:none}
  .pd:before{content:'';position:absolute;left:1.5em;top:1.5em;right:1.5em;bottom:1.5em;border:.18em solid rgba(201,162,58,.5)}
  .pd .sheet{position:absolute;left:6em;top:5em;width:64em;height:46em;background:#f4ecd8;box-shadow:0 .7em 1.8em rgba(0,0,0,.55);--la:0;--lb:0}
  .pd .tear{position:absolute;left:0;top:0;right:0;height:2.4em;background:#e3d8bd;border-bottom:.15em dashed #b9ab88}
  .pd .tear:after{content:'';position:absolute;left:8em;right:30em;top:1.2em;height:1.2em;background:#f9f3e3;-webkit-clip-path:polygon(0 0,100% 0,96% 100%,88% 40%,74% 90%,60% 30%,44% 100%,30% 50%,14% 90%,4% 30%);clip-path:polygon(0 0,100% 0,96% 100%,88% 40%,74% 90%,60% 30%,44% 100%,30% 50%,14% 90%,4% 30%)}
  .pd .txt{position:absolute;left:1em;top:1.150em;right:.400em;font-family:'Caveat',cursive;font-size:4.200em;line-height:1.7;color:#857657;white-space:nowrap}
  .pd .txt p{margin:0}
  .pd .da,.pd .db,.pd .wk-cell.given{text-shadow:.03em .035em 0 rgba(255,255,255,.95),-.025em -.03em 0 rgba(50,40,20,.45)}
  .pd .da{opacity:var(--la)}.pd .db{opacity:var(--lb)}
  .pd .ga .wk-cell.given{opacity:var(--la)}.pd .gb .wk-cell.given{opacity:var(--lb)}
  .pd .wk-gap{--wk-line:rgba(60,70,100,.55);--wk-cur:rgba(233,196,106,.5);--wk-hit:#3a6a4a;--wk-bad:#b3261c}
  .pd .wk-cell{text-transform:lowercase;width:.500em;height:1.050em;margin:0 .020em}
  .pd .wk-gap[data-key="w2"] .wk-cell:first-child{text-transform:uppercase}
  .pd .wk-cell.given{border-bottom-color:transparent}
  .pd .wk-cell.blank{color:#2b3a66;border-bottom:.04em dashed rgba(60,70,100,.6);background:rgba(60,70,100,.07)}
  .pd .wk-cell.blank.cur{background:rgba(233,196,106,.6);border-bottom:.05em solid #b08a35}
  .pd .wk-gap.ok .wk-cell{opacity:1!important;color:#2b3a66;text-shadow:none;background:none;border-bottom-color:transparent}
  .pd.read .da,.pd.read .db,.pd.read .wk-cell{opacity:1!important;color:#2b3a66;text-shadow:none}
  .pd .beam{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
  .pd .torch{position:absolute;width:11em;height:11em;margin:-5.5em 0 0 -5.5em;cursor:grab;touch-action:none}
  .pd .torch.on{cursor:grabbing}
  .pd .torch svg{display:block;width:100%;height:100%;pointer-events:none}
  .pd .side{position:absolute;left:42.500em;top:3.100em;width:13.400em;color:#e6dcc2;font-family:'Patrick Hand',cursive;font-size:1.720em;line-height:1.25}
  .pd .side b{display:block;margin-bottom:.4em;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.82em;letter-spacing:.24em;text-transform:uppercase;color:#e9c46a}
  .pd .side p{margin:0 0 .7em}
  .pd .side .rd{margin-top:1em;padding:.5em .6em;border:1px solid rgba(233,196,106,.5);color:#fff3cf;min-height:5.2em}
  .pdw .bmsg{min-height:54px}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, nextFile = null, told = {}, cardsBox = null, padBox = null, stage = 0;

  /* the stairs overhead, the cards on the board, the photographs, the calendar, the keys, the pigeonholes */
  (function () {
    var d = 'M-1000 -400H2600V436', l = 'M1630 428', i, x, y, s = '', seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    d += 'H1630'; for (i = 0; i < 22; i++) { d += 'v-19h-70'; l += 'v-19h-70'; } d += 'H-1000z';
    $('#stairs').setAttribute('d', d); $('#stairsl').setAttribute('d', l);
    [[212, 244, -2], [316, 246, 1.5], [418, 242, -1], [214, 380, 1], [318, 384, -2], [420, 380, 2]].forEach(function (c) {
      s += '<g transform="rotate(' + c[2] + ' ' + (c[0] + 42) + ' ' + (c[1] + 56) + ')"><rect x="' + c[0] + '" y="' + c[1] + '" width="84" height="112" fill="#fffdf6"/><circle cx="' + (c[0] + 42) + '" cy="' + (c[1] + 8) + '" r="4" fill="#8a949b"/>' +
        '<g stroke="#4a4470" stroke-width="1.400">' + [26, 38, 50, 62, 74, 86].map(function (dy, n) { return '<path d="M' + (c[0] + 10) + ' ' + (c[1] + dy) + 'h' + (n === 5 ? 40 : 64) + '"/>'; }).join('') + '</g></g>';
    });
    $('#cards').innerHTML = s; s = '';
    [[600, 300, '1961'], [720, 312, '1978'], [840, 304, '1996'], [916, 392, '2011']].forEach(function (f, n) {
      x = f[0]; y = f[1];
      s += '<rect x="' + x + '" y="' + y + '" width="' + (n === 3 ? 70 : 96) + '" height="' + (n === 3 ? 84 : 118) + '" fill="#15100c"/><rect x="' + (x + 8) + '" y="' + (y + 8) + '" width="' + (n === 3 ? 54 : 80) + '" height="' + (n === 3 ? 58 : 86) + '" fill="' + ['#cfc3a8', '#c9bfa8', '#d6cdb8', '#dfd8c8'][n] + '"/>' +
        '<g fill="#6b5f4a" transform="translate(' + (x + (n === 3 ? 35 : 54)) + ' ' + (y + (n === 3 ? 62 : 90)) + ') scale(' + (n === 3 ? 0.6 : 0.9) + ')"><rect x="-22" y="-16" width="44" height="16"/><rect x="-16" y="-32" width="32" height="16"/><rect x="-10" y="-48" width="20" height="16"/><rect x="-5" y="-62" width="10" height="14"/></g>' +
        (n === 0 ? '<g fill="#3a3024"><circle cx="' + (x + 24) + '" cy="' + (y + 62) + '" r="6"/><rect x="' + (x + 18) + '" y="' + (y + 68) + '" width="12" height="24"/><rect x="' + (x + 19) + '" y="' + (y + 46) + '" width="10" height="12" fill="#f4f1e8"/></g>' : '') +
        '<text x="' + (x + (n === 3 ? 35 : 48)) + '" y="' + (y + (n === 3 ? 78 : 110)) + '" class="sE" font-size="10" fill="#cfc3a8">' + f[2] + '</text>';
    });
    $('#photos').innerHTML = s; s = '';
    for (i = 0; i < 30; i++) {
      x = 1018 + ((i + 1) % 7) * 12.500; y = 370 + Math.floor((i + 1) / 7) * 16;
      s += (i === 11 ? '<circle cx="' + (x + 4) + '" cy="' + (y - 4) + '" r="8" fill="none" stroke="#b3261c" stroke-width="2"/>' : '') + '<text x="' + (x + 4) + '" y="' + y + '" class="sB" font-size="9.500" fill="' + ((i + 1) % 7 === 5 || (i + 1) % 7 === 6 ? '#8a2a3a' : '#2a2016') + '">' + (i + 1) + '</text>';
    }
    $('#days').innerHTML = s; s = '';
    ['SHOP', 'YARD', 'VAN', 'SAFE', 'STAIRS'].forEach(function (k, n) {
      x = 1166 + n * 28;
      s += '<circle cx="' + x + '" cy="424" r="3.500" fill="#e6c873"/><text x="' + x + '" y="415" class="sB" font-size="7" fill="#f3e9c0">' + k + '</text>' +
        (n === 4 ? '<path d="M' + x + ' 426q-8 14 0 22q8 -8 0 -22" fill="none" stroke="#d9c9a0" stroke-width="2"/><circle cx="' + x + '" cy="456" r="7" fill="none" stroke="#8a949b" stroke-width="3.500"/><path d="M' + x + ' 463v20h7M' + x + ' 476h5" stroke="#8a949b" stroke-width="3.500" fill="none"/>' :
          '<circle cx="' + x + '" cy="433" r="5" fill="none" stroke="#c9ced3" stroke-width="2.500"/><path d="M' + x + ' 438v14h4M' + x + ' 446h3" stroke="#c9ced3" stroke-width="2.500" fill="none"/>');
    });
    $('#hooks').innerHTML = s; s = '';
    for (i = 0; i < 16; i++) {
      x = 566 + (i % 8) * 81; y = 474 + Math.floor(i / 8) * 64;
      s += '<rect x="' + x + '" y="' + y + '" width="73" height="56" fill="#22110a"/>';
      if (i === 1 || i === 2) continue;
      for (var k = 0; k < 3; k++) if (rnd() < 0.8) s += '<rect x="' + (x + 6 + k * 20 + rnd() * 6).toFixed(0) + '" y="' + (y + 10 + rnd() * 14).toFixed(0) + '" width="' + (10 + rnd() * 8).toFixed(0) + '" height="46" fill="' + ['#efe5cc', '#fdfbf4', '#d9cfb8', '#e9dfc4'][Math.floor(rnd() * 4)] + '"/>';
    }
    $('#pig').innerHTML = s;
    $('#whitlow').innerHTML = CAKE.fig('whitlow'); $('#novak').innerHTML = CAKE.fig('novak'); $('#chika').innerHTML = CAKE.fig('chika');
  })();

  ER.init({
    theme: 'forensic', story: 'cake', storyTitle: 'Warm in the Middle', id: 'office', no: 'IV', title: 'The Office',
    go: 'The little door under the stairs',
    intro: [

        if (LEARN[key]) WK.learn(LEARN[key]);
        msg({ w1: '<b>plain</b>: a little plain cake. Nothing on it, and nothing in it but cake.', w2: '<b>Sunday</b>. The wedding is on Saturday. The cake is for the day after.',
          w3: '<b>fuss</b>: when the fuss is over. Two hundred and twenty guests and a town band are a good deal of fuss.', w4: '<b>compliments</b>: with Whitlow&rsquo;s compliments. That is how a shop says: this one is a present.',
          w5: '<b>always</b>: as always. So this is not the first label of its kind.' }[key]);
      },
      onMiss: function (key, node, n) {
        misses[key] = n;
        msg(n < 2 ? '&ldquo;It has to fit the dents, and it has to make sense,&rdquo; says Dr Novak. &ldquo;Try the torch from the other side, and read the words round it again.&rdquo;' :
          { w1: '&ldquo;A little &hellip; cake,&rdquo; says Dr Novak. &ldquo;No icing, no fruit, no pearls. What is the word for a thing with nothing added?&rdquo;',
            w2: '&ldquo;A cake for a day of the week,&rdquo; says Dr Novak. &ldquo;The wedding is on the Saturday.&rdquo;',
            w3: '&ldquo;When the &hellip; is over,&rdquo; says Dr Novak. &ldquo;The noise, the hats, the photographs, Mrs Farrant. One short word for all of it.&rdquo;',
            w4: '&ldquo;With somebody&rsquo;s &hellip;,&rdquo; says Dr Novak. &ldquo;What you send with a present, when you want no money for it. It can also mean kind words about somebody&rsquo;s cooking.&rdquo;',
            w5: '&ldquo;As &hellip;,&rdquo; says Dr Novak. &ldquo;Not sometimes. Every time.&rdquo;' }[key]);
      },
      onDone: function () {
        if (restoring) return;
        var file = ER.exitOk([['w1', 'w2', 'w3', 'w4', 'w5'].map(function (k) { return solved[k]; }).join('-')]);
        if (!file) { msg('The label will not come clear. Something is wrong with this page: tell your teacher.'); return; }
        nextFile = file; ER.flag('d-file', file);
        var s0 = ER.state(); s0.done = s0.done || {}; s0.done.office = 1; ER.persist(true);
        pd.classList.add('read'); CAKE.sfx.stamp();
        msg('Dr Novak copies it out underneath, word for word, and reads it back. <b>For Mr and Mrs Petrosyan. A little plain cake for Sunday, when the fuss is over. With Whitlow&rsquo;s compliments, as always. A.W.</b>');
        setTimeout(function () {
          ER.closeAll(); CAKE.solved(); paint(); busy = true;
          ER.narrate([
            'Mr Whitlow reads it aloud, slowly, the way people read a thing that they once knew by heart. &ldquo;For Sunday, when the fuss is over. That was on every one of them. Mum wrote the first.&rdquo;',
            '&ldquo;A.W.,&rdquo; says Dr Novak.',
            '&ldquo;Arthur Whitlow. My father.&rdquo; He counts on his fingers. &ldquo;Fourteen weddings since Easter. He has been coming down those stairs on a Friday night, with his hip, and baking them himself. In the little oven. And getting them into the van somehow.&rdquo;',
            '&ldquo;Two Saturday mornings out of my three,&rdquo; says Chika from the doorway. &ldquo;I said it was warm.&rdquo;',
            '&ldquo;Tonight a sack of flour beat him,&rdquo; says Dr Novak. &ldquo;He trod it through to the bakehouse, and he cleaned up after himself the way he was taught: hot water, soda crystals and a mop, round a cake the colour of red cabbage. I doubt if he knows what he did. Let him sleep. He will be down before the van goes. He has a parcel to send.&rdquo;',
            'Mr Whitlow looks at his watch, and then through the wall, in the direction of the cake. &ldquo;And that? It goes at eight.&rdquo;',
            '&ldquo;That,&rdquo; says Dr Novak, &ldquo;went green because an alkali touched an indicator. You have read my card, Mr Whitlow. What does it say will send it back?&rdquo;'
          ], function () { busy = false; showGo(); });
        }, 5200);
      }
    });
    restoring = true; Object.keys(solved).forEach(function (k) { gaps.fill(k); }); restoring = false;
    light(pos[0], pos[1]);
    msg(Object.keys(solved).length ? 'The pad, and the torch. ' + Object.keys(solved).length + ' of the five words are in.' : 'The pad of labels, with Dr Novak&rsquo;s torch lying on it. The top label has been torn off and taken away. Take hold of the torch and carry it about, and watch the paper.');
  }
})();
</script>
