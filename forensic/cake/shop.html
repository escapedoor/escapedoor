    }
    function drops(hit) {

    function keep() { ER.flag('a-ind', ind.join('')); ER.flag('a-rack', rack); }

      msg('Dr Novak reads along the rack. &ldquo;Lemon juice, vinegar, cream of tartar: acids, all three. Water in the middle. Then bicarbonate, soap, soda crystals: alkalis. And the tub that says CREAM OF TARTAR has an acid in it, Mr Whitlow. Nobody has swapped your tubs.&rdquo;');
      setTimeout(function () {
        var acid = [], mid = [], alk = [];

        CAKE.mine('rack', 'The rack', '<p>Universal indicator, three drops in each tube.</p><p>ACIDS: ' + acid.join(' &middot; ') + '</p><p>NEUTRAL: ' + mid.join(' &middot; ') + '</p><p>ALKALIS: ' + alk.join(' &middot; ') + '</p><p>The two white tubs are the right way round.</p>');

    }

    /* --- Thursday's icing, the flake, and the finding --- */
    function drawTile() {

          '<text x="66" y="' + (y + 22) + '" class="tB" font-size="15.500" fill="#1b2430" letter-spacing=".400">' + FULL[TUBES[j][0]] + '</text><text x="66" y="' + (y + 41) + '" class="tM" font-size="13" fill="#56616c">pH ' + rack[j] + '</text>' +
          '<rect class="got" x="262" y="' + (y + 11) + '" width="30" height="30" rx="3" fill="' + (seen[TUBES[j][0]] ? TUBES[j][5] : 'none') + '" stroke="' + (seen[TUBES[j][0]] ? '#8a8676' : 'none') + '"/></g>';
      }
      s += '<text x="478" y="150" class="tB" font-size="15" fill="#5a4a52" text-anchor="middle" letter-spacing="2.500">THURSDAY&#8217;S ICING</text>' +
        '<rect x="332" y="160" width="292" height="150" rx="6" fill="#fbfbf8" stroke="#bdb8ac" stroke-width="2"/>';
      for (j = 0; j < 3; j++) s += '<rect class="sq" id="sq' + j + '" x="' + (350 + j * 90) + '" y="178" width="76" height="76" rx="3" fill="' + LILAC + '"/><text id="sqt' + j + '" x="' + (388 + j * 90) + '" y="278" class="tH" font-size="15.500" fill="#1b2430" text-anchor="middle"></text><text id="squ' + j + '" x="' + (388 + j * 90) + '" y="296" class="tH" font-size="15.500" fill="#6b3f8f" text-anchor="middle"></text>';
      s += '<text x="478" y="330" class="tH" font-size="17" fill="#5a4a52" text-anchor="middle">click a tube on the left to dab it on a square</text>' +
        '<text x="760" y="150" class="tB" font-size="15" fill="#5a4a52" text-anchor="middle" letter-spacing="2.500">FROM THE CAKE</text>' +
        '<circle cx="760" cy="240" r="74" fill="#f4fbfd" fill-opacity=".55" stroke="#9fb4bd" stroke-width="3"/><circle cx="760" cy="240" r="60" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>' +
        '<g id="flake"><path id="fk" d="M716 228l20 -30 36 -8 30 22 -6 38 -34 22 -38 -10z" fill="' + GREEN + '" stroke="#6b8a68" stroke-width="1.500"/><g id="fks"></g><circle cx="760" cy="240" r="58" fill="#000" opacity="0"/></g>' +
        '<text id="fkt" x="760" y="336" class="tH" font-size="17" fill="#5a4a52" text-anchor="middle"></text>' +
        '<g class="tool lit" id="lr"><rect x="-13" y="-84" width="26" height="92" fill="#000" opacity="0"/><rect x="-8" y="-78" width="16" height="78" fill="#e59aa6" stroke="#b56a78" stroke-width="1"/><rect class="tip" x="-8" y="-22" width="16" height="22" fill="' + (lit ? '#7f9fe0' : '#e59aa6') + '"/><text x="0" y="-86" class="tB" font-size="10.500" fill="#8a2a3a" text-anchor="middle">RED LITMUS</text></g>' +
        '<g class="tool lit" id="lb"><rect x="-13" y="-84" width="26" height="92" fill="#000" opacity="0"/><rect x="-8" y="-78" width="16" height="78" fill="#9db6ea" stroke="#5a78b8" stroke-width="1"/><rect class="tip" x="-8" y="-22" width="16" height="22" fill="#9db6ea"/><text x="0" y="-86" class="tB" font-size="10.500" fill="#2a4a8a" text-anchor="middle">BLUE LITMUS</text></g>' +
        /* the finding */
        '<rect x="332" y="352" width="652" height="240" fill="#fbf5e6"/><rect x="332" y="352" width="652" height="8" fill="#17324d"/>' +
        '<text x="352" y="386" class="tB" font-size="17" fill="#17324d" letter-spacing="3">FINDING 1 &#183; THE WEDDING CAKE</text><text x="964" y="386" class="tM" font-size="12" fill="#56616c" text-anchor="end">Forensic Laboratory</text>' +
        '<text x="352" y="412" class="tS" font-size="14.500" fill="#1b2430">The icing was turned green by</text>';
      x = 352; y = 422;
      ['lemon', 'vinegar', 'tartar', 'water', 'bicarb', 'soap', 'soda'].forEach(function (k) {
        if (n === 4) { x = 352; y = 456; }
        s += '<g class="pick" data-g="what" data-v="' + k + '"><rect x="' + x + '" y="' + y + '" width="' + W[k] + '" height="27" rx="3"/><text x="' + (x + W[k] / 2) + '" y="' + (y + 19) + '" class="tB" font-size="15" text-anchor="middle" letter-spacing=".400">' + FULL[k] + '</text></g>';
        x += W[k] + 8; n++;
      });
      s += '<text x="352" y="508" class="tS" font-size="14.500" fill="#1b2430">which reached it</text>' +
        '<g class="pick" data-g="how" data-v="in"><rect x="352" y="518" width="296" height="27" rx="3"/><text x="500" y="537" class="tB" font-size="15" text-anchor="middle" letter-spacing=".400">IN THE BOWL, WHEN THE ICING WAS MIXED</text></g>' +
        '<g class="pick" data-g="how" data-v="out"><rect x="352" y="552" width="296" height="27" rx="3"/><text x="500" y="571" class="tB" font-size="15" text-anchor="middle" letter-spacing=".400">FROM OUTSIDE, AFTER THE CAKE WAS ICED</text></g>' +
        '<path d="M700 572h260" stroke="#1b2430" stroke-width="1" stroke-dasharray="2 3"/><text x="700" y="590" class="tM" font-size="10.500" fill="#56616c">signed</text>';
      svg.innerHTML = s; tools = [];
      ER.$$('.srcrow', svg).forEach(function (r) { r.addEventListener('click', function () { dab(+r.getAttribute('data-j')); }); });
      svg.querySelector('#flake').addEventListener('click', function () { if (wait) return; flip = !flip; ER.flag('a-flip', 1); CAKE.sfx.clink(); drawFlake(true); });
      ER.$$('.pick', svg).forEach(function (p) {
        p.addEventListener('click', function () {

      });
      drawFlake(false); drawPicks(); goBtn.textContent = 'Sign the finding';
    }
    function drawFlake(say) {
      var f = svg.querySelector('#fk'), sp = '', i;
      f.setAttribute('fill', flip ? LILAC : GREEN); f.setAttribute('stroke', flip ? '#9a8ac0' : '#6b8a68');
      if (!flip) for (i = 0; i < 7; i++) sp += '<circle cx="' + (732 + (i * 37) % 56) + '" cy="' + (212 + (i * 23) % 44) + '" r="' + (2 + i % 3) + '" fill="#6fb56c" opacity=".7"/>';
      svg.querySelector('#fks').innerHTML = sp;
      svg.querySelector('#fkt').textContent = flip ? 'the underside (click to turn it back)' : 'click the flake to turn it over';
      if (say) msg(flip ? 'The underside of the flake: <b>lilac</b>, the same lilac as Thursday&rsquo;s icing. The green does not go right through. It is only as deep as a coat of paint.' : 'Green side up again: the green of the stain.');
    }
    function drawPicks() { ER.$$('.pick', svg).forEach(function (p) { var g = p.getAttribute('data-g'); p.setAttribute('class', 'pick' + ((g === 'what' ? what : how) === p.getAttribute('data-v') ? ' on' : '')); }); }
    function dab(j) {
      var t = TUBES[j], k = t[0], n;
      if (wait || nextFile) return;
      if (seen[k]) { msg('You have tried the ' + t[2] + ' already: ' + (t[6] ? 'it turned the icing ' + t[6] + '.' : 'it changed nothing.') + ' The little square beside its name remembers.'); return; }
      if (tile.length === 3) {
        tile = []; tiles++;
        for (n = 0; n < 3; n++) { svg.querySelector('#sq' + n).setAttribute('fill', LILAC); svg.querySelector('#sqt' + n).textContent = ''; svg.querySelector('#squ' + n).textContent = ''; }
        CAKE.sfx.snip();
      }
      n = tile.length; tile.push(k); seen[k] = 1; ER.flag('a-seen', seen); CAKE.sfx.drop();
      svg.querySelector('#sq' + n).setAttribute('fill', t[5]);
      svg.querySelector('#sqt' + n).textContent = FULL[k].replace('BICARBONATE OF SODA', 'BICARBONATE').replace('CREAM OF TARTAR', 'TARTAR');
      svg.querySelector('#squ' + n).textContent = t[6] ? t[6].replace('a hot, bright ', '').replace('a soft ', '') : 'no change';
      var got = svg.querySelector('.srcrow[data-j="' + j + '"] .got'); got.setAttribute('fill', t[5]); got.setAttribute('stroke', '#8a8676');
      msg((tiles && n === 0 ? 'Mr Whitlow cuts three more squares of Thursday&rsquo;s icing, slowly. &ldquo;' + (tiles > 1 ? 'I have a wedding at twelve, you know' : 'There is not much of that batch left') + ',&rdquo; he says. ' : '') +
        'A dab of ' + t[2] + ' on the icing: ' + (k === 'water' ? 'nothing happens at all. Water is neutral, and the icing stays lilac.' :
        k === 'bicarb' ? 'the lilac turns <b>blue</b>, at once. Mr Whitlow nods. Then he looks at the cake, and at the square, and at the cake, and stops nodding.' :
        k === 'soda' ? 'the lilac turns <b>green</b>, at once. Put the square beside the flake: it is the same green.' :
        k === 'soap' ? 'the lilac turns <b>blue-green</b>, like the sea in a holiday photograph. Close. Put it beside the flake.' :
        'the lilac turns <b>' + t[6] + '</b>. An acid pushes this colour the other way.'));
    }
    var NOPE = {
      lemon: 'Lemon juice is an acid. You can see what an acid does to this icing: it turns it pink.', vinegar: 'Vinegar is an acid. An acid turns this icing pink, and nobody has complained of a pink cake.',
      tartar: 'Cream of tartar is an acid, and it is in the icing already: a pinch in every bowl. It is what keeps the colour lilac.', water: 'Water is neutral. It changed nothing at all.',
      bicarb: 'Bicarbonate of soda turned Thursday&rsquo;s icing blue. Look at the flake. Is that blue?', soap: 'Soap gave you blue-green: nearly. Put that square beside the flake, and look at the lower strip of the card. The flake is further along.'
    };
    function sign() {
      var file, j;
      if (wait || nextFile) return;
      if (!what || !how) { msg('&ldquo;A finding says two things,&rdquo; says Dr Novak. &ldquo;What did it, and how it got there. ' + (!what && !how ? 'You have told me neither.' : !what ? 'You have not told me what.' : 'You have not told me how.') + '&rdquo;'); return; }
      if (!seen[what]) { msg('&ldquo;A finding is something you have seen,&rdquo; says Dr Novak. &ldquo;Have you seen what ' + FULL[what].toLowerCase() + ' does to Thursday&rsquo;s icing? Then show me.&rdquo;'); return; }
      if (!ER.check('what', what)) { ER.sfx.no(); msg('Dr Novak does not pick up her pen. &ldquo;' + (NOPE[what] || 'Not that.') + '&rdquo;'); what = ''; drawPicks(); return; }
      if (!ER.flag('a-flip')) { msg('&ldquo;What did it: agreed,&rdquo; says Dr Novak. &ldquo;But how did it get there? You have not turned the flake over yet. Look at the back of it before you answer.&rdquo;'); return; }
      if (!ER.check('how', how)) { ER.sfx.no(); msg('&ldquo;In the bowl, on Thursday?&rdquo; says Dr Novak. &ldquo;The colour turns at once: you have just watched it. A bowl of icing with washing soda in it would have been green on Thursday, and green all the way through. What colour is the back of that flake?&rdquo;'); how = ''; drawPicks(); return; }
      file = ER.exitOk([rack.join('.') + '-' + what + '-' + how]);
      if (!file) { msg('The form will not take the ink. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('a-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.shop = 1; ER.persist(true);
      CAKE.sfx.stamp(); msg('Your name, and under it: M. Novak. She blows on the ink.');
      setTimeout(function () {
        ER.closeAll(); CAKE.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Washing soda,&rdquo; says Dr Novak. &ldquo;On the outside, and tonight: it is still damp. Nothing is wrong with your icing, Mr Whitlow, and nothing was wrong with it on Thursday.&rdquo;',
          'Mr Whitlow looks at the two white tubs, and then at the young woman on the chair. &ldquo;Then it was splashed,&rdquo; he says slowly. &ldquo;Or thrown. It still comes to the same thing. She was the last one in.&rdquo;',
          '&ldquo;Soda crystals do not fly through the air by themselves,&rdquo; says Dr Novak. &ldquo;They were in water, and the water was in something. The splashes are low down, and all on one side. So somewhere out at the back there is a bucket.&rdquo;',
          '&ldquo;By the sink,&rdquo; says Chika. It is the first thing she has said for ten minutes. &ldquo;With the mop standing in it. I didn&rsquo;t get it out.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 2600);
    }
    goBtn.addEventListener('click', function () { if (stage) sign(); else readRack(); });
    if (stage) { drawTile(); msg('Thursday&rsquo;s icing, and a flake of the stain. Both are coloured with red cabbage, so read them on the lower strip. Start with the litmus paper: touch it to the flake.'); }
    else { drawRack(); msg('Seven tubes, each with a little of something from this building dissolved in water. On the right, a bottle of universal indicator. Carry the dropper to a tube. Then carry the tube to the rack.'); }
    var first = true;
    return {
      open: function () {
        ER.open('ov-lock', box);
        if (stage && first) msg('Thursday&rsquo;s icing, and a flake of the stain. Both are coloured with red cabbage, so read them on the lower strip of the card. Start with the litmus paper: touch it to the flake.');
        first = false;
      },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return stage; }
    };
  }
})();
