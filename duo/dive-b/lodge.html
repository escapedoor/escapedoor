<script>
(function () {
  var $ = ER.$, busy = true, told = {}, nextFile = null, keybox = null;

  /* twelve hooks; every key is labelled with the maker of its lock and the picture on the lock plate, never with the room */
  var KEYS = [
    { id: 'front', tag: 'FRONT DOOR', old: false }, { id: 'lodge', tag: 'LODGE', old: false }, { id: 'trask-ship', tag: 'TRASK · ship', old: true },
    { id: 'trask-crown', tag: 'TRASK · crown', old: true }, { id: 'hollin-anchor', tag: 'HOLLIN · anchor', old: true }, { id: 'gate', tag: 'GARDEN GATE', old: false },
    { id: 'hollin-fish', tag: 'HOLLIN · fish', old: true }, { id: 'trask-plain', tag: 'TRASK · plain plate', old: true }, { id: 'strong', tag: 'STRONGROOM: ask Mrs T.', old: null },
    { id: 'trask-fish', tag: 'TRASK · fish', old: true }, { id: 'hollin-crown', tag: 'HOLLIN · crown', old: true }, { id: 'shed', tag: 'BIKE SHED', old: false }
  ];
  (function () {
    var s = '', i;
    for (i = 0; i < 12; i++) { var x = 870 + (i % 4) * 54, y = 165 + Math.floor(i / 4) * 80; s += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="#c9a94e"/>' + (KEYS[i].old === null ? '' : '<path d="M' + x + ' ' + y + 'v' + (KEYS[i].old ? 46 : 28) + '" stroke="#c9a94e" stroke-width="' + (KEYS[i].old ? 5 : 4) + '"/>') + '<rect x="' + (x + 6) + '" y="' + (y + 4) + '" width="20" height="12" fill="#f1ead2"/>'; }
    $('#hooks').innerHTML = s;
  })();

  ER.init({
    theme: 'duo', story: 'dive-b', storyTitle: 'Open This Together', id: 'lodge', no: 'I', title: 'The Lodge',
    go: 'Pick up the radio',
    intro: [
      '<b class="two">This is a story for two. Your partner plays THE DIVER (part A) on another screen. Do not show each other your screens: talk. Everything one of you can see, the other one needs.</b>',
      'Rillmouth, a little before eleven at night. At nine o&rsquo;clock the River Rill came over its bank, ran down Ferry Street, and found the basement of Rillmouth Museum. A pump is roaring in the yard. It is not winning.',
      'You are the operator. All summer you were a volunteer at the museum, writing catalogue cards, so when the river came in, the museum rang you. Now you are in the porter&rsquo;s Lodge at the top of the basement stairs, with the radio, the plans of the basement, the catalogue and the pump, and the night porter, Mr Ossie Blundell.',
      'At the bottom of the stairs is a diver you have never met, who can see everything you cannot. You can see everything the diver cannot. Somewhere on a top shelf down there is a box that has been waiting since 1926.'
    ],
    exit: {"next":"catalogue","w":{"e91228dd":"08e98ab4"}}, tags: {},
    hints: hints, onBegin: begin
  });

  told = ER.flag('b1-told') || {}; nextFile = ER.flag('b1-file') || null;
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('b1-told', told); return true; }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    ER.pips((told.plan ? 1 : 0) + (told.blundell ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) LG.card([['Tell your partner', ['&ldquo;Diver, this is Topside. The key is on its way down the line. Pull twice. Over.&rdquo;']]]);
    else LG.card([['Ask your partner', ['&ldquo;Diver, this is Topside. What can you see? How many doors are there on your left? Over.&rdquo;', '&ldquo;What does the lock plate say? Please spell the name.&rdquo;']], ['Tell your partner', ['&ldquo;The Long Store is the &hellip; door on your &hellip;.&rdquo;']]]);
  }
  function hints() {
    if (nextFile) return ['go', ['The key is on its way down the line. The diver is going into the Long Store.']];
    if (!told.plan) return ['plan', [
      'The plan of the basement is pinned on the wall, on the left. Read it before you tell the diver anything.',
      'Ask the diver what can be seen from the bottom step, and find the same things on the plan.'
    ]];
    return ['key', [
      'The diver needs two things from you: which door is the Long Store, and its key. The plan says where the door is. Remember that the diver is not looking at the plan: the diver is standing at the bottom of the stairs, looking along the corridor.',
      'On the plan, north is at the top and the stairs come down at the west end, on the left. If you walk east along the corridor from the stairs, which side is north: your left, or your right?',
      'The keys are labelled with the maker and the picture on the lock plate, not with the room. Ask the diver to spell the maker&rsquo;s name and describe the picture on the lock of the door they are standing at. Make sure it is the right door first.'
    ]];
  }
  function begin() {
    paint();
    if (nextFile) { busy = false; ER.say('The key has gone down the line. Mr Blundell is paying out more rope.'); return; }
    if (told.intro) { busy = false; ER.say('The Lodge. The radio is hissing, and the plan is on the wall.'); return; }
    ER.narrate([
      'The Lodge is the size of a lift, and it is full: a desk, a radio, a kettle, a key cupboard, a sleeping cat, and Mr Ossie Blundell, the night porter. He sits on a stool in the doorway, feeding the diver&rsquo;s line down the steps a little at a time, like a man flying a kite into a well.',
      '&ldquo;Forty-one years I&rsquo;ve been porter here,&rdquo; he says, without turning round, &ldquo;and that basement has never once been wet. Damp, yes. Damp is different.&rdquo;',
      'The radio on the desk hisses. At the bottom of twelve steps, the diver is looking along the Lower Corridor with a torch, and waiting for you. The plan of the basement is pinned on the wall beside you.'
    ], function () { busy = false; tell('intro'); paint(); });
  }

  /* ---------- people and papers ---------- */
  $('#plan').addEventListener('click', function () { if (!busy) LG.plan(function () { if (tell('plan')) { paint(); ER.say('Six doors, a strongroom, and the stairs at the west end. The diver is standing at the bottom of those stairs.'); } }); });
  $('#rules').addEventListener('click', function () { if (!busy) LG.rules(); });
  $('#blundell').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Mr Ossie Blundell', role: 'Night porter · forty-one years', face: LG.FACE.blundell,
      lines: [
        { note: 'He does not look round. He is paying out the line, an arm&rsquo;s length at a time.', a: '&ldquo;If that diver wants anything down there, it goes down this line, and it goes from me.&rdquo;' },
        { q: 'Which doors are locked?', a: 'All of them, except the coal store and the lift gate, and nobody wants either of those. The plan&rsquo;s on the wall. I pinned it up myself in 1998, and I&rsquo;ve never once needed it, till tonight.' },
        { q: 'Why not go in by the main doors of the Long Store?', a: 'The front stairs are full of water to the ceiling. And when I went down at nine with a torch, the big glass case in the store fell over, right across the main doors. So the diver goes in by the back doors, from the corridor. Nobody ever goes in by the back.' },
        { q: 'Which key is it?', a: 'Ask the lock. I don&rsquo;t write room names on keys: a key with the name of a room on it is a present for a burglar. I write who made the lock, and the picture on its plate. There were two locksmiths in Ferry Street, Trask and Hollin. They hated each other for fifty years, and between them they made every lock in this building. The diver can see the plate. You can see the keys.' },
        { q: 'How do I send a key down?', a: 'You give it to me. I clip it to the line, and when the diver pulls twice, down it goes. Thirty metres of line, and I can feel every move on it, like a fish.' }
      ],
      clue: { id: 'blundell1', title: 'Mr Blundell, about the doors and the keys', kind: 'What he said' },
      done: function (seen) { if (seen && tell('blundell')) { paint(); ER.addWord('locksmith', 'a person who makes and mends locks'); } }
    });
  });

  /* ---------- the key cupboard ---------- */
  function keySvg(k, x, y) {
    var s = '<g class="kk" data-k="' + k.id + '">';
    if (k.old === true) s += '<circle cx="' + x + '" cy="' + (y + 18) + '" r="14" fill="none" stroke="#b39a52" stroke-width="6"/><path d="M' + x + ' ' + (y + 32) + 'v74" stroke="#b39a52" stroke-width="6"/><path d="M' + x + ' ' + (y + 92) + 'h14v8h-8v6h8" stroke="#b39a52" stroke-width="5" fill="none"/>';
    else if (k.old === false) s += '<circle cx="' + x + '" cy="' + (y + 20) + '" r="14" fill="#c9cdc9" stroke="#8a8f8a" stroke-width="3"/><path d="M' + (x - 5) + ' ' + (y + 32) + 'h10v40l-3 4 3 4 -3 4h-7z" fill="#c9cdc9" stroke="#8a8f8a" stroke-width="2"/>';
    s += '<rect class="tag" x="' + (x - 62) + '" y="' + (y + 112) + '" width="124" height="34" rx="3" fill="#f1ead2" stroke="#8a7a5a" stroke-width="1.5"/>' +
      '<text x="' + x + '" y="' + (y + 135) + '" font-family="Kalam,cursive" font-weight="700" font-size="' + (k.tag.length > 16 ? 12 : 15) + '" fill="#2a2a5a" text-anchor="middle">' + k.tag + '</text>';
    s += '<circle cx="' + x + '" cy="' + y + '" r="5" fill="#c9a94e"/><rect x="' + (x - 64) + '" y="' + (y - 8) + '" width="128" height="160" fill="#000" fill-opacity="0"/></g>';
    return s;
  }
  function openKeys() {
    if (busy) return;
    if (nextFile) { ER.say('The key you sent is down there now, in the diver&rsquo;s hand.'); return; }
    if (!keybox) keybox = makeKeys();
    keybox.open();
  }
  function makeKeys() {
    var box = ER.el('div', 'bx keys'), sel = null, s = '<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="400" fill="#3a2614"/><rect x="10" y="10" width="880" height="380" fill="none" stroke="#5a3a1e" stroke-width="10"/>';
    KEYS.forEach(function (k, i) { s += keySvg(k, 85 + (i % 6) * 146, 30 + Math.floor(i / 6) * 190); });
    box.innerHTML = s + '</svg><div class="bx-foot"><p class="pmsg"></p><button type="button" class="btn" id="give">Give it to Mr Blundell</button></div>';
    var msg = function (t) { box.querySelector('.pmsg').innerHTML = ER.gloss(t); };
    box.querySelector('svg').addEventListener('click', function (e) {
      var g = e.target.closest ? e.target.closest('.kk') : null; if (!g) return;
      sel = g.getAttribute('data-k');
      ER.$$('.kk', box).forEach(function (n) { n.classList.toggle('sel', n === g); });
      var k = KEYS.filter(function (x) { return x.id === sel; })[0];
      LG.sfx.keys();
      msg(k.old === null ? 'An empty hook, with a label: STRONGROOM: ask Mrs T.' : 'You take down the key labelled <b>' + k.tag + '</b>.');
    });
    box.querySelector('#give').addEventListener('click', function () {
      if (!sel) { msg('Take a key down first: click on it.'); return; }
      var k = KEYS.filter(function (x) { return x.id === sel; })[0];
      if (k.old === null) { ER.sfx.no(); msg('&ldquo;The strongroom key is in Mrs Treharne&rsquo;s handbag, on the other side of the river,&rdquo; says Mr Blundell, &ldquo;which is exactly where it ought to be.&rdquo;'); return; }
      if (k.old === false) { ER.sfx.no(); msg('&ldquo;That one&rsquo;s for upstairs,&rdquo; says Mr Blundell. &ldquo;Everything down there is Trask or Hollin.&rdquo;'); return; }
      var file = ER.exit([sel], { wait: true });
      if (!file) {
        ER.sfx.no();
        var mk = k.tag.split(' · ')[0], pc = k.tag.split(' · ')[1];
        msg('&ldquo;' + mk.charAt(0) + mk.slice(1).toLowerCase() + ', and ' + (/^[aeiou]/.test(pc) ? 'an ' : 'a ') + pc + '?&rdquo; says Mr Blundell. &ldquo;Is that what&rsquo;s on the plate of the door the diver wants? The maker, and the picture: both. I&rsquo;m not sending a key down twelve steps on a guess.&rdquo;');
        return;
      }
      nextFile = file; ER.flag('b1-file', file);
      msg('&ldquo;Trask, and a fish,&rdquo; says Mr Blundell. He clips it to the line. &ldquo;Tell the diver to pull twice.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint();
        ER.narrate([
          'Two pulls on the line. Mr Blundell lets it run, and the key goes down the steps on its clip, bumping on every one.',
          'The radio is quiet for a long moment. Then, from the bottom of the stairs, comes a sound that you can hear without the radio at all: two old doors opening against the water.'
        ], function () { busy = false; paint(); });
      }, 2600);
    });
    msg('Twelve hooks. Every label says who made the lock, and what picture is on the lock plate. Click on a key to take it down.');
    return { open: function () { ER.open('ov-lock', box); }, isOpen: function () { return !!box.parentNode; } };
  }
  $('#keys').addEventListener('click', openKeys);

  /* ---------- other things ---------- */
  LG.thing('#radio', 'radio', 'The dive team&rsquo;s radio. Press the button on the microphone to talk; let go to listen. Your partner is the voice in it.', isBusy);
  LG.thing('#win', null, 'Rain, and the street lamp in Ferry Street. The street is a river this evening, a brown one, going the wrong way.', isBusy);
  LG.thing('#kettle', 'kettle', '&ldquo;Tea&rsquo;s for after,&rdquo; says Mr Blundell, without looking round.', isBusy);
