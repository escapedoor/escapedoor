<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Up the Steps · Open This Together</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-duo.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="dive.css">
<style>
  body{--bg:#0c0a08;--accent:#ffd27a;--font-display:'Fraunces',serif;--font-ui:'Barlow Condensed',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(16,12,8,.95);--tc-ink:#fbf0dc;--cap-bg:rgba(18,13,8,.93);--panel:#1c150c;--face-bg:#2b2010;--q-ink:#ffd9a0;--fade:#060403;--hud-bg:rgba(18,13,8,.82)}
  .pcard{background:rgba(255,246,228,.95);color:#2a1c0c;border-left-color:#e2a64a}
  .pcard h6,.pcard .fold{color:#a8621a}
  #lodge{animation:warm 5s steps(3,end) infinite alternate}
  @keyframes warm{from{opacity:.88}to{opacity:1}}
  #partner,#plate2{opacity:0;transition:opacity 1.6s}
  body.met #partner,body.met #plate2{opacity:1}
  .rip{animation:rip 5s ease-in-out infinite alternate}
  @keyframes rip{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="doorL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="#f0a84a"/></linearGradient>
  <radialGradient id="spill" cx="50%" cy="10%" r="80%"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".45"/><stop offset=".6" stop-color="#ffb04a" stop-opacity=".08"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
  <linearGradient id="wE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3a38"/><stop offset="1" stop-color="#050f0e"/></linearGradient>
  <radialGradient id="vigE" cx="50%" cy="40%" r="78%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".65" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient>
</defs>
<rect x="-1000" y="-700" width="3600" height="2400" fill="#0c0a08"/>
<!-- the stairwell, looking up from the water -->
<polygon points="-1000,-700 560,40 560,900 -1000,1700" fill="#2a2620"/>
<polygon points="2600,-700 1040,40 1040,900 2600,1700" fill="#25211b"/>
<g stroke="#1c1914" stroke-width="2" opacity=".8" id="sbricks"></g>
<!-- the Lodge door at the top, and the light coming out of it -->
<g id="lodge"><rect x="640" y="20" width="320" height="250" fill="url(#doorL)"/><rect x="640" y="20" width="320" height="250" fill="none" stroke="#3a2a14" stroke-width="10"/>
  <rect x="680" y="60" width="110" height="80" fill="#e6b860"/><path d="M700 80h70M700 100h50M700 120h60" stroke="#8a5a1a" stroke-width="4"/><path d="M880 40v120" stroke="#8a5a1a" stroke-width="3"/><circle cx="880" cy="170" r="14" fill="#8a5a1a"/></g>
<rect x="-1000" y="-700" width="3600" height="1800" fill="url(#spill)" pointer-events="none"/>
<g id="steps"></g>
<!-- Mr Blundell on his stool, winding in the line -->
<g id="blundell" class="hot"><path d="M690 268l-10 60M740 268l10 60" stroke="#3a2a14" stroke-width="6"/><rect x="676" y="256" width="80" height="14" fill="#5a3e1e"/><path d="M682 256q-6 -90 34 -100t40 100z" fill="#2c3a52"/><circle cx="718" cy="134" r="24" fill="#d9a888"/><path d="M696 128q22 -30 46 0" stroke="#e6e2d8" stroke-width="9" fill="none"/>
  <path d="M752 200q40 20 60 60" stroke="#2c3a52" stroke-width="14" fill="none" stroke-linecap="round"/><ellipse cx="820" cy="262" rx="30" ry="12" fill="none" stroke="#d9b34a" stroke-width="7"/></g>
<!-- the operator, in the doorway, with a towel -->
<g id="partner" class="hot"><path d="M860 270q-10 -110 40 -120h20q50 10 40 120z" fill="#3a2a22"/><circle cx="910" cy="126" r="26" fill="#c99a76"/><path d="M884 120q26 -34 52 0q-4 -22 -26 -24q-22 2 -26 24z" fill="#2a1c12"/>
  <path d="M866 200h90v40h-90z" fill="#f1ebdc"/><path d="M866 214h90M866 226h90" stroke="#c94a3a" stroke-width="4"/></g>
<!-- the line, coming up the steps -->
<path d="M820 262q-40 120 -20 260t60 380" stroke="#d9b34a" stroke-width="9" fill="none" stroke-linecap="round" pointer-events="none"/>
<!-- the water at the foot of the stairs, and a wet line above it on the wall -->
<polygon points="-1000,760 2600,760 2600,1700 -1000,1700" fill="url(#wE)" fill-opacity=".92" pointer-events="none"/>
<g id="tideline" class="hot"><path d="M-1000 722L560 722M1040 722L2600 722" stroke="#4a5a52" stroke-width="10" opacity=".9"/><path d="M-1000 760H2600" stroke="#8fc9bf" stroke-width="3" opacity=".6"/></g>
<g class="rip" pointer-events="none" stroke="#5fa79d" stroke-width="2" fill="none" opacity=".4"><path d="M300 800q60 -6 120 0t120 0M900 820q50 -5 100 0t100 0M500 880q80 -8 160 0t160 0"/></g>
<!-- the box, in its dry bag, in your arms -->
<g id="box" class="hot"><path d="M560 1000q-20 -150 60 -170h360q80 20 60 170z" fill="#e8d04a" opacity=".55"/><rect x="600" y="760" width="400" height="190" rx="10" fill="#7a5530" stroke="#3e2a14" stroke-width="5"/>
  <rect x="600" y="760" width="40" height="40" fill="#c9a94e"/><rect x="960" y="760" width="40" height="40" fill="#c9a94e"/><path d="M572 840h28M1000 840h28" stroke="#c9a94e" stroke-width="14" stroke-linecap="round"/>
  <rect x="690" y="830" width="220" height="44" fill="#d4b45a" stroke="#6a5520" stroke-width="2"/><text x="800" y="860" class="sv" font-size="22" letter-spacing="1" fill="#3a2a08">OPEN THIS TOGETHER</text>
  <path id="plate2" d="M570 860q-60 -10 -90 30M1030 860q60 -10 90 30" stroke="#1b2324" stroke-width="40" fill="none" stroke-linecap="round"/></g>
<rect x="-1000" y="-700" width="3600" height="2400" fill="url(#vigE)" pointer-events="none"/>
</svg>
</div>
<div class="done" id="done">
  <h3><small>Open This Together · the diver&rsquo;s part</small>The box is out of the water.</h3>
  <p id="d-time"></p><p id="d-hints"></p><p id="d-words"></p>
  <p>Your partner&rsquo;s screen shows the same ending, from the top of the steps.</p>
  <div class="row"><button type="button" class="btn" id="b-task">Write the dive report</button><button type="button" class="btn" id="b-book">Notebook</button><button type="button" class="btn" id="b-lobby">Back to the stories</button></div>
  <small>Open This Together &middot; <button type="button" id="b-reset">play this part again from the start</button></small>
</div>

<script src="words.js"></script>
<script src="../../assets/engine.js"></script>
<script src="dive.js"></script>
<script>
(function () {
  var $ = ER.$, busy = true;
  (function () {
    var s = '', i, y, w;
    for (i = 0; i < 9; i++) {                          /* twelve steps go up; nine of them are out of the water */
      y = 740 - i * 54; w = 520 - i * 26;
      s += '<g class="hot stp"><rect x="' + (800 - w) + '" y="' + y + '" width="' + (2 * w) + '" height="' + (54 * 0.45) + '" fill="' + (i % 2 ? '#5a554a' : '#625c50') + '"/><rect x="' + (800 - w) + '" y="' + (y + 24) + '" width="' + (2 * w) + '" height="30" fill="#3a3630"/></g>';
    }
    $('#steps').innerHTML = s; s = '';
    for (y = -100; y < 760; y += 34) s += '<path d="M-1000 ' + (y + 80) + 'L560 ' + (y * 0.92 + 40) + 'M2600 ' + (y + 80) + 'L1040 ' + (y * 0.92 + 40) + '"/>';
    $('#sbricks').innerHTML = s;
  })();

  ER.init({
    theme: 'duo', story: 'dive-a', storyTitle: 'Open This Together', id: 'landing', no: 'V', title: 'Up the Steps',
    go: 'Go up',
    intro: [
      'The river was coming in through the old storm drain from the coal chute, because the flap at the river end had stuck open. The operator found it on the plan of 1898: drain number 3, under the coal chute. Its wheel was on the thick pipe with the red band that goes DOWN into the floor (the other red one goes up), and the plan said to turn it so that its top went towards the boiler. The boiler was on your left: so you turned the wheel anticlockwise, eight turns, until it stopped.',
      'It is twenty-five past eleven. In the yard, the pump is winning.'
    ],
    exit: {"last":true,"rooms":5,"stars":3}, tags: {},
    hints: function () { return ER.flag('a5-done') ? null : ['end', ['Nothing to solve here. Listen to the end of the story.']]; },
    onBegin: begin
  });

  function isBusy() { return busy; }
  function begin() {
    if (ER.flag('a5-done')) { busy = false; document.body.classList.add('met'); finish(true); return; }
    ER.narrate([
      'You swim back the way you came: out of the Boiler Room, along Bay D, past the eel, under the wooden woman with her lantern, out by the back doors and along the corridor. The line leads you all the way, like the thread in an old story.',
      'At the bottom step you stop and look at the wall. There is a wet line on the bricks, a finger&rsquo;s width above the water. The water is going down.',
      'You climb. The box is much heavier out of the water than it was in it. It has two handles, one at each end, and you have only two hands, and one of them is holding the torch.'
    ], function () {
      document.body.classList.add('met');
      ER.narrate([
        'At the top of the steps the door of the Lodge is open, and the light is yellow and warm. Mr Blundell is on his stool, winding in your line. And in the doorway behind him, holding a towel, is the person who has been talking in your ear for forty minutes. Until now you have never seen each other&rsquo;s faces.',
        'Neither of you says anything clever. The operator comes down two steps and takes the other handle, and the two of you carry the box up together, because, it turns out, that is the only way it can be carried.',
        'In the light from the Lodge, the brass plate says OPEN THIS TOGETHER.',
        'Mrs Treharne, the curator, is on the Lodge telephone, from the far side of the river. &ldquo;In 1926 the school chose two girls to carry it to the wall: Dulcie Hext and Edie Tozer, best friends. Neither of them would let go of her handle, so the teacher had the plate made.&rdquo;',
        '&ldquo;On Saturday the seventh of November, at eleven o&rsquo;clock, somebody has to open it, in front of the whole town,&rdquo; says Mrs Treharne. &ldquo;I think it had better be two people.&rdquo;'
      ], function () { busy = false; ER.flag('a5-done', 1); finish(false); });
    });
  }
  function finish(quick) {
    var st = ER.state(), mins = DV.mins(), hn = ER.hintsUsed();
    $('#d-time').textContent = 'From the bottom step and back: ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
    $('#d-hints').textContent = hn ? 'Hints asked for: ' + hn + '.' : 'Hints asked for: none at all.';
    $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' things and ' + Object.keys(st.words).length + ' words.';
    $('#done').classList.add('on');
    DV.card([['Ask your partner', ['&ldquo;What did you see up there, while I was down here?&rdquo;', '&ldquo;What would you put in a box for the children of 2126?&rdquo;']]]);
    if (quick) ER.say('The top of the steps. The box is on Mr Blundell&rsquo;s desk, with a towel over it.');
    else { DV.sfx.splash(); try { if (ER.track && ER.music()) ER.track.play(['duet', { root: 53, bpm: 84, drop: ['ost'] }]); } catch (e) {} }
  }
  DV.thing('#blundell', null, function () { return busy ? null : '&ldquo;Forty-one years,&rdquo; says Mr Blundell, &ldquo;and that was the first time anybody has had to swim in that basement. Paddle, yes. Swim, no.&rdquo; He looks at the puddle round your feet. &ldquo;Mind my floor.&rdquo;'; }, isBusy);
  DV.thing('#partner', null, function () { return busy ? null : 'Your partner, the operator: the voice on the radio, with a face at last. Ask them something. They have been up here all night with the plans, watching the water on a dial.'; }, isBusy);
  DV.thing('#box', null, function () { return busy ? null : 'The Rillmouth Box: oak, brass corners, a handle at each end, and a hundred years of letters inside, dry. OPEN THIS TOGETHER. Not yet. On the seventh of November.'; }, isBusy);
  DV.thing('#tideline', null, 'A wet line on the bricks, above the water. Every time you look, the water is a little further below it.', isBusy);
  ER.$$('.stp').forEach(function (n) { n.addEventListener('click', function () { if (!busy) ER.say('Twelve steps. When you came down, nine of them were dry. Now ten are.'); }); });
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });
  $('#b-task').addEventListener('click', function () {
    var saved = ER.flag('task') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>For the records of Rillmouth Museum</h4><h3>The dive report</h3>' +
      '<p>Mrs Treharne wants a report from the diver for the museum&rsquo;s records: where you went, what you saw, and what you did, in the order it happened.</p>' +
      '<p><b>A</b> Write the report in 60 to 90 words. Use at least five of these: on my left, on my right, opposite, between, under, at the far end, the second from the, first, then, after that, anticlockwise.<br><b>B</b> Or, with your partner: write a letter to go into a new box, for the children of Rillmouth in 2126. You write one sentence, your partner writes the next, and so on, until you have ten.</p>' +
      '<textarea id="r1"></textarea><div class="count"></div><label for="r2">Written by</label><input type="text" id="r2" maxlength="60">' +
      '<div class="foot"><span>Nobody marks this. It is saved in this browser as you write.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > p');
    box.querySelector('#r1').value = saved.r1 || ''; box.querySelector('#r2').value = saved.r2 || '';
    function keep() {
      var o = { r1: box.querySelector('#r1').value, r2: box.querySelector('#r2').value }, n = (o.r1.match(/[A-Za-z’']+/g) || []).length;
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('task', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
