(function () {

        for (i = 0.1; i < top; i += 0.1) { a = P(d.side, x1 + 6, i); b = P(d.side, x2 - 6, i); s += '<circle cx="' + a[0].toFixed(1) + '" cy="' + a[1].toFixed(1) + '" r="2" fill="#6b5f4e"/><circle cx="' + b[0].toFixed(1) + '" cy="' + b[1].toFixed(1) + '" r="2" fill="#6b5f4e"/>'; }
        s += '<path d="' + line(d.side, x1 + 8, 1, x1 + 8, top + 0.06) + line(d.side, x1 + 8, top + 0.06, x2 - 4, top + 0.06) + '" stroke="#5a4636" stroke-width="10" fill="none"/>';

      'Somewhere on a top shelf in the Long Store, just above the water, there is a box that has been waiting since 1926.'

    else DV.card([['Tell your partner', ['&ldquo;Topside, this is Diver. I&rsquo;m on the bottom step. I can see &hellip; doors on my left and &hellip; on my right.&rdquo;']], ['Ask your partner', ['&ldquo;Which door is the Long Store? Is it on my left or on my right?&rdquo;']]]);

      'Your partner has the plan of the basement, and you have the view. Tell them what you can see from the bottom step: how many doors, on which side, and what each one looks like.',

    return ['key', [
      'Doors this old are always locked. Topside has the key cupboard; the keys are labelled by what is on the lock plate, not by the name of the room. Tell your partner exactly what you see on this lock.',

    return s + '<path d="M0 200q47 -6 95 0t95 0t95 0t95 0" stroke="#7fd1c6" stroke-width="3" fill="none"/></svg>';
  }
  function where(k) {
    if (k === 'e') return 'At the far end of the corridor, facing you.';
    var d = DOORS[k], n = { 60: 'nearest to you', 360: 'in the middle', 548: 'furthest from you' }[d.x[0]];
    return 'On your ' + (d.side === 'L' ? 'left' : 'right') + ', the door ' + n + '.';
  }
  var LOOKS = {
    double: 'Double doors, painted dark green, with a round window in each half, like the portholes of a ship. Behind the glass there is nothing but black water. An empty brass frame for a sign, two brass handles, and a brass lock plate just above the water.',
    iron: 'A narrow door of black iron, with rows of rivets. Two old pipes come down the wall and go into the wall just above it. An empty brass frame for a sign.',
    lift: 'Not a door: a folding metal gate, like a fence, with a yellow sign on it that says OUT OF USE. Behind the gate, a lift shaft full of water.',
    low: 'A low wooden door, made of planks, with an iron bar across it. Most of it is under the water. Anyone going through it would have to swim.',
    steel: 'A steel door with a wheel in the middle instead of a handle, like the door of a ship. Somebody has painted on it, in yellow letters: DO NOT OPEN IN A FLOOD.'
  };
  var TRY = {
    l3: 'You pull the iron door. It opens an inch, and brown water pushes out through the gap, cold, as if it were in a hurry to be somewhere. There is nothing to see in there but brown. You let the door shut.',
    r1: 'You rattle the gate. Behind it, in the lift, a filing cabinet is floating on its back, with all its drawers open. It is not a store. It is not even a lift any more.',
    r3: 'You lift the bar and duck under. Coal, water, and a bucket floating upside down. No shelves, no boxes: a coal store is a coal store, even in a flood. You come back out.',
    e: 'DO NOT OPEN IN A FLOOD, says the door. You do not open it. On the radio, that is called a good decision.'
  };
  function door(k) {
    if (busy) return;
    if (nextFile) { ER.say('The doors of the Long Store are open. The others can stay shut.'); return; }
    var d = DOORS[k] || { kind: 'steel' }, look;
    tell('looked');
    look = DV.look({
      kicker: where(k), title: d.kind === 'double' ? 'Double doors' : d.kind === 'iron' ? 'An iron door' : d.kind === 'lift' ? 'A metal gate' : d.kind === 'low' ? 'A low door' : 'A steel door',
      pic: doorSvg(d), text: '<p>' + LOOKS[d.kind] + '</p>' + (here === k ? '<p>This is the door you are waiting at.</p>' : ''),
      acts: [{ id: 'try', label: here === k ? 'Look at the lock' : 'Wade to it and try it', fn: function (api) { tryDoor(k, api); } }]
    });
    paint();
  }
  function tryDoor(k, api) {
    var d = DOORS[k];
    DV.sfx.wade();
    if (!d || d.kind !== 'double') { api.msg(TRY[k]); return; }
    here = k; ER.flag('a1-here', here); paint();
    api.pic(plateSvg(d.plate));
    api.msg('Locked. You hold the torch close to the lock plate: a brass oval, with a name, a word, and a small picture.');
    api.acts([{ id: 'pull', label: 'Pull the line for the key', fn: function () { pull(k, api); } }]);
    ER.addWord('lock plate', 'the metal plate round a keyhole');
  }
  function pull(k, api) {
    if (pulling) return;
    pulling = true;
    api.acts([]);
    api.msg('You give the line two pulls. At the top of the steps, Mr Blundell says something about his knees. Then a key comes down the line on its clip, bumping on every step &hellip;');
    setTimeout(function () {
      DV.sfx.clink();
      var file = ER.exit([k], { wait: true });
      pulling = false;
      if (!file) {
        ER.sfx.no();
        api.msg('The key goes into the lock, and stops. It will not turn. You send it back up the line with one pull. Either this is the wrong door, or that was the wrong key. Check both with your partner.');
        api.acts([{ id: 'pull', label: 'Pull the line again', fn: function () { pull(k, api); } }]);
        return;
      }
      nextFile = file; ER.flag('a1-file', file);
      api.msg('The key turns, with a noise like an old man getting out of a chair.');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint();
        ER.narrate([
          'The two doors open inwards, slowly, pushing the water in front of them. Inside, three more steps go down, and then there is nothing under your feet at all.',
          'Your torch finds shelves: tall ones, in rows, with black water up to their shoulders and odd shapes standing on top of them. The Long Store. Eleven thousand things that are not on show, and one that has waited a hundred years.'
        ], function () { busy = false; paint(); });
      }, 2400);
    }, 4200);
  }
  ER.$$('.door').forEach(function (n) { n.addEventListener('click', function () { door(n.getAttribute('data-d')); }); });

  /* ---------- other things ---------- */
  DV.thing('#step', 'step', 'The last dry step. The one below it is under the water, and so is the one below that, and so on, presumably, for ever.', isBusy);
  DV.thing('#pipes', 'pipe', 'Pipes along the ceiling. One of them is dripping steadily into the corridor, which, tonight, makes no difference at all.', isBusy);
  DV.thing('#bulb', 'bulb', 'A light bulb. The power to the basement was switched off at nine o&rsquo;clock, very sensibly, by Mr Blundell.', isBusy);
  $('#line').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'line');
    ER.say(here && !nextFile ? 'The line goes up the steps to Mr Blundell. Go to the door, and pull the line from there when the key is on its way.' : 'Your line: thirty metres of yellow rope from your belt to Mr Blundell, at the top of the steps. Two pulls mean &ldquo;send it down&rdquo;. As long as the line is there, you can always find the way back.');
  });
  $('#slateg').addEventListener('click', function () { if (!busy) DV.slate(); });
  var LEAF = '<h4>Rillmouth Museum</h4><p><b>Three Hundred Years of River Life</b></p><p>Downstairs, our Long Store keeps the eleven thousand things that are not on show: from a stuffed bear to a figurehead, from a penny-farthing to a time capsule sealed by the children of Rillmouth School in 1926.</p><p>The river has always been part of Rillmouth. Come and see it!</p>';
  $('#leaflet').addEventListener('click', function () { if (!busy) ER.read({ html: LEAF, cls: 'leaf', clue: { id: 'leaf', title: 'A museum leaflet', kind: 'Floating past' } }); });
  $('#go').addEventListener('click', function () { if (nextFile && !busy) ER.leave(nextFile); });
})();
</script>
</body>
</html>
