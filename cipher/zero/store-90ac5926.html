  /* Standing Orders, and the strip of numbers */
  .bk{display:grid;grid-template-columns:minmax(0,640px) 380px;gap:22px;width:min(1050px,96vw);align-items:start}
  .bk-page{position:relative;padding:20px 30px 16px 26px;background:#e9e4d2 linear-gradient(100deg,rgba(0,0,0,.14),transparent 7%,transparent 94%,rgba(0,0,0,.1));box-shadow:0 26px 70px rgba(0,0,0,.7);
    border-left:14px solid #2f3a2c;color:#1c1b18}
  .bk-page h5{margin:0;font-family:'Stardos Stencil',serif;font-weight:700;font-size:21px;letter-spacing:.12em;color:#2f3a2c}
  .bk-page h6{margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid #2f3a2c;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#4a473e;
    display:flex;justify-content:space-between}
  .bk-line{position:relative;display:flex;height:29px;font-family:'Courier Prime',monospace;font-size:15px;line-height:29px;white-space:nowrap}
  .bk-line u{flex:none;width:32px;text-decoration:none;font-weight:700;color:#8c2f24;font-size:13.5px}
  .bk-line em{position:absolute;right:-20px;top:0;font-style:normal;font-family:'Oswald',sans-serif;font-size:11px;color:#8a8370}
  .bk-w{padding:1px 1px;border-radius:2px;cursor:pointer}
  .bk-w:hover{background:rgba(244,224,77,.75)}
  .bk-w.got{background:#2f3a2c;color:#f4e04d}
  .bk-turn{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .bk-turn button{padding:5px 14px 3px;border:1.5px solid #2f3a2c;color:#2f3a2c;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.14em;border-radius:2px}
  .bk-turn button:hover:not([disabled]){background:#2f3a2c;color:#e9e4d2}
  .bk-turn button[disabled]{opacity:.25;cursor:default}
  .bk-turn span{font-family:'Courier Prime',monospace;font-size:14px;color:#4a473e}
  .bk-side h5{margin:0 0 8px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:#a9bccb}
  .bk-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
  .bk-strip button{display:block;padding:6px 4px 4px;background:#e6dfcb;color:#1c1b18;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.5)}
  .bk-strip button b{display:block;font-family:'Courier Prime',monospace;font-weight:700;font-size:17px;letter-spacing:.04em}
  .bk-strip button i{display:block;height:22px;font-style:normal;font-family:'Caveat',cursive;font-weight:700;font-size:22px;line-height:22px;color:#1d2a52;text-transform:uppercase}
  .bk-strip button.cur{outline:3px solid #f4e04d;outline-offset:1px}
  .bk-strip button.ok{background:#f6f1e2}
  .bk-strip button.ok b{color:#8a8370}
  .bk-side .pmsg{min-height:96px;font-size:16px}
  @media (max-width:1000px){.bk{grid-template-columns:1fr}}
</style>

(function () {
  var $ = ER.$, called = false, solved = false, leaving = false;
  /* Standing Orders: three pages of twelve lines. NUM says which lines begin an order (the number is printed in the margin). */
  var PAGES = [[
    'In every signal this station is GANNET HEAD and', 'nothing else. No other name is to be used.', 'The work of the station is to listen. An operator',
    'who is listening is ON WATCH. It is never a shift.', 'A receiver is a SET. The transmitter is the SENDER.', 'The sender is used only by order of the S.O.',
    'An operator may not leave her set until her RELIEF,', 'the operator who takes the next watch, has come.', 'No operator closes her own watch. Only her relief',
    'can close it, in the log and on the key, with', 'the one word that is kept for that purpose.', 'Until that word is sent, the watch is still open.'
  ], [
    'The log is the memory of the station. Every signal', 'heard is entered at once, in ink, at the true time.', 'No entry is ever to be rubbed out or written again.',
    'A wrong entry is struck through, so that it can', 'still be read, and initialled by the operator.', 'No page is ever to be taken out of the log.',
    'The safe is in the cellar. The S.O. and the senior', 'operator each hold a key to the cellar door.', 'Cipher sheets go back in the safe after each watch.',
    'The word that opens the safe is changed on the first', 'of the month by the senior operator, and nobody else.', 'In a storm all eight aerial leads are to be watched.'
  ], [
    'The aerial box at the foot of the mast is Mr Ito’s.', 'Nobody else is to put a hand in it without reason.', 'If a lead comes out, put it back in its own socket.',
    'With the leads out, the sender can be heard only as', 'far as the foot of the hill, and is no use to anybody.', 'The field telephone has one line and one bell. It is',
    'for station business, and not for ordering fish.', 'Control is reached by the sender, and in no other way.', 'The S.O. is on call in his house every night of the',
    'year. He is to be told at once of any distress call.', 'These orders can be changed only by Control. A true', 'copy is kept in the store, and may not be taken away.'
  ]];
  var NUM = [{ 1: 1, 3: 2, 5: 3, 7: 4, 9: 5, 12: 6 }, { 1: 7, 3: 8, 6: 9, 7: 10, 9: 11, 10: 12, 12: 13 }, { 1: 14, 3: 15, 4: 16, 6: 17, 8: 18, 9: 19, 11: 20 }];
  /* part three of the strip, as it came off the printer */
  var GROUPS = ['3.11.10', '2.6.2', '1.1.1', '2.8.8', '2.9.7', '2.7.6', '1.10.10', '3.3.9', '2.12.6', '3.1.3', '3.2.5', '2.9.4', '2.12.4', '2.12.5', '3.4.3'];

  /* the shelves */
  (function () {
    var s = '', r, x, w, i = 0, bays = [[66, 540], [720, 1196]], names = ['WEATHER', 'SHIPPING', 'LOG', 'RETURNS', 'FUEL'], cols = ['#5d6a70', '#6b767b', '#55606a', '#7a735f', '#4d5a61'];
    bays.forEach(function (b) {

      for (r = 0; r < 5; r++) {

            '<text x="' + (x + (w - 10) / 2) + '" y="' + (262 + r * 100) + '" class="bx" style="fill:#b8923a">' + (20 + (i % 19)) + '</text>';

            '<rect x="' + (x + 5) + '" y="' + (232 + r * 100) + '" width="' + (w - 10) + '" height="26" fill="#d9d2b8"/><text x="' + (x + w / 2) + '" y="' + (243 + r * 100) + '" class="bx" font-size="6.5">' + names[r].slice(0, 4) + '</text>' +
            '<text x="' + (x + w / 2) + '" y="' + (254 + r * 100) + '" class="bx">' + (1 + (i * 5) % 48) + '</text>';

        s += '<rect x="' + (b[0] - 10) + '" y="' + (300 + r * 100) + '" width="' + (b[1] - b[0] + 20) + '" height="9" fill="#3a4650"/>';

      s += '<rect x="' + (b[0] - 10) + '" y="96" width="9" height="548" fill="#3a4650"/><rect x="' + (b[1] + 1) + '" y="96" width="9" height="548" fill="#3a4650"/><rect x="' + (b[0] - 10) + '" y="200" width="' + (b[1] - b[0] + 20) + '" height="9" fill="#3a4650"/>';

    $('#shelves').innerHTML = s.replace(/y="(\d+)"/g, function (m, y) { return 'y="' + (+y - 100) + '"'; }).replace(/rotate\(5 (\d+) (\d+)\)/g, function (m, a, b) { return 'rotate(5 ' + a + ' ' + (+b - 100) + ')'; });
  })();

  ER.init({
    theme: 'cipher', story: 'zero', storyTitle: 'Station Zero', id: 'store', no: 'III', title: 'The Records Store',
    sound: ['shore', { root: 40, bpm: 40, drop: ['mel', 'ost'], beds: [['sea', 0.45]] }],
    go: 'Find the book',
    intro: [
      'Part two gave way to counting. The commonest letter on the sheet was E, the name of the boat gave you six letters at a stroke, and the rest came a word at a time. Written out under the plain alphabet, the cipher began with its own key word, LIFEBOAT, and the steel door opened to that.',
      'So now you know what the tape is. It is your grandmother&rsquo;s own account of the night of the <i>Kittiwake</i>, and it is not the story on the plaque.',
      'The records store is cold, and smells of old paper. Thirty years of nothing have happened in here, very quietly. Mrs Holloway has put two bookmarks in the station log, for the visitors.',

    ],

    hints: hints,
    onBegin: begin
  });
  ZERO.clock();
  called = !!ER.flag('call3'); solved = !!ER.flag('s3');

  var LOGA = '<h4>Station log &middot; night of 9 to 10 November</h4>' +
    '<p class="q2"><b>0000</b> Middle watch opened by Operator Thorne. Wind south-west, rising.</p>' +
    '<p class="q2"><b>0214</b> Weak distress call recieved by Station Officer from trawler Kittiwake.</p>' +
    '<p class="q2"><b>0216</b> Bearing taken by S.O.: 304 degrees.</p>' +
    '<p class="q2"><b>0220</b> Town lifeboat telephoned by S.O.</p>' +
    '<p class="q2"><b>0311</b> Recieved from lifeboat: Kittiwake in tow, all six men safe.</p>' +
    '<p class="q2"><b>0400</b> Watch relieved. D.M. &nbsp; Seen and signed: A. Quince, S.O.</p>' +
    '<p class="gum">Mrs Holloway&rsquo;s bookmark says: &ldquo;The famous night! Show visitors.&rdquo; You look at the page for longer than a visitor would. Every other page of this book is in two or three different hands, one for each watch. This page is in one hand from top to bottom, even the initials. And it is not sewn in like the others. It has been stuck in, with gum.</p>';
  var LOGB = '<h4>Station log &middot; 30 November &middot; the last page</h4>' +
    '<p><b>2000</b> Watch opened. Sea moderate. Nothing heard. H.T.</p>' +
    '<p><b>2340</b> Sender on. Tape running. H.T.</p>' +
    '<p><b>2352</b> Main fuse drawn. Sender off. Tape not finished.</p>' +
    '<p><b>2400</b> Station closed by order. Watch not relieved. H.T.</p>' +
    '<p class="gum">The rest of the book is blank. You turn back through it. On every other night, every watch ends with a line in somebody else&rsquo;s writing: &ldquo;0400 Watch relieved. D.M.&rdquo; &ldquo;0800 Watch relieved. J.R.&rdquo; This is the only watch in the whole book that nobody ever closed.</p>';
  var MEMO = '<h4>From the Station Officer &middot; to all operators</h4>' +
    '<p>It has come to my notice that signals <s>recieved</s> <span class="red">received</span> during the night are being entered in the log in pencil.</p>' +
    '<p>Every signal <s>recieved</s> <span class="red">received</span> at this station will be entered in ink, as Standing Orders require. I shall be looking at the log myself.</p>' +
    '<p>A. Quince, S.O.</p><p class="red">i before e, Mr Quince, except after c. &nbsp;H.T.</p>';

  function hints() {
    if (!called) return ['phone', [
      'The telephone is ringing again. There is one by the yard door.',
      'Click on the green telephone on the wall, to the right of the door, and hear what Control wants this time.'
    ]];
    if (!solved) return ['book', [
      'Part three is all numbers, in threes. Part two told you which book they belong to, and what the three numbers in each group are. That book is on the stand in front of you, on a chain.',
      'Take the first group. Its first number is a page of Standing Orders, its second is a line on that page, and its third is a word in that line. Turn to the page, count down the lines, count along the words, and click the word. The small 5 and 10 at the edge of the page mark those lines.',
      'Count every word in a line, the short ones too, and count names, capitals and S.O. as one word each. The red numbers in front of the orders stand in the margin: they are not part of any line. If your click is wrong, the sheet tells you which word you did click.'
    ]];
    return ['yard', [
      'You know now where the true page is, where the key to it hangs, and what else Hester Thorne wants done. None of it is in this room.',
      'The yard door is at the end of the shelves. Lift the bar.'
    ]];
  }
  function pips() { ER.pips((called ? 1 : 0) + (solved ? 1 : 0) + (leaving ? 1 : 0), 3); }
  function busy() { return leaving; }
  function begin() {
    pips();
    if (called) return;
    ER.narrate([
      'Shelves to the ceiling, a reading desk, and a book on a chain. You have not taken three steps into the store before the telephone on the far wall begins to ring.'
    ], function () { ZERO.ring($('#phone g')); });
  }

  ZERO.thing('#shelves', null, 'Box after box of other people&rsquo;s signals, taken down in pencil and never looked at again. WEATHER. SHIPPING. RETURNS. FUEL. And one long shelf of the station log, a volume for every year.', busy);
  ZERO.thing('#ladder', null, 'A ladder on wheels, for the top shelf. On Tuesday, when nobody was looking, you rode it the whole length of the store.', busy);
  ZERO.thing('#mouse', null, 'A mouse, on the shelf marked RETURNS. For thirty years it and its family have been the only staff. It looks at you as if you were late.', busy);
  ZERO.thing('#lantern', 'storm lantern', 'A storm lantern, filled and lit. Whoever ran this place always kept one by the yard door, and on Monday you did the same without knowing why.', busy);
  $('#loga').addEventListener('click', function () { if (!leaving) ER.read({ html: LOGA, cls: 'log', clue: { id: 'loga', title: 'The log: the night of the Kittiwake', kind: 'Station log' } }); });
  $('#logb').addEventListener('click', function () { if (!leaving) ER.read({ html: LOGB, cls: 'log', clue: { id: 'logb', title: 'The log: the last page', kind: 'Station log' } }); });
  $('#memo').addEventListener('click', function () { if (!leaving) ER.read({ html: MEMO, cls: 'memo', clue: { id: 'memo', title: 'A memo from the Station Officer', kind: 'Cork board' } }); });

  $('#phone').addEventListener('click', function (e) {
    if (leaving) return;
    if (called && !ZERO.ringing()) { ER.wordAt(e.clientX, e.clientY, 'field telephone'); ER.say('Item 61. The same green telephone as in the other rooms, on the same line. It is quiet for the moment.'); return; }
    ZERO.call('control', [
      '&ldquo;You are through. Good. Now go straight down the store to the yard door at the far end. Out, turn left, and the engine shed is twenty yards off. Pull the big breaker down and the sender stops. That is all I ask of you.&rdquo;',
      { q: 'Part three is a book cipher. The book is Standing Orders.', a: '&ldquo;Is it. Well, as it happens I have Standing Orders open in front of me, and I have done her sums for you. It says: TAPE IS A TEST. STOP IT. There. Now go.&rdquo;' },
      { q: 'That is not what my copy gives.', a: '&ldquo;Then your copy is wrong. Before you leave that room, write one line in tonight&rsquo;s log, to keep things regular. Take it down: &lsquo;Midnight. Sender fault. Signal recieved by Control and cancelled.&rsquo;&rdquo;' },
      { q: 'How do you spell that?', a: '&ldquo;Which word? Received? Nobody under forty can spell. R, E, C, I, E, V, E, D. Have you got it?&rdquo;' },
      { q: 'I have got it.', a: '&ldquo;Then write it, and be fast. A log must say what happened.&rdquo;' }
    ], { id: 'call3', title: 'Control: the third call', kind: 'Field telephone' }, function (seen) {
      if (!seen) { if (!called) ZERO.ring($('#phone g')); return; }
      if (!called) { called = true; ER.flag('call3', 1); pips(); ER.say('You do not write it. You have nothing to write it in: the log ends thirty years ago. And you would rather do your own sums.'); }
    });
  });

  /* ---------- Standing Orders: page, line, word ---------- */
  function openBook() {
    var box = ER.el('div', 'bk'), page = 0, cur = 0, found = ER.flag('b3') || [], pageEl, msgEl, chips;
    box.innerHTML = '<div class="bk-page"><h5>Standing Orders</h5><h6><span>Gannet Head Coast Wireless Station</span><span class="pg"></span></h6><div class="bk-lines"></div>' +
      '<div class="bk-turn"><button type="button" data-d="-1">&larr; Back</button><span></span><button type="button" data-d="1">On &rarr;</button></div></div>' +
      '<div class="bk-side"><h5>Part three &middot; off the printer</h5><div class="bk-strip">' + GROUPS.map(function (g, i) { return '<button type="button" data-i="' + i + '"><b>' + g + '</b><i></i></button>'; }).join('') + '</div><p class="pmsg"></p></div>';
    pageEl = box.querySelector('.bk-lines'); msgEl = box.querySelector('.pmsg'); chips = ER.$$('.bk-strip button', box);
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function next() { for (var i = 0; i < GROUPS.length; i++) if (!found[(cur + i) % GROUPS.length]) return (cur + i) % GROUPS.length; return -1; }
    function paint() {
      var s = '';
      PAGES[page].forEach(function (line, li) {
        s += '<div class="bk-line"><u>' + (NUM[page][li + 1] ? NUM[page][li + 1] + '.' : '') + '</u><span>' + line.split(' ').map(function (w, wi) {
          var id = (page + 1) + '.' + (li + 1) + '.' + (wi + 1), got = GROUPS.some(function (g, i) { return g === id && found[i]; });
          return '<span class="bk-w' + (got ? ' got' : '') + '" data-id="' + id + '">' + w + '</span>';
        }).join(' ') + '</span>' + ((li + 1) % 5 ? '' : '<em>' + (li + 1) + '</em>') + '</div>';
      });
      pageEl.innerHTML = s;
      box.querySelector('.pg').textContent = 'page ' + (page + 1); box.querySelector('.bk-turn span').textContent = (page + 1) + ' of 3';
      ER.$$('.bk-turn button', box).forEach(function (b) { b.disabled = page + (+b.getAttribute('data-d')) < 0 || page + (+b.getAttribute('data-d')) > 2; });
      chips.forEach(function (c, i) { c.lastChild.textContent = found[i] || ''; c.className = (found[i] ? 'ok' : '') + (i === cur && !solved ? ' cur' : ''); });
      box.setAttribute('data-page', page + 1); box.setAttribute('data-found', found.filter(Boolean).length);
    }
    function finish(first) {
      var words = found.map(function (w) { return w.toUpperCase(); }), text = words.slice(0, 5).join(' ') + '. ' + words.slice(5, 10).join(' ') + '. ' + words.slice(10).join(' ') + '.';
      solved = true; cur = -1; paint();
      if (first) {
        ER.flag('s3', 1); pips(); ER.sfx.ok();
        ER.addClue('tape3', 'The tape, part three', '<h4>The tape &middot; part three</h4><p>' + GROUPS.join(' &nbsp;') + '</p><p class="pen">' + text + '</p>', 'strip', 'Off the printer');
      }
      msg('Fifteen words. You write them out and put in the full stops yourself: <b>' + text + '</b>');
    }
    box.querySelector('.bk-turn').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null; if (!b || b.disabled) return;
      page += +b.getAttribute('data-d'); ER.sfx.paper(); paint();
    });
    box.querySelector('.bk-strip').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null, i; if (!b || solved) return;
      i = +b.getAttribute('data-i'); if (found[i]) return;
      cur = i; paint(); msg('Group <b>' + GROUPS[i] + '</b>. Page, line, word.');
    });
    pageEl.addEventListener('click', function (e) {
      var w = e.target.closest ? e.target.closest('.bk-w') : null, id, p;
      if (!w || solved) return;
      id = w.getAttribute('data-id'); p = id.split('.');
      if (id !== GROUPS[cur]) {
        ZERO.burn(1); ER.shake(w); ER.sfx.no();
        msg('You have your finger on page ' + p[0] + ', line ' + p[1] + ', word ' + p[2] + '. The group on the strip says <b>' + GROUPS[cur] + '</b>.');
        return;
      }
      found[cur] = w.textContent.toLowerCase().replace(/[^a-z]/g, ''); ER.flag('b3', found); ZERO.sfx.punch();
      msg('<b>' + GROUPS[cur] + '</b> is ' + found[cur].toUpperCase() + '.');
      cur = next();
      if (cur < 0) finish(true); else paint();
    });
    cur = next(); if (cur < 0) { finish(false); } else { paint(); msg('The strip says <b>' + GROUPS[cur] + '</b> first. Turn the pages with the buttons under the book, and put your finger on a word.'); }
    ER.open('ov-lock', box);
  }
  $('#orders').addEventListener('click', function () {
    if (leaving) return;
    if (!called) { ER.say('STANDING ORDERS, on a chain, so that nobody could walk off with it. But the telephone is still ringing.'); return; }
    openBook();
  });
  $('#ydoor').addEventListener('click', function () {
    if (leaving) return;
    if (!called) { ER.say('The yard door, with a wooden bar across it. Rain is coming in underneath. And the telephone is still ringing.'); return; }
    if (!solved) { ER.say('Out there are the storm, the engine shed, and whatever Control wants pulled down inside it. In here is part three. You are not going out until you know what it says.'); return; }
    if (!ER.exit([(ER.flag('b3') || []).join(' ')], { delay: 4200 })) { ER.say('The bar will not lift.'); return; }
    leaving = true; pips(); ZERO.sfx.bolt(); setTimeout(ZERO.sfx.gust, 500);
    ER.say('You lift the bar. The wind takes the door out of your hand, and very nearly takes the lantern out of the other.', 4000);
  });
})();
</script>
</body>
</html>
