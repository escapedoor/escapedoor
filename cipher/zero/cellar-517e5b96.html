<style>
  body{--bg:#0d0b09;--accent:#f4e04d;--font-display:'Playfair Display',serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;

  .tc-room{font-weight:900}
  .sten{font-family:'Stardos Stencil',serif;font-weight:700;text-anchor:middle}
  #lanG{animation:lan 2.6s steps(4) infinite alternate}
  @keyframes lan{from{opacity:.55}to{opacity:.8}}
  .rip{transform-box:fill-box;transform-origin:50% 50%;animation:rip 3.2s linear infinite}
  .rip.r2{animation-delay:-1.6s}
  @keyframes rip{0%{transform:scale(.2);opacity:.7}100%{transform:scale(1.5);opacity:0}}
  #dripc{animation:dripc 3.2s linear infinite}
  @keyframes dripc{0%{transform:translateY(0);opacity:0}5%{opacity:1}34%{transform:translateY(520px);opacity:1}36%{opacity:0}100%{opacity:0}}
  #run{animation:run .8s linear infinite}
  @keyframes run{to{stroke-dashoffset:-30}}
  .bub{animation:bub 4s ease-in infinite}
  .bub.b2{animation-delay:-1.4s}.bub.b3{animation-delay:-2.7s}
  @keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.6}100%{transform:translateY(-40px);opacity:0}}
  #toadeye{animation:blink 5s steps(1,end) infinite}
  @keyframes blink{0%{opacity:1}94%{opacity:1}96%{opacity:0}}
  #sdoor{transition:transform 1.6s cubic-bezier(.5,0,.3,1);transform-origin:1250px 470px}
  body.open #sdoor{transform:scaleX(.16)}
  #inside{display:none}
  body.open #inside{display:block}

  /* the skipper's telegram */
  .tg{display:grid;grid-template-columns:minmax(0,690px) 300px;gap:20px;width:min(1030px,96vw);align-items:start}
  .tg-form{padding:0 24px 16px;background:#e8dcae linear-gradient(170deg,rgba(255,255,255,.35),rgba(120,90,20,.16));border:1px solid #8a7a3c;box-shadow:0 26px 70px rgba(0,0,0,.7);color:#1c1b18;
    clip-path:polygon(0 0,100% 0,100% 88%,97% 92%,99% 96%,95% 100%,0 100%)}
  .tg-form h5{margin:0 -24px 10px;padding:9px 24px 7px;background:#1c1b18;color:#e8dcae;font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:.2em;display:flex;justify-content:space-between}
  .tg-form h5 span{font-family:'Courier Prime',monospace;font-size:13px;letter-spacing:.06em;align-self:center}
  .tg-form p{margin:0 0 5px;padding:4px 10px 2px;background:#f6f1e2;font-family:'Courier Prime',monospace;font-weight:700;font-size:15.5px;letter-spacing:.04em;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .tg-form .wk-gap{margin:0 2px;padding:1px 3px 0;background:#1f4a35;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);--wk-line:rgba(244,224,77,.5);--wk-cur:rgba(244,224,77,.5);color:#f4e04d;vertical-align:-3px}
  .tg-form .wk-gap .wk-cell{height:1.15em}
  .tg-form .wk-gap.ok{background:#fffbe9;box-shadow:none;color:#1d2a52;padding:0 2px}
  .tg-form .wk-gap.bad{background:#7b241c}
  .tg-card{padding:16px 18px 12px;background:#f4efdd linear-gradient(172deg,rgba(255,255,255,.5),rgba(120,100,50,.14));box-shadow:0 20px 50px rgba(0,0,0,.6);font-family:'Caveat',cursive;font-weight:700;font-size:21.5px;line-height:1.16;
    color:#14213d;transform:rotate(1deg)}
  .tg-card p{margin:0 0 8px}
  .tg .pmsg{margin-top:14px;min-height:96px;font-size:15.5px}
  .tg .wk{--wk-size:26px;--wk-line:#6d5f45;--wk-key:#2a241b}
  .tg .wk-board{margin-top:8px}
  .tg .wk-row{margin:3px 0}
  /* the safe, close up */
  .sf{width:min(680px,94vw);padding:26px 30px 22px;background:#2f5a43 linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.35));border:8px solid #17301f;box-shadow:0 26px 70px rgba(0,0,0,.7);text-align:center}
  .sf h5{margin:0 0 14px;font-family:'Playfair Display',serif;font-weight:900;font-size:24px;letter-spacing:.14em;color:#e6c873}
  .drums{display:inline-flex;gap:6px;padding:10px 12px;background:linear-gradient(135deg,#f5df98,#c79b3b 55%,#7d5f1d);border-radius:6px}
  .drums span{width:44px;height:58px;border-radius:3px;background:#0a0b0d;color:#f4e04d;font-family:'Oswald',sans-serif;font-weight:600;font-size:34px;line-height:58px}
  .drums span.cur{box-shadow:inset 0 -4px 0 #f4e04d}
  .sf .pmsg{margin:14px 0 0;min-height:66px;text-align:left;font-size:16px}
  .sf .wk{--wk-size:32px;--wk-line:#17301f;--wk-key:#24493a;--wk-ink:#f1ecdf}
  @media (max-width:1000px){.tg{grid-template-columns:1fr}}
</style>

  var CARD = '<p>To my relief.</p><p>The skipper of the <i>Kittiwake</i> sent this to the station three days afterwards. Mr Quince put it in the stove. I took it out again.</p>' +
    '<p>I have cut eight small words out of it with the office scissors: the sort of word he never noticed. Put them back.</p>' +
    '<p>Then take the first letter of each, in order, and set them on the safe. &nbsp;H.T.</p>';
  /* the telegram, with the eight holes. The words that belong in them are known only to the lock. */
  var WIRE = ['TO THE OPERATOR ON WATCH NIGHT OF NINTH GANNET HEAD WIRELESS STATION',
    '# IT HAD NOT BEEN FOR YOU SIX MEN WOULD NOT HAVE COME HOME STOP',
    'WE THANK YOU EVEN # WE DO NOT KNOW YOUR NAME STOP',
    'THE COASTGUARD HEARD NOTHING # YOU HEARD A SET WITH A BROKEN AERIAL STOP',
    '# THE SEA WAS OVER OUR DECK THE LIFEBOAT FOUND US IN FORTY MINUTES STOP',
    'IT IS NOW THREE DAYS # WE CAME ASHORE STOP',
    'THE COXSWAIN SAYS A WOMAN TELEPHONED HIM STOP # OFTEN WE ASK NOBODY WILL TELL US WHO SHE WAS STOP',
    '# SHE HAS THE BEST EARS ON THIS COAST OR WE ARE THE LUCKIEST CREW STOP',
    'WE WOULD THANK HER TO HER FACE # THAN BY WIRE STOP',
    'RASK SKIPPER KITTIWAKE'];
  var NUDGE = {
    g1: 'Two letters. The skipper is imagining a different night: a night with nobody on watch.',
    g2: 'Six letters, after EVEN. Two things are true together, and the second makes the first surprising: they thank her, and they do not know who she is.',
    g3: 'Seven letters. One word that sets two facts against each other: what the coastguard heard, and what the station heard.',
    g4: 'Eight letters. It opens a sentence whose second half is a surprise after the first: a sea like that, and yet they were found.',
    g5: 'Five letters. It measures time from a moment in the past up to now. Three days, counted from when?',
    g6: 'Seven letters, in front of OFTEN. Together the two words mean: it makes no difference how many times.',
    g7: 'Six letters. It opens a choice between two things, and its partner, OR, comes later in the sentence.',
    g8: 'Six letters, in front of THAN. Of two ways of thanking her, it marks the one they would choose.'
  };
  var PAGE = '<h4>Station log &middot; night of 9 to 10 November</h4>' +
    '<p><b>0000</b> Middle watch opened. Wind S.W., rising. Alone on watch. H.T.</p>' +
    '<p><b>0214</b> Weak distress call heard: trawler Kittiwake, engine dead, drifting on to the Skerries.</p>' +
    '<p><b>0216</b> Bearing taken: 304 degrees.</p>' +
    '<p><b>0218</b> Rang S.O.&rsquo;s house. No answer.</p>' +
    '<p><b>0220</b> Telephoned the lifeboat myself.</p>' +
    '<p><b>0311</b> Lifeboat reports Kittiwake in tow. All six men safe.</p>' +
    '<p><b>0400</b> Watch relieved. D.M.</p>' +
    '<p><b>0655</b> S.O. returned to station, from the town. D.M.</p>' +
    '<p class="gum">Down one edge of this page there is a row of small holes, where the thread of a binding went through. It was sewn into a book once. Somebody has cut it out with a blade.</p>';
  var NOTE = '<h4>To my relief</h4><p>If you are reading this, the tape has run and you have found the page. Three things, and then you may go to bed.</p>' +
    '<p>1. <b>Table</b> this page, and my report with it. Do not let anybody tell you what that means. You are in England.</p>' +
    '<p>2. I want nobody <b>sanctioned</b>. Mr Quince was a good officer on every night of his life but one.</p>' +
    '<p>3. If he would rather call his entry an <b>oversight</b>, let him. I shall not quarrel over a word.</p>' +
    '<p>My watch is still open. I could not close it: nobody can close her own. You know what has to be sent, and it must be sent by hand.</p>' +
    '<p>Then make the hut <b>fast</b> behind you. &nbsp;H.T.</p>' +
    '<p>P.S. He could always make a word mean whatever suited him. So I am leaving you my word book. Look them up for yourself.</p>';
  var BOOK = '<h4>Words that face both ways</h4>' +
    '<p><b>table</b> (verb). Here: to put a paper on the table, so that it must be talked about. In America: to take it off the table, so that it need not be. I once saw a whole meeting quarrel for an hour over this word.</p>' +
    '<p><b>sanction</b> (verb). To sanction a thing (a plan, a sale) is to allow it. To sanction a person or a country is to punish them. Look at what comes after it.</p>' +
    '<p><b>oversight</b>. An oversight (you can count them) is a mistake made because nobody noticed. Oversight (you cannot count it) is the work of watching over other people&rsquo;s work.</p>' +
    '<p><b>fast</b>. Quick. Also fixed so firmly that it cannot move at all: stuck fast, hold fast, make the door fast.</p>' +
    '<p><b>relief</b>. What you feel when the worry stops. Also the person who comes to take over your work, so that you can stop.</p>' +
    '<p><b>left</b>. Gone away. Also still here. &ldquo;She left.&rdquo; &ldquo;She was the only one left.&rdquo;</p>' +
    '<p><b>dust</b> (verb). To take the dust off (a shelf). To put a dust on (a cake, with sugar).</p>';
  var PLATE = '<h4>Line One</h4><p>S.O. HOUSE</p><p>300 YDS &middot; NO OTHER LINE</p><p class="pen">Not catalogued. I was never down here.</p>';

  function hints() {
    if (!wired) return ['wire', [
      'Part three said the true page is in the safe. Two papers are clipped to the safe door, where nobody could miss them.',
      'Read your grandmother&rsquo;s card. Eight small words have been cut out of the telegram, and each hole shows how many letters its word had. Type a word into a hole. It has to make sense, and it has to make grammar.',
      'They are all joining words: the kind that hold two halves of a sentence together, or set one half against the other, like UNLESS, BECAUSE and WHILE (though none of those three is wanted here). Read each whole sentence aloud, and ask what its second half is doing to its first.'
    ]];
    if (!open) return ['safe', [
      'The card told you what to do with the eight words once you had them.',
      'Take the first letter of each of the eight words, in the order they stand in the telegram, and set them on the eight drums of the safe.',
      'It is not one word. Read the eight letters as a very short sentence, and you will know that you have them right.'
    ]];
    if (!called) return ['phone', ['The telephone at the foot of the steps is ringing. It is the only one in the station without your label on it.']];
    if (!(seen.page && seen.note && seen.book)) return ['read', ['Three things are in the safe: a page, a note and a small red book. Read all three. One of them you will want to look things up in before the night is over.']];
    return ['up', ['The last of the tape is running, upstairs. Take everything with you.']];
  }
  function pips() { ER.pips((wired ? 1 : 0) + (open ? 1 : 0) + (called ? 1 : 0) + (seen.page && seen.note && seen.book ? 1 : 0), 4); }
  function busy() { return leaving; }
  function ready() {
    pips();
    if (!(open && called && seen.page && seen.note && seen.book) || $('#go')) return;
    ZERO.gobtn('Go up to the hut', function () {
      if (leaving) return;
      if (!ER.exit([ER.flag('sw')], { delay: 4000 })) return;
      leaving = true; $('#go').classList.remove('on');
      ER.say('You button the page, the note and the red book inside your jacket, and take the lantern. Behind you, in the dark, the telephone begins to ring again. You let it.', 4000);
    });
  }
  function begin() {
    pips(); ready();
    if (open && !called) ZERO.ring($('#phone g'));
    if (wired) return;
    ER.narrate(['A safe the size of a wardrobe, painted green. A rack of glass battery jars. An iron stove. And clipped to the door of the safe, where nobody could miss them, a telegram and a card in a handwriting you know.']);
  }

  ZERO.thing('#steps', null, 'The steps up to the yard. The rain is coming down them like a small river with somewhere to be.', busy);
  ZERO.thing('#jars', 'battery', 'Glass jars as big as buckets, in rows: the station&rsquo;s batteries, for the nights when the engine failed. In one or two of them something is still, very slowly, bubbling.', busy);
  ZERO.thing('#bed', null, 'A camp bed, folded. For the nights when the watch was too long, or the weather too bad, to go home.', busy);
  ZERO.thing('#toad', 'toad', 'A toad, beside the puddle. It does not look round. It has seen people come down here with lanterns before.', busy);
  $('#stove').addEventListener('click', function (e) {
    if (leaving) return;
    ER.wordAt(e.clientX, e.clientY, 'stove');
    ER.say(called ? 'A cold iron stove, and a box of matches on the shelf above it, exactly where the voice said they would be. You put the page inside your jacket instead.'
      : 'An iron stove, cold for thirty years. On the shelf above it there is a box of matches.');
  });
  $('#phone').addEventListener('click', function (e) {
    if (leaving) return;
    if (!ZERO.ringing()) {
      ER.read({ html: PLATE, cls: 'brass', clue: { id: 'plate', title: 'The plate on the cellar telephone', kind: 'Brass plate' } });
      return;
    }
    ZERO.call('control', [
      '&ldquo;You have gone very quiet. Where are you?&rdquo;',
      { q: 'In the cellar. The safe is open.', a: '&ldquo;&hellip;Open. I see. And what was her word, in the end? I should rather like to know that.&rdquo;' },
      { q: 'Eight letters. I, T, W, A, S, H, E, R.', a: '&ldquo;That is not a word.&rdquo;' },
      { q: 'No. It is three.', a: '<p class="note">For a long time there is nothing on the line but the hiss.</p>' },
      '&ldquo;Listen to me, Thorne. Whatever is in that safe is thirty years old. It can help nobody now. It can only hurt. There is a stove in the corner of that cellar, and there were always matches on the shelf above it. You understand me.&rdquo;',
      { q: 'How do you know what is in this cellar?', a: '&ldquo;Burn it, and be fast. I shall ring again.&rdquo;' }
    ], { id: 'call5', title: 'Control: the fifth call', kind: 'Field telephone' }, function (done) {
      if (!done) { if (!called) ZERO.ring($('#phone g')); return; }
      if (!called) { called = true; ER.flag('call5', 1); ready(); ER.say('You hang up. This telephone is the only one in the station without your label on it. Where the label would go there is a small brass plate, green with damp.', 6500); }
    });
  });

  /* ---------- the telegram: eight small words ---------- */
  function openWire() {
    var box = ER.el('div', 'tg'), n = 0, msgEl, gaps;
    box.innerHTML = '<div class="tg-form"><h5>Post Office Telegram<span>HANDED IN 13 NOV &middot; 0915</span></h5>' +
      WIRE.map(function (l) { return '<p>' + l.replace(/#/g, function () { n++; return '<span class="wk-gap" data-key="g' + n + '"></span>'; }) + '</p>'; }).join('') + '</div>' +
      '<div><div class="tg-card">' + CARD + '</div><p class="pmsg"></p><div class="kb wk"></div></div>';
    msgEl = box.querySelector('.pmsg'); ER.glossIn(box, '.tg-form p');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function finish(first) {
      wired = true;
      if (first) {
        ER.flag('s5a', 1); pips(); ER.sfx.ok();
        ER.addClue('wire', 'The skipper&rsquo;s telegram', '<h4>Post Office Telegram</h4>' + ER.$$('.tg-form p', box).map(function (p) { return '<p>' + p.textContent + '</p>'; }).join('') + '<p class="pen">Eight words put back. The first letter of each, in order.</p>', 'wire', 'Clipped to the safe');
      }
      msg('Eight small words, back where the scissors took them from. Now do what the card says with them.');
    }
    gaps = WK.gaps(box.querySelector('.tg-form'), {
      mark: false, board: true, boardIn: box.querySelector('.kb'),
      onWord: function (key, word) { if (wired) return; WK.learn(word); ZERO.sfx.punch(); msg('<b>' + word.toUpperCase() + '</b>. It fits the hole, and it fits the sentence.'); },
      onMiss: function (key, node, misses) { ZERO.burn(2); msg((misses > 1 ? 'Still not that. ' : 'The sentence does not hold together with that word in it. ') + NUDGE[key]); },
      onDone: function () { if (!wired) finish(true); }
    });
    if (wired) { ['g1', 'g2', 'g3', 'g4', 'g5', 'g6', 'g7', 'g8'].forEach(function (k) { gaps.fill(k); }); finish(false); }
    else msg('A telegram, thirty years old, burnt brown along one edge. Eight neat holes have been cut in it. Click a hole and type the word that was there.');
    ER.open('ov-lock', box);
  }
  /* ---------- the safe: eight drums ---------- */
  function openSafe() {
    var box = ER.el('div', 'sf'), buf = '', drums, msgEl;
    box.innerHTML = '<h5>GANNET HEAD</h5><div class="drums">' + new Array(9).join('<span></span>') + '</div><p class="pmsg"></p><div class="kb wk"></div>';
    drums = ER.$$('.drums span', box); msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function draw() { drums.forEach(function (d, i) { d.textContent = (buf.charAt(i) || '').toUpperCase(); d.classList.toggle('cur', i === buf.length); }); box.setAttribute('data-buf', buf); }
    function press(k) {
      if (open) return false;
      if (k === 'back') buf = buf.slice(0, -1);
      else if (k === 'enter') { tryIt(); return; }
      else if (k.length === 1) { if (buf.length < 8) { buf += k; ZERO.sfx.drum(); } }
      else return false;
      draw();
    }
    function tryIt() {
      if (buf.length < 8) { msg('Eight drums. You have set ' + buf.length + '.'); return; }
      ZERO.sfx.lever();
      if (!ER.exitOk([buf])) {
        ZERO.burn(2); ER.shake(box.querySelector('.drums')); ER.sfx.no();
        msg(buf === 'recieved' ? 'The handle does not move. But the brass round these drums is worn bright, as if somebody once stood here for a very long time, trying words that were not quite right.'
          : !wired ? 'The handle does not move. The card on the door says where the eight letters come from, and you have not got them yet.'
          : 'The handle does not move. Eight words went back into the telegram. Their first letters, in the order they stand.');
        buf = ''; draw(); return;
      }
      open = true; ER.flag('s5b', 1); ER.flag('sw', buf); ZERO.sfx.safe(); ER.sfx.ok();
      msg('The handle swings over. The door is as heavy as the door of a car, and it opens as quietly as a book.');
      setTimeout(function () {
        ER.closeAll(); B.classList.add('open'); pips();
        ER.narrate([
          'Eight letters, and they were never one word. You say them aloud, to nobody, with the gaps in the right places.',
          'Inside the safe: one page of ruled paper, a note in the same handwriting as the card, and a small red book. Nothing else. No money, no secrets of the state.',
          'At the foot of the steps, the telephone begins to ring.'
        ], function () { ZERO.ring($('#phone g')); });
      }, 1700);
    }
    WK.board(box.querySelector('.kb'), { back: true, enter: 'Try the handle', key: press });
    WK.keys(box, press);
    draw(); msg('Eight brass drums and a handle like a ship&rsquo;s wheel. Type eight letters, and press Enter to try the handle.');
    ER.open('ov-lock', box);
  }
  function read(key, html, cls, title, kind) {
    ER.read({ html: html, cls: cls, clue: { id: key === 'book' ? 'wordbook' : 'true' + key, title: title, kind: kind }, done: function () { if (!seen[key]) { seen[key] = 1; ER.flag('seen5', seen); ready(); } } });
  }
  $('#safe').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : null;
    if (leaving || !t) return;
    if (open) {
      if (t.closest('#s-page')) read('page', PAGE, 'log', 'The page from the safe', 'Station log');
      else if (t.closest('#s-note')) read('note', NOTE, 'hester', 'To my relief', 'Hester Thorne&rsquo;s note');
      else if (t.closest('#s-book')) read('book', BOOK, 'hester', 'Words that face both ways', 'Hester Thorne&rsquo;s word book');
      else ER.say('The safe is open. A page, a note, and a small red book.');
      return;
    }
    if (t.closest('#clip')) openWire(); else openSafe();
  });
})();
</script>
</body>
</html>
