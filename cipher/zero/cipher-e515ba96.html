<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Cipher Room · Station Zero</title>

<link rel="stylesheet" href="../../assets/fonts-cipher.css">

<style>
  body{--bg:#120d08;--accent:#f4e04d;--font-display:'Playfair Display',serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(14,10,6,.95);--cap-bg:rgba(16,12,8,.93);--panel:#1a1510;--face-bg:#161a17;--q-ink:#d6c59a;--fade:#070503;--hud-bg:rgba(16,12,8,.78)}
  .tc-room{font-weight:900;font-style:italic}
  .chalk{font-family:'Caveat',cursive;font-weight:700;fill:#e9ecdf}
  .sten{font-family:'Stardos Stencil',serif;font-weight:700;text-anchor:middle}
  .prt{font-family:'Bebas Neue',sans-serif;text-anchor:middle;fill:#1c1b18}
  .lbl{font-family:'Permanent Marker',cursive;font-size:11px;fill:#1c1b18;text-anchor:middle}
  #moth{animation:moth 9s linear infinite}
  @keyframes moth{0%{transform:translate(0,0)}25%{transform:translate(70px,26px)}50%{transform:translate(-10px,54px)}75%{transform:translate(-80px,20px)}100%{transform:translate(0,0)}}
  #mothw{animation:mw .16s steps(1,end) infinite}
  @keyframes mw{50%{opacity:.2}}
  #cone{animation:cone 11s steps(1,end) infinite}
  @keyframes cone{0%{opacity:.62}90%{opacity:.62}92%{opacity:.4}94%{opacity:.62}}
  #spk{animation:spk .5s steps(1,end) infinite}
  @keyframes spk{0%{opacity:.9}40%{opacity:.3}55%{opacity:.9}80%{opacity:.3}}
  #steam{animation:steam 4s ease-in-out infinite}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.35}100%{opacity:0;transform:translateY(-14px)}}

  /* the work sheet */
  .cx{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:18px;width:min(1190px,96vw);align-items:start}
  .cx-sheet{padding:16px 20px 12px;background:#efe8d4 repeating-linear-gradient(transparent 0 43px,rgba(60,90,140,.16) 43px 44px);box-shadow:0 26px 70px rgba(0,0,0,.7);
    border-top:10px solid #2f3a2c}
  .cx-sheet h5{margin:0 0 8px;font-family:'Stardos Stencil',serif;font-weight:700;font-size:15px;letter-spacing:.14em;color:#2f3a2c;display:flex;justify-content:space-between}
  .cx-sheet h5 span{font-family:'Courier Prime',monospace;font-weight:400;font-size:13px;letter-spacing:.02em;color:#6d685c}
  .cw{display:inline-block;white-space:nowrap;margin:0 13px 4px 0;vertical-align:top}
  .cc{display:inline-block;width:15.5px;text-align:center;cursor:pointer;vertical-align:top}
  .cc i{display:block;height:15px;font-style:normal;font-family:'Courier Prime',monospace;font-weight:700;font-size:13px;line-height:15px;color:#8a8370}
  .cc b{display:block;height:24px;font-family:'Caveat',cursive;font-weight:700;font-size:24px;line-height:24px;color:#1d2a52;border-bottom:1.5px solid #a39b84}
  .cc.sel i{color:#141518;background:#f4e04d}
  .cc.sel b{border-bottom-color:#141518;background:rgba(244,224,77,.4)}
  .cc:hover i{color:#141518}
  .cp{display:inline-block;width:6px;margin-top:15px;font-family:'Caveat',cursive;font-weight:700;font-size:24px;line-height:24px;vertical-align:top;color:#1d2a52}
  .cx.done .cc i{opacity:.45}
  .cx.done .cc b{border-bottom-color:transparent;color:#14213d}
  .cx-side{padding:14px 14px 12px;background:#1b1712;border:1px solid #4a3f2e;color:#eadfc8;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .cx-side h6{margin:0 0 6px;font-family:'Oswald',sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#bfa987}
  .tally{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(11,17px);gap:0 12px;margin-bottom:10px}
  .tally button{display:flex;align-items:center;height:17px;font-family:'Courier Prime',monospace;font-size:13px;line-height:17px;color:#eadfc8;text-align:left}
  .tally button b{width:15px;font-weight:700;color:#f4e04d}
  .tally button span{display:block;height:9px;background:#8d7b52;margin-right:5px}
  .tally button em{font-style:normal;font-size:11.5px;color:#bfa987;margin-right:auto}
  .tally button u{text-decoration:none;font-family:'Caveat',cursive;font-weight:700;font-size:19px;color:#fff;width:14px;text-align:center}
  .tally button.sel{background:#f4e04d}.tally button.sel b,.tally button.sel em,.tally button.sel u{color:#141518}
  .abc{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin-bottom:10px}
  .abc span{display:block;text-align:center;background:#efe8d4;color:#1c1b18;padding:1px 0 0}
  .abc span i{display:block;font-style:normal;font-family:'Caveat',cursive;font-weight:700;font-size:17px;line-height:17px;color:#1d2a52}
  .abc span b{display:block;height:17px;font-family:'Courier Prime',monospace;font-weight:700;font-size:13.5px;line-height:17px;border-top:1px solid #a39b84;color:#8c2f24}
  .proof{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .proof .lamp{flex:none;width:22px;height:22px;border-radius:50%;background:#2a2620;border:2px solid #0d0b08}
  .proof .lamp.g{background:#57d27a;box-shadow:0 0 12px #57d27a}
  .proof .lamp.r{background:#ff5a4a;box-shadow:0 0 12px #ff5a4a}
  .proof button{padding:7px 12px 5px;border:2px solid #f4e04d;color:#f4e04d;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.12em;border-radius:3px}
  .proof button:hover{background:#f4e04d;color:#141518}
  .proof .rub{margin-left:auto;border:0;padding:0;font-family:'Courier Prime',monospace;font-size:12.5px;letter-spacing:0;color:#bfa987;text-decoration:underline}
  .proof .rub:hover{background:none;color:#fff}
  .cx-side .pmsg{min-height:88px;font-size:14.5px;line-height:1.32}
  .cx-side .wk-board{margin-top:6px}
  .cx-side .wk{--wk-size:23px;--wk-line:#6d5f45;--wk-key:#2a241b}
  .cx-side .wk-row{margin:3px 0}

  /* the steel door */
  .sd{width:min(660px,94vw);padding:26px 30px 22px;background:#565c5e linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.3));border:6px solid #2c3032;box-shadow:0 26px 70px rgba(0,0,0,.7);text-align:center}
  .sd h5{margin:0 0 14px;font-family:'Stardos Stencil',serif;font-weight:700;font-size:30px;letter-spacing:.2em;color:#14171a}
  .drums{display:inline-flex;gap:6px;padding:10px 12px;background:linear-gradient(135deg,#f5df98,#c79b3b 55%,#7d5f1d);border-radius:6px}
  .drums span{width:44px;height:58px;border-radius:3px;background:#0a0b0d;color:#f4e04d;font-family:'Oswald',sans-serif;font-weight:600;font-size:34px;line-height:58px}
  .drums span.cur{box-shadow:inset 0 -4px 0 #f4e04d}
  .sd .pmsg{margin:14px 0 0;min-height:66px;text-align:left;font-size:16px}
  .sd .wk{--wk-size:32px;--wk-line:#22262a;--wk-key:#3d4346;--wk-ink:#f1ecdf}
  @media (max-width:1000px){.cx{grid-template-columns:1fr}}
</style>
</head>

  /* part two of the strip, as it came off the printer */
  var CT = 'MTZN ZN MTB MPKB PBRSPM SO MTB UZATM SO MTB UZUMT SO USJBVIBP WLNM DBLP. Z HLN LWSUB SU HLMFT. LM OSKPMBBU VZUKMBN RLNM MHS Z TBLPE L HBLX FLWW OPSV MTB MPLHWBP XZMMZHLXB. ' +
    'Z MSSX MTB IBLPZUA LUE Z MBWBRTSUBE MTB WZOBISLM. MTB NMLMZSU SOOZFBP TBLPE USMTZUA. TB HLN LM L EZUUBP ZU MTB MSHU. ZU MTB VSPUZUA TB HPSMB MTLM RLAB SO MTB WSA LALZU LUE RKM TZVNBWO HTBPB Z TLE IBBU. ' +
    'Z ALJB TZV VD HSPE MTLM Z HSKWE UBJBP NRBLX SO ZM. Z UBJBP TLJB. Z LV USM NRBLXZUA USH. RLPM MTPBB ZN L ISSX FZRTBP. MTB ISSX ZN NMLUEZUA SPEBPN. BLFT APSKR ZN RLAB, WZUB, HSPE. ' +
    'MTB NMSPB ESSP SRBUN MS MTB XBD HSPE SO MTZN FZRTBP.';

  /* the bars of the chart on the wall, the drums on the steel door */
  (function () {
    var s = '', i, h = [118, 88, 78, 74, 70, 66, 62, 58, 56, 40, 38, 28], L = 'ETAOINSHRDLU';
    for (i = 0; i < 12; i++) s += '<rect x="' + (706 + i * 16) + '" y="' + (330 - h[i]) + '" width="11" height="' + h[i] + '" fill="#2f3a2c"/><text x="' + (711.5 + i * 16) + '" y="350" class="sten" font-size="13" fill="#1c1b18">' + L.charAt(i) + '</text>';
    $('#bars').innerHTML = s + '<path d="M702 332h196" stroke="#1c1b18" stroke-width="2"/>'; s = '';
    for (i = 0; i < 8; i++) s += '<rect x="' + (1184 + i * 19) + '" y="336" width="15" height="28" rx="2"/>';
    $('#dr').innerHTML = s;
  })();

  ER.init({
    theme: 'cipher', story: 'zero', storyTitle: 'Station Zero', id: 'cipher', no: 'II', title: 'The Cipher Room',
    sound: ['shore', { root: 45, bpm: 42, drop: ['mel', 'ost'], beds: [['sea', 0.5], ['static', 0.5]] }],
    go: 'Sit down',
    intro: [
      'The wheel gave way where plain A stands against R, and the first length of the strip turned into English: TO MY RELIEF. Its last sentence told you to turn the wheel back seven places, to K, and then the second length could be read as well. The key was inside the fourth set from the front door, which is not the set you labelled item 4.',
      'The cipher room has no window. A lamp, a table covered in green cloth, and a smell of pencils that has lasted thirty years. A loudspeaker on the wall is still joined to the sender next door, and through it you can hear the tape going round.',
      'Part two is the longest piece of the strip, and the wheel can do nothing with it. But this time the letters come in groups of different lengths, as if they were words.'
    ],
    exit: {"next":"store","w":{"7f5bde81":"dda2d908"}}, tags: {"door":["cf396af0"],"door@":["50eb8172","4294d8a4","4621e27b","2c00225d","8496c138","cecb9461","b846dd01","fd610fed"],"door?":["136517f3","39a4beaa","dfb764dc","cb206ab8","2acade7c","2ef26b1a","07954da2","6a570d11"],"door#":["5e4f64b7"],"sub":["fa934bd3","525d85b8","ad219cc8","8e93e41a","b4875e61","09af8455","611979e1","7ca4de6c","c0af88b7","6b20a32f","a142e489","01814d31","b8e30c8f","0da7cc37","b09473e0","92f22cf3","41a5d00e","839ab7c8","fda9b8dd","02cd904d","69a66f9f","befc9393"]},
    hints: hints,
    onBegin: begin
  });
  ZERO.clock();
  called = !!ER.flag('call2'); solved = !!ER.flag('s2');

  var FREQ = '<h4>English, counted</h4><p>In any long piece of English the letters turn up in very nearly this order, the commonest first:</p>' +
    '<p><b>E &nbsp;T &nbsp;A &nbsp;O &nbsp;I &nbsp;N &nbsp;S &nbsp;H &nbsp;R &nbsp;D &nbsp;L &nbsp;U</b></p>' +
    '<p>About one letter in every eight is an E.</p><p>A word of one letter is A or I.</p>' +
    '<p>The commonest words of two letters: OF, TO, IN, IT, IS, HE, AT, ON.</p><p>The commonest words of three letters: THE, AND, WAS, HIS, HAD.</p>' +
    '<p>Letters that like to stand in pairs: LL, EE, SS, OO, TT, NN.</p><p>A short message can cheat. A long one cannot.</p>';
  var NIGHT = '<h4>The night cipher</h4><p>1. Take a key word of eight letters, with no letter in it twice.</p><p>2. Write the key word under A B C D E F G H.</p>' +
    '<p>3. Under I to Z, write the letters you have not used yet, backwards: Z first.</p>' +
    '<p>4. Now every plain letter has a cipher letter under it. Put the message into cipher a letter at a time, and keep the gaps between the words.</p>' +
    '<p>5. A new key word every night. Never write it down.</p><p>(Control has complained about the gaps. We keep them. The watch is long.)</p>';
  var BOARD = '<h4>On the blackboard</h4><p>CRIB = a word you EXPECT to find.</p><p>A name &middot; a date &middot; a ship.</p>' +
    '<p>Find the place where it fits, and it gives you half the alphabet for nothing.</p>' +
    '<p>Under that, a row of tally marks, and E E E E E ! Whoever wrote this pressed so hard that thirty years have not rubbed it out.</p>';

  function hints() {
    if (!called) return ['phone', [
      'The telephone on the wall is ringing in here too.',
      'Every telephone in the station is on the same line. Click on the green box by the calendar, and hear Control out.'
    ]];
    if (!solved) return ['sheet', [
      'Part two is on the table, under the lamp. Before you begin, read the blackboard and the two charts on the wall: they are the tools of this room.',
      'Every letter on the sheet stands for one letter of English, and always the same one. Click a letter, then type what you think it is. Begin with the short words: a word of one letter can only be A or I, and the commonest word of three letters is THE. The count on the right shows which letters come most often.',
      'A crib is a word you expect to find. Control has given you one, without meaning to: the name of a boat, nine letters long, with a double letter in the middle. Only one word on the sheet has that shape. The lever tells you whether everything you have set so far is right.'
    ]];
    return ['door', [
      'Read your copy of part two as far as its last line. It says what opens the steel door.',
      'Look at the strip of alphabet beside the sheet: plain letters on top, cipher letters underneath. The yellow chart on the wall says how such an alphabet is made. What is written under A, B, C, D, E, F, G and H?',
      'The key word has eight letters, and it is a thing that goes out in storms. Click on the steel door and type it.'
    ]];
  }
  function pips() { ER.pips((called ? 1 : 0) + (solved ? 1 : 0) + (leaving ? 1 : 0), 3); }
  function busy() { return leaving; }
  function begin() {
    pips(); ZERO.keying(0.009);
    if (called) return;
    ER.narrate([
      'You lay part two on the table under the lamp. A hundred and twenty-two groups. If they are words, some of them are very short ones.',
      'The telephone on the wall begins to ring. So it is not only item 31. There is one in every room, and they are all on the same line.'
    ], function () { ZERO.ring($('#phone g')); });
  }

  ZERO.thing('#cal', null, 'A calendar, thirty years old. November. Somebody has put a red ring round the 30th and written one word beside it: CLOSE.', busy);
  ZERO.thing('#monitor', 'loudspeaker', 'The monitor: a loudspeaker on a wire from the room next door, so that the people in here could hear what the sender was sending. It is sending now. To you it is only a noise, like a very fast insect.', busy);
  ZERO.thing('#holes', null, 'Pigeon-holes full of work sheets, every one covered in pencil letters in neat rows. Thirty years ago this was somebody&rsquo;s whole working day.', busy);
  ZERO.thing('#kettle', 'kettle', 'A kettle on a gas ring. You lit it at eleven, for the last tea of the night. That seems a long time ago.', busy);
  ZERO.thing('#notcode', null, 'A CIPHER IS NOT A CODE. And underneath, in small print: &ldquo;A code changes whole words. A cipher changes letters. We use ciphers. Say &lsquo;code&rsquo; in this room and you make the tea.&rdquo;', busy);
  $('#board').addEventListener('click', function () { if (!leaving) ER.read({ html: BOARD, cls: 'mine', clue: { id: 'crib', title: 'The blackboard', kind: 'Chalk' } }); });
  $('#freq').addEventListener('click', function () { if (!leaving) ER.read({ html: FREQ, cls: 'order', clue: { id: 'freq', title: 'English, counted', kind: 'Chart on the wall' } }); });
  $('#night').addEventListener('click', function () { if (!leaving) ER.read({ html: NIGHT, cls: 'order', clue: { id: 'night', title: 'How the night cipher is made', kind: 'Chart on the wall' } }); });

  $('#phone').addEventListener('click', function (e) {
    if (leaving) return;
    if (called && !ZERO.ringing()) { ER.wordAt(e.clientX, e.clientY, 'field telephone'); ER.say('Item 44. Another field telephone, on the same line as the one in the hut. Nobody is ringing just now.'); return; }
    ZERO.call('control', [
      '&ldquo;Well? Where are you?&rdquo;',
      { q: 'In the cipher room. The key was inside one of the sets.', a: '&ldquo;Of course it was. And what did her wheel give you?&rdquo;' },
      { q: 'It begins &ldquo;To my relief&rdquo;.', a: '&ldquo;Relief! She was relieved, was she? Glad to see the back of the place, I dare say, like the rest of us. Sentiment. Leave it.&rdquo;' },
      { q: 'Part two is in another cipher. A long one.', a: '&ldquo;The night cipher. One letter stands for another, and it takes a trained hand an hour, and we have not got an hour. Do not read it. It will be the old story of the <i>Kittiwake</i>, and nobody who was at that dinner will thank her for telling it.&rdquo;' },
      { q: 'What dinner?', a: '&ldquo;&hellip;The line is bad. I said nothing about a dinner. Look for the door, Thorne, not the story. What is on the door to the store?&rdquo;' },
      { q: 'A lock with eight letters. And part one says nothing about that door.', a: '&ldquo;Then she has hidden the word in part two. She would. Very well: break it, if you must, but only as far as the door. Count the letters. The commonest will be E. And be quick about it.&rdquo;' }
    ], { id: 'call2', title: 'Control: the second call', kind: 'Field telephone' }, function (seen) {
      if (!seen) { if (!called) ZERO.ring($('#phone g')); return; }
      if (!called) { called = true; ER.flag('call2', 1); pips(); ER.say('You put the handset back. On the table, part two is waiting. On the blackboard somebody once wrote a word in chalk, and pressed hard: CRIB.'); }
    });
  });

  /* ---------- the work sheet: one letter stands for another ---------- */
  function openSheet() {
    var box = ER.el('div', 'cx' + (solved ? ' done' : '')), map = ER.flag('map2') || {}, sel = null, at = 0, count = {}, order, cells, msgEl, lamp, textEl, s = '', n = 0;
    CT.replace(/[A-Z]/g, function (c) { count[c] = (count[c] || 0) + 1; });
    order = Object.keys(count).sort(function (a, b) { return count[b] - count[a] || (a < b ? -1 : 1); });
    CT.split(' ').forEach(function (w) {
      s += '<span class="cw">' + w.replace(/[A-Z]/g, function (c) { return '<span class="cc" data-c="' + c + '" data-n="' + (n++) + '"><i>' + c + '</i><b></b></span>'; })
        .replace(/[.,](?![^<]*>)/g, function (c) { return '<span class="cp">' + c + '</span>'; }) + '</span>';
    });
    box.innerHTML = '<div class="cx-sheet"><h5>Work sheet &middot; night cipher<span>part two of the tape &middot; small letters as received, your pencil underneath</span></h5><div class="cx-text">' + s + '</div></div>' +
      '<div class="cx-side"><h6>Count</h6><div class="tally">' + order.map(function (c) { return '<button type="button" data-c="' + c + '"><b>' + c + '</b><span style="width:' + Math.round(count[c] * 1.1) + 'px"></span><em>' + count[c] + '</em><u></u></button>'; }).join('') + '</div>' +
      '<h6>The alphabet: plain above, cipher below</h6><div class="abc">' + A.split('').map(function (c) { return '<span data-p="' + c + '"><i>' + c + '</i><b></b></span>'; }).join('') + '</div>' +
      '<div class="proof"><i class="lamp"></i><button type="button" id="prove">Prove it</button><button type="button" class="rub">rub everything out</button></div><p class="pmsg"></p><div class="kb wk"></div></div>';
    cells = ER.$$('.cc', box); msgEl = box.querySelector('.pmsg'); lamp = box.querySelector('.lamp'); textEl = box.querySelector('.cx-text');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function paint() {
      var back = {}, c;
      for (c in map) if (map[c]) back[map[c]] = c;
      cells.forEach(function (n) { c = n.getAttribute('data-c'); n.lastChild.textContent = map[c] || ''; n.classList.toggle('sel', c === sel); });
      ER.$$('.tally button', box).forEach(function (b) { c = b.getAttribute('data-c'); b.lastChild.textContent = map[c] || ''; b.classList.toggle('sel', c === sel); });
      ER.$$('.abc span', box).forEach(function (n) { n.lastChild.textContent = back[n.getAttribute('data-p')] || ''; });
      box.setAttribute('data-set', Object.keys(map).filter(function (k) { return map[k]; }).length);
    }
    function wrong() { return Object.keys(map).filter(function (c) { return map[c] && !ER.check('sub', (c + map[c]).toLowerCase()); }).length; }
    function pick(c, quiet) {
      if (solved) return;
      sel = c; paint();
      if (!quiet) msg('The letter <b>' + c + '</b> comes ' + count[c] + (count[c] === 1 ? ' time' : ' times') + ' in part two.' + (map[c] ? ' You have pencilled ' + map[c] + ' under it.' : ' Type the letter you think it stands for.'));
    }
    function finish(first) {
      var plain = CT.replace(/[A-Z]/g, function (c) { return map[c]; });
      solved = true; sel = null; box.classList.add('done'); lamp.className = 'lamp g'; paint();
      if (first) {
        ER.flag('s2', 1); pips(); ER.sfx.ok();
        ER.addClue('tape2', 'The tape, part two', '<h4>The tape &middot; part two</h4><p class="pen">' + plain + '</p>', 'strip', 'Off the printer');
      }
      msg('It reads. All of it. You sit quite still for a moment, and then you copy it into your notebook. Its last line is about the steel door.');
    }
    function press(k) {
      var c, other;
      if (solved) return false;
      if (k === 'left' || k === 'right') { at = (at + (k === 'left' ? -1 : 1) + cells.length) % cells.length; pick(cells[at].getAttribute('data-c')); return; }
      if (!sel) { if (k.length === 1) msg('Click a letter on the sheet first. Then type.'); return false; }
      if (k === 'back') { delete map[sel]; lamp.className = 'lamp'; }
      else if (k.length === 1) {
        k = k.toUpperCase(); other = null;
        for (c in map) if (map[c] === k && c !== sel) other = c;
        if (other) delete map[other];
        map[sel] = k; ER.sfx.tick(); lamp.className = 'lamp';
        msg(other ? 'You had ' + k + ' under ' + other + '. One plain letter cannot have two cipher letters, so it is under <b>' + sel + '</b> now.' : 'You pencil ' + k + ' under every <b>' + sel + '</b>: ' + count[sel] + (count[sel] === 1 ? ' place.' : ' places.'));
      } else return false;
      ER.flag('map2', map); paint();
      if (order.every(function (x) { return map[x]; }) && !wrong()) finish(true);
    }
    textEl.addEventListener('click', function (e) {
      var n = e.target.closest ? e.target.closest('.cc') : null; if (!n) return;
      at = +n.getAttribute('data-n'); pick(n.getAttribute('data-c'));
    });
    box.querySelector('.tally').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button') : null; if (b) pick(b.getAttribute('data-c')); });
    box.querySelector('#prove').addEventListener('click', function () {
      var set = Object.keys(map).filter(function (c) { return map[c]; }).length, w;
      if (solved) return;
      ZERO.sfx.lever();
      if (!set) { msg('Pencil in a letter or two before you ask the lamp.'); return; }
      w = wrong();
      if (w) { lamp.className = 'lamp r'; ZERO.burn(2); ER.sfx.no(); msg('The lamp is red: <b>' + w + '</b> of your ' + set + ' letters ' + (w === 1 ? 'is' : 'are') + ' wrong. It does not say which. The engine burns a little more fuel while you look.'); }
      else { lamp.className = 'lamp g'; msg('The lamp is green. Every one of your ' + set + ' letters is right. There are ' + (order.length - set) + ' still to find.'); }
    });
    box.querySelector('.rub').addEventListener('click', function () { if (solved) return; map = {}; ER.flag('map2', map); lamp.className = 'lamp'; paint(); msg('You rub it all out and blow the bits off the sheet.'); });
    WK.board(box.querySelector('.kb'), { layout: 'abc', back: true, key: press });
    WK.keys(box, press);
    paint();
    if (solved) finish(false);
    else msg('Part two, copied on to a work sheet. Every letter stands for one letter of English, and always the same one. Click a letter, then type what you think it is.');
    ER.open('ov-lock', box);
  }
  $('#table').addEventListener('click', function () {
    if (leaving) return;
    if (!called) { ER.say('A hundred and twenty-two groups of letters. But the telephone is still ringing.'); return; }
    openSheet();
  });

  /* ---------- the steel door: eight drums ---------- */
  function openDoor() {
    var box = ER.el('div', 'sd'), buf = '', drums, msgEl;
    box.innerHTML = '<h5>RECORDS</h5><div class="drums">' + new Array(9).join('<span></span>') + '</div><p class="pmsg"></p><div class="kb wk"></div>';
    drums = ER.$$('.drums span', box); msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function draw() { drums.forEach(function (d, i) { d.textContent = (buf.charAt(i) || '').toUpperCase(); d.classList.toggle('cur', i === buf.length); }); box.setAttribute('data-buf', buf); }
    function press(k) {
      if (leaving) return false;
      if (k === 'back') buf = buf.slice(0, -1);
      else if (k === 'enter') { tryIt(); return; }
      else if (k.length === 1) { if (buf.length < 8) { buf += k; ZERO.sfx.drum(); } }
      else return false;
      draw();
    }
    function tryIt() {
      if (buf.length < 8) { msg('Eight drums. You have set ' + buf.length + '.'); return; }
      ZERO.sfx.lever();
      if (!WK.is('door', buf) || !ER.exit([buf], { delay: 4200 })) {
        ZERO.burn(2); ER.shake(box.querySelector('.drums')); ER.sfx.no();
        msg(buf === 'kittiwak' ? 'The name of the boat has nine letters, and this door has eight drums. Besides, part two does not say &ldquo;the name of the boat&rdquo;.'
          : !solved ? 'The handle does not move. Eight drums, with twenty-six letters on each. You could stand here guessing until Saturday.'
          : 'The handle does not move. The key word is not a thing to guess. It is written in the alphabet you have just worked out.');
        buf = ''; draw(); return;
      }
      leaving = true; pips(); ZERO.sfx.bolt(); WK.learn(buf, true);
      msg('Eight letters. The handle goes down, and the steel door swings in without a sound.');
      setTimeout(function () { ER.closeAll(); ER.say('You pick up the strip. What is left of it is part three, and part three is all numbers.', 4000); }, 1500);
    }
    WK.board(box.querySelector('.kb'), { back: true, enter: 'Try the handle', key: press });
    WK.keys(box, press);
    draw(); msg('Eight brass drums with a letter on each, and a handle underneath. Type a word, and press Enter to try the handle.');
    ER.open('ov-lock', box);
  }
  $('#sdoor').addEventListener('click', function () {
    if (leaving) return;
    if (!called) { ER.say('A steel door: RECORDS. But the telephone is still ringing.'); return; }
    openDoor();
  });
})();
</script>
