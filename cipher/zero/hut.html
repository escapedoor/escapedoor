<style>
  body{--bg:#0b0e0c;--accent:#f4e04d;--font-display:'Bebas Neue',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(8,10,8,.95);--cap-bg:rgba(10,12,10,.93);--panel:#15181a;--face-bg:#161a17;--q-ink:#c9c39a;--fade:#040504;--hud-bg:rgba(10,12,10,.76)}
  .tc-room{letter-spacing:.1em}
  .lbl{font-family:'Permanent Marker',cursive;font-size:13px;fill:#1c1b18;text-anchor:middle}
  .sten{font-family:'Stardos Stencil',serif;font-weight:700;fill:#f4e04d;text-anchor:middle}
  .plate{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:3px;fill:#d9d2b8;text-anchor:middle}
  .signT{font-family:'Bebas Neue',sans-serif;fill:#141518;text-anchor:middle}
  #lampA,#lampB{animation:key 1.1s steps(1,end) infinite}
  #lampB{animation-duration:.7s;animation-delay:-.3s}
  @keyframes key{0%{opacity:1}22%{opacity:.25}34%{opacity:1}60%{opacity:.25}70%{opacity:1}}
  #ndl{transform-origin:1420px 282px;animation:ndl .9s steps(4) infinite alternate}
  @keyframes ndl{from{transform:rotate(-18deg)}to{transform:rotate(24deg)}}
  #loop{animation:loop 1.2s linear infinite}
  @keyframes loop{to{stroke-dashoffset:-36}}
  #valve{animation:glow 3s steps(5) infinite alternate}
  @keyframes glow{from{opacity:.55}to{opacity:1}}
  #mastlamp{animation:mast 2.4s steps(1,end) infinite}
  @keyframes mast{0%{opacity:1}50%{opacity:.08}}
  #rainW{animation:rainw .5s linear infinite}
  @keyframes rainw{to{transform:translate(-12px,40px)}}
  #strip{animation:strip 3s steps(6) infinite}
  @keyframes strip{to{stroke-dashoffset:-48}}
  #cone{animation:cone 7s steps(1,end) infinite}
  @keyframes cone{0%{opacity:.5}92%{opacity:.5}94%{opacity:.3}96%{opacity:.5}}
  .set.open .back{display:block}
  .set .back{display:none}
  #keyG{display:none}
  #keyG.on{display:block}

  /* the wheel, close up */
  .wh{display:grid;grid-template-columns:410px minmax(0,560px);gap:26px;align-items:start;width:min(1010px,96vw);padding:22px 24px 20px;background:#1b1f1c;
    border:1px solid #3a4038;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .wh svg{display:block;width:100%;height:auto;touch-action:none}
  .wh-ring{font-family:'Courier Prime',monospace;font-weight:700;font-size:21px;text-anchor:middle}
  #inner{cursor:grab}
  #inner.on{cursor:grabbing}
  .wh-set{margin:10px 0 0;text-align:center;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#c9c39a}
  .wh-set b{font-family:'VT323',monospace;font-weight:normal;font-size:26px;color:#f4e04d;letter-spacing:.06em;vertical-align:-2px}
  .wh h5{margin:0 0 6px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:#a8a495}
  .wh-len{margin:0 0 12px;padding:10px 12px 6px;background:#e6dfcb;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .grp{display:inline-block;margin:0 9px 6px 0;font-family:'Courier Prime',monospace;font-weight:700;font-size:16.5px;letter-spacing:.06em;line-height:1.1}
  .grp i{display:block;font-style:normal;color:#8a8370}
  .grp b{display:block;color:#1c1b18}
  .wh-len.done{background:#f6f1e2}
  .wh-len.done p{margin:0 0 6px;font-family:'Caveat',cursive;font-weight:700;font-size:25px;line-height:1.12;color:#1d2a52}
  .wh-foot{display:flex;gap:14px;align-items:center;margin-top:4px}
  .wh-foot .pmsg{flex:1;font-size:16px}
  .lever{flex:none;padding:12px 18px 10px;border:2px solid #f4e04d;background:#23261f;color:#f4e04d;font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:.14em;border-radius:3px}
  .lever:hover{background:#f4e04d;color:#141518}
  @media (max-width:980px){.wh{grid-template-columns:1fr}}
</style>
</head>
