<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Shop · Wrong Number</title>
<link rel="stylesheet" href="../../assets/fonts-base.css">
<link rel="stylesheet" href="../../assets/fonts-cipher.css">
<link rel="stylesheet" href="../../assets/engine.css">
<link rel="stylesheet" href="../../assets/wordkit.css">
<link rel="stylesheet" href="kit.css">
<style>
  body{--bg:#070b08;--accent:#f4e04d;--font-display:'Playfair Display',serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime','Special Elite',monospace;
    --tc-bg:rgba(6,9,7,.94);--tc-ink:#f1eee2;--cap-bg:rgba(8,10,8,.93);--cap-ink:#f1eee2;--panel:#15161a;--fade:#000;--hud-bg:rgba(8,10,8,.74)}
  .tc-room{font-weight:900;font-style:italic;letter-spacing:0}
  .mk{font-family:'Playfair Display',serif;font-weight:900;font-size:16px;letter-spacing:5px;fill:#3a2a08;text-anchor:middle}
  .mk2{font-family:'Oswald',sans-serif;font-weight:600;font-size:8px;letter-spacing:2px;fill:#6d6650;text-anchor:middle}
  .sh{animation:sec 60s steps(60,end) infinite}
  @keyframes sec{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  #pend{animation:swing 1.3s ease-in-out infinite alternate}
  .cpend{animation:swing .55s ease-in-out infinite alternate}
  @keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  #bulb{animation:bulb 6.5s steps(1,end) infinite}
  @keyframes bulb{0%{opacity:1}61%{opacity:.9}63%{opacity:1}}
  #wrain{animation:wr .8s linear infinite}
  @keyframes wr{from{transform:translate(0,0)}to{transform:translate(-20px,120px)}}
  #dlamps circle{fill:#1b1f25;transition:fill .3s}
  .green #dlamps circle{fill:#5dff9a}
  .red #dlamps circle{fill:#ff4a3a}
  .live #mpaper{animation:mp .36s steps(2,end) infinite}
  @keyframes mp{50%{transform:translateY(-4px)}}
  .live #mled{animation:mled .36s steps(1,end) infinite}
  @keyframes mled{50%{opacity:.15}}

  /* ---- the machine on the counter ---- */
  .tm{width:min(900px,96vw)}
  .tm-paper{position:relative;margin:0 48px;padding:18px 56px 14px;min-height:300px;background:#f6f3e8;
    background-image:repeating-linear-gradient(#f6f3e8 0,#f6f3e8 27px,#e2efdf 27px,#e2efdf 54px);color:#1c1b18;
    font-family:'Courier Prime',monospace;font-weight:700;font-size:18px;line-height:27px;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
  .tm-paper:before,.tm-paper:after{content:'';position:absolute;top:0;bottom:0;width:30px;background-image:radial-gradient(circle,#101114 0,#101114 5px,rgba(16,17,20,0) 6px);background-size:30px 27px}
  .tm-paper:before{left:8px}.tm-paper:after{right:8px}
  .tm-text p{margin:0 0 13px}
  .tm-text .w{border-bottom-color:#8a8170}.tm-text .w:hover{color:#c8372d}
  .tm-text .wk-gap,.tm-text .wk-gap .wk-part{display:inline;margin:0}
  .tm-text .wk-gap .wk-cell{display:inline-block;width:auto;height:auto;margin:0;border-bottom:0;font-size:1em;font-weight:700;line-height:inherit;vertical-align:baseline;background:transparent}
  .tm-text .wk-gap .wk-cell.blank{min-width:.48em;margin:0 1px;padding:0 1px;border-bottom:2px solid #c8372d;font-family:'Caveat',cursive;font-size:1.6em;line-height:.62;text-align:center;color:#c8372d}
  .tm-text .wk-gap .wk-cell.blank:empty{height:.62em}
  .tm-text .wk-gap .wk-cell.cur{background:#f4e04d;animation:tmcur 1s steps(1,end) infinite}
  @keyframes tmcur{50%{background:rgba(244,224,77,.35)}}
  .tm-text .wk-gap .wk-cell.blank.fix,.tm-text .wk-gap.ok .wk-cell.blank{min-width:0;margin:0;border-bottom-color:transparent;background:transparent}
  .tm-text .wk-gap.bad .wk-cell.blank:not(.fix){color:#6d685c}
  .tm-text .wn-word i{font-size:1.6em}
  .tm-body{position:relative;padding:12px 28px 14px;background:#cfc7ad linear-gradient(180deg,#f4efdd 0,#ddd5bd 30%,#bdb497 100%);border:3px solid #6d6650;border-radius:16px 16px 10px 10px;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .tm-body:before{content:'';position:absolute;left:44px;right:44px;top:-3px;height:9px;background:#3a3629;border-radius:0 0 5px 5px}
  .tm-top{display:flex;align-items:center;margin:4px 0 2px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#4d4838}
  .tm-top b{margin-right:14px;font-weight:600;font-size:15px;letter-spacing:.3em;color:#1c1b18}
  .tm-led{margin-left:auto;width:12px;height:12px;border-radius:50%;background:#5dff9a;box-shadow:0 0 8px #5dff9a}
  .tm-keys{min-height:150px}
  .tm-keys .wk-board{margin:8px 0 0;--s:38px;font-family:'Oswald',sans-serif;color:#1c1b18}
  .tm-keys .wk-row{margin:5px 0}
  .tm-keys .wk-key{background:linear-gradient(#fdfbf2,#d9d2ba);color:#1c1b18;border:1px solid #6d6650;border-bottom-width:3px;border-radius:6px;font-weight:600}
  .tm-keys .wk-key:hover:not(:disabled){border-color:#1c1b18;background:#f4e04d}

  /* ---- the strongroom door ---- */
  .sr{width:min(1090px,96vw)}
  .sr-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .sr-door{position:relative;padding:16px 26px 14px;background:#4c545e linear-gradient(135deg,#939dab 0,#5f6873 26%,#414851 62%,#30363d 100%);border:4px solid #12151a;border-radius:10px 0 0 10px}
  .sr-plate{display:flex;align-items:baseline;justify-content:space-between;padding:8px 16px 5px;border-radius:4px;background:linear-gradient(135deg,#8a6a26,#e6c873 30%,#b08a35 55%,#f0d98f 78%,#8a6a26);
    border:2px solid #5a4313;color:#3a2a08;font-family:'Playfair Display',serif;font-weight:900;font-size:17px;letter-spacing:.2em;text-transform:uppercase}
  .sr-plate small{font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em}
  .sr-legend{display:flex;justify-content:space-between;margin:10px 2px 4px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#f1ecdf}
  .sr-legend i{display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:7px;vertical-align:-3px;border:2px solid #12151a}
  .sr-legend i.g{background:#39d27a;box-shadow:0 0 8px #39d27a}.sr-legend i.y{background:#f4c93a;box-shadow:0 0 8px #f4c93a}.sr-legend i.d{background:#1b1e23}
  .sr-mid{display:flex;align-items:flex-start}
  .sr-lamps{flex:1;--wk-size:50px;--wk-font:'Oswald',sans-serif;--wk-ink:#f1ecdf;--wk-hit:#2fbf6b;--wk-near:#e2b21f;--wk-miss:#1b1e23}
  .sr-lamps .wk-try{margin:5px 0}
  .sr-lamps .wk-grid .wk-cell{width:54px;height:54px;margin:0 7px;border-radius:50%;border:4px solid #12151a;background:#16191d radial-gradient(circle at 35% 30%,#414851,#16191d 70%);
    box-shadow:0 0 0 2px #8a94a0,inset 0 2px 5px rgba(0,0,0,.6);font-size:27px;font-weight:600;color:#f1ecdf;transition:background .25s,box-shadow .25s}
  .sr-lamps .wk-try.cur .wk-cell{box-shadow:0 0 0 2px #f4e04d,inset 0 2px 5px rgba(0,0,0,.6)}
  .sr-lamps .wk-try.cur .wk-cell.on{border-color:#12151a}
  .sr-lamps .wk-grid .wk-cell.hit{border-color:#12151a;background:#2fbf6b radial-gradient(circle at 35% 30%,#d6ffe6,#2fbf6b 55%,#136b3a);box-shadow:0 0 0 2px #8a94a0,0 0 18px #2fbf6b;color:#06230f}
  .sr-lamps .wk-grid .wk-cell.near{border-color:#12151a;background:#e2b21f radial-gradient(circle at 35% 30%,#fff7c9,#f4c93a 55%,#8a6a10);box-shadow:0 0 0 2px #8a94a0,0 0 18px #f4c93a;color:#2b2104}
  .sr-lamps .wk-grid .wk-cell.miss{border-color:#12151a;background:#0f1114 radial-gradient(circle at 35% 30%,#2a2e34,#0f1114 70%);color:#7b8591}
  .sr-lamps.stop .wk-grid .wk-cell.on{background:#c0261a radial-gradient(circle at 35% 30%,#ffd0c9,#ff4a3a 55%,#7d120b);box-shadow:0 0 0 2px #8a94a0,0 0 20px #ff4a3a;color:#2b0704}
  .sr-lamps.out .wk-grid .wk-cell{background:#0f1114;box-shadow:0 0 0 2px #8a94a0;color:#3a4149}
  .sr-lamps .wk-board{margin-top:10px}
  .sr-lamps .wk-row{margin:4px 0}
  .sr-lamps .wk-key{width:42px;height:42px;margin:0 3px;border-radius:50%;background:#101215 radial-gradient(circle at 35% 30%,#454c55,#101215 75%);border:3px solid #b08a35;color:#f1ecdf;font-size:17px;font-weight:500}
  .sr-lamps .wk-key.wide{width:82px;border-radius:21px;font-size:12.5px}
  .sr-lamps .wk-key:hover:not(:disabled){border-color:#f4e04d}
  .sr-lamps .wk-key.hit{background:#2fbf6b;color:#06230f;border-color:#b08a35}
  .sr-lamps .wk-key.near{background:#e2b21f;color:#2b2104;border-color:#b08a35}
  .sr-lamps .wk-key.miss{background:#0f1114;color:#5b636e;border-color:#5a4313;opacity:1}
  .sr-pull{width:132px;margin:6px 0 0 6px;text-align:center}
  .sr-st{min-height:54px;padding:7px 6px 5px;background:#0a0a08;border:2px solid #12151a;border-radius:3px;box-shadow:inset 0 2px 6px #000;font-family:'VT323',monospace;font-size:19px;line-height:1;color:#f4c93a;text-transform:uppercase}
  .sr-st.ok{color:#5dff9a}.sr-st.no{color:#ff4a3a}
  .sr-handle{display:block;margin:14px auto 0;width:110px}
  .sr-handle svg{display:block;width:100%;height:auto}
  .sr-handle .lev{transform-origin:55px 176px;transition:transform .25s}
  .sr-handle.tug .lev{transform:rotate(13deg)}
  .sr-handle:disabled{opacity:.55;cursor:default}
  .sr-pull small{display:block;margin-top:4px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#d9dee4}
  .sr-side{display:flex;align-items:center;justify-content:center;padding:16px;background:#14261f linear-gradient(180deg,#0f1c17,#1a3327);border:4px solid #12151a;border-left:0;border-radius:0 10px 10px 0}
  .sr-list{width:100%;padding:16px 18px 12px;background:#efe8d2 linear-gradient(175deg,rgba(255,255,255,.5),rgba(120,95,50,.17));color:#1c1b18;border:9px solid #2a1a10;box-shadow:inset 0 0 0 2px #d9b65c,0 8px 20px rgba(0,0,0,.5);
    font-family:'Special Elite','Courier Prime',monospace;font-size:14.5px;line-height:1.42}
  .sr-list h4{margin:0;font-family:'Playfair Display',serif;font-weight:900;font-size:21px;letter-spacing:.1em;text-align:center}
  .sr-list h5{margin:0 0 8px;font-family:'Oswald',sans-serif;font-weight:400;font-size:11px;letter-spacing:.3em;text-align:center;text-transform:uppercase;color:#6d685c}
  .sr-list table{width:100%;border-collapse:collapse}
  .sr-list td{padding:2px 6px 0 0;border-bottom:1px dotted #9c8b68;vertical-align:baseline}
  .sr-list td:first-child{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.14em;width:5.6em}
  .sr-list td:last-child{text-align:right;white-space:nowrap;padding-right:0}
  .sr-list .sig{margin:9px 0 0;font-size:13px;text-align:center;color:#4d4a42}
  @media (max-width:900px){.sr-main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a130f"/><stop offset="1" stop-color="#183024"/></linearGradient>

</defs>

<!-- wall, panelling, floor -->
<rect x="-1000" y="-500" width="3600" height="990" fill="url(#wallG)"/><rect x="-1000" y="-500" width="3600" height="970" fill="url(#wpaper)"/>
<rect x="-1000" y="470" width="3600" height="186" fill="#22150c"/><rect x="-1000" y="466" width="3600" height="12" fill="#3a2416"/>

<path d="M30 660L300 660L600 900H60Z" fill="#7fa0cc" opacity=".09" pointer-events="none"/>

<!-- the window on to Mercer Row -->

<!-- the grandfather clock -->
<g id="gclock" class="hot">

<!-- a wall of clocks -->
<g id="clocks" class="hot"></g>

<!-- the price list, in its frame -->

</g>

<!-- the workbench, and the lamp that is still on -->
<circle id="bulb" cx="1486" cy="452" r="430" fill="url(#poolG)" pointer-events="none"/>
<g id="blamp" class="hot" transform="translate(-62 0)">

  }

  /* ---------- the machine on the counter ---------- */
  function openMachine() {
    if (busy) return;
    var s = q(), box;
    if (s >= 4) { showRoll(); return; }
    box = ER.el('div', 'tm');
    box.innerHTML = '<div class="tm-paper"><div class="tm-text"></div></div>' +
      '<div class="tm-body"><div class="tm-top"><b>Textphone</b><span>Direct line &middot; strongroom &middot; 4 metres</span><i class="tm-led"></i></div><div class="tm-keys"></div></div>';
    cap = WN.cap(box); paper = box.querySelector('.tm-text'); keysEl = box.querySelector('.tm-keys');
    ER.open('ov-lock', box, function () { cap = null; paper = null; if (gaps) { gaps.destroy(); gaps = null; } });
    showMsg(s);
  }
  function showMsg(s) {
    if (!cap) return;
    cap.stop(); keysEl.innerHTML = '';
    if (gaps) { gaps.destroy(); gaps = null; }
    if (s === 2) {
      paper.innerHTML = WN.roll(['m5']).replace(/<h4>.*?<\/h4>/, '');
      cap.say('Nothing new has come. The steel door is waiting for its word.');
      return;
    }
    var m = MSG[s];
    WN.sfx.clatter(10);
    gaps = WN.mend(paper, m.html, { had: had, board: true, boardIn: keysEl,
      onWord: function () { ER.sfx.paper(); },
      onMiss: function (key, node, n) { if (cap) cap.say(MISS[Math.min(n, 2) - 1]); },
      onDone: function () { msgDone(s); } });
    cap.say(m.open);
    if (gaps.done()) msgDone(s);
  }
  function msgDone(s) {
    var m = MSG[s];
    WN.file(paper, m.id, m.title);
    ER.flag('q', s + 1); ER.pips(s === 3 ? 4 : s + 1, 5); tick(m.time); setLive(); WN.done();
    if (!cap) return;
    cap.say(m.after);
    if (s === 0) cap.go('Go on', function () { showMsg(1); });
    else if (s === 1) cap.go('Go to the door', function () { ER.close(); ER.say('The steel door is at the back of the shop. The price list hangs beside it, in a frame.'); });
    else cap.go('Look at all six messages', function () { ER.close(); showRoll(); });
  }
  function showRoll() {
    ER.read({ html: WN.roll(['m1', 'm2', 'm3', 'm4', 'm5', 'm6']), cls: 'wn-msg wn-roll', clue: { id: 'roll', title: 'All six messages', kind: 'Messages, mended' },
      done: function () { ER.say('Six messages. And in every one of them, a few letters in your own writing.'); } });
  }

  /* ---------- the strongroom door ---------- */
  function openDoor(e) {
    if (busy) return;
    var s = q(), box;
    if (s < 2) {
      ER.say('A steel door as thick as a dictionary, with five small lamps on it and a row of letter keys. The lamps are dark. You do not yet know what the door wants, and on the counter the machine is waiting.');
      return;
    }
    box = ER.el('div', 'sr');
    box.innerHTML = '<div class="sr-main"><div class="sr-door"><div class="sr-plate"><span>E. Garnet</span><small>Friday word &middot; five letters &middot; four tries</small></div>' +
      '<div class="sr-legend"><span><i class="g"></i>Right letter, right place</span><span><i class="y"></i>Right letter, wrong place</span><span><i class="d"></i>Not in the word</span></div>' +
      '<div class="sr-mid"><div class="sr-lamps"></div><div class="sr-pull"><div class="sr-st"></div>' +
      '<button type="button" class="sr-handle"><svg viewBox="0 0 110 220"><circle cx="55" cy="176" r="34" fill="#2b3138" stroke="#0a0c10" stroke-width="4"/>' +
      '<g class="lev"><path d="M55 176V40" stroke="#0a0c10" stroke-width="24" stroke-linecap="round"/><path d="M55 176V40" stroke="#a9b3bf" stroke-width="15" stroke-linecap="round"/>' +
      '<path d="M50 170V46" stroke="#e3e8ee" stroke-width="3" stroke-linecap="round" opacity=".6"/><circle cx="55" cy="36" r="21" fill="#14181d"/><circle cx="49" cy="30" r="6" fill="#8d98a6" opacity=".7"/></g>' +
      '<circle cx="55" cy="176" r="13" fill="#8d98a6"/></svg></button><small>Handle</small></div></div></div>' +
      '<div class="sr-side"><div class="sr-list">' + LIST + '</div></div></div>';
    cap = WN.cap(box);
    ER.open('ov-lock', box, function () { cap = null; if (wd) { wd.destroy(); wd = null; } if (offKeys) { offKeys(); offKeys = null; } });
    box.querySelector('.sr-handle').addEventListener('click', pull);
    ER.addClue('prices', 'The price list', LIST, 'wn-list', 'Price list', true);
    if (s === 2) play(); else ready(s);
  }
  function status(text, cls) { var n = ER.$('.sr-st'); if (n) { n.innerHTML = text; n.className = 'sr-st' + (cls ? ' ' + cls : ''); } }
  function onList(w) { return PRICES.some(function (r) { return r[0].toLowerCase() === w; }); }
  function type(lamps, g) {
    g.split('').concat(['enter']).forEach(function (k) { var b = lamps.querySelector('.wk-key[data-k="' + k + '"]'); if (b) b.click(); });
  }
  /* find Miss Imrie's word: four tries, and a lamp for every letter */
  function play() {
    var lamps = ER.$('.sr-lamps'), r = ER.flag('sr') || 0, o;
    if (!lamps) return;
    lamps.innerHTML = ''; lamps.className = 'sr-lamps';
    if (wd) { wd.destroy(); wd = null; }
    o = { key: POOL[r % POOL.length], tries: 4,
      onRow: function (guess, marks, row) {
        if (replay) return;
        tries.push(guess);
        var g = marks.filter(function (m) { return m === 'hit'; }).length, y = marks.filter(function (m) { return m === 'near'; }).length, W = guess.toUpperCase(), s;
        if (!onList(guess)) s = W + ' is not one of the things on the price list. The lamps have marked it all the same, but that was one of your four words.';
        else if (!g && !y) s = W + '. Five dark lamps. None of those letters is in her word, and that is worth knowing. Look at the list again.';
        else s = W + '. ' + (g ? NUM[g] + ' green' : 'No green') + ', ' + (y ? NUM[y].toLowerCase() : 'no') + ' yellow. Before you type again, look at the price list. Which of the things on it can the word still be?';
        if (row === 3 && g < 5) s += ' You have one word left.';
        if (cap) cap.say(s);
      },
      onWin: function (guess, rows) {
        if (replay) return;
        ER.flag('rows', tries.slice()); ER.flag('word', guess); ER.flag('tries', rows); ER.flag('q', 3); tries = []; pulls = 0;
        WK.learn(guess); ER.pips(3, 5); tick('23:55'); setLive(); WN.sfx.bolt(); ER.sfx.ok();
        if (ER.mood) ER.mood('tense');                       /* minutes to midnight, and the door is ready */
        status('Word accepted.<br>Pull handle.', 'ok'); ER.$('.sr-handle').disabled = false;
        if (cap) cap.say('Five green lamps. Somewhere inside the door, something heavy slides back. The word was ' + guess.toUpperCase() + '. Now there is only the handle.');
        setTimeout(function () { if (q() === 3) WN.sfx.clatter(12); }, 2600);
      },
      onLose: function () {
        if (replay) return;
        tries = []; ER.flag('sr', r + 1); WN.sfx.dead();
        status('Four wrong words.<br>Spare word.', 'no');
        if (cap) cap.say('Four words, and none of them was hers. The lamps go out, one after another. Then the little plate lights up again: SPARE WORD. Miss Imrie, it seems, thinks of everything. She has even thought of you.');
        setTimeout(function () { if (cap && ER.$('.sr-lamps') && q() === 2) { play(); cap.say('Five dark lamps, four new tries, and a different word from the same list. This time, let the lamps do the work.'); } }, 5200);
      } };
    wd = WK.wordle(lamps, o);
    replay = true; o.sound = false; tries.forEach(function (g) { type(lamps, g); }); o.sound = true; replay = false;
    status('Type this week&rsquo;s word.'); ER.$('.sr-handle').disabled = true;
    if (cap) cap.say(tries.length ? 'The lamps are as you left them.' : 'Five dark lamps and a row of letter keys. Type a word of five letters from the price list, and press Enter.');
  }
  /* the word has been found: the lamps are green and the door is waiting for its handle */
  function ready(s) {
    var lamps = ER.$('.sr-lamps'), rows = ER.flag('rows') || [], key = POOL[(ER.flag('sr') || 0) % POOL.length], h = '<div class="wk wk-wordle won"><div class="wk-grid">', grid;
    if (!lamps) return;
    rows.forEach(function (g) {
      var m = WK.score(key, g);
      h += '<div class="wk-try">' + g.split('').map(function (ch, i) { return '<span class="wk-cell on ' + m[i] + '">' + ch.toUpperCase() + '</span>'; }).join('') + '</div>';
    });
    lamps.innerHTML = h + '</div></div>'; lamps.className = 'sr-lamps';
    status('Word accepted.<br>Pull handle.', 'ok');
    if (s < 4) { cap.say('Five green lamps, and the handle. On the counter behind you, the machine has begun to clatter again.'); return; }
    grid = lamps.querySelector('.wk-grid');
    entry(grid, lamps.firstChild);
    cap.say('Five green lamps. The door has its word, and the handle is waiting. Under the lamps, the letter keys are still lit.');
  }
  /* a row to type on */
  function entry(grid, root) {
    var row = ER.el('div', 'wk-try cur'), buf = '', i;
    for (i = 0; i < 5; i++) row.appendChild(ER.el('span', 'wk-cell'));
    grid.appendChild(row);
    function draw() { for (var j = 0; j < 5; j++) { row.children[j].textContent = (buf.charAt(j) || '').toUpperCase(); row.children[j].classList.toggle('on', j < buf.length); } }
    function press(k) {
      if (busy) return false;
      if (k === 'back') { buf = buf.slice(0, -1); draw(); return; }
      if (k === 'enter') {
        if (buf.length < 5) { ER.shake(row); ER.sfx.no(); return; }
        var w = buf, file = ER.exitOk([w]);
        if (file) { stop(file, row); return; }
        ER.shake(row); ER.sfx.no(); buf = ''; draw();
        if (cap) cap.say(w === ER.flag('word') ? w.toUpperCase() + ' again. The five lamps stay green. The door has that word already, and it is still waiting for the handle.'
          : w.toUpperCase() + '. The lamps blink once and stay green. That is not a word the door knows.');
        return;
      }
      if (k.length !== 1) return false;
      if (buf.length < 5) { buf += k; ER.sfx.tick(); draw(); }
    }
    WK.board(root, { back: true, enter: true, key: press });
    offKeys = WK.keys(root, press);
  }
  function pull() {
    if (busy) return;
    var s = q(), b = ER.$('.sr-handle');
    if (s < 3 || !cap) return;
    b.classList.add('tug'); ER.sfx.clunk(); setTimeout(function () { b.classList.remove('tug'); }, 260);
    if (s === 3) { cap.say('Your hand is on the handle when the machine on the counter begins to clatter again. He is sending something. You had better read it first.'); return; }
    cap.say(['Your hand closes on the handle. It is cold, and heavier than it looks. And still you do not pull it. There is no rain in here, and the letters still fall out of his words. Why?',
      'No. Not yet. Six messages, and holes in every one of them, even in here, where it is dry. You put the letters back yourself. Which letters were they?',
      'You take your hand away again. Look at the six messages on the counter first, and read only what is in your own writing.'][Math.min(pulls, 2)]);
    pulls++;
  }
  function stop(file, row) {
    var lamps = ER.$('.sr-lamps'), st = ER.state();
    busy = true; st.done = st.done || {}; st.done.shop = 1;
    ER.flag('q', 5); ER.pips(5, 5); tick('23:57'); row.classList.remove('cur');
    lamps.classList.add('stop'); svg.classList.remove('green'); svg.classList.add('red'); WN.sfx.lamp(330);
    status('&nbsp;', 'no');
    if (cap) cap.say('Five red lamps, all down the door.');
    setTimeout(function () {
      lamps.classList.remove('stop'); lamps.classList.add('out'); svg.classList.remove('red'); WN.sfx.lamp(220); WN.solved(true);
      if (cap) cap.say('Five red lamps. Then, one after another, they go out. No bell rings. Nothing moves. If anything has happened, it has happened somewhere else.');
    }, 1900);
    setTimeout(function () {
      ER.closeAll();
      ER.narrate(['You stand in the dark with your back to the steel door, and you do not touch the handle. The shop is very quiet, for a room so full of clocks.'], function () { ER.leave(file); });
    }, 6200);
  }

  /* ---------- the shop ---------- */
  $('#machine').addEventListener('click', openMachine);
  $('#sdoor').addEventListener('click', openDoor);
  $('#plist').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: LIST, cls: 'wn-list', clue: { id: 'prices', title: 'The price list', kind: 'Price list' },
      done: function () { if (q() < 1) ER.say('A price list, in a frame. Mr Garnet charges sixty pence for a single letter.'); } });
  });
  WN.thing('#clocks', 'clock', function () { return 'A wall of clocks, and Mr Garnet cannot hear one of them. They agree about the hour and argue about the minute. Most of them say ' + spoken() + '.'; }, isBusy);
  WN.thing('#gclock', 'pendulum', 'A grandfather clock, taller than you are. Its pendulum goes on swinging in the dark, as if nothing had happened.', isBusy);
  WN.thing('#cases', 'velvet', 'Glass cases, with black velvet trays inside them. There is nothing on the trays but the shapes of rings. Everything valuable goes into the strongroom at six: the notice said so.', isBusy);
  WN.thing('#tray', 'tray', 'One tray is still out on the counter: nine rings, in three rows. Mr Garnet puts everything valuable away at six. He did not put these away.', isBusy);
  WN.thing('#helmet', 'helmet', 'A motorbike helmet, on the chair where customers sit. You try to picture old Mr Garnet on a motorbike, and find that you cannot.', isBusy);
  WN.thing('#blamp', 'workbench', 'Mr Garnet&rsquo;s work lamp, still on. He had not finished for the day when the day finished with him.', isBusy);
  WN.thing('#swin', null, 'The back of his notice. Through the wet glass you can see the phone box, very small and very red, with its light still on.', isBusy);
})();
</script>
</body>
</html>
