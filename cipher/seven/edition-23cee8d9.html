      ],
      clue: { id: 'lovage', title: 'Mr Lovage: since six o&rsquo;clock', kind: 'In the lift' },
      done: function () { tell('talk'); landing(); }
    });
  }
  function landing() {
    busy = true;
    ER.narrate([
      'Then the glass door opened. Mrs Penhale stood on the landing in a green evening dress, with Mr Quill&rsquo;s crossword in her hand. She had come back from the Lord Mayor&rsquo;s dinner at one o&rsquo;clock. By the stairs.',
      'Mr Quill arrived a minute later, by the same stairs. For some time he could not speak at all.',
      'You gave her the grid and your solutions book. She read them both, standing up. Then she asked one question. &ldquo;Mr Quill. What is tomorrow&rsquo;s seven down?&rdquo;',
      '&ldquo;Banana,&rdquo; said Mr Quill, when he had the breath for it.',
      '&ldquo;Mr Lovage?&rdquo; &ldquo;It is on the card behind you, madam,&rdquo; said Mr Lovage. It was the only time that anybody has seen the Editor of the Clarion read a lift notice twice.',
      'At twenty to two the lift went down to the second floor, in perfect order, with a plain envelope in it. Mr Fenwick had kept page 12 loose. Mr Quill&rsquo;s crossword fell on the floor. By accident.'
    ], function () { two(); });
  }
  /* two o'clock: the bell, the presses, and the music turns to a major key */
  function two() {
    SEV.setClock('Tue', 180); ER.sfx.bell(); setTimeout(function () { SEV.sfx.rumble(3.2); $('#paper').classList.add('run'); }, 700);
    try { if (ER.track) { ER.cfg.sound = ['morning', { root: 50, bpm: 72, drop: ['mel'] }]; ER.track.play(ER.cfg.sound); } } catch (e) {}
    ER.narrate([
      'At two o&rsquo;clock a bell rang under the street, and the whole of Clarion House began to shake.',
      'Mr Fenwick came up with the first copy himself, and a strip of wet proof. &ldquo;Seven down has a clue after all,&rdquo; he said. &ldquo;He wrote it in the lift. But a piece of type has broken, and I am too proud to ask him what it says.&rdquo;'
    ], function () { busy = false; openLast(); });
  }

  /* ---------- the last gap ---------- */
  function openLast() {
    if (busy || last) return;
    var box = ER.el('div', 'lp'), msgEl;
    box.innerHTML = '<h5><span>THE CLARION &middot; No. 10,000</span><span>PROOF</span></h5>' +
      '<p class="clue"><b>7</b>Not working: like the <span class="wk-gap" data-key="last" data-show="l__t"></span> at Clarion House until two o&rsquo;clock this morning (3, 2, 5)</p><p class="sv-msg"></p>';
    msgEl = box.querySelector('.sv-msg');
    msgEl.innerHTML = ER.gloss('Two letters have not printed. Type them.');
    WK.gaps(box, { mark: false,
      onMiss: function () { msgEl.innerHTML = ER.gloss('Mr Fenwick looks at you over his glasses. &ldquo;After tonight?&rdquo; he says.'); },
      onDone: function () {
        last = true; ER.flag('e-last', 1); if (!ER.flag('tEnd')) ER.flag('tEnd', Date.now());
        msgEl.innerHTML = ER.gloss('&ldquo;LIFT,&rdquo; says Mr Fenwick. &ldquo;I might have known.&rdquo;'); ER.sfx.ok();
        busy = true;
        setTimeout(function () { ER.closeAll(); finish(false); }, 1700);
      } });
    ER.open('ov-lock', box);
  }
  function finish(again) {
    var st = ER.state();
    $('#paper').classList.add('run');
    function card() {
      var mins = SEV.minutesPlayed(), hn = ER.hintsUsed(), sl = ER.flag('slips') || 0;
      $('#d-time').textContent = 'The first edition went to press at two. It took you ' + mins + (mins === 1 ? ' minute' : ' minutes') + ' to get the crossword into it.';
      $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' words. You rubbed out ' + sl + (sl === 1 ? ' wrong answer.' : ' wrong answers.');
      $('#d-hints').textContent = hn ? 'You asked for ' + hn + (hn === 1 ? ' hint.' : ' hints.') : 'You did not ask for a single hint.';
      $('#done').classList.add('on'); busy = false;
    }
    if (again) { SEV.setClock('Tue', 180); card(); return; }
    busy = true;
    ER.narrate([
      'Nobody at the Clarion was unmasked. The box on page 1 was lifted out, and a smaller one went into page 12: SPHINX THANKS HIS READERS FOR TEN THOUSAND MORNINGS.',
      'Mr Lovage took the Lord Mayor&rsquo;s cheque, and nothing else. &ldquo;The money, yes,&rdquo; he said. &ldquo;The name, no. I like to hear what they say about me on the way up.&rdquo;',
      'Mr Quill has left the Clarion, to give more time to his own crosswords. So far, nobody has asked to see them.',
      'In the spring the lift is to have push buttons, and Mr Lovage will be sixty. Sphinx is going to need a desk. He has asked for the corner of yours, and for somebody to check his clues who is not afraid to cross one out.',
      'On Wednesday morning you got into the lift with the Clarion under your arm. &ldquo;Seven down is a hard one today,&rdquo; said Mr Lovage. &ldquo;It begins with V,&rdquo; you said. The lift went up very slowly indeed.'
    ], function () { card(); ER.sfx.ok(); });
  }

  /* ---------- things in the lift ---------- */
  $('#paper').addEventListener('click', function () {
    if (busy) return;
    if (!last && told.talk) { openLast(); return; }
    ER.say(last ? 'The first copy of Tuesday&rsquo;s Clarion, still warm. Page 12: Crossword No. 10,000. Every square is empty. Sixty thousand people are about to begin where you began.' : 'A newspaper that has not been printed yet. Mr Lovage is still talking.');
  });
  SEV.thing('#handle', null, 'The brass handle. Forward for up, back for down, and in the middle the lift stops wherever its attendant likes: between two floors, for instance.', isBusy);
  SEV.thing('#pencil', null, 'A blue pencil, worn down to half its length. It has written ten thousand crosswords and nine cards, one for every gate.', isBusy);
  SEV.thing('#flask', null, 'A flask of tea. He was ready for a long night.', isBusy);
  SEV.thing('#cage', null, 'The lift, from the inside. A wooden stool, a brass handle, and the floors going by on the other side of the gate.', isBusy);
  SEV.onGrid = function () { if (!busy) SEV.openSheet({ type: [], msg: 'Sixteen answers, in ink. Tomorrow&rsquo;s readers will get the same grid with every square empty, and clues of their own.' }); };
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* number 10,001: the one part that nobody can do for you */
  $('#b-write').addEventListener('click', function () {
    var saved = ER.flag('report') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>THE CLARION &middot; PUZZLES DESK</h4><h3>Number 10,001: your turn</h3>' +
      '<label for="r1">1. Choose one of tonight&rsquo;s sixteen answers. Write a clue for it as Sphinx does: a plain meaning, without using the word itself.</label><textarea id="r1"></textarea>' +
      '<label for="r2">2. Now hide a word. Write a sentence in which a word of your own begins inside one word and ends inside another, as OMEN hid in &ldquo;two men&rdquo;. Under it, write the meaning of the hidden word.</label><textarea id="r2"></textarea>' +
      '<label for="r3">3. The Clarion cannot print Sphinx&rsquo;s name. In about sixty words, tell its readers what happened last night without giving him away.</label><textarea id="r3"></textarea>' +
      '<label for="r4">Signed (a pen name will do)</label><input type="text" id="r4" maxlength="60">' +
      '<div class="count"></div><div class="foot"><span>Saved in this browser as you type.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > label');
    ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { box.querySelector('#' + k).value = saved[k] || ''; });
    function keep() {
      var o = {}, n = 0;
      ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { o[k] = box.querySelector('#' + k).value; });
      ['r1', 'r2', 'r3'].forEach(function (k) { n += (o[k].match(/[A-Za-z’']+/g) || []).length; });
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('report', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
