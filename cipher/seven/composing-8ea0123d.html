<head>

<style>
  body{--bg:#0e1217;--accent:#f4e04d;--font-display:'Bebas Neue',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(11,14,19,.96);--tc-ink:#e9eef2;--cap-bg:rgba(11,14,19,.94);--panel:#151a20;--face-bg:#262b30;--q-ink:#e6d58a;--fade:#06080b;--hud-bg:rgba(11,14,19,.8)}
  .tc-room{letter-spacing:.06em;font-size:clamp(44px,6.4vw,84px)}
  .sT{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .pool{animation:pl 5.7s steps(1,end) infinite}
  .pool.p2{animation-delay:-1.9s}.pool.p3{animation-delay:-3.7s}
  @keyframes pl{0%{opacity:1}52%{opacity:.9}56%{opacity:1}}
  #flywheel{transform-origin:668px 300px;animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #phone3.ring{animation:ring .12s steps(2,end) infinite;transform-box:fill-box;transform-origin:50% 10%}
  @keyframes ring{50%{transform:translate(2px,1px) rotate(1.2deg)}}

  /* the composing stick, the mirror and the proofs */
  .st{display:grid;grid-template-columns:minmax(0,700px) 330px;gap:18px;width:min(1060px,96vw);align-items:start}
  .st-main{background:#39424b linear-gradient(160deg,#4a545e,#252b32);border:3px solid #15181c;box-shadow:0 26px 70px rgba(0,0,0,.65),inset 0 0 0 2px #5d6770;padding:14px 18px 14px;border-radius:5px}
  .st-tags{display:flex;gap:8px;margin-bottom:12px}
  .st-tags button{flex:1;padding:6px 6px 4px;border:0;background:#fbf8ee;color:#2450a8;font-family:'Caveat',cursive;font-weight:700;font-size:20px;line-height:1.05;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.4)}
  .st-tags button:nth-child(odd){transform:rotate(-1.2deg)}.st-tags button:nth-child(even){transform:rotate(1deg)}
  .st-tags button small{display:block;font-family:'Special Elite',monospace;font-weight:normal;font-size:12.5px;letter-spacing:.06em;color:#1c1b18;text-transform:none}
  .st-tags button.on{background:#f4e04d;color:#141518}
  .st-tags button.done{background:#cfd6cf;color:#3d5a45}
  .st-tags button.done small{color:#3d5a45}
  .st-mirror{position:relative;margin:0 auto 12px;width:86%;height:86px;border-radius:44px;background:#dfe9ee linear-gradient(160deg,#f6fbfd,#b9c9d2 60%,#e3edf1);border:7px solid #7d5f1d;box-shadow:inset 0 0 0 2px #f5df98,0 6px 14px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:44px;letter-spacing:.16em;color:#1c2630;text-transform:uppercase;overflow:hidden}
  .st-mirror:before{content:'';position:absolute;left:8%;top:-20%;width:16%;height:140%;background:rgba(255,255,255,.4);transform:rotate(18deg)}
  .st-mirror small{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:'Oswald',sans-serif;font-weight:500;font-size:10px;letter-spacing:.3em;color:#5d6a72}
  .st-stick{display:flex;flex-direction:row-reverse;justify-content:center;gap:5px;padding:12px 16px 14px;background:#7d5f1d linear-gradient(#c79b3b,#7d5f1d);border-radius:3px;box-shadow:inset 0 3px 0 #f5df98,0 8px 16px rgba(0,0,0,.5)}
  .st-sort{position:relative;width:62px;height:78px;border-radius:2px;background:#aeb6bd linear-gradient(150deg,#e3e8ec,#8f989f 55%,#b9c1c8);box-shadow:inset 0 0 0 1px #5d6770,0 3px 0 #4a5158;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
  .st-sort b{display:block;transform:scaleX(-1);font-family:'Playfair Display',serif;font-weight:900;font-size:46px;line-height:1;color:#22282e;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .st-sort.lock{background:#6f7880 linear-gradient(150deg,#8f989f,#555d64);cursor:not-allowed}
  .st-sort.lock:after{content:'\2713';position:absolute;right:3px;top:0;font-family:Arial,sans-serif;font-weight:bold;font-size:15px;color:#8fb0ff}
  .st-sort.held{outline:3px solid #f4e04d;outline-offset:2px;transform:translateY(-6px)}
  .st-sort:hover:not(.lock){box-shadow:inset 0 0 0 2px #f4e04d,0 3px 0 #4a5158}
  .st-bar{display:flex;align-items:flex-start;gap:14px;margin-top:12px}
  .st-bar .sv-msg{flex:1;min-height:104px;font-size:15.5px}
  .st-bar .btn{white-space:nowrap}
  .st-strips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;min-height:34px}
  .st-strips span{padding:3px 12px 1px;background:#f3eedf;color:#141518;font-family:'Playfair Display',serif;font-weight:900;font-size:20px;letter-spacing:.14em;box-shadow:0 3px 6px rgba(0,0,0,.45);animation:strip .5s ease-out}
  .st-strips span.bad{color:#8c2f24;text-decoration:line-through;font-weight:700;font-size:17px;opacity:.85}
  @keyframes strip{from{transform:translateY(-16px);opacity:0}}
  .st-card{background:#fbf8ee;color:#1c1b18;padding:12px 16px 12px;font-family:'Courier Prime',monospace;font-size:15.5px;line-height:1.34;box-shadow:0 10px 26px rgba(0,0,0,.5);transform:rotate(.6deg)}
  .st-card h6{margin:0 0 6px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;color:#2450a8}
  .st-card p{margin:0 0 6px}
  .st-card .pie{font-family:'Playfair Display',serif;font-weight:900;font-size:25px;letter-spacing:.1em}
  .st-side .sv-grid{margin:14px auto 0}
  @media (max-width:1330px){.st{grid-template-columns:minmax(0,640px) 310px}.st-sort{width:56px;height:72px}.st-sort b{font-size:42px}}
  @media (max-width:900px){.st{grid-template-columns:1fr}}

  /* the front page, in metal */
  .fm{width:min(760px,94vw);padding:20px 24px 18px;background:#3d464f linear-gradient(160deg,#59636c,#252b32);border:4px solid #15181c;box-shadow:0 26px 70px rgba(0,0,0,.65);border-radius:4px}
  .fm-bars{display:flex;gap:8px;margin-bottom:10px}
  .fm-bars i{flex:1;height:26px;background:#8f989f linear-gradient(#c9d0d6,#7b848b)}
  .fm-bars i:nth-child(2){flex:2.4}
  .fm-box{position:relative;padding:20px 26px 18px;background:#aeb6bd linear-gradient(150deg,#e3e8ec,#8f989f 55%,#c3cad0);box-shadow:inset 0 0 0 3px #4a5158,inset 0 0 0 9px #b9c1c8,inset 0 0 0 11px #4a5158;color:#22282e;text-shadow:0 1px 0 rgba(255,255,255,.5);
    font-family:'Playfair Display',serif;font-weight:700;font-size:21px;line-height:1.36;text-align:center;transition:transform .7s}
  .fm-box h4{margin:0 0 8px;font-weight:900;font-size:38px;letter-spacing:.06em}
  .fm-box p{margin:0 0 6px}
  .fm.metal .fm-box{transform:scaleX(-1)}
  .fm.paper .fm-box{background:#f3eedf;box-shadow:inset 0 0 0 3px #1c1b18,inset 0 0 0 9px #f3eedf,inset 0 0 0 11px #1c1b18;color:#141518;text-shadow:none}
  .fm-foot{display:flex;align-items:center;gap:14px;margin-top:12px}
  .fm-foot .sv-msg{flex:1;min-height:52px}
  .doc.proof{width:min(600px,92vw);background:#f3eedf linear-gradient(175deg,rgba(255,255,255,.4),rgba(120,100,60,.12));font-family:'Courier Prime',monospace;font-size:16.5px;line-height:1.36;padding:22px 30px 22px;border-top:10px solid #141518}
  .doc.proof h4{font-family:'Playfair Display',serif;font-weight:900;font-size:21px;margin-bottom:4px}
  .doc.proof h5{margin:10px 0 3px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.2em}
  .doc.proof p{margin:0 0 3px}
  .doc.proof .green{font-family:'Homemade Apple',cursive;font-size:15px;color:#1f7a4a;margin-bottom:8px}
  .doc.proof .chalk{font-family:'Permanent Marker',cursive;font-size:16.5px;line-height:1.2;color:#b3261c;margin:1px 0 6px 18px}
</style>
</head>

    if (busy) return;
    if (!met) { ER.say('A tray of loose type, with four tags in blue pencil. The man in the apron clears his throat. It is his tray: speak to him first.'); return; }
    if (!stBox) stBox = build();
    inStick = true;
    ER.open('ov-lock', stBox, function () { inStick = false; });
  }
  $('#galley').addEventListener('click', openStick);
  SEV.onGrid = function () {
    if (busy) return;
    SEV.openSheet({ type: [], shut: function (k) { return MINE.indexOf(k) >= 0 ? 'That one is a line of pie in the galley. Set it right in the stick, and it will be written in.' : k === 'd7' ? '7 Down has no clue. But look how many of its squares are filling up.' : 'That clue is waiting in the press hall.'; },
      msg: nextFile ? 'Fourteen answers in ink.' : 'Four of these are lying in the galley on the stone: 1, 8, 9 and 10 Across.' });
  };
  function finish() {
    var file = ER.exitOk([MINE.map(SEV.word).join('-')]), st;
    if (!file) return;
    nextFile = file; ER.flag('c-file', file); st = ER.state(); st.done = st.done || {}; st.done.composing = 1; ER.flag('c-out', 1);
    busy = true; SEV.solved();
    setTimeout(function () {
      ER.closeAll();
      ER.narrate([
        'A person who pretends to be somebody else. A gap in the rules. A document changed so that it tells a lie. And a recluse, which is what the whole town thinks Sphinx is.',
        'Sphinx is telling you something, a word at a time. And he is telling it to you, and to nobody upstairs.',
        '&ldquo;One clue left, by the look of your sheet,&rdquo; says Mr Fenwick. &ldquo;And one that has no clue at all. The press hall is at the bottom of the building. Bring me a real Sphinx before half past one, and Mr Quill&rsquo;s brick goes on the floor. By accident.&rdquo;'
      ], function () { busy = false; after(); if (!seenPanel) ER.say('Before you go: Mr Fenwick nods at page 1, and at the mirror on the pillar.'); });
    }, 2400);
  }

  /* ---------- things in the room ---------- */
  SEV.thing('#cases', 'type case', 'The cases. Capital letters are kept in the upper case, and small letters in the lower case, which is where those two names come from.', isBusy);
  SEV.thing('#lino', null, 'A machine the size of a wardrobe, with a keyboard at the front and a pot of melted lead at the back. It sets a whole line of words at a time. It is resting.', isBusy);
  SEV.thing('#tube', 'carrier', 'The tube from the sixth floor. Everything the puzzles desk writes comes down it in a brass carrier, with a noise like a cork. The last thing to come down was Mr Quill&rsquo;s.', isBusy);
  SEV.thing('#wclock', null, function () { return 'The clock over the pillar says ' + SEV.time() + '. Page 12 closes at half past one.'; }, isBusy);
  $('#phone3').addEventListener('click', function () { if (busy) return; ER.say('The telephone on the pillar has ink on it in the shape of a hand.'); });
  $('#dial').addEventListener('click', function (e) { e.stopPropagation(); if (busy) return; ER.say('The brass arrow over the lift gate, seen from the second floor. Still between 6 and 7.'); });
  $('#door').addEventListener('click', function () { if (busy) return; ER.say('The lift, with its card. &ldquo;Out of order since six,&rdquo; says Mr Fenwick. &ldquo;In thirty-two years I never knew that lift to stop. Lovage would not allow it.&rdquo;', 8000); });
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; SEV.sfx.steps(5);
    setTimeout(function () { ER.leave(nextFile); }, 900);
  });
})();
</script>
</body>
</html>
