    a14: ['14 Across gives two meanings, with a semicolon between them. One word has to fit both.',
      'Somebody who drops things and walks into doors is this. So is the moment after somebody has said exactly the wrong thing.',
      'It begins with A, and it has two Ws in it.'],
    d13: ['13 Down, with a star, is a way of looking. Not a quick look: a long one.',
      'You do it at the stars, or out of a window, or at somebody you admire. STARE has five letters. This word has four.',
      'It begins G, A. The third letter is one of the rarest in English.']
  };

  function hints() {
    if (nextFile) return ['go', ['Five answers are in ink. Every other clue is waiting somewhere else in the building. Use the button at the bottom of the screen to go down to the library.']];
    var k = SEV.cur();
    if (k && HINTS[k]) return [k, HINTS[k]];
    return ['look', [
      'Something is lying on the green blotter that was not there before you went for tea. Click on it.',
      'It is a crossword. Five of its clues can be done from this chair: 5, 14 and 15 Across, and 4 and 13 Down. Click a clue, and type the answer on the keyboard. The other clues only say where they are waiting.'
    ]];
  }
  function isBusy() { return busy; }
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function after() {
    ER.pips(SEV.count(MINE), MINE.length);
    if (nextFile) $('#go').classList.add('on');
  }
  function begin() {
    after(); SEV.keep();
    if (!tell('in')) { ER.say('The puzzles desk. The grid is where you left it.'); return; }
    busy = true;
    ER.narrate([
      'A sheet of paper, square in the middle of the blotter: a crossword grid with every square empty. Across the top somebody has written two sentences, in small blue capitals.',
      'You know those capitals. They have been on every envelope you have opened since last Tuesday.',
      'Nobody passed you on the stairs.'
    ], function () { busy = false; });
  }

  /* ---------- the grid ---------- */
  function openGrid() {
    if (busy) return;
    SEV.openSheet({
      type: MINE, onRight: right, onWrong: function (k, w) { return (WRONG[k] || {})[w] || null; },
      shut: function (k) { return k === 'd7' ? '7 Down has no clue, and four other words run across it. Leave it until they are in.' : 'That clue is not on the sheet. All it says is where it is waiting: you cannot do it from this chair.'; },
      msg: nextFile ? 'Five answers in ink. The rest are waiting somewhere else in the building.' : 'Click a clue, or a square, and type. The answers that can be found from this chair are 5, 14 and 15 Across, and 4 and 13 Down.'
    });
  }
  SEV.onGrid = openGrid;
  $('#sheet').addEventListener('click', openGrid);
  function right(k, w, sh) {
    after();
    var t = k === 'a5' ? '<b>VOW.</b> A star. You have written that word before, and not long ago: in the lift, last Wednesday, somewhere between the second floor and the third.'
      : k === 'd13' ? '<b>GAZE.</b> Another star, and another word you have met. Friday&rsquo;s puzzle. You remember the Z.'
      : k === 'a15' ? '<b>PEN.</b> A pen name. It goes in, in ink.'
      : k === 'd4' ? '<b>FACTS.</b> It goes in, in ink.' : '<b>AWKWARD.</b> It goes in, in ink.';
    sh.msg(t);
    if (SEV.count(MINE) === MINE.length) { finish(); return; }
    if (!rang && SEV.count(MINE) >= 2) setTimeout(ringNow, 1500);
  }
  function finish() {
    var file = ER.exitOk([MINE.map(SEV.word).join('-')]), st;
    if (!file) return;
    nextFile = file; ER.flag('d-file', file); st = ER.state(); st.done = st.done || {}; st.done.desk = 1; ER.flag('d-out', 1);
    busy = true; SEV.solved();
    setTimeout(function () {
      ER.closeAll();
      ER.narrate([
        'Five answers in ink. Every other clue on the sheet sends you somewhere else: to the library, to the composing room, to the press hall.',
        'And one clue sends you nowhere at all. 7 Down: <em>no clue. It has never needed one.</em>',
        'So this is not a crossword for the readers of the Clarion. It is a crossword for one person, who has to walk about the building at night in order to finish it. And it was left on your desk.',
        'The library is two floors down. You will have to walk: the lift is still out of order.'
      ], function () { busy = false; after(); if (!rang) ringNow(); });
    }, 1700);
  }

  /* ---------- Mr Quill, from the seventh floor ---------- */
  function ringNow() {
    if (rang || busy) { if (!rang) setTimeout(ringNow, 1200); return; }
    busy = true; rang = true; ER.flag('d-rang', 1);
    ER.closeAll(); SEV.sfx.phone(); $('#phone').classList.add('ring');
    ER.narrate([
      'The house telephone rings. A small lamp has come on beside the number 7. The seventh floor: upstairs.'
    ], function () { $('#phone').classList.remove('ring'); busy = false; quill(); });
  }
  function quill() {
    var c = window.CAST.quill;
    ER.talk({ who: c.who, role: c.role, face: window.FACE('quill'), last: 'Put the telephone down',
      lines: [
        '&ldquo;Junior? Quill. I am on the seventh floor with the Editor&rsquo;s papers, and I have no time. Has the envelope come?&rdquo;',
        { note: 'The blue capitals say: tell nobody upstairs.', q: 'No, Mr Quill. No envelope.', a: 'It is true. A sheet of paper is not an envelope.' },
        '&ldquo;Then listen. At ten tomorrow morning the Lord Mayor shakes Sphinx by the hand, in front of four photographers. It is all arranged. A late envelope changes nothing. I shall see to number ten thousand myself.&rdquo;',
        { q: 'Yourself, sir?', a: '&ldquo;Who better? Go home, Junior. There is nothing more for you to do tonight. And use the stairs. That wretched lift has been out of order since six.&rdquo;' },
        { note: 'He rings off. You look at the telephone. Then you look at the grid.' }
      ],
      clue: { id: 'quill1', title: 'Mr Quill: go home', kind: 'House telephone' },
      done: function () { SEV.sfx.hangup(); ER.say('You do not go home.'); }
    });
  }
  $('#phone').addEventListener('click', function (e) {
    if (busy) return;
    if (rang) { quill(); return; }
    ER.wordAt(e.clientX, e.clientY, 'receiver');
    ER.say('The house telephone. It has no dial: you lift the receiver and ask the switchboard for a floor. The note says to tell nobody upstairs, so you leave it where it is.');
  });

  /* ---------- things in the room ---------- */
  $('#bill').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BILL, cls: 'bill', clue: { id: 'bill', title: 'Tomorrow&rsquo;s bill', kind: 'Poster' }, done: function () {
      if (tell('bill')) ER.say('Unmasked. But the first thing anybody tells you on the puzzles desk is that nobody at the Clarion knows who Sphinx is. So who is going to do the unmasking?', 9000);
    } });
  });
  $('#book').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: SEV.solbook(), cls: 'solbook', clue: { id: 'solbook', title: 'Your solutions book', kind: 'Puzzles desk' }, done: function () {
      if (tell('book')) ER.say('Your second job, after the tea. Every evening you paste the day&rsquo;s solution into the book. There are six of them so far, and you did every one of those puzzles yourself, in the lift.', 9000);
    } });
  });
  $('#sphinxhole').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'pigeonhole');
    ER.say('The pigeonhole marked SPHINX. By six o&rsquo;clock every evening for thirty-two years there has been an envelope in it. Nobody has ever seen one arrive. Tonight it is empty.', 8000);
  });
  SEV.thing('#holes', 'pigeonhole', 'Pigeonholes: one for everything the sixth floor sends down to be printed. Chess, bridge, the weather, the stars.', isBusy);
  SEV.thing('#window', null, 'The Clarion&rsquo;s red sign, seen from behind: NOIRALC. From up here, half the city reads backwards.', isBusy);
  SEV.thing('#lamp', 'blotter', 'The lamp makes one warm circle on the green blotter. The rest of the sixth floor went home at half past ten.', isBusy);
  SEV.thing('#mug', null, 'Canteen tea, the colour of the corridor. You carried it up three floors, because of the lift.', isBusy);
  SEV.thing('#spike', 'spike', 'The spike. Anything that will not be printed ends up on it. Mr Quill puts readers&rsquo; letters there, with a certain pleasure.', isBusy);
  SEV.thing('#plate', null, 'E. QUILL, PUZZLES EDITOR. It is Mr Quill&rsquo;s desk. Yours is the corner of it nearest the door.', isBusy);
  SEV.thing('#books', 'thesaurus', 'A dictionary, a thesaurus and an atlas. Mr Quill says that Sphinx has never needed any of them, and that he, Mr Quill, has never needed them either.', isBusy);
  SEV.thing('#wclock', null, function () { return 'The clock on the wall says ' + SEV.time() + '. The first edition goes to press at two.'; }, isBusy);
  $('#dial').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.say('The brass arrow over the gate shows where the lift is. It has stopped between 6 and 7, and it has been there all evening.');
  });
  $('#door').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'lift gate');
    ER.say('The lift is ten steps from your desk. A card hangs on the gate, in blue pencil: OUT OF ORDER. It has hung there since six, which is why you carried the tea up three floors.', 8000);
  });
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; SEV.sfx.steps(5);
    setTimeout(function () { ER.leave(nextFile); }, 900);
  });
})();
</script>
</body>
</html>
