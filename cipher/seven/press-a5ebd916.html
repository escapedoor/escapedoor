<style>
  body{--bg:#080c14;--accent:#f4e04d;--font-display:'Stardos Stencil',serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(7,10,17,.96);--tc-ink:#e9eef6;--cap-bg:rgba(7,10,17,.94);--panel:#111723;--face-bg:#0f1a2a;--q-ink:#e6d58a;--fade:#04060a;--hud-bg:rgba(7,10,17,.82)}
  .tc-room{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .sT{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .stn{font-family:'Stardos Stencil',serif;font-weight:700;text-anchor:middle}
  #redlamp{animation:rl 1.6s steps(1,end) infinite}
  @keyframes rl{50%{opacity:.25}}
  #redglow{animation:rg 1.6s steps(1,end) infinite}
  @keyframes rg{0%{opacity:.5}50%{opacity:.12}}
  .web{opacity:.96}
  #quillFig{opacity:0;transition:opacity 1.2s}
  #quillFig.on{opacity:1}
  #steamP path{animation:st 4.2s ease-out infinite;opacity:0}
  #steamP path:nth-child(2){animation-delay:-1.6s}#steamP path:nth-child(3){animation-delay:-2.9s}
  @keyframes st{0%{opacity:0;transform:translateY(10px)}25%{opacity:.4}100%{opacity:0;transform:translateY(-60px)}}

  /* the wall of famous front pages */
  .fw{display:grid;grid-template-columns:400px minmax(0,560px);gap:24px;width:min(1010px,96vw);align-items:start}
  .fw-wall{position:relative;padding:14px 22px 14px 56px;background:#3a2f2a;background-image:linear-gradient(rgba(0,0,0,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.28) 2px,transparent 2px),linear-gradient(#4a3a33,#33282333);
    background-size:100% 26px,64px 26px,auto;box-shadow:0 26px 70px rgba(0,0,0,.65),inset 0 0 0 3px #1f1815}
  .fw-wall h6{margin:0 0 8px;font-family:'Stardos Stencil',serif;font-weight:700;font-size:16px;letter-spacing:.18em;color:#e9dcc0;text-align:center}
  .hk{position:relative;height:108px;margin:0 0 9px;border:2px dashed rgba(244,224,77,.35);border-radius:3px;display:flex;align-items:center;justify-content:center}
  .hk:before{content:attr(data-n);position:absolute;left:-40px;top:50%;margin-top:-17px;width:30px;height:34px;border-radius:50% 50% 50% 50%;background:linear-gradient(135deg,#f5df98,#c79b3b 55%,#7d5f1d);color:#3a2a08;font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;line-height:34px;text-align:center;box-shadow:0 3px 6px rgba(0,0,0,.5)}
  .hk:last-child{margin-bottom:0}
  .hk.full{border-color:transparent}
  .fr{width:316px;height:100px;box-sizing:border-box;padding:7px 12px 6px;background:#f3eedf linear-gradient(170deg,rgba(255,255,255,.5),rgba(120,100,60,.2));color:#141518;border:6px solid #17120e;box-shadow:0 5px 12px rgba(0,0,0,.55);text-align:center;-webkit-user-select:none;user-select:none}
  .fr small{display:flex;justify-content:space-between;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5d594d;border-bottom:1px solid #141518;padding-bottom:2px;margin-bottom:4px}
  .fr b{display:block;font-family:'Playfair Display',serif;font-weight:900;font-size:22px;line-height:1.05;letter-spacing:.02em}
  .fr i{display:block;margin-top:3px;font-family:'EB Garamond',serif;font-style:italic;font-size:14px;line-height:1.1;color:#3b382f}
  .fw-pile{display:flex;flex-wrap:wrap;gap:12px 14px;align-content:flex-start;min-height:336px;padding:14px;background:rgba(0,0,0,.35);border:1px dashed rgba(255,255,255,.25)}
  .fw-pile .fr:nth-child(odd){transform:rotate(-2deg)}.fw-pile .fr:nth-child(even){transform:rotate(1.6deg)}
  .fw.done .fr{border-color:#3a2a08;box-shadow:0 5px 12px rgba(0,0,0,.55),0 0 0 2px #c79b3b}
  .fw-side .sv-msg{margin-top:12px;min-height:112px}
  .fw-side .btn{display:none;margin-top:6px}
  .fw-side .btn.on{display:inline-block}
  @media (max-width:1330px){.fw{grid-template-columns:380px minmax(0,520px);gap:18px}.fr{width:298px}.fr b{font-size:20px}}
  @media (max-width:900px){.fw{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null, told = {}, met = false, hung = false, fwBox = null, inWall = false;
  var BEFORE = ['a15', 'a5', 'd4', 'a14', 'd13', 'd2', 'd6', 'd12', 'a16', 'd3', 'a1', 'a8', 'a9', 'a10'], MINE = ['d11', 'd7'];
  /* five front pages, as they lie on the floor. When: year, month, day. */
  var FRAMES = [
    { id: 'a', when: 19270523, date: 'Monday 23 May 1927', head: 'LINDBERGH LANDS', sub: 'To Paris, alone across the Atlantic, in thirty-three hours' },
    { id: 'b', when: 19450508, date: 'Tuesday 8 May 1945', head: 'THE WAR IS OVER', sub: 'The Prime Minister will speak at three o&rsquo;clock' },
    { id: 'c', when: 19181112, date: 'Tuesday 12 November 1918', head: 'PEACE', sub: 'The guns stopped at eleven o&rsquo;clock yesterday morning' },
    { id: 'd', when: 19530602, date: 'Tuesday 2 June 1953', head: 'EVEREST IS CLIMBED', sub: 'The news reached London on the eve of the Coronation' },
    { id: 'e', when: 19361211, date: 'Friday 11 December 1936', head: 'ABDICATION', sub: 'The King gives up his throne' }
  ];

  /* rails and treads of the gallery, the hooks, the units of the press, the dial */
  (function () {
    var s = '', x, i, a, u, t = '';
    for (x = 320; x < 2600; x += 46) s += '<path d="M' + x + ' 118V186"/>';
    $('#rails').innerHTML = s; s = '';
    for (i = 1; i < 8; i++) s += '<path d="M' + (300 - i * 21.2 - 16) + ' ' + (200 + i * 27.5) + 'h44"/>';
    $('#treads').innerHTML = s; s = '';
    for (i = 0; i < 5; i++) s += '<circle cx="623" cy="' + (276 + i * 72) + '" r="7" fill="url(#brassG)"/><path d="M623 ' + (276 + i * 72) + 'v16" stroke="#c79b3b" stroke-width="3"/><rect x="578" y="' + (294 + i * 72) + '" width="90" height="44" fill="none" stroke="#2c3644" stroke-width="2" stroke-dasharray="6 5"/>';
    $('#hooks').innerHTML = s; s = '';
    for (u = 0; u < 3; u++) {
      x = 910 + u * 260;
      s += '<circle cx="' + x + '" cy="420" r="76" fill="url(#cylG)"/><circle cx="' + x + '" cy="420" r="76" fill="none" stroke="#0b1512" stroke-width="5"/><circle cx="' + x + '" cy="420" r="12" fill="#22282e"/>' +
        '<circle cx="' + x + '" cy="580" r="76" fill="url(#cylG)"/><circle cx="' + x + '" cy="580" r="76" fill="none" stroke="#0b1512" stroke-width="5"/><circle cx="' + x + '" cy="580" r="12" fill="#22282e"/>' +
        '<circle cx="' + (x - 84) + '" cy="326" r="20" fill="#8f9aa3"/><circle cx="' + (x + 84) + '" cy="326" r="20" fill="#8f9aa3"/><circle cx="' + (x - 88) + '" cy="672" r="18" fill="#8f9aa3"/><circle cx="' + (x + 88) + '" cy="672" r="18" fill="#8f9aa3"/>' +
        '<path class="web" d="M' + (x - 88) + ' 706V672L' + (x - 76) + ' 580Q' + x + ' 500 ' + (x + 76) + ' 420L' + (x + 84) + ' 326V292" fill="none" stroke="#fbfaf4" stroke-width="9" stroke-linejoin="round"/>';
    }
    $('#units').innerHTML = s; s = '';
    ['B', 'G', '1', '2', '3', '4', '5', '6', '7'].forEach(function (tx, n) {
      a = Math.PI * (1 - (n + 0.5) / 9);
      s += '<text x="' + (139 + 36 * Math.cos(a)).toFixed(1) + '" y="' + (396 - 34 * Math.sin(a) + 3).toFixed(1) + '">' + tx + '</text>';
    });
    $('#dialNums').innerHTML = s;
  })();

  ER.init({
    theme: 'cipher', story: 'seven', storyTitle: 'Seven Down', id: 'press', no: 'IV', title: 'The Press Hall',
    go: 'Go down',
    intro: [
      'Four lines of loose type lay in a heap on Mr Fenwick&rsquo;s stone, and each was an answer with its letters in the wrong order. FLY AS IF made FALSIFY, RE CLUES made RECLUSE, POOR MIST made IMPOSTOR and HOLE POOL made LOOPHOLE. You read them in a mirror, because metal type is back to front.',
      'The mirror showed you something else. In the middle of tomorrow&rsquo;s front page, the Clarion says that Sphinx is its own Puzzles Editor, Mr Edgar Quill. And Mr Quill has sent down a crossword of his own, with CAT in it twice.',
      'The press hall is under the street. Fourteen answers are in ink. One clue is left, and one long answer down the middle of the grid that has no clue at all.'
    ],

8e1"],"a8@":["825c41a2","293eff6c","df028a9b","9a314a48","f48b8f55","984ab429","b18cc07c"],"a8?":["6e21167e","225bcbcc","7dcd617e","e36dc5d8","c57ff812","28549b53","8d03d0f1"],"a8#":["b6ce9b2b"],"a9":["d856e08a"],"a9@":["8217b563","94d0240e","3c1d717c","37ab80d2","5c44c329","14cdf674","2e255bcd","871fa950"],"a9?":["caf60966","a0421b5c","d35bee03","93d08c7f","94bb8a87","f01533c3","dc6b96ff","788c5fb2"],"a9#":["83351988"],"a10":["99438993"],"a10@":["fb7b86e2","b26d2dd9","852aae5c","e4b0293c","c4f6f4ad","f4560da4","8cdf4d79","ee383345"],"a10?":["2dbdc7af","ee1ab036","78a3a1b8","c528cc63","0767edd0","8411d7a6","51678e54","7850a9c2"],"a10#":["9617bde6"],"d11":["bfa960e4"],"d11@":["03475e08","9cc61c77","b66f30e3","05e21e10","4dd66386"],"d11?":["fb065096","0cccc5b0","88820a63","f62ede4c","e7e77720"],"d11#":["8510a0ff"],"d7":["e11b436a"],"d7@":["d85b80e2","f2af3644","572a28f2","d8f25b41","debd42c0","44ce4490","aea4f57b","91d3926c","cdf44412","1fc8ed26"],"d7?":["c0be9abe","5db58bef","22204892","9f668b9a","e2659648","dca34921","07967494","026cb47b","2bfbb536","b4e4dee0"],"d7#":["da8d110d"]},
    sound: ['press', { root: 45, bpm: 104, mood: 'tense' }],          /* the clock is running now: lower, quicker, and the second motor from the start */
    hints: hints, onBegin: begin
  });
  SEV.clock({ from: 106, to: 134 }); SEV.wall('#hh', '#mh', 623, 110);
  SEV.ensure(BEFORE);
  nextFile = ER.flag('p-file') || null; told = ER.flag('p-told') || {}; met = !!ER.flag('p-met'); hung = !!ER.flag('p-hung');
  if (nextFile) $('#quillFig').classList.add('on');

  var WRONG = {
    d11: { peace: 'PEACE is the head of the first frame. The clue wants what the five heads make together: a letter from each.',
      press: 'A good guess for a press hall. But the clue says to READ THE HEADS FROM THE TOP: the answer is hanging on the wall, a letter at a time.',
      paper: 'A good guess for a press hall. But the clue says to READ THE HEADS FROM THE TOP: the answer is hanging on the wall, a letter at a time.',
      print: 'A good guess for a press hall. But the clue says to READ THE HEADS FROM THE TOP: the answer is hanging on the wall, a letter at a time.',
      pages: 'A good guess for a press hall. But the clue says to READ THE HEADS FROM THE TOP: the answer is hanging on the wall, a letter at a time.' }
  };
  var HINTS = {
    d11: ['11 Down sends you to the five framed front pages. They must be hanging in their right order before anybody can read them from the top.',
      'In a crossword, the HEAD of a word is its first letter. Five frames, five heads, five squares.',
      'Peace, Lindbergh, Abdication: P, L, A. Go on down the wall.'],
    d7: ['7 Down has no clue. But five of its ten letters are in ink already, from the answers that cross it, and the sheet says how it is divided: 3, 2, 5.',
      'Three words. You know every second letter. And you have walked past these three words on every floor of the building tonight.',
      'They are written on a card, in blue pencil, and the card is hanging on a gate. The first word is OUT.']
  };
  function hints() {
    if (nextFile) return ['go', ['The last answer is the card on the lift, and the arrow over the gate points to the top of the building. Use the button at the bottom of the screen, while Mr Strand keeps Mr Quill busy.']];
    if (!met) return ['strand', ['A large man is watching you from the glass box marked FOREMAN. Nothing happens in this hall without him. Speak to him first.']];
    var k = SEV.cur();
    if (k && HINTS[k]) return [k, HINTS[k]];
    if (!hung) return ['hang', [
      'The clue for 11 Down talks about five famous heads. Five framed front pages have been taken down from the wall: click on them.',
      'Mr Strand says that the oldest goes at the top. Read the date on each front page: the day, the month and the year. Drag each frame to a hook, or click the frame and then the brass number of the hook.',
      'The hooks from the top: 1918, 1927, 1936, 1945, 1953.'
    ]];
    if (!SEV.word('d11')) return ['d11open', ['The frames are in their places. Now open the grid, with the button at the top of the screen, and do 11 Down.']];
    return ['d7open', ['One answer is left, and it has no clue. Open the grid and look at 7 Down: five of its letters are there already.']];
  }
  function isBusy() { return busy; }
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('p-told', told); return true; }
  function after() {
    ER.pips((hung ? 1 : 0) + SEV.count(MINE), 3);
    if (nextFile) $('#go').classList.add('on');
  }
  function begin() {
    after();
    if (!tell('in')) { ER.say('The press hall. The machine is still waiting.'); return; }
    busy = true;
    ER.narrate([
      'A machine as long as a street, three storeys high, and perfectly silent. White paper runs through it from one end to the other, waiting.',
      'High up on the wall a red lamp goes on and off. Under it, a clock.',
      'A large man in a glass box is looking at the clock, and then at you, and then at the clock.'
    ], function () { busy = false; });
  }

  /* ---------- Mr Strand ---------- */
  function strand() {
    var c = window.CAST.strand;
    ER.talk({ who: c.who, role: c.role, face: window.FACE('strand'), last: 'Go to the frames',
      lines: [
        '&ldquo;PAGE TWELVE!&rdquo; The man in the glass box shouts it, although the presses are silent. Thirty years beside them have left him with only one kind of voice.',
        { q: 'I am from the puzzles desk.', a: '&ldquo;THEN WHERE IS IT? I have fifteen pages on the machine and a hole where the sixteenth goes. At half past one the plate for page twelve is made, with whatever is in it. At two I press the button.&rdquo;' },
        { q: 'I have to read the five famous heads.', a: '&ldquo;THE FRAMES? They are down. The Lord Mayor is coming at ten, so they have been polished. Five front pages, and old Mr Penhale hung them himself. Hang them back, if you want to read them. The oldest goes at the top. It always has.&rdquo;' },
        { q: 'Has the lift been out of order all night?', a: '&ldquo;SINCE SIX. Lovage took the Editor down at ten to six, the same as every night, and tonight Mr Quill was with her. Then the lift went up again, empty. Then the cards. Every plate tonight has come down those stairs on a man&rsquo;s back.&rdquo;' },
        '&ldquo;AND MIND THE GALLERY. Mr Quill has telephoned twice to say that he is coming down to see his page made. If he comes, he will come by the stairs.&rdquo;'
      ],
      clue: { id: 'strand', title: 'Mr Strand: the frames are down', kind: 'Foreman' },
      done: function (seen) { if (seen && !met) { met = true; ER.flag('p-met', 1); ER.say('Five hooks on the wall, one above another, and five frames leaning against it on the floor.'); } }
    });
  }
  $('#strand').addEventListener('click', function () { if (!busy) strand(); });

  /* ---------- the wall of front pages ---------- */
  function build() {
    var box = ER.el('div', 'fw'), wall, pile, msgEl, gbtn, hooks, i, f;
    box.innerHTML = '<div class="fw-wall"><h6>THE OLDEST AT THE TOP</h6>' + [1, 2, 3, 4, 5].map(function (n) { return '<div class="hk" data-n="' + n + '"></div>'; }).join('') + '</div>' +
      '<div class="fw-side"><div class="fw-pile"></div><p class="sv-msg"></p><button type="button" class="btn" id="b-grid">Open the grid</button></div>';
    wall = box.querySelector('.fw-wall'); pile = box.querySelector('.fw-pile'); msgEl = box.querySelector('.sv-msg'); gbtn = box.querySelector('#b-grid'); hooks = ER.$$('.hk', box);
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function frame(f) {
      var n = ER.el('div', 'fr dnd-item', '<small><span>The Clarion</span><span>' + f.date + '</span></small><b>' + f.head + '</b><i>' + f.sub + '</i>');
      n.setAttribute('data-id', f.id); n.setAttribute('data-when', f.when);
      return n;
    }
    function order() { return hooks.map(function (h) { var x = h.querySelector('.fr'); return x ? +x.getAttribute('data-when') : 0; }); }
    function mark() { hooks.forEach(function (h) { h.classList.toggle('full', !!h.querySelector('.fr')); }); box.setAttribute('data-order', hooks.map(function (h) { var x = h.querySelector('.fr'); return x ? x.getAttribute('data-id') : '-'; }).join('')); }
    if (hung) FRAMES.slice().sort(function (a, b) { return a.when - b.when; }).forEach(function (f, n) { hooks[n].appendChild(frame(f)); });
    else FRAMES.forEach(function (f) { pile.appendChild(frame(f)); });
    mark();
    function done(first) {
      box.classList.add('done'); gbtn.classList.toggle('on', !SEV.word('d7'));
      msg(first ? 'Five front pages, with the oldest at the top. &ldquo;THAT IS HOW HE HUNG THEM,&rdquo; says Mr Strand. &ldquo;Nobody ever asked him why he chose those five.&rdquo; The clue for 11 Down said: read the five famous heads from the top.'
        : SEV.word('d11') ? 'Five front pages, five heads: PLATE.' : 'Five front pages, with the oldest at the top. The clue for 11 Down said: read the five famous heads from the top.');
    }
    ER.dnd(box, { item: '.fr', slot: '.hk', home: pile, lock: function () { return hung || busy; }, change: function () {
      var o = order(), sorted, wrong, n;
      mark(); SEV.sfx.hook();
      if (o.indexOf(0) >= 0) { msg('Drag each frame to a hook, or click the frame and then the brass number of the hook. The oldest goes at the top.'); return; }
      sorted = o.slice().sort(function (a, b) { return a - b; });
      wrong = o.filter(function (v, j) { return v !== sorted[j]; }).length;
      if (!wrong) { hung = true; ER.flag('p-hung', 1); ER.sfx.ok(); after(); done(true); return; }
      SEV.slip(1); ER.sfx.no(); n = (+box.getAttribute('data-miss') || 0) + 1; box.setAttribute('data-miss', n);
      if (o.join() === sorted.slice().reverse().join()) msg('You have hung them with the newest at the top. Mr Strand makes a noise like a press starting up. &ldquo;UPSIDE DOWN! Old Mr Penhale would come back and haunt you.&rdquo;');
      else msg('&ldquo;NO.&rdquo; Mr Strand does not even turn his head. &ldquo;' + ['', '', 'Two', 'Three', 'Four', 'All five'][wrong] + ' of them are on the wrong hooks. The oldest at the top. Read the dates: the year first, then the month.&rdquo;');
    } });
    gbtn.addEventListener('click', function () { ER.close(); openGrid(); });
    box.done = done;
    if (hung) done(false); else msg('Five front pages in black frames, each from a day that nobody forgot. Drag each frame to a hook, or click the frame and then the brass number of the hook. Mr Strand says that the oldest goes at the top.');
    return box;
  }
  function openWall() {
    if (busy) return;
    if (!met) { ER.say('Five black frames lean against the wall, face out. In the glass box, a large man shakes his head at you. Speak to him first.'); return; }
    if (!fwBox) fwBox = build(); else if (hung) fwBox.done(false);
    inWall = true;
    ER.open('ov-lock', fwBox, function () { inWall = false; });
  }
  $('#frames').addEventListener('click', openWall);

  /* ---------- the grid: the last clue, and the answer that has none ---------- */
  function types() { return !hung ? [] : !SEV.word('d11') ? ['d11'] : ['d7']; }
  function openGrid() {
    if (busy) return;
    SEV.openSheet({
      type: types(), onRight: right, sel: types()[0],
      onWrong: function (k, w) { return k === 'd7' ? 'The squares will not take it. Three words: three letters, then two, then five. You have read them tonight, more than once, in blue pencil.' : (WRONG.d11[w] || null); },
      shut: function (k) { return k === 'd11' ? 'The clue says FROM THE TOP. At the moment the five frames are on the floor, and there is no top. Hang them first.' : k === 'd7' ? 'One clue first: 11 Down. Then the one that has none.' : 'That one is in ink already.'; },
      msg: nextFile ? 'Sixteen answers. The grid is finished.' : !hung ? '11 Down is the last clue: the five famous heads, from the top. They are not hanging yet.' : !SEV.word('d11') ? '11 Down: read the five famous heads from the top.' : '7 Down. No clue. Five of its letters are in ink: the rest are yours.'
    });
  }
  SEV.onGrid = openGrid;
  function right(k, w, sh) {
    after();
    if (k === 'd11') { sh.type(types()); sh.select('d7'); sh.msg('<b>PLATE.</b> Peace, Lindbergh, Abdication, The war, Everest. Every page becomes a plate before it is printed. That was the last of the clues. Now there is only 7 Down, which never had one.'); return; }
    var file = ER.exitOk([w]), st;
    if (!file) return;
    nextFile = file; ER.flag('p-file', file); st = ER.state(); st.done = st.done || {}; st.done.press = 1; ER.flag('p-out', 1);
    busy = true; SEV.solved(); sh.msg('<b>OUT OF ORDER.</b>');
    setTimeout(function () {
      ER.closeAll();
      ER.narrate([
        'OUT OF ORDER. You look up from the grid. Across the press hall, on the gate of the lift, a white card is hanging from a piece of string.',
        'It has been hanging on every floor of this building since six o&rsquo;clock. You have read it four times tonight. And each time you have turned away, and taken the stairs.',
        '<em>Finish it and you can find me.</em>',
        'The brass arrow over the gate has not moved all night. It is pointing between 6 and 7. He is at the top of the building. You are at the bottom of it. And the lift, of course, is out of order.'
      ], function () {
        $('#quillFig').classList.add('on'); SEV.sfx.steps(4, 0.8);
        ER.narrate([
          'Up on the iron gallery, a door bangs. A man with a watch in his hand is leaning on the rail, breathing like somebody who has just come down eight flights of stairs.',
          '&ldquo;STRAND! Is my page made?&rdquo;',
          '&ldquo;MR QUILL, SIR!&rdquo; shouts Mr Strand, more loudly than ever. &ldquo;YOU WILL WANT TO SEE THE FOLDER. THIS WAY. MIND YOUR CUFFS.&rdquo; He takes Mr Quill by the elbow and walks him round behind the largest machine in the building.',
          'Over his shoulder, Mr Strand looks at you. Then he looks at the back stairs.'
        ], function () { busy = false; after(); });
      });
    }, 1900);
  }

  /* ---------- things in the hall ---------- */
  SEV.thing('#press', 'press', 'The press. It can print, fold and count sixty thousand copies of the Clarion in an hour. At the moment it is doing none of those things, and the whole building is listening to it.', isBusy);
  SEV.thing('#reels', 'newsprint', 'Reels of newsprint. There are five miles of paper on each one, and the Clarion gets through forty of them in a night.', isBusy);
  SEV.thing('#gallery', null, function () { return nextFile ? 'The iron gallery. Mr Quill has gone to look at the folder.' : 'An iron gallery, and the stairs down from the street. Nobody is on it. Yet.'; }, isBusy);
  SEV.thing('#pclock', null, function () { return 'The clock of the press hall says ' + SEV.time() + '. The plate for page 12 is made at half past one, and Mr Strand presses the button at two.'; }, isBusy);
  SEV.thing('#bell', null, 'The red lamp means that the press is ready. The brass bell beside it rings one minute before the machine starts, so that everybody can take their fingers out.', isBusy);
  $('#dial').addEventListener('click', function (e) { e.stopPropagation(); if (busy) return; ER.say('The brass arrow over the lift gate. From the basement it looks a long way up: between 6 and 7.'); });
  $('#door').addEventListener('click', function () {
    if (busy) return;
    ER.say(SEV.word('d7') ? 'OUT OF ORDER. The same blue capitals as the line at the top of your grid.' : 'The lift, at the bottom of its shaft, with the same card on its gate. You have stopped looking at it.');
  });
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; SEV.sfx.steps(6);
    setTimeout(function () { ER.leave(nextFile); }, 900);
  });
})();
