,"88d66890","f84b7f41","bd4535fe","63052ab7","01d34c1a"],"a1#":["d9bd16a6"],"a8":["50d3ae75"],"a8@":["868ff56f","96b0b07e","f26cec0f","ff34ec48","0abbaa52","d1a0c9de","6a2e5720"],"a8?":["70810ba0","5465e78d","b4c1c856","f7fb6c51","a5a7552c","8496b3b7","19500f16"],"a8#":["07cb47cc"],"a9":["75a77872"],"a9@":["214aedb4","6b10f1f6","809e2591","acf253f5","4b6cef92","7608a2fd","c93fb026","90b87253"],"a9?":["9f52972b","877703cc","a254ce98","7d159da9","0a5155d0","31ecc8f5","67bef1e6","337872ed"],"a9#":["d36f0ff3"],"a10":["25f4e62e"],"a10@":["24d8f461","fa6c64d3","77882263","0fb8e9c5","dcdb17e2","8fcf20be","2f30cadc","0f73b79b"],"a10?":["7879dd5d","8583f7ad","780c91f9","5e8d5d15","8f60f874","67952280","e79a69d8","12c2e5b3"],"a10#":["d2984d36"],"d11":["aded16ad"],"d11@":["cafea005","18589b7a","0be8d2e2","20e520f6","5cf06574"],"d11?":["3aa64538","f9669d5a","f31f57ab","e67cf6b0","4f4707c3"],"d11#":["899b6c4b"],"d7":["2ef97cf5"],"d7@":["116f082c","0948b375","b1516bc8","11091ff5","ae08e742","537a96de","7f57f499","0a62fd99","fac081ad","1252169a"],"d7?":["17f2de0e","b45f69f9","5dcb3595","5bb341b1","e537ca94","5d0f56d8","bc62110e","7017dec6","1c9743e0","07a0657d"],"d7#":["7e78efab"],"week":["e56c2e00"],"bydate":["d48ea115"],"b1":["ac444404"],"b2":["e09f50cf"],"b3":["a59312f2"],"b4":["34f53fa9"],"b5":["b9094993"],"b6":["a6612435"]},
    sound: ['press', { root: 47, bpm: 80, mood: 'tense', drop: ['ost', 'mel'], level: 0.85 }],     /* you whisper here, and listen for feet on the stairs: nothing with a beat, nothing bright, and quieter */
    hints: hints, onBegin: begin
  });
  SEV.clock({ from: 140, to: 158 }); SEV.wall('#hh', '#mh', 1484, 270);
  SEV.ensure(ALL);
  nextFile = ER.flag('g-file') || null; told = ER.flag('g-told') || {}; heard = !!ER.flag('g-heard'); ordered = !!ER.flag('g-ordered');
  if (nextFile) $('#car').classList.add('up');

  function hints() {
    if (nextFile) return ['go', ['The gate is open, and Mr Lovage is waiting. Use the button at the bottom of the screen.']];
    if (!heard) return ['gate', ['The card on the gate was the answer to 7 Down. Go and stand in front of it: click on the gate of the lift.']];
    if (!inGate) return ['open', ['The voice wants six words hung on the gate. Click on the gate again.']];
    if (!ordered) return ['week', [
      'Six of the answers in the grid had stars. The voice says that you have met them before. Look for each of the six in your solutions book, which is open beside the gate.',
      'All six stand in the same place in their puzzles. Read the number in front of each one, and the day at the top of its slip. Then hang the six words on the gate in the order of the week. Drag a strip to a bar, or click the strip and then the dark number on the bar.',
      'Each of them was the 7 Down of its day. A week at the Clarion begins on a Monday, and Monday&rsquo;s puzzle is the last slip in your book. So the word from that slip goes on the top bar.'
    ]];
    return ['name', ['The first letters of the six words, read down the gate, make a name. You have met it twice tonight, in the library. Type it, and press Enter.']];
  }
  function isBusy() { return busy; }
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('g-told', told); return true; }
  function after() {
    ER.pips((heard ? 1 : 0) + (ordered ? 1 : 0) + (nextFile ? 1 : 0), 3);
    if (nextFile) $('#go').classList.add('on');
  }
  function begin() {
    after();
    if (!tell('in')) { ER.say('The seventh floor. The card is still on the gate.'); return; }
    busy = true;
    ER.narrate([
      'Dark wood, a red carpet, and a clock that has watched every edition of the Clarion go to press.',
      'There is a light behind the glass of the Editor&rsquo;s door, and the shadow of somebody reading at a desk.',
      'And there is the lift, with its card, and the brass arrow over the gate: between 6 and 7. From the press hall that meant the top of the building. From here it means just under your feet.'
    ], function () { busy = false; });
  }

  /* ---------- the voice ---------- */
  function voice() {
    var c = window.CAST.voice;
    SEV.sfx.whisper();
    ER.talk({ who: c.who, role: c.role, face: window.FACE('voice'), last: 'Kneel down by the gate',
      lines: [
        'You put your face to the brass gate. A little way below your shoes, in the dark of the shaft, there is a square of yellow light: the roof of the lift. Inside it, somebody clears his throat.',
        '&ldquo;Quietly, if you please. Is that the puzzles desk?&rdquo;',
        { q: 'Yes. I have finished it.', a: '&ldquo;I know. I heard you counting the stairs. Twenty past one: you are quicker than I expected, and I expected you to be quick.&rdquo;' },
        { q: 'You said that I could find you.', a: '&ldquo;You have found where I am. That was seven down. You have not found who I am, and Mrs Penhale will ask you that before anything else. She is behind that glass door, reading a crossword with a banana in it.&rdquo;' },
        { q: 'Then who are you?', a: '&ldquo;I have told you. Six of tonight&rsquo;s answers had stars, because you had met them before: you pasted every one of them into your own book. Find where each of the six stood, and on which day. Then hang them on this gate in the order of the week.&rdquo;' },
        '&ldquo;And read my card again. It tells the truth about my six words. It has never told the truth about my lift.&rdquo;'
      ],
      clue: { id: 'voice', title: 'The voice in the lift shaft', kind: 'Through the gate' },
      done: function (seen) { if (seen && !heard) { heard = true; ER.flag('g-heard', 1); after(); setTimeout(openGate, 500); } }
    });
  }

  /* ---------- six strips on a gate ---------- */
  function build() {
    var box = ER.el('div', 'gt'), bars, pile, msgEl, sayBox, line = null;
    box.innerHTML = '<div class="gt-gate"><div class="gt-card">OUT OF ORDER</div>' + [1, 2, 3, 4, 5, 6].map(function (n) { return '<div class="bar" data-n="' + n + '"></div>'; }).join('') + '</div>' +
      '<div class="gt-side"><div class="gt-pile"></div><div class="gt-say"><span>Say it through the gate, quietly:</span><div class="gt-line"></div></div><div class="gt-book">' + SEV.sols() + '</div><p class="sv-msg"></p></div>';
    bars = ER.$$('.bar', box); pile = box.querySelector('.gt-pile'); msgEl = box.querySelector('.sv-msg'); sayBox = box.querySelector('.gt-say');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function strip(w) { var n = ER.el('div', 'sp dnd-item', '<b>' + w.charAt(0) + '</b>' + w.slice(1)); n.setAttribute('data-w', w); return n; }
    function order() { return bars.map(function (b) { var x = b.querySelector('.sp'); return x ? x.getAttribute('data-w') : ''; }); }
    function mark() { box.setAttribute('data-order', order().map(function (w) { return w ? w.charAt(0) : '-'; }).join('')); }
    function footsteps() { var t = STAIRS[Math.min(steps, STAIRS.length - 1)]; steps++; SEV.sfx.steps(3, 0.5); return ' ' + t; }
    function say() {
      box.classList.add('done'); sayBox.classList.add('on'); pile.style.display = 'none';
      if (line) return;
      line = WK.line(sayBox.querySelector('.gt-line'), { max: 14, placeholder: 'type a name, then Enter', onEnter: function (text) {
        var t = WK.norm(text), file = ER.exitOk([t]);
        if (file) { win(file); return true; }
        SEV.slip(1);
        if (t === 'sphinx') msg('&ldquo;That is what they call me,&rdquo; says the voice. &ldquo;It is not what my mother called me.&rdquo;' + footsteps());
        else if (/quill/.test(t)) msg('&ldquo;Mr Quill is in the press hall, admiring a folding machine. He will not admire it for much longer.&rdquo;' + footsteps());
        else if (/abbas|fenwick|strand|penhale/.test(t)) msg('&ldquo;That one has a room in this building, and a name on the door. I have never had either. Read the six words down the gate: the first letter of each.&rdquo;' + footsteps());
        else msg('&ldquo;No. Read the six words down the gate. Only the first letter of each.&rdquo;' + footsteps());
        return false;
      } });
    }
    STARS.forEach(function (k) { var w = SEV.word(k); if (w) pile.appendChild(strip(w)); });
    mark();
    if (ordered) { ['b1', 'b2', 'b3', 'b4', 'b5', 'b6'].forEach(function (b, i) { ER.$$('.sp', pile).some(function (s) { if (ER.check(b, s.getAttribute('data-w'))) { bars[i].appendChild(s); return true; } return false; }); }); mark(); }
    ER.dnd(box, { item: '.sp', slot: '.bar', home: pile, lock: function () { return ordered || busy; }, change: function () {
      var o = order(), wrong, sorted;
      mark(); SEV.sfx.hook();
      if (o.indexOf('') >= 0) { msg('Six strips, six bars. Drag a strip to a bar, or click the strip and then the dark number on the bar.'); return; }
      if (ER.check('week', o.join('-'))) {
        ordered = true; ER.flag('g-ordered', 1); ER.sfx.ok(); SEV.sfx.whisper(); after(); say();
        msg('Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. Six words, each of them the 7 Down of its day. You read the first letters down the gate, and they are not six letters any more.<br>&ldquo;Every week for thirty-two years,&rdquo; says the voice. &ldquo;Go on, then. Say it.&rdquo;');
        return;
      }
      SEV.slip(1); ER.sfx.no(); box.setAttribute('data-miss', (+box.getAttribute('data-miss') || 0) + 1);
      sorted = o.slice().sort();
      wrong = o.filter(function (w, i) { return !ER.check('b' + (i + 1), w); }).length;
      if (ER.check('bydate', o.join('-'))) msg('&ldquo;That is the order in which the Clarion printed them,&rdquo; says the voice. &ldquo;Look at my card. Out of order. A week does not begin on a Tuesday. Nor do I.&rdquo;' + footsteps());
      else if (o.join() === sorted.join()) msg('&ldquo;Alphabetical order. Miss Abbas would be proud of you. I am not Miss Abbas.&rdquo;' + footsteps());
      else msg('&ldquo;No. ' + ['', 'One', 'Two', 'Three', 'Four', 'Five', 'All six'][wrong] + ' of them ' + (wrong === 1 ? 'is' : 'are') + ' on the wrong bar' + (wrong === 1 ? '' : 's') + '. Find each word in your book. Look at where it stood, and at the day.&rdquo;' + footsteps());
    } });
    box.say = say;
    if (ordered) { say(); msg('Six words, in the order of the week. Read the first letters down the gate.'); }
    else msg('Six strips of paper: the six answers that had stars. Six brass bars across the gate. And your solutions book, open on the carpet.');
    return box;
  }
  function openGate() {
    if (busy || nextFile) return;
    if (!heard) { voice(); return; }
    if (!gtBox) gtBox = build();
    inGate = true;
    ER.open('ov-lock', gtBox, function () { inGate = false; });
  }
  $('#gate').addEventListener('click', function () { if (nextFile) { ER.say('The gate is open. Mr Lovage is holding it for you.'); return; } openGate(); });
  function win(file) {
    var st;
    nextFile = file; ER.flag('g-file', file); st = ER.state(); st.done = st.done || {}; st.done.landing = 1;
    busy = true; SEV.stopClock(); SEV.solved(); gtBox.querySelector('.sv-msg').innerHTML = '&ldquo;Lovage,&rdquo; you say.';
    setTimeout(function () {
      ER.closeAll(); SEV.sfx.gate(); $('#car').classList.add('up');
      ER.narrate([
        'For a moment nothing happens. Then, somewhere below your feet, a handle turns. The yellow light rises in the dark like a sun coming up, and the lift arrives at the seventh floor without a sound.',
        'The gate folds back. A thin grey man in a grey uniform is sitting on a wooden stool. He has a flask of tea, a blue pencil behind his ear, and a plain envelope on his knee.',
        '&ldquo;Thirty-two years,&rdquo; says Mr Lovage. &ldquo;And you are the first person to say that name on this floor who did not want to go down.&rdquo;'
      ], function () { busy = false; after(); });
    }, 1500);
  }
  SEV.onGrid = function () { if (!busy) SEV.openSheet({ type: [], msg: 'Sixteen answers. The grid is finished. Six of them have stars.' }); };

  /* ---------- things on the landing ---------- */
  $('#dial').addEventListener('click', function (e) { e.stopPropagation(); if (busy) return; ER.say('The brass arrow, seen at last from the floor that it is pointing at. Between 6 and 7: a little way down, and just out of reach.', 8000); });
  SEV.thing('#edoor', null, 'THE EDITOR. A light behind the glass, and the shadow of somebody reading at a desk. Mrs Penhale is back from the Lord Mayor&rsquo;s dinner. The blue capitals said: tell nobody upstairs. Not yet.', isBusy);
  SEV.thing('#board', null, 'CLARION HOUSE: who is on which floor. At the bottom, in small letters: LIFT ATTENDED 8 A.M. TO 6 P.M. After six, nobody expects anybody to be in it.', isBusy);
  SEV.thing('#portrait', null, 'H. PENHALE, 1861: the first Editor of the Clarion. He climbed these stairs every day for forty years, and he looks it.', isBusy);
  SEV.thing('#lclock', null, function () { return 'The clock on the landing says ' + SEV.time() + '. It has never been wrong, and tonight nobody is glad.'; }, isBusy);
  SEV.thing('#stairs', null, 'The stairs. Eight flights down to the press hall, and nobody on them. Yet.', isBusy);
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; SEV.sfx.gate();
    setTimeout(function () { ER.leave(nextFile); }, 900);
  });
})();
