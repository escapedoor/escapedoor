  SEV.ensure(BEFORE);
  nextFile = ER.flag('l-file') || null; told = ER.flag('l-told') || {}; met = !!ER.flag('l-met'); rings = ER.flag('l-ring') || {};

  var PAGES = [
    { y: '1936', h5: 'The Clarion &middot; Saturday 3 October 1936', h4: 'A LIFT FOR CLARION HOUSE', p: [
      'Clarion House has a lift at last. For seventy-five years the Editor of this newspaper has climbed seven floors to his desk, and his readers&rsquo; letters have climbed after him.',
      'The new machine was switched on yesterday. It holds two men and a boy, or one Editor and his hat, and it rises from the press hall to the seventh floor in under a minute.',
      'It will be worked by Mr A. Lovage, who is twenty-seven. Mr Lovage says that he does not mind going up and down all day. &ldquo;It is steadier work than the sea,&rdquo; he told us, &ldquo;and people in a lift are always pleased to arrive.&rdquo;'] },
    { y: '1936', h5: 'The Clarion &middot; Monday 5 October 1936', h4: 'A NEW CROSSWORD, AND A BARGAIN', p: [
      'Today the Clarion prints its first crossword by a setter who signs himself SPHINX. We cannot tell our readers who Sphinx is, because we do not know.',
      'The first puzzle came to the Editor by hand, in a plain envelope, with a letter. The full text ran to one line: &ldquo;One a day, by six o&rsquo;clock, for as long as nobody asks my name.&rdquo;',
      'The Editor has given his word that nobody at the Clarion ever will. He says that it is the cheapest bargain this newspaper has made.'] },
    { y: '1959', h5: 'The Clarion &middot; Friday 13 February 1959 &middot; Letters', h4: 'WHO IS SPHINX?', p: [
      'Sir, Sooner or later everybody in this town hears a yarn about Sphinx. My barber says he is a bishop. My sister says she is two sisters, in a lighthouse. The man who sells me the Clarion says that Sphinx is a machine in your cellar.',
      'Not one of them has any evidence at all. I have none either, so I shall keep my own guess to myself. Yours, A CONSTANT READER.',
      'The Editor writes: We do not know either. That was the bargain.'] },
    { y: '1961', h5: 'The Clarion &middot; Tuesday 3 October 1961', h4: 'TWENTY-FIVE YEARS IN THE LIFT', p: [
      'Mr A. Lovage has now taken the lift at Clarion House up and down for twenty-five years. By our arithmetic that is four hundred thousand journeys, and he has not yet arrived anywhere.',
      'The Editor gave him a clock. Asked what he had learned in a quarter of a century, Mr Lovage said that people in a lift talk as if the man at the handle were part of the machine.',
      '&ldquo;I heard the result of one election in that lift an hour before the country did,&rdquo; he said. &ldquo;As usual I bit my tongue.&rdquo;'] },
    { y: '1968', h5: 'The Clarion &middot; Saturday 16 November 1968', h4: 'ON TUESDAY, A NAME', p: [
      'On Tuesday the Clarion prints its ten-thousandth crossword by Sphinx. On the same morning, in the board room, the Lord Mayor will hand Sphinx a cheque for one thousand pounds, and this newspaper will tell its readers at last who he is.',
      'The secret has been kept for thirty-two years: for the last twenty of them, it now appears, under our own roof. Our Puzzles Editor, Mr E. Quill, will say only that readers are going to be surprised.'],
      red: 'How? Nobody was to ask his name. See 5 Oct 1936.  N.A.' }
  ];
  var SLIP = { d6: ['6 Down', '1936', 'A sign of what is going to happen.', 4, 1], d12: ['12 Down', '1936, the other one', 'More than is usual; or a late edition, printed when the news will not wait.', 5, 1],
    a16: ['16 Across', '1959', 'Things you have only been told, and cannot prove.', 7, 0], d2: ['2 Down', '1961', 'Proof that you were somewhere else at the time.', 5, 1] };
  var WHERE = { d6: 'The sign of what is going to happen is in the cutting about the new lift. Read how many people the machine holds, and listen across the gap between two of those words.',
    d12: 'The late edition is in the cutting about the first crossword. Read the sentence that says how long Sphinx&rsquo;s letter was: the word begins in TEXT.',
    a16: 'The things you have only been told are in the first sentence of the letter of 1959. What does everybody in this town do, sooner or later? The word begins at the beginning of that verb.',
    d2: 'The proof that you were somewhere else is in the very last thing Mr Lovage says in 1961: five letters, beginning inside the word USUAL.' };
  var WRONG3 = { storybooks: 'Story books are for children. These are for scraps of newspaper: the last five letters are right, and the first five are not.',
    guidebooks: 'Guide books are for tourists. These are for scraps of newspaper: the last five letters are right, and the first five are not.' };

  function left() { return HID.filter(function (k) { return !SEV.word(k); }); }
  function hints() {
    if (nextFile) return ['go', ['Five more answers are in ink. The next clues are waiting in the composing room, on the second floor. Use the button at the bottom of the screen.']];
    var l = left();
    if (!met) return ['abbas', ['Somebody is watching you from the hatch marked ENQUIRIES. Speak to her before you touch anything.']];
    if (l.length && !inBook) return ['book', ['The House scrapbook is on the reading table, with a slip of paper under its cover. Click on it.']];
    if (l.length) return ['find-' + l[0], [
      'Four words are hiding in the cuttings. The slip gives the meaning of each one, and the year to look in. Turn the pages with the tabs at the top.',
      'A hidden word begins inside one word of a sentence and ends inside another: it runs straight across the gap between them, as HEN hides in &ldquo;the next&rdquo;. Press on its first letter and drag to its last letter. Or click the first letter, and then the last.',
      WHERE[l[0]]
    ]];
    if (SEV.cur() === 'd3' || !SEV.word('d3')) return ['d3', [
      'One clue on the slip is not hiding in a cutting at all. 3 Down is a plain meaning, and you have had the thing itself in your hands. Open the grid and write it in.',
      'It is two words joined into one. The first means small pieces of paper that have been cut out and kept. The second is what they are pasted into. Forty of them: the answer is a plural.',
      'S, C, R, A, P: and then the books.'
    ]];
    return null;
  }
  function isBusy() { return busy; }
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('l-told', told); return true; }
  function after() {
    ER.pips(SEV.count(MINE), MINE.length);
    if (nextFile) $('#go').classList.add('on');
  }
  function begin() {
    after();
    if (!tell('in')) { ER.say('The cuttings library. Miss Abbas has not moved.'); return; }
    busy = true;
    ER.narrate([
      'Drawers from the floor to the ceiling, and a smell of old paper and glue. Somewhere a tube light is humming to itself.',
      'There is a hatch in the far wall, marked ENQUIRIES. A woman is looking at you through it, over the top of her glasses.'
    ], function () { busy = false; });
  }

  /* ---------- Miss Abbas ---------- */
  function abbas() {
    var c = window.CAST.abbas;
    ER.talk({ who: c.who, role: c.role, face: window.FACE('abbas'), last: 'Go to the table',
      lines: [
        '&ldquo;You are the junior from the sixth floor. You are four minutes late.&rdquo;',
        { q: 'Late for what?', a: '&ldquo;A request slip came under my door at seven o&rsquo;clock, in blue pencil. It asked me to have the House scrapbook ready for a junior at half past eleven. Whoever wrote it knows how long five clues take you. Very nearly.&rdquo;' },
        { q: 'Who wrote it?', a: '&ldquo;It is not signed. I have worked in this library for nineteen years, and I know the handwriting of everybody in the building. I do not know that one. And yet I feel that I see it every day.&rdquo;' },
        { q: 'Has anybody else been in tonight?', a: '&ldquo;Mr Quill, at nine. He wanted everything we have on Sphinx. I gave him the envelope. It is empty. It has been empty for thirty-two years. Nobody knows anything about Sphinx: that is the whole point of Sphinx.&rdquo;' },
        '&ldquo;Then he took away the bound puzzles for 1959. He said that he wished to refresh his memory of his own early style. I wrote that down, because I did not understand it.&rdquo;',
        { q: 'What do you know about Sphinx?', a: '&ldquo;Only what he has printed. I keep a card for every answer he has ever used. He has never used the same word twice inside a month. Not once, in ten thousand puzzles less one.&rdquo;' },
        '&ldquo;The scrapbook is on the table. Pencil only. And you will rub out every wrong ring before you leave.&rdquo;'
      ],
      clue: { id: 'abbas', title: 'Miss Abbas: the request slip', kind: 'Night librarian' },
      done: function (seen) { if (seen && !met) { met = true; ER.flag('l-met', 1); ER.say('A big brown book is waiting on the reading table, with a slip of paper under its cover.'); } }
    });
  }
  $('#abbas').addEventListener('click', function () { if (!busy) abbas(); });

  /* ---------- the House scrapbook ---------- */
  function cutHtml(pg) {
    return '<h5>' + pg.h5 + '</h5><h4>' + pg.h4 + '</h4>' + pg.p.map(function (t) { return '<p>' + t + '</p>'; }).join('') + (pg.red ? '<p class="red">' + pg.red + '</p>' : '');
  }
  function slipHtml() {
    return '<h6>For the junior from the puzzles desk. Four of my words are hiding in this book. Ring them.</h6>' +
      HID.map(function (k) {
        var s = SLIP[k], w = SEV.word(k);
        return '<p' + (w ? ' class="got"' : '') + '><b>' + s[0].replace(' Down', 'D').replace(' Across', 'A') + (s[4] ? ' &#10033;' : '') + '</b>' + ER.gloss(s[2]) + ' <em>(' + s[3] + ') &middot; ' + s[1] + '</em>' + (w ? ' <u>' + w.toUpperCase() + '</u>' : '') + '</p>';
      }).join('') +
      '<p' + (SEV.word('d3') ? ' class="got"' : '') + '><b>3D</b>' + ER.gloss('Books for pasting cuttings into. Miss Abbas has forty of them on the top shelf.') + ' <em>(10) &middot; not hiding: you are holding one</em>' + (SEV.word('d3') ? ' <u>SCRAPBOOKS</u>' : '') + '</p>';
  }
  function build() {
    var box = ER.el('div', 'sb'), cut, tabs, msgEl, lts = [], anchor = -1, drag = null, slip, miniBox, wbtn;
    box.innerHTML = '<div class="sb-left"><div class="sb-book"><div class="sb-tabs">' + PAGES.map(function (pg, i) { return '<button type="button" data-p="' + i + '">' + pg.y + '</button>'; }).join('') + '</div><div class="sb-cut"></div></div>' +
      '<div class="sb-foot"><p class="sv-msg"></p><button type="button" class="btn" id="b-write">Write in 3 Down</button></div></div>' +
      '<div class="sb-side"><div class="sb-slip"></div><div class="sb-mini"></div></div>';
    cut = box.querySelector('.sb-cut'); tabs = ER.$$('.sb-tabs button', box); msgEl = box.querySelector('.sv-msg'); slip = box.querySelector('.sb-slip'); miniBox = box.querySelector('.sb-mini'); wbtn = box.querySelector('#b-write');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function side(hl) {
      slip.innerHTML = slipHtml(); miniBox.innerHTML = ''; miniBox.appendChild(SEV.mini(hl));
      tabs.forEach(function (b, i) { b.classList.toggle('on', i === page); b.classList.toggle('got', Object.keys(rings).some(function (k) { return rings[k][0] === i; })); });
      wbtn.classList.toggle('on', !left().length && !SEV.word('d3'));
    }
    /* every letter of the cutting can be pressed: the letters are numbered, and so are the words they stand in */
    function show(i) {
      var n = 0, wd = -1, inWord = false, walker, t, texts = [];
      page = i; anchor = -1; lts = [];
      cut.innerHTML = ER.gloss(cutHtml(PAGES[i]));
      walker = document.createTreeWalker(cut, 4, null, false);
      while ((t = walker.nextNode())) if (t.parentNode.closest && t.parentNode.closest('p') && !t.parentNode.closest('.red')) texts.push(t);
      texts.forEach(function (tn) {
        var frag = document.createDocumentFragment(), s = tn.nodeValue, j, ch, sp;
        for (j = 0; j < s.length; j++) {
          ch = s.charAt(j);
          if (/[A-Za-z]/.test(ch)) {
            if (!inWord) { wd++; inWord = true; }
            sp = document.createElement('span'); sp.className = 'lt'; sp.textContent = ch; sp.setAttribute('data-i', n); sp.setAttribute('data-w', wd); lts.push(sp); n++;
            frag.appendChild(sp);
          } else { inWord = false; frag.appendChild(document.createTextNode(ch)); }
        }
        tn.parentNode.replaceChild(frag, tn);
      });
      Object.keys(rings).forEach(function (k) { if (rings[k][0] === i) ink(rings[k][1], rings[k][2]); });
      side();
    }
    function ink(a, b) {
      var j, n;
      for (j = a; j <= b; j++) { lts[j].classList.add('ring'); if (j === a) lts[j].classList.add('first'); if (j === b) lts[j].classList.add('last'); }
      for (j = a; j < b; j++) {            /* the gaps between the ringed letters are ringed as well */
        n = lts[j].nextSibling;
        while (n && n !== lts[j + 1] && n.nodeType === 3) { var g = document.createElement('span'); g.className = 'gapr'; g.textContent = n.nodeValue; n.parentNode.replaceChild(g, n); n = g.nextSibling; }
      }
    }
    function mark(a, b, cls, on) { for (var j = Math.min(a, b); j <= Math.max(a, b); j++) lts[j].classList.toggle(cls, on); }
    function clear() { lts.forEach(function (n) { n.classList.remove('sel'); }); }
    function idx(node) { var n = node && node.closest ? node.closest('.lt') : null; return n ? +n.getAttribute('data-i') : -1; }
    function judge(a, b) {
      var lo = Math.min(a, b), hi = Math.max(a, b), s = '', j, k = null, w0, w1, t, near = '';
      clear();
      for (j = lo; j <= hi; j++) { if (lts[j].classList.contains('ring')) return; s += lts[j].textContent.toLowerCase(); }
      if (s.length < 3) { msg('Too short. The shortest of the four has four letters.'); return; }
      left().forEach(function (key) { if (!k && WK.is(key, s)) k = key; });
      if (k) {
        rings[k] = [page, lo, hi]; ER.flag('l-ring', rings); SEV.put(k, s); SEV.sfx.pencil(); ink(lo, hi); side(k); after();
        t = '<b>' + s.toUpperCase() + '.</b> You ring it in pencil, and write it into ' + SLIP[k][0] + '.';
        if (k === 'd2') t += ' A star. Thursday&rsquo;s puzzle: you did that one in the lift as well.';
        if (k === 'd6') t += ' A star. You remember it from last Tuesday, your first morning in the building.';
        if (k === 'd12') t += ' Another star. Saturday&rsquo;s puzzle.';
        if (SEV.count(HID) === 2 && tell('ring')) { SEV.sfx.phone(); $('#phone2').classList.add('ring'); setTimeout(function () { $('#phone2').classList.remove('ring'); SEV.sfx.hangup(); }, 3600);
          t += '<br>The telephone on the counter rings. Miss Abbas lets it ring four times. &ldquo;Library. No, Mr Quill. The library does not take telephone calls after eleven.&rdquo; She puts it down. &ldquo;He asked whether a junior had come in. I have told him nothing that was not true.&rdquo;'; }
        if (!left().length) t += '<br>Four rings. One clue is left on the slip, and it is not hiding anywhere.';
        msg(t);
        return;
      }
      /* what kind of wrong is it? */
      w0 = lts[lo].getAttribute('data-w'); w1 = lts[hi].getAttribute('data-w');
      left().forEach(function (key) { if (WK.is(key, s.slice(1))) near = 'front'; else if (WK.is(key, s.slice(0, -1))) near = 'back'; });
      mark(lo, hi, 'bad', true); setTimeout(function () { mark(lo, hi, 'bad', false); }, 700);
      ER.sfx.no(); SEV.slip(1); bad++;
      if (near) t = 'You have ringed <b>' + s.toUpperCase() + '</b>. One of the four is in there, with one letter too many at the ' + near + '.';
      else if (w0 === w1) t = '<b>' + s.toUpperCase() + '</b> sits inside one word, where anybody can see it. Sphinx&rsquo;s words are hiding: each begins in one word of a sentence and ends in another.';
      else if ((lo === 0 || lts[lo - 1].getAttribute('data-w') !== w0) && (hi === lts.length - 1 || lts[hi + 1].getAttribute('data-w') !== w1)) t = 'Those are whole words, and nothing is hiding in them. A hidden word begins or ends in the middle of a word: it runs across the gap.';
      else t = 'You have ringed <b>' + s.toUpperCase() + '</b>. Read it aloud. It is not a word, and it is none of the four on the slip.';
      if (bad % 3 === 0) {
        t += '<br>Miss Abbas arrives with an india rubber. She removes your wrong rings without a word, and turns the book to another page. &ldquo;Begin again,&rdquo; she says. &ldquo;With your eyes.&rdquo;';
        SEV.slip(1); show((page + 1) % PAGES.length);
      } else t += ' You rub it out.';
      box.setAttribute('data-bad', bad);
      msg(t);
    }
    cut.addEventListener('pointerdown', function (e) {
      var i = idx(e.target); if (i < 0 || e.button) return;
      e.preventDefault(); drag = { a: i, b: i, moved: false };
      function mv(ev) {
        var j = idx(document.elementFromPoint(ev.clientX, ev.clientY));
        if (j < 0 || j === drag.b) return;
        drag.b = j; drag.moved = true; clear(); mark(drag.a, drag.b, 'sel', true);
      }
      function up() {
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        var d = drag; drag = null;
        if (d.moved && d.a !== d.b) { anchor = -1; judge(d.a, d.b); return; }
        if (anchor >= 0 && anchor !== d.a) { var a0 = anchor; anchor = -1; judge(a0, d.a); return; }      /* the second of two clicks */
        clear(); anchor = d.a; lts[d.a].classList.add('sel');
        msg('That is the first letter. Now click the last letter of the hidden word.');
      }
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
    tabs.forEach(function (b, i) { b.addEventListener('click', function () { if (i !== page) { ER.sfx.paper(); show(i); } }); });
    wbtn.addEventListener('click', function () { ER.close(); openGrid(); });
    box.show = show; box.side = side; box.msg = msg;
    show(page);
    msg(left().length ? 'The House scrapbook: everything the Clarion has ever printed about itself. Turn the pages with the tabs. To ring a hidden word, press on its first letter and drag to its last. Or click the first letter, and then the last.'
      : 'Four rings, in pencil. One clue is left on the slip.');
    return box;
  }
  function openBook() {
    if (busy) return;
    if (!met) { ER.say('A big brown book, with a slip of paper under its cover. The woman at the hatch is watching your hand. Perhaps speak to her first.'); return; }
    if (!sbBox) sbBox = build(); else sbBox.side();
    inBook = true;
    ER.addClue('slip', 'The request slip', '<h4>FOR THE JUNIOR FROM THE PUZZLES DESK</h4><p>' + SEV.hand('Four of my words are hiding in the House scrapbook. Each begins in one word of a sentence and ends in another. Ring them.') + '</p>' +
      HID.map(function (k) { var s = SLIP[k]; return '<p><b>' + s[0] + '</b>' + (s[4] ? ' &#10033;' : '') + ' ' + s[2] + ' (' + s[3] + ') ' + SEV.hand(s[1]) + '</p>'; }).join('') +
      '<p><b>3 Down</b> Books for pasting cuttings into. Miss Abbas has forty of them on the top shelf. (10) ' + SEV.hand('You are holding one.') + '</p>', 'sheet', 'From Sphinx', true);
    ER.open('ov-lock', sbBox, function () { inBook = false; });
  }
  $('#scrap').addEventListener('click', openBook);

  /* ---------- the grid: one clue of this room is a plain meaning ---------- */
  function openGrid() {
    if (busy) return;
    SEV.openSheet({
      type: left().length || !met ? [] : ['d3'], onRight: right, onWrong: function (k, w) { return WRONG3[w] || 'Ten letters, and the last is an S. The first five are the word for small pieces of paper that somebody has cut out and kept.'; },
      shut: function (k) { return HID.indexOf(k) >= 0 ? 'That word is hiding in the scrapbook. Ring it there, and it will be written in.' : k === 'd3' ? 'First the four that are hiding. The slip is under the cover of the scrapbook.' : k === 'd7' ? '7 Down has no clue. Leave it until the words that cross it are in.' : 'That clue is waiting somewhere else in the building.'; },
      msg: nextFile ? 'Ten answers in ink.' : left().length ? 'Four of these are hiding in the scrapbook on the table: 2, 6 and 12 Down, and 16 Across.' : '3 Down is a plain meaning. Click it, and type.'
    });
  }
  SEV.onGrid = openGrid;
  function right(k, w, sh) {
    var file = ER.exitOk([HID.map(SEV.word).sort(function (a, b) { return ['alibi', 'omen', 'extra', 'hearsay'].indexOf(a) - ['alibi', 'omen', 'extra', 'hearsay'].indexOf(b); }).concat([w]).join('-')]), st;
    after();
    sh.msg('<b>SCRAPBOOKS.</b> It goes in, in ink, straight down the grid.');
    if (!file) return;
    nextFile = file; ER.flag('l-file', file); st = ER.state(); st.done = st.done || {}; st.done.library = 1; ER.flag('l-out', 1);
    busy = true; SEV.solved();
    setTimeout(function () {
      ER.closeAll();
      ER.narrate([
        'Ten answers in ink. Three of the four that were hiding have stars. And three of the cuttings were about the same two things: a lift, and a secret.',
        'One question will not leave you alone. On Tuesday the Clarion is going to tell its readers who Sphinx is. But the Clarion promised, thirty-two years ago, that it would never ask.',
        '&ldquo;The composing room is on the second floor,&rdquo; says Miss Abbas, without looking up. &ldquo;Mr Fenwick does not like to be kept waiting. Nor do I. Good night.&rdquo;'
      ], function () { busy = false; after(); });
    }, 1700);
  }

  /* ---------- things in the room ---------- */
  $('#sphinxdr').addEventListener('click', function (e) {
    e.stopPropagation(); if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'cuttings');
    ER.say('The drawer marked SPHINX holds one buff envelope. The envelope holds nothing. Somebody has put it back upside down, in a hurry.', 8000);
  });
  SEV.thing('#cabs', 'cuttings', 'Drawers to the ceiling: every person, place and thing that the Clarion has ever written about, in buff envelopes. MAYORS. MARROWS. MOTOR CARS, STOLEN (see also: MAYORS).', isBusy);
  SEV.thing('#ladder', null, 'The ladder runs on a rail. Miss Abbas does not seem to need it. Things come down when she looks at them.', isBusy);
  SEV.thing('#bound', null, 'The bound puzzles: one fat red volume for every year since 1936. There is a gap where 1959 ought to be, and a card in the gap. OUT TO MR QUILL, 9.10 p.m.', isBusy);
  SEV.thing('#hush', null, 'SILENCE. Somebody has added PLEASE, in pencil. Somebody else has rubbed it out.', isBusy);
  SEV.thing('#pencil', 'india rubber', 'A yellow pencil and an india rubber, laid out side by side like a knife and fork.', isBusy);
  SEV.thing('#wclock', null, function () { return 'The library clock says ' + SEV.time() + '. The first edition goes to press at two.'; }, isBusy);
  $('#bell').addEventListener('click', function () { if (busy) return; ER.sfx.bell(); ER.say('You ring once. &ldquo;I can see you,&rdquo; says Miss Abbas. &ldquo;I could see you before.&rdquo;'); });
  $('#phone2').addEventListener('click', function () { if (busy) return; ER.say('The library telephone. Miss Abbas puts her hand flat on it. The note said: tell nobody upstairs.'); });
  $('#dial').addEventListener('click', function (e) { e.stopPropagation(); if (busy) return; ER.say('The brass arrow over the lift gate. Still between 6 and 7.'); });
  $('#door').addEventListener('click', function () { if (busy) return; ER.say('The landing, and the lift. The same card on the gate, in the same blue pencil: OUT OF ORDER. You are getting to know these stairs.'); });
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; SEV.sfx.steps(5);
    setTimeout(function () { ER.leave(nextFile); }, 900);
  });
})();
</script>
</body>
</html>
