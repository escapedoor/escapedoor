<style>
  body{--bg:#0a0d0a;--accent:#f4e04d;--font-display:'Playfair Display',serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(8,11,8,.96);--tc-ink:#f1ecdf;--cap-bg:rgba(9,12,9,.94);--panel:#131712;--q-ink:#e6d58a;--fade:#040604;--hud-bg:rgba(9,12,9,.8)}
  .tc-room{font-weight:700}
  .sT{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .mk{font-family:'Permanent Marker',cursive;text-anchor:middle}
  #lampGlow{animation:lg 7s steps(1,end) infinite}
  @keyframes lg{0%{opacity:1}70%{opacity:.94}74%{opacity:1}}
  #torch{animation:torch 19s ease-in-out infinite alternate}
  @keyframes torch{from{transform:translate(0,0)}to{transform:translate(-110px,4px)}}
  #scr{animation:scr 4s steps(1,end) infinite}
  @keyframes scr{50%{opacity:.8}}
  #dlight{opacity:0;transition:opacity 2s}
  #door.near #dlight{opacity:1}
  #dhandle{transition:transform 1.6s;transform-origin:1474px 452px}
  #door.turn #dhandle{transform:rotate(24deg)}

  /* the big dictionary */
  .dc{display:grid;grid-template-columns:1fr 1fr;width:min(900px,94vw);min-height:430px;background:#fbf8ee;color:#1c1b18;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 1px #d9d2bf;border-radius:4px;
    font-family:'EB Garamond',Georgia,serif;font-size:20px;line-height:1.4;border:10px solid #3b2a1a;border-bottom-width:16px}
  .dc>div{padding:26px 30px 24px}
  .dc-l{border-right:2px solid #c9c0a8;background:linear-gradient(90deg,rgba(0,0,0,0) 86%,rgba(0,0,0,.09))}
  .dc-r{background:linear-gradient(270deg,rgba(0,0,0,0) 86%,rgba(0,0,0,.09))}
  .dc h4{margin:0 0 10px;font-family:'Playfair Display',serif;font-weight:900;font-size:23px}
  .dc p{margin:0 0 10px}
  .dc small{display:block;margin:14px 0 8px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6b6453}
  .dc-tabs{display:flex;flex-wrap:wrap;gap:8px}
  .dc-tabs button{padding:4px 12px 3px;background:#fff;border:1px solid #1c1b18;font-family:'Outfit',Arial,sans-serif;font-weight:500;font-size:16px;color:#1c1b18;box-shadow:0 2px 5px rgba(0,0,0,.25)}
  .dc-tabs button:nth-child(odd){transform:rotate(-2deg)}.dc-tabs button:nth-child(even){transform:rotate(2deg)}
  .dc-tabs button.on{background:#f4e04d}
  .dc-entry b{font-family:'Playfair Display',serif;font-weight:900;font-size:27px}
  .dc-entry i{color:#6b6453}
  .dc-entry .us{display:inline-block;margin:0 0 0 4px;padding:0 8px;border:1px solid #8c2f24;color:#8c2f24;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.06em}
  .dc-entry .us b{font-family:inherit;font-size:inherit;font-weight:600}
  .dc-none{color:#8d8776;font-style:italic}
  .dc .w:hover{color:#8c2f24}

  /* the torn note */
  .tn{display:grid;grid-template-columns:minmax(0,700px) 300px;gap:24px;width:min(1040px,96vw);align-items:start}
  .tn-desk{background:#23432f radial-gradient(ellipse at 30% 0,rgba(255,236,170,.3),rgba(0,0,0,0) 62%);border:12px solid #5a3c22;border-radius:6px;padding:16px 22px 18px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.5)}
  .tn-list{margin:0;padding:0;list-style:none}
  .tn-strip{position:relative;margin:0 0 9px;padding:9px 20px 7px 44px;background:#fbf9f0 linear-gradient(90deg,rgba(0,0,0,0) 30px,#e8a5a0 30px,#e8a5a0 32px,rgba(0,0,0,0) 32px);color:#1d2a4a;font-family:'Caveat',cursive;font-size:24.5px;line-height:1.12;
    cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;box-shadow:0 4px 9px rgba(0,0,0,.45);
    clip-path:polygon(0 7%,7% 0,16% 8%,28% 1%,41% 9%,55% 0,68% 8%,80% 1%,91% 9%,100% 2%,100% 93%,93% 100%,82% 92%,70% 100%,57% 91%,44% 100%,31% 92%,19% 100%,8% 92%,0 100%)}
  .tn-strip:nth-child(odd){transform:rotate(-.5deg)}.tn-strip:nth-child(even){transform:rotate(.6deg)}
  .tn-strip.lift{z-index:5;cursor:grabbing;box-shadow:0 14px 28px rgba(0,0,0,.6)}
  .tn-strip.held{background-color:#fff6c9}
  .tn-strip.taped:after{content:'';position:absolute;left:46%;bottom:-13px;width:74px;height:20px;background:rgba(255,246,190,.62);border-left:2px dashed rgba(120,100,40,.4);border-right:2px dashed rgba(120,100,40,.4);transform:rotate(-3deg);z-index:3}
  .tn-strip.taped{clip-path:none}
  .tn.whole .tn-strip{margin:0;transform:none;clip-path:none;box-shadow:none;cursor:default;padding-top:4px;padding-bottom:3px}
  .tn.whole .tn-strip.taped:after{display:none}
  .tn-side .pmsg{min-height:210px}
  .tn-side .btn{margin-top:10px;font-size:15px;padding:11px 22px}
  /* saying the name */
  .nm{width:min(760px,94vw);background:#0d120e linear-gradient(170deg,#161d17,#070a08);border:1px solid #2f3a31;border-radius:6px;padding:20px 28px 20px;box-shadow:0 26px 70px rgba(0,0,0,.8)}
  .nm svg{display:block;width:100%;height:auto;margin-bottom:8px}
  .nm-say{font-family:'Courier Prime',monospace;font-size:33px;line-height:1.3;color:#f1ecdf;text-align:center}
  .nm-gap{display:inline-block;min-width:190px;border-bottom:3px solid #f4e04d;color:#f4e04d;white-space:nowrap;text-align:left;padding:0 4px}
  .nm-gap u{display:inline-block;width:14px;height:26px;margin-left:2px;background:#f4e04d;vertical-align:-3px;text-decoration:none;animation:cur 1s steps(1,end) infinite}
  @keyframes cur{50%{opacity:0}}
  .nm .wk-key{--s:42px;border-radius:5px}
  .nm .pmsg{margin-top:12px;min-height:82px}
  #nmDoor{transition:transform 1.2s;transform-origin:520px 100px}
  @media (max-width:900px){.tn{grid-template-columns:1fr}.dc{grid-template-columns:1fr}}
</style>

  });
  EXAM.clock(); EXAM.wall('#hh', '#mh', 1516, 112);
  nextFile = ER.flag('d-file') || null; noteDone = !!ER.flag('d-note'); told = ER.flag('d-told') || {}; stage = ER.flag('d-stage') || 0;

  /* the note, as it came out of the bin */
  var STRIPS = [
    ['r', 'By the next morning those photographs were on half the phones in Year 9.'],
    ['h', 'And please never say who told you. J.A.'],
    ['t', 'On Wednesday, when the fire bell rang, the grey cupboard in the staffroom was left open.'],
    ['w', 'Mine is not one of them, because I want my mark to be my own, even if it is a bad one.'],
    ['k', 'Miss, I am no good at telling tales, so I am writing this down instead.'],
    ['p', 'So please could you do something before Friday, without anybody being thrown out of school?'],
    ['m', 'While everybody was out in the yard, somebody from our year went back in, found it open, and photographed Friday&rsquo;s paper.']
  ];
  var DICT = {
    color: ['colour', 'noun', 'what you see when light falls on a thing. Red, blue and green are colours.'],
    center: ['centre', 'noun', 'the middle of something: <i>the centre of the town</i>.'],
    traveled: ['travelled', 'verb', 'the past of <i>travel</i>: went from one place to another.'],
    favorite: ['favourite', 'adjective', 'liked more than all the others: <i>my favourite mug</i>.']
  };
  var NO = {
    calloway: 'You open your mouth, and shut it again. Mrs Calloway spells COLOUR with a U, and corrects everybody who does not. The four scraps never came out of her typewriter.',
    drummond: 'No. You can hear Mr Drummond through the window, whistling in the yard. And nobody ever began a note to Mr Drummond with the word &ldquo;Miss&rdquo;.',
    tibbs: 'No. Nobody has ever called Mr Tibbs &ldquo;Miss&rdquo;. And Mrs Calloway&rsquo;s key box was not made for people who teach Maths.',
    ashby: 'No. Jonah Ashby wrote the note. He did not read it and tear it up. He would not even look at the photographs.',
    jonah: 'No. Jonah Ashby wrote the note. He did not read it and tear it up. He would not even look at the photographs.',
    kettle: 'No. Mr Kettle is in Leeds until Monday. And if Mr Kettle knew about any of this, there would be no exam tomorrow at all.',
    miss: 'Miss who? Two people at this school are called &ldquo;Miss&rdquo; by every pupil in it. Say the name.'
  };
  var NEAR = ['The steps are on the stairs.', 'The steps have reached the bottom of the stairs.', 'The steps are in the corridor, just outside.', 'The handle is going down, very slowly.'];

  function hints() {
    if (nextFile) return null;
    if (noteDone && !inName) return ['door', ['Somebody is coming down the stairs. Click on the library door, on the right, and be ready to speak first.']];
    if (noteDone) return ['name', [
      'The note says who it was written to, in its very first word. How many people at Kestrel Hill does a pupil call that? Look at the staff board in your notebook.',
      'Two are left. One of them corrects other people&rsquo;s spelling in red ink. Now look at your four scraps again, and look each of them up in the big dictionary under the window.',
      'All four scraps are spelt the American way. Somebody at this school wrote a note that was spelt like that, and Mrs Calloway corrected it. It is on the staffroom fridge, and it is signed with two initials. Whose are they?'
    ]];
    if (inNote) return ['note', [
      'There are seven strips. Find the one that can only be the beginning, and the one that can only be the end.',
      'Small words join the strips together: &ldquo;it&rdquo;, &ldquo;those&rdquo;, &ldquo;them&rdquo;, &ldquo;So&rdquo;, &ldquo;And&rdquo;. Each of them points back at something in the strip before.',
      '&ldquo;Miss&rdquo; begins it and the initials end it. &ldquo;Found it open&rdquo; must come after the thing that was left open. &ldquo;Those photographs&rdquo; must come after somebody has photographed something. And &ldquo;Mine is not one of them&rdquo; must come straight after the phones.'
    ]];
    return ['look', [
      'Somebody has been working at the long table all evening. Look at what they have left on it, under it and beside it.',
      'The wire bin at the end of the table is full of torn paper. Somebody has torn up a note. Click on the bin.'
    ]];
  }
  function isBusy() { return busy; }
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('d-told', told); return true; }
  function near() { $('#door').classList.add('near'); ER.pips(noteDone ? 1 : 0, 2); EXAM.mood('tense'); }

  function begin() {
    ER.pips(noteDone ? 1 : 0, 2);
    setInterval(function () { if (!ER.isOpen() && !busy && Math.random() < 0.5) EXAM.sfx.whistle(); }, 26000);
    if (noteDone) { near(); ER.say('The library. The steps are coming.'); return; }
    if (told.in) { ER.say('The library. The lamp is still on.'); return; }
    busy = true; tell('in');
    ER.narrate([
      'The library. Somebody has been working at the long table: a green lamp, a cup of tea, pencil shavings.',
      'Under the table there are three boxes tied up with string. Beside it, the wastepaper bin is full of torn paper.',
      'It is very quiet. Upstairs, the copier has stopped.'
    ], function () { busy = false; });
  }

  /* ---------- things in the room ---------- */
  EXAM.thing('#shelves', null, 'Eleven thousand books. The one that matters tonight is lying open on its stand, under the window.', isBusy);
  EXAM.thing('#ladder', 'ladder', null, isBusy);
  EXAM.thing('#globe', 'globe', 'A globe. Somebody has turned it so that America faces the lamp.', isBusy);
  EXAM.thing('#lamp', null, 'A green reading lamp, and the glass is hot. Somebody has been sitting under it all evening.', isBusy);
  EXAM.thing('#tea', null, 'A cup of tea, gone cold, with the tea bag still in it. Whoever made it had no time to drink it.', isBusy);
  EXAM.thing('#papers', null, 'Clean paper, a pencil worn down to a stump, and pencil shavings. Somebody has been writing something long, in a hurry.', isBusy);
  EXAM.thing('#pc', null, 'PC 2: the computer that sent PAPER B to the copier. The screen is locked. A note on the frame says: SAVE YOUR WORK. EVERYTHING IS SWITCHED OFF AT HALF PAST NINE. F.D.', isBusy);
  EXAM.thing('#win', null, 'The yard. Mr Drummond&rsquo;s torch is on its way back towards the side door. It must be nearly half past.', isBusy);
  EXAM.thing('#clock', null, function () { return 'The library clock says ' + EXAM.time() + '.'; }, isBusy);
  $('#boxes').addEventListener('click', function () {
    if (busy) return;
    ER.say('Three boxes, tied up with string. You lift the corner of a lid. YEAR 9 ENGLISH, PAPER A, again and again and again: a hundred and nineteen of them. On the middle box somebody has written in marker pen: RECYCLING. NOT BEFORE FRIDAY 10 A.M.', 11000);
    EXAM.mine('boxes', 'Three boxes under the table', '<p>In the library: the other hundred and nineteen copies of Paper A, tied up with string. Nobody has sold them or copied them. Nobody has even opened them.</p>' +
      '<p>On the middle box, in marker pen: <b>RECYCLING. NOT BEFORE FRIDAY 10 A.M.</b></p><p>They are waiting to be thrown away, an hour after the exam has begun.</p>');
  });
  $('#door').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.leave(nextFile); return; }
    if (!noteDone) { ER.say('The door to the stairs. Nobody is on them. Not yet.'); return; }
    openName();
  });
  $('#bin').addEventListener('click', function () {
    if (busy) return;
    if (noteDone) { ER.say('The bin is empty now. The note is in your notebook, in one piece.'); return; }
    openNote();
  });

  /* ---------- the big dictionary ---------- */
  $('#dict').addEventListener('click', function () {
    if (busy) return;
    var box = ER.el('div', 'dc');
    box.innerHTML = '<div class="dc-l"><h4>How to use this dictionary</h4><p>Every word is printed first in the spelling that is used in Britain.</p>' +
      '<p><span class="dc-entry"><span class="us">US</span></span> shows the spelling that is used in the United States of America, where it is different.</p>' +
      '<small>Your four scraps</small><div class="dc-tabs">' + Object.keys(DICT).map(function (w) { return '<button type="button" data-w="' + w + '">' + w + '</button>'; }).join('') + '</div></div>' +
      '<div class="dc-r"><p class="dc-none">It is a very big dictionary, and it is open at the letter M. Choose one of your scraps, and look it up.</p></div>';
    ER.$$('.dc-tabs button', box).forEach(function (b) {
      b.addEventListener('click', function () {
        var w = b.getAttribute('data-w'), d = DICT[w];
        ER.$$('.dc-tabs button', box).forEach(function (o) { o.classList.toggle('on', o === b); });
        box.querySelector('.dc-r').innerHTML = '<p class="dc-entry"><b>' + d[0] + '</b> <i>' + d[1] + '</i> <span class="us">US <b>' + w + '</b></span></p><p>' + d[2] + '</p>' +
          '<p class="dc-none">There is no page for &ldquo;' + w + '&rdquo; by itself. The dictionary sends you here.</p>';
        ER.sfx.paper(); WK.learn(d[0]); looked[w] = 1; box.setAttribute('data-looked', Object.keys(looked).length);
        if (Object.keys(looked).length === 4) EXAM.mine('dict', 'The big dictionary', '<p>I looked up the four scraps. Not one of them is the spelling that the dictionary prints first.</p>' +
          '<p>colour (US <b>color</b>) &middot; centre (US <b>center</b>) &middot; travelled (US <b>traveled</b>) &middot; favourite (US <b>favorite</b>)</p><p>US = the spelling that is used in the United States of America.</p>');
      });
    });
    ER.open('ov-read', box, function () {
      if (Object.keys(looked).length < 4 || !tell('dict')) return;
      ER.say('Four scraps, and every one of them is spelt the American way. Whoever typed the page they came from does not spell like Mrs Calloway.', 9000);
    });
  });

  /* ---------- the torn note: seven strips ---------- */
  function buildNote() {
    var box = ER.el('div', 'tn'), list, msgEl, held = null, lock = false, NUM = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six'];
    box.innerHTML = '<div class="tn-desk"><ul class="tn-list">' + STRIPS.map(function (s) { return '<li class="tn-strip" data-id="' + s[0] + '">' + ER.gloss(s[1]) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="tn-side"><p class="pmsg"></p><button type="button" class="btn" id="tn-go">Read it through</button></div>';
    list = box.querySelector('.tn-list'); msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function kids() { return ER.$$('.tn-strip', list); }
    function ids() { return kids().map(function (n) { return n.getAttribute('data-id'); }); }
    function tape() { var a = ids(); kids().forEach(function (n, i) { n.classList.toggle('taped', i < a.length - 1 && !!taped[a[i] + a[i + 1]]); }); box.setAttribute('data-order', a.join('')); }
    function hold(n) { if (held) held.classList.remove('held'); held = n; if (n) n.classList.add('held'); }
    list.addEventListener('pointerdown', function (e) {
      var it = e.target.closest ? e.target.closest('.tn-strip') : null;
      if (!it || e.button || lock) return;
      e.preventDefault();
      var sy = e.clientY, moved = false;
      function mv(ev) {
        if (!moved) { if (Math.abs(ev.clientY - sy) < 6) return; moved = true; hold(null); it.classList.add('lift'); }
        it.style.transform = 'translateY(' + (ev.clientY - sy) + 'px) rotate(-1deg)';
      }
      function up(ev) {
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        var others, ref = null, i, r, a, an;
        if (!moved) {                                          /* a click: pick it up, or change places with the one already picked up */
          if (!held) { hold(it); return; }
          if (held === it) { hold(null); return; }
          a = held; an = a.nextSibling === it ? a : a.nextSibling; hold(null);
          list.insertBefore(a, it); list.insertBefore(it, an); ER.sfx.paper(); tape(); return;
        }
        it.classList.remove('lift'); it.style.transform = '';
        others = kids().filter(function (k) { return k !== it; });
        for (i = 0; i < others.length; i++) { r = others[i].getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { ref = others[i]; break; } }
        list.insertBefore(it, ref); ER.sfx.paper(); tape();
      }
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
    box.querySelector('#tn-go').addEventListener('click', function () {
      if (lock) return;
      var a = ids(), good = 0, i, t;
      if (ER.check('order', a.join(''))) { win(a); return; }
      for (i = 0; i < a.length - 1; i++) if (ER.check('join', a[i] + a[i + 1])) { taped[a[i] + a[i + 1]] = 1; good++; }
      tape(); EXAM.slip(1); EXAM.sfx.tape(); ER.shake(box.querySelector('.tn-desk'));
      box.setAttribute('data-tries', (+box.getAttribute('data-tries') || 0) + 1);
      if (!ER.check('first', a[0])) t = 'It does not begin there. A note to a teacher begins by speaking to the teacher.';
      else if (!ER.check('last', a[a.length - 1])) t = 'It begins well. But it cannot end like that. A note ends with the name of the person who wrote it, or at least the initials.';
      else t = 'The beginning and the end are right. The middle does not follow.';
      t += good ? ' ' + (good === 1 ? 'One join reads well, and you put a piece of tape across it.' : NUM[good] + ' of the joins read well, and you put a piece of tape across each.') : ' Not one of the joins reads well yet.';
      msg(t + ' Look at the small words: what is &ldquo;it&rdquo;, which are &ldquo;those&rdquo;, who are &ldquo;them&rdquo;?');
    });
    function win(a) {
      lock = true; noteDone = true; ER.flag('d-note', 1); hold(null);
      for (var i = 0; i < a.length - 1; i++) taped[a[i] + a[i + 1]] = 1;
      tape(); box.classList.add('whole'); EXAM.sfx.tape(); ER.sfx.ok();
      ER.addClue('note', 'The torn note', kids().map(function (n) { return '<p>' + n.textContent + '</p>'; }).join(''), 'lined', 'Seven strips, in order');
      msg('It reads from top to bottom without a bump. Seven strips, one note, and two initials at the end of it.');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          'J.A. So that is what Jonah Ashby was doing outside the staffroom at ten past four. He was not waiting to take anything. He was waiting to give somebody this.',
          'And somebody read it, and tore it into seven pieces so that nobody would ever know who wrote it. And then spent the whole evening doing what it asked.'
        ], function () {
          near(); EXAM.sfx.stepsNear(6);
          ER.narrate([
            'Steps on the stairs. Not a whistle this time: steps. Whoever has been at work in this school all evening is coming back for the boxes.',
            'There is nowhere to hide in a library. But you can speak first. If you say the right name, you are somebody who understands. If you say the wrong one, you are a pupil in the dark with a hundred and nineteen exam papers.'
          ], function () { busy = false; openName(); });
        });
      }, 3000);
    }
    msg('Seven strips of lined paper, in somebody&rsquo;s best handwriting. Drag a strip up or down, or click two strips to make them change places. When you think it reads properly, read it through.');
    tape();
    return box;
  }
  function openNote() {
    if (!tnBox) tnBox = buildNote();
    inNote = true;
    ER.open('ov-lock', tnBox, function () { inNote = false; });
  }

  /* ---------- say the name before the door opens ---------- */
  function openName() {
    var box = ER.el('div', 'nm'), buf = '', wait = false, msgEl;
    box.innerHTML = '<svg viewBox="0 0 700 130"><rect width="700" height="130" fill="#070a08"/><rect x="430" y="6" width="180" height="124" fill="#ffe9a8"/><g id="nmDoor"><rect x="430" y="6" width="180" height="124" fill="#3d2916"/>' +
      '<rect x="448" y="20" width="144" height="96" fill="none" stroke="#2a1b0f" stroke-width="3"/><path d="M448 74h26" stroke="#d9c58a" stroke-width="8" stroke-linecap="round"/></g>' +
      '<rect x="418" y="0" width="12" height="130" fill="#1d140d"/><rect x="610" y="0" width="12" height="130" fill="#1d140d"/>' +
      '<g fill="#23432f" opacity=".9"><rect x="40" y="96" width="330" height="10"/></g><g id="nmBooks"></g></svg>' +
      '<div class="nm-say">&ldquo;Good evening, <span class="nm-gap"><b></b><u></u></span>.&rdquo;</div><div class="nm-keys wk"></div><p class="pmsg"></p>';
    msgEl = box.querySelector('.pmsg');
    (function () { var s = '', i, C = ['#6e2f2a', '#2f4a3a', '#27405e', '#8a6a3a', '#4a3a5a']; for (i = 0; i < 22; i++) s += '<rect x="' + (46 + i * 14.5) + '" y="' + (44 + (i * 7) % 16) + '" width="12" height="' + (52 - (i * 7) % 16) + '" fill="' + C[i % 5] + '"/>'; box.querySelector('#nmBooks').innerHTML = s; })();
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function draw() { box.querySelector('.nm-gap b').textContent = buf.toUpperCase(); }
    function door() { box.querySelector('#nmDoor').style.transform = 'scaleX(' + (1 - Math.min(stage, 3) * 0.045).toFixed(3) + ')'; box.setAttribute('data-stage', stage); }
    function press(k) {
      if (wait) return false;
      if (k === 'back') { buf = buf.slice(0, -1); draw(); return; }
      if (k === 'enter') { if (buf) say(); return; }
      if (k.length !== 1) return false;
      if (buf.length < 18) { buf += k; ER.sfx.tick(); draw(); }
    }
    function say() {
      var g = buf.toLowerCase(), bare = g.replace(/^(mrs|miss|mr|ms)(?=.)/, ''), file = ER.exitOk([g, bare]), st;
      if (file) {
        wait = true; nextFile = file; ER.flag('d-file', file); EXAM.freeze(); st = ER.state(); st.done = st.done || {}; st.done.library = 1; ER.flag('d-out', 1);
        EXAM.solved(); $('#door').classList.add('turn'); ER.pips(2, 2);
        msg('You say it before the door is fully open. On the other side somebody stands quite still, with a hand on the handle.');
        setTimeout(function () { ER.leave(file); }, 3800);
        return;
      }
      stage++; ER.flag('d-stage', stage); EXAM.slip(1); EXAM.sfx.stepsNear(3); ER.shake(box.querySelector('.nm-say')); door();
      msg((NO[bare] || NO[g] || 'There is nobody of that name at Kestrel Hill. Look at the staff board in your notebook.') + ' <b>' + NEAR[Math.min(stage, 3)] + '</b>');
      buf = ''; draw();
    }
    WK.board(box.querySelector('.nm-keys'), { back: true, enter: 'Say it', key: press });
    WK.keys(box, press);
    door(); draw();
    msg('Type the name, and press Enter. Your notebook is open to you: who works here, how they write, and what was left in the bin of the shredder. <b>' + NEAR[Math.min(stage, 3)] + '</b>');
    inName = true;
    ER.open('ov-lock', box, function () { inName = false; });
  }
})();
</script>
</body>
</html>
