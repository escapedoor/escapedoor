<style>
  body{--bg:#120e0b;--accent:#f4e04d;--font-display:'Playfair Display',serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(13,10,8,.96);--tc-ink:#f1ecdf;--cap-bg:rgba(15,12,9,.94);--panel:#1b1612;--face-bg:#2a211b;--q-ink:#e6d58a;--fade:#080605;--hud-bg:rgba(15,12,9,.76)}
  .tc-room{font-weight:900;font-style:italic}
  .sT{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .mk{font-family:'Permanent Marker',cursive;text-anchor:middle}
  #torch{animation:torch 17s ease-in-out infinite alternate}
  @keyframes torch{from{transform:translate(0,0)}to{transform:translate(170px,-8px)}}
  #lampGlow{animation:lg 5.3s steps(1,end) infinite}
  @keyframes lg{0%{opacity:1}61%{opacity:.93}66%{opacity:1}}
  #shadow{transform:translateX(-150px);opacity:0}
  #shadow.pass{animation:pass 2.6s linear forwards}
  @keyframes pass{0%{transform:translateX(-150px);opacity:.75}100%{transform:translateX(190px);opacity:.75}}
  #kdoor{transition:transform .7s;transform-origin:1206px 440px}
  #kbox.open #kdoor{transform:scaleX(-.34)}
  #kbox.glow #klamp{fill:#7be04a}

  /* the bulletin and the key box */
  .kb{display:grid;grid-template-columns:minmax(0,700px) 330px;gap:26px;width:min(1090px,96vw);align-items:start}
  .kb-paper{position:relative;background:#f3eedf linear-gradient(176deg,rgba(255,255,255,.5),rgba(120,100,60,.14));color:#1c1b18;padding:30px 36px 20px 30px;
    font-family:'Courier Prime',monospace;font-size:18.5px;line-height:1.3;box-shadow:0 24px 60px rgba(0,0,0,.65);transform:rotate(-.5deg)}
  .kb-paper:before{content:'';position:absolute;left:50%;top:-10px;width:20px;height:20px;margin-left:-10px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff8d80,#b3261c 60%,#6e120c);box-shadow:0 3px 5px rgba(0,0,0,.5)}
  .kb-paper h5{margin:0;font-size:19px;font-weight:700;letter-spacing:.12em}
  .kb-from{margin:2px 0 12px;padding-bottom:9px;border-bottom:1px solid #6b6453;font-size:15.5px;color:#4a463b}
  .kb-lines{margin:0;padding:0;list-style:none;counter-reset:ln}
  .kb-lines li{position:relative;counter-increment:ln;margin:0;padding:17px 0 4px 38px;-webkit-user-select:none;user-select:none}
  .kb-lines li:before{content:counter(ln) '.';position:absolute;left:0;top:17px;font-weight:700;color:#6b6453}
  .kb-lines .wk-w{position:relative;padding:1px 2px;cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><path d='M3 29l3-9L22 4l6 6L12 26z' fill='%23c8281d' stroke='%23400' stroke-width='1.5'/><path d='M3 29l3-9 6 6z' fill='%23f1ecdf' stroke='%23400' stroke-width='1.2'/><path d='M3 29l1.6-4 2.4 2.4z' fill='%23c8281d'/></svg>") 3 29,pointer}
  .kb-lines .wk-w:hover{background:rgba(200,40,29,.14)}
  .kb-lines .wk-w.ok{background:none;color:inherit;cursor:default}
  .kb-lines .wk-w.ok:after,.kb-lines .wk-w.blot:after{content:'';position:absolute;left:-7px;right:-7px;top:-3px;bottom:-4px;border:2.5px solid #c8281d;border-radius:50%;transform:rotate(-3deg)}
  .kb-lines .wk-w.blot:after{border-style:dashed;opacity:.55}
  .kb-lines .wk-w.blot:before{content:'?';position:absolute;right:-13px;top:-15px;font-family:'Caveat',cursive;font-weight:700;font-size:22px;color:#c8281d;opacity:.7}
  .kb-lines .fix{position:absolute;left:50%;top:-20px;transform:translateX(-50%) rotate(-3deg);white-space:nowrap;font-size:24px;line-height:1;pointer-events:none}
  .kb-lines li.kb-ok .wk-w{cursor:default}
  .kb-lines li.kb-ok .wk-w:hover{background:none}
  .kb-lines li.kb-done{color:#8d8776}
  .kb-lines li.kb-done:after{content:'\2713';position:absolute;left:-2px;top:36px;font-family:'Caveat',cursive;font-weight:700;font-size:26px;color:#c8281d}
  .kb-foot{margin:14px 0 0;padding-top:10px;border-top:1px solid #6b6453;font-size:15.5px;line-height:1.32;color:#3b382f}
  .kb-side svg{display:block;width:100%;height:auto}
  .kb-rings{margin:12px 0 10px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#cfc8b6;display:flex;align-items:center;gap:7px}
  .kb-rings i{width:17px;height:13px;border:2px solid #6b6453;border-radius:50%;transform:rotate(-8deg)}
  .kb-rings i.on{border-color:#ff5a4a}
  .whT{font-family:'Bebas Neue',sans-serif;font-size:44px;fill:#16171c;text-anchor:middle}
  .wh.on rect{fill:#f4e04d}
  /* inside the key box */
  .hk{width:min(820px,94vw);background:#23272c;border:8px solid #5d656e;border-radius:6px;padding:16px 20px 16px;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .hk svg{display:block;width:100%;height:auto}
  .hk .pmsg{margin-top:10px;min-height:66px}
  .hkT{font-family:'Courier Prime',monospace;font-weight:700;font-size:15px;fill:#1c1b18;text-anchor:middle}
  .hkN{font-family:'Bebas Neue',sans-serif;font-size:34px;fill:#f4e04d;text-anchor:middle}
  .hook{cursor:pointer}
  @media (max-width:900px){.kb{grid-template-columns:1fr}}
</style>
</head>

    if (solved) { openHooks(); return; }
    if (opened) { openLock(); return; }
    ER.say('A steel box with six small wheels, and a letter on each. Under it, a card in Mr Drummond&rsquo;s capitals: THE WORD CHANGES EVERY MONDAY. ASK MRS CALLOWAY. I HAVE STOPPED ASKING.', 9000);
  });
  $('#bull').addEventListener('click', function () {
    if (busy) return;
    if (!got) { ER.say('The English department&rsquo;s bulletin for the week. It is addressed to teachers, and you came for your cards.'); return; }
    if (solved) { ER.say('The bulletin has six red rings on it now. Mrs Calloway will think one of her teachers has been busy.'); return; }
    openLock();
  });

  /* ---------- the lock: six wrong words, six first letters ---------- */
  function boxSvg() {
    var s = '<rect x="6" y="6" width="318" height="238" rx="12" fill="#4d555e"/><rect x="6" y="6" width="318" height="238" rx="12" fill="none" stroke="#22262b" stroke-width="5"/>' +
      '<rect x="20" y="20" width="290" height="210" rx="6" fill="none" stroke="#6d757e" stroke-width="2"/>' +
      '<text x="165" y="60" class="sT" font-size="24" fill="#16171c" letter-spacing="6">SPARE KEYS</text><circle id="kb-lamp" cx="292" cy="50" r="8" fill="#c8281d"/>' +
      '<rect x="24" y="84" width="282" height="88" rx="6" fill="#16181c"/>', i;
    for (i = 0; i < 6; i++) s += '<g class="wh" id="wh' + i + '"><rect x="' + (33 + i * 45) + '" y="94" width="39" height="68" rx="4" fill="#e9e3d2"/><text x="' + (52.5 + i * 45) + '" y="145" class="whT"></text>' +
      '<text x="' + (52.5 + i * 45) + '" y="194" class="sT" font-size="13" fill="#16171c">' + (i + 1) + '</text></g>';
    return s + '<rect x="130" y="206" width="70" height="16" rx="8" fill="#22262b"/><g fill="#22262b"><circle cx="22" cy="22" r="4"/><circle cx="308" cy="22" r="4"/><circle cx="22" cy="228" r="4"/><circle cx="308" cy="228" r="4"/></g>';
  }
  function openLock() {
    opened = true;
    var box = ER.el('div', 'kb'), wait = false;
    box.innerHTML = '<div class="kb-paper"><h5>ENGLISH DEPARTMENT &middot; WEEK 38</h5><div class="kb-from">From V. Calloway &middot; Monday &middot; copy <b id="kb-no"></b> of 12</div>' +
      '<ol class="kb-lines"></ol><p class="kb-foot"></p></div>' +
      '<div class="kb-side"><svg viewBox="0 0 330 250">' + boxSvg() + '</svg><div class="kb-rings">Red rings wasted on this copy <i></i><i></i><i></i></div><p class="pmsg"></p></div>';
    box.querySelector('.kb-foot').innerHTML = ER.gloss('As every week: <b>one word in each line is wrong.</b> Take the first letter of each wrong word, from the top. Those six letters are this week&rsquo;s word for the key box. I type more than one version of this bulletin, with different mistakes, so there is no point in copying from Mr Tibbs. V.C.');
    var ol = box.querySelector('.kb-lines'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function wheels() { found.forEach(function (c, i) { var g = box.querySelector('#wh' + i); g.querySelector('.whT').textContent = c.toUpperCase(); g.classList.toggle('on', !!c); }); }
    function ringsPaint() { ER.$$('.kb-rings i', box).forEach(function (n, i) { n.classList.toggle('on', i < rings); }); box.setAttribute('data-rings', rings); }
    function first() { for (var i = 0; i < 6; i++) if (!found[i]) return i; return 0; }
    function build() {
      ol.innerHTML = ''; box.querySelector('#kb-no').textContent = copyNo; box.setAttribute('data-ver', ver);
      LINES[ver].forEach(function (t, i) {
        var li = ER.el('li', '', t); ol.appendChild(li);
        if (found[i]) { li.classList.add('kb-done', 'kb-ok'); return; }
        var pk = WK.pick(li, { key: ver + (i + 1), sound: false,
          onRight: function (w, node) { right(i, w, node, pk, li); },
          onWrong: function (w, node) { wrong(i, w, node); } });
      });
      ringsPaint(); wheels(); cur = first();
    }
    function spin(i, letter) {
      var t = box.querySelector('#wh' + i + ' .whT'), n = 0, id = setInterval(function () {
        t.textContent = n < 7 ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt((n * 7 + i * 3) % 26) : letter;
        if (n++ >= 7) { clearInterval(id); wheels(); }
      }, 55);
    }
    function right(i, w, node, pk, li) {
      if (wait) return;
      var e = EXAM.entry(w), letter = w.charAt(0).toUpperCase(), f;
      found[i] = letter.toLowerCase(); ER.flag('a-found', found.map(function (c) { return c || '_'; }).join(''));
      pk.destroy(); li.classList.add('kb-ok');
      if (e) { f = ER.el('i', 'fix red'); f.textContent = e.other; node.appendChild(f); WK.learn(e.head); }
      EXAM.sfx.pen(); setTimeout(EXAM.sfx.wheel, 260); spin(i, letter); paint(); cur = first();
      msg('<b>' + w.toUpperCase() + '</b> gets a red ring. ' + (e ? '(' + e.en + '.) ' : '') + 'Wheel ' + (i + 1) + ' on the key box turns to <b>' + letter + '</b>.');
      if (found.every(Boolean)) win();
    }
    function wrong(i, w, node) {
      if (wait) return;
      rings++; EXAM.slip(1); EXAM.sfx.deny(); node.classList.add('blot'); ringsPaint(); cur = i;
      if (rings >= 3) {
        wait = true; ol.style.pointerEvents = 'none';
        msg('Three red rings in the wrong places, and the page looks like somebody&rsquo;s homework. You unpin it and take the next copy from the pile.');
        setTimeout(function () {
          rings = 0; copyNo = copyNo >= 12 ? 1 : copyNo + 1; ver = ver === 'a' ? 'b' : 'a'; ER.flag('a-ver', ver); ER.flag('a-copy', copyNo);
          ER.sfx.paper(); wait = false; ol.style.pointerEvents = ''; build();
          swaps++;
          msg('Copy ' + copyNo + ' of 12. ' + (swaps > 1 ? 'You have seen this one before: Mrs Calloway, it seems, had the patience to type only two versions.' : 'It says different things and has different mistakes.') + ' The letters already on the wheels stay where they are.');
        }, 2800);
        return;
      }
      msg((DECOY[ver + i] || {})[w] || ('<b>' + w.toUpperCase() + '</b> is spelt properly, and it means what it should. That is one red ring wasted. Read the whole line aloud: one word in it sounds right and is wrong.'));
    }
    function win() {
      var word = found.join(''), file = ER.exitOk([word]);
      if (!file) { msg('The wheels will not move. Something is wrong with this box: tell your teacher.'); return; }
      wait = true; solved = true; nextFile = file; ER.flag('a-file', file); WK.learn(word, true); pips();
      setTimeout(function () { ER.sfx.ok(); box.querySelector('#kb-lamp').setAttribute('fill', '#7be04a'); msg('Six wrong words, six first letters: <b>' + word.toUpperCase().split('').join(' ') + '</b>. Inside the box, something goes clunk.'); }, 700);
      setTimeout(function () {
        ER.closeAll(); paint(); EXAM.sfx.bolt(); busy = true;
        ER.narrate([
          'The steel door of the key box swings open. ' + word.toUpperCase() + ': it is just the word Mrs Calloway would choose for exam week.',
          'Five hooks. Not all of them have keys on.'
        ], function () { busy = false; });
      }, 3600);
    }
    build();
    msg('Mrs Calloway&rsquo;s red pen is lying on the green armchair. You borrow it. Click on the word that is wrong in each line.');
    lockBox = box;
    ER.open('ov-lock', box, function () { lockBox = null; });
  }

  /* ---------- inside the key box ---------- */
  function openHooks() {
    var box = ER.el('div', 'hk'), H = [[3, 'STAFFROOM', 'spare'], [9, 'COPY ROOM', ''], [14, 'EXAM', 'CUPBOARD'], [17, 'MINIBUS', ''], [21, 'LIBRARY', '']], s = '';
    s += '<rect width="780" height="290" fill="#16181c"/><rect x="0" y="52" width="780" height="10" fill="#5d656e"/>';
    H.forEach(function (h, i) {
      var x = 86 + i * 152, key = (h[0] === 3 && !hasKey) || h[0] === 17;
      s += '<g class="hook" data-h="' + h[0] + '"><rect x="' + (x - 70) + '" y="6" width="140" height="278" fill="transparent"/><text x="' + x + '" y="42" class="hkN">' + h[0] + '</text>' +
        '<path d="M' + x + ' 62v22q0 12 12 12" stroke="#c9ced3" stroke-width="6" fill="none" stroke-linecap="round"/>';
      if (key) s += '<g class="kk"><circle cx="' + (x + 6) + '" cy="118" r="20" fill="none" stroke="' + (h[0] === 3 ? '#d9c58a' : '#c9ced3') + '" stroke-width="8"/><path d="M' + (x + 6) + ' 138v76M' + (x + 6) + ' 190h18M' + (x + 6) + ' 208h13" stroke="' + (h[0] === 3 ? '#d9c58a' : '#c9ced3') + '" stroke-width="8" fill="none"/></g>';
      if (h[0] === 9) s += '<g transform="rotate(-4 ' + x + ' 150)"><rect x="' + (x - 62) + '" y="104" width="124" height="96" fill="#fdfdf6"/><g stroke="#16171c" stroke-width="4" stroke-linecap="round"><path d="M' + (x - 50) + ' 124h100M' + (x - 50) + ' 142h84M' + (x - 50) + ' 160h100M' + (x - 50) + ' 178h46"/></g></g>';
      s += '<g transform="rotate(' + (i % 2 ? 3 : -3) + ' ' + x + ' 250)"><rect x="' + (x - 60) + '" y="228" width="120" height="' + (h[2] ? 48 : 30) + '" fill="#f1eee2"/><text x="' + x + '" y="249" class="hkT">' + h[1] + '</text>' +
        (h[2] ? '<text x="' + x + '" y="268" class="hkT">' + (h[0] === 3 ? '(SPARE)' : h[2]) + '</text>' : '') + '</g></g>';
    });
    box.innerHTML = '<svg viewBox="0 0 780 290">' + s + '</svg><p class="pmsg"></p>';
    var msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    msg(hasKey ? 'The key box. Hook 3 is empty now, because its key is in your hand.' : 'Five hooks, with a number over each one. Click on a hook to look at it.');
    var SAY = {
      9: 'No key on hook 9. Only a card, in Mr Drummond&rsquo;s capitals: COPY ROOM HAS A NEW LOCK. NO KEY. IT ASKS QUESTIONS. NOT MY IDEA. F.D.',
      14: 'Hook 14: EXAM CUPBOARD. The hook is empty. So whoever opened the grey cupboard tonight took the spare key from this box. And to open this box they had to find six wrong words, just as you did.',
      17: 'Number 17: MINIBUS. You are thirteen years old. You leave it where it is.',
      21: 'Hook 21: LIBRARY. Empty as well. Somebody has the library key in a pocket tonight.'
    };
    ER.$$('.hook', box).forEach(function (g) {
      g.addEventListener('click', function () {
        var n = +g.getAttribute('data-h'), k;
        if (n !== 3) { ER.sfx.click(); msg(SAY[n]); return; }
        if (hasKey) { msg('Hook 3 is empty now. Its key is in your hand.'); return; }
        hasKey = true; ER.flag('a-key', 1); k = g.querySelector('.kk'); if (k) k.style.display = 'none';
        ER.sfx.chain(); paint(); pips();
        msg('Number 3: STAFFROOM (SPARE). It is the only key in this box that you have any right to. You take it. Look at the other hooks before you go.');
      });
    });
    ER.open('ov-read', box, function () {
      EXAM.mine('keybox', 'Inside the key box', '<p>Hook 3, STAFFROOM (SPARE): the key I took.</p><p>Hook 9, COPY ROOM: no key. Mr Drummond&rsquo;s card says the copy room has a new lock that &ldquo;asks questions&rdquo;.</p>' +
        '<p>Hook 14, EXAM CUPBOARD: <b>empty</b>.</p><p>Hook 17, MINIBUS: a key.</p><p>Hook 21, LIBRARY: <b>empty</b>.</p>' +
        '<p>Whoever took 14 and 21 opened the box the way I did, by finding six wrong words. Mr Drummond would not need to: he has keys of his own.</p>');
    });
  }
})();
</script>
