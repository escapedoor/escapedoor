<style>
  body{--bg:#070b12;--accent:#f4e04d;--font-display:'Bebas Neue',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(6,9,15,.96);--tc-ink:#e9eef5;--cap-bg:rgba(7,10,16,.94);--panel:#111722;--q-ink:#e6d58a;--fade:#03050a;--hud-bg:rgba(7,10,16,.78)}
  .tc-room{letter-spacing:.08em}
  .sT{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .nT{font-family:'Stardos Stencil',serif;font-weight:700;font-size:19px;fill:#0d1420;text-anchor:middle}
  #exitG{animation:ex 3.7s steps(1,end) infinite}
  @keyframes ex{0%{opacity:1}92%{opacity:.55}96%{opacity:1}}
  #buzz{animation:bz 2.4s steps(1,end) infinite}
  @keyframes bz{0%{opacity:.95}18%{opacity:.25}30%{opacity:.9}52%{opacity:.15}}
  #sweep{animation:sweep 31s linear infinite;opacity:0}
  @keyframes sweep{0%{transform:translateX(-500px);opacity:0}3%{opacity:.5}20%{transform:translateX(1500px);opacity:.5}22%{opacity:0}100%{transform:translateX(1500px);opacity:0}}
  #spill{animation:sp 2s steps(1,end) infinite}
  @keyframes sp{0%{opacity:.9}50%{opacity:.72}}
  #cleaf{transition:transform 1.4s ease-in;transform-origin:1300px 460px}
  #cdoor.open #cleaf{transform:scaleX(.16)}
  #flood{opacity:0;transition:opacity 1.6s}
  #cdoor.open~#flood{opacity:1}
  .lk{cursor:pointer}
  .lk:hover .ld{filter:brightness(1.25)}

  /* the lock that asks questions */
  .sx{display:grid;grid-template-columns:minmax(0,690px) 330px;gap:24px;width:min(1050px,96vw);align-items:start}
  .sx-unit{background:#20252d linear-gradient(170deg,#2c333d,#181c23);border:3px solid #0c0f13;border-radius:14px;padding:16px 20px 16px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 2px #3a424e}
  .sx-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.3em;color:#9aa3af;text-transform:uppercase}
  .sx-head span{margin-right:auto}
  .sx-head i{width:15px;height:15px;border-radius:50%;background:#571a14;box-shadow:inset 0 0 0 2px #0c0f13}
  .sx-head i.on{background:#7be04a;box-shadow:inset 0 0 0 2px #0c0f13,0 0 10px #7be04a}
  .sx-head i.bad{background:#ff4a3a;box-shadow:inset 0 0 0 2px #0c0f13,0 0 10px #ff4a3a}
  .sx-screen{background:#0b1a10;border:3px solid #05080a;border-radius:8px;padding:12px 18px 14px;min-height:150px;color:#8dfc9d;font-family:'VT323',monospace;
    box-shadow:inset 0 0 34px rgba(0,0,0,.75);background-image:repeating-linear-gradient(rgba(0,0,0,0) 0 3px,rgba(0,0,0,.22) 3px 4px)}
  .sx-q{font-size:21px;letter-spacing:.14em;color:#4fae60;margin-bottom:4px}
  .sx-s .w:hover{color:#fff}
  .sx-s{font-size:31px;line-height:1.12}
  .sx-gap{display:inline-block;min-width:150px;padding:0 6px;border-bottom:3px solid #8dfc9d;color:#f4e04d;white-space:nowrap}
  .sx-gap u{display:inline-block;width:13px;height:24px;margin-left:2px;background:#f4e04d;vertical-align:-3px;text-decoration:none;animation:cur 1s steps(1,end) infinite}
  @keyframes cur{50%{opacity:0}}
  .sx-row{display:flex;align-items:center;gap:14px;margin:12px 0 2px}
  .sx-plate{padding:7px 18px 4px;background:linear-gradient(135deg,#8a6a26,#e6c873 30%,#b08a35 55%,#f0d98f 78%,#8a6a26);color:#2e2206;border-radius:3px;
    font-family:'Stardos Stencil',serif;font-weight:700;font-size:27px;letter-spacing:.1em;box-shadow:0 2px 0 #4d3a10}
  .sx-row small{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9aa3af}
  .sx .wk-board{margin-top:8px}
  .sx .wk-key{--s:44px;border-radius:7px;border:1px solid #05080a;background:#3a424e;color:#e9eef5;box-shadow:0 3px 0 #0c0f13;font-family:'Oswald',sans-serif}
  .sx .wk-key:hover:not(:disabled){background:#4a5462;border-color:#f4e04d}
  .sx .wk-key[data-k=enter]{background:#2f6a3a}
  .sx .pmsg{margin-top:12px;min-height:76px}
  .sx-side svg{display:block;width:100%;height:auto}
  .bolt{transition:transform .5s cubic-bezier(.5,0,.3,1.4)}
  .bolt.back{transform:translateX(64px)}
  .sx-card{position:relative;margin-top:14px;background:#fbfbf8;color:#1c1b18;padding:16px 18px 14px;font-family:'Courier Prime',monospace;font-size:15.5px;line-height:1.34;transform:rotate(.8deg);box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .sx-card p{margin:0 0 8px}
  .sx-card .mk{display:inline-block;margin-top:2px;padding:3px 10px;background:#fdf6c9;font-family:'Permanent Marker',cursive;font-size:17px;transform:rotate(-3deg);box-shadow:0 2px 5px rgba(0,0,0,.3)}
  .sx-card .w:hover{color:#8c2f24}
  @media (max-width:900px){.sx{grid-template-columns:1fr}}
</style>
</head>

(function () {

  /* windows, moonlight, twenty lockers */

    for (i = 0; i < 20; i++) {

  ER.init({
    theme: 'cipher', story: 'exam', storyTitle: 'Answer All Questions', id: 'corridor', no: 'II', title: 'The Year 9 Corridor',

      'Two hooks inside it were empty: number 14, EXAM CUPBOARD, and number 21, LIBRARY. You took number 3 and let yourself out of the staffroom.',
