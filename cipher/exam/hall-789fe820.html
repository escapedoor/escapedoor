<style>
  body{--bg:#0a0b0d;--accent:#f4e04d;--font-display:'Special Elite',monospace;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(8,9,11,.97);--tc-ink:#f1ecdf;--cap-bg:rgba(12,12,13,.93);--panel:#16171a;--face-bg:#16241b;--q-ink:#e6d58a;--fade:#000;--hud-bg:rgba(12,12,13,.78)}
  .tc-room{letter-spacing:.02em}
  .sT{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .veil{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;background:#050607;transition:opacity 2.6s}
  .veil.off{opacity:0;pointer-events:none}
  .mote{animation:mote 9s linear infinite;opacity:0}
  .mote.m2{animation-delay:-3s}.mote.m3{animation-delay:-6s}
  @keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}100%{transform:translate(60px,-150px);opacity:0}}
  #mypaper{transition:transform .5s}
  #mydesk.ready{cursor:pointer}
  #mydesk.ready #mypaper{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-7px)}}

  /* three questions that are not on the paper */
  .qp{width:min(900px,95vw);background:#fdfdf9;color:#16171c;padding:16px 38px 14px;font-family:'Courier Prime',monospace;font-size:16.5px;line-height:1.32;box-shadow:0 26px 70px rgba(0,0,0,.7);
    -webkit-user-select:none;user-select:none}
  .qp h4{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-family:'Playfair Display',serif;font-weight:900;font-size:21px;border-bottom:3px double #16171c;padding-bottom:6px}
  .qp h4 span{font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase}
  .qp .ins{margin:7px 0 6px;font-size:15px;color:#3b382f}
  .qp h5{margin:7px 0 3px;font-size:17.5px;font-weight:700;display:flex;justify-content:space-between}
  .qp h5 small{font-weight:400;font-size:13.5px;color:#6b6453}
  .qo{position:relative;display:flex;gap:10px;padding:3px 6px 2px 4px;cursor:pointer;border-radius:3px}
  .qo:hover{background:rgba(244,224,77,.35)}
  .qo i{position:relative;flex:0 0 18px;width:18px;height:18px;margin-top:2px;border:2px solid #16171c;font-style:normal}
  .qo i:after{content:attr(data-m);position:absolute;left:-1px;top:-13px;font-family:'Caveat',cursive;font-weight:700;font-size:34px;line-height:1;color:#c8281d}
  .qo b{flex:0 0 18px}
  .qo.no{cursor:default;color:#8d8776}
  .qo.no span{text-decoration:line-through;text-decoration-color:#c8281d}
  .qo.no:hover,.qo.yes:hover,.qq.fin .qo:hover{background:none}
  .qo.yes{cursor:default;font-weight:700}
  .qq.fin .qo{cursor:default}
  .qq .rc{min-height:22px;margin:0 0 0 32px;font-family:'Caveat',cursive;font-weight:700;font-size:22px;line-height:1.05;color:#c8281d}
  .qp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #16171c;font-size:14.5px;color:#3b382f}
  .qp-mark{font-family:'Caveat',cursive;font-weight:700;font-size:38px;line-height:1;color:#c8281d;transform:rotate(-4deg)}
  /* the slip at the end */
  .done{position:fixed;right:3vw;top:66px;z-index:34;width:min(450px,92vw);padding:22px 28px 18px;display:none;background:#f3eedf linear-gradient(175deg,rgba(255,255,255,.5),rgba(120,100,60,.14));
    color:#1c1b18;border-top:10px solid #16171c;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .done.on{display:block}
  .okstamp{display:inline-block;padding:4px 16px 1px;border:4px solid #c8281d;color:#c8281d;font-family:'Stardos Stencil',serif;font-weight:700;font-size:30px;letter-spacing:.14em;transform:rotate(-4deg);margin-bottom:12px}
  .done h6{margin:0 0 10px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:#6b6453}
  .done p{margin:0 0 7px;font-family:'Courier Prime',monospace;font-size:17px;line-height:1.35}
  .done .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .done .btn{--accent:#16171c;font-size:13px;padding:8px 14px}
  .done .btn:hover:not([disabled]){color:#f3eedf}
  .done small{display:block;margin-top:13px;font-family:'Courier Prime',monospace;font-size:13px;opacity:.7;line-height:1.5}
  .done small button{text-decoration:underline;font:inherit}
  /* question 4 */
  .rp{width:min(760px,94vw);max-height:84vh;overflow:auto;background:#fdfdf9;color:#16171c;padding:26px 38px 22px;box-shadow:0 26px 70px rgba(0,0,0,.6);-webkit-user-select:text;user-select:text}
  .rp h4{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#6b6453}
  .rp h3{margin:0 0 12px;font-family:'Playfair Display',serif;font-weight:900;font-size:24px;border-bottom:3px double #16171c;padding-bottom:8px}
  .rp label{display:block;font-family:'Courier Prime',monospace;font-size:17.5px;line-height:1.4;margin:10px 0 6px}
  .rp textarea,.rp input[type=text]{width:100%;font-family:'Caveat',cursive;font-size:25px;line-height:34px;color:#1d2a4a;background:#fbf9f0 repeating-linear-gradient(transparent 0 33px,#b9c7d6 33px 34px);border:1px solid #b9b09a;
    padding:0 12px;border-radius:0;resize:vertical;-webkit-user-select:text;user-select:text}
  .rp textarea{min-height:204px}
  .rp input[type=text]{height:36px}
  .rp .count{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;text-align:right;margin-top:4px}
  .rp .foot{display:flex;gap:10px;align-items:center;margin-top:12px}
  .rp .foot span{flex:1;font-family:'Courier Prime',monospace;font-size:14.5px;opacity:.7}
  .rp .btn{--accent:#16171c}.rp .btn:hover:not([disabled]){color:#fdfdf9}
  .rp .w:hover{color:#8c2f24}
  @media print{
    body{overflow:visible;background:#fff}
    body>*:not(.ov){display:none!important}
    .ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
    .ov-bar,.rp .foot{display:none!important}
    .rp{box-shadow:none;max-height:none;width:auto;overflow:visible}
  }
</style>

  ER.init({
    theme: 'cipher', story: 'exam', storyTitle: 'Answer All Questions', id: 'hall', no: 'V', title: 'The Hall',
    go: 'The door opens',
    intro: [
      'The strips of the note went back in order because each one pointed at the one before it: &ldquo;found it open&rdquo;, &ldquo;those photographs&rdquo;, &ldquo;one of them&rdquo;.',
      'The note began with one word, &ldquo;Miss&rdquo;. At Kestrel Hill that can only mean Mrs Calloway or Miss Nwosu, and the four scraps decided between them. COLOR, CENTER, TRAVELED and FAVORITE are how America spells. One teacher at this school came here from Boston: the one whose note on the staffroom fridge had been corrected in red.',

          a: '&ldquo;Well,&rdquo; she says. &ldquo;Good evening. You are supposed to be locked in the staffroom.&rdquo;' },
        { q: 'So it was you who locked me in.',
          a: 'It was. I saw a pupil standing in front of an empty exam cupboard at nine o&rsquo;clock at night, and I needed twenty more minutes. But I left you the key box. I teach you on Tuesdays. I knew that you could find six wrong words if you really had to.' },
        { q: 'Why did you take the papers?',
          a: 'You have read Jonah&rsquo;s note. By this morning Paper A was on half the phones in Year 9. If I tell Mr Kettle, the exam is cancelled, a hundred and twenty people come back in the holidays, and somebody is thrown out of school. So I am not telling Mr Kettle. Tomorrow there will simply be a different paper, and those photographs will be worth nothing at all.' },
        { q: 'Why not tell Mrs Calloway?',
          a: 'Because it was her cupboard. She was counting the papers when the fire bell rang, and the rule says: leave everything and walk. She has set this exam for twenty-six years, and she retires in July. I was not going to let an open cupboard be the last thing that anybody remembered about her.' },
        { q: 'How did you do it?',
          a: 'The same way that you got out. Six wrong words, the key box, key number 14. Then four hours at a keyboard, writing eight new pages. Then the shredder, which ate one page of Paper A and died. The other hundred and nineteen copies are in those boxes until the recycling goes on Friday.' },
        { note: 'She puts her box down on the table. It says PAPER B on the lid.',
          a: '&ldquo;Now it is my turn to ask. How did you know that it was me?&rdquo;</p><p>You hold out the four scraps. COLOR. CENTER. TRAVELED. FAVORITE.</p><p>She shuts her eyes. &ldquo;Four years in Boston. And I have been so careful, all year. Tell me the truth. Is it in the paper too?&rdquo;' },
        { a: 'You tell her that you did not turn the paper over.</p><p>She looks at you for quite a long time. &ldquo;No,&rdquo; she says. &ldquo;I don&rsquo;t suppose you did.&rdquo;' },
        { a: '&ldquo;Mr Drummond locks the side door at half past. Go home. You came for your revision cards and you found them, and that is all that happened tonight. And for what it is worth, question one tomorrow is not about China.&rdquo;' }
      ],
      clue: { id: 'nwosu', title: 'Miss Nwosu, at the library door', kind: 'What she said' }, last: 'Go home',
      done: night
    });
  }
  function night() {
    ER.narrate([
      'Mr Drummond was standing at the side door with his keys in one hand and a mug of tea in the other. He looked at his watch. &ldquo;' + EXAM.time() + ',&rdquo; he said. &ldquo;I said five minutes.&rdquo;',
      '&ldquo;Find what you came for?&rdquo; You held up forty cards and a rubber band. He wrote OUT in the visitors&rsquo; book beside your name. &ldquo;Quiet night,&rdquo; he said. &ldquo;Just you and me in the whole building.&rdquo;',
      'The mug in his hand was grey, and it had a bear on it. You decided not to say anything about that, either.',
      'You went home, and read forty revision cards, and did not sleep very well.'
    ], function () { morning(false); });
  }
  function morning(quick) {
    ER.flag('e-morning', 1); EXAM.setClock('Friday', '9.00', 'am'); veilOff(); ER.sfx.bell();
    try { if (ER.track) ER.track.play(['morning', { root: 52, bpm: 68, drop: ['mel'] }]); } catch (e) {}      /* the story turns a corner: a major key, and no small bright notes after the school bell */
    setTimeout(function () {
      ER.narrate([
        'Friday. The hall. A hundred and twenty desks in rows, a hundred and twenty pupils, and one clock that everybody is watching.',
        'Half of Year 9 look very calm indeed. They have seen this paper before, on their phones. They think.',
        'Mrs Calloway is back, grey in the face and wrapped in a long red scarf. She has been here since seven o&rsquo;clock. She walks along the rows and puts one paper, face down, on every desk.',
        'Miss Nwosu is standing at the side of the hall with a pencil behind her ear, looking at the floor.',
        '&ldquo;There is one thing that this school will never be short of, Miss Nwosu,&rdquo; says Mrs Calloway as she passes her, quite quietly. &ldquo;And that is the letter U.&rdquo;',
        'Then she says what she has said every June for twenty-six years. &ldquo;You may turn over now.&rdquo;'
      ], function () {
        EXAM.sfx.rustle();
        ER.narrate([
          'Paper B. On page three, in every one of the hundred and twenty copies, somebody has changed COLOR into COLOUR with a red pen. There is not an American spelling left in the building.',
          'Three rows in front of you, a boy who was very calm a minute ago has gone the colour of the paper. Two desks to your left, Jonah Ashby reads question one, picks up his pen, and begins.',
          'You have three questions of your own to answer first. They are not on the paper.'
        ], function () { busy = false; ready = true; $('#mydesk').classList.add('ready'); openQs(); });
      });
    }, quick ? 500 : 2400);
  }

  /* ---------- things in the hall ---------- */
  EXAM.thing('#calloway', null, 'Mrs Calloway, with the papers. She keeps a red pen behind her ear, in just the place where Miss Nwosu keeps a pencil.', isBusy);
  EXAM.thing('#nwosu', null, 'Miss Nwosu, looking at the floor. She has not had much sleep either.', isBusy);
  EXAM.thing('#clock', null, 'Nine o&rsquo;clock exactly. The hall clock is never slow. Mr Tibbs sees to that.', isBusy);
  EXAM.thing('#stage', 'stage', 'The board on the stage says: YEAR 9 ENGLISH. START 9.00. FINISH 10.30.', isBusy);
  EXAM.thing('#bars', 'wall bars', null, isBusy);
  EXAM.thing('#sdoor', null, 'The side door of the hall. Nobody is allowed out before half past ten.', isBusy);
  $('#mydesk').addEventListener('click', function () { if (busy || !ready) return; if (ER.flag('e-done')) { ER.say('Your paper. You have ninety minutes, and you have already answered the three hardest questions.'); return; } openQs(); });

  /* ---------- answer all questions ---------- */
  var QS = [
    ['Who took Paper A out of the grey cupboard?', [
      ['a', 'Mr Drummond, who has a key to every door in the building.', 'He has keys of his own, and no need of the key box. And he spent the evening whistling in the yard.'],
      ['b', 'Mrs Calloway, who wrote it.', 'She was at home in bed. And she has never written COLOR in her life.'],
      ['c', 'Jonah Ashby, who needed it most.', 'He wrote the note. He would not even look at the photographs.'],
      ['d', 'Miss Nwosu, who teaches you on Tuesdays.', 'She was at school all evening. But then, so were you.']],
      'Yes. The note began &ldquo;Miss&rdquo;, and the scraps were spelt the American way.'],
    ['How did that person get into a locked cupboard?', [
      ['a', 'By breaking the lock.', 'The lock was not broken. You looked.'],
      ['b', 'By asking Mr Drummond for his keys.', 'Mr Drummond thought that he and you were the only two people in the building.'],
      ['c', 'By finding the six wrong words in the bulletin, opening the key box and taking key 14.', 'Six wrong words are a great deal of trouble to take for a key.'],
      ['d', 'There was no need. The cupboard is never locked.', 'It is locked every day of the year. It stood open for three minutes and forty seconds on Wednesday, and that was the trouble.']],
      'Yes. The same way that you got out of the staffroom.'],
    ['Why were the papers taken?', [
      ['a', 'To give the answers to one class.', 'Then nobody would have fed page one to a shredder.'],
      ['b', 'Because photographs of Paper A were already on half the phones in Year 9. A new paper made them worth nothing, and nobody had to be thrown out of school.', 'A long answer is not always the right one.'],
      ['c', 'To get Mrs Calloway into trouble before she retires.', 'The other way round. Whose cupboard was left open on Wednesday?'],
      ['d', 'Because Mr Kettle said so.', 'Mr Kettle was in Leeds. And his rule would have cancelled the exam.']],
      'Yes. Nobody steals an exam in order to shred it.']
  ];
  function buildQs() {
    var box = ER.el('div', 'qp'), s = '<h4>Kestrel Hill School<span>Thursday night &middot; Paper C</span></h4><p class="ins">Answer all questions. Tick one box for each. Time allowed: as long as it takes Mrs Calloway to walk back to the front of the hall.</p>';
    QS.forEach(function (q, i) {
      s += '<div class="qq" data-q="' + (i + 1) + '"><h5><span>' + (i + 1) + '. ' + q[0] + '</span><small>[1 mark]</small></h5>' +
        q[1].map(function (o) { return '<div class="qo" data-o="' + o[0] + '"><i></i><b>' + o[0].toUpperCase() + '</b><span>' + o[1] + '</span></div>'; }).join('') + '<div class="rc"></div></div>';
    });
    box.innerHTML = s + '<div class="qp-foot"><span>Kestrel Hill School. This paper may not be taken out of the hall.</span><span class="qp-mark"></span></div>';
    ER.$$('.qq', box).forEach(function (qq, qi) {
      ER.$$('.qo', qq).forEach(function (qo) {
        qo.addEventListener('click', function () {
          if (right[qi] || qo.classList.contains('no')) return;
          var o = qo.getAttribute('data-o'), rc = qq.querySelector('.rc');
          tries[qi]++;
          if (ER.check('q' + (qi + 1), o)) {
            right[qi] = true; qo.classList.add('yes'); qo.querySelector('i').setAttribute('data-m', '✓'); qq.classList.add('fin'); rc.innerHTML = QS[qi][2]; EXAM.sfx.pen();
            if (right[0] && right[1] && right[2]) all();
            return;
          }
          qo.classList.add('no'); qo.querySelector('i').setAttribute('data-m', '×'); ER.sfx.no(); ER.shake(qo);
          rc.innerHTML = QS[qi][1].filter(function (x) { return x[0] === o; })[0][2];
        });
      });
    });
    function all() {
      var marks = tries.filter(function (t) { return t === 1; }).length;
      ER.flag('e-marks', marks); ER.flag('e-done', 1);
      box.querySelector('.qp-mark').textContent = marks + ' / 3';
      setTimeout(function () { EXAM.sfx.stamp(); }, 500);
      setTimeout(function () { ER.closeAll(); finish(); EXAM.solved(); }, 2600);
    }
    return box;
  }
  function openQs() {
    if (!qBox) qBox = buildQs();
    ER.open('ov-lock', qBox);
  }

  /* ---------- the slip at the end ---------- */
  function finish() {
    var st = ER.state(), mins = EXAM.minutesPlayed(), hn = ER.hintsUsed(), sp = EXAM.spare(), marks = ER.flag('e-marks');
    $('#d-stamp').textContent = (marks == null ? 3 : marks) + ' OUT OF 3';
    $('#d-time').textContent = 'The night took you ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
    $('#d-gate').textContent = 'Mr Drummond locked the side door behind you at ' + EXAM.time() + ', with ' + (sp === 1 ? 'one minute' : sp + ' minutes') + ' to spare.';
    $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' words.';
    $('#d-hints').textContent = hn ? 'You asked for ' + hn + (hn === 1 ? ' hint.' : ' hints.') : 'You did not ask for a single hint.';
    $('#done').classList.add('on');
  }
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* question 4: the one that nobody can mark */
  $('#b-q4').addEventListener('click', function () {
    var saved = ER.flag('q4') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>Kestrel Hill School &middot; Year 9 English</h4><h3>Question 4</h3>' +
      '<label for="r1">Mr Kettle comes back from Leeds on Monday. Do you tell him what happened on Thursday night? Write 50 to 80 words, and give two reasons. You could begin: &ldquo;I would tell him&rdquo; or &ldquo;I would not tell him&rdquo;.</label><textarea id="r1"></textarea>' +
      '<div class="count"></div><label for="r2">Name</label><input type="text" id="r2" maxlength="60">' +
      '<div class="foot"><span>No marks for this one. It is saved in this browser as you write.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > label');
    box.querySelector('#r1').value = saved.r1 || ''; box.querySelector('#r2').value = saved.r2 || '';
    function keep() {
      var o = { r1: box.querySelector('#r1').value, r2: box.querySelector('#r2').value }, n = (o.r1.match(/[A-Za-z’']+/g) || []).length;
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('q4', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
