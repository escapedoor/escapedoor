<style>
  body{--bg:#0d1210;--accent:#f4e04d;--font-display:'VT323',monospace;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(9,14,11,.96);--tc-ink:#e6f2e8;--cap-bg:rgba(10,15,12,.94);--panel:#141b17;--q-ink:#e6d58a;--fade:#050806;--hud-bg:rgba(10,15,12,.8)}
  .tc-room{letter-spacing:.06em;text-transform:uppercase;font-size:clamp(44px,6.6vw,88px)}
  .sT{font-family:'Oswald',sans-serif;font-weight:600;text-anchor:middle}
  .lcdT{font-family:'VT323',monospace;font-size:17px;fill:#8dfc9d}
  .mk{font-family:'Permanent Marker',cursive;text-anchor:middle}
  #flick{animation:fl 6.1s steps(1,end) infinite}
  @keyframes fl{0%{opacity:0}43%{opacity:.16}45%{opacity:0}47%{opacity:.1}48%{opacity:0}81%{opacity:.2}82%{opacity:0}}
  #tubeOn{animation:tb 6.1s steps(1,end) infinite}
  @keyframes tb{0%{opacity:1}43%{opacity:.5}45%{opacity:1}47%{opacity:.6}48%{opacity:1}81%{opacity:.4}82%{opacity:1}}
  #scanbar{animation:scan 2.2s linear infinite}
  @keyframes scan{0%{transform:translateX(0);opacity:.95}45%{transform:translateX(250px);opacity:.95}50%{opacity:0}100%{transform:translateX(0);opacity:0}}
  .outp{animation:outp 2.2s linear infinite;opacity:0}
  @keyframes outp{0%{transform:translate(58px,-10px);opacity:0}55%{transform:translate(58px,-10px);opacity:0}60%{opacity:1}100%{transform:translate(0,0);opacity:1}}
  #redlamp{animation:rl 1.1s steps(1,end) infinite}
  @keyframes rl{50%{opacity:.25}}
  #hang{animation:hang 3.4s ease-in-out infinite alternate;transform-origin:1262px 470px}
  @keyframes hang{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}

  /* the page in the shredder, and the bin under it */
  .sh{display:grid;grid-template-columns:minmax(0,730px) 318px;gap:22px;width:min(1080px,96vw);align-items:start}
  .sh-left{position:relative;padding-top:34px}
  .sh-mouth{position:absolute;left:-14px;right:-14px;top:0;height:46px;z-index:2;background:#22272b linear-gradient(#3a4147,#15181b);border-radius:8px 8px 3px 3px;box-shadow:0 8px 14px rgba(0,0,0,.6);

  .sh-mouth:after{content:'';position:absolute;left:10px;right:10px;bottom:5px;height:6px;border-radius:3px;background:#000}
  .sh-mouth b{font-weight:500;color:#ff5a4a}
  .sh-mouth b:before{content:'';display:inline-block;width:11px;height:11px;margin-right:8px;border-radius:50%;background:#ff4a3a;box-shadow:0 0 9px #ff4a3a;animation:rl 1.1s steps(1,end) infinite}
  .sh-page{position:relative;background:#f3eedf;color:#1c1b18;padding:20px 30px 22px;font-family:'Courier Prime',monospace;font-size:16.5px;line-height:1.5;box-shadow:0 22px 50px rgba(0,0,0,.6);
    background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 44px,rgba(60,50,30,.2) 44px 45px,rgba(255,255,255,.6) 45px 46px),linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,0) 60px),linear-gradient(#f3eedf,#f3eedf)}
  .sh-page h5{margin:0 0 4px;display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;letter-spacing:.1em}
  .sh-page .ins{margin:0 0 8px;font-size:14.5px;line-height:1.35}
  .sh-page .hole{margin:0 0 10px;height:30px;border:2px dashed #8d8776;background:#1b1e21;color:#aab2b8;font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;
    clip-path:polygon(0 12%,6% 0,15% 18%,27% 4%,39% 16%,52% 0,64% 14%,77% 3%,89% 17%,100% 5%,100% 88%,92% 100%,80% 84%,69% 100%,55% 86%,43% 100%,30% 83%,18% 100%,8% 86%,0 100%)}
  .sh-page h6{margin:0 0 6px;font-family:'Playfair Display',serif;font-weight:900;font-size:21px;letter-spacing:.02em}
  .sh-page p{margin:0 0 7px}
  .sh-page sup{font-size:11px;font-weight:700;color:#6b6453;margin-right:1px}
  .sh .wk-blank{min-width:124px;min-height:1.42em;margin:0 3px;padding:0;border-bottom:0;background:#1b1e21;vertical-align:-4px;border-radius:2px;
    clip-path:polygon(0 10%,8% 0,20% 14%,35% 2%,50% 12%,66% 0,82% 13%,100% 3%,100% 92%,90% 100%,74% 88%,58% 100%,42% 87%,26% 100%,10% 90%,0 100%)}
  .sh .wk-blank.ok{background:transparent;clip-path:none;min-width:0;vertical-align:baseline;margin:0}
  .sh .wk-blank .wk-chip{display:block;margin:0;padding:0 6px;transform:none}
  .sh .wk-blank .wk-set{padding:0 3px;font-weight:700;background:rgba(244,224,77,.5);border-radius:0;line-height:1.3}
  .sh-bin{background:rgba(190,205,215,.13);border:2px solid rgba(215,228,236,.45);border-top:0;border-radius:0 0 16px 16px;padding:8px 10px 12px;box-shadow:inset 0 -30px 50px rgba(0,0,0,.35)}
  .sh-bin h6{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#aab2b8;text-align:center}
  .sh .wk-bank{margin:0;padding:2px;border:0;min-height:236px;align-content:flex-start}
  .sh .wk-chip{margin:5px 4px;padding:3px 10px 2px;border:0;border-radius:0;background:#f3eedf;color:#1c1b18;font-family:'Courier Prime',monospace;font-size:16.5px;line-height:1.3;box-shadow:0 3px 6px rgba(0,0,0,.5);
    clip-path:polygon(0 8%,12% 0,30% 9%,55% 0,78% 10%,100% 0,100% 90%,85% 100%,60% 91%,38% 100%,15% 90%,0 100%)}
  .sh .wk-bank .wk-chip:nth-child(3n){transform:rotate(-4deg)}.sh .wk-bank .wk-chip:nth-child(3n+1){transform:rotate(3deg)}.sh .wk-bank .wk-chip:nth-child(4n+2){transform:rotate(-1.5deg)}
  .sh .wk-chip.wht{background:#fff;font-family:'Outfit',Arial,sans-serif;font-weight:500;font-size:16px;letter-spacing:.01em}
  .sh .wk-chip.held{outline:3px solid #f4e04d;outline-offset:2px}
  .sh .pmsg{margin-top:12px;min-height:120px;font-size:16px}
  @media (max-width:900px){.sh{grid-template-columns:1fr}}
</style>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null, seenLcd = false, shBox = null, inPuzzle = false, told = {};

  /* paper on the shelves, strips in the bin */
  (function () {
    var s = '', COL = ['#f4b6c2', '#fff0a8', '#bcd9f2', '#c6e8c0', '#fbfaf4', '#f7cfa0'], BOT = [268, 410, 552, 700], r, c, x, y, n, i;
    for (r = 0; r < 4; r++) for (c = 0; c < 4; c++) {
      x = 74 + c * 74; n = 2 + ((r * 5 + c * 3) % 4);
      for (i = 0; i < n; i++) s += '<rect x="' + x + '" y="' + (BOT[r] - 21 - i * 21) + '" width="66" height="20" fill="' + COL[(r * 2 + c + (i > 1 ? 1 : 0)) % 6] + '" stroke="#5e4f3a" stroke-width="1"/>';
    }
    $('#reams').innerHTML = s; s = '';
    for (i = 0; i < 80; i++) {
      x = 1172 + (i * 37) % 186; y = 596 + (i * 53) % 104;
      s += '<path d="M' + x + ' ' + y + 'q' + (8 + i % 9) + ' ' + (10 + i % 7) + ' ' + ((i % 2 ? 1 : -1) * 6) + ' ' + (30 + i % 20) + '" stroke="' + (i % 5 ? '#f3eedf' : '#fff') + '" stroke-width="4" fill="none" stroke-linecap="round"/>';
    }
    $('#strips').innerHTML = s;
  })();

  ER.init({
    theme: 'cipher', story: 'exam', storyTitle: 'Answer All Questions', id: 'copyroom', no: 'III', title: 'The Copy Room',
    go: 'Go in',
    intro: [
      'The door asked five questions, and every answer was a word that had to change its shape before it would fit. A verb became a noun. One word had to turn into its own opposite. And nothing was allowed to lose its U, because the door is British. Five bolts slid back.',
      'On the way you passed a locker that would not stop buzzing. Tomorrow&rsquo;s paper is already on half the phones in Year 9.',
      'The copy room is white and warm, and it smells of hot paper. The big copier is working hard. There is nobody here to tell it to.'

    '<p>For about thirteen hundred years, the way to a government job in China was to <sup>1</sup><span class="wk-blank" data-key="c1"></span> an examination. It was not easy. Each <sup>2</sup><span class="wk-blank" data-key="c2"></span> was locked into a tiny brick cell for three days and two nights, with his food, a blanket and a pot. About one man in a hundred was <sup>3</sup><span class="wk-blank" data-key="c3"></span>.</p>' +

    '<p>The examiners fought back. Guards searched everybody at the gate. And because a marker might <sup>5</sup><span class="wk-blank" data-key="c5"></span> a friend&rsquo;s handwriting, clerks copied out every single answer again in red ink before it was marked. The rule was <sup>6</sup><span class="wk-blank" data-key="c6"></span>: anyone who was caught could be banned for life. It was a great honour to pass, and a great <sup>7</sup><span class="wk-blank" data-key="c7"></span> to be caught.</p>' +
