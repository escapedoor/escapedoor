      'You put the vowels back into six things on television (LIVE AUDIENCE, INTERVIEW, SUBTITLES, TALENT SHOW, EPISODE, NEWSREADER) and Dressing Room 1 let Dexter Valentine out.',

      'Mr Valentine has gone back to his mirror, and Miss Okafor to her singing. Mr Bloom calls up the stairs after you: &ldquo;I should leave Maxine where she is. She only shouts.&rdquo;',
      'The gallery is the room where the programme is put together: a wall of screens, a desk of buttons, and the producer. Its door is at the top of the stairs.'
    ],
    exit: {"next":"studio","w":{"f7daa7f2":"a540042d"}}, tags: {"c1":["267757e4"],"c1@":["520e2521","33722b3f","cf1f0be2","fe9b9b34","36cab099","a0ce82de","7d705885","45398b26","46599bdc"],"c1?":["633e97e0","d4d321f2","74072c26","12c8a0cd","164e215b","bb0275df","ef71093c","1803bcfa","58406714"],"c1#":["433b6b78"]},
    sound: ['studio', { root: 45, bpm: 92, drop: ['arp', 'hit', 'ost'], level: 1.2, beds: [['hum', 0.6]] }],     /* a quiet room, much to read, and a clock to listen for: nothing with a beat */
    hints: hints,
    onBegin: begin
  });
  LEX.clock({ start: 41 * 60, range: 470, lin: 300 });
  LEX.onTick(function () { $('#clk').textContent = LEX.hhmm(); });
  open = !!ER.flag('g1'); heard = !!ER.flag('gt'); read = ER.flag('gr') || {}; outKey = ER.flag('gout') || null;

  function isBusy() { return busy; }
  function paint() {
    $('#gleaf').classList.toggle('open', open); $('#glamp').setAttribute('class', open ? 'ok' : ''); $('#mute').setAttribute('class', open ? 'off' : '');
    $('#scr3').classList.toggle('won', open); $('#scr3').classList.toggle('live', !open);
    $('#teag').classList.toggle('shout', !open);
    ER.$$('.in').forEach(function (n) { n.classList.toggle('on', open); });
    $('#glass').style.display = open ? 'none' : '';
    ER.pips((open ? 1 : 0) + (heard ? 1 : 0) + (read.log ? 1 : 0) + (read.memos ? 1 : 0), 4);
    if (open && heard && read.log && read.memos && outKey) LEX.go('Down to Studio Two', function () { if (!gone) gone = ER.exit([outKey]); });
  }
  function begin() {
    paint();
    if (ER.flag('gseen')) return;
    ER.flag('gseen', 1);
    ER.narrate([
      'The gallery has a wall of thick glass, so that no sound can get in or out. Behind it a woman in a headset is shouting. You cannot hear a word.',
      'The yellow screen beside the door says ROUND 3: THE CONUNDRUM.'
    ]);
  }

  /* ---------- outside the glass ---------- */
  $('#glass').addEventListener('click', function () {
    if (busy) return;
    ER.say('Behind the glass Miss Teague is shouting, and you cannot hear a word of it. The glass was made for that. But the last word is easy to read on her lips. It is &ldquo;NOW&rdquo;.');
  });
  $('#gdoor').addEventListener('click', function () {
    if (busy) return;
    ER.say(open ? 'The gallery door stands open. For the first time tonight you can hear Miss Teague. So can everybody else in the building.' :
      'A heavy door with a round window. GALLERY, it says, and under that: SILENCE. Tonight it has plenty.');
  });
  $('#scr3').addEventListener('click', function () {
    if (busy) return;
    if (open) { ER.say('ROUND 3: WON, says the screen. The same two small lines are still under it: &ldquo;' + NOTE + '&rdquo;'); return; }
    openCn();
  });

  /* ---------- round 3: the conundrum ---------- */
  var DEALS = ['verahorde', 'heardover', 'roverhead'], TIME = 45;
  var OUT = [
    'Time. LEX turns the nine letters face down and deals them again. Behind the glass Miss Teague says one short word. You cannot hear it. You can read it.',
    'Time. The letters are dealt again, a little more kindly. Miss Teague has put both hands flat on the glass.',
    'Time. LEX deals again. Miss Teague is writing on the glass with a lipstick, backwards, so that you can read it. It says HURRY.'
  ];
  function openCn() {
    var box = ER.el('div', 'lx-screen cn'), C = 2 * Math.PI * 42, rack, msgEl, arc, num, left = TIME, timer = 0, done = false, cur = null;
    box.innerHTML = '<div class="lx-top"><b>ROUND 3</b><span>THE CONUNDRUM</span><i>NINE LETTERS, ONE WORD</i></div>' +
      '<div class="lx-note">' + NOTE + '</div>' +
      '<div class="cn-head"><div class="cn-clue"><small>The clue</small>&ldquo;Heard by accident, or by listening where you should not.&rdquo;</div>' +
      '<svg class="cn-clk" viewBox="0 0 104 104"><circle cx="52" cy="52" r="50" fill="#17181b"/><circle cx="52" cy="52" r="42" fill="none" stroke="#3a3b40" stroke-width="8"/>' +
      '<circle id="cnArc" cx="52" cy="52" r="42" fill="none" stroke="#f4e04d" stroke-width="8" transform="rotate(-90 52 52)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="0"/>' +
      '<text id="cnNum" x="52" y="66"></text></svg></div>' +
      '<div class="cn-rack"></div><div class="cn-help">drag a letter to a new place &middot; or click two letters to change them over</div><div class="lx-msg"></div>';
    rack = box.querySelector('.cn-rack'); msgEl = box.querySelector('.lx-msg'); arc = box.querySelector('#cnArc'); num = box.querySelector('#cnNum');
    ER.glossIn(box, '.cn-clue');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function show() {
      num.textContent = Math.ceil(left); box.setAttribute('data-left', Math.ceil(left));
      arc.setAttribute('stroke-dashoffset', (C * (1 - left / TIME)).toFixed(1));
      arc.setAttribute('stroke', left <= 10 ? '#ff5a4a' : '#f4e04d');
    }
    function dealOut() {
      var mine = {}, d = deal < 3 ? deal : 1 + (deal - 1) % 2;
      cur = mine; rack.innerHTML = ''; left = TIME; show(); box.setAttribute('data-deal', deal);
      WK.tiles(rack, { key: 'c1', items: DEALS[d], onMove: function () { LEX.sfx.flip(); }, onDone: function (t) { if (cur === mine && !done) solved(t); } });
    }
    function tick() {
      if (done || document.querySelector('.hintbox, .ov-top.on')) return;      /* reading a hint or the notebook: the clock is kind enough to wait */
      left -= 0.25;
      if (left <= 0) {
        LEX.sfx.timeup(); LEX.lose(15); ER.shake(rack); deal++;
        msg(OUT[nOut++ % OUT.length]); dealOut(); return;
      }
      if (left <= 10 && left % 1 === 0) LEX.sfx.tick();
      show();
    }
    function solved(text) {
      done = true; clearInterval(timer); busy = true;
      open = true; ER.flag('g1', 1); outKey = ER.exitOk([text]) ? text : null; ER.flag('gout', outKey);
      WK.learn(text); LEX.sfx.ding();
      msg(LEX.yes() + ' ' + text.toUpperCase() + ': nine letters, with ' + Math.ceil(left) + ' seconds left on the clock.');
      setTimeout(function () {
        ER.closeAll(); LEX.sfx.door(); ER.sfx.ok(); paint(); busy = false;
        ER.say(text.toUpperCase() + '. You say it under your breath: oh-vuh-HURD. You have heard that word once already tonight, through a red door. Then the gallery door opens, and you can hear Miss Teague.', 9000);
      }, 2300);
    }
    msg('&ldquo;Fingers on buzzers!&rdquo; There are no buzzers. There are nine letters, a clue, and a clock that has already started.');
    dealOut();
    ER.open('ov-lock', box, function () { inCn = false; clearInterval(timer); if (!done) deal++; cur = null; });
    inCn = true; timer = setInterval(tick, 250);
  }

  /* ---------- inside ---------- */
  var LOG = '<h4>LEX &middot; LOG &middot; FRIDAY</h4>' +
    '<p>12.00 &nbsp; FINAL WORD typed in by the WRITER. Envelope sealed.</p>' +
    '<p>16.30 &nbsp; Technical rehearsal. PRACTICE SET 14, for the 9th Friday running. Nobody has asked for a new one.</p>' +
    '<p>18.00 &nbsp; Set up by MARLOW. From 19.00 LEX runs itself.</p>' +
    '<p>19.30 &nbsp; LOCKED IN made ready at the board desk. Questions: PRACTICE SET 14. Start in 60 seconds.</p>' +
    '<p>19.30 &nbsp; Note typed for every screen: <b>&ldquo;' + NOTE + '&rdquo;</b></p>' +
    '<p>19.31 &nbsp; LOCKED IN started. Doors locked: 6. Players in the corridor: 1.</p>' +
    '<p>NOW &nbsp;&nbsp; Rounds 1, 2 and 3 won by PLAYER 1. Round 4, THE WALL: not yet played.</p>';
  var MEMOS = '<h4>Pinned to Miss Teague&rsquo;s board</h4>' +
    '<div class="m"><small>Memo &middot; week 3</small><p>Maxine, Mr Bloom solved the final conundrum in one second again. Kindly look into it. N.P.</p><p class="scrawl">HE&rsquo;S GOOD TELEVISION!! M.</p></div>' +
    '<div class="m"><small>Memo &middot; week 6</small><p>Maxine, tonight he answered before the last two letters had turned over. Nobody can read a letter from the back. Kindly look into it. N.P.</p><p class="scrawl">VIEWERS UP 40%. LEAVE HIM ALONE. M.</p></div>' +
    '<div class="m"><small>Memo &middot; week 9</small><p>Maxine, I think I know how he does it. Kindly give me ten minutes before Friday. N.P.</p><p class="scrawl">NO TIME. M.</p></div>';
  var STICKY = '<p>Maxine darling!</p><p>Tonite can I have the GOOD chair. And water with NO bubbels in it. Definately no bubbels.</p><p>Dex x</p>';

  $('#m7').addEventListener('click', function () {
    if (busy) return;

  $('#memos').addEventListener('click', function () {

  $('#sticky').addEventListener('click', function () {

  LEX.thing('#m1', null, 'Monitor 1: the corridor you have just left. Mr Bloom is standing very close to the open door of Dressing Room 1, looking at nothing at all.', isBusy);
  LEX.thing('#m2', null, 'Monitor 2: the set. Sixteen words are waiting on the big board, four by four. That must be round four.', isBusy);
  LEX.thing('#m3', null, 'Monitor 3: a glass case on the set, with one cream envelope inside it. From here it looks as if nobody has touched it.', isBusy);
  LEX.thing('#m4', null, 'Monitor 4: one of the two glass booths on the set. Somebody in a green cardigan is sitting inside it, doing a crossword. She does not look worried.', isBusy);
  LEX.thing('#m5', null, 'Colour bars. Somewhere a camera is switched off.', isBusy);
  LEX.thing('#m6', null, 'The foyer. Two hundred people in their best clothes are eating crisps in front of two locked doors.', isBusy);
  LEX.thing('#m8', null, 'LEXICON: THE FINAL. 8.00. This screen has been saying so all week.', isBusy);

    if (busy) return;
    LEX.talk('teague', [
      'RUNNER! Good. Less than twenty minutes. Where is my host? Where are my finalists? No, do not tell me: I can see them. I can see everything from in here. I just cannot DO anything.',
      { q: 'What happened at 7.31?', a: 'LEX started LOCKED IN. And do not tell me it started by itself. Somebody set it going at the board desk, down on the set, and typed a little note for every screen in the building. It is all in the log: that screen there, with the yellow writing.' },
      { q: 'Why would anybody do that?', a: 'Nine weeks, one champion, and tonight is the final. The final word is in a sealed envelope, in a glass case on the set. Somebody wanted ten minutes alone with that envelope. I would bet my job on it.' },
      { q: 'Mr Bloom can hear Mr Valentine through the green-room wall.', a: 'And? I can hear Dexter from the car park. I am not stopping a live final because a man has ears. He is good television.' },
      'Now. The set is shut by round four, but the audience doors are not on LEX: the audience does not play. Here is my key. Read that log, read what is on my pinboard, then get into the studio before the audience does and clear that wall.'
    ], { id: 'teague', title: 'Maxine Teague, in the gallery', kind: 'What she said' }, function (seen) {
      if (!seen || heard) return;
      heard = true; ER.flag('gt', 1); paint();
      if (!(read.log && read.memos)) ER.say('A key on a yellow ribbon, still warm from her hand. She has already turned back to her wall of screens.');

  /* ---------- hints ---------- */
  function hints() {
    if (!open) {
      if (inCn) return ['c1', [
        'Read the clue first. The answer is about hearing, and it is two short words joined into one.',
        'One of the two short words is the past of &ldquo;hear&rdquo;. Find those five letters and put them at the end.',

      return ['r3', [

      ]];

      'Miss Teague told you to read two things: the log (the screen with the yellow writing, in the bottom row) and the papers on her pinboard, on the left.',
