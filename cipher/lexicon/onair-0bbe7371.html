    $('#bulbs').innerHTML = s; s = '';

    for (i = 0; i < 20; i++) {

  ER.init({

      'Mrs Pryce did not argue. She started LOCKED IN herself. She did not want the envelope. She wanted ten minutes in which Mr Valentine said his last card to the mirror, and both finalists sat on the other side of a thin wall.',

    exit: {"last":true,"rooms":4,"stars":2}, tags: {"f1":["c5da3238"],"f1@":["4a9bdfe0","eaf0e235","f995167a","d289c5c6","c3986266","0a381074","0fd92345","7e963f1f","de63d957"],"f1?":["da2f4a8a","ce710440","6e0e0ed0","add425f8","6f9ada9c","798b76b6","accfb27c","67ca0be0","4b356776"],"f1#":["2ff99544"]},

      'Eight o&rsquo;clock. &ldquo;Good evening, and welcome to the final of... LEXICON!&rdquo; Two hundred people clap. You stand in the dark beside the board desk, where nobody can see you.',
      'It is a very good final. Barnaby Bloom is fast and right. Joy Okafor is slow and right. At four minutes to nine they have seventy points each.',
      '&ldquo;Finalists,&rdquo; says Dexter Valentine, &ldquo;for the series: the final conundrum. Fingers on buzzers.&rdquo;',
      'The nine tiles on the big board begin to turn over, one at a time. The first is a T. The second is an E.'
    ], function () {
      ER.mood('tense');
      setTimeout(function () { tile(0, BOARD.charAt(0)); }, 400);
      setTimeout(function () { tile(1, BOARD.charAt(1)); }, 1100);
      setTimeout(function () {
        buzzer('B', true); LEX.sfx.buzz();
        ER.narrate([
          'A buzzer. Mr Bloom is not looking at the board. He never does. He is smiling at camera two. &ldquo;OVERHEARD,&rdquo; he says. One second.'
        ], function () {
          for (i = 2; i < 9; i++) (function (n) { setTimeout(function () { tile(n, BOARD.charAt(n)); }, (n - 2) * 260 + 200); })(i);
          setTimeout(function () {
            buzzer('B', false);
            ER.narrate([
              'The other seven tiles turn over. There is no V on the board. There is no H. There is no D.',
              '&ldquo;Overheard?&rdquo; says Dexter. &ldquo;But that is the word on my OLD card! The one Nora took away at five to eight. I have only ever said that word to my mirror, Barnaby, so how did you...&rdquo; He stops. Even Dexter Valentine has understood.',
              'Nobody in Studio Two says anything. Four million people are listening to it.',
              'Joy Okafor has not looked at Mr Bloom once. She is looking at the board, and so are you.'
            ], function () { phase = 'ready'; openFc(); });
          }, 7 * 260 + 700);
        });
      }, 1900);
    });
  }
  $('#ftiles').addEventListener('click', function () { if (phase === 'ready' && !ER.isOpen()) openFc(); });

  /* ---------- the final conundrum ---------- */
  function openFc() {
    var box = ER.el('div', 'lx-screen fc'), msgEl, moves = 0;
    box.innerHTML = '<div class="lx-top"><b>LIVE</b><span>THE FINAL CONUNDRUM</span><i>BLOOM 70 &middot; OKAFOR 70</i></div>' +
      '<div class="fc-clue"><small>The clue, on the card in Dexter&rsquo;s hand</small>&ldquo;You pay it, but it costs you nothing.&rdquo;</div>' +
      '<div class="fc-rack"></div><div class="fc-help">drag a letter to a new place &middot; or click two letters to change them over</div><div class="lx-msg"></div>';
    msgEl = box.querySelector('.lx-msg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    msg('Mr Bloom has given his answer. Miss Okafor has not given hers. She is still looking at the nine letters, and so are you. There is no clock on this one.');
    WK.tiles(box.querySelector('.fc-rack'), {
      key: 'f1', items: BOARD,
      onMove: function () {
        LEX.sfx.flip(); moves++;
        if (moves === 1) msg('Not yet. In the gallery Miss Teague has started to count the seconds of silence. She has reached four.');
        if (moves === 7) msg('Not yet. Miss Teague has reached eleven. Mr Bloom is still smiling at camera two, but only with his mouth.');
      },
      onDone: function (text) { win(text, msg); }
    });
    ER.open('ov-lock', box, function () {
      inFc = false;
      if (!done) ER.say('The nine letters are still up there, and nobody has answered them yet. Click on the big board.');
    });
    inFc = true;
  }
  function win(text, msg) {
    var W = text.toUpperCase(), i;
    done = true; phase = 'done'; ER.flag('fdone', 1); ER.flag('fword', text);
    LEX.learn(text); LEX.sfx.ding();
    msg('Nine letters, one word. Out on the set, somebody presses a buzzer.');
    setTimeout(function () {
      ER.closeAll();
      for (i = 0; i < 9; i++) tile(i, text.charAt(i), true);
      buzzer('J', true); LEX.sfx.press(); ER.mood('calm');
      try { if (ER.track && ER.music()) ER.track.sting('solved'); } catch (e) {}       /* the fanfare; the music then holds its breath while the story ends */
      ER.narrate([
        'Joy&rsquo;s buzzer. &ldquo;' + W.charAt(0) + text.slice(1) + ',&rdquo; she says. &ldquo;You pay ' + text + '.&rdquo;',
        'Dexter breaks the red wax and opens the envelope that nobody has touched since noon. He holds the card up to camera one. ' + W + '.',
        'Mr Bloom takes off his microphone, puts it down on his desk and walks off the set. It takes him a good deal longer than one second.'
      ], function () {
        cls('#fB', 'gone'); buzzer('J', false); LEX.sfx.clap(3.4);
        ER.narrate([
          'Afterwards Maxine Teague comes down from the gallery with three old memos in her hand. &ldquo;Nora,&rdquo; she says. &ldquo;Kindly explain.&rdquo; It is the first time in nine weeks that anybody has listened to Mrs Pryce.',
          '&ldquo;The word on Dexter&rsquo;s card was never the final word,&rdquo; says Mrs Pryce. &ldquo;It was round three of practice set 14. So was the rest of it. Round one says LISTEN, if you read down the first letters, and round two says why. You have all played that set nine Fridays running.&rdquo;',
          'Then she sends you to find Dexter some water without bubbles. This time there is a whole box of it, under her desk.'
        ], finish);
      });
    }, 1700);
  }

  /* ---------- the numbers ---------- */
  function finish() {
    var st = ER.state(), mins = LEX.minutes(), hn = ER.hintsUsed();
    $('#d-time').textContent = 'You had twenty-nine minutes to open the building. You took ' + mins + (mins === 1 ? ' minute' : ' minutes') +
      (mins > 29 ? ', and LEX was kind enough not to notice.' : '.');
    $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' words.';
    $('#d-hints').textContent = hn ? 'You asked for ' + hn + (hn === 1 ? ' hint.' : ' hints.') : 'You did not ask for a single hint.';
    $('#confetti').innerHTML = CF;
    $('#done').classList.add('on');
    try { if (ER.track && ER.kicked) ER.track.play(SOUND); else ER.sfx.ok(); } catch (e) {}      /* and the show's tune comes back for the last card */
  }
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* the report for school: the one part nobody can open for you */
  $('#b-report').addEventListener('click', function () {
    var saved = ER.flag('report') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>Work experience &middot; week 1</h4><h3>My report: Friday at Studio Two</h3>' +
      '<label for="r1">1. What happened at 7.31, and who made it happen? Write it in order.</label><textarea id="r1"></textarea>' +
      '<label for="r2">2. How did Mr Bloom know the word OVERHEARD? Begin with &ldquo;Because&rdquo;.</label><textarea id="r2"></textarea>' +
      '<label>3. Was Mrs Pryce right to lock everybody in?</label><div class="yn"><label><input type="radio" name="yn" value="yes"> Yes</label><label><input type="radio" name="yn" value="no"> No</label></div>' +
      '<textarea id="r3" placeholder="Because&hellip;"></textarea>' +
      '<label for="r4">Signed (the runner)</label><input type="text" id="r4" maxlength="60">' +
      '<div class="count"></div><div class="foot"><span>Saved in this browser as you type.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > label');
    ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { box.querySelector('#' + k).value = saved[k] || ''; });
    if (saved.yn) { var r = box.querySelector('input[value=' + saved.yn + ']'); if (r) r.checked = true; }
    function keep() {
      var o = {}, n = 0, c = box.querySelector('input[name=yn]:checked');
      ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { o[k] = box.querySelector('#' + k).value; });
      o.yn = c ? c.value : '';
      ['r1', 'r2', 'r3'].forEach(function (k) { n += (o[k].match(/[A-Za-z’']+/g) || []).length; });
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('report', o);
    }
    box.addEventListener('input', keep); box.addEventListener('change', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });

  function hints() {
    if (inFc) return ['f1', [
      'Look at the end of the word first. Four of the nine letters are already standing where they belong.',
      'The word ends in -TION. Five letters are left for the beginning, and two of those five are T.',
      'It begins with A. A teacher asks you to pay it. So did Mrs Pryce, for nine weeks.'
    ]];
    return null;
  }
})();
</script>
</body>
</html>
