<style>
  body{--bg:#0b100f;--accent:#f4e04d;--font-display:'Bebas Neue',sans-serif;--font-ui:'Oswald',sans-serif;--font-body:'Courier Prime',monospace;
    --tc-bg:rgba(7,9,9,.95);--tc-ink:#efece0;--cap-bg:rgba(9,11,11,.93);--panel:#15181a;--face-bg:#20262a;--q-ink:#f4e04d;--fade:#030404;--hud-bg:rgba(9,11,11,.74)}
  .tc-room{letter-spacing:.07em}
  .tc-text,.cap{font-size:clamp(17px,1.36vw,21px)}
  .sg{font-family:'Bebas Neue',sans-serif;text-anchor:middle}
  .led{font-family:'VT323',monospace;text-anchor:middle}
  .stn{font-family:'Stardos Stencil',serif;font-weight:700;text-anchor:middle}
  .nm{font-family:'Oswald',sans-serif;font-weight:500;text-anchor:middle;letter-spacing:2px}
  #leaf1,#leaf2{transform-box:fill-box;transform-origin:0 50%;transition:transform 1.3s cubic-bezier(.6,0,.3,1)}
  #leaf1.open,#leaf2.open{transform:scaleX(.09)}
  .fig{opacity:0;pointer-events:none;transition:opacity .9s .7s}
  .fig.on{opacity:1;pointer-events:auto}
  .lampd{fill:#d8271a;animation:lampd 1.6s steps(1,end) infinite}
  .lampd.ok{fill:#3ddc6a;animation:none}
  @keyframes lampd{50%{fill:#5a120c}}
  #door2.knock #leaf2{animation:knock 4.2s steps(1,end) infinite}
  @keyframes knock{0%,6%,12%{transform:translateX(2px)}3%,9%,15%,100%{transform:none}}
  #bulbMid{animation:flick 5.3s steps(1,end) infinite}
  @keyframes flick{0%{opacity:1}71%{opacity:.25}73%{opacity:1}77%{opacity:.4}79%{opacity:1}}
  #lexEye{animation:eye 2.4s ease-in-out infinite}
  @keyframes eye{50%{opacity:.35}}
  .scr text{fill:#f4e04d}
  .scr .dim{opacity:.5}
  .scr.wait text{opacity:.3}
  .scr.won text{fill:#3ddc6a}
  .scr.live .rnd{animation:rnd 1.1s steps(1,end) infinite}
  @keyframes rnd{50%{opacity:.35}}
  #stairGlow{animation:eye 3.6s steps(8,end) infinite}

  /* round 1: the vowels have gone */
  .mv{width:min(860px,94vw)}
  .mv-eg{margin:7px 0 0;font-family:'VT323',monospace;font-size:21px;letter-spacing:.08em;color:#d9d5c8}
  .mv-eg u{text-decoration:none;color:#f4e04d}
  .mv-rows{margin-top:4px;font-family:'Bebas Neue',sans-serif;font-size:35px;--wk-line:#f4e04d;--wk-bad:#ff5a4a;--wk-hit:#f4e04d}
  .mv-row{display:flex;align-items:center;margin:5px 0}
  .mv-row em{width:32px;font-style:normal;font-family:'VT323',monospace;font-size:24px;opacity:.5}
  .mv .wk-gap .wk-part{margin-right:.5em}
  .mv .wk-gap .wk-cell{width:1.06em;height:1.2em;margin:0 2px;padding-top:.09em;border-radius:4px;border-bottom:0;line-height:1}
  .mv .wk-gap .wk-cell.given{background:#f4e04d;color:#0b0c0e}
  .mv .wk-gap .wk-cell.blank{background:#1c1d21;color:#fff;box-shadow:inset 0 -3px 0 #f4e04d}
  .mv .wk-gap .wk-cell.blank.cur{background:#44464d;box-shadow:inset 0 0 0 2px #fff}
  .mv .wk-gap.bad .wk-cell.blank{color:#ff5a4a}
  .mv .wk-gap.ok .wk-cell{width:1.06em;margin:0 2px;background:#f4e04d;color:#0b0c0e;box-shadow:none}
  .mv-keys{display:flex;justify-content:center;margin-top:10px}
  .mv-key{width:60px;height:60px;margin:0 7px;border-radius:50%;font-family:'Bebas Neue',sans-serif;font-size:33px;line-height:1;padding-top:4px;color:#141518;
    background:radial-gradient(circle at 35% 30%,#fff7b0,#f0c416 60%,#806408);box-shadow:0 5px 0 #4a3a04,0 9px 14px rgba(0,0,0,.5)}
  .mv-key:active{transform:translateY(4px);box-shadow:0 1px 0 #4a3a04}
  .mv-key.bk{color:#f1eee2;background:radial-gradient(circle at 35% 30%,#8d8f96,#4a4c52 60%,#1f2023);box-shadow:0 5px 0 #0e0e10,0 9px 14px rgba(0,0,0,.5)}

  /* round 2: odd one out */
  .oo{width:min(880px,94vw)}
  .oo-run{display:flex;justify-content:center;margin:12px 0 0}
  .oo-slot{display:grid;place-items:center;width:150px;height:42px;margin:0 5px;padding-top:3px;border:2px dashed rgba(244,224,77,.4);border-radius:5px;
    font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.08em;line-height:1;color:rgba(244,224,77,.5)}
  .oo-slot.on{background:#f4e04d;border-style:solid;border-color:#f4e04d;color:#0b0c0e}
  .oo-slot.cur{border-style:solid;border-color:#fff}
  .oo .lx-why{min-height:160px}
</style>

    }
    function pressWord(w, b) {
      if (hold) return;
      if (!ER.check('odd' + (qi + 1), w)) { fail(Q[qi].miss); return; }
      LEX.sfx.ding(); row.classList.add('lock'); b.classList.add('hit'); picked = w;
      msg(LEX.yes() + ' says the door. &ldquo;And why?&rdquo;');
      LEX.because(play, LEX.shuffle(Q[qi].why), pressWhy);
    }
    function pressWhy(id) {
      if (hold) return;
      var o = Q[qi].why.filter(function (x) { return x[0] === id; })[0];
      if (!ER.check('why' + (qi + 1), id)) { fail(o[2]); return; }
      LEX.sfx.ding(); run.push(picked);
      if (qi === 0) newWords(Q[0].sets[vr[0]].filter(function (w) { return w !== picked; }));
      qi++;
      if (qi >= 5) { draw(); win2(msg); return; }
      msg(LEX.yes() + ' ' + o[2] + ' ' + (qi === 4 ? 'One more.' : (5 - qi) + ' more.'));
      draw();
    }
    msg('&ldquo;Fingers on buzzers!&rdquo; Somebody on the other side of the door has stopped knocking to listen.');
    draw();
    ER.open('ov-lock', box, function () { inR2 = false; ER.mood('calm'); });
    inR2 = true; ER.mood('tense');
  }
  function win2(msg) {
    r2 = true; ER.flag('r2', 1); busy = true;
    outKey = run.join('-'); if (!ER.exitOk([outKey])) outKey = null; ER.flag('out', outKey);
    ER.addClue('odd', 'Round 2: the five odd ones out', '<h4>LEX &middot; Round 2 &middot; Odd one out</h4><p class="big">' + run.map(function (w) { return w.toUpperCase(); }).join(' &middot; ') +
      '</p><p>Five in a row. Green room open.</p>', 'lexlog', 'Door screen', true);
    msg('Five in a row. The five odd words stay on the screen, side by side. The door does not wait for you to read them.');
    setTimeout(function () {
      ER.closeAll(); LEX.sfx.door(); ER.sfx.ok(); paint(); busy = false;
      ER.say('The green door opens. A thin man in a brown jacket steps out and stands by the stairs. Behind him, in the doorway, a woman in a yellow cardigan takes her fingers out of her ears.');
    }, 2800);
  }

  /* ---------- three people ---------- */
  function hear(k, line) {
    return function (seen) {
      if (!seen || heard[k]) return;
      heard[k] = 1; ER.flag('heard', heard); paint();
      if (line && !allHeard()) ER.say(line);
    };
  }
  $('#fDex').addEventListener('click', function () {
    if (busy) return;
    LEX.talk('dex', [
      'At last! Eleven years I have presented this programme, my friend, and I have never once been locked in by my own quiz.',
      { q: 'Are you all right, Mr Valentine?', a: 'No! Look at this water. Bubbles! I said STILL water. I have said it twice more since you left, in there, to nobody at all. A voice like mine cannot work on bubbles.' },
      { q: 'What were you doing when the door locked?', a: 'What I do every Friday at this time. My cards. I say every card out loud to the mirror until it is perfect, and I keep the last card for last. Mrs Pryce writes the hard words the way they sound, bless her.' },
      { q: 'What is on the last card?', a: 'The final word, of course. Nine letters, and tonight&rsquo;s is a beauty. But I cannot tell YOU. Rule one: nobody hears the final word before three minutes to nine.' },
      'Now run along and open the others. And water, my friend. Still. S, T, I, L... still.'
    ], { id: 'dex', title: 'Dexter Valentine, at his door', kind: 'What he said' },
    hear('dex', 'He goes back to his mirror and leaves the door open. &ldquo;Oh-vuh-HURD,&rdquo; says the big warm voice. &ldquo;Oh-vuh-HURD.&rdquo; Along the corridor, the screen beside the green room has woken up.'));
  });
  $('#fBloom').addEventListener('click', function () {
    if (busy) return;
    LEX.talk('bloom', [
      'Ah, the runner. Thank you. I was beginning to think I should have to win from in there.',
      { q: 'Were you worried, Mr Bloom?', a: 'By a locked door? I have spent nine Fridays in that room. One sits quietly, one reads, one waits for eight o&rsquo;clock. I had hardly noticed the door.' },
      { q: 'How do you win so quickly?', a: 'People do ask. I read the dictionary in the bath. There is no trick to it at all.' },
      'Now be kind, and find poor Dexter a bottle of still water before he bursts. Bubbles! The man has talked about nothing else for ten minutes.'
    ], { id: 'bloom', title: 'Barnaby Bloom, by the stairs', kind: 'What he said' },
    hear('bloom', 'Mr Bloom looks at his watch, and then, for a moment, at the open door of Dressing Room 1.'));
  });
  $('#fJoy').addEventListener('click', function () {
    if (busy) return;
    LEX.talk('joy', [
      'Joy Okafor. I drive the number 49 bus in Leeds, and I have never been this far from it.',
      { q: 'Are you nervous?', a: 'Of him? He answers in one second, they say. I can&rsquo;t do that. I have to look at the letters first. I like looking at them.' },
      { q: 'Was that you, singing?', a: 'It was. You can hear everything through that wall, did you know? Every word Mr Valentine says to his mirror. It did not seem right to listen, so I put my fingers in my ears and sang.' },
      'Mr Bloom told me he had not heard a thing. He must have very good manners. Or very bad ears.'
    ], { id: 'joy', title: 'Joy Okafor, at the green-room door', kind: 'What she said' },
    hear('joy', 'She looks down the corridor at the red door, and puts one finger back in one ear.'));
  });

  /* ---------- hints ---------- */
  var H1 = {
    v1: ['Two words: the people who sit in the studio and watch while a programme is being made. The first word says that they are really there.', 'The first word is the opposite of &ldquo;recorded&rdquo;. The second begins with A and U.'],
    v2: ['One person asks the questions, and a famous person answers them.', 'It begins with I, and it ends in -VIEW.'],
    v3: ['The words at the bottom of the screen that tell you what people are saying.', 'The first missing letter is U. SUB- means &ldquo;under&rdquo;.'],
    v4: ['Two words: a programme in which singers and dancers try to win.', 'The first word means &ldquo;being very good at something&rdquo;. It goes T, A, L ...'],
    v5: ['One part of a series. You watch one of these each week.', 'It begins with E, and it ends with E.'],
    v6: ['The person who sits at a desk and tells you what has happened today.', 'Two words joined into one: NEWS, and somebody who reads.']
  };
  var H2 = [
    ['Look at the ends of the words, not the beginnings.', 'Three of them end in the same four letters, which mean &ldquo;without&rdquo;. The fourth has an ending of its own.'],
    ['What kind of word is each one? Could you point at a person and say it?', 'Three of them stand in for people: you use them instead of a name. One only ever goes in front of another word.'],
    ['Think about what you can do with each thing.', 'Three of them are made to open and shut. One is made to stay shut for ever.'],
    ['Do not look at the letters. Think about time: now, or yesterday?', 'Three are past forms. You say them about yesterday. One is about now.'],
    ['Do not read them. Say them aloud.', 'Three of them rhyme with each other. One has a different sound in the middle: it rhymes with &ldquo;years&rdquo;.']
  ];
  function hints() {
    var k;
    if (!r1) {
      if (inR1) { k = cur1(); return [k, H1[k]]; }
      return ['r1', [
        'Every locked door has a yellow screen beside it. The screens want a player, and you are the only one in the corridor. Click on the screen beside the red door.',
        'It is a missing vowels round: LEX shows only the consonants. Put the vowels back, one word at a time, from the top.'
      ]];
    }
    if (inR2 && !r2) return ['o' + qi, H2[Math.min(qi, 4)]];
    if (!heard.dex) return ['dex', [
      'Dressing Room 1 is open, and Mr Valentine is standing in the doorway. Click on him.',
      'Keep clicking Next until he has finished. He tells you more than he means to.'
    ]];
    if (!r2) return ['r2', [
      'The screen beside the green door has woken up. Click on it.',
      'Four words on four buzzers. One does not belong with the other three. Press its buzzer, then choose the reason.'
    ]];
    if (!heard.bloom || !heard.joy) return ['fin', [
      'Two people have come out of the green room. Click on each of them: the man by the stairs, and the woman in the doorway.',
      'Listen to what Mr Bloom says about the water, and to what Miss Okafor says about the wall. Do the two things fit together?'
    ]];
    return ['go', [
      'Everybody down here is free. The gallery is at the top of the stairs: use the yellow button at the bottom of the screen.',
      'Before you go, the yellow call sheet and the newspaper cutting on the pinboard are worth a minute each.'
    ]];
  }
})();
</script>
</body>
</html>
