<style>

  .tc-room{font-family:'Cinzel',serif;font-size:clamp(44px,6vw,82px);color:#f0cf7a;letter-spacing:.04em}
  .sC{font-family:'Cinzel',serif;text-anchor:middle}
  .sG{font-family:'EB Garamond',serif;text-anchor:middle}
  /* the story has stopped: nothing in the hall moves, and Alice is a little paler than life */
  #alice.frozen{opacity:.8;filter:grayscale(.55)}
  .flame{transform-box:fill-box;transform-origin:50% 100%}
  #scene.live .flame{animation:fl 1.3s steps(3,end) infinite}
  #scene.live .flame.f2{animation-duration:1.7s}
  @keyframes fl{0%{transform:scaleY(1)}50%{transform:scaleY(1.18) scaleX(.9)}100%{transform:scaleY(.94)}}
  .strip-h{cursor:pointer}
  .strip-h rect{animation:sh 2.6s steps(2,end) infinite}
  @keyframes sh{50%{filter:brightness(1.18)}}
  .strip-h.got{display:none}
  #book.ready{animation:glowb 1.4s steps(1,end) infinite}
  #rabbit.ready,#bottle.ready{animation:glowb 1.6s steps(1,end) infinite}
  @keyframes glowb{50%{filter:brightness(1.35)}}
  #rabbit.gone{display:none}
  #pool{transform:translateY(260px);transition:transform 4s steps(10,end)}
  #scene.flood #pool{transform:translateY(0)}

  /* the torn page and its pieces */
  .mend{width:min(1260px,97vw);display:grid;grid-template-columns:1fr 1fr;gap:16px;-webkit-user-select:none;user-select:none}
  .mend .pg2{background:#f4ecd6;color:#2a2018;padding:12px 18px 10px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 50px rgba(120,90,40,.2);
    clip-path:polygon(0 0,100% 0,99% 6%,100% 12%,98.6% 19%,100% 27%,99% 35%,100% 44%,98.8% 52%,100% 61%,99% 70%,100% 78%,98.6% 87%,100% 94%,99% 100%,0 100%);
    -webkit-clip-path:polygon(0 0,100% 0,99% 6%,100% 12%,98.6% 19%,100% 27%,99% 35%,100% 44%,98.8% 52%,100% 61%,99% 70%,100% 78%,98.6% 87%,100% 94%,99% 100%,0 100%)}
  .mend h5{margin:0 0 4px;font-family:'Goudy Bookletter 1911',serif;font-weight:normal;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#7a6a4a;text-align:center}
  .mend .prev{margin:0 0 6px;font-family:'EB Garamond',serif;font-size:14.5px;line-height:1.25;color:#5a4a3a;font-style:italic}
  .slot{position:relative;display:flex;align-items:stretch;min-height:44px;margin:0 0 4px;border-bottom:1px dashed #b8a47a}
  .slot i{flex:0 0 26px;font-style:normal;font-family:'Cinzel',serif;font-size:14px;color:#9a7a4a;padding-top:12px}
  .slot.bad{background:#f2c8b8}
  .slot.empty:after{content:'';flex:1}
  .tray{background:#2e2216;border:1px solid #6a5232;padding:8px 10px;align-content:start;min-height:200px}
  .tray h5{color:#d8c08a}
  .pocket{display:block;margin-top:8px;border:2px dashed #b8902e;background:#3a2a1a;padding:6px 8px 4px;min-height:58px;border-radius:0 0 18px 18px}
  .pocket h6{margin:0 0 3px;font-family:'Goudy Bookletter 1911',serif;font-weight:normal;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:#e9c75a}
  .pocket.bad{background:#6a2a1a}
  .strip{display:block;flex:1;margin:2px 0 4px;padding:4px 9px 3px;background:#fbf6e6;color:#2a2018;font-family:'EB Garamond',serif;font-size:14.2px;line-height:1.22;
    box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:grab;clip-path:polygon(0 4%,3% 0,30% 6%,62% 0,100% 5%,99% 50%,100% 96%,70% 100%,40% 94%,8% 100%,0 96%);
    -webkit-clip-path:polygon(0 4%,3% 0,30% 6%,62% 0,100% 5%,99% 50%,100% 96%,70% 100%,40% 94%,8% 100%,0 96%)}
  .slot .strip{margin:2px 0 2px}
  .strip.held{background:#ffe9a0}
  .strip.fly{position:fixed;z-index:200;pointer-events:none;opacity:.92}
  .mend .bn-foot{grid-column:1/3;margin-top:2px}
  @media (max-height:820px){.strip{font-size:13.4px}.slot{min-height:40px}.mend .prev{font-size:13.5px}}
</style>

    if (nextFile) return ['go', ['The page is mended, and the hall is filling with tears. Swim: the button is at the bottom of the screen.']];
    if (lock && lock.parentNode) return ['mend', [
      'Begin at the beginning: one strip finds nothing yet and has no word that points back. Then look for the words that do point back: “on the second time round”, “this time”, “soon”, “just then”.',
      'Follow two things through the whole page: the key (is it on the table? does Alice have it?) and Alice’s size. A strip where she is small comes after the strip where she drinks; a strip where she grows comes after the strip where she eats.',
      'One strip says “Once more” and talks about a piece of mushroom. There has been no mushroom in this hall: that strip belongs to a later chapter. Put it in your pocket, and keep it.'
    ]];
    if (!told.has('rabbit')) return ['rabbit', [
      'Somebody in a jacket and waistcoat has just popped out of a doorway on the left. Click the White Rabbit.',
      'He is in a great hurry, but he knows what has happened to the story. Hear him out to the end.'
    ]];
    if (count() < 10 || !told.has('label')) return ['pieces', [
      'Strips of the torn page are lying all over the hall. You have ' + count() + ' of the ten. Look high and low: floor, lamps, doors, furniture.',
      'One is on a lamp near the roof, one in a keyhole, two at the glass table, one behind the red curtain, one in the heap of leaves where you landed.',
      'The Rabbit also said there was a label under the glass table. Click the little bottle and read it: it tells you how to put a page back together.'
    ]];
    return ['book', ['Every strip is in your hands. Click the torn book on the floor, on the right.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say('The hall is a lake of tears, and the story is moving again.'); return; }
    if (told.has('in')) { busy = false; ER.say('The hall of doors. Nothing moves, except you.'); return; }
    told.set('in');
    ER.narrate([
      'Thump! You land on a heap of sticks and dry leaves, exactly where Alice landed, and you are not a bit hurt.',
      'You are in a long, low hall, lit by a row of lamps hanging from the roof. There are doors all round it. Alice is standing in the middle of it, quite still, like a girl in a picture.',
      'She does not move. The lamp flames do not flicker. Even the dust in the air hangs still. The story has stopped, because the next page is missing.',
      'And then something does move: a white rabbit in a jacket pops out of a doorway on the left, takes a watch out of its waistcoat-pocket, looks at it, and gives a little scream.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the White Rabbit ---------- */
  $('#rabbit').addEventListener('click', function () {
    if (busy || told.has('rabbit')) return;
    ER.talk({
      who: 'The White Rabbit', role: 'In a great hurry', face: AL.face('rabbit', '#e8dcc0'),
      lines: [
        { note: 'He has pink eyes, a red jacket and a yellow waistcoat, and he is looking at his watch as if it had been rude to him.', a: '<span class="bk">“Oh my ears and whiskers, how late it’s getting!”</span>' },
        { q: 'Excuse me. What has happened to everything?', a: 'Pages! Somebody has been tearing pages out of the book, and when a page is missing, the story simply stops. Look at her. She has been standing like that, as still as a picture, since the end of Chapter One.' },
        { q: 'Who are you talking to?', a: 'You, Mary Ann, of course! Anybody who is not in the book must be Mary Ann. And don’t argue: there isn’t time. There is never time.' },
        { q: 'Who tore the pages out?', a: 'That Cat, I shouldn’t wonder. Things vanish, and so does it. And if this story never gets to the trial, the Queen will want to know why, and then … oh my dear paws! She’ll have my head off, as sure as ferrets are ferrets!' },
        { q: 'What can I do?', a: 'Mend it, Mary Ann! The pieces are all over the hall. Pick up every one, and put them back the right way round. There is a label under that glass table that may help a person who can read.' },
        { note: 'He is already running.', a: '“Quick, now! And if a piece doesn’t fit, keep it. Never throw away a page!” And he skurries away into the darkness as hard as he can go.' }
      ],
      clue: { id: 'rabbit', title: 'The White Rabbit, in a hurry', kind: 'What he said' },
      done: function (seen) { if (seen && told.set('rabbit')) { paint(); ER.say('Ten strips of paper, somewhere in this hall. And a label under the glass table.'); } }
    });
  });

  /* ---------- the label, and the strips ---------- */
  var LABEL = '<h4>READ ME</h4>' +
    '<p>A story is a chain: each <b>event</b> holds on to the next, so its pieces can only go one way. That order is called the <b>sequence</b>. If the pages have come loose, the words on them will tell you the order.</p>' +
    '<ol><li><b>Time words</b> point back: <i>soon</i>, <i>after a while</i>, <i>just then</i>, <i>this time</i>, <i>once more</i>. Ask what has just happened.</li>' +
    '<li><b>Cause and effect</b>: a thing is found before it is used, and a door is seen before anybody opens it.</li>' +
    '<li><b>What a person has and knows</b>: nobody can forget a key that she never had.</li>' +
    '<li><b>How things are</b>: if somebody is small in one place and tall in the next, something has happened in between.</li></ol>' +
    '<p class="last">A piece that fits nowhere may belong to another chapter of the <b>plot</b>. Do not throw it away.</p>';
  function readLabel() {
    ER.read({ html: LABEL, cls: 'label', clue: { id: 'label', title: 'READ ME', kind: 'A label on a bottle' }, done: function () {
      AL.terms(['event', 'sequence', 'time word', 'cause and effect', 'plot', 'chapter']);
      if (told.set('label')) { paint(); ER.say(count() >= 10 ? 'Ten strips, and the rules for putting them back. The torn book is on the floor.' : 'Not DRINK ME: READ ME. Now find every strip of the page.'); }
    } });
  }
  $('#bottle').addEventListener('click', function () {
    if (busy) return;
    if (!told.has('rabbit')) { ER.say('A little bottle under the glass table, with a paper label round its neck. Somebody is making a great deal of noise on the left.'); return; }
    readLabel();
  });
  ER.$$('.strip-h').forEach(function (n) {
    n.addEventListener('click', function (e) {
      if (busy) return;
      e.stopPropagation();
      var id = n.getAttribute('data-s');
      if (!told.has('rabbit')) { ER.say('A strip of paper with printing on it, torn along one side. Somebody is making a great deal of noise on the left.'); return; }
      if (got[id]) return;
      got[id] = 1; ER.flag('h-got', got); AL.sfx.page(); paint();
      if (id === 'k') {
        ER.addClue('jam', 'A sticky red fingerprint', '<h4>A sticky red fingerprint</h4><p>On the back of one strip of the torn page (the one where Alice has forgotten the key), there is a red fingerprint. It is sticky, and it smells of strawberries.</p><p>Whoever tore the page had red, sticky fingers.</p>', 'evid', 'Evidence');
        ER.say('On the back of this strip there is a red fingerprint. It is sticky, and it smells of strawberries. ' + count() + ' of 10.');
      } else if (id === 'z') ER.say('This strip was stuck to a door at the far end of the hall, as if it had blown in from somewhere else. ' + count() + ' of 10.');
      else ER.say(count() < 10 ? 'A strip of the torn page. ' + count() + ' of 10.' : 'That is all ten. Now: the torn book, on the floor.');
    });
  });

  /* ---------- things in the hall ---------- */
  AL.thing('#heap', 'leaves', 'The heap of sticks and dry leaves that stopped your fall, and Alice’s before you.', isBusy);
  AL.thing('#doorsL,#doorsR', 'door', 'You try a door. Locked. You try another. Locked. Every door in the hall is locked, just as the book says.', isBusy);
  AL.thing('#table', 'key', function () { return nextFile ? 'The glass table. The tiny golden key is on it again, “as before”.' : 'A little three-legged table, all made of solid glass. There is nothing on it except a tiny golden key, which will not move: the story has not got that far.'; }, isBusy);
  AL.thing('#curtain', 'curtain', 'Behind a low curtain, a little door about fifteen inches high. Through the keyhole: the loveliest garden you ever saw.', isBusy);
  AL.thing('#lamps', 'lamp', function () { return nextFile ? 'The lamp flames are flickering again.' : 'A row of lamps hanging from the roof. Their flames stand quite still, like flames in a picture.'; }, isBusy);
  $('#alice').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? 'Alice is very small again, and swimming.' : 'Alice does not see you. Her mouth is half open, as if she were about to say something, and has been about to say it for a very long time.');
  });
  $('#book').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The book on the floor is whole again, as far as the end of the hall.'); return; }
    if (!told.has('rabbit')) { ER.say('A book lying open on the floor. Somebody is making a great deal of noise on the left.'); return; }
    if (!ready()) { ER.say(count() < 10 ? 'The book, open at a ragged edge where a page was torn out. You have ' + count() + ' of the ten strips.' : 'The book, open at the torn page. Read the label under the glass table first.'); return; }
    openLock();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the torn page ---------- */
  function stripEl(id) { var d = ER.el('div', 'strip dnd-item'); d.setAttribute('data-s', id); d.innerHTML = ER.gloss(STRIPS[id]); return d; }
  function openLock() {
    var busyL = false, misses = 0, i;
    lock = ER.el('div', 'mend');
    var s = '<div class="pg2"><h5>Chapter I · Down the Rabbit-Hole · the torn page</h5>' +
      '<p class="prev">… she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.</p>';
    for (i = 0; i < 9; i++) s += '<div class="slot" data-n="' + i + '"><i>' + (i + 1) + '</i></div>';
    s += '</div><div><div class="tray"><h5>The ten strips</h5></div><div class="pocket slot" data-n="p"><h6>Your pocket: a strip from another chapter</h6></div></div>' +
      '<div class="bn-foot"><p class="bmsg"></p><button type="button" class="btn" id="paste">Press the page flat</button></div>';
    lock.innerHTML = s;
    var tray = lock.querySelector('.tray'), slots = ER.$$('.slot', lock), m = lock.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    var put = ER.flag('h-put') || {};
    ORDER.forEach(function (id) {
      var c = stripEl(id), at = put[id], sl = at == null ? null : lock.querySelector('.slot[data-n="' + at + '"]');
      if (sl && !sl.querySelector('.strip')) sl.appendChild(c); else tray.appendChild(c);
    });
    function keep() {
      put = {}; slots.forEach(function (sl) { var c = sl.querySelector('.strip'); if (c) put[c.getAttribute('data-s')] = sl.getAttribute('data-n'); });
      ER.flag('h-put', put);
    }
    AL.swapIn(lock, '.strip', '.slot', tray);
    ER.dnd(lock, { item: '.strip', slot: '.slot', home: tray, lock: function () { return busyL || !!nextFile; },
      change: function () { keep(); slots.forEach(function (sl) { sl.classList.remove('bad'); }); } });
    lock.querySelector('#paste').addEventListener('click', function () {
      if (busyL || nextFile) return;
      var ids = [], i, c, pk = lock.querySelector('.pocket .strip'), empty = 0;
      for (i = 0; i < 9; i++) { c = slots[i].querySelector('.strip'); ids.push(c ? c.getAttribute('data-s') : ''); if (!c) empty++; }
      if (empty || !pk) { ER.sfx.no(); msg(empty ? 'The page still has ' + (empty === 1 ? 'a hole' : empty + ' holes') + ' in it. Every line of the page needs a strip, and your pocket needs one too.' : 'Nine strips are on the page. The Rabbit said: if a piece does not fit, keep it. Put the tenth in your pocket.'); return; }
      AL.sfx.page();
      for (i = 0; i < 9; i++) if (!ER.check('o' + (i + 1), ids[i])) {
        misses++; slots[i].classList.add('bad'); ER.shake(slots[i]); ER.sfx.no();
        msg('The page will not lie flat: line ' + (i + 1) + ' is wrong. ' + WHY[ids[i]] + (misses > 2 ? ' (Only the first wrong line is ever shown.)' : ''));
        return;
      }
      if (!ER.check('pk', pk.getAttribute('data-s'))) {
        misses++; lock.querySelector('.pocket').classList.add('bad'); ER.sfx.no();
        msg('Nothing in the strip in your pocket is from another chapter: it belongs in the hall. Which strip talks about a mushroom?');
        return;
      }
      var file = ER.exitOk([ids.join('-') + '.' + pk.getAttribute('data-s')]);
      if (!file) { msg('The page will not lie flat. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('h-file', file); busyL = true;
      var st = ER.state(); st.done = st.done || {}; st.done.hall = 1; ER.persist(true);
      msg('The strips knit together along their torn edges, and the page lies flat. Somewhere a lamp flame gives a little jump.');
      setTimeout(function () { ER.closeAll(); AL.solved(); after(); }, 2600);
    });
    msg(misses ? '' : 'Drag each strip onto a line of the torn page, or click a strip and then a line. One strip goes in your pocket. Then press the page flat.');
    ER.open('ov-lock', lock);
  }

  function after() {
    busy = true; paint();
    AL.mine('order', 'The torn page, mended', '<p>1 doors, all locked · 2 the glass table and the key · 3 “on the second time round”: the curtain and the little door · 4 “back to the table”: DRINK ME · 5 shutting up like a telescope · 6 the key forgotten, out of reach · 7 “soon”: EAT ME · 8 “Curiouser and curiouser!” · 9 “just then”: nine feet high.</p><p>In my pocket: the strip that says “Once more she found herself in the long hall”. It is from a later chapter. Keep it.</p>');
    ER.addClue('pocket', 'The strip in your pocket', '<h4>The strip in your pocket</h4><p class="bk">Once more she found herself in the long hall, and close to the little glass table. “Now, I’ll manage better this time,” she said to herself … Then she went to work nibbling at the mushroom (she had kept a piece of it in her pocket) …</p><p>From a later chapter. The Rabbit said: never throw away a page.</p>', 'pg', 'A loose strip', true);
    ER.narrate([
      'Alice blinks. The lamps flicker. And then the story runs on, in the right order, as fast as pages turning: she tries every door, finds the key, finds the little door, drinks, shuts up like a telescope, forgets the key, cries, eats the cake, and opens out until her head bumps the roof.',
      'Then she cries again, and goes on crying, <span class="bk">“shedding gallons of tears, until there was a large pool all round her, about four inches deep and reaching half down the hall.”</span>',
      'The White Rabbit trots back with a pair of white kid gloves and a large fan, sees a girl nine feet high, drops both, and runs. Alice fans herself, shrinks, and begins to recite a poem she learnt in the schoolroom: <span class="bk">“How doth the little—”</span>',
      'And there the story stumbles again. That page has gone too: not torn out this time, but blown away, as if somebody had opened a window. Alice sits with her mouth open, waiting for words that are not there.',
      'Then the water reaches you. <span class="bk">“As she said these words her foot slipped, and in another moment, splash! she was up to her chin in salt water.”</span> So are you. You keep the strip that did not fit, dry, in your pocket.'
    ], function () { busy = false; $('#go').classList.add('on'); AL.sfx.splash(); });
  }
})();
</script>
</body>
</html>
