    exit: {"next":"tea","w":{"aaf5d0cb":"2710587c"}}, tags: {"d1":["0a770302"],"d1@":["8b7c0eae","3637ccf2","04e7f49e"],"d1?":["0f3d266d","f3334c64","7ad94c02"],"d1#":["0caf2965"],"d2":["f85f9dc1"],"d2@":["27d0e0d5","270ab98a","c6bc8255","22c172ef","83dec99a","78d1a225"],"d2?":["35464955","19e90ac6","9dfa3ab3","c49e275d","e362477d","4f84a24c"],"d2#":["5500f4f2"],"d3":["dec3dc94"],"d3@":["8da0b1f2","fdc7d0a5","aecb4402","31ea3515"],"d3?":["b9a6310f","07691c41","8fbe0bc7","d29e28b8"],"d3#":["ab477695"],"d4":["bd79cc49"],"d4@":["f5d53c1f","ee1d18fd","a71c1745","535c7c4c"],"d4?":["422acb93","651d13f0","a4dedbe5","a3fcae01"],"d4#":["23089163"],"d5":["f5f08421"],"d5@":["95ff4410","248bdfc3","6cb3f312","678aaac4","4661614a","c10d4077"],"d5?":["0643a2cd","27d94fa5","a9557304","5fbe14ef","d00271f9","f4b801ac"],"d5#":["af7f464b"],"d6":["fe783f03"],"d6@":["67c2a51e","81a9c792","6f050d42","4a7b3067","7b5f27a6","f74b3ce4"],"d6?":["449485d1","6fc3f537","40c62d7a","8cc8ff84","bf4e5eb0","efe59fba"],"d6#":["d592a1d6"]},

    d5: 'Say “Tortoise” aloud, then say “he ____ us” in the same breath. What does a master do to his class?',
    d6: 'Ten hours the first day, nine the next: the lessons get less every day. Which verb means “get less”, and sounds just like “lessons”?'
  };
  var ON = {
    d1: 'They all sit down at once, in a large ring, with the Mouse in the middle.',
    d2: 'The driest thing the Mouse knows is a history lesson. Dry: not wet. Dry: dull. One word, two meanings, and the party still dripping.',
    d3: 'Tale, tail: two words, one sound. The Mouse means his story. Alice is looking at his tail.',
    d4: 'Not, knot: the Mouse means “I had not!”, and Alice offers to undo a knot.',
    d5: 'Tortoise, taught us. The Mock Turtle thinks Alice is very dull not to hear it.',
    d6: 'Lessons, lessen. Ten hours, nine, eight, and so on, until there are none.'
  };
  function openLock() {
    lock = ER.el('div', 'wet');
    lock.innerHTML = '<div class="leaf"><h5>Chapter III · A Caucus-Race and a Long Tale</h5>' +
      '<p class="ni">They were indeed a queer-looking party that assembled on the bank—the birds with draggled feathers, the animals with their fur clinging close to them, and all dripping wet, cross, and uncomfortable.</p><span class="om">· · ·</span>' +
      '<p>At last the Mouse, who seemed to be a person of authority among them, called out, “Sit down, all of you, and listen to me! <i>I’ll</i> soon make you <span class="wk-gap" data-key="d1"></span> enough!”</p><span class="om">· · ·</span>' +
      '<p>“Ahem!” said the Mouse with an important air, “are you all ready? This is the <span class="wk-gap" data-key="d2"></span> thing I know. Silence all round, if you please! ‘William the Conqueror, whose cause was favoured by the pope, was soon submitted to by the English …’”</p><span class="om">· · ·</span>' +
      '<p>“Mine is a long and a sad tale!” said the Mouse, turning to Alice, and sighing.</p>' +
      '<p>“It <i>is</i> a long <span class="wk-gap" data-key="d3"></span>, certainly,” said Alice … “but why do you call it sad?”</p><span class="om">· · ·</span>' +
      '<p>“I had <i>not!</i>” cried the Mouse, sharply and very angrily.</p>' +
      '<p>“A <span class="wk-gap" data-key="d4"></span>!” said Alice, always ready to make herself useful, and looking anxiously about her. “Oh, do let me help to undo it!”</p></div>' +
      '<div class="leaf"><h5>Two loose pages from Chapter IX · The Mock Turtle’s Story</h5>' +
      '<p class="ni">“When we were little,” the Mock Turtle went on at last, more calmly, though still sobbing a little now and then, “we went to school in the sea. The master was an old Turtle—we used to call him Tortoise—”</p>' +
      '<p>“Why did you call him Tortoise, if he wasn’t one?” Alice asked.</p>' +
      '<p>“We called him Tortoise because he <span class="wk-gap" data-key="d5"></span> us,” said the Mock Turtle angrily: “really you are very dull!”</p><span class="om">· · ·</span>' +
      '<p>“And how many hours a day did you do lessons?” said Alice, in a hurry to change the subject.</p>' +
      '<p>“Ten hours the first day,” said the Mock Turtle: “nine the next, and so on.”</p>' +
      '<p>“What a curious plan!” exclaimed Alice.</p>' +
      '<p>“That’s the reason they’re called lessons,” the Gryphon remarked: “because they <span class="wk-gap" data-key="d6"></span> from day to day.”</p></div>' +
      '<p class="tip">Click a gap and type on your keyboard · Backspace to rub out</p>' +
      '<div class="bn-foot"><p class="bmsg"></p></div>';
    var m = lock.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    ER.glossIn(lock, '.leaf p');
    gp = WK.gaps(lock, {
      mark: false,
      onWord: function (k) { AL.sfx.page(); msg(ON[k]); },
      onMiss: function (k, node, n) { msg(MISS[k] + (n > 2 ? ' (Each gap has exactly as many letters as it has boxes.)' : '')); },
      onDone: done
    });
    msg('Six words have been washed away by tears. Each one is half of a pun. Say the line aloud, and type the word that belongs in the gap.');
    ER.open('ov-lock', lock);
  }
  function done() {
    var file = ER.exit(['dry-driest-tail-knot-taught-lessen'], { wait: true });
    if (!file) { lock.querySelector('.bmsg').textContent = 'The page will not dry. Something is wrong with this page: tell your teacher.'; return; }
    nextFile = file; ER.flag('p-file', file);
    lock.querySelector('.bmsg').innerHTML = ER.gloss('The last word comes back, and the page dries in your hands as if somebody had blown on it. The Mouse stops in the middle of a sigh, and goes on.');
    AL.mine('puns', 'Six puns', '<p>dry (not wet) and dry (dull): one word, two meanings, and “the driest thing I know” is a history lesson.</p><p>tale / tail · not / knot · Tortoise / taught us · lessons / lessen: two words, one sound.</p>');
    setTimeout(function () { ER.closeAll(); after(); }, 2600);
  }
  function tale() {
    var W = ['“Fury said to a', 'mouse, That he', 'met in the', 'house, ‘Let us', 'both go to', 'law: <i>I</i> will', 'prosecute', '<i>you</i>.—Come,', 'I’ll take no', 'denial; We', 'must have a', 'trial: For', 'really this', 'morning I’ve', 'nothing', 'to do.’', 'Said the', 'mouse to', 'the cur,', '‘Such a', 'trial,', 'dear sir,', 'With no', 'jury or', 'judge,', 'would be', 'wasting', 'our', 'breath.’', '‘I’ll be', 'judge,', 'I’ll be', 'jury,’', 'Said', 'cunning', 'old Fury:', '‘I’ll', 'try the', 'whole', 'cause,', 'and', 'condemn', 'you', 'to', 'death.’”'];
    var s = '<h4>The Mouse’s tale, as Alice heard it</h4>';
    W.forEach(function (w, i) {
      var x = 150 + 110 * Math.sin(i / 4.2) - i * 1.2, fs = Math.max(8, 17.5 - i * 0.24);
      s += '<span class="tl" style="padding-left:' + x.toFixed(0) + 'px;font-size:' + fs.toFixed(1) + 'px">' + w + '</span>';
    });
    s += '<p class="cap2">The tale of a dog who wanted a trial, printed in the shape of a tail. Because Alice heard “tail”.</p>';
    return s;
  }
  function after() {
    busy = true; paint();
    ER.read({ html: tale(), cls: 'tale', clue: { id: 'tale', title: 'The Mouse’s tale', kind: 'Chapter III' }, done: function () {
      ER.narrate([
        'And Alice kept on puzzling about it while the Mouse was speaking, so that her idea of the tale was the shape you have just read: a tail.',
        '“I had <i>not!</i>” cries the Mouse, and “A knot!” says Alice, and the Mouse walks away, offended, and will not come back to finish his story. The birds hurry off home when Alice mentions her cat Dinah, and soon she is alone.',
        'Then a little pattering of feet. The White Rabbit comes trotting back, looking anxiously about him: <span class="bk">“The Duchess! The Duchess! Oh my dear paws! Oh my fur and whiskers! She’ll get me executed, as sure as ferrets are ferrets!”</span>',
        'He catches sight of you, and of Alice. <span class="bk">“Why, Mary Ann, what <i>are</i> you doing out here? Run home this moment, and fetch me a pair of gloves and a fan! Quick, now!”</span> And this time, it seems, he means both of you.'
      ], function () { busy = false; $('#go').classList.add('on'); ER.leaveReady = true; });
    } });
