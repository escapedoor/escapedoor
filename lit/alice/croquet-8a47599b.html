  };
  var DECK = ['vanish', 'table', 'heart', 'paws', 'redhands', 'fits', 'crumbsw', 'smell', 'bowed'];
  var WHO = ['The Cheshire Cat is cleared, because …', 'Seven, the gardener, is cleared, because …', 'The Hatter is cleared, because …', 'The Knave of Hearts tore the pages, because …'];
  var BAD = {
    vanish: 'That is the Rabbit’s argument, and it is turned the wrong way round. Two things that vanish need not be one thing: you might just as well say that “I see what I eat” is the same thing as “I eat what I see”. And it is a reason against the Cat, not for clearing him.',
    redhands: 'Red hands are a reason against him, not for clearing him, and not even a good one. Whoever tore the page had red fingers; that does not mean that anybody with red fingers tore the page. Not the same thing a bit! Ask what kind of red it is.',
    crumbsw: 'Crumbs in a watch are a reason against him, not for clearing him. Whoever tore the page dropped crumbs; not everybody with crumbs tore the page. And his were bread crumbs, from the bread-knife: the crumbs in the pool were pastry.',
    heart: 'Turned round again. The fingerprint was red; that does not make every red card guilty. Ten royal children are ornamented with hearts. One clue that fits somebody proves nothing.',
    bowed: 'Bowing and smiling proves nothing at all. The Queen called him an idiot for it. A warrant needs evidence.'
  };
  function openLock() {
    var busyL = false, misses = 0, i;
    ER.mood('tense');
    lock = ER.el('div', 'war');
    var s = '<div class="parch"><h5>By order of the King of Hearts</h5><h3>Who tore the pages?</h3>';
    for (i = 0; i < 4; i++) s += '<div class="row"><b>' + WHO[i] + '</b><div class="rs" data-n="' + i + '"></div></div>';
    s += '</div><div class="deck"><h5>Reasons</h5></div><div class="bn-foot"><p class="bmsg"></p><button type="button" class="btn" id="sign">Seal the warrant</button></div>';
    lock.innerHTML = s;
    var deck = lock.querySelector('.deck'), rows = ER.$$('.rs', lock), m = lock.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    var put = ER.flag('q-put') || {};
    DECK.forEach(function (id) {
      var c = ER.el('div', 'rc dnd-item'); c.setAttribute('data-r', id); c.innerHTML = ER.gloss('… ' + RC[id]);
      var at = put[id], sl = at == null ? null : rows[at];
      if (sl && !sl.querySelector('.rc')) sl.appendChild(c); else deck.appendChild(c);
    });
    function keep() { put = {}; rows.forEach(function (r, j) { var c = r.querySelector('.rc'); if (c) put[c.getAttribute('data-r')] = j; }); ER.flag('q-put', put); }
    AL.swapIn(lock, '.rc', '.rs', deck);
    ER.dnd(lock, { item: '.rc', slot: '.rs', home: deck, lock: function () { return busyL || !!nextFile; }, change: function () { keep(); rows.forEach(function (r) { r.classList.remove('bad'); }); } });
    lock.querySelector('#sign').addEventListener('click', function () {
      if (busyL || nextFile) return;
      var got = rows.map(function (r) { var c = r.querySelector('.rc'); return c ? c.getAttribute('data-r') : ''; }), j, empty = got.filter(function (g) { return !g; }).length;
      if (empty) { ER.sfx.no(); msg('The warrant has ' + (empty === 1 ? 'an empty line' : empty + ' empty lines') + '. The King will not seal a warrant with holes in it. One reason on every line.'); return; }
      for (j = 0; j < 4; j++) if (!ER.check('s' + (j + 1), got[j])) {
        misses++; rows[j].classList.add('bad'); ER.shake(rows[j]); ER.sfx.no();
        msg('“That won’t do,” says the King, reading line ' + (j + 1) + ' over his spectacles. ' + (BAD[got[j]] || 'That reason is true, but it is about somebody else. Whose clue is it?') + (misses > 2 ? ' (Only the first line that will not do is ever shown.)' : ''));
        return;
      }
      var file = ER.exitOk([got.join('-')]);
      if (!file) { msg('The seal will not stick. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('q-file', file); busyL = true;
      var st = ER.state(); st.done = st.done || {}; st.done.croquet = 1; ER.persist(true);
      msg('“Consider, my dear,” says the King to the Queen, holding up the warrant. “The Cat has no fingers. The gardener’s red is paint. The Hatter never left his tea. And the Knave … the Knave has jam on his fingers.”');
      setTimeout(function () { ER.closeAll(); ER.mood('calm'); AL.solved(); after(); }, 3200);
    });
    msg('Four lines on the warrant, and nine reasons. Drag a reason on to each line, or click a reason and then a line. Then seal it.');
    ER.open('ov-lock', lock);
  }
  function after() {
    busy = true; paint();
    AL.terms(['red herring']);
    AL.mine('warrant', 'The warrant', '<p>The Cat is cleared: the print was a fingerprint, and a cat has no fingers. Seven is cleared: the red on the strip smelt of strawberries, his smells of paint. The Hatter is cleared: an alibi, always tea-time. The Knave tore the pages: jam on his fingers, pastry on his cushion. Every clue fits him.</p><p>The Cat was a red herring: a clue that points the wrong way.</p>');
    ER.narrate([
      'The Queen snatches the warrant, reads one word of it, and screams at the Knave: “Off with his head!” The Knave only bows and smiles. “Consider, my dear,” says the King: “he must be tried first.”',
      'As the soldiers take his arms, something slides out of the Knave’s sleeve: a single page, a little sticky. It is the page that was missing here. It flies to Alice like a homing pigeon, and the story starts again.',
      '<span class="bk">Alice could think of nothing else to say but “It belongs to the Duchess: you’d better ask <i>her</i> about it.”</span> The executioner goes off like an arrow to fetch her, and the Cat’s head begins fading away, grin last of all.',
      'The Cat was a red herring all along: a clue that points the wrong way, because everybody wanted it to. The Knave is led off in chains. And when the soldiers shake his other sleeve, nothing falls out. A knave always keeps one card up his sleeve.',
      'There are still pages missing, at the very end of the book. Far away, somebody is crying: “The trial’s beginning!”'
    ], function () { busy = false; $('#go').classList.add('on'); });
  }
})();
</script>
</body>
</html>
