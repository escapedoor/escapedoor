  .song .wk-chip.held{background:#ffe9a0}

        { a: '<span class="bk">“You might just as well say,” added the March Hare, “that ‘I like what I get’ is the same thing as ‘I get what I like’!”</span></p><p><span class="bk">“You might just as well say,” added the Dormouse, who seemed to be talking in his sleep, “that ‘I breathe when I sleep’ is the same thing as ‘I sleep when I breathe’!”</span></p><p><span class="bk">“It <i>is</i> the same thing with you,” said the Hatter.</span>' },
        { q: 'What is the answer to the riddle?', a: '<span class="bk">“I haven’t the slightest idea,” said the Hatter.</span></p><p><span class="bk">“Nor I,” said the March Hare.</span>' },
        { q: 'Has anybody come past here tearing pages out of a book?', a: 'Nobody comes past here. Nobody goes. We quarrelled with Time last March, and <span class="bk">“ever since that,” the Hatter went on in a mournful tone, “he won’t do a thing I ask! It’s always six o’clock now.”</span> Always tea-time. We have not left this table since, not for a minute. There has never been a minute to leave it in.' },
        { note: 'He takes his watch out of his pocket, shakes it, and holds it to his ear. There are crumbs in the works.', a: '<span class="bk">“Two days wrong!” sighed the Hatter. “I told you butter wouldn’t suit the works!” he added looking angrily at the March Hare.</span></p><p><span class="bk">“It was the <i>best</i> butter,” the March Hare meekly replied.</span></p><p><span class="bk">“Yes, but some crumbs must have got in as well,” the Hatter grumbled: “you shouldn’t have put it in with the bread-knife.”</span>' },
        { q: 'And what were you singing?', a: '<span class="bk">“—it was at the great concert given by the Queen of Hearts, and I had to sing</span></p><p class="bk" style="padding-left:1.4em">‘Twinkle, twinkle, little bat!<br>How I wonder what you’re at!’</p><p><span class="bk">You know the song, perhaps?”</span></p><p>You have heard something like it.</p><p><span class="bk">“It goes on, you know,” the Hatter continued, “in this way:—”</span>' },
        { note: 'And there he stops, with his mouth open. The rest of the song was on the bottom half of a page, and somebody has torn the page in two. His half lies on the table in front of him. There is something folded in his hatband, too, beside the price ticket.', a: '“Up above the world … Up above the world …” He looks into his teacup for the rest of it. It is not there.' }
      ],
      clue: { id: 'hatter', title: 'The Hatter, the March Hare and the Dormouse', kind: 'What they said' },
      done: function (seen) { if (seen && told.set('hatter')) { paint(); ER.say('“Not the same thing a bit!” The programme on the table, and the folded page in his hatband.'); } }
    });
  });

  /* ---------- the programme ---------- */
  var PROG = '<h4>The Queen of Hearts’ Great Concert · Programme</h4><h3>Songs, Old and New</h3>' +
    '<p>A <b>parody</b> copies a poem that everybody knows: its <b>rhythm</b> (the beat of each line), its <b>rhymes</b>, often its first words. Then it changes what the poem is about, so that the listener hears the <b>original</b> and the new poem at the same time, and laughs at the difference. Victorian children learnt poems by heart at school, so Carroll’s first readers knew the originals well.</p>' +
    '<p>To read a parody, set it beside the original, line by line. <b>Keep</b> the beat, the rhyme and the shape of each sentence. <b>Change</b> the subject and turn the meaning upside down: a good, busy creature becomes a lazy or a sly one, and something grand becomes something silly and ordinary.</p>' +
    '<div class="two"><div><small>Isaac Watts, 1715 · the first verse</small>How doth the little busy Bee<br>&nbsp;&nbsp;Improve each shining Hour,<br>And gather Honey all the day<br>&nbsp;&nbsp;From every opening Flower!</div>' +
    '<div><small>Lewis Carroll, 1865 · Alice says it</small>How doth the little <i>crocodile</i><br>&nbsp;&nbsp;Improve his shining <i>tail</i>,<br>And <i>pour the waters of the Nile</i><br>&nbsp;&nbsp;On every <i>golden scale</i>!</div></div>' +
    '<p>The busy bee that works all day becomes a crocodile that does nothing but polish itself. The beat and the rhymes are the same; the moral has been turned inside out.</p>';
  $('#prog').addEventListener('click', function () {
    if (busy) return;
    if (!told.has('hatter')) { ER.say('A concert programme with a red edge, lying in a saucer. The Hatter is staring at you.'); return; }
    ER.read({ html: PROG, cls: 'prog', clue: { id: 'prog', title: 'Songs, Old and New', kind: 'The concert programme' }, done: function () {
      AL.terms(['parody', 'original', 'rhythm', 'rhyme', 'verse', 'imitate']);
      if (told.set('prog')) { paint(); ER.say(told.has('hatpage') ? 'Two torn songs, and the rules of parody. The Hatter’s song sheet is on the table.' : 'Keep the beat and the rhyme; turn the meaning upside down. And what is in the Hatter’s hatband?'); }
    } });
  });
  $('#hat').addEventListener('click', function (e) {
    if (busy) return;
    e.stopPropagation();
    if (!told.has('hatter')) { ER.say('An enormous hat with a price ticket on it: In this Style 10/6.'); return; }
    if (told.has('hatpage')) { ER.say('“I keep them to sell,” says the Hatter, when he sees you looking at his hat. “I’ve none of my own.”'); return; }
    told.set('hatpage'); AL.sfx.page(); paint();
    ER.addClue('hatpage', 'A page from Chapter Two', '<h4>A page from Chapter Two</h4><p>Folded in the Hatter’s hatband: the page that blew away in the hall, when Alice tried to say “How doth the little busy bee”. Its first verse is whole. Four words of its second verse have been torn out, one by one.</p>', 'pg', 'In the Hatter’s hat');
    ER.say('You take the folded page out of the hatband. It is the page that blew out of Chapter Two: Alice’s poem about the busy bee, that came out as a crocodile. Four words of its second verse are missing.');
  });

  /* ---------- the two songs ---------- */
  var HOME = { youfly: 'c1', teatray: 'c2', grin: 'c3', fishes: 'c4', jaws: 'c5' };
  var WHY = {
    sohigh: 'That is the old song’s line, word for word. A parody keeps the shape and changes the words: what does a bat do up above the world?',
    youflap: 'A bat does flap, and the beat is right. But the line has to rhyme with “sky”, as the old one did.',
    atnight: 'True of a bat, but it does not rhyme with “sky”.',
    diamond: 'That is the old song’s word. A parody swaps the grand, shining thing for something silly and ordinary.',
    jewel: 'A jewel is as grand and shining as the diamond. Nothing has been turned upside down. Swap it for something ordinary, from this very table.',
    ruby: 'A ruby is as grand and shining as the diamond. Nothing has been turned upside down. Swap it for something ordinary, from this very table.',
    lumpofsugar: 'Ordinary enough, but say the line aloud: it trips. “Like a DIA-mond in the sky” has two syllables where the diamond is, and so must the new thing.',
    smile: 'A crocodile might smile, but this line must rhyme with “in”, at the end of the third line.',
    begin: 'It rhymes with “in”, but say it aloud: “How cheerfully he seems to begin” has a syllable too many, and begin what?',
    fish: 'Right creature, wrong beat. Say it aloud beside the old line, “And labours hard to store it well”: it is a syllable short.',
    flowers: 'Flowers belong to the bee’s poem. A parody changes the subject: what does a crocodile welcome in?',
    teeth: 'A crocodile has teeth, but this line must rhyme with “claws”.',
    paws: 'It rhymes with “claws”. But can paws smile? The smile is on the part of the crocodile that the little fishes go into.'
  };
  function openLock() {
    var cups = ['jewel', 'you fly', 'fish', 'teeth', 'so high', 'grin', 'diamond', 'fishes', 'you flap', 'paws', 'lump of sugar', 'smile', 'tea-tray', 'jaws', 'begin', 'at night', 'ruby', 'flowers'];
    lock = ER.el('div', 'song');
    lock.innerHTML = '<div class="cards"><div class="card"><h5>The Hatter’s song · Chapter VII</h5><div class="pair">' +
      '<div class="old"><small>Jane Taylor, “The Star”, 1806</small>Twinkle, twinkle, little star,<br>How I wonder what you are!<br>Up above the world so high,<br>Like a diamond in the sky.</div>' +
      '<div class="new"><small>The Hatter sings</small>‘Twinkle, twinkle, little bat!<br>How I wonder what you’re at!’<br>‘Up above the world <span class="wk-blank" data-key="c1"></span>,<br>Like a <span class="wk-blank" data-key="c2"></span> in the sky.’</div></div></div>' +
      '<div class="card b"><h5>Alice’s poem · Chapter II · the second verse</h5><div class="pair">' +
      '<div class="old"><small>Isaac Watts, 1715</small>How skilfully she builds her Cell!<br><span class="in">How neat she spreads the Wax!</span><br>And labours hard to store it well<br><span class="in">With the sweet Food she makes.</span></div>' +
      '<div class="new"><small>Alice says</small>“How cheerfully he seems to <span class="wk-blank" data-key="c3"></span>,<br><span class="in">How neatly spread his claws,</span><br>And welcome little <span class="wk-blank" data-key="c4"></span> in<br><span class="in">With gently smiling <span class="wk-blank" data-key="c5"></span>!”</span></div></div></div></div>' +
      '<div class="wk-bank">' + cups.map(function (c) { return '<span class="wk-chip">' + c + '</span>'; }).join('') + '</div>' +
      '<div class="bn-foot"><p class="bmsg"></p></div>';
    var m = lock.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    WK.cloze(lock, {
      onRight: function () { AL.sfx.clink(); },
      onMiss: function (n, misses, detail) {
        var d = detail[0], w = WK.norm(d[1]), r = WHY[w] || (HOME[w] && HOME[w] !== d[0] ? '“' + d[1] + '” is a right word, in the wrong place. Which line could it rhyme with?' : 'That cup does not fit.');
        msg(r + (n > 1 ? ' (' + n + ' cups went back to the tray.)' : '') + (misses > 3 ? ' Test each cup three ways: beat, rhyme, and a meaning turned upside down.' : ''));
      },
      onDone: done
    });
    msg('Eighteen cups on the table, and five holes in two songs. Drag a cup into a hole, or click a cup and then a hole. When every hole is full, the songs are tried.');
    ER.open('ov-lock', lock);
  }
  function done() {
    var file = ER.exit(['youfly-teatray-grin-fishes-jaws'], { wait: true });
    if (!file) { lock.querySelector('.bmsg').textContent = 'The songs will not sing. Something is wrong with this page: tell your teacher.'; return; }
    nextFile = file; ER.flag('t-file', file);
    lock.querySelector('.bmsg').innerHTML = ER.gloss('Both songs are whole. A bat, flying like a tea-tray; a crocodile, grinning at the little fishes. The beat of the old poems, and their meaning turned upside down.');
    AL.mine('parody', 'Two parodies, mended', '<p class="bk">‘Up above the world you fly,<br>Like a tea-tray in the sky.’</p><p>Rhymes with sky, and a bat flies; the grand diamond becomes an ordinary tea-tray.</p><p class="bk">“How cheerfully he seems to grin,<br>How neatly spread his claws,<br>And welcome little fishes in<br>With gently smiling jaws!”</p><p>Grin rhymes with in, jaws with claws; fishes has the beat. The busy bee that stores food becomes a crocodile that eats.</p>');
    setTimeout(function () { ER.closeAll(); after(); }, 3000);
  }
  function after() {
    busy = true; paint();
    ER.narrate([
      '<span class="bk">‘Up above the world you fly, Like a tea-tray in the sky. Twinkle, twinkle—’</span> sings the Hatter, and the Dormouse shakes itself and begins singing in its sleep, <span class="bk">“<i>Twinkle, twinkle, twinkle, twinkle</i>—”</span> and goes on so long that they have to pinch it to make it stop.',
      'The page from the hatband flutters out of your hand and away over the trees, back to Chapter Two, where a very small girl in a hall full of tears is waiting to say: <span class="bk">“How cheerfully he seems to grin …”</span>',
      'At the table the story runs on as it should, as mad as ever: the riddle with no answer, the treacle-well, everything that begins with an M. At last Alice gets up in great disgust and walks off, and the last time she sees them, they are trying to put the Dormouse into the teapot.',
      '<span class="bk">“It’s the stupidest tea-party I ever was at in all my life!”</span> And just as she says this, she notices that one of the trees has a door leading right into it.',
      'Alice puts her hand on the door. And there the story stops again, because the next page is missing. But you know where it is. It has been in your pocket since the hall: <i>Once more she found herself in the long hall …</i>'
    ], function () { busy = false; $('#go').classList.add('on'); paint(); });
  }
  $('#sheet').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The song sheet is whole again. The Hatter has put a teacup on it.'); return; }
    if (!told.has('hatter')) { ER.say('A song sheet torn in half, under the Hatter’s elbow. He is staring at you.'); return; }
    if (!ready()) { ER.say(told.has('prog') ? 'The Hatter’s half of the song sheet. Something is folded in his hatband: take that first.' : 'The Hatter’s half of the song sheet. Read the concert programme first: it is on the right of the table.'); return; }
    openLock();
  });
  $('#treedoor').addEventListener('click', function () { if (!busy && nextFile) $('#go').click(); });
  $('#go').addEventListener('click', function () {
    if (!nextFile || busy) return;
    busy = true; $('#go').classList.remove('on');
    ER.narrate(['You hold out the strip from your pocket. The door in the tree takes it, as a letter-box takes a letter, and opens. <span class="bk">Once more she found herself in the long hall, and close to the little glass table.</span> This time Alice takes the key first, and nibbles the mushroom, and walks down the little passage, and you go with her: into the beautiful garden.'], function () { ER.leave(nextFile); });
  });

  /* ---------- things at the table ---------- */
  AL.thing('#clock', 'clock', '“It’s always six o’clock now,” says the Hatter, without looking. “Always tea-time.”', isBusy);
  AL.thing('#house', 'chimney', 'The March Hare’s house: the chimneys are shaped like ears, and the roof is thatched with fur.', isBusy);
  $('#hare').addEventListener('click', function () {
    if (busy) return;
    ER.say(told.has('hatter') ? '“It was the <i>best</i> butter, you know,” says the March Hare, dipping the Hatter’s watch into his cup of tea, and looking at it gloomily.' : '“Have some wine,” the March Hare says in an encouraging tone. There is nothing on the table but tea. “There isn’t any,” says the March Hare.');
  });
  $('#dormouse').addEventListener('click', function () { if (!busy) ER.say('The Dormouse is fast asleep, and the other two are resting their elbows on it. “Twinkle, twinkle,” it murmurs, “twinkle, twinkle …”'); });
  $('#alice').addEventListener('click', function () { if (!busy) ER.say(nextFile ? 'Alice is walking off through the wood, very cross.' : 'Alice is in the large arm-chair at the end of the table, thinking over all she can remember about ravens and writing-desks, which isn’t much.'); });
})();
</script>
</body>
</html>
