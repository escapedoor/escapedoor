<style>
  body{--bg:#2a2a36;--accent:#d8d4f0;--font-display:'Cinzel',serif;--font-ui:'Goudy Bookletter 1911',serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(30,30,40,.97);--tc-ink:#ecebf4;--cap-bg:rgba(32,32,44,.95);--panel:#2e2e3e;--face-bg:#3a3a4c;--q-ink:#d0ccf0;--fade:#0a0a10;--hud-bg:rgba(30,30,40,.84)}
  .tc-room{font-family:'Cinzel',serif;font-size:clamp(42px,5.8vw,80px);color:#e6e2f8;letter-spacing:.06em}
  .sC{font-family:'Cinzel',serif;text-anchor:middle}
  .sG{font-family:'Goudy Bookletter 1911',serif;text-anchor:middle}
  #flakes circle{animation:fall 9s linear infinite}#flakes circle:nth-child(2n){animation-duration:12s;animation-delay:-4s}#flakes circle:nth-child(3n){animation-duration:10s;animation-delay:-7s}
  @keyframes fall{from{transform:translate(0,-80px)}to{transform:translate(30px,80px)}}
  #mist ellipse{animation:mist 30s linear infinite}#mist ellipse:nth-child(2){animation-delay:-12s;animation-duration:38s}
  @keyframes mist{from{transform:translateX(-200px)}to{transform:translateX(1800px)}}
  #phantom .hand{animation:point 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
  @keyframes point{50%{transform:rotate(3deg)}}
  #name{opacity:0;transition:opacity 3s}
  #scene.read #name{opacity:1}#scene.read #namesnow{opacity:0}
  #namesnow{transition:opacity 2.5s}
  #scene.gone #phantom{opacity:0;transition:opacity 3s}
  .shade.ready,#card.ready,#path.ready{animation:glow 1.5s steps(1,end) infinite}
  .shade{cursor:pointer}
  @keyframes glow{50%{filter:brightness(1.4)}}

  /* the lock: the path from the gate to the church door */
  .yard{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px 14px;padding:14px 16px 12px;background:#d8dae2 linear-gradient(170deg,#eceef4,#b8bcc8);border:1px solid #6a6e7e;box-shadow:0 26px 70px rgba(0,0,0,.75)}
  .yard h5{grid-column:1/3;margin:0;font-family:'Cinzel',serif;font-weight:normal;font-size:20px;color:#2a2a3a;text-align:center;letter-spacing:.04em}
  .walk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px;background:#9a9eaa repeating-linear-gradient(135deg,#a4a8b4 0 12px,#9a9eaa 12px 24px);border-radius:4px;position:relative}
  .stone{position:relative;min-height:64px;padding:16px 4px 4px;background:#c8ccd4;border:2px solid #6a6e7a;border-radius:6px 6px 3px 3px;box-shadow:inset 0 6px 0 #f4f6fa}
  .stone>em{position:absolute;left:6px;top:1px;font-style:normal;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;color:#4a4e5a}
  .stone.bad{border-color:#b0302a;background:#e8c4bc}
  .side{display:flex;flex-direction:column;gap:8px}
  .box{position:relative;padding:6px 6px 6px;border-radius:4px;display:flex;flex-direction:column;gap:5px}
  .box>i{display:block;margin:0 2px 1px;font-style:normal;font-family:'Goudy Bookletter 1911',serif;font-size:12px;line-height:1.25;letter-spacing:.12em;text-transform:uppercase}
  .box.may{background:#1c1c24;border:2px solid #4a4a5a}.box.may>i{color:#c8c4e0}
  .box.out{background:#f4f0e2;border:2px dashed #8a7a5a}.box.out>i{color:#6a5a3a}
  .box .sl{min-height:52px;border:1px dashed rgba(160,160,190,.5);border-radius:3px}
  .box.bad{outline:3px solid #e07a5a}
  .stone .sl{min-height:44px}
  .tray{grid-column:1/3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px;min-height:50px;background:rgba(40,40,60,.12);border:1px solid #8a8e9a}
  .yard .slip{font-size:14.5px;padding:5px 8px;background:#fbfaf4;color:#2a2a30;border-color:#9a9aa6}
</style>

<script>
(function () {
  var $ = ER.$, busy = true, told, nextFile = null, lock = null;
  $('#scrfig').innerHTML = '<g class="ink">' + CC.fig({ h: 300, kind: 'gown', coat: '#6a4a5a', sash: '#8a2a2a', skin: '#e6cfb4', hat: 'night', nose: 'pointed', face: 'sad', hairStyle: 'none', armL: 'front', armR: 'out' }) + '</g>';

  ER.init({
    theme: 'lit', story: 'carol', storyTitle: 'The Boy in Sunday Clothes', id: 'churchyard', no: 'V', title: 'The Churchyard',
    go: 'Follow the pointing hand',
    intro: [
      'You put the money back into Stave Three. Fifteen &lsquo;Bob&rsquo; a-week is fifteen shillings, a &lsquo;bob&rsquo; being a shilling, and Peter&rsquo;s place would bring in five-and-sixpence. Scrooge himself said a day&rsquo;s wages was half-a-crown, and six half-crowns make fifteen shillings, so Bob is paid for six days. Mr. Fezziwig spent &lsquo;three or four&rsquo; pounds on one evening, and even three pounds were sixty shillings: four weeks of Bob&rsquo;s wages.',
      'When Scrooge saw the two children under the Spirit&rsquo;s robe, Ignorance and Want, and cried, &lsquo;Have they no refuge or resource?&rsquo;, the Spirit answered him with his own words of Christmas Eve: &lsquo;Are there no prisons? Are there no workhouses?&rsquo;',
      'Then the bell struck twelve, and the last Spirit came, draped and hooded, like a mist along the ground. It has not said one word. It only points. It has shown Scrooge things that have not happened yet, and now it has led him to an iron gate.'
    ],
    exit: {"next":"street","w":{"fb3c575f":"e846cd4a"}}, tags: {"p1":["beea911a"],"p2":["2751a242"],"p3":["9866ae74"],"p4":["6df4ab8f"],"p5":["fbc2fcb5"],"p6":["f7943313"],"p7":["3e59a872"],"p8":["847871d8"],"my":["6be300ea","6f26981b"],"ot":["7cef6c00","e00574d8"]},
    hints: hints, onBegin: begin
  });

  told = CC.told('e-told'); nextFile = ER.flag('e-file') || null;
  var NEED = ['card', 'f1', 'f2', 'f3'];
  function isBusy() { return busy; }
  function ready() { return NEED.every(function (k) { return told.has(k); }); }
  function paint() {
    var s = $('#scene');
    s.classList.toggle('read', !!nextFile); s.classList.toggle('gone', !!nextFile && told.has('gone'));
    $('#name2').setAttribute('opacity', nextFile ? '1' : '0');
    $('#card').classList.toggle('ready', !told.has('card'));
    ['f1', 'f2', 'f3'].forEach(function (k) { $('#' + k).classList.toggle('ready', told.has('card') && !told.has(k)); });
    $('#path').classList.toggle('ready', ready() && !nextFile);
    ER.pips(NEED.filter(function (k) { return told.has(k); }).length + (nextFile ? 1 : 0), 5);
  }
  function hints() {
    if (nextFile) return ['go', ['The Phantom has dwindled into a bedpost. The button at the bottom takes you to Christmas morning.']];
    if (lock && lock.parentNode) return ['path', [
      'Ask of every line: when did it happen? Long ago, seven years ago, on Christmas Eve, on Christmas morning, or the day after? Then ask: did it happen at all? The pages of every stave are in your notebook.',
      'The two shadows of the future have not happened: Scrooge asked the Phantom whether they will be, or may be only. Two pencilled lines are not in the book: Marley said &lsquo;the next night&rsquo;, but on Christmas morning the boy says it is Christmas Day; and the book never says how or when Fan died.',
      'Belle&rsquo;s husband saw Scrooge alone the night his partner lay dying: seven years before the book begins, because Marley died seven years ago on Christmas Eve. The path runs: the school, Fan, the ball, the golden idol, the partner dying, Christmas Eve, Christmas Day, the salary.'
    ]];
    if (!told.has('card')) return ['card', ['A reader has dropped something white in the snow, on the right, below the church.', 'Click the card in the snow, bottom right.']];
    if (!ready()) return ['shades', ['The Phantom has shown Scrooge three things that have not happened yet. You can see them in the mist, high on the left. Read all three.', 'Click each of the three pale pictures: On &rsquo;Change, Old Joe&rsquo;s, A Quiet House.']];
    return ['ready', ['Everything is read. Click the bare path of flagstones, and lay Scrooge&rsquo;s life out on it.']];
  }

  function begin() {
    paint();
    if (nextFile) { busy = false; $('#go').classList.add('on'); ER.say(told.has('gone') ? 'The churchyard is empty. Where the Phantom stood there is only the corner of a bed.' : 'The name on the stone is clear now.'); return; }
    if (told.has('in')) { busy = false; ER.say('The churchyard. The Phantom points, and says nothing.'); return; }
    told.set('in');
    ER.narrate([
      'A churchyard, walled in by houses; overrun by grass and weeds; choked up with too much burying. Snow on the stones. The Phantom stands among the graves and points down to one.',
      'Scrooge does not go nearer. &ldquo;Before I draw nearer to that stone to which you point,&rdquo; he says, &ldquo;answer me one question. Are these the shadows of the things that Will be, or are they shadows of things that May be, only?&rdquo;',
      'Still the Ghost points downward to the grave. It never answers anything.',
      'And this is where the book has gone most wrong tonight. The shadows of the future have got mixed in with everything else, so that the book cannot tell what has happened from what only may.',
      'On the path from the gate to the church door, the flagstones are bare. The moments of Scrooge&rsquo;s life lie scattered in the snow, copied out in pencil by a reader who did not always copy carefully.',
      'If a shadow of the future is laid on the path as if it had already happened, the writing on that stone can never be sponged away.'
    ], function () {
      busy = false; paint();
      ER.addClue('question', 'Will be, or May be?', CC.page('STAVE IV', 'Will be, or May be?', '<p>&ldquo;Before I draw nearer to that stone to which you point,&rdquo; said Scrooge, &ldquo;answer me one question. Are these the shadows of the things that Will be, or are they shadows of things that May be, only?&rdquo;</p><p>Still the Ghost pointed downward to the grave by which it stood.</p><p>&ldquo;Men&rsquo;s courses will foreshadow certain ends, to which, if persevered in, they must lead,&rdquo; said Scrooge. &ldquo;But if the courses be departed from, the ends will change. Say it is thus with what you show me!&rdquo;</p><p>The Spirit was immovable as ever.</p>'), 'page', 'Stave Four', true);
    });
  }

  /* ---------- papers ---------- */
  var CARD = '<h4>Order of telling, time order</h4>' +
    '<p>The <b>order of telling</b> is the order the book tells things in: Stave I, II, III, IV, V.</p>' +
    '<p><b>Time order</b> is the order they happened in. To find it, ask of every scene: when did this happen? Before Christmas Eve? On Christmas Eve? After it?</p>' +
    '<p>A flashback is told late but happened early, so in time order it moves to the front.</p>' +
    '<p>A flash-forward shows a time still to come. But be careful! In <i>A Christmas Carol</i>, Scrooge asks the last Spirit whether its shadows are things that Will be, or things that May be, only. A shadow that only may be has not happened. It does not go in time order at all.</p>' +
    '<p>And a timeline is only as good as its sources. Check every line against the book. If it is not there, it is a guess.</p>';
  var FUT = {
    f1: ['On &rsquo;Change', '<p>&ldquo;No,&rdquo; said a great fat man with a monstrous chin, &ldquo;I don&rsquo;t know much about it, either way. I only know he&rsquo;s dead.&rdquo;</p><p>&ldquo;When did he die?&rdquo; inquired another.</p><p>&ldquo;Last night, I believe.&rdquo;</p><p class="gap">* * *</p>' +
      '<p>&ldquo;It&rsquo;s likely to be a very cheap funeral,&rdquo; said the same speaker; &ldquo;for upon my life I don&rsquo;t know of anybody to go to it.&rdquo;</p><p class="gap">* * *</p>' +
      '<p>&ldquo;How are you?&rdquo; said one.</p><p>&ldquo;How are you?&rdquo; returned the other.</p><p>&ldquo;Well!&rdquo; said the first. &ldquo;Old Scratch has got his own at last, hey?&rdquo;</p><p>&ldquo;So I am told,&rdquo; returned the second. &ldquo;Cold, isn&rsquo;t it?&rdquo;</p><p>&ldquo;Seasonable for Christmas time. You&rsquo;re not a skater, I suppose?&rdquo;</p>'],
    f2: ['Old Joe&rsquo;s', '<p>Far in this den of infamous resort, there was a low-browed, beetling shop, below a pent-house roof, where iron, old rags, bottles, bones, and greasy offal, were bought.</p><p class="gap">* * *</p>' +
      '<p>&ldquo;What do you call this?&rdquo; said Joe. &ldquo;Bed-curtains!&rdquo;</p><p>&ldquo;Ah!&rdquo; returned the woman, laughing and leaning forward on her crossed arms. &ldquo;Bed-curtains!&rdquo;</p><p>&ldquo;You don&rsquo;t mean to say you took &rsquo;em down, rings and all, with him lying there?&rdquo; said Joe.</p><p>&ldquo;Yes I do,&rdquo; replied the woman. &ldquo;Why not?&rdquo;</p><p class="gap">* * *</p>' +
      '<p>&ldquo;Ha, ha!&rdquo; laughed the same woman. &ldquo;This is the end of it, you see! He frightened every one away from him when he was alive, to profit us when he was dead! Ha, ha, ha!&rdquo;</p><p>&ldquo;Spirit!&rdquo; said Scrooge, shuddering from head to foot. &ldquo;I see, I see. The case of this unhappy man might be my own. My life tends that way, now.&rdquo;</p>'],
    f3: ['A quiet house', '<p>They entered poor Bob Cratchit&rsquo;s house; the dwelling he had visited before; and found the mother and the children seated round the fire.</p><p>Quiet. Very quiet. The noisy little Cratchits were as still as statues in one corner, and sat looking up at Peter, who had a book before him. The mother and her daughters were engaged in sewing. But surely they were very quiet!</p><p class="gap">* * *</p>' +
      '<p>They were very quiet again. At last she said, and in a steady, cheerful voice, that only faltered once:</p><p>&ldquo;I have known him walk with&mdash;I have known him walk with Tiny Tim upon his shoulder, very fast indeed.&rdquo;</p><p>&ldquo;And so have I,&rdquo; cried Peter. &ldquo;Often.&rdquo;</p><p>&ldquo;And so have I,&rdquo; exclaimed another. So had all.</p>']
  };
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'card', clue: { id: 'card', title: 'Order of telling, time order', kind: 'Left in the book' }, done: function () {
      CC.terms(['order of telling', 'time order', 'flash-forward']);
      if (told.set('card')) { paint(); ER.say('Will be, or May be? The Phantom has shown Scrooge three things. They hang in the mist on the left.'); }
    } });
  });
  ['f1', 'f2', 'f3'].forEach(function (k) {
    $('#' + k).addEventListener('click', function () {
      if (busy) return;
      ER.read({ html: CC.page('STAVE IV', FUT[k][0], FUT[k][1]), cls: 'page', clue: { id: k, title: FUT[k][0], kind: 'Stave Four' }, done: function () {
        if (told.set(k)) { paint(); if (ready()) ER.say('Three shadows of the future. Now the path.'); }
      } });
    });
  });
  CC.thing('#phantom', null, 'It is shrouded in a deep black garment, which conceals its head, its face, its form, and leaves nothing of it visible save one outstretched hand. It neither speaks nor moves.', isBusy);
  CC.thing('#grave', null, function () { return nextFile ? 'EBENEZER SCROOGE. But the writing on a stone can be sponged away, if the courses be departed from.' : 'A neglected grave. The snow lies thick on its face, and hides the name.'; }, isBusy);
  CC.thing('#gate', null, 'The iron gate. Scrooge paused to look round before he came through it.', isBusy);
  CC.thing('#church', null, 'The church. On Christmas morning, if the book goes right, Scrooge will go to church, and walk about the streets.', isBusy);
  CC.thing('#houses', null, 'Houses all round. The churchyard is walled in by them.', isBusy);
  CC.thing('#stones', null, 'Old stones with the names worn away.', isBusy);
  CC.thing('#scr', null, function () { return nextFile ? '&ldquo;I am not the man I was.&rdquo;' : 'Scrooge, trembling, by the gate. He will not go nearer the stone until he has his answer.'; }, isBusy);
  function openOrSay() {
    if (busy) return;
    if (nextFile) { ER.say('The path is laid, from the gate to the church door.'); return; }
    if (!ready()) { ER.say(!told.has('card') ? 'Bare flagstones, and pencilled lines in the snow. A reader has dropped a card by the church: read it first.' : 'Bare flagstones. First read the three shadows the Phantom has shown: they hang in the mist on the left.'); return; }
    openLock();
  }
  $('#path').addEventListener('click', openOrSay);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: lay the path ---------- */
  var CARDS = [
    ['k1', '&ldquo;I have known him walk with Tiny Tim upon his shoulder, very fast indeed.&rdquo;'],
    ['k2', '&ldquo;Yo ho, my boys!&rdquo; said Fezziwig. &ldquo;No more work to-night. Christmas Eve, Dick.&rdquo;'],
    ['k3', '&ldquo;To-day!&rdquo; replied the boy. &ldquo;Why, CHRISTMAS DAY.&rdquo;'],
    ['k4', 'The last Spirit comes on the third night: 26 December.'],
    ['k5', '&ldquo;His partner lies upon the point of death, I hear; and there he sat alone.&rdquo;'],
    ['k6', 'At one of these a lonely boy was reading near a feeble fire'],
    ['k7', '&ldquo;Old Scratch has got his own at last, hey?&rdquo;'],
    ['k8', '&ldquo;&hellip; I am about to raise your salary!&rdquo;'],
    ['k9', '&ldquo;I have come to bring you home, dear brother!&rdquo;'],
    ['k10', 'Fan dies on the day her son Fred is born.'],
    ['k11', '&ldquo;Mr. Marley has been dead these seven years.&rdquo;'],
    ['k12', '&ldquo;Another idol has displaced me &hellip;&rdquo; &ldquo;A golden one.&rdquo;']
  ];
  function openLock() {
    var busyL = false, put = ER.flag('e-put') || {};
    lock = ER.el('div', 'pz');
    var box = ER.el('div', 'yard');
    var stones = '';
    for (var i = 1; i <= 8; i++) stones += '<div class="stone" data-z="p' + i + '"><em>' + (i === 1 ? '1 &middot; by the gate' : i === 8 ? '8 &middot; by the church door' : i) + '</em><div class="sl"></div></div>';
    box.innerHTML = '<h5>Lay the path in time order, from the gate to the church door</h5><div class="walk">' + stones + '</div>' +
      '<div class="side"><div class="box may" data-z="my"><i>In the Phantom&rsquo;s shadow: may be, only</i><div class="sl"></div><div class="sl"></div></div>' +
      '<div class="box out" data-z="ot"><i>Not in the book: back to the reader</i><div class="sl"></div><div class="sl"></div></div></div><div class="tray"></div>';
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="lay">Walk the path</button>');
    lock.appendChild(box); lock.appendChild(foot);
    var tray = box.querySelector('.tray'), m = foot.querySelector('.pmsg'), cells = ER.$$('.sl', box);
    function msg(t) { m.innerHTML = ER.gloss(t); }
    CARDS.forEach(function (c) {
      var d = ER.el('div', 'slip dnd-item', ER.gloss(c[1])); d.setAttribute('data-k', c[0]);
      var at = put[c[0]]; (at != null && cells[at] && !cells[at].firstChild ? cells[at] : tray).appendChild(d);
    });
    function keep() { put = {}; cells.forEach(function (c, i) { var s = c.querySelector('.slip'); if (s) put[s.getAttribute('data-k')] = i; }); ER.flag('e-put', put); }
    function clearBad() { ER.$$('.bad', box).forEach(function (n) { n.classList.remove('bad'); }); }
    CC.swapIn(box, '.slip', '.sl', tray);
    ER.dnd(box, { item: '.slip', slot: '.sl', home: tray, lock: function () { return busyL || !!nextFile; }, change: function () { keep(); clearBad(); CC.sfx.snow(); } });
    function zoneOf(s) { var z = s.closest('[data-z]'); return z ? z.getAttribute('data-z') : ''; }
    foot.querySelector('#lay').addEventListener('click', function () {
      if (busyL || nextFile) return;
      clearBad();
      var left = tray.querySelectorAll('.slip').length;
      if (left) { ER.sfx.no(); msg('The Phantom waits. ' + (left === 12 ? 'Not one line has been laid yet.' : left === 1 ? 'One line is still lying in the snow.' : left + ' lines are still lying in the snow.') + ' Drag each line to a place, or click a line and then a place.'); return; }
      var i, s, k, z, el;
      for (i = 1; i <= 8; i++) {
        el = box.querySelector('[data-z="p' + i + '"]'); s = el.querySelector('.slip'); k = s.getAttribute('data-k');
        if (!ER.check('p' + i, k)) {
          el.classList.add('bad'); ER.sfx.no();
          if (ER.check('my', k)) msg('Stone ' + i + ': has this happened? Which Spirit showed it, and what did Scrooge ask that Spirit at this very gate? <i>(Only the first wrong stone is ever shown.)</i>');
          else if (ER.check('ot', k)) msg('Stone ' + i + ' holds a line that is not in the book at all. Check every pencilled line against the pages in your notebook. <i>(Only the first wrong stone is ever shown.)</i>');
          else msg('Stone ' + i + ' is out of order. Ask of that line: when did it happen? Long ago, seven years ago, on Christmas Eve, or after? <i>(Only the first wrong stone is ever shown.)</i>');
          return;
        }
      }
      var side = ER.$$('.box .slip', box);
      for (i = 0; i < side.length; i++) {
        s = side[i]; k = s.getAttribute('data-k'); z = zoneOf(s);
        if (!ER.check(z, k)) {
          s.closest('.box').classList.add('bad'); s.classList.add('bad'); ER.sfx.no();
          msg(z === 'my' ? (ER.check('ot', k) ? 'That line is not a shadow the Phantom showed: it is not in the book at all.' : 'That has happened, or will: it belongs on the path.') : 'That line is in the book. Find it in your notebook.');
          return;
        }
      }
      var path = []; for (i = 1; i <= 8; i++) path.push(box.querySelector('[data-z="p' + i + '"] .slip').getAttribute('data-k'));
      var grp = function (zz) { return ER.$$('[data-z="' + zz + '"] .slip', box).map(function (n) { return n.getAttribute('data-k'); }).sort().join('+'); };
      var file = ER.exit([path.join('-') + '/' + grp('my') + '/' + grp('ot')], { wait: true });
      if (!file) { msg('The path will not hold. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('e-file', file); busyL = true;
      msg('The path is laid, stone by stone, from the gate to the church door. The two shadows sink back into the Phantom&rsquo;s robe.');
      setTimeout(function () {
        ER.closeAll(); busy = true; paint(); ER.mood('tense');
        CC.mine('path', 'Scrooge&rsquo;s life, in time order', '<p>1 The school: a lonely boy reading near a feeble fire. 2 Little Fan comes to bring him home. 3 Fezziwig&rsquo;s ball, when he was an apprentice. 4 Belle: &lsquo;Another idol has displaced me.&rsquo; 5 Seven years ago, on Christmas Eve: his partner lies upon the point of death, and he sits alone. 6 Christmas Eve, now: &lsquo;Mr. Marley has been dead these seven years.&rsquo; 7 Christmas morning: &lsquo;To-day!&rsquo; &hellip; &lsquo;Why, CHRISTMAS DAY.&rsquo; 8 The next morning: the salary.</p><p>May be, only: the jokes on &rsquo;Change, and the quiet house without Tiny Tim. Tiny Tim did NOT die.</p><p>Not in the book: the third night (the Spirits did it all in one night), and how Fan died (the book says only that she died a woman, and had one child).</p>');
        ER.narrate([
          'The finger points. <i>Scrooge crept towards it, trembling as he went; and following the finger, read upon the stone of the neglected grave his own name, EBENEZER SCROOGE.</i>',
          '&ldquo;Spirit!&rdquo; he cried, tight clutching at its robe, &ldquo;hear me! I am not the man I was. I will not be the man I must have been but for this intercourse.&rdquo;',
          '&ldquo;I will honour Christmas in my heart, and try to keep it all the year. I will live in the Past, the Present, and the Future. The Spirits of all Three shall strive within me. I will not shut out the lessons that they teach. Oh, tell me I may sponge away the writing on this stone!&rdquo;',
          'For the first time the hand appears to shake. Holding up his hands in a last prayer, Scrooge sees an alteration in the Phantom&rsquo;s hood and dress. It shrinks, collapses, and dwindles down into a bedpost.',
          'And the churchyard is gone, and the snow, and you are standing in the dark of Scrooge&rsquo;s bedroom, holding on to the corner of a bed. Somewhere outside, the first church bell is drawing breath.'
        ], function () { told.set('gone'); paint(); ER.mood('calm'); busy = false; $('#go').classList.add('on'); });
      }, 2400);
    });
    msg('Drag each line to a place, or click a line and then a place. Eight lines make the path, in the order they happened. Two belong in the Phantom&rsquo;s shadow. Two go back to the reader.');
    ER.open('ov-lock', lock);
  }
})();
</script>
