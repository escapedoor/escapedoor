  .zone.r2[data-z="l"],.zone.r3{grid-column:1}.zone.r2[data-z="s"],.zone.r3[data-z="o"]{grid-column:3}

        CC.mine('scrooge', 'How Dickens makes Scrooge', '<p>Told: &ldquo;a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner!&rdquo;, &ldquo;secret, and self-contained, and solitary as an oyster&rdquo;.</p><p>Looks: the cold that froze his features and nipped his pointed nose; the frosty rime on his head and eyebrows and wiry chin.</p><p>Says: &ldquo;What right have you to be merry?&rdquo; to Fred; &ldquo;decrease the surplus population&rdquo; to the gentlemen.</p><p>Does: keeps the coal-box in his own room; seizes the ruler at the carol singer.</p><p>Others: the blind men&rsquo;s dogs pull their owners away; no beggar, no child ever asks him anything.</p><p>Not in this book, two red herrings: &ldquo;Please, sir, I want some more&rdquo; (a hungry boy in <i>Oliver Twist</i>), and the sums about twenty pounds a year (Mr. Micawber in <i>David Copperfield</i>).</p>');

        ER.narrate([
          'Scrooge&rsquo;s pen begins to scratch. He is all there now, every hard inch of him, and the stave starts moving again like a clock that somebody has wound.',

        ], function () {
          ER.addClue('closing', 'Shutting-up time', CLOSING, 'page', 'Stave One');
          busy = false; $('#go').classList.add('on');

    });
    msg('Twelve loose lines. Drag each one to a place round Scrooge, or click a line and then a place: two lines to each place. When all twelve are placed, bind him together.');
    ER.open('ov-lock', wrap);
  }
