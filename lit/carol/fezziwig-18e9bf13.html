  .cols svg.rib{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;overflow:visible}

    intro: [
      'You forged the chain of the book link by link. Every stave picks up where the last one stops. Scrooge falls asleep, and wakes in the dark; he falls asleep again, and wakes with the bell &lsquo;again&rsquo; upon the stroke of One, so that stave comes second; a Phantom comes towards him, and the next stave begins with the Phantom; the Phantom dwindles into a bedpost, and the last stave begins, &lsquo;Yes! and the bedpost was his own.&rsquo; The kettle and the church belonged to two other Christmas books by Dickens, <i>The Cricket on the Hearth</i> and <i>The Chimes</i>.',
      'At One the curtains of Scrooge&rsquo;s bed were drawn aside by a strange figure, like a child and like an old man at once, with a bright clear jet of light springing from the crown of its head: the Ghost of Christmas Past. It clasped him gently by the arm, and they passed through the wall. You went after them.',
      'The Ghost has brought him to a warehouse in the city, on a Christmas Eve long ago, where young Ebenezer Scrooge was an apprentice. &ldquo;These are but shadows of the things that have been,&rdquo; it says. The shadows cannot see you either.'

    if (nextFile) return ['go', ['The flashback has done its work. The button at the bottom takes you back with Scrooge.']];

      'Start with the shadows on the left. Each one&rsquo;s page in your notebook ends with the Ghost asking Scrooge something, or with somebody saying something about him. Which of his words, in the middle, answers it?',
      'Two of the middle lines are Scrooge&rsquo;s, but from later staves, when other Spirits are with him. Then, for the right-hand ribbons: whom in Stave One is he thinking of? The boy at the school makes him think of another boy; Fan&rsquo;s child is his nephew; Fezziwig makes him think of his own clerk.',

  var JOT = '<h4>Flashbacks, and how you can tell somebody is changing</h4>' +
    '<p>A flashback takes the story back to an earlier time. It is never there by accident: it explains how a person came to be the way they are now, and it often starts to change them.</p>' +
    '<p>Writers seldom say &ldquo;he changed&rdquo;. They show it in small things. So watch the person who is watching:</p>' +
    '<ul><li>a tear, or a voice that catches;</li><li>a short answer that hides a feeling;</li><li>a wish: &ldquo;I should like to &hellip;&rdquo;, &ldquo;I wish &hellip;&rdquo;;</li><li>a plea to stop: &ldquo;show me no more&rdquo;.</li></ul>' +
    '<p>Then ask the most useful question of all: who in his present is he thinking of? A woman who suddenly asks after an old friend&rsquo;s children is not really thinking about the past. She is thinking about today.</p>';
  var SH = {
    sh1: ['The school', '<p>They went, the Ghost and Scrooge, across the hall, to a door at the back of the house. It opened before them, and disclosed a long, bare, melancholy room, made barer still by lines of plain deal forms and desks. At one of these a lonely boy was reading near a feeble fire; and Scrooge sat down upon a form, and wept to see his poor forgotten self as he used to be.</p><p class="gap">* * *</p>' +
      '<p>&ldquo;I wish,&rdquo; Scrooge muttered, putting his hand in his pocket, and looking about him, after drying his eyes with his cuff: &ldquo;but it&rsquo;s too late now.&rdquo;</p><p>&ldquo;What is the matter?&rdquo; asked the Spirit.</p>'],
    sh2: ['Little Fan', '<p>It opened; and a little girl, much younger than the boy, came darting in, and putting her arms about his neck, and often kissing him, addressed him as her &ldquo;Dear, dear brother.&rdquo;</p><p>&ldquo;I have come to bring you home, dear brother!&rdquo; said the child, clapping her tiny hands, and bending down to laugh. &ldquo;To bring you home, home, home!&rdquo;</p><p>&ldquo;Home, little Fan?&rdquo; returned the boy.</p><p class="gap">* * *</p>' +
      '<p>&ldquo;Always a delicate creature, whom a breath might have withered,&rdquo; said the Ghost. &ldquo;But she had a large heart!&rdquo;</p><p>&ldquo;So she had,&rdquo; cried Scrooge. &ldquo;You&rsquo;re right. I will not gainsay it, Spirit. God forbid!&rdquo;</p><p>&ldquo;She died a woman,&rdquo; said the Ghost, &ldquo;and had, as I think, children.&rdquo;</p>'],
    sh3: ['A golden idol', '<p>Again Scrooge saw himself. He was older now; a man in the prime of life. His face had not the harsh and rigid lines of later years; but it had begun to wear the signs of care and avarice.</p><p>He was not alone, but sat by the side of a fair young girl in a mourning-dress: in whose eyes there were tears, which sparkled in the light that shone out of the Ghost of Christmas Past.</p>' +
      '<p>&ldquo;It matters little,&rdquo; she said, softly. &ldquo;To you, very little. Another idol has displaced me; and if it can cheer and comfort you in time to come, as I would have tried to do, I have no just cause to grieve.&rdquo;</p><p>&ldquo;What Idol has displaced you?&rdquo; he rejoined.</p><p>&ldquo;A golden one.&rdquo;</p><p class="gap">* * *</p>' +
      '<p>&ldquo;&hellip; I release you. With a full heart, for the love of him you once were.&rdquo;</p><p class="gap">* * *</p><p>She left him, and they parted.</p>'],
    sh4: ['Belle&rsquo;s house', '<p>They were in another scene and place; a room, not very large or handsome, but full of comfort. Near to the winter fire sat a beautiful young girl, so like that last that Scrooge believed it was the same, until he saw her, now a comely matron, sitting opposite her daughter.</p><p class="gap">* * *</p>' +
      '<p>&ldquo;Belle,&rdquo; said the husband, turning to his wife with a smile, &ldquo;I saw an old friend of yours this afternoon.&rdquo;</p><p>&ldquo;Who was it?&rdquo;</p><p>&ldquo;Guess!&rdquo;</p><p>&ldquo;How can I? Tut, don&rsquo;t I know?&rdquo; she added in the same breath, laughing as he laughed. &ldquo;Mr. Scrooge.&rdquo;</p>' +
      '<p>&ldquo;Mr. Scrooge it was. I passed his office window; and as it was not shut up, and he had a candle inside, I could scarcely help seeing him. His partner lies upon the point of death, I hear; and there he sat alone. Quite alone in the world, I do believe.&rdquo;</p>']
  };
  $('#jot').addEventListener('click', function () {

    ER.read({ html: JOT, cls: 'jot', clue: { id: 'jot', title: 'Flashbacks, and change', kind: 'Left in the book' }, done: function () {

        { note: 'A strange figure: like a child, yet not so like a child as like an old man. Its hair is white as if with age, and yet the face has not a wrinkle in it. From the crown of its head there springs a bright clear jet of light.', a: '&ldquo;Who, and what are you?&rdquo; Scrooge demanded.</p><p>&ldquo;I am the Ghost of Christmas Past.&rdquo;</p><p>&ldquo;Long Past?&rdquo; inquired Scrooge: observant of its dwarfish stature.</p><p>&ldquo;No. Your past.&rdquo;' },
        { a: '&ldquo;These are but shadows of the things that have been,&rdquo; said the Ghost. &ldquo;They have no consciousness of us.&rdquo;' },
        { note: 'Here, at the ball, the Ghost signs to Scrooge to listen to the two apprentices, who are pouring out their hearts in praise of Fezziwig.', a: '&ldquo;A small matter,&rdquo; said the Ghost, &ldquo;to make these silly folks so full of gratitude.&rdquo;</p><p>&ldquo;Small!&rdquo; echoed Scrooge.</p><p>&ldquo;Why! Is it not? He has spent but a few pounds of your mortal money: three or four perhaps. Is that so much that he deserves this praise?&rdquo;' },
        { a: '&ldquo;It isn&rsquo;t that,&rdquo; said Scrooge, heated by the remark, and speaking unconsciously like his former, not his latter, self. &ldquo;It isn&rsquo;t that, Spirit. He has the power to render us happy or unhappy; to make our service light or burdensome; a pleasure or a toil. Say that his power lies in words and looks; in things so slight and insignificant that it is impossible to add and count &rsquo;em up: what then? The happiness he gives, is quite as great as if it cost a fortune.&rdquo;' },
        { a: 'He felt the Spirit&rsquo;s glance, and stopped.</p><p>&ldquo;What is the matter?&rdquo; asked the Ghost.</p><p>&ldquo;Nothing particular,&rdquo; said Scrooge.</p><p>&ldquo;Something, I think?&rdquo; the Ghost insisted.' },

    });

  $('#fezz').addEventListener('click', function () {

        { a: '&ldquo;Yo ho, my boys!&rdquo; said Fezziwig. &ldquo;No more work to-night. Christmas Eve, Dick. Christmas, Ebenezer! Let&rsquo;s have the shutters up,&rdquo; cried old Fezziwig, with a sharp clap of his hands, &ldquo;before a man can say Jack Robinson!&rdquo;' },
        { a: '&ldquo;Hilli-ho!&rdquo; cried old Fezziwig, skipping down from the high desk, with wonderful agility. &ldquo;Clear away, my lads, and let&rsquo;s have lots of room here! Hilli-ho, Dick! Chirrup, Ebenezer!&rdquo;' },

  CC.thing('#clock', 'clock', 'The clock points to the hour of seven. This domestic ball will break up when it strikes eleven.', isBusy);
  CC.thing('#shut', 'shutters', 'The shutters went up, one, two, three, four, five, six, barred and pinned, seven, eight, nine, before you could have got to twelve.', isBusy);
  CC.thing('#table', null, 'There is cake, and there is negus, and there is a great piece of Cold Roast, and a great piece of Cold Boiled, and mince-pies, and plenty of beer.', isBusy);
  CC.thing('#desk', 'fiddler', 'The fiddler has made an orchestra of the lofty desk, and tunes like fifty stomach-aches.', isBusy);
  CC.thing('#hearth', null, 'Fuel heaped upon the fire, the floor swept and watered, the lamps trimmed: as snug, and warm, and dry, and bright a ball-room as you would desire to see.', isBusy);
  function openOrSay() {
    if (busy) return;
    if (nextFile) { ER.say('Old Scrooge&rsquo;s heart and soul are in the scene, and with his former self.'); return; }
    if (!ready()) { ER.say(!told.has('jot') ? 'Old Scrooge, as still as a post. Before you touch his words, see what a reader left under the bench.' : !told.has('ghost') ? 'Old Scrooge, as still as a post. The Ghost beside him is lighting the whole room.' : 'Old Scrooge, as still as a post. Read the shadows on the walls first: every one of them.'); return; }

  }
  $('#ribbons').addEventListener('click', openOrSay);
  $('#scr').addEventListener('click', openOrSay);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the lock: tie the ribbons ---------- */
  var A = [['a1', 'The school', '&ldquo;What is the matter?&rdquo; asked the Spirit.'], ['a2', 'Little Fan', '&ldquo;She died a woman,&rdquo; said the Ghost, &ldquo;and had, as I think, children.&rdquo;'],
    ['a3', 'Mr. Fezziwig&rsquo;s ball', '&ldquo;Something, I think?&rdquo; the Ghost insisted.'], ['a4', 'Belle&rsquo;s house', '&ldquo;&hellip; there he sat alone. Quite alone in the world, I do believe.&rdquo;']];
  var B = [['b1', '&ldquo;Spirit,&rdquo; said Scrooge, with an interest he had never felt before, &ldquo;tell me if Tiny Tim will live.&rdquo;'],
    ['b2', '&ldquo;I should like to be able to say a word or two to my clerk just now. That&rsquo;s all.&rdquo;'],
    ['b3', '&ldquo;Spirit!&rdquo; said Scrooge in a broken voice, &ldquo;remove me from this place.&rdquo;'],
    ['b4', '&ldquo;There was a boy singing a Christmas Carol at my door last night. I should like to have given him something: that&rsquo;s all.&rdquo;'],
    ['b5', '&ldquo;I am not the man I was.&rdquo;'],
    ['b6', '&ldquo;One child,&rdquo; Scrooge returned. &hellip; Scrooge seemed uneasy in his mind; and answered briefly, &ldquo;Yes.&rdquo;']];
  var C = [['c1', '&ldquo;I wish to be left alone,&rdquo; said Scrooge.'], ['c2', 'Scrooge seized the ruler with such energy of action, that the singer fled in terror'],
    ['c3', '&ldquo;The Treadmill and the Poor Law are in full vigour, then?&rdquo; said Scrooge.'], ['c4', '&ldquo;I want nothing from you; I ask nothing of you; why cannot we be friends?&rdquo; &ldquo;Good afternoon,&rdquo; said Scrooge.'],
    ['c5', '&ldquo;Let me hear another sound from you,&rdquo; said Scrooge, &ldquo;and you&rsquo;ll keep your Christmas by losing your situation!&rdquo;']];
  function openLock() {
    var busyL = false, AB = ER.flag('c-ab') || {}, BC = ER.flag('c-bc') || {}, sel = null;
    lock = ER.el('div', 'pz');
    var box = ER.el('div', 'dance');
    box.innerHTML = '<h5>Tie each shadow to Scrooge&rsquo;s words, and his words to Christmas Eve</h5><div class="cols"><svg class="rib"></svg>' +
      '<div class="col" data-c="A"><i>The shadow</i></div><div class="col" data-c="B"><i>What Scrooge said as he watched</i></div><div class="col" data-c="C"><i>Whom he was thinking of: Stave One</i></div></div>';
    var foot = ER.el('div', 'pz-foot', '<p class="pmsg"></p><button type="button" class="btn" id="strike">Strike up Sir Roger de Coverley</button>');
    lock.appendChild(box); lock.appendChild(foot);
    var cols = box.querySelector('.cols'), svg = box.querySelector('svg.rib'), m = foot.querySelector('.pmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function card(col, d, html) { var c = ER.el('div', 'cd', html); c.setAttribute('data-id', d); c.setAttribute('data-col', col); box.querySelector('.col[data-c="' + col + '"]').appendChild(c); }
    A.forEach(function (a) { card('A', a[0], '<b>' + a[1] + '</b><small>' + a[2] + '</small>'); });
    B.forEach(function (b) { card('B', b[0], ER.gloss(b[1])); });
    C.forEach(function (c) { card('C', c[0], ER.gloss(c[1])); });
    function cardEl(id) { return box.querySelector('.cd[data-id="' + id + '"]'); }
    function draw() {
      var R = cols.getBoundingClientRect(), s = '';
      function seg(x, y, z, colour, kind) {
        var r1 = cardEl(x).getBoundingClientRect(), r2 = cardEl(y).getBoundingClientRect();
        var x1 = r1.right - R.left, y1 = r1.top + r1.height / 2 - R.top, x2 = r2.left - R.left, y2 = r2.top + r2.height / 2 - R.top, mx = (x1 + x2) / 2;
        var d = 'M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
        s += '<path class="r" d="' + d + '" stroke="' + colour + '"/><path class="hit" d="' + d + '" data-cut="' + kind + ':' + z + '"/>';
      }
      Object.keys(AB).forEach(function (a) { seg(a, AB[a], a, '#c0302a', 'ab'); });
      Object.keys(BC).forEach(function (b) { seg(b, BC[b], b, '#2a7a3a', 'bc'); });
      svg.innerHTML = s;
      ER.$$('.cd', box).forEach(function (c) { var id = c.getAttribute('data-id'); c.classList.toggle('sel', id === sel); });
      ER.flag('c-ab', AB); ER.flag('c-bc', BC);
    }
    function tie(x, y) {
      var cx = x.charAt(0), cy = y.charAt(0), k;
      if (cx === 'b' && cy === 'a') { k = x; x = y; y = k; cx = 'a'; cy = 'b'; }
      if (cx === 'c' && cy === 'b') { k = x; x = y; y = k; cx = 'b'; cy = 'c'; }
      if (cx === 'a' && cy === 'b') { for (k in AB) if (AB[k] === y) delete AB[k]; AB[x] = y; return true; }
      if (cx === 'b' && cy === 'c') { for (k in BC) if (BC[k] === y) delete BC[k]; BC[x] = y; return true; }
      return false;
    }
    box.addEventListener('click', function (e) {
      if (busyL || nextFile) return;
      var cut = e.target.getAttribute && e.target.getAttribute('data-cut');
      if (cut) { var p = cut.split(':'); if (p[0] === 'ab') delete AB[p[1]]; else delete BC[p[1]]; CC.sfx.snow(); draw(); msg('Ribbon untied.'); return; }
      var c = e.target.closest ? e.target.closest('.cd') : null; if (!c) return;
      ER.$$('.bad', box).forEach(function (n) { n.classList.remove('bad'); });
      var id = c.getAttribute('data-id');
      if (!sel) { sel = id; CC.sfx.pluck(); draw(); return; }
      if (sel === id) { sel = null; draw(); return; }
      if (tie(sel, id)) { sel = null; CC.sfx.pluck(); draw(); msg('Tied.'); }
      else { sel = id; draw(); msg('A ribbon runs between two cards side by side: a shadow and Scrooge&rsquo;s words, or his words and Stave One.'); }
    });
    window.addEventListener('resize', function () { if (lock && lock.parentNode) draw(); });
    foot.querySelector('#strike').addEventListener('click', function () {
      if (busyL || nextFile) return;
      for (var i = 0; i < A.length; i++) {
        var a = A[i][0], b = AB[a], c = b ? BC[b] : null, row = cardEl(a);
        if (!b) { ER.sfx.no(); msg('The fiddler waits. The shadow &lsquo;' + A[i][1] + '&rsquo; has no ribbon to Scrooge&rsquo;s words yet. Click a card, then the card it belongs with.'); return; }
        if (!c) { ER.sfx.no(); msg('The fiddler waits. The words tied to &lsquo;' + A[i][1] + '&rsquo; have no ribbon to Stave One yet.'); return; }

          row.classList.add('bad'); cardEl(b).classList.add('bad'); ER.sfx.no();

          return;
        }
        if (!ER.check(a + 'c', c)) {
          cardEl(b).classList.add('bad'); cardEl(c).classList.add('bad'); ER.sfx.no();
          msg(ER.check('cd', c) ? 'The music stumbles. Scrooge did say that on Christmas Eve, but nobody in tonight&rsquo;s shadows makes him think of it. <i>(Only the first wrong ribbon is ever shown.)</i>' : 'The music stumbles. Who in Stave One is Scrooge thinking of, as he says that? Find what he said or did to that person on Christmas Eve: the pages are in your notebook. <i>(Only the first wrong ribbon is ever shown.)</i>');
          return;
        }
      }
      var cand = A.map(function (a) { return AB[a[0]] + '.' + BC[AB[a[0]]]; }).join('-');
      var file = ER.exit([cand], { wait: true });
      if (!file) { msg('The ribbons will not hold. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('c-file', file); busyL = true; paint();
      msg('The fiddler strikes up &lsquo;Sir Roger de Coverley&rsquo;, and old Scrooge begins to move.');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        CC.mine('ribbons', 'What the shadows did to Scrooge', '<p>The school, the lonely boy: &ldquo;There was a boy singing a Christmas Carol at my door last night. I should like to have given him something: that&rsquo;s all.&rdquo; He thinks of the carol singer he chased off with the ruler.</p><p>Little Fan, who had one child: &ldquo;Your nephew!&rdquo; Uneasy, he answers, &ldquo;Yes.&rdquo; He thinks of Fred, who asked &lsquo;why cannot we be friends?&rsquo;</p><p>Fezziwig&rsquo;s ball: &ldquo;I should like to be able to say a word or two to my clerk just now.&rdquo; He thinks of Bob, whom he threatened with losing his situation.</p><p>Belle&rsquo;s house, where her husband saw him &lsquo;quite alone in the world&rsquo;: &ldquo;Spirit!&rdquo; &hellip; &ldquo;remove me from this place.&rdquo; On Christmas Eve he told the gentlemen, &lsquo;I wish to be left alone.&rsquo;</p><p>Belle&rsquo;s husband saw him on the night his partner lay dying: Marley died seven years ago, on Christmas Eve.</p>');
        ER.narrate([
          'During the whole of the ball, old Scrooge acts like a man out of his wits. His heart and soul are in the scene, and with his former self. He corroborates everything, remembers everything, enjoys everything.',
          'He says: &ldquo;I should like to be able to say a word or two to my clerk just now. That&rsquo;s all.&rdquo; It is a very small sentence. It is the first time in the book that Scrooge has wished he had been kinder to anybody now alive.',
          '&ldquo;My time grows short,&rdquo; says the Spirit. &ldquo;Quick!&rdquo; And the shadows go by: Belle in her mourning-dress, and Belle by her own fire with her daughter. <i>&ldquo;Spirit!&rdquo; said Scrooge in a broken voice, &ldquo;remove me from this place.&rdquo;</i>',
          'Scrooge seizes the great extinguisher-cap and presses it down on the Ghost&rsquo;s head; but he cannot hide the light, which streams from under it in an unbroken flood upon the ground.',
          'And he is in his own bedroom again, and reels to bed, and sinks into a heavy sleep. You hold on to the bed-curtain. The next stave is a long one, and it begins with a snore.'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 2600);
    });
    msg('Click a card, then the card it belongs with in the next column, to tie a ribbon. Click a ribbon to untie it. Every shadow needs a red ribbon to Scrooge&rsquo;s words, and his words a green ribbon to Stave One.');
    ER.open('ov-lock', lock);
    setTimeout(draw, 30);
  }
})();
