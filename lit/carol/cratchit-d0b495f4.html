<style>
  body{--bg:#3a160e;--accent:#ffb870;--font-display:'Goudy Bookletter 1911',serif;--font-ui:'Goudy Bookletter 1911',serif;--font-body:'Alegreya',serif;
    --tc-bg:rgba(58,22,14,.96);--tc-ink:#fbe8d4;--cap-bg:rgba(60,24,14,.95);--panel:#4a2216;--face-bg:#6a3022;--q-ink:#ffc890;--fade:#140604;--hud-bg:rgba(58,22,14,.84)}

  .sG{font-family:'Goudy Bookletter 1911',serif;text-anchor:middle}
  .sC{font-family:'Cinzel',serif;text-anchor:middle}
  .flame{animation:flick 2s steps(1,end) infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes flick{0%{transform:scaleY(1)}40%{transform:scaleY(.85)}70%{transform:scaleY(1.1)}}
  #snow1 circle,#snow2 circle{animation:fall 7s linear infinite}

  #street{display:none}
  #scene.night #street{display:inline}#scene.night #home{display:none}
  #coins.ready,#cipher.ready,#bill.ready,#kids.ready{animation:glow 1.5s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.5)}}
  #torch{animation:torchg 2.4s steps(4,end) infinite}
  @keyframes torchg{50%{opacity:.7}}

  /* the lock: the sums of Stave Three */
  .sums{padding:14px 20px 14px;background:#f6efdc linear-gradient(90deg,rgba(120,90,40,.12),rgba(255,255,255,0) 6%,rgba(255,255,255,0) 94%,rgba(120,90,40,.1));color:#231c14;border:1px solid #9a8a62;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .sums h5{margin:0 0 8px;font-family:'Goudy Bookletter 1911',serif;font-weight:normal;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#7a2a1c;text-align:center}
  .row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:center;padding:7px 0;border-top:1px solid #d8c8a0}
  .row q{display:block;quotes:none;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:16px;line-height:1.3}
  .row q small{display:block;font-style:normal;font-family:'Goudy Bookletter 1911',serif;font-size:12px;letter-spacing:.14em;color:#8a7a5a;margin-top:2px}
  .row .ask{font-family:'Goudy Bookletter 1911',serif;font-size:15px;color:#3a2a1a;margin-bottom:4px}
  .dish{min-height:58px;padding:5px;border:2px dashed #b8a070;border-radius:30px;background:#efe4c6;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer}
  .dish.on{border-style:solid;border-color:#a8231c;background:#f8ecd0;box-shadow:0 0 0 3px rgba(168,35,28,.2)}
  .dish.bad{background:#f3c4b4}
  .dial{display:flex;align-items:center;gap:10px}
  .dial button{width:34px;height:34px;border:1px solid #7a5a3a;border-radius:50%;font-size:20px;line-height:30px;color:#3a2a1a;background:#fbf4e0}
  .dial b{min-width:44px;text-align:center;font-family:'Goudy Bookletter 1911',serif;font-size:28px;font-weight:normal;color:#7a2a1c}
  .dial.bad b{color:#c0302a}
  .tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;padding:8px;border-top:3px double #b8a070}
  .coin{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:'Goudy Bookletter 1911',serif;color:#2a1a0a;text-align:center;line-height:1;cursor:pointer;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}
  .coin.g{background:radial-gradient(circle at 35% 35%,#fff3b0,#d8a830 60%,#9a7010)}
  .coin.s{background:radial-gradient(circle at 35% 35%,#ffffff,#c8ccd0 60%,#8a9096)}
  .coin.c{background:radial-gradient(circle at 35% 35%,#f8c0a0,#b8683a 60%,#7a3a1a)}
  .tray .coin{width:74px;height:74px;font-size:12.5px;padding:6px}
  .dish .coin{width:46px;height:46px;font-size:9px;padding:3px}
  .coin:hover{filter:brightness(1.1)}

  /* the Spirit's last words */
  .robe{width:min(760px,94vw);padding:18px 24px 16px;background:#1e3a1e linear-gradient(160deg,#2a4e2a,#14280e);border:6px solid #f4efe4;box-shadow:0 26px 70px rgba(0,0,0,.75);color:#f6efdc}
  .robe h5{margin:0 0 6px;font-family:'Goudy Bookletter 1911',serif;font-weight:normal;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#d8e8c0;text-align:center}
  .robe p.q{margin:0 0 12px;font-family:'Alegreya',serif;font-size:20px;line-height:1.4;text-align:center}
  .robe .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .robe .opt{padding:10px 14px;background:#f6efdc;color:#231c14;border:2px solid #c8b88a;border-radius:4px;font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.3;text-align:left;cursor:pointer}
  .robe .opt:hover{border-color:#ffd36a}
  .robe .opt.bad{background:#f3c4b4}
  .robe .opt.ok{background:#e0f0c8;border-color:#5a8a3a}
</style>

    ECHO.forEach(function (e) { var b = ER.el('button', 'opt', ER.gloss(e[1] + ' <small>(Stave One)</small>')); b.type = 'button'; b.setAttribute('data-e', e[0]); opts.appendChild(b); });
    opts.addEventListener('click', function (ev) {
      var b = ev.target.closest('.opt'); if (!b || done) return;
      var id = b.getAttribute('data-e');
      if (!ER.check('ec', id)) { b.classList.add('bad'); ER.shake(b); ER.sfx.no(); m.innerHTML = ER.gloss('The Spirit is silent. Scrooge did say that on Christmas Eve. But Scrooge has asked about a refuge: a place for such children to go. When the gentlemen asked about the Poor, which places did he name?'); return; }
      var cand = (ER.flag('d-cand') || '') + '-' + id, file = ER.exit([cand], { wait: true });
      if (!file) { m.innerHTML = 'The Spirit does not answer. Something is wrong with this page: tell your teacher.'; return; }
      done = true; b.classList.add('ok'); nextFile = file; ER.flag('d-file', file);
      m.innerHTML = ER.gloss('&ldquo;Are there no prisons?&rdquo; said the Spirit, turning on him for the last time with his own words. &ldquo;Are there no workhouses?&rdquo;');
      setTimeout(function () {
        ER.closeAll(); busy = true;
        ER.narrate([
          'The bell strikes twelve. You see it as well as hear it: the church clock across the street stands at midnight, and the snow shakes off the tower with every stroke.',
          'Scrooge looks about him for the Ghost, and sees it not. As the last stroke ceases to vibrate, he remembers the prediction of old Jacob Marley.',
          'And lifting up his eyes, he sees a solemn Phantom, draped and hooded, coming, like a mist along the ground, towards him.'
        ], function () {
          CC.mine('echo', 'His own words', '<p>On Christmas Eve, to the gentlemen: &ldquo;Are there no prisons?&rdquo; &hellip; &ldquo;And the Union workhouses?&rdquo; and &ldquo;decrease the surplus population&rdquo;.</p><p>In Stave Three the Spirit gives both back to him: the surplus population at the Cratchits&rsquo; table, and the prisons and workhouses when Scrooge asks if Ignorance and Want have any refuge.</p><p>An echo like this makes you remember where you first heard the words, and see them differently.</p>');
          CC.terms(['echo']); busy = false; $('#go').classList.add('on');
        });
        ER.sfx.bell(); setTimeout(ER.sfx.bell, 900);
      }, 2600);
    });
    ER.open('ov-lock', lock);
  }
})();
</script>
