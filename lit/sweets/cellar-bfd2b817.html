  .fin{width:min(1060px,95vw);-webkit-user-select:none;user-select:none}
  .fin>svg{display:block;width:100%;height:auto;border-radius:6px 6px 0 0;box-shadow:0 26px 70px rgba(0,0,0,.7)}

  .fin .poem{background:#fffaf0;color:#1c2a20;font-family:'Alegreya',serif;font-style:italic;font-size:16.5px;line-height:1.36;padding:10px 18px 10px 24px;border-left:14px solid #24553a;border-radius:0 0 0 6px}

  .fin .side{padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
  .fin .route{display:flex;gap:8px}
  .fin .route span{flex:1;min-height:42px;padding:6px 6px 4px;border:2px dashed rgba(159,240,192,.5);border-radius:4px;font-family:'Fredericka the Great',serif;font-size:15px;color:#e8f4ec;text-align:center;line-height:1.15}
  .fin .route span i{display:block;font-family:'Goudy Bookletter 1911',serif;font-style:normal;font-size:12px;letter-spacing:.16em;color:#9ff0c0}
  .fin .route span.on{border-style:solid;background:rgba(159,240,192,.12)}
  .fin .bmsg{min-height:72px;font-size:17.5px}
  .fin .row{display:flex;align-items:center;gap:10px}
  .fin .row .hearts{flex:1;font-family:'Goudy Bookletter 1911',serif;font-size:14px;letter-spacing:.12em;color:#c8e8d4}
  .fin .btn{--accent:#9ff0c0;background:rgba(0,0,0,.35)}
  .fin .m{cursor:pointer}
  .fin .m:hover .plate{filter:brightness(1.15)}
</style>

    told.set('in');
    ER.narrate([
      'Stone steps, and a smell of damp and old caramel. The cellar of Plunkett&rsquo;s is where Miss Plunkett kept everything that went wrong: shelves of jars with labels like BOOMERANG BONBONS and ACHOOLATES, and a sign over her desk, I WORK WHERE MY MISTAKES CAN SEE ME.',
      'Along the back wall stand six machines in a row, each with a brass plate, and each with a picture on it.',
      'In the corner is a safe as big as a wardrobe, with SECRET RECIPES on the door in gold. Mr Huxtable has his ear against it and is turning the dial, one click at a time. He does not look round.',
      'Mr Gribble comes down last, holding the rail. &ldquo;Item: one cellar,&rdquo; he says. &ldquo;Damp.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- papers ---------- */
  var PAGE = '<h4>Literal and figurative</h4><h5>on the desk, under the lamp</h5>' +
    '<p>Every riddle has two readings.</p>' +
    '<p>The <b>literal</b> reading takes every word at its plain, dictionary meaning. Read literally, <span class="ex">she has a heart of gold</span> means that a doctor would find gold inside her.</p>' +
    '<p>The <b>figurative</b> reading asks why the picture is there: she is kind, and worth a great deal.</p>' +
    '<p>A good <b>riddle</b> sets the literal reading as a trap. It shows you a thing (a crown, a lion, a door) so that you go looking for that thing, when it is really talking about what the thing is like: grand, brave, a way in.</p>' +
    '<p>So, for each line: find the picture. Ask what it is like. Hot or cold? Hard or soft? Plain or sparkling? Then find what has that quality.</p>' +
    '<p class="ex">Nothing in my riddle is a lie. It is all true, sideways.</p>';
  var POEM = '<p>My heart is boiled, my paper&rsquo;s printed;<br>Now finish me the way I&rsquo;ve hinted.</p>' +
    '<p>First, put me to bed with the winter moon,<br>Where the frost has teeth, and the wind a tune.</p>' +
    '<p>Then dress me up in the sky&rsquo;s best coat,<br>With a thousand stars from my toes to my throat.</p>' +
    '<p>Last, let it snow on me, soft and slow:<br>Not cold, not wet. The finest snow.</p>' +
    '<p>Then wrap me, and climb to the roof, and see<br>Who wakes up first: the sun, or me.</p>';
  var RIDDLE = '<h4>The green book &middot; pinned over the desk</h4><h3>The Last Sweet</h3><p class="hand">Part Three: the Finish</p><div class="poem">' + POEM + '</div>';
  var BELLOC = '<h4>Cautionary Tales for Children</h4><h5>by Hilaire Belloc &middot; 1907 &middot; on Miss Plunkett&rsquo;s desk</h5>' +
    '<p>A battered red book, with a bookmark at the first page of &lsquo;Henry King&rsquo;:</p>' +
    '<p class="q">The Chief Defect of Henry King<br>Was chewing little bits of String.</p>' +
    '<p class="hand">I learnt these by heart when I was nine. A cautionary tale is a warning that makes you laugh: a funny poem in which the naughty one comes to a sticky end that fits the fault exactly. That is called poetic justice, and the lesson at the end is the moral. My brass plates are written in Mr Belloc&rsquo;s manner, with Capital Letters for the Important Words. O.P.</p>';
  $('#riddle').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: RIDDLE, cls: 'green', clue: { id: 'finish', title: 'The Last Sweet: the Finish', kind: 'The green book' }, done: function () {
      SW.terms(['riddle']);
      if (told.set('riddle')) { paint(); ER.say(told.has('page') ? 'A bed, a moon, a coat, snow. And six machines with pictures on them.' : 'A bed and a moon, a coat and snow. On the desk below is a page in the same hand.'); }
    } });
  });
  $('#desk').addEventListener('click', function (e) {
    if (busy) return;
    if (e.target.closest && e.target.closest('#bellocb')) { readBelloc(); return; }
    ER.read({ html: PAGE, cls: 'page', clue: { id: 'literal', title: 'Literal and figurative', kind: 'On the desk' }, done: function () {
      SW.terms(['literal', 'figurative', 'riddle']);
      if (told.set('page')) { paint(); ER.say(told.has('riddle') ? 'Find the picture, then ask what it is like. The six machines are waiting.' : 'True, sideways. The riddle is pinned on the pillar above the desk.'); }
    } });
  });
  function readBelloc() {
    ER.read({ html: BELLOC, cls: 'bk', clue: { id: 'belloc', title: 'Cautionary Tales for Children', kind: 'On the desk' }, done: function () {
      SW.terms(['cautionary tale', 'verse', 'moral', 'poetic justice']);
      if (told.set('belloc')) ER.say('A warning that makes you laugh. Two buyers have met their brass plates already tonight.');
    } });
  }

  /* ---------- things in the cellar ---------- */
  ORDER.forEach(function (k) {
    $('#m-' + k).addEventListener('click', function () {
      if (busy) return;
      if (nextFile) { ER.say(k === 'chillery' || k === 'glittermill' || k === 'moongrinder' ? 'The ' + NAME[k] + ' is quiet now. It did its part.' : LOOK[k]); return; }
      if (ready()) { openLock(); return; }
      ER.say(LOOK[k]);
    });
  });
  SW.thing('#shelves', null, 'Sixty-eight years of mistakes in jars. BOOMERANG BONBONS: they come back. ACHOOLATES: chocolates that make you sneeze, and then giggle, and then sneeze. UNBAKERS: they turn a cake back into eggs and flour. FAILED, says every label, in the same purple ink.', isBusy);
  SW.thing('#humbugs', null, function () { return told.has('safe') ? 'The jar of Openhand Humbugs is a good deal emptier than it was.' : 'A jar of black-and-white humbugs. OPENHAND HUMBUGS. FAILED. DO NOT TAKE ONE. And underneath, smaller: (They are free.)'; }, isBusy);
  SW.thing('#safe', null, function () { return told.has('safe') ? 'The safe is open. Inside, there is nothing but one sheet of paper.' : 'A safe as big as a wardrobe: SECRET RECIPES, in gold. Mr Huxtable has his ear against the door and is turning the dial, one click at a time. He has written two hundred numbers on his cuff, and crossed them all out.'; }, isBusy);
  SW.thing('#catg', null, 'Sherbet has followed you all the way down. She sits by the desk, looking at the machines as if she has seen all this before.', isBusy);
  $('#huxtable').addEventListener('click', function () {
    if (busy) return;
    ER.say(told.has('safe') ? '&ldquo;Have my scarf,&rdquo; says Mr Huxtable, unwinding it and putting it round your neck. &ldquo;Have my bus ticket. Have this button. I&rsquo;ve got another.&rdquo;' : '&ldquo;Three hundred and twelve,&rdquo; says Mr Huxtable to the safe. &ldquo;Three hundred and thirteen. Go away. Three hundred and fourteen.&rdquo;');
  });
  $('#gribble').addEventListener('click', function () {
    if (busy) return;
    ER.say(told.has('riddle') ? '&ldquo;Bed, moon, coat, snow, sun,&rdquo; says Mr Gribble, ticking them off. &ldquo;Item: one Snoozebox. Item: one Moongrinder. Item: one Overcoater. Item: one Sunbellows. It is perfectly simple. I cannot think why she called it a riddle.&rdquo;' : '&ldquo;Item: six machines,&rdquo; says Mr Gribble. &ldquo;Names: unknown to science.&rdquo;');
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the Finish: three machines, in order ---------- */
  var PARTS = {
    moongrinder: 'moon + grinder: a machine that grinds things very fine, with a moon painted on it',
    snoozebox: 'snooze + box: a box for sleeping in',
    chillery: 'chill + -ery: a place where things are chilled',
    overcoater: 'overcoat + -er: a machine that puts a coat on things',
    glittermill: 'glitter + mill: a mill that turns things until they glitter',
    sunbellows: 'sun + bellows: bellows that blow warm air, with a sun painted on them'
  };
  var WRONG = [
    { snoozebox: 'The Snoozebox: snooze + box, a box for sleeping in. &lsquo;Put me to bed&rsquo; is the picture, and that is the literal reading. But look at what comes with the bed: a winter moon, and frost with teeth. The heart comes out of the Snoozebox exactly as warm and soft as it went in.',
      moongrinder: 'The Moongrinder has a moon painted on it, and the verse says moon: that is the literal reading. The handle turns, and the heart comes out as a heap of copper dust. Was the first verse asking you to grind it, or to make it feel like a winter night?' },
    { overcoater: 'The Overcoater: overcoat + -er, a machine that puts a coat on. It knits the heart a tiny woolly coat with two buttons. That is the literal coat. But this is the sky&rsquo;s coat, with a thousand stars on it. What do stars do?' },
    { chillery: 'The Chillery again: chill + -ery, a place for chilling. Snow is cold, so that is the literal reading. But the verse says this snow is not cold and not wet. What is white, soft and very fine, and falls on a sweet like snow?' }
  ];
  var ASK = ['What is a winter night like, where the frost has teeth?', 'What does the sky&rsquo;s best coat look like at night, with a thousand stars on it?', 'What is soft, slow and fine, falls like snow, and is neither cold nor wet?'];
  function openLock() {
    var route = ER.flag('d-route') || [], hearts = ER.flag('d-hearts'), busyL = false, svg, m;
    if (hearts == null) hearts = 6;
    lock = ER.el('div', 'fin', '<svg viewBox="0 0 1000 290"></svg><div class="lo"><div class="poem"><h6>Part Three: the Finish</h6>' + POEM + '</div><div class="side">' +
      '<div class="route"><span data-i="0"><i>FIRST</i></span><span data-i="1"><i>THEN</i></span><span data-i="2"><i>LAST</i></span></div>' +
      '<p class="bmsg"></p><div class="row"><span class="hearts"></span><button type="button" class="btn" id="d-go">Pull the starting lever</button></div></div></div>');
    svg = lock.querySelector('svg'); m = lock.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('d-route', route); ER.flag('d-hearts', hearts); }
    function draw() {
      var s = '<defs>' + BRASS + '<linearGradient id="steelG2" x1="0" x2="1"><stop offset="0" stop-color="#8a98a8"/><stop offset=".4" stop-color="#e8f0f8"/><stop offset="1" stop-color="#7a8898"/></linearGradient></defs><rect width="1000" height="290" fill="#3a4a40"/><rect y="236" width="1000" height="54" fill="#2a322c"/>';
      ORDER.forEach(function (k, n) {
        var x = 88 + n * 165, at = route.indexOf(k);
        s += '<g class="m" data-k="' + k + '"><rect x="' + (x - 80) + '" y="6" width="160" height="276" fill="#000" opacity="0"/>' + machine(k, x, 210, 0.82, true) +
          (at >= 0 ? '<circle cx="' + (x + 58) + '" cy="30" r="20" fill="#9ff0c0" stroke="#1a3a2a" stroke-width="3"/><text x="' + (x + 58) + '" y="38" class="sF" font-size="22" fill="#1a3a2a">' + (at + 1) + '</text>' : '') + '</g>';
      });
      svg.innerHTML = s;
      ER.$$('.m', svg).forEach(function (g) { g.addEventListener('click', function () {
        var k = g.getAttribute('data-k'), at = route.indexOf(k);
        if (busyL || nextFile) return;
        if (at >= 0) route = route.slice(0, at);
        else if (route.length < 3) route.push(k);
        else { msg('Three steps are chosen already. Click a machine in the route to take it out again.'); return; }
        keep(); SW.sfx.click(); draw(); side();
        if (at < 0) msg(LOOK[k]);
      }); });
    }
    function side() {
      ER.$$('.route span', lock).forEach(function (sp, i) { var k = route[i]; sp.innerHTML = '<i>' + ['FIRST', 'THEN', 'LAST'][i] + '</i>' + (k ? NAME[k] : ''); sp.classList.toggle('on', !!k); });
      lock.querySelector('.hearts').textContent = 'Hearts left in the tray: ' + hearts;
    }
    lock.querySelector('#d-go').addEventListener('click', function () {
      var i, k, file;
      if (busyL || nextFile) return;
      if (route.length < 3) { ER.sfx.no(); msg('The lever will not move until three machines are chosen: one for each verse. Click the machines in the order the riddle gives.'); return; }
      busyL = true; SW.sfx.clunk();
      for (i = 0; i < 3; i++) if (!ER.check('r' + (i + 1), route[i])) break;
      if (i < 3) {
        k = route[i];
        setTimeout(function () {
          busyL = false; hearts--; ER.sfx.no();
          var t = 'The heart goes into the ' + NAME[k] + '. ' + ((WRONG[i] && WRONG[i][k]) || ('The ' + NAME[k] + ': ' + PARTS[k] + '. Is that what verse ' + (i + 1) + ' is asking for? ' + ASK[i]));
          if (hearts <= 0) { hearts = 6; t += ' That was the last heart. You run up to the boiling room and make the Heart again, exactly as before: a snail&rsquo;s sneeze, a shy guest, a waltz, a breathing pan, an old penny. Six more.'; }
          else t += ' One heart fewer in the tray.';
          keep(); side(); msg(t);
        }, 900);
        return;
      }
      file = ER.exitOk([route.join('-')]);
      if (!file) { busyL = false; msg('The lever sticks. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('d-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.cellar = 1; ER.persist(true);
      msg('The Chillery door swings open with a breath of frost, and swallows the tray. Its lamp turns blue. A card on the door says: <b>READY AT DAWN</b>.');
      setTimeout(function () { ER.closeAll(); SW.solved(); paint(); after(); }, 3600);
    });
    draw(); side();
    msg('Click the machines in the order the riddle gives: one for each verse. Click a chosen machine again to take it out. Then pull the lever.');
    ER.open('ov-lock', lock);
  }

  /* ---------- while the Chillery works: Mr Huxtable, the humbugs and the safe ---------- */
  function after() {
    busy = true;
    SW.mine('finishdone', 'The Finish', '<p>Verse 1: a bed with the winter moon, frost with teeth. Not the Snoozebox (bed) or the Moongrinder (moon): cold, so the CHILLERY (chill + -ery).</p><p>Verse 2: the sky&rsquo;s best coat, a thousand stars. Not the Overcoater (coat): sparkle, so the GLITTERMILL.</p><p>Verse 3: snow that is not cold and not wet. Not the Chillery: a fine white powder, so the MOONGRINDER (a machine that grinds).</p><p>Every time, the literal reading was the trap.</p>');
    ER.narrate([
      'The Chillery hums. It will be hours. You sit down on the bottom step with Sherbet, and Mr Gribble sits down beside you, and writes nothing at all for nearly a minute.',
      'At two o&rsquo;clock Mr Huxtable stops turning the dial. He looks very pleased with himself about something. He sits down on an upturned bucket and looks along the shelves, and his eye falls on a jar of black-and-white humbugs. OPENHAND HUMBUGS. FAILED. DO NOT TAKE ONE. (They are free.)',
      'Mr Huxtable has never in his life been able to leave anything that was free. He takes one. Then he takes four more, for later, and eats those too.',
      'For a moment nothing happens. Then he stands up, takes off his gloves, and gives them to the cat. He gives Mr Gribble his purse. He gives you his gold watch, and when you give it back he gives it to you again.',
      '&ldquo;And the safe!&rdquo; he cries. &ldquo;I got it ten minutes ago, and I was keeping it to myself! The year on the sign, backwards: eight, five, nine, one! Everybody have it!&rdquo; He spins the dial, and the great door swings open.',
      'There are no secret recipes in the safe. There is one sheet of paper, in purple ink: <i>There are no secret recipes in here. They are all in the green book, which nobody ever reads, because it is not locked. O.P.</i>',
      'Mr Gribble writes: <i>Item: one safe. Contents: one joke.</i> And on the shelf beside the humbug jar, a brass plate catches the light of the lamp.'
    ], function () {
      told.set('safe'); paint(); SW.sfx.till();
      SW.verse('mean', 'On the shelf beside the humbugs', function () {
        ER.narrate([
          'At ten to six the Chillery gives a cold little ping. The hearts come out frozen hard and shining, go round in the Glittermill until every one of them sparkles like the sky on a winter night, and come out of the Moongrinder&rsquo;s spout dusted with a snow as fine as flour.',
          'Six small copper sweets, glittering under a frost of white, lie on Miss Plunkett&rsquo;s desk. The last line of the riddle says: <i>Then wrap me, and climb to the roof, and see who wakes up first: the sun, or me.</i>'
        ], function () { busy = false; $('#go').classList.add('on'); });
      });
    });
  }
})();
</script>
</body>
</html>
