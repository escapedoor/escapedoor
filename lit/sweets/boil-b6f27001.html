    $('#penjar').innerHTML = s; s = '';
    [[560, 300, 0], [600, 290, 1], [1080, 300, 2], [1120, 296, 3]].forEach(function (l) { s += '<path d="M' + l[0] + ' 190v' + (l[1] - 230) + '" stroke="#c8a060" stroke-width="3"/><ellipse cx="' + l[0] + '" cy="' + (l[1] - 30) + '" rx="' + (l[2] % 2 ? 9 : 14) + '" ry="10" fill="#c8a060" stroke="#7a5a1e" stroke-width="2"/>'; });
    $('#ladles').innerHTML = s; s = '';
    for (i = 0; i < 6; i++) s += '<circle cx="' + (560 + i * 112) + '" cy="652" r="12" fill="#c8a060" stroke="#7a5a1e" stroke-width="2"/><path d="M' + (560 + i * 112) + ' 652l0 -9" stroke="#2a1a14" stroke-width="3"/>';
    $('#knobs').innerHTML = s; s = '';
    [[620, 120, 46], [840, 160, 60], [1060, 120, 46]].forEach(function (p, k) {
      s += '<g transform="translate(' + p[0] + ' 548)"><path class="flame" d="M-30 0q10 -26 20 -6q4 -24 14 0q8 -20 16 2z" fill="#4a8aff" opacity=".85"/></g>';
    });
    $('#flames').innerHTML = s; s = '';
    [[620, 92, 70], [840, 130, 96], [1060, 92, 70]].forEach(function (p) {
      s += '<path d="M' + (p[0] - p[1]) + ' 548v-' + p[2] + 'h' + (p[1] * 2) + 'v' + p[2] + 'q0 8 -10 8h-' + (p[1] * 2 - 20) + 'q-10 0 -10 -8z" fill="url(#copperG)" stroke="#5a2a0e" stroke-width="3"/>' +
        '<ellipse cx="' + p[0] + '" cy="' + (548 - p[2]) + '" rx="' + p[1] + '" ry="12" fill="#5a2a0e"/><ellipse cx="' + p[0] + '" cy="' + (550 - p[2]) + '" rx="' + (p[1] - 8) + '" ry="8" fill="#e8962a"/>' +
        '<path d="M' + (p[0] + p[1]) + ' ' + (520 - p[2] / 2) + 'h50" stroke="#5a2a0e" stroke-width="10" stroke-linecap="round"/>';
    });

    $('#steamg').innerHTML = s; s = '';
    for (i = 0; i < 6; i++) s += '<ellipse cx="' + (1232 + i * 22) + '" cy="652" rx="9" ry="6" fill="#b8622a" stroke="#6a2e10" stroke-width="1.5"/>';
    $('#pebg').innerHTML = s;
    $('#catg').innerHTML = SW.fig('catsleep'); $('#cocoon').innerHTML = SW.fig('cocoon');
    ['gribble', 'mortlake', 'huxtable'].forEach(function (w) { $('#' + w).innerHTML = SW.fig(w); });
  })();

  ER.init({
    theme: 'lit', story: 'sweets', storyTitle: 'Miss Plunkett’s Last Recipe', id: 'boil', no: 'II', title: 'The Boiling Room',
    go: 'Go in',
    intro: [
      'Twelve jars of words nobody had ever seen, taken to pieces. Snooze + -lets, little sweets for falling asleep, for Tilly&rsquo;s grandad. Un- + hiccups, which undoes them, for Omar&rsquo;s sister. Guffaw + waffles for Wen&rsquo;s baby, shiver + -lets for Rory&rsquo;s hot flat, and un- + scare + -able for Maisie at the dentist. The bell rang, and the till sprang open.',
      'Miss Plunkett&rsquo;s last recipe has three parts: the Heart, the Paper and the Finish. Part One is made in the boiling room, the hottest place in the building, where her copper pans have been simmering for sixty-eight years.',
      'You are carrying the green book. Behind you come Mr Gribble, writing, and three buyers who cannot read a word of it and would very much like to know what it says.'
    ],
    exit: {"next":"wrap","w":{"4f37f7e5":"ae8d5096"}}, tags: {"fl":["c3c8527d"],"su":["fe2c7709"],"st":["70c3d787"],"li":["123b22fb"],"co":["ad83620e"]},

  told = SW.told('b-told'); nextFile = ER.flag('b-file') || null;
  function isBusy() { return busy; }

  function paint() {

    $('#range').classList.toggle('ready', ready() && !nextFile);
    ER.pips((told.has('spun') ? 1 : 0) + (told.has('page') ? 1 : 0) + (told.has('book') ? 1 : 0) + (nextFile ? 1 : 0), 4);
  }
  function hints() {
    if (nextFile) return ['go', ['Six copper hearts are cooling in the pebble tray. The wrapping hall is next: the button at the bottom of the screen.']];
    if (lock && lock.parentNode) return ['stove', [
      'Take the recipe one line at a time, and ask: what do the two things have in common? Each line is about one control: the flame, the sugar, the paddle, the lid, and last of all when to take the pan off.',
      'A snail is small and slow: how loud would its sneeze be? A shy guest at a noisy party does not rush in. A waltz is a slow dance that goes round and round, and a gallop is fast. And nothing can breathe with a lid on it.',

    ]];
    if (!ready()) return ['read', [
      'Two things to read before you touch the stove: the green book, open on its wooden stand to the right of the range, and the page pinned on the black hood above the pans.',

    ]];
    return ['range', ['Everything is read. Click the big black range with the knobs on its front.']];
  }

  function begin() {

    ER.narrate([
      'The boiling room is the colour of the inside of a toffee. Copper pans as big as bathtubs sit on an iron range, blue flames purr under them, and the steam rises to a brick ceiling where a ginger cat is asleep on a pipe.',
      'Mr Tuttle pushes past you. In the corner stands a tall pink machine like a drum on legs, with a red lever on its side and a notice: THE CLOUDSPINNER. DO NOT PULL. READ THE GREEN BOOK FIRST.',
      '&ldquo;Read!&rdquo; says Mr Tuttle. &ldquo;Ha!&rdquo; And he pulls the lever.',
      'The Cloudspinner gives a deep WHUMPF. Pink sugar floss pours out of the top like a waterfall going the wrong way, and wraps itself round Mr Tuttle, round and round, from his hat to his shoes, until all that can be seen of him is a moustache and a pair of brown boots.',
      'Somewhere inside the machine a music box begins to play, and a brass plate on its side catches the light.'
    ], function () {
      told.set('spun'); paint(); SW.sfx.whoosh();
      SW.verse('read', 'On the side of the Cloudspinner', function () {
        ER.narrate(['Mr Gribble writes: <i>Item: one gentleman, pink.</i> &ldquo;It wears off by the morning, I expect,&rdquo; he says. &ldquo;Most things do.&rdquo; Then he looks at you, and at the book. &ldquo;Well? Read it, then.&rdquo;'], function () { busy = false; });
      });
    });
  }

  /* ---------- papers ---------- */
  var PAGE = '<h4>How to read my recipes</h4><h5>pinned on the hood over the stove</h5>' +
    '<p>I do not write &lsquo;medium heat&rsquo;. I write what it is like, because a cook remembers a picture better than a number.</p>' +
    '<p>A <b>simile</b> says one thing is <i>like</i> another. It uses &lsquo;like&rsquo; or &lsquo;as&rsquo;: <span class="ex">as busy as a bee; it went off like a firework.</span></p>' +
    '<p>A <b>metaphor</b> says one thing <i>is</i> another, with no &lsquo;like&rsquo;: <span class="ex">the kitchen was an oven.</span></p>' +
    '<p><b>Personification</b> gives a thing a person&rsquo;s feelings or actions: <span class="ex">the kettle sulked.</span></p>' +
    '<p><b>Hyperbole</b> is an exaggeration so big that nobody is meant to believe it: <span class="ex">I&rsquo;ve told you a million times.</span></p>' +
    '<p>All four are <b>figures of speech</b>, and none of them is true word for word. So do not ask, &lsquo;Is it true?&rsquo; Ask, &lsquo;What do the two things have in common?&rsquo; and do that. &lsquo;The kitchen was an oven&rsquo; means it was very hot, not that you could bake bread in it.</p>';
  var BOOK = '<h4>The green book &middot; the last page</h4><h3>The Last Sweet</h3>' +
    '<p class="hand">Part One: the Heart</p>' +
    '<p class="ln"><i>1</i>Light a flame as quiet as a snail&rsquo;s sneeze.</p>' +
    '<p class="ln"><i>2</i>Sugar is a shy guest at a noisy party.</p>' +
    '<p class="ln"><i>3</i>The spoon must waltz, not gallop.</p>' +
    '<p class="ln"><i>4</i>Let the pan breathe.</p>' +
    '<p class="ln"><i>5</i>Boil it for a thousand years, or until it is the colour of an old penny, whichever comes first.</p>' +
    '<p class="ln"><i>6</i>Then pour it into the pebble tray, and let it think about what it has done.</p>' +
    '<p class="hand">Part Two, the Paper, is made in the wrapping hall. Part Three, the Finish, I shall write in the cellar.</p>';
  $('#page').addEventListener('click', function () {

  });

  /* ---------- things in the room ---------- */
  SW.thing('#pennies', 'penny', 'A jam jar of old pennies on the shelf, labelled TEA MONEY. Old copper pennies are a dull reddish brown, the colour of a conker that has been in a pocket all week.', isBusy);
  SW.thing('#chart', null, 'THE COLOURS OF BOILING SUGAR: straw, gold, amber, copper, mahogany, and last of all cinder, which is not a colour so much as a mistake.', isBusy);
  SW.thing('#ladles', 'ladle', 'Ladles and spoons as long as your arm, hanging from the hood. One of them has teeth marks on the handle. The cat, probably.', isBusy);
  SW.thing('#pipes', null, 'Brass pipes along the ceiling, and a gauge that says STEAM. On the warmest pipe, the cat. Her name, according to the collar, is Sherbet.', isBusy);
  SW.thing('#pans', 'pan', 'Three copper pans as big as bathtubs. The middle one is empty and clean, and waiting.', isBusy);
  SW.thing('#spinner', null, function () { return 'THE CLOUDSPINNER. DO NOT PULL. READ THE GREEN BOOK FIRST. Somebody did not.'; }, isBusy);
  $('#cocoon').addEventListener('click', function (e) {
    if (busy) return;
    var L = ['&ldquo;MMMF!&rdquo; says the pink cloud. &ldquo;MMMF MMF!&rdquo; It may be &lsquo;Get me out&rsquo;. It may be a word that Mr Tuttle has never read.', 'The moustache twitches. The boots stamp. A little floss falls off the top, and the cat comes down from the pipe to eat it.', '&ldquo;Is it soft in there?&rdquo; asks Mrs Mortlake. &ldquo;MMMF,&rdquo; says the cloud, which sounds like yes.'];
    ER.say(L[(told.has('c1') ? 1 : 0) + (told.has('c2') ? 1 : 0)]); if (!told.set('c1')) told.set('c2');
  });
  $('#gribble').addEventListener('click', function () {
    if (busy) return;
    ER.say(told.has('book') ? '&ldquo;<i>Boil it for a thousand years,</i>&rdquo; reads Mr Gribble over your shoulder. &ldquo;The sale is at nine. I make that nine hundred and ninety-nine years too late. I shall write: Part One cannot be done.&rdquo;' : '&ldquo;Item: one range, iron,&rdquo; says Mr Gribble. &ldquo;Item: three pans, copper. Item: one cloud, with a gentleman in it.&rdquo;');
  });
  $('#mortlake').addEventListener('click', function () {
    if (busy) return;
    ER.say(nextFile ? '&ldquo;Copper,&rdquo; says Mrs Mortlake, looking at the tray. &ldquo;Like my hair. My hair is famous, you know.&rdquo; Her hair is yellow.' : 'Mrs Mortlake is looking at herself in the side of a copper pan, which makes her face very wide. She seems to like it.');
  });
  $('#huxtable').addEventListener('click', function () {
    if (busy) return;
    ER.say('&ldquo;All that sugar,&rdquo; says Mr Huxtable. &ldquo;You could make twice as many sweets with half of it. If they were smaller. And mostly air.&rdquo;');
  });
  $('#range').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The middle pan is scraped clean. The range ticks as it cools.'); return; }
    if (!ready()) { ER.say(told.has('book') || told.has('page') ? 'Six knobs on the range. Not yet: read ' + (told.has('book') ? 'the page pinned over the stove' : 'Part One in the green book') + ' first.' : 'Six brass knobs on the range. Mr Tuttle would have turned all of them by now. Read first: there is a page pinned over the stove, and the green book is on its stand.'); return; }
    openLock();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });

  /* ---------- the stove: a flame, a chute, a paddle, a lid, and a colour ---------- */
  function openLock() {
    var set = ER.flag('b-set') || { fl: 4, su: 'pour', st: 'fast', li: 'on' }, ci = -1, timer = 0, svg, m;
    lock = ER.el('div', 'bn', '<svg viewBox="0 0 1000 600"></svg><div class="bn-foot"><p class="bmsg"></p><button type="button" class="btn" id="b-go">Light the stove</button></div>');
    svg = lock.querySelector('svg'); m = lock.querySelector('.bmsg');
    function msg(t) { m.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('b-set', set); }
    function draw() {
      var s = '', i, a, fl = set.fl, col = ci >= 0 ? COL[ci][2] : '#fdf8ec';
      s += '<rect width="1000" height="600" fill="#3a1a10"/>';
      for (i = 0; i < 15; i++) s += '<path d="M0 ' + (i * 40) + 'h1000" stroke="#4a2214" stroke-width="2"/>';
      /* the shelf of pennies, top right */
      s += '<rect x="800" y="70" width="180" height="10" fill="#6a3a1a"/><path d="M826 70v-56q0 -8 6 -10h40q6 2 6 10v56z" fill="#e8f4f6" fill-opacity=".3" stroke="#9ab6c0" stroke-width="2"/>';
      for (i = 0; i < 14; i++) s += '<ellipse cx="' + (836 + (i * 11) % 34) + '" cy="' + (64 - Math.floor(i / 4) * 8) + '" rx="8" ry="3.2" fill="' + PENNY + '" stroke="#7a3e1a" stroke-width="1"/>';
      s += '<text x="935" y="40" class="tK" font-size="17" fill="#ffe0b0" text-anchor="middle">tea money:</text><text x="935" y="60" class="tK" font-size="17" fill="#ffe0b0" text-anchor="middle">old pennies</text>';
      /* the colour card */
      s += '<rect x="800" y="100" width="180" height="250" rx="6" fill="#fdf3d8"/><text x="890" y="124" class="tF" font-size="15" fill="#8a2a14" text-anchor="middle">THE COLOURS</text>';
      COL.forEach(function (c, k) { s += '<rect x="814" y="' + (136 + k * 34) + '" width="46" height="26" fill="' + c[2] + '" stroke="#6a3a1a" stroke-width="1.5"/><text x="870" y="' + (155 + k * 34) + '" class="tG" font-size="16" fill="#2a1a10">' + c[1] + '</text>' + (ci === k ? '<path d="M806 ' + (149 + k * 34) + 'l-14 -8v16z" fill="#ff5a2a"/>' : ''); });
      /* the pan, the flame, the syrup */
      s += '<rect x="130" y="478" width="420" height="40" rx="5" fill="#26262c"/>';
      for (i = 0; i < 7; i++) { a = 8 + fl * 9; s += '<g transform="translate(' + (190 + i * 50) + ' 478)"><path class="flame" d="M-14 0q4 ' + (-a) + ' 10 ' + (-a * 0.3) + 'q4 ' + (-a * 0.9) + ' 8 0q6 ' + (-a * 0.7) + ' 10 0z" fill="' + (fl > 3 ? '#ff8a2a' : '#4a8aff') + '" opacity=".9"/></g>'; }
      s += '<path d="M150 430v-190h380v190q0 12 -12 12h-356q-12 0 -12 -12z" fill="url(#cpr)" stroke="#5a2a0e" stroke-width="4"/>';
      s += '<defs><linearGradient id="cpr" x1="0" x2="1"><stop offset="0" stop-color="#7a3a14"/><stop offset=".35" stop-color="#e8945a"/><stop offset=".6" stop-color="#c06a32"/><stop offset="1" stop-color="#6a2e10"/></linearGradient></defs>';
      s += '<ellipse cx="340" cy="240" rx="190" ry="26" fill="#5a2a0e"/><ellipse cx="340" cy="244" rx="176" ry="19" fill="' + col + '"/>';
      if (ci >= 0) for (i = 0; i < 6; i++) s += '<circle cx="' + (220 + i * 46) + '" cy="' + (240 + (i % 2) * 6) + '" r="5" fill="#fff" opacity=".5"/>';
      /* the sugar chute */
      s += '<path d="M380 30h120l-30 70h-60z" fill="#d8d0c0" stroke="#6a6a6a" stroke-width="3"/><path d="M410 100l-20 ' + (set.su === 'pour' ? 90 : 60) + '" stroke="#bdb6aa" stroke-width="' + (set.su === 'pour' ? 26 : 6) + '"/>' +
        '<g class="lev" data-l="su"><rect class="handle" x="514" y="34" width="210" height="44" rx="6" fill="#26262c" stroke="#c8a060" stroke-width="2"/><text x="619" y="54" class="tG" font-size="13" fill="#c8a060" text-anchor="middle">THE SUGAR</text><text x="619" y="71" class="tF" font-size="15" fill="#fff" text-anchor="middle">' + (set.su === 'pour' ? 'ALL AT ONCE' : 'A LITTLE AT A TIME') + '</text></g>';
      /* the paddle */
      s += '<path d="M340 60v190" stroke="#8a6a3a" stroke-width="10"/><path d="M320 236h40v24h-40z" fill="#c8a060"/>' +
        '<g class="lev" data-l="st"><rect class="handle" x="40" y="80" width="210" height="44" rx="6" fill="#26262c" stroke="#c8a060" stroke-width="2"/><text x="145" y="100" class="tG" font-size="13" fill="#c8a060" text-anchor="middle">THE PADDLE</text><text x="145" y="117" class="tF" font-size="15" fill="#fff" text-anchor="middle">' + { still: 'STILL', slow: 'SLOW CIRCLES', fast: 'FAST CIRCLES' }[set.st] + '</text></g>';
      /* the lid: on the pan, or hanging on its hook */
      s += set.li === 'on' ? '<g id="lid"><ellipse cx="340" cy="232" rx="196" ry="30" fill="#b06a3a" stroke="#5a2a0e" stroke-width="4"/><ellipse cx="340" cy="212" rx="24" ry="10" fill="#5a2a0e"/><text x="340" y="275" class="tG" font-size="14" fill="#ffe0b0" text-anchor="middle">LID ON · click to lift it</text></g>' :
        '<g id="lid"><circle cx="640" cy="160" r="70" fill="#b06a3a" stroke="#5a2a0e" stroke-width="4"/><circle cx="640" cy="160" r="14" fill="#5a2a0e"/><path d="M640 90v-20" stroke="#8a8a92" stroke-width="5"/><text x="640" y="252" class="tG" font-size="14" fill="#ffe0b0" text-anchor="middle">LID OFF · on its hook</text></g>';
      /* the flame knob */
      s += '<g class="knob"><circle class="face" cx="130" cy="530" r="44" fill="#c8a060" stroke="#7a5a1e" stroke-width="4"/>';
      for (i = 1; i <= 6; i++) { a = (-135 + (i - 1) * 54) * Math.PI / 180; s += '<text x="' + (130 + 62 * Math.sin(a)).toFixed(1) + '" y="' + (536 - 62 * Math.cos(a)).toFixed(1) + '" class="tF" font-size="17" fill="' + (i === fl ? '#ffcf5a' : '#c8a080') + '" text-anchor="middle">' + i + '</text>'; }
      a = (-135 + (fl - 1) * 54) * Math.PI / 180;
      s += '<path d="M130 530L' + (130 + 36 * Math.sin(a)).toFixed(1) + ' ' + (530 - 36 * Math.cos(a)).toFixed(1) + '" stroke="#2a1a14" stroke-width="7" stroke-linecap="round"/></g>' +
        '<text x="200" y="568" class="tG" font-size="15" fill="#ffe0b0">THE FLAME</text><text x="200" y="588" class="tK" font-size="16" fill="#ffd0a0">click the knob to turn it</text>' +
        '<text x="580" y="588" class="tK" font-size="17" fill="#ffd0a0">click the levers and the lid to change them</text>';
      svg.innerHTML = s;
      ER.$$('.lev', svg).forEach(function (l) { l.addEventListener('click', function () {
        if (running || nextFile) return;
        var k = l.getAttribute('data-l');
        if (k === 'su') set.su = set.su === 'pour' ? 'trickle' : 'pour';
        else set.st = { still: 'slow', slow: 'fast', fast: 'still' }[set.st];
        keep(); SW.sfx.click(); draw();
      }); });
      svg.querySelector('.knob').addEventListener('click', function () { if (running || nextFile) return; set.fl = set.fl % 6 + 1; keep(); SW.sfx.click(); draw(); });
      svg.querySelector('#lid').addEventListener('click', function () { if (running || nextFile) return; set.li = set.li === 'on' ? 'off' : 'on'; keep(); SW.sfx.clunk(); draw(); });
    }
    var goB = lock.querySelector('#b-go');
    function ruin(t) {
      running = false; clearInterval(timer); ci = -1; ER.sfx.no(); ER.mood('calm'); goB.textContent = 'Light the stove';
      msg(t + ' <br>Mr Gribble writes: <i>Item: one burnt pan.</i> Somebody scrapes it out and fills it with fresh sugar.'); draw();
    }
    function light() {
      var f = set.fl;
      if (!ER.check('fl', f)) {
        ruin(f >= 4 ? 'You light the stove at <b>' + f + '</b>. The flame roars up like a lion, and in ten seconds the sugar is foaming over the side and smells of bonfires. Was that a quiet flame?' :
          'At <b>' + f + '</b> the flame is quieter, but not quiet enough: the edge of the sugar catches and goes brown before the middle has even melted. How loud is a snail&rsquo;s sneeze?'); return;
      }
      if (!ER.check('su', set.su)) { ruin('All the sugar goes in at once, like a crowd through one door, and sits at the bottom in a lump that will not melt. Is that how a shy guest comes into a noisy party?'); return; }
      if (!ER.check('st', set.st)) { ruin(set.st === 'fast' ? 'The paddle gallops round and round, and the syrup goes cloudy and gritty, like sand in a jam jar. The book said waltz, not gallop.' : 'The paddle stands still, and the bottom of the pan catches. A waltz is a dance: it moves. But how fast?'); return; }
      if (!ER.check('li', set.li)) { ruin('With the lid on, the steam has nowhere to go. It lifts the lid, rattles it, and the pan boils over. Can a pan breathe with a lid on it?'); return; }
      running = true; ci = 0; draw(); ER.mood('tense'); goB.textContent = 'Off the heat!';
      msg('A flame as small as a sneeze, sugar going in a spoonful at a time, the paddle waltzing slowly round, and no lid. The sugar melts, clears, and begins to change colour. Watch it, and take it off the heat at the right moment.');
      timer = setInterval(function () {
        ci++; SW.sfx.bubble();
        if (ci >= COL.length) { ruin('CINDER. The heart is black, and smells like a chimney. A thousand years was a joke: nobody meant you to wait that long.'); return; }
        draw(); msg('The syrup is <b>' + COL[ci][1] + '</b> now.');
      }, 1900);
    }
    function off() {
      var c = COL[ci][0], file;
      clearInterval(timer); running = false; ER.mood('calm');
      if (!ER.check('co', c)) {
        ruin(ci < 3 ? 'Off the heat at <b>' + COL[ci][1] + '</b>. Pretty, but is that the colour of an old penny? Look at the jar on the shelf.' : 'Off the heat at <b>' + COL[ci][1] + '</b>: darker than any penny in the jar. A second too late.'); return;
      }
      file = ER.exitOk([[set.fl, set.su, set.st, set.li, c].join('-')]);
      if (!file) { msg('The pan will not pour. Something is wrong with this page: tell your teacher.'); return; }
      nextFile = file; ER.flag('b-file', file);
      var s0 = ER.state(); s0.done = s0.done || {}; s0.done.boil = 1; ER.persist(true);
      SW.sfx.hiss(); msg('Off the heat at <b>COPPER</b>, the colour of the pennies in the jar. The heart pours out like warm glass into the pebble tray, and lies there thinking about what it has done.');
      setTimeout(function () {
        ER.closeAll(); SW.solved(); paint(); busy = true;
        SW.mine('heartdone', 'The Heart', '<p>Quiet as a snail&rsquo;s sneeze: the smallest flame, 1.</p><p>Sugar is a shy guest: a little at a time.</p><p>Waltz, not gallop: slow circles.</p><p>Let the pan breathe: lid off.</p><p>A thousand years is hyperbole. The colour of an old penny: copper.</p>');
        ER.narrate([
          'Six copper hearts, each small enough to hide in your fist, lie in the pebble tray. They look exactly like pebbles from a beach, if a beach could be warm and smell of burnt sugar.',
          'Mr Gribble looks at the tray, and at his list, and at the tray. &ldquo;It did not take a thousand years,&rdquo; he says. &ldquo;Miss Plunkett wrote that it would take a thousand years.&rdquo; &ldquo;She wrote it as a joke,&rdquo; you say. Mr Gribble writes that down, too, very slowly, as if he has never written the word before.',
          'Mrs Mortlake has already gone on ahead. Through the far door comes the clatter of the wrapping hall, and the sound of somebody saying &ldquo;Oh! Look at me!&rdquo;'
        ], function () { busy = false; $('#go').classList.add('on'); });
      }, 3600);
    }
    goB.addEventListener('click', function () { if (nextFile) return; if (running) off(); else light(); });
    draw();
    msg('The middle pan, a chute of sugar, a paddle, a lid, and a knob for the flame. Set each one as the recipe says, then light the stove. Part One is in your notebook.');
    ER.open('ov-lock', lock, function () { if (running) { clearInterval(timer); running = false; ci = -1; ER.mood('calm'); } });
  }
})();
</script>
</body>
</html>
