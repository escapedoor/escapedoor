  ER.init({
    theme: 'court', story: 'glass', storyTitle: 'A Quarter Past Four', id: 'hearing', no: 'IV', title: 'Hearing Room 3',
    go: 'Go in',
    intro: [
      'The exhibits said this much, and you stamped it. Rain MUST HAVE fallen inside the greenhouse, because everything under the holes is soaked and everything under the whole glass is dry. The rain stopped just before five on Saturday morning, so the roof MUST HAVE been broken before then. It CANNOT HAVE been whole until a quarter past four that afternoon.',
      'The rest was only MIGHT. The gale might have broken the glass: nobody saw it. The ball might have rolled in through the open door: nobody saw that either. And a football might have broken a pane in the night. You cannot rule that out, and you do not have to. Proving things is Mr Thistlewood&rsquo;s job.',
      'Now he has to say it all himself, aloud, to a judge. &ldquo;Thistlewood and Demir!&rdquo; calls Mr Makepeace, for the third time, and holds the door.'
    ],
    exit: {"next":"judgment","w":{"a7c158e3":"7648ae07"}}, tags: {"cx":["6a8e198c","b768133b","a5c95324","c11e785c","8cb07ceb"]},
    sound: ['bench', { root: 43, bpm: 66, drop: ['ost'], beds: [['rain', 0.25]] }],      /* the hearing itself: lower, and nothing in the music that could be taken for a knock */
    hints: hints, onBegin: begin
  });
  nextFile = ER.flag('r-file') || null;

  var BOOK2 = '<h4>Notes for New Ushers</h4><h5>page 2: how they ask questions</h5>' +
    '<p>When a witness has told his story, the other side may test it. That is <b class="t">CROSS-EXAMINATION</b>. I have watched it for twenty-six years, and it is mostly done badly. Done well, it goes like this.</p>' +
    '<p><b class="t">1. ASK. DO NOT TELL.</b> A speech is not a question. The judge is listening to the witness, not to you.</p>' +
    '<p><b class="t">2. PRESS.</b> Take one thing that he has said and ask for more. Where were you? What time? How do you know? People who are quite sure of a thing have often not looked at it for months.</p>' +
    '<p><b class="t">3. CHALLENGE.</b> Put something beside what he has said: a document, a photograph, or his own words of five minutes ago. Then ask him, politely, which of the two is right. That is a <b class="t">CONTRADICTION</b>, and it is the only thing that wins cases in this building.</p>' +
    '<p><b class="t">4.</b> Leave alone whatever helps your own side.</p>' +
    '<p>Nobody shouts. Nobody says &ldquo;Objection!&rdquo; That is American television. A wrong challenge costs you nothing but the court&rsquo;s patience. <span class="pen">Judge Ormerod keeps hers in a pot: four pencils.</span></p>';

  /* ---------- Mr Thistlewood's evidence ---------- */
  var CARDS = [
    { id: 'a', tab: 'Thirty-one years', from: 'His statement, paragraph 1', text: 'For thirty-one years I was a signalman on the railway. I notice the time of things, and I write it down.', press: [
      { q: 'What did a signalman have to write down, Mr Thistlewood?', a: 'Every train and every bell, to the minute, in the Train Register. In thirty-one years no inspector ever found a wrong time in my book.' },
      { q: 'So when you tell the court &ldquo;a quarter past four&rdquo;&hellip;', a: 'Then it was a quarter past four. I am not going to be told what time it was by a football.', j: 'Nobody has told you anything yet, Mr Thistlewood. We are still asking.' }] },
    { id: 'b', tab: 'Friday at six', from: 'His statement, paragraph 4', text: 'On Friday 17 October I was in the greenhouse until six in the evening. When I left it, every pane of glass was whole.', press: [
      { q: 'What were you doing in the greenhouse until six?', a: 'The crossword, in the Gazette, with a mug of tea. I do it in there every day. It is warm, and nobody talks.' },
      { q: 'Did you shut the greenhouse up when you left it?', a: 'I left my paper and my mug on the bench, and I put the door on its hook, open about a foot. Chrysanthemums rot without air. Then I went in for my tea, and I did not go down the garden again that night.' }] },
    { id: 'c', tab: 'The crash', from: 'His statement, paragraph 5', text: 'On Saturday 18 October, at a quarter past four, I heard a crash of glass. I noted the time by my alarm clock.', press: [
      { q: 'Where were you when you heard the crash?', a: 'At home. Indoors.' },
      { q: 'In which room, Mr Thistlewood?', a: 'Upstairs. I was lying down, if you must know. A man of seventy-four is allowed to lie down.' },
      { q: 'And the alarm clock?', a: 'On the table beside my bed, which is where an alarm clock lives. It has green hands that glow. I could read it in the dark.', gives: 'c2' }] },
    { id: 'c2', hidden: true, tab: 'The clock', from: 'In answer to you', text: 'The alarm clock is beside my bed. It has green hands that glow. I could read it in the dark.', press: [
      { q: 'You could read it in the dark. Was it dark?', a: 'I said that I COULD read it in the dark. It is a very good clock.', j: 'That is not quite an answer, Mr Thistlewood. But I expect the Clinic can find a better way of asking.' }] },
    { id: 'd', tab: 'As usual', from: 'His statement, paragraph 6', text: 'The boy was in his garden that afternoon as usual. I had heard his ball against the fence.', press: [
      { q: 'Did you see Emre in his garden that afternoon?', a: 'I did not need to see him. I know the sound of that ball on that fence as well as I know my own front door.' },
      { q: 'When exactly did you hear it?', a: 'Just before the glass went. Thump, thump, thump on the fence, and then the crash.', gives: 'd2' }] },
    { id: 'd2', hidden: true, tab: 'Thump, thump', from: 'In answer to you', text: 'I heard the ball thump on the fence just before the glass went. Thump, thump, thump, and then the crash.', press: [
      { q: 'How long before the crash?', a: 'Seconds. No more. Thump, thump, thump, crash. I can hear it now.' }] },
    { id: 'e', tab: 'The photograph', from: 'His statement, paragraph 7', text: 'When I went down the garden I found the greenhouse wrecked, and a football lying in the middle of it. I took a photograph at once.', press: [
      { q: 'At what time did you go down the garden?', a: 'Half past four. It is written on the back of the photograph, in my own hand.' },
      { q: 'Had anything been moved before you took it?', a: 'Nothing. Not a leaf. That photograph shows my greenhouse exactly as the ball left it. And it had not rained a drop all day: you may put that in your book.', gives: 'e2' }] },
    { id: 'e2', hidden: true, tab: 'Not a drop', from: 'In answer to you', text: 'The photograph shows my greenhouse exactly as the ball left it. It had not rained a drop all day.', press: [] },
    { id: 'f', tab: 'Nothing else', from: 'His statement, paragraph 8', text: 'He must have kicked the ball over the fence and through the roof. Nothing else can have broken the glass.', press: [
      { q: 'Did you see the ball come over the fence?', a: 'I saw where it finished up. That is enough for any sensible person.', j: '&ldquo;Must have&rdquo;, Mr Thistlewood. I have underlined it.' },
      { q: 'How much of the damage do you say that the ball did?', a: 'All of it. Every pane on that receipt. One ball, one boy, nine hundred pounds.', gives: 'f2' }] },
    { id: 'f2', hidden: true, tab: 'Every pane', from: 'In answer to you', text: 'The ball did all of it: every pane on that receipt. One ball, one boy, nine hundred pounds.', press: [] },
    { id: 'g', tab: 'Nine hundred', from: 'His statement, paragraph 9', text: 'The repairs cost me £900. I have the receipt.', press: [
      { q: 'Who did the repairs?', a: 'Foxton and Daughter. The daughter did most of it. She was very quick.' },
      { q: 'Was yours the only greenhouse that they mended that week?', a: 'She told me that it was their eleventh. I did not ask her why.', j: 'Did you not, Mr Thistlewood.' }] }
  ];
  var WON = {
    f: { note: 'Something else could have.', clue: { id: 'w1', title: 'He gives way: the gale' }, lines: [
      ['you', 'Mr Thistlewood, this is the record from Hatherwick Aerodrome for that night. By three in the morning it was blowing a gale. At fourteen minutes past four there was a gust of sixty-seven miles an hour. Is that &ldquo;nothing else&rdquo;?'],
      ['wit', 'There was a bit of a blow in the night, I grant you. That greenhouse has stood for twenty-two winters.'],
      ['judge', 'Sixty-seven miles an hour, Mr Thistlewood. I am not sure that I should have stood through it myself.'],
      ['wit', 'Very well. Something else COULD have broken it. I do not say that it did.']] },
    e2: { note: 'The roof was open in the night.', clue: { id: 'w2', title: 'He gives way: the rain got in' }, lines: [
      ['you', 'Then would you look at your own photograph. Friday&rsquo;s Gazette is on the bench, and it is pulp. Your mug is full to the brim. Under the holes in the roof everything is soaked, and under the whole panes everything is dry. If it had not rained a drop all day, how did the rain get in?'],
      ['wit', 'It rained in the night. Hard. The paper got wet in the night.'],
      ['judge', 'Through the roof, Mr Thistlewood?'],
      ['wit', 'Through the&hellip; Yes. Through the roof.'],
      ['judge', 'Then at some time in the night, before the rain stopped, your roof was already open. I am writing that down.']] },
    c2: { note: 'It was dark. 4.15 in the MORNING.', clue: { id: 'w3', title: 'He gives way: which quarter past four' },
      swap: { of: 'c', id: 'cm', tab: 'The crash, 4.15 a.m.', from: 'As he puts it now', text: 'At a quarter past four in the morning, in the dark, I heard a crash of glass. I looked at the alarm clock, and I went back to sleep.' },
      lines: [
        ['you', 'Mr Thistlewood, on that Saturday the sun did not set until one minute past six, and the aerodrome says that the afternoon was bright. Why did you need hands that glow, at a quarter past four in the afternoon?'],
        ['wit', 'Because it was&hellip;'],
        ['note', 'He stops. For the first time this morning he is not looking at the judge, or at you. He is looking at something that only he can see.'],
        ['wit', 'Because it was dark. It was dark, and there was rain on the window, and the fence was banging. I looked at the clock, and I thought: dustbins. And I went back to sleep.'],
        ['judge', 'A quarter past four in the morning, Mr Thistlewood?'],
        ['wit', 'I have never been wrong about a time in my life, Judge.'],

    d2: { note: 'It was the fence. He never heard the boy.', clue: { id: 'w4', title: 'He gives way: the thumping' }, lines: [
      ['you', 'You heard the thumping seconds before the crash. And the crash, you have just told the Judge, was at a quarter past four in the morning. Was Emre kicking a football against a fence at a quarter past four in the morning, in the dark, in a gale?'],
      ['wit', 'No.'],

      ['wit', 'No. That was the fence itself. There is a loose panel. It bangs when the wind is in the south-west. I have been meaning to see to it.'],
      ['judge', 'So on the Saturday afternoon you did not hear this boy at all.'],
      ['wit', 'On the Saturday afternoon I was watching the racing. I heard nothing whatever, until I went down the garden at half past four.']] },
    f2: { note: 'One ball cannot have done all of it.', clue: { id: 'w5', title: 'He gives way: the clips' }, lines: [
      ['you', 'This is your own receipt, Mr Thistlewood. Seventeen panes: both sides of the roof, both ends and both walls. Six more had slid out of the frame without breaking, and fifty-two clips had gone. How does one football do that?'],
      ['wit', 'It doesn&rsquo;t.'],
      ['note', 'He looks at the yellow paper for a long time.'],
      ['wit', 'Clips do not come off for a ball. Clips come off when the wind gets under the glass. I have been telling people that at the Chrysanthemum Society for forty years.'],
      ['judge', 'Thank you, Mr Thistlewood. That was an honest answer, and it cannot have been an easy one. I have written it down.']] }
  };
  var NO = {
    'b>*': 'That part of his evidence appears to me to HELP your client. In your place I should leave it alone.',
    'a>*': 'The Clinic wishes me to doubt that he was a signalman? I do not think that will be necessary.',

    'd2>wx': 'The wind may explain a great deal. But put his own words beside his own words. It is quicker, and he cannot argue with them.',
    'e>photo': 'He says that he took a photograph, and here it is. Ask him what he says it SHOWS.',

    'f2>photo': 'The photograph shows a great deal of broken glass, and he says that a ball broke it. I need something that counts.',
    '*>photo': 'I have the photograph in front of me. I do not see what it has to say about that.',

  };
  function wonList() { return (ER.flag('cx-r') || {}).won || []; }
  function has(card) { return wonList().some(function (p) { return p.split('>')[0] === card; }); }
  function look(id, what) {
    var c = ER.state().clues.filter(function (x) { return x.id === id; })[0];
    var d = c ? ER.el('div', 'doc ' + c.c, ER.gloss(c.h)) : ER.el('div', 'doc typed', '<p>' + what + ' It is in the file, but you did not stop to look at it in the Advocates&rsquo; Room.</p>');
    ER.sfx.paper(); ER.open('ov-read', d, null, { top: true });
  }
  function openCx() {
    CX.open({
      key: 'r', pencils: 4, total: TOTAL, cards: CARDS, won: WON,
      witness: { name: 'Mr Thistlewood', role: 'the Claimant · giving evidence', face: window.FACE('stan') },
      judge: { name: 'District Judge Ormerod', face: window.FACE('judge') },
      papers: [{ id: 'photo', tab: 'ST1', name: 'The photograph', look: function () { look('photo', 'His photograph of the greenhouse.'); } },
        { id: 'bill', tab: 'ST2', name: 'The receipt', look: function () { look('bill', 'The glazier&rsquo;s receipt for £900.'); } },
        { id: 'wx', tab: 'D1', name: 'The weather record', look: function () { look('wx', 'The aerodrome&rsquo;s weather record.'); } }],
      hello: wonList().length ? 'Go on. Mr Thistlewood is still in the chair.' : 'Has the Clinic any questions for Mr Thistlewood?',
      idle: 'Every card is something that Mr Thistlewood has said. Choose one. Ask him more about it, or put something beside it.',
      bites: function (card, w) { return ER.check('cx', card + '>' + w); },
      refuse: function (card, w) { return NO[card + '>' + w] || NO[card + '>*'] || NO['*>' + w] || NO['*']; },
      onWin: function (n, total, card) { pens(); ER.pips(n, TOTAL); if (card === 'c2') ER.mood('tense'); },
      onPencil: function () { pens(); },
      onOut: function () {          /* she is given time to finish her sentence first */
        GLASS.bump('r-outs'); busy = true;
        setTimeout(function () {
          ER.closeAll();
          ER.narrate([
            'District Judge Ormerod lays down her last pencil, very gently, beside the other three.',
            '&ldquo;I am going to count to twenty,&rdquo; she says, &ldquo;quite slowly, and the Clinic is going to look at its papers. A challenge is a paper, or his own words, that cannot be true if his answer is true. If both can be true, it is not a challenge. It is a waste of a pencil.&rdquo;',
            'Mr Makepeace crosses the room, picks up the four pencils and puts them back in the pot. Nobody has ever seen him do that for a real lawyer.'
          ], function () { busy = false; pens(); openCx(); });
        }, 3400);
      },
      done: function (pairs) {
        var file = ER.exitOk([pairs.join('+')]);
        if (!file) { ER.toast('Something is wrong with this lock: tell your teacher.'); return; }
        nextFile = file; ER.flag('r-file', file); GLASS.done('hearing'); ER.mood('calm');
        setTimeout(function () {
          ER.closeAll(); GLASS.solved(); paint(); busy = true;
          ER.narrate([
            'Mr Thistlewood sits very still, with both hands on the carrier bag.',
            '&ldquo;Then will somebody tell me,&rdquo; he says, not loudly, &ldquo;how that boy&rsquo;s ball got into my greenhouse?&rdquo;',
            'Nobody answers. Selin looks at you. You look at your seven stamped lines. Line 6 says MIGHT.',
            '&ldquo;That, Mr Thistlewood,&rdquo; says the judge, &ldquo;is the first question that anybody has asked this morning which I cannot answer. I shall rise for ten minutes. When I come back, I should like somebody to try.&rdquo;',
            'Everybody stands. Behind you a chair scrapes. Emre has gone as white as his football.'
          ], function () { busy = false; });
        }, 1200);
      }
    });
  }

  var TARGET = [
    ['f', ['Start with the card that claims the most: &ldquo;Nothing else can have broken the glass.&rdquo; Nothing else at all? Look through your three papers for something else that came into his garden that night.',
      'Choose that card and press &ldquo;Put something to him&rdquo;. Then choose the paper that shows what the night was like.',
      'Only one of your papers was not written for Mr Thistlewood. Read its bottom lines: at 04:14 something came into his garden at 67 miles an hour.']],
    ['e2', ['Ask him more about the card called &ldquo;The photograph&rdquo;: twice. He will tell you what he says the picture shows, and what the weather was. That answer goes on a new card.',
      'His new card says that the greenhouse is exactly as the ball left it, and that it had not rained a drop all day. Now look at what is lying on his bench.',
      'His own photograph is one of your papers. A newspaper soaked to pulp and a mug full to the brim cannot be true together with a day without one drop of rain.']],
    ['c2', ['The crash: a quarter past four, by an alarm clock. Ask him more about that card, three times. Where was he? In which room? What sort of clock is it?',
      'His new card says that he could read the clock in the dark. In the dark, at a quarter past four in the afternoon, in October? One of your papers knows exactly when the sun went down.',
      'The aerodrome wrote down when the sun set on that Saturday: 18:01. At 16:00 the sky was bright. So why did he need hands that glow?']],
    ['d2', ['He says that the boy was in his garden &ldquo;as usual&rdquo;. Ask him more about that card, twice. Did he see Emre? When exactly did he hear the ball?',
      'He heard it thump on the fence, seconds before the crash. But WHEN was the crash? He has changed that card himself.',
      'This time the thing to put beside his answer is not a paper. It is another of his own cards: the one that he has just had to change, about the time of the crash.']],
    ['f2', ['Ask him more about &ldquo;Nothing else&rdquo;, twice. How much of the damage does he say that the ball did?',
      'He says: all of it, every pane on the receipt. Have you read the receipt?',
      'Count what the glazier mended: seventeen panes on six faces of the greenhouse, six more that had slid out whole, and fifty-two clips. One ball, he says. Which of your papers does the counting?']]
  ];
  function hints() {
    var i;
    if (nextFile) return ['go', ['The judge has risen for ten minutes. Go out into the corridor: the button is at the bottom of the screen.']];
    if (!ER.flag('r-book')) return ['book', ['Mr Makepeace has left page 2 of his book on the corner of your table, at the bottom of the screen on the left. Read it before you open your mouth.']];
    if (!CX.isOpen()) return ['start', ['Mr Thistlewood is in the witness chair, on the right. Click him, and begin.']];
    for (i = 0; i < TARGET.length; i++) if (!has(TARGET[i][0])) return ['t-' + TARGET[i][0], TARGET[i][1]];
    return null;
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#book2').classList.toggle('ready', !ER.flag('r-book') && !nextFile);
    $('#stan').classList.toggle('ready', !!ER.flag('r-book') && !nextFile);
    pens(); ER.pips(nextFile ? TOTAL : wonList().length, TOTAL);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The judge has risen for ten minutes. Mr Thistlewood&rsquo;s question is still hanging in the room.'); return; }
    if (ER.flag('r-in')) { ER.say('Hearing Room 3. Mr Thistlewood is still in the witness chair.'); return; }
    busy = true; ER.flag('r-in', 1);
    ER.narrate([
      'Hearing Room 3 is smaller than you expected, and nobody in it is wearing a wig. District Judge Ormerod has a grey suit and half-moon glasses. She is half an hour late, and she knows it.',
      '&ldquo;Mr Thistlewood. This is your claim, so it is for you to prove it, and you go first.&rdquo; He takes the witness chair, with the carrier bag on the table beside him, and reads his statement aloud as if it were a railway timetable.',
      'The judge asks him four questions of her own and writes down four answers. Then she looks over her glasses at you.',
      '&ldquo;Now. The Clinic. You are not Ms Nair.&rdquo; &ldquo;No, Judge.&rdquo; &ldquo;The rules allow it, as long as Miss Demir stays in the room. I shall see that it is fair: that is what I am for. Have you any questions for Mr Thistlewood?&rdquo;',
      'At the door, Mr Makepeace is studying the ceiling. On the corner of your table lies page 2 of his book. You did not put it there.'
    ], function () { busy = false; });
  }

  /* ---------- the room ---------- */
  $('#book2').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: BOOK2, cls: 'usher', clue: { id: 'book2', title: 'Notes for New Ushers, page 2', kind: 'Mr Makepeace’s book' },
      done: function () { ER.flag('r-book', 1); paint(); GLASS.learn(['cross-examination', 'contradiction', 'challenge', 'press']); } });
  });
  function start() {
    if (busy) return;
    if (nextFile) { ER.say('Mr Thistlewood has nothing more to say, for the moment. He is waiting for somebody to answer his question.'); return; }
    if (!ER.flag('r-book')) { ER.say('You open your mouth. Mr Makepeace coughs, very slightly, and looks at the page on the corner of your table.'); return; }
    openCx();
  }
  $('#stan').addEventListener('click', start);
  $('#cards').addEventListener('click', start);
  $('#papers').addEventListener('click', function () { if (!busy) ER.say('Your papers: his photograph (ST1), his receipt (ST2), your weather record (D1), and seven stamped lines. You can put any of them to him once he is answering questions.', 7000); });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  GLASS.thing('#judge', null, function () { return nextFile ? 'The judge&rsquo;s chair is empty. Ten minutes, she said.' : 'District Judge Ormerod. No wig, no gown and no gavel: a grey suit, half-moon glasses and a pot of sharp pencils. You call her &ldquo;Judge&rdquo;.'; }, isBusy);
  GLASS.thing('#pencils', null, 'Four sharp pencils in a pot. Mr Makepeace sharpens them every morning. Judge Ormerod lays one down each time somebody wastes the court&rsquo;s time.', isBusy);
  GLASS.thing('#arms', null, 'The Royal Arms, with a lion on one side and a unicorn on the other. They hang behind the judge to show in whose name justice is done here: the Crown&rsquo;s.', isBusy);
  GLASS.thing('#demirs', null, 'Selin is sitting very straight. Emre is sitting very small. Neither of them has looked at Mr Thistlewood since they came in.', isBusy);
  GLASS.thing('#usher', null, 'Mr Makepeace, by the door. He has seen eleven thousand hearings, he says, and he intends to enjoy this one.', isBusy);
  GLASS.thing('#ball', null, 'The football, in its carrier bag, on the witness table. It is the only thing in the room that has not been asked a question.', isBusy);
  GLASS.thing('#clock', null, 'Five minutes past eleven. The Wainwrights and their hedge are due in at twelve.', isBusy);
  GLASS.thing('#window', null, 'A high window, with the rain still at it.', isBusy);
})();
