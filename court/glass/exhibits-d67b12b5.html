<title>The Advocates’ Room · A Quarter Past Four</title>

<style>
  body{--bg:#0c110d;--accent:#e7c477;--font-display:'Cormorant Garamond',serif;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',Georgia,serif;
    --tc-bg:rgba(10,15,11,.97);--tc-ink:#efe9d8;--cap-bg:rgba(10,15,11,.93);--panel:#141a15;--face-bg:#3a4a44;--q-ink:#c9d6c2;--fade:#060906;--hud-bg:rgba(10,15,11,.8)}
  #pool{animation:pool 4.3s steps(1,end) infinite}
  @keyframes pool{0%{opacity:1}55%{opacity:.93}}
  #page.ready{animation:nudge 1.7s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-6px)}}
  .drip{animation:drip 2.8s ease-in infinite;opacity:0}
  .drip.d2{animation-delay:-1.3s}
  @keyframes drip{0%{transform:translateY(0);opacity:0}12%{opacity:.8}80%{opacity:.8}100%{transform:translateY(150px);opacity:0}}

  /* the photograph, to be looked at closely */
  .ph{width:min(1060px,96vw);display:grid;grid-template-columns:minmax(0,720px) minmax(0,1fr);gap:22px;align-items:start}
  .ph-print{background:#f4f1e8;padding:14px 14px 10px;box-shadow:0 26px 70px rgba(0,0,0,.7);transform:rotate(-.6deg)}
  .ph-print svg{display:block;width:100%;height:auto}
  .ph-print p{margin:8px 2px 0;display:flex;justify-content:space-between;font-family:'Courier Prime',monospace;font-size:14.5px;color:#22211c}
  .ph-spot{cursor:pointer;fill:#fff;fill-opacity:0;stroke:#fff;stroke-opacity:0;stroke-width:3;stroke-dasharray:7 6}
  .ph-spot:hover{stroke-opacity:.8}
  .ph-spot.got{stroke:#e7c477;stroke-opacity:.9;stroke-dasharray:none;stroke-width:2.500}
  .ph-side h6{margin:0 0 10px;font-family:'Oswald',sans-serif;font-weight:400;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#c9d6c2}
  .ph-side ol{margin:0;padding:0;list-style:none;counter-reset:n}
  .ph-side li{counter-increment:n;position:relative;min-height:46px;margin:0 0 8px;padding:8px 12px 7px 44px;background:rgba(244,241,232,.08);border-left:3px solid rgba(231,196,119,.35);font-family:'EB Garamond',serif;font-size:17.5px;line-height:1.28;color:#f1ecdf}
  .ph-side li:before{content:counter(n);position:absolute;left:12px;top:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid #e7c477;color:#e7c477;font-family:'Oswald',sans-serif;font-size:12px;line-height:20px;text-align:center}
  .ph-side li.no{color:rgba(241,236,223,.4);font-style:italic}
  .ph-side li.got{border-left-color:#e7c477}

  /* Ms Nair's page, and three stamps */
  .sp{width:min(1120px,96vw);display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}
  .sp-page{background:#fbf8ec;color:#1c1d22;padding:20px 30px 18px 58px;font-family:'Tinos','Times New Roman',serif;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 42px 0 0 #fbf8ec,inset 44px 0 0 rgba(212,87,124,.6);transform:rotate(-.4deg)}
  .sp-page h4{margin:0;font-family:'Tinos',serif;font-weight:700;font-size:19px;letter-spacing:.05em}
  .sp-page h5{margin:2px 0 12px;font-family:'Caveat',cursive;font-weight:700;font-size:21px;line-height:1.1;color:#39507e;border-bottom:1px solid #1c1d22;padding-bottom:9px}
  .sp-line{padding:3px 0 3px 30px;text-indent:-30px;border-bottom:1px dotted #9b9685;font-size:19px;line-height:48px}
  .sp-line>b{display:inline-block;width:30px;text-indent:0;font-family:'Oswald',sans-serif;font-weight:500;font-size:14px;color:#8f2947}
  .sp-slot{position:relative;display:inline-grid;vertical-align:middle;width:196px;height:42px;margin:0 9px;text-indent:0;line-height:1.25;border:2px dashed #9aa3b0;border-radius:3px;place-items:center;cursor:pointer;background:rgba(40,60,120,.05)}
  .sp-slot:hover{border-color:#d4577c}
  .sp-slot i{font-style:normal;font-family:'Stardos Stencil',serif;font-weight:700;font-size:20px;letter-spacing:.06em;padding:1px 8px 0;border:3px solid;border-radius:3px;line-height:1.25;white-space:nowrap}
  .sp-slot i.must{color:#a01f30}.sp-slot i.might{color:#2f5f8f}.sp-slot i.cannot{color:#1c1d22}
  .sp-slot.hit i{animation:thud .22s}
  @keyframes thud{0%{transform:scale(1.5);opacity:.3}100%{transform:scale(1);opacity:1}}
  .sp-box{background:#6b4a2a linear-gradient(160deg,#86603a,#58391d);padding:14px 14px 16px;border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .sp-box h6{margin:0 0 10px;font-family:'Oswald',sans-serif;font-weight:400;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:#f0d98f}
  .sp-stamps{display:grid;gap:8px}
  .sp-st{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;padding:7px 12px 6px 8px;background:#f4efdf;border-radius:3px;color:#1c1d22;text-align:left;transition:transform .14s}
  .sp-st svg{width:44px;height:44px}
  .sp-st span{font-family:'Stardos Stencil',serif;font-weight:700;font-size:22px;letter-spacing:.08em}
  .sp-st[data-v=must] span{color:#a01f30}.sp-st[data-v=might] span{color:#2f5f8f}
  .sp-st:hover{transform:translateX(-4px)}
  .sp-st.on{outline:3px solid #e7c477;outline-offset:2px;transform:translateX(-10px)}
  .sp-phone{margin-top:14px;padding:12px 14px 12px;background:#0e1114;border:6px solid #23272c;border-radius:20px;font-family:'Outfit',Arial,sans-serif;font-size:15px;line-height:1.34;color:#eef2f4;min-height:206px;display:flex;flex-direction:column}
  .sp-phone h6{margin:0 0 8px;text-align:center;font-weight:600;font-size:13px;letter-spacing:.06em;color:#aeb6bd}
  .sp-msg{flex:1}
  .sp-msg p{margin:0 0 6px;padding:7px 11px;background:#262c33;border-radius:13px 13px 13px 3px}
  .sp-msg p.me{background:#2f6a4a;border-radius:13px 13px 3px 13px;margin-left:44px}
  .sp-phone .btn{--accent:#7be0a0;margin-top:6px;font-size:12.5px;padding:8px 10px;letter-spacing:.12em}
  .sp-msg .w:hover{color:#e7c477}
  @media (max-width:900px){.sp,.ph{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null, spBox = null;

  /* four shelves of law reports: the same books every time */
  (function () {
    var s = '', seed = 7, r, x, w, h, c, COL = ['#6b1f2a', '#7b2532', '#1f2f52', '#243a5c', '#7a5a34', '#2f4a37', '#5a2a1c', '#6b1f2a', '#1f2f52'], Y = [196, 338, 480, 618];
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (r = 0; r < 4; r++) {
      x = -70;
      while (x < 1118) {
        w = 20 + Math.floor(rnd() * 15); h = 104 + Math.floor(rnd() * 22); c = COL[Math.floor(rnd() * COL.length)];
        if ((x > 322 - w && x < 350) || (x > 718 - w && x < 746)) { x += w; continue; }
        if ((r === 2 && x > 556 && x < 680) || (r === 1 && x > 868 && x < 950)) { x += w; continue; }      /* room for the wig tin and the clock */
        if (rnd() < 0.06) { x += w + 8; continue; }
        s += '<rect x="' + x + '" y="' + (Y[r] - h) + '" width="' + (w - 2) + '" height="' + h + '" fill="' + c + '"/>' +
          '<rect x="' + x + '" y="' + (Y[r] - h + 14) + '" width="' + (w - 2) + '" height="3" fill="#c9a24a" opacity=".8"/><rect x="' + x + '" y="' + (Y[r] - h + 34) + '" width="' + (w - 2) + '" height="3" fill="#c9a24a" opacity=".8"/>' +
          '<rect x="' + (x + 3) + '" y="' + (Y[r] - h + 19) + '" width="' + (w - 8) + '" height="11" fill="#1a1208" opacity=".55"/>';
        x += w;
      }
    }
    $('#books').innerHTML = s;
  })();

  ER.init({
    theme: 'court', story: 'glass', storyTitle: 'A Quarter Past Four', id: 'exhibits', no: 'III', title: 'The Advocates’ Room',

      sl.innerHTML = vals[i] ? '<i class="' + vals[i] + '" style="transform:rotate(' + (((i * 37) % 7) - 3) + 'deg)">' + NAME[vals[i]] + '</i>' : '';
      sl.setAttribute('data-v', vals[i]);
      if (hit) { sl.classList.remove('hit'); void sl.offsetWidth; sl.classList.add('hit'); }
    }
    ER.$$('.sp-st', box).forEach(function (b) {
      b.addEventListener('click', function () { if (done) return; held = b.getAttribute('data-v'); ER.$$('.sp-st', box).forEach(function (o) { o.classList.toggle('on', o.getAttribute('data-v') === held); }); ER.sfx.click(); });
    });
    ER.$$('.sp-slot', box).forEach(function (sl) {
      sl.addEventListener('click', function () {
        var i = +sl.getAttribute('data-i');
        if (done) return;
        if (!held) { says(['Pick up one of the three stamps first. Then press it on a line.']); return; }
        vals[i] = held; ER.flag('x-vals', vals); ink(i, true); GLASS.sfx.stamp();
      });
    });
    box.querySelector('#sp-go').addEventListener('click', function () {
      var over = 0, under = 0, back = 0, first = -1, i, right, parts = [], n, file, t;
      if (done) return;
      if (vals.indexOf('') >= 0) { says(['Seven lines. I can see gaps from here.']); return; }
      for (i = 0; i < 7; i++) {
        if (ER.check('l' + (i + 1), vals[i])) continue;
        if (first < 0) first = i;
        right = KINDS.filter(function (k) { return ER.check('l' + (i + 1), k); })[0];
        if (right === 'might') over++; else if (vals[i] === 'might') under++; else back++;
      }
      GLASS.sfx.sent();
      if (first < 0) {
        file = ER.exitOk([vals.join('-')]);
        if (!file) { says(['Something is wrong with this lock: tell your teacher.']); return; }
        done = true; nextFile = file; ER.flag('x-file', file); GLASS.done('exhibits');
        GLASS.mine('points', 'Points for the judge', L.map(function (l, k) { return '<p>' + (k + 1) + '. ' + l[0] + ' ' + NAME[vals[k]] + ' ' + l[1] + '</p>'; }).join(''), true);
        says(['That is exactly how far the paper goes, and not one step further.', 'Now the hard part. Do NOT tell the judge any of it. Ask HIM questions until he tells her himself. Page 2 of the little book.', 'Battery 1%. You know more than you th'], 'Page sent.');
        setTimeout(function () {
          ER.closeAll(); GLASS.solved(); paint(); busy = true;
          ER.narrate([
            'Her battery has gone. You are on your own now, with seven stamped lines and a boy who looks at tables.',
            'Out in the hall a voice like a church door is calling. &ldquo;Thistlewood and Demir! Hearing Room 3! Thistlewood and Demir!&rdquo;',
            'Nobody says &ldquo;versus&rdquo;.'
          ], function () { busy = false; });
        }, 5200);
        return;
      }
      n = GLASS.bump('x-sends');
      if (over) parts.push(over + (over === 1 ? ' line says' : ' lines say') + ' MORE than the paper gives us.');
      if (under) parts.push(under + (under === 1 ? ' line says' : ' lines say') + ' LESS than it gives us. That is a point we have proved, and you are giving it away.');
      if (back) parts.push(back + (back === 1 ? ' line has' : ' lines have') + ' it the wrong way round.');
      t = n === 1 ? 'The train is still not moving. I have all the time in the world.' : n === 2 ? 'Read the note in the lid of the box again. All of it.' :
        'Look at line ' + (first + 1) + '. ' + (NUDGE[first][vals[first]] || NUDGE[first]['*'] || 'What exactly do the exhibits show?');
      says(parts.concat([t]), 'Page sent.');
    });
    for (s = 0; s < 7; s++) ink(s);
    says(['Stamp every line, then send me the page. I shall tell you how many lines go too far and how many do not go far enough. Not which. This signal will not last.']);
    spBox = box;
    ER.open('ov-lock', box, function () { spBox = null; });
  }
})();
</script>
