<style>
  body{--bg:#141b18;--accent:#d9b25a;--font-display:'Cormorant Garamond',serif;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',Georgia,serif;
    --tc-bg:rgba(13,20,17,.97);--tc-ink:#efe9d8;--cap-bg:rgba(13,20,17,.93);--panel:#16201c;--face-bg:#3a4a44;--q-ink:#b9cbbd;--fade:#0a100d;--hud-bg:rgba(13,20,17,.8)}
  #flick{animation:fl 5.3s steps(1,end) infinite}
  @keyframes fl{0%{opacity:1}71%{opacity:.35}73%{opacity:1}76%{opacity:.5}78%{opacity:1}}
  #lamp{animation:lp 2.6s steps(1,end) infinite}
  @keyframes lp{0%{opacity:1}50%{opacity:.8}}
  #phone.new #pbadge{animation:pb 1.2s steps(1,end) infinite}
  @keyframes pb{50%{opacity:.25}}
  #slip{display:none}
  #slip.on{display:block}
  #slip.on.ready{animation:nudge 1.7s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-6px)}}
  #demirs.ready{animation:nudge 1.7s ease-in-out infinite}

  /* the usher's slip, on its clipboard */
  .us{display:grid;grid-template-columns:minmax(0,580px) 370px;gap:26px;width:min(1010px,96vw);align-items:start}
  .us-clip{position:relative;padding:44px 20px 20px;background:#8a6a42 linear-gradient(160deg,#a5804f,#74552f);border-radius:10px;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .us-clip:before{content:'';position:absolute;left:50%;top:10px;width:150px;height:30px;margin-left:-75px;border-radius:6px;background:linear-gradient(#f0d98f,#b08a35 60%,#7d5f1d);box-shadow:0 3px 5px rgba(0,0,0,.4)}
  .us-form{background:#fbf8ec;color:#1c1d1f;padding:16px 22px 14px;font-family:'Courier Prime',monospace}
  .us-form h4{margin:0;font-family:'Cormorant SC',serif;font-weight:700;font-size:25px;letter-spacing:.12em;line-height:1.1}
  .us-form h5{margin:1px 0 10px;font-weight:400;font-size:14px;letter-spacing:.1em;border-bottom:3px double #1c1d1f;padding-bottom:8px}
  .us-line{display:grid;grid-template-columns:196px minmax(0,1fr);align-items:center;gap:12px;margin-bottom:6px}
  .us-line label{font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
  .us-line label small{display:block;font-family:'Courier Prime',monospace;font-weight:400;font-size:12.5px;letter-spacing:0;text-transform:none;color:#6b6453}
  .us-slot{min-height:46px;display:flex;align-items:center;padding:3px 4px;border-bottom:2px solid #1c1d1f;background:rgba(40,60,120,.06)}
  .us-slot.bad{background:rgba(179,38,28,.16)}
  .us-callrow{grid-template-columns:minmax(0,1fr);gap:4px;margin-top:9px}
  .us-callrow label small{display:inline;margin-left:10px}
  .us-call{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px}
  #phone:not(.new) #pbadge{display:none}
  .us-call button{padding:5px 11px 3px;border:1.5px solid #1c1d1f;font-family:'Courier Prime',monospace;font-weight:700;font-size:16px;color:#1c1d1f;border-radius:2px}
  .us-call button.on{background:#1c1d1f;color:#fbf8ec}
  .us-foot{display:flex;align-items:center;gap:14px;margin-top:10px}
  .us-foot .btn{--accent:#1f4a37;white-space:nowrap}
  .us-foot .btn:hover:not([disabled]){color:#fbf8ec}
  .us-foot span{font-size:12.5px;color:#6b6453;line-height:1.3}
  .us-side h6{margin:0 0 8px;font-family:'Oswald',sans-serif;font-weight:400;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#b9cbbd}
  .us-tray{min-height:330px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px;background:rgba(10,16,13,.7);border:1px dashed rgba(217,178,90,.5)}
  .us-card{padding:8px 13px 6px;background:#fdfdfb;color:#1c1d22;border-left:6px solid #1f4a37;font-family:'Tinos',serif;font-size:17.5px;line-height:1.15;box-shadow:0 4px 9px rgba(0,0,0,.45);white-space:nowrap}
  .us-slot .us-card{box-shadow:none;border-left-color:#39507e}
  .us .pmsg{margin-top:14px;min-height:150px}
  @media (max-width:900px){.us{grid-template-columns:1fr}}
</style>
</head>

      kwik: 'Kwik-Clamp are the defendant upstairs in Court 1, I am glad to say. Not down here at half past ten.',
      '*': 'Nobody is asking that person for £900. The defendant is the one who is asked. On my list the name comes after the v.' },
    { emre: 'A boy of thirteen cannot be his own grown-up. That is the whole point of having one.',
      thistlewood: 'Mr Thistlewood is many things this morning, but he is nobody&rsquo;s friend.',
      '*': 'A litigation friend is not a lawyer and not a helper. It is the grown-up who runs the case for a child. My list gives her name, in brackets.' },
    { nair: 'Ms Nair is a solicitor, which is the opposite of &ldquo;lay&rdquo;. She is also on a train.',
      selin: 'Miss Demir could speak for her brother herself. But she has asked the Clinic to do it, and the Clinic has sent somebody. Have a look round the hall. Then have a look in a mirror.',
      makepeace: 'I call the cases. I do not argue them. I have opinions about all of them, and I keep those under the gown.',
      '*': 'A lay representative is somebody who is not a lawyer, who is in the room, and who has been asked to speak. This morning there is exactly one of those.' },
    { sallis: 'Judge Sallis is upstairs in Court 1, with a whole day of parking in front of him. Look at the top of my list for Hearing Room 3.',
      makepeace: 'I am not the judge. I have been asked.',
      '*': 'That is not a judge. The judge&rsquo;s name is at the top of the list for each room.' },
    { v: 'We write &ldquo;v&rdquo;. We do not say it.', versus: '&ldquo;Versus&rdquo; is for boxing.',
      against: '&ldquo;Against&rdquo; is what they say in the criminal courts down the road. This is a civil court, and we are civil.', '*': 'I must call it as something.' }
  ];
  function openSlip() {
    var box = ER.el('div', 'us'), call = '', s = '<div class="us-clip"><div class="us-form"><h4>Usher&rsquo;s slip</h4><h5>HEARING ROOM 3 &middot; 10.30 &middot; a greenhouse &middot; £900</h5>';
    LINES.forEach(function (l, i) { s += '<div class="us-line"><label>' + l[0] + '<small>' + l[1] + '</small></label><div class="us-slot" data-s="' + (i + 1) + '"></div></div>'; });
    s += '<div class="us-line us-callrow"><label>I shall call it<small>aloud, in the hall</small></label><div class="us-call"><span>Thistlewood</span>' +
      ['v', 'versus', 'and', 'against'].map(function (w) { return '<button type="button" data-c="' + w + '">' + w + '</button>'; }).join('') + '<span>Demir</span></div></div>' +
      '<div class="us-foot"><button type="button" class="btn" id="us-go">Hand it to Mr Makepeace</button><span>Drag a name on to a line, or click the name and then the line.</span></div></div></div>' +
      '<div class="us-side"><h6>In the building this morning</h6><div class="us-tray"></div><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.us-tray'), msgEl = box.querySelector('.pmsg'), done = false;
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    NAMES.forEach(function (n) { var c = ER.el('div', 'us-card dnd-item'); c.setAttribute('data-n', n[0]); c.textContent = n[1]; tray.appendChild(c); });
    ER.dnd(box, { item: '.us-card', slot: '.us-slot', home: tray, lock: function () { return done; }, change: function () { ER.$$('.us-slot', box).forEach(function (x) { x.classList.remove('bad'); }); GLASS.sfx.card(); } });
    ER.$$('.us-call button', box).forEach(function (b) {
      b.addEventListener('click', function () { if (done) return; call = b.getAttribute('data-c'); ER.$$('.us-call button', box).forEach(function (o) { o.classList.toggle('on', o === b); }); ER.sfx.click(); });
    });
    box.querySelector('#us-go').addEventListener('click', function () {
      if (done) return;
      var vals = ER.$$('.us-slot', box).map(function (sl) { var c = sl.querySelector('.us-card'); return c ? c.getAttribute('data-n') : ''; }), wrong = [], i, file;
      vals.push(call);
      if (vals.indexOf('') >= 0) { msg('&ldquo;I do not take a slip with holes in it,&rdquo; says Mr Makepeace. &ldquo;Six lines, if you please.&rdquo;'); GLASS.sfx.hm(); return; }
      for (i = 0; i < 6; i++) if (!ER.check('s' + (i + 1), vals[i])) wrong.push(i);
      if (!wrong.length) {
        file = ER.exitOk([vals.join('-')]);
        if (!file) { msg('Mr Makepeace looks at the slip for a long time. Something is wrong with this lock: tell your teacher.'); return; }
        done = true; nextFile = file; ER.flag('h-file', file); GLASS.done('hall');
        msg('Mr Makepeace reads the slip from the top to the bottom. Then, to be quite sure, he reads it from the bottom to the top.');
        GLASS.sfx.pencil();
        setTimeout(function () {
          ER.closeAll(); GLASS.solved(); paint(); busy = true;
          ER.narrate([
            '&ldquo;Correct in every line,&rdquo; says Mr Makepeace. &ldquo;I shall have it framed.&rdquo; He does not smile, but something happens near his mouth.',
            '&ldquo;The parking company has brought a witness and a coloured map, so you have half an hour. Consultation Room 2 is empty. Take your clients in there, and read your file.&rdquo;',
            'Your clients. They are the two people in front of the radiator: a yellow raincoat, and a boy.'
          ], function () { busy = false; });
        }, 2300);
        return;
      }
      GLASS.bump('h-slips'); GLASS.sfx.hm();
      i = wrong[0];
      if (i < 5) ER.$$('.us-slot', box)[i].classList.add('bad');
      msg('<b>' + (i < 5 ? LINES[i][0] : 'I shall call it') + '.</b> &ldquo;' + (SAYS[i][vals[i]] || SAYS[i]['*']) + '&rdquo;' +
        (wrong.length === 1 ? ' <i>The other five lines will do.</i>' : ' <i>And that is not the only line he cannot use: there ' + (wrong.length === 2 ? 'is one more.' : 'are ' + (wrong.length - 1) + ' more.') + '</i>'));
    });
    msg('Five lines want a name, and the last line wants a word. Mr Makepeace has taken the top off his fountain pen, and is waiting.');
    slipBox = box;
    ER.open('ov-lock', box, function () { slipBox = null; });
  }
})();
</script>
</body>
</html>
