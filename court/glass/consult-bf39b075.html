    'I am 74 years old. For thirty-one years I was a signalman on the railway. I notice the time of things, and I write it down.',

  function fileStatements() {
    ER.addClue('st-t', 'Statement of Mr Thistlewood', stmt('STANLEY THISTLEWOOD', 'the Claimant', ST, 'S. Thistlewood', '9 January'), 'wstmt', 'Witness statement', true);
    ER.addClue('st-e', 'Statement of Emre Demir', stmt('EMRE DEMIR', 'the Defendant, aged 13', ED, 'E. Demir', '2 February'), 'wstmt', 'Witness statement');
    GLASS.learn(['witness', 'witness statement', 'statement of truth', 'exhibit']);
  }

  function hints() {
    if (nextFile) return ['go', ['Mr Makepeace has given you the Advocates&rsquo; Room. Use the button at the bottom of the screen.']];
    if (wsBox && step === 3) return ['sheet', [
      'Both answers are on Ms Nair&rsquo;s card: rule 2 and rule 3. The Notebook button is at the top of the puzzle.',
      'Rule 2 says that the one who makes the claim must prove it. Who is making this claim? Rule 3 says that there are two kinds of court and two standards. Which kind of court are you sitting in?',
      'Rule 2 again: who is the claimant here? The proving is that person&rsquo;s job, and nobody else&rsquo;s. Rule 3 again: this is a civil court, where nobody goes to prison. Which of the three phrases belongs to a civil court?'
    ]];
    if (wsBox && step === 2) return ['issue', [
      'Three disagreements. But the judge is here to decide only one thing: does Mr Thistlewood get his £900? Which of the three decides that?',
      'Try each one like this: &ldquo;If the judge decides this, is the case over?&rdquo; Whether somebody said sorry in June does not decide who pays for October. Where Emre was on Saturday afternoon is only a step on the way.',
      'The issue is the paragraph in which Mr Thistlewood says what Emre did. Click the number on that piece of tape, on the left-hand statement.'
    ]];
    if (wsBox) return ['ties', [
      'Rule 1 on Ms Nair&rsquo;s card: cross out everything that the two of them agree about. They agree that Emre kicks a ball against the fence, that balls come over, that a pane was cracked in June, and that the ball in the greenhouse is Emre&rsquo;s. None of those is a fight.',
      'A real disagreement is two paragraphs that cannot both be true. Take Mr Thistlewood&rsquo;s paragraphs one at a time and ask: does Emre say the opposite anywhere? And be careful with the crash: a crash is only a noise, and a noise does not need Emre.',
      'Look at three of Mr Thistlewood&rsquo;s paragraphs: the one about saying sorry, the one about where Emre was that afternoon, and the one about what Emre did with the ball. Emre answers each of them.'
    ]];
    return ['look', [
      'Ms Nair&rsquo;s white card is on the table, on the right. Rule 1 tells you what to do with two statements. Read it, read the claim form on the left, and talk to Selin and to Emre.',
      'Both witness statements are in the open file in the middle of the table. Click the file.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#bundle').classList.toggle('ready', !nextFile && !!ER.flag('c-card'));
    ER.pips(nextFile ? 3 : (ER.flag('c-issue') ? 2 : ((ER.flag('c-ties') || []).length >= 3 ? 1 : 0)), 3);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The file is tied up again. The Advocates&rsquo; Room is waiting.'); return; }
    if (ER.flag('c-in')) { ER.say('Consultation Room 2. The file is open on the table.'); return; }
    busy = true; ER.flag('c-in', 1);
    ER.narrate([
      'Inside the file: a claim form, two witness statements, three exhibits in a plastic wallet, and a white card that Ms Nair has had laminated.',
      'Selin is watching you. Emre is watching the table.',
      'Half an hour. Start with the card.'
    ], function () { busy = false; });
  }

  /* ---------- the room ---------- */
  $('#card').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CARD, cls: 'crib', clue: { id: 'card', title: 'Ms Nair’s card: Before you go in', kind: 'In the front of the file' },
      done: function () { ER.flag('c-card', 1); paint(); GLASS.learn(['issue', 'prove', 'burden of proof', 'balance of probabilities', 'beyond reasonable doubt', 'criminal court']); } });
  });
  $('#claim').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: CLAIM, cls: 'n1', clue: { id: 'claim', title: 'The claim form', kind: 'Thistlewood v Demir' }, done: function () { GLASS.learn(['claim', 'particulars of claim', 'statement of truth']); } });
  });
  $('#selin').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Selin Demir', role: 'Emre’s sister · his litigation friend', face: window.FACE('selin'),
      lines: [
        { note: 'Selin sits down without taking off the yellow raincoat, like somebody who may have to leave in a hurry.', q: 'Tell me about that Saturday.',
          a: 'Saturday the eighteenth. Emre had the Autumn Gala at the Baths. I took him at half past one and we got home after six. Fifty metres backstroke. He came third, not that anybody asks. When we got in there was a note on the mat, all in capitals. YOUR BOY HAS DESTROYED MY GREENHOUSE.' },
        { q: 'And then?',
          a: 'Sunday morning he was on our step, with the ball under his arm like a prisoner. I said it was probably the wind. On the Friday night it blew the bins right down our street, and I nearly came off my bike going to work. He said his greenhouse had stood there for twenty-two years and was not afraid of a bit of wind. Then he said nine hundred pounds, and I shut the door. I shouldn&rsquo;t have. But I did.' },
        { q: 'Has one of Emre&rsquo;s footballs broken his glass before?',
          a: 'One pane. In June. Emre went round with Mum the same evening and said sorry, to his own shoes, the way he does. Mum paid twenty pounds. Mr Thistlewood says that nobody ever said sorry. Maybe he didn&rsquo;t hear it. He was doing a lot of the talking.' },
        { a: 'Look. Emre is a pain. He kicks that ball against the fence until your teeth hurt. But he doesn&rsquo;t lie. If he says he didn&rsquo;t kick it over on Saturday, then he didn&rsquo;t kick it over on Saturday.' }
      ],
      clue: { id: 'selin2', title: 'Selin, about that weekend', kind: 'What she said' }, last: 'Thank you'
    });
  });
  $('#emre').addEventListener('click', function () {
    if (busy) return;
    ER.talk({
      who: 'Emre Demir', role: 'The Defendant · aged thirteen', face: window.FACE('emre'),
      lines: [
        { note: 'Emre is drawing on the table with one finger: a rectangle, with a goal at each end.', q: 'Emre. Did you kick that ball into his garden on Saturday?', a: 'No.' },
        { q: 'Is it your ball in his carrier bag?', a: 'Yeah. It&rsquo;s got my name on. I wrote it myself.' },
        { q: 'So how did it get into his greenhouse?', a: 'Don&rsquo;t know.</p><p class="note">He rubs the football pitch out with his sleeve.</p><p>I don&rsquo;t know how it got in there. That&rsquo;s true. It&rsquo;s in my statement.' },
        { q: 'Is there anything that isn&rsquo;t in your statement?', a: 'Everything in my statement&rsquo;s true.' }
      ],
      clue: { id: 'emre2', title: 'Emre, in Consultation Room 2', kind: 'What he said' }, last: 'All right'
    });
  });
  $('#bundle').addEventListener('click', function () { if (busy) return; if (nextFile) { ER.say('The file is tied up again, with the issue written on the front in your own writing.'); return; } openWs(); });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  GLASS.thing('#window', null, 'Wire in the glass, and rain on the other side of it. Beyond the rain there is a car park.', isBusy);
  GLASS.thing('#plant', null, 'A plant that has sat through a great many consultations, and has given up.', isBusy);
  GLASS.thing('#radiator', 'radiator', 'The radiator is either off or boiling. Today it is off.', isBusy);
  GLASS.thing('#clock', null, 'Twenty-one minutes past ten. In Hearing Room 3 the parking company is still explaining its map.', isBusy);
  GLASS.thing('#poster', null, 'MEDIATION. HAVE YOU TRIED TALKING? Selin read it when she came in. &ldquo;I tried,&rdquo; she said. &ldquo;On our front step. He had the ball under his arm.&rdquo;', isBusy);
  GLASS.thing('#door', null, 'CONSULTATION ROOM 2. The little brass slide says ENGAGED.', isBusy);
  GLASS.thing('#tissues', 'tissues', 'A box of tissues. The court puts one in every consultation room. They get used.', isBusy);
  GLASS.thing('#phone', null, 'Your phone. Nothing from Ms Nair since 9.52. No signal on her train, or no battery, or both.', isBusy);

  /* ---------- two statements and a reel of pink tape ---------- */
  var NOPE = {
    '2>2': 'Selin shakes her head. &ldquo;They&rsquo;re saying the same thing. He kicks it at the fence, and sometimes it goes over. Nobody is fighting about that.&rdquo;',
    '7>4': '&ldquo;The ball is Emre&rsquo;s. He says so, and we say so. That isn&rsquo;t a fight. That&rsquo;s a choir.&rdquo;',
    '3>2': '&ldquo;A ball cracked a pane in June: they both say that. Read the rest of his paragraph. What ELSE does he say about June?&rdquo;',
    '5>5': '&ldquo;A crash at a quarter past four, and Emre at the Baths at a quarter past four. Why can&rsquo;t both of those be true? A crash doesn&rsquo;t need Emre.&rdquo;',
    '5>6': '&ldquo;He heard a crash. Emre didn&rsquo;t kick a ball. Both can be true at once: a crash is only a noise. Which paragraph says what MADE the noise?&rdquo;',
    '6>6': '&ldquo;Careful. He says Emre was in his garden. Emre says he didn&rsquo;t kick a ball over. You can stand in a garden without kicking a ball over a fence. Which paragraph says where Emre WAS?&rdquo;',
    '7>6': '&ldquo;He FOUND the ball. He doesn&rsquo;t say in that paragraph that anybody kicked it. Finding and kicking are two different things.&rdquo;',
    '7>7': '&ldquo;He found the ball in the greenhouse. Emre doesn&rsquo;t know how it got there. Those two fit together fine. Emre has never said that the ball wasn&rsquo;t in there.&rdquo;',
    '4': '&ldquo;Friday at six, every pane whole. Emre&rsquo;s statement doesn&rsquo;t argue with that.&rdquo; Selin runs her finger down the page. &ldquo;Emre&rsquo;s statement doesn&rsquo;t say anything about Friday at all.&rdquo;',
    '9': '&ldquo;Nobody says the repairs didn&rsquo;t cost nine hundred pounds. The fight is about who pays.&rdquo;',
    '1': '&ldquo;He was a signalman. Emre is in Year 9. I don&rsquo;t think the judge is going to have to choose.&rdquo;',
    '*': 'Selin reads the two paragraphs aloud, one after the other. &ldquo;I don&rsquo;t see it. Couldn&rsquo;t both of those be true?&rdquo;'
  };
  function yes(tn, en) { return 'His paragraph ' + tn + ' and Emre&rsquo;s paragraph ' + en + ' cannot both be true. Selin nods. A length of pink tape goes across the table.'; }
  function openWs() {
    var box = ER.el('div', 'ws'), ties = ER.flag('c-ties') || [], sel = null, pick = { burden: '', sure: '' }, done = false;
    function col(side, title, sub, list, sig, date) {
      return '<div class="ws-doc ' + (side === 't' ? 'l' : 'r') + '"><h4>WITNESS STATEMENT OF ' + title + '<small>' + sub + '</small></h4>' +
        list.map(function (t, i) { return '<button type="button" class="ws-p" data-s="' + side + '" data-n="' + (i + 1) + '"><span>' + (i + 1) + '.</span><span>' + ER.gloss(t) + '</span><i class="ws-flag"></i></button>'; }).join('') +
        '<p class="tru"><span>I believe that the facts stated in this witness statement are true.</span><span class="sig">' + sig + '</span></p></div>';
    }
    box.innerHTML = '<div class="ws-docs"><svg class="ws-tape"></svg>' + col('t', 'STANLEY THISTLEWOOD', 'the Claimant &middot; 9 January', ST, 'S. Thistlewood') + col('e', 'EMRE DEMIR', 'the Defendant, aged 13 &middot; 2 February', ED, 'E. Demir') +
      '</div><div class="ws-bar"><p class="pmsg"></p><div class="ws-sheet">' +
      '<div data-k="burden"><label>WHO HAS TO PROVE IT?</label><button type="button" data-v="claimant">Mr Thistlewood</button><button type="button" data-v="defendant">Emre</button><button type="button" data-v="both">both of them</button></div>' +
      '<div data-k="sure"><label>HOW SURE MUST THE JUDGE BE?</label><button type="button" data-v="certain">certain</button><button type="button" data-v="doubt">sure, beyond reasonable doubt</button><button type="button" data-v="likely">more likely than not</button></div>' +
      '<button type="button" class="btn" id="ws-go">Tie up the file</button></div></div>';
    var msgEl = box.querySelector('.pmsg'), tape = box.querySelector('.ws-tape'), docs = box.querySelector('.ws-docs');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function P(s, n) { return box.querySelector('.ws-p[data-s="' + s + '"][data-n="' + n + '"]'); }
    function draw() {
      var r0 = docs.getBoundingClientRect(), s = '';
      ER.$$('.ws-p', box).forEach(function (p) { p.classList.remove('tied'); });
      ties.forEach(function (t, i) {
        var a = P('t', t.split('>')[0]), b = P('e', t.split('>')[1]), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        var x1 = ra.right - r0.left + 4, y1 = ra.top + ra.height / 2 - r0.top, x2 = rb.left - r0.left - 4, y2 = rb.top + rb.height / 2 - r0.top;
        a.classList.add('tied'); b.classList.add('tied'); a.querySelector('.ws-flag').textContent = b.querySelector('.ws-flag').textContent = i + 1;
        s += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + 'C' + (x1 + 44).toFixed(1) + ' ' + y1.toFixed(1) + ' ' + (x2 - 44).toFixed(1) + ' ' + y2.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
      });
      tape.innerHTML = s;
      box.setAttribute('data-ties', ties.length); box.setAttribute('data-step', step);
    }
    function setStep(n) {
      step = n; box.classList.toggle('s2', n === 2); box.classList.toggle('s3', n === 3);
      if (n === 2) msg('Three places where the two stories cannot both be true. Selin looks at the three lengths of tape. &ldquo;So which one is the judge actually here for? The other two are just noise.&rdquo; <i>Click the number on one of the three.</i>');
      if (n === 3) msg('<b>The issue:</b> did Emre&rsquo;s ball break the glass? Everything else in the two statements is either agreed, or beside the point. Now the front sheet of the file has two more boxes, and Ms Nair fills them in for every case.');
      draw(); paint();
    }
    function tie(tn, en) {
      var k = tn + '>' + en;
      if (ties.some(function (t) { return t.split('>')[0] === String(tn); })) { msg('That paragraph of Mr Thistlewood&rsquo;s is tied already.'); return; }
      if (ER.check('tie', k)) {
        ties.push(k); ER.flag('c-ties', ties); GLASS.sfx.tape(); draw();
        if (ties.length >= 3) { setTimeout(function () { if (step === 1) setStep(2); }, 2600); msg(yes(tn, en) + ' <b>That is three.</b>'); }
        else msg(yes(tn, en) + ' <b>' + (ties.length === 1 ? 'That is one.' : 'That is two.') + '</b>');
        return;
      }
      GLASS.bump('c-wrong'); GLASS.sfx.hm();
      msg(NOPE[k] || NOPE[tn] || NOPE['*']);
    }
    ER.$$('.ws-p', box).forEach(function (p) {
      p.addEventListener('click', function () {
        var s = p.getAttribute('data-s'), n = +p.getAttribute('data-n');
        if (done) return;
        if (step === 2) {
          if (!p.classList.contains('tied')) return;
          if (s === 'e') n = +ties.filter(function (t) { return t.split('>')[1] === String(n); }).pop().split('>')[0];      /* the same piece of tape, from its other end */
          if (ER.check('issue', n)) { ER.flag('c-issue', n); p.classList.add('issue'); GLASS.sfx.pencil(); setStep(3); return; }
          GLASS.bump('c-wrong'); GLASS.sfx.hm();
          msg(n === 3 ? '&ldquo;June?&rdquo; says Selin. &ldquo;It matters to Mum. But suppose the judge decides that Emre did say sorry in June. Does that tell her who pays for October?&rdquo;'
            : '&ldquo;Closer. But think. Say the judge decides that he WAS at the Baths. Is it all over? Couldn&rsquo;t the ball have done it at some other time? Where he was is a step on the way. It isn&rsquo;t the question.&rdquo;');
          return;
        }
        if (step !== 1) return;
        if (p.classList.contains('tied')) { msg('That one is tied already.'); return; }
        if (!sel || sel.getAttribute('data-s') === s) { if (sel) sel.classList.remove('sel'); sel = sel === p ? null : p; if (sel) sel.classList.add('sel'); ER.sfx.click(); return; }
        var a = s === 't' ? p : sel, b = s === 't' ? sel : p;
        sel.classList.remove('sel'); sel = null;
        tie(+a.getAttribute('data-n'), +b.getAttribute('data-n'));
      });
    });
    ER.$$('.ws-sheet div button', box).forEach(function (b) {
      b.addEventListener('click', function () {
        if (done) return;
        var k = b.parentNode.getAttribute('data-k'); pick[k] = b.getAttribute('data-v');
        ER.$$('button', b.parentNode).forEach(function (o) { o.classList.toggle('on', o === b); }); ER.sfx.click();
      });
    });
    box.querySelector('#ws-go').addEventListener('click', function () {
      var file;
      if (done) return;
      if (!pick.burden || !pick.sure) { msg('Two boxes, and one of them is still empty.'); return; }
      if (!ER.check('burden', pick.burden)) {
        GLASS.bump('c-wrong'); GLASS.sfx.hm();
        msg(pick.burden === 'both' ? '&ldquo;Both of them?&rdquo; says Selin. &ldquo;Then why does the card say that our client doesn&rsquo;t have to prove a thing? Rule 2.&rdquo;'
          : 'Selin reads rule 2 off Ms Nair&rsquo;s card, slowly, the way you read to a very small child. &ldquo;The one who makes the claim must prove it.&rdquo; She looks at her brother. &ldquo;You don&rsquo;t have to prove that you didn&rsquo;t. He has to prove that you did.&rdquo;');
        return;
      }
      if (!ER.check('sure', pick.sure)) {
        GLASS.bump('c-wrong'); GLASS.sfx.hm();
        msg(pick.sure === 'certain' ? '&ldquo;Certain? Then nobody would ever win anything. Even HE can&rsquo;t be certain, and it&rsquo;s his greenhouse. Rule 3.&rdquo;'
          : '&ldquo;Beyond reasonable doubt is for crimes,&rdquo; says Selin, with her finger on the card. &ldquo;Nobody is going to prison over a greenhouse. Rule 3: what does a civil court want?&rdquo;');
        return;
      }
      file = ER.exitOk([ties.map(function (t) { return t.split('>')[0]; }).sort().join('+') + '|' + ER.flag('c-issue') + '|' + pick.burden + '|' + pick.sure]);
      if (!file) { msg('The tape will not tie. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('c-file', file); GLASS.done('consult'); GLASS.sfx.tape();
      msg('You write three lines on the front of the file. <b>ISSUE:</b> did Emre&rsquo;s ball break the glass? <b>TO BE PROVED BY:</b> Mr Thistlewood. <b>HOW SURE:</b> more likely than not.');
      GLASS.mine('front', 'The front of the file', '<p>ISSUE: did Emre&rsquo;s ball break the glass?</p><p>TO BE PROVED BY: Mr Thistlewood. He is the claimant, so the burden of proof is on him. Emre does not have to prove anything.</p><p>HOW SURE: on the balance of probabilities. More likely than not.</p><p>Level scales = not proved.</p>', true);
      setTimeout(function () {
        ER.closeAll(); GLASS.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;So we don&rsquo;t have to prove what DID break it,&rdquo; says Selin slowly. &ldquo;He has to prove that the ball did. And all he has is that he found it in there.&rdquo;',
          '&ldquo;And a crash,&rdquo; you say. &ldquo;At a quarter past four. He noted the time by his alarm clock.&rdquo; Selin pulls a face. &ldquo;Who looks at an alarm clock in the afternoon?&rdquo;',
          'Nobody has an answer to that. Emre goes on looking at the table.',
          'The door opens four inches. It is Mr Makepeace. &ldquo;The map has gone badly for the parking company,&rdquo; he says, with quiet pleasure. &ldquo;Twenty minutes. There are three exhibits in that file, and the big table in the Advocates&rsquo; Room is free. Nobody will mind. Nobody is ever in there.&rdquo;'
        ], function () { busy = false; });
      }, 3200);
    });
    fileStatements();
    wsBox = box; step = ER.flag('c-issue') ? 3 : (ties.length >= 3 ? 2 : 1);
    ER.open('ov-lock', box, function () { wsBox = null; window.removeEventListener('resize', draw); });
    window.addEventListener('resize', draw);
    if (ER.flag('c-issue')) P('t', ER.flag('c-issue')).classList.add('issue');
    if (step === 1) { msg('Two statements about the same weekend. Most of what they say is the same story. <b>Tie together two paragraphs that cannot both be true:</b> click one on the left, then one on the right. There are three such pairs.'); draw(); }
    else setStep(step);
    setTimeout(draw, 60);
  }
})();
</script>
</body>
</html>
