<style>
  body{--bg:#2a2115;--accent:#e3b23c;--font-display:'Cinzel',serif;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',Georgia,serif;
    --tc-bg:rgba(30,23,14,.97);--tc-ink:#f3ecd9;--cap-bg:rgba(30,23,14,.93);--panel:#261e14;--face-bg:#39493f;--q-ink:#dcc9a0;--fade:#150f08;--hud-bg:rgba(30,23,14,.8)}
  .mote{animation:mote 9s linear infinite;opacity:0}
  .mote.m2{animation-duration:12s;animation-delay:-4s}.mote.m3{animation-duration:10s;animation-delay:-7s}
  @keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translate(46px,120px);opacity:0}}
  #sticker{animation:stk 3.4s steps(1,end) infinite}
  @keyframes stk{0%{opacity:1}92%{opacity:.82}}

  /* the panel board: seven faces on cork, and six pins */
  .pb{width:min(1150px,96vw)}
  .pb-board{padding:16px 16px 14px;background:#b98a56 radial-gradient(circle,rgba(70,40,10,.3) 1px,transparent 1.500px) 0 0/9px 9px;border:12px solid #5a3c1f;box-shadow:0 22px 60px rgba(0,0,0,.6)}
  .pb-board h4{margin:0 0 10px;text-align:center;font-family:'Stardos Stencil',serif;font-weight:700;font-size:21px;letter-spacing:.14em;color:#2a1b10}
  .pb-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
  .pb-card{position:relative;background:#fbf8ec;color:#1c1d22;padding:0 0 6px;box-shadow:0 5px 10px rgba(0,0,0,.4);display:flex;flex-direction:column}
  .pb-card:nth-child(odd){transform:rotate(-.7deg)}.pb-card:nth-child(even){transform:rotate(.6deg)}
  .pb-face{height:112px;overflow:hidden}
  .pb-face svg{display:block;width:100%;height:150px}
  .pb-card b{display:block;padding:6px 8px 0;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;line-height:1.1}
  .pb-card i{display:block;padding:1px 8px 0;font-style:normal;font-family:'Courier Prime',monospace;font-size:12px;color:#7b1f2a}
  .pb-card span{display:block;flex:1;padding:3px 8px 5px;font-family:'Tinos',serif;font-size:13.5px;line-height:1.2;color:#33322c}
  .pb-slot{margin:0 6px;min-height:36px;border:1.500px dashed #9a8a6a;border-radius:3px;display:grid;place-items:center;background:rgba(185,138,86,.16)}
  .pb-card.chair .pb-slot{border-style:solid;border-color:#c9a24a}
  .pb-pin{position:relative;padding:5px 9px 3px 22px;border-radius:3px;font-family:'Oswald',sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.09em;line-height:1.2;color:#fff;background:#a3261c;box-shadow:0 3px 6px rgba(0,0,0,.4);white-space:nowrap}
  .pb-pin:before{content:'';position:absolute;left:6px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9a39c 45%,#6b120c)}
  .pb-pin.call{background:#1f5a3a}.pb-pin.call:before{background:radial-gradient(circle at 35% 30%,#fff,#9fd0b0 45%,#0e3320)}
  .pb-pin.gold{background:#8a6a26;cursor:default}.pb-pin.gold:before{background:radial-gradient(circle at 35% 30%,#fff,#f0d98f 45%,#6f531a)}
  .pb-slot .pb-pin{font-size:10.5px;padding:5px 6px 3px 19px}
  .pb-card>.pb-pin{margin:-36px 6px 0;min-height:36px;display:flex;align-items:center;font-size:10.5px;padding:4px 6px 2px 20px;white-space:normal;text-align:left}
  .pb-under{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;margin-top:12px;align-items:start}
  .pb-tray{display:flex;flex-wrap:wrap;gap:9px;align-items:center;min-height:50px;padding:9px 12px;background:rgba(10,8,5,.7);border:1px dashed rgba(240,217,143,.5)}
  .pb-tray small{font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#cbb98f;margin-right:4px}
  .pb .pmsg{margin-top:10px;min-height:82px}
  .pb .btn{width:100%}
</style>

      file = ER.exitOk([Object.keys(o).sort().map(function (k) { return k + ':' + o[k]; }).join('+')]);
      if (!file) { msg('The pins will not stay in. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('a-file', file); GB.done('chamber');
      msg('Dr Rahman reads the board from left to right, and then from right to left. <b>&ldquo;Yes,&rdquo; she says. &ldquo;That is a committee.&rdquo;</b>');
      GB.mine('panel', 'Who sits, and who may not', '<p>THE COMMITTEE: Dr Rahman (Chair), Mr Quayle, Mr Loxley.</p><p>NOT Mrs Hargreave: she made the decision.</p><p>NOT Mr Pettifer: he is the witness.</p><p>NOT Dr Oyelaran: she is Tunde&rsquo;s mother.</p><p>NOT Miss Ferrars: she coaches Tunde&rsquo;s club.</p><p>Nobody judges a case that they have a part in.</p>', true);
      setTimeout(function () {
        ER.closeAll(); GB.solved(); paint(); busy = true;
        ER.narrate([
          '&ldquo;Mr Quayle, who has seen nothing all day. Mr Loxley, who is nobody&rsquo;s uncle. And four red pins, each with its own reason.&rdquo; Dr Rahman takes the gold pin out of her own photograph and puts it in her cardigan pocket. &ldquo;The Mayor&rsquo;s Parlour, at five past four.&rdquo;',
          'When you turn round, Maeve is standing behind you with Form G. She has filled in every line but one: THE PLAYER&rsquo;S FRIEND.',
          '&ldquo;Rule 9(a),&rdquo; she says. &ldquo;One friend to speak for me. Anybody in the building who isn&rsquo;t on the panel.&rdquo; She looks at your badge again. &ldquo;In round two my pencil broke, and you brought me another one. You didn&rsquo;t have to.&rdquo;',
          'You write your name on the line. It is the first time today that anybody has asked you to do anything except run.',
          'Dr Rahman has stopped counting the raffle money. &ldquo;You chose the committee before you chose a side,&rdquo; she says. &ldquo;That is the right order. I should not like to see it done the other way round.&rdquo;',
          'Mrs Hargreave puts her initials on the form and looks at the clock. &ldquo;Rule 9(c): she sees every paper before she answers. The papers of round 4 are at the Congress Desk. Go with her.&rdquo;'
        ], function () { busy = false; });
      }, 3000);
    });
    msg('Six people, and six pins. Two green pins for the two who will sit beside the Chair, and a red pin for each of the four who may not, with the reason on it. <i>Drag a pin on to a card, or click the pin and then the card.</i>');
    pbBox = box; box.setAttribute('data-in', Object.keys(state()).length);
    ER.open('ov-lock', box, function () { pbBox = null; });
  }
})();
</script>
