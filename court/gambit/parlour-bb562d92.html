      'The till roll gave you the time of everything, because a chess clock is two clocks and only one of them is ever running. Add up what has gone from both, and you have the time of day. For a White move you had to take Black&rsquo;s number from the line above, because Black had not yet moved.',

    '<p><b class="t">YOUR OWN WITNESS.</b> This is <b class="t">EXAMINATION-IN-CHIEF</b>. Ask <b class="t">OPEN QUESTIONS</b>: the kind that begin with one of Mr Kipling&rsquo;s six honest serving-men.</p>' +
    '<p class="six">&ldquo;Their names are What and Why and When<br>And How and Where and Who.&rdquo;</p>' +
    '<p>The answer is then hers, in her own words, and it may be something that you did not know.</p>' +
    '<p>A <b class="t">LEADING QUESTION</b> carries its answer inside it: &ldquo;You went home at six, didn&rsquo;t you?&rdquo; All that she can add is yes. We have then heard you, and not her; and an answer that you put into your own witness&rsquo;s mouth is worth very little.</p>' +
    '<p><b class="t">THE OTHER SIDE&rsquo;S WITNESS.</b> This is <b class="t">CROSS-EXAMINATION</b>. Now you MAY lead, and you should: &ldquo;You were twenty metres away, weren&rsquo;t you?&rdquo; He is not your friend, and he will not agree just to please you, so his yes is worth having. Ask him an open question and he will make a speech.</p>';

  /* [what you wrote on the stairs, the rest of the question when it is asked properly, her answer, what happens then] */
  var QS = [
    ['Your telephone was in the box at the Congress Desk, wasn&rsquo;t it?', 'was your telephone during the game?',
      'In the box at the Congress Desk. Envelope fourteen. I gave it in at ten to two, switched off, and I have not had it back yet.'],
    ['You left the hall three times, didn&rsquo;t you?', 'did you leave the hall during the game?',

    ['You went out to fill your water bottle, didn&rsquo;t you?', 'did you go out?',

    ['The third time, you filled your bottle and came straight back, didn&rsquo;t you?', 'did you do in the corridor, the third time?',
      'I filled my bottle at the fountain. Then something buzzed on the windowsill, next to me. It was a telephone. Nobody was there. I picked it up, and the screen lit, and there was a dog on it. I thought: somebody is going to get into trouble for this. So I took it to the desk. Nobody has asked me about that until now. They only asked me where MY telephone was.',
      '<i>Nobody at the table moves. Your pad says that she filled her bottle and came straight back.</i> &ldquo;That,&rdquo; says Dr Rahman, &ldquo;is why we ask them open. Your question had an answer in it, and it was the wrong answer. Go on. Your pad cannot help you now.&rdquo;'],
    ['', 'telephone was it?',
      'I don&rsquo;t know. Not mine: mine is in envelope fourteen. It was black, the glass was cracked at one corner, and the dog was brown and white. I gave it to the lady at the desk, and she wrote it in a red book.',

      'I didn&rsquo;t find it. A man called Paul Morphy found it, in Paris, in 1858. It is on page 41 of my library book, and I have played that game through about forty times. This afternoon Tunde made the same moves as the people in the book, one after another. On move 16 I knew what came next, and I didn&rsquo;t believe it. So I counted every piece on the board, twice. That was the nineteen minutes.']
  ];
  var CARDS = [['what', 'WHAT'], ['howmany', 'HOW MANY TIMES'], ['why', 'WHY'], ['who', 'WHO'], ['when', 'WHEN'], ['whose', 'WHOSE'], ['how', 'HOW'], ['howlong', 'HOW LONG'], ['where', 'WHERE']];
  var FITS = { 2: ['when', 'why', 'how', 'howlong', 'where'], 3: ['why', 'howmany', 'how', 'howlong', 'where'], 4: ['when', 'howmany', 'how', 'howlong', 'where'], 7: ['when', 'where', 'why'] };
  var NOTTHAT = {
    2: 'That is a fair question, and it fits the line. But look at the one that you crossed out: &ldquo;You left the hall THREE TIMES, didn&rsquo;t you?&rdquo; The answer hidden in it was a number. Ask for the number.',
    3: 'It fits the line. It does not fit your pad. What you crossed out was: &ldquo;You only went out WHEN IT WAS TUNDE&rsquo;S TURN, didn&rsquo;t you?&rdquo; Take the answer out of that. What is left to ask for: a reason, a number, or a moment?',
    4: 'It fits the line, and it is not the question on your pad. You had written &ldquo;TO FILL YOUR WATER BOTTLE&rdquo;. Is that a moment, a number, or a reason?',
    7: 'You may want to know that as well. But your pad said: &ldquo;NOBODY HELPED YOU, did they?&rdquo; What this committee needs is the WAY she found it, in her own words. Which of the serving-men asks for the way a thing is done?'
  };
  function label(k) { return CARDS.filter(function (c) { return c[0] === k; })[0][1]; }
  function refuse(n, k) {
    if (n === 6 && k === 'what') return '&ldquo;What telephone was it?&rdquo; She has just told us what it was: black, and buzzing. This committee would like to know something else about it. So, I think, would Mr Pettifer.';
    if (n === 6 && k === 'who') return '&ldquo;Who telephone was it?&rdquo; Nearly. Who has a cousin on that tray who is better with telephones.';
    if (FITS[n] && FITS[n].indexOf(k) >= 0) return NOTTHAT[n];
    return 'Dr Rahman holds up one finger. &ldquo;Say it to yourself before you say it to her. &lsquo;' + label(k).charAt(0) + label(k).slice(1).toLowerCase() + ' ' + QS[n - 1][1] + '&rsquo; That is not a question. It is an accident.&rdquo;';
  }

  function hints() {
    if (nextFile) return ['go', ['The committee has gone to look at the corridor. Follow them: the button is at the bottom of the screen.']];
    if (!ER.flag('p-card')) return ['card', ['Dr Rahman has stopped your first question. There is a cream card with a gold edge on the table in front of you, on the right. Read it.']];
    if (!qzBox) return ['pad', ['Your pad is on the table in front of you, on the left, with the six questions that you wrote on the stairs. Click it.']];
    return ['open', [
      'Every question on your pad is a leading question: it carries its answer inside it. Find that answer first. In &ldquo;You went out to fill your water bottle, didn&rsquo;t you?&rdquo; it is everything between &ldquo;out&rdquo; and the comma.',
      'Now ask for that answer without giving it. A place wants WHERE. A moment wants WHEN. A reason wants WHY. A number of times wants HOW MANY TIMES. A thing that was done wants WHAT, and the way it was done wants HOW.',
      'Three lines on the pad are nearly the same: &ldquo;&hellip; did you leave the hall&rdquo;, &ldquo;&hellip; did you leave your board&rdquo;, &ldquo;&hellip; did you go out&rdquo;. Several cards fit each of them. Only the question that you crossed out tells you which card belongs on which line.'
    ]];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#qcard').classList.toggle('ready', !nextFile && !ER.flag('p-card'));
    $('#pad').classList.toggle('ready', !nextFile && !!ER.flag('p-card'));
    ER.pips(nextFile ? 7 : (ER.flag('p-done') || []).length, 7);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('The Mayor&rsquo;s Parlour is empty. The committee has gone to look at a corridor.'); return; }
    if (ER.flag('p-in')) { ER.say('The Mayor&rsquo;s Parlour. Maeve is waiting for your next question.'); return; }
    busy = true; ER.flag('p-in', 1);
    ER.narrate([
      'The Mayor&rsquo;s Parlour is the best room in the building, and it knows it: blue walls, a coal fire, a long table that somebody polishes, and a gilt clock that stopped in 1953.',
      'Three people sit behind the table. Dr Rahman is in the middle, with Mr Quayle and his pencil on one side of her, and Mr Loxley and his beard on the other. Mrs Hargreave has a chair by the fire. Maeve has a chair that is much too big for her.',
      '&ldquo;This is not a court,&rdquo; says Dr Rahman, &ldquo;so nobody stood up when I came in, which is a pity. Mrs Hargreave says that this player used a telephone. It is for Mrs Hargreave to show it, and Mr Pettifer is her witness. He will wait in the corridor until he is called. I want his own evidence, not his answer to somebody else&rsquo;s.&rdquo;',
      '&ldquo;It is Maeve&rsquo;s appeal, so we shall hear Maeve first. Her friend will ask her questions.&rdquo; She looks at you. You look at your pad.',
      '&ldquo;Your telephone was in the box at the Congress Desk, wasn&rsquo;t it?&rdquo; you say. &ldquo;Yes,&rdquo; says Maeve.',
      'Dr Rahman takes off her glasses. &ldquo;I have now heard YOU tell me where the telephone was. I have heard HER say one word. There is a card on the table in front of you. Read it, and then begin again.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- the room ---------- */
  $('#qcard').addEventListener('click', function () {
    if (busy) return;
    ER.read({ html: QCARD, cls: 'gilt', clue: { id: 'qcard', title: 'The Chair’s card: how we ask questions', kind: 'On the table in the Parlour' },
      done: function () { ER.flag('p-card', 1); paint(); GB.learn(['examination-in-chief', 'cross-examination', 'open question', 'leading question', 'witness']); } });
  });
  $('#pad').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Your pad. Six leading questions, crossed out, and seven open ones in pencil.'); return; }
    if (!ER.flag('p-card')) { ER.say('Your six questions. Dr Rahman is still holding her glasses in her hand. She is looking at the cream card, and then at you.'); return; }
    openPad();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  GB.thing('#rahman', null, 'Dr Rahman, in the chair. She was a doctor in Brindlow for most of her life, and she has heard a great many people explain that it was not their fault.', isBusy);
  GB.thing('#quayle', null, 'Mr Quayle writes down everything that is said, in pencil, in very small letters. He has spent the day with the Under-9s, and he has the look of a man who has been let out.', isBusy);
  GB.thing('#tloxley', null, 'Mr Loxley, of the bookstall. &ldquo;No relation,&rdquo; he said, as he sat down. &ldquo;I have checked. Twice, since half past three.&rdquo;', isBusy);
  GB.thing('#harg', null, 'Mrs Hargreave, by the fire. For the first time today, nobody is asking her to decide anything.', isBusy);
  GB.thing('#maeve', null, 'Maeve&rsquo;s feet do not reach the carpet. She has put her water bottle under the chair, where it always goes.', isBusy);
  GB.thing('#fire', null, 'A coal fire. The caretaker lights it for mayors and for the Appeals Committee, and for nobody else.', isBusy);
  GB.thing('#mclock', null, 'A gilt clock, under a glass dome. It stopped at twenty past seven in 1953, and the council has been meaning to see to it ever since.', isBusy);
  GB.thing('#portrait', null, 'Alderman Josiah Brindlow again, in a bigger frame.', isBusy);
  GB.thing('#chain', null, 'The Mayor&rsquo;s chain, in a glass case. Thirty-eight gold links: one for every mayor, until the gold ran out.', isBusy);
  GB.thing('#window', null, 'It is getting dark outside. Round five begins at a quarter to five.', isBusy);
  GB.thing('#mints', null, 'A tin of peppermints at Dr Rahman&rsquo;s right hand. EXTRA STRONG. She has not opened it yet.', isBusy);

  /* ---------- the pad ---------- */
  function openPad() {
    var box = ER.el('div', 'qz'), got = ER.flag('p-done') || [], lines = ER.flag('p-lines') || [], done = false, s = '<div class="qz-pad">';
    var NUM = ['1', '2', '3', '4', '5', '+', '6'];          /* six questions were written on the stairs; the seventh line is the one that nobody planned */
    function lineName(n) { return NUM[n - 1] === '+' ? 'The new line' : 'Line ' + NUM[n - 1]; }
    QS.forEach(function (q, i) {
      s += '<div class="qz-q' + (i === 5 ? ' hid' : '') + '" data-n="' + (i + 1) + '"><i>' + NUM[i] + '</i>' + (q[0] ? '<s>' + q[0] + '</s>' : '<s class="none">(not on your pad: you did not know that there was one)</s>') +
        '<p><span class="qz-slot"></span><span>' + q[1] + '</span></p></div>';
    });
    s += '</div><div class="qz-side"><h6>The Chair&rsquo;s place cards</h6><div class="qz-tray"></div><button type="button" class="btn" id="qz-go">Ask her</button><p class="pmsg"></p></div>';
    box.innerHTML = s;
    var tray = box.querySelector('.qz-tray'), msgEl = box.querySelector('.pmsg'), go = box.querySelector('#qz-go');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function Q(n) { return box.querySelector('.qz-q[data-n="' + n + '"]'); }
    CARDS.forEach(function (c) { var d = ER.el('div', 'qz-card dnd-item', c[1]); d.setAttribute('data-k', c[0]); tray.appendChild(d); });
    function lockIn(n, k) { var q = Q(n), card = box.querySelector('.qz-card[data-k="' + k + '"]'); q.querySelector('.qz-slot').appendChild(card); q.classList.add('ok'); card.classList.remove('dnd-item'); }
    function show() {
      got.forEach(function (k, i) { lockIn(i + 1, k); });
      if (got.length >= 5) Q(6).classList.remove('hid');
      box.setAttribute('data-q', got.length);
      go.textContent = got.length ? 'Ask her the next one' : 'Ask her';
    }
    ER.dnd(box, { item: '.qz-card.dnd-item', slot: '.qz-q:not(.ok) .qz-slot', home: tray, lock: function () { return done; }, change: function () { GB.sfx.card(); } });
    go.addEventListener('click', function () {
      var n = got.length + 1, q = Q(n), card = q.querySelector('.qz-card'), k, file, text;
      if (done) return;
      if (!card) { msg(lineName(n) + ' on your pad has no first word yet. A question cannot begin with a gap.'); return; }
      k = card.getAttribute('data-k');
      if (!ER.check('q' + n, k)) {
        GB.bump('p-tries'); GB.sfx.hm(); tray.appendChild(card);
        msg(refuse(n, k));
        return;
      }
      text = label(k).charAt(0) + label(k).slice(1).toLowerCase() + ' ' + QS[n - 1][1];
      got.push(k); ER.flag('p-done', got);
      lines.push('<p class="q">' + text + '</p><p>' + QS[n - 1][2] + '</p>'); ER.flag('p-lines', lines);
      show(); paint(); if (n === 5) GB.sfx.buzz(); else GB.sfx.pencil();          /* the telephone on the windowsill: only an echo of her answer, and nothing depends on hearing it */
      msg('<em>You</em>' + text + '<em>Maeve</em>' + QS[n - 1][2] + (QS[n - 1][3] ? '<br><br>' + QS[n - 1][3] : ''));
      if (got.length < 7) return;
      file = ER.exitOk([got.join('+')]);
      if (!file) { msg('The pencil has broken. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('p-file', file); GB.done('parlour'); go.disabled = true;
      ER.addClue('chief', 'Maeve’s evidence, in her own words', '<h4>Maeve Loxley &middot; examination-in-chief</h4>' + lines.join(''), 'said', 'Said at the table');
      setTimeout(function () {
        ER.closeAll(); GB.solved(); paint(); busy = true;
        ER.narrate([
          'Mr Loxley holds out his hand for the score sheet and reads down it with one finger. &ldquo;Knight f3, d6, d4, Bishop g4&hellip; Chair, I know this game. So does everybody who has ever opened a chess book: Paul Morphy against a duke and a count, in a box at the opera in Paris. I sell it downstairs for three pounds fifty.&rdquo;',
          '&ldquo;Players graded 1180 do not find such moves,&rdquo; he reads, from the pink slip. &ldquo;Quite right. Morphy found it. She remembered it. That is what the book is for.&rdquo;',
          '&ldquo;Then there is the matter of a black telephone with a dog on it,&rdquo; says Dr Rahman. &ldquo;Mr Quayle, be so kind as to go down and ask Miss Ferrars for her red book. I am told that it lives beside the cash box.&rdquo;',
          'Mrs Hargreave has not written anything for some time. &ldquo;I never asked her,&rdquo; she says, to the fire. &ldquo;I told her.&rdquo; &ldquo;Yes,&rdquo; says Dr Rahman, quite kindly. &ldquo;That is why there is a Rule 9.&rdquo;',
          '&ldquo;We have heard one side. Mr Pettifer has been sitting in that corridor for a quarter of an hour, and it is the corridor that I want to see. He can show us where he stood. Bring your papers.&rdquo;'
        ], function () { busy = false; });
      }, 5200);
    });
    show();
    msg(got.length ? 'Maeve is waiting for the next question. <i>Put a card at the front of ' + lineName(got.length + 1).toLowerCase() + ', and ask it.</i>'
      : 'Six leading questions, and Dr Rahman has run her pencil through every one. <b>Ask each of them again as an open question:</b> put one of her place cards at the front of the line. <i>Drag a card, or click the card and then the gap. You ask them in order, one at a time.</i>');
    qzBox = box;
    ER.open('ov-lock', box, function () { qzBox = null; });
  }
})();
</script>
</body>
</html>
