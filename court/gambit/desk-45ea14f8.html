  var GAME = [['e4', 60, 'e5', 60], ['Nf3', 60, 'd6', 59], ['d4', 59, 'Bg4', 59], ['dxe5', 59, 'Bxf3', 58], ['Qxf3', 58, 'dxe5', 57], ['Bc4', 58, 'Nf6', 56], ['Qb3', 57, 'Qe7', 55], ['Nc3', 56, 'c6', 53], ['Bg5', 55, 'b5', 51],
    ['Nxb5', 52, 'cxb5', 49], ['Bxb5+', 51, 'Nbd7', 44], ['O-O-O', 49, 'Rd8', 42], ['Rxd7', 46, 'Rxd7', 39], ['Rd1', 44, 'Qe6', 33], ['Bxd7+', 43, 'Nxd7', 31], ['Qb8+', 24, 'Nxb8', 19], ['Rd8#', 23, '', '']];
  function rows() { return GAME.map(function (g, i) { return '<tr><td>' + (i + 1) + '</td><td class="h">' + g[0] + '</td><td class="m h">' + g[1] + '</td><td class="h">' + g[2] + '</td><td class="m h">' + g[3] + '</td></tr>'; }).join(''); }
  var SHEET = '<h4>BRINDLOW JUNIOR CONGRESS &middot; SCORE SHEET &middot; TOP COPY</h4>' +
    '<div class="top"><span>Round <b>4</b> &nbsp; Board <b>1</b></span><span>Began at <b>2.00 pm</b> &nbsp; Each player <b>60</b> min</span><span>White <b>M. Loxley, 1180</b></span><span>Black <b>T. Oyelaran, 1640</b></span></div>' +
    '<table><tr><th>No.</th><th>White</th><th>min left</th><th>Black</th><th>min left</th></tr>' + rows() + '</table>' +
    '<p class="res"><span>Result <b class="pen">1 &ndash; 0</b> &nbsp; <span class="sig">M Loxley</span> &nbsp; <span class="sig">T. Oyelaran</span></span><span class="red">changed 0&ndash;1, R.7. E.H.</span></p>';
  var OUTS = [['2.06', '2.09', '9 Black'], ['2.11', '2.13', '4 White'], ['2.15', '2.19', '12 Black'], ['2.21', '2.24', '1 White'], ['2.22', '2.26', '9 Black'], ['2.27', '2.30', '6 White'], ['2.31', '2.33', '15 White'], ['2.34', '2.38', '9 Black'],
    ['2.38', '2.41', '1 White'], ['2.40', '2.44', '3 Black'], ['2.45', '2.48', '12 Black'], ['2.50', '2.55', '1 Black'], ['2.52', '2.56', '9 Black'], ['2.58', '3.01', '7 White'], ['3.00', '3.04', '4 White'], ['3.01', '3.05', '9 Black'],
    ['3.07', '3.13', '1 White'], ['3.15', '3.18', '9 Black'], ['3.16', '3.20', '12 Black'], ['3.21', '3.24', '6 White'], ['3.26', '3.29', '9 Black'], ['3.30', '3.33', '15 White']];
  function outs(a, b) { return '<table><tr><th>Out</th><th>In</th><th>Board</th></tr>' + OUTS.slice(a, b).map(function (o) { return '<tr><td>' + o[0] + '</td><td>' + o[1] + '</td><td>' + o[2] + '</td></tr>'; }).join('') + '</table>'; }
  var SIGN = '<h4>THE CORRIDOR &middot; ROUND 4 &middot; SIGN OUT AND IN</h4><h5>Rule 6. Write the time by the corridor clock, and your board. Steward: D. Pettifer.</h5>' +
    '<div class="cols">' + outs(0, 11) + outs(11, 22) + '</div><p>This sheet goes to the Congress Desk at the end of the round.</p>';
  var NOTE = '<h4>INCIDENT BOOK &middot; SUNDAY &middot; ROUND 4</h4>' +
    '<p>3.20 pm. Mr Pettifer (corridor steward) came to my desk. I wrote this as he spoke.</p>' +
    '<p>&ldquo;At about ten past three I was at the far end of the corridor, shutting the fire door. I looked back and saw the girl from board 1 by the window, near the drinking fountain. She had a telephone in her hand and she was looking down at it.</p>' +
    '<p>I was about twenty metres away, and the window was behind her. I did not see the screen. I did not see her press anything, and I did not hear her speak. She walked off towards the entrance hall. I did not see where the telephone went.&rdquo;</p>' +
    '<p>Board 1 finished two minutes ago: 1&ndash;0. I shall look at the score sheet. &nbsp;E.H.</p>';
  var PHONES = '<h4>TELEPHONES &middot; ROUND 4</h4><h5>Rule 7(a). Switched off, in an envelope, with your number on it. Sign when you take it back.</h5>' +
    '<table><tr><th>Env.</th><th>Player</th><th>In</th><th>Out</th></tr><tr><td>9</td><td>Freddie B.</td><td>1.44</td><td>3.36</td></tr><tr><td>11</td><td>Tunde Oyelaran</td><td>1.55</td><td>3.31</td></tr>' +
    '<tr><td>14</td><td>Maeve Loxley</td><td>1.50</td><td>&nbsp;</td></tr><tr><td>17</td><td>Aisha K.</td><td>1.58</td><td>3.40</td></tr><tr><td>22</td><td>Noor S.</td><td>1.41</td><td>&nbsp;</td></tr></table>' +
    '<p>Envelope 14 is in the box. It is stuck down, and it has a lump in it the size of a telephone.</p>';
  var DIAG = '<svg class="dg" viewBox="0 0 190 104"><rect x="6" y="26" width="178" height="70" rx="8" fill="#63431f"/><rect x="18" y="40" width="68" height="40" rx="4" fill="#cfd6c4"/><rect x="104" y="40" width="68" height="40" rx="4" fill="#cfd6c4"/>' +
    '<text x="52" y="69" text-anchor="middle" font-family="Oswald,sans-serif" font-weight="600" font-size="26" fill="#1c241c">41</text><text x="138" y="69" text-anchor="middle" font-family="Oswald,sans-serif" font-weight="600" font-size="26" fill="#8d9486">47</text>' +
    '<rect x="34" y="12" width="36" height="16" rx="4" fill="#8d9097"/><rect x="120" y="20" width="36" height="8" rx="4" fill="#8d9097"/>' +
    '<text x="52" y="94" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="13" fill="#f0d98f">running</text><text x="138" y="94" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="13" fill="#f0d98f">stopped</text></svg>';
  var CARD = '<h4>WHAT THE NUMBERS ON A SCORE SHEET MEAN<small>for parents, and for anybody else who is about to ask me. J.F.</small></h4>' +
    '<p>' + DIAG + 'A <b class="t">CHESS CLOCK</b> is two clocks in one box. Each player starts with 60 minutes. Your clock runs only while it is YOUR turn. When you have moved you press your button: your clock stops, and the other one starts. Only one of the two is ever running.</p>' +
    '<p>After each move, you write down the move and the minutes left on your own clock.</p>' +
    '<p>So a score sheet is a clock for the whole afternoon. Add up the minutes that have GONE from both clocks, and you have the time since the round began.</p>' +
    '<p class="ex"><b>Example</b> (not your child&rsquo;s game; the round began at 2.00). White plays her 9th move and writes 41. Black&rsquo;s last number, on the line above, is 47. Gone: 19 and 13, which makes 32. White played that move at 2.32.</p>' +
    '<p>Mind the line above. When White writes her number, Black has not written anything on that line yet.</p>';

  function hints() {
    if (nextFile) return ['go', ['The committee is waiting in the Mayor&rsquo;s Parlour, at the top of the stairs. The button is at the bottom of the screen.']];
    if (tlBox) return ['roll', [
      'Miss Ferrars&rsquo;s card has the whole method. Only one clock runs at a time, so the minutes that have gone from BOTH clocks, added together, are the minutes since two o&rsquo;clock.',
      'Try it on a line that nobody has asked you for: Black&rsquo;s move 12. Line 12 says 49 and 42. Each player began with 60, so 11 and 18 have gone. That is 29 minutes: Black played his 12th move at 2.29.',
      'A White move needs more care. When White wrote her number, Black had not yet moved on that line, so his clock still showed the number on the line ABOVE. For White&rsquo;s move 14, use her number on line 14 and Black&rsquo;s number on line 13.'
    ]];
    if (!ER.flag('d-ferrars')) return ['desk', ['The papers of round 4 are in a wire tray on the Congress Desk, and Miss Ferrars is sitting behind it. Ask her.']];
    if (!(ER.flag('d-sheet') && ER.flag('d-sign') && ER.flag('d-note') && ER.flag('d-card'))) return ['read', [
      'Miss Ferrars has laid three papers on the desk: a score sheet, a clipboard and an open book. Read all three. Then read the small white card standing at the right-hand end of the desk.',
      'The white card explains what the numbers on a score sheet mean. You will need it. The box of telephones, beside it, is worth a look as well.'
    ]];
    return ['open', ['A long strip of paper is pinned along the front of the desk: Miss Ferrars&rsquo;s till roll, with every minute of round 4 marked on it. Click it.']];
  }
  function isBusy() { return busy; }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#scene').classList.toggle('given', !!ER.flag('d-ferrars'));
    $('#roll').classList.toggle('ready', !nextFile && !!(ER.flag('d-sheet') && ER.flag('d-sign') && ER.flag('d-note') && ER.flag('d-card')));
    ER.pips(nextFile ? 1 : 0, 1);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('Four flags on the till roll. Somebody is calling Maeve&rsquo;s name from the top of the stairs.'); return; }
    if (ER.flag('d-in')) { ER.say('The entrance hall. Miss Ferrars is still stamping raffle tickets.'); return; }
    busy = true; ER.flag('d-in', 1);
    ER.narrate([
      'The entrance hall of Brindlow Town Hall has a marble floor in black and white squares, a staircase with a red carpet, and a trestle table with a green cloth on it. The table is the Congress Desk.',
      'Miss Ferrars runs the desk. She also coaches Castle Hill, which is Tunde&rsquo;s club, and that is why there is a red pin under her photograph. Nothing in Rule 9 says that she may not hand you a piece of paper.',
      'Maeve has stopped at the bookstall. She is looking at every book on it and touching none of them.'
    ], function () { busy = false; });
  }

  /* ---------- the room ---------- */
  function paper(sel, flag, html, cls, clue, words) {
    $(sel).addEventListener('click', function () {
      if (busy) return;
      ER.read({ html: html, cls: cls, clue: clue, done: function () { ER.flag(flag, 1); paint(); if (words) GB.learn(words); } });
    });
  }
  paper('#sheet', 'd-sheet', SHEET, 'sheet', { id: 'sheet', title: 'The score sheet of board 1', kind: 'Round 4: top copy' }, ['score sheet']);
  paper('#signout', 'd-sign', SIGN, 'signout', { id: 'signout', title: 'The corridor sign-out sheet', kind: 'Round 4: Mr Pettifer’s sheet' }, ['sign out', 'steward']);
  paper('#note', 'd-note', NOTE, 'inc', { id: 'note', title: 'The note made at 3.20', kind: 'Mrs Hargreave’s incident book' }, ['incident', 'record']);
  paper('#card', 'd-card', CARD, 'lam', { id: 'clockcard', title: 'Miss Ferrars’s card: the numbers on a score sheet', kind: 'On the Congress Desk' }, ['chess clock']);
  paper('#box', 'd-phones', PHONES, 'phones', { id: 'phones', title: 'The telephone list', kind: 'On the lid of the shoe box' }, null);
  $('#tray').addEventListener('click', function () { if (!busy) ER.say('A wire tray marked ROUND 4. Miss Ferrars puts her hand flat on it. &ldquo;And you are?&rdquo;'); });
  $('#ferrars').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Miss Ferrars is reading your till roll upside down. Results-desk people can do that.'); return; }
    if (ER.flag('d-ferrars')) { ER.say('&ldquo;That is every paper there is,&rdquo; says Miss Ferrars. &ldquo;The white card is mine. Read it before you ask me what the numbers mean.&rdquo;'); return; }
    ER.talk({
      who: 'Miss Ferrars', role: 'The results desk · coach of Castle Hill C.C.', face: window.FACE('ferrars'),
      lines: [
        { note: 'Miss Ferrars is stamping raffle tickets with one hand and adding up round 4 with the other.', q: 'Rule 9(c). Maeve has to see every paper before she answers.', a: 'So she does. I didn&rsquo;t write that rule, but I should have written it the same way.' },
        { note: 'She takes three things out of the wire tray and lays them on the desk in a row.', a: 'The score sheet from board 1: the top copy. Mr Pettifer&rsquo;s sheet from the corridor. And the page from Mrs Hargreave&rsquo;s incident book, which she wrote at twenty past three. That is every paper there is.' },
        { q: 'And the telephones?', a: 'In the shoe box, with the list on the lid. Look, if you like. Nobody takes an envelope out of that box without signing for it.' },
        { a: 'One more thing, so that nobody has to whisper it behind my back. Tunde is one of mine. If one of mine had been beaten by a telephone, I should want to know. I should also want it proved.</p><p class="note">She stands a small white card on the end of the desk.</p><p>If you can&rsquo;t read the numbers on a score sheet, read that. I had it made for the parents.' }
      ],
      clue: { id: 'ferrars', title: 'Miss Ferrars, at the Congress Desk', kind: 'What she said' }, last: 'Thank you',
      done: function (seen) { if (seen) { ER.flag('d-ferrars', 1); paint(); } }
    });
  });
  $('#roll').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('The till roll, with four flags on it. Miss Ferrars has not taken it down.'); return; }
    if (!ER.flag('d-ferrars')) { ER.say('A long strip of paper, pinned along the front of the desk. Somebody has ruled a hundred small lines on it: one for every minute from two o&rsquo;clock until twenty to four.'); return; }
    if (!(ER.flag('d-sheet') && ER.flag('d-sign') && ER.flag('d-note') && ER.flag('d-card'))) { ER.say('The till roll: every minute of round 4, and nothing written on it yet. You cannot fill it in until you have read all three papers, and Miss Ferrars&rsquo;s white card.'); return; }
    openRoll();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  GB.thing('#maeve', null, function () { return nextFile ? '&ldquo;I always go out when I have moved,&rdquo; says Maeve. &ldquo;I thought everybody knew that.&rdquo;' : '&ldquo;I can tell you what was on my clock at every move,&rdquo; says Maeve. &ldquo;I can&rsquo;t tell you what was on the wall. I don&rsquo;t look at the wall when I am playing.&rdquo;'; }, isBusy);
  GB.thing('#lost', null, 'A cash box, and under Miss Ferrars&rsquo;s left elbow a red book with LOST PROPERTY on the front. Nobody has asked for it.', isBusy);
  GB.thing('#stall', null, 'Mr Loxley&rsquo;s bookstall. BACK IN 20 MINUTES, OR WHEN JUSTICE HAS BEEN DONE. He has left a tin for the money, and nobody has touched that either.', isBusy);
  GB.thing('#stairs', null, 'The stairs to the Mayor&rsquo;s Parlour. The carpet is red, and the brass rods are polished every Friday.', isBusy);
  GB.thing('#doors', null, 'The front doors. Outside, the afternoon is turning orange. Maeve&rsquo;s bus home goes at ten past six.', isBusy);
  GB.thing('#floor', null, 'Black and white marble squares. It is the biggest chess board in the building, and there is a rule against playing on it.', isBusy);
  GB.thing('#clock', null, 'Three minutes to four.', isBusy);
  GB.thing('#easel', null, 'ROUND 5, at a quarter to five. If the wall chart is not put right before then, Maeve plays on board 2, for second place.', isBusy);
  GB.thing('#window', null, 'The arms of Brindlow in coloured glass: a bridge, a sheep and three bees. Nobody now alive knows why the bees.', isBusy);

  /* ---------- the till roll ---------- */
  var FLAGS = [['A', 'W14', 'White plays move 14', ''], ['B', 'B15', 'Black plays move 15', 'b'], ['C', 'W16', 'White plays move 16: the queen', ''], ['D', 'B16', 'Black plays move 16', 'b']];
  function wrongLine(f, m) {
    if (f === 'A') return ER.check('tA', m) ? '&ldquo;That is when Tunde ANSWERED move 14. I had moved six minutes before that. When I wrote 44, his last number was still the one on the line above.&rdquo;'
      : ER.check('oA', m) ? '&ldquo;You have only counted my clock. His was running too, half the time. It is both clocks together.&rdquo;'
      : '&ldquo;No. I wrote 44 when I played my 14th move. Tunde had not written anything on that line yet: his clock still said what it says on the line above. How many minutes had GONE from both?&rdquo;';
    if (f === 'B') return ER.check('tB', m) ? '&ldquo;That is when I played MY 15th move. Tunde took two more minutes to answer it.&rdquo;'
      : '&ldquo;No. When Tunde wrote his number on line 15, mine was already there beside it. Both numbers are on the same line this time, because he moved after me.&rdquo;';
    if (f === 'C') return ER.check('tC', m) ? '&ldquo;That is when he TOOK the queen. I had let go of it twelve minutes before. His 19 was not on the paper yet: he was still on the number above it.&rdquo;'
      : ER.check('oC', m) ? '&ldquo;You have only counted my clock. Tunde had used some of his by then. It is what has gone from both.&rdquo;'
      : '&ldquo;No. I wrote 24 when I let go of the queen. What did HIS clock say then? Not the number beside mine. The number on the line above.&rdquo;';
    return ER.check('tD', m) ? '&ldquo;That is when I moved. Tunde didn&rsquo;t answer for a long time. Look how much his number changed.&rdquo;'
      : '&ldquo;No. He wrote 19, and I still had 24. Same line.&rdquo;';
  }
  function openRoll() {
    var box = ER.el('div', 'tl'), pos = ER.flag('d-flags') || {}, done = false, sel = 'A', s, i;
    s = '<div class="tl-sheet"><h6>BOARD 1 &middot; ROUND 4 &middot; BEGAN AT 2.00<small>White: M. Loxley &middot; Black: T. Oyelaran &middot; 60 minutes each</small></h6><table><tr><th>No.</th><th>White</th><th>min</th><th>Black</th><th>min</th></tr>' + rows().replace(/ class="h"/g, '').replace(/class="m h"/g, 'class="m"') + '</table></div>' +
      '<div><div class="tl-roll"><div class="tl-rail"><div class="tl-base"></div>';
    for (i = 0; i <= 100; i++) s += '<i class="' + (i % 10 === 0 ? 't' : i % 5 === 0 ? 'f' : '') + '" style="left:' + i + '%"></i>' + (i % 10 === 0 ? '<s style="left:' + i + '%">' + GB.clock(i) + '</s>' : '');
    [[21, 24], [38, 41], [67, 73]].forEach(function (o) { s += '<div class="tl-out" style="left:' + o[0] + '%;width:' + (o[1] - o[0]) + '%"><em>out ' + GB.clock(o[0]) + ' &middot; in ' + GB.clock(o[1]) + '</em></div>'; });
    s += '<div class="tl-seen" style="left:70%"><em>about 3.10: &ldquo;a telephone&rdquo;</em></div>';
    FLAGS.forEach(function (f, n) { s += '<div class="tl-flag drag ' + f[3] + '" data-f="' + f[0] + '" style="left:' + (8 + n * 12) + '%"><b>' + f[1] + '</b><u></u></div>'; });
    s += '</div></div><div class="tl-key">';
    FLAGS.forEach(function (f) { s += '<div class="' + f[3] + '" data-f="' + f[0] + '"><b>' + f[1] + '</b><span>' + f[2] + '</span><u>&ndash;</u><button type="button" data-d="-1" title="A minute earlier">&#9664;</button><button type="button" data-d="1" title="A minute later">&#9654;</button></div>'; });
    s += '</div><div class="tl-foot"><p class="pmsg"></p><button type="button" class="btn" id="tl-go">Read the roll to Maeve</button></div></div>';
    box.innerHTML = s;
    var rail = box.querySelector('.tl-rail'), msgEl = box.querySelector('.pmsg');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function F(f) { return box.querySelector('.tl-flag[data-f="' + f + '"]'); }
    function K(f) { return box.querySelector('.tl-key div[data-f="' + f + '"]'); }
    function pick(f) { sel = f; FLAGS.forEach(function (x) { F(x[0]).classList.toggle('sel', x[0] === f); K(x[0]).classList.toggle('sel', x[0] === f); }); }
    function set(f, m, quiet) {
      m = Math.max(0, Math.min(100, m)); pos[f] = m;
      var n = F(f); n.classList.add('set'); n.style.left = m + '%'; n.querySelector('u').textContent = GB.clock(m); K(f).querySelector('u').textContent = GB.clock(m);
      box.setAttribute('data-' + f.toLowerCase(), m);
      if (!quiet) ER.flag('d-flags', pos);
    }
    FLAGS.forEach(function (f) {
      var n = F(f[0]);
      if (pos[f[0]] != null) set(f[0], pos[f[0]], true);
      ER.drag(n, {
        start: function () { if (done) return false; pick(f[0]); },
        move: function (ev) { var r = rail.getBoundingClientRect(); set(f[0], Math.round((ev.clientX - r.left) / r.width * 100), true); },
        end: function () { if (pos[f[0]] != null) { ER.flag('d-flags', pos); GB.sfx.flag(); } }
      });
      K(f[0]).addEventListener('click', function (e) {
        if (done) return;
        pick(f[0]);
        var d = e.target.getAttribute ? e.target.getAttribute('data-d') : null;
        if (d) { set(f[0], (pos[f[0]] == null ? 50 : pos[f[0]]) + (+d)); ER.sfx.click(); }
      });
    });
    box.querySelector('#tl-go').addEventListener('click', function () {
      var wrong = [], file;
      if (done) return;
      if (FLAGS.some(function (f) { return pos[f[0]] == null; })) { msg('Four flags, and at least one of them is still lying under the line. Stand every flag on its minute first.'); return; }
      FLAGS.forEach(function (f) { if (!ER.check('f' + f[0], pos[f[0]])) wrong.push(f[0]); });
      if (wrong.length) {
        GB.bump('d-tries'); GB.sfx.hm(); pick(wrong[0]);
        msg('Maeve looks at flag <b>' + FLAGS.filter(function (f) { return f[0] === wrong[0]; })[0][1] + '</b>. ' + wrongLine(wrong[0], pos[wrong[0]]) +
          (wrong.length > 1 ? ' <i>She looks along the roll. &ldquo;And ' + (wrong.length === 2 ? 'one more flag is' : (wrong.length - 1) + ' more flags are') + ' on the wrong minute.&rdquo;</i>' : ''));
        return;
      }
      file = ER.exitOk([FLAGS.map(function (f) { return pos[f[0]]; }).join('+')]);
      if (!file) { msg('The flags will not stand up. Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('d-file', file); GB.done('desk');
      msg('Maeve reads the four flags from left to right. <b>&ldquo;Yes,&rdquo; she says. &ldquo;That is my afternoon.&rdquo;</b>');
      GB.mine('time', 'Your time line: board 1, round 4', '<p>2.37 she plays move 14. 2.38 OUT. 2.41 IN. 2.43 Tunde answers.</p><p>2.46 Tunde plays move 15.</p><p>2.46 to 3.05: NINETEEN MINUTES at the board. No red line. She does not leave the hall.</p>' +
        '<p>3.05 MOVE 16: THE QUEEN.</p><p>3.07 OUT. About 3.10: Mr Pettifer sees a telephone. 3.13 IN.</p><p>3.17 Tunde takes the queen. 3.18 checkmate.</p><p>All three times she went out, she had just moved. It was Tunde&rsquo;s clock that was running.</p>', true);
      GB.learn(['time line']);
      setTimeout(function () {
        ER.closeAll(); GB.solved(); paint(); busy = true;
        ER.narrate([
          'With four flags on it, the till roll can be read like a page.',
          '2.46: Tunde plays his 15th move. Then nineteen minutes with nothing in them at all: no red line, no flag. She is at the board. 3.05: the queen. 3.07: she signs out. 3.10: a telephone, says Mr Pettifer. 3.17: Tunde takes the queen at last.',
          '&ldquo;You went out AFTER you gave up your queen,&rdquo; you say. Maeve looks at you as if you had told her that water is wet. &ldquo;You go when it is the other person&rsquo;s turn. Then it is his clock that is running, and not yours.&rdquo;',
          'Miss Ferrars has stopped stamping. She has read the whole roll upside down, and she says nothing at all, because she coaches Tunde. She holds out a paper clip, so that you can take the roll with you.',
          'Then, from the top of the stairs: &ldquo;LOXLEY! Appeals Committee! The Mayor&rsquo;s Parlour, please, now!&rdquo;'
        ], function () { busy = false; });
      }, 3000);
    });
    msg('The round began at 2.00. The red lines are the three times that board 1 White signed out, and the dotted line is what Mr Pettifer told the arbiter. <b>Stand each flag on the minute when that move was played:</b> drag it, or click its name and use the arrows.');
    pick('A'); tlBox = box;
    ER.open('ov-lock', box, function () { tlBox = null; });
  }
})();
</script>
</body>
</html>
