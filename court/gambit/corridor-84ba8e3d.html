  #exitsign{animation:ex 4.7s steps(1,end) infinite}

  @keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}85%{opacity:.8}100%{transform:translate(70px,90px);opacity:0}}

  /* five questions, and a rack of hooks */
  .hk{width:min(1100px,96vw);display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
  .hk-pad{position:relative;background:#eef3f6 repeating-linear-gradient(transparent 0 30px,rgba(60,110,170,.2) 30px 31px);padding:20px 24px 12px 30px;border-top:16px solid #2b2f36;box-shadow:0 22px 60px rgba(0,0,0,.6);transform:rotate(.3deg)}
  .hk-pad:before{content:'';position:absolute;left:0;right:0;top:-10px;height:8px;background:radial-gradient(circle,#c9ccd0 3px,transparent 4px) 6px 0/22px 8px repeat-x}
  .hk-q{position:relative;margin:0 0 13px;padding-left:26px}
  .hk-q>i{position:absolute;left:0;top:27px;font-style:normal;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:#6b7480}
  .hk-q s{display:block;font-family:'Caveat',cursive;font-weight:700;font-size:19px;line-height:22px;color:#1f3a8a;text-decoration:line-through;text-decoration-color:#55585f;opacity:.75}
  .hk-q p{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px;font-family:'Caveat',cursive;font-weight:700;font-size:24.5px;line-height:38px;color:#3a3f4a}
  .hk-slot{flex:none;min-width:132px;height:36px;border:1.500px dashed #7a8696;border-radius:3px;display:grid;place-items:center;background:rgba(255,255,255,.5)}
  .hk.done .hk-slot{border:0;background:none}
  .hk-tile{position:relative;padding:4px 12px 3px 24px;background:#fbf9ef;border:1.500px solid #8d8873;box-shadow:0 3px 7px rgba(0,0,0,.35);font-family:'Caveat',cursive;font-weight:700;font-size:23px;line-height:1.15;color:#2f6243;white-space:nowrap}
  .hk-tile:before{content:'';position:absolute;left:7px;top:50%;width:9px;height:14px;margin-top:-9px;border:2.500px solid #8d9097;border-top:0;border-right:0;border-radius:0 0 0 9px}
  .hk-side h6{margin:0 0 8px;font-family:'Oswald',sans-serif;font-weight:400;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#e6cf9c}
  .hk-rack{display:flex;flex-wrap:wrap;gap:9px;min-height:150px;align-content:flex-start;padding:12px;background:rgba(14,10,4,.72);border:1px dashed rgba(240,182,74,.5)}
  .hk .pmsg{margin-top:12px;min-height:150px;font-size:18px}
  .hk .btn{margin-top:10px;width:100%}
</style>
