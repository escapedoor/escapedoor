  .juror{animation:jur 7s steps(1,end) infinite}
  .juror.j2{animation-delay:-2.5s}.juror.j3{animation-delay:-4.7s}
  @keyframes jur{0%{transform:translate(0,0)}86%{transform:translate(0,2px)}94%{transform:translate(0,0)}}

  /* her own words: the officer's notebook, a line at a time */
  .rs{width:min(1120px,96vw);display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
  .rs-rows{display:grid;gap:8px}
  .rs-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:10px;align-items:stretch}
  .rs-pnb{padding:6px 12px 5px 30px;position:relative;background:#fbfbf6 repeating-linear-gradient(transparent 0 25px,rgba(70,100,150,.2) 25px 26px);font-family:'Caveat',cursive;font-weight:700;font-size:19px;line-height:1.3;color:#1d2a52;border-left:4px solid #1c1c22}
  .rs-pnb:before{content:attr(data-n);position:absolute;left:8px;top:7px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;color:#8d9097}
  .rs-opts{display:grid;gap:4px}
  .rs-opts button{text-align:left;padding:3px 10px 3px 28px;position:relative;background:#fdfbf2;border:1px solid #c9c4b4;color:#1c1d22;font-family:'Tinos',serif;font-size:14.500px;line-height:1.25;border-radius:2px}
  .rs-opts button:before{content:'';position:absolute;left:9px;top:7px;width:10px;height:10px;border-radius:50%;border:2px solid #5b3f86}
  .rs-opts button.on{background:#efe7f8;border-color:#5b3f86}
  .rs-opts button.on:before{background:#5b3f86}
  .rs .btn{width:100%;margin-bottom:10px}
  .rs .pmsg{min-height:170px;font-size:17.500px}
  .rs h6{margin:0 0 8px;font-family:'Oswald',sans-serif;font-weight:400;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#e6d3a6}
</style>

<script>
(function () {
  var $ = ER.$, busy = false, nextFile = null, rsBox = null, TOTAL = 6;

  /* panels, ceiling lights, and twelve jurors in two rows */
  (function () {
    var s = '', i, x;
    for (i = -8; i < 26; i++) s += '<path d="M' + (i * 90) + ' 44V600"/>';
    $('#panels').innerHTML = s; s = '';
    for (i = -4; i < 12; i++) s += '<rect x="' + (i * 190 + 60) + '" y="-30" width="90" height="40" fill="#fffbe8" opacity=".85"/>';
    $('#lights').innerHTML = s; s = '';
    var HAIR = ['#2a1c16', '#7a4a2a', '#17120f', '#b5672c', '#9a9a96', '#d9b25a'], SKIN = ['#e8c2a2', '#c99870', '#855a40', '#f1cfb2', '#b98560', '#d6a47a'], TOP = ['#2f6a8a', '#7b1f2a', '#3f7d55', '#55585f', '#8f5a9a', '#c9a24a'];
    for (i = 0; i < 12; i++) {
      var back = i < 6, k = i % 6; x = 1196 + k * 72 + (back ? 0 : 18);
      var y = back ? 410 : 470, r = back ? 18 : 21;
      s += '<g class="juror' + (i % 3 ? ' j' + (i % 3 + 1) : '') + '"><path d="M' + (x - r - 8) + ' ' + (y + 52) + 'q0-' + (r + 22) + ' ' + (r + 8) + '-' + (r + 22) + 't' + (r + 8) + ' ' + (r + 22) + 'z" fill="' + TOP[(i * 5) % 6] + '"/><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + SKIN[(i * 7) % 6] + '"/><path d="M' + (x - r) + ' ' + (y - 2) + 'q0-' + (r + 4) + ' ' + r + '-' + (r + 4) + 't' + r + ' ' + (r + 4) + 'q-' + r + '-' + (r - 6) + '-' + (2 * r) + ' 0z" fill="' + HAIR[(i * 11) % 6] + '"/></g>';
    }
    $('#jurors').innerHTML = s;
  })();

  ER.init({
    theme: 'court', story: 'violin', storyTitle: 'So That You Are Sure', id: 'court', no: 'IV', title: 'Court 2',
    go: 'All rise',
    intro: [
      'At Andreou&rsquo;s you took two pens to Mrs Askew&rsquo;s statement. Green for what she knew herself: the alarm, a man walking away with a case, the rain, a busker who plays under her window. Pink for what somebody told her. Every pink line pointed at Ezra: the busker &ldquo;hanging about&rdquo;, the busker who &ldquo;wanted that violin&rdquo;, and his name.',
      'Then Mr Andreou told you what he really said: &ldquo;a busker&rdquo;, a lad with a guitar. On its way up the stairs it became &ldquo;the busker&rdquo;.',
      'Two o&rsquo;clock. Juror number eight has arrived, out of breath. Mrs Askew is back in the witness box, and Miss Blackwood is about to cross-examine her.'
    ],
    exit: {"next":"jury","w":{"c5fd94e7":"aca46ed7","1cfc9643":"76e07df6","394133a8":"b486d0c3","05eb3216":"291f29fd"}}, tags: {"cx":["c35b6fee","71376b5b","cfed9fcc","ea1f0082","5fc212b5","fbed445d","c5fe7d59","ae96527e"],"r1":["1925f822"],"r2":["afb16b76"],"r3":["64f1810d"],"r4":["176f30f5"],"r5":["c20a8b53"]},
    hints: hints, onBegin: begin
  });
  nextFile = ER.flag('k-file') || null;

  var RSNOTE = '<h4>Reported speech</h4>' +
    '<p>A police officer writes down what a witness says in <b class="t">REPORTED SPEECH</b>: not her words, but his report of them.</p>' +
    '<p>&ldquo;I can&rsquo;t see his face,&rdquo; she says. &rarr; She said that she couldn&rsquo;t see his face.</p>' +
    '<p>When we report, the verb usually moves one step back in time (can &rarr; could, is &rarr; was, saw &rarr; had seen, will &rarr; would), and the people and places change to fit the reporter: I &rarr; she, my &rarr; her, here &rarr; there, tonight &rarr; that night.</p>' +
    '<p>To get her own words back, go the other way: one step forward, and turn the people round again. &ldquo;She said that she had seen him&rdquo; &rarr; &ldquo;I saw him.&rdquo;</p>' +
    '<p>Words inside quotation marks in a notebook are her exact words. Leave them alone.</p>' +
    '<p>In court I put a witness&rsquo;s own words back to her. People know their own words.</p><p class="ib">I.B.</p>';
  var PNB = '<h4>PC 2291 O. SHERIDAN &middot; THURSDAY 14 MAY 2026</h4>' +
    '<p><span class="tm">23.20</span>Flat 1, 9 Cutler&rsquo;s Row. Spoke to Mrs Gwendolen ASKEW.</p>' +
    '<p>She said that she had heard the alarm at about twenty to eleven and had gone to her window.</p>' +
    '<p>She said that she had not seen his face, because he had his back to her.</p>' +
    '<p>She said that he was &lsquo;about your height&rsquo;. (I am 1.88 m.)</p>' +
    '<p>She said that it might have been the busker who played under her window.</p>' +
    '<p><span class="tm">23.35</span>I showed Mrs Askew a photograph of Ezra MALLON from the council&rsquo;s busking permits. She said, &lsquo;That&rsquo;s him. I&rsquo;m sure now.&rsquo;</p>' +
    '<p style="text-align:right">O. Sheridan</p>';
  var RS = [
    ['She said that she had heard the alarm at about twenty to eleven and had gone to her window.', [['a', 'She heard the alarm at about twenty to eleven and went to her window.'], ['b', 'I heard the alarm at about twenty to eleven and went to my window.'], ['c', 'I had heard the alarm at about twenty to eleven and had gone to her window.']]],
    ['She said that she had not seen his face, because he had his back to her.', [['a', 'I had not seen her face, because she had her back to me.'], ['b', 'She didn&rsquo;t see his face, because he had his back to her.'], ['c', 'I didn&rsquo;t see his face, because he had his back to me.']]],
    ['She said that he was &lsquo;about your height&rsquo;. (I am 1.88 m.)', [['a', 'He was about your height.'], ['b', 'He was about my height.'], ['c', 'He is about her height.']]],
    ['She said that it might have been the busker who played under her window.', [['a', 'It must have been the busker who plays under my window.'], ['b', 'It was the busker who played under her window.'], ['c', 'It might have been the busker who plays under my window.']]],
    ['23.35 &middot; She said, &lsquo;That&rsquo;s him. I&rsquo;m sure now.&rsquo;', [['a', 'That was him. I was sure then.'], ['b', 'That&rsquo;s him. I&rsquo;m sure now.'], ['c', 'It might be him. I&rsquo;m not sure.']]]];
  var RSWHY = {
    1: { a: 'That is still the officer, talking about her. In the witness box she will say &lsquo;I&rsquo;, not &lsquo;she&rsquo;.', c: 'Turn the people round: to her, it was MY window. And one step forward in time: &lsquo;had heard&rsquo; becomes &lsquo;heard&rsquo;.' },
    2: { a: 'Whose face, and whose back? It was his face, and it was her that he had his back to.', b: 'Still the officer&rsquo;s voice. Give me hers: I, me, my.' },
    3: { b: 'Look at the quotation marks. Those are her exact words, and she said them to the officer. Whose height did she mean?', c: 'Quotation marks mean her exact words. Leave them as they are.' },
    4: { a: 'Might is not must. She was guessing, and she said so. On this whole page, nothing matters more than that one word.', b: 'She did not say that it WAS the busker. Read the verb again.' },
    5: { a: 'Quotation marks again. The officer wrote down exactly what she said. Do not move it.', c: 'That is the opposite of what she said.' }
  };

  function hints() {
    if (nextFile) return ['go', ['The court has risen for the day. The button at the bottom of the screen takes you to the next afternoon.']];
    if (rsBox) return ['words', [
      'Read Miss Blackwood&rsquo;s note on reported speech: it is in your notebook. For each line, choose the sentence that Mrs Askew herself said to the officer.',
      'Turn the people round (she &rarr; I, her &rarr; my) and move the verb one step forward (had seen &rarr; saw). But a word like &ldquo;might&rdquo; does not move, and words in quotation marks are left exactly as they are.',
      'In the third line, &lsquo;about your height&rsquo; is in quotation marks: she was speaking to the officer, and &ldquo;your&rdquo; means him. The last line is in quotation marks too.'
    ]];
    if (!ER.flag('k-ib')) return ['ib', ['Miss Blackwood has turned round in her seat to speak to you. Click her.']];
    if (!ER.flag('k-words')) return ['pnb', ['The copy of PC Sheridan&rsquo;s notebook is on the desk in front of you. Click it.']];
    if (!CX.isOpen()) return ['start', ['Miss Blackwood is waiting for your notes. Click her, and the cross-examination begins.']];
    for (var i = 0; i < TARGET.length; i++) if (!has(TARGET[i][0])) return ['t-' + TARGET[i][0], TARGET[i][1]];
    return null;
  }
  function isBusy() { return busy; }
  function wonList() { return (ER.flag('cx-k') || {}).won || []; }
  function has(card) { return wonList().some(function (p) { return p.split('>')[0] === card; }); }
  function paint() {
    $('#go').classList.toggle('on', !!nextFile);
    $('#pnb').classList.toggle('ready', !nextFile && !!ER.flag('k-ib') && !ER.flag('k-words'));
    $('#ib').classList.toggle('ready', !nextFile && (!ER.flag('k-ib') || !!ER.flag('k-words')) && !busy);
    ER.pips(nextFile ? TOTAL : wonList().length, TOTAL);
  }
  function begin() {
    paint();
    if (nextFile) { ER.say('Court 2 is empty. The usher is collecting the water glasses.'); return; }
    if (ER.flag('k-in')) { ER.say('Court 2. Mrs Askew is in the witness box, waiting.'); return; }
    busy = true; ER.flag('k-in', 1);
    ER.narrate([
      '&ldquo;All rise.&rdquo; Everybody in Court 2 stands, and Her Honour Judge Lennox comes in through the door behind the bench, in a short wig and a violet robe. She bows to the court, the court bows back, and everybody sits.',
      'The usher brings in the jury: twelve people in two rows, with notebooks on their knees. Ezra is in the dock behind you, behind glass, with Mrs Hindle beside him.',
      '&ldquo;Mrs Askew,&rdquo; says the judge, &ldquo;you are still on the oath that you took yesterday. Miss Blackwood is now going to ask you some questions for Mr Mallon.&rdquo; Mrs Askew grips the edge of the witness box and nods.',
      'Miss Blackwood stands. Then, before she says a word, she turns round to you, behind her, and holds out her hand for a note.'
    ], function () { busy = false; paint(); });
  }

  /* ---------- the room ---------- */
  $('#ib').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Miss Blackwood is taking off her wig, very carefully, as if it might break. &ldquo;Tomorrow,&rdquo; she says. &ldquo;Speeches, and the summing up. And then twelve people go into a room.&rdquo;'); return; }
    if (ER.flag('k-words')) { openCx(); return; }
    if (ER.flag('k-ib')) { ER.say('&ldquo;The notebook,&rdquo; whispers Miss Blackwood. &ldquo;Her words, not his. Quickly, please: the judge is looking at me.&rdquo;'); return; }
    ER.talk({
      who: 'Miss Blackwood', role: 'Counsel for the defence · on her feet', face: window.FACE('blackwood'),
      lines: [
        { note: 'She whispers, with her back to the judge.', a: 'The officer&rsquo;s notebook. When I put to her what she said that night, I want to put her own words, not his. People know their own words.' },
        { a: 'He wrote everything in reported speech. Turn it back for me. Here: how it works.', note: 'She drops a folded sheet on the desk in front of you, and turns back to the court. &ldquo;Your Honour, a moment.&rdquo; &ldquo;Take your time, Miss Blackwood.&rdquo;' }
      ],
      clue: { id: 'ib4', title: 'Miss Blackwood, on her feet', kind: 'What she whispered' }, last: 'Read it',
      done: function (seen) {
        if (!seen) return;
        ER.read({ html: RSNOTE, cls: 'cn', clue: { id: 'rsnote', title: 'Miss Blackwood’s notes: reported speech', kind: 'Folded, passed back' },
          done: function () {
            ER.flag('k-ib', 1); paint(); VN.learn(['reported speech', 'cross-examine']);
            ER.addClue('pnb', 'PC Sheridan’s notebook, 14 May', PNB, 'pnb', 'Prosecution bundle', true);
          } });
      }
    });
  });
  $('#pnb').addEventListener('click', function () {
