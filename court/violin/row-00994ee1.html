  ER.init({
    theme: 'court', story: 'violin', storyTitle: 'So That You Are Sure', id: 'row', no: 'II', title: 'Cutler’s Row',
    go: 'Walk to Cutler’s Row',
    intro: [
      'In the cells you put five things on a strip of paper. Three of them were strong: Mr Andreou, who is no friend of Ezra&rsquo;s; the bank&rsquo;s computer; and a barman who had never met him. All three were too early. At 10.39, the only thing on the strip was Ezra&rsquo;s own word: weak, but not false.',
      'Miss Blackwood decided not to lean on the alibi at all. Ezra does not have to prove where he was. The Crown has to prove where he was.',

    ],
    exit: {"next":"cafe","w":{"7cc24bfe":"ad6cbb11"}}, tags: {"sc":["70a7a898"],"mk":["fe973718"],"vw":["d06e12f8"],"lt":["be67f6e4"],"tm":["54d90d69"]},
    hints: hints, onBegin: begin

  nextFile = ER.flag('r-file') || null;

  var DIRS = '<h4>Draft directions to the jury &middot; R v Mallon</h4><h5>Her Honour Judge Lennox &middot; sent to counsel on Monday evening &middot; part 4 of 7</h5>' +
    '<p><b>4. Identification</b></p>' +
    '<p><span class="n">4.1</span>The case against Mr Mallon depends on Mrs Askew&rsquo;s <b class="t">IDENTIFICATION</b> of him, and the defence say that she is mistaken. You must take special care before you rely on it. An honest witness can be mistaken, and a mistaken witness can be a convincing one. She may be quite sure, and still be wrong.</p>' +
    '<p><span class="n">4.2</span>Look closely at what she could see. How far away was she? What was the light like? How long did she watch? Was anything in the way? Did she see his face? Had she seen him before, and how?</p>' +
    '<p><span class="n">4.3</span>What did she say at the time? Compare it with what she says now.</p>' +
    '<p><span class="n">4.4</span>Before she named Mr Mallon, she was shown one photograph of him. A witness should be shown a line-up of people who look alike, never a single photograph. A single photograph can take the place of what she really saw.</p>';
  var LAMPS = '<h4>Street lighting &middot; Cutler&rsquo;s Row</h4><h5>Wyncaster City Council &middot; report a fault &middot; history of each lamp column</h5><table>' +

    '<tr><td>CR-05</td><td>outside No. 9 (Andreou&rsquo;s)</td><td>none this year</td><td>&nbsp;</td></tr>' +
    '<tr class="hl"><td>CR-07</td><td>outside No. 14</td><td>Saturday 9 May 2026: &ldquo;lamp out&rdquo;</td><td>Thursday 21 May 2026: lantern replaced</td></tr>' +
    '<tr><td>CR-09</td><td>at the top of Wherry Steps</td><td>none this year</td><td>&nbsp;</td></tr></table>' +
    '<p>Every lamp column has its number on a small plate, so that a fault can be reported.</p>';

  function hints() {
    if (nextFile) return ['go', ['Lunch. Andreou&rsquo;s caf&eacute; is under Mrs Askew&rsquo;s window. The button is at the bottom of the screen.']];
    if (plBox) return ['plan', [
      'The street has changed since May. Photograph 2 in your notebook shows what stood in front of one of the houses. Drag the scaffolding on the plan to that house first.',
      'Now click the small marks along his way, starting at the door of No. 14. The string from her window turns red where something is in the way. Stop at the first place where it stays green. Then read the 999 call again for his face or his back, and the council&rsquo;s page for the lamp.',
      'The marks are a metre and a half apart, and a man walking briskly covers about a metre and a half in a second. Count the marks from the first green one to the corner of Wherry Steps, and you have the seconds.'
    ]];
    if (!ER.flag('r-dirs')) return ['ib', ['Miss Blackwood is on the pavement on the right, with two coffees. Talk to her.']];
    if (!ER.flag('r-lamps')) return ['lamp', ['Her Honour&rsquo;s list asks what the light was like. There is a lamp column outside No. 14, with a small plate on it. Click the lamp.', 'The plate has a number, and the council keeps the history of every number.']];

    busy = true; ER.flag('r-in', 1);
    ER.narrate([
      'Cutler&rsquo;s Row is a narrow lane of old shops between the market and the river. Nobody drives down it. At eleven in the morning it smells of coffee and wet stone.',
      'Under the first-floor window of Flat 1, number 9, there is a treble clef in chalk on the paving, nearly washed away, and the word EZRA. Nobody has played here since May.',
      'You have walked the lane with the measuring wheel, twice, and drawn a plan on your clipboard: the café and Mrs Askew&rsquo;s window, the shops across the way, the lamps, and the corner where Wherry Steps go down to the river. You have not gone up to the flat. Nobody on your side goes near Mrs Askew while she is in the middle of her evidence.',

    ], function () { busy = false; paint(); });

    if (nextFile) { ER.say('Your plan, with a scaffold drawn in front of No. 12 and a green string to the front of No. 16. It is in your notebook too.'); return; }
    if (!ER.flag('r-dirs')) { ER.say('Your plan of the street. Miss Blackwood is waiting for you on the pavement, with coffee.'); return; }
    if (!ER.flag('r-lamps')) { ER.say('&ldquo;What was the light like?&rdquo; says Miss Blackwood. &ldquo;That is on the list. Look at the lamp outside No. 14 before you draw anything.&rdquo;'); return; }
    openPlan();
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  VN.thing('#window', null, 'Flat 1, above the café. Lace curtains, three red geraniums, and the top of a music stand behind the glass. From down here it looks very close.', isBusy);
  VN.thing('#cafe', null, 'Andreou&rsquo;s. The door is propped open, and somebody inside is arguing with a coffee machine.', isBusy);
  VN.thing('#pitch', null, 'A treble clef and EZRA, in chalk, nearly washed away. This is where he played every day for two years, right under Mrs Askew&rsquo;s window.', isBusy);
  VN.thing('#cr05', null, 'Lamp CR-05, outside the café, right under her window. At night it shines straight up at the glass.', isBusy);
  VN.thing('#cr09', null, 'Lamp CR-09, at the top of Wherry Steps. Anybody walking towards it at night is a dark shape against the light.', isBusy);
  VN.thing('#no12', null, 'No. 12 has a new front door and fresh paint. On the paving in front of it there are small square marks, in a row, where something heavy once stood.', isBusy);
  VN.thing('#shop', null, 'Gilchrist &amp; Co., violin dealers. The cabinet in the window is empty, and a card says BY APPOINTMENT.', isBusy);
  VN.thing('#steps', null, 'At the end of the lane, Wherry Steps turn the corner and drop down to the river. From the corner, nobody on Cutler&rsquo;s Row can see you.', isBusy);
  VN.thing('#wheel', 'measuring wheel', 'Push it along the ground and it counts the metres. It still says 36 from your last walk.', isBusy);
  VN.thing('#south', null, 'No. 10, a dentist. The dentist has been watching you measure the street, with some interest.', isBusy);

  /* ---------- the plan ---------- */
  /* metres on the ground -> points on the plan. Her window is at (-12, 0), on the north side, 4.5 m up. The south side is at y = 8. */
  function PX(m) { return 40 + (m + 16) * 17; }
  function PY(m) { return 40 + (m + 4) * 17; }
  var WIN = [-12, 0], UP = 4.5, ROUTE_Y = 7.2, NET = [6.0, 8.0];
  var HOUSES = [['10', -2, 10], ['12', 10, 17], ['14', 17, 22], ['16', 22, 28.5]];
  var TICKS = [20, 21.5, 23, 24.5, 26, 27.5, 29, 30.5];
  var CH = { vw: [['face', 'his face'], ['back', 'his back']], lt: [['lit', 'lit'], ['out', 'out']], tm: [['5', 'about 5 seconds'], ['20', 'about 20 seconds'], ['60', 'about a minute']] };
  function blocked(px, net) {
    if (!net) return false;
    var h = HOUSES.filter(function (x) { return x[0] === net; })[0], xa = WIN[0] + (px - WIN[0]) * (NET[0] / ROUTE_Y);
    return Math.max(xa, h[1]) <= Math.min(px, h[2]);
  }
  function dist(px) { return Math.sqrt(Math.pow(px - WIN[0], 2) + ROUTE_Y * ROUTE_Y + UP * UP); }
  function planSvg(net, tick, live) {
    var s = '<svg viewBox="0 0 930 330" class="pl-svg">', i;
    s += '<rect x="0" y="0" width="930" height="330" fill="#f4f1e6"/>';
    s += '<rect x="0" y="' + PY(-4) + '" width="930" height="' + (PY(0) - PY(-4)) + '" fill="#d9cfb8"/><rect x="0" y="' + PY(8) + '" width="930" height="' + (PY(12) - PY(8)) + '" fill="#d9cfb8"/>';
    s += '<rect x="' + PX(28.5) + '" y="' + PY(8) + '" width="' + (PX(33) - PX(28.5)) + '" height="' + (PY(12) - PY(8)) + '" fill="#f4f1e6"/>';
    s += '<g stroke="#8a7a66" stroke-width="2" fill="none"><path d="M0 ' + PY(0) + 'H930M0 ' + PY(8) + 'H' + PX(28.5) + 'M' + PX(33) + ' ' + PY(8) + 'H930"/>';
    [-6, 2, 10, 18, 26].forEach(function (x) { s += '<path d="M' + PX(x) + ' ' + PY(-4) + 'V' + PY(0) + '"/>'; });
    HOUSES.forEach(function (h) { s += '<path d="M' + PX(h[1]) + ' ' + PY(8) + 'V' + PY(12) + '"/>'; });
    s += '<path d="M' + PX(28.5) + ' ' + PY(8) + 'V' + PY(12) + 'M' + PX(33) + ' ' + PY(8) + 'V' + PY(12) + '"/></g>';
    s += '<g font-family="Oswald" font-size="12" fill="#5a4a38" text-anchor="middle">';
    s += '<text x="' + PX(-11) + '" y="' + PY(-2.6) + '">No. 9 &middot; ANDREOU&rsquo;S</text><text x="' + PX(-11) + '" y="' + (PY(-2.6) + 14) + '" font-size="10.500">Mrs Askew&rsquo;s flat above</text>';
    HOUSES.forEach(function (h) { s += '<text x="' + ((PX(h[1]) + PX(h[2])) / 2) + '" y="' + PY(10.4) + '">No. ' + h[0] + (h[0] === '14' ? ' &middot; GILCHRIST' : '') + '</text>'; });
    s += '<text x="' + ((PX(28.5) + PX(33)) / 2) + '" y="' + PY(10) + '" font-size="10">WHERRY</text><text x="' + ((PX(28.5) + PX(33)) / 2) + '" y="' + (PY(10) + 12) + '" font-size="10">STEPS</text>';
    s += '<text x="' + PX(9) + '" y="' + PY(4.3) + '" font-size="15" fill="#8a7a66" letter-spacing="8">CUTLER&rsquo;S ROW</text>';
    s += '<text x="' + PX(-14.5) + '" y="' + PY(4.3) + '" font-size="10" fill="#8a7a66">&larr; market</text><text x="' + PX(33.3) + '" y="' + PY(4.3) + '" font-size="10" fill="#8a7a66">river &rarr;</text></g>';
    [[-14.5, 0.6, 'CR-05'], [19, 7.6, 'CR-07'], [31.6, 7.6, 'CR-09']].forEach(function (l) { s += '<circle cx="' + PX(l[0]) + '" cy="' + PY(l[1]) + '" r="5" fill="#fff" stroke="#2b2f36" stroke-width="2"/><text x="' + PX(l[0]) + '" y="' + (PY(l[1]) + (l[1] < 4 ? 17 : -9)) + '" font-family="Oswald" font-size="10" fill="#2b2f36" text-anchor="middle">' + l[2] + '</text>'; });
    s += '<rect x="' + (PX(20) - 9) + '" y="' + (PY(8) - 2) + '" width="18" height="5" fill="#b3262c"/><text x="' + PX(20) + '" y="' + (PY(8) + 14) + '" font-family="Oswald" font-size="9.500" fill="#b3262c" text-anchor="middle">door</text>';
    /* the route he took, a mark every metre and a half */
    s += '<path d="M' + PX(20) + ' ' + PY(ROUTE_Y) + 'H' + PX(30.5) + 'V' + PY(11.6) + '" stroke="#8d9097" stroke-width="2" stroke-dasharray="6 5" fill="none"/>';
    if (net) { var h = HOUSES.filter(function (x) { return x[0] === net; })[0]; s += '<g class="scaf"><rect x="' + PX(h[1]) + '" y="' + PY(NET[0]) + '" width="' + (PX(h[2]) - PX(h[1])) + '" height="' + (PY(NET[1]) - PY(NET[0])) + '" fill="#5f8a5a" opacity=".85"/><path d="M' + PX(h[1]) + ' ' + PY(NET[0]) + 'l' + (PX(h[2]) - PX(h[1])) + ' ' + (PY(NET[1]) - PY(NET[0])) + '" stroke="#3a5a36" stroke-width="2"/><text x="' + ((PX(h[1]) + PX(h[2])) / 2) + '" y="' + (PY(NET[0]) + 22) + '" font-family="Oswald" font-size="11" fill="#fff" text-anchor="middle">NETTING</text></g>'; }
    if (live) {
      s += '<g id="pl-houses">';
      HOUSES.forEach(function (h) { s += '<rect class="house" data-h="' + h[0] + '" x="' + PX(h[1]) + '" y="' + (PY(NET[0]) - 4) + '" width="' + (PX(h[2]) - PX(h[1])) + '" height="' + (PY(12) - PY(NET[0]) + 4) + '" fill="#000" opacity="0"/>'; });
      s += '</g>';
    }
    if (tick != null) {
      var px = TICKS[tick], bl = blocked(px, net);
      s += '<path d="M' + PX(WIN[0]) + ' ' + PY(WIN[1]) + 'L' + PX(px) + ' ' + PY(ROUTE_Y) + '" stroke="' + (bl ? '#b3262c' : '#2f7a4a') + '" stroke-width="3"' + (bl ? ' stroke-dasharray="8 5"' : '') + '/>';
    }
    TICKS.forEach(function (x, j) { s += '<g class="tick" data-t="' + j + '"><circle cx="' + PX(x) + '" cy="' + PY(ROUTE_Y) + '" r="' + (j === tick ? 8 : 5.5) + '" fill="' + (j === tick ? '#22408a' : '#fff') + '" stroke="#22408a" stroke-width="2"/><circle cx="' + PX(x) + '" cy="' + PY(ROUTE_Y) + '" r="13" fill="#000" opacity="0"/></g>'; });
    s += '<circle cx="' + PX(WIN[0]) + '" cy="' + PY(WIN[1]) + '" r="8" fill="#22408a"/><text x="' + (PX(WIN[0]) + 12) + '" y="' + (PY(WIN[1]) + 18) + '" font-family="Caveat" font-weight="700" font-size="17" fill="#22408a">her window (4.5 m up)</text>';
    if (live) {
      if (!net) s +='<g class="scaf" id="pl-scaf"><rect x="770" y="252" width="110" height="34" fill="#5f8a5a" opacity=".9"/><path d="M770 252l110 34" stroke="#3a5a36" stroke-width="2"/><text x="825" y="274" font-family="Oswald" font-size="11" fill="#fff" text-anchor="middle">SCAFFOLD</text></g>';
    }
    return s + '</svg>';
  }
  function openPlan() {
    var box = ER.el('div', 'pl'), sv = ER.flag('r-plan') || {}, done = false;
    var st = { net: sv.net || null, tick: sv.tick == null ? null : sv.tick, vw: sv.vw || '', lt: sv.lt || '', tm: sv.tm || '' };
    box.innerHTML = '<div class="pl-map"><h4>Cutler&rsquo;s Row, measured with the wheel</h4><div class="pl-draw"></div><small>The green block is the scaffolding: drag it to a house, or click it and then the house (to move it, click another house). Then click the marks along his way: a string runs from her window to the mark, red where something is in the way. Marks are 1.5 m apart.</small></div>' +
      '<div class="pl-side"><div class="pl-card"><h5>What could she see? &nbsp;(4.2)</h5>' +
      '<div class="pl-row"><b>Was anything in the way?</b><span id="pl-net"></span></div>' +
      '<div class="pl-row"><b>The first place she could see him</b><span id="pl-at"></span></div>' +
      '<div class="pl-row" data-r="vw"><b>His face, or his back?</b><div class="pl-ch"></div></div>' +
      '<div class="pl-row" data-r="lt"><b>The lamp outside No. 14 (CR-07)</b><div class="pl-ch"></div></div>' +
      '<div class="pl-row" data-r="tm"><b>How long could she see him?</b><div class="pl-ch"></div><i class="walk">A man walking briskly covers about 1.5 metres in a second.</i></div></div>' +
      '<button type="button" class="btn" id="pl-go">Show Miss Blackwood</button><p class="pmsg"></p></div>';
    var draw = box.querySelector('.pl-draw'), msgEl = box.querySelector('.pmsg'), holding = false;
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function keep() { ER.flag('r-plan', st); box.setAttribute('data-net', st.net || ''); box.setAttribute('data-tick', st.tick == null ? '' : st.tick); }
    function card() {
      box.querySelector('#pl-net').textContent = st.net ? 'scaffolding and netting in front of No. ' + st.net : 'nothing drawn yet';
      box.querySelector('#pl-at').textContent = st.tick == null ? 'no mark chosen' : 'mark ' + (st.tick + 1) + ': ' + Math.round(dist(TICKS[st.tick])) + ' m from her window' + (blocked(TICKS[st.tick], st.net) ? ' (but the string is red)' : '');
      ['vw', 'lt', 'tm'].forEach(function (r) { ER.$$('[data-r="' + r + '"] button', box).forEach(function (b) { b.classList.toggle('on', st[r] === b.getAttribute('data-v')); }); });
    }
    function paintMap() {
      draw.innerHTML = planSvg(st.net, st.tick, !done);
      ER.$$('.tick', draw).forEach(function (t) { t.addEventListener('click', function () { if (done) return; st.tick = +t.getAttribute('data-t'); VN.sfx.string(); keep(); card(); paintMap(); }); });
      var sc = draw.querySelector('#pl-scaf'), svg = draw.querySelector('svg');
      ER.$$('.house', draw).forEach(function (h) { h.addEventListener('click', function () { if (done || (!holding && !st.net)) return; place(h.getAttribute('data-h')); }); });
      if (sc) {
        sc.addEventListener('click', function (e) { e.stopPropagation(); holding = !holding; sc.setAttribute('opacity', holding ? '.6' : '1'); });
        ER.drag(sc, {
          start: function () { return !done; },
          move: function (e, moved) { if (!moved) return; var p = ER.pt(svg, e); sc.setAttribute('transform', 'translate(' + (p.x - 825) + ' ' + (p.y - 269) + ')'); },
          end: function (e, moved) {
            if (!moved) return;
            var p = ER.pt(svg, e), m = (p.x - 40) / 17 - 16, hit = HOUSES.filter(function (h) { return m >= h[1] && m <= h[2]; })[0];
            if (hit && p.y > PY(4) && p.y < PY(12.5)) place(hit[0]); else sc.removeAttribute('transform');
          }
        });
      }
    }
    function place(h) { st.net = h; holding = false; VN.sfx.card(); keep(); card(); paintMap(); }
    ['vw', 'lt', 'tm'].forEach(function (r) {
      var row = box.querySelector('[data-r="' + r + '"] .pl-ch');
      CH[r].forEach(function (c) {
        var b = ER.el('button', '', c[1]); b.type = 'button'; b.setAttribute('data-v', c[0]);
        b.addEventListener('click', function () { if (done) return; st[r] = c[0]; VN.sfx.tab(); keep(); card(); });
        row.appendChild(b);
      });
    });
    box.querySelector('#pl-go').addEventListener('click', function () {
      var file;
      if (done) return;
      if (!st.net) { msg('&ldquo;This is the street as it is today,&rdquo; says Miss Blackwood. &ldquo;It is not the street as it was in May. Look at the police photographs again: something stood in front of one of these houses, from the pavement to the roof.&rdquo;'); return; }
      if (!ER.check('sc', st.net)) { VN.bump('r-tries'); VN.sfx.hm(); msg('&ldquo;Look at photograph 2 again. The netting has a banner on it, and the banner says which house the builders were working on.&rdquo;'); return; }
      if (st.tick == null) { msg('&ldquo;Now walk him from the door towards the steps, one mark at a time. Where could she first see him?&rdquo;'); return; }
      if (!ER.check('mk', String(st.tick + 1))) {
        VN.bump('r-tries'); VN.sfx.hm();
        msg(blocked(TICKS[st.tick], st.net) ? '&ldquo;Look at your string. It goes through the netting: from her window she could not see that place at all.&rdquo;'
          : '&ldquo;She could see him there, yes. But could she see him any sooner? Walk him back towards the door, one mark at a time, and watch the string.&rdquo;');
        return;
      }
      if (!st.vw || !st.lt || !st.tm) { msg('&ldquo;Good. Thirty-six metres. Now the rest of the card: his face or his back, the lamp, and how long.&rdquo;'); return; }
      if (!ER.check('vw', st.vw)) { VN.bump('r-tries'); VN.sfx.hm(); msg('&ldquo;Which way was he walking, and where was she? Her window is behind him. She told the 999 operator so herself, in her own words.&rdquo;'); return; }
      if (!ER.check('lt', st.lt)) { VN.bump('r-tries'); VN.sfx.hm(); msg('&ldquo;That lamp has a number on its plate. The council keeps a record of every number: when it went out, and when it was mended. When was the burglary?&rdquo;'); return; }
      if (!ER.check('tm', st.tm)) { VN.bump('r-tries'); VN.sfx.hm(); msg('&ldquo;From the first place she could see him to the corner of Wherry Steps: how many marks is that? Each one is a metre and a half, and a man walking briskly covers a metre and a half in a second.&rdquo;'); return; }
      file = ER.exitOk(['s' + st.net + '+p' + (st.tick + 1) + '+' + st.vw + '+' + st.lt + '+t' + st.tm]);
      if (!file) { msg('Something is wrong with this lock: tell your teacher.'); return; }
      done = true; nextFile = file; ER.flag('r-file', file); VN.done('row'); VN.sfx.pen(); paintMap();
      msg('Miss Blackwood looks at the plan, and then up at the window. <b>&ldquo;Thirty-six metres. From behind. In the rain, with the nearest lamp out, for about five seconds. And until he passed No. 16, the scaffolding hid him.&rdquo;</b>');
      VN.mine('plan', 'Your plan of Cutler’s Row', planSvg('12', 2, false) + '<p>Scaffolding in front of No. 12 hid the door of No. 14.</p><p>She could first see him outside No. 16: 36 m away.</p><p>His back. Lamp CR-07 out (9 to 21 May).</p><p>About 5 seconds, then round the corner.</p>', true);
      VN.learn(['sight line', 'obstruction']);
      setTimeout(function () {
        ER.closeAll(); VN.solved(); paint(); busy = true;
        ER.narrate([
          'Miss Blackwood stands where the scaffolding stood, and looks up at Flat 1. &ldquo;From up there, on a dry morning, I can see a man&rsquo;s back very well. I could tell you his coat and his hat. I could not swear to his face, and I am thirty years younger than she is.&rdquo;',
          '&ldquo;She is not lying,&rdquo; she says. &ldquo;Remember that, this afternoon. She saw a man with a case walk away towards the steps, and she has told the same story about that every single time. It is the face that came later.&rdquo;',
          'Above the café, somebody begins to play scales on a piano: slowly, up and down, one hand and then the other. Miss Blackwood looks at her watch. &ldquo;Lunch. Andreou&rsquo;s. You can talk to Mr Andreou: taking a statement is a solicitor&rsquo;s job, not a barrister&rsquo;s. I shall drink my soup and listen to nothing at all.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3400);
    });
    paintMap(); card(); keep();
    msg('Your plan, and Her Honour&rsquo;s questions. <b>Put the street back as it was in May</b>, find <b>the first place on his way where she could have seen him</b>, and fill in the rest of the card.');
    plBox = box;
    ER.open('ov-lock', box, function () { plBox = null; });
  }
})();
</script>
