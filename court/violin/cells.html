          '&ldquo;Four hours,&rdquo; says Miss Blackwood. &ldquo;Good.&rdquo; She gives you the measuring wheel from the bottom of her bag. &ldquo;Take this and the photographs to Cutler&rsquo;s Row. Stand under Mrs Askew&rsquo;s window and find out what she could see. Do not go up: she is in the middle of her evidence, and nobody on our side goes near her. I shall meet you there at eleven.&rdquo;'
        ], function () { busy = false; paint(); });
      }, 3200);
    });
    msg('Five cards from the alibi papers. <b>Put each card in its ten minutes on the strip</b>, and <b>click its round tab</b>: once for green (strong), twice for red (weak). Then choose what it all comes to. <i>Drag a card, or click the card and then the place.</i>');
    abBox = box; keep();
    ER.open('ov-lock', box, function () { abBox = null; });
  }
