<style>
  body{--bg:#efe3c4;--accent:#f2c14e;--font-display:'IM Fell English SC',serif;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(60,26,22,.95);--tc-ink:#f8f1e2;--cap-bg:rgba(52,24,20,.93);--panel:#3a1f1c;--face-bg:#f3ead2;--q-ink:#f2d98a;--fade:#2a1412;--hud-bg:rgba(52,24,20,.82);--ov-bg:rgba(40,20,16,.82)}
  .pac{font-family:'Pacifico',cursive;text-anchor:middle}
  .hand{font-family:'Patrick Hand',cursive;text-anchor:middle}
  .steam{animation:steam 3.2s ease-in infinite;opacity:0}
  .steam.b{animation-delay:-1.1s}.steam.c{animation-delay:-2.2s}
  @keyframes steam{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.75}100%{transform:translate(14px,-110px) scale(1.5);opacity:0}}
  .steam{transform-box:fill-box;transform-origin:50% 100%}
  #needles{transform-box:fill-box;transform-origin:50% 100%;animation:knit 1.1s steps(2,end) infinite}
  @keyframes knit{50%{transform:rotate(7deg)}}
  body.stopped #needles{animation:none}
  .flag{transform-box:fill-box;transform-origin:50% 0;animation:flap 3s ease-in-out infinite alternate}
  .flag:nth-child(2n){animation-duration:3.7s;animation-delay:-1.4s}
  @keyframes flap{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
  #cards.ready #cardsG{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.12)}}
  #cup{display:none}body.found #cup{display:block}body.found #urn2lid{transform:translate(-64px,-12px) rotate(-24deg);transform-box:fill-box;transform-origin:50% 50%}

  /* five cards, three rubber stamps, eight reasons */
  .bx.cards{width:min(1186px,97vw)}
  .cd-q{margin:0 0 8px;padding:5px 12px 4px;background:#8c2f24;color:#fbf7ea;font-family:'Oswald',sans-serif;font-weight:500;font-size:15px;letter-spacing:.2em;text-transform:uppercase;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .cd-row{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .cd{position:relative;background:#fbf7ea;color:#22301c;padding:7px 10px 8px;box-shadow:0 12px 28px rgba(0,0,0,.45);border-top:7px solid #3f6b3a;display:flex;flex-direction:column;min-width:0}
  .cd.own{border-top-color:#3f7f8f;background:#f6f3ea}
  .cd small{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#3f6b3a}
  .cd.own small{color:#3f7f8f}
  .cd b.nm{display:block;font-family:'Alfa Slab One',serif;font-weight:normal;font-size:17.5px;line-height:1.1;letter-spacing:.02em;margin:1px 0 4px}
  .cd .tm{display:inline-block;margin:0 5px 3px 0;padding:0 5px;border:1.5px solid #5a2a8c;color:#5a2a8c;font-family:'Special Elite',monospace;font-size:12.5px;line-height:17px;transform:rotate(-1.5deg)}
  .cd .tm+.tm{transform:rotate(1.5deg)}
  .cd .none{display:inline-block;margin:0 0 3px;font-family:'Patrick Hand',cursive;font-size:15px;color:#3f7f8f;line-height:20px}
  .cd .mk{display:flex;gap:4px;margin:1px 0 3px;min-height:25px}
  .cd .mk span{width:23px;height:23px;border:1px dashed #9aa98c;border-radius:50%;display:grid;place-items:center}
  .cd .mk span.on{border:1px solid #5a2a8c}
  .cd p{margin:0 0 5px;font-family:'Patrick Hand',cursive;font-size:15.5px;line-height:1.16;color:#22335a;flex:1}
  .cd-v{display:block;width:100%;height:46px;margin:0 0 5px;border:1.5px dashed #b9ae8c;border-radius:3px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a8f7a;background:rgba(255,255,255,.5)}
  .cd-v:hover{border-color:#8c2f24}
  .cd-v.set{border:3px solid;border-radius:5px;font-family:'Alfa Slab One',serif;font-size:14.5px;letter-spacing:.05em;line-height:1.05;transform:rotate(-2.5deg);background:none;opacity:.88}
  .cd-v.cannot{color:#27365a;border-color:#27365a}.cd-v.might{color:#c2701a;border-color:#c2701a}.cd-v.must{color:#b3261c;border-color:#b3261c}
  .cd-v.bad,.cd-why.bad{outline:3px solid #ff6a5a;outline-offset:2px}
  .cd-why{min-height:84px;border:1.5px dashed #b9ae8c;border-radius:3px;padding:3px;display:grid;background:rgba(255,255,255,.5)}
  .cd-why:empty:before{content:'because \2026';align-self:center;text-align:center;font-family:'Patrick Hand',cursive;font-size:16px;color:#b9ae8c}
  .cd-tools{display:grid;grid-template-columns:166px 1fr;gap:12px;margin-top:10px;align-items:start}
  .cd-stamps{display:grid;gap:6px}
  .cd-stamps .st{position:relative;padding:7px 6px 6px 40px;text-align:left;border-radius:4px;background:#5a3d20 linear-gradient(#7a5632,#4a3018);color:#fbf7ea;font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;line-height:1.1;box-shadow:0 6px 14px rgba(0,0,0,.45)}
  .cd-stamps .st:before{content:'';position:absolute;left:8px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;border:3px solid}
  .cd-stamps .st.cannot:before{border-color:#7f95d0;background:#27365a}.cd-stamps .st.might:before{border-color:#f2c14e;background:#c2701a}.cd-stamps .st.must:before{border-color:#ff9a8a;background:#b3261c}
  .cd-stamps .st.sel{outline:3px solid #f2c14e;outline-offset:2px;transform:translateY(-3px)}
  .cd-tray{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:118px;padding:6px;border:1px dashed rgba(255,255,255,.3);border-radius:4px;align-content:start}
  .slip{padding:4px 7px 3px;background:#fff7dc;color:#3a2a14;font-family:'Patrick Hand',cursive;font-size:14px;line-height:1.1;box-shadow:0 4px 10px rgba(0,0,0,.35);border-left:4px solid #c9453a;-webkit-user-select:none;user-select:none}

  .slip.fly{box-shadow:0 14px 30px rgba(0,0,0,.5);transform:rotate(-2deg)}
  .bx.cards .pmsg{min-height:64px}

  function hints() {

      'There are two ways to the dial. From the gate: steps and mud. From the Yew Door: flat, but locked until a quarter to three, and outside the maze. For each person ask which side of your gate they were on, and what that way would have done to their shoes or their wheels.',
      'Two people have no hunt card, because they never went through your gate. One had the key, and five minutes that nobody saw: is that proof of anything? The other &ldquo;cannot manage the steps&rdquo;, as everybody knows. But read your note about the gravel, count the wheels of everything in this tent, and read again what she said about a lens cap.'
    ]];
    if (s === 2) return ['where', [
      'She told the twins the truth: &ldquo;As far as the urn, and no further.&rdquo; You have had your arm inside the stone urn in the maze, and there was no cup in it. Her three wheels could never have got there in any case. Is that the only urn at Summerhays?',
      'An urn is also a big metal pot with a tap, for making tea for a great many people. There are two of them in this tent. One is hot. The other has a card on it, in very neat handwriting.'

      'And Miss Fairbrass. She was headmistress of Little Hays School for thirty years, and most of the people in this tent learned to read in front of her. She sits very straight on a red electric scooter beside the second tea urn, with a rug over her knees, knitting something the colour of a hedge.',
      'Mrs Kemble lays five cards in a row on the green table, and beside them three rubber stamps out of the committee box. &ldquo;Three of these are hunt cards, out of your own box. Two I have written out myself, for people who never went through your gate. Ask anybody anything. Then stamp every card, and tell me why.&rdquo;'

        '<p><b>Miss Fairbrass must have been:</b> three wheels crossed gravel that was raked at 2.35; the door was locked until 2.45; from 2.55 she was in the tea tent. And she knows that there is a lens cap on the dial.</p>', true);

      setTimeout(function () { ER.closeAll(); busy = false; ER.say('Everybody in the tent is looking at you. Click on the one who was at the dial, and has not said so.', 9000); }, 4400);
    });
    draw();
    msg('Five cards, and one question for all of them. Pick up a rubber stamp and bring it down on each card. Then give each card its reason: drag a slip of paper on to it, or click the slip and then the card.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; }
    };
  }
