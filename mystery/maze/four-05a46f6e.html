<style>
  body{--bg:#6db84c;--accent:#f2c14e;--font-display:'IM Fell English SC',serif;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',serif;
    --tc-bg:rgba(24,40,58,.95);--tc-ink:#f6f1e2;--cap-bg:rgba(20,34,50,.93);--panel:#1f3a22;--face-bg:#8cc4ec;--q-ink:#f2d98a;--fade:#14222f;--hud-bg:rgba(20,34,50,.8)}
  .cloud{animation:drift 110s linear infinite}
  .cloud.b{animation-duration:150s;animation-delay:-60s}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(2100px)}}
  .flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 2.4s ease-in-out infinite alternate}
  @keyframes wave{from{transform:skewY(-6deg)}to{transform:skewY(7deg)}}
  #me{transition:transform .26s linear}
  #glint{animation:glint 2.8s steps(1,end) infinite;opacity:0}
  body.given #glint{opacity:1}
  @keyframes glint{0%{transform:scale(1)}50%{transform:scale(1.6)}}
  #glint{transform-box:fill-box;transform-origin:50% 50%}
  #party{opacity:0;transition:opacity 1.2s}
  body.party #party{opacity:1}

  /* your own hunt card, stamped OUT, and the page for the Parish News */
  .done{position:fixed;right:2.4vw;top:136px;z-index:34;width:min(400px,94vw);padding:12px 22px 14px;display:none;background:#fbf7ea;color:#22301c;box-shadow:0 20px 60px rgba(0,0,0,.45);transform:rotate(1deg);border-top:12px solid #3f6b3a}
  .done.on{display:block}
  .done h5{margin:0;font-family:'Alfa Slab One',serif;font-weight:normal;font-size:23px;letter-spacing:.05em;color:#3f6b3a}
  .done h5 small{display:block;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.3em;color:#22301c;margin-top:1px}
  .done .tm{display:inline-block;margin:7px 6px 2px 0;padding:0 6px;border:1.5px solid #5a2a8c;color:#5a2a8c;font-family:'Special Elite',monospace;font-size:14px;line-height:20px;transform:rotate(-1.5deg)}
  .done .tm+.tm{transform:rotate(2deg)}
  .done .ring{display:flex;gap:8px;margin:6px 0 8px}
  .done .ring span{width:46px;height:46px;border:1.5px solid #5a2a8c;border-radius:50%;display:grid;place-items:center;transform:rotate(-8deg)}
  .done .ring span:nth-child(2n){transform:rotate(6deg)}
  .done .rev{margin:0 0 8px;font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.22;color:#22335a}
  .done p.st{margin:0 0 2px;font-family:'Special Elite','Courier New',monospace;font-size:14px;line-height:1.4;border-top:1px solid #9aa98c;padding-top:4px}
  .done p.st+p.st{border-top:0;padding-top:0}
  .done .row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .done .btn{--accent:#3f6b3a;font-size:13px;padding:9px 12px 8px}
  .done .btn:hover:not([disabled]){color:#fbf7ea}
  .done small.again{display:block;margin-top:9px;font-family:'Special Elite','Courier New',monospace;font-size:12.5px;opacity:.8;line-height:1.5}
  .done small.again button{text-decoration:underline;font:inherit}
  .rp{width:min(760px,94vw);max-height:84vh;overflow:auto;background:#fbfbf7;color:#1d2126;padding:20px 34px 18px;box-shadow:0 26px 70px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;border-top:14px solid #3f6b3a}
  .rp h4{margin:0 0 3px;font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#3f6b3a}
  .rp h3{margin:0 0 8px;font-family:'Alfa Slab One',serif;font-weight:normal;font-size:26px;line-height:1.1}
  .rp p,.rp label{display:block;font-family:'EB Garamond',serif;font-size:18px;line-height:1.4;margin:0 0 7px;color:#27231d}
  .rp textarea,.rp input[type=text]{width:100%;font-family:'Patrick Hand',cursive;font-size:22px;line-height:30px;color:#22335a;background:#fbf7e6 repeating-linear-gradient(transparent 0 29px,rgba(60,110,170,.3) 29px 30px);border:1px solid #9aa98c;padding:0 12px;border-radius:0;resize:vertical;-webkit-user-select:text;user-select:text}
  .rp textarea{min-height:184px}
  .rp input[type=text]{height:32px}
  .rp .count{font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;text-align:right;margin-top:3px}
  .rp .foot{display:flex;gap:10px;align-items:center;margin-top:10px}
  .rp .foot span{flex:1;font-family:'Special Elite',monospace;font-size:12.500px;opacity:.75}
  .rp .btn{--accent:#3f6b3a}.rp .btn:hover:not([disabled]){color:#fbfbf7}
  @media print{
    body{overflow:visible;background:#fff}
    body>*:not(.ov){display:none!important}
    .ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
    .ov-bar,.rp .foot{display:none!important}
    .rp{box-shadow:none;max-height:none;width:auto;overflow:visible}
  }
</style>

<div class="done" id="done">
  <h5>Maze Hunt<small>SUMMERHAYS &middot; THE SECOND SATURDAY IN JUNE</small></h5>
  <div><span class="tm">IN 3.14</span><span class="tm">OUT 4.05</span></div>
  <div class="ring" id="d-ring"></div>
  <p class="rev">Four stamps, and the dial. Finished: for the tenth time since 1962. <i style="font-style:normal;color:#8c2f24">D. Fairbrass</i></p>
  <p class="st" id="d-time"></p><p class="st" id="d-hints"></p><p class="st" id="d-words"></p>
  <div class="row"><button type="button" class="btn" id="b-task">Write for the Parish News</button><button type="button" class="btn" id="b-book">Notebook</button><button type="button" class="btn" id="b-lobby">Back to the stories</button></div>
  <small class="again">Past the Lion &middot; <button type="button" id="b-reset">play it again from the start</button></small>

<script>
(function () {
  var $ = ER.$, busy = true, told = {}, OX = 500, OY = 392, CW = 86, CH = 50, walkT = 0;
  var ROUTE = ['3,6', '3,5', '2,5', '2,4', '1,4', '1,3', '1,2', '1,1', '1,0', '2,0', '3,0', '4,0', '4,1', '5,1', '5,2', '4,2', '3,2'];      /* the way that the rhymes go, as you walked it; the last step to the dial is taken at four */
  function at(k) { var q = k.split(','); return MZ.aboveAt(OX, OY, CW, CH, +q[0], +q[1], true); }
  function me(k) { var a = at(k); $('#me').setAttribute('transform', 'translate(' + a[0] + ' ' + a[1] + ')'); }

  /* the balustrade; the maze; the people who came in by the flat way */
  (function () {
    var s = '', x, a, i, P;
    for (x = -980; x < 2600; x += 46) s += '<path d="M' + x + ' 884v-18q-8 -14 0 -28q8 -10 0 -20v-10h18v10q-8 10 0 20q8 14 0 28v18z"/>';
    $('#balus').innerHTML = s;
    $('#mazeG').innerHTML = MZ.above(OX, OY, CW, CH, 22, true);
    a = at('3,3');
    /* [dx, dy, coat, head, tall?]: Mrs Kemble, Goodchild, Dr Sanghera, Mrs Ravenscroft, the twins, Mr Bexley */
    P = [[-22, 12, '#3f7f8f', '#a8532a'], [-10, -12, '#4f6b3a', '#cfb26a'], [14, -14, '#27365a', '#2f4f8f'], [27, 8, '#c98fb0', '#6b4a2a'], [1, 17, '#d9573a', '#c98a3a'], [13, 19, '#3f8a4e', '#c98a3a'], [31, -9, '#efe6cf', '#f4efdf', 1]];
    /* the scooter came in from the Yew Door, which from up here is on the left: its three thin lines run that way */
    s = '<g fill="none" stroke="#8a7a52" stroke-width="1.200" opacity=".9"><path d="M' + (OX + 2) + ' ' + (a[1] - 1) + 'H' + (a[0] - 62) + 'M' + (OX + 2) + ' ' + (a[1] + 3) + 'H' + (a[0] - 62) + 'M' + (OX + 2) + ' ' + (a[1] + 7) + 'H' + (a[0] - 62) + '"/></g>' +
      '<g transform="translate(' + (a[0] - 52) + ' ' + (a[1] + 4) + ')"><ellipse cx="0" cy="4" rx="13" ry="4" fill="#1f3d18" opacity=".35"/><rect x="-12" y="-6" width="24" height="8" rx="3" fill="#8c2f24"/><circle cx="-9" cy="3" r="3.500" fill="#17181c"/><circle cx="8" cy="3" r="3.500" fill="#17181c"/><path d="M-2 -6v-10q4 -5 8 0v10z" fill="#7f8fc0"/><circle cx="2" cy="-20" r="4.500" fill="#f1f3f5"/></g>';
    P.forEach(function (p) { var h = p[4] ? 17 : 12; s += '<g transform="translate(' + (a[0] + p[0]) + ' ' + (a[1] + p[1]) + ')"><ellipse cx="0" cy="3" rx="7" ry="3" fill="#1f3d18" opacity=".35"/><path d="M-4 0v-' + h + 'q4 -5 8 0v' + h + 'z" fill="' + p[2] + '"/><circle cx="0" cy="-' + (h + 4) + '" r="4.500" fill="' + p[3] + '"/></g>'; });
    s += '<g id="glint" transform="translate(' + a[0] + ' ' + (a[1] - 24) + ')"><path d="M0 -9l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z" fill="#fff"/></g>';
    $('#party').innerHTML = s;
  })();

  ER.init({
    theme: 'mystery', story: 'maze', storyTitle: 'Past the Lion', id: 'four', no: 'V', title: 'Four O’Clock',
    go: 'Look down',
    intro: [
      'Five cards, and one question: who was at the dial between a quarter to three and five to three? Three people cannot have been: dry shoes, a pushchair, a cup of tea. One might have been, because he had the key. And one must have been, because three wheels had crossed the gravel after it was raked, and only one thing at Summerhays goes on three wheels and no feet.',
      'Everybody knew that Miss Fairbrass could not manage the steps. Nobody asked which way had no steps in it. And when she said that the cup had gone &ldquo;as far as the urn, and no further&rdquo;, everybody thought of stone. She meant the urn that makes the tea.',
      'It is nearly four o&rsquo;clock, and the Maze Cup is on its way back to the dial.'
    ],
    exit: {"last":true,"rooms":5,"stars":3}, tags: {},
    hints: hints, onBegin: begin
  });
  told = ER.flag('f-told') || {};
  function tell(k) { if (told[k]) return false; told[k] = 1; ER.flag('f-told', told); return true; }
  function isBusy() { return busy; }
  function hints() { return null; }

  function walk(done) {
    var i = 0;
    clearInterval(walkT);
    walkT = setInterval(function () {
      if (++i >= ROUTE.length) { clearInterval(walkT); if (done) done(); return; }
      me(ROUTE[i]);
    }, 300);
  }
  function begin() {
    if (!ER.flag('tEnd')) ER.flag('tEnd', Date.now());
    ['rhymes', 'plan', 'prog'].forEach(function (id) { MZ.file(id, true); });
    ER.pips(told.end ? 1 : 0, 1);
    if (told.end) { busy = false; document.body.classList.add('party', 'given'); me('3,2'); finish(true); return; }
    me(ROUTE[0]);
    [0, 1, 2, 3].forEach(function (n) { setTimeout(ER.sfx.bell, 500 + n * 1500); });
    ER.narrate([
      'Four o&rsquo;clock. The stable clock gives its four ding-dongs, and then strikes the hour: four slow strokes that can be heard all over the gardens. On the terrace of the house old Mrs Marchmont picks up her husband&rsquo;s field glasses and turns them on the maze. From up here it is Goodchild&rsquo;s plan come to life, and turned upside down: the gate is on the far side, and the Yew Door is on the left.'
    ], function () {
      document.body.classList.add('party');
      ER.narrate([
        'In at the Yew Door they come, by the flat way, twelve paces: Mr Goodchild with the cup in both hands, Mrs Kemble, Dr Sanghera and his granddaughter, Mrs Ravenscroft and the pushchair, the twins, Mr Bexley, who has to stoop, and last of all a red scooter with a horn. The scooter leaves three thin lines in the gravel. This time everybody looks at them.'
      ], function () {
        walk();
        ER.narrate([
          'One small figure does not come by the door. It comes in at the gate, alone, with a card in its hand: along the Long Green Walk, past the lion, down into the Dip and up again, and round by the north side. Miss Fairbrass has said that a winner arrives by the rhymes or not at all, and nobody in Little Hays has said no to Miss Fairbrass since about 1975.',
          '&ldquo;The first child,&rdquo; Miss Fairbrass reads from the programme, &ldquo;to stand at the dial with four stamps on a card.&rdquo; She looks at your card, and then, over her spectacles, at you. &ldquo;Fourteen is a child. You have mud to the knees, and you can read. It is more than I can say for most of Little Hays.&rdquo; She holds out the cup. It is as big as a teapot, as heavy as a baby, and worth very nearly forty pounds.',
          '&ldquo;Your name will be cut on it this week, under nine others,&rdquo; she says. &ldquo;Spell it.&rdquo; You spell it. &ldquo;Again,&rdquo; says Miss Fairbrass, and writes it down a second time, and compares the two. Mr Goodchild is looking at the hedge beside the lion. &ldquo;I could clip that gap a bit wider,&rdquo; he says. &ldquo;You will not,&rdquo; says Miss Fairbrass. &ldquo;Let them read.&rdquo;'
        ], function () {
          clearInterval(walkT); me('3,2'); document.body.classList.add('given');
          try { if (ER.track && ER.music()) ER.track.play(['village', { root: 48, bpm: 104, beds: [['birds', 0.5], ['crowd', 0.4]] }]); } catch (e) {}      /* the tune comes back: the reading is over */
          tell('end'); busy = false; finish(false);
        });
      });
    });
  }
  function finish(quick) {
    var st = ER.state(), mins = MZ.mins(), hn = ER.hintsUsed(), s = '', i;
    for (i = 0; i < 4; i++) s += '<span>' + MZ.mark(i, 34) + '</span>';
    $('#d-ring').innerHTML = s;
    $('#d-time').textContent = 'From the scone to the cup: ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
    $('#d-hints').textContent = hn ? 'Hints asked for: ' + hn + '.' : 'Hints asked for: none at all.';
    $('#d-words').textContent = 'In your notebook: ' + st.clues.length + ' papers and ' + Object.keys(st.words).length + ' words.';
    $('#done').classList.add('on'); ER.pips(1, 1);
    if (quick) ER.say('The maze, from the terrace. Somewhere down there a silver cup is catching the sun.');
  }

  MZ.item('#mazeG', 'maze', 'The maze, from the terrace: forty-nine squares of yew, one lion, one urn, three benches and a sundial. From up here it takes ten seconds to see the way in. From inside it took sixty years.', isBusy);
  MZ.item('#urnL', 'urn', 'A stone urn, full of red geraniums. You look at it for some time. Then you look inside it. Geraniums.', isBusy);
  MZ.item('#urnR', 'urn', 'Another urn. Summerhays has a great many of them, once you begin to count.', isBusy);
  MZ.item('#glasses', 'field glasses', 'Mrs Marchmont&rsquo;s field glasses. &ldquo;My husband watched the hunt through those for forty years,&rdquo; she says, &ldquo;and never once told a child the way. He said it would be cheating. He meant that it would be less fun.&rdquo;', isBusy);
  MZ.item('#tents', 'tea tent', 'The lawn on the far side of the maze: a card table with a striped sunshade, Mr Goodchild&rsquo;s plant stall, and the tea tent. Somebody has finished your scone.', isBusy);

  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });
  $('#b-task').addEventListener('click', function () {
    var saved = ER.flag('task') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>The Little Hays Parish News &middot; open day page</h4><h3>Half a page is empty</h3>' +
      '<p>Miss Oduya has her photographs, and half a page with nothing on it. &ldquo;You were there,&rdquo; she says. &ldquo;I was lost. Write it for me.&rdquo;</p>' +
      '<p><b>A</b> Write the report, in 60 to 90 words: where the cup was, who cannot have been at the dial and why, who might have been, who must have been and why. Use: cannot have, might have, must have, because.<br><b>B</b> Or write the way from the gate to the dial in plain English, with no rhymes, for next year&rsquo;s hunters. Use: as far as, past, the second gap on your right, keep the hedge on your left. (Miss Fairbrass will not print it.)</p>' +
      '<textarea id="r1"></textarea><div class="count"></div><label for="r2">Written by</label><input type="text" id="r2" maxlength="60">' +
      '<div class="foot"><span>Nobody marks this. It is saved in this browser as you write.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > p');
    box.querySelector('#r1').value = saved.r1 || ''; box.querySelector('#r2').value = saved.r2 || '';
    function keep() {
      var o = { r1: box.querySelector('#r1').value, r2: box.querySelector('#r2').value }, n = (o.r1.match(/[A-Za-z’']+/g) || []).length;
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('task', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
