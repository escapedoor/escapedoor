  .slab{font-family:'Alfa Slab One',serif;text-anchor:middle}
  .amatic{font-family:'Amatic SC',cursive;font-weight:700;text-anchor:middle}
  .cloud{animation:drift 90s linear infinite}
  .cloud.b{animation-duration:130s;animation-delay:-50s}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(2100px)}}
  .flag{transform-box:fill-box;transform-origin:50% 0;animation:flap 2.6s ease-in-out infinite alternate}
  .flag:nth-child(2n){animation-duration:3.3s;animation-delay:-1.2s}.flag:nth-child(3n){animation-duration:2.1s;animation-delay:-.6s}
  @keyframes flap{from{transform:rotate(-7deg)}to{transform:rotate(8deg)}}
  #fly{animation:fly 17s linear infinite}
  @keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(160px,-50px)}50%{transform:translate(330px,20px)}75%{transform:translate(170px,60px)}100%{transform:translate(0,0)}}
  #fly path{transform-box:fill-box;transform-origin:50% 100%;animation:wing .3s steps(2,end) infinite}
  @keyframes wing{50%{transform:scaleX(.3)}}
  #board.ready #boardpaper{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.12)}}

  /* the plan on its easel, three photographs, three pins */
  .bx.pins{width:min(1012px,96vw)}
  .pn-two{display:grid;grid-template-columns:560px 1fr;gap:0 16px;align-items:start}
  .pn-plan{border:8px solid #6b4a2a;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#f4ecd2}
  .pn-big{position:relative;background:#fbfaf2;padding:9px 9px 34px;box-shadow:0 16px 40px rgba(0,0,0,.5);transform:rotate(.5deg)}
  .pn-big svg{width:100%;height:auto;display:block}
  .pn-big .cap2{position:absolute;left:14px;right:14px;bottom:6px;display:flex;justify-content:space-between;font-family:'Patrick Hand',cursive;font-size:19px;color:#22335a}
  .pn-big .stamp{position:absolute;right:16px;bottom:44px;padding:1px 7px;background:rgba(0,0,0,.55);color:#ffb52e;font-family:'Special Elite',monospace;font-size:15px;letter-spacing:.06em}
  .pn-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .pn-th{position:relative;padding:5px 5px 22px;background:#fbfaf2;box-shadow:0 8px 20px rgba(0,0,0,.45);border:0;cursor:pointer;text-align:left}
  .pn-th svg{width:100%;height:auto;display:block;pointer-events:none}
  .pn-th span{position:absolute;left:8px;bottom:1px;font-family:'Patrick Hand',cursive;font-size:16px;color:#22335a}
  .pn-th i{position:absolute;right:6px;bottom:3px;width:17px;height:17px;border-radius:50%;font-style:normal;font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;line-height:17px;text-align:center;color:#fbfaf2}
  .pn-th.sel{outline:3px solid #f2c14e;outline-offset:2px}
  .pn-th.set:after{content:'pinned';position:absolute;right:28px;bottom:3px;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#3f6b3a}
  .pn-how{margin:12px 2px 0;font-family:'EB Garamond',Georgia,serif;font-size:16.5px;line-height:1.32;color:#e6ecd9}
  .pn-how b{color:#f2c14e;font-weight:600}
  .bx.pins .pmsg{min-height:70px}
</style>

      wait = true; nextFile = file; ER.flag('g-file', file);
      MZ.mine('pins', 'Three photographs, pinned to the plan', '<p>2.30 (A): the cup on the sundial. Taken in the lane from the Yew Door, looking west.</p><p>2.42 (B): the stone lion, from the next square. There is a dark place in the hedge on his right.</p>' +
        '<p>2.50 (C): the Long Walk, looking west. A white hat over the right-hand hedge: Mr Bexley, in the dead end with the bench. On the plan that dead end is ONE HEDGE from the dial.</p>' +
        '<p>The twins saw the cup at a quarter to three, while the clock was striking. At ten to three Mr Bexley looked over the hedge, and it had gone.</p>', true);
      msg('&ldquo;The dead end with the bench.&rdquo; Mrs Kemble looks from the plan to the tall man in the white hat, and back again. &ldquo;One hedge from the dial. At ten to three. Well, well.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          '&ldquo;So,&rdquo; says Mrs Kemble. &ldquo;At half past two the cup was on the dial. At a quarter to three it was still there: the twins saw it while the clock was striking. At ten to three it was not, and a man in a white hat was standing one hedge away from it.&rdquo; &ldquo;One hedge,&rdquo; says Mr Bexley, &ldquo;is a great deal of hedge.&rdquo; &ldquo;That is what I mean to find out.&rdquo;',
          'She takes a fresh card out of your box, stamps it herself, and holds it out to you. IN 3.14. &ldquo;You are under fifteen. You have not set foot in that maze today, so you have no idea where anything is, and you will have to read. Do the hunt. Every rhyme, every stamp.&rdquo;',
          '&ldquo;Why?&rdquo; &ldquo;Because not one card in that box has a third stamp on it. So either somebody reached the middle without the rhymes, or somebody read them better than the rest of us and kept quiet about it. I want to know what there is past that lion. And look at the ink pads when you find them. A pad that has been used all afternoon does not look like a pad that has not.&rdquo;',
          'You reach for the plan. She puts her hand flat on it. &ldquo;The plan stays on the easel. Sir Edmund&rsquo;s rule: nobody takes a map into his maze.&rdquo; She unhooks the rope from the gate. &ldquo;Go on. I have a tea tent to run.&rdquo;'
        ], function () { busy = false; showGo(); ER.say('A card, five rhymes, and a white gate standing open.'); });
      }, 4200);
    });
    draw();
    msg(stage ? '&ldquo;And THAT is Mr Bexley&rsquo;s hat,&rdquo; says Mrs Kemble. &ldquo;So where was Mr Bexley?&rdquo;' :
      'Goodchild&rsquo;s plan shows the maze from above. Miss Oduya&rsquo;s three photographs show it from inside. Push a pin into the plan for each photograph, where the camera stood, with its arrow pointing the way the camera looked.');
    return {
      open: function () { ER.open('ov-lock', box); },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return stage; }
    };
  }
})();
</script>
