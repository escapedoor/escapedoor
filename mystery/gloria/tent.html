<style>
  body{--bg:#4f8a2e;--accent:#e9832b;--font-display:'Alfa Slab One',serif;--font-ui:'Oswald',sans-serif;--font-body:'Outfit',Arial,sans-serif;
    --tc-bg:repeating-linear-gradient(90deg,#f8f1de 0 110px,#f1e8d0 110px 220px);--tc-ink:#2b2a20;
    --cap-bg:rgba(255,251,238,.97);--cap-ink:#2b2a20;--panel:#fffaf0;--panel-ink:#2b2a20;--q-ink:#3d6b3f;
    --hud-bg:rgba(34,58,38,.88);--hud-ink:#fff8e6;--hud-line:rgba(255,248,230,.38);--ov-bg:rgba(24,40,26,.74);--fade:#f6efdc}
  .tc-theme{color:#c2611a}
  .tc-room{font-size:clamp(36px,5.6vw,74px);letter-spacing:.01em;color:#2c6a3f}
  .tc .btn,.tk .btn{--accent:#c2611a}
  .cap{box-shadow:0 14px 44px rgba(30,40,20,.35)}
  .cap em{color:#c2611a}
  .tk{border-color:#cdbf9d}
  .tk-name{font-size:24px;letter-spacing:.01em;color:#2c6a3f}
  .tk-role{color:#c2611a}

  .banT{font-family:'Alfa Slab One',serif;font-size:35px;letter-spacing:2px;fill:#2c6a3f;text-anchor:middle}
  .clsT{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:5px;fill:#c2611a;text-anchor:middle}
  .sgnT{font-family:'Alfa Slab One',serif;font-size:27px;letter-spacing:1px;fill:#2c6a3f;text-anchor:middle}
  .sgnS{font-family:'Alfa Slab One',serif;font-size:17px;fill:#2c6a3f;text-anchor:middle}
  .crdT{font-family:'Patrick Hand',cursive;font-size:14px;fill:#1f2f63;text-anchor:middle}
  .crdB{font-family:'Oswald',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:1px;fill:#fff;text-anchor:middle}
  .tagT{font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;fill:#3a2a14;text-anchor:middle}
  .dialT{font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;fill:#3d5a4c;text-anchor:middle}
  .camT{font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:2px;fill:#fff8e6;text-anchor:middle;pointer-events:none}
  .polT{font-family:'Patrick Hand',cursive;font-size:19px;fill:#1f2f63;text-anchor:middle;pointer-events:none}
  .polX{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;fill:#b3372b;text-anchor:middle;opacity:0;pointer-events:none}
  .pol:hover .polX{opacity:1}

  .flag{animation:flag 3.2s ease-in-out infinite alternate}
  @keyframes flag{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
  #rope{animation:rope 4.4s ease-in-out infinite alternate;transform-origin:1440px 300px}
  @keyframes rope{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}
  #cloud{animation:cloud 50s linear infinite}
  @keyframes cloud{from{transform:translateX(-90px)}to{transform:translateX(150px)}}
  #clothEdge{animation:nudge 2.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateY(-5px)}}
  #cam{transition:opacity .4s}
  #cam .ring{animation:camPulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  #cam.used .ring{animation:none;opacity:0}
  @keyframes camPulse{from{transform:scale(.6);opacity:.9}to{transform:scale(1.25);opacity:0}}
  .gobtn{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:35;display:none;padding:13px 30px;border:2px solid #2c6a3f;
    color:#fff8e6;background:#2c6a3f;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.16em;text-transform:uppercase;border-radius:4px;
    box-shadow:0 8px 22px rgba(20,40,20,.4)}
  .gobtn.on{display:block}
  .gobtn:hover{background:#e9832b;border-color:#e9832b;color:#2b2a20}

  /* looking down at the ground outside the back door */
  .outv{width:min(780px,94vw);background:#fffaf0;padding:14px 14px 16px;box-shadow:0 26px 70px rgba(0,0,0,.55);border-radius:4px}
  .outv svg{display:block;width:100%;height:auto;border-radius:2px}
  .outv h5{margin:0 4px 10px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#c2611a}
  .outv p{margin:12px 6px 0;font-size:20px;line-height:1.45;color:#2b2a20}
  .outv .got{display:none;margin-top:10px;padding:8px 16px;background:#efe6cf;font-family:'Caveat',cursive;font-weight:700;font-size:30px;line-height:1.25;color:#23335e;
    transform:rotate(-1deg)}
  .outv .got p{margin:0;font-size:30px;line-height:1.25;color:#23335e}
  .outv.has .got{display:block}
  #scrapHot{animation:scrapGlow 2.2s ease-in-out infinite}
  .outv.has #scrapHot{animation:none;opacity:.25}
  @keyframes scrapGlow{50%{filter:brightness(1.18)}}
</style>
</head>

    '<path d="M-58 -30L-30 -36L4 -31L40 -37L60 -28L55 -6L61 18L44 33L10 28L-22 35L-56 29L-61 6Z" fill="#efe6cf"/>' +
    '<path d="M-44 -12q10-8 18 0t18 0 18 0 18 0M-44 10q10-8 18 0t18 0 18 0 18 0" stroke="#23335e" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    '<path d="M-64 24L30 -40" stroke="#5b4526" stroke-width="12" opacity=".4"/></g>' +
    '<g stroke="#4f8a2b" stroke-width="3" stroke-linecap="round" fill="none"><path d="M30 40l-5-14M30 40l2-16M30 40l8-12M700 360l-5-14M700 360l2-16M700 360l8-12M90 380l-5-14M90 380l2-16M640 30l-5-14M640 30l2-16M640 30l8-12"/></g>' +
    '<g transform="translate(686 310)"><g fill="#fff"><circle cy="-9" r="5.500"/><circle cx="8.500" cy="-3" r="5.500"/><circle cx="5.500" cy="7" r="5.500"/><circle cx="-5.500" cy="7" r="5.500"/><circle cx="-8.500" cy="-3" r="5.500"/></g><circle r="4.500" fill="#f2c230"/></g>' +
    '</svg>';
  function printsHtml() {
    var s = '', i, t, x, y, side, P = [[-20, 318], [190, 300], [372, 214]], Q = [[372, 214], [554, 128], [780, 70]], pts = [];
    function bez(p, u) { return [(1 - u) * (1 - u) * p[0][0] + 2 * (1 - u) * u * p[1][0] + u * u * p[2][0], (1 - u) * (1 - u) * p[0][1] + 2 * (1 - u) * u * p[1][1] + u * u * p[2][1]]; }
    for (i = 0; i < 4; i++) pts.push(bez(P, 0.18 + i * 0.24));
    for (i = 0; i < 4; i++) pts.push(bez(Q, 0.12 + i * 0.24));
    pts.forEach(function (p, j) {
      side = j & 1 ? 1 : -1; t = j < 4 ? 72 : 64;
      x = p[0] + side * 20; y = p[1] + side * 44;
      s += '<g transform="translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ') rotate(' + t + ')">' +
        E('ellipse', { cx: 0, cy: -16, rx: 13, ry: 21, fill: '#55401f' }) + E('ellipse', { cx: 0, cy: 22, rx: 10, ry: 11, fill: '#55401f' }) +
        E('path', { d: 'M-9 -26h18M-11 -18h22M-11 -10h22M-9 -2h18M-6 20h12M-6 26h12', stroke: '#8a6843', 'stroke-width': 2.4 }) + '</g>';
    });
    return s;
  }
  $('#door').addEventListener('click', function () {
    if (busy) return;
    var box = ER.el('div', 'outv' + (gotScrap ? ' has' : ''));
    box.innerHTML = '<h5>Outside the back door</h5>' + OUT +
      '<p class="say">One thin line in the mud, and it is deep. Something heavy went out this way on one wheel. The boot prints beside it are small.</p>' +
      '<p class="say2">A scrap of paper is lying in the mud. Click on it.</p><div class="got">' + SCRAP + '</div>';
    box.querySelector('#outPrints').innerHTML = printsHtml();
    ER.glossIn(box, '.say, .say2');
    function show() { box.classList.add('has'); box.querySelector('.say2').textContent = 'The wheel has gone over it. You put the scrap in your Notebook.'; }
    if (gotScrap) show();
    box.querySelector('#scrapHot').addEventListener('click', function () {
      if (gotScrap) return;
      gotScrap = true; show(); ER.sfx.paper();
      ER.addClue('scrap1', 'A scrap of paper from the mud', SCRAP, 'scrap', 'Torn paper');
    });
    ER.sfx.paper();
    ER.open('ov-read', box, function () {
      ER.addClue('track', 'Outside the back door', JOT_OUT, 'jot', 'What you saw', true);
      if (!found.out) { found.out = 1; pips(); }
    });
  });

  /* ---------- the two people ---------- */
  $('#bell').addEventListener('click', function () {
    if (busy) return;
    var c = CAST.iris;
    ER.talk({
      who: c.who, role: c.role, face: FACE('iris'), last: briefed ? 'Close' : 'Take the notes and the camera',
      lines: [
        'You&rsquo;re the detective? Good. Iris Bell, Show Secretary. Please don&rsquo;t touch the onions.',
        'At nine o&rsquo;clock we weighed the pumpkins. Mr Pegg&rsquo;s was the heaviest: forty-one kilos. He calls it Gloria. First prize, and the silver cup at three o&rsquo;clock.',
        'At half past nine I checked the tent, as I do every year. Then I tied both doors shut and sat outside the front one, selling programmes. Nobody came past me. Nobody.',
        'At half past eleven I opened the tent again. Three pumpkins. There were four at half past nine.',
        { q: 'Who would want to take a pumpkin?', a: 'I&rsquo;m not saying anything. But Ted Nash has come second for five years. And at about ten o&rsquo;clock I saw him going away across the field with a wheelbarrow.' },
        'Here are my notes from half past nine. I write everything down. And this is the show camera. There are four photographs left in it.',
        'Find four things in this corner that are NOT the same as my notes, and photograph them. Not the pumpkin. I know about the pumpkin.'
      ],
      clue: { id: 'bell', title: 'Mrs Bell, in the show tent' },
      done: function (seen) {
        if (!seen || briefed) return;
        briefed = true; pips();
        ER.read({ html: CHECK, cls: 'check', clue: { id: 'check', title: 'Mrs Bell’s tent check', kind: 'Notes' }, done: giveCamera });
      }
    });
  });
  $('#pegg').addEventListener('click', function () {
    if (busy) return;
    var c = CAST.pegg;
    ER.talk({
      who: c.who, role: c.role, face: FACE('pegg'),
      lines: [
        'Forty-one kilos. I planted her in April. I gave her water every morning, and milk on Sundays.',
        { a: 'I talked to her, too. People laugh. But in June she was only as big as an apple, and look at her now.', note: '' },
        { note: 'He looks at the empty place on the table.', a: 'Well. Don&rsquo;t look at her now.' },
        { q: 'Could one person carry her?', a: 'Carry Gloria? She is heavier than my dog, and he is not a small dog. Two of us lifted her onto that table this morning, and we had to sit down afterwards.' },
        { q: 'When did you last see her?', a: 'At nine o&rsquo;clock, on the scale. Then I went home to put on a clean shirt for the photograph.' }
      ],
      clue: { id: 'pegg', title: 'Mr Pegg, in the show tent' }
    });
  });

  /* ---------- the camera ---------- */
  var ZONES = [['card', 1446, 752, 1540, 822], ['bales', 1404, 632, 1510, 704], ['bales', 740, 696, 894, 774], ['box', 1052, 636, 1240, 756],
    ['gap', 1176, 532, 1308, 566], ['pegg', 1166, 312, 1318, 548], ['pumps', 734, 430, 1176, 570], ['door', 1392, 226, 1582, 690],
    ['scale', 588, 438, 694, 762], ['can', 498, 680, 600, 764], ['flags', 520, 170, 1380, 266], ['bell', 20, 350, 284, 842]];
  function zoneAt(x, y) {
    var ax = 1312, ay = 555, bx = 1401, by = 833, t = ((x - ax) * (bx - ax) + (y - ay) * (by - ay)) / ((bx - ax) * (bx - ax) + (by - ay) * (by - ay)), i, z;
    t = Math.max(0, Math.min(1, t));
    if (Math.hypot(x - (ax + t * (bx - ax)), y - (ay + t * (by - ay))) < 24) return 'plank';
    for (i = 0; i < ZONES.length; i++) {
      z = ZONES[i];
      if (x >= z[1] && x <= z[3] && y >= z[2] && y <= z[4]) return z[0] === 'box' && !found.under ? 'cloth' : z[0];
    }
    return x > 1004 && x < 1320 && y > 566 && y < 756 && !found.under ? 'cloth' : null;
  }
  function placeCam() { cam.style.transform = 'translate(' + cx + 'px,' + cy + 'px)'; }
  function giveCamera() {
    cam.style.display = ''; placeCam(); drawPhotos();
    ER.say('You have the show camera. Drag it over a thing, then click to take the photograph.', 7000);
  }
  (function () {
    var ox = 0, oy = 0;
    ER.drag(cam, {
      start: function (e) { if (busy || solved) return false; var p = ER.pt(svg, e); ox = p.x - cx; oy = p.y - cy; },
      move: function (e, moved) {
        if (!moved) return;
        var p = ER.pt(svg, e); cx = Math.max(110, Math.min(1490, p.x - ox)); cy = Math.max(150, Math.min(778, p.y - oy));
        placeCam(); cam.classList.add('used');
      },
      end: function (e, moved) { if (!moved) snap(); }
    });
  })();
  function flash() {
    ER.sfx.click(); setTimeout(ER.sfx.tick, 90);
    try { $('#flash').animate([{ opacity: 0 }, { opacity: 0.85, offset: 0.15 }, { opacity: 0 }], { duration: 320 }); } catch (e) {}
  }
  function snap() {
    var id = zoneAt(cx, cy);
    if (photos.length >= 4) { ER.say('The camera is empty. Click one of your four photographs to throw it away.'); return; }
    flash();
    if (!id) return ER.say('A photograph of nothing much. You throw it away.');
    if (id === 'cloth') return ER.say('A photograph of a white tablecloth. What is under it?');
    if (id === 'gap') return ER.say('Mrs Bell shakes her head. &ldquo;Not the pumpkin, dear. I know about the pumpkin.&rdquo;');
    if (id === 'pumps') return ER.say('&ldquo;Those three have not moved,&rdquo; says Mrs Bell. &ldquo;I counted them twice.&rdquo;');
    if (id === 'pegg') return ER.say('Mr Pegg tries to smile for the camera. He cannot do it. You do not keep the photograph.');
    if (id === 'bell') return ER.say('&ldquo;Not me, dear,&rdquo; says Mrs Bell. &ldquo;I have not changed since 1987.&rdquo;');
    if (photos.some(function (p) { return p.id === id; })) return ER.say('You already have a photograph of that.');
    photos.push({ id: id, vb: [Math.round(cx - 120), Math.round(cy - 90), 240, 180] });
    drawPhotos();
    ER.say(photos.length < 4 ? 'Click. Photograph ' + photos.length + ' of 4: ' + NAMES[id] + '.' : 'Click. That is the last one: ' + NAMES[id] + '. Now show Mrs Bell.', 3200);
  }
  function drawPhotos() {
    var s = E('path', { d: 'M22 190Q255 212 488 190', stroke: '#8a6a3a', 'stroke-width': 3, fill: 'none' }), i, p, x;
    for (i = 0; i < 4; i++) {
      x = 86 + i * 111; p = photos[i];
      if (p) {
        s += '<g class="pol hot" data-i="' + i + '" transform="translate(' + x + ' 206) rotate(' + [-3, 2, -1.5, 3][i] + ')">' +
          E('rect', { x: -45, y: 4, width: 96, height: 118, fill: '#000', opacity: 0.2 }) + E('rect', { x: -48, y: 0, width: 96, height: 118, fill: '#fffdf6' }) +
          E('svg', { x: -42, y: 7, width: 84, height: 63, viewBox: p.vb.join(' '), preserveAspectRatio: ['xMidYMid', 'slice'].join(' ') }, E('use', { href: '#world' })) +
          E('rect', { x: -42, y: 7, width: 84, height: 63, fill: 'none', stroke: '#cfc8b4', 'stroke-width': 1 }) +
          E('text', { x: 0, y: 93, 'class': 'polT' }, NAMES[p.id]) + E('text', { x: 0, y: 110, 'class': 'polX' }, 'THROW AWAY') + '</g>';
      }
      s += E('rect', { x: x - 4, y: 192 + (i === 0 || i === 3 ? 2 : 6), width: 8, height: 20, rx: 2, fill: '#c08d52', stroke: '#8f6030', 'stroke-width': 1 });
    }
    $('#photos').innerHTML = s;
    $('#show').classList.toggle('on', photos.length === 4 && !solved);
  }
  $('#photos').addEventListener('click', function (e) {
    var g = e.target.closest ? e.target.closest('.pol') : null;
    if (!g || busy || solved) return;
    photos.splice(+g.getAttribute('data-i'), 1); ER.sfx.paper(); drawPhotos();
    ER.say('You throw that photograph away. The camera has room for another.', 2600);
  });
  $('#show').addEventListener('click', function () {
    if (busy || solved || photos.length < 4) return;
    if (!found.under) return ER.say('&ldquo;Have you looked under the table?&rdquo; says Mrs Bell. &ldquo;My notes say there was a box there.&rdquo;');
    if (!found.out) return ER.say('&ldquo;And the back door?&rdquo; says Mrs Bell. &ldquo;Go and look outside it first.&rdquo;');
    var ids = photos.map(function (p) { return p.id; }).sort(), n = 0, bad = null;
    if (ER.exit([ids.join('+')], { delay: 6400 })) {
      solved = true; busy = true; pips();
      $('#show').classList.remove('on'); cam.style.opacity = 0;
      ER.say('Mrs Bell puts the four photographs in a row and looks at them for a long time. Then she looks at the grass outside the back door. &ldquo;Somebody has been busy,&rdquo; she says.', 6400);
      return;
    }
    photos.forEach(function (p) { if (ER.check('changed', p.id)) n++; else if (!bad) bad = p; });
    ER.sfx.no();
    ER.say('Mrs Bell looks at the four photographs. &ldquo;' + ['None', 'One', 'Two', 'Three'][n] + ' of these ' + (n === 1 ? 'is' : 'are') +
      ' different from my notes,&rdquo; she says. &ldquo;Look at ' + NAMES[bad.id] + ' again, and read number ' + NOTE[bad.id] + '.&rdquo;', 9000);
  });
})();
</script>
