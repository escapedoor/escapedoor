<style>
  body{--bg:#77ad3d;--accent:#d2452f;--font-display:'Alfa Slab One',serif;--font-ui:'Oswald',sans-serif;--font-body:'Outfit',Arial,sans-serif;
    --tc-bg:linear-gradient(#fdf3d6 0,#fbe3b4 100%);--tc-ink:#33291c;
    --cap-bg:rgba(255,250,236,.97);--cap-ink:#33291c;--panel:#fffaf0;--panel-ink:#33291c;
    --hud-bg:rgba(255,250,236,.86);--hud-ink:#33291c;--hud-line:rgba(51,41,28,.3);--ov-bg:rgba(46,36,20,.72);--fade:#fdf3d6}
  .tc-theme{color:#b3372b}
  .tc-room{font-size:clamp(36px,5.6vw,74px);color:#b3372b}
  .tc .btn{--accent:#b3372b}
  .tc .btn:hover:not([disabled]){color:#fffaf0}
  .cap{box-shadow:0 14px 44px rgba(60,40,10,.35)}
  .cap em{color:#b3372b}
  .crdT{font-family:'Patrick Hand',cursive;font-size:13px;fill:#1f2f63;text-anchor:middle}
  .crdB{font-family:'Oswald',sans-serif;font-weight:700;font-size:9px;letter-spacing:1px;fill:#fff;text-anchor:middle}
  .rosT{font-family:'Alfa Slab One',serif;font-size:13px;fill:#b3372b;text-anchor:middle}
  .banT{font-family:'Alfa Slab One',serif;font-size:25px;letter-spacing:2px;fill:#2c6a3f;text-anchor:middle}
  .cl{animation:drift 100s linear infinite}.cl.c2{animation-duration:140s;animation-delay:-60s}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(500px)}}
  .flag{animation:flag 3s ease-in-out infinite alternate}
  @keyframes flag{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
  .steam{animation:steam 3.4s ease-in-out infinite}.steam.s2{animation-delay:-1.2s}.steam.s3{animation-delay:-2.3s}
  @keyframes steam{0%{opacity:0;transform:translateY(12px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-34px)}}
  .note{animation:note 5s linear infinite;opacity:0}
  .note.n2{animation-delay:-1.7s}.note.n3{animation-delay:-3.3s}
  @keyframes note{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(46px,-110px) rotate(16deg)}}
  .glint{animation:glint 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes glint{0%,70%,100%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1)}}
  .bub{animation:bub 4s ease-in infinite;opacity:0}
  .bub.b2{animation-delay:-1.3s}.bub.b3{animation-delay:-2.6s}
  @keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
  .pen{animation:pen 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
  @keyframes pen{from{transform:skewY(-5deg)}to{transform:skewY(6deg)}}

  /* the evening paper */
  .gaz{position:fixed;right:3vw;top:64px;z-index:34;width:min(436px,92vw);padding:18px 26px 18px;background:#fbf6e8;color:#2b241a;display:none;transform:rotate(1deg);
    box-shadow:0 20px 60px rgba(40,30,10,.5);border-top:6px double #2b241a;border-bottom:6px double #2b241a}
  .gaz.on{display:block}
  .gaz-mast{font-family:'IM Fell English SC',serif;font-size:31px;line-height:1;text-align:center;letter-spacing:.02em}
  .gaz-date{margin:6px 0 10px;padding:3px 0;border-top:1px solid #2b241a;border-bottom:1px solid #2b241a;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;text-align:center}
  .gaz h1{margin:0 0 6px;font-family:'Alfa Slab One',serif;font-weight:normal;font-size:33px;line-height:1.05;text-align:center;color:#b3372b}
  .gaz-sub{margin:0 0 10px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;line-height:1.25;text-align:center}
  .gaz p.ln{margin:0 0 5px;font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.3}
  .gaz .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .gaz .btn{--accent:#2b241a;font-size:13px;padding:8px 13px}.gaz .btn:hover{color:#fbf6e8}
  .gaz small{display:block;margin-top:11px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .gaz small button{text-decoration:underline;letter-spacing:.14em;text-transform:uppercase}
  .gaz .w:hover{color:#b3372b}

  /* the kitchen pad */
  .pad{width:min(720px,94vw);max-height:84vh;overflow:auto;background:#fffbe9;color:#2b241a;padding:0 36px 24px;box-shadow:0 26px 70px rgba(0,0,0,.5);
    border-radius:3px;-webkit-user-select:text;user-select:text}
  .pad h4{margin:0 -36px 16px;padding:14px 36px 12px;background:#1f7a76;color:#fffbe9;font-family:'Pacifico',cursive;font-weight:normal;font-size:24px}
  .pad label{display:block;margin:14px 0 6px;font-size:19px;font-weight:500;line-height:1.35}
  .pad textarea,.pad input[type=text]{width:100%;font-family:'Patrick Hand','Caveat',cursive;font-size:23px;line-height:1.35;color:#23335e;background:#fff;border:1px solid #cdbf9d;
    padding:8px 12px;border-radius:2px;resize:vertical;-webkit-user-select:text;user-select:text}
  .pad textarea{min-height:104px}
  .pad .count{margin-top:4px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;text-align:right}
  .pad .foot{display:flex;gap:10px;align-items:center;margin-top:14px}
  .pad .foot span{flex:1;font-size:16px;font-style:italic;opacity:.7}
  .pad .btn{--accent:#1f7a76}.pad .btn:hover{color:#fffbe9}
  @media print{
    body{overflow:visible;background:#fff}
    body>*:not(.ov){display:none!important}
    .ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
    .ov-bar,.pad .foot{display:none!important}
    .pad{box-shadow:none;max-height:none;width:auto;overflow:visible}
    .pad textarea,.pad input[type=text]{border:0;border-bottom:1px solid #999}
  }
</style>
</head>

<div class="gaz" id="gaz">
  <div class="gaz-mast">The Wickerby Gazette</div>
  <div class="gaz-date">Show day &middot; late news &middot; one penny</div>
  <h1>Prize pumpkin in the soup</h1>
  <p class="gaz-sub" id="g-sub">And so is Alfie Pringle, aged eleven. He is washing up until five o&rsquo;clock.</p>
  <p class="ln" id="g-time"></p><p class="ln" id="g-hints"></p><p class="ln" id="g-words"></p>
  <div class="row"><button type="button" class="btn" id="b-write">Write Gran&rsquo;s note again</button><button type="button" class="btn" id="b-book">Open the notebook</button><button type="button" class="btn" id="b-lobby">Back to the case files</button></div>

<script src="../../assets/engine.js"></script>
<script>
(function () {
  var $ = ER.$;
  function E(n, a, inner) {
    var s = '<' + n, k;
    for (k in a) s += ' ' + k + '="' + a[k] + '"';
    return s + (inner == null ? '/>' : '>' + inner + '</' + n + '>');
  }
  (function () {
    var s = 'M-1000 560V524', x, i, a, b, t, an, pts, cols = ['#d2452f', '#f2c230', '#3a7fb8', '#6ea83c', '#fff8e2', '#e9832b'], seg;
    for (x = -1000; x < 2600; x += 36) s += 'q18-22 36 0';
    $('#hedge').setAttribute('d', s + 'V560Z'); s = '';
    for (i = -9; i < 9; i++) {
      if (i & 1) continue;
      a = i * 200; b = (i + 1) * 200;
      s += E('path', { d: 'M' + (700 + a * 0.6).toFixed(0) + ' 536L' + (700 + b * 0.6).toFixed(0) + ' 536L' + (700 + b * 1.7).toFixed(0) + ' 1500L' + (700 + a * 1.7).toFixed(0) + ' 1500Z' });
    }
    $('#stripes').innerHTML = s; s = '';
    for (i = 0; i < 90; i++) {
      x = (i * 577) % 1700 - 60; t = 560 + (i * 331) % 330;
      s += 'M' + x + ' ' + t + 'l-4-9M' + x + ' ' + t + 'l1-11M' + x + ' ' + t + 'l5-8';
    }
    $('#tufts').innerHTML = E('path', { d: s, stroke: '#5f9d38', 'stroke-width': 2.4, 'stroke-linecap': 'round', fill: 'none' }); s = '';
    /* flags from the tent to the church to the oak */
    [[[96, 290], [364, 244], 34], [[364, 244], [1010, 250], 78], [[1010, 250], [1330, 300], 40]].forEach(function (g) {
      var n = Math.round((g[1][0] - g[0][0]) / 38), p = [], j;
      for (j = 0; j <= n; j++) { t = j / n; p.push([g[0][0] + (g[1][0] - g[0][0]) * t, g[0][1] + (g[1][1] - g[0][1]) * t + g[2] * Math.sin(Math.PI * t)]); }
      s += E('path', { d: 'M' + p.map(function (q) { return q[0].toFixed(0) + ' ' + q[1].toFixed(1); }).join('L'), stroke: '#8a6a3a', 'stroke-width': 2.5, fill: 'none' });
      for (j = 0; j < n; j++) {
        a = p[j]; b = p[j + 1]; an = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
        s += '<g transform="translate(' + ((a[0] + b[0]) / 2).toFixed(1) + ' ' + ((a[1] + b[1]) / 2).toFixed(1) + ') rotate(' + an.toFixed(1) + ')">' +
          E('path', { 'class': 'flag', d: 'M-15 0H15L0 36Z', fill: cols[j % 6], style: 'animation-delay:' + (-(j * 0.41) % 3).toFixed(2) + 's' }) + '</g>';
      }
    });
    $('#bunt').innerHTML = E('path', { d: 'M1010 250V540', stroke: '#fbf6e8', 'stroke-width': 7 }) + E('circle', { cx: 1010, cy: 246, r: 7, fill: '#f4c430' }) + s; s = '';
    for (i = 0; i < 14; i++) { an = i * Math.PI / 7; s += E('circle', { cx: (Math.cos(an) * 21).toFixed(1), cy: (Math.sin(an) * 21).toFixed(1), r: 6 }); }
    $('#pleat').innerHTML = s;
    /* Bruce, with his blue rosette */
    s = E('ellipse', { cx: 862, cy: 594, rx: 60, ry: 7, fill: '#000', opacity: 0.16 }) + E('ellipse', { cx: 862, cy: 546, rx: 62, ry: 47, fill: '#c9571a' });
    [-2, 2, -1, 1, 0].forEach(function (k) {
      var q = Math.abs(k);
      s += E('ellipse', { cx: 862 + k * 20, cy: 546, rx: 62 * (0.47 - q * 0.075), ry: 47 * (1 - q * 0.04), fill: q === 2 ? '#c9571a' : (q ? '#e2701f' : '#ec8530'), stroke: '#c9571a', 'stroke-width': 1.4 });
    });
    s += E('path', { d: 'M856 502q-4-14 8-20l7 5q-7 5-4 15z', fill: '#6f7a34' }) +
      '<g transform="translate(904 568)">' + E('path', { d: 'M-8 10l-6 28 10-8 4 9 4-9 10 8-6-28z', fill: '#24558f' }) + E('circle', { r: 15, fill: '#2f6fb5' }) + E('circle', { r: 9, fill: '#f4f1e8' }) + '</g>';
    $('#bruce').innerHTML = s;
  })();

  ER.init({
    theme: 'mystery', story: 'gloria', storyTitle: 'Where Is Gloria?', id: 'prize', no: 'IV', title: 'Three o’clock',
    go: 'Go out onto the green',
    intro: [
      'You pin the red rosette on the big pot.',
      'Gran wanted the little pumpkin in the green box under the table. Alfie read half a note, and took the big one on the table. Dot cut it up with a borrowed saw and made the best soup of her life.',
      'Nobody stole Gloria. Wickerby ate her, at one pound a cup, and came back for more.'
    ],
    exit: {"last":true,"rooms":4,"stars":2}, tags: {},
    onBegin: begin
  });

  function begin() {
    var st = ER.state();
    if (!ER.flag('tEnd')) ER.flag('tEnd', Date.now());
    setTimeout(ER.sfx.bell, 700);
    ER.narrate([
      'Three o&rsquo;clock on the village green. The band plays something slow.',
      'Mrs Bell reads the rules of Class 12 twice. They say &ldquo;heaviest pumpkin&rdquo;. They do not say it has to be in one piece. Gloria weighed forty-one kilos at nine o&rsquo;clock this morning. First prize.',
      'Mr Nash is second, for the sixth year. He says he does not mind. He has eaten five cups of the winner.',
      'Mr Pegg tastes the soup at last. He says it needs salt.',
      'Then he takes an envelope out of his pocket, goes back to the wheelbarrow, and picks up the seeds. Every one of them.'
    ], function () {
      var mins = Math.max(1, Math.round((ER.flag('tEnd') - (st.t0 || ER.flag('tEnd'))) / 60000)), hn = ER.hintsUsed();
      $('#g-time').textContent = 'Day-off detective finds Gloria in ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
      $('#g-hints').textContent = hn ? 'Hints asked for: ' + hn + '.' : 'The detective did not ask for a single hint.';
      $('#g-words').textContent = 'In the notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' new words.';
      $('#gaz').classList.add('on'); ER.sfx.ok();
    });
  }
  ER.glossIn($('#gaz'), 'h1, .gaz-sub');
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* writing: the note, done properly */
  $('#b-write').addEventListener('click', function () {
    var saved = ER.flag('pad') || {}, box = ER.el('div', 'pad');
    box.innerHTML = '<h4>Tea tent &middot; kitchen pad</h4>' +
      '<label for="w1">1. Gran&rsquo;s note went wrong when half of it was lost. Write it again for her. Say which pumpkin, and where it is, in the first sentence.</label><textarea id="w1" placeholder="Alfie! &hellip;"></textarea>' +
      '<label for="w2">2. Alfie has to say sorry to Mr Pegg. Write his note for him: what he did, why he did it, and what he will do now.</label><textarea id="w2" placeholder="Dear Mr Pegg, &hellip;"></textarea>' +
      '<label for="w3">Signed</label><input type="text" id="w3" maxlength="60">' +
      '<div class="count"></div><div class="foot"><span>Saved in this browser as you type.</span><button type="button" class="btn" id="w-print">Print</button><button type="button" class="btn" id="w-done">Done</button></div>';
    ER.glossIn(box, 'label');
    ['w1', 'w2', 'w3'].forEach(function (k) { box.querySelector('#' + k).value = saved[k] || ''; });
    function keep() {
      var o = {}, n = 0;
      ['w1', 'w2', 'w3'].forEach(function (k) { o[k] = box.querySelector('#' + k).value; });
      ['w1', 'w2'].forEach(function (k) { n += o[k].split(/\s+/).filter(function (w) { return /[A-Za-z]/.test(w); }).length; });
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('pad', o);
    }
    box.addEventListener('input', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#w-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#w-done').addEventListener('click', ER.close);
    ER.open('ov-pad', box); keep();
  });
})();
</script>
