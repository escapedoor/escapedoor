  .tc-theme{color:#3d7a2c}
  .tc-room{font-weight:700;font-size:clamp(58px,9vw,124px);letter-spacing:.04em;line-height:.95;margin-bottom:20px;color:#3d7a2c}
  .tc .btn,.tk .btn{--accent:#3d7a2c}
  .tc .btn:hover:not([disabled]),.tk .btn:hover:not([disabled]){color:#fbfdf2}
  .cap{border-top-color:#3d7a2c;box-shadow:0 14px 44px rgba(30,50,20,.35)}
  .cap em{color:#3d7a2c}
  .tk{border-color:#bcd29a}
  .tk-name{font-weight:700;font-size:40px;letter-spacing:.04em;line-height:1;color:#3d7a2c}
  .tk-role{color:#b0731a}
  .hbtn.hnt{color:#f4c430;border-color:#f4c430}

  .postT{font-family:'Amatic SC',cursive;font-weight:700;font-size:21px;letter-spacing:1px;fill:#3a2a14;text-anchor:middle}
  .nameT{font-family:'Amatic SC',cursive;font-weight:700;fill:#fbfdf2;text-anchor:middle}
  .cardT{font-family:'Oswald',sans-serif;font-weight:600;font-size:6.500px;fill:#2b2a20;text-anchor:middle}
  .cl{animation:drift 90s linear infinite}
  .cl.c2{animation-duration:130s;animation-delay:-50s}.cl.c3{animation-duration:110s;animation-delay:-80s}
  @keyframes drift{from{transform:translateX(-360px)}to{transform:translateX(420px)}}
  .steam{animation:steam 3.6s ease-in-out infinite}
  .steam.s2{animation-delay:-1.4s}.steam.s3{animation-delay:-2.5s}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.85}100%{opacity:0;transform:translateY(-26px)}}
  .flow{stroke-dasharray:16 46;animation:flow 6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-124}}
  .bob{animation:bob 3.4s ease-in-out infinite alternate}
  .bob.b2{animation-duration:2.7s;animation-delay:-1s}
  @keyframes bob{from{transform:translate(0,0)}to{transform:translate(7px,2px)}}
  .sleeve{animation:sleeve 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 0}
  @keyframes sleeve{from{transform:rotate(-4deg)}to{transform:rotate(7deg)}}
  .nod{animation:nod 4.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
  .nod.n2{animation-duration:3.3s;animation-delay:-1.3s}
  @keyframes nod{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}
  .fly{animation:fly1 19s linear infinite}
  .fly.f2{animation:fly2 24s linear infinite;animation-delay:-9s}
  .fly.f3{animation:fly1 28s linear infinite;animation-delay:-15s}
  @keyframes fly1{0%{transform:translate(0,0)}20%{transform:translate(120px,-70px)}40%{transform:translate(260px,-10px)}60%{transform:translate(180px,90px)}80%{transform:translate(40px,60px)}100%{transform:translate(0,0)}}
  @keyframes fly2{0%{transform:translate(0,0)}25%{transform:translate(-140px,50px)}50%{transform:translate(-240px,-40px)}75%{transform:translate(-90px,-90px)}100%{transform:translate(0,0)}}
  .wing{animation:wing .28s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
  @keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
  .peck{animation:peck 2.2s steps(2) infinite;transform-box:fill-box;transform-origin:50% 100%}
  .peck.p2{animation-delay:-.8s}.peck.p3{animation-delay:-1.5s;animation-duration:3s}
  @keyframes peck{50%{transform:rotate(14deg)}}
  .stone .ringp{opacity:0;transform-box:fill-box;transform-origin:center}
  .stone.next .ringp{animation:ringp 1.5s ease-out infinite}
  @keyframes ringp{from{opacity:.95;transform:scale(.55)}to{opacity:0;transform:scale(1.25)}}
  .stone.next .st{fill:#fff6cf}
  .trail{opacity:0;transition:opacity .3s}
  .trail.on{opacity:1}
  #tanHot{animation:tanGlow 3s steps(3) infinite}
  #tanHot.done{animation:none}
  @keyframes tanGlow{50%{filter:brightness(1.1)}}
  #caught{opacity:0;transition:opacity .8s}
  #caught.on{opacity:1}
  .gobtn{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:35;display:none;padding:13px 30px;border:2px solid #3d7a2c;
    color:#fbfdf2;background:#3d7a2c;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.16em;text-transform:uppercase;border-radius:4px;
    box-shadow:0 8px 22px rgba(20,40,20,.4)}
  .gobtn.on{display:block}
  .gobtn:hover{background:#f4c430;border-color:#f4c430;color:#27331c}
</style>
</head>
