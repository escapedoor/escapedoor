<style>
  body{--bg:#b98f58;--accent:#f6b93b;--font-display:'Pacifico',cursive;--font-ui:'Oswald',sans-serif;--font-body:'Outfit',Arial,sans-serif;
    --tc-bg:repeating-linear-gradient(90deg,#fdf5e3 0 100px,#f9ddd0 100px 200px);--tc-ink:#3a2a22;
    --cap-bg:rgba(255,250,240,.97);--cap-ink:#3a2a22;--panel:#fffaf0;--panel-ink:#3a2a22;--q-ink:#1f7a76;
    --hud-bg:rgba(22,70,68,.9);--hud-ink:#fff8ea;--hud-line:rgba(255,248,234,.38);--ov-bg:rgba(40,24,18,.74);--fade:#fdf5e3}
  .tc-theme{color:#1f7a76}
  .tc-room{font-size:clamp(40px,6.2vw,84px);line-height:1.15;margin:6px 0 22px;color:#c2452f}
  .tc .btn,.tk .btn{--accent:#1f7a76}
  .tc .btn:hover:not([disabled]),.tk .btn:hover:not([disabled]){color:#fffaf0}
  .cap{border-top-color:#c2452f;box-shadow:0 14px 44px rgba(60,30,20,.35)}
  .cap em{color:#c2452f}
  .tk{border-color:#e3c9b4}
  .tk-name{font-size:27px;line-height:1.3;color:#c2452f}
  .tk-role{color:#1f7a76}

  .chalkH{font-family:'Pacifico',cursive;font-size:27px;fill:#fdf8ec;text-anchor:middle}
  .chalk{font-family:'Patrick Hand',cursive;font-size:21px;fill:#f3eede;text-anchor:middle}
  .chalkB{font-family:'Alfa Slab One',serif;font-size:26px;letter-spacing:1px;fill:#f6a03a;text-anchor:middle}
  .rosT{font-family:'Alfa Slab One',serif;font-size:17px;fill:#b3372b;text-anchor:middle;pointer-events:none}
  .bulb{animation:bulb 3.2s ease-in-out infinite}
  .bulb.b2{animation-delay:-1.1s}.bulb.b3{animation-delay:-2.2s}
  @keyframes bulb{50%{opacity:.55}}
  .steam{animation:steam 3.4s ease-in-out infinite}
  .steam.s2{animation-delay:-1.2s}.steam.s3{animation-delay:-2.3s}.steam.s4{animation-delay:-.6s;animation-duration:4.2s}
  @keyframes steam{0%{opacity:0;transform:translateY(12px)}30%{opacity:.75}100%{opacity:0;transform:translateY(-34px)}}
  #wasp{animation:wasp 9s linear infinite}
  @keyframes wasp{0%{transform:translate(0,0)}25%{transform:translate(34px,-22px)}50%{transform:translate(70px,6px)}75%{transform:translate(30px,26px)}100%{transform:translate(0,0)}}
  #flapR{animation:flapR 5s ease-in-out infinite alternate;transform-origin:1556px 250px}
  @keyframes flapR{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
  #wheelHot{animation:glow 2.6s ease-in-out infinite}
  #wheelHot.done{animation:none}
  @keyframes glow{50%{filter:brightness(1.25)}}
  #ros{display:none}
  #ros.given{display:block}
  #ros .halo{animation:halo 1.7s ease-out infinite;transform-box:fill-box;transform-origin:center}
  #ros.on .halo{animation:none;opacity:0}
  @keyframes halo{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.3)}}
  .gobtn{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:35;display:none;padding:13px 30px;border:2px solid #1f7a76;
    color:#fff8ea;background:#1f7a76;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.16em;text-transform:uppercase;border-radius:4px;
    box-shadow:0 8px 22px rgba(40,24,18,.4)}
  .gobtn.on{display:block}
  .gobtn:hover{background:#f6b93b;border-color:#f6b93b;color:#3a2a22}

  /* the note, in pieces, on the counter */
  .jig{width:min(1090px,95vw);background:#fffaf0;padding:14px 16px 12px;box-shadow:0 26px 70px rgba(0,0,0,.6);border-radius:4px}
  .jig-say{margin:0 4px 10px;font-size:19px;line-height:1.4;color:#3a2a22}
  .jig svg{display:block;width:100%;height:auto;border-radius:3px;touch-action:none}
  .jig-msg{margin:9px 4px 0;min-height:27px;font-size:19px;font-style:italic;color:#c2452f}
  .pc{cursor:grab;touch-action:none}
  .pc.on{cursor:grabbing}
  .pc.home{cursor:default}
  .pcT{font-family:'Caveat',cursive;font-weight:700;font-size:31px;fill:#23335e;pointer-events:none}
  .tape{opacity:0;transition:opacity .7s}
  .jig.done .tape{opacity:.8}
  .jig.done .slot{opacity:0}
</style>
</head>

            lay.insertBefore(p.g, lay.firstChild);
            if (!left()) { mended(box); return; }
          } else if (near) { msg.textContent = 'It is in the right place, but the wrong way up. Click it to turn it.'; return; }
          tell();
        }
      });
    });
    tell();
    ER.open('ov-lock', box);
  }
  function mended(box) {
    noteDone = true; busy = true; pips(); ready(); ER.sfx.ok();
    box.classList.add('done');
    box.querySelector('.jig-msg').textContent = 'The note is whole again. Read it.';
    ER.addClue('note', 'Gran’s note, mended', WHOLE, 'gnote', 'Note');
    setTimeout(function () {
      ER.closeAll();
      ER.read({ html: WHOLE, cls: 'gnote', done: function () {
        ER.narrate([
          'Alfie reads the whole note over your shoulder. His lips move.',
          '&ldquo;Under,&rdquo; he says, very quietly. &ldquo;It says under.&rdquo;',
          'Somebody is standing behind you. It is Mrs Bell, with Mr Pegg, and she is holding a red rosette. &ldquo;Well?&rdquo; she says. &ldquo;You followed the wheel. Where is Gloria?&rdquo;',
          'She puts the rosette into your hand. &ldquo;First prize goes on the winner. Go and pin it on her.&rdquo;'
        ], function () { busy = false; pinning = true; ros.classList.add('given'); });
      } });
    }, 2600);
  }
  $('#noteBtn').addEventListener('click', function () { if (!busy) openNote(); });

  /* ---------- first prize: pin it on Gloria ---------- */
  var ZONES = [['bucket', 926, 700, 1046, 834], ['saw', 902, 540, 1022, 580], ['cups', 384, 480, 478, 566], ['cake', 484, 496, 580, 572],
    ['tomato', 686, 456, 766, 562], ['pot', 730, 280, 968, 562], ['dot', 496, 346, 676, 562], ['nash', 170, 372, 384, 850], ['alfie', 1034, 448, 1250, 850],
    ['barrow', 1290, 600, 1620, 820], ['board', 22, 220, 238, 530]];
  function zoneAt(x, y) {
    for (var i = 0; i < ZONES.length; i++) if (x >= ZONES[i][1] && x <= ZONES[i][3] && y >= ZONES[i][2] && y <= ZONES[i][4]) return ZONES[i][0];
    return null;
  }
  (function () {
    var ox = 0, oy = 0, x = RX, y = RY;
    ER.drag(ros, {
      start: function (e) { if (busy || solved || !pinning) return false; var p = ER.pt(svg, e); ox = p.x - RX; oy = p.y - RY; },
      move: function (e, moved) { if (!moved) return; var p = ER.pt(svg, e); x = p.x - ox; y = p.y - oy; ros.style.transform = 'translate(' + x + 'px,' + y + 'px)'; },
      end: function (e, moved) {
        var id = moved ? zoneAt(x, y) : null;
        if (!moved) return ER.say('The first-prize rosette. Drag it onto Gloria, wherever she is now.');
        if (!id) { home(); return ER.say('You cannot pin a rosette on nothing. Drag it onto a thing.'); }
        ER.sfx.click();
        if (ER.exit([id], { delay: 7600 })) {
          solved = true; busy = true;
          ER.say('You pin the red rosette on ' + NAMES[id] + '. ' + REPLY[id], 7600);
          return;
        }
        ER.sfx.no(); home();
        ER.say(REPLY[id], 7000);
      }
    });
    function home() { x = RX; y = RY; ros.style.transform = 'translate(' + RX + 'px,' + RY + 'px)'; }
  })();
})();
</script>
