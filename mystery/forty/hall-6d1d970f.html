<script>
(function () {
  var $ = ER.$, svg = $('#scene'), busy = false, briefed = false, phase = 0, clockT = 0;

  /* panelling, floor tiles, dial */
  (function () {
    var s = '', x, r, k, a, b, y0, y1, vx = 800, vy = 430, rows = [762, 786, 818, 856, 900], W = 150, i, an;
    for (x = -980; x < 2600; x += 180) s += '<rect x="' + (x + 14) + '" y="538" width="152" height="186"/><rect x="' + (x + 28) + '" y="552" width="124" height="158" opacity=".5"/>';
    $('#panels').innerHTML = s; s = '';
    function X(off, y) { return (vx + off * (y - vy) / (900 - vy)).toFixed(1); }
    for (r = 0; r < rows.length - 1; r++) {
      y0 = rows[r]; y1 = rows[r + 1];
      for (k = -18; k < 18; k++) {
        if ((k + r) & 1) continue;
        a = k * W; b = (k + 1) * W;
        s += '<path d="M' + X(a, y0) + ' ' + y0 + 'L' + X(b, y0) + ' ' + y0 + 'L' + X(b, y1) + ' ' + y1 + 'L' + X(a, y1) + ' ' + y1 + 'Z" opacity="' + (0.34 + r * 0.1) + '"/>';
      }
    }
    $('#tiles').innerHTML = s; s = '';
    for (i = 0; i < 12; i++) {
      an = i * Math.PI / 6;
      s += '<path d="M' + (684 + Math.sin(an) * 36).toFixed(1) + ' ' + (240 - Math.cos(an) * 36).toFixed(1) + 'L' + (684 + Math.sin(an) * 42).toFixed(1) + ' ' + (240 - Math.cos(an) * 42).toFixed(1) + '"/>';
    }
    $('#ticks').innerHTML = s;
  })();

  /* keys on the board */
  var KEYS = [['hum', 1378, 176], ['drip', 1432, 176], ['tock', 1486, 176], ['ding', 1540, 176],
              ['creak', 1405, 304], ['tick', 1459, 304], ['hiss', 1513, 304]];
  (function () {
    var s = '';
    KEYS.forEach(function (k) {
      var x = k[1], y = k[2];
      s += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="#1a0f08"/>' +
        '<g class="key drag" data-k="' + k[0] + '">' +
        '<circle cx="' + x + '" cy="' + (y + 11) + '" r="8.5" fill="none" stroke="#c79b3b" stroke-width="4.5"/>' +
        '<path d="M' + x + ' ' + (y + 20) + 'V' + (y + 60) + 'M' + x + ' ' + (y + 47) + 'h10M' + x + ' ' + (y + 56) + 'h8" stroke="#b8923a" stroke-width="4.5" stroke-linecap="round" fill="none"/>' +
        '<g transform="rotate(-5 ' + x + ' ' + (y + 80) + ')">' +
        '<rect class="tagbg" x="' + (x - 25) + '" y="' + (y + 68) + '" width="50" height="25" rx="4" fill="url(#tagG)" stroke="#6f531a" stroke-width="1.5"/>' +
        '<text x="' + x + '" y="' + (y + 86) + '" class="tagtxt">' + k[0].toUpperCase() + '</text></g>' +
        '<rect x="' + (x - 27) + '" y="' + (y - 2) + '" width="54" height="98" fill="transparent"/></g>';
    });
    $('#keys').innerHTML = s;
  })();

  ER.init({
    theme: 'mystery', story: 'forty', storyTitle: 'Forty Minutes of Dark', id: 'hall', no: 'II', title: 'The Hall',
    go: 'Shake off the rain',
    intro: [
      'The bolt slides back. PC Marsh lets you in out of the rain and bolts the door again behind you.',
      'The hall smells of dust, parcel tape and old wood. Against the wall a tall clock goes on counting, as it has since long before there was a museum here.'
    ],
    exit: {"next":"chart","w":{"eb3d2067":"411bd9cb"}}, tags: {},
    hints: hints,
    onBegin: begin
  });

  var NOTES = '<h4>PC Marsh. Notes, 9.10 p.m.</h4>' +
    '<p><b>FRONT DOOR.</b> Bolted on the inside. The bell works.</p>' +
    '<p><b>CHART ROOM WINDOW.</b> Painted shut. Not opened in years.</p>' +
    '<p><b>GLASS CASE.</b> Door found open. Lock not broken. No scratches on the brass or inside the keyhole. In my opinion it was opened with its key.</p>' +
    '<p><b>KEY TO THE CASE.</b> One exists. Mrs Okafor wears it on a green cord.</p>' +
    '<p><b>DUST SHEET.</b> On the floor beside the case. Dry. Not torn.</p>' +
    '<p><b>MRS SORLEY&rsquo;S BAG.</b> Knitting. Keys with a small torch. A letter dated 3 May 1961, signed T. Harland. Old brown ink, very faint. I could not read it by torchlight.</p>' +
    '<p><b>MR PYM&rsquo;S COAT.</b> One brass harbour whistle, museum label no. 214. Value &pound;5. He says: &ldquo;Thirty-one years. I wanted one thing.&rdquo;</p>' +
    '<p><b>MR REYES&rsquo;S RUCKSACK.</b> Sandwiches. Parcel tape. A phone. Yesterday he looked up the price of a marine chronometer.</p>' +
    '<p><b>MRS OKAFOR&rsquo;S HANDBAG.</b> Purse. Reading glasses. Keys to the building.</p>' +
    '<p><b>CELLAR.</b> 22 crates, sealed and listed. Not opened.</p>' +
    '<p><b>CHRONOMETER.</b> Not found. There are two of us and twenty-two sealed crates. Before we break one seal, tell us where to look.</p>';
  var CARD = '<h4>My keys</h4>' +
    '<p>I never could remember numbers. So every key on this board is named for the sound of its room.</p>' +
    '<p>Thirty-one years, and I have not once picked up the wrong one.</p>' +
    '<p>D. Pym</p>';

  function hints() {
    if (!briefed) return ['marsh', [
      'PC Marsh is waiting for you. Click on him, and listen to everything he says.',
      'Keep clicking Next until he gives you his notebook. Read the notebook too.'
    ]];
    return ['key', [
      'The Chart Room door is locked, and the keys are on the board beside it. Read the little card under the board.',
      'Every key is named for the sound of its room. What did PC Marsh say you could hear from the Chart Room door? His words are in your Notebook.',
      'The chronometer in the Chart Room ticks. The big clock in this hall goes &ldquo;tock&rdquo;. Drag the right key onto the keyhole of the Chart Room door.'
    ]];
  }
  function begin() {
    clockT = setInterval(beat, 100);
    ER.narrate(['PC Marsh shuts his notebook, opens it again, and waits for you to speak first.']);
  }
  /* the tall clock: one slow tock a second. And, very quietly, something quicker. */
  function beat() {
    phase = (phase + 1) % 10;
    if (phase === 0) { ER.sfx.tock(0.55); puff('#tockTxt', 0.5, 900); }
    if (phase === 2 || phase === 7) { ER.sfx.tick(0.16); puff('#tickTxt', 0.2, 380); }
  }
  function puff(sel, op, ms) {
    try { $(sel).animate([{ opacity: 0 }, { opacity: op, offset: 0.2 }, { opacity: 0 }], { duration: ms }); } catch (e) {}
  }

  function thing(sel, word, line) {
    $(sel).addEventListener('click', function (e) {
      if (busy) return;
      if (word) ER.wordAt(e.clientX, e.clientY, word);
      if (line) ER.say(line);
    });
  }
  thing('#frontdoor', 'bolt', 'Bolted again. Nobody goes in or out until you say so.');
  thing('#mat', 'doormat', null);
  thing('#coat', 'coat hook', 'A caretaker&rsquo;s coat on its hook. PC Marsh has already been through the pockets. It is in his notes.');
  thing('#boxes', 'parcel tape', 'Boxes, taped and labelled for the van. Somebody was working beside this door all evening.');
  thing('#crate9', 'crate', 'PM 09. Anchor chain. Somebody got it as far as the front door and stopped for breath.');
  thing('#clock', 'pendulum', 'Tock. Tock. Tock. It belongs to the building, and it is the one thing here that is not going to the city.');
  thing('#cellar', null, 'The cellar. Cold air comes under the door, and somewhere below there is a drip.');
  $('#chartdoor').addEventListener('click', function (e) {
    if (busy) return;
    ER.wordAt(e.clientX, e.clientY, 'keyhole');
    ER.say('Locked. PC Marsh turned the key himself and hung it on the caretaker&rsquo;s board.');
  });
  $('#card').addEventListener('click', function () {
    ER.read({ html: CARD, cls: 'hand', clue: { id: 'keycard', title: 'Card on the key board', kind: 'Note' } });
  });
  $('#marsh').addEventListener('click', function () {
    if (busy) return;
    var c = CAST.marsh;
    ER.talk({
      who: c.who, role: c.role, face: FACE('marsh'), last: 'Take the notebook',
      lines: [
        'Evening. PC Marsh. I&rsquo;ve kept all four of them in the building, as you asked. Nobody is pleased about it.',
        'This is the hall. Through that door is the Chart Room, where the chronometer lived. They tell me you could hear it ticking from where we&rsquo;re standing. Twice a second.',
        'Behind the Chart Room there&rsquo;s a kitchen the size of a cupboard, with a kettle that never stops hissing. The stairs go up to the office. Mind them, they creak. And down there is the cellar: crates, the fuse box, and a drip that has already gone down my neck.',
        'At ten past eight every light in the harbour went out. At ten to nine they came back on, and the glass case was open and empty. Forty minutes of dark. Plenty of time for anybody.',
        'I locked the Chart Room so nobody could tidy up. The key is on the caretaker&rsquo;s board over there, with all the others. He labels them his own way. You&rsquo;ll see.',
        'My notes are in this book. Take it. If I were you, I&rsquo;d start with the room.'
      ],
      clue: { id: 'marsh', title: 'PC Marsh: the building', kind: 'Briefing' },
      done: function (seen) {
        if (!seen) return;
        if (!briefed) { briefed = true; ER.read({ html: NOTES, cls: 'book', clue: { id: 'notes', title: 'PC Marsh’s notes', kind: 'Police notebook' },
          done: function () { ER.say('The Chart Room is locked. The keys are on the board beside it.'); } }); }
      }
    });
  });

  /* dragging a key to a lock */
  ER.$$('.key').forEach(function (k) {
    var sx = 0, sy = 0, word = k.getAttribute('data-k');
    ER.drag(k, {
      start: function (e) { if (busy) return false; var p = ER.pt(svg, e); sx = p.x; sy = p.y; k.parentNode.appendChild(k); },
      move: function (e) { var p = ER.pt(svg, e); k.style.transform = 'translate(' + (p.x - sx) + 'px,' + (p.y - sy) + 'px)'; },
      end: function (e, moved) {
        var p = ER.pt(svg, e);
        k.style.transform = '';
        if (!moved) { ER.wordAt(e.clientX, e.clientY, word); ER.sfx.chain(); return; }
        if (Math.abs(p.x - 1282) < 70 && Math.abs(p.y - 510) < 80) return tryDoor(word);
        if (Math.abs(p.x - 700) < 80 && p.y > 300 && p.y < 640) return ER.say('PC Marsh coughs. &ldquo;The Chart Room, if you don&rsquo;t mind. We can admire the furniture later.&rdquo;');
        if (Math.abs(p.x - 840) < 80 && p.y > 380) return ER.say('&ldquo;Not down there yet,&rdquo; says PC Marsh. &ldquo;The Chart Room first.&rdquo;');
      }
    });
  });
  function tryDoor(word) {
    ER.sfx.click();
    if (!ER.exit([word], { quiet: true, delay: 3600 })) {
      ER.sfx.no();
      ER.say('The key marked ' + word.toUpperCase() + ' goes in. It will not turn.');
      return;
    }
    busy = true; clearInterval(clockT);
    ER.sfx.clunk();
    ER.say('The key marked ' + word.toUpperCase() + ' turns.', 5000);
    setTimeout(function () { $('#chartOpen').setAttribute('opacity', 1); ER.sfx.creak(); }, 700);
    setTimeout(function () { ER.sfx.thunder(); $('#dark').setAttribute('opacity', 0.93); }, 1900);
  }
})();
</script>
</body>
</html>
