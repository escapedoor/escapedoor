<style>
  body{--bg:#010203;--accent:#bfe6ef;--font-display:'Cinzel',serif;--font-ui:'Oswald',sans-serif;
    --tc-bg:rgba(1,2,3,.95);--cap-bg:rgba(3,7,10,.93);--panel:#0e1518;--face-bg:#3b3550;--q-ink:#8fb7c2;--fade:#000;
    --hud-bg:rgba(2,5,7,.7)}
  body.torch .stage{cursor:none}
  .tc-room{font-weight:500;letter-spacing:.08em}
  .plateT{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:1.5px;fill:#4a360c;text-anchor:middle}
  .typeT{font-family:'Special Elite',monospace;font-size:9px;fill:#2b2620}
  .sfxt{font-family:'EB Garamond',serif;font-style:italic;font-size:26px;fill:#d9e6ea;opacity:0;pointer-events:none;text-anchor:middle}
  #dark{position:fixed;top:0;right:0;bottom:0;left:0;z-index:4;pointer-events:none;
    background:radial-gradient(circle var(--r,190px) at var(--x,50%) var(--y,52%),rgba(1,2,3,0) 0,rgba(1,2,3,0) 50%,rgba(1,2,3,.62) 78%,rgba(1,2,3,.975) 100%)}
  #dark.off{background:#010203}
  .wristT{position:fixed;z-index:5;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:26px;color:#d9e6ea;opacity:0;
    pointer-events:none;transform:translate(-50%,-50%)}
  #steam{animation:steam 3.4s ease-in-out infinite}
  @keyframes steam{0%,100%{opacity:.18;transform:translateY(0)}50%{opacity:.4;transform:translateY(-10px)}}
  #gas{animation:gas .9s ease-in-out infinite alternate}
  @keyframes gas{from{opacity:.55}to{opacity:.8}}
  .torchbtn{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:35;display:none;padding:13px 30px;
    border:1px solid #bfe6ef;color:#bfe6ef;background:rgba(2,6,8,.86);font-family:'Oswald',sans-serif;font-size:16px;
    letter-spacing:.18em;text-transform:uppercase;border-radius:3px}
  .torchbtn.on{display:block}
  .torchbtn:hover{background:#bfe6ef;color:#04090b}
  /* PC Marsh's notebook: build the sentence */
  .mq{width:min(780px,94vw);background:#f3ecd6 repeating-linear-gradient(transparent 0 47px,#d3c9ad 47px 48px);color:#1c1c22;
    padding:28px 34px 26px;border-left:26px solid #1c2742;box-shadow:0 26px 70px rgba(0,0,0,.7)}
  .mq-say{font-family:'EB Garamond',Georgia,serif;font-size:21px;line-height:1.45;color:#3a362e;margin:0 0 20px;background:#f3ecd6;padding-bottom:6px}
  .mq-line{font-family:'Caveat',cursive;font-size:35px;line-height:48px;font-weight:700;color:#1d2a4a}
  .slot{display:inline-block;min-width:112px;height:44px;vertical-align:bottom;border-bottom:3px solid #1d2a4a;margin:0 5px 4px;text-align:center}
  .tray{display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;margin:26px 0 8px;min-height:118px;padding:12px;background:#e6dcc0;border-radius:4px;border:1px dashed #b3a682}
  .tile{font-family:'Special Elite',monospace;font-size:21px;line-height:1;padding:9px 14px 6px;background:#fffdf4;border:1px solid #b9ad8c;
    box-shadow:0 3px 0 #b9ad8c;border-radius:3px;display:inline-block;color:#27231d}
  .slot .tile{box-shadow:none;border-color:transparent;background:transparent;font-family:'Caveat',cursive;font-size:35px;font-weight:700;
    padding:0 6px;line-height:44px;color:#8c2f24}
  .mq-foot{display:flex;align-items:center;gap:16px;margin-top:12px;background:#f3ecd6}
  .mq-msg{flex:1;min-height:28px;font-family:'EB Garamond',Georgia,serif;font-size:20px;font-style:italic;color:#8c2f24}
  .mq .btn{--accent:#1c2742}
  .mq .btn:hover:not([disabled]){color:#f3ecd6}
</style>

<script>
(function () {
  var $ = ER.$, svg = $('#scene'), warm = $('#warm'), dark = $('#dark'), tbtn = $('#tbtn');
  var found = {}, need = ['ida', 'notice', 'lock', 'foot'], stage = 0, off = false, stillStart = 0, stillT = 0, lastPos = null, lastWarn = 0,
      offAt = 0, flashT = 0, busy = false, lockOpen = false;

  ER.init({
    theme: 'mystery', story: 'forty', storyTitle: 'Forty Minutes of Dark', id: 'chart', no: 'III', title: 'The Chart Room',
    go: 'Switch on the torch',
    intro: [
      'The key marked TICK turns. As the door swings open, the storm takes the lights again.',
      'Somewhere behind you PC Marsh says a word that will not go in his notebook. Then he puts his torch into your hand.',
      'The Chart Room is very quiet.'
    ],
    exit: {"next":"cellar","w":{"d74f747a":"6908d0b5","d558c1c1":"e8643c2b","132cbe9e":"e90be7c1","2e2766ee":"d0811f54","a2134d09":"1d2ac23f"}}, tags: {"false":["dd412c2b","2cdb4f47","42f6c545","f8e527a9","59ce95ca","6a73ae81","281b252a","30838cd3"]},
    hints: hints,
    onBegin: begin
  });

  var RNOTICE = '<h4>Staff. At closing</h4>' +
    '<p>1. Wind the chronometer at six. Curator only.</p>' +
    '<p>2. Lock the case.</p>' +
    '<p>3. Cover it with its dust sheet.</p>' +
    '<p>4. Tuck the corner of the sheet under the brass foot, or the draught will have it off by morning.</p>' +
    '<p>No exceptions.</p><p>R. Okafor</p>';
  var PLATE = '<h4>Marine Chronometer</h4><p>London, 1868</p>' +
    '<p>Carried round Cape Horn eleven times<br>by Captain Joseph Harland of Pellam</p>' +
    '<p>Wound every evening at six</p><p>Lent by T. Harland, 1961</p>';

  function hints() {
    if (stage === 0) {
      var miss = [];
      if (!found.ida) miss.push('the person on the bench (listen until she has finished)');
      if (!found.notice) miss.push('the notice on the wall');
      if (!found.lock) miss.push('the lock on the glass door');
      if (!found.foot) miss.push('one of the brass feet under the case');
      return ['find', [
        'The mouse is your torch. There are four things to find in this room. The dots beside the room&rsquo;s name show how many you have.',
        'You still need: ' + miss.join('; ') + '.',
        'Mrs Sorley is on the right. The notice hangs between the glass case and the bench. The lock is the small brass plate on the edge of the open glass door. The foot is at the bottom left of the case, beside the heap of cloth.'
      ]];
    }
    if (stage === 1) return ['still', [
      'Mrs Sorley asked you to do two things. What were they?',
      'First, click the button at the bottom to switch the torch off.',
      'Now do nothing at all. Take your hand off the mouse and wait for about seven seconds.'
    ]];
    if (stage === 3) return ['sentence', [
      'At eight o&rsquo;clock Mrs Sorley sat down next to the case. What could she hear? What should she have heard?',
      'The clock was not there at eight. The lights went out at ten past eight. Which came first?',
      'The sentence needs four words. It begins with &ldquo;had&rdquo;, and it ends with a word that means &ldquo;earlier than&rdquo;.'
    ]];
    return null;
  }
  function begin() {
    ER.amb.rain(0.03); ER.pips(0, need.length);
    flashT = setTimeout(flash, 7000);
    ER.narrate(['A glass case. A bench. Somebody is sitting on the bench.']);
  }

  /* the torch follows the mouse */
  function aim(e) {
    if (off) return;
    var p = ER.pt(svg, e);
    dark.style.setProperty('--x', e.clientX + 'px'); dark.style.setProperty('--y', e.clientY + 'px');
    warm.setAttribute('cx', p.x); warm.setAttribute('cy', p.y);
  }
  function sizeBeam() { var m = svg.getScreenCTM(); if (m) dark.style.setProperty('--r', Math.round(200 * m.a) + 'px'); }
  window.addEventListener('resize', sizeBeam); sizeBeam();
  document.addEventListener('pointermove', aim);
  document.addEventListener('pointerdown', aim);

  function flash() {
    if (!off && !busy) {
      try {
        dark.animate([{ opacity: 1 }, { opacity: 0.5, offset: 0.1 }, { opacity: 0.94, offset: 0.25 }, { opacity: 0.56, offset: 0.4 }, { opacity: 1 }], { duration: 800 });
        $('#winFlash').animate([{ opacity: 0 }, { opacity: 0.9, offset: 0.1 }, { opacity: 0.1, offset: 0.25 }, { opacity: 0.8, offset: 0.4 }, { opacity: 0 }], { duration: 800 });
      } catch (e) {}
      setTimeout(ER.sfx.thunder, 500);
    }
    flashT = setTimeout(flash, 9000 + Math.random() * 6000);
  }

  function got(k) {
    if (found[k]) return;
    found[k] = 1;
    var n = need.filter(function (x) { return found[x]; }).length;
    ER.pips(n, need.length);
    if (n === need.length && stage === 0) { stage = 1; setTimeout(askToListen, 1400); }
  }
  function thing(sel, word, line, key) {
    $(sel).addEventListener('click', function (e) {
      if (off || busy) return;
      if (word) ER.wordAt(e.clientX, e.clientY, word);
      if (line) ER.say(line);
      if (key) got(key);
    });
  }
  thing('#window', null, 'The window. It was painted shut years ago, and the paint is not broken.');
  thing('#kitchen', 'kettle', 'The kitchen. A kettle, a tin of biscuits, a pile of clean plates. Not one plate has been used tonight.');
  thing('#shelf', 'dust sheet', 'Ship models under their dust sheets. Every corner is tucked in.');
  thing('#charts', 'chart', null);
  thing('#cushion', null, 'Blue velvet, with a square mark where the box has stood since 1961. The case is empty.');
  thing('#sheet', 'dust sheet', 'The dust sheet, lying where it fell. Dry. Not torn.');
  thing('#lock', 'keyhole', 'The lock of the glass door. Not one scratch on the brass or inside the keyhole. And it is not locked now: the door moves when you touch it.', 'lock');
  thing('#foot', null, 'A brass foot. The corner of the sheet is lying beside it. Nothing is tucked under anything.', 'foot');
  $('#plate').addEventListener('click', function () {
    if (off || busy) return;
    ER.read({ html: PLATE, cls: 'plate', clue: { id: 'plate', title: 'Brass plate on the case', kind: 'Museum label' } });
  });
  $('#rnotice').addEventListener('click', function () {
    if (off || busy) return;
    ER.read({ html: RNOTICE, cls: 'typed', clue: { id: 'rnotice', title: 'Notice beside the case', kind: 'Museum notice' }, done: function () { got('notice'); } });
  });
  $('#ida').addEventListener('click', function () {
    if (off || busy) return;
    var c = CAST.ida;
    ER.talk({
      who: c.who, role: c.role, face: FACE('ida'),
      lines: [
        'Is that the detective? I am Ida Sorley. I would get up, but I have been told to stay where I am twice tonight, and the second time I mean to do it.',
        'Joseph Harland was my great-grandfather. He carried that clock round Cape Horn eleven times. My grandfather lent it to this museum in 1961, when I was eleven. I wanted to see it once more before it went.',
        'Ruth gave me tea upstairs. About eight I came down to wait on this bench. It was very quiet in here. Only the rain on the window. I could hear my own wristwatch. I thought, how thick that sheet must be.',
        { a: 'Then the lights went, and Ruth called down that I must stay where I was.', note: '' },
        { note: 'Mrs Sorley does not speak for some time.', a: 'I didn&rsquo;t quite stay where I was. After twenty minutes or so I thought, nobody will know. I have a little torch on my keys. I only meant to lift the corner of the sheet, but it wasn&rsquo;t caught on anything. It slid straight off onto the floor. The glass door moved when I touched it. And there was nothing inside.' },
        'I sat down again. Who would they blame? The old woman whose family wants it back. So I said nothing. I am sorry.'
      ],
      clue: { id: 'ida1', title: 'Ida Sorley, in the Chart Room' },
      done: function (seen) { if (seen) got('ida'); }
    });
  });

  /* Mrs Sorley's test: switch the torch off, keep still, and listen */
  function askToListen() {
    if (ER.isOpen()) { setTimeout(askToListen, 1200); return; }
    ER.narrate([
      '&ldquo;Before you go,&rdquo; says Mrs Sorley, &ldquo;sit down a moment. Switch that torch off and keep quite still. I want you to hear something.&rdquo;'
    ], function () { tbtn.classList.add('on'); });
  }
  tbtn.addEventListener('click', function () { if (busy) return; if (stage === 3) { openLock(); return; } if (off) torchOn(); else torchOff(); });
  function torchOff() {
    off = true; offAt = stillStart = Date.now(); lastPos = null;
    dark.classList.add('off'); warm.setAttribute('opacity', 0);
    document.body.classList.remove('torch');
    tbtn.textContent = 'Switch the torch on';
    ER.say('Darkness. Keep quite still, and listen.', 3200);
    stillT = setInterval(stillTick, 250);
  }
  function torchOn() {
    off = false; clearInterval(stillT);
    dark.classList.remove('off'); warm.setAttribute('opacity', 1);
    document.body.classList.add('torch');
    tbtn.textContent = 'Switch off the torch';
  }
  function fidget() {
    if (!off || Date.now() - offAt < 900) return;
    stillStart = Date.now();
    if (Date.now() - lastWarn > 2600) { lastWarn = Date.now(); ER.say('Keep still.', 1500); }
  }
  document.addEventListener('pointermove', function (e) {
    if (!off) return;
    if (!lastPos) { lastPos = [e.clientX, e.clientY]; return; }
    if (Math.abs(e.clientX - lastPos[0]) + Math.abs(e.clientY - lastPos[1]) > 12) { lastPos = [e.clientX, e.clientY]; fidget(); }
  });
  document.addEventListener('keydown', fidget);
  var lastTick = 0;
  function stillTick() {
    var t = Date.now() - stillStart;
    if (t > 1800 && Date.now() - lastTick > 950) {
      lastTick = Date.now(); ER.sfx.tick(0.5);
      var w = $('#wrist'), m = svg.getScreenCTM();
      if (m) { w.style.left = (m.e + 1262 * m.a) + 'px'; w.style.top = (m.f + 590 * m.d) + 'px'; }
      try { w.animate([{ opacity: 0 }, { opacity: 0.55, offset: 0.25 }, { opacity: 0 }], { duration: 800 }); } catch (e) {}
    }
    if (t >= 6500) heard();
  }
  function heard() {
    clearInterval(stillT); stage = 2; busy = true; tbtn.classList.remove('on');
    ER.narrate([
      'Rain on the glass. And, very small and very near, a wristwatch.',
      '&ldquo;That is all I could hear at eight o&rsquo;clock,&rdquo; says Mrs Sorley. &ldquo;I sat down here, beside a clock that ticks twice a second, and I heard my own watch. I thought, how thick that sheet must be.&rdquo;',
      'You switch the torch back on. PC Marsh is standing in the doorway with his pencil ready.'
    ], function () { torchOn(); busy = false; stage = 3; tbtn.textContent = 'PC Marsh is waiting'; tbtn.classList.add('on'); openLock(); });
  }

  /* the lock: say what it means, in one sentence */
  function openLock() {
    var box = ER.el('div', 'mq');
    box.innerHTML = '<p class="mq-say">PC Marsh turns to a clean page. &ldquo;She heard her own watch at eight. The lights did not go out until ten past. So what do I write down?&rdquo;</p>' +
      '<div class="mq-line">The chronometer <span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span> the lights went out.</div>' +
      '<div class="tray"></div>' +
      '<div class="mq-foot"><div class="mq-msg"></div><button type="button" class="btn">Write it down</button></div>';
    var tray = box.querySelector('.tray'), msg = box.querySelector('.mq-msg');
    ['still', 'had', 'before', 'not', 'gone', 'was', 'when', 'already', 'after', 'there'].forEach(function (w) {
      var t = ER.el('span', 'tile dnd-item'); t.textContent = w; tray.appendChild(t);
    });
    ER.glossIn(box, '.mq-say');
    ER.dnd(box, { item: '.tile', slot: '.slot', home: tray, lock: function () { return lockOpen; }, change: function () { msg.textContent = ''; } });
    box.querySelector('.btn').addEventListener('click', function () {
      if (lockOpen) return;
      var ws = ER.$$('.slot', box).map(function (s) { var t = s.querySelector('.tile'); return t ? t.textContent : ''; });
      if (ws.indexOf('') >= 0) { msg.textContent = 'The sentence still has a hole in it.'; ER.shake(box); return; }
      var s = ws.join(' ');
      if (ER.exit([s], { delay: 5200 })) {
        lockOpen = true; busy = true; clearTimeout(flashT); tbtn.classList.remove('on');
        msg.style.color = '#2f6b45'; msg.textContent = 'PC Marsh writes it down, slowly.';
        setTimeout(function () { ER.closeAll(); ER.say('PC Marsh reads it back to himself twice. Then he looks up at the dark ceiling. &ldquo;Somebody ought to go and find those fuses,&rdquo; he says.', 5000); }, 1500);
        return;
      }
      ER.sfx.no(); ER.shake(box);
      msg.textContent = ER.check('false', s)
        ? '“Then why could she hear her own watch?” says PC Marsh.'
        : 'PC Marsh frowns at the page. “I can’t write that. Try it another way.”';
    });
    ER.open('ov-lock', box);
  }
})();
</script>
</body>
</html>
