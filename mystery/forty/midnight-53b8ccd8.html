  .tc-text{font-size:clamp(17px,1.4vw,21px)}
  .tagtxt{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:1px;fill:#3a2a08;text-anchor:middle;pointer-events:none}

  .heardT{font-family:'EB Garamond',serif;font-style:italic;font-weight:600;font-size:30px;fill:#f3e9ff;text-anchor:middle;pointer-events:none;opacity:0}
  .ring{fill:none;stroke:#f3e9ff;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
  #pend,#pend2{transform-origin:680px 290px;animation:swing 1s ease-in-out infinite alternate}
  @keyframes swing{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  .key{transition:transform .25s}.key.on{transition:none}
  .key:hover .tagbg{filter:brightness(1.25)}

  #glassHint{animation:gh 2.2s ease-in-out infinite}
  @keyframes gh{50%{opacity:.15}}
  #lanternGlow{animation:lg 3.6s steps(3) infinite}
  @keyframes lg{50%{opacity:.78}}
  #box{animation:bx .5s steps(2) infinite}
  @keyframes bx{50%{transform:translateX(.8px)}}
  .lbtn{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:35;display:none;padding:13px 30px;border:1px solid #d9c7ff;
    color:#d9c7ff;background:rgba(9,8,18,.9);font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.18em;text-transform:uppercase;border-radius:3px}
  .lbtn.on{display:block}.lbtn:hover{background:#d9c7ff;color:#0a0814}

  /* the letter, the lamp, and the last line of the notebook */
  .lw{width:min(1020px,96vw)}
  .lw-top{position:relative;height:min(470px,62vh);overflow:hidden;border:1px solid #2b2644;
    background:radial-gradient(circle at 73% 44%,rgba(255,228,165,.95) 0,rgba(255,196,104,.42) 17%,rgba(255,170,70,.1) 34%,transparent 46%),#0c0a15}
  .lw-lamp{position:absolute;left:73%;top:0;width:150px;margin-left:-75px;pointer-events:none}
  .lw-hint{position:absolute;left:22px;bottom:16px;max-width:330px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#b6a6dd;pointer-events:none}
  .paper{position:absolute;left:4%;top:8%;width:350px;padding:22px 26px 20px;background:#d9c493;box-shadow:0 12px 30px rgba(0,0,0,.6);cursor:grab;touch-action:none;
    font-family:'Homemade Apple',cursive;font-size:14.5px;line-height:1.95;color:rgba(70,44,12,.03);transform:rotate(-3deg);
    background-image:radial-gradient(ellipse at 30% 20%,rgba(255,248,220,.4),rgba(120,82,30,.25))}
  .paper.on{cursor:grabbing}
  .paper p{margin:0 0 8px}
  .lw-nb{margin-top:14px;background:#f3ecd6;border-left:26px solid #1c2742;padding:18px 24px 16px;color:#1c1c22;box-shadow:0 14px 40px rgba(0,0,0,.6)}
  .lw-say{font-family:'EB Garamond',Georgia,serif;font-size:19px;color:#3a362e;margin:0 0 8px}
  .lw-line{font-family:'Caveat',cursive;font-weight:700;font-size:32px;color:#1d2a4a;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  .lw-line input{flex:1 1 220px;min-width:160px;font:inherit;color:#8c2f24;background:transparent;border:0;border-bottom:3px solid #1d2a4a;outline:0;padding:0 6px;
    -webkit-user-select:text;user-select:text}
  .lw-foot{display:flex;align-items:center;gap:14px;margin-top:10px}
  .lw-msg{flex:1;min-height:26px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#8c2f24}
  .lw-nb .btn{--accent:#1c2742}.lw-nb .btn:hover:not([disabled]){color:#f3ecd6}
</style>

  };
  var ZONES = [['base', 592, 600, 768, 808], ['trunk', 618, 268, 742, 600], ['hood', 590, 60, 770, 268], ['door', 44, 150, 256, 806], ['crate', 290, 682, 500, 806],
               ['boxes', 286, 606, 506, 682], ['board', 1180, 130, 1480, 430], ['ruth', 950, 336, 1134, 806], ['table', 820, 560, 952, 806]];
  function zoneAt(x, y) {
    for (var i = 0; i < ZONES.length; i++) if (x >= ZONES[i][1] && x <= ZONES[i][3] && y >= ZONES[i][2] && y <= ZONES[i][4]) return ZONES[i][0];
    return y < 790 ? 'wall' : 'table';
  }

  function hints() {
    if (done) return null;
    if (!listened) return ['listen', [
      'A chronometer never stops. So there is one thing it cannot hide. Pick up the glass from the little table and carry it to things.',
      'Did anybody hear something strange tonight? Read Dennis&rsquo;s statement again. And where was Ruth standing at ten to eight?',
      'Hold the glass against the tall clock: the top, the middle and the bottom. Keep it still for a moment each time.'
    ]];
    if (!opened) return ['key', [
      'The long door of the tall clock is locked. The caretaker&rsquo;s keys are still on the board.',
      'Every key is named for a sound. What sound does this big clock make? Drag that key onto the clock.'
    ]];
    if (!confessed) return ['box', ['Look inside the clock, right at the bottom. Click on what you find there.']];
    return ['owner', [
      'Open Mrs Sorley&rsquo;s letter with the button at the bottom. The ink is too faint to read in the dark. Is there any light?',
      'Drag the letter under the lamp and read it. For how long did Thomas Harland lend the clock?',
      'The letter says the clock comes home to his family on the day there is no museum in Pellam. Tomorrow there is no museum. Who in this hall belongs to his family? Write her name.'
    ]];
  }
  function begin() {
    beatT = setInterval(beat, 100);
    ER.narrate([
      'The storm has gone out to sea. The moon is in the fanlight, and for the first time tonight the hall is quiet.',
      'Quiet enough to listen. Somebody has left a drinking glass on the little table.',
      'Put a glass against a thing, and your ear against the glass, and you can hear inside it.'
    ]);
  }

  /* what the glass hears */
  function ring(sel, big) {
    var r = $(sel); r.setAttribute('cx', gx); r.setAttribute('cy', gy);
    try { r.animate([{ opacity: 0.8, transform: 'scale(.35)' }, { opacity: 0, transform: 'scale(' + (big ? 1.7 : 1.5) + ')' }], { duration: big ? 800 : 380 }); } catch (e) {}
  }
  function beat() {
    phase = (phase + 1) % 10;
    var z = busy || done ? null : zone, inClock = z === 'hood' || z === 'trunk' || z === 'base';
    if (phase === 0) {
      if (inClock) { ER.sfx.tock(z === 'base' ? 0.5 : 1); ring('#ringA', true); }
      else if (!opened) ER.sfx.tock(0.22);
    }
    if (phase === 2 || phase === 7) {
      if (z === 'base') { ER.sfx.tick(1); ring('#ringB', false); }
      else if (z === 'trunk') { ER.sfx.tick(0.35); ring('#ringB', false); }
      else if (opened && !done) ER.sfx.tick(0.7);
    }
    if (z === 'base' && !listened && Date.now() - zoneSince > 1700 && ER.check('spot', z)) found();
  }
  function setZone(z) {
    if (z === zone) return;
    zone = z; zoneSince = Date.now();
    var h = HEAR[z], t = $('#heardT');
    t.textContent = h[0]; t.setAttribute('x', gx); t.setAttribute('y', gy - 62); t.style.opacity = h[0] ? 0.9 : 0;
    if (h[1] && Date.now() - lastSay > 500) { lastSay = Date.now(); ER.say(h[1], 3600); }
    if (z === 'crate') ER.sfx.chain(); else if (z === 'board') ER.sfx.glass(); else if (z === 'door') ER.sfx.gull();
  }
  var ox = 0, oy = 0;
  ER.drag(glass, {
    start: function (e) { if (busy || listened) return false; var p = ER.pt(svg, e); ox = p.x - gx; oy = p.y - gy; $('#glassHint').style.display = 'none'; ER.audio(); },
    move: function (e) {
      var p = ER.pt(svg, e); gx = Math.max(30, Math.min(1570, p.x - ox)); gy = Math.max(60, Math.min(850, p.y - oy));
      glass.style.transform = 'translate(' + gx + 'px,' + gy + 'px)';
      var t = $('#heardT'); t.setAttribute('x', gx); t.setAttribute('y', gy - 62);
      setZone(zoneAt(gx, gy));
    },
    end: function (e, moved) { if (!moved) ER.say('A drinking glass. Carry it to whatever you want to listen to.'); }
  });
  function found() {
    listened = true; busy = true; ER.sfx.ok();
    $('#heardT').style.opacity = 0;
    ER.narrate([
      'Two clocks. One of them has no business being in there.',
      '&ldquo;Locked,&rdquo; says PC Marsh, trying the long door of the tall clock. &ldquo;The caretaker&rsquo;s keys are still on the board.&rdquo;'
    ], function () { busy = false; ER.pips(1, 3); });
  }

  /* keys */
  ER.$$('.key').forEach(function (k) {
    var sx = 0, sy = 0, word = k.getAttribute('data-k');
    ER.drag(k, {
      start: function (e) { if (busy || opened) return false; var p = ER.pt(svg, e); sx = p.x; sy = p.y; k.parentNode.appendChild(k); },
      move: function (e) { var p = ER.pt(svg, e); k.style.transform = 'translate(' + (p.x - sx) + 'px,' + (p.y - sy) + 'px)'; },
      end: function (e, moved) {
        var p = ER.pt(svg, e); k.style.transform = '';
        if (!moved) { ER.wordAt(e.clientX, e.clientY, word); ER.sfx.chain(); return; }
        if (p.x > 590 && p.x < 780 && p.y > 260 && p.y < 660) {
          if (!listened) return ER.say('&ldquo;What makes you think it is in there?&rdquo; says PC Marsh. &ldquo;Show me first.&rdquo;');
          ER.sfx.click();
          if (!ER.check('clockkey', word)) { ER.sfx.no(); return ER.say('The key marked ' + word.toUpperCase() + ' goes in. It will not turn.'); }
          openClock(word);
        }
      }
    });
  });
  function openClock(word) {
    opened = true; ER.sfx.clunk(); ER.pips(2, 3);
    ER.say('The key marked ' + word.toUpperCase() + ' turns.', 2600);
    setTimeout(function () {
      $('#doorClosed').setAttribute('opacity', 0); $('#doorClosed').style.pointerEvents = 'none'; $('#doorOpen').setAttribute('opacity', 1); ER.sfx.creak();
      ER.say('The long door swings open. A pendulum, two brass weights, a hundred years of dust. And on the floor of the case, a wooden box with brass corners.', 9000);
    }, 900);
  }
  $('#box').addEventListener('click', function () {
    if (!opened || busy || confessed) { if (confessed) openLetter(); return; }
    var c = CAST.ruth;
    ER.talk({
      who: c.who, role: c.role, face: FACE('ruth'),
      lines: [
        { note: 'Ruth Okafor does not argue. She walks past you, lifts the box out of the clock, and holds it against her cardigan. It is still ticking.', a: 'It has run for a hundred and fifty-eight years. In the city it would have stopped in a week.' },
        'I was not going to sell it. I was going to wind it.',
        { q: 'You let me suspect three other people.', a: 'Yes. I did. I am not proud of that part.' }
      ],
      clue: { id: 'ruth-hall', title: 'Ruth Okafor, in the hall' },
      done: function (seen) {
        if (!seen || confessed) return;
        confessed = true; busy = true; ER.pips(3, 3);
        ER.narrate([
          'Behind her, the tall clock goes back to tock, tock, tock.',
          'PC Marsh opens his notebook. &ldquo;One chronometer, recovered 11.40 p.m.,&rdquo; he writes. &ldquo;Property of&hellip;&rdquo; He stops and looks up. &ldquo;Property of who? There is no museum after tomorrow.&rdquo;',
          'Mrs Sorley is holding something out to you. It is a letter. The ink is sixty-five years old and the colour of weak tea.'
        ], function () { busy = false; $('#lbtn').classList.add('on'); openLetter(); });
      }
    });
  });
  $('#lbtn').addEventListener('click', function () { if (!busy) openLetter(); });

  /* the letter: the ink only shows in strong light */
  var LAMP = '<svg viewBox="0 0 150 150"><path d="M75 0V40" stroke="#2a2440" stroke-width="5"/><path d="M38 40h74l22 46H16z" fill="#1f5a48"/><path d="M38 40h74" stroke="#3f8a70" stroke-width="3"/><ellipse cx="75" cy="88" rx="59" ry="9" fill="#ffe9b0"/></svg>';
  var LETTER = '<p>Harland&rsquo;s Yard, Pellam<br>3 May 1961</p><p>To the Museum of Pellam.</p>' +
    '<p>I lend you my father&rsquo;s chronometer, which he carried round Cape Horn eleven times, for as long as the museum shall stand in Pellam.</p>' +
    '<p>On the day it does not, the clock comes home to my family.</p><p>Thomas Harland</p>';
  var px = null, py = null;
  function openLetter() {
    var box = ER.el('div', 'lw');
    box.innerHTML = '<div class="lw-top"><div class="lw-lamp">' + LAMP + '</div><div class="lw-hint">The ink has faded to the colour of the paper. There is a lamp.</div><div class="paper drag">' + LETTER + '</div></div>' +
      '<div class="lw-nb"><p class="lw-say">PC Marsh holds out his notebook and his pencil. &ldquo;You write it,&rdquo; he says.</p>' +
      '<div class="lw-line"><span>One chronometer, recovered 11.40 p.m. Property of</span><input type="text" autocomplete="off" spellcheck="false" maxlength="40"></div>' +
      '<div class="lw-foot"><div class="lw-msg"></div><button type="button" class="btn">Write it down</button></div></div>';
    ER.glossIn(box, '.lw-hint, .lw-say');
    var top = box.querySelector('.lw-top'), paper = box.querySelector('.paper'), input = box.querySelector('input'), msg = box.querySelector('.lw-msg'), sx, sy;
    function light() {
      var t = top.getBoundingClientRect(), p = paper.getBoundingClientRect();
      var d = Math.hypot((p.left + p.width / 2) - (t.left + t.width * 0.73), (p.top + p.height / 2) - (t.top + t.height * 0.5));
      var a = Math.max(0.03, Math.min(1, 1.25 - d / (t.width * 0.3)));
      paper.style.color = 'rgba(70,44,12,' + a.toFixed(2) + ')';
      if (a > 0.9 && !read) { read = true; ER.addClue('harland', 'Thomas Harland’s letter, 1961', LETTER, 'letter', 'Letter'); box.querySelector('.lw-hint').style.display = 'none'; }
    }
    function place() { if (px != null) { paper.style.left = px + 'px'; paper.style.top = py + 'px'; } }
    ER.drag(paper, {
      start: function (e) { if (done) return false; var t = top.getBoundingClientRect(), p = paper.getBoundingClientRect(); sx = e.clientX - (p.left - t.left); sy = e.clientY - (p.top - t.top); },
      move: function (e) {
        var t = top.getBoundingClientRect();
        px = Math.max(-60, Math.min(t.width - 200, e.clientX - sx)); py = Math.max(-40, Math.min(t.height - 120, e.clientY - sy));
        place(); light();
      }
    });
    function submit() {
      if (done) return;
      var ws = ER.words(input.value);
      if (!ws.length) { msg.textContent = 'The line is still empty.'; return; }
      if (ER.exit(ws, { delay: 4600 })) {
        done = true; busy = true; clearInterval(beatT); input.disabled = true; $('#lbtn').classList.remove('on');
        msg.style.color = '#2f6b45'; msg.textContent = 'PC Marsh reads it, nods, and underlines it twice.';
        setTimeout(ER.closeAll, 2600);
        return;
      }
      ER.sfx.no(); ER.shake(box.querySelector('.lw-nb'));
      msg.textContent = read ? 'PC Marsh looks at the letter, and then at what you wrote. “That is not what it says.”'
                             : '“Are you sure?” says PC Marsh. “We have not even read the letter.”';
    }
    box.querySelector('.btn').addEventListener('click', submit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); e.stopPropagation(); });
    ER.open('ov-lock', box);
    place(); light();
  }
})();
</script>
</body>
</html>
