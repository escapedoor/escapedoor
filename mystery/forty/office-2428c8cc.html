<style>
  body{--bg:#1c130c;--accent:#e8a33a;--font-display:'Special Elite',monospace;--font-ui:'Oswald',sans-serif;
    --tc-bg:rgba(24,15,9,.93);--cap-bg:rgba(26,17,10,.94);--panel:#21160f;--q-ink:#d9b98a;--fade:#0c0703}
  .tc-room{letter-spacing:.02em}
  .lt{font-family:'Special Elite',monospace;fill:#2b2620}
  .bt{font-family:'Special Elite',monospace;font-size:13px;fill:#3a2a1a}
  .bk{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:3px;fill:#f6efe0;text-anchor:middle}
  .pk{font-family:'Oswald',sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;fill:#fdf6e0;text-anchor:middle}
  #boardHot{animation:bh 3s steps(3) infinite}
  @keyframes bh{50%{filter:brightness(1.18)}}
  #lampGlow{animation:lg 4s steps(3) infinite}
  @keyframes lg{50%{opacity:.82}}

  /* the case board */
  .cb{width:min(1200px,97vw);padding:16px 22px 16px;color:#27231d;
    background:radial-gradient(circle at 20% 30%,rgba(255,235,190,.25),transparent 40%),radial-gradient(circle at 80% 70%,rgba(60,35,10,.28),transparent 45%),#b88b58;
    border:14px solid #4a2f1c;border-radius:4px;box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 40px rgba(60,35,10,.5)}
  .cb h5{display:inline-block;margin:0 0 12px;padding:6px 14px 4px;background:#f6f0de;font-family:'Special Elite',monospace;font-weight:normal;
    font-size:17px;letter-spacing:.08em;box-shadow:0 3px 8px rgba(0,0,0,.35);transform:rotate(-.6deg)}
  .cb-sec{margin-bottom:14px}
  .cb-sec.off{display:none}
  .cb p.say{margin:0 0 12px;font-family:'EB Garamond',Georgia,serif;font-size:19px;color:#1f1509;max-width:780px}
  .rail{display:flex;gap:8px;flex-wrap:wrap}
  .tslot{position:relative;flex:1 1 124px;min-width:118px;max-width:150px;min-height:128px;padding:30px 5px 5px;background:rgba(40,24,8,.2);border:2px dashed rgba(40,24,8,.45);border-radius:3px}
  .tslot:before{content:attr(data-t);position:absolute;left:0;right:0;top:3px;text-align:center;font-family:'Oswald',sans-serif;font-weight:600;font-size:19px;letter-spacing:.06em;color:#3a2410}
  .tslot.ok{border:2px solid #2f6b45;background:rgba(47,107,69,.18)}
  .ttray{display:flex;gap:8px;flex-wrap:wrap;min-height:60px;margin-top:12px;padding:10px;border-radius:3px;background:rgba(40,24,8,.14)}
  .ecard{position:relative;width:138px;padding:9px 9px 8px;background:#fdfbf2;border-top:5px solid #9bb7d4;font-family:'EB Garamond',Georgia,serif;font-size:15px;
    line-height:1.22;box-shadow:0 3px 8px rgba(0,0,0,.4)}
  .tslot .ecard{width:auto;box-shadow:0 2px 5px rgba(0,0,0,.35)}
  .cb-row{display:flex;align-items:center;gap:14px;margin-top:12px}
  .cb-msg{flex:1;min-height:26px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#3a0f08;font-weight:600}
  .cb .btn{--accent:#3a2410;background:#f6f0de}
  .cb .btn:hover:not([disabled]){color:#f6f0de}
  .two{display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
  .ck{background:#f6f0de;padding:14px 14px 10px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.4);transform:rotate(.7deg)}
  .ck svg{width:164px;height:164px;display:block;margin:0 auto;touch-action:none;cursor:grab}
  .ck-words{font-family:'Caveat',cursive;font-weight:700;font-size:31px;color:#1d2a4a;line-height:1.1;margin-top:4px;min-height:36px}
  .faces{display:flex;gap:10px;flex-wrap:wrap}
  .pcard{position:relative;width:112px;padding:7px 7px 6px;background:#fdfbf2;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.4)}
  .pcard svg{width:100%;height:auto;display:block;pointer-events:none}
  .pcard b{display:block;margin-top:6px;font-family:'Special Elite',monospace;font-weight:normal;font-size:14px}
  .pcard small{display:block;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
  .ktray{display:inline-flex;align-items:center;gap:12px;min-width:150px;min-height:56px;padding:8px 14px;border-radius:3px;background:rgba(40,24,8,.16);
    font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:17px}
  .keyitem{width:96px;height:40px;display:inline-block;vertical-align:middle}
  .keyitem svg{width:100%;height:100%;display:block;pointer-events:none}
  .pcard .keyitem{position:absolute;left:50%;top:78px;margin-left:-48px;background:rgba(253,251,242,.94);border-radius:4px;box-shadow:0 2px 7px rgba(0,0,0,.45)}
  @media (max-width:860px){.two{grid-template-columns:1fr}}
</style>

  function hints() {

      'Look at your timeline. When was the clock last heard ticking? When was the room first silent? The case was opened between those two times.',
      'Now find ten minutes when one person was alone downstairs. Who sent Callum away? Had Dennis asked for him? Three people say &ldquo;ten minutes&rdquo; and one says &ldquo;a minute or two&rdquo;.',
      'Only one key opens that case, and the lock has no scratches. Put the key on the person who wears it. Turn the clock to a time between twenty to eight and ten to eight.'
    ]];
  }
  function begin() {

  }

  }
  thing('#win', null, 'The storm is going out to sea. The rain has almost stopped.');
  thing('#wclock', null, 'Twenty past ten. It has been a long evening for everybody.');
  thing('#shelves', 'box file', 'Twenty years of box files. Every one has a label, and every label is straight.');
  thing('#tea', 'teapot', 'Two cups. One is empty. The other is still full, and stone cold.');
  thing('#bisc', 'biscuits', 'A packet of biscuits, torn open in a hurry. There is no plate.');
  thing('#labels', 'label', 'A pile of labels. They were all finished hours ago.');
  $('#letter').addEventListener('click', function () { if (busy) return; ER.read({ html: LETTER, cls: 'corp', clue: { id: 'city', title: 'Letter from the City Museum', kind: 'Letter' } }); });
  $('#boardHot').addEventListener('click', function () { if (!busy) openBoard(); });

  function talk(k, title, lines) {

      if (busy) return;

      ER.talk({ who: c.who, role: c.role, face: FACE(k), lines: lines, clue: { id: k + '-office', title: title },

  }
  talk('ruth', 'Ruth Okafor, in the office', [
    'Ruth Okafor. I am the curator. I have been here twenty years, and I should very much like to go home.',
    'I wound it at six, as I do every evening, and locked the case. The key is on this cord. It has been round my neck since I came in this morning.',
    'Mrs Sorley rang the bell at half past seven. I bolted the door behind her because of the wind and brought her up here for tea. I had promised to take the sheet off afterwards and let her see the chronometer. Then there were labels to finish, and she went down to wait on the bench.',
    'When the lights went I was at this desk with Callum. I called down to Mrs Sorley not to move about, because the floor is covered in boxes. We lit a candle and carried on. Neither of us left the room for forty minutes.',
    { q: 'Could the lock be opened without the key?', a: 'It is a hundred years old. I suppose anyone patient could manage it.' },
    { q: 'What will happen to the chronometer in the city?', a: 'They were quite honest with me. A shelf in a basement store, with a catalogue number. Nobody winds things in a store.' },
    'Whoever did this had forty minutes of dark. I don&rsquo;t like saying it, but two people were alone in it.',
    { q: 'Forget the dark. Where were you between a quarter past seven and eight?', a: 'Up here with Mrs Sorley, from half past seven. I went down for biscuits at some point. A minute or two. I told Callum to give Dennis a hand as I passed.' },
    { q: 'Mrs Sorley says you were gone ten minutes.', a: 'Mrs Sorley is seventy-six and was waiting for a biscuit. I expect it felt like ten.' },
    { q: 'Mr Pym says he never asked for help.', a: 'Dennis has not asked for help in thirty-one years. That is why I send it.' }

  talk('callum', 'Callum Reyes, in the office', [

    'From about ten past seven I was in the hall, taping up boxes by the front door. Dennis went through to the kitchen and came straight back with his flask. Nobody else went into the Chart Room. I&rsquo;d have had to move my legs.',

    { q: 'Mrs Sorley was waiting downstairs all that time.', a: 'I know. Ruth had told her &ldquo;after tea.&rdquo; Then it was &ldquo;one more label.&rdquo; She said that three times. I thought it was a bit unkind, actually.' },
    { q: 'Your phone shows a search for the price of a marine chronometer.', a: 'That was yesterday. Forty thousand pounds for a clock. Wouldn&rsquo;t you look?' }

  talk('ida', 'Ida Sorley, in the office', [

    if (m === 30) return 'half past ' + NUM[h];

  var KEYSVG = '<svg viewBox="0 0 96 40"><path d="M4 8q20-10 26 12" stroke="#2f9a4d" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    '<g stroke="#b8923a" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="38" cy="22" r="9"/><path d="M47 22h40M74 22v9M84 22v7"/></g></svg>';

  function openBoard() {

      '<div class="cb-sec off" id="s2"><div class="two"><div><h5>2 &middot; The moment</h5><div class="ck"><svg viewBox="-120 -120 240 240"></svg><div class="ck-words"></div></div></div>' +

      change: function () { readSlots(); msg1.textContent = ''; ER.$$('.tslot', box).forEach(function (s) { s.classList.remove('ok'); }); } });

    if (tlDone) showTl();

    /* the clock */
    var cs = box.querySelector('.ck svg'), cw = box.querySelector('.ck-words'), s = '', i, an;

    for (i = 0; i < 60; i++) { an = i * Math.PI / 30; s += '<path d="M' + (Math.sin(an) * (i % 5 ? 94 : 86)).toFixed(1) + ' ' + (-Math.cos(an) * (i % 5 ? 94 : 86)).toFixed(1) + 'L' + (Math.sin(an) * 98).toFixed(1) + ' ' + (-Math.cos(an) * 98).toFixed(1) + '" stroke="#27231d" stroke-width="' + (i % 5 ? 1.5 : 4) + '"/>'; }

    s += '<path id="hh" d="M0 10V-50" stroke="#27231d" stroke-width="8" stroke-linecap="round"/><path id="mh" d="M0 14V-84" stroke="#8c2f24" stroke-width="5" stroke-linecap="round"/><circle r="7" fill="#27231d"/>';
    cs.innerHTML = s;
    function draw() {
      cs.querySelector('#hh').setAttribute('transform', 'rotate(' + (T / 2) + ')');
      cs.querySelector('#mh').setAttribute('transform', 'rotate(' + ((T % 60) * 6) + ')');
      cw.textContent = words(T);
    }
    draw();
    function turn(e) {
      var r = cs.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
      var m = (Math.round((Math.atan2(x, -y) * 180 / Math.PI + 360) % 360 / 30) * 5) % 60, d = m - (T % 60);
      if (d > 30) d -= 60; if (d < -30) d += 60;

    var faces = box.querySelector('.faces'), kt = box.querySelector('.ktray');
    ['ruth', 'pym', 'callum', 'ida'].forEach(function (k) {
      var c = CAST[k], p = ER.el('div', 'pcard', '<svg viewBox="0 0 200 260" style="background:' + c.bg + '"><use href="#' + c.id + '"/></svg><b></b><small></small>');
      p.setAttribute('data-k', k); p.querySelector('b').textContent = c.who; p.querySelector('small').textContent = c.role.split(' · ')[0]; faces.appendChild(p);
