<style>
  body{--bg:#9cc9e2;--accent:#b3261c;--font-display:'Cinzel',serif;--font-ui:'Oswald',sans-serif;
    --tc-bg:rgba(250,240,225,.94);--tc-ink:#2a221a;--cap-bg:rgba(252,246,234,.95);--cap-ink:#2a221a;--fade:#fff6e6;
    --hud-bg:rgba(255,250,240,.8);--hud-ink:#2a221a;--hud-line:rgba(42,34,26,.3)}
  .tc-room{font-weight:600;letter-spacing:.04em;font-size:clamp(30px,4.8vw,62px)}
  .tc .btn,.cap em{color:#b3261c}
  .cap{border-top-color:#b3261c}
  .cap small{opacity:.6}
  .sign{font-family:'Cinzel',serif;font-weight:600;font-size:28px;letter-spacing:5px;fill:#f0d488}
  .shop{font-family:'Cinzel',serif;font-size:19px;letter-spacing:4px;fill:#1f3554}
  .van{font-family:'Outfit',sans-serif;font-weight:600;font-size:25px;letter-spacing:5px;fill:#f4f1e8}
  .van2{font-family:'Outfit',sans-serif;font-weight:300;font-size:12px;letter-spacing:3px;fill:#f4f1e8}
  .bill{font-family:'Oswald',sans-serif;font-weight:600;fill:#b3261c;text-anchor:middle}
  .st1{font-family:'Stardos Stencil',serif;font-weight:700;fill:#2a1c10;text-anchor:middle}
  .boat{animation:bob 4.4s ease-in-out infinite alternate}.boat.b2{animation-duration:3.4s;animation-delay:-1.2s}
  @keyframes bob{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg) translateY(3px)}}
  .fly{animation:fly 26s linear infinite}.fly.f2{animation-duration:34s;animation-delay:-12s}.fly.f3{animation-duration:21s;animation-delay:-6s}
  @keyframes fly{from{transform:translate(-200px,40px)}50%{transform:translate(900px,-60px)}to{transform:translate(2000px,30px)}}
  .wing{animation:wing .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes wing{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
  .glint{stroke-dasharray:18 70;animation:glint 7s linear infinite}
  @keyframes glint{to{stroke-dashoffset:-176}}
  #walkers{animation:walk 60s linear forwards}
  @keyframes walk{to{transform:translateX(-120px)}}

  .closed{position:fixed;right:3vw;top:66px;z-index:34;width:min(430px,92vw);padding:26px 28px 22px;background:#fbf6ea;color:#2a221a;
    box-shadow:0 20px 60px rgba(40,30,10,.45);display:none;transform:rotate(1deg)}
  .closed.on{display:block}
  .stamp{display:inline-block;border:4px solid #b3261c;color:#b3261c;font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;letter-spacing:.2em;
    padding:4px 16px 3px;transform:rotate(-5deg);margin-bottom:14px;opacity:.88}
  .closed p{margin:0 0 8px;font-family:'EB Garamond',Georgia,serif;font-size:20px;line-height:1.4}
  .closed .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .closed .btn{--accent:#2a221a;font-size:13px;padding:8px 14px}.closed .btn:hover{color:#fbf6ea}
  .closed small{display:block;margin-top:14px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
  .closed small button{text-decoration:underline;letter-spacing:.14em;text-transform:uppercase}

  .rp{width:min(760px,94vw);max-height:84vh;overflow:auto;background:#fbf6ea;color:#2a221a;padding:32px 38px 30px;box-shadow:0 26px 70px rgba(0,0,0,.5);
    -webkit-user-select:text;user-select:text}
  .rp h4{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#16233b}
  .rp h3{margin:0 0 20px;font-family:'Special Elite',monospace;font-weight:normal;font-size:23px;border-bottom:2px solid #16233b;padding-bottom:10px}
  .rp label{display:block;font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:600;margin:16px 0 6px}
  .rp textarea,.rp input[type=text]{width:100%;font-family:'Special Elite',monospace;font-size:17px;line-height:1.5;color:#1d2a4a;background:#fffdf6;border:1px solid #b9ad8c;
    padding:9px 12px;border-radius:2px;resize:vertical;-webkit-user-select:text;user-select:text}
  .rp textarea{min-height:104px}
  .rp .yn{display:flex;gap:22px;font-family:'Special Elite',monospace;font-size:18px;margin:4px 0 8px}
  .rp .yn label{display:inline-flex;align-items:center;gap:8px;margin:0;font:inherit;font-weight:normal;cursor:pointer}
  .rp .count{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;text-align:right}
  .rp .foot{display:flex;gap:10px;align-items:center;margin-top:18px}
  .rp .foot span{flex:1;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:17px;opacity:.7}
  .rp .btn{--accent:#16233b}.rp .btn:hover{color:#fbf6ea}
  @media print{
    body{overflow:visible;background:#fff}
    body>*:not(.ov){display:none!important}
    .ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
    .ov-bar,.rp .foot{display:none!important}
    .rp{box-shadow:none;max-height:none;width:auto;overflow:visible}
    .rp textarea,.rp input[type=text]{border:0;border-bottom:1px solid #999;background:#fff}
  }
</style>
</head>

    for (y = 264; y < 734; y += 26, i++) {
      if (y > 492 && y < 556) continue;
      s += '<rect x="500" y="' + y + '" width="' + (i % 2 ? 22 : 36) + '" height="24"/><rect x="' + (i % 2 ? 1078 : 1064) + '" y="' + y + '" width="' + (i % 2 ? 22 : 36) + '" height="24"/>';
    }
    $('#quoins').innerHTML = s;
  })();

  ER.init({
    theme: 'mystery', story: 'forty', storyTitle: 'Forty Minutes of Dark', id: 'morning', no: 'VII', title: 'Harbour Road, morning',
    go: 'Open the front door',
    intro: [
      'PC Marsh writes it down and underlines it twice. <em>Property of Mrs Ida Sorley.</em>',
      'Mrs Sorley folds the letter along its old lines. &ldquo;You should have had your tea with me, dear,&rdquo; she says to Ruth. &ldquo;I came to tell you it was never theirs to take.&rdquo;',
      'Nobody in the hall says anything. The chronometer, which has not been asked, goes on ticking.'
    ],
    exit: {"last":true,"rooms":7,"stars":4}, tags: {},
    onBegin: begin
  });

  function begin() {
    var st = ER.state();
    if (!ER.flag('tEnd')) ER.flag('tEnd', Date.now());
    setTimeout(ER.sfx.gull, 900); setTimeout(ER.sfx.gull, 4200);
    ER.narrate([
      'Eight o&rsquo;clock in the morning. The storm has gone out to sea, and every gull in Pellam has come to see what happened.',
      'The City Museum&rsquo;s van takes twenty-two crates, and leaves one shelf in a basement empty.',
      'Along the quay, an old lady and a curator are arguing about which of them should carry the box.',
      'It needs winding every evening at six. Only one of them knows how.'
    ], function () {
      var mins = Math.max(1, Math.round((ER.flag('tEnd') - (st.t0 || ER.flag('tEnd'))) / 60000));
      $('#cl-time').textContent = 'You closed the case in ' + mins + (mins === 1 ? ' minute.' : ' minutes.');
      $('#cl-words').textContent = 'In your notebook: ' + st.clues.length + ' clues and ' + Object.keys(st.words).length + ' new words.';
      var hn = ER.hintsUsed();
      $('#cl-hints').textContent = hn ? 'You asked for ' + hn + (hn === 1 ? ' hint.' : ' hints.') : 'You did not ask for a single hint.';
      $('#closed').classList.add('on'); ER.sfx.ok();
    });
  }
  $('#b-book').addEventListener('click', ER.notebook);
  $('#b-lobby').addEventListener('click', function () { ER.leave('../index.html'); });
  $('#b-reset').addEventListener('click', function () {
    var b = $('#b-reset');
    if (b.getAttribute('data-sure')) { ER.resetStory(); location.href = '../index.html'; return; }
    b.setAttribute('data-sure', '1'); b.textContent = 'this empties your notebook. click again to do it';
  });

  /* the report: the one part nobody can open for you */
  $('#b-report').addEventListener('click', function () {
    var saved = ER.flag('report') || {}, box = ER.el('div', 'rp');
    box.innerHTML = '<h4>Pellam Harbour Police</h4><h3>Report of the detective &middot; Case 0412</h3>' +
      '<label for="r1">1. What happened in the museum last night? Write it in order, and give the times.</label><textarea id="r1"></textarea>' +
      '<label for="r2">2. Three people hid something from you. Whose secret mattered most? Why?</label><textarea id="r2"></textarea>' +
      '<label>3. Should Ruth Okafor be charged with theft?</label><div class="yn"><label><input type="radio" name="yn" value="yes"> Yes</label><label><input type="radio" name="yn" value="no"> No</label></div>' +
      '<textarea id="r3" placeholder="Because&hellip;"></textarea>' +
      '<label for="r4">Signed</label><input type="text" id="r4" maxlength="60">' +
      '<div class="count"></div><div class="foot"><span>Saved in this browser as you type.</span><button type="button" class="btn" id="r-print">Print</button><button type="button" class="btn" id="r-done">Done</button></div>';
    ER.glossIn(box, '.rp > label');
    ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { box.querySelector('#' + k).value = saved[k] || ''; });
    if (saved.yn) { var r = box.querySelector('input[value=' + saved.yn + ']'); if (r) r.checked = true; }
    function keep() {
      var o = {}, n = 0, c = box.querySelector('input[name=yn]:checked');
      ['r1', 'r2', 'r3', 'r4'].forEach(function (k) { o[k] = box.querySelector('#' + k).value; });
      o.yn = c ? c.value : '';
      ['r1', 'r2', 'r3'].forEach(function (k) { n += (o[k].match(/[A-Za-z’']+/g) || []).length; });
      box.querySelector('.count').textContent = n + (n === 1 ? ' word' : ' words');
      ER.flag('report', o);
    }
    box.addEventListener('input', keep); box.addEventListener('change', keep);
    box.addEventListener('keydown', function (e) { e.stopPropagation(); });
    box.querySelector('#r-print').addEventListener('click', function () { keep(); window.print(); });
    box.querySelector('#r-done').addEventListener('click', ER.close);
    ER.open('ov-report', box); keep();
  });
})();
</script>
</body>
</html>
