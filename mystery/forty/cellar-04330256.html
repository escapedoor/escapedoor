<style>
  body{--bg:#0b0d0b;--accent:#f0c53a;--font-display:'Stardos Stencil',serif;--font-ui:'Oswald',sans-serif;
    --tc-bg:rgba(8,10,8,.93);--cap-bg:rgba(10,12,10,.93);--panel:#171a16;--face-bg:#4b3b2c;--q-ink:#c2b06a;--fade:#040504}
  .tc-room{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .st1{font-family:'Stardos Stencil',serif;font-weight:700;fill:#22170c;text-anchor:middle;opacity:.86}
  .dgr{font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;letter-spacing:5px;fill:#b3261c;text-anchor:middle}
  .dgr2{font-family:'Oswald',sans-serif;font-weight:500;font-size:11px;letter-spacing:2px;fill:#1a1a1a;text-anchor:middle}
  #dark{transition:opacity 1.6s}
  #bulbGlow,#bulbOn,#doorLight{transition:opacity 1.2s}
  #flameG{animation:fl 1.7s ease-in-out infinite;transform-origin:1195px 604px}
  @keyframes fl{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.12)}60%{transform:scale(1.08,.92)}}
  #drop{animation:drop 2.9s cubic-bezier(.6,0,1,.6) infinite}
  @keyframes drop{0%{transform:translateY(0);opacity:0}8%{opacity:.9}70%{transform:translateY(590px);opacity:.9}72%,100%{transform:translateY(590px);opacity:0}}
  .rip{animation:rip 2.9s linear infinite;transform-box:fill-box;transform-origin:center;opacity:0}
  @keyframes rip{0%,68%{transform:scale(.2);opacity:0}72%{opacity:.7}100%{transform:scale(1.5);opacity:0}}
  #cabinet{animation:cab 3.2s steps(3) infinite}
  #cabinet.done{animation:none}
  @keyframes cab{50%{filter:brightness(1.25)}}
  .gobtn{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:35;display:none;padding:13px 30px;border:1px solid #f0c53a;
    color:#f0c53a;background:rgba(10,12,10,.88);font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.18em;text-transform:uppercase;border-radius:3px}
  .gobtn.on{display:block}
  .gobtn:hover{background:#f0c53a;color:#0b0d0b}

  /* padlock */
  .pl{width:min(580px,94vw);background:#272c28;border:1px solid #4d5a52;padding:26px 30px 30px;color:#e8e3d4;box-shadow:0 26px 70px rgba(0,0,0,.7);text-align:center}
  .pl-tag{position:relative;background:#f3ecd4;font-family:'Caveat',cursive;font-size:26px;line-height:1.25;color:#1d2a4a;padding:14px 18px 14px 40px;
    transform:rotate(-1.5deg);margin:0 auto 6px;text-align:left;box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .pl-tag:before{content:'';position:absolute;left:14px;top:50%;width:11px;height:11px;margin-top:-6px;border-radius:50%;background:#272c28;box-shadow:inset 0 0 0 2px #8b7a52}
  .pl-body{display:inline-block;position:relative;margin-top:78px;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#e2c467,#a37f2c 60%,#7d5f1d);
    box-shadow:0 8px 20px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,245,200,.5)}
  .pl-sh{position:absolute;left:50%;top:-64px;width:124px;height:80px;margin-left:-62px;border:15px solid #9aa2a5;border-bottom:0;border-radius:62px 62px 0 0;
    transition:transform .35s;transform-origin:100% 100%}
  .pl.open .pl-sh{transform:translateY(-14px) rotate(-22deg)}
  .wh{display:inline-block;width:64px;height:88px;margin:0 5px;background:#12100b;color:#f5df98;font-family:'Oswald',sans-serif;font-weight:500;font-size:54px;
    line-height:88px;border-radius:7px;cursor:ns-resize;touch-action:none;box-shadow:inset 0 12px 14px rgba(0,0,0,.85),inset 0 -12px 14px rgba(0,0,0,.85)}
  .pl-foot{margin-top:22px;display:flex;align-items:center;gap:14px}
  .pl-msg{flex:1;text-align:left;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;min-height:26px;color:#e6c98a}
  .pl-help{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-top:12px}

  /* fuse board */
  .fb{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;width:min(1000px,96vw);background:#3d4841;border:3px solid #202622;padding:24px;
    box-shadow:0 26px 70px rgba(0,0,0,.7),inset 0 0 0 2px #55635a}
  .fb h5{grid-column:1/3;margin:0;font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:.3em;color:#f1eee2;background:#b3261c;padding:6px 14px;justify-self:start;text-transform:uppercase}
  .fb-board{background:#1a211d;padding:22px 8px 18px;display:flex;justify-content:space-around;border-radius:4px;box-shadow:inset 0 0 0 2px #0d1210;align-self:start}
  .sw{width:104px;text-align:center}
  .sw-lamp{width:16px;height:16px;border-radius:50%;margin:0 auto 12px;background:#33271a;box-shadow:inset 0 0 0 2px #140f09}
  .sw.on .sw-lamp{background:#ffcf5a;box-shadow:0 0 16px #ffcf5a}
  .sw-slot{position:relative;width:34px;height:156px;margin:0 auto;background:#090d0b;border-radius:17px;box-shadow:inset 0 0 0 3px #2a332e}
  .sw-knob{position:absolute;left:-14px;top:5px;width:62px;height:46px;border-radius:10px;background:linear-gradient(#444,#0f0f0f);cursor:grab;touch-action:none;
    box-shadow:0 5px 9px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.22);transition:top .14s}
  .sw.on .sw-knob{top:105px}
  .sw-knob.on{transition:none;cursor:grabbing}
  .sw-label{margin-top:14px;background:#f1eee2;color:#14110d;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.07em;padding:5px 2px;
    border-radius:2px;box-shadow:inset 0 0 0 2px #14110d}
  .fb-card{background:#f6efd9;font-family:'Caveat',cursive;font-size:23px;line-height:1.22;color:#1d2a4a;padding:16px 18px;transform:rotate(1.2deg);
    box-shadow:0 8px 18px rgba(0,0,0,.5);align-self:start}
  .fb-card h6{margin:0 0 8px;font-size:27px;text-decoration:underline}
  .fb-card p{margin:0 0 9px}
  .fb-msg{grid-column:1/3;min-height:26px;font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#f1eee2}
  .fb.pop{animation:popf .5s}
  @keyframes popf{0%{filter:brightness(4) saturate(0)}30%{filter:brightness(.3)}100%{filter:none}}
  @media (max-width:760px){.fb{grid-template-columns:1fr}.fb h5,.fb-msg{grid-column:1}}
</style>

  ER.init({
    theme: 'mystery', story: 'forty', storyTitle: 'Forty Minutes of Dark', id: 'cellar', no: 'IV', title: 'The Cellar',
    go: 'Go down',
    intro: [
      '&ldquo;Then nobody needed the dark,&rdquo; says PC Marsh, and writes it down. The chronometer was gone before the lights ever went out. Nobody&rsquo;s story about the dark matters now.',

    exit: {"next":"office","w":{"23118df1":"535f532b"}}, tags: {"padlock":["663361f9"]},

  });

  var LIST = '<h4>Pellam Museum: crates for the City</h4><table>' +

  var TAG = 'If I forget again: my years in this building, then the crate that nearly finished me tonight. D.';
  var CARD = '<h6>Order matters</h6><p>Get it wrong and the lot blows again.</p><p>1. The cellar first, or you will break your neck down here.</p>' +
    '<p>2. Never the kitchen before the hall.</p><p>3. The Chart Room straight after the hall.</p><p>4. The office last. Ruth can wait.</p><p>D.P.</p>';

  function hints() {

      'Read Dennis&rsquo;s card beside the switches. It has four rules, and only one order obeys them all.',

    if (!done.pym) return ['pym', [
      'Somebody down here knows this cellar better than anybody. Click on him, and listen to the end.',
      'After that, look at the grey cabinet on the wall. That is the fuse box.'
    ]];
    return ['padlock', [
      'The grey cabinet on the wall is the fuse box. Click on it and read the label tied to the lock.',
      'The label asks for two things: Dennis&rsquo;s years in this building, and the number of one crate. He told you both. His words are in your Notebook.',
      'How many years has Dennis had the keys? That gives you two of the numbers. Which crate was so heavy that it needed two men? That is the third. Drag each wheel up or down.'
    ]];
  }
  function begin() {
    ER.amb.rain(0.012); pips();
    dripT = setInterval(function () { ER.sfx.drip(); }, 2900);
    ER.narrate(['It smells of tar and wet rope down here. A man is sitting on a crate with a candle and a flask, in no hurry at all.']);
  }
  function pips() { ER.pips(done.pym + done.lock + done.light, 3); }

  $('#crates').addEventListener('click', function (e) { if (busy) return; ER.wordAt(e.clientX, e.clientY, 'crate'); ER.say('Twenty-two crates, sealed and listed. Nobody has opened one tonight.'); });
  $('#clip').addEventListener('click', function () { if (busy) return; ER.read({ html: LIST, cls: 'list', clue: { id: 'crates', title: 'Crate list', kind: 'Museum paper' } }); });
  $('#stairs').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.leave(nextFile); return; }
    ER.say('The steps back up to the hall. It is too dark to go anywhere until somebody finds the fuses.');
  });
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#pym').addEventListener('click', function () {
    if (busy) return;
    var c = CAST.pym;
    ER.talk({
      who: c.who, role: c.role, face: FACE('pym'),
      lines: [
        'Mind the puddle. Dennis Pym. Thirty-one years I&rsquo;ve had the keys to this place. Every door but that glass one. Tomorrow I hand them in. Ruth keeps hers till the end of the month, for the paperwork.',
        'I was up and down these steps all evening with crates. Quarter past seven I went through the Chart Room to the kitchen for my flask, and the clock was going under its sheet, same as ever. You stop noticing it, and then you notice it.',
        'About twenty to eight Ruth sent the lad down to help me with crate nine. I hadn&rsquo;t asked for anybody. But crate nine is the anchor chain and weighs what you&rsquo;d think, so I didn&rsquo;t argue. Ten minutes it took the two of us to get it up these steps.',
        'Ruth was in the hall when we came out, by the tall clock, with a packet of biscuits in her hand. &ldquo;Mind the door frame,&rdquo; she says. Twenty years, and she still thinks I&rsquo;ll hit the door frame.',
        { q: 'Did you notice anything strange tonight?', a: 'Only that tall clock. I wind it Mondays. It&rsquo;s gone tock, tock, tock since before I was born. Tonight, when I stood next to it getting my breath back, it sounded like it had a stone in its shoe. I thought, even the clock knows we&rsquo;re finished.' },
        'I was still in the hall when the old lady came down, about eight. I held the Chart Room door for her and came back to my crates.',
        { q: 'And when the lights went out?', a: 'I was down here. I felt my way to the fuse box. Nobody saw me.' },
        { q: 'The whole harbour was dark. Why stay forty minutes at a fuse box?', a: 'All right. The fuses took two minutes. Then I sat in my chair. It&rsquo;s my last night. I&rsquo;m allowed to sit in my chair.' },
        { q: 'And the whistle in your coat pocket?', a: 'Thirty-one years. I wanted one thing.' },
        'The fuse box is over there. It&rsquo;s locked, and I&rsquo;ve forgotten the number again. I wrote myself a note. It&rsquo;s tied to the lock.'
      ],
      clue: { id: 'pym', title: 'Dennis Pym, in the cellar' },
      done: function (seen) { if (seen && !done.pym) { done.pym = 1; pips(); } }
    });
  });
  $('#cabinet').addEventListener('click', function () { if (busy || done.light) return; if (done.lock) openBoard(); else openPadlock(); });

  /* the padlock: three wheels */
  function openPadlock() {
    var box = ER.el('div', 'pl'), d = [0, 0, 0];
    box.innerHTML = '<div class="pl-tag"></div><div class="pl-body"><div class="pl-sh"></div><span class="wh">0</span><span class="wh">0</span><span class="wh">0</span></div>' +
      '<div class="pl-help">drag a wheel up or down</div><div class="pl-foot"><div class="pl-msg"></div><button type="button" class="btn">Pull it open</button></div>';
    box.querySelector('.pl-tag').innerHTML = ER.gloss(TAG);
    var msg = box.querySelector('.pl-msg');
    ER.$$('.wh', box).forEach(function (w, i) {
      var y0 = 0, start = 0;
      function set(v) { d[i] = ((v % 10) + 10) % 10; w.textContent = d[i]; }
      ER.drag(w, {
        start: function (e) { if (done.lock) return false; y0 = e.clientY; start = d[i]; },
        move: function (e) { var n = start + Math.round((y0 - e.clientY) / 26); if (((n % 10) + 10) % 10 !== d[i]) { set(n); ER.sfx.click(); } },
        end: function (e, moved) {
          if (moved) return;
          var r = w.getBoundingClientRect(); set(d[i] + (e.clientY < r.top + r.height / 2 ? 1 : -1)); ER.sfx.click();
        }
      });
    });
    box.querySelector('.btn').addEventListener('click', function () {
      if (done.lock) return;
      if (ER.check('padlock', d.join(''))) {
        done.lock = 1; pips(); box.classList.add('open'); ER.sfx.clunk(); msg.textContent = 'The lock drops open.';
        $('#plock').setAttribute('opacity', 0); $('#cabOpen').setAttribute('opacity', 1);
        setTimeout(function () { ER.closeAll(); openBoard(); }, 1500);
      } else {
        ER.sfx.chain(); ER.shake(box.querySelector('.pl-body'));
        msg.textContent = 'It rattles. It does not open.';
      }
    });
    ER.open('ov-lock', box);
  }

  /* the fuse board: five switches, and only one order works */
  var SW = [['kitchen', 'Kitchen'], ['office', 'Office'], ['cellar', 'Cellar'], ['chart', 'Chart Room'], ['hall', 'Hall']];
  function openBoard() {
    var box = ER.el('div', 'fb'), board, msg;
    box.innerHTML = '<h5>Mains</h5><div class="fb-board"></div><div class="fb-card">' + ER.gloss(CARD) + '</div><div class="fb-msg">Five switches, all off. Pull one down to switch it on.</div>';
    board = box.querySelector('.fb-board'); msg = box.querySelector('.fb-msg');
    SW.forEach(function (s) {
      var n = ER.el('div', 'sw', '<div class="sw-lamp"></div><div class="sw-slot"><div class="sw-knob"></div></div><div class="sw-label"></div>');
      n.setAttribute('data-id', s[0]); n.querySelector('.sw-label').textContent = s[1].toUpperCase(); board.appendChild(n);
      var knob = n.querySelector('.sw-knob'), y0 = 0;
      function on() {
        if (n.classList.contains('on') || done.light) return;
        n.classList.add('on'); seq.push(s[0]); ER.sfx.clunk();
        msg.textContent = seq.length + ' of 5 on.';
        if (seq.length === 5) setTimeout(judge, 700);
      }
      ER.drag(knob, {
        start: function (e) { if (n.classList.contains('on') || done.light) return false; y0 = e.clientY; },
        move: function (e) { knob.style.top = Math.max(5, Math.min(105, 5 + e.clientY - y0)) + 'px'; },
        end: function (e, moved) { var far = (e.clientY - y0) > 45; knob.style.top = ''; if (far || !moved) on(); }
      });
    });
    seq.forEach(function (id) { box.querySelector('.sw[data-id=' + id + ']').classList.add('on'); });
    function judge() {
      var f = ER.exitOk([seq.join('>')]);
      if (f) return lightsOn(f, box, msg);
      seq = []; ER.sfx.pop(); box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
      ER.$$('.sw', box).forEach(function (n) { n.classList.remove('on'); });
      msg.textContent = 'A blue flash, a bang, and all five jump back up. “Read the card,” says Dennis, without getting up.';
    }
    ER.open('ov-lock', box);
  }
  function lightsOn(file, box, msg) {
    done.light = 1; pips(); nextFile = file; busy = true;
    var st = ER.state(); st.done = st.done || {}; st.done.cellar = 1;
    msg.textContent = 'One by one, the lamps come on.';
    ER.sfx.ok(); ER.amb.hum(true);
    setTimeout(function () {
      ER.closeAll();
      $('#dark').setAttribute('opacity', 0.14); $('#bulbGlow').setAttribute('opacity', 1); $('#bulbOn').setAttribute('opacity', 1);
      $('#doorLight').setAttribute('opacity', 0.85); $('#cabinet').classList.add('done');
      ER.narrate([
        '&ldquo;There,&rdquo; says Dennis Pym. &ldquo;Thirty-one years, and it still does as it&rsquo;s told.&rdquo;',
        'Upstairs, somebody cheers. PC Marsh shouts down the steps that they are all waiting for you in the office.'
      ], function () { busy = false; $('#go').classList.add('on'); });
    }, 1300);
  }
  /* tiny switches in the scene, just for looks */
  (function () {
    var s = '', i;
    for (i = 0; i < 5; i++) s += '<rect x="' + (1304 + i * 46) + '" y="252" width="28" height="22" rx="5"/>';
    $('#minis').innerHTML = s;
  })();
})();
</script>
</body>
</html>
