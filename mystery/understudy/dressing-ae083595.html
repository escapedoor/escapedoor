<style>
  body{--bg:#4a1c28;--accent:#f0c35a;--font-display:'Pacifico',cursive;--font-ui:'Oswald',sans-serif;--font-body:'EB Garamond',serif;

  .tc-room{font-size:clamp(34px,5vw,66px);line-height:1.2;margin:4px 0 20px}
  .tk-name{font-family:'IM Fell English SC',serif}
  .bulbglow{animation:bulb 3.6s steps(1,end) infinite}
  .bulbglow.b{animation-duration:5.3s;animation-delay:-1.7s}.bulbglow.c{animation-duration:4.4s;animation-delay:-2.9s}
  @keyframes bulb{0%{opacity:.95}34%{opacity:.8}52%{opacity:1}81%{opacity:.88}}
  #rain4{animation:rain4 .8s linear infinite}
  @keyframes rain4{from{transform:translate(0,0)}to{transform:translate(-12px,80px)}}
  #steam4{animation:steam4 3.2s ease-in-out infinite;transform-origin:1360px 560px}
  @keyframes steam4{0%{opacity:0;transform:translateY(10px)}35%{opacity:.6}100%{opacity:0;transform:translateY(-36px)}}
  #qcbook.ready{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.25)}}

  /* the tape measure as a clock, four pins, and her book */
  .bx.tp{width:min(1160px,96vw)}
  .tp-frame{box-shadow:0 20px 50px rgba(0,0,0,.6);border-radius:3px;overflow:hidden}
  .tp-tick{stroke:#3a3024;stroke-width:1.400}
  .tp-num{font-family:'Oswald',sans-serif;font-weight:500;font-size:13.5px;fill:#3a3024;text-anchor:middle}
  .tp-note{font-family:'Patrick Hand',cursive;font-size:16px;fill:#dfe6f7}
  .pin{cursor:grab}
  .pin.on{cursor:grabbing}
  .pin text{font-family:'Patrick Hand',cursive;font-size:15.5px;fill:#2a2440;text-anchor:middle}
  .pin.cur .flag{stroke-width:3.500}
  .tp-two{display:grid;grid-template-columns:680px 1fr;gap:0 18px;align-items:start;margin-top:10px}
  .tp-two .doc{width:100%;max-height:none;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .tp-side .pmsg{min-height:150px;margin:0 0 8px}
  .tp-nudge{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#d9c9b0}
  .tp-nudge button{width:38px;height:30px;border:1px solid rgba(255,255,255,.35);border-radius:3px;background:rgba(0,0,0,.4);color:#f6ead6;font-size:14px}
  .tp-nudge button:hover{border-color:#f0c35a;color:#f0c35a}
  .tp-sums{display:none;margin:0 0 10px}
  .tp-side.two .tp-sums{display:block}
  .tp-side.two .tp-nudge{display:none}
  .tp-sums .wls{display:flex;margin:0 0 7px;justify-content:space-between}
  .tp-sums .wls small{font-size:12.5px;text-align:left;flex:1}
  .tp-side .btn{float:right}
</style>
</head>

    if (bench && bench.isOpen()) return [['pins', [
      'The tape is the time: one centimetre for one second. It starts at nought, when the blue lamp goes out. Each pin is a moment. Two of the four moments are written in Mrs Greaves&rsquo;s book.',
      'Her book gives times in minutes and seconds, as the running order does: 1.05 would be one minute and five seconds, which is 65 seconds. The other two pins need papers from other rooms: how long the second dark lasts, and when the Countess comes out on to the terrace.',
      'The lights come up when the dark is over: you worked out its length in the lighting box, and it is in your notes. The running order says that the Countess walks on at 1.10 after that. Add the two together.'
    ]], ['sums', [
      'In hand: from the moment when she is dressed and &ldquo;gone&rdquo; at a rehearsal, to the moment when she must walk on. Count the centimetres between those two pins.',
      'Lost: &ldquo;gone&rdquo; tonight against &ldquo;gone&rdquo; on Wednesday. Or count it another way: tonight she reached the chair on 15, and she is always there on 3.'
    ]]][bench.stage()];
    if (!told.las) return ['las', ['It is Miss Lascelles&rsquo;s room, and she will talk to you in the mirror. Click on her.']];
    if (!told.gre) return ['gre', ['The person with a stopwatch round her neck is Mrs Greaves, at the ironing board. She is waiting to be asked.']];
    return ['book', ['Mrs Greaves&rsquo;s book is lying on the chair in the middle of the room: the small lilac one.']];
  }
  function begin() {
    US.file('call', true); US.file('run', true); US.file('key', true);
    paint();
    if (nextFile) { busy = false; showGo(); ER.say('The speaker over the door has called everybody to the stage.'); return; }
    if (told.in) { busy = false; ER.say('Dressing room 1. Mrs Greaves is still pressing the ball gown, and Miss Lascelles is still not dressing.'); return; }
    tell('in');
    ER.narrate([
      'It is the warmest room in the building. There are bulbs all round the mirror, flowers standing in the basin, and cards stuck into the frame. In front of the mirror, with her back to you, sits Miss Lascelles in a plum-coloured dressing gown. She is not getting ready for Act Two.',
      'At an ironing board a grey-haired woman is pressing a ball gown with a small iron, slowly, as if there were all the time in the world. She has a tape measure round her neck and a stopwatch on a ribbon. This is Mrs Greaves, who has dressed Miss Lascelles for twenty-six years.',
      '&ldquo;The child from the stool,&rdquo; says Miss Lascelles, to the mirror. &ldquo;Ms Tindall has sent you to ask where I was. I was on the stage, dear. A hundred and eighty-six people will tell you so.&rdquo;'
    ], function () { busy = false; });
  }

  /* ---------- people ---------- */
  $('#lascelles').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Miss Lascelles is looking at herself in the glass, and for once she does not seem to like the audience.'); return; }
    ER.talk({
      who: 'Miss Verity Lascelles', role: 'The Countess · fifty years on the stage', face: window.FACE('lascelles'),
      lines: [
        { note: 'She speaks to you in the mirror, without turning round. In the glass she looks like a queen on a coin.', a: '&ldquo;My grandmother wore those stones, and my mother after her. I have worn them on every first night for fifty years. I shall not go on in Mossop&rsquo;s glass. If the stones cannot be found, there is no second act, and nobody can blame the Jackdaw for that. Things are stolen. It is nobody&rsquo;s fault.&rdquo;' },
        { q: 'Where were you in the second dark?', a: 'Changing my dress, dear. I say my last line down by the window. I go off on the prompt side, and I walk straight to my chair, where Greaves is waiting. I stop for nothing and I touch nothing. Out of the grey silk, into the blue velvet, and on again for the terrace.' },
        { q: 'How long does that take?', a: 'All the time there is. Ask Greaves: she holds a watch on me as if I were a horse. In a quick change one has not a second to spare, child. Not one. One does not go shopping on the way.' },
        { q: 'Who do you think took it?', a: 'I do not think about it at all. Hugo Crane thinks it was that girl who follows me about with a book. I dare say he is wrong. He usually is.</p><p class="note">For a moment her eyes go to the long strips of paper round the mirror. Then they come back to you.</p><p>But I shall not go on in glass.' },
        { note: 'She turns her head a very little, towards the ironing board.', a: '&ldquo;Greaves. You may fetch the grey silk up from the wings. It will crease.&rdquo;</p><p>&ldquo;Ms Tindall says that nothing is to be moved, Madam.&rdquo;</p><p class="note">A very small silence.</p><p>&ldquo;Then let it crease.&rdquo;' }
      ],
      clue: { id: 'las1', title: 'Miss Lascelles, at her mirror', kind: 'What she said' },
      done: function (seen) { if (seen && tell('las')) { paint(); ER.say('At the ironing board, Mrs Greaves has not looked up once.'); } }
    });
  });
  $('#greaves').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('&ldquo;I did not tell you,&rdquo; says Mrs Greaves. &ldquo;You counted it.&rdquo; She seems to want that to be quite clear.'); return; }
    if (!told.las) { ER.say('&ldquo;Madam first,&rdquo; says Mrs Greaves, without looking up from the iron. &ldquo;It is her room.&rdquo;'); return; }
    ER.talk({
      who: 'Mrs Greaves', role: 'Dresser · wardrobe', face: window.FACE('greaves'),
      lines: [
        { note: 'She stands the iron on its end before she speaks, and she looks at you for some time first.', a: '&ldquo;I dress her. I have dressed her since before you were born, and I do not talk about her. But I will tell you how I work, because that is in my book, and what is in my book is true.&rdquo;' },
        { q: 'How do you time a quick change?', a: 'The watch starts when the blue lamp goes out. It stops when she leaves my hands, dressed, and I say &ldquo;gone&rdquo;. Hooks, sleeves, the velvet, the slippers, the comb in her hair. I have never told a lie about a quick change. A dresser who does is no use to anybody.' },
        { q: 'Was tonight the same as the rehearsals?', a: 'The work was the same. I counted it as I did it: seventy-two seconds, the same as on Wednesday.</p><p class="note">She picks the iron up again.</p><p>Madam is at my chair by the count of three. She has four steps to walk, past the props table. Tonight I stood there with the velvet open in my arms, and I had counted fifteen before she came.' },
        { q: 'Did she give you her fan?', a: 'She had no fan. She always gives me the fan. Tonight her hands were empty when they came to me.</p><p class="note">She thinks about the word &ldquo;empty&rdquo; for a moment, and does not change it.' },
        { q: 'Is there anything else?', a: 'I answer what I am asked.</p><p class="note">She turns the ball gown over.</p><p>On Wednesday night she had me sew a pocket into the grey silk. For a handkerchief, she said. In twenty-six years Madam has never carried her own handkerchief. I carry it. That is in my book too, under Wednesday. The book is on the chair. You can read, I suppose.' }
      ],
      clue: { id: 'gre1', title: 'Mrs Greaves, at the ironing board', kind: 'What she said' },
      done: function (seen) { if (seen && tell('gre')) { US.words(['dresser', 'quick change', 'stopwatch']); paint(); ER.say('Her book is lying on the chair in the middle of the room: a small lilac one, with a red ribbon in it.'); } }
    });
  });

  /* ---------- things in the room ---------- */
  US.thing('#strips', null, function () {
    return nextFile ? 'They are not first-night cards. It is the Countess&rsquo;s long speech from Act Two, every word of it, in letters two centimetres high.' :
      'Long strips of paper are stuck round the mirror, between the cards, covered with large black writing. You are too far away to read them, and it does not seem polite to go nearer.';
  }, isBusy);
  US.thing('#cards', null, 'First-night cards. BREAK A LEG, VERITY. H.C. In a theatre nobody wishes anybody good luck: that would be bad luck. They tell each other to break a leg.', isBusy);
  US.thing('#flowers', null, 'First-night flowers, still in their paper, standing in the basin. Nobody has had time to look for a vase.', isBusy);
  US.thing('#chocbox', null, 'A chocolate box, lined with cotton wool. In the cotton wool is the shape of a necklace, and nothing else. This is where the understudy has slept since Tuesday.', isBusy);
  US.thing('#gown', 'ball gown', 'The ball gown for Act Two: sea-green satin, cut low at the neck to show a necklace. Mrs Greaves is pressing it as if Act Two were certain.', isBusy);
  US.thing('#velvet', 'velvet', 'The blue velvet from Scenes 3 and 4, hanging over the screen. It has a collar as high as her ears.', isBusy);
  US.thing('#speaker', null, 'A small speaker on the wall. Ms Tindall&rsquo;s voice comes out of it into every dressing room: every call, every night.', isBusy);
  US.thing('#window4', null, 'Rain on the glass, and the lights of Thornsea running down it.', isBusy);
  $('#go').addEventListener('click', function () { if (nextFile) ER.leave(nextFile); });
  $('#qcbook').addEventListener('click', function () {
    if (busy) return;
    if (nextFile) { ER.say('Four lines of times, and one line about a pocket. Nothing in it is a lie.'); return; }
    if (!told.gre) { ER.say('A small lilac book on a chair, with a red ribbon to keep the place. Its owner is standing three steps away with a hot iron in her hand.'); return; }
    if (!bench) bench = makeBench();
    bench.open();
  });

  /* ---------- the tape: four moments, and then two sums ---------- */
  function makeBench() {
    var PINS = [['a', 'the lights come up on the terrace', '#4f7fe0', 8], ['b', 'the Countess must walk on', '#e3a92b', 104], ['c', '“gone”, on Wednesday', '#f4f1e8', 40], ['d', '“gone”, tonight', '#d23b2e', 72]],
      stage = ER.flag('d-stage') || 0, pos = ER.flag('d-pins') || [null, null, null, null], cur = -1, wait = false, wl = [], pins = [], box = ER.el('div', 'bx tp'), s, i, x, G = '&rdquo; says Mrs Greaves. &ldquo;';
    s = '<div class="tp-frame"><svg viewBox="0 0 1100 214"><rect width="1100" height="214" fill="#26345a"/><g stroke="#1c2742" stroke-width="18" opacity=".6"><path d="M120 0v214M380 0v214M640 0v214M900 0v214"/></g>' +
      '<rect x="36" y="150" width="1028" height="40" rx="3" fill="#f0d24a" stroke="#b99a1a" stroke-width="2"/>';
    for (i = 0; i <= 100; i++) {
      x = 50 + i * 10;
      s += '<path class="tp-tick" d="M' + x + ' 150v' + (i % 10 === 0 ? 20 : i % 5 === 0 ? 14 : 8) + '"/>';
      if (i % 10 === 0) s += '<text class="tp-num" x="' + x + '" y="185">' + i + '</text>';
    }
    s += '<text class="tp-note" x="40" y="207">0: the blue lamp goes out</text><text class="tp-note" x="1062" y="207" text-anchor="end">one centimetre for one second</text>';
    PINS.forEach(function (p, j) {
      s += '<g class="pin" data-i="' + j + '"><path d="M0 ' + (p[3] + 26) + 'V148" stroke="#c9ced3" stroke-width="2.500"/><circle cx="0" cy="150" r="8" fill="' + p[2] + '" stroke="#1c2742" stroke-width="2"/>' +
        '<g class="fl"><rect class="flag" x="-136" y="' + p[3] + '" width="272" height="26" rx="3" fill="#fbf8ee" stroke="' + (p[2] === '#f4f1e8' ? '#8d949c' : p[2]) + '" stroke-width="2"/><text x="0" y="' + (p[3] + 18.5) + '"></text></g></g>';
    });
    s += '</svg></div><div class="tp-two"><div class="doc qc">' + ER.gloss(US.DOC.qc) + '</div><div class="tp-side"><p class="pmsg"></p>' +
      '<div class="tp-nudge"><button type="button" data-d="-1" title="one second earlier">&#9664;</button><button type="button" data-d="1" title="one second later">&#9654;</button><span>move the last pin by one second</span></div>' +
      '<div class="tp-sums"></div><button type="button" class="btn" id="d-go"></button></div></div>';
    box.innerHTML = s;
    var svg = box.querySelector('svg'), msgEl = box.querySelector('.pmsg'), go = box.querySelector('#d-go'), side = box.querySelector('.tp-side'), sums = box.querySelector('.tp-sums');
    function msg(t) { msgEl.innerHTML = ER.gloss(t); }
    function draw() {
      pins.forEach(function (g, j) {
        var px = pos[j] == null ? 170 + j * 255 : 50 + pos[j] * 10, fx = US.clamp(px, 140, 960) - px;
        g.setAttribute('transform', 'translate(' + px + ' ' + (pos[j] == null ? -6 : 0) + ')');
        g.setAttribute('class', 'pin' + (cur === j ? ' cur' : ''));
        g.querySelector('.fl').setAttribute('transform', 'translate(' + fx + ' 0)');
        g.querySelector('text').textContent = PINS[j][1] + (pos[j] == null ? '' : ' · ' + pos[j] + ' s');
      });
      side.classList.toggle('two', stage === 1);
      go.textContent = stage ? 'That is the sum' : 'Show Mrs Greaves';
    }
    ER.$$('.pin', box).forEach(function (g, j) {
      pins[j] = g;
      ER.drag(g, {
        start: function () { if (wait || stage) return false; cur = j; },
        move: function (e, moved) { if (!moved) return; pos[j] = Math.round((US.clamp(ER.pt(svg, e).x, 50, 1050) - 50) / 10); draw(); },
        end: function (e, moved) { if (moved) { ER.flag('d-pins', pos); US.sfx.pin(); } draw(); }
      });
    });
    box.querySelector('.tp-nudge').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b || wait || stage) return;
      if (cur < 0 || pos[cur] == null) { msg('Drag a pin on to the tape first. Then these two arrows move it by one second at a time.'); return; }
      pos[cur] = US.clamp(pos[cur] + (+b.getAttribute('data-d')), 0, 100); ER.flag('d-pins', pos); US.sfx.key(); draw();
    });
    wl[0] = US.wheels(sums, { label: 'In hand, at a rehearsal', n: 2, unit: 'seconds', start: (ER.flag('d-w') || [])[0], change: keep });
    wl[1] = US.wheels(sums, { label: 'Lost tonight', n: 2, unit: 'seconds', start: (ER.flag('d-w') || [])[1], change: keep });
    function keep() { ER.flag('d-w', wl.map(function (w) { return w.at(); })); }
    function whyPin(j, v) {
      if (j === 0) return v === 25 ? '&ldquo;Twenty-five is counted from Ms Tindall&rsquo;s &lsquo;go&rsquo;,' + G + 'My watch starts when the blue lamp goes out: when it is black. How long was it black?&rdquo;' :
        '&ldquo;My tape starts where my watch starts: when the blue lamp goes out,' + G + 'How long did that boy in the lighting box say the second dark lasts? The lights come up at the end of it.&rdquo;';
      if (j === 1) return v === 70 ? '&ldquo;Seventy seconds after the lights come UP,' + G + 'My tape does not start at the light. It starts at the dark.&rdquo;' :
        v === 95 ? '&ldquo;You have counted from Ms Tindall&rsquo;s &lsquo;go&rsquo;,' + G + 'My watch starts later than that: when the lamp is out.&rdquo;' :
        '&ldquo;The running order says when the Countess comes out on to the terrace,' + G + 'It gives minutes and seconds, counted from the moment when the lights come up. And the lights come up where your blue pin is.&rdquo;';
      if (j === 2) return v === 76 ? '&ldquo;That was Tuesday,' + G + 'The last rehearsal was Wednesday.&rdquo;' :
        v === 72 ? '&ldquo;Seventy-two is the work alone,' + G + 'The watch has started before she reaches me. Read the &lsquo;gone&rsquo; column.&rdquo;' :
        '&ldquo;Wednesday is in my book,' + G + 'The &lsquo;gone&rsquo; column is in minutes and seconds, not in seconds.&rdquo;';
      return '&ldquo;Tonight is the last of the four,' + G + 'Minutes and seconds.&rdquo;';
    }
    go.addEventListener('click', function () {
      var j, hand, lost, file;
      if (wait || nextFile) return;
      if (!stage) {
        for (j = 0; j < 4; j++) if (pos[j] == null) { msg('Four pins, four moments. Drag every one of them down on to the tape.'); return; }
        for (j = 0; j < 4; j++) if (!ER.check('p' + PINS[j][0], pos[j])) { ER.sfx.no(); cur = j; draw(); msg('<b>' + PINS[j][1].charAt(0).toUpperCase() + PINS[j][1].slice(1) + '.</b> ' + whyPin(j, pos[j])); return; }
        stage = 1; ER.flag('d-stage', 1); cur = -1; US.sfx.pin(); draw(); paint();
        msg('&ldquo;That is my quick change, from the lamp going out to the Countess on the terrace,' + G + 'Now the sums. At the last rehearsal, how many seconds had she in hand between &lsquo;gone&rsquo; and her entrance? And how many seconds did tonight lose?&rdquo;');
        return;
      }
      hand = +wl[0].get(); lost = +wl[1].get();
      if (!ER.check('hand', hand)) {
        ER.sfx.no();
        msg('<b>In hand.</b> ' + (hand === pos[1] - pos[3] ? '&ldquo;That is what she had left TONIGHT,' + G + 'I asked what she has in hand at a rehearsal: from &lsquo;gone&rsquo; on Wednesday to the moment when she must walk on.&rdquo;' :
          '&ldquo;In hand: from the white pin to the gold one,' + G + 'Count the centimetres.&rdquo;'));
        return;
      }
      if (!ER.check('lost', lost)) {
        ER.sfx.no();
        msg('<b>Lost.</b> ' + (lost === 15 ? '&ldquo;She was at my chair on fifteen. But she is never there before three: it is four steps,' + G + 'How many of the fifteen are new?&rdquo;' :
          lost === hand ? '&ldquo;That is what she HAS, at a rehearsal,' + G + 'How much of it did tonight take away?&rdquo;' :
          lost === pos[1] - pos[3] ? '&ldquo;That is what was left,' + G + 'What was lost?&rdquo;' :
          '&ldquo;From the white pin to the red one,' + G + 'Or the count of fifteen against the count of three. It comes to the same.&rdquo;'));
        return;
      }
      file = ER.exit([pos.join('-') + '-' + hand + '-' + lost], { wait: true });
      if (!file) { msg('The tape has slipped. Something is wrong with this page: tell your teacher.'); return; }
      wait = true; nextFile = file; ER.flag('d-file', file); wl.forEach(function (w) { w.lock(true); });
      US.mine('tape', 'The quick change, in seconds', '<p>0: the blue lamp goes out.</p><p>' + pos[0] + ': the lights come up on the terrace.</p><p>' + pos[2] + ': &ldquo;gone&rdquo; at the last rehearsal. ' + pos[3] + ': &ldquo;gone&rdquo; tonight.</p><p>' + pos[1] + ': the Countess must walk on.</p>' +
        '<p>So she has ' + hand + ' seconds in hand, and tonight she lost <b>' + lost + '</b> of them between the stage and the chair: four steps, past the props table. She was at the chair on 15, not on 3, and she had no fan.</p>' +
        '<p>On Wednesday Mrs Greaves sewed a pocket into the grey silk.</p>', true);
      msg('&ldquo;' + hand + ' seconds in hand, at the last rehearsal. ' + lost + ' of them gone tonight, between the edge of the stage and my chair. Four steps, past one table,&rdquo; says Mrs Greaves. She winds the tape measure round her hand. &ldquo;I did not tell you that. You counted it.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Miss Lascelles has not moved. In the mirror her face is perfectly still. &ldquo;Greaves,&rdquo; she says, &ldquo;you hold that watch on me as if I were a horse.&rdquo; &ldquo;Yes, Madam,&rdquo; says Mrs Greaves. &ldquo;And tonight the horse stopped on the way.&rdquo;',
          'You are near enough now to read one of the long strips of paper that are stuck round the mirror. They are not first-night cards. It is the Countess&rsquo;s long speech from Act Two, every word of it, in letters two centimetres high.',
          'The speaker on the wall crackles. &ldquo;This is the stage manager. Everybody to the stage, please. Miss Lascelles. Mr Crane. Mr Ashdown. Miss Okeke. Mrs Greaves. And the stool. Stand by.&rdquo;'
        ], function () { busy = false; showGo(); });
      }, 4600);
    });
    draw();
    msg(stage ? 'The four pins are in. Now the two sums: seconds in hand at a rehearsal, and seconds lost tonight.' :
      'Mrs Greaves unrolls her tape measure along the ironing board and takes four pins out of her collar. &ldquo;One centimetre for one second. My watch starts at nought. Put each pin where it belongs.&rdquo; Drag the pins down on to the tape.');
    return {
      open: function () { ER.open('ov-lock', box); if (tell('qc')) { US.file('qc'); US.words(['tape measure', 'stopwatch']); } },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return stage; }
    };
  }
})();
</script>
</body>
</html>
