  .paintD{font-family:'Amatic SC',cursive;font-weight:700;fill:#231d14;text-anchor:middle}
  .sten{font-family:'Stardos Stencil',serif;font-weight:700;fill:#f6ead0;text-anchor:middle}
  .flick{animation:flick 4.1s steps(1,end) infinite}

  .mote{animation:mote 10s linear infinite;opacity:0}

  @keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translate(-30px,110px);opacity:0}}
  #dress{transform-origin:1450px 352px;animation:sway 6s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
  #table.ready #tabtop{animation:glow 1.6s steps(1,end) infinite}
  @keyframes glow{50%{filter:brightness(1.12)}}

  /* the table: painted outlines, and the things that lie in them */
  .ol{fill:none;stroke:#1b1b1f;stroke-width:3.200;stroke-linejoin:round;stroke-linecap:round}
  .plab{font-family:'Amatic SC',cursive;font-weight:700;font-size:42px;fill:#1b1b1f;text-anchor:middle}
  .spot{fill:#fff;fill-opacity:0;stroke:none;cursor:pointer}
  .spot:hover{stroke:#4f7fe0;stroke-width:2;stroke-dasharray:6 5}
  .spot.sel{stroke:#2f5fd0;stroke-width:4;fill:#4f7fe0;fill-opacity:.14}
  .bx.tb{width:min(1200px,96vw)}
  .tb-two{display:grid;grid-template-columns:520px 1fr;gap:0 16px;align-items:start}
  .tb-frame{border:10px solid #3a2717;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .tb-two .doc{width:100%;max-height:none;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .tb-left .bx-foot{display:block;margin-top:8px;overflow:hidden}
  .tb-left .pmsg{min-height:72px}
  .tb-pick{display:none;margin:6px 0 2px}
  .tb-left.two .tb-pick{display:block}
  .tb-pick h6{margin:0 0 3px;font-family:'Oswald',sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#9fc2ff}
  .tb-row{display:grid;gap:5px;margin:0 0 7px}
  .tb-row.who{grid-template-columns:repeat(3,1fr)}
  .tb-row.when{grid-template-columns:repeat(7,1fr)}
  .tb-row button{padding:6px 2px 5px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#e9eef7;border:1px solid rgba(255,255,255,.3);border-radius:3px;background:rgba(0,0,0,.45);white-space:nowrap}
  .tb-row button:hover{border-color:#9fc2ff}
  .tb-row button.sel{background:#9fc2ff;color:#0b0e16;border-color:#9fc2ff}
  .tb-left .btn{float:right}
</style>
</head>

        { note: 'He does not unfold his arms.', a: '&ldquo;Nobody touches it. That is Ms Tindall&rsquo;s order, and it is mine. Everything on this table is where it was when the curtain came down. Use your eyes, and use my list. I am not going to tell you what is wrong: I want to know if anybody else can see it.&rdquo;' },

        { q: 'Why didn&rsquo;t you put it right?', a: 'In Scene 3 I hold the moon. It is a lamp on a pole, and it wants two hands.</p><p class="note">He looks a little ashamed, and then decides not to be.</p><p>And after that I left it on purpose. Somebody had been at my table in the dark. I wanted Ms Tindall to see it at the interval, and I wanted that somebody spoken to.' },

  $('#crane').addEventListener('click', function () {

        { note: 'He is very tall, in a scarlet jacket with gold buttons, and he speaks as if the back row had paid to hear him.', a: '&ldquo;I accuse nobody. I merely say what I saw with my own eyes. Just after the quarter was called, I came down for my newspaper. And there was Miss Okeke, alone at this table, with that case OPEN in her hands. She jumped like a cat.&rdquo;' },

  $('#okeke').addEventListener('click', function () {

        { q: 'What did you see?', a: 'Nine green stones, and a clasp like a swan with its neck bent. I did not even take it out of the case. Then Mr Crane came round the corner, and I shut the lid so fast that I caught my finger in it.</p><p class="note">She shows you the finger. There is a small red line across it.</p><p>That was at the quarter. At beginners Mr Mossop opened the case himself. Ask him what he saw.' },
        { q: 'Do you know the whole part?', a: 'Every word. I could do the long speech in Act Two in my sleep. I have it written out on my fan, in pencil, along the folds: the understudy&rsquo;s fan, the old black one that I rehearse with by myself. I have never needed to open it.' },

  /* ---------- the table: the one thing in the wrong outline; whose hand put it there, and when ---------- */
  function makeBench() {
    var WHO = [['mossop', 'Mr Mossop'], ['greaves', 'Mrs Greaves'], ['lascelles', 'Miss Lascelles'], ['okeke', 'Miss Okeke'], ['crane', 'Mr Crane'], ['ashdown', 'Mr Ashdown']],
      WHEN = [['s1', 'Scene 1'], ['d1', '1st dark'], ['s2', 'Scene 2'], ['d2', '2nd dark'], ['s3', 'Scene 3'], ['d3', '3rd dark'], ['s4', 'Scene 4']],
      stage = ER.flag('w-stage') || 0, sel = stage ? +ER.flag('w-sel') : 0, who = '', when = '', wait = false, box = ER.el('div', 'bx tb'), M = '&rdquo; says Mr Mossop. &ldquo;',
      NOT = {
        1: '&ldquo;The hand bell. I brought that off myself, in the first dark,' + M + 'Read number 1 on my list. Where should it be by now?&rdquo;',
        2: '&ldquo;I carried that tray off with these two hands,' + M + 'Number 2. Where does the list say it should be?&rdquo;',
        3: '&ldquo;Empty: yes,' + M + 'Which way did the Maid go with the salver? Read number 3, and then read what the list says about R.&rdquo;',
        4: '&ldquo;Empty: yes,' + M + 'Read what happens to the sofa in the second dark, and what was lying on the sofa.&rdquo;',
        7: '&ldquo;Empty: yes,' + M + 'Read what happens to the desk in the second dark, and what was standing on the desk.&rdquo;',
        8: '&ldquo;Empty: yes. It is out there on the balustrade,' + M + 'I have not been allowed to change the stage. Read number 8.&rdquo;',
        11: '&ldquo;Empty: yes. It is out there on the terrace,' + M + 'I have not been allowed to change the stage. Read number 11.&rdquo;',

      };
    box.innerHTML = '<div class="tb-two"><div class="tb-left"><div class="tb-frame"><svg viewBox="0 0 780 520">' + tableSVG(true) + '</svg></div>' +
      '<div class="bx-foot"><p class="pmsg"></p><div class="tb-pick"><h6>Whose hand?</h6><div class="tb-row who">' + WHO.map(function (w) { return '<button type="button" data-w="' + w[0] + '">' + w[1] + '</button>'; }).join('') + '</div>' +
      '<h6>When?</h6><div class="tb-row when">' + WHEN.map(function (w) { return '<button type="button" data-t="' + w[0] + '">' + w[1] + '</button>'; }).join('') + '</div></div>' +
      '<button type="button" class="btn" id="w-go"></button></div></div><div class="doc plist">' + ER.gloss(US.DOC.plist) + '</div></div>';
    var msgEl = box.querySelector('.pmsg'), go = box.querySelector('#w-go'), left = box.querySelector('.tb-left'), spots = ER.$$('.spot', box);

    function draw() {
      left.classList.toggle('two', stage === 1);
      spots.forEach(function (r) { r.setAttribute('class', 'spot' + (+r.getAttribute('data-n') === sel ? ' sel' : '')); });
      ER.$$('.tb-row.who button', box).forEach(function (b) { b.classList.toggle('sel', b.getAttribute('data-w') === who); });
      ER.$$('.tb-row.when button', box).forEach(function (b) { b.classList.toggle('sel', b.getAttribute('data-t') === when); });
      go.textContent = stage ? 'That hand, at that time' : 'This is in the wrong place';
    }
    box.addEventListener('click', function (e) {
      var r = e.target.closest ? e.target.closest('.spot') : null, b = e.target.closest ? e.target.closest('.tb-row button') : null;
      if (wait || (e.target.closest && e.target.closest('.w'))) return;
      if (r && stage === 0) { sel = +r.getAttribute('data-n'); ER.sfx.click(); draw(); }
      else if (b && stage === 1) { if (b.hasAttribute('data-w')) who = b.getAttribute('data-w'); else when = b.getAttribute('data-t'); ER.sfx.click(); draw(); }
    });
    go.addEventListener('click', function () {
      var file, wn;
      if (wait || nextFile) return;
      if (!stage) {
        if (!sel) { msg('Click on one of the fifteen outlines first: on the thing that is lying in it, or on the empty shape.'); return; }
        if (ER.check('gap', sel)) { ER.sfx.no(); msg('&ldquo;Number ' + sel + ' is empty, and it should not be. Good: you can read a list,' + M + 'But I asked for the THING that is in the wrong place. If it is not in ' + sel + ', where is it?&rdquo;'); return; }
        if (!ER.check('thing', sel)) { ER.sfx.no(); msg(NOT[sel] || '&ldquo;That is for Act Two,' + M + 'It has not left its outline since the half. Look again.&rdquo;'); return; }
        stage = 1; ER.flag('w-stage', 1); ER.flag('w-sel', sel); US.sfx.thud(); draw(); paint();

        return;
      }
      if (!who || !when) { msg('Two questions, two answers: choose a name, and choose a time.'); return; }
      if (!ER.check('when', when)) {
        ER.sfx.no();
        msg(/^(s1|d1|s2)$/.test(when) ? '&ldquo;All through Scene 2 that fan was on the stage, in Madam&rsquo;s hand, in front of the whole house,' + M + 'Read number 5 again.&rdquo;' :
          '&ldquo;I told you when I saw it,' + M + 'When the lights came UP on Scene 3: it was the first thing I saw. So it was lying there before Scene 3 began.&rdquo;');

        '<p>It was on the stage until the end of Scene 2. Mr Mossop saw it in the wrong place when the lights came up on Scene 3. So it was put down in the second dark, and only Miss Lascelles had it.</p>' +
        '<p>But she never puts her fan down. She gives it to Mrs Greaves at the chair.</p><p>The copy of the necklace has been in dressing room 1 since Tuesday.</p>', true);
      msg('&ldquo;Madam herself. She came off with it in her hand, as she always does. And when the lights came up it was lying in the wrong place, where she had felt for an empty shape in the dark,' + M + 'But she never puts that fan down. She carries it four steps to her chair and gives it to Mrs Greaves. Every rehearsal.&rdquo;');
      setTimeout(function () {
        ER.closeAll(); paint(); busy = true;
        ER.narrate([
          'Mr Mossop looks at outline ' + sel + ', and then at outline 9, which is the next one along. The fan is lying a hand&rsquo;s width from the necklace case. &ldquo;Now why,&rdquo; he says slowly, &ldquo;would a woman with a quick change to make stop at my table and put down her fan?&rdquo;',
          '&ldquo;I am not saying anything.&rdquo; He says it twice. &ldquo;Go up and ask Mrs Greaves. She had Madam in her hands for the whole of that quick change, and Mrs Greaves holds a watch on everything. The stairs are on the far side. You can walk across now: the curtain is down. And do not whistle on the stairs.&rdquo;',
          'On your way you pass the quick-change chair: a kitchen chair, a mirror the size of a book, and a rail with one dress on it. Grey silk. It has hung there since two minutes to eight.'
        ], function () { busy = false; showGo(); });
      }, 4400);
    });
    draw();
    msg(stage ? 'A fan, lying in the wrong outline. Whose hand put it there, and when?' :
      'The table, exactly as it was when the curtain came down, and Mr Mossop&rsquo;s list of where each thing ought to be. One thing is in the wrong outline. Click on it, and tell him.');
    return {
      open: function () { ER.open('ov-lock', box); if (tell('plist')) { US.file('plist'); US.words(['salver', 'decanter', 'paper knife', 'parasol', 'opera glasses']); } },
      isOpen: function () { return !!box.parentNode; },
      stage: function () { return stage; }
    };
  }
})();
